<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="450" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">样例 1 演算：s = 10001000 ⇒ 输出 13 5</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两段交替结构贡献增益 2 + 3；剩余 3 个 0 可任意分组，共 Bell(3) = 5 种</text>

  <g filter="url(#rough2)" font-size="10" fill="#666" text-anchor="middle">
    <circle cx="150" cy="64" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="150" y="68" fill="#3a5a30">✓</text>
    <circle cx="200" cy="64" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="200" y="68" fill="#8a3a36">✗</text>
    <circle cx="250" cy="64" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="250" y="68" fill="#8a3a36">✗</text>
    <circle cx="300" cy="64" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="300" y="68" fill="#3a5a30">✓</text>
    <circle cx="350" cy="64" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="350" y="68" fill="#3a5a30">✓</text>
    <circle cx="400" cy="64" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="400" y="68" fill="#8a3a36">✗</text>
    <circle cx="450" cy="64" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="450" y="68" fill="#8a3a36">✗</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="102" y="76" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="152" y="76" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="202" y="76" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <rect x="252" y="76" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="302" y="76" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="352" y="76" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="402" y="76" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <rect x="452" y="76" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="125" y="99" text-anchor="middle" font-size="14" fill="#2f4f6f">1</text>
    <text x="175" y="99" text-anchor="middle" font-size="14" fill="#2f4f6f">0</text>
    <text x="225" y="99" text-anchor="middle" font-size="14" fill="#8a6a20">0</text>
    <text x="275" y="99" text-anchor="middle" font-size="14" fill="#2f4f6f">0</text>
    <text x="325" y="99" text-anchor="middle" font-size="14" fill="#2f4f6f">1</text>
    <text x="375" y="99" text-anchor="middle" font-size="14" fill="#2f4f6f">0</text>
    <text x="425" y="99" text-anchor="middle" font-size="14" fill="#8a6a20">0</text>
    <text x="475" y="99" text-anchor="middle" font-size="14" fill="#8a6a20">0</text>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#888" text-anchor="middle">
    <text x="125" y="124">1</text>
    <text x="175" y="124">2</text>
    <text x="225" y="124">3</text>
    <text x="275" y="124">4</text>
    <text x="325" y="124">5</text>
    <text x="375" y="124">6</text>
    <text x="425" y="124">7</text>
    <text x="475" y="124">8</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 104 134 L 104 144 L 196 144 L 196 134" stroke="#446688" stroke-width="1.5" fill="none"/>
    <text x="150" y="158" text-anchor="middle" font-size="10" fill="#2f4f6f">k = 1 ⇒ 增益 2</text>
    <path d="M 254 134 L 254 144 L 396 144 L 396 134" stroke="#4a7a3a" stroke-width="1.5" fill="none"/>
    <text x="325" y="158" text-anchor="middle" font-size="10" fill="#3a5a30">k = 2 ⇒ 增益 3</text>
    <text x="225" y="172" text-anchor="middle" font-size="9.5" fill="#8a6a20">剩余 0</text>
    <text x="450" y="172" text-anchor="middle" font-size="9.5" fill="#8a6a20">剩余 0 0</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="100" y="184" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="250" y="184" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="340" y="184" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="440" y="184" width="134" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="175" y="201" text-anchor="middle" font-size="10" fill="#2f4f6f">交替段（位置）</text>
    <text x="295" y="201" text-anchor="middle" font-size="10" fill="#2f4f6f">边界数 k</text>
    <text x="390" y="201" text-anchor="middle" font-size="10" fill="#2f4f6f">增益 k + 1</text>
    <text x="507" y="201" text-anchor="middle" font-size="10" fill="#2f4f6f">方案数 c[k+1]</text>
    <rect x="100" y="210" width="150" height="26" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="4"/>
    <rect x="250" y="210" width="90" height="26" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="4"/>
    <rect x="340" y="210" width="100" height="26" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="4"/>
    <rect x="440" y="210" width="134" height="26" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="4"/>
    <text x="175" y="227" text-anchor="middle" font-size="10" fill="#444">[1, 2]</text>
    <text x="295" y="227" text-anchor="middle" font-size="10" fill="#444">1</text>
    <text x="390" y="227" text-anchor="middle" font-size="10" fill="#444">2</text>
    <text x="507" y="227" text-anchor="middle" font-size="10" fill="#444">c[2]=1</text>
    <rect x="100" y="236" width="150" height="26" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="4"/>
    <rect x="250" y="236" width="90" height="26" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="4"/>
    <rect x="340" y="236" width="100" height="26" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="4"/>
    <rect x="440" y="236" width="134" height="26" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="4"/>
    <text x="175" y="253" text-anchor="middle" font-size="10" fill="#444">[4, 6]</text>
    <text x="295" y="253" text-anchor="middle" font-size="10" fill="#444">2</text>
    <text x="390" y="253" text-anchor="middle" font-size="10" fill="#444">3</text>
    <text x="507" y="253" text-anchor="middle" font-size="10" fill="#444">c[3]=1</text>
    <rect x="100" y="262" width="150" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="250" y="262" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="340" y="262" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="440" y="262" width="134" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="175" y="279" text-anchor="middle" font-size="10" fill="#3a5a30">合计</text>
    <text x="295" y="279" text-anchor="middle" font-size="10" fill="#3a5a30">3</text>
    <text x="390" y="279" text-anchor="middle" font-size="10" fill="#3a5a30">5</text>
    <text x="507" y="279" text-anchor="middle" font-size="10" fill="#3a5a30">1 · 1 = 1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="300" width="552" height="128" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="40" y="322" font-size="11.5" fill="#8a3a36" font-weight="bold">成本：8 + 5 = 13　　方案数：c[2] · c[3] · Bell(3) = 1 · 1 · 5 = 5</text>
    <text x="40" y="342" font-size="10.5" fill="#7a4a46">剩余位置 {3, 7, 8} 全是 0，它们怎么分组都合法、也不改变成本，共 Bell(3) = 5 种：</text>
    <text x="40" y="362" font-size="10.5" fill="#7a4a46">{3,7,8}　{3,7}{8}　{3,8}{7}　{3}{7,8}　{3}{7}{8}</text>
    <text x="40" y="384" font-size="10.5" fill="#7a4a46">若把两个 0 合并成 {3,7}、另一个单独 {8}，成本仍是 2 + 1 = 3（纯色集合只按个数算钱）</text>
    <text x="40" y="404" font-size="10.5" fill="#7a4a46">所以答案与官方的 13 5 一致；样例 2（000111）对应 c[2] · Bell(2) · Bell(2) = 1 · 2 · 2 = 4。</text>
    <text x="40" y="422" font-size="10.5" fill="#7a4a46">样例 3（01010101）：整串一段 k = 7 ⇒ 增益 8、成本 16；c[8] = 4（2+2+2+2 与 2+3+3 的 3 种排列）。</text>
  </g>
</svg>
