<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">骨牌 + 挂在它上面的单格：最多 5 格</text>
  <path d="M 152 39 Q 380 45 608 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40" y="58" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">以一块横放骨牌 (i,j)-(i,j+1) 为例，它的邻居有 6 个位置：</text>
  <rect x="120" y="84" width="34" height="34" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="120" y="118" width="34" height="34" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="120" y="152" width="34" height="34" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="154" y="84" width="34" height="34" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="154" y="118" width="34" height="34" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="154" y="152" width="34" height="34" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="188" y="84" width="34" height="34" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="188" y="118" width="34" height="34" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="188" y="152" width="34" height="34" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="222" y="84" width="34" height="34" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="222" y="118" width="34" height="34" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="222" y="152" width="34" height="34" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="205.0" y="140.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">骨牌</text>
  <text x="114" y="106.0" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">左</text>
  <text x="269.0" y="140.0" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">右</text>
  <text x="205.0" y="78" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">上（两格）</text>
  <text x="205.0" y="202" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">下（两格）</text>
  <rect x="40" y="212" width="680" height="88" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="236" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 左邻 (i, j−1) 不可能是“剩下的单格”：</text>
  <text x="56" y="258" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">因为①扫到 (i,j−1) 时 (i,j) 还没被配走，它俩会在①里直接成对。</text>
  <text x="56" y="280" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">② 上、下各自只有一格可能成为单格（同一侧的两个邻居彼此相邻，不可能同时是单格）。</text>
  <rect x="40" y="308" width="680" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="332" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">所以最多 0（左）+ 1（上）+ 1（下）+ 1（右）= 3 个单格挂上来，</text>
  <text x="56" y="356" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">图形大小 ≤ 2 + 3 = 5，落在题面允许的 2..5 之间。</text>
</svg>
