<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="300" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n 为奇数时无解</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">两两配对需要偶数个点</text>
  <g filter="url(#rough2)"><circle cx="280" cy="120" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="350" cy="120" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="350" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="420" cy="120" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="420" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="490" cy="120" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="490" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><circle cx="560" cy="120" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="560" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="350" y="180" text-anchor="middle" font-size="12" fill="#8a4b2a" filter="url(#rough2)">5 个点两两配对后必剩 1 个 ⇒ 只能不动</text>
  <text x="350" y="210" text-anchor="middle" font-size="12" fill="#8a4b2a" filter="url(#rough2)">⇒ 无法满足 p_i ≠ i</text>
  <g filter="url(#rough2)"><rect x="250" y="236" width="340" height="40" rx="4" fill="#fdf6f4" fill-opacity="0.85" stroke="#d8a89a" stroke-width="1.3"/></g>
  <text x="420" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">n 奇数 ⇒ 输出 -1</text>
</svg>
