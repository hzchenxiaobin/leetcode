<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">互吐的条件：x_i + d_i = x_j 且 x_j + d_j = x_i</text>
  <path d="M 130 42 Q 360 48 590 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <line x1="40" y1="240" x2="690" y2="240" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 互吐的一对 -->
  <path d="M 125 205 Q 210 150 295 205" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 295 220 Q 210 275 125 220" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="210" y="158" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">+180</text>
  <text x="210" y="292" text-anchor="middle" font-size="11" fill="#a33a36" filter="url(#rough2)">−180</text>

  <g filter="url(#rough2)">
    <circle cx="120" cy="240" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="300" cy="240" r="10" fill="#fde8e8" stroke="#b85450" stroke-width="2"/>
    <circle cx="480" cy="240" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="610" cy="240" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="120" y="266">x=0</text><text x="300" y="266">x=180</text>
    <text x="480" y="266">x=400</text><text x="610" y="266">x=520</text>
  </g>
  <text x="120" y="288" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">d=+180</text>
  <text x="300" y="288" text-anchor="middle" font-size="10.5" fill="#a33a36" filter="url(#rough2)">d=−180</text>

  <path d="M 489 240 L 601 240" stroke="#888" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="545" y="232" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">目标处没有骆驼 → 不成立</text>

  <rect x="40" y="312" width="640" height="66" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="338">只需让每只骆驼算一次落点 x_i + d_i：若落点处恰有骆驼 j，且 j 的落点又正好是 x_i，就找到一对。</text>
    <text x="56" y="364">位置互不相同，所以每只骆驼的落点最多对应一只骆驼；n ≤ 100 时直接 O(n²) 枚举也能过。</text>
  </g>
</svg>
