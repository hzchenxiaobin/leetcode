<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="500" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：两遍换根 DP + 一遍判定</text>
  <path d="M 150 42 Q 390 49 630 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="30" y="58" width="420" height="66" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="44" y="84" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 迭代 BFS（以 0 为根）</text>
  <text x="44" y="108" font-size="11.5" fill="#333" filter="url(#rough2)">得到 par[v] 与 order[]，父一定排在子前面</text>

  <path d="M 240 124 L 240 146" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="30" y="146" width="420" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="44" y="172" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">② 自底向上（逆 order）</text>
  <text x="44" y="196" font-size="11.5" fill="#333" filter="url(#rough2)">down[v] = 1 ⟺ deg(v) − 1 为奇 且 cold[v] = 0</text>
  <text x="44" y="220" font-size="11.5" fill="#666" filter="url(#rough2)">cold[v] = 孩子中 down 值为 1 的个数</text>

  <path d="M 240 238 L 240 260" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="30" y="260" width="420" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="44" y="286" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">③ 自顶向下（正 order）</text>
  <text x="44" y="310" font-size="11.5" fill="#333" filter="url(#rough2)">tot[v] = cold[v] + up[v] = 邻居中「冷」的个数</text>
  <text x="44" y="334" font-size="11.5" fill="#333" filter="url(#rough2)">up[v] = 1 ⟺ deg(par) − 1 为奇 且 tot[par] = down[v]</text>

  <path d="M 240 352 L 240 374" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="30" y="374" width="420" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="44" y="400" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">④ 判定：tot[r] = 0 且 deg(r) 为偶</text>
  <text x="44" y="424" font-size="11.5" fill="#a14340" filter="url(#rough2)">⟺ r 是 Bob 可以选来保证获胜的初始根</text>

  <!-- 右侧 2x2 表 -->
  <rect x="466" y="54" width="294" height="232" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="613" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">单点胜负只由 (m, k) 决定</text>

  <path d="M 490 92 L 748 92" stroke="#8a6015" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 490 122 L 748 122" stroke="#8a6015" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 490 196 L 748 196" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 490 270 L 748 270" stroke="#8a6015" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 556 92 L 556 270" stroke="#8a6015" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 652 92 L 652 270" stroke="#8a6015" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="604" y="112" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">k = 0</text>
  <text x="700" y="112" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">k ≥ 1</text>
  <text x="523" y="154" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">m 偶</text>
  <text x="523" y="228" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">m 奇</text>

  <text x="604" y="150" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">A = L</text>
  <text x="604" y="172" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">B = W</text>
  <text x="700" y="150" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">A = W</text>
  <text x="700" y="172" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">B = W</text>
  <text x="604" y="224" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">A = W</text>
  <text x="604" y="246" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">B = L</text>
  <text x="700" y="224" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">A = W</text>
  <text x="700" y="246" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">B = W</text>

  <text x="476" y="314" font-size="11.5" fill="#8a6015" filter="url(#rough2)">m = 前向孩子个数</text>
  <text x="476" y="338" font-size="11.5" fill="#8a6015" filter="url(#rough2)">k = 其中 B 值为 L 的「冷」孩子数</text>
  <text x="476" y="362" font-size="11.5" fill="#b85450" filter="url(#rough2)">A 无袋 / B 带袋；红 = 轮到的人输</text>

  <rect x="30" y="452" width="718" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="389" y="477" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">k ≥ 1 时先手直接进入冷子树取胜；k = 0 时只能删子树，m 的奇偶决定谁输。</text>
</svg>
