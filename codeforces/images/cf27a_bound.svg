<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="181"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1..n+1 一共 n+1 个格子，最多 n 个被占</text>
  <path d="M 140 40 Q 400 46 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="90" width="56" height="46" rx="8" fill="#d9ecd4" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="98" y="120" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="98" y="152" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">已有</text>
  <rect x="140" y="90" width="56" height="46" rx="8" fill="#d9ecd4" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="120" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="168" y="152" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">已有</text>
  <rect x="210" y="90" width="56" height="46" rx="8" fill="#fdeeee" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238" y="120" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="238" y="152" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">空缺</text>
  <rect x="280" y="90" width="56" height="46" rx="8" fill="#d9ecd4" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="120" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="308" y="152" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">已有</text>
  <rect x="350" y="90" width="56" height="46" rx="8" fill="#d9ecd4" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="378" y="120" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="378" y="152" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">已有</text>
  <rect x="420" y="90" width="56" height="46" rx="8" fill="#d9ecd4" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="120" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="448" y="152" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">已有</text>
  <text x="70" y="210" font-size="12" fill="#2b2b2b" filter="url(#rough2)">n = 5 时答案一定 ≤ 6；图示缺 3，所以答案是 3。</text>
  <text x="70" y="240" font-size="12" fill="#2b2b2b" filter="url(#rough2)">反证：若 1..n+1 全出现，就需要 n+1 个互不相同的输入数，与只有 n 个矛盾。</text>
  <text x="70" y="286" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">所以数组开到 n+2 就够，扫描一定在 n+1 处停下。</text>

</svg>
