<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="733"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">被捡 ⟺ 初始相位 δ 落在圆弧 [a_i − W, a_i] 内</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">概率 = 覆盖长度 / 2l</text>
  <g filter="url(#rough2)"><rect x="80" y="110" width="740" height="40" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="80" y="100" text-anchor="start" font-size="10" fill="#666666" filter="url(#rough2)">0</text>
  <text x="820" y="100" text-anchor="end" font-size="10" fill="#666666" filter="url(#rough2)">2l</text>
  <g filter="url(#rough2)"><rect x="120" y="118" width="200" height="24" rx="3" fill="#446688" fill-opacity="0.5" stroke="#446688" stroke-width="1.4"/></g>
  <text x="220.0" y="136" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">I₁</text>
  <g filter="url(#rough2)"><rect x="420" y="118" width="200" height="24" rx="3" fill="#4a7a3a" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="520.0" y="136" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">I₂</text>
  <text x="450" y="190" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">各段长度 → 覆盖数 → 概率</text>
  <text x="450" y="224" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">W = l·v₂ / (v₁ + v₂)</text>
  <text x="450" y="258" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">跨 0 点的区间要拆成两段</text>
</svg>
