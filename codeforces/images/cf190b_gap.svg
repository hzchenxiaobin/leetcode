<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">190B：雷达要同时“够到”两个圆环 —— 答案是两个圆之间空隙的一半</text>
  <path d="M 99.66000000000014 46 Q 390.0 52 680.3399999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="120.0" cy="110.0" r="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="260.0" cy="110.0" r="30.0" fill="#fdf0ef" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 150.0 110.0 L 230.0 110.0" stroke="#5b8c5a" stroke-width="2.0" fill="none" filter="url(#rough2)"/>
  <text x="190.0" y="96.0" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">gap</text>
  <text x="190.0" y="165.0" text-anchor="middle" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">相离：d − r₁ − r₂</text>
  <circle cx="430.0" cy="110.0" r="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="470.0" cy="110.0" r="30.0" fill="#fdf0ef" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="450.0" y="165.0" text-anchor="middle" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">相交：gap = 0 ⇒ 答案 0</text>
  <circle cx="450.0" cy="110.0" r="4.0" fill="#d6a040" stroke="#d6a040" stroke-width="1.0" filter="url(#rough2)"/>
  <circle cx="660.0" cy="110.0" r="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="650.0" cy="110.0" r="18.0" fill="#fdf0ef" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 668.0 110.0 L 704.0 110.0" stroke="#5b8c5a" stroke-width="2.0" fill="none" filter="url(#rough2)"/>
  <text x="690.0" y="96.0" text-anchor="middle" font-size="10.6" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">gap</text>
  <text x="660.0" y="178.0" text-anchor="middle" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">内含：|r₁ − r₂| − d</text>
  <rect x="60.0" y="210.0" width="660.0" height="66.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="234.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">对任意点 q，dist(q,C₁) + dist(q,C₂) ≥ gap（三角不等式，分“在圆外/圆内”讨论），</text>
  <text x="74.0" y="256.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">而在两圆最近点的连线中点处取等号 ⇒ 最小最大距离 = gap/2。</text>
  <rect x="60.0" y="292.0" width="660.0" height="56.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="316.0" text-anchor="start" font-size="11.2" fill="#2f5b34" filter="url(#rough2)">统一写法：gap = max(0, d − r₁ − r₂, |r₁ − r₂| − d)，输出 gap/2。</text>
  <text x="74.0" y="338.0" text-anchor="start" font-size="11.1" fill="#2f5b34" filter="url(#rough2)">样例 1：d=6, r=1,3 ⇒ gap=2 ⇒ 1；样例 2：d=√800≈28.284, gap≈22.284 ⇒ 11.142…</text>
</svg>
