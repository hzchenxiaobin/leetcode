<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="241"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="360" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C：三个样例走查</text>
  <path d="M 220 42 Q 380 47 540 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="62" width="688" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="86" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">样例 1：3 10 / 20 30 / 1 3</text>
  <text x="48" y="110" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">排序后 [1,3]、[3,10]、[20,30]：3 ≤ 3（端点重合不算重叠）、10 ≤ 20 → 本来就不重叠</text>
  <text x="48" y="132" font-size="10.5" fill="#2f5223" filter="url(#rough2)">⇒ 取消任意一个都行：输出 3 个方案 “1 2 3”</text>

  <rect x="36" y="158" width="688" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="182" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">样例 2：3 10 / 20 30 / 1 3 / 1 39</text>
  <text x="48" y="206" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">排序：[1,3]、[1,39]、[3,10]、[20,30]；扫到 [1,39] 时 1 &lt; 3 → 冲突对是 3 号与 4 号（[1,3] 与 [1,39]）</text>
  <text x="48" y="228" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">候选 {3, 4}：删 3 → 剩 [1,39] 与 [3,10] 仍冲突 ✗；删 4 → [1,3]、[3,10]、[20,30] 全不重叠 ✓</text>
  <text x="48" y="250" font-size="10.5" fill="#8a6015" filter="url(#rough2)">⇒ 只有 1 个方案：“4”</text>

  <rect x="36" y="272" width="688" height="72" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="296" font-size="11.5" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">样例 3：1 5 / 2 6 / 3 7</text>
  <text x="48" y="320" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">冲突对（1,2）；删 1 → [2,6] 与 [3,7] 冲突 ✗；删 2 → [1,5] 与 [3,7] 冲突 ✗</text>
  <text x="48" y="340" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">⇒ 无解，输出 “0”（第二行不输出）</text>
</svg>
