<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="390" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">队长 = 本队里名次最好的人</text>
  <text x="380.0" y="60.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">按名次从好到差依次取人：每步「还没进队的人里最好的」就是新队长</text>
  <rect x="50.0" y="80.0" width="400.0" height="60.0" rx="8" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66.0" y="116.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">队伍 1</text>
  <text x="150.0" y="116.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">5(1)</text>
  <text x="246.0" y="116.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">6(5)</text>
  <text x="342.0" y="116.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2(4)</text>
  <text x="470.0" y="116.0" text-anchor="start" font-size="12.5" fill="#c9801f" font-weight="bold" filter="url(#rough2)">⇒ 队长 5</text>
  <rect x="50.0" y="154.0" width="400.0" height="60.0" rx="8" fill="#fbfbfb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66.0" y="190.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">队伍 2</text>
  <text x="150.0" y="190.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">9(9)</text>
  <text x="246.0" y="190.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3(6)</text>
  <text x="342.0" y="190.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">4(2)</text>
  <text x="470.0" y="190.0" text-anchor="start" font-size="12.5" fill="#c9801f" font-weight="bold" filter="url(#rough2)">⇒ 队长 4</text>
  <rect x="50.0" y="228.0" width="400.0" height="60.0" rx="8" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66.0" y="264.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">队伍 3</text>
  <text x="150.0" y="264.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1(3)</text>
  <text x="246.0" y="264.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">7(7)</text>
  <text x="342.0" y="264.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">8(8)</text>
  <text x="470.0" y="264.0" text-anchor="start" font-size="12.5" fill="#c9801f" font-weight="bold" filter="url(#rough2)">⇒ 队长 1</text>
  <rect x="50.0" y="306.0" width="660.0" height="62.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="64.0" y="330.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">括号里是名次（越小越好）。队长一定是本队名次最好的人：</text>
  <text x="64.0" y="352.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">因为他被选时全队都还在场，若队里还有更好的人，队长就该是他了。</text>
</svg>
