<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">指针模型：pos 指向当前石头</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每读一个指令，若 s[pos]==c 则 pos++</text>
  <g filter="url(#rough2)"><rect x="140" y="110" width="70" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="175.0" y="138.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">R</text>
  <g filter="url(#rough2)"><rect x="230" y="110" width="70" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="265.0" y="138.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">G</text>
  <g filter="url(#rough2)"><rect x="320" y="110" width="70" height="46" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="355.0" y="138.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <text x="360" y="140" text-anchor="start" font-size="12" fill="#b05a5a" filter="url(#rough2)">pos →</text>
  <text x="440" y="210" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">时间 O(|t|)，额外空间 O(1)</text>
  <text x="440" y="248" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">题面保证 Liss 不会走出序列</text>
</svg>
