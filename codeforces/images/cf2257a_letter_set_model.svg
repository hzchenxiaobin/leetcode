<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：缩写只能「消费」字母，不能「生产」字母</text>
  <path d="M 170 42 Q 360 49 550 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左：普通词 -->
  <rect x="20" y="60" width="330" height="196" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">普通词（小写）→ 只贡献首字母</text>

  <rect x="40" y="96" width="104" height="30" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="92" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">apple</text>
  <path d="M 150 111 L 246 111" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="252" y="96" width="36" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">A</text>
  <text x="304" y="117" font-size="10.5" fill="#4a6a86" filter="url(#rough2)">首字母</text>

  <rect x="40" y="140" width="104" height="30" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="92" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">banana</text>
  <path d="M 150 155 L 246 155" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="252" y="140" width="36" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="161" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">B</text>

  <rect x="40" y="184" width="104" height="30" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="92" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cherry</text>
  <path d="M 150 199 L 246 199" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="252" y="184" width="36" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">C</text>

  <text x="185" y="240" text-anchor="middle" font-size="11.5" fill="#33506e" filter="url(#rough2)">词身再长也没用：apple 与 acorn 都只给 A</text>

  <!-- 右：缩写 -->
  <rect x="380" y="60" width="320" height="196" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="540" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">缩写（大写）→ 首字母 = 它自己的第一个字符</text>

  <rect x="400" y="98" width="88" height="30" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="444" y="119" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">AG</text>
  <path d="M 494 113 L 586 113" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="592" y="98" width="36" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="610" y="119" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">A</text>

  <text x="540" y="154" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">但 AG 想被造出来，本来就要 A、G 都在 L 里</text>
  <text x="540" y="178" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">于是 A 早已在 L 中 ⇔ 这一步等于什么都没加</text>
  <text x="540" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">⟹ 字母集合 L 永远变不大！</text>
  <text x="540" y="234" text-anchor="middle" font-size="10.5" fill="#6a6a6a" filter="url(#rough2)">G 只是被消费的原料，创建后也不留在集合里</text>

  <!-- 底部结论 -->
  <rect x="20" y="276" width="680" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">不变式：可用字母集合 L 从头到尾都等于初始 L0（全部词的首字母）</text>
  <text x="360" y="328" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">既然可用字母恒定，创建顺序就完全无关紧要</text>
  <text x="360" y="354" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">判定变成纯查表：每个缩写的每个字母都在 L0 中 ⇒ YES</text>
  <text x="360" y="378" text-anchor="middle" font-size="11" fill="#a07a2a" filter="url(#rough2)">一次遍历 O(总长)，无需模拟、无需排序、无需依赖图</text>
</svg>
