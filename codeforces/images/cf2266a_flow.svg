<svg xmlns="http://www.w3.org/2000/svg" width="740" height="440" viewBox="0 0 740 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="740" height="440" fill="#fafafa"/>

  <text x="370" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：每组一次取最小值、一次减法</text>
  <path d="M 196 42 Q 370 49 544 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 步骤 1 -->
  <rect x="250" y="60" width="240" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="370" y="82" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">读入 n, a₁, a₂, a₃</text>
  <text x="370" y="100" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">全按整数读，不必按行，也不排序</text>

  <path d="M 370 112 L 370 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="250" y="148" width="240" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="170" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">m ← min(a₁, a₂, a₃)</text>
  <text x="370" y="188" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">并列最小也随便取一个，结论不变</text>

  <path d="M 370 200 L 370 234" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="250" y="236" width="240" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="258" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">ans ← n − m</text>
  <text x="370" y="276" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">aᵢ ≤ n 保证 ans ≥ 0，无需特判</text>

  <path d="M 370 288 L 370 322" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 4 -->
  <rect x="272" y="324" width="196" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 ans 并换行</text>

  <!-- 右侧注释：只依赖最小值 -->
  <rect x="516" y="60" width="204" height="150" rx="9" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="618" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案只跟最小值有关</text>
  <text x="530" y="108" font-size="11" fill="#2f4a66" filter="url(#rough2)">与 a₁ + a₂ + a₃ 无关；</text>
  <text x="530" y="128" font-size="11" fill="#2f4a66" filter="url(#rough2)">与三题谁易谁难无关；</text>
  <text x="530" y="148" font-size="11" fill="#2f4a66" filter="url(#rough2)">与选手的具体分配无关。</text>
  <text x="530" y="174" font-size="11" fill="#8a6015" filter="url(#rough2)">最短板一卡，其余自动满足。</text>
  <text x="530" y="194" font-size="11" fill="#8a6015" filter="url(#rough2)">（因为 aᵢ − m ≤ n − m）</text>

  <!-- 左侧注释：为什么不是别的写法 -->
  <rect x="20" y="60" width="204" height="150" rx="9" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="122" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">常见错误写法</text>
  <text x="34" y="108" font-size="11" fill="#a14340" filter="url(#rough2)">✗ n − a₁（只看第一题）</text>
  <text x="34" y="128" font-size="11" fill="#a14340" filter="url(#rough2)">✗ max(aᵢ) 当满分人数</text>
  <text x="34" y="148" font-size="11" fill="#a14340" filter="url(#rough2)">✗ 3n − Σaᵢ（把弱当成</text>
  <text x="34" y="166" font-size="11" fill="#a14340" filter="url(#rough2)">　　缺考总次数）</text>
  <text x="34" y="192" font-size="11" fill="#3c5e2e" filter="url(#rough2)">✓ 只取 min，再 n 减</text>

  <!-- 底部提示条 -->
  <rect x="20" y="384" width="700" height="42" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="370" y="403" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">每组 O(1)，总复杂度 O(t)；t ≤ 3000 时运算量不到一万次，瓶颈在输入输出。</text>
  <text x="370" y="420" text-anchor="middle" font-size="11" fill="#a3762a" filter="url(#rough2)">C++ 用 min(&#123;a₁, a₂, a₃&#125;) 或 min(a₁, min(a₂, a₃))，两种写法等价。</text>
</svg>
