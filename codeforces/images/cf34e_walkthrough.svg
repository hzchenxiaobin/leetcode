<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="379"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">E：样例 1 的完整演算（n=2, t=9）</text>
  <path d="M 200 40 Q 380 45 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="46" y="68" font-size="11" fill="#2b2b2b" filter="url(#rough2)">球 1：x=3, v=4, m=5　　球 2：x=0, v=7, m=8　　（按位置排序后 2 在左）</text>

  <rect x="40" y="82" width="330" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="106" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 下一次碰撞</text>
  <text x="52" y="130" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">7 &gt; 4，追及时间 dt = (3 − 0)/(7 − 4) = 1</text>
  <text x="52" y="152" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">t=1 时两球都在 x = 0 + 7×1 = 7</text>

  <rect x="392" y="82" width="328" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="106" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">② 碰后速度</text>
  <text x="404" y="130" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">u1=7, u2=4, m1=8, m2=5（左球是 2 号）</text>
  <text x="404" y="152" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">v1 = (−3·7 + 2·5·4)/13 = 100/13 ≈ 7.692</text>
  <text x="404" y="170" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">v2 = (3·4 + 2·8·7)/13 = 61/13 ≈ 4.692</text>

  <rect x="40" y="186" width="680" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="210" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">③ 再走 t − 1 = 8 秒</text>
  <text x="52" y="232" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">球 1：7 + (100/13)×8 = 891/13 ≈ 68.538461538　球 2：7 + (61/13)×8 = 579/13 ≈ 44.538461538</text>
  <text x="52" y="252" font-size="10.5" fill="#2f5223" filter="url(#rough2)">与样例输出 68.538461538 / 44.538461538 完全一致 ✓</text>

  <rect x="40" y="268" width="680" height="46" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="290" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">注意：输出顺序是“输入顺序”，不是位置顺序。样例里输入先给 x=3 的球，所以先输出它的坐标。</text>
  <text x="52" y="308" font-size="10" fill="#8c3a36" filter="url(#rough2)">若 t 小于首次碰撞时间，则直接 x + v·t；t=0 时输出初始坐标。</text>
</svg>
