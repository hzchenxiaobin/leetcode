  <rect x="104" y="296" width="44" height="44" fill="#f6e3a8" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="192" y="296" width="44" height="44" fill="#f6e3a8" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
