  <rect x="148" y="296" width="44" height="44" fill="#c9d8ee" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="60" y="164" width="44" height="44" fill="#f3c9d3" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="236" y="252" width="44" height="44" fill="#f3c9d3" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
