  <rect x="60" y="252" width="44" height="44" fill="#f3c9d3" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="104" y="252" width="44" height="44" fill="#e0d3ee" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
