  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">奇数 n：每个格子与它的行镜像、列镜像共处一个轨道，轨道大小只能是 1、2、4。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">下图 n=5 的 9 个轨道：4 个 4 格轨道、4 个 2 格轨道（中行/中列上的配对）、1 个 1 格中心。</text>
  <text x="340" y="150" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">选一个轨道 ⇒ 同时点亮镜像，</text>
  <text x="340" y="170" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">所以锐度是若干 1/2/4 的和。</text>
  <text x="340" y="200" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">禁止“选了一半”的格子：</text>
  <text x="340" y="220" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">任何对称矩阵都是若干完整轨道之并。</text>
  <text x="340" y="250" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">n×n 网格的最大独立集是 ceil(n²/2)，</text>
  <text x="340" y="270" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">故 x ≤ (n²+1)/2。</text>
</svg>
