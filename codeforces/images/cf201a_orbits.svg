     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="700" height="380" fill="#fafafa"/>
  <text x="350.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">201A：对称 + 清晰 ⇒ 选的是完整轨道</text>
  <path d="M 140.00 46 Q 350.0 52 560.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="236" y="296" width="44" height="44" fill="#cfe3c8" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="60" y="296" width="44" height="44" fill="#cfe3c8" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
