<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="800" height="430" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：两个不同来源给出同一个位置</text>
  <path d="M 170 40 Q 400 46 630 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <path d="M 40 300 L 770 300" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="60" y1="300" x2="60" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">-6</text>
  <line x1="150" y1="300" x2="150" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">-4</text>
  <line x1="240" y1="300" x2="240" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">-2</text>
  <line x1="330" y1="300" x2="330" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">0</text>
  <line x1="420" y1="300" x2="420" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">2</text>
  <line x1="510" y1="300" x2="510" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="510" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">4</text>
  <line x1="600" y1="300" x2="600" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="600" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">6</text>
  <line x1="690" y1="300" x2="690" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="690" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">8</text>
  <rect x="240" y="230" width="180" height="70" fill="#cfe0f5" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="270" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">房子 1</text>
  <rect x="510" y="240" width="90" height="60" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="555" y="276" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">房子 2</text>
  <path d="M 195 200 L 195 295" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <circle cx="195" cy="300" r="5" fill="#c98a2b" filter="url(#rough2)"/>
  <text x="195" y="192" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">贴 1 左侧</text>
  <path d="M 465 200 L 465 295" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <circle cx="465" cy="300" r="5" fill="#c98a2b" filter="url(#rough2)"/>
  <path d="M 645 200 L 645 295" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <circle cx="645" cy="300" r="5" fill="#c98a2b" filter="url(#rough2)"/>
  <text x="645" y="192" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">贴 2 右侧</text>
  <text x="195" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">−3</text>
  <text x="645" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">7</text>
  <text x="250" y="100" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">贴房子 1 右侧：C = 0 + (4+2) = 6</text>
  <text x="560" y="100" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">贴房子 2 左侧：C = 10 − (2+2) = 6</text>
  <path d="M 300 112 C 380 150 420 170 460 214" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 600 112 C 540 150 500 170 470 214" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <circle cx="465" cy="218" r="16" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="465" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">同一个 C=6</text>
  <text x="50" y="372" font-size="12" fill="#2b2b2b" filter="url(#rough2)">四个候选（C = −6, 6, 6, 14）去重后只剩三个不同位置，答案 3——这就是必须用集合去重的原因。</text>
  <text x="50" y="398" font-size="12" fill="#8a6015" filter="url(#rough2)">C=6 对应新房子区间 [4, 8]，与房子 2 的 [8, 12] 只在 8 处相接，所以合法。</text>
</svg>
