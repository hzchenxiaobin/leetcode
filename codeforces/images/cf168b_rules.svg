<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#fafafa"/>

  <rect x="28" y="58" width="340" height="140" rx="8" fill="#eef4fd" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="48" y="84" font-size="12.5" text-anchor="start" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">增强行（第一个非空格是 #）</text>
  <rect x="44" y="96" width="306" height="34" rx="4" fill="#ffffff" stroke="#9db4cc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="56" y="119" font-size="12" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">   #   include &lt;cstdio&gt;</text>
  <text x="48" y="152" font-size="11.5" text-anchor="start" fill="#35507a" filter="url(#rough2)">空格有意义 → 原样输出</text>
  <text x="48" y="176" font-size="11.5" text-anchor="start" fill="#b85450" filter="url(#rough2)">禁止与任何行合并</text>
  <rect x="392" y="58" width="340" height="140" rx="8" fill="#f2f8ee" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="412" y="84" font-size="12.5" text-anchor="start" fill="#2f5223" font-weight="bold" filter="url(#rough2)">普通行（其余全部）</text>
  <rect x="408" y="96" width="306" height="34" rx="4" fill="#ffffff" stroke="#a8c39a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="420" y="119" font-size="12" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">int main     (   ){</text>
  <text x="412" y="152" font-size="11.5" text-anchor="start" fill="#2f5223" filter="url(#rough2)">删除所有空格 → intmain(){</text>
  <text x="412" y="176" font-size="11.5" text-anchor="start" fill="#2f5223" filter="url(#rough2)">可与相邻普通行拼接</text>
  <text x="380" y="226" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">规则 1：删空格（只对普通行）</text>
  <text x="380" y="246" font-size="12" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">规则 2：相邻两个普通行 → 拼成一行（换行符消失）</text>
  <text x="380" y="266" font-size="11.5" text-anchor="middle" fill="#7a2f2f" filter="url(#rough2)">空行也是普通行；只有被两个增强行夹住时才单独保留</text>
  <rect x="60" y="288" width="150" height="40" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="135" y="314" font-size="11.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">普通行 A</text>
  <text x="224" y="314" font-size="16" text-anchor="middle" fill="#555" filter="url(#rough2)">+</text>
  <rect x="244" y="288" width="150" height="40" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="319" y="314" font-size="11.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">普通行 B</text>
  <line x1="410" y1="308" x2="462" y2="308" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="476" y="288" width="200" height="40" rx="4" fill="#eaf5e6" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="576" y="314" font-size="11.5" text-anchor="middle" fill="#2f5223" filter="url(#rough2)">A+B（一行）</text>
  <text x="60" y="372" font-size="12" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">增强行夹在中间时，合并链必须断开：</text>
  <rect x="60" y="384" width="640" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="406" font-size="11.5" text-anchor="start" fill="#8a6015" filter="url(#rough2)">普通 … | 增强行（原样） | 普通 … ：两侧各自成段</text>
  <text x="380.0" y="36" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">先分类，再按两类规则改写</text>
  <path d="M 120 46 Q 380.0 52 640 46" fill="none" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
</svg>
