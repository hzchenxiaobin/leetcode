<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：只数「恰好一只青蛙」的列</text>
  <path d="M 190 44 Q 380 51 570 44" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="28" y="62" width="704" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="36" y="86" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">局面（上行 / 下行）</text>
  <text x="186" y="86" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">每列形态</text>
  <text x="412" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">单蛙列 c</text>
  <text x="496" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案</text>
  <text x="544" y="86" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">构造要点</text>

  <!-- 行 1 -->
  <rect x="28" y="100" width="704" height="44" rx="5" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="36" y="127" font-size="12.5" fill="#333" filter="url(#rough2)">ff / oo（样例 1）</text>
  <text x="186" y="127" font-size="12.5" fill="#333" filter="url(#rough2)">U U（两列都只有上方）</text>
  <text x="412" y="127" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="466" y="108" width="60" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="496" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <text x="544" y="127" font-size="12" fill="#3c5e2e" filter="url(#rough2)">相邻两列互换</text>

  <!-- 行 2 -->
  <rect x="28" y="144" width="704" height="44" rx="5" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="36" y="171" font-size="12.5" fill="#333" filter="url(#rough2)">fo / of（样例 2）</text>
  <text x="186" y="171" font-size="12.5" fill="#333" filter="url(#rough2)">U D（一上一下）</text>
  <text x="412" y="171" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="466" y="152" width="60" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="496" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <text x="544" y="171" font-size="12" fill="#3c5e2e" filter="url(#rough2)">互换，行号不变</text>

  <!-- 行 3 -->
  <rect x="28" y="188" width="704" height="44" rx="5" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="36" y="215" font-size="12.5" fill="#333" filter="url(#rough2)">fff / ofo（自造）</text>
  <text x="186" y="215" font-size="12.5" fill="#333" filter="url(#rough2)">U B U（中间两蛙）</text>
  <text x="412" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="466" y="196" width="60" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="496" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <text x="544" y="215" font-size="12" fill="#3c5e2e" filter="url(#rough2)">双蛙列左出一只、右出一只</text>

  <!-- 行 4 -->
  <rect x="28" y="232" width="704" height="44" rx="5" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="36" y="259" font-size="12.5" fill="#333" filter="url(#rough2)">fff / ffo（自造）</text>
  <text x="186" y="259" font-size="12.5" fill="#333" filter="url(#rough2)">B B U（仅一个单蛙列）</text>
  <text x="412" y="259" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="466" y="240" width="60" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="496" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>
  <text x="544" y="259" font-size="12" fill="#a14340" filter="url(#rough2)">拆掉某个双蛙列的一只</text>

  <!-- 行 5 -->
  <rect x="28" y="276" width="704" height="44" rx="5" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="36" y="303" font-size="12.5" fill="#333" filter="url(#rough2)">fof / ofo（样例 3）</text>
  <text x="186" y="303" font-size="12.5" fill="#333" filter="url(#rough2)">U D U（三个单蛙列）</text>
  <text x="412" y="303" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="466" y="284" width="60" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="496" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>
  <text x="544" y="303" font-size="12" fill="#a14340" filter="url(#rough2)">删 1 只后剩 2 列互换</text>

  <!-- 行 6 -->
  <rect x="28" y="320" width="704" height="44" rx="5" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="36" y="347" font-size="12.5" fill="#333" filter="url(#rough2)">f / o（样例 4）</text>
  <text x="186" y="347" font-size="12.5" fill="#333" filter="url(#rough2)">U（n = 1）</text>
  <text x="412" y="347" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="466" y="328" width="60" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="496" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>
  <text x="544" y="347" font-size="12" fill="#a14340" filter="url(#rough2)">唯一一只蛙无处可跳</text>

  <!-- 底部结论 -->
  <rect x="28" y="374" width="704" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="396" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">答案 = c mod 2：c 为偶数 ⟹ 0（按出现顺序两两配对构造）；c 为奇数 ⟹ 1（删 1 只把 c 变成偶数）</text>
  <text x="380" y="418" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">注意：判据是「单蛙列的个数」，不是青蛙总数，也不是 n 的奇偶</text>
</svg>
