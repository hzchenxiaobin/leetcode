<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">矩形视角：有公共边才算相邻，只碰一个角不算</text>

  <!-- 上邻 B -->
  <rect x="288" y="96" width="150" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"
        filter="url(#rough2)"/>
  <text x="363" y="134" text-anchor="middle" font-size="20" fill="#2f5223" filter="url(#rough2)">B</text>

  <!-- 左邻 W -->
  <rect x="208" y="158" width="80" height="100" fill="#ece4f6" stroke="#7a6aa0" stroke-width="1.4"
        filter="url(#rough2)"/>
  <text x="248" y="214" text-anchor="middle" font-size="20" fill="#5a4a80" filter="url(#rough2)">W</text>

  <!-- 斜对 G -->
  <rect x="208" y="96" width="80" height="62" fill="#f7f7f2" stroke="#8a8a8a" stroke-width="1.3"
        stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="248" y="134" text-anchor="middle" font-size="20" fill="#777" filter="url(#rough2)">G</text>

  <!-- 总统桌 R -->
  <rect x="288" y="158" width="150" height="100" fill="#dbe7fb" stroke="#446688" stroke-width="1.8"
        filter="url(#rough2)"/>
  <text x="363" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#23405c"
        filter="url(#rough2)">R</text>
  <text x="363" y="226" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">总统桌</text>

  <!-- 下邻 T -->
  <rect x="288" y="258" width="150" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"
        filter="url(#rough2)"/>
  <text x="363" y="296" text-anchor="middle" font-size="20" fill="#8a6015" filter="url(#rough2)">T</text>

  <!-- 右侧空格 -->
  <rect x="438" y="158" width="70" height="100" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"
        filter="url(#rough2)"/>
  <text x="473" y="204" text-anchor="middle" font-size="16" fill="#b0b0b0" filter="url(#rough2)">.</text>
  <text x="473" y="226" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">空</text>

  <!-- 公共边：粗红线 -->
  <line x1="288" y1="158" x2="438" y2="158" stroke="#c0392b" stroke-width="5" filter="url(#rough2)"/>
  <line x1="288" y1="258" x2="438" y2="258" stroke="#c0392b" stroke-width="5" filter="url(#rough2)"/>
  <line x1="288" y1="158" x2="288" y2="258" stroke="#c0392b" stroke-width="5" filter="url(#rough2)"/>

  <text x="447" y="152" font-size="10.5" fill="#c0392b" filter="url(#rough2)">长 150 的公共边 → 算</text>
  <text x="447" y="272" font-size="10.5" fill="#c0392b" filter="url(#rough2)">公共边 → 算</text>
  <text x="180" y="300" font-size="10.5" fill="#c0392b" filter="url(#rough2)">公共边 → 算</text>

  <!-- 角上的叉 -->
  <path d="M 279 149 L 295 165" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 295 149 L 279 165" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="72" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">G 只在 (288,158) 这个点碰 R</text>

  <!-- 图例 -->
  <rect x="30" y="340" width="700" height="72" rx="9" fill="#eef1f7" stroke="#7a8ca6"
        stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="46" y1="364" x2="96" y2="364" stroke="#c0392b" stroke-width="5" filter="url(#rough2)"/>
  <text x="106" y="369" font-size="11.5" fill="#33445c" filter="url(#rough2)">共享的正长度边：B、T、W 都算副手</text>
  <path d="M 46 396 L 58 384 M 58 396 L 46 384" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="106" y="399" font-size="11.5" fill="#8c3b37" filter="url(#rough2)">只共顶点（斜对）：G 不算；右边是空格，本来就没有桌子</text>
  <text x="420" y="369" font-size="11" fill="#555" filter="url(#rough2)">答案 = 3 位副手</text>
  <text x="420" y="392" font-size="10.5" fill="#777" filter="url(#rough2)">扫描法等价于：贴边处必有一对四邻格</text>

  <text x="380" y="330" text-anchor="middle" font-size="10.5" fill="#777"
        filter="url(#rough2)">题面保证每张桌是矩形且颜色唯一，所以"一段边的两侧"一定能取到两格</text>
</svg>
