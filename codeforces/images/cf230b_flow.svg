<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="360" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定：完全平方 + 平方根为素数</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">x ≤ 10¹² ⇒ 只需筛到 10⁶</text>
  <g filter="url(#rough2)"><rect x="120" y="100" width="220" height="70" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="230" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">r = ⌊√x⌋</text>
  <text x="230" y="152" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">（±2 修正浮点误差）</text>
  <g filter="url(#rough2)"><rect x="370" y="100" width="220" height="70" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="480" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">r² == x ?</text>
  <text x="480" y="152" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">否则 NO</text>
  <g filter="url(#rough2)"><rect x="620" y="100" width="180" height="70" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="710" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">isp[r] ?</text>
  <text x="710" y="152" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">YES / NO</text>
  <g filter="url(#rough2)"><line x1="340" y1="135" x2="370" y2="135" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="590" y1="135" x2="620" y2="135" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <text x="420" y="230" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">筛表 10⁶ 个 char，约 1 MB；每个询问 O(1)</text>
  <g filter="url(#rough2)"><rect x="220" y="260" width="400" height="44" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">10⁵ 个询问实测约 20 ms（限 2 s）</text>
</svg>
