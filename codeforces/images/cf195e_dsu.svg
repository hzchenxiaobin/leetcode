<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="425"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">195E：加边 root(v)→i，权 = depth(v)+x；i 成为新根</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="96.0" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">操作 3：1 2 1（v=2, x=1）</text>
  <rect x="120.0" y="130.0" width="90.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="165.0" y="157.4" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="360.0" y="130.0" width="90.0" height="44.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="405.0" y="157.4" text-anchor="middle" font-size="15" fill="#8a6015" font-weight="bold" filter="url(#rough2)">3</text>
  <line x1="214.0" y1="152.0" x2="356.0" y2="152.0" stroke="#6b4c9a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285.0" y="140.0" text-anchor="middle" font-size="10.5" fill="#6b4c9a" filter="url(#rough2)">depth(2)+1 = 1</text>
  <rect x="60.0" y="210.0" width="600.0" height="70.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="233.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">depth(v) 由并查集势能维护（模 1e9+7）</text>
  <text x="74.0" y="259.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">把 root(v) 挂到 i 下，diff[root] = w；i 的 depth=0</text>
  <rect x="60.0" y="296.0" width="600.0" height="70.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="319.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">答案 = 所有边权之和 mod 1e9+7</text>
  <text x="74.0" y="345.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">深度可指数增长，必须全程取模</text>
</svg>
