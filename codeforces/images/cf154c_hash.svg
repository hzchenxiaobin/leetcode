<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="509"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">用 XOR 哈希压缩邻接集合</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">H(v) = ⊕_{u∈N(v)} r_u，r 为随机 64 位值</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="360" height="90" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="240" y="124" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">非朋友对</text>
  <text x="240" y="152" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">双重 ⟺ N(i) = N(j)</text>
  <text x="240" y="174" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">⟺ H(i) = H(j)</text>
  <g filter="url(#rough2)"><rect x="480" y="96" width="360" height="90" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="660" y="124" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">朋友对</text>
  <text x="660" y="152" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">双重 ⟺ N(i)\{j} = N(j)\{i}</text>
  <text x="660" y="174" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">⟺ H(i)⊕r_j = H(j)⊕r_i</text>
  <text x="450" y="226" text-anchor="middle" font-size="12" fill="#b06a1e" filter="url(#rough2)">按 (H1,H2) 排序分组，组内 C(c,2) 对；再逐边修正</text>
  <text x="450" y="258" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">两套 64 位哈希把碰撞概率压到可忽略</text>
</svg>
