<svg xmlns="http://www.w3.org/2000/svg" width="740" height="270" viewBox="0 0 740 270"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="341"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="740" height="270" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">可行删除位置 = [m−1−R, L]，一段连续区间</text>
  <g font-family="monospace" font-size="20" filter="url(#rough2)">
    <text x="90" y="90" fill="#2f4a66">a</text><text x="130" y="90" fill="#2f4a66">b</text><text x="170" y="90" fill="#b85450">d</text><text x="210" y="90" fill="#2f4a66">r</text><text x="250" y="90" fill="#2f4a66">a</text><text x="290" y="90" fill="#2f4a66">k</text><text x="330" y="90" fill="#2f4a66">a</text>
    <text x="90" y="150" fill="#2f4a66">a</text><text x="130" y="150" fill="#2f4a66">b</text><text x="170" y="150" fill="#2f5223">r</text><text x="210" y="150" fill="#2f4a66">a</text><text x="250" y="150" fill="#2f4a66">k</text><text x="290" y="150" fill="#2f4a66">a</text>
  </g>
  <g font-size="12" filter="url(#rough2)">
    <text x="400" y="86" fill="#2f5223">公共前缀 L = 2（"ab"）</text>
    <text x="400" y="112" fill="#2f8a3a" font-size="11.5">第 3 个字符起不同（d vs r）</text>
    <text x="400" y="152" fill="#2f5223">公共后缀 R = 9（"rakadabra"）</text>
  </g>
  <rect x="90" y="190" width="560" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="106" y="214" font-size="12.5" fill="#8a6015" filter="url(#rough2)">p ≤ L 才能保证前缀一致；m−1−p ≤ R 才能保证后缀一致。</text>
  <text x="106" y="234" font-size="12.5" fill="#8a6015" filter="url(#rough2)">两者合起来：p ∈ [m−1−R, L]；区间为空则无解。</text>
</svg>
