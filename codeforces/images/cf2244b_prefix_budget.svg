<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa" filter="url(#rough2)"/>

  <text x="290" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    前缀 i 里的书，必须够摆出 1, 2, …, i
  </text>
  <text x="290" y="56" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    操作只能把书往右搬：前缀内的书只会减少，绝不会增加
  </text>

  <text x="76" y="121" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">a_i</text>
  <text x="76" y="201" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">S_i</text>
  <text x="76" y="281" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">T_i</text>

  <g font-size="15" fill="#333" text-anchor="middle">
    <rect x="86" y="96" width="84" height="40" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="128" y="123" filter="url(#rough2)">8</text>
    <rect x="178" y="96" width="84" height="40" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="220" y="123" filter="url(#rough2)">2</text>
    <rect x="270" y="96" width="84" height="40" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="312" y="123" filter="url(#rough2)">8</text>
    <rect x="362" y="96" width="84" height="40" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="404" y="123" filter="url(#rough2)">1</text>
    <rect x="454" y="96" width="84" height="40" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="496" y="123" filter="url(#rough2)">8</text>
  </g>

  <g font-size="15" fill="#333" text-anchor="middle">
    <rect x="86" y="176" width="84" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="128" y="203" filter="url(#rough2)">8</text>
    <rect x="178" y="176" width="84" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="220" y="203" filter="url(#rough2)">10</text>
    <rect x="270" y="176" width="84" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="312" y="203" filter="url(#rough2)">18</text>
    <rect x="362" y="176" width="84" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="404" y="203" filter="url(#rough2)">19</text>
    <rect x="454" y="176" width="84" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="496" y="203" filter="url(#rough2)">27</text>
  </g>

  <g font-size="15" fill="#333" text-anchor="middle">
    <rect x="86" y="256" width="84" height="40" rx="4" fill="#fff8e1" stroke="#d6a040"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="128" y="283" filter="url(#rough2)">1</text>
    <rect x="178" y="256" width="84" height="40" rx="4" fill="#fff8e1" stroke="#d6a040"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="220" y="283" filter="url(#rough2)">3</text>
    <rect x="270" y="256" width="84" height="40" rx="4" fill="#fff8e1" stroke="#d6a040"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="312" y="283" filter="url(#rough2)">6</text>
    <rect x="362" y="256" width="84" height="40" rx="4" fill="#fff8e1" stroke="#d6a040"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="404" y="283" filter="url(#rough2)">10</text>
    <rect x="454" y="256" width="84" height="40" rx="4" fill="#fff8e1" stroke="#d6a040"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="496" y="283" filter="url(#rough2)">15</text>
  </g>

  <g font-size="14" fill="#4a7a3a" text-anchor="middle">
    <text x="128" y="319" filter="url(#rough2)">✓</text>
    <text x="220" y="319" filter="url(#rough2)">✓</text>
    <text x="312" y="319" filter="url(#rough2)">✓</text>
    <text x="404" y="319" filter="url(#rough2)">✓</text>
    <text x="496" y="319" filter="url(#rough2)">✓</text>
  </g>

  <path d="M 546 116 L 566 116" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="556" y="146" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">往右</text>

  <rect x="86" y="344" width="452" height="52" rx="10" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="365" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    严格递增的正整数数组必有 b_i ≥ i，于是 S_i ≥ 1+2+…+i = i(i+1)/2
  </text>
  <text x="312" y="386" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    反过来这个条件也充分：直接取 b_i = i，多出来的都往右推
  </text>

  <text x="290" y="418" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    例：a = [8,2,8,1,8]，绿色前缀和全部 ≥ 橙色门槛，故可行
  </text>
</svg>
