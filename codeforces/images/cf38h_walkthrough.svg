<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="917"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 1 走查：g=1、s=1，枚举 (r,t) 共 6 对</text>

  <!-- 键信息 -->
  <text x="60" y="58" font-size="11" fill="#446688" filter="url(#rough2)">键：V₁={5,9}　V₂={6}　V₃={7,11}　⇒　m=[5,6,7]，M=[9,6,11]</text>

  <!-- 表头 -->
  <rect x="40" y="70" width="700" height="28" fill="#eef1f4" stroke="#7a8ca6" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="56" y="89" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">(r, t)</text>
  <text x="150" y="89" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">a = m_r　b = M_t</text>
  <text x="300" y="89" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">其余人的角色约束</text>
  <text x="660" y="89" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">计数</text>

  <!-- 行 1 -->
  <rect x="40" y="98" width="700" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="56" y="118" font-size="10.5" fill="#2f5223" filter="url(#rough2)">(1, 3)</text>
  <text x="150" y="118" font-size="10.5" fill="#2f5223" filter="url(#rough2)">5 / 11</text>
  <text x="300" y="118" font-size="10" fill="#2f5223" filter="url(#rough2)">人2：不能金（6&gt;5），键6∈(5,11) 可银；M₂=6&lt;11 必须银</text>
  <text x="660" y="118" font-size="10.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>

  <!-- 行 2 -->
  <rect x="40" y="128" width="700" height="30" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="148" font-size="10.5" fill="#555" filter="url(#rough2)">(1, 2)</text>
  <text x="150" y="148" font-size="10.5" fill="#555" filter="url(#rough2)">5 / 6</text>
  <text x="300" y="148" font-size="10" fill="#555" filter="url(#rough2)">人3：键 7,11 不在 (5,6)，不能银；M₃=11≥6 可铜</text>
  <text x="660" y="148" font-size="10.5" font-weight="bold" fill="#c0392b" filter="url(#rough2)">0</text>

  <!-- 行 3 -->
  <rect x="40" y="158" width="700" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="56" y="178" font-size="10.5" fill="#2f5223" filter="url(#rough2)">(2, 3)</text>
  <text x="150" y="178" font-size="10.5" fill="#2f5223" filter="url(#rough2)">6 / 11</text>
  <text x="300" y="178" font-size="10" fill="#2f5223" filter="url(#rough2)">人1：键9∈(6,11) 可银；M₁=9&lt;11 必须银</text>
  <text x="660" y="178" font-size="10.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>

  <!-- 行 4 -->
  <rect x="40" y="188" width="700" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="56" y="208" font-size="10.5" fill="#2f5223" filter="url(#rough2)">(2, 1)</text>
  <text x="150" y="208" font-size="10.5" fill="#2f5223" filter="url(#rough2)">6 / 9</text>
  <text x="300" y="208" font-size="10" fill="#2f5223" filter="url(#rough2)">人3：键7∈(6,9) 可银；M₃=11≥9 可铜</text>
  <text x="660" y="208" font-size="10.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>

  <!-- 行 5 -->
  <rect x="40" y="218" width="700" height="30" fill="#f4f4f4" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="238" font-size="10.5" fill="#777" filter="url(#rough2)">(3, 2)</text>
  <text x="150" y="238" font-size="10.5" fill="#777" filter="url(#rough2)">7 / 6</text>
  <text x="300" y="238" font-size="10" fill="#777" filter="url(#rough2)">a ≥ b，无法按 G &lt; S &lt; B 排开</text>
  <text x="660" y="238" font-size="10.5" fill="#777" filter="url(#rough2)">跳过</text>

  <!-- 行 6 -->
  <rect x="40" y="248" width="700" height="30" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="268" font-size="10.5" fill="#555" filter="url(#rough2)">(3, 1)</text>
  <text x="150" y="268" font-size="10.5" fill="#555" filter="url(#rough2)">7 / 9</text>
  <text x="300" y="268" font-size="10" fill="#555" filter="url(#rough2)">人2：键6∉(7,9) 不能银；M₂=6&lt;9 不能铜 → 无角色</text>
  <text x="660" y="268" font-size="10.5" font-weight="bold" fill="#c0392b" filter="url(#rough2)">0</text>

  <!-- 总和 -->
  <rect x="40" y="290" width="700" height="34" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="313" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">合计 1 + 0 + 1 + 1 + 0 + 0 = 3　（与样例输出一致）</text>

  <!-- 说明 -->
  <text x="40" y="352" font-size="10.5" fill="#666" filter="url(#rough2)">每对 (r,t) 内部再做二维背包：人按角色掩码可选 金/银/铜，统计恰好 g 金、s 银的方案数。</text>
  <text x="40" y="374" font-size="10.5" fill="#666" filter="url(#rough2)">若某人在该 (r,t) 下三种角色都不可选（掩码为 0），这一对直接作废，不必背包。</text>
  <text x="40" y="396" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">为什么不会重复计数：每个可行分配的金牌组里"m 最大者"唯一、铜牌组里"M 最小者"唯一，只会在那一对 (r,t) 被数到。</text>
  <text x="40" y="416" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">由 g₂+s₂&lt;n 可知铜牌组非空，所以 t 一定存在。</text>
</svg>
