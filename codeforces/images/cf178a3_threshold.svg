<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把 cost 拆成阈值：c(i,k) 数的是「有几个阈值 ≤ k」</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40.0" y="84.0" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">固定 i，令 B = n - i，M_t = max{ N ≤ B : popcount(N) ≤ t }</text>
  <line x1="100.0" y1="220.0" x2="660.0" y2="220.0" stroke="#999999" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="150.0" cy="220.0" r="13.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="150.0" y="250.0" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">s₀=i</text>
  <circle cx="300.0" cy="220.0" r="13.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300.0" y="250.0" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">s₁=i+M₁</text>
  <circle cx="450.0" cy="220.0" r="13.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="450.0" y="250.0" text-anchor="middle" font-size="12" fill="#8a6015" font-weight="bold" filter="url(#rough2)">s₂=i+M₂</text>
  <circle cx="600.0" cy="220.0" r="13.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="600.0" y="250.0" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">s₃=i+M₃</text>
  <text x="660.0" y="214.0" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">k →</text>
  <text x="150.0" y="300.0" text-anchor="start" font-size="14" fill="#6b4c9a" font-weight="bold" filter="url(#rough2)">c(i,k) = # { t : s_t ≤ k }</text>
  <rect x="40.0" y="322.0" width="640.0" height="100.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="346.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">M_t 单调不减，s_t 也单调不减；某个 k 落在线段 [s_t, s_{t+1}) 里就恰好要 t+1 跳</text>
  <text x="54.0" y="372.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">所以对每个 t，把 a_i 加到 diff[s_t]，最后对 k 做前缀和即可</text>
</svg>
