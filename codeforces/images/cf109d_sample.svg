<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="360" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3：77 66 55 44 33 22 11</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">7 次交换（本解法给出的序列）</text>
  <text x="150" y="100" text-anchor="end" font-size="11" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">初始</text>
  <text x="170" y="100" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">77 66 55 44 33 22 11</text>
  <text x="150" y="132" text-anchor="end" font-size="11" fill="#2f4a66" filter="url(#rough2)">swap(1,7)</text>
  <text x="170" y="132" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">11 66 55 44 33 22 77</text>
  <text x="150" y="164" text-anchor="end" font-size="11" fill="#2f4a66" filter="url(#rough2)">swap(7,2)</text>
  <text x="170" y="164" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">11 77 55 44 33 22 66</text>
  <text x="150" y="196" text-anchor="end" font-size="11" fill="#2f4a66" filter="url(#rough2)">swap(2,6)</text>
  <text x="170" y="196" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">11 22 55 44 33 77 66</text>
  <text x="150" y="228" text-anchor="end" font-size="11" fill="#2f4a66" filter="url(#rough2)">swap(6,3)</text>
  <text x="170" y="228" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">11 22 77 44 33 55 66</text>
  <text x="150" y="260" text-anchor="end" font-size="11" fill="#2f4a66" filter="url(#rough2)">swap(3,5)</text>
  <text x="170" y="260" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">11 22 33 44 77 55 66</text>
  <text x="150" y="292" text-anchor="end" font-size="11" fill="#2f4a66" filter="url(#rough2)">swap(5,6)</text>
  <text x="170" y="292" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">11 22 33 44 55 77 66</text>
  <text x="150" y="324" text-anchor="end" font-size="11" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">swap(6,7)</text>
  <text x="170" y="324" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">11 22 33 44 55 66 77</text>
  <text x="700" y="140" text-anchor="start" font-size="11" fill="#8a2b28" filter="url(#rough2)">77 与 44 是幸运数</text>
  <text x="700" y="166" text-anchor="start" font-size="11" fill="#3d6b2f" filter="url(#rough2)">每次交换都含 77</text>
  <text x="700" y="192" text-anchor="start" font-size="11" fill="#2f4a66" filter="url(#rough2)">共 7 ≤ 2n = 14</text>
</svg>
