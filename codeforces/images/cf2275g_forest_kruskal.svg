<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">核心观察：最优保留集一定是森林</text>
  <path d="M 196 44 Q 380 51 564 44" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="380" y="62" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">保留 k 条边 ⇒ n − k 个连通块 ⇒ 新铺 n − k − 1 条</text>

  <rect x="26" y="80" width="342" height="150" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="44" y="106" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 森林给出连通块数</text>
  <text x="44" y="132" font-size="11.5" fill="#33506b" filter="url(#rough2)">利润 = D − Σ保留 d − x·(c−1)c/2</text>
  <text x="44" y="156" font-size="11" fill="#446688" filter="url(#rough2)">c = n − k（k 条边的森林有 n−k 块）</text>
  <text x="44" y="180" font-size="11" fill="#446688" filter="url(#rough2)">新铺 c−1 条：花费 x·(1+2+…+(c−1))</text>
  <text x="44" y="206" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">固定 k ⇒ 只需最小化保留边的权值和</text>

  <rect x="392" y="80" width="342" height="150" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="410" y="106" font-size="13" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">② Kruskal 前缀 = 各 k 的最小代价</text>
  <text x="410" y="132" font-size="11" fill="#3f6735" filter="url(#rough2)">边按 d 升序，依次接受「不成环」的边</text>
  <text x="410" y="156" font-size="11" fill="#3f6735" filter="url(#rough2)">接受序列 w₁ ≤ w₂ ≤ … ≤ w_kmax</text>
  <text x="410" y="180" font-size="11" fill="#3f6735" filter="url(#rough2)">W_k = w₁+…+w_k 即恰好 k 条边的最小森林</text>
  <text x="410" y="206" font-size="10.5" fill="#6b7f60" filter="url(#rough2)">（w_i 之前 greedy 只接受 i−1 条 ⇒ 该前缀里森林最多 i−1 条）</text>

  <rect x="26" y="246" width="708" height="74" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="46" y="272" font-size="12" fill="#7a5a18" filter="url(#rough2)">若保留集里有环：删掉环上一条边，连通块数不变（新铺数不变），却多卖 d_e &gt; 0 的铜 → 严格更优。</text>
  <text x="46" y="298" font-size="12" fill="#7a5a18" filter="url(#rough2)">所以环上的边一律卖掉，只保留一棵（每块一棵树的）森林。</text>

  <path d="M 380 324 L 380 344" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="380" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">问题化为：对每个 x，在 k = 0…kmax 中最大化 D − W_k − x·(n−1−k)(n−k)/2</text>
  <text x="380" y="388" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">D 为全部铜价值之和，kmax = n − 原图连通块数</text>
</svg>
