<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1201"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr46b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8c3b37"/>
    </marker>
  </defs>

  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">偏好顺序：先同尺码，再按距离由近到远，同距离取更大</text>

  <!-- 尺码带 -->
  <rect x="70" y="90" width="110" height="60" rx="10" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="126" text-anchor="middle" font-size="15" fill="#23405c" filter="url(#rough2)">S</text>
  <rect x="200" y="90" width="110" height="60" rx="10" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="126" text-anchor="middle" font-size="15" fill="#23405c" filter="url(#rough2)">M</text>
  <rect x="330" y="90" width="110" height="60" rx="10" fill="#ffd9b3" stroke="#b06a2c" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="385" y="126" text-anchor="middle" font-size="15" fill="#8a4a14" filter="url(#rough2)">L</text>
  <rect x="460" y="90" width="110" height="60" rx="10" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="515" y="126" text-anchor="middle" font-size="15" fill="#23405c" filter="url(#rough2)">XL</text>
  <rect x="590" y="90" width="110" height="60" rx="10" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="645" y="126" text-anchor="middle" font-size="15" fill="#23405c" filter="url(#rough2)">XXL</text>

  <text x="385" y="76" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">理想尺码（橙）</text>

  <!-- 顺序箭头 -->
  <path d="M 330 165 L 460 165" stroke="#8c3b37" stroke-width="2" fill="none" marker-end="url(#arr46b)" filter="url(#rough2)"/>
  <text x="395" y="182" text-anchor="middle" font-size="10" fill="#8c3b37" filter="url(#rough2)">① 距离 1，先大</text>

  <path d="M 330 205 L 200 205" stroke="#8c3b37" stroke-width="2" fill="none" marker-end="url(#arr46b)" filter="url(#rough2)"/>
  <text x="265" y="222" text-anchor="middle" font-size="10" fill="#8c3b37" filter="url(#rough2)">② 距离 1，后小</text>

  <path d="M 385 240 L 590 240" stroke="#8c3b37" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arr46b)" filter="url(#rough2)"/>
  <text x="490" y="258" text-anchor="middle" font-size="10" fill="#8c3b37" filter="url(#rough2)">③ 距离 2，先大</text>

  <path d="M 330 280 L 125 280" stroke="#8c3b37" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arr46b)" filter="url(#rough2)"/>
  <text x="230" y="298" text-anchor="middle" font-size="10" fill="#8c3b37" filter="url(#rough2)">④ 距离 2，后小</text>

  <!-- 说明 -->
  <rect x="60" y="316" width="660" height="66" rx="9" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="76" y="340" font-size="11.5" fill="#2f5223" filter="url(#rough2)">理想 L 的完整偏好：L, XL, M, XXL, S（题面给出的就是这个顺序）。</text>
  <text x="76" y="362" font-size="11.5" fill="#2f5223" filter="url(#rough2)">实现：for d = 0..4，先试 p+d 再试 p−d，越界跳过，取第一个还有库存的尺码。</text>
</svg>
