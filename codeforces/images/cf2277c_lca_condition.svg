<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定：v 与 n 要有公共祖先 c ≠ 1，剪掉的边只能落在 1→n 与 1→v 的交集上</text>
  <path d="M 40 40 Q 390 47 740 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <path d="M 150 76 L 150 114" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 143 136 L 92 184" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 158 140 L 214 184" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 76 208 L 56 248" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 226 208 L 252 248" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <circle cx="150" cy="62" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="150" y="67" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">1</text>
  <circle cx="150" cy="128" r="15" fill="#ffe1b3" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="150" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <circle cx="78" cy="196" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="201" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="225" cy="196" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="225" y="201" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">5</text>
  <circle cx="50" cy="262" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="50" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">n</text>
  <circle cx="258" cy="262" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="258" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">v</text>

  <text x="168" y="120" font-size="11" fill="#8a6015" filter="url(#rough2)">c</text>
  <text x="150" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">√ lca(v,n) = 2 ≠ 1：剪 (1,2) 有效</text>
  <text x="150" y="320" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">dep(n) = 1 + dist(v,n) = 1 + 4 = 5</text>

  <path d="M 380 52 L 380 336" stroke="#c9c9c9" stroke-width="1.4" fill="none" stroke-dasharray="5 6" filter="url(#rough2)"/>

  <path d="M 534 77 L 490 181" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 546 77 L 606 181" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 485 211 L 478 241" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 613 211 L 620 241" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <circle cx="540" cy="62" r="15" fill="#ffe1b3" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="540" y="67" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <circle cx="486" cy="196" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="486" y="201" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">2</text>
  <circle cx="612" cy="196" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="612" y="201" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">4</text>
  <circle cx="476" cy="256" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="476" y="261" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">n</text>
  <circle cx="622" cy="256" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="622" y="261" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">v</text>

  <text x="561" y="58" font-size="11" fill="#8a6015" filter="url(#rough2)">c = 1</text>
  <text x="600" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">× lca(v,n) = 1：怎么剪 n 都留在 1 侧</text>
  <text x="600" y="320" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">dep(n) 不变，这次操作白干</text>

  <rect x="34" y="338" width="712" height="76" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="362" font-size="12" fill="#2f4a66" filter="url(#rough2)">g[u] = u（u 在 1→n 路径上），否则 g[parent[u]]  ⇒  lca(u, n) = g[u]，一遍 BFS 即可</text>
  <text x="52" y="384" font-size="12" fill="#3c5e2e" filter="url(#rough2)">候选 = 1 + dep[v_i] + dep[n] − 2·dep[g[v_i]]，仅当 g[v_i] ≠ 1 时成立（取 c = g[v_i]）</text>
  <text x="52" y="406" font-size="12" fill="#a14340" filter="url(#rough2)">ans = max( dep[n], 全部候选 )，总复杂度 O(n + m)，不需要倍增 LCA 表</text>
</svg>
