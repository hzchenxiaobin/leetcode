<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">构造：前三色 R O Y，之后接周期 4 的 G B I V</text>
  <path d="M 96 44 Q 360 50 624 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="30" y="110" font-size="12.5" fill="#7a5a2a" filter="url(#rough2)">前 7 位</text>

  <!-- 第一行：R O Y G B I V -->
  <rect x="96" y="80" width="46" height="46" rx="6" fill="#f3dede" stroke="#c0504d" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="119" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">R</text>
  <rect x="146" y="80" width="46" height="46" rx="6" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="169" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">O</text>
  <rect x="196" y="80" width="46" height="46" rx="6" fill="#fbf5d8" stroke="#d6b840" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="219" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a7520" filter="url(#rough2)">Y</text>
  <rect x="246" y="80" width="46" height="46" rx="6" fill="#e6f0dd" stroke="#6a9a4a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="269" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#44662c" filter="url(#rough2)">G</text>
  <rect x="296" y="80" width="46" height="46" rx="6" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="319" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#335478" filter="url(#rough2)">B</text>
  <rect x="346" y="80" width="46" height="46" rx="6" fill="#e2e3f1" stroke="#5b5f9e" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="369" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#383b6c" filter="url(#rough2)">I</text>
  <rect x="396" y="80" width="46" height="46" rx="6" fill="#efe0f2" stroke="#9a5fa8" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="419" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#683a73" filter="url(#rough2)">V</text>

  <path d="M 96 132 L 442 132" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 96 132 L 96 138 M 442 132 L 442 138" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="268" y="154" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">七种颜色各一次（满足条件 ①）</text>

  <!-- 从第 4 位的 G 指向第二行开头的 G -->
  <path d="M 269 132 C 240 170 150 168 122 194" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="196" y="182" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">第 8 位接 G（相隔 4）</text>

  <text x="30" y="230" font-size="12.5" fill="#7a5a2a" filter="url(#rough2)">第 8 位起</text>

  <!-- 第二行：G B I V G B I V … -->
  <rect x="96" y="200" width="46" height="46" rx="6" fill="#e6f0dd" stroke="#6a9a4a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="119" y="230" text-anchor="middle" font-size="17" font-weight="bold" fill="#44662c" filter="url(#rough2)">G</text>
  <rect x="146" y="200" width="46" height="46" rx="6" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="169" y="230" text-anchor="middle" font-size="17" font-weight="bold" fill="#335478" filter="url(#rough2)">B</text>
  <rect x="196" y="200" width="46" height="46" rx="6" fill="#e2e3f1" stroke="#5b5f9e" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="219" y="230" text-anchor="middle" font-size="17" font-weight="bold" fill="#383b6c" filter="url(#rough2)">I</text>
  <rect x="246" y="200" width="46" height="46" rx="6" fill="#efe0f2" stroke="#9a5fa8" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="269" y="230" text-anchor="middle" font-size="17" font-weight="bold" fill="#683a73" filter="url(#rough2)">V</text>
  <rect x="296" y="200" width="46" height="46" rx="6" fill="#e6f0dd" stroke="#6a9a4a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="319" y="230" text-anchor="middle" font-size="17" font-weight="bold" fill="#44662c" filter="url(#rough2)">G</text>
  <rect x="346" y="200" width="46" height="46" rx="6" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="369" y="230" text-anchor="middle" font-size="17" font-weight="bold" fill="#335478" filter="url(#rough2)">B</text>
  <rect x="396" y="200" width="46" height="46" rx="6" fill="#e2e3f1" stroke="#5b5f9e" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="419" y="230" text-anchor="middle" font-size="17" font-weight="bold" fill="#383b6c" filter="url(#rough2)">I</text>
  <rect x="446" y="200" width="46" height="46" rx="6" fill="#efe0f2" stroke="#9a5fa8" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="469" y="230" text-anchor="middle" font-size="17" font-weight="bold" fill="#683a73" filter="url(#rough2)">V</text>
  <text x="512" y="232" text-anchor="middle" font-size="17" fill="#666666" filter="url(#rough2)">…</text>

  <path d="M 96 252 L 492 252" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 96 252 L 96 258 M 492 252 L 492 258" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="294" y="274" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">周期 4：任意连续 4 个正好是 G B I V 的一个循环移位</text>

  <!-- 循环示意 -->
  <path d="M 492 196 C 600 120 170 60 96 74" stroke="#666666" stroke-width="1.4" fill="none"
        stroke-dasharray="5 5" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="596" y="104" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">圆环：末尾回到开头</text>

  <rect x="60" y="296" width="600" height="102" rx="10" fill="#f4f4f0" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="320" font-size="12.5" fill="#333333" filter="url(#rough2)">① 窗口完全在第 4 位之后：四连 = G B I V 的循环移位 ⇒ 互不相同</text>
  <text x="80" y="344" font-size="12.5" fill="#333333" filter="url(#rough2)">② 窗口跨末尾回到开头：尾部只有 G / B / I / V，而第 1–3 位是 R / O / Y ⇒ 不撞色</text>
  <text x="80" y="368" font-size="12.5" fill="#333333" filter="url(#rough2)">③ 窗口落在前 7 位内：七色互不相同 ⇒ 任意四连也互不相同</text>
  <text x="80" y="390" font-size="12" fill="#8a6015" filter="url(#rough2)">三类窗口覆盖全部情况，所以构造对一切 7 ≤ n ≤ 100 合法</text>
</svg>
