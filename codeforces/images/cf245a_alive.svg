<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每台服务器各自累计「成功包数」，与 10×该服务器命令数比较</text>
  <rect x="60" y="60" width="220" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="170" y="92" text-anchor="middle" font-size="12" fill="#2f5223">服务器 a</text>
  <text x="170" y="107" text-anchor="middle" font-size="12" fill="#2f5223">成功包 Σx_a，命令数 c_a</text>
  <rect x="60" y="160" width="220" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="170" y="192" text-anchor="middle" font-size="12" fill="#2f4a66">服务器 b</text>
  <text x="170" y="207" text-anchor="middle" font-size="12" fill="#2f4a66">成功包 Σx_b，命令数 c_b</text>
  <rect x="380" y="60" width="280" height="70" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="520" y="99" text-anchor="middle" font-size="12" fill="#7a4b22">判定：2·Σx ≥ 10·c ⇔ Σx ≥ 5·c</text>
  <rect x="380" y="160" width="280" height="70" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="520" y="199" text-anchor="middle" font-size="12" fill="#7a4b22">否则 DEAD；两台互不影响</text>
  <line x1="282" y1="95" x2="376" y2="95" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="282" y1="195" x2="376" y2="195" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="270" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">样例 2：a 拿到 0+10 = 10（2 次命令，阈值 10）→ LIVE；b 拿到 0 → DEAD</text>
</svg>
