<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">命中区域：矩形 [0, a] × [−b, b] 里 p ≥ 4q 的那一块</text>
  <path d="M 152 41 Q 380 47 608 41" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40" y="62" text-anchor="start" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">情形一：4b ≤ a（直线从右边穿出）</text>
  <text x="40" y="80" text-anchor="start" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">a = 8, b = 1</text>
  <rect x="70" y="100" width="240" height="220" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <polygon points="70,320 70,100 310,100 310,210 190,320" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="70" y1="320" x2="310" y2="320" stroke="#2b2b2b" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="190" y1="320" x2="190" y2="94" stroke="#2b2b2b" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="315" y="325" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">q</text>
  <text x="196" y="90" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">p</text>
  <text x="184" y="336" text-anchor="end" font-size="11" fill="#5b5b5b" filter="url(#rough2)">0</text>
  <text x="74" y="336" text-anchor="start" font-size="11" fill="#5b5b5b" filter="url(#rough2)">−b</text>
  <text x="302" y="336" text-anchor="end" font-size="11" fill="#5b5b5b" filter="url(#rough2)">b</text>
  <text x="182" y="98" text-anchor="end" font-size="11" fill="#5b5b5b" filter="url(#rough2)">a</text>
  <line x1="130" y1="360" x2="340" y2="210" stroke="#b85450" stroke-width="1.7" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="160" y="350" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">p = 4q（判别式为零）</text>
  <text x="160" y="372" text-anchor="start" font-size="11.5" fill="#3f6b4a" filter="url(#rough2)">绿色 = 命中；白色 = 不命中</text>
  <text x="400" y="62" text-anchor="start" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">情形二：4b &gt; a（直线从上边穿出）</text>
  <text x="400" y="80" text-anchor="start" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">a = 2, b = 2</text>
  <rect x="430" y="100" width="240" height="220" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <polygon points="430,320 430,100 580,100 550,320" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="430" y1="320" x2="670" y2="320" stroke="#2b2b2b" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="550" y1="320" x2="550" y2="94" stroke="#2b2b2b" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="675" y="325" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">q</text>
  <text x="556" y="90" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">p</text>
  <text x="544" y="336" text-anchor="end" font-size="11" fill="#5b5b5b" filter="url(#rough2)">0</text>
  <text x="434" y="336" text-anchor="start" font-size="11" fill="#5b5b5b" filter="url(#rough2)">−b</text>
  <text x="662" y="336" text-anchor="end" font-size="11" fill="#5b5b5b" filter="url(#rough2)">b</text>
  <text x="542" y="98" text-anchor="end" font-size="11" fill="#5b5b5b" filter="url(#rough2)">a</text>
  <line x1="530" y1="334" x2="670" y2="70" stroke="#b85450" stroke-width="1.7" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="520" y="350" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">p = 4q（判别式为零）</text>
  <text x="520" y="372" text-anchor="start" font-size="11.5" fill="#3f6b4a" filter="url(#rough2)">绿色 = 命中；白色 = 不命中</text>
  <text x="40" y="402" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">概率 = 绿色面积 / 矩形面积 2ab；右图里 q &gt; a/4 的整列都不命中，所以三角形被矩形切掉一角</text>
</svg>
