  <path d="M 435 300 L 470 248" stroke="#c9d4e0" stroke-width="0.9" fill="none" filter="url(#rough2)"/>
  <path d="M 505 300 L 490 248" stroke="#c9d4e0" stroke-width="0.9" fill="none" filter="url(#rough2)"/>
  <path d="M 575 300 L 560 248" stroke="#c9d4e0" stroke-width="0.9" fill="none" filter="url(#rough2)"/>
  <path d="M 645 300 L 620 248" stroke="#c9d4e0" stroke-width="0.9" fill="none" filter="url(#rough2)"/>
  <text x="540" y="118" font-size="12.5" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">结果 3（最优）</text>
  <rect x="60" y="356" width="600" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="382" font-size="11.5" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">min(4, 3, …) = 3 —— 只枚举“单链”会漏掉分支 A 的结构</text>
</svg>
