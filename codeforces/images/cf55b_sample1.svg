  <text x="652" y="325" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="450" y="210" width="70" height="38" rx="5" fill="#fff8e1" stroke="#b08a2e" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="485" y="235" font-size="10" font-weight="normal" fill="#5b4a2a" text-anchor="middle" filter="url(#rough2)">1+1=2</text>
