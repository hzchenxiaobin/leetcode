  <text x="580" y="235" font-size="10" font-weight="normal" fill="#5b4a2a" text-anchor="middle" filter="url(#rough2)">2+1=3</text>
  <rect x="500" y="140" width="80" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
