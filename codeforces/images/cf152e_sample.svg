<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="493"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="260" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1：两个重要格子 (1,2) 与 (3,3)</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">沿第二列向下再向右，代价 2+2+3+2 = 9</text>
  <g filter="url(#rough2)"><rect x="200" y="96" width="80" height="48" rx="3" fill="#ffffff" fill-opacity="0.5" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="240" y="128" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="290" y="96" width="80" height="48" rx="3" fill="#dcecd2" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="330" y="128" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="380" y="96" width="80" height="48" rx="3" fill="#ffffff" fill-opacity="0.5" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="420" y="128" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="200" y="148" width="80" height="48" rx="3" fill="#ffffff" fill-opacity="0.5" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="240" y="180" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="290" y="148" width="80" height="48" rx="3" fill="#dcecd2" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="330" y="180" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="380" y="148" width="80" height="48" rx="3" fill="#ffffff" fill-opacity="0.5" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="420" y="180" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="200" y="200" width="80" height="48" rx="3" fill="#ffffff" fill-opacity="0.5" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="240" y="232" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="290" y="200" width="80" height="48" rx="3" fill="#dcecd2" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="330" y="232" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="380" y="200" width="80" height="48" rx="3" fill="#dcecd2" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="420" y="232" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="560" y="120" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">X 覆盖：(1,2),(2,2),(3,2),(3,3)</text>
  <text x="560" y="150" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">花数和 = 2+2+3+2 = 9</text>
  <text x="560" y="186" text-anchor="start" font-size="10.5" fill="#666666" filter="url(#rough2)">两个重要格子都覆盖且连通 ✓</text>
</svg>
