<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">总量 x+y 必须是 k 的倍数，且不超过 n</text>
  <path d="M 160 42 Q 360 48 570 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60" y="70" font-size="12" fill="#666" filter="url(#rough2)">样例 2：y = 10, k = 6, n = 40</text>

  <!-- 允许区间 -->
  <rect x="207" y="150" width="386" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="300" y="142" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">允许的总量区间 [y+1, n] = [11, 40]</text>

  <!-- 数轴 -->
  <line x1="60" y1="180" x2="704" y2="180" stroke="#2b2b2b" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="700" y="204" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">总量 t</text>

  <!-- k 的倍数刻度 -->
  <g filter="url(#rough2)">
    <line x1="60" y1="170" x2="60" y2="190" stroke="#888" stroke-width="1.3"/>
    <line x1="140" y1="170" x2="140" y2="190" stroke="#888" stroke-width="1.3"/>
    <line x1="220" y1="170" x2="220" y2="190" stroke="#888" stroke-width="1.3"/>
    <line x1="300" y1="170" x2="300" y2="190" stroke="#888" stroke-width="1.3"/>
    <line x1="380" y1="170" x2="380" y2="190" stroke="#888" stroke-width="1.3"/>
    <line x1="460" y1="170" x2="460" y2="190" stroke="#888" stroke-width="1.3"/>
    <line x1="540" y1="170" x2="540" y2="190" stroke="#888" stroke-width="1.3"/>
    <line x1="620" y1="170" x2="620" y2="190" stroke="#888" stroke-width="1.3"/>
    <line x1="700" y1="170" x2="700" y2="190" stroke="#888" stroke-width="1.3"/>
  </g>
  <text x="60" y="212" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="140" y="212" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="220" y="212" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">12</text>
  <text x="300" y="212" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">18</text>
  <text x="380" y="212" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">24</text>
  <text x="460" y="212" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">30</text>
  <text x="540" y="212" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">36</text>
  <text x="620" y="212" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">42</text>
  <text x="700" y="212" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">48</text>

  <!-- 有效点 -->
  <g filter="url(#rough2)">
    <circle cx="220" cy="180" r="8" fill="#4a7a3a"/>
    <circle cx="300" cy="180" r="8" fill="#4a7a3a"/>
    <circle cx="380" cy="180" r="8" fill="#4a7a3a"/>
    <circle cx="460" cy="180" r="8" fill="#4a7a3a"/>
    <circle cx="540" cy="180" r="8" fill="#4a7a3a"/>
  </g>
  <text x="220" y="248" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">x=2</text>
  <text x="300" y="248" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">x=8</text>
  <text x="380" y="248" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">x=14</text>
  <text x="460" y="248" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">x=20</text>
  <text x="540" y="248" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">x=26</text>

  <text x="60" y="286" font-size="12" fill="#666" filter="url(#rough2)">t = 12, 18, 24, 30, 36（都是 6 的倍数，且落在 [11, 40] 内）</text>
  <text x="60" y="310" font-size="12" fill="#666" filter="url(#rough2)">对应的 x = t − y = 2, 8, 14, 20, 26</text>

  <rect x="60" y="330" width="600" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="352" font-size="12" fill="#7a5a1b" filter="url(#rough2)">x 可能取值的个数 = (n − start) / k + 1，其中 start 是 ≥ y+1 的最小 k 的倍数。</text>
  <text x="74" y="370" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">5 个答案正好与官方样例 "2 8 14 20 26" 一致。</text>
</svg>
