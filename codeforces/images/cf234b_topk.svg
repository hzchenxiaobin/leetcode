<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="320" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">选亮度最大的 k 个小时</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">n=5, k=3：亮度 20 10 30 40 10 → 选 40,30,20</text>
  <g filter="url(#rough2)"><rect x="180" y="100" width="72" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="216" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">20</text>
  <text x="216" y="164" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">h1</text>
  <g filter="url(#rough2)"><rect x="270" y="100" width="72" height="48" rx="4" fill="#f2f2f2" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3"/></g>
  <text x="306" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="306" y="164" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">h2</text>
  <g filter="url(#rough2)"><rect x="360" y="100" width="72" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="396" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">30</text>
  <text x="396" y="164" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">h3</text>
  <g filter="url(#rough2)"><rect x="450" y="100" width="72" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="486" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">40</text>
  <text x="486" y="164" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">h4</text>
  <g filter="url(#rough2)"><rect x="540" y="100" width="72" height="48" rx="4" fill="#f2f2f2" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3"/></g>
  <text x="576" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="576" y="164" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">h5</text>
  <text x="420" y="210" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">所选集合的最小值 = 第 k 大亮度 = 20</text>
  <g filter="url(#rough2)"><rect x="230" y="236" width="380" height="40" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">任何方案的最小值 ≤ 第 k 大 ⇒ 贪心最优</text>
</svg>
