<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="290" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：l=2, r=7 → 33</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">next: 4,4,4,7,7,7</text>
  <g filter="url(#rough2)"><rect x="100" y="110" width="80" height="46" rx="4" fill="#f6e3c4" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="140" y="130" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x=2</text>
  <text x="140" y="150" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">→ 4</text>
  <g filter="url(#rough2)"><rect x="200" y="110" width="80" height="46" rx="4" fill="#f6e3c4" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="240" y="130" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x=3</text>
  <text x="240" y="150" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">→ 4</text>
  <g filter="url(#rough2)"><rect x="300" y="110" width="80" height="46" rx="4" fill="#f6e3c4" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="340" y="130" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x=4</text>
  <text x="340" y="150" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">→ 4</text>
  <g filter="url(#rough2)"><rect x="400" y="110" width="80" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="440" y="130" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x=5</text>
  <text x="440" y="150" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">→ 7</text>
  <g filter="url(#rough2)"><rect x="500" y="110" width="80" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="540" y="130" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x=6</text>
  <text x="540" y="150" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">→ 7</text>
  <g filter="url(#rough2)"><rect x="600" y="110" width="80" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="640" y="130" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x=7</text>
  <text x="640" y="150" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">→ 7</text>
  <text x="442" y="210" text-anchor="middle" font-size="14" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">4·3 + 7·3 = 33</text>
</svg>
