<svg xmlns="http://www.w3.org/2000/svg" width="740" height="470" viewBox="0 0 740 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="740" height="470" fill="#fafafa"/>
  <text x="370" y="34" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">样例 2：距离排成一列，R 卡在 13.4513</text>
  <line x1="70" y1="210" x2="710" y2="210" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="716" y="215" font-size="14" fill="#2b2b2b" text-anchor="start" font-weight="bold" filter="url(#rough2)">D</text>
  <text x="70" y="196" font-size="11" fill="#44546a" text-anchor="middle" filter="url(#rough2)">0</text>
  <line x1="200" y1="204" x2="200" y2="216" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="200" cy="210" r="5" fill="#b85450" stroke="#8a3030" stroke-width="1" filter="url(#rough2)"/>
  <text x="200" y="236" font-size="11" fill="#8a3030" text-anchor="middle" filter="url(#rough2)">5</text>
  <line x1="376" y1="204" x2="376" y2="216" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="376" cy="210" r="5" fill="#b85450" stroke="#8a3030" stroke-width="1" filter="url(#rough2)"/>
  <text x="376" y="236" font-size="11" fill="#8a3030" text-anchor="middle" filter="url(#rough2)">13</text>
  <line x1="401" y1="204" x2="401" y2="216" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="401" cy="210" r="5" fill="#b85450" stroke="#8a3030" stroke-width="1" filter="url(#rough2)"/>
  <text x="401.12699200000003" y="236" font-size="11" fill="#8a3030" text-anchor="middle" filter="url(#rough2)">14.142</text>
  <line x1="619" y1="204" x2="619" y2="216" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="619" cy="210" r="5" fill="#b85450" stroke="#8a3030" stroke-width="1" filter="url(#rough2)"/>
  <text x="619.4979338842975" y="236" font-size="11" fill="#8a3030" text-anchor="middle" filter="url(#rough2)">92.195</text>
  <line x1="681" y1="204" x2="681" y2="216" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="681" cy="210" r="5" fill="#b85450" stroke="#8a3030" stroke-width="1" filter="url(#rough2)"/>
  <text x="680.5219008264463" y="236" font-size="11" fill="#8a3030" text-anchor="middle" filter="url(#rough2)">141.421</text>
  <line x1="386" y1="152" x2="386" y2="218" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="393.9286" y="146" font-size="12.5" fill="#2f5223" text-anchor="start" font-weight="bold" filter="url(#rough2)">R = 13.4513</text>
  <rect x="90" y="138" width="296" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="237.9643" y="130" font-size="11.5" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">D &lt; R：必定摧毁（2 个）</text>
  <rect x="386" y="138" width="295" height="16" fill="#fff3e0" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="533.2252504132232" y="130" font-size="11.5" fill="#8a6015" text-anchor="middle" filter="url(#rough2)">D ≥ R：按 e^(1−(D/R)²) 概率摧毁</text>
  <rect x="60" y="286" width="300" height="156" rx="10" fill="#f2f6fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="312" font-size="13" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">R = 13.4513 时的概率</text>
  <text x="78" y="340" font-size="11.5" fill="#44546a" text-anchor="start" filter="url(#rough2)">D = 5</text>
  <text x="196" y="340" font-size="11.5" fill="#8a3030" text-anchor="start" filter="url(#rough2)">1（必中）</text>
  <text x="78" y="360" font-size="11.5" fill="#44546a" text-anchor="start" filter="url(#rough2)">D = 13</text>
  <text x="196" y="360" font-size="11.5" fill="#8a3030" text-anchor="start" filter="url(#rough2)">1（必中）</text>
  <text x="78" y="380" font-size="11.5" fill="#44546a" text-anchor="start" filter="url(#rough2)">D = 14.142</text>
  <text x="196" y="380" font-size="11.5" fill="#8a3030" text-anchor="start" filter="url(#rough2)">0.9000</text>
  <text x="78" y="400" font-size="11.5" fill="#44546a" text-anchor="start" filter="url(#rough2)">D = 92.195</text>
  <text x="196" y="400" font-size="11.5" fill="#8a3030" text-anchor="start" filter="url(#rough2)">≈ 3×10⁻²¹</text>
  <text x="78" y="420" font-size="11.5" fill="#44546a" text-anchor="start" filter="url(#rough2)">D = 141.421</text>
  <text x="196" y="420" font-size="11.5" fill="#8a3030" text-anchor="start" filter="url(#rough2)">≈ 0</text>
  <rect x="388" y="286" width="312" height="156" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="406" y="312" font-size="12.5" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">凑够 K = 3 个：失败 = 1 − 0.9 = 0.1</text>
  <text x="406" y="340" font-size="12" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">解 e^(1−200/R²) = 0.9：</text>
  <text x="406" y="366" font-size="12.5" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">R = √200 / √(1 − ln 0.9)</text>
  <text x="406" y="392" font-size="12" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">= 14.142136 / 1.051361</text>
  <text x="406" y="418" font-size="12.5" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">= 13.45126176…</text>
  <text x="370" y="356" font-size="10" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)"></text>
</svg>
