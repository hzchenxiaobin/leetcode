<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr71ep" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="360" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">每个目标原子对应一组初始原子（组内和 = 目标序数）</text>

  <!-- 第 1 组 -->
  <g filter="url(#rough2)" font-size="13" fill="#2b3a4a" text-anchor="middle">
    <rect x="60" y="76" width="62" height="38" fill="#eef4fb" stroke="#446688" stroke-width="1.6"/>
    <rect x="140" y="76" width="62" height="38" fill="#eef4fb" stroke="#446688" stroke-width="1.6"/>
    <rect x="220" y="76" width="62" height="38" fill="#eef4fb" stroke="#446688" stroke-width="1.6"/>
    <text x="91" y="100">Mn</text>
    <text x="171" y="100">C</text>
    <text x="251" y="100">K</text>
    <text x="132" y="101" font-size="14">+</text>
    <text x="212" y="101" font-size="14">+</text>
    <text x="91" y="130" font-size="11" fill="#5a6a7a">25</text>
    <text x="171" y="130" font-size="11" fill="#5a6a7a">6</text>
    <text x="251" y="130" font-size="11" fill="#5a6a7a">19</text>
    <path d="M292 95 L508 95" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr71ep)"/>
    <rect x="520" y="76" width="66" height="38" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="553" y="100" font-size="13.5" fill="#2f5223">Sn</text>
    <text x="600" y="100" font-size="12" fill="#33475c" text-anchor="start">25+6+19 = 50</text>
  </g>

  <!-- 第 2 组 -->
  <g filter="url(#rough2)" font-size="13" fill="#2b3a4a" text-anchor="middle">
    <rect x="60" y="166" width="62" height="38" fill="#f5e6c8" stroke="#c9a227" stroke-width="1.6"/>
    <rect x="140" y="166" width="62" height="38" fill="#f5e6c8" stroke="#c9a227" stroke-width="1.6"/>
    <rect x="220" y="166" width="62" height="38" fill="#f5e6c8" stroke="#c9a227" stroke-width="1.6"/>
    <text x="91" y="190">Co</text>
    <text x="171" y="190">Zn</text>
    <text x="251" y="190">Sc</text>
    <text x="132" y="191" font-size="14">+</text>
    <text x="212" y="191" font-size="14">+</text>
    <text x="91" y="220" font-size="11" fill="#8a6015">27</text>
    <text x="171" y="220" font-size="11" fill="#8a6015">30</text>
    <text x="251" y="220" font-size="11" fill="#8a6015">21</text>
    <path d="M292 185 L508 185" stroke="#c9a227" stroke-width="1.8" fill="none" marker-end="url(#arr71ep)"/>
    <rect x="520" y="166" width="66" height="38" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="553" y="190" font-size="13.5" fill="#2f5223">Pt</text>
    <text x="600" y="190" font-size="12" fill="#33475c" text-anchor="start">27+30+21 = 78</text>
  </g>

  <!-- 第 3 组 -->
  <g filter="url(#rough2)" font-size="13" fill="#2b3a4a" text-anchor="middle">
    <rect x="60" y="256" width="62" height="38" fill="#f7e6e6" stroke="#b85450" stroke-width="1.6"/>
    <rect x="140" y="256" width="62" height="38" fill="#f7e6e6" stroke="#b85450" stroke-width="1.6"/>
    <rect x="220" y="256" width="62" height="38" fill="#f7e6e6" stroke="#b85450" stroke-width="1.6"/>
    <rect x="300" y="256" width="62" height="38" fill="#f7e6e6" stroke="#b85450" stroke-width="1.6"/>
    <text x="91" y="280">Li</text>
    <text x="171" y="280">Mg</text>
    <text x="251" y="280">P</text>
    <text x="331" y="280">F</text>
    <text x="132" y="281" font-size="14">+</text>
    <text x="212" y="281" font-size="14">+</text>
    <text x="292" y="281" font-size="14">+</text>
    <text x="91" y="310" font-size="11" fill="#7a2f2c">3</text>
    <text x="171" y="310" font-size="11" fill="#7a2f2c">12</text>
    <text x="251" y="310" font-size="11" fill="#7a2f2c">15</text>
    <text x="331" y="310" font-size="11" fill="#7a2f2c">9</text>
    <path d="M372 275 L508 275" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr71ep)"/>
    <rect x="520" y="256" width="66" height="38" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="553" y="280" font-size="13.5" fill="#2f5223">Y</text>
    <text x="600" y="280" font-size="12" fill="#33475c" text-anchor="start">3+12+15+9 = 39</text>
  </g>

  <text x="380" y="344" text-anchor="middle" font-size="12" fill="#4a4a4a" filter="url(#rough2)">十个初始原子恰好各用一次，三个目标原子各被凑出一次</text>
</svg>
