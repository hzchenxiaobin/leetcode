<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    good 段 = k 个连续整数的一个排列
  </text>
  <text x="330" y="52" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">
    b 可重排成 b_i − b_(i−1) = 1 ⇒ 排序后恰为 x, x+1, …, x+k−1（互不相同且没有空隙）
  </text>

  <text x="42" y="80" font-size="12.5" fill="#446688" filter="url(#rough2)">
    数组 a = [2, 1, 4, 3]，取 k = 2
  </text>
  <rect x="70" y="88" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="94" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="124" y="88" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="148" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="178" y="88" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="202" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <rect x="232" y="88" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="256" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>

  <text x="94" y="148" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="148" y="148" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="202" y="148" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="256" y="148" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>

  <text x="121" y="170" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">
    值域 {1, 2}
  </text>
  <text x="229" y="170" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">
    值域 {3, 4}
  </text>

  <text x="40" y="200" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">
    把两段的值域画到同一条数值轴上：
  </text>
  <rect x="340" y="212" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="363" y="236" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="396" y="212" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="419" y="236" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="452" y="212" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="236" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="508" y="212" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="531" y="236" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>

  <path d="M340 250 L340 262 L442 262 L442 250" fill="none" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="391" y="278" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    来自第 1 段
  </text>
  <path d="M452 250 L452 262 L554 262 L554 250" fill="none" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="503" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    来自第 2 段
  </text>
  <text x="446" y="206" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">
    两半恰好相差 k = 2
  </text>

  <rect x="40" y="290" width="580" height="98" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="314" font-size="12" fill="#333" filter="url(#rough2)">
    ① good 段 ⇔ 元素互不相同且极差 = k−1 ⇔ 恰好是 x..x+k−1 的一个排列
  </text>
  <text x="56" y="338" font-size="12" fill="#333" filter="url(#rough2)">
    ② 两段拼接也要 good ⇒ 两段值域相邻：min₂ = min₁ ± k，各占一半
  </text>
  <text x="56" y="362" font-size="12" fill="#333" filter="url(#rough2)">
    ③ 拼接只看多重集，两段在数组中谁前谁后无关 ⇒ min₁ ± k 两个方向都要查
  </text>
</svg>
