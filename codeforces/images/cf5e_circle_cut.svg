<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="460" fill="#fafafa"/>
  <text x="390" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">从最高峰处剪开：环上的问题变成链上的问题</text>

  <!-- 圆 -->
  <circle cx="215" cy="255" r="125" fill="none" stroke="#8a94a6" stroke-width="1.6"
          stroke-dasharray="7 6" filter="url(#rough2)"/>
  <text x="215" y="262" text-anchor="middle" font-size="12" fill="#8a94a6" filter="url(#rough2)">顺时针</text>

  <!-- 五个峰 -->
  <g filter="url(#rough2)">
    <circle cx="215" cy="130" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="215" y="135" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66">1</text>
    <circle cx="333.9" cy="216.4" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="333.9" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66">2</text>
    <circle cx="288.5" cy="356.1" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="288.5" y="361" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66">4</text>
    <circle cx="141.5" cy="356.1" r="11" fill="#fce8e6" stroke="#b85450" stroke-width="2.2"/>
    <text x="141.5" y="361" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f3b37">5</text>
    <circle cx="96.1" cy="216.4" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="96.1" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5223">3</text>
  </g>
  <text x="215" y="106" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">h=1</text>
  <text x="352" y="212" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">h=2</text>
  <text x="306" y="378" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">h=4</text>
  <text x="120" y="386" font-size="10.5" fill="#8f3b37" filter="url(#rough2)">h=5（最高）</text>
  <text x="66" y="212" text-anchor="end" font-size="10.5" fill="#2f5223" filter="url(#rough2)">h=3</text>

  <!-- 剪开 -->
  <line x1="215" y1="255" x2="92" y2="404" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="78" y="422" font-size="12" fill="#8f3b37" filter="url(#rough2)">从这里剪开</text>

  <!-- 右侧：展开成链 -->
  <text x="430" y="120" font-size="13" fill="#2b2b2b" filter="url(#rough2)">把最高峰放在下标 0，其余按顺时针展开：</text>
  <g filter="url(#rough2)">
    <rect x="430" y="140" width="52" height="46" rx="6" fill="#fce8e6" stroke="#b85450" stroke-width="1.8"/>
    <text x="456" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#8f3b37">5</text>
    <rect x="492" y="140" width="52" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="518" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223">3</text>
    <rect x="554" y="140" width="52" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="580" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66">1</text>
    <rect x="616" y="140" width="52" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="642" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66">2</text>
    <rect x="678" y="140" width="52" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="704" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66">4</text>
  </g>
  <g font-size="11" fill="#666" filter="url(#rough2)">
    <text x="456" y="204" text-anchor="middle">0</text>
    <text x="518" y="204" text-anchor="middle">1</text>
    <text x="580" y="204" text-anchor="middle">2</text>
    <text x="642" y="204" text-anchor="middle">3</text>
    <text x="704" y="204" text-anchor="middle">4</text>
  </g>

  <g font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">
    <text x="430" y="252">· 0 号是全局最高峰 H，任何“跨过 0 号”的弧上都站着 H。</text>
    <text x="430" y="278">· 这条弧只有在两端都等于 H 时才算数 —— 而那时</text>
    <text x="446" y="302">直连弧同样有效，所以跨过 0 号的弧可以完全不管。</text>
    <text x="430" y="336">· 于是 1..n-1 内部只需数“链上的直连可见对”，</text>
    <text x="430" y="360">0 号峰另外用前后缀最大值单独配对。</text>
  </g>

  <rect x="430" y="380" width="300" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="442" y="404" font-size="12.5" fill="#8a6015" filter="url(#rough2)">两段弧 = 链上的“直连区间”＋“绕回去那段”</text>
  <text x="442" y="424" font-size="12.5" fill="#8a6015" filter="url(#rough2)">剪开之后，绕回去那段必含 H，只剩直连区间</text>
</svg>
