<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="360" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">合并 = 连续分段，段和必须非降</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">例：8 2 7 3 1 → 分成 [8,2] [7,3] [1] 即 10,10,1 不行；最优 10,10,11</text>
  <g filter="url(#rough2)"><rect x="170" y="100" width="70" height="50" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="205" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="260" y="100" width="70" height="50" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="295" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="350" y="100" width="70" height="50" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="385" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="440" y="100" width="70" height="50" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="475" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="530" y="100" width="70" height="50" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="565" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><path d="M 160 168 L 340 168" fill="none" stroke="#a0522d" stroke-width="1.6" stroke-linejoin="round"/></g>
  <g filter="url(#rough2)"><path d="M 350 168 L 520 168" fill="none" stroke="#a0522d" stroke-width="1.6" stroke-linejoin="round"/></g>
  <g filter="url(#rough2)"><path d="M 530 168 L 620 168" fill="none" stroke="#a0522d" stroke-width="1.6" stroke-linejoin="round"/></g>
  <text x="250" y="188" text-anchor="middle" font-size="12" fill="#a0522d" filter="url(#rough2)">10</text>
  <text x="435" y="188" text-anchor="middle" font-size="12" fill="#a0522d" filter="url(#rough2)">10</text>
  <text x="575" y="188" text-anchor="middle" font-size="12" fill="#a0522d" filter="url(#rough2)">1</text>
  <text x="420" y="230" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">操作数 = n − 段数 ⇒ 要最大化段数，同时让每段和尽量小</text>
  <g filter="url(#rough2)"><rect x="180" y="256" width="480" height="56" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="280" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">dp[i] = (最少操作数, 该操作数下最后一段的最小高度)</text>
  <text x="420" y="302" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">转移枚举最后一段的起点 j，要求段和 ≥ dp[j].last</text>
  <text x="420" y="340" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">O(n²) DP，n=5000 实测约 10 ms</text>
</svg>
