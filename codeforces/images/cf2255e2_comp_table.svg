<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="900" height="420" fill="#fafafa"/>

  <text x="450" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">标签合成表：记 sc(I, k) 为把信息 I 整体乘以 k（k ≥ 0）</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="30" y="52" width="150" height="72" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="188" y="52" width="340" height="72" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="536" y="52" width="334" height="72" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="105" y="82" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">先做 A</text>
  <text x="105" y="104" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">再做 B</text>
  <text x="358" y="82" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">B 不含赋值（kind 0）</text>
  <text x="358" y="106" text-anchor="middle" font-size="12" fill="#5b7290" filter="url(#rough2)">只能给出 info₊ / info₋ 与 σ</text>
  <text x="703" y="82" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">B 含赋值（kind 1）</text>
  <text x="703" y="106" text-anchor="middle" font-size="12" fill="#5b7290" filter="url(#rough2)">结果一切都变成常数</text>

  <!-- 第一行 -->
  <g filter="url(#rough2)">
    <rect x="30" y="132" width="150" height="126" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="188" y="132" width="340" height="126" rx="7" fill="#ffffff" stroke="#b9d0b0" stroke-width="1.4"/>
    <rect x="536" y="132" width="334" height="126" rx="7" fill="#ffffff" stroke="#b9d0b0" stroke-width="1.4"/>
  </g>
  <text x="105" y="180" text-anchor="middle" font-size="13" fill="#3f6633" filter="url(#rough2)">A 不含赋值</text>
  <text x="105" y="204" text-anchor="middle" font-size="12" fill="#3f6633" filter="url(#rough2)">kind 0</text>
  <text x="105" y="228" text-anchor="middle" font-size="12" fill="#3f6633" filter="url(#rough2)">（只有符号信息）</text>

  <text x="204" y="160" font-size="12.5" fill="#444" filter="url(#rough2)">info₊ ← info₊(A) ⊕ sc(info(B, sign σ₊), |σ₊|)</text>
  <text x="204" y="184" font-size="12.5" fill="#444" filter="url(#rough2)">info₋ ← info₋(A) ⊕ sc(info(B, sign σ₋), |σ₋|)</text>
  <text x="204" y="210" font-size="12.5" fill="#444" filter="url(#rough2)">σ₊ ← B 在输入 σ₊ 下的最终符号</text>
  <text x="204" y="234" font-size="12.5" fill="#444" filter="url(#rough2)">σ₋ ← B 在输入 σ₋ 下的最终符号</text>

  <text x="552" y="160" font-size="12.5" fill="#444" filter="url(#rough2)">info₊/₋ 同上（照抄 A 的前半）</text>
  <text x="552" y="184" font-size="12.5" fill="#444" filter="url(#rough2)">post ← post(B)</text>
  <text x="552" y="208" font-size="12.5" fill="#444" filter="url(#rough2)">fin  ← fin(B)</text>
  <text x="552" y="234" font-size="12" fill="#8a6420" filter="url(#rough2)">B 的赋值抹掉了 x 的影响</text>

  <!-- 第二行 -->
  <g filter="url(#rough2)">
    <rect x="30" y="266" width="150" height="126" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="188" y="266" width="340" height="126" rx="7" fill="#ffffff" stroke="#e0b9b7" stroke-width="1.4"/>
    <rect x="536" y="266" width="334" height="126" rx="7" fill="#ffffff" stroke="#e0b9b7" stroke-width="1.4"/>
  </g>
  <text x="105" y="314" text-anchor="middle" font-size="13" fill="#8f3a36" filter="url(#rough2)">A 含赋值</text>
  <text x="105" y="338" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#rough2)">kind 1</text>
  <text x="105" y="362" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#rough2)">（fin(A) 是常数）</text>

  <text x="204" y="294" font-size="12.5" fill="#444" filter="url(#rough2)">前半照抄 A：info₊/₋ ← info₊/₋(A)</text>
  <text x="204" y="320" font-size="12.5" fill="#444" filter="url(#rough2)">post ← post(A) ⊕ sc(info(B, sign f), |f|)</text>
  <text x="204" y="346" font-size="12.5" fill="#444" filter="url(#rough2)">fin  ← 符号(B, 输入 f) · |f|　，f = fin(A)</text>
  <text x="204" y="374" font-size="12" fill="#8a6420" filter="url(#rough2)">这里常数直接代入，|f| 可以很大</text>

  <text x="552" y="294" font-size="12.5" fill="#444" filter="url(#rough2)">前半照抄 A；fin ← fin(B)</text>
  <text x="552" y="320" font-size="12.5" fill="#444" filter="url(#rough2)">post ← post(A) ⊕ ( sc(info(B, sign f), |f|)</text>
  <text x="552" y="344" font-size="12.5" fill="#444" filter="url(#rough2)">　　　　　　　　　　　　⊕ post(B) )</text>
  <text x="552" y="374" font-size="12" fill="#8a6420" filter="url(#rough2)">两段常数首尾相接</text>

  <text x="30" y="412" font-size="12.5" fill="#666" filter="url(#rough2)">四种情况都不超过 3 次「信息合并」，所以线段树的 push / 打标签都是 O(1)</text>
</svg>
