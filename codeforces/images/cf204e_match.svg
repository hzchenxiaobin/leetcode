<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="350" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">204E：匹配 + 倍增找“第一个 cnt ≥ k 的祖先”</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">对每个串做一次 SAM 匹配：维护 (当前状态 v, 已匹配长度 l)。每读入一个字符得到一个新的 v、l。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">以该位置结尾的后缀里，长度 ≤ 某值的都出现在 ≥k 个串中（后缀封闭），所以只需求最长的那一个。</text>
  <rect x="60" y="114" width="300" height="104" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="131" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">若 cnt[v] ≥ k：</text>
  <text x="74" y="152" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">  该位置贡献 l（全部长度都合法）</text>
  <text x="74" y="173" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">否则沿链接向上找第一个 cnt ≥ k 的</text>
  <text x="74" y="194" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">祖先 w（倍增 O(log)），</text>
  <text x="74" y="215" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">  贡献 = min(l, len[w])</text>
  <rect x="380" y="114" width="300" height="104" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="131" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">为什么可以取 min：</text>
  <text x="394" y="152" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">l 可能大于 len[w]，长度更大的</text>
  <text x="394" y="173" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">后缀属于更靠下的状态，cnt &lt; k；</text>
  <text x="394" y="194" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">长度 ≤ len[w] 的后缀都在 w 及以上，</text>
  <text x="394" y="215" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">cnt ≥ k。</text>
  <text x="60" y="250" text-anchor="start" font-size="11" fill="#2f5b34" font-weight="bold" filter="url(#rough2)">把所有位置的贡献相加，就是该串内满足条件的 (l, r) 对数。</text>
  <rect x="60" y="270" width="620" height="64" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="287" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">总复杂度：O(N log N)（N 为所有串长度之和）。实测 N=10⁵ 时 C++ 约 0.03 s。</text>
  <text x="74" y="308" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">注意 k &gt; n 时任何子串都不可能出现在 k 个串中，直接输出全 0。</text>
</svg>
