<svg xmlns="http://www.w3.org/2000/svg" width="740" height="320" viewBox="0 0 740 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1195"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="320" fill="#fafafa"/>
  <text x="370.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按难度排序后的状态转移</text>
  <path d="M 118.4 42 Q 370.0 48 621.6 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="370.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">y 的前驱只能是 y−k 或 y/k</text>
  <rect x="60" y="80" width="180" height="70" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">课程 i</text>
  <text x="150" y="130" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">作业量 x ∈ [aᵢ,bᵢ]</text>
  <rect x="300" y="80" width="140" height="70" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">前驱</text>
  <text x="370" y="130" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">y−k 或 y/k</text>
  <rect x="500" y="80" width="180" height="70" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="590" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#335478" filter="url(#rough2)">课程 j</text>
  <text x="590" y="130" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">y ∈ [aⱼ,bⱼ]</text>
  <line x1="242.0" y1="115.0" x2="298.0" y2="115.0" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="442.0" y1="115.0" x2="498.0" y2="115.0" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="370" y="190" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">要求 cᵢ &lt; cⱼ（严格递增）；每门课至多上一次</text>
  <text x="370" y="220" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">状态数 ≤ n·m·101，转移 O(m)，总计约 1.3×10⁷</text>
  <text x="370" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">答案 = max over 第 n 天的所有状态，回溯输出课表</text>
  <text x="370" y="285" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">bᵢ−aᵢ ≤ 100 是这题的关键约束</text>
</svg>
