<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="330" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">把连续区间 [T1, T2) 按小时切成三段</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">首小时尾段 + 若干整小时 + 末小时头段；整小时段能批量算，首尾两段各算一次</text>
  <g filter="url(#rough2)"><rect x="60" y="120" width="240" height="48" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="180.0" y="149" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">首小时：M1 … m−1</text>
  <g filter="url(#rough2)"><rect x="300" y="120" width="340" height="48" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="470.0" y="149" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">中间 H2−H1−1 个整小时</text>
  <g filter="url(#rough2)"><rect x="640" y="120" width="200" height="48" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="740.0" y="149" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">末小时：0 … M2</text>
  <text x="60" y="110" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">T1</text>
  <text x="840" y="110" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">T2</text>
  <text x="150" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">within(M1, m−1)</text>
  <text x="150" y="220" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">+ 一次回绕判定</text>
  <text x="470" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(H2−H1−1) × within(0, m−1)</text>
  <text x="470" y="220" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">+ #{H : 1 + t9(H) ≥ k − nz(m−1)}</text>
  <text x="740" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">within(0, M2)</text>
  <text x="740" y="220" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">（M2 = m−1 时含回绕）</text>
  <text x="450" y="262" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">within(l, r) = #{ M ∈ [l, r] ∩ [0, m−2] : t9(M) ≥ k−1 }</text>
  <text x="450" y="288" text-anchor="middle" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">跨天（T2 &lt; T1）时，答案 = count(T1, h·m) + count(0, T2)，两段独立计数后相加</text>
  <g filter="url(#rough2)"><path d="M 700 190 C 500 300, 250 300, 120 190" fill="none" stroke="#b06a1e" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arr)"/></g>
  <text x="410" y="318" text-anchor="middle" font-size="10.5" fill="#b06a1e" filter="url(#rough2)">跨天回绕</text>
</svg>
