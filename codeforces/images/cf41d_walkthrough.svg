<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="471"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：从第 3 行第 2 列出发，RL 走到底</text>
  <g filter="url(#rough2)">
    <rect x="200" y="60" width="90" height="56" rx="6" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="245" y="96" text-anchor="middle" font-size="18" fill="#2b2b2b">1</text>
    <rect x="310" y="60" width="90" height="56" rx="6" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="355" y="96" text-anchor="middle" font-size="18" fill="#2b2b2b">2</text>
    <rect x="420" y="60" width="90" height="56" rx="6" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="465" y="96" text-anchor="middle" font-size="18" fill="#2b2b2b">3</text>
    <rect x="200" y="130" width="90" height="56" rx="6" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="245" y="166" text-anchor="middle" font-size="18" fill="#2b2b2b">4</text>
    <rect x="310" y="130" width="90" height="56" rx="6" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="355" y="166" text-anchor="middle" font-size="18" fill="#2b2b2b">5</text>
    <rect x="420" y="130" width="90" height="56" rx="6" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="465" y="166" text-anchor="middle" font-size="18" fill="#2b2b2b">6</text>
    <rect x="200" y="200" width="90" height="56" rx="6" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="245" y="236" text-anchor="middle" font-size="18" fill="#2b2b2b">7</text>
    <rect x="310" y="200" width="90" height="56" rx="6" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="355" y="236" text-anchor="middle" font-size="18" fill="#2b2b2b">8</text>
    <rect x="420" y="200" width="90" height="56" rx="6" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="465" y="236" text-anchor="middle" font-size="18" fill="#2b2b2b">9</text>
  </g>
  <g fill="#8f3b37" filter="url(#rough2)">
    <rect x="200" y="60" width="90" height="56" rx="6" fill="none" stroke="#b85450" stroke-width="2.6"/>
    <rect x="420" y="130" width="90" height="56" rx="6" fill="none" stroke="#b85450" stroke-width="2.6"/>
    <rect x="310" y="200" width="90" height="56" rx="6" fill="none" stroke="#b85450" stroke-width="2.6"/>
  </g>
  <text x="470" y="50" text-anchor="middle" font-size="12" fill="#8f3b37" filter="url(#rough2)">顶行第 2 列 = 2</text>
  <text x="580" y="50" text-anchor="middle" font-size="12" fill="#8f3b37" filter="url(#rough2)">中间第 3 列 = 6（R）</text>
  <text x="120" y="330" text-anchor="middle" font-size="12" fill="#8f3b37" filter="url(#rough2)">底行第 2 列 = 8（L）</text>
  <text x="360" y="292" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">8 + 6 + 2 = 16，能被 k+1 = 2 整除 ✓</text>
  <text x="360" y="318" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">输出：16 / 起点列 2 / 移动串 RL（从下往上）。</text>
</svg>
