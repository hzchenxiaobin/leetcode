<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="85"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7a5b9a"/>
    </marker>
  </defs>

  <rect width="880" height="440" fill="#fafafa"/>

  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例二的主线：两步平移、两次对称，Anton 先无路可走</text>

  <!-- 网格：格距 70，原点 (100, 390) -->
  <g filter="url(#rough2)" stroke="#e6e6e6" stroke-width="1">
    <line x1="100" y1="390" x2="330" y2="390"/>
    <line x1="100" y1="390" x2="100" y2="150"/>
    <line x1="100" y1="320" x2="330" y2="320"/>
    <line x1="100" y1="250" x2="330" y2="250"/>
    <line x1="100" y1="180" x2="330" y2="180"/>
    <line x1="170" y1="390" x2="170" y2="150"/>
    <line x1="240" y1="390" x2="240" y2="150"/>
    <line x1="310" y1="390" x2="310" y2="150"/>
  </g>

  <!-- 走子路径 -->
  <g filter="url(#rough2)">
    <path d="M 110 381 L 160 328" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)"/>
    <path d="M 178 311 L 232 189" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)"/>
    <path d="M 252 190 Q 300 205 303 240" stroke="#7a5b9a" stroke-width="2" fill="none" marker-end="url(#arrp)"/>
    <path d="M 305 262 Q 258 246 251 199" stroke="#7a5b9a" stroke-width="2" fill="none" marker-end="url(#arrp)"/>

    <circle cx="100" cy="390" r="6" fill="#2b2b2b"/>
    <circle cx="170" cy="320" r="6" fill="#2f4a66"/>
    <circle cx="240" cy="180" r="6" fill="#2f5223"/>
    <circle cx="310" cy="250" r="6" fill="#8a2b28"/>

    <text x="84" y="412" font-size="11" fill="#444444">(0,0)</text>
    <text x="180" y="336" font-size="11" fill="#2f4a66">(1,1)</text>
    <text x="232" y="168" text-anchor="end" font-size="11" fill="#2f5223">(2,3)</text>
    <text x="322" y="256" font-size="11" fill="#8a2b28">(3,2)</text>

    <text x="60" y="352" font-size="10.5" fill="#2f4a66">① Anton +(1,1)</text>
    <text x="150" y="240" font-size="10.5" fill="#2f4a66">② Dasha +(1,2)</text>
    <text x="312" y="196" font-size="10.5" fill="#6b4f8a">③ Anton 对称</text>
    <text x="210" y="292" font-size="10.5" fill="#6b4f8a">④ Dasha 对称</text>
  </g>

  <!-- 右面板 -->
  <g filter="url(#rough2)">
    <rect x="470" y="64" width="380" height="318" rx="12" fill="#eef2f6" stroke="#446688" stroke-width="1.4"/>
    <text x="488" y="92" font-size="12.5" font-weight="bold" fill="#2f4a66">d = 4，初始 (0,0)</text>
    <text x="488" y="120" font-size="11.5" fill="#444444">① (1,1)：模长平方 2 ≤ 16</text>
    <text x="488" y="144" font-size="11.5" fill="#444444">② (2,3)：13 ≤ 16</text>
    <text x="488" y="168" font-size="11.5" fill="#444444">③ 对称 → (3,2)：13 ≤ 16</text>
    <text x="488" y="192" font-size="11.5" fill="#444444">④ 对称 → (2,3)：13 ≤ 16</text>
    <text x="488" y="222" font-size="11.5" font-weight="bold" fill="#8a2b28">⑤ Anton 只剩平移：</text>
    <text x="488" y="246" font-size="11.5" fill="#8a2b28">　(3,4)：25 &gt; 16　→ 输</text>
    <text x="488" y="270" font-size="11.5" fill="#8a2b28">　(3,5)：34 &gt; 16　→ 输</text>
    <text x="488" y="300" font-size="12" font-weight="bold" fill="#2f5223">⇒ Dasha 获胜</text>
    <text x="488" y="328" font-size="10.5" fill="#777777">对称不改变距离，两次对称都安全；</text>
    <text x="488" y="348" font-size="10.5" fill="#777777">但对称用完后就只剩会出界的平移。</text>
    <text x="488" y="370" font-size="10.5" fill="#777777">棋盘格距 70 像素，坐标即格点编号。</text>
  </g>

  <text x="440" y="420" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">对称本身不致命，致命的是"对称用完之后被迫平移出界"。</text>
</svg>
