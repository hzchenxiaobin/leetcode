<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">每个顶点只需带两个数：到「左门 1」和「右门 F(k)」的距离</text>
  <path d="M 66 42 Q 360 48 654 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 递推 -->
  <g filter="url(#rough2)">
    <rect x="60" y="70" width="600" height="130" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="360" y="94" text-anchor="middle" font-size="13.5" fill="#22314a" filter="url(#rough2)">
    v ∈ A（v ≤ F(k−1)）时，从 k−1 层的两个值推 k 层：
  </text>
  <text x="360" y="124" text-anchor="middle" font-size="13" fill="#22314a" filter="url(#rough2)">
    d1_k(v) = min( d1(v), dF(v) + 2 )      ← 多绕 u 一次（门 → u → 1）
  </text>
  <text x="360" y="154" text-anchor="middle" font-size="13" fill="#22314a" filter="url(#rough2)">
    dF_k(v) = min( d1(v), dF(v) ) + 1 + g(k−2)
  </text>
  <text x="360" y="182" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">
    右边那一项：先到任一扇门，跨一条胶水边到 u，再在 B 内从 u 走到末点 = g(k−2)
  </text>

  <!-- v in B -->
  <g filter="url(#rough2)">
    <rect x="60" y="212" width="600" height="76" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="360" y="236" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">
    v ∈ B（v &gt; F(k−1)）时，令 v' = v − F(k−1) ∈ D(k−2)：
  </text>
  <text x="360" y="262" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">
    d1_k(v) = d1(v') + 1（走到 u 再跨边到 1），   dF_k(v) = dF(v')
  </text>

  <!-- g -->
  <g filter="url(#rough2)">
    <rect x="60" y="300" width="600" height="58" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="360" y="324" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">
    g(k) = dist(1, 末点) = 1 + g(k−2)，g(0)=0，g(1)=1 ⇒ g(k) = ⌈k/2⌉
  </text>
  <text x="360" y="348" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">
    直觉：每一步都靠「1 — u — F(k−1)」这条 2 步捷径往右挪
  </text>

  <!-- 查询 -->
  <g filter="url(#rough2)">
    <rect x="60" y="370" width="600" height="46" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="74" y="392" font-size="12.5" fill="#333" filter="url(#rough2)">
    查询 (a,b)：沿「共同链」一层层往下；同一块就记一个绕路候选 min(p,q)+2，分属两块就直接算。
  </text>
  <text x="74" y="410" font-size="11.5" fill="#556" filter="url(#rough2)">
    链长 O(n)，每个顶点 O(n) 预处理两个门距离，单次查询 O(n)。
  </text>
</svg>
