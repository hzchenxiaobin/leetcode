<svg xmlns="http://www.w3.org/2000/svg" width="880" height="432" viewBox="0 0 880 432"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="99"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="432" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">七个官方样例的判定</text>
  <text x="80" y="96" text-anchor="start" font-size="11.5" fill="#555555" font-weight="bold" filter="url(#rough2)">输入</text>
  <text x="400" y="96" text-anchor="start" font-size="11.5" fill="#555555" font-weight="bold" filter="url(#rough2)">判断</text>
  <text x="740" y="96" text-anchor="start" font-size="11.5" fill="#555555" font-weight="bold" filter="url(#rough2)">输出</text>
  <g filter="url(#rough2)"><rect x="70" y="112" width="310" height="34" rx="3" fill="#d7ecd0" fill-opacity="0.5" stroke="#99aabb" stroke-width="1.1"/></g>
  <text x="80" y="134" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">0.0</text>
  <text x="400" y="134" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">末位 0≠9，首位小数 0&lt;5</text>
  <g filter="url(#rough2)"><rect x="720" y="112" width="120" height="34" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <text x="780" y="134" text-anchor="middle" font-size="10.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="70" y="154" width="310" height="34" rx="3" fill="#cfe0f5" fill-opacity="0.5" stroke="#99aabb" stroke-width="1.1"/></g>
  <text x="80" y="176" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">1.49</text>
  <text x="400" y="176" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">末位 1≠9，首位小数 4&lt;5</text>
  <g filter="url(#rough2)"><rect x="720" y="154" width="120" height="34" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <text x="780" y="176" text-anchor="middle" font-size="10.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="70" y="196" width="310" height="34" rx="3" fill="#f6e3c4" fill-opacity="0.5" stroke="#99aabb" stroke-width="1.1"/></g>
  <text x="80" y="218" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">1.50</text>
  <text x="400" y="218" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">末位 1≠9，首位小数 5≥5 → 末位+1</text>
  <g filter="url(#rough2)"><rect x="720" y="196" width="120" height="34" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <text x="780" y="218" text-anchor="middle" font-size="10.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="70" y="238" width="310" height="34" rx="3" fill="#f6d9d7" fill-opacity="0.5" stroke="#99aabb" stroke-width="1.1"/></g>
  <text x="80" y="260" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">2.71828182845904523536</text>
  <text x="400" y="260" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">首位小数 7≥5</text>
  <g filter="url(#rough2)"><rect x="720" y="238" width="120" height="34" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <text x="780" y="260" text-anchor="middle" font-size="10.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="70" y="280" width="310" height="34" rx="3" fill="#e8e8e8" fill-opacity="0.5" stroke="#99aabb" stroke-width="1.1"/></g>
  <text x="80" y="302" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">3.14159265358979323846</text>
  <text x="400" y="302" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">首位小数 1&lt;5</text>
  <g filter="url(#rough2)"><rect x="720" y="280" width="120" height="34" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <text x="780" y="302" text-anchor="middle" font-size="10.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="70" y="322" width="310" height="34" rx="3" fill="#d7ecd0" fill-opacity="0.5" stroke="#99aabb" stroke-width="1.1"/></g>
  <text x="80" y="344" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">12345678901234567890.1</text>
  <text x="400" y="344" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">首位小数 1&lt;5，原样输出</text>
  <g filter="url(#rough2)"><rect x="720" y="322" width="120" height="34" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <text x="780" y="344" text-anchor="middle" font-size="10.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">12345678901234567890</text>
  <g filter="url(#rough2)"><rect x="70" y="364" width="310" height="34" rx="3" fill="#cfe0f5" fill-opacity="0.5" stroke="#99aabb" stroke-width="1.1"/></g>
  <text x="80" y="386" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">123456789123456789.999</text>
  <text x="400" y="386" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">末位是 9 → 交给 Vasilisa</text>
  <g filter="url(#rough2)"><rect x="720" y="364" width="120" height="34" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <text x="780" y="386" text-anchor="middle" font-size="10.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">GOTO Vasilisa.</text>
</svg>
