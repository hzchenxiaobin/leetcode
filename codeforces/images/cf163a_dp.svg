<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="721"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">按「子串末尾 i、子序列末尾 j」对齐计数</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">f[i][j] = [s_i=t_j]·(1 + Σ_{k&lt;j} f[i−1][k])</text>
  <text x="90" y="100" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">s:</text>
  <g filter="url(#rough2)"><rect x="150" y="84" width="60" height="40" rx="3" fill="#cfe0f5" fill-opacity="0.5" stroke="#446688" stroke-width="1.4"/></g>
  <text x="180" y="110" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="220" y="84" width="60" height="40" rx="3" fill="#cfe0f5" fill-opacity="0.5" stroke="#446688" stroke-width="1.4"/></g>
  <text x="250" y="110" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="90" y="170" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">t:</text>
  <g filter="url(#rough2)"><rect x="150" y="154" width="52" height="40" rx="3" fill="#ffffff" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="176" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="210" y="154" width="52" height="40" rx="3" fill="#ffffff" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="236" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="270" y="154" width="52" height="40" rx="3" fill="#dcecd2" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="296" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="330" y="154" width="52" height="40" rx="3" fill="#ffffff" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="356" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="390" y="154" width="52" height="40" rx="3" fill="#ffffff" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="416" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="450" y="154" width="52" height="40" rx="3" fill="#ffffff" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="476" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="560" y="110" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">末尾相等才可延伸</text>
  <text x="560" y="146" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">前缀和把 Σ 降到 O(1)</text>
  <text x="560" y="182" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">答案 = 所有 f 之和</text>
  <text x="450" y="248" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">按首字符对齐会写错递推：必须按末字符对齐</text>
</svg>
