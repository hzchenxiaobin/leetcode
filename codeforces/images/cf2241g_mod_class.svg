<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="34" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">可达集：b₁ 固定；b₂ 落在 b₂ + b₁ℤ，b_j 落在 a_j + g_{j-1}ℤ</text>
  <text x="320" y="58" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">后面的步长 g_{j-1} 一定整除 d，所以「够密」，可以塞进长度 d 的区间</text>

  <!-- b2 候选说明 -->
  <text x="120" y="150" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">b₂ 候选（间距 = b₁）</text>

  <!-- 允许区间 -->
  <rect x="200" y="164" width="240" height="56" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" opacity="0.8" filter="url(#rough2)"/>
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">允许区间 [b₁ − d, b₁ + d]</text>

  <!-- 数轴 -->
  <line x1="60" y1="196" x2="600" y2="196" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 区间端点刻度 -->
  <line x1="200" y1="212" x2="200" y2="228" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="440" y1="212" x2="440" y2="228" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="176" y="246" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">b₁ − d</text>
  <text x="464" y="246" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">b₁ + d</text>

  <!-- b1 -->
  <circle cx="320" cy="196" r="8" fill="#446688" filter="url(#rough2)"/>
  <text x="320" y="246" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">b₁ = a_l（固定）</text>

  <!-- b2 候选点 -->
  <circle cx="80" cy="196" r="6" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="200" cy="196" r="6" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="440" cy="196" r="6" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="560" cy="196" r="6" fill="#b85450" filter="url(#rough2)"/>

  <!-- bj 候选点（更密） -->
  <circle cx="240" cy="196" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="280" cy="196" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="360" cy="196" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="400" cy="196" r="4" fill="#4a7a3a" filter="url(#rough2)"/>

  <path d="M404,290 L404,212" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)"
        fill="none" filter="url(#rough2)"/>
  <text x="316" y="306" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">b_j（j ≥ 3）：a_j + g_{j-1}ℤ，步长 g_{j-1} | d</text>

  <!-- 结论 -->
  <rect x="76" y="330" width="488" height="44" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="352" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">各位置独立取区间内的代表元</text>
  <text x="320" y="368" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">⇒ 极差正好做到 d = min(r, b₁ − r)</text>
</svg>
