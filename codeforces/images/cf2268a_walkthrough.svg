<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：两种收尾方式各走一遍</text>
  <path d="M 200 41 Q 390 48 580 41" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- ============ 表 1 ============ -->
  <text x="60" y="60" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 1：n = 6，k = 3，a = [1, 4, 8, 2, 6, 3]，total = 24</text>

  <rect x="60" y="68" width="560" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="60" y="96" width="560" height="28" fill="#fdfdfd" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="60" y="124" width="560" height="28" fill="#f4f8fd" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="60" y="152" width="560" height="28" fill="#fdfdfd" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 116 68 L 116 180 M 178 68 L 178 180 M 240 68 L 240 180 M 408 68 L 408 180 M 514 68 L 514 180"
        stroke="#9db4cc" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="88" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">层</text>
  <text x="147" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">l</text>
  <text x="209" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">r</text>
  <text x="324" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">两端取值</text>
  <text x="461" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">留下的</text>
  <text x="567" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">keep 累计</text>

  <text x="88" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="147" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a₁ = 1</text>
  <text x="209" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a₆ = 3</text>
  <text x="324" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{1, 3}</text>
  <text x="461" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="567" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="88" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="147" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a₂ = 4</text>
  <text x="209" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a₅ = 6</text>
  <text x="324" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{4, 6}</text>
  <text x="461" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <text x="567" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 + 4 = 5</text>

  <text x="88" y="171" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">结束</text>
  <text x="147" y="171" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">—</text>
  <text x="209" y="171" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">—</text>
  <text x="324" y="171" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">kk = 1，没有下一层</text>
  <text x="461" y="171" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">—</text>
  <text x="567" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <rect x="60" y="188" width="330" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="209" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">答案 = 24 − 5 = 19，与官方输出一致</text>

  <!-- ============ 表 2 ============ -->
  <text x="60" y="244" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">自造样例：n = 5，k = 4，a = [10, 2, 7, 3, 9]，total = 31（n &lt; 2k−2）</text>

  <rect x="60" y="252" width="560" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="60" y="280" width="560" height="28" fill="#fdfdfd" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="60" y="308" width="560" height="28" fill="#fffdf5" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="60" y="336" width="560" height="28" fill="#fdfdfd" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 116 252 L 116 364 M 178 252 L 178 364 M 240 252 L 240 364 M 408 252 L 408 364 M 514 252 L 514 364"
        stroke="#dcc08a" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="88" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">层</text>
  <text x="147" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">l</text>
  <text x="209" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">r</text>
  <text x="324" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">两端取值</text>
  <text x="461" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">留下的</text>
  <text x="567" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">keep 累计</text>

  <text x="88" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="147" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a₁ = 10</text>
  <text x="209" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a₅ = 9</text>
  <text x="324" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{10, 9}</text>
  <text x="461" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">9</text>
  <text x="567" y="299" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>

  <text x="88" y="327" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="147" y="327" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a₂ = 2</text>
  <text x="209" y="327" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a₄ = 3</text>
  <text x="324" y="327" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{2, 3}</text>
  <text x="461" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <text x="567" y="327" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9 + 2 = 11</text>

  <text x="88" y="355" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">结束</text>
  <text x="147" y="355" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">l = 3</text>
  <text x="209" y="355" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">r = 3</text>
  <text x="324" y="355" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">1 &lt; kk = 2 ⇒ 中段留下</text>
  <text x="461" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">+7</text>
  <text x="567" y="355" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11 + 7 = 18</text>

  <rect x="60" y="372" width="330" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="393" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">答案 = 31 − 18 = 13（暴力验证一致）</text>

  <rect x="40" y="414" width="700" height="48" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="390" y="434" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">两种收尾：n ≥ 2k−2 时层数封顶 k−1，kk 自然降到 1，中段被删光；</text>
  <text x="390" y="453" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">n &lt; 2k−2 时先碰到「长度 &lt; kk」，剩余中段整段留下。</text>
</svg>
