<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="840" height="560" fill="#fafafa"/>

  <text x="420" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3 演算：边解码边维护颜色类</text>
  <path d="M 250 44 Q 420 52 590 44" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="420" y="66" text-anchor="middle" font-size="12.5" fill="#5b5b5b" filter="url(#rough2)">a = [18, 12, 17, 3, 6, 4, 13, 11, 9]，s_i = a_i ⊕ k_i，琥珀色行是关键步骤</text>
  <rect x="24" y="80" width="766" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50.0" y="102" text-anchor="middle" font-size="13.0" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">i</text>
  <text x="113.0" y="102" text-anchor="middle" font-size="13.0" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a_i</text>
  <text x="187.0" y="102" text-anchor="middle" font-size="13.0" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">k_i</text>
  <text x="261.0" y="102" text-anchor="middle" font-size="13.0" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">s_i</text>
  <text x="508.0" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">颜色类（处理完前 i 个后）</text>
  <text x="754.0" y="102" text-anchor="middle" font-size="13.0" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">k</text>
  <rect x="24" y="114" width="766" height="34" rx="7" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="50.0" y="136.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">1</text>
  <text x="113.0" y="136.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">18</text>
  <text x="187.0" y="136.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">0</text>
  <text x="261.0" y="136.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">18</text>
