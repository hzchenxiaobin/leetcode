  <text x="187.0" y="174.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">1</text>
  <text x="261.0" y="174.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">13</text>
  <text x="508.0" y="174.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">{18, 13}</text>
  <text x="754.0" y="174.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="24" y="190" width="766" height="34" rx="7" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="50.0" y="212.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">3</text>
  <text x="113.0" y="212.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">17</text>
  <text x="187.0" y="212.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">1</text>
  <text x="261.0" y="212.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">16</text>
  <text x="508.0" y="212.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">{18, 13, 16}</text>
  <text x="754.0" y="212.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="24" y="228" width="766" height="34" rx="7" fill="#f4f6fa" stroke="#c9cfd8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="50.0" y="250.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">4</text>
  <text x="113.0" y="250.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">3</text>
  <text x="187.0" y="250.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">1</text>
  <text x="261.0" y="250.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">2</text>
  <text x="508.0" y="250.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">{18, 13, 16} | {2}</text>
  <text x="754.0" y="250.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">2</text>
  <rect x="24" y="266" width="766" height="34" rx="7" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="50.0" y="288.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">5</text>
  <text x="113.0" y="288.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">6</text>
  <text x="187.0" y="288.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">2</text>
  <text x="261.0" y="288.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">4</text>
  <text x="508.0" y="288.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">{18, 13, 16, 4} | {2}</text>
  <text x="754.0" y="288.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">2</text>
  <rect x="24" y="304" width="766" height="34" rx="7" fill="#f4f6fa" stroke="#c9cfd8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="50.0" y="326.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">6</text>
  <text x="113.0" y="326.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">4</text>
  <text x="187.0" y="326.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">2</text>
  <text x="261.0" y="326.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">6</text>
  <text x="508.0" y="326.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">{18, 13, 16, 4} | {2, 6}</text>
  <text x="754.0" y="326.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">2</text>
  <rect x="24" y="342" width="766" height="34" rx="7" fill="#ffffff" stroke="#c9cfd8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="50.0" y="364.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">7</text>
  <text x="113.0" y="364.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">13</text>
  <text x="187.0" y="364.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">2</text>
  <text x="261.0" y="364.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">15</text>
  <text x="508.0" y="364.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">{18, 13, 16, 4} | {2, 6, 15}</text>
  <text x="754.0" y="364.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">2</text>
  <rect x="24" y="380" width="766" height="48" rx="7" fill="#fff8e1" stroke="#c9cfd8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="50.0" y="402.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">8</text>
  <text x="113.0" y="402.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">11</text>
  <text x="187.0" y="402.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">2</text>
  <text x="261.0" y="402.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">9</text>
  <text x="508.0" y="402.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">{13, 16, 4, 6} | {2, 15, 18, 9}</text>
  <text x="754.0" y="402.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="508.0" y="421.0" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">一次交换失败 → 走增广路 BFS 重排</text>
  <rect x="24" y="432" width="766" height="48" rx="7" fill="#fff8e1" stroke="#c9cfd8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="50.0" y="454.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">9</text>
  <text x="113.0" y="454.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">9</text>
  <text x="187.0" y="454.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">2</text>
  <text x="261.0" y="454.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">11</text>
  <text x="508.0" y="454.0" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#333333" filter="url(#rough2)">{13, 16, 4, 6} | {2, 15, 18, 9} | {11}</text>
  <text x="754.0" y="454.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>
  <text x="508.0" y="473.0" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">两个类都满了 → k 增到 3</text>
  <text x="420" y="510" text-anchor="middle" font-size="12.5" fill="#5b5b5b" filter="url(#rough2)">最终 k = 3，输出三行：每行先给该色石堆数，再给这些石堆的大小</text>
  <text x="420" y="532" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">注意 i = 8 时 9 同时落在两个类的张成里，必须靠一般的增广路重排才能保持 k = 2</text>
</svg>
