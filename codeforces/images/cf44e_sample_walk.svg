<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="aarr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：k=3，a=2，b=5，L=11，贪心给出 5 / 4 / 2</text>
  <path d="M 90 40 Q 360 46 630 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="11.5" font-weight="bold" fill="#2f4a66">
    <text x="60" y="72" text-anchor="middle">轮</text>
    <text x="130" y="72" text-anchor="middle">r（后面几行）</text>
    <text x="254" y="72" text-anchor="middle">上限 R−r·a</text>
    <text x="378" y="72" text-anchor="middle">take=min(b,·)</text>
    <text x="512" y="72" text-anchor="middle">输出</text>
    <text x="636" y="72" text-anchor="middle">pos</text>
  </g>
  <line x1="30" y1="82" x2="690" y2="82" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12">
    <text x="60" y="112" text-anchor="middle" fill="#2b2b2b">1</text>
    <text x="130" y="112" text-anchor="middle" fill="#2b2b2b">2</text>
    <text x="254" y="112" text-anchor="middle" fill="#2b2b2b">11 − 4 = 7</text>
    <text x="378" y="112" text-anchor="middle" fill="#2f5223">min(5, 7) = 5</text>
    <text x="512" y="112" text-anchor="middle" fill="#2f5223">abrak</text>
    <text x="636" y="112" text-anchor="middle" fill="#2b2b2b">5</text>

    <text x="60" y="146" text-anchor="middle" fill="#2b2b2b">2</text>
    <text x="130" y="146" text-anchor="middle" fill="#2b2b2b">1</text>
    <text x="254" y="146" text-anchor="middle" fill="#2b2b2b">6 − 2 = 4</text>
    <text x="378" y="146" text-anchor="middle" fill="#8a6015">min(5, 4) = 4</text>
    <text x="512" y="146" text-anchor="middle" fill="#8a6015">adab</text>
    <text x="636" y="146" text-anchor="middle" fill="#2b2b2b">9</text>

    <text x="60" y="180" text-anchor="middle" fill="#2b2b2b">3</text>
    <text x="130" y="180" text-anchor="middle" fill="#2b2b2b">0</text>
    <text x="254" y="180" text-anchor="middle" fill="#2b2b2b">2 − 0 = 2</text>
    <text x="378" y="180" text-anchor="middle" fill="#2f4a66">min(5, 2) = 2</text>
    <text x="512" y="180" text-anchor="middle" fill="#2f4a66">ra</text>
    <text x="636" y="180" text-anchor="middle" fill="#2b2b2b">11</text>
  </g>

  <line x1="30" y1="192" x2="690" y2="192" stroke="#9bb0c4" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="214" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">得到 abrak / adab / ra，长度 5、4、2 均在 [2,5] 内，拼接即原串 → 合法</text>

  <!-- 下方：样例 2 -->
  <rect x="40" y="236" width="640" height="122" rx="12" fill="#fdecea" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="262" font-size="12.5" font-weight="bold" fill="#8f3a34" filter="url(#rough2)">样例 2：k=4，a=1，b=2，L=11</text>
  <text x="60" y="286" font-size="11.5" fill="#7a3a34" filter="url(#rough2)">最少能放 4·1 = 4 个字符，最多只能放 4·2 = 8 个字符，而串长是 11。</text>
  <text x="60" y="308" font-size="11.5" fill="#7a3a34" filter="url(#rough2)">11 &gt; 8 = k·b，不等式右边被破坏 → 判为无解。</text>
  <text x="60" y="334" font-size="12.5" font-weight="bold" fill="#8f3a34" filter="url(#rough2)">输出「No solution」，与官方一致。</text>

  <text x="360" y="386" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">样例 1 的官方答案是 ab / rakad / abra（长 2/5/4），与本程序的 5/4/2 不同，但检查器只要求合法性。</text>
  <text x="360" y="408" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">这说明「多解」题必须用 checker 验收：比较行数 k、每行长度上下界、以及拼接后是否等于原串。</text>
</svg>
