<svg xmlns="http://www.w3.org/2000/svg" width="800" height="530" viewBox="0 0 800 530"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="800" height="530" fill="#fafafa"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">翻转位置的三种命运</text>
  <path d="M 288 42 Q 400 49 512 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 原串切成 k 段 -->
  <text x="112" y="84" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">s =</text>
  <rect x="150" y="62" width="36" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="186" y="62" width="36" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="222" y="62" width="36" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="258" y="62" width="36" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="294" y="62" width="36" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="330" y="62" width="36" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="366" y="62" width="36" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="402" y="62" width="36" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="438" y="62" width="36" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="85" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="204" y="85" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="240" y="85" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="276" y="85" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="312" y="85" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="348" y="85" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="384" y="85" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="420" y="85" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="456" y="85" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="486" y="85" font-size="12" fill="#66788c" filter="url(#rough2)">k = 5 段</text>

  <!-- 段划分括号 -->
  <path d="M 154 104 L 182 104" stroke="#446688" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <path d="M 190 104 L 254 104" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <path d="M 262 104 L 362 104" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <path d="M 370 104 L 398 104" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <path d="M 406 104 L 470 104" stroke="#446688" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <text x="168" y="124" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="222" y="124" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="312" y="124" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="384" y="124" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="438" y="124" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="486" y="124" font-size="11.5" fill="#66788c" filter="url(#rough2)">段长 L[1..5]</text>

  <text x="400" y="152" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">压缩串 c = 10101；翻转位置 p ∈ [2, n−1] 落在段内何处，决定结果的长度</text>

  <!-- ① 段边界 -->
  <rect x="24" y="168" width="752" height="94" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <ellipse cx="52" cy="198" rx="16" ry="15" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="204" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="78" y="192" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">翻转「段边界」，且该段长 ≥ 2 → 压缩串一字不改</text>
  <text x="78" y="216" font-size="11.8" fill="#2f4a66" filter="url(#rough2)">该段还剩至少一个字符，翻出的异色并入左右相邻段，段序列不变</text>
  <text x="78" y="240" font-size="11.8" fill="#3c5e2e" filter="url(#rough2)">例：p = 2（第 2 段左端）100111011 → 110111011，压缩 = 10101</text>
  <rect x="636" y="186" width="128" height="56" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="700" y="208" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">长度 k = 5</text>
  <text x="700" y="228" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">与不翻转相同</text>

  <!-- ② 独苗段 -->
  <rect x="24" y="274" width="752" height="94" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <ellipse cx="52" cy="304" rx="16" ry="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <text x="78" y="298" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">翻转「独苗段」（L[j] = 1 且 2 ≤ j ≤ k−1）→ 少 2 个字符</text>
  <text x="78" y="322" font-size="11.8" fill="#3c5e2e" filter="url(#rough2)">整段消失，左右两段又同色而合并；压缩串 = c 砍掉末两位，长度 k − 2</text>
  <text x="78" y="346" font-size="11.8" fill="#2f4a66" filter="url(#rough2)">例：p = 7（第 4 段是独苗）100111011 → 100111111，压缩 = 101</text>
  <rect x="636" y="292" width="128" height="56" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="700" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">长度 k − 2 = 3</text>
  <text x="700" y="334" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">新串，短两位</text>

  <!-- ③ 段内部 -->
  <rect x="24" y="380" width="752" height="94" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <ellipse cx="52" cy="410" rx="16" ry="15" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="416" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>
  <text x="78" y="404" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">翻转「段内部」，该段长 ≥ 3 → 多出 2 个字符</text>
  <text x="78" y="428" font-size="11.8" fill="#8a6015" filter="url(#rough2)">段被劈成两半，中间夹一个孤立异色格；压缩串 = c 末尾补两位，长度 k + 2</text>
  <text x="78" y="452" font-size="11.8" fill="#2f4a66" filter="url(#rough2)">例：p = 5（第 3 段正中）100111011 → 100101011，压缩 = 1010101</text>
  <rect x="636" y="398" width="128" height="56" rx="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="700" y="420" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">长度 k + 2 = 7</text>
  <text x="700" y="440" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">新串，长两位</text>

  <text x="400" y="498" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">三种结果都以 s 的首字符开头、相邻互不相同（交替串）⇒ 由「首字符 + 长度」唯一确定</text>
  <text x="400" y="516" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">k−2、k、k+2 两两不等 ⇒ 答案只可能是 1、2 或 3</text>
</svg>
