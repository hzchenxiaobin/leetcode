<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="452" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">一台仪器的三种状态：能不能一直 +1？</text>

  <!-- 自由态 -->
  <rect x="24" y="52" width="228" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="138" y="74" text-anchor="middle" font-size="13" fill="#33502a" filter="url(#rough2)">自由态：a&gt;b 或 a&gt;c 或 b&gt;c</text>
  <rect x="24" y="84" width="228" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="38" y="110" font-size="11.5" fill="#33502a" filter="url(#rough2)">有一条不等式只依赖另两台</text>
  <text x="38" y="134" font-size="11.5" fill="#33502a" filter="url(#rough2)">重复对应操作，另两台不动</text>
  <text x="38" y="158" font-size="11.5" fill="#33502a" filter="url(#rough2)">⇒ 每步净 +1，永不失效</text>
  <text x="38" y="186" font-size="11.5" fill="#33502a" filter="url(#rough2)">m 步后：S + m</text>
  <text x="38" y="216" font-size="11" fill="#4a7a3a" filter="url(#rough2)">单步最多 +1，故 S+m 即上界</text>

  <!-- 有序态 -->
  <rect x="266" y="52" width="228" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="380" y="74" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">有序态：a ≤ b ≤ c 且不全等</text>
  <rect x="266" y="84" width="228" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="110" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">三个增量都是 0 或 −1</text>
  <text x="280" y="134" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">想涨，必须先花 e 步逃出去</text>
  <text x="280" y="158" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">逃生途中每步 −1，之后 +1</text>
  <text x="280" y="186" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">f(X) = X − S + 2e</text>
  <text x="280" y="216" font-size="11" fill="#d6a040" filter="url(#rough2)">先跌 e 再爬，漏斗口是双倍价</text>

  <!-- 冻结态 -->
  <rect x="508" y="52" width="228" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="622" y="74" text-anchor="middle" font-size="13" fill="#8a3030" filter="url(#rough2)">冻结态：a = b = c</text>
  <rect x="508" y="84" width="228" height="170" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="522" y="110" font-size="11.5" fill="#8a3030" filter="url(#rough2)">三个 sgn 恒等于 0</text>
  <text x="522" y="134" font-size="11.5" fill="#8a3030" filter="url(#rough2)">每次操作只是空转</text>
  <text x="522" y="158" font-size="11.5" fill="#8a3030" filter="url(#rough2)">读数永远不变，救不回来</text>
  <text x="522" y="186" font-size="11.5" fill="#8a3030" filter="url(#rough2)">X &gt; S 时 f(X) = ∞</text>
  <text x="522" y="216" font-size="11" fill="#b85450" filter="url(#rough2)">它是整个答案的硬上界</text>

  <!-- 单台代价公式 -->
  <rect x="24" y="266" width="712" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="296" text-anchor="middle" font-size="12.5" fill="#2f4f6f" filter="url(#rough2)">f(X) = 0（X ≤ S）　|　X − S（自由）　|　X − S + 2e（有序）　|　∞（冻结且 X &gt; S）</text>

  <!-- 三个操作的增量表 -->
  <rect x="64" y="328" width="72" height="28" fill="#c9dbf5" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="100" y="347" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">操作</text>
  <rect x="136" y="328" width="96" height="28" fill="#c9dbf5" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="184" y="347" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">改哪个读数</text>
  <rect x="232" y="328" width="240" height="28" fill="#c9dbf5" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="352" y="347" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">增量为 +1 的条件</text>
  <rect x="472" y="328" width="228" height="28" fill="#c9dbf5" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="586" y="347" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">增量为 −1 的条件</text>

  <rect x="64" y="356" width="72" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="375" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">op1</text>
  <rect x="136" y="356" width="96" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="375" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">c</text>
  <rect x="232" y="356" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="375" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">a &gt; b</text>
  <rect x="472" y="356" width="228" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="586" y="375" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">a &lt; b</text>

  <rect x="64" y="384" width="72" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="403" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">op2</text>
  <rect x="136" y="384" width="96" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="403" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">b</text>
  <rect x="232" y="384" width="240" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="403" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">a &gt; c</text>
  <rect x="472" y="384" width="228" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="586" y="403" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">a &lt; c</text>

  <rect x="64" y="412" width="72" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="431" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">op3</text>
  <rect x="136" y="412" width="96" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="431" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">a</text>
  <rect x="232" y="412" width="240" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="431" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">b &gt; c</text>
  <rect x="472" y="412" width="228" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="586" y="431" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">b &lt; c</text>
</svg>
