<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="250" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三集合的奇偶账</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">用 0 吸收多余负数</text>
  <text x="150" y="100" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">集合 1 积 &lt; 0：放 1 个负数（或 3 个）</text>
  <text x="150" y="138" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">集合 2 积 &gt; 0：剩下的负数个数必须为偶，正数随便放</text>
  <text x="150" y="176" text-anchor="start" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">集合 3 积 = 0：必须含 0；若剩余负数个数为奇，把多出的负数也丢进集合 3</text>
</svg>
