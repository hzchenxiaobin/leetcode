<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：先卡阈值，再修一个坏点</text>
  <path d="M 145 44 Q 360 50 575 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 开始 -->
  <rect x="255" y="62" width="210" height="44" rx="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="89" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 n（多测循环）</text>
  <path d="M 360 106 L 360 130" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="360,132 492,186 360,240 228,186" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">n &lt; 4 ?</text>

  <!-- 是分支 -->
  <path d="M 228 186 L 168 186" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="196" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="22" y="160" width="140" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="92" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#a33b36" filter="url(#rough2)">输出 -1</text>
  <text x="92" y="200" text-anchor="middle" font-size="11" fill="#7a2f2b" filter="url(#rough2)">n = 1, 2, 3</text>

  <!-- 否分支 -->
  <path d="M 360 240 L 360 264" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="378" y="258" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="255" y="266" width="210" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="286" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">令 p_i = i</text>
  <text x="360" y="304" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">（恒等排列，i ≥ 2 已是 i²）</text>

  <path d="M 360 314 L 360 336" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="255" y="338" width="210" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">交换 p₁ 与 p₄</text>
  <text x="360" y="376" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">得 p = (4, 2, 3, 1, 5, …, n)</text>

  <path d="M 360 386 L 360 408" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="255" y="410" width="210" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="436" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">输出 p，进入下一组</text>

  <!-- 旁注 -->
  <rect x="500" y="300" width="196" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="598" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">修补为什么成立</text>
  <text x="598" y="344" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">1 × 4 = 4 = 2²</text>
  <text x="598" y="362" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">4 × 1 = 4 = 2²</text>
  <text x="598" y="379" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">只动了两个位置</text>
  <path d="M 500 343 Q 470 343 466 356" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <rect x="22" y="410" width="196" height="42" rx="8" fill="#fafafa" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="120" y="430" text-anchor="middle" font-size="11.5" fill="#a33b36" filter="url(#rough2)">注意：反转排列在 n 为质数时失败</text>
  <text x="120" y="445" text-anchor="middle" font-size="11" fill="#a33b36" filter="url(#rough2)">如 n = 5：1 × 5 = 5 是质数</text>
</svg>
