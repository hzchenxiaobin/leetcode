<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：全部样例 + 一组「杀掉非众数反而更亏」的反例</text>
  <path d="M 118 42 Q 390 49 662 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="24" y="62" width="732" height="34" rx="6" fill="#eef2f6" stroke="#8c9bab" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="34" y="84" font-size="11" fill="#41576d" filter="url(#rough2)">数组 a</text>
  <text x="264" y="84" text-anchor="middle" font-size="11" fill="#41576d" filter="url(#rough2)">S</text>
  <text x="307" y="84" text-anchor="middle" font-size="11" fill="#41576d" filter="url(#rough2)">f</text>
  <text x="357" y="84" text-anchor="middle" font-size="11" fill="#41576d" filter="url(#rough2)">r+2</text>
  <text x="407" y="84" text-anchor="middle" font-size="11" fill="#41576d" filter="url(#rough2)">K</text>
  <text x="462" y="84" text-anchor="middle" font-size="11" fill="#41576d" filter="url(#rough2)">损失</text>
  <text x="534" y="84" text-anchor="middle" font-size="11" fill="#41576d" filter="url(#rough2)">答案</text>
  <text x="580" y="84" font-size="11" fill="#41576d" filter="url(#rough2)">一组最优出牌</text>

  <!-- 行 1 -->
  <rect x="24" y="102" width="732" height="40" rx="5" fill="#ffffff" stroke="#dbe3ea" stroke-width="1" filter="url(#rough2)"/>
  <text x="34" y="128" font-size="12" fill="#2b2b2b" filter="url(#rough2)">10 5 10 10（样例 2）</text>
  <text x="264" y="128" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">35</text>
  <text x="307" y="128" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="357" y="128" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="407" y="128" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="462" y="128" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="534" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">35</text>
  <text x="580" y="128" font-size="11.5" fill="#446688" filter="url(#rough2)">10,5,10,10</text>

  <!-- 行 2 -->
  <rect x="24" y="146" width="732" height="40" rx="5" fill="#ffffff" stroke="#dbe3ea" stroke-width="1" filter="url(#rough2)"/>
  <text x="34" y="172" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1 2 3 4 5（样例 3，全不同）</text>
  <text x="264" y="172" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">15</text>
  <text x="307" y="172" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="357" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="407" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="462" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="534" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">15</text>
  <text x="580" y="172" font-size="11.5" fill="#446688" filter="url(#rough2)">任意顺序</text>

  <!-- 行 3 -->
  <rect x="24" y="190" width="732" height="40" rx="5" fill="#fdf6f7" stroke="#e4c3c6" stroke-width="1" filter="url(#rough2)"/>
  <text x="34" y="216" font-size="12" fill="#2b2b2b" filter="url(#rough2)">7 7 7 7 7 7（样例 4，全同）</text>
  <text x="264" y="216" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">42</text>
  <text x="307" y="216" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="357" y="216" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">2</text>
  <text x="407" y="216" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">4</text>
  <text x="462" y="216" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">28</text>
  <text x="534" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">14</text>
  <text x="580" y="216" font-size="11.5" fill="#446688" filter="url(#rough2)">7,7 | 其后 4 张 0</text>

  <!-- 行 4 -->
  <rect x="24" y="234" width="732" height="40" rx="5" fill="#fdf6f7" stroke="#e4c3c6" stroke-width="1" filter="url(#rough2)"/>
  <text x="34" y="260" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1 2 2 2 2（自造，杀非众数更亏）</text>
  <text x="264" y="260" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">9</text>
  <text x="307" y="260" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="357" y="260" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">3</text>
  <text x="407" y="260" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">1</text>
  <text x="462" y="260" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">2</text>
  <text x="534" y="260" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">7</text>
  <text x="580" y="260" font-size="11.5" fill="#446688" filter="url(#rough2)">2,1,2,2 | 末张 0</text>

  <!-- 说明 -->
  <rect x="24" y="292" width="732" height="156" rx="10" fill="#ffffff" stroke="#8c9bab" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="316" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">读表要点</text>
  <text x="44" y="340" font-size="12" fill="#41576d" filter="url(#rough2)">① 行 1：f = 3、r + 2 = 3，末段刚好塞下两张 10，触发牌是全场最后一张，因此 0 损失。</text>
  <text x="44" y="362" font-size="12" fill="#41576d" filter="url(#rough2)">② 行 3：r = 0 时末段只能放 2 张，多出的 4 张 7 必被吃，损失 4 × 7 = 28。</text>
  <text x="44" y="384" font-size="12" fill="#a14340" filter="url(#rough2)">③ 行 4：若改杀那张 1（非众数），则要靠 2 去填充，需再杀 2 张 2，损失 1 + 2 + 2 = 5 &gt; 2。</text>
  <text x="44" y="406" font-size="12" fill="#a14340" filter="url(#rough2)">　　结论：牺牲的牌永远应当全部取自众数 v，且张数恰为 K = f − (r + 2)。</text>
  <text x="44" y="430" font-size="11.5" fill="#66788c" filter="url(#rough2)">④ 行 4 的最优序列 2,1,2,2,2 里，第 4 张 2 触发护盾（照常吃满 2 点），第 5 张才是 0。</text>
</svg>
