<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：每段用两个前缀异或拼出来</text>
  <path d="M 170 40 Q 390 46 610 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="50" y="104" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">采石场 1：区间 [2, 2]</text>
  <rect x="220" y="78" width="96" height="40" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="268" y="104" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">g(2) = 3</text>
  <text x="336" y="104" text-anchor="middle" font-size="14" fill="#555555" filter="url(#rough2)">⊕</text>
  <rect x="356" y="78" width="96" height="40" rx="8" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="404" y="104" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">g(1) = 1</text>
  <text x="472" y="104" text-anchor="middle" font-size="14" fill="#555555" filter="url(#rough2)">=</text>
  <rect x="492" y="78" width="66" height="40" rx="8" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="525" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="580" y="104" font-size="10.5" fill="#777777" filter="url(#rough2)">只有一辆车</text>

  <text x="50" y="186" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">采石场 2：区间 [3, 4]</text>
  <rect x="220" y="160" width="96" height="40" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="268" y="186" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">g(4) = 4</text>
  <text x="336" y="186" text-anchor="middle" font-size="14" fill="#555555" filter="url(#rough2)">⊕</text>
  <rect x="356" y="160" width="96" height="40" rx="8" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="404" y="186" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">g(2) = 3</text>
  <text x="472" y="186" text-anchor="middle" font-size="14" fill="#555555" filter="url(#rough2)">=</text>
  <rect x="492" y="160" width="66" height="40" rx="8" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="525" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">7</text>
  <text x="580" y="186" font-size="10.5" fill="#777777" filter="url(#rough2)">两辆车 3 和 4</text>

  <rect x="50" y="248" width="680" height="90" rx="12" fill="#fdeeee" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="276" font-size="12.5" fill="#8a2b28" filter="url(#rough2)">把两段的异或再异或起来：total = 2 ⊕ 7 = 5</text>
  <text x="70" y="304" font-size="12.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">5 ≠ 0 ⇒ 先手（tolik）必胜</text>
  <text x="70" y="326" font-size="10.5" fill="#9a4a47" filter="url(#rough2)">等价于直接把三辆车 2、3、4 异或：2 ⊕ 3 ⊕ 4 = 5，两种算法结果一致。</text>
  <text x="50" y="374" font-size="11.5" fill="#555555" filter="url(#rough2)">一般形式：第 i 段贡献 g(x+m−1) ⊕ g(x−1)；g 的取值见上一张图，注意 g(0)=0。</text>
  <text x="50" y="400" font-size="11.5" fill="#8a6015" filter="url(#rough2)">n 段共 O(n) 次求值，完全不需要展开任何一辆车。</text>
</svg>
