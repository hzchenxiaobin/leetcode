<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心：每个素数的最高次幂 p^E 必须出现在某个参考数里</text>
  <text x="360" y="50" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">Quack 只能读到 gcd，所以 a_i 的每个素数幂都得被某个槽位"看见"</text>

  <text x="60" y="80" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">① Ja 发送 b</text>
  <text x="360" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">② Quack 查询并还原</text>

  <!-- 数据槽 -->
  <g filter="url(#rough2)">
    <rect x="30" y="95" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="67" y="117" text-anchor="middle" font-size="12" fill="#2c4a63">a₁=1</text>
    <rect x="120" y="95" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="157" y="117" text-anchor="middle" font-size="12" fill="#2c4a63">a₂=1</text>
    <rect x="210" y="95" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="247" y="117" text-anchor="middle" font-size="12" fill="#2c4a63">a₃=4</text>
    <rect x="300" y="95" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="337" y="117" text-anchor="middle" font-size="12" fill="#2c4a63">a₄=5</text>
    <rect x="390" y="95" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="427" y="117" text-anchor="middle" font-size="12" fill="#2c4a63">a₅=1</text>
    <rect x="480" y="95" width="74" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="517" y="117" text-anchor="middle" font-size="12" fill="#2c4a63">a₆=4</text>
  </g>
  <text x="590" y="117" font-size="10.5" fill="#777" filter="url(#rough2)">原有的 n 个槽</text>

  <!-- 参考数 -->
  <g filter="url(#rough2)">
    <rect x="30" y="160" width="524" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8"/>
    <text x="292" y="180" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold">参考数 R = 2² × 5 = 20</text>
    <text x="292" y="197" text-anchor="middle" font-size="10.5" fill="#997a34">素数 2 的最高次幂是 4，素数 5 的最高次幂是 5，装箱后相乘 ≤ 10⁶</text>
  </g>
  <path d="M 292 132 L 292 156" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="148" font-size="10" fill="#a07f2e" filter="url(#rough2)">组合成参考数</text>

  <!-- gcd 行 -->
  <text x="30" y="238" font-size="11" fill="#446688" filter="url(#rough2)">gcd(R, aᵢ)</text>
  <g filter="url(#rough2)">
    <rect x="120" y="220" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="150" y="240" text-anchor="middle" font-size="12" fill="#33602a">1</text>
    <rect x="190" y="220" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="220" y="240" text-anchor="middle" font-size="12" fill="#33602a">1</text>
    <rect x="260" y="220" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="290" y="240" text-anchor="middle" font-size="12" fill="#33602a">4</text>
    <rect x="330" y="220" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="360" y="240" text-anchor="middle" font-size="12" fill="#33602a">5</text>
    <rect x="400" y="220" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="430" y="240" text-anchor="middle" font-size="12" fill="#33602a">1</text>
    <rect x="470" y="220" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="500" y="240" text-anchor="middle" font-size="12" fill="#33602a">4</text>
  </g>

  <!-- 多个参考数时取 lcm -->
  <path d="M 150 252 L 150 280" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 252 L 290 280" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 252 L 430 280" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="272" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">有多个参考数时对答案再取 lcm</text>

  <!-- 还原结果 -->
  <g filter="url(#rough2)">
    <rect x="30" y="290" width="524" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="292" y="315" text-anchor="middle" font-size="12.5" fill="#8c3b37" font-weight="bold">lcm_j gcd(R_j, aᵢ) = aᵢ（每个素数幂都被覆盖，gcd 又不会超过 aᵢ，所以精确相等）</text>
  </g>

  <!-- 反例说明 -->
  <g filter="url(#rough2)">
    <rect x="30" y="350" width="660" height="56" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="8" stroke-dasharray="5 4"/>
    <text x="46" y="370" font-size="11" fill="#555">为什么必须"覆盖"：若某个素数 p 只出现在唯一一个槽位里，那么含 p 的回答恒为 1，</text>
    <text x="46" y="388" font-size="11" fill="#555">不同的 p 会给出完全相同的回答，Quack 无法分辨 —— 所以每个 p^E 至少要有一个额外见证。</text>
  </g>

  <text x="576" y="240" font-size="10" fill="#999" filter="url(#rough2)">↑ 每个 aᵢ 一行查询</text>
</svg>
