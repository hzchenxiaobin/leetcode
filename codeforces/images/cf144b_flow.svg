<svg xmlns="http://www.w3.org/2000/svg" width="680" height="190" viewBox="0 0 680 190"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1444"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="680" height="190" fill="#fafafa"/>
  <text x="340.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">流 程</text>
  <path d="M 108.8 42 Q 340.0 48 571.1999999999999 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="340.0" y="176" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">≈8×10⁶ 次比较</text>
  <text x="340" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#335478" filter="url(#rough2)">规范 min/max → 枚举矩形内整点 → 保留边上 → 判是否被覆盖</text>
  <text x="340" y="128" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">用平方距离避免浮点误差</text>
</svg>
