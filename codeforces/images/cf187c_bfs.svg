<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">187C：带重置的 0-1 BFS（志愿者处把已走步数清零）</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="120.0" cy="250.0" r="26.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="120.0" y="255.0" text-anchor="middle" font-size="13" fill="#8a6015" font-weight="bold" filter="url(#rough2)">s</text>
  <circle cx="280.0" cy="160.0" r="26.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280.0" y="165.0" text-anchor="middle" font-size="13" fill="#8a6015" font-weight="bold" filter="url(#rough2)">v1</text>
  <circle cx="470.0" cy="250.0" r="26.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="470.0" y="255.0" text-anchor="middle" font-size="13" fill="#8a6015" font-weight="bold" filter="url(#rough2)">v2</text>
  <circle cx="620.0" cy="160.0" r="26.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="620.0" y="165.0" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">t</text>
  <line x1="120.0" y1="250.0" x2="280.0" y2="160.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200.0" y="193.0" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3 步</text>
  <line x1="280.0" y1="160.0" x2="470.0" y2="250.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="375.0" y="193.0" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">4 步</text>
  <line x1="470.0" y1="250.0" x2="620.0" y2="160.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="545.0" y="193.0" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">2 步</text>
  <rect x="60.0" y="320.0" width="600.0" height="60.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="343.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">每段 ≤ q；到达志愿者即「重新记 q 个路口」→ 距离清零</text>
  <text x="74.0" y="367.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">判定：d[t] ≤ q（最后的段也不超过 q）</text>
  <rect x="60.0" y="392.0" width="600.0" height="40.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="415.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">q 单调：可行 → 更大也可行 → 二分答案</text>
</svg>
