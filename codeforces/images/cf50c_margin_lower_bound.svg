<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="740" height="420" fill="#fafafa"/>
  <text x="370" y="36" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">严格内部 ⇒ u、v 两个方向各要让出 1 格</text>
  <path d="M 170 46 Q 370 52 580 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="80" y1="130" x2="660" y2="130" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="666" y="134" font-size="14" fill="#2b2b2b" text-anchor="start" font-weight="bold" filter="url(#rough2)">u</text>
  <rect x="250" y="114" width="220" height="32" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360.0" y="135" font-size="11.5" fill="#8a3030" text-anchor="middle" filter="url(#rough2)">奶牛的 u 范围：宽 A</text>
  <rect x="210" y="118" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="470" y="118" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230" y="164" font-size="11" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="490" y="164" font-size="11" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <line x1="210" y1="104" x2="250" y2="104" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="210" y1="100" x2="210" y2="108" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="470" y1="104" x2="510" y2="104" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="510" y1="100" x2="510" y2="108" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360.0" y="94" font-size="12" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">回路的 u 跨度必须 ≥ A + 2</text>
  <line x1="140" y1="236" x2="660" y2="236" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="666" y="240" font-size="14" fill="#2b2b2b" text-anchor="start" font-weight="bold" filter="url(#rough2)">v</text>
  <rect x="300" y="220" width="220" height="32" rx="4" fill="#fdeaea" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410.0" y="241" font-size="11.5" fill="#8a3030" text-anchor="middle" filter="url(#rough2)">奶牛的 v 范围：宽 B</text>
  <rect x="260" y="224" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="520" y="224" width="40" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="270" font-size="11" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="540" y="270" font-size="11" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="410.0" y="200" font-size="12" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">同理回路的 v 跨度必须 ≥ B + 2</text>
  <rect x="60" y="286" width="650" height="116" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="82" y="316" font-size="15" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">TV_u ≥ 2(A+2)，TV_v ≥ 2(B+2)</text>
  <text x="82" y="348" font-size="15" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">N = (TV_u + TV_v) / 2 ≥ (A+2) + (B+2) = A + B + 4</text>
  <text x="82" y="378" font-size="12" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">「严格内部」的整数含义：极值方向各留 1 格，四个方向共 +4 —— 这就是公式里那个 4。</text>
</svg>
