<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="380" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">取 k 个罐子：尝过的个数服从超几何分布</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">货架上有 cnt 个罐子、其中 j 个没尝过；均匀取 k 个，取到 t 个"没尝过"的概率是组合数之比</text>
  <g filter="url(#rough2)"><rect x="150" y="110" width="52" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="176.0" y="136.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">新</text>
  <g filter="url(#rough2)"><rect x="210" y="110" width="52" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="236.0" y="136.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">新</text>
  <g filter="url(#rough2)"><rect x="270" y="110" width="52" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="296.0" y="136.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">新</text>
  <g filter="url(#rough2)"><rect x="330" y="110" width="52" height="44" rx="4" fill="#e8e8e8" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="356.0" y="136.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">旧</text>
  <g filter="url(#rough2)"><rect x="390" y="110" width="52" height="44" rx="4" fill="#e8e8e8" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="416.0" y="136.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">旧</text>
  <g filter="url(#rough2)"><rect x="450" y="110" width="52" height="44" rx="4" fill="#e8e8e8" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="476.0" y="136.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">旧</text>
  <text x="330" y="96" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">j = 3 个没尝过</text>
  <text x="560" y="96" text-anchor="middle" font-size="12.5" fill="#666666" filter="url(#rough2)">cnt - j = 3 个已尝过</text>
  <text x="440" y="196" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">P(取到 t 个没尝过) = C(j, t) · C(cnt-j, k-t) / C(cnt, k)</text>
  <text x="440" y="236" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">状态转移：dp_new[j - t] += dp[j] · P(t)，只影响被取货的那个货架</text>
  <text x="440" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">k ≤ 5，所以每个 j 只有至多 6 个 t 要枚举</text>
  <text x="440" y="316" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">j 只会变小：货架的罐子一旦尝过就永远算"已尝"</text>
  <text x="440" y="352" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">期望 m = Σ_i dp[i][0]（某个货架"没有没尝过的罐子"的概率）</text>
</svg>
