<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="360" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">同一个数值的位置两两配对即可</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每个值的出现次数必须是偶数：奇数说明无解，否则按出现顺序相邻配对</text>
  <g filter="url(#rough2)"><rect x="120" y="110" width="76" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="158.0" y="138.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">20</text>
  <text x="158" y="178" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">牌 1</text>
  <g filter="url(#rough2)"><rect x="216" y="110" width="76" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="254.0" y="138.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">30</text>
  <text x="254" y="178" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">牌 2</text>
  <g filter="url(#rough2)"><rect x="312" y="110" width="76" height="46" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="350.0" y="138.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="350" y="178" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">牌 3</text>
  <g filter="url(#rough2)"><rect x="408" y="110" width="76" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="446.0" y="138.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">30</text>
  <text x="446" y="178" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">牌 4</text>
  <g filter="url(#rough2)"><rect x="504" y="110" width="76" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="542.0" y="138.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">20</text>
  <text x="542" y="178" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">牌 5</text>
  <g filter="url(#rough2)"><rect x="600" y="110" width="76" height="46" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="638.0" y="138.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="638" y="178" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">牌 6</text>
  <path d="M140,196 C140,240 300,240 300,196" fill="none" stroke="#b05a5a" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M216,196 C216,264 396,264 396,196" fill="none" stroke="#3d6b2f" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M292,196 C292,288 492,288 492,196" fill="none" stroke="#2f4a66" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="220" y="306" text-anchor="middle" font-size="12" fill="#b05a5a" filter="url(#rough2)">20 的两张配对</text>
  <text x="330" y="330" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">30 的两张配对　　</text>
  <text x="560" y="200" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">10 的两张配对</text>
  <text x="700" y="120" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">若某个值出现奇数次</text>
  <text x="700" y="144" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">→ 输出 -1</text>
</svg>
