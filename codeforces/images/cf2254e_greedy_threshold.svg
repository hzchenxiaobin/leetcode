<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="26" y="34" font-size="18" fill="#333" filter="url(#rough2)">贪心：每一步取「最小的可行差分」</text>
  <text x="26" y="60" font-size="12.5" fill="#666" filter="url(#rough2)">当前前缀和 v = a_{i−1}；可行条件 v + c ≥ 1，即 c ≥ need = 1 − v</text>

  <text x="70" y="106" font-size="12.5" fill="#666" filter="url(#rough2)">剩余可用的 b，升序；此时 v = 1</text>

  <rect x="70" y="114" width="76" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="141" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">−3</text>
  <rect x="170" y="114" width="76" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="141" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">−1</text>
  <rect x="270" y="114" width="76" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="308" y="141" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="370" y="114" width="76" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="141" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="470" y="114" width="76" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="508" y="141" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>

  <path d="M258,96 L258,232" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>
  <text x="258" y="86" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">下界 need = 1 − v = 0</text>

  <path d="M78,120 L146,150" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M146,120 L78,150" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M178,120 L246,150" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M246,120 L178,150" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <path d="M330,206 L318,166" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="222" font-size="12.5" fill="#a5761f" filter="url(#rough2)">最小可行 ⇒ 选 0，a 原地不动</text>

  <rect x="40" y="246" width="340" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="270" font-size="13" fill="#2f4f6f" filter="url(#rough2)">为什么必须取最小？</text>
  <text x="56" y="294" font-size="12" fill="#333" filter="url(#rough2)">第 i 位的 a_i 越小，字典序越小</text>
  <text x="56" y="318" font-size="12" fill="#333" filter="url(#rough2)">能取小的就必须取小的（贪心选择）</text>

  <rect x="400" y="246" width="340" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="270" font-size="13" fill="#3a5f2c" filter="url(#rough2)">need = 1 − v ≤ 0 恒成立</text>
  <text x="416" y="294" font-size="12" fill="#333" filter="url(#rough2)">所以任何正整数都永远可选</text>
  <text x="416" y="318" font-size="12" fill="#333" filter="url(#rough2)">非正数只要 ≥ need 也合法</text>

  <text x="40" y="360" font-size="12.5" fill="#333" filter="url(#rough2)">实现：multiset 上 lower_bound(need) 取到最小可行 c，删除它，v += c，共做 n − 1 次。</text>
  <text x="40" y="386" font-size="12.5" fill="#333" filter="url(#rough2)">若一个 ≥ need 的元素都没有，说明必然失败 —— 但 Σb ≥ 1 时这种情况不会发生。</text>
  <text x="40" y="412" font-size="12.5" fill="#b85450" filter="url(#rough2)">结论：Σb ≥ 1 ⟺ 有解；Σb &lt; 1 直接输出 −1。</text>
</svg>
