<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="81"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">180E：q_j = p_j − j 单调不减，二分找最远的 j</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="74.0" y="186.0" width="52.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="100.0" y="216.0" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">q₀=1</text>
  <text x="100.0" y="238.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j=0</text>
  <rect x="170.0" y="152.0" width="52.0" height="68.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="196.0" y="216.0" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">q₁=2</text>
  <text x="196.0" y="238.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j=1</text>
  <rect x="266.0" y="118.0" width="52.0" height="102.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="292.0" y="216.0" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">q₂=3</text>
  <text x="292.0" y="238.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j=2</text>
  <rect x="362.0" y="118.0" width="52.0" height="102.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="388.0" y="216.0" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">q₃=3</text>
  <text x="388.0" y="238.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j=3</text>
  <rect x="458.0" y="84.0" width="52.0" height="136.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="484.0" y="216.0" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">q₄=4</text>
  <text x="484.0" y="238.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j=4</text>
  <rect x="554.0" y="84.0" width="52.0" height="136.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="580.0" y="216.0" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">q₅=4</text>
  <text x="580.0" y="238.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j=5</text>
  <line x1="100.0" y1="118.0" x2="606.0" y2="118.0" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="340.0" y="106.0" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">q_i + k = 2 + 2 = 4：最远的 j 是 5</text>
  <rect x="40.0" y="300.0" width="640.0" height="76.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="324.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">对每个 i，二分最大的 j 使 q_j ≤ q_i + k</text>
  <text x="54.0" y="350.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">答案 = max(j − i + 1)；总复杂度 O(n log n)</text>
</svg>
