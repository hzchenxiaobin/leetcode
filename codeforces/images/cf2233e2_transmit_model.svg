<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto">
      <path d="M0,0 L7,3.4 L0,6.8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="860" height="470" fill="#fafafa" filter="url(#rough2)"/>

  <text x="430" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">传输模型：K 个比特串按位排成 K×n 矩阵，行值必须恰好是 1..n</text>

  <!-- 列号 -->
  <text x="152" y="58" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">i=1</text>
  <text x="202" y="58" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">i=2</text>
  <text x="252" y="58" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">i=3</text>
  <text x="302" y="58" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">i=4</text>

  <!-- p 值行 -->
  <text x="116" y="88" text-anchor="end" font-size="14" fill="#446688" filter="url(#rough2)">p =</text>
  <rect x="130" y="66" width="44" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="180" y="66" width="44" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="230" y="66" width="44" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="280" y="66" width="44" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="152" y="88" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="202" y="88" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="252" y="88" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="302" y="88" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">4</text>

  <!-- 第 2 位 -->
  <text x="116" y="138" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">第 2 位</text>
  <rect x="130" y="116" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="180" y="116" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="230" y="116" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="280" y="116" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="138" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <text x="202" y="138" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <text x="252" y="138" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <text x="302" y="138" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>

  <!-- 第 1 位 -->
  <text x="116" y="188" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">第 1 位</text>
  <rect x="130" y="166" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="180" y="166" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="230" y="166" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="280" y="166" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="188" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <text x="202" y="188" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <text x="252" y="188" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <text x="302" y="188" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>

  <!-- 第 0 位 -->
  <text x="116" y="238" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">第 0 位</text>
  <rect x="130" y="216" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="180" y="216" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="230" y="216" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="280" y="216" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="238" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <text x="202" y="238" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">1</text>
  <text x="252" y="238" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <text x="302" y="238" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>

  <!-- 箭头：矩阵 -> 收到的串 -->
  <path d="M334,132 C400,120 430,110 470,110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M334,182 C400,170 430,164 470,164" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M334,232 C400,220 430,218 470,218" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="104" font-size="12.5" fill="#b85450" filter="url(#rough2)">按位取列</text>
  <text x="390" y="252" font-size="12.5" fill="#b85450" filter="url(#rough2)">顺序打乱</text>

  <!-- 右侧：收到的多重集 -->
  <rect x="472" y="60" width="352" height="196" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="648" y="86" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">收到的 K = 3 个串（顺序未知）</text>
  <rect x="510" y="98" width="150" height="30" rx="5" fill="#fffdf5" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="510" y="142" width="150" height="30" rx="5" fill="#fffdf5" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="510" y="186" width="150" height="30" rx="5" fill="#fffdf5" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="585" y="119" text-anchor="middle" font-size="15" fill="#8a6a20" filter="url(#rough2)">1010</text>
  <text x="585" y="163" text-anchor="middle" font-size="15" fill="#8a6a20" filter="url(#rough2)">0001</text>
  <text x="585" y="207" text-anchor="middle" font-size="15" fill="#8a6a20" filter="url(#rough2)">1100</text>
  <text x="700" y="119" font-size="12" fill="#777" filter="url(#rough2)">← 第 1 位</text>
  <text x="700" y="163" font-size="12" fill="#777" filter="url(#rough2)">← 第 2 位</text>
  <text x="700" y="207" font-size="12" fill="#777" filter="url(#rough2)">← 第 0 位</text>
  <text x="648" y="242" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">不知道哪个串对应哪一位！</text>

  <!-- 底部三条结论 -->
  <text x="44" y="300" font-size="14" fill="#333" filter="url(#rough2)">① 收到的只是 K 个串的多重集：位与串的对应关系（标注 τ）未知。</text>
  <text x="44" y="330" font-size="14" fill="#333" filter="url(#rough2)">② 一旦标定 τ，矩阵就唯一确定，行值 v_i = Σ_b (τ(b) 的第 i 位) · 2^b。</text>
  <text x="44" y="360" font-size="14" fill="#333" filter="url(#rough2)">③ 校验条件只有一条：n 个行值互不相同，且恰好取遍 1..n。</text>
  <text x="44" y="396" font-size="15" fill="#b85450" filter="url(#rough2)">④ 每个合法标注 τ 恰好还原出一个原排列 p ⇒ 答案 = 合法标注的个数。</text>
  <text x="44" y="428" font-size="13" fill="#666" filter="url(#rough2)">（标注相同：把内容相同的串互换位置不产生新矩阵，也不产生新的 p。）</text>
</svg>
