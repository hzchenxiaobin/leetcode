<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="880" height="620" fill="#fafafa"/>

  <text x="440.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：先解线性方程组，再解一元二次方程</text>
  <path d="M 180 42 Q 440.0 49 700 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="330.0" y="56.0" width="220.0" height="40.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440.0" y="82.0" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">读入三组 (x, y, r)</text>
  <line x1="440.0" y1="96.0" x2="440.0" y2="124.0" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200.0" y="124.0" width="480.0" height="54.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440.0" y="144.0" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">两两相减消去 |P|²（设 s = t²，t = d/r）：</text>
  <text x="440.0" y="164.0" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">2P·(C₁ − Cⱼ) = (|C₁|² − |Cⱼ|²) + s·(rⱼ² − r₁²)，j = 2, 3</text>
  <line x1="440.0" y1="178.0" x2="440.0" y2="204.0" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240.0" y="204.0" width="400.0" height="50.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440.0" y="228.0" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">解 2×2 方程组（det ≠ 0，因为圆心不共线）</text>
  <text x="440.0" y="248.0" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">得 P = u + s·v</text>
  <line x1="440.0" y1="254.0" x2="440.0" y2="280.0" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240.0" y="280.0" width="400.0" height="50.0" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440.0" y="304.0" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">代回 |P − C₁|² = s·r₁²</text>
  <text x="440.0" y="324.0" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">a·s² + b·s + c = 0</text>
  <line x1="440.0" y1="330.0" x2="440.0" y2="352.0" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="440,352 566,392 440,432 314,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440.0" y="388.0" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">判别式 &lt; 0 ？</text>
  <text x="440.0" y="406.0" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">（两轨迹不相交）</text>
  <line x1="566.0" y1="392.0" x2="636.0" y2="392.0" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="600.0" y="380.0" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">是</text>
  <rect x="638.0" y="366.0" width="206.0" height="52.0" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="741.0" y="388.0" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">无实根 ⇒ 无解</text>
  <text x="741.0" y="406.0" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">不输出任何内容</text>
  <line x1="440.0" y1="432.0" x2="440.0" y2="452.0" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="452.0" y="448.0" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">否</text>
  <rect x="232.0" y="452.0" width="416.0" height="50.0" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440.0" y="472.0" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">只保留 s > 1 的根（观测点必须在三个圆外）</text>
  <text x="440.0" y="492.0" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">在剩下的根里取 s 最小（张角最大）</text>
  <line x1="648.0" y1="477.0" x2="700.0" y2="477.0" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="674.0" y="466.0" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">无</text>
  <rect x="702.0" y="451.0" width="158.0" height="52.0" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="781.0" y="473.0" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">无 s > 1 的根</text>
  <text x="781.0" y="491.0" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">不输出任何内容</text>
  <line x1="440.0" y1="502.0" x2="440.0" y2="528.0" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="308.0" y="528.0" width="264.0" height="46.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440.0" y="556.0" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">输出坐标（小数点后 5 位）</text>
</svg>
