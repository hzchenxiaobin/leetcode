<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="760" height="500" fill="#fafafa"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n 为偶数：第 1 列留作回程，第 2..m 列蛇形走完</text>
  <path d="M 220 42 Q 380 48 540 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="160" y="80" width="62" height="62" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="222" y="80" width="62" height="62" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="284" y="80" width="62" height="62" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="346" y="80" width="62" height="62" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="408" y="80" width="62" height="62" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="160" y="142" width="62" height="62" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="222" y="142" width="62" height="62" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="284" y="142" width="62" height="62" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="346" y="142" width="62" height="62" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="408" y="142" width="62" height="62" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="160" y="204" width="62" height="62" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="222" y="204" width="62" height="62" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="284" y="204" width="62" height="62" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="346" y="204" width="62" height="62" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="408" y="204" width="62" height="62" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="160" y="266" width="62" height="62" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="222" y="266" width="62" height="62" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="284" y="266" width="62" height="62" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="346" y="266" width="62" height="62" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="408" y="266" width="62" height="62" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="191.0" y="72" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">1</text>
  <text x="253.0" y="72" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">2</text>
  <text x="315.0" y="72" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">3</text>
  <text x="377.0" y="72" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">4</text>
  <text x="439.0" y="72" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">5</text>
  <text x="148" y="115.0" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">1</text>
  <text x="148" y="177.0" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">2</text>
  <text x="148" y="239.0" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">3</text>
  <text x="148" y="301.0" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">4</text>
  <line x1="191.0" y1="111.0" x2="253.0" y2="111.0" stroke="#4a7a3a" stroke-width="2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="253.0" y1="111.0" x2="439.0" y2="111.0" stroke="#4a7a3a" stroke-width="2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="439.0" y1="111.0" x2="439.0" y2="173.0" stroke="#4a7a3a" stroke-width="2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="439.0" y1="173.0" x2="253.0" y2="173.0" stroke="#4a7a3a" stroke-width="2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="253.0" y1="173.0" x2="253.0" y2="235.0" stroke="#4a7a3a" stroke-width="2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="253.0" y1="235.0" x2="439.0" y2="235.0" stroke="#4a7a3a" stroke-width="2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="439.0" y1="235.0" x2="439.0" y2="297.0" stroke="#4a7a3a" stroke-width="2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="439.0" y1="297.0" x2="253.0" y2="297.0" stroke="#4a7a3a" stroke-width="2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="253.0" y1="297.0" x2="191.0" y2="297.0" stroke="#446688" stroke-width="2" opacity="1.0" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="191.0" y1="293.0" x2="191.0" y2="115.0" stroke="#446688" stroke-width="2" opacity="1.0" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="191.0" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">第 1 列：回程通道（向上）</text>
  <text x="500" y="96" text-anchor="start" font-size="13" fill="#4a7a3a" filter="url(#rough2)">第 2..m 列：蛇形</text>
  <text x="500" y="124" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">第 1 行 →，第 2 行 ←，…</text>
  <text x="500" y="152" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">n 为偶数 ⇒ 第 n 行向左</text>
  <text x="500" y="180" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">停在 (n,2) → (n,1) → 向上</text>
  <text x="500" y="214" text-anchor="start" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0 个传送门</text>
  <text x="500" y="250" text-anchor="start" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">长度 = 1 + n(m-1) + (n-1) + 1</text>
  <text x="500" y="272" text-anchor="start" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">= nm + 1</text>
  <text x="380" y="402" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#rough2)">每一步都四邻接；第 1 列只在起点、回程、终点出现</text>
  <text x="380" y="430" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">图中 4×5：绿色为蛇形，蓝色为回程</text>
</svg>
