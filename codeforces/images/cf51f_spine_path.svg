<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="740" height="400" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3：选一条最优脊柱，组数 = 路径点数 + 挂边数</text>
  <path d="M 110 40 Q 370 46 630 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 树：1-2-3, 1-4-5, 1-6-7 -->
  <line x1="370" y1="150" x2="270" y2="150" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="270" y1="150" x2="170" y2="150" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="370" y1="150" x2="470" y2="150" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="470" y1="150" x2="570" y2="150" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="370" y1="150" x2="370" y2="250" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="370" y1="250" x2="370" y2="330" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <circle cx="370" cy="150" r="10" fill="#446688" filter="url(#rough2)"/>
  <circle cx="270" cy="150" r="9" fill="#446688" filter="url(#rough2)"/>
  <circle cx="170" cy="150" r="9" fill="#446688" filter="url(#rough2)"/>
  <circle cx="470" cy="150" r="9" fill="#446688" filter="url(#rough2)"/>
  <circle cx="570" cy="150" r="9" fill="#446688" filter="url(#rough2)"/>
  <circle cx="370" cy="250" r="9" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="370" cy="330" r="9" fill="#d6a040" filter="url(#rough2)"/>

  <text x="370" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" filter="url(#rough2)">1</text>
  <text x="270" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" filter="url(#rough2)">2</text>
  <text x="170" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" filter="url(#rough2)">3</text>
  <text x="470" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" filter="url(#rough2)">6</text>
  <text x="570" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" filter="url(#rough2)">7</text>
  <text x="386" y="256" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">4</text>
  <text x="386" y="336" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">5</text>

  <!-- 路径标注 -->
  <text x="370" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">脊柱路径 Q = 3-2-1-6-7 → 5 个点，各成一组</text>
  <path d="M 170 176 Q 370 200 570 176" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- 挂边标注 -->
  <text x="470" y="236" font-size="11.5" fill="#8a6015" filter="url(#rough2)">边 (1,4) 离开路径：</text>
  <text x="470" y="254" font-size="11.5" fill="#8a6015" filter="url(#rough2)">整块 {4,5} 成为 1 个叶组</text>
  <text x="470" y="272" font-size="11.5" fill="#8a6015" filter="url(#rough2)">（维度数 = 1 次合并）</text>

  <!-- 结论 -->
  <rect x="50" y="356" width="640" height="36" rx="8" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">组数 = 5 + 1 = 6，操作数 = 7 − 6 = 1（把 4、5 合并，商图即刻变成毛毛虫）</text>
</svg>
