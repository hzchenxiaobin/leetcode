<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="bc" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7a4a9a"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">低位贡献 = 两组「按位 1 的个数」逐位相乘</text>

  <g filter="url(#rough2)">
    <rect x="60" y="66" width="220" height="96" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="420" y="66" width="220" height="96" rx="9" fill="#fde9d9" stroke="#b4652a" stroke-width="1.6"/>
  </g>
  <g font-size="12" fill="#2f5223" filter="url(#rough2)">
    <text x="76" y="88">组 A：c₁ 个数</text>
    <text x="76" y="112">bit t 上 1 的个数 = ones₁(t)</text>
    <text x="76" y="134">bit t 上 0 的个数 = c₁ − ones₁(t)</text>
    <text x="76" y="156">低位异或只看这 p 位</text>
  </g>
  <g font-size="12" fill="#7a4b22" filter="url(#rough2)">
    <text x="436" y="88">组 B：c₂ 个数</text>
    <text x="436" y="112">ones₂(t)，以及 c₂ − ones₂(t)</text>
    <text x="436" y="134">A、B 的高位前缀互补</text>
    <text x="436" y="156">所以异或的高位固定</text>
  </g>
  <g stroke="#7a4a9a" stroke-width="1.7" filter="url(#rough2)">
    <line x1="282" y1="114" x2="416" y2="114" marker-end="url(#bc)"/>
  </g>
  <text x="349" y="106" text-anchor="middle" font-size="11" fill="#4a2a62" filter="url(#rough2)">配对</text>

  <g filter="url(#rough2)">
    <rect x="40" y="180" width="640" height="94" rx="9" fill="#f3edf8" stroke="#7a4a9a" stroke-width="1.2"/>
  </g>
  <g font-size="12" fill="#4a2a62" filter="url(#rough2)">
    <text x="56" y="204">bit t 上「一个 1 一个 0」的有序对数：</text>
    <text x="56" y="228" font-weight="bold">ones₁(t)·(c₂ − ones₂(t)) + (c₁ − ones₁(t))·ones₂(t)</text>
    <text x="56" y="254">乘上 2^t 再对所有 t &lt; p 求和，就是这两个组之间所有数对的低位异或和。</text>
  </g>
  <text x="360" y="296" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">高位部分 + 低位部分 = 这一组数对的异或总和；横跨所有 p 累加即得 Σ(异或 &gt; V)</text>
</svg>
