<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="560" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">贪心：从左到右，每步认领最小可用槽位</text>
  <text x="280" y="46" text-anchor="middle" font-size="10" fill="#888">b 严格递增 ⇒ 合法槽位是后缀，于是「最小可用」= 从 L_i 往右第一个没被占用的位置</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="110" y="62" width="280" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="250" y="83" fill="#3a4a66">读入 n，数组 a[1..n]、b[1..n]</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="110" y="106" width="280" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="250" y="127" fill="#3a4a66">used[] ← false，i ← 1</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="110" y="150" width="280" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="250" y="171" fill="#8a6a20">在未占用的槽位里找最小的 j</text>
    <text x="250" y="189" fill="#8a6a20">使 b_j ≥ a_i（即 j ≥ L_i）</text>
  </g>

  <g filter="url(#rough2)">
    <polygon points="250,210 338,248 250,286 158,248" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="250" y="253" text-anchor="middle" font-size="11" fill="#3a5a30">存在 j 吗？</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="14" y="232" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="66" y="253" fill="#8a3a36">输出 −1</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="130" y="298" width="240" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="250" y="315" fill="#3a5a30">used[j] ← true，p_i ← j</text>
    <text x="250" y="331" fill="#3a5a30">i ← i + 1</text>
  </g>

  <g filter="url(#rough2)">
    <polygon points="250,360 330,396 250,432 170,396" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="250" y="401" text-anchor="middle" font-size="11" fill="#8a6a20">i ≤ n ？</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="110" y="452" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="250" y="475" fill="#3a4a66">统计 inv(p) 并输出，进入下一组</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 250 94 L 250 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 250 138 L 250 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 250 196 L 250 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 158 248 L 122 248" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="140" y="241" text-anchor="middle" font-size="10" fill="#b85450">否</text>
    <path d="M 250 286 L 250 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="262" y="294" font-size="10" fill="#4a7a3a">是</text>
    <path d="M 250 336 L 250 358" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 250 432 L 250 450" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 330 396 L 470 396 L 470 173 L 394 173" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="452" y="388" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
    <text x="262" y="447" font-size="10" fill="#446688">否</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#8a6a20">
    <rect x="400" y="56" width="186" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
    <text x="414" y="78" font-size="10.5" font-weight="bold">复杂度</text>
    <text x="414" y="100">找槽位 O(n²)</text>
    <text x="414" y="119">数逆序 O(n²)</text>
    <text x="414" y="138">总计 O(n²) / 组</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#3a5a30">
    <rect x="400" y="406" width="186" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <text x="414" y="428" font-size="10.5" font-weight="bold">为什么取最小？</text>
    <text x="414" y="450">把最小槽位换给当前</text>
    <text x="414" y="469">位置，逆序对数不会</text>
    <text x="414" y="488">变大；更大的槽位</text>
    <text x="414" y="507">留给后面（见 §5）</text>
  </g>
</svg>
