<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 的取石子过程</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">a=3, b=5, n=9；Simon 先手</text>
  <rect x="50" y="70" width="620" height="32" rx="5" fill="#eef5ea" stroke="#c8c8c0" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="90" y="91" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">1</text>
  <text x="200" y="91" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Simon</text>
  <text x="330" y="91" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">剩余 9</text>
  <text x="470" y="91" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">gcd(3,9)=3</text>
  <text x="620" y="91" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">→ 6</text>
  <rect x="50" y="108" width="620" height="32" rx="5" fill="#dfe8f3" stroke="#c8c8c0" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="90" y="129" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">2</text>
  <text x="200" y="129" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Antisimon</text>
  <text x="330" y="129" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">剩余 6</text>
  <text x="470" y="129" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">gcd(5,6)=1</text>
  <text x="620" y="129" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">→ 5</text>
  <rect x="50" y="146" width="620" height="32" rx="5" fill="#eef5ea" stroke="#c8c8c0" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="90" y="167" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">3</text>
  <text x="200" y="167" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Simon</text>
  <text x="330" y="167" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">剩余 5</text>
  <text x="470" y="167" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">gcd(3,5)=1</text>
  <text x="620" y="167" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">→ 4</text>
  <rect x="50" y="184" width="620" height="32" rx="5" fill="#dfe8f3" stroke="#c8c8c0" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="90" y="205" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">4</text>
  <text x="200" y="205" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Antisimon</text>
  <text x="330" y="205" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">剩余 4</text>
  <text x="470" y="205" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">gcd(5,4)=1</text>
  <text x="620" y="205" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">→ 3</text>
  <rect x="50" y="222" width="620" height="32" rx="5" fill="#eef5ea" stroke="#c8c8c0" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="90" y="243" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">5</text>
  <text x="200" y="243" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Simon</text>
  <text x="330" y="243" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">剩余 3</text>
  <text x="470" y="243" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">gcd(3,3)=3</text>
  <text x="620" y="243" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">→ 0</text>
  <rect x="50" y="260" width="620" height="32" rx="5" fill="#fbeeee" stroke="#c8c8c0" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="90" y="281" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">6</text>
  <text x="200" y="281" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Antisimon</text>
  <text x="330" y="281" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">剩余 0</text>
  <text x="470" y="281" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">gcd(5,0)=5 &gt; 0</text>
  <text x="620" y="281" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">→ 输</text>
</svg>
