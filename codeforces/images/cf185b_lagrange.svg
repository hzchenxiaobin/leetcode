<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="360" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">目标 ln(x^a·y^b·z^c) = a·ln x + b·ln y + c·ln z 在 x+y+z = S 上取最大</text>
  <path d="M 60 46 Q 390.0 52 740 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="340.0" height="120.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="96.0" text-anchor="start" font-size="11.8" font-weight="bold" fill="#446688" filter="url(#rough2)">拉格朗日条件</text>
  <text x="76.0" y="122.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">a/x = b/y = c/z = λ</text>
  <text x="76.0" y="146.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">⇒ x : y : z = a : b : c</text>
  <text x="76.0" y="170.0" text-anchor="start" font-size="11.0" fill="#6b6b6b" filter="url(#rough2)">⇒ 用满 x+y+z = S（各指数 ≥ 0）</text>
  <rect x="430.0" y="70.0" width="300.0" height="120.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="446.0" y="96.0" text-anchor="start" font-size="11.8" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">于是唯一候选</text>
  <text x="446.0" y="122.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">x = S·a/T，y = S·b/T，z = S·c/T</text>
  <text x="446.0" y="146.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">T = a+b+c</text>
  <text x="446.0" y="170.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">O(1) 输出即可</text>
  <rect x="60.0" y="208.0" width="300.0" height="90.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="232.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#8a6015" filter="url(#rough2)">样例 1：S=3, (1,1,1)</text>
  <text x="76.0" y="256.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">T=3 ⇒ (1,1,1)，ln 值 0</text>
  <text x="76.0" y="278.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">任何点都不更大（对称）</text>
  <rect x="400.0" y="208.0" width="330.0" height="90.0" rx="9" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416.0" y="232.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">样例 2：S=3, (2,0,0)</text>
  <text x="416.0" y="256.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">指数为 0 的坐标取 0（0⁰=1）</text>
  <text x="416.0" y="278.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">⇒ (3,0,0)，值 9</text>
</svg>
