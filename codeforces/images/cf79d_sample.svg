<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="880" height="404" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：n = 10，缺陷在 {0, 3, 4, 9}</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">可用长度 A ∈ {3, 5}；配对 (0,3)、(4,9) 各一步，共 2 步</text>
  <g filter="url(#rough2)"><rect x="70" y="104" width="52" height="42" rx="3" fill="#f6d9d7" fill-opacity="0.8" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="96" y="131" text-anchor="middle" font-size="13.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="138" y="104" width="52" height="42" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.4"/></g>
  <text x="164" y="131" text-anchor="middle" font-size="13.5" fill="#555555" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="206" y="104" width="52" height="42" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.4"/></g>
  <text x="232" y="131" text-anchor="middle" font-size="13.5" fill="#555555" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="274" y="104" width="52" height="42" rx="3" fill="#f6d9d7" fill-opacity="0.8" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="300" y="131" text-anchor="middle" font-size="13.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="342" y="104" width="52" height="42" rx="3" fill="#f6d9d7" fill-opacity="0.8" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="368" y="131" text-anchor="middle" font-size="13.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="410" y="104" width="52" height="42" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.4"/></g>
  <text x="436" y="131" text-anchor="middle" font-size="13.5" fill="#555555" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="478" y="104" width="52" height="42" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.4"/></g>
  <text x="504" y="131" text-anchor="middle" font-size="13.5" fill="#555555" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="546" y="104" width="52" height="42" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.4"/></g>
  <text x="572" y="131" text-anchor="middle" font-size="13.5" fill="#555555" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="614" y="104" width="52" height="42" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.4"/></g>
  <text x="640" y="131" text-anchor="middle" font-size="13.5" fill="#555555" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="682" y="104" width="52" height="42" rx="3" fill="#f6d9d7" fill-opacity="0.8" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="708" y="131" text-anchor="middle" font-size="13.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><rect x="750" y="104" width="52" height="42" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.4"/></g>
  <text x="776" y="131" text-anchor="middle" font-size="13.5" fill="#555555" filter="url(#rough2)">10</text>
  <text x="56" y="131" text-anchor="end" font-size="12" fill="#555555" filter="url(#rough2)">b 下标</text>
  <g filter="url(#rough2)"><path d="M 96 92 C 172.0 34, 240.0 34, 300 92" fill="none" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrg)"/></g>
  <text x="185.6" y="42" text-anchor="middle" font-size="12" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">A = 3</text>
  <g filter="url(#rough2)"><path d="M 368 92 C 444.0 4, 648.0 4, 708 92" fill="none" stroke="#446688" stroke-width="2.4" marker-end="url(#arrb)"/></g>
  <text x="518.8" y="16" text-anchor="middle" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">A = 5</text>
  <text x="450" y="200" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">缺陷集合 T = {x−1, x} 的对称差（x 为目标 ON 的面板）</text>
  <text x="450" y="224" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">|T| 必须是偶数；每个缺陷点要被奇数次覆盖，其它点偶数次</text>
  <text x="450" y="252" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">固定方向对：距离 dist(0,3) = 1（A=3），dist(4,9) = 1（A=5）</text>
  <text x="450" y="278" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">最优配对 = 带权完美匹配，用 2^|T| 的状压 DP 解决</text>
</svg>
