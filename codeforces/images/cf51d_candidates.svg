<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arr3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">候选删除位置只有 O(1) 个</text>
  <path d="M 200 42 Q 360 48 520 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 序列格子 -->
  <g filter="url(#rough2)">
    <rect x="60" y="150" width="60" height="46" fill="#eef3f8" stroke="#446688" stroke-width="1.6"/>
    <rect x="132" y="150" width="60" height="46" fill="#eef3f8" stroke="#446688" stroke-width="1.6"/>
    <rect x="204" y="150" width="60" height="46" fill="#eef3f8" stroke="#446688" stroke-width="1.6"/>
    <rect x="276" y="150" width="60" height="46" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <rect x="348" y="150" width="60" height="46" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <rect x="420" y="150" width="60" height="46" fill="#fdf0ef" stroke="#b85450" stroke-width="1.8"/>
    <rect x="492" y="150" width="60" height="46" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <rect x="564" y="150" width="60" height="46" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
  </g>
  <text x="90" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a₁</text>
  <text x="162" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a₂</text>
  <text x="234" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a₃</text>
  <text x="306" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a₄</text>
  <text x="378" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a₅</text>
  <text x="450" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">a_i₀</text>
  <text x="522" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">…</text>
  <text x="594" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a_n</text>

  <!-- 位置编号 -->
  <text x="90" y="216" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="162" y="216" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="234" y="216" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
  <text x="306" y="216" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>

  <!-- 前三个的高亮框 -->
  <rect x="52" y="142" width="220" height="62" rx="6" fill="none" stroke="#b85450" stroke-width="2"
        stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="162" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">删这里 → 前两项会变，公比另算</text>

  <!-- 失配点说明 -->
  <path d="M 450 140 L 450 108" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="450" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">首个不满足公比的位置</text>
  <text x="450" y="80" text-anchor="middle" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">若删的位置在它右边，它会以原位暴露 → 不行</text>

  <!-- 箭头：前两项锁定公比 -->
  <path d="M 132 232 Q 260 268 400 236" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <text x="262" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">公比 = a₂ / a₁：前两项一旦保留，后面每一项的位置与取值全被锁死</text>

  <!-- 底部结论 -->
  <rect x="52" y="300" width="616" height="44" rx="8" fill="#fdf6e6" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="327" text-anchor="middle" font-size="12.5" fill="#6b4a10" filter="url(#rough2)">所以只需试探删除 1、2、3 号（前两项会变）与 i₀ 号（唯一可能的“尾部删除”），每种 O(n) 校验</text>
</svg>
