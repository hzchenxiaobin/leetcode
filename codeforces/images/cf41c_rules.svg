<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="441"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="290" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">dot → "." 省 2；at → "@" 省 1；首尾不能是 . 或 @</text>
  <g font-family="monospace" font-size="20" filter="url(#rough2)">
    <text x="70" y="100" fill="#b85450">dot</text>
    <text x="180" y="100" fill="#446688">dot</text>
    <text x="290" y="100" fill="#446688">at</text>
    <text x="390" y="100" fill="#446688">dot</text>
    <text x="500" y="100" fill="#b85450">at</text>
  </g>
  <g font-family="monospace" font-size="20" filter="url(#rough2)">
    <text x="70" y="160" fill="#b85450">dot</text>
    <text x="170" y="160" fill="#2f5223">.</text>
    <text x="250" y="160" fill="#2f5223">@</text>
    <text x="330" y="160" fill="#2f5223">.</text>
    <text x="440" y="160" fill="#b85450">at</text>
  </g>
  <g font-size="11.5" filter="url(#rough2)" text-anchor="middle">
    <text x="95" y="186" fill="#8f3b37">开头保留</text>
    <text x="520" y="186" fill="#8f3b37">结尾保留</text>
    <text x="280" y="186" fill="#2f5223">中间的都还原</text>
  </g>
  <rect x="70" y="206" width="580" height="64" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="230" font-size="12.5" fill="#8a6015" filter="url(#rough2)">恰好还原一个 at 为 @：必须在"非开头、非结尾"的位置。</text>
  <text x="86" y="254" font-size="12.5" fill="#8a6015" filter="url(#rough2)">等长方案里 @ 越靠前字典序越小（ASCII: . &lt; @ &lt; a）。</text>
</svg>
