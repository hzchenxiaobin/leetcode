<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A：两个样例——n = 27 有 2 个，n = 45 有 5 个</text>
  <path d="M 150 42 Q 380 47 610 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 数轴 -->
  <line x1="60" y1="140" x2="700" y2="140" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="164" font-size="10.5" fill="#777" filter="url(#rough2)">2</text>
  <text x="320" y="164" font-size="10.5" fill="#777" filter="url(#rough2)">27</text>
  <text x="520" y="164" font-size="10.5" fill="#777" filter="url(#rough2)">45</text>
  <text x="688" y="164" font-size="10.5" fill="#777" filter="url(#rough2)">n</text>
  <line x1="320" y1="128" x2="320" y2="152" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="520" y1="128" x2="520" y2="152" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <text x="80" y="118" font-size="11" fill="#777" filter="url(#rough2)">Noldbach 数：</text>
  <text x="168" y="118" font-size="11.5" fill="#2f5223" filter="url(#rough2)">13, 19, 31, 37, 43, 53, 61, 79, …</text>

  <circle cx="176" cy="140" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="206" cy="140" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="330" cy="140" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="368" cy="140" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="396" cy="140" r="4" fill="#4a7a3a" filter="url(#rough2)"/>

  <rect x="40" y="188" width="330" height="106" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="212" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">样例 1：n = 27，k = 2</text>
  <text x="52" y="238" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">≤ 27 的 Noldbach 数：13, 19（共 2 个）</text>
  <text x="52" y="262" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">2 ≥ k = 2，答案 YES</text>
  <text x="52" y="284" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">13 = 5+7+1，19 = 7+11+1</text>

  <rect x="392" y="188" width="330" height="106" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="212" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">样例 2：n = 45，k = 7</text>
  <text x="404" y="238" font-size="11.5" fill="#8c3a36" filter="url(#rough2)">≤ 45 的：13, 19, 31, 37, 43（共 5 个）</text>
  <text x="404" y="262" font-size="11.5" fill="#8c3a36" filter="url(#rough2)">5 &lt; 7，答案 NO</text>
  <text x="404" y="284" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">31=13+17+1，37=17+19+1，43=19+23+1</text>
</svg>
