<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">单根代价 = 指向根的反向边数</text>
  <path d="M 180 42 Q 360 48 540 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 树 -->
  <g filter="url(#rough2)">
    <line x1="150" y1="120" x2="80" y2="190" stroke="#4a7a3a" stroke-width="2"/>
    <line x1="150" y1="120" x2="230" y2="190" stroke="#b85450" stroke-width="2"/>
    <line x1="230" y1="190" x2="180" y2="266" stroke="#4a7a3a" stroke-width="2"/>
    <line x1="230" y1="190" x2="290" y2="266" stroke="#b85450" stroke-width="2"/>
  </g>
  <circle cx="150" cy="120" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="80" cy="190" r="18" fill="#ffffff" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="230" cy="190" r="18" fill="#ffffff" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="180" cy="266" r="16" fill="#ffffff" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="290" cy="266" r="16" fill="#ffffff" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">r</text>
  <text x="80" y="197" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">a</text>
  <text x="230" y="197" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">b</text>
  <text x="180" y="272" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">c</text>
  <text x="290" y="272" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d</text>

  <!-- 箭头：a->r 绿色（朝r），r->b 红色？ -->
  <path d="M 100 178 L 132 142" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 168 132 L 212 178" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 216 208 L 196 246" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 244 208 L 280 246" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="150" font-size="10.5" fill="#2f5223" filter="url(#rough2)">a→r</text>
  <text x="216" y="150" font-size="10.5" fill="#8c2f2b" filter="url(#rough2)">r→b</text>
  <text x="168" y="250" font-size="10.5" fill="#2f5223" filter="url(#rough2)">c→b</text>
  <text x="270" y="250" font-size="10.5" fill="#8c2f2b" filter="url(#rough2)">b→d</text>

  <text x="60" y="310" font-size="11.5" fill="#2f5223" filter="url(#rough2)">绿色：背离 r（不用改）</text>
  <text x="60" y="330" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">红色：指向 r，必须翻转才能让 r 到达所有点</text>

  <!-- 换根公式 -->
  <rect x="380" y="86" width="300" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="394" y="110" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">沿边换根（把根从 p 移到孩子 c）</text>
  <text x="394" y="136" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">边 p→c：cost(c) = cost(p) + 1</text>
  <text x="394" y="158" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">边 c→p：cost(c) = cost(p) − 1</text>
  <text x="394" y="182" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">一次 DFS 即可算出所有点的 cost</text>

  <rect x="380" y="222" width="300" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="394" y="246" font-size="12" fill="#7a5a1b" filter="url(#rough2)">记 up 边权重 +1、down 边权重 −1，</text>
  <text x="394" y="268" font-size="12" fill="#7a5a1b" filter="url(#rough2)">pre[v] = 根到 v 的路径和，U = up 边总数，</text>
  <text x="394" y="292" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">则 cost(v) = U − pre[v]</text>
</svg>
