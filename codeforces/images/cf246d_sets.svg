<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">对每条边把「对方的颜色」塞进本方颜色的集合，最后去重取最大</text>
  <rect x="60" y="60" width="260" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="190" y="87" text-anchor="middle" font-size="12" fill="#2f5223">颜色 k 的邻居边</text>
  <text x="190" y="102" text-anchor="middle" font-size="12" fill="#2f5223">(u ∈ V(k), v)</text>
  <rect x="360" y="60" width="300" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="510" y="94" text-anchor="middle" font-size="12" fill="#2f4a66">把 c_v 加入 S(k)（若 c_v ≠ k）</text>
  <rect x="60" y="150" width="600" height="50" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="360" y="179" text-anchor="middle" font-size="12" fill="#7a4b22">|S(k)| = 邻居颜色多样性 Q(k) 的大小；取最大、并列取最小颜色</text>
  <line x1="322" y1="90" x2="356" y2="90" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="240" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">用 vector + sort + unique 去重；只有「图里真实存在的颜色」才参与比较</text>
  <text x="60" y="266" text-anchor="start" font-size="11.5" fill="#2f5223" filter="url(#rough2)">样例 1：颜色 3 的邻居有颜色 1、2、5、8 → 4 种，最大 → 输出 3</text>
</svg>
