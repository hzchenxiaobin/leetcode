<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C：样例 1（s = abca）的 7 个平衡可达串</text>
  <path d="M 170 42 Q 380 47 590 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">n = 4，平衡要求三个字母出现次数是 2,1,1（哪个字母出现两次都可以）</text>

  <rect x="40" y="76" width="216" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a 出现 2 次</text>
  <text x="148" y="126" text-anchor="middle" font-size="14" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">aabc</text>
  <text x="148" y="150" text-anchor="middle" font-size="14" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">abca</text>
  <text x="148" y="174" text-anchor="middle" font-size="14" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">bcaa</text>
  <text x="148" y="202" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">压缩后：abc / abca / bca</text>
  <text x="148" y="220" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">都是 abca 的子序列 ✓</text>

  <rect x="272" y="76" width="216" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">b 出现 2 次</text>
  <text x="380" y="126" text-anchor="middle" font-size="14" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">abbc</text>
  <text x="380" y="150" text-anchor="middle" font-size="14" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">bbca</text>
  <text x="380" y="180" text-anchor="middle" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">压缩后：abc / bca</text>
  <text x="380" y="200" text-anchor="middle" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">都是 abca 的子序列 ✓</text>
  <text x="380" y="218" text-anchor="middle" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">bba c 这类中间重复的已被压缩吸收</text>

  <rect x="504" y="76" width="216" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="612" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c 出现 2 次</text>
  <text x="612" y="126" text-anchor="middle" font-size="14" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">abcc</text>
  <text x="612" y="150" text-anchor="middle" font-size="14" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">bcca</text>
  <text x="612" y="180" text-anchor="middle" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">压缩后：abc / bca</text>
  <text x="612" y="200" text-anchor="middle" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">都是 abca 的子序列 ✓</text>

  <rect x="40" y="244" width="320" height="72" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="268" font-size="11.5" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">反例：aacb 不可达</text>
  <text x="52" y="290" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">压缩成 acb，abca 里 a、c 之后没有 b</text>
  <text x="52" y="308" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">（想放 b 就要覆盖 c，c 便无法恢复）</text>

  <rect x="384" y="244" width="336" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="396" y="268" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">合计 3 + 2 + 2 = 7，与官方输出一致</text>
  <text x="396" y="290" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">暴力 BFS 枚举 31 个可达串，其中平衡的恰好这 7 个</text>
</svg>
