<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">几种典型输入的处理</text>

  <g font-size="14" filter="url(#rough2)">
    <text x="70" y="84" fill="#2f4a66">///</text>
    <text x="300" y="84" fill="#2f5223">/</text>
    <text x="470" y="84" font-size="12" fill="#666">只有斜杠 → 根目录</text>

    <text x="70" y="132" fill="#2f4a66">/a//b///c/</text>
    <text x="300" y="132" fill="#2f5223">/a/b/c</text>
    <text x="470" y="132" font-size="12" fill="#666">合并 + 去掉末尾斜杠</text>

    <text x="70" y="180" fill="#2f4a66">//a</text>
    <text x="300" y="180" fill="#2f5223">/a</text>
    <text x="470" y="180" font-size="12" fill="#666">开头的多余斜杠</text>

    <text x="70" y="228" fill="#2f4a66">/abc</text>
    <text x="300" y="228" fill="#2f5223">/abc</text>
    <text x="470" y="228" font-size="12" fill="#666">已经规范，原样输出</text>

    <text x="70" y="276" fill="#2f4a66">//</text>
    <text x="300" y="276" fill="#2f5223">/</text>
    <text x="470" y="276" font-size="12" fill="#666">根目录</text>
  </g>
  <g stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)">
    <line x1="60" y1="98" x2="700" y2="98"/>
    <line x1="60" y1="146" x2="700" y2="146"/>
    <line x1="60" y1="194" x2="700" y2="194"/>
    <line x1="60" y1="242" x2="700" y2="242"/>
  </g>
  <text x="70" y="58" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">输入</text>
  <text x="300" y="58" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">输出</text>
</svg>
