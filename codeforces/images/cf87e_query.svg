<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">询问：3P 是否在凸多边形内（含边界）</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 120 300 L 200 140 L 400 110 L 560 220 L 520 330 L 300 360 Z" stroke="#446688" stroke-width="1.8" fill="#e8f0fe" filter="url(#rough2)"/>
  <circle cx="200" cy="140" r="5" fill="#fdecea" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="144" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">p0（选一个顶点做扇形中心）</text>
  <path d="M 200 140 L 200 140" stroke="#777777" stroke-width="1.0" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 200 140 L 400 110" stroke="#777777" stroke-width="1.0" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 200 140 L 560 220" stroke="#777777" stroke-width="1.0" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 200 140 L 520 330" stroke="#777777" stroke-width="1.0" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 200 140 L 300 360" stroke="#777777" stroke-width="1.0" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <circle cx="360" cy="240" r="5" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="370" y="244" text-anchor="start" font-size="10.5" fill="#2f5223" filter="url(#rough2)">3P</text>
  <circle cx="620" cy="360" r="5" fill="#fdecea" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="628" y="364" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">在外</text>
  <rect x="60" y="66" width="600" height="56" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="90" text-anchor="start" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">二分找到 P 落在哪个三角形 (p0, p_i, p_{i+1})，再判一次叉积即可：</text>
  <text x="76" y="112" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">复杂度 O(log V)，m=10^5 个询问总量很小。</text>
  <text x="60" y="392" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">所有叉积用 128 位整数：坐标和可达 3×5×10^8，差值再乘会超 64 位。</text>
</svg>
