<svg xmlns="http://www.w3.org/2000/svg" width="700" height="230" viewBox="0 0 700 230"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="230" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">比较流程</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="216" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">O(|s|)</text>
  <rect x="30.0" y="80" width="149.5" height="54" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104.75" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">读入两串</text>
  <text x="104.75" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">等长，含大小写</text>
  <line x1="180.5" y1="107.0" x2="190.5" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="193.5" y="80" width="149.5" height="54" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268.25" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">全部转小写</text>
  <text x="268.25" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">tolower</text>
  <line x1="344.0" y1="107.0" x2="354.0" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="357.0" y="80" width="149.5" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="431.75" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">字典序比较</text>
  <text x="431.75" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">第一个不同字符</text>
  <line x1="507.5" y1="107.0" x2="517.5" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="520.5" y="80" width="149.5" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="595.25" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">输出符号</text>
  <text x="595.25" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">-1 / 0 / 1</text>
</svg>
