<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">180C：在某个位置切开，左边全大写、右边全小写</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="70.0" y="130.0" width="44.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="92.0" y="162.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">P</text>
  <rect x="120.0" y="130.0" width="44.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="142.0" y="162.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">R</text>
  <rect x="170.0" y="130.0" width="44.0" height="50.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="192.0" y="162.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">u</text>
  <rect x="220.0" y="130.0" width="44.0" height="50.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="242.0" y="162.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">v</text>
  <rect x="270.0" y="130.0" width="44.0" height="50.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="292.0" y="162.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="320.0" y="130.0" width="44.0" height="50.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="342.0" y="162.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">t</text>
  <rect x="370.0" y="130.0" width="44.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="392.0" y="162.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">S</text>
  <rect x="420.0" y="130.0" width="44.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="442.0" y="162.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">T</text>
  <rect x="470.0" y="130.0" width="44.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="492.0" y="162.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">A</text>
  <rect x="520.0" y="130.0" width="44.0" height="50.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="542.0" y="162.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="570.0" y="130.0" width="44.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="592.0" y="162.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">Y</text>
  <rect x="620.0" y="130.0" width="44.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="642.0" y="162.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">A</text>
  <line x1="367.0" y1="104.0" x2="367.0" y2="206.0" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="367.0" y="96.0" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">分界点</text>
  <text x="220.0" y="230.0" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">左边（应为大写）</text>
  <text x="560.0" y="230.0" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">右边（应为小写）</text>
  <rect x="40.0" y="250.0" width="640.0" height="96.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="274.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">cost(cut) = 左边小写字母数 + 右边大写字母数</text>
  <text x="54.0" y="300.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">答案 = min over cut = 0..n 的 cost(cut)</text>
  <text x="54.0" y="326.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">用前缀/后缀计数，O(n) 枚举所有分界点</text>
  <text x="40.0" y="386.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">全大写、全小写都允许：分界点在 0 或 n。</text>
</svg>
