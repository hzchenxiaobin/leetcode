<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="720" height="480" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：乘积 = lcm ⟺ 每个素因子只属于一个 pᵢ</text>
  <path d="M 118 44 Q 360 51 602 44" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="360" y="66" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">示例 a = [4, 2, 3, 6]：格子里的数字是 v_q(aᵢ)</text>

  <text x="150" y="104" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">素因子 q</text>
  <text x="268" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a₁ = 4</text>
  <text x="376" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a₂ = 2</text>
  <text x="484" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a₃ = 3</text>
  <text x="592" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a₄ = 6</text>

  <text x="150" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">q = 2</text>
  <rect x="220" y="122" width="96" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="328" y="122" width="96" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="436" y="122" width="96" height="40" rx="5" fill="#f2f2f2" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="544" y="122" width="96" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="376" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="484" y="148" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">—</text>
  <text x="592" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>

  <text x="150" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">q = 3</text>
  <rect x="220" y="184" width="96" height="40" rx="5" fill="#f2f2f2" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="328" y="184" width="96" height="40" rx="5" fill="#f2f2f2" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="436" y="184" width="96" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="544" y="184" width="96" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="268" y="210" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">—</text>
  <text x="376" y="210" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">—</text>
  <text x="484" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="592" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <rect x="62" y="246" width="596" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="268" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">q = 2：可选 (i=1, e=1) (i=1, e=2) (i=2, e=1) (i=4, e=1)，共 2+1+0+1 = 4 种</text>
  <text x="360" y="290" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">再加“谁都不拿 2”这 1 种 ⇒ q = 2 的系数是 4 + 1 = 5</text>

  <rect x="62" y="312" width="596" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="334" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">q = 3：可选 (i=3, e=1) (i=4, e=1)，共 0+0+1+1 = 2 种</text>
  <text x="360" y="356" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">再加“谁都不拿 3”这 1 种 ⇒ q = 3 的系数是 2 + 1 = 3</text>

  <rect x="170" y="386" width="380" height="42" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="360" y="413" text-anchor="middle" font-size="15" font-weight="bold" fill="#a14340" filter="url(#rough2)">ans = (4+1) × (2+1) = 15</text>

  <text x="360" y="452" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">不同素因子互不干扰，可以落在同一个人身上；一旦两人共享素因子，乘积就严格大于 lcm</text>
</svg>
