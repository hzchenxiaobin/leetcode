<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">逆推唯一：每次从大数里减去小数</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">终态 (7,10)：10 较大 ⇒ 最后一步必是 B；一路减到 (1,1) 恰用 5 步</text>
  <g filter="url(#rough2)"><rect x="90" y="130" width="120" height="56" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="150" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">(7,10)</text>
  <text x="150" y="118" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">当前状态</text>
  <g filter="url(#rough2)"><line x1="216" y1="158" x2="334" y2="158" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <text x="278" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a0522d" filter="url(#rough2)">B 段</text>
  <g filter="url(#rough2)"><rect x="340" y="130" width="120" height="56" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="400" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">(7,3)</text>
  <text x="400" y="118" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">当前状态</text>
  <g filter="url(#rough2)"><line x1="466" y1="158" x2="584" y2="158" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <text x="528" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a0522d" filter="url(#rough2)">T 段</text>
  <g filter="url(#rough2)"><rect x="590" y="130" width="120" height="56" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="650" y="165" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">(1,3)</text>
  <text x="650" y="118" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">当前状态</text>
  <text x="420" y="224" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">规则：上 &gt; 下 ⇒ 上减下（逆 T）；下 &gt; 上 ⇒ 下减上（逆 B）；相等时只能是 (1,1)</text>
  <g filter="url(#rough2)"><rect x="100" y="252" width="640" height="62" rx="4" fill="#fdf6f4" fill-opacity="0.85" stroke="#d8a89a" stroke-width="1.3"/></g>
  <text x="420" y="278" text-anchor="middle" font-size="12" fill="#8a4b2a" filter="url(#rough2)">为什么唯一？若终态是 (7,10)，"最后一步是 T" 将要求逆推成 (7−10, 10) = (−3,10)，不合法。</text>
  <text x="420" y="300" text-anchor="middle" font-size="12" fill="#8a4b2a" filter="url(#rough2)">所以每步只有一种选择，整条逆推链由终态完全确定。</text>
  <text x="420" y="348" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">步数 = 各段长度之和；必须恰为 n−1（到达 (1,1)，即第一步 T 之后的状态）</text>
  <text x="420" y="374" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">若两数相等但不是 1（公因数 &gt; 1），这条链永远回不到 (1,1)，无解</text>
</svg>
