<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="720" height="560" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 逐行走查：prev 是「上一个非空行」的设备数</text>
  <path d="M 160 40 Q 360 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="60" y="62" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="116" y="62" width="150" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="266" y="62" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="326" y="62" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="390" y="62" width="200" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="590" y="62" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="88" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">行</text>
  <text x="191" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">bank[i]</text>
  <text x="296" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">cnt</text>
  <text x="358" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">prev</text>
  <text x="490" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">本行操作</text>
  <text x="625" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">ans</text>

  <!-- 第 0 行 -->
  <g filter="url(#sk)">
    <rect x="60" y="100" width="56" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="116" y="100" width="150" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="266" y="100" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="326" y="100" width="64" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="390" y="100" width="200" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="590" y="100" width="70" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
  </g>
  <text x="88" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">0</text>
  <text x="191" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">"011001"</text>
  <text x="296" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">3</text>
  <text x="358" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">0</text>
  <text x="490" y="118" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">ans += 0 × 3（无贡献）</text>
  <text x="490" y="133" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">prev = 3</text>
  <text x="625" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">0</text>

  <!-- 第 1 行（空行） -->
  <g filter="url(#sk)">
    <rect x="60" y="144" width="56" height="40" rx="4" fill="#f3f3f3" stroke="#b8b8b8" stroke-width="1.1"/>
    <rect x="116" y="144" width="150" height="40" rx="4" fill="#f3f3f3" stroke="#b8b8b8" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="266" y="144" width="60" height="40" rx="4" fill="#f3f3f3" stroke="#b8b8b8" stroke-width="1.1"/>
    <rect x="326" y="144" width="64" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="390" y="144" width="200" height="40" rx="4" fill="#f3f3f3" stroke="#b8b8b8" stroke-width="1.1"/>
    <rect x="590" y="144" width="70" height="40" rx="4" fill="#f3f3f3" stroke="#b8b8b8" stroke-width="1.1"/>
  </g>
  <text x="88" y="169" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">1</text>
  <text x="191" y="169" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">"000000"</text>
  <text x="296" y="169" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">0</text>
  <text x="358" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">3</text>
  <text x="490" y="169" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">空行跳过</text>
  <text x="625" y="169" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">0</text>
  <text x="358" y="188" text-anchor="middle" font-size="9.5" fill="#8a6415" filter="url(#sk)">保持!</text>

  <!-- 第 2 行 -->
  <g filter="url(#sk)">
    <rect x="60" y="188" width="56" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="116" y="188" width="150" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="266" y="188" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="326" y="188" width="64" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="390" y="188" width="200" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="590" y="188" width="70" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
  </g>
  <text x="88" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <text x="191" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">"010100"</text>
  <text x="296" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">2</text>
  <text x="358" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">3</text>
  <text x="490" y="206" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">ans += 3 × 2 = 6</text>
  <text x="490" y="221" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">prev = 2</text>
  <text x="625" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">6</text>

  <!-- 第 3 行 -->
  <g filter="url(#sk)">
    <rect x="60" y="232" width="56" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="116" y="232" width="150" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="266" y="232" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="326" y="232" width="64" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="390" y="232" width="200" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="590" y="232" width="70" height="40" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
  </g>
  <text x="88" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">3</text>
  <text x="191" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">"001000"</text>
  <text x="296" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">1</text>
  <text x="358" y="257" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <text x="490" y="250" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">ans += 2 × 1 = 2</text>
  <text x="490" y="265" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">prev = 1</text>
  <text x="625" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">8</text>

  <!-- 结果框 -->
  <g filter="url(#sk)">
    <rect x="240" y="286" width="240" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="360" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">扫描结束，返回 ans = 8 ✓</text>

  <!-- 示例 2 对照 -->
  <text x="360" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">对照示例 2：bank = ["000","111","000"]</text>
  <g filter="url(#sk)">
    <rect x="150" y="374" width="120" height="70" rx="4" fill="#f3f3f3" stroke="#b8b8b8" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="270" y="374" width="120" height="70" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="390" y="374" width="120" height="70" rx="4" fill="#f3f3f3" stroke="#b8b8b8" stroke-width="1.1" stroke-dasharray="4 3"/>
  </g>
  <text x="210" y="402" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">"000"</text>
  <text x="210" y="420" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">cnt = 0</text>
  <text x="330" y="402" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#sk)">"111"</text>
  <text x="330" y="420" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#sk)">cnt = 3</text>
  <text x="450" y="402" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">"000"</text>
  <text x="450" y="420" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">cnt = 0</text>
  <path d="M 270 462 L 240 462" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 390 462 L 420 462" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="150" y="484" width="360" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="330" y="504" text-anchor="middle" font-size="12" fill="#b85450">非空行只有 1 行 → 没有相邻对 → ans = 0 ✓</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="540" y="384" width="140" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="610" y="408" text-anchor="middle" font-size="11.5" fill="#8a6415" filter="url(#sk)">唯一要维护的</text>
  <text x="610" y="424" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">状态就是 prev：</text>
  <text x="610" y="440" text-anchor="middle" font-size="11.5" fill="#8a6415" filter="url(#sk)">最近非空行的 cnt</text>
</svg>
