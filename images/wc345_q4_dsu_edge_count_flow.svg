<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">算法流程：并查集分组，按根数点数、数边数</text>

  <!-- 步骤 1 -->
  <rect x="100" y="48" width="320" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="74" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">① parent[i] = i，初始化并查集</text>
  <path d="M260,90 L260,102" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="100" y="106" width="320" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">② 遍历每条边 [a,b]：union(a, b)</text>
  <path d="M260,148 L260,160" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="100" y="164" width="320" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">③ 遍历顶点 i：vcnt[find(i)] += 1</text>
  <path d="M260,206 L260,218" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 4 -->
  <rect x="100" y="222" width="320" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">④ 遍历边 [a,b]：ecnt[find(a)] += 1（只计一次）</text>
  <path d="M260,264 L260,276" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,280 422,324 260,368 98,324" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">对每个根 r 判定：</text>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">ecnt[r] == vcnt[r]·(vcnt[r]−1)/2 ？</text>

  <!-- 是 分支 -->
  <path d="M98,330 Q98,362 138,380" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="112" y="360" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="48" y="384" width="190" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="143" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a2e" filter="url(#rough2)">ans += 1</text>
  <text x="143" y="426" text-anchor="middle" font-size="11.5" fill="#3a5a2e" filter="url(#rough2)">完全连通分量</text>

  <!-- 否 分支 -->
  <path d="M422,330 Q422,362 382,380" stroke="#888888" stroke-width="2" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>
  <text x="396" y="360" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#888888" filter="url(#rough2)">否</text>
  <rect x="282" y="384" width="190" height="52" rx="8" fill="#ffffff" stroke="#999999" stroke-width="2" filter="url(#rough2)"/>
  <text x="377" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#666666" filter="url(#rough2)">跳过</text>
  <text x="377" y="426" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">仅连通，非完全</text>
</svg>
