<svg xmlns="http://www.w3.org/2000/svg" width="660" height="380" viewBox="0 0 660 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="660" height="380" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：相邻求和金字塔，每轮长度 −1</text>
  <path d="M 190 40 Q 330 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="62" width="280" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="180" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">长度 n 的串 → 长度 n−1 → … → 恰好 2 位</text>

  <g filter="url(#sk)">
    <rect x="340" y="62" width="280" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="480" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">和 mod 10：数字始终在 0~9 内</text>

  <text x="330" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">以 s = "3902" 为例（n = 4）</text>

  <g filter="url(#sk)">
    <rect x="218" y="146" width="46" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="272" y="146" width="46" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="326" y="146" width="46" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="380" y="146" width="46" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="241" y="167">3</text>
    <text x="295" y="167">9</text>
    <text x="349" y="167">0</text>
    <text x="403" y="167">2</text>
  </g>
  <text x="105" y="167" font-size="12" fill="#888" text-anchor="end">第 0 轮（初始）</text>

  <path d="M 238 182 Q 241 200 258 212" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 292 182 Q 295 200 312 212" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 346 182 Q 349 200 366 212" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="245" y="218" width="46" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="299" y="218" width="46" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="353" y="218" width="46" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#7a5415" text-anchor="middle">
    <text x="268" y="239">2</text>
    <text x="322" y="239">9</text>
    <text x="376" y="239">2</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="268" y="262">(3+9)%10</text>
    <text x="322" y="262">(9+0)%10</text>
    <text x="376" y="262">(0+2)%10</text>
  </g>
  <text x="105" y="239" font-size="12" fill="#888" text-anchor="end">第 1 轮（n−1 = 3 位）</text>

  <path d="M 265 254 Q 272 272 290 284" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 319 254 Q 326 272 344 284" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="272" y="290" width="46" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="326" y="290" width="46" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="295" y="311">1</text>
    <text x="349" y="311">1</text>
  </g>
  <text x="105" y="311" font-size="12" fill="#888" text-anchor="end">第 2 轮（n−2 = 2 位，停止）</text>
  <text x="322" y="346" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">两位相同 → true</text>

  <g filter="url(#sk)">
    <rect x="30" y="354" width="600" height="20" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="330" y="368" text-anchor="middle" font-size="11" fill="#888">循环无分支、无死循环风险：n−2 轮后长度必然归 2，只需最后比一次 a[0] 与 a[1]</text>
</svg>
