<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：行优先展平后，一次迁移 = 一维数组整体右移一格</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">行末 (i, n−1) 的下一格恰好是 (i+1, 0)，最后一格 (m−1, n−1) 回到 (0, 0)</text>

  <!-- 3x3 网格 -->
  <rect x="56" y="72" width="132" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <path d="M 100 72 L 100 174 M 144 72 L 144 174 M 56 106 L 188 106 M 56 140 L 188 140" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="78" y="95" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="122" y="95" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="166" y="95" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="78" y="129" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">4</text>
  <text x="122" y="129" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">5</text>
  <text x="166" y="129" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">6</text>
  <text x="78" y="163" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">7</text>
  <text x="122" y="163" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">8</text>
  <text x="166" y="163" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">9</text>
  <text x="122" y="194" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">m = 3, n = 3 的网格 grid</text>

  <!-- 展平箭头 -->
  <path d="M 196 123 L 236 123" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="114" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">展平</text>

  <!-- 一维数组 -->
  <rect x="246" y="109" width="342" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <path d="M 284 109 L 284 137 M 322 109 L 322 137 M 360 109 L 360 137 M 398 109 L 398 137 M 436 109 L 436 137 M 474 109 L 474 137 M 512 109 L 512 137 M 550 109 L 550 137" stroke="#4a7a3a" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <text x="265" y="104" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">0</text>
  <text x="303" y="104" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">1</text>
  <text x="341" y="104" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">2</text>
  <text x="379" y="104" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">3</text>
  <text x="417" y="104" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">4</text>
  <text x="455" y="104" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">5</text>
  <text x="493" y="104" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">6</text>
  <text x="531" y="104" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">7</text>
  <text x="569" y="104" text-anchor="middle" font-size="8" fill="#7a9a6a" filter="url(#rough2)">8</text>
  <text x="265" y="128" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="303" y="128" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">2</text>
  <text x="341" y="128" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">3</text>
  <text x="379" y="128" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">4</text>
  <text x="417" y="128" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">5</text>
  <text x="455" y="128" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">6</text>
  <text x="493" y="128" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">7</text>
  <text x="531" y="128" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">8</text>
  <text x="569" y="128" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">9</text>

  <!-- 回绕箭头 -->
  <path d="M 586 143 C 604 158, 604 176, 566 176 L 268 176 C 250 176, 240 160, 250 145"
        stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 4"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="196" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">迁移一次：整体右移一格，末尾溢出回绕到开头（周期 N = m·n）</text>

  <!-- 结论 -->
  <rect x="44" y="210" width="532" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="231" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">记 N = m·n，新位置 t 的元素来自旧位置 s = (t − k + N) mod N</text>

  <rect x="44" y="254" width="532" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="275" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">k ≥ N 只是空转：k mod N 与 k 结果相同（示例 3 中 k = 9 = N，网格原样返回）</text>

  <text x="310" y="316" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">「换行」与「回绕」被行优先顺序统一成环上的一次 +1 移动</text>
</svg>
