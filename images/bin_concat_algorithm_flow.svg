<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：枚举 3! = 6 种排列</text>
  <path d="M 200 42 Q 340 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Start -->
  <g filter="url(#sk)">
    <ellipse cx="180" cy="80" rx="46" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="180" y="85" text-anchor="middle" font-size="13" fill="#2b4e6e" font-weight="bold">开始</text>

  <g filter="url(#sk)">
    <path d="M 180 102 L 180 122" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- Sort -->
  <g filter="url(#sk)">
    <rect x="100" y="126" width="160" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="180" y="145" text-anchor="middle" font-size="12" fill="#8a6a1a" font-weight="bold">sort(nums) 升序</text>
  <text x="180" y="161" text-anchor="middle" font-size="9.5" fill="#a08030">next_permutation 的前提</text>

  <g filter="url(#sk)">
    <path d="M 180 170 L 180 190" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- Loop entry: current permutation -->
  <g filter="url(#sk)">
    <rect x="100" y="194" width="160" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="180" y="219" text-anchor="middle" font-size="12" fill="#2b4e6e">取当前排列</text>

  <g filter="url(#sk)">
    <path d="M 180 234 L 180 254" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- Concatenate -->
  <g filter="url(#sk)">
    <rect x="70" y="258" width="220" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="180" y="280" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">逐个拼接：v = 0</text>
  <text x="180" y="298" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-family="monospace">for x: v = (v &lt;&lt; L_x) | x</text>

  <g filter="url(#sk)">
    <path d="M 180 310 L 180 330" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- Update max -->
  <g filter="url(#sk)">
    <rect x="100" y="334" width="160" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="180" y="359" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">ans = max(ans, v)</text>

  <g filter="url(#sk)">
    <path d="M 180 374 L 180 394" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- Decision diamond -->
  <g filter="url(#sk)">
    <polygon points="180,398 260,432 180,466 100,432" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="180" y="437" text-anchor="middle" font-size="11" fill="#b03a3a">还有下一个排列?</text>

  <!-- No -> return -->
  <g filter="url(#sk)">
    <path d="M 260 432 L 330 432" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="285" y="424" text-anchor="middle" font-size="11" fill="#888">否</text>
  <g filter="url(#sk)">
    <rect x="334" y="410" width="130" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="399" y="437" text-anchor="middle" font-size="13" fill="#2b4e6e" font-weight="bold">返回 ans</text>

  <!-- Yes -> next_permutation, loop back -->
  <g filter="url(#sk)">
    <path d="M 180 466 L 180 486" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
  </g>
  <text x="192" y="481" font-size="11" fill="#888">是</text>
  <g filter="url(#sk)">
    <rect x="90" y="476" width="180" height="0" rx="0"/>
    <path d="M 100 490 L 60 490" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
    <path d="M 60 490 L 60 214" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
    <path d="M 60 214 L 96 214" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="24" y="380" width="180" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="114" y="405" text-anchor="middle" font-size="10.5" fill="#b03a3a">next_permutation</text>

  <!-- Python note -->
  <g filter="url(#sk)">
    <rect x="360" y="80" width="290" height="170" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="505" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a">Python 更省心</text>
  <text x="505" y="134" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">for perm in permutations(nums):</text>
  <text x="505" y="154" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">    直接生成全部 6 个排列</text>
  <text x="505" y="182" text-anchor="middle" font-size="11" fill="#7a5415">无需先 sort，无漏排风险</text>
  <text x="505" y="204" text-anchor="middle" font-size="11" fill="#7a5415">C++ 的 do-while 必须从</text>
  <text x="505" y="222" text-anchor="middle" font-size="11" fill="#7a5415">最小排列出发才不漏 ⚠️</text>

  <!-- Complexity note -->
  <g filter="url(#sk)">
    <rect x="360" y="270" width="290" height="64" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="505" y="296" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">总量恒定：6 排列 × 3 步拼接</text>
  <text x="505" y="318" text-anchor="middle" font-size="11" fill="#2e6e2e">共 18 次移位/或运算 → O(1)</text>
</svg>
