<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">代价只看每段的第一个元素：nums[0] 白送，另两段各选一个下标</text>
  <rect x="60" y="70" width="72" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96.0" y="100.0" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="96" y="130" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="138" y="70" width="72" height="48" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="174.0" y="100.0" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <text x="174" y="130" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <rect x="216" y="70" width="72" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="252.0" y="100.0" text-anchor="middle" font-size="16" fill="#7a5a10" filter="url(#rough2)">2</text>
  <text x="252" y="130" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <rect x="294" y="70" width="72" height="48" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330.0" y="100.0" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">6</text>
  <text x="330" y="130" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <rect x="372" y="70" width="72" height="48" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="408.0" y="100.0" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <text x="408" y="130" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <rect x="450" y="70" width="72" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="486.0" y="100.0" text-anchor="middle" font-size="16" fill="#7a3030" filter="url(#rough2)">2</text>
  <text x="486" y="130" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <path d="M60,140 L60,152 L210,152 L210,140" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M216,140 L216,152 L444,152 L444,140" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M450,140 L450,152 L522,152 L522,140" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="135" y="172" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">第一段</text>
  <text x="330" y="172" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">第二段</text>
  <text x="486" y="172" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">第三段</text>
  <text x="135" y="190" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">代价 nums[0]</text>
  <text x="330" y="190" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">代价 nums[i₁]</text>
  <text x="486" y="190" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">代价 nums[i₂]</text>
  <rect x="50" y="206" width="460" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">总代价 = nums[0] + nums[i₁] + nums[i₂] = 1 + 2 + 2 = 5</text>
  <rect x="50" y="258" width="460" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#1c3a1c" filter="url(#rough2)">nums[0] 不可改动 → 只需让后两段的首元素尽量小</text>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">切分方案与「两个下标 1 ≤ i₁ &lt; i₂ ≤ n−1」一一对应</text>
</svg>
