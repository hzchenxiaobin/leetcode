<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">book(s, e) 判定流程：定位分界点 + 两侧各查一次</text>
  <text x="320" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">集合内区间按起点升序且两两不相交，故只需检查「后继」与「前驱」</text>

  <rect x="170" y="62" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="85" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">book(s, e)：读入半开区间 [s, e)</text>

  <path d="M 300 98 L 300 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,120 450,158 300,196 150,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="151" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">it = lower_bound(s)</text>
  <text x="300" y="170" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">it 存在 且 it→start &lt; e ?</text>

  <path d="M 450 158 L 516 158" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="484" y="150" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="520" y="138" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="570" y="156" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">重叠，不插入</text>
  <text x="570" y="170" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">return false</text>

  <path d="M 300 196 L 300 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="314" y="218" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <polygon points="300,234 460,272 300,310 140,272" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="265" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">j = prev(it)（前驱）</text>
  <text x="300" y="284" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">j 存在 且 j→end &gt; s ?</text>

  <path d="M 460 272 L 516 272" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="488" y="264" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="520" y="252" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="570" y="270" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">被左侧覆盖</text>
  <text x="570" y="284" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">return false</text>

  <path d="M 300 310 L 300 342" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="314" y="332" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="170" y="346" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="370" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">插入：events[s] = e</text>

  <path d="M 300 386 L 300 404" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="408" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="431" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">return true</text>

  <text x="320" y="460" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">两次判断都是「严格小于 / 严格大于」，端点相接不算重叠</text>
</svg>
