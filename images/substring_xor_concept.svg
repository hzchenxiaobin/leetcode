<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <rect width="640" height="450" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：异或方程唯一解 + 目标至多 30 位</text>
  <path d="M 140 34 Q 320 42 500 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① XOR self-inverse -->
  <text x="52" y="64" font-size="13" font-weight="bold" fill="#4a7a3a">观察 ①：异或是自逆运算 —— 方程唯一解</text>
  <g filter="url(#sk)">
    <rect x="52" y="76" width="150" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="127" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6b">查询 [first, second]</text>
  <path d="M 202 94 L 256 94" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="229" y="86" text-anchor="middle" font-size="9.5" fill="#666">两边 ⊕ first</text>
  <g filter="url(#sk)">
    <rect x="262" y="76" width="178" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="351" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5a22">target = first ⊕ second</text>
  <path d="M 440 94 L 494 94" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="500" y="76" width="88" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="544" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">定值查找</text>
  <text x="52" y="132" font-size="10.5" fill="#666">x ⊕ x = 0，x ⊕ 0 = x ⟹ val ⊕ first = second 有且仅有解 val = first ⊕ second</text>

  <!-- ② 30-bit bound -->
  <text x="52" y="164" font-size="13" font-weight="bold" fill="#4a7a3a">观察 ②：目标至多 30 位 —— 候选长度有常数上界</text>
  <g filter="url(#sk)">
    <rect x="52" y="176" width="168" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="242" y="176" width="118" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="382" y="176" width="206" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="136" y="197" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b">0 ≤ first, second ≤ 10⁹</text>
  <path d="M 220 193 L 236 193" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="301" y="197" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b">target &lt; 2³⁰</text>
  <path d="M 360 193 L 376 193" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="485" y="191" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5a22">二进制至多 30 位</text>
  <text x="485" y="204" text-anchor="middle" font-size="10.5" fill="#2e5a22">⇒ 答案子串长度 ≤ 30</text>
  <text x="52" y="228" font-size="10.5" fill="#666">超过 30 位且无前导零的子串值 ≥ 2³⁰ &gt; target，永不可能是答案</text>

  <!-- ③ value fixes minimal length -->
  <text x="52" y="258" font-size="13" font-weight="bold" fill="#4a7a3a">观察 ③：值决定最短长度 —— 前导零只会更长</text>
  <g filter="url(#sk)">
    <rect x="52" y="272" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="92" y="272" width="36" height="28" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="132" y="272" width="36" height="28" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="196" y="272" width="36" height="28" rx="4" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1.2"/>
  </g>
  <text x="70" y="291" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b">1</text>
  <text x="110" y="291" text-anchor="middle" font-size="12" fill="#888">b</text>
  <text x="150" y="291" text-anchor="middle" font-size="12" fill="#888">b</text>
  <text x="178" y="291" text-anchor="middle" font-size="12" fill="#888">…</text>
  <text x="214" y="291" text-anchor="middle" font-size="12" fill="#888">b</text>
  <path d="M 52 312 Q 52 324 70 324 L 214 324 Q 232 324 232 312" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="142" y="342" text-anchor="middle" font-size="10.5" fill="#2b4a6b">长度 L（以 '1' 开头、无前导零）</text>
  <text x="262" y="286" font-size="11.5" fill="#333">值 ∈ [2^(L−1), 2^L − 1]，区间随 L 两两不交</text>
  <text x="262" y="306" font-size="11.5" font-weight="bold" fill="#333">⇒ 正值 v 的最短表示长度唯一：bitlen(v)</text>
  <text x="262" y="326" font-size="10.5" fill="#666">前导零不改值只加长：例 "01" 与 "1" 值同为 1，但更长</text>

  <!-- verdict cards -->
  <g filter="url(#sk)">
    <rect x="52" y="356" width="168" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="228" y="356" width="168" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="404" y="356" width="184" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="136" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3430">带前导零的等值子串</text>
  <text x="136" y="392" text-anchor="middle" font-size="10" fill="#8a3430">去掉前导零更短，必败 ✗</text>
  <text x="312" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3430">＞30 位的无前导零子串</text>
  <text x="312" y="392" text-anchor="middle" font-size="10" fill="#8a3430">值 ≥ 2³⁰ &gt; target ✗</text>
  <text x="496" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5a22">值 0（first = second）</text>
  <text x="496" y="392" text-anchor="middle" font-size="10" fill="#2e5a22">最短是单个字符 '0' ✓</text>

  <!-- conclusion -->
  <g filter="url(#sk)">
    <rect x="46" y="414" width="548" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="434" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">只需枚举「'1' 开头、长度 1..30」的 ≤ 30n 个候选 + 最左 '0'，全部入哈希表</text>
</svg>
