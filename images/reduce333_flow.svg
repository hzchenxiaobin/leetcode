<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="660" height="560" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：while n &gt; 0，按末两位决策</text>
  <path d="M 170 40 Q 330 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 开始框 -->
  <g filter="url(#rough2)">
    <rect x="70" y="118" width="120" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="130" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">ans = 0</text>
  <path d="M 190 136 L 222 136" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 1：n > 0 ? -->
  <g filter="url(#rough2)">
    <polygon points="320,102 412,138 320,174 228,138" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">n &gt; 0 ?</text>
  <path d="M 412 138 L 450 138" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="429" y="128" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="456" y="120" width="110" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="511" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">返回 ans</text>
  <path d="M 320 174 L 320 202" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="194" font-size="11" fill="#555" filter="url(#rough2)">是</text>

  <!-- 判断 2：最低位 -->
  <g filter="url(#rough2)">
    <polygon points="320,208 412,248 320,288 228,248" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="246" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">最低位是 1 ？</text>
  <text x="320" y="262" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">（n &amp; 1）</text>
  <path d="M 412 248 L 450 248" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="429" y="238" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="456" y="230" width="150" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="531" y="253" text-anchor="middle" font-size="12" fill="#2c4d70" filter="url(#rough2)">n &gt;&gt;= 1（免费折半）</text>
  <path d="M 320 288 L 320 316" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="308" font-size="11" fill="#555" filter="url(#rough2)">是</text>

  <!-- 判断 3：次低位 -->
  <g filter="url(#rough)">
    <polygon points="320,322 428,366 320,410 212,366" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="320" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6210" filter="url(#rough2)">次低位也是 1 ？</text>
  <text x="320" y="378" text-anchor="middle" font-size="10.5" fill="#8a6210" filter="url(#rough2)">（n &amp; 2，即 n mod 4）</text>

  <path d="M 212 366 L 182 366" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="197" y="354" text-anchor="middle" font-size="10.5" fill="#8a6210" filter="url(#rough2)">是（≡3）</text>
  <g filter="url(#rough2)">
    <rect x="36" y="344" width="142" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="107" y="364" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6210" filter="url(#rough2)">ans += 1</text>
  <text x="107" y="382" text-anchor="middle" font-size="11.5" fill="#8a6210" filter="url(#rough2)">n += 1（进位）</text>

  <path d="M 428 366 L 460 366" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="444" y="354" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">否（≡1）</text>
  <g filter="url(#rough2)">
    <rect x="466" y="344" width="142" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="537" y="364" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">ans += 1</text>
  <text x="537" y="382" text-anchor="middle" font-size="11.5" fill="#2c4d70" filter="url(#rough2)">n −= 1（消孤立位）</text>

  <!-- 汇合到 n >>= 1 -->
  <path d="M 107 392 L 107 464 L 264 464" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 537 392 L 537 464 L 406 464" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="270" y="446" width="130" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="335" y="469" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">n &gt;&gt;= 1</text>

  <!-- 免费折半分支汇入回环 -->
  <path d="M 531 266 L 531 528" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="531" cy="528" r="3.2" fill="#3a3a3a" filter="url(#rough2)"/>

  <!-- 回环 -->
  <path d="M 335 482 L 335 528 L 620 528 L 620 88 L 344 88" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480" y="80" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">回到 n &gt; 0 ?</text>

  <!-- 底部备注 -->
  <g filter="url(#rough2)">
    <rect x="36" y="502" width="220" height="48" rx="8" fill="#fdfdfd" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="146" y="522" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">奇数必花 1 次：≡3 进位 / ≡1 消位</text>
  <text x="146" y="540" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">偶数免费折半</text>
</svg>
