<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="79" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：forced 判定 + 全局逆序对</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Lane 1 -->
  <text x="42" y="86" font-size="12" font-weight="bold" fill="#2b6e9e">示例 1</text>
  <path d="M 149 62 A 4 4 0 1 1 157 62" fill="none" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="145" y="62" width="9" height="7" rx="1.5" fill="#d6a040"/>
  </g>
  <path d="M 205 62 A 4 4 0 1 1 213 62" fill="none" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="201" y="62" width="9" height="7" rx="1.5" fill="#d6a040"/>
  </g>
  <g filter="url(#sk)">
    <rect x="95" y="74" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="131" y="74" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="167" y="74" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="203" y="74" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="113" y="92" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="149" y="92" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="185" y="92" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">3</text>
  <text x="221" y="92" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">4</text>
  <text x="252" y="92" text-anchor="middle" font-size="11" fill="#888888">k=1</text>
  <text x="330" y="76" font-size="11" fill="#555">p=1：1 ≠ 2 → 必须解锁</text>
  <text x="330" y="92" font-size="11" fill="#555">p=3：4 = 4 且 pre = max(2,1,3) = 3 → 好墙保留</text>
  <text x="330" y="108" font-size="11" fill="#555">forced = 1 ≤ k ✓，inv = 1（数对 (2,1)）</text>
  <g filter="url(#sk)">
    <rect x="514" y="64" width="102" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="565" y="82" text-anchor="middle" font-size="10" fill="#b85450">答案</text>
  <text x="565" y="100" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1 + 1 = 2 ✓</text>

  <!-- Lane 2 -->
  <text x="42" y="192" font-size="12" font-weight="bold" fill="#2e6e2e">示例 2</text>
  <path d="M 97 168 A 4 4 0 1 1 105 168" fill="none" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="93" y="168" width="9" height="7" rx="1.5" fill="#d6a040"/>
  </g>
  <path d="M 169 168 A 4 4 0 1 1 177 168" fill="none" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="165" y="168" width="9" height="7" rx="1.5" fill="#d6a040"/>
  </g>
  <g filter="url(#sk)">
    <rect x="95" y="180" width="36" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="131" y="180" width="36" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="167" y="180" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="113" y="198" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="149" y="198" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="185" y="198" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="222" y="198" text-anchor="middle" font-size="11" fill="#888888">k=2</text>
  <text x="330" y="182" font-size="11" fill="#555">p=0：3 ≠ 1 → 解锁；p=2：2 ≠ 3 → 解锁</text>
  <text x="330" y="198" font-size="11" fill="#555">forced = 2 ≤ k ✓，inv([3,1,2]) = 2</text>
  <text x="330" y="214" font-size="11" fill="#555">（数对 (3,1)、(3,2)）</text>
  <g filter="url(#sk)">
    <rect x="514" y="170" width="102" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="565" y="188" text-anchor="middle" font-size="10" fill="#b85450">答案</text>
  <text x="565" y="206" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2 + 2 = 4 ✓</text>

  <!-- Lane 3 -->
  <text x="42" y="298" font-size="12" font-weight="bold" fill="#8a6415">示例 3</text>
  <path d="M 97 274 A 4 4 0 1 1 105 274" fill="none" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="93" y="274" width="9" height="7" rx="1.5" fill="#d6a040"/>
  </g>
  <g filter="url(#sk)">
    <rect x="95" y="286" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="131" y="286" width="36" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="167" y="286" width="36" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="113" y="304" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="149" y="304" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">3</text>
  <text x="185" y="304" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="222" y="304" text-anchor="middle" font-size="11" fill="#888888">k=0</text>
  <text x="330" y="288" font-size="11" fill="#555">p=0：2 ≠ 1 → 必须 forced+1</text>
  <text x="330" y="304" font-size="11" fill="#555">forced = 1 &gt; k = 0 → 无预算可用</text>
  <text x="330" y="320" font-size="11" fill="#555">值 2 永远卡死在下标 0</text>
  <g filter="url(#sk)">
    <rect x="514" y="276" width="102" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="565" y="294" text-anchor="middle" font-size="10" fill="#b85450">答案</text>
  <text x="565" y="312" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">−1 ✓</text>

  <!-- Lane 4 -->
  <text x="42" y="404" font-size="12" font-weight="bold" fill="#2b6e9e">补充</text>
  <path d="M 205 380 A 4 4 0 1 1 213 380" fill="none" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="201" y="380" width="9" height="7" rx="1.5" fill="#d6a040"/>
  </g>
  <g filter="url(#sk)">
    <rect x="95" y="392" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="131" y="392" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="167" y="392" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="203" y="392" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="239" y="392" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="275" y="392" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="113" y="410" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">3</text>
  <text x="149" y="410" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">1</text>
  <text x="185" y="410" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="221" y="410" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">4</text>
  <text x="257" y="410" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">6</text>
  <text x="293" y="410" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">5</text>
  <text x="330" y="394" font-size="11" fill="#555">p=3：4 = 4 且 pre = 3 → 好墙保留（k=0 也无需用）</text>
  <text x="330" y="410" font-size="11" fill="#555">forced = 0，inv = 3（左段 2 + 右段 1 + 交叉 0）</text>
  <text x="330" y="426" font-size="11" fill="#555">若解锁它反而 1 + 3 = 4 次，亏 1</text>
  <g filter="url(#sk)">
    <rect x="514" y="382" width="102" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="565" y="400" text-anchor="middle" font-size="10" fill="#b85450">答案</text>
  <text x="565" y="418" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0 + 3 = 3 ✓</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="436" width="560" height="26" rx="8" fill="#f4f0e6" stroke="#9a8a5a" stroke-width="1.3"/>
  </g>
  <text x="320" y="453" text-anchor="middle" font-size="11" fill="#6a5a2a" font-weight="bold">口径统一：值错 / pre≠p 的锁必须解；forced &gt; k → −1；否则答案 = forced + 全局逆序对</text>
</svg>
