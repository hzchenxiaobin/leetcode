<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2b6e9e"/></marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e6e2e"/></marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">代价的 O(1) 计算：中位数切开，两侧前缀和</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="46" y="92" text-anchor="middle" font-size="12" fill="#666">l</text>
  <g filter="url(#sk)"><rect x="66" y="70" width="54" height="38" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="93" y="94" text-anchor="middle" font-size="13" fill="#2b6e9e">a[l]</text>
  <g filter="url(#sk)"><rect x="126" y="70" width="54" height="38" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="153" y="94" text-anchor="middle" font-size="13" fill="#2b6e9e">···</text>
  <g filter="url(#sk)"><rect x="186" y="70" width="54" height="38" rx="5" fill="#fffdf3" stroke="#c98a2b" stroke-width="2.4"/></g>
  <text x="213" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">a[m]</text>
  <text x="213" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">m = ⌊(l+r)/2⌋</text>
  <g filter="url(#sk)"><rect x="246" y="70" width="54" height="38" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="273" y="94" text-anchor="middle" font-size="13" fill="#2b6e9e">···</text>
  <g filter="url(#sk)"><rect x="306" y="70" width="54" height="38" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="333" y="94" text-anchor="middle" font-size="13" fill="#2b6e9e">a[r]</text>
  <text x="370" y="94" text-anchor="middle" font-size="12" fill="#666">r</text>

  <path d="M 120 140 L 208 140" stroke="#2b6e9e" stroke-width="1.4" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 316 140 L 218 140" stroke="#2e6e2e" stroke-width="1.4" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="40" y="156" width="276" height="86" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="178" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">左半（都 ≤ t，抬高到 t）</text>
  <text x="178" y="204" text-anchor="middle" font-size="13" fill="#333">cost_L = t·(m−l+1) − (pre[m+1]−pre[l])</text>
  <text x="178" y="228" text-anchor="middle" font-size="11.5" fill="#666">「目标和」减「实际和」，一段和用前缀和 O(1) 出</text>

  <g filter="url(#sk)"><rect x="324" y="156" width="276" height="86" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="462" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">右半（都 ≥ t，压低到 t）</text>
  <text x="462" y="204" text-anchor="middle" font-size="13" fill="#333">cost_R = (pre[r+1]−pre[m+1]) − t·(r−m)</text>
  <text x="462" y="228" text-anchor="middle" font-size="11.5" fill="#666">「实际和」减「目标和」，同一段和套路</text>

  <path d="M 178 242 L 300 266" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 462 242 L 340 266" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="120" y="270" width="400" height="44" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="320" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">cost(l, r) = cost_L + cost_R</text>
  <text x="320" y="308" text-anchor="middle" font-size="11.5" fill="#666">t = a[m]，全程只用排序数组 + 前缀和，无中位数枚举</text>

  <g filter="url(#sk)"><rect x="60" y="330" width="520" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="320" y="353" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">量级：n·max(a) 可达 10¹⁴ ⇒ C++ 全程 long long（k 本身就是 10¹⁴）</text>
</svg>
