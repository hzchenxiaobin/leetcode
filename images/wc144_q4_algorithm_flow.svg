<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一次扫描，边走边染色</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888">level 就是当前栈深，也就是「接下来这个字符所在的层」</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="34" y="78" width="116" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="92" y="100" font-size="11.5" fill="#33475f" font-weight="bold">① 读 seq[i]</text>
    <text x="92" y="122" fill="#555">level 初值 0</text>
    <text x="92" y="140" fill="#555">未匹配左括号数</text>

    <rect x="170" y="78" width="116" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="228" y="100" font-size="11.5" fill="#8a3a36" font-weight="bold">② 若是 '('</text>
    <text x="228" y="124" fill="#555">level += 1</text>
    <text x="228" y="142" fill="#555">先自增，再染色</text>

    <rect x="306" y="78" width="116" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="364" y="100" font-size="11.5" fill="#8a6a20" font-weight="bold">③ 输出 ans[i]</text>
    <text x="364" y="124" fill="#555">奇 → 0，偶 → 1</text>
    <text x="364" y="142" fill="#555">按 level 的奇偶</text>

    <rect x="442" y="78" width="100" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="492" y="100" font-size="11.5" fill="#3a5a30" font-weight="bold">④ 若是 ')'</text>
    <text x="492" y="124" fill="#555">level -= 1</text>
    <text x="492" y="142" fill="#555">取完奇偶再减</text>
  </g>

  <g stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <path d="M 150 118 L 168 118" marker-end="url(#arr)"/>
    <path d="M 286 118 L 304 118" marker-end="url(#arr)"/>
    <path d="M 422 118 L 440 118" marker-end="url(#arr)"/>
  </g>

  <path d="M 492 158 L 492 190 L 92 190 L 92 162" stroke="#b85450" stroke-width="1.4"
        fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="184" text-anchor="middle" font-size="9.5" fill="#8a3a36">i += 1，直到扫描结束</text>

  <rect x="52" y="206" width="456" height="52" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="68" y="226" font-size="10.5" fill="#444" font-weight="bold">顺序要点：左括号的层数 = 自增之后的 level；右括号的层数 = 自减之前的 level。</text>
  <text x="68" y="246" font-size="10" fill="#555">这样 level 恰好等于该字符所属括号对的层数，一对括号必然得到同一个奇偶。</text>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="70" y="282" fill="#777">层 1</text>
    <rect x="96" y="268" width="74" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="133" y="285" fill="#33475f">→ 0 (A)</text>
    <text x="196" y="282" fill="#777">层 2</text>
    <rect x="222" y="268" width="74" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="259" y="285" fill="#33502a">→ 1 (B)</text>
    <text x="322" y="282" fill="#777">层 3</text>
    <rect x="348" y="268" width="74" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="385" y="285" fill="#33475f">→ 0 (A)</text>
    <text x="448" y="282" fill="#777">层 4</text>
    <rect x="474" y="268" width="62" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="505" y="285" fill="#33502a">→ 1</text>
  </g>

  <rect x="52" y="312" width="456" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="68" y="332" font-size="11" fill="#3a5a30" font-weight="bold">复杂度</text>
  <text x="68" y="350" font-size="10" fill="#555">时间 O(n)：每个字符只做常数次操作，不需要栈、递归或回溯。</text>
  <text x="68" y="364" font-size="10" fill="#555">空间 O(1)：只有 level 一个变量，返回值长度为 n。</text>

  <text x="280" y="396" text-anchor="middle" font-size="9.5" fill="#999">映射取反（奇数层给 B、偶数层给 A）同样合法，因为两组的角色完全对称</text>
  <text x="280" y="416" text-anchor="middle" font-size="9.5" fill="#999">ans[i] = 0 表示归 A，1 表示归 B</text>
</svg>
