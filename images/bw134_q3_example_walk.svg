<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例走查：colors = [0,1,0,0,1,0,1]，k = 6</text>

  <!-- 起点 3 -->
  <text x="112" y="98" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">起点 3</text>
  <rect x="120" y="76" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="172" y="76" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="224" y="76" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="276" y="76" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="328" y="76" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="380" y="76" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="99" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">0</text>
  <text x="196" y="99" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>
  <text x="248" y="99" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">0</text>
  <text x="300" y="99" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>
  <text x="352" y="99" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">0</text>
  <text x="404" y="99" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>
  <text x="452" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 起点 4 -->
  <text x="112" y="168" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">起点 4</text>
  <rect x="120" y="146" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="172" y="146" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="224" y="146" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="276" y="146" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="328" y="146" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="380" y="146" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="169" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>
  <text x="196" y="169" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">0</text>
  <text x="248" y="169" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>
  <text x="300" y="169" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">0</text>
  <text x="352" y="169" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>
  <text x="404" y="169" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">0</text>
  <text x="452" y="169" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 起点 5 -->
  <text x="112" y="238" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">起点 5</text>
  <rect x="120" y="216" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="172" y="216" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="224" y="216" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="276" y="216" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="328" y="216" width="48" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="380" y="216" width="48" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="144" y="239" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">0</text>
  <text x="196" y="239" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>
  <text x="248" y="239" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">0</text>
  <text x="300" y="239" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>
  <text x="352" y="239" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="404" y="239" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">0</text>
  <text x="452" y="239" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="260" y="278" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">起点 5 的窗口出现相邻同色 0,0（红框）⇒ 不是交替组</text>

  <rect x="130" y="292" width="260" height="38" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">答案 = 2（起点 3、4）</text>
</svg>
