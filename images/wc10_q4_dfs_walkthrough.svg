<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：净额 #0 = −5、#1 = +10、#2 = −5</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">dfs 每次把「最靠前的未结清者」整体并入一个异号的人，合并一次记一笔</text>

  <rect x="40" y="62" width="480" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="85" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="235" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">余额 #0 / #1 / #2</text>
  <text x="430" y="83" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">合并动作与等价转账</text>

  <rect x="40" y="94" width="480" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="7" filter="url(#rough2)"/>
  <text x="85" y="121" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">初始</text>
  <rect x="146" y="102" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="171" y="121" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−5</text>
  <rect x="200" y="102" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="225" y="121" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">+10</text>
  <rect x="254" y="102" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="279" y="121" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−5</text>
  <text x="318" y="115" font-size="9.5" fill="#555" filter="url(#rough2)">总和为 0，3 个非零项</text>
  <text x="318" y="130" font-size="9.5" fill="#888" filter="url(#rough2)">笔数暂时未知</text>

  <rect x="40" y="138" width="480" height="46" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="7" filter="url(#rough2)"/>
  <text x="85" y="166" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">①</text>
  <rect x="146" y="147" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="171" y="166" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <rect x="200" y="147" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="225" y="166" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">+5</text>
  <rect x="254" y="147" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="279" y="166" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−5</text>
  <text x="318" y="160" font-size="9.5" fill="#555" filter="url(#rough2)">#0 的 −5 并入 #1（#1 替 #0 收）</text>
  <text x="318" y="175" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">等价于 #1 付给 #0 5 元</text>

  <rect x="40" y="184" width="480" height="46" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="7" filter="url(#rough2)"/>
  <text x="85" y="212" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">②</text>
  <rect x="146" y="193" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="171" y="212" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <rect x="200" y="193" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="225" y="212" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <rect x="254" y="193" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="279" y="212" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="318" y="206" font-size="9.5" fill="#555" filter="url(#rough2)">#1 剩下的 +5 并入 #2（#2 替 #1 付）</text>
  <text x="318" y="221" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">等价于 #1 付给 #2 5 元，全体归零</text>

  <rect x="40" y="242" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="56" y="264" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">共 2 笔，与 n − g = 3 − 1 = 2 完全一致</text>
  <text x="56" y="286" font-size="10" fill="#555" filter="url(#rough2)">每合并一次就是一笔转账；被并入者清零，若并入后对方也变成 0，就同时结清一个零和组。</text>

  <rect x="40" y="308" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="9" filter="url(#rough2)"/>
  <text x="56" y="328" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">示例 2 的净额只剩 #0 = −4、#1 = +4：一次合并即结束，答案 1。</text>
  <text x="56" y="344" font-size="10" fill="#555" filter="url(#rough2)">注意 #2 的净额为 0，一开始就被剔除，不参与搜索。</text>

  <text x="280" y="380" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">n = 12 且没有零和子集时，剪枝后的搜索树约 3×10^5 个节点，Python 也在 0.2 s 量级</text>
</svg>
