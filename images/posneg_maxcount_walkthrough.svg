<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="440" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：三个示例的分段、定位与计数</text>
  <g filter="url(#sk)"><path d="M 190 42 Q 340 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none"/></g>

  <!-- Row 1: [-2,-1,-1,1,2,3] -->
  <text x="80" y="72" font-size="12" font-weight="bold" fill="#555">例 1　nums = [-2,-1,-1,1,2,3]（无 0）</text>
  <g filter="url(#sk)">
    <rect x="80" y="80" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="120" y="80" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="80" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="200" y="80" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="240" y="80" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="280" y="80" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="100" y="100" text-anchor="middle" font-size="11" fill="#333">−2</text>
  <text x="140" y="100" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <text x="180" y="100" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <text x="220" y="100" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="260" y="100" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="300" y="100" text-anchor="middle" font-size="11" fill="#333">3</text>
  <g filter="url(#sk)"><path d="M 200 114 L 200 128" stroke="#b85450" stroke-width="2"/></g>
  <text x="200" y="142" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">l = r = 3（零段为空）</text>
  <g filter="url(#sk)">
    <rect x="430" y="76" width="220" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="540" y="98" text-anchor="middle" font-size="11" fill="#444">neg = 3，pos = 6 − 3 = 3</text>
  <text x="540" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">ans = max(3, 3) = 3</text>
  <g filter="url(#sk)"><path d="M 40 160 Q 340 165 640 160" stroke="#ddd" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/></g>

  <!-- Row 2: [-3,-2,-1,0,0,1,2] -->
  <text x="80" y="186" font-size="12" font-weight="bold" fill="#555">例 2　nums = [-3,-2,-1,0,0,1,2]（含两个 0）</text>
  <g filter="url(#sk)">
    <rect x="80" y="194" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="120" y="194" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="194" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="200" y="194" width="40" height="32" rx="4" fill="#f2f2ee" stroke="#999" stroke-width="1.4"/>
    <rect x="240" y="194" width="40" height="32" rx="4" fill="#f2f2ee" stroke="#999" stroke-width="1.4"/>
    <rect x="280" y="194" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="320" y="194" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="100" y="214" text-anchor="middle" font-size="11" fill="#333">−3</text>
  <text x="140" y="214" text-anchor="middle" font-size="11" fill="#333">−2</text>
  <text x="180" y="214" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <text x="220" y="214" text-anchor="middle" font-size="11" fill="#777">0</text>
  <text x="260" y="214" text-anchor="middle" font-size="11" fill="#777">0</text>
  <text x="300" y="214" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="340" y="214" text-anchor="middle" font-size="11" fill="#333">2</text>
  <g filter="url(#sk)">
    <path d="M 200 228 L 200 242" stroke="#b85450" stroke-width="2"/>
    <path d="M 280 228 L 280 242" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="200" y="256" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">l = 3</text>
  <text x="280" y="256" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">r = 5</text>
  <g filter="url(#sk)">
    <rect x="430" y="190" width="220" height="68" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="540" y="211" text-anchor="middle" font-size="11" fill="#444">neg = 3，pos = 7 − 5 = 2</text>
  <text x="540" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">ans = max(3, 2) = 3</text>
  <text x="540" y="248" text-anchor="middle" font-size="10.5" fill="#888">两个 0 被夹住，不计入 ✓</text>
  <g filter="url(#sk)"><path d="M 40 276 Q 340 281 640 276" stroke="#ddd" stroke-width="1.2" stroke-dasharray="5 4" fill="none"/></g>

  <!-- Row 3: [5,20,66,1314] -->
  <text x="80" y="306" font-size="12" font-weight="bold" fill="#555">例 3　nums = [5,20,66,1314]（全正）</text>
  <g filter="url(#sk)">
    <rect x="80" y="314" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="120" y="314" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="160" y="314" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="200" y="314" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="100" y="334" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="140" y="334" text-anchor="middle" font-size="11" fill="#333">20</text>
  <text x="180" y="334" text-anchor="middle" font-size="11" fill="#333">66</text>
  <text x="220" y="334" text-anchor="middle" font-size="11" fill="#333">1314</text>
  <g filter="url(#sk)"><path d="M 80 348 L 80 362" stroke="#b85450" stroke-width="2"/></g>
  <text x="95" y="376" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">l = r = 0（无负无零）</text>
  <g filter="url(#sk)">
    <rect x="430" y="310" width="220" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="540" y="332" text-anchor="middle" font-size="11" fill="#444">neg = 0，pos = 4 − 0 = 4</text>
  <text x="540" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">ans = max(0, 4) = 4</text>

  <!-- key takeaway -->
  <g filter="url(#sk)">
    <rect x="40" y="388" width="600" height="44" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="60" y="406" font-size="11.5" font-weight="bold" fill="#2b2b2b">考点在例 2：lower 落在首个 0 上（=3），upper 越过两个 0（=5），零段被自动跳过，</text>
  <text x="60" y="424" font-size="11" fill="#444">无需任何 if 特判；全负 / 全正 / 全零时插入点语义同样自动兜底。</text>
</svg>
