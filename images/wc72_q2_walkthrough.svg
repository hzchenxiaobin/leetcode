<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="460" fill="#fafafa"/>

  <text x="350" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例 1 走查：第 3 步撞到同色边 (1,2)</text>

  <!-- 左侧：示例 1 的图 -->
  <rect x="40" y="60" width="280" height="268" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <g stroke-width="2" fill="none" filter="url(#rough2)">
    <path d="M175,96 L95,196" stroke="#446688"/>
    <path d="M175,96 L255,196" stroke="#446688"/>
    <path d="M175,96 L175,296" stroke="#446688"/>
    <path d="M95,196 L255,196" stroke="#b85450" stroke-width="3.2" stroke-dasharray="7 5"/>
    <path d="M255,196 L175,296" stroke="#4a7a3a"/>
  </g>

  <g filter="url(#rough2)">
    <circle cx="175" cy="96" r="22" fill="#ffffff" stroke="#446688" stroke-width="2.6"/>
    <text x="175" y="102" text-anchor="middle" font-size="13" fill="#333">0</text>
    <circle cx="95" cy="196" r="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="2.6"/>
    <text x="95" y="202" text-anchor="middle" font-size="13" fill="#333">1</text>
    <circle cx="255" cy="196" r="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="2.6"/>
    <text x="255" y="202" text-anchor="middle" font-size="13" fill="#333">2</text>
    <circle cx="175" cy="296" r="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="2.6"/>
    <text x="175" y="302" text-anchor="middle" font-size="13" fill="#333">3</text>
    <text x="175" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 同色</text>
  </g>

  <text x="180" y="352" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">0 染 0 ⇒ 邻居 1、2、3 全染 1</text>
  <text x="180" y="370" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">蓝 = 组 A（色 0）　绿 = 组 B（色 1）</text>

  <!-- 右侧：BFS 走查表 -->
  <rect x="350" y="60" width="340" height="28" rx="6" fill="#c9dcf6" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="382" y="80" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">步骤</text>
  <text x="428" y="80" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">u</text>
  <text x="550" y="80" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">动作与结果</text>

  <rect x="350" y="90" width="340" height="40" fill="#ffffff" stroke="#aab4c4" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="382" y="115" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="428" y="115" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="458" y="115" font-size="10.3" fill="#555" filter="url(#rough2)">邻居 1,2,3 未染色 ⇒ 全染 1，入队</text>

  <rect x="350" y="130" width="340" height="40" fill="#ffffff" stroke="#aab4c4" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="382" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="428" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="458" y="155" font-size="10.3" fill="#555" filter="url(#rough2)">看邻居 0：色 0 ≠ 色 1，异色通过</text>

  <rect x="350" y="170" width="340" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="382" y="195" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">3</text>
  <text x="428" y="195" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="458" y="195" font-size="10.3" fill="#8a3a36" filter="url(#rough2)">看邻居 2：色 1 = 色 1 ⇒ 返回 false</text>

  <!-- 右侧说明框 -->
  <rect x="350" y="228" width="340" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="366" y="250" font-size="10.8" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么冲突躲不掉？</text>
  <text x="366" y="272" font-size="9.8" fill="#666" filter="url(#rough2)">0-1-2 构成三角形。从 0 出发，1 与 2 的距离</text>
  <text x="366" y="289" font-size="9.8" fill="#666" filter="url(#rough2)">都是 1，颜色必相同；可边 (1,2) 又要求异色。</text>
  <text x="366" y="308" font-size="9.8" fill="#666" filter="url(#rough2)">奇环长度 3 为奇数 ⇒ 二染色从根本上无解。</text>

  <!-- 底部：示例 2 -->
  <rect x="40" y="372" width="650" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="393" font-size="10.8" fill="#3a5a30" filter="url(#rough2)">示例 2：graph = [[1,3],[0,2],[1,3],[0,2]]，出队顺序 0 → 1 → 3 → 2</text>
  <text x="58" y="413" font-size="10.8" fill="#3a5a30" filter="url(#rough2)">染色 c(0)=0、c(1)=1、c(3)=1、c(2)=0 —— 四条边全部异色 ⇒ true，两组为 {0,2} 与 {1,3}</text>
</svg>
