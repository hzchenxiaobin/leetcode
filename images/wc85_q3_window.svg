<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">滑动窗口：转移只需维护一个前缀和</text>

  <!-- dp 数组格子 -->
  <g filter="url(#rough2)">
    <text x="60" y="66" font-size="12" fill="#666">dp[i-M-1]</text>
    <text x="428" y="66" font-size="12" fill="#666">dp[i-1]</text>
    <rect x="60" y="76" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="77" y="98" text-anchor="middle" font-size="11" fill="#446688">old</text>
    <rect x="100" y="76" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="117" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a">in</text>
    <rect x="140" y="76" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="157" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a">in</text>
    <rect x="180" y="76" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="197" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a">in</text>
    <rect x="220" y="76" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="237" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a">in</text>
    <rect x="260" y="76" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="277" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a">in</text>
    <rect x="300" y="76" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="317" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a">in</text>
    <rect x="340" y="76" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="357" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a">in</text>
    <rect x="380" y="76" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="397" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a">in</text>
    <rect x="420" y="76" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="437" y="98" text-anchor="middle" font-size="11" fill="#8a6a10">new</text>

    <!-- 窗口括号 -->
    <path d="M100,120 L100,132 L420,132 L420,120" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <text x="260" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a">窗口 W = Σ dp[j]，长度 maxPts</text>
  </g>

  <!-- 三个操作 -->
  <g filter="url(#rough2)">
    <rect x="36" y="176" width="140" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="106" y="200" text-anchor="middle" font-size="12" fill="#2f5527">加入 dp[i-1]</text>
    <text x="106" y="220" text-anchor="middle" font-size="11" fill="#2f5527">仅当 i-1 &lt; k</text>
    <text x="106" y="238" text-anchor="middle" font-size="11" fill="#2f5527">W += dp[i-1]</text>

    <rect x="188" y="176" width="140" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="258" y="200" text-anchor="middle" font-size="12" fill="#8a3020">移出 dp[i-M-1]</text>
    <text x="258" y="220" text-anchor="middle" font-size="11" fill="#8a3020">下标 ≥ 0 且 &lt; k</text>
    <text x="258" y="238" text-anchor="middle" font-size="11" fill="#8a3020">W -= dp[i-M-1]</text>

    <rect x="340" y="176" width="140" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="410" y="200" text-anchor="middle" font-size="12" fill="#7a5a10">写入 dp[i]</text>
    <text x="410" y="220" text-anchor="middle" font-size="11" fill="#7a5a10">dp[i] = W / maxPts</text>
    <text x="410" y="238" text-anchor="middle" font-size="11" fill="#7a5a10">O(1) 完成</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="80" y="268" width="360" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="292" text-anchor="middle" font-size="12" fill="#2f4a66">每个 i 只做一次加法、一次减法、一次除法</text>
    <text x="260" y="314" text-anchor="middle" font-size="12" fill="#4a7a3a">总时间 O(n)，而不是朴素的 O(n·maxPts)</text>
  </g>
</svg>
