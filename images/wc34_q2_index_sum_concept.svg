<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">最小索引和：把公共串的代价看成 i + j</text>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">同一字符串在 list1 的下标 i、在 list2 的下标 j，和为代价；取代价最小者</text>

  <text x="44" y="112" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">list1</text>
  <text x="44" y="236" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">list2</text>

  <text x="155" y="78" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i = 0</text>
  <text x="305" y="78" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i = 1</text>
  <text x="455" y="78" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i = 2</text>

  <rect x="90" y="86" width="130" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="155" y="115" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">happy</text>
  <rect x="240" y="86" width="130" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="305" y="115" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">sad</text>
  <rect x="390" y="86" width="130" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="455" y="115" text-anchor="middle" font-size="14" fill="#3a4a66" filter="url(#rough2)">good</text>

  <text x="155" y="202" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j = 0</text>
  <text x="305" y="202" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j = 1</text>
  <text x="455" y="202" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j = 2</text>

  <rect x="90" y="210" width="130" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="155" y="239" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">sad</text>
  <rect x="240" y="210" width="130" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="305" y="239" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">happy</text>
  <rect x="390" y="210" width="130" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="455" y="239" text-anchor="middle" font-size="14" fill="#3a5a30" filter="url(#rough2)">good</text>

  <path d="M 155 132 C 200 158 250 180 293 208" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="52" y="180" font-size="11" fill="#b85450" filter="url(#rough2)">happy：0 + 1 = 1</text>

  <path d="M 305 132 C 260 160 210 180 167 208" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="182" font-size="11" fill="#4a7a3a" filter="url(#rough2)">sad：1 + 0 = 1</text>

  <path d="M 455 132 L 455 208" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="468" y="176" font-size="11" fill="#a97c1f" filter="url(#rough2)">good：2 + 2 = 4</text>

  <rect x="90" y="300" width="460" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="106" y="322" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">最小索引和 = 1（并列）⇒ 返回 ["happy", "sad"]</text>
  <text x="106" y="340" font-size="10.5" fill="#666" filter="url(#rough2)">并列的公共串要全部收集；遇到更小的和就把已收集的答案清空重来</text>

  <text x="320" y="382" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">i 来自 list1（蓝）、j 来自 list2（绿），箭头方向即「同一个字符串的两处出现」</text>
</svg>
