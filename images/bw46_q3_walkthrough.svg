<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">示例 2 演算：isWater 与逐层扩散结果</text>

  <!-- 左：输入 -->
  <text x="110" y="62" text-anchor="middle" font-size="13.5" fill="#666" filter="url(#rough2)">输入 isWater</text>
  <g>
    <rect x="60" y="74" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="104" y="74" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="148" y="74" width="44" height="44" rx="4" fill="#446688" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="60" y="118" width="44" height="44" rx="4" fill="#446688" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="104" y="118" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="148" y="118" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="60" y="162" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="104" y="162" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="148" y="162" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="82" y="101" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>
    <text x="126" y="101" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>
    <text x="170" y="101" text-anchor="middle" font-size="13" fill="#ffffff" filter="url(#rough2)">1</text>
    <text x="82" y="145" text-anchor="middle" font-size="13" fill="#ffffff" filter="url(#rough2)">1</text>
    <text x="126" y="145" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>
    <text x="170" y="145" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>
    <text x="82" y="189" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>
    <text x="126" y="189" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>
    <text x="170" y="189" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>
  </g>

  <!-- 中：箭头 -->
  <path d="M204,130 Q236,130 254,120" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="152" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">多源 BFS</text>

  <!-- 右：输出高度 -->
  <text x="386" y="62" text-anchor="middle" font-size="13.5" fill="#666" filter="url(#rough2)">输出 height</text>
  <g>
    <rect x="336" y="74" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="380" y="74" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="424" y="74" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="336" y="118" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="380" y="118" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="424" y="118" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="336" y="162" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="380" y="162" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <rect x="424" y="162" width="44" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="358" y="101" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
    <text x="402" y="101" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
    <text x="446" y="101" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
    <text x="358" y="145" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
    <text x="402" y="145" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
    <text x="446" y="145" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
    <text x="358" y="189" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
    <text x="402" y="189" text-anchor="middle" font-size="14" fill="#b8642a" filter="url(#rough2)">2</text>
    <text x="446" y="189" text-anchor="middle" font-size="14" fill="#b8642a" filter="url(#rough2)">2</text>
  </g>
  <text x="400" y="228" text-anchor="middle" font-size="12.5" fill="#b8642a" filter="url(#rough2)">右下角离水域最远 → 最高高度 2</text>

  <!-- 层表 -->
  <rect x="316" y="248" width="196" height="88" rx="10" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="334" y="272" font-size="12.5" fill="#446688" filter="url(#rough2)">第 0 层（水域）：2 格</text>
  <text x="334" y="294" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">第 1 层：5 格，高度 1</text>
  <text x="334" y="316" font-size="12.5" fill="#b8642a" filter="url(#rough2)">第 2 层：2 格，高度 2</text>

  <text x="62" y="238" font-size="12.5" fill="#888" filter="url(#rough2)">蓝深色 = 水域（高度 0），</text>
  <text x="62" y="258" font-size="12.5" fill="#888" filter="url(#rough2)">绿 = 高度 1，</text>
  <text x="62" y="278" font-size="12.5" fill="#888" filter="url(#rough2)">橙 = 高度 2（最远格）</text>
  <text x="62" y="316" font-size="12.5" fill="#888" filter="url(#rough2)">每个格子首达即最短，</text>
  <text x="62" y="334" font-size="12.5" fill="#888" filter="url(#rough2)">与层内出队顺序无关</text>
</svg>
