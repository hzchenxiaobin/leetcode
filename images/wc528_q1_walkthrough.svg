<svg xmlns="http://www.w3.org/2000/svg" width="660" height="452" viewBox="0 0 660 452" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="660" height="452" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 走查：逐格比较 AND 与 min</text>
  <path d="M 150 38 Q 330 46 510 38" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="219" y="56" text-anchor="middle" font-size="11" fill="#7a8899" filter="url(#rough2)">0</text>
  <text x="293" y="56" text-anchor="middle" font-size="11" fill="#7a8899" filter="url(#rough2)">1</text>
  <text x="367" y="56" text-anchor="middle" font-size="11" fill="#7a8899" filter="url(#rough2)">2</text>
  <text x="441" y="56" text-anchor="middle" font-size="11" fill="#7a8899" filter="url(#rough2)">3</text>

  <g filter="url(#rough2)">
    <rect x="185" y="62" width="68" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="259" y="62" width="68" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="333" y="62" width="68" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="407" y="62" width="68" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="219" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">5</text>
  <text x="293" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">3</text>
  <text x="367" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">1</text>
  <text x="441" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">2</text>

  <text x="176" y="120" text-anchor="end" font-size="12" fill="#7a8899" filter="url(#rough2)">l ＼ r</text>
  <text x="238" y="120" text-anchor="middle" font-size="12" fill="#7a8899" filter="url(#rough2)">r＝0</text>
  <text x="340" y="120" text-anchor="middle" font-size="12" fill="#7a8899" filter="url(#rough2)">r＝1</text>
  <text x="442" y="120" text-anchor="middle" font-size="12" fill="#7a8899" filter="url(#rough2)">r＝2</text>
  <text x="544" y="120" text-anchor="middle" font-size="12" fill="#7a8899" filter="url(#rough2)">r＝3</text>
  <text x="612" y="120" text-anchor="middle" font-size="11" fill="#7a8899" filter="url(#rough2)">✓ 数</text>

  <g filter="url(#rough2)">
    <rect x="190" y="132" width="96" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="292" y="132" width="96" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="394" y="132" width="96" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="496" y="132" width="96" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>

    <rect x="190" y="184" width="96" height="44" rx="6" fill="#f1f1f1" stroke="#cfcfcf" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="292" y="184" width="96" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="394" y="184" width="96" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="496" y="184" width="96" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>

    <rect x="190" y="236" width="96" height="44" rx="6" fill="#f1f1f1" stroke="#cfcfcf" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="292" y="236" width="96" height="44" rx="6" fill="#f1f1f1" stroke="#cfcfcf" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="394" y="236" width="96" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="496" y="236" width="96" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>

    <rect x="190" y="288" width="96" height="44" rx="6" fill="#f1f1f1" stroke="#cfcfcf" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="292" y="288" width="96" height="44" rx="6" fill="#f1f1f1" stroke="#cfcfcf" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="394" y="288" width="96" height="44" rx="6" fill="#f1f1f1" stroke="#cfcfcf" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="496" y="288" width="96" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>

  <text x="176" y="159" text-anchor="end" font-size="12.5" fill="#2b4a6e" filter="url(#rough2)">l＝0</text>
  <text x="176" y="211" text-anchor="end" font-size="12.5" fill="#2b4a6e" filter="url(#rough2)">l＝1</text>
  <text x="176" y="263" text-anchor="end" font-size="12.5" fill="#2b4a6e" filter="url(#rough2)">l＝2</text>
  <text x="176" y="315" text-anchor="end" font-size="12.5" fill="#2b4a6e" filter="url(#rough2)">l＝3</text>

  <text x="238" y="160" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">5 ＝ 5</text>
  <text x="340" y="160" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8f3830" filter="url(#rough2)">1 ≠ 3</text>
  <text x="442" y="160" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">1 ＝ 1</text>
  <text x="544" y="160" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8f3830" filter="url(#rough2)">0 ≠ 1</text>

  <text x="238" y="212" text-anchor="middle" font-size="12" fill="#b3b3b3" filter="url(#rough2)">—</text>
  <text x="340" y="212" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">3 ＝ 3</text>
  <text x="442" y="212" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">1 ＝ 1</text>
  <text x="544" y="212" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8f3830" filter="url(#rough2)">0 ≠ 1</text>

  <text x="238" y="264" text-anchor="middle" font-size="12" fill="#b3b3b3" filter="url(#rough2)">—</text>
  <text x="340" y="264" text-anchor="middle" font-size="12" fill="#b3b3b3" filter="url(#rough2)">—</text>
  <text x="442" y="264" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">1 ＝ 1</text>
  <text x="544" y="264" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8f3830" filter="url(#rough2)">0 ≠ 1</text>

  <text x="238" y="316" text-anchor="middle" font-size="12" fill="#b3b3b3" filter="url(#rough2)">—</text>
  <text x="340" y="316" text-anchor="middle" font-size="12" fill="#b3b3b3" filter="url(#rough2)">—</text>
  <text x="442" y="316" text-anchor="middle" font-size="12" fill="#b3b3b3" filter="url(#rough2)">—</text>
  <text x="544" y="316" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">2 ＝ 2</text>

  <text x="612" y="159" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="612" y="211" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="612" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="612" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <text x="330" y="356" text-anchor="middle" font-size="12.5" fill="#8a6415" filter="url(#rough2)">绿 ＝ 一致（AND ＝ min），粉 ＝ 不一致（AND ＜ min）</text>
  <rect x="130" y="370" width="400" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="396" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6415" filter="url(#rough2)">合计 2 ＋ 2 ＋ 1 ＋ 1 ＝ 6 个一致子数组</text>
  <text x="330" y="434" text-anchor="middle" font-size="12" fill="#8f3830" filter="url(#rough2)">每行都必须扫到 r＝n−1：[6, 3, 2] 这类数组会先不等、后相等</text>
</svg>
