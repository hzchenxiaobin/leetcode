<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">刚性平移：整条 copy 相对 original 只能整体挪动</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">copy[i] − copy[i−1] = original[i] − original[i−1] ⇒ copy[i] = copy[0] + d_i</text>
  <text x="20" y="96" text-anchor="start" font-size="10.5" fill="#333333" font-weight="bold" filter="url(#rough2)">original</text>
  <text x="20" y="208" text-anchor="start" font-size="10.5" fill="#333333" font-weight="bold" filter="url(#rough2)">copy</text>
  <rect x="88" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110.0" y="103.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="110" y="132" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">d=0</text>
  <rect x="144" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166.0" y="103.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="166" y="132" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">d=1</text>
  <rect x="200" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222.0" y="103.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="222" y="132" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">d=2</text>
  <rect x="256" y="80" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278.0" y="103.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="278" y="132" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">d=3</text>
  <rect x="140" y="192" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162.0" y="215.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="196" y="192" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218.0" y="215.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="252" y="192" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274.0" y="215.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="308" y="192" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330.0" y="215.04" text-anchor="middle" font-size="14" fill="#333333" font-weight="bold" filter="url(#rough2)">5</text>
  <path d="M 106 140 L 160 188" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 162 140 L 216 188" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 218 140 L 272 188" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 274 140 L 328 188" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="470" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">平移量 t = 1</text>
  <text x="470" y="232" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">copy[0] = 2 − 1 + 1</text>
  <rect x="40" y="262" width="500" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="290" y="286" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">每个位置都把 copy[0] 夹在一个闭区间里</text>
  <text x="290" y="310" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">u_i ≤ copy[0] + d_i ≤ v_i  ⇒  u_i − d_i ≤ copy[0] ≤ v_i − d_i</text>
  <text x="290" y="330" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">n 个区间取交集，交集里的每个整数对应一个合法数组</text>
</svg>
