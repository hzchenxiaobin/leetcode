<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次建池 + 一次逐位扫描</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">总代价 O((n + m)·L)，空间 O(m·L)，L 为单词长度上限</text>

  <rect x="50" y="68" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="66" y="87" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">① 词数相等？</text>
  <text x="66" y="103" font-size="9.5" fill="#555" filter="url(#rough2)">len(words1) ≠ len(words2) 直接拒绝</text>
  <path d="M 350 90 L 380 90" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="382" y="70" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="452" y="88" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">return false</text>
  <text x="452" y="103" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">示例 3：1 ≠ 2</text>

  <path d="M 200 112 L 200 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="140" width="300" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="66" y="159" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 建键池 Pool</text>
  <text x="66" y="177" font-size="9.5" fill="#555" filter="url(#rough2)">对每个 [a, b]：插入 (a, b) 与 (b, a) 两个键</text>
  <text x="66" y="194" font-size="9.5" fill="#555" filter="url(#rough2)">key = len(a) + '#' + a + b（长度前缀，单射）</text>

  <path d="M 200 204 L 200 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="230" width="300" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="66" y="249" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">③ 逐位检查 i = 0 … n−1</text>
  <text x="66" y="267" font-size="9.5" fill="#555" filter="url(#rough2)">words1[i] == words2[i] ⇒ 跳过该位</text>
  <text x="66" y="284" font-size="9.5" fill="#555" filter="url(#rough2)">否则查 key(words1[i], words2[i]) 是否在池中</text>
  <text x="66" y="301" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">不在池中 ⇒ 立即 return false</text>

  <path d="M 200 308 L 200 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="334" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="66" y="353" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">④ 全部位置通过 ⇒ return true</text>
  <text x="66" y="369" font-size="9.5" fill="#555" filter="url(#rough2)">空句子（n = 0）也会走到这里</text>

  <path d="M 350 172 L 378 172" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="146" width="162" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="392" y="165" font-size="9.5" fill="#666" filter="url(#rough2)">键最长 20 + 1 + 20 + 2 字节</text>
  <text x="392" y="181" font-size="9.5" fill="#666" filter="url(#rough2)">≤ 4000 个键，内存很小</text>

  <path d="M 350 268 L 378 268" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="236" width="162" height="64" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="392" y="255" font-size="9.5" fill="#666" filter="url(#rough2)">均摊 O(1) 查表</text>
  <text x="392" y="271" font-size="9.5" fill="#666" filter="url(#rough2)">C++ 先 reserve(2m+1)</text>
  <text x="392" y="287" font-size="9.5" fill="#666" filter="url(#rough2)">减少 rehash</text>

  <text x="280" y="406" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">相似判定逐位独立、无状态 —— 这正是哈希表能替代 O(n·m) 两两扫描的原因</text>
</svg>
