<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "1010"，encCost = 2，flatCost = 1（共 7 个段）</text>

  <!-- table geometry: x from 35 to 525 -->
  <g filter="url(#rough2)">
    <!-- header -->
    <rect x="35" y="44" width="490" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <line x1="150" y1="44" x2="150" y2="282" stroke="#446688" stroke-width="1"/>
    <line x1="196" y1="44" x2="196" y2="282" stroke="#446688" stroke-width="1"/>
    <line x1="242" y1="44" x2="242" y2="282" stroke="#446688" stroke-width="1"/>
    <line x1="348" y1="44" x2="348" y2="282" stroke="#446688" stroke-width="1"/>
    <line x1="464" y1="44" x2="464" y2="282" stroke="#446688" stroke-width="1"/>
    <line x1="35" y1="72" x2="525" y2="72" stroke="#446688" stroke-width="1.2"/>

    <text x="92" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">段（DFS 序）</text>
    <text x="173" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">L</text>
    <text x="219" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">X</text>
    <text x="295" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">不拆费用</text>
    <text x="406" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">拆分费用</text>
    <text x="494" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f 取值</text>

    <!-- row 1: root emphasized -->
    <rect x="35" y="72" width="490" height="30" fill="#fce4ec" stroke="none" opacity="0.55"/>
    <line x1="35" y1="102" x2="525" y2="102" stroke="#aab" stroke-width="1"/>
    <text x="92" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[0,4) "1010"</text>
    <text x="173" y="92" text-anchor="middle" font-size="11" fill="#333">4</text>
    <text x="219" y="92" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="295" y="92" text-anchor="middle" font-size="11" fill="#b85450">4×2×2 = 16</text>
    <text x="406" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a">3 + 3 = 6 ✓</text>
    <text x="494" y="92" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">6</text>

    <!-- row 2 -->
    <line x1="35" y1="132" x2="525" y2="132" stroke="#aab" stroke-width="1"/>
    <text x="92" y="122" text-anchor="middle" font-size="11" fill="#333">[0,2) "10"</text>
    <text x="173" y="122" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="219" y="122" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="295" y="122" text-anchor="middle" font-size="11" fill="#b85450">2×1×2 = 4</text>
    <text x="406" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a">2 + 1 = 3 ✓</text>
    <text x="494" y="122" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">3</text>

    <!-- row 3 -->
    <line x1="35" y1="162" x2="525" y2="162" stroke="#aab" stroke-width="1"/>
    <text x="92" y="152" text-anchor="middle" font-size="11" fill="#333">[0,1) "1"</text>
    <text x="173" y="152" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="219" y="152" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="295" y="152" text-anchor="middle" font-size="11" fill="#333">1×1×2 = 2</text>
    <text x="406" y="152" text-anchor="middle" font-size="11" fill="#888">奇数长，拆不了</text>
    <text x="494" y="152" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">2</text>

    <!-- row 4 -->
    <line x1="35" y1="192" x2="525" y2="192" stroke="#aab" stroke-width="1"/>
    <text x="92" y="182" text-anchor="middle" font-size="11" fill="#333">[1,2) "0"</text>
    <text x="173" y="182" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="219" y="182" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="295" y="182" text-anchor="middle" font-size="11" fill="#333">flat = 1</text>
    <text x="406" y="182" text-anchor="middle" font-size="11" fill="#888">剪枝，直接返回</text>
    <text x="494" y="182" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">1</text>

    <!-- row 5 -->
    <line x1="35" y1="222" x2="525" y2="222" stroke="#aab" stroke-width="1"/>
    <text x="92" y="212" text-anchor="middle" font-size="11" fill="#333">[2,4) "10"</text>
    <text x="173" y="212" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="219" y="212" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="295" y="212" text-anchor="middle" font-size="11" fill="#b85450">2×1×2 = 4</text>
    <text x="406" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a">2 + 1 = 3 ✓</text>
    <text x="494" y="212" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">3</text>

    <!-- row 6 -->
    <line x1="35" y1="252" x2="525" y2="252" stroke="#aab" stroke-width="1"/>
    <text x="92" y="242" text-anchor="middle" font-size="11" fill="#333">[2,3) "1"</text>
    <text x="173" y="242" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="219" y="242" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="295" y="242" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="406" y="242" text-anchor="middle" font-size="11" fill="#888">—</text>
    <text x="494" y="242" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">2</text>

    <!-- row 7 -->
    <line x1="35" y1="282" x2="525" y2="282" stroke="#446688" stroke-width="1.5"/>
    <text x="92" y="272" text-anchor="middle" font-size="11" fill="#333">[3,4) "0"</text>
    <text x="173" y="272" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="219" y="272" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="295" y="272" text-anchor="middle" font-size="11" fill="#333">flat = 1</text>
    <text x="406" y="272" text-anchor="middle" font-size="11" fill="#888">剪枝，直接返回</text>
    <text x="494" y="272" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">1</text>

    <!-- outer border on top of rows -->
    <rect x="35" y="44" width="490" height="238" fill="none" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>

  <!-- answer box -->
  <g filter="url(#rough2)">
    <rect x="60" y="296" width="440" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="280" y="319" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">答案 f(0,4) = 6：最优划分 = 四个单字符段 2 + 1 + 2 + 1</text>
  </g>

  <!-- contrast box -->
  <g filter="url(#rough2)">
    <rect x="60" y="348" width="440" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="370" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold">对比示例 2（encCost = 3, flatCost = 10）：</text>
    <text x="280" y="390" text-anchor="middle" font-size="11" fill="#557">"10" 段拆开要 3 + 10 = 13 &gt; 6 ⇒ 停在长度 2，答案 = 6 + 6 = 12</text>
  </g>
</svg>
