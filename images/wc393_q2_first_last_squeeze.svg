<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：最左质数与最右质数夹逼出最大距离</text>

  <!-- 数组格子：4 2 9 5 3 -->
  <rect x="168" y="50" width="56" height="46" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="72" text-anchor="middle" font-size="17" fill="#888" filter="url(#rough2)">4</text>
  <text x="196" y="91" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>

  <rect x="230" y="50" width="56" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="258" y="72" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <text x="258" y="91" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>

  <rect x="292" y="50" width="56" height="46" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="72" text-anchor="middle" font-size="17" fill="#888" filter="url(#rough2)">9</text>
  <text x="320" y="91" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>

  <rect x="354" y="50" width="56" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="382" y="72" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <text x="382" y="91" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <rect x="416" y="50" width="56" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="444" y="72" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <text x="444" y="91" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>

  <!-- first / last 标注 -->
  <rect x="150" y="120" width="140" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">first = 1（最左）</text>
  <path d="M258,118 V99" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="352" y="120" width="140" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="422" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">last = 4（最右）</text>
  <path d="M444,118 V99" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 双向箭头 -->
  <text x="351" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">最大距离 = last − first = 3</text>
  <path d="M258,176 H444" stroke="#446688" stroke-width="1.8" fill="none" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 夹逼论证框 -->
  <rect x="40" y="196" width="560" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">任取一对质数下标 i ≤ j（允许 i = j）</text>
  <text x="320" y="250" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">first ≤ i 且 j ≤ last ⟹ j − i ≤ last − first</text>

  <!-- 全部质数对枚举 -->
  <text x="320" y="304" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">示例 1 质数下标 {1, 3, 4} 的全部 6 组选取（含相同下标）：</text>

  <rect x="49" y="318" width="82" height="44" rx="10" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="336" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">(1, 1)</text>
  <text x="90" y="354" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">距离 0</text>

  <rect x="141" y="318" width="82" height="44" rx="10" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="336" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">(1, 3)</text>
  <text x="182" y="354" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">距离 2</text>

  <rect x="233" y="318" width="82" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="274" y="336" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">(1, 4) ★</text>
  <text x="274" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">距离 3</text>

  <rect x="325" y="318" width="82" height="44" rx="10" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="366" y="336" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">(3, 3)</text>
  <text x="366" y="354" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">距离 0</text>

  <rect x="417" y="318" width="82" height="44" rx="10" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="458" y="336" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">(3, 4)</text>
  <text x="458" y="354" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">距离 1</text>

  <rect x="509" y="318" width="82" height="44" rx="10" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550" y="336" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">(4, 4)</text>
  <text x="550" y="354" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">距离 0</text>

  <text x="320" y="396" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">首尾对 (1, 4) 支配所有其他组合——最大距离只由两个端点决定</text>
</svg>
