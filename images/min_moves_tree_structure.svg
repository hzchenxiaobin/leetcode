<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="700" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">倒退树：主干被迫下行，对角线分叉出两条折半轴链</text>
  <path d="M 230 44 Q 470 52 710 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 主干：T -->
  <g filter="url(#sk)">
    <rect x="385" y="60" width="170" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="470" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">T = (tx, ty)</text>

  <g filter="url(#sk)">
    <line x1="470" y1="106" x2="470" y2="130" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- 主干：p1 -->
  <g filter="url(#sk)">
    <rect x="395" y="134" width="150" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="470" y="159" text-anchor="middle" font-size="14" fill="#2b4a6e" filter="url(#sk)">p1</text>

  <g filter="url(#sk)">
    <line x1="470" y1="174" x2="470" y2="198" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="470" y="226" text-anchor="middle" font-size="22" fill="#2b4a6e" filter="url(#sk)">⋮</text>

  <g filter="url(#sk)">
    <line x1="470" y1="236" x2="470" y2="256" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- 对角线分叉点 -->
  <g filter="url(#sk)">
    <rect x="355" y="260" width="230" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="470" y="283" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">(d, d)</text>
  <text x="470" y="303" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">对角线：全平面唯一的分叉点</text>

  <!-- 分叉箭头 -->
  <g filter="url(#sk)">
    <path d="M 400 312 Q 340 348 330 376" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 540 312 Q 600 348 610 376" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="344" y="344" font-size="11.5" fill="#777" filter="url(#sk)">1 步</text>
  <text x="596" y="344" font-size="11.5" fill="#777" filter="url(#sk)">1 步</text>

  <!-- 两条链取值相同的说明 -->
  <text x="470" y="392" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#sk)">两条链的取值与距离</text>
  <text x="470" y="408" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#sk)">完全相同，可一趟同查</text>

  <!-- 左链（x 轴） -->
  <text x="330" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">x 轴折半链</text>
  <g filter="url(#sk)">
    <rect x="270" y="380" width="120" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="330" y="404" text-anchor="middle" font-size="13.5" fill="#2e6e2e" filter="url(#sk)">(d, 0)</text>
  <g filter="url(#sk)">
    <line x1="330" y1="418" x2="330" y2="442" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="348" y="436" font-size="11.5" fill="#777" filter="url(#sk)">÷2</text>
  <g filter="url(#sk)">
    <rect x="270" y="444" width="120" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="330" y="468" text-anchor="middle" font-size="13.5" fill="#2e6e2e" filter="url(#sk)">(d/2, 0)</text>
  <g filter="url(#sk)">
    <line x1="330" y1="482" x2="330" y2="506" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="348" y="500" font-size="11.5" fill="#777" filter="url(#sk)">÷2</text>
  <g filter="url(#sk)">
    <rect x="270" y="508" width="120" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="330" y="532" text-anchor="middle" font-size="13.5" fill="#2e6e2e" filter="url(#sk)">(d/4, 0)</text>
  <g filter="url(#sk)">
    <line x1="330" y1="546" x2="330" y2="570" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="330" y="594" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">⋯ 直到变成奇数</text>

  <!-- 右链（y 轴） -->
  <text x="610" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">y 轴折半链</text>
  <g filter="url(#sk)">
    <rect x="550" y="380" width="120" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="610" y="404" text-anchor="middle" font-size="13.5" fill="#2e6e2e" filter="url(#sk)">(0, d)</text>
  <g filter="url(#sk)">
    <line x1="610" y1="418" x2="610" y2="442" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="592" y="436" text-anchor="end" font-size="11.5" fill="#777" filter="url(#sk)">÷2</text>
  <g filter="url(#sk)">
    <rect x="550" y="444" width="120" height="38" rx="8" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <text x="610" y="468" text-anchor="middle" font-size="13.5" fill="#8a6a1a" filter="url(#sk)">(0, d/2)</text>
  <g filter="url(#sk)">
    <line x1="610" y1="482" x2="610" y2="506" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="592" y="500" text-anchor="end" font-size="11.5" fill="#777" filter="url(#sk)">÷2</text>
  <g filter="url(#sk)">
    <rect x="550" y="508" width="120" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="610" y="532" text-anchor="middle" font-size="13.5" fill="#2e6e2e" filter="url(#sk)">(0, d/4)</text>
  <g filter="url(#sk)">
    <line x1="610" y1="546" x2="610" y2="570" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="610" y="594" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">⋯ 直到变成奇数</text>

  <!-- S 命中标注 -->
  <text x="700" y="462" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6a1a" filter="url(#sk)">★ S 落在链上 → 答案 = 树距离</text>
  <text x="700" y="482" text-anchor="start" font-size="11.5" fill="#555" filter="url(#sk)">（S 也可能是主干上某点）</text>

  <!-- 左上：主干性质注释 -->
  <g filter="url(#sk)">
    <rect x="64" y="118" width="280" height="130" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="204" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">主干：前驱唯一，被迫下行</text>
  <text x="204" y="168" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">带内 → 大减小（辗转相除）</text>
  <text x="204" y="190" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">带外 → 大数折半（须为偶数）</text>
  <text x="204" y="212" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">和 x+y 每步缩到 2/3 以内</text>
  <text x="204" y="236" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">⇒ 主干至多约 53 步</text>

  <!-- 右上：死胡同注释 -->
  <g filter="url(#sk)">
    <rect x="724" y="64" width="196" height="140" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="822" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#777" filter="url(#sk)">另一种结局</text>
  <text x="822" y="114" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#sk)">主干在带外遇到奇数</text>
  <text x="822" y="136" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#sk)">→ 无前驱（死胡同）</text>
  <text x="822" y="158" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#sk)">树到此为止，</text>
  <text x="822" y="180" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#sk)">连分叉都不会有</text>

  <!-- 左下：核心结论 -->
  <g filter="url(#sk)">
    <rect x="50" y="430" width="230" height="172" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="165" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">💡 S 能到 T</text>
  <text x="165" y="482" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">⇔ S 落在这棵小树上</text>
  <text x="165" y="504" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">最少步数 = 树距离</text>
  <text x="165" y="526" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">整棵树只有 O(log V)</text>
  <text x="165" y="548" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">个点，直接逐点模拟即可</text>
</svg>
