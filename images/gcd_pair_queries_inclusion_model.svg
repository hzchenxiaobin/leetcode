<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold"
        filter="url(#rough2)">核心观察：gcd 为 d 的倍数 ⟺ 两数均为 d 的倍数</text>
  <text x="260" y="52" text-anchor="middle" font-size="12" fill="#666"
        filter="url(#rough2)">以 d = 2、值域 1..12 为例（m₂ = 6 个元素是 2 的倍数）</text>

  <!-- 数轴格子 1..12，偶数为 d 的倍数 -->
  <g filter="url(#rough2)">
    <rect x="34" y="66" width="38" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="72" y="66" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="110" y="66" width="38" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="148" y="66" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="186" y="66" width="38" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="224" y="66" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="262" y="66" width="38" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="300" y="66" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="338" y="66" width="38" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="376" y="66" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="414" y="66" width="38" height="34" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="452" y="66" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="53" y="87" text-anchor="middle" font-size="12" fill="#999">1</text>
    <text x="91" y="87" text-anchor="middle" font-size="12" fill="#446688">2</text>
    <text x="129" y="87" text-anchor="middle" font-size="12" fill="#999">3</text>
    <text x="167" y="87" text-anchor="middle" font-size="12" fill="#446688">4</text>
    <text x="205" y="87" text-anchor="middle" font-size="12" fill="#999">5</text>
    <text x="243" y="87" text-anchor="middle" font-size="12" fill="#446688">6</text>
    <text x="281" y="87" text-anchor="middle" font-size="12" fill="#999">7</text>
    <text x="319" y="87" text-anchor="middle" font-size="12" fill="#446688">8</text>
    <text x="357" y="87" text-anchor="middle" font-size="12" fill="#999">9</text>
    <text x="395" y="87" text-anchor="middle" font-size="12" fill="#446688">10</text>
    <text x="433" y="87" text-anchor="middle" font-size="12" fill="#999">11</text>
    <text x="471" y="87" text-anchor="middle" font-size="12" fill="#446688">12</text>
    <!-- 倍数格子下方小三角 -->
    <path d="M85,105 L91,105 L88,110 z" fill="#4a7a3a"/>
    <path d="M161,105 L167,105 L164,110 z" fill="#4a7a3a"/>
    <path d="M237,105 L243,105 L240,110 z" fill="#4a7a3a"/>
    <path d="M313,105 L319,105 L316,110 z" fill="#4a7a3a"/>
    <path d="M389,105 L395,105 L392,110 z" fill="#4a7a3a"/>
    <path d="M465,105 L471,105 L468,110 z" fill="#4a7a3a"/>
  </g>

  <!-- 左框：倍数对计数 -->
  <rect x="30" y="130" width="222" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <text x="141" y="152" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">倍数对计数（调和级数）</text>
  <text x="141" y="173" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">m₂ = #{x : 2 | x} = 6</text>
  <text x="141" y="192" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">g[2] = C(6, 2) = 15 对</text>
  <text x="141" y="212" text-anchor="middle" font-size="11" fill="#666"
        filter="url(#rough2)">= gcd 是 2 的倍数的数对数</text>

  <!-- 右框：倒序容斥 -->
  <rect x="276" y="130" width="222" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <text x="387" y="152" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold"
        filter="url(#rough2)">倒序容斥（d 从大到小）</text>
  <text x="387" y="173" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">exact[2] = g[2] − exact[4]</text>
  <text x="387" y="192" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">− exact[6] − exact[8] − …</text>
  <text x="387" y="212" text-anchor="middle" font-size="11" fill="#666"
        filter="url(#rough2)">减去 gcd 是 2 的倍数且 &gt; 2 的对</text>

  <!-- 箭头：左框 → 右框 -->
  <path d="M254,178 Q265,170 274,176" fill="none" stroke="#b85450" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 箭头：两框 → 底框 -->
  <path d="M141,228 Q160,252 200,262" fill="none" stroke="#b85450" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M387,228 Q360,252 320,262" fill="none" stroke="#b85450" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底框：结论 -->
  <rect x="96" y="264" width="328" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"
        filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold"
        filter="url(#rough2)">按 gcd 的具体值不重不漏分组</text>
  <text x="260" y="314" text-anchor="middle" font-size="13" fill="#333"
        filter="url(#rough2)">⇒ exact[d] 恰为 gcd = d 的数对数</text>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#666"
        filter="url(#rough2)">值域 V = 5×10⁴，枚举倍数共 O(V log V)</text>
</svg>
