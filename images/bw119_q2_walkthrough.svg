<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：word = zyxyxyz，从左到右三处冲突</text>

  <!-- 原串 -->
  <g filter="url(#rough2)">
    <rect x="100" y="50" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="150" y="50" width="50" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="200" y="50" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="250" y="50" width="50" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="300" y="50" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="350" y="50" width="50" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="400" y="50" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="125" y="79" text-anchor="middle" font-size="17" fill="#333">z</text>
    <text x="175" y="79" text-anchor="middle" font-size="17" fill="#7a3030">y</text>
    <text x="225" y="79" text-anchor="middle" font-size="17" fill="#333">x</text>
    <text x="275" y="79" text-anchor="middle" font-size="17" fill="#7a3030">y</text>
    <text x="325" y="79" text-anchor="middle" font-size="17" fill="#333">x</text>
    <text x="375" y="79" text-anchor="middle" font-size="17" fill="#7a3030">y</text>
    <text x="425" y="79" text-anchor="middle" font-size="17" fill="#333">z</text>
    <text x="125" y="110" text-anchor="middle" font-size="11" fill="#888">0</text>
    <text x="175" y="110" text-anchor="middle" font-size="11" fill="#888">1</text>
    <text x="225" y="110" text-anchor="middle" font-size="11" fill="#888">2</text>
    <text x="275" y="110" text-anchor="middle" font-size="11" fill="#888">3</text>
    <text x="325" y="110" text-anchor="middle" font-size="11" fill="#888">4</text>
    <text x="375" y="110" text-anchor="middle" font-size="11" fill="#888">5</text>
    <text x="425" y="110" text-anchor="middle" font-size="11" fill="#888">6</text>
  </g>

  <!-- 冲突弧线 -->
  <g filter="url(#rough2)">
    <path d="M125,42 C125,16 175,16 175,42" fill="none" stroke="#b85450" stroke-width="2"/>
    <text x="150" y="24" text-anchor="middle" font-size="11" fill="#b85450">冲突 |z−y|=1</text>
    <path d="M225,42 C225,16 275,16 275,42" fill="none" stroke="#b85450" stroke-width="2"/>
    <text x="250" y="24" text-anchor="middle" font-size="11" fill="#b85450">冲突 |x−y|=1</text>
    <path d="M325,42 C325,16 375,16 375,42" fill="none" stroke="#b85450" stroke-width="2"/>
    <text x="350" y="24" text-anchor="middle" font-size="11" fill="#b85450">冲突 |x−y|=1</text>
  </g>

  <!-- i 的跳跃 -->
  <g filter="url(#rough2)">
    <path d="M175,120 L175,150" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <text x="175" y="164" text-anchor="middle" font-size="11" fill="#1c3a1c">i=1 冲突，ans=1</text>
    <path d="M175,170 C230,196 240,196 275,170" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M275,120 L275,150" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <text x="275" y="164" text-anchor="middle" font-size="11" fill="#1c3a1c">i=3 冲突，ans=2</text>
    <path d="M275,170 C330,196 340,196 375,170" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M375,120 L375,150" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <text x="375" y="164" text-anchor="middle" font-size="11" fill="#1c3a1c">i=5 冲突，ans=3</text>
    <path d="M375,170 C440,196 460,186 470,150" fill="none" stroke="#888" stroke-width="1.8" stroke-dasharray="4,4"/>
    <text x="480" y="164" text-anchor="middle" font-size="11" fill="#555">i=7 出界</text>
  </g>

  <!-- 结果串 -->
  <text x="60" y="230" font-size="13" fill="#555" filter="url(#rough2)">一种可行改法：</text>
  <g filter="url(#rough2)">
    <rect x="170" y="212" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="220" y="212" width="50" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <rect x="270" y="212" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="320" y="212" width="50" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <rect x="370" y="212" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="420" y="212" width="50" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <rect x="470" y="212" width="50" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="195" y="241" text-anchor="middle" font-size="17" fill="#333">z</text>
    <text x="245" y="241" text-anchor="middle" font-size="17" fill="#1c3a1c">a</text>
    <text x="295" y="241" text-anchor="middle" font-size="17" fill="#333">x</text>
    <text x="345" y="241" text-anchor="middle" font-size="17" fill="#1c3a1c">a</text>
    <text x="395" y="241" text-anchor="middle" font-size="17" fill="#333">x</text>
    <text x="445" y="241" text-anchor="middle" font-size="17" fill="#1c3a1c">a</text>
    <text x="495" y="241" text-anchor="middle" font-size="17" fill="#333">z</text>
  </g>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">绿色 = 被改过的位置（与 a 相邻的 z/x 差 ≥ 2）</text>

  <rect x="110" y="304" width="340" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="329" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">ans = 3 = 官方答案（zyxyxyz → zaxaxaz）</text>
</svg>
