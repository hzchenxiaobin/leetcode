<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2e6e2e"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="660" height="470" fill="#fdfcf7"/>
  <text x="330" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">check(c)：贪心判定「能力 ≤ c 能否抢够 k 间」</text>
  <text x="330" y="44" text-anchor="middle" font-size="11" fill="#666666">从左到右扫：能抢就抢，抢完立刻 i += 2 跳过相邻房 —— 给后面留最大空间；数够 k 间提前返回 true</text>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="230" cy="72" rx="42" ry="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="230" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">开始</text>
  <path d="M 230 87 L 230 96" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="168" y="98" width="124" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="230" y="116" text-anchor="middle" font-size="12" fill="#8a6415">i = 0，cnt = 0</text>
  <path d="M 230 124 L 230 132" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1: i < n ? -->
  <g filter="url(#sk)">
    <polygon points="230,130 312,162 230,194 148,162" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="230" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">i &lt; n ?</text>
  <text x="230" y="172" text-anchor="middle" font-size="9.5" fill="#555555">还有房没扫完？</text>

  <!-- diamond1 false: right out, down to false terminal -->
  <path d="M 312 162 L 612 162 L 612 420" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="330" y="154" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <ellipse cx="612" cy="438" rx="38" ry="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="612" y="443" text-anchor="middle" font-size="12" font-weight="bold" fill="#a13d3a">false</text>
  <text x="612" y="462" text-anchor="middle" font-size="9.5" fill="#999999">扫完了也没抢够</text>

  <!-- diamond1 yes: down -->
  <path d="M 230 194 L 230 210" stroke="#2e6e2e" stroke-width="1.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="240" y="206" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- diamond 2: nums[i] <= c ? -->
  <g filter="url(#sk)">
    <polygon points="230,210 320,246 230,282 140,246" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="230" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">nums[i] ≤ c ?</text>
  <text x="230" y="256" text-anchor="middle" font-size="9.5" fill="#555555">这间抢得起吗？</text>

  <!-- diamond2 no: left to i += 1 -->
  <path d="M 140 246 L 106 246" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="122" y="238" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="40" y="232" width="64" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="72" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#a13d3a">i += 1</text>
  <!-- i+=1 loop back: down then right to main loop rail y=452 -->
  <path d="M 72 260 L 72 452 L 226 452" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- diamond2 yes: down to cnt++ -->
  <path d="M 230 282 L 230 296" stroke="#2e6e2e" stroke-width="1.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="240" y="292" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- cnt++ -->
  <g filter="url(#sk)">
    <rect x="172" y="298" width="116" height="26" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="230" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">cnt++（抢这间）</text>
  <path d="M 230 324 L 230 332" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 3: cnt >= k ? -->
  <g filter="url(#sk)">
    <polygon points="230,334 306,366 230,398 154,366" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="230" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">cnt ≥ k ?</text>
  <text x="230" y="376" text-anchor="middle" font-size="9.5" fill="#555555">已经抢够了？</text>

  <!-- diamond3 yes: right to true terminal -->
  <path d="M 306 366 L 400 366" stroke="#2e6e2e" stroke-width="1.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="330" y="358" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <ellipse cx="442" cy="366" rx="38" ry="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="442" y="371" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">true</text>
  <text x="442" y="394" text-anchor="middle" font-size="9.5" fill="#999999">提前终止，</text>
  <text x="442" y="406" text-anchor="middle" font-size="9.5" fill="#999999">不必扫完整条街</text>

  <!-- diamond3 no: down to i += 2 -->
  <path d="M 230 398 L 230 408" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="240" y="407" font-size="11" font-weight="bold" fill="#b85450">否</text>

  <!-- i += 2 -->
  <g filter="url(#sk)">
    <rect x="166" y="410" width="128" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="230" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">i += 2 跳过相邻房</text>

  <!-- main loop rail: i+=2 bottom down to y=452, left along rail to x=110, up to diamond1 left tip -->
  <path d="M 230 436 L 230 452 L 110 452 L 110 162 L 146 162" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="152" y="470" font-size="10.5" fill="#555555">回到「i &lt; n ?」继续扫</text>
</svg>
