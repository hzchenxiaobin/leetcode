<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">演算：nums = [3,1,2,5,4]，k = 3</text>

  <!-- 窗口 1 -->
  <rect x="46" y="46" width="270" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="60" y="66" font-size="10" fill="#446688" filter="url(#rough2)">窗口 [3,1,2]</text>
  <text x="60" y="86" font-size="10" fill="#333" filter="url(#rough2)">inv = (3,1)、(3,2) = 2</text>
  <text x="240" y="82" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>

  <!-- 窗口 2 -->
  <rect x="46" y="110" width="270" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="130" font-size="10" fill="#4a7a3a" filter="url(#rough2)">删 3、加 5 → [1,2,5]</text>
  <text x="60" y="150" font-size="10" fill="#333" filter="url(#rough2)">A = 2（1,2 都 &lt; 3）；B = 0</text>
  <text x="240" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <!-- 窗口 3 -->
  <rect x="46" y="174" width="270" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="60" y="194" font-size="10" fill="#d6a040" filter="url(#rough2)">删 1、加 4 → [2,5,4]</text>
  <text x="60" y="214" font-size="10" fill="#333" filter="url(#rough2)">A = 0（无比 1 小的）；B = 1（5 &gt; 4）</text>
  <text x="240" y="210" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">1</text>

  <!-- 递推 -->
  <path d="M330,72 L330,110" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="342" y="96" font-size="10" fill="#999" filter="url(#rough2)">2 − 2 + 0 = 0</text>

  <path d="M330,136 L330,174" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="342" y="160" font-size="10" fill="#999" filter="url(#rough2)">0 − 0 + 1 = 1</text>

  <!-- 结论 -->
  <rect x="60" y="240" width="300" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="210" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = min(2, 0, 1) = 0</text>

  <text x="430" y="120" font-size="10" fill="#999" filter="url(#rough2)">与示例一致</text>
</svg>
