<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="127" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：元素独立算增益，贪心取前 k 大</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- element 102 -->
  <g filter="url(#sk)">
    <rect x="40" y="56" width="180" height="96" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="130" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">102</text>
  <path d="M 100 92 Q 130 104 160 92" stroke="#4a8edb" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="130" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">210（数字降序）</text>
  <text x="130" y="142" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">增益 = 210 − 102 = +108</text>

  <!-- element 90 -->
  <g filter="url(#sk)">
    <rect x="230" y="56" width="180" height="96" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="320" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">90</text>
  <path d="M 290 92 Q 320 104 350 92" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="320" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">90（已是最大）</text>
  <text x="320" y="142" text-anchor="middle" font-size="12" fill="#7a7a7a" font-weight="bold">增益 = 0，操作白费</text>

  <!-- element 14 -->
  <g filter="url(#sk)">
    <rect x="420" y="56" width="180" height="96" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="510" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">14</text>
  <path d="M 480 92 Q 510 104 540 92" stroke="#4a8edb" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="510" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">41（数字降序）</text>
  <text x="510" y="142" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">增益 = 41 − 14 = +27</text>

  <!-- arrow to sorted gains -->
  <path d="M 320 158 Q 320 176 320 192" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="345" y="180" font-size="12" fill="#3a3a3a">增益降序排序</text>

  <!-- bar chart: sorted gains -->
  <g filter="url(#sk)">
    <rect x="60" y="270" width="120" height="80" rx="4" fill="#f5c6c0" stroke="#b85450" stroke-width="2"/>
    <rect x="200" y="296" width="120" height="54" rx="4" fill="#f5c6c0" stroke="#b85450" stroke-width="2"/>
    <rect x="340" y="348" width="120" height="2" fill="#dddddd" stroke="#999999" stroke-width="1.5"/>
  </g>
  <text x="120" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">+108</text>
  <text x="260" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">+27</text>
  <text x="400" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#888888">0</text>
  <text x="120" y="366" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✓ 操作 1</text>
  <text x="260" y="366" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✓ 操作 2</text>
  <text x="400" y="366" text-anchor="middle" font-size="12" fill="#888888">✗ 不选</text>
  <path d="M 52 350 Q 320 344 470 350" stroke="#c98a2b" stroke-width="1.8" fill="none" stroke-dasharray="6 5" filter="url(#sk)"/>
  <text x="540" y="316" font-size="12" fill="#b8761a" font-weight="bold">k = 2 道闸</text>
  <text x="540" y="332" font-size="11" fill="#b8761a">只放行前 2 个</text>

  <!-- formula -->
  <g filter="url(#sk)">
    <rect x="490" y="270" width="130" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="555" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">答案 = Σnums</text>
  <text x="555" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">+ 前 k 大正增益</text>
</svg>
