<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 1 演算：排序后 E1=[1,2,4] E2=[2,3,1] E3=[3,4,3]，k = 2</text>

  <!-- 表头：行标签 + i=1..3 -->
  <rect x="56" y="58" width="84" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="140" y="58" width="100" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="240" y="58" width="100" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="340" y="58" width="100" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="98" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">行 / 列</text>
  <text x="190" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">i = 1 (E1)</text>
  <text x="290" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">i = 2 (E2)</text>
  <text x="390" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">i = 3 (E3)</text>

  <!-- p 行 -->
  <rect x="56" y="96" width="84" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="140" y="96" width="100" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="240" y="96" width="100" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="340" y="96" width="100" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="98" y="118" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">p_i</text>
  <text x="190" y="118" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">0</text>
  <text x="290" y="118" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">0</text>
  <text x="390" y="118" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- j = 0 行 -->
  <rect x="56" y="134" width="84" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="140" y="134" width="100" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="240" y="134" width="100" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="340" y="134" width="100" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="98" y="156" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">j = 0</text>
  <text x="190" y="156" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">0</text>
  <text x="290" y="156" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">0</text>
  <text x="390" y="156" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">0</text>

  <!-- j = 1 行 -->
  <rect x="56" y="172" width="84" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="140" y="172" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="240" y="172" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="340" y="172" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="98" y="194" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">j = 1</text>
  <text x="190" y="194" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="290" y="194" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="390" y="194" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>

  <!-- j = 2 行 -->
  <rect x="56" y="210" width="84" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="140" y="210" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="240" y="210" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="340" y="210" width="100" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="98" y="232" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">j = 2</text>
  <text x="190" y="232" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="290" y="232" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="390" y="232" text-anchor="middle" font-size="13.5" fill="#b8642a" filter="url(#rough2)">7</text>

  <!-- 转移箭头：dp[1][p3=1] → dp[2][3] -->
  <path d="M172,186 Q260,150 336,208" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="196" y="262" width="250" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="321" y="283" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">dp[2][3] = dp[1][1] + 3 = 4 + 3 = 7</text>

  <rect x="60" y="302" width="160" height="34" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="324" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">答案 dp[k][n] = 7 ✓</text>
  <text x="240" y="324" font-size="12" fill="#888" filter="url(#rough2)">选 E1 + E3（原下标 0 与 1）</text>
</svg>
