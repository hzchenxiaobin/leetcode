<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">算法流程：判型 → 遍历 → 构造 → 贴值求和</text>
  <path d="M 130 38 Q 280 46 430 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- 步骤 1 -->
  <g filter="url(#rough2)"><rect x="180" y="56" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="81" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a7a">① 建邻接表 adj</text>

  <path d="M 280 96 L 280 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判型菱形 -->
  <g filter="url(#rough2)"><polygon points="280,116 355,152 280,188 205,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="280" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">m == n ?</text>

  <path d="M 355 152 L 392 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="142" text-anchor="middle" font-size="11" fill="#555">是</text>
  <g filter="url(#rough2)"><rect x="395" y="132" width="140" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="465" y="157" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">环：起点 = 0</text>

  <path d="M 205 152 L 168 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="142" text-anchor="middle" font-size="11" fill="#555">否</text>
  <g filter="url(#rough2)"><rect x="25" y="132" width="140" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="95" y="157" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">路径：找度 1 端点</text>

  <path d="M 465 172 L 465 208 L 285 208" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 95 172 L 95 208 L 268 208" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <g filter="url(#rough2)"><rect x="100" y="212" width="360" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="232" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a7a">② prev 跟随，沿链遍历 n 步得 order</text>
  <text x="280" y="250" text-anchor="middle" font-size="11.5" fill="#3a5a7a">不走回头路，无需 visited</text>

  <path d="M 280 258 L 280 278" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <g filter="url(#rough2)"><rect x="80" y="282" width="400" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="280" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">③ 构造值序列：与 n 异奇偶升序 + n + 同奇偶降序</text>
  <text x="280" y="320" text-anchor="middle" font-size="11.5" fill="#8a6415">例：n=6 → [1, 3, 5, 6, 4, 2]</text>

  <path d="M 280 328 L 280 348" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 4 -->
  <g filter="url(#rough2)"><rect x="80" y="352" width="400" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="280" y="372" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">④ 按 order 贴值，累加 Σ val(a)·val(b)</text>
  <text x="280" y="390" text-anchor="middle" font-size="11.5" fill="#2e5e2e">环首尾 1、2 自动多一条 1×2 闭合边</text>

  <!-- 右侧复杂度标注 -->
  <text x="508" y="238" font-size="12" fill="#888">O(n)</text>
  <text x="508" y="308" font-size="12" fill="#888">O(n)</text>
  <text x="508" y="378" font-size="12" fill="#888">O(n)</text>
</svg>
