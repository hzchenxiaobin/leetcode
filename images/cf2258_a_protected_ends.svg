<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：首尾两个元素永远删不掉</text>
  <path d="M 176 46 Q 380 53 584 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 标签 -->
  <text x="122" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a3762a" filter="url(#rough2)">首元素 · 锁定</text>
  <text x="208" y="80" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">可删</text>
  <text x="294" y="80" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">可删</text>
  <text x="380" y="80" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">可删</text>
  <text x="466" y="80" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">可删</text>
  <text x="552" y="80" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">可删</text>
  <text x="638" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a3762a" filter="url(#rough2)">尾元素 · 锁定</text>

  <!-- 数组格子 -->
  <rect x="83" y="92" width="78" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="122" y="130" text-anchor="middle" font-size="19" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <rect x="169" y="92" width="78" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="208" y="130" text-anchor="middle" font-size="19" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <rect x="255" y="92" width="78" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="294" y="130" text-anchor="middle" font-size="19" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">6</text>
  <rect x="341" y="92" width="78" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="130" text-anchor="middle" font-size="19" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">7</text>
  <rect x="427" y="92" width="78" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="466" y="130" text-anchor="middle" font-size="19" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">8</text>
  <rect x="513" y="92" width="78" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="552" y="130" text-anchor="middle" font-size="19" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">9</text>
  <rect x="599" y="92" width="78" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="638" y="130" text-anchor="middle" font-size="19" font-weight="bold" fill="#8a6015" filter="url(#rough2)">10</text>

  <text x="122" y="172" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <text x="208" y="172" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <text x="294" y="172" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">3</text>
  <text x="380" y="172" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">4</text>
  <text x="466" y="172" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">5</text>
  <text x="552" y="172" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">6</text>
  <text x="638" y="172" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">7</text>

  <!-- 一次操作示例 -->
  <rect x="58" y="192" width="644" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="218" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">取 k = 1，选中下标 2、4、6（2k+1 = 3 个），删掉其中第 2 小 → a4 = 7 被擦除</text>
  <text x="380" y="244" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">数组变成 [2, 4, 6, 8, 9, 10]，长度减 1；继续擦 4、6、8、9，最后只剩 [2, 10]</text>
  <text x="380" y="268" text-anchor="middle" font-size="11.5" fill="#54789c" filter="url(#rough2)">被擦掉的元素必须左右各有一个被选中的下标，所以位置 1 与位置 m 永远选不中「中位数」</text>

  <!-- 判定公式 -->
  <rect x="58" y="296" width="644" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">位置 p 可删 ⇔ min(p−1, m−p) ≥ 1 ⇔ p 不在当前数组的两端</text>
  <text x="380" y="348" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">充分性：p−1 ≥ 1 且 m−p ≥ 1 时选 (p−1, p, p+1) 三个下标，p 恰是第 2 小，可删</text>
  <text x="380" y="374" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">必要性：p 若是第 1 或第 m 个，它前面（后面）没有元素，不可能成为第 k+1 小</text>
  <text x="380" y="400" text-anchor="middle" font-size="11.5" fill="#a3762a" filter="url(#rough2)">注：m 为当前长度；k ≥ 1 是硬性的，故要凑出 2k+1 个下标，两端各至少需 1 个元素</text>
</svg>
