<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：只分三个分支，O(n) 拼串</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n = 1 与 n = 2 必须特判，否则会多出括号或空串</text>

  <rect x="180" y="66" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="255" y="88" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">输入 nums（长度 n）</text>

  <path d="M 255 100 L 255 116" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="255,118 360,146 255,174 150,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="151" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#rough2)">n == 1 ?</text>

  <path d="M 360 146 L 430 146" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="392" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="434" y="128" width="152" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="510" y="151" text-anchor="middle" font-size="12" fill="#2e5e22" filter="url(#rough2)">返回 "a₁"</text>

  <path d="M 255 174 L 255 190" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="188" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <polygon points="255,192 360,220 255,248 150,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="225" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#rough2)">n == 2 ?</text>

  <path d="M 360 220 L 430 220" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="392" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="434" y="202" width="152" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="510" y="225" text-anchor="middle" font-size="12" fill="#2e5e22" filter="url(#rough2)">返回 "a₁/a₂"</text>
  <text x="510" y="252" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">唯一方案，不加括号</text>

  <path d="M 255 248 L 255 266" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="264" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否（n ≥ 3）</text>

  <rect x="92" y="270" width="230" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="207" y="290" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">拼 "a₁" + "/(" + a₂</text>
  <text x="207" y="308" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">+ "/a₃" ⋯ + "/aₙ" + ")"</text>

  <path d="M 322 293 L 366 293" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="370" y="270" width="216" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="478" y="290" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-weight="bold" filter="url(#rough2)">"a₁/(a₂/a₃/…/aₙ)"</text>
  <text x="478" y="308" text-anchor="middle" font-size="10" fill="#3e6b30" filter="url(#rough2)">唯一一对括号，位置固定</text>

  <text x="310" y="346" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">三个分支互斥且覆盖全部输入 → 无循环、无回溯，时间 O(n)</text>
  <text x="310" y="366" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">易错：n = 1 返 "2" 而非 "2/"，n = 2 不要写成 "2/(3)"</text>
</svg>
