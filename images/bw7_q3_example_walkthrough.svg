<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="173"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：sticks = [1,8,3,5] 的三轮合并</text>

  <!-- 初始堆 -->
  <text x="60" y="66" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">初始堆 {1, 3, 5, 8}：</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="70"  y="76" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="114" y="76" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="158" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="202" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="92" y="98" fill="#2d5a22" font-weight="bold">1</text>
    <text x="136" y="98" fill="#2d5a22" font-weight="bold">3</text>
    <text x="180" y="98">5</text><text x="224" y="98">8</text>
  </g>

  <path d="M 270 93 L 310 93" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 轮 1 -->
  <text x="60" y="140" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">第 1 轮：取 1+3 = 4（累计 4）</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="70"  y="150" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="114" y="150" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="158" y="150" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="92" y="172" fill="#7a5c1e" font-weight="bold">4</text>
    <text x="136" y="172">5</text><text x="180" y="172">8</text>
  </g>
  <text x="230" y="172" font-size="12" fill="#a08040" filter="url(#rough2)">← 新木棍入堆</text>

  <path d="M 270 167 L 310 167" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 轮 2 -->
  <text x="60" y="214" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">第 2 轮：取 4+5 = 9（累计 13）</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="70"  y="224" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="114" y="224" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="92" y="246">8</text>
    <text x="136" y="246" fill="#7a5c1e" font-weight="bold">9</text>
  </g>
  <text x="190" y="246" font-size="12" fill="#a08040" filter="url(#rough2)">← 最长 8 留到最后，少被计费</text>

  <path d="M 270 241 L 310 241" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 轮 3 -->
  <text x="60" y="288" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">第 3 轮：取 8+9 = 17（累计 30）</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="70" y="298" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="92" y="320" fill="#8c3a34" font-weight="bold">17</text>
  </g>
  <rect x="190" y="298" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">总费用 4+9+17 = 30 ✓</text>
</svg>
