<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">目标唯一：t = sorted(s)，一切由「失配区间 [p, q]」决定</text>

  <!-- 左panel：dog，真子串失配 -->
  <rect x="24" y="44" width="290" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="169" y="61" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 失配区间是真子串 ⇒ 答案 1</text>

  <text x="52" y="113" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="76" y="84" width="62" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="113" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="146" y="84" width="62" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="177" y="113" text-anchor="middle" font-size="16" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">o</text>
  <rect x="216" y="84" width="62" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="247" y="113" text-anchor="middle" font-size="16" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">g</text>

  <text x="52" y="179" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">t</text>
  <rect x="76" y="150" width="62" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107" y="179" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="146" y="150" width="62" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="177" y="179" text-anchor="middle" font-size="16" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">g</text>
  <rect x="216" y="150" width="62" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="247" y="179" text-anchor="middle" font-size="16" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">o</text>

  <text x="107" y="143" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="177" y="144" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="247" y="144" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>

  <path d="M146,206 L146,215 L278,215 L278,206" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="212" y="233" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">失配区间 [p, q] = [1, 2]</text>

  <rect x="24" y="248" width="290" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="169" y="268" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">区间外已就位：排一次 [1,2] 即还原 t</text>

  <!-- 右panel：card，整串失配 -->
  <rect x="330" y="44" width="286" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="473" y="61" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 失配区间 = 整串 ⇒ 一次不够</text>

  <text x="354" y="113" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="372" y="84" width="52" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="398" y="113" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="428" y="84" width="52" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="454" y="113" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="484" y="84" width="52" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="510" y="113" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">r</text>
  <rect x="540" y="84" width="52" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="566" y="113" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">d</text>

  <text x="354" y="179" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">t</text>
  <rect x="372" y="150" width="52" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="398" y="179" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="428" y="150" width="52" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="454" y="179" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="484" y="150" width="52" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="510" y="179" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="540" y="150" width="52" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="566" y="179" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">r</text>

  <text x="398" y="144" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="454" y="144" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="510" y="144" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="566" y="144" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>

  <path d="M372,206 L372,215 L592,215 L592,206" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="482" y="233" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">失配区间 [p, q] = [0, 3] = 整串！</text>

  <rect x="330" y="248" width="286" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="473" y="268" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">排整串被禁止 ⇒ 一次操作必然不够</text>

  <!-- 多重集恒等式 -->
  <rect x="24" y="300" width="592" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">多重集恒等式：[p, q] 之外 s 与 t 逐位相同 + 全局字符计数相同</text>
  <text x="320" y="336" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">⇒ multiset(s[p..q]) = multiset(t[p..q]) 恒成立（两边做减法即得）</text>

  <rect x="24" y="358" width="592" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="376" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">推论：只要 [p, q] 是真子串，排一次 [p..q] 必得 t</text>
  <text x="320" y="394" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">（sorted(s[p..q]) = t[p..q]，且区间长 ≥ 2，排序真实生效）</text>

  <text x="320" y="440" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">「整串失配」怎么办？——看首尾两端能否被一次操作救回 →</text>
</svg>
