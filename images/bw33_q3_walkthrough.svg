<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    [4,2,5] 逆向演算：共 6 次调用
  </text>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="30" y="52" width="86" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7"/>
    <text x="73" y="74" font-size="13" fill="#446688">[4,2,5]</text>
    <rect x="30" y="104" width="86" height="34" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="7"/>
    <text x="73" y="126" font-size="13" fill="#333">[4,2,4]</text>
    <rect x="30" y="156" width="86" height="34" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="7"/>
    <text x="73" y="178" font-size="13" fill="#333">[2,1,2]</text>
    <rect x="30" y="208" width="86" height="34" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="7"/>
    <text x="73" y="230" font-size="13" fill="#333">[2,0,2]</text>
    <rect x="30" y="260" width="86" height="34" fill="#f2f2f2" stroke="#999" stroke-width="1.4" rx="7"/>
    <text x="73" y="282" font-size="13" fill="#333">[1,0,1]</text>
    <rect x="30" y="312" width="86" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="7"/>
    <text x="73" y="334" font-size="13" fill="#2f5a24">[0,0,0]</text>
  </g>

  <!-- 操作标签 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="12.5">
    <rect x="152" y="54" width="330" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="7"/>
    <text x="317" y="74" fill="#8a6a1a">第 3 个元素 5 是奇数 → −1（1 次）</text>
    <rect x="152" y="106" width="330" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="7"/>
    <text x="317" y="126" fill="#2f5a24">全部为偶 → 全体 ÷2（1 次）</text>
    <rect x="152" y="158" width="330" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="7"/>
    <text x="317" y="178" fill="#8a6a1a">第 2 个元素 1 是奇数 → −1（1 次）</text>
    <rect x="152" y="210" width="330" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="7"/>
    <text x="317" y="230" fill="#2f5a24">全部为偶 → 全体 ÷2（1 次）</text>
    <rect x="152" y="262" width="330" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="7"/>
    <text x="317" y="282" fill="#8a6a1a">两个奇数各 −1（2 次）</text>
    <rect x="152" y="314" width="330" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="7"/>
    <text x="317" y="334" fill="#b85450">全 0 终止：1+1+1+1+2 = 6 次 ✓</text>
  </g>

  <!-- 串联箭头 -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)">
    <path d="M 73 90 L 73 100"/>
    <path d="M 73 142 L 73 152"/>
    <path d="M 73 194 L 73 204"/>
    <path d="M 73 246 L 73 256"/>
    <path d="M 73 298 L 73 308"/>
  </g>
</svg>
