<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心观察：最短美丽子串首尾都贴着 1（s = "100011001"，k = 3）</text>
  <path d="M 150 34 Q 310 42 470 34" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="90" y="54" font-size="11" fill="#7a5415" font-weight="bold">1 的位置 pos = [0, 4, 5, 8]（m = 4 个）</text>

  <!-- s = 100011001 cells -->
  <rect x="90" y="62" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="112" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="134" y="62" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="156" y="84" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="178" y="62" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="200" y="84" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="222" y="62" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="84" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="266" y="62" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="310" y="62" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="354" y="62" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="84" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="398" y="62" width="44" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="84" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="442" y="62" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="464" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- index labels -->
  <text x="112" y="112" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">0</text>
  <text x="156" y="112" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="200" y="112" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="244" y="112" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="288" y="112" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4</text>
  <text x="332" y="112" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5</text>
  <text x="376" y="112" text-anchor="middle" font-size="10" fill="#999">6</text>
  <text x="420" y="112" text-anchor="middle" font-size="10" fill="#999">7</text>
  <text x="464" y="112" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">8</text>

  <!-- candidate 1 bracket: cells 0..5, x 90..354 -->
  <path d="M 92 148 Q 92 158 100 158 L 344 158 Q 352 158 352 148" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="222" y="178" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">候选① s[0..5] = "100011"，长度 6</text>

  <!-- candidate 2 bracket: cells 4..8, x 266..486 -->
  <path d="M 268 206 Q 268 216 276 216 L 478 216 Q 486 216 486 206" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="376" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">候选② s[4..8] = "11001"，长度 5 ← 更短，胜出 ✓</text>

  <!-- explanation box -->
  <rect x="40" y="266" width="540" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="292" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">删掉子串首 / 尾的 0，不改变 1 的个数</text>
  <text x="310" y="316" text-anchor="middle" font-size="12" fill="#444">→ 最短美丽子串必以 1 开头、以 1 结尾</text>
  <text x="310" y="340" text-anchor="middle" font-size="12" fill="#444">→ 左端取 pos[i]，右端唯一确定：pos[i+k−1]</text>
  <text x="310" y="364" text-anchor="middle" font-size="12" fill="#666">→ 候选只剩 m−k+1 个，按（长度，字典序）双关键字取最小</text>
</svg>
