<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">字典序扫描 + 严格大于更新</text>

  <!-- 6x6 网格示意（代表 51x51） -->
  <g filter="url(#rough2)">
    <rect x="120" y="56" width="240" height="240" fill="none" stroke="#446688" stroke-width="2" rx="6"/>
    <g stroke="#c8d4e8" stroke-width="1.2">
      <line x1="160" y1="56" x2="160" y2="296"/><line x1="200" y1="56" x2="200" y2="296"/>
      <line x1="240" y1="56" x2="240" y2="296"/><line x1="280" y1="56" x2="280" y2="296"/>
      <line x1="320" y1="56" x2="320" y2="296"/>
      <line x1="120" y1="96" x2="360" y2="96"/><line x1="120" y1="136" x2="360" y2="136"/>
      <line x1="120" y1="176" x2="360" y2="176"/><line x1="120" y1="216" x2="360" y2="216"/>
      <line x1="120" y1="256" x2="360" y2="256"/>
    </g>
  </g>
  <text x="120" y="316" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">x=0</text>
  <text x="360" y="316" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">x=50</text>
  <text x="104" y="296" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">y=0</text>
  <text x="104" y="66" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">y=50</text>

  <!-- 字典序扫描路径：先 x=0 列自下而上？注意：x 外层、y 内层升序 → 一列一列向右 -->
  <g filter="url(#rough2)">
    <path d="M 132 288 L 132 208" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)"/>
    <path d="M 148 70 C 200 70, 260 70, 300 78" fill="none" stroke="#4a7a3a" stroke-width="0"/>
  </g>
  <!-- 简化：三条绿色箭头表示列内 y 递增、列间 x 递增 -->
  <path d="M 132 286 L 132 66" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 140 60 C 180 52, 220 52, 252 58" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 252 286 L 252 66" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="188" y="46" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">下一列 x+1 …</text>
  <text x="74" y="180" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">y 递增</text>

  <!-- 首个点与并列点 -->
  <g filter="url(#rough2)">
    <circle cx="132" cy="286" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="212" cy="246" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="292" cy="206" r="6" fill="#f0f0f0" stroke="#999" stroke-width="1.6"/>
  </g>
  <text x="132" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(0,0)</text>
  <text x="222" y="240" font-size="11.5" fill="#b85450" filter="url(#rough2)">强度并列 = best</text>
  <text x="222" y="256" font-size="11.5" fill="#b85450" filter="url(#rough2)">不更新！(q &gt; best 才更)</text>

  <!-- 右侧说明 -->
  <g filter="url(#rough2)">
    <rect x="388" y="70" width="152" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#446688">
    <text x="464" y="96" text-anchor="middle">扫描顺序：</text>
    <text x="464" y="118" text-anchor="middle">x 从 0 到 50，</text>
    <text x="464" y="138" text-anchor="middle">y 从 0 到 50</text>
    <text x="464" y="164" text-anchor="middle">顺序 = 字典序</text>
    <text x="464" y="186" text-anchor="middle">先到者 = 更小者</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="326" width="440" height="26" fill="none" stroke="none"/>
  </g>
  <text x="280" y="346" text-anchor="middle" font-size="13.5" fill="#2d5a22" filter="url(#rough2)">只需扫 [0,50]²：非负最优解的收缩点仍在盒内且字典序更小（见证明）</text>
</svg>
