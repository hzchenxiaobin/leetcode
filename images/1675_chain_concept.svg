<svg xmlns="http://www.w3.org/2000/svg" width="640" height="436" viewBox="0 0 640 436" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="436" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：奇数翻倍统一 + 大顶堆贪心折半</text>
  <path d="M 170 34 Q 320 42 470 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="22" y="46" width="292" height="160" rx="10" fill="#fdfcf8" stroke="#c9c9c9" stroke-width="1.2"/>
  </g>
  <text x="168" y="68" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">统一化：奇数先 ×2</text>

  <g filter="url(#sk)">
    <rect x="48" y="92" width="42" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="140" y="92" width="42" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="12.5" text-anchor="middle" filter="url(#sk)">
    <text x="69" y="111" fill="#b85450" font-weight="bold">3</text>
    <text x="161" y="111" fill="#2b4a66" font-weight="bold">6</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 92 100 L 136 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 140 118 L 96 118" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="115" y="94" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#sk)">×2</text>
  <text x="118" y="133" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">÷2</text>
  <text x="192" y="111" font-size="11.5" fill="#888" filter="url(#sk)">可达 {3, 6}</text>

  <text x="34" y="140" font-size="11.5" fill="#999" filter="url(#sk)">奇数 3</text>
  <text x="34" y="172" font-size="11.5" fill="#999" filter="url(#sk)">偶数 20</text>
  <g filter="url(#sk)">
    <rect x="48" y="150" width="42" height="28" rx="4" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="140" y="150" width="42" height="28" rx="4" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="232" y="150" width="42" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="12.5" text-anchor="middle" filter="url(#sk)">
    <text x="69" y="169" fill="#333">20</text>
    <text x="161" y="169" fill="#333">10</text>
    <text x="253" y="169" fill="#b85450" font-weight="bold">5</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 92 164 L 136 164" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 184 164 L 228 164" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="114" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">÷2</text>
  <text x="206" y="158" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">÷2</text>
  <text x="253" y="190" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">奇核心</text>
  <text x="168" y="200" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">链顶统一为偶数，往下只能 ÷2</text>

  <g filter="url(#sk)">
    <rect x="326" y="46" width="292" height="160" rx="10" fill="#fdfcf8" stroke="#c9c9c9" stroke-width="1.2"/>
  </g>
  <text x="472" y="68" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">贪心：反复折半当前 max</text>
  <text x="438" y="84" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">当前堆（示意）</text>
  <text x="550" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#sk)">堆顶 = max</text>

  <g filter="url(#sk)">
    <rect x="346" y="90" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="392" y="90" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="438" y="90" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="484" y="90" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="530" y="90" width="40" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <g font-size="12.5" text-anchor="middle" filter="url(#sk)">
    <text x="366" y="110" fill="#2b4a66">2</text>
    <text x="412" y="110" fill="#2b4a66">4</text>
    <text x="458" y="110" fill="#2b4a66">6</text>
    <text x="504" y="110" fill="#2b4a66">10</text>
    <text x="550" y="110" fill="#b07818" font-weight="bold">20</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 550 122 C 558 132, 550 140, 538 146" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <rect x="496" y="148" width="54" height="26" rx="4" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4"/>
  </g>
  <text x="523" y="166" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#sk)">10</text>
  <text x="572" y="138" font-size="11.5" fill="#b07818" filter="url(#sk)">÷2</text>
  <text x="472" y="184" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">每轮记录 ans ← min(ans, max − mn)</text>
  <text x="472" y="200" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">更新 mn ← min(mn, v)，v 放回堆</text>

  <g filter="url(#sk)">
    <rect x="40" y="222" width="560" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="241" text-anchor="middle" font-size="12.5" fill="#b07818" filter="url(#sk)">统一化后所有值只能变小 ⟹ min 只降不升</text>
  <text x="320" y="258" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b07818" filter="url(#sk)">唯一有建设性的动作 = 折半 max（堆顶变奇即停）</text>

  <text x="320" y="288" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">预处理后的 5 条 ÷2 链（奇数已 ×2，绿色 = 链顶 / 当前值）</text>

  <g filter="url(#sk)">
    <rect x="69" y="298" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="69" y="340" width="46" height="26" rx="4" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="69" y="382" width="46" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="12.5" text-anchor="middle" filter="url(#sk)">
    <text x="92" y="316" fill="#3a5a3a" font-weight="bold">4</text>
    <text x="92" y="358" fill="#333">2</text>
    <text x="92" y="400" fill="#b85450">1</text>
  </g>

  <g filter="url(#sk)">
    <rect x="165" y="298" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="165" y="340" width="46" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="12.5" text-anchor="middle" filter="url(#sk)">
    <text x="188" y="316" fill="#3a5a3a" font-weight="bold">2</text>
    <text x="188" y="358" fill="#b85450">1</text>
  </g>

  <g filter="url(#sk)">
    <rect x="261" y="298" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="261" y="340" width="46" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="12.5" text-anchor="middle" filter="url(#sk)">
    <text x="284" y="316" fill="#3a5a3a" font-weight="bold">10</text>
    <text x="284" y="358" fill="#b85450">5</text>
  </g>

  <g filter="url(#sk)">
    <rect x="357" y="298" width="46" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="357" y="340" width="46" height="26" rx="4" fill="#fffdf3" stroke="#c9c9c9" stroke-width="1.2"/>
    <rect x="357" y="382" width="46" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="12.5" text-anchor="middle" filter="url(#sk)">
    <text x="380" y="316" fill="#b07818" font-weight="bold">20★</text>
    <text x="380" y="358" fill="#333">10</text>
    <text x="380" y="400" fill="#b85450">5</text>
  </g>

  <g filter="url(#sk)">
    <rect x="453" y="298" width="46" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="453" y="340" width="46" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="12.5" text-anchor="middle" filter="url(#sk)">
    <text x="476" y="316" fill="#3a5a3a" font-weight="bold">6</text>
    <text x="476" y="358" fill="#b85450">3</text>
  </g>

  <g filter="url(#sk)">
    <path d="M 92 326 L 92 337" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 92 368 L 92 379" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 188 326 L 188 337" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 284 326 L 284 337" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 380 326 L 380 337" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 380 368 L 380 379" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 476 326 L 476 337" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <g font-size="11" fill="#b07818" filter="url(#sk)">
    <text x="512" y="310">当前全局 max</text>
    <text x="512" y="326">先折半它</text>
  </g>
  <text x="320" y="424" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">红色 = 奇核心（链的终点，无法再 ÷2）；贪心每轮折半「最高的链头」</text>
</svg>
