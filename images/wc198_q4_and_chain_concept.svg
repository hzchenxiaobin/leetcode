<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="920" height="450" fill="#fdfcf7"/>
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：固定右端点 r，左端点左移，AND 只会清位</text>
  <path d="M 210 42 Q 460 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="460" y="68" text-anchor="middle" font-size="12" fill="#666">arr = [9, 12, 3, 7, 15]：固定 r = 4，考察以 4 结尾的全部 5 个子数组</text>

  <!-- ===== array ===== -->
  <text x="66" y="110" font-size="11" fill="#888" font-weight="bold">arr:</text>
  <g font-size="14">
    <g filter="url(#sk)"><rect x="100" y="88" width="62" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="131" y="110" text-anchor="middle" fill="#2b6e9e" font-weight="bold">9</text>
    <g filter="url(#sk)"><rect x="164" y="88" width="62" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="195" y="110" text-anchor="middle" fill="#2b6e9e" font-weight="bold">12</text>
    <g filter="url(#sk)"><rect x="228" y="88" width="62" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="259" y="110" text-anchor="middle" fill="#2b6e9e" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="292" y="88" width="62" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
    <text x="323" y="110" text-anchor="middle" fill="#2b6e9e" font-weight="bold">7</text>
    <g filter="url(#sk)"><rect x="356" y="88" width="62" height="34" rx="4" fill="#fce4ec" stroke="#b03a3a" stroke-width="2.2"/></g>
    <text x="387" y="110" text-anchor="middle" fill="#b03a3a" font-weight="bold">15</text>
  </g>
  <text x="131" y="138" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="195" y="138" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="259" y="138" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="323" y="138" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="387" y="138" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">4</text>
  <text x="387" y="80" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">r = 4</text>

  <!-- ===== info panel ===== -->
  <g filter="url(#sk)">
    <rect x="560" y="78" width="330" height="88" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="578" y="102" font-size="11.5" fill="#2b6e9e" font-weight="bold">arr[i] ≤ 10⁶ &lt; 2²⁰：每个数至多 20 个 1 位</text>
  <text x="578" y="124" font-size="11.5" fill="#2b6e9e">每严格下降一次，至少清掉 1 个 1 位</text>
  <text x="578" y="148" font-size="11.5" fill="#b03a3a" font-weight="bold">⇒ 互异 AND 值至多 20 + 1 = 21 个</text>

  <!-- ===== descending staircase chain ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="166" width="122" height="54" rx="6" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="131" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">l=4 → 15</text>
  <text x="131" y="208" text-anchor="middle" font-size="10" fill="#888">1111₂ 位全保留</text>

  <path d="M 194 212 Q 220 226 240 234" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="222" y="216" font-size="11" fill="#c98a2b" font-weight="bold">&amp; 7</text>

  <g filter="url(#sk)">
    <rect x="240" y="208" width="122" height="54" rx="6" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="301" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">l=3 → 7</text>
  <text x="301" y="250" text-anchor="middle" font-size="10" fill="#888">0111₂ 清 1 位</text>

  <path d="M 364 254 Q 390 268 410 276" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="392" y="258" font-size="11" fill="#c98a2b" font-weight="bold">&amp; 3</text>

  <g filter="url(#sk)">
    <rect x="410" y="250" width="122" height="54" rx="6" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="471" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">l=2 → 3</text>
  <text x="471" y="292" text-anchor="middle" font-size="10" fill="#888">0011₂ 再清 1 位</text>

  <path d="M 534 296 Q 560 310 580 318" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="562" y="300" font-size="11" fill="#c98a2b" font-weight="bold">&amp; 12</text>

  <g filter="url(#sk)">
    <rect x="580" y="292" width="122" height="54" rx="6" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="641" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">l=1 → 0</text>
  <text x="641" y="334" text-anchor="middle" font-size="10" fill="#888">0000₂ 位清空</text>

  <path d="M 704 338 Q 730 352 750 360" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="732" y="342" font-size="11" fill="#c98a2b" font-weight="bold">&amp; 9</text>

  <g filter="url(#sk)">
    <rect x="750" y="334" width="146" height="54" rx="6" fill="#f0ede4" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="823" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#999">l=0 → 0</text>
  <text x="823" y="374" text-anchor="middle" font-size="10" fill="#999">与上一值重复 → 去重丢弃</text>

  <!-- dedup note -->
  <path d="M 705 350 Q 690 348 676 346" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="641" y="362" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">5 个左端点</text>
  <text x="641" y="376" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">只有 4 个值</text>

  <!-- ===== conclusion ===== -->
  <g filter="url(#sk)">
    <rect x="36" y="400" width="850" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="56" y="418" font-size="12.5" font-weight="bold" fill="#2e6e2e">互异值只有 {15, 7, 3, 0}；n 个右端点共 O(21n) ≈ 2×10⁶ 个候选</text>
  <text x="56" y="435" font-size="11" fill="#333">全枚举也不慌 —— 这就是把 O(n²) 压成 O(n·log V) 的钥匙。</text>
</svg>
