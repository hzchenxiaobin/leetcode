<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1：8 节点 DAG 与各节点的祖先表</text>

  <!-- 左：图 -->
  <g filter="url(#rough2)">
    <circle cx="80" cy="96" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="160" cy="96" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="240" cy="96" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="120" cy="168" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="220" cy="168" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="70" cy="240" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="150" cy="240" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="230" cy="240" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="80" y="101">0</text><text x="160" y="101">1</text><text x="240" y="101">2</text>
    <text x="120" y="173">3</text><text x="220" y="173">4</text>
    <text x="70" y="245">5</text><text x="150" y="245">6</text><text x="230" y="245">7</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 92 112 L 108 152" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 152 112 L 130 152" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 70 116 L 210 150" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 252 112 L 232 150" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 240 116 C 250 170, 245 200, 243 218" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 106 184 L 82 222" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 134 184 L 144 218" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 138 180 L 216 224" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 224 188 L 160 224" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>
  <text x="160" y="292" font-size="12" fill="#999" filter="url(#rough2)" text-anchor="middle">9 条有向边（示例 1 输入）</text>

  <!-- 右：答案表 -->
  <text x="436" y="66" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">answer[i]（升序）</text>
  <g filter="url(#rough2)">
    <rect x="318" y="76" width="230" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <rect x="318" y="102" width="230" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <rect x="318" y="128" width="230" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="5"/>
    <rect x="318" y="154" width="230" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5"/>
    <rect x="318" y="180" width="230" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5"/>
    <rect x="318" y="206" width="230" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="318" y="232" width="230" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="318" y="258" width="230" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="330" y="94">0 → []（无祖先）</text>
    <text x="330" y="120">1 → []</text>
    <text x="330" y="146">2 → []</text>
    <text x="330" y="172">3 → [0, 1]</text>
    <text x="330" y="198">4 → [0, 2]</text>
    <text x="330" y="224">5 → [0, 1, 3]</text>
    <text x="330" y="250">6 → [0, 1, 2, 3, 4]</text>
    <text x="330" y="276">7 → [0, 1, 2, 3]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="318" y="300" width="230" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"/>
  </g>
  <text x="433" y="325" font-size="12.5" fill="#6a3a36" filter="url(#rough2)" text-anchor="middle">每个点独立跑一次反图 BFS</text>
</svg>
