<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b0722a"/></marker>
  </defs>
  <rect width="620" height="560" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">算法流程：哈希投影到下标，贪心 LIS 维护 tails 数组</text>
  <path d="M 160 34 Q 310 42 460 34" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- init -->
  <g filter="url(#r)"><rect x="170" y="46" width="300" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="320" y="69" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">预处理：pos[v] ← target 的下标映射；tails ← [ ]</text>
  <path d="M 320 82 L 320 100" stroke="#b0722a" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>

  <!-- diamond 1: more elements? -->
  <polygon points="320,104 430,142 320,180 210,142" fill="#fdfcf7" stroke="#446688" stroke-width="1.8" filter="url(#r)"/>
  <text x="320" y="147" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">arr 还有元素 x ？</text>
  <text x="196" y="128" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">否</text>
  <path d="M 210 142 C 150 152 105 180 100 206" stroke="#b0722a" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>
  <g filter="url(#r)"><ellipse cx="100" cy="238" rx="100" ry="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="100" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">返回 n − len(tails)</text>
  <text x="100" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#r)">（len(tails) = LIS 长度）</text>

  <text x="332" y="196" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">是</text>
  <path d="M 320 180 L 320 198" stroke="#b0722a" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>

  <!-- diamond 2: in target? -->
  <polygon points="320,202 430,238 320,274 210,238" fill="#fdfcf7" stroke="#446688" stroke-width="1.8" filter="url(#r)"/>
  <text x="320" y="243" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">x ∈ pos ？</text>
  <text x="332" y="292" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">是，i ← pos[x]</text>
  <path d="M 320 274 L 320 292" stroke="#b0722a" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>
  <text x="497" y="220" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#r)">否 → 丢弃 x</text>
  <text x="497" y="236" font-size="10" fill="#999" filter="url(#r)">（不在 target 中）</text>
  <path d="M 430 238 C 495 234 540 222 559 208" stroke="#b0722a" stroke-width="1.8" fill="none" filter="url(#r)"/>

  <!-- lower_bound box -->
  <g filter="url(#r)"><rect x="170" y="296" width="300" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="313" text-anchor="middle" font-size="12.5" fill="#5a4a1a" filter="url(#r)">k ← lower_bound(tails, i)：首个 ≥ i 的槽位</text>
  <text x="320" y="331" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#r)">（严格上升用 lower_bound；tails 递增保证可二分）</text>
  <path d="M 320 338 L 320 356" stroke="#b0722a" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>

  <!-- diamond 3: at end? -->
  <polygon points="320,360 420,396 320,432 220,396" fill="#fdfcf7" stroke="#446688" stroke-width="1.8" filter="url(#r)"/>
  <text x="320" y="401" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">k == len(tails) ？</text>
  <text x="334" y="450" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">是</text>
  <path d="M 320 432 L 320 452" stroke="#b0722a" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>
  <text x="206" y="390" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">否</text>
  <path d="M 220 396 L 196 396" stroke="#b0722a" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#r)"/>

  <!-- replace box -->
  <g filter="url(#r)"><rect x="20" y="376" width="174" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="107" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#r)">tails[k] ← i</text>
  <text x="107" y="413" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#r)">结尾变小，后面更好接</text>

  <!-- append box -->
  <g filter="url(#r)"><rect x="210" y="456" width="220" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="475" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">tails.push_back(i)：长度 +1</text>
  <text x="320" y="493" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#r)">能接长就接长</text>

  <!-- merge paths to loop rail -->
  <path d="M 320 500 L 320 528" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#r)"/>
  <path d="M 107 420 L 107 528" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#r)"/>
  <path d="M 106 528 L 560 528 L 560 210 C 560 182 520 152 434 142" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#r)"/>
  <text x="548" y="340" text-anchor="end" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">取下一个 x</text>
</svg>
