<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="560" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：m＝3, k＝1 —— 三桶状态逐步变迁</text>
  <path d="M 130 40 Q 320 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#666">官方示例：add(3), add(1), add(10), add(5), add(5), add(5)，穿插三次 calc</text>

  <text x="72" y="84" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">操作</text>
  <text x="168" y="84" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">窗口 q / 结果</text>
  <text x="268" y="84" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold">lo (k＝1)</text>
  <text x="358" y="84" text-anchor="middle" font-size="12" fill="#2e5a24" font-weight="bold">mid (1)</text>
  <text x="448" y="84" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">hi (k＝1)</text>
  <text x="565" y="84" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">说明</text>

  <g filter="url(#sk)">
    <rect x="20" y="140" width="600" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6"/>
  </g>

  <g filter="url(#sk)">
    <rect x="98" y="94" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="228" y="94" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="318" y="94" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="408" y="94" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="98" y="140" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="228" y="140" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="318" y="140" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="408" y="140" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="98" y="186" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="228" y="186" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="318" y="186" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="408" y="186" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="98" y="232" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="228" y="232" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="318" y="232" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="408" y="232" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="98" y="278" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="228" y="278" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="318" y="278" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="408" y="278" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="98" y="324" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="228" y="324" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="318" y="324" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="408" y="324" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="98" y="370" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="228" y="370" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="318" y="370" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="408" y="370" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="98" y="416" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="228" y="416" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="318" y="416" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="408" y="416" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="98" y="462" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="228" y="462" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="318" y="462" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="408" y="462" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>

  <text x="72" y="115" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">add(3)</text>
  <text x="168" y="115" text-anchor="middle" font-size="12" fill="#333">[3]</text>
  <text x="268" y="115" text-anchor="middle" font-size="12.5" fill="#333">{3}</text>
  <text x="358" y="115" text-anchor="middle" font-size="12.5" fill="#333">∅</text>
  <text x="448" y="115" text-anchor="middle" font-size="12.5" fill="#333">∅</text>
  <text x="565" y="107" text-anchor="middle" font-size="10.5" fill="#666">lo 未满 k＝1，</text>
  <text x="565" y="122" text-anchor="middle" font-size="10.5" fill="#666">3 直接进入 lo</text>

  <text x="72" y="161" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">add(1)</text>
  <text x="168" y="161" text-anchor="middle" font-size="12" fill="#333">[3, 1]</text>
  <text x="268" y="161" text-anchor="middle" font-size="12.5" fill="#333">{1}</text>
  <text x="358" y="161" text-anchor="middle" font-size="12.5" fill="#333">∅</text>
  <text x="448" y="161" text-anchor="middle" font-size="12.5" fill="#333">{3}</text>
  <text x="565" y="152" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1 入 lo 溢出；mid 空且</text>
  <text x="565" y="167" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">hi 未满 → 3 直送 hi ⚠</text>

  <text x="72" y="207" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">calc</text>
  <text x="168" y="207" text-anchor="middle" font-size="12.5" fill="#2e5a24" font-weight="bold">→ −1</text>
  <text x="268" y="207" text-anchor="middle" font-size="12.5" fill="#333">{1}</text>
  <text x="358" y="207" text-anchor="middle" font-size="12.5" fill="#333">∅</text>
  <text x="448" y="207" text-anchor="middle" font-size="12.5" fill="#333">{3}</text>
  <text x="565" y="207" text-anchor="middle" font-size="11" fill="#2e5a24" font-weight="bold">|q| ＝ 2 ＜ 3</text>

  <text x="72" y="253" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">add(10)</text>
  <text x="168" y="253" text-anchor="middle" font-size="12" fill="#333">[3, 1, 10]</text>
  <text x="268" y="253" text-anchor="middle" font-size="12.5" fill="#333">{1}</text>
  <text x="358" y="253" text-anchor="middle" font-size="12.5" fill="#333">{3}</text>
  <text x="448" y="253" text-anchor="middle" font-size="12.5" fill="#333">{10}</text>
  <text x="565" y="245" text-anchor="middle" font-size="10.5" fill="#666">10 ≥ min(hi) 入 hi 溢出</text>
  <text x="565" y="260" text-anchor="middle" font-size="10.5" fill="#666">3 移入 mid（sum＝3）</text>

  <text x="72" y="299" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">calc</text>
  <text x="168" y="299" text-anchor="middle" font-size="12.5" fill="#2e5a24" font-weight="bold">→ 3</text>
  <text x="268" y="299" text-anchor="middle" font-size="12.5" fill="#333">{1}</text>
  <text x="358" y="299" text-anchor="middle" font-size="12.5" fill="#333">{3}</text>
  <text x="448" y="299" text-anchor="middle" font-size="12.5" fill="#333">{10}</text>
  <text x="565" y="299" text-anchor="middle" font-size="11" fill="#2e5a24" font-weight="bold">⌊3 / (3−2)⌋ ＝ 3 ✓</text>

  <text x="72" y="345" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">add(5)</text>
  <text x="168" y="345" text-anchor="middle" font-size="12" fill="#333">[1, 10, 5]</text>
  <text x="268" y="345" text-anchor="middle" font-size="12.5" fill="#333">{1}</text>
  <text x="358" y="345" text-anchor="middle" font-size="12.5" fill="#333">{5}</text>
  <text x="448" y="345" text-anchor="middle" font-size="12.5" fill="#333">{10}</text>
  <text x="565" y="337" text-anchor="middle" font-size="10.5" fill="#666">5 落入 mid；淘汰 3</text>
  <text x="565" y="352" text-anchor="middle" font-size="10.5" fill="#666">（3 在 mid，直接删）</text>

  <text x="72" y="391" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">add(5)</text>
  <text x="168" y="391" text-anchor="middle" font-size="12" fill="#333">[10, 5, 5]</text>
  <text x="268" y="391" text-anchor="middle" font-size="12.5" fill="#333">{5}</text>
  <text x="358" y="391" text-anchor="middle" font-size="12.5" fill="#333">{5}</text>
  <text x="448" y="391" text-anchor="middle" font-size="12.5" fill="#333">{10}</text>
  <text x="565" y="382" text-anchor="middle" font-size="10.5" fill="#666">淘汰 1（在 lo）</text>
  <text x="565" y="397" text-anchor="middle" font-size="10.5" fill="#666">mid 最小 5 借给 lo</text>

  <text x="72" y="437" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">add(5)</text>
  <text x="168" y="437" text-anchor="middle" font-size="12" fill="#333">[5, 5, 5]</text>
  <text x="268" y="437" text-anchor="middle" font-size="12.5" fill="#333">{5}</text>
  <text x="358" y="437" text-anchor="middle" font-size="12.5" fill="#333">{5}</text>
  <text x="448" y="437" text-anchor="middle" font-size="12.5" fill="#333">{5}</text>
  <text x="565" y="428" text-anchor="middle" font-size="10.5" fill="#666">5 入 lo 溢出 → mid；</text>
  <text x="565" y="443" text-anchor="middle" font-size="10.5" fill="#666">淘汰 10，mid 借 5 给 hi</text>

  <text x="72" y="483" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">calc</text>
  <text x="168" y="483" text-anchor="middle" font-size="12.5" fill="#2e5a24" font-weight="bold">→ 5</text>
  <text x="268" y="483" text-anchor="middle" font-size="12.5" fill="#333">{5}</text>
  <text x="358" y="483" text-anchor="middle" font-size="12.5" fill="#333">{5}</text>
  <text x="448" y="483" text-anchor="middle" font-size="12.5" fill="#333">{5}</text>
  <text x="565" y="483" text-anchor="middle" font-size="11" fill="#2e5a24" font-weight="bold">⌊5 / 1⌋ ＝ 5 ✓</text>

  <text x="320" y="530" text-anchor="middle" font-size="12" fill="#666">三次 calc 依次返回 −1、3、5，与官方示例输出一致；黄色高亮行正是「预热期溢出直送 hi」的修正点</text>
</svg>
