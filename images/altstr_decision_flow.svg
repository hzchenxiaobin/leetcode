<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：判可行 → 数错位 → 除 2 取最小</text>
  <path d="M 170 38 Q 320 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="115" y="54" width="250" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="240" y="78" text-anchor="middle" font-size="13" fill="#2b6e9e">① 统计 n = |s|，c1 = '1' 的个数</text>
  <path d="M 240 92 L 240 118" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <path d="M 240 118 L 390 172 L 240 226 L 90 172 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="240" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">② 计数与某个目标形态匹配？</text>
  <text x="240" y="185" text-anchor="middle" font-size="11" fill="#8a6415">n 偶：c1 = n/2；n 奇：c1 = (n±1)/2</text>

  <path d="M 390 172 L 428 172" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="408" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="432" y="148" width="180" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="522" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 -1（无解）</text>
  <text x="522" y="186" text-anchor="middle" font-size="10" fill="#b85450">交换不改变 0/1 计数</text>

  <path d="M 240 226 L 240 254" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="254" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>

  <g filter="url(#sk)">
    <rect x="75" y="258" width="330" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="240" y="277" text-anchor="middle" font-size="12" fill="#2e6e2e">③ 候选目标：n 偶 → { "0101…", "1010…" } 两个都试；</text>
  <text x="240" y="295" text-anchor="middle" font-size="12" fill="#2e6e2e">n 奇 → 只有「多出来的字符」开头的那一个</text>
  <path d="M 240 304 L 240 330" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="75" y="334" width="330" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="240" y="353" text-anchor="middle" font-size="12" fill="#2b6e9e">④ 对每个候选 t 一趟扫描：</text>
  <text x="240" y="371" text-anchor="middle" font-size="12" fill="#2b6e9e">mis = #{ i : s[i] ≠ t[i] }（t[i] = st ⊕ (i mod 2)）</text>
  <path d="M 240 380 L 240 406" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="75" y="410" width="330" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="240" y="429" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">⑤ cost = mis / 2（可行时 mis 必为偶数）</text>
  <text x="240" y="447" text-anchor="middle" font-size="12" fill="#b85450">ans = min(cost) → 输出 ans</text>

  <g filter="url(#sk)">
    <rect x="432" y="258" width="180" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="522" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">时间 O(n) · 空间 O(1)</text>
  <text x="522" y="302" text-anchor="middle" font-size="11" fill="#8a6415">至多两趟扫描，n ≤ 1000</text>
</svg>
