  <text x="320" y="130" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">岛 A = {(0,1),(1,1),(1,2)}</text>
  <text x="320" y="158" text-anchor="start" font-size="11" fill="#d6a040" filter="url(#rough2)">岛 B = {(3,0)}</text>
  <text x="320" y="190" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">阶段 2：从岛 A 的每个格子同时 BFS</text>
  <text x="320" y="216" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">每扩一层 = 多翻一个 0；碰到 1 即停</text>
  <rect x="60" y="268" width="540" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="293.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">答案 = 碰到岛 B 时的层数（= 需要翻转的 0 的个数）</text>
  <text x="330" y="348" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">多源 BFS 同时从整座岛出发，等价于「到岛 A 的最近距离」场</text>
  <text x="330" y="376" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 3 的环：外圈是岛 A、中心 1 格是岛 B，扩 1 层即相遇，答案是 1</text>
