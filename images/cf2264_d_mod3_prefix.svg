<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 404" width="840" height="404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="840" height="404" fill="#fafafa"/>

  <text x="420" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：2^k ≡ (−1)^k (mod 3)，段值只取决于前缀交错和</text>
  <text x="420" y="52" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">「能否被 3 整除」被翻译成「两个前缀值是否相等」</text>

  <!-- 左：样例串与前缀值 -->
  <rect x="26" y="68" width="470" height="186" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="44" y="92" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">s = 0 1 0 1 0 0　（n = 6，i 为 1-based 位置）</text>

  <!-- 像素行 -->
  <text x="44" y="118" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">s_i</text>
  <rect x="86" y="104" width="50" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="111" y="122" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="142" y="104" width="50" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="167" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="198" y="104" width="50" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="223" y="122" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="254" y="104" width="50" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="279" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="310" y="104" width="50" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="335" y="122" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="366" y="104" width="50" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="391" y="122" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">0</text>

  <!-- 前缀行 -->
  <text x="36" y="176" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">P_i</text>
  <rect x="62" y="156" width="50" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="87" y="174" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="118" y="156" width="50" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="143" y="174" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="174" y="156" width="50" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="199" y="174" text-anchor="middle" font-size="13" fill="#33582a" filter="url(#rough2)">1</text>
  <rect x="230" y="156" width="50" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="174" text-anchor="middle" font-size="13" fill="#33582a" filter="url(#rough2)">1</text>
  <rect x="286" y="156" width="50" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="311" y="174" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">2</text>
  <rect x="342" y="156" width="50" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="367" y="174" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">2</text>
  <rect x="398" y="156" width="50" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="423" y="174" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">2</text>

  <text x="44" y="212" font-size="11.4" fill="#2f4a66" filter="url(#rough2)">P_0 = 0，P_i = P_{i−1} + (−1)^i·s_i　（i 为偶数加 1，i 为奇数减 1）</text>
  <text x="44" y="238" font-size="11.4" fill="#2f4a66" filter="url(#rough2)">同色 = 同余类 ⇒ c_0 = 2，c_1 = 2，c_2 = 3</text>

  <!-- 右：公式 -->
  <rect x="516" y="68" width="300" height="186" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="532" y="92" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">段值模 3</text>
  <text x="532" y="118" font-size="11.4" fill="#8a6015" filter="url(#rough2)">value(l,r) = Σ s_i·2^{r−i}</text>
  <text x="532" y="142" font-size="11.4" fill="#8a6015" filter="url(#rough2)">≡ Σ s_i·(−1)^{r−i}　（2 ≡ −1）</text>
  <text x="532" y="166" font-size="11.4" fill="#8a6015" filter="url(#rough2)">= (−1)^r ·(P_r − P_{l−1})</text>
  <text x="532" y="196" font-size="12.2" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">⇒ 被 3 整除 ⟺ P_r = P_{l−1}</text>
  <text x="532" y="220" font-size="11.4" fill="#8a6015" filter="url(#rough2)">与 r 的奇偶、前导零都无关</text>

  <path d="M 261 254 L 261 272" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计数条 -->
  <rect x="26" y="272" width="788" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="46" y="296" font-size="13.4" font-weight="bold" fill="#33582a" filter="url(#rough2)">f(s) = Σ_{v=0}^{2} C(c_v, 2)，c_v = #{ i ∈ [0,n] : P_i ≡ v (mod 3) }，c_0 + c_1 + c_2 = n + 1</text>
  <text x="46" y="318" font-size="11.5" fill="#33582a" filter="url(#rough2)">每对相等的前缀对应一个被 3 整除的段；段只由下标对决定，所以这样数不重不漏。</text>

  <!-- 结论条 -->
  <rect x="26" y="340" width="788" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="46" y="364" font-size="13" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">问题变成：用「≤ 3 个 1」把 n+1 个前缀值尽量均匀地染成 3 类（本例 f = 1+1+3 = 5）</text>
  <text x="46" y="384" font-size="11.4" fill="#8c3a37" filter="url(#rough2)">均匀是下界（凸性），难点在于只有 3 个 1 时前缀值的走法受位置奇偶严格约束。</text>
</svg>
