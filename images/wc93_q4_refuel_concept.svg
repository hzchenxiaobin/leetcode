<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="660" height="360" fill="#fafafa"/>

  <text x="22" y="32" font-size="16" fill="#333" filter="url(#rough2)">油箱无限 ⇒ 加油顺序无关，可以「先记下、需要时再回溯补记」</text>

  <!-- 里程轴 -->
  <path d="M40 130 L620 130" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="40" y="118" font-size="11" fill="#666" filter="url(#rough2)">起点 0</text>
  <text x="612" y="118" font-size="11" fill="#b85450" filter="url(#rough2)">target</text>

  <!-- 加油站 -->
  <path d="M150 130 L150 108" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <rect x="118" y="62" width="64" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="80" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">站 A</text>
  <text x="150" y="96" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">油 60</text>

  <path d="M270 130 L270 108" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <rect x="238" y="62" width="64" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">站 B</text>
  <text x="270" y="96" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">油 30</text>

  <path d="M390 130 L390 108" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <rect x="358" y="62" width="64" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="80" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">站 C</text>
  <text x="390" y="96" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">油 30</text>

  <!-- 当前油量耗尽处 -->
  <circle cx="480" cy="130" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="156" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">油尽，卡住</text>

  <!-- 回溯箭头 -->
  <path d="M480 186 C420 210 300 200 150 186" stroke="#d6a040" stroke-width="1.8" fill="none"
        stroke-dasharray="6 5" filter="url(#rough2)" marker-end="url(#arrO)"/>
  <text x="330" y="224" text-anchor="middle" font-size="12" fill="#8b6410" filter="url(#rough2)">回头看：A、B、C 都路过过，挑油最多的 A（60）补记一次</text>

  <!-- 说明框 -->
  <rect x="40" y="248" width="284" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="182" y="272" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">为什么「回溯」合法？</text>
  <text x="182" y="294" text-anchor="middle" font-size="11" fill="#2c4a63" filter="url(#rough2)">油箱容量无限，先加后加只影响</text>
  <text x="182" y="314" text-anchor="middle" font-size="11" fill="#2c4a63" filter="url(#rough2)">「中途油量够不够」，不影响总量</text>

  <rect x="344" y="248" width="272" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="480" y="272" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">为什么挑最大的？</text>
  <text x="480" y="294" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">次数要最少 ⇒ 每次加油都要</text>
  <text x="480" y="314" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">尽可能撑得远 ⇒ 用大顶堆取最大</text>
</svg>
