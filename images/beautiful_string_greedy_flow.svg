<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：右扫定位 + 最小合法增大 + 后缀贪心重填</text>

  <!-- ① 扫描框 -->
  <rect x="160" y="48" width="200" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 从右往左扫 i = n-1 … 0</text>
  <path d="M 260 84 L 260 102" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,106 400,158 260,210 120,158" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">位置 i 能放大？</text>
  <text x="260" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">存在 c &gt; s[i]，c≠s[i-1]，c≠s[i-2]</text>

  <!-- 是分支 -->
  <path d="M 260 210 L 260 230" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="224" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="140" y="234" width="240" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="257" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② s[i] ← 最小合法放大字符 c</text>
  <path d="M 260 270 L 260 288" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="86" y="292" width="348" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 后缀 j = i+1 … n-1 逐位贪心重填：</text>
  <text x="260" y="333" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每格取最小的 d ≠ s[j-1] 且 d ≠ s[j-2]</text>
  <path d="M 260 344 L 260 362" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="185" y="366" width="150" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">返回 s</text>

  <!-- 否分支 -->
  <path d="M 120 158 L 100 158" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="148" font-size="13" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="16" y="144" width="82" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="57" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i ← i-1</text>
  <path d="M 57 144 L 57 66 L 156 66" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 57 174 L 57 196" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="10" y="200" width="94" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="57" y="220" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">扫完仍无解</text>
  <text x="57" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 ""</text>
</svg>
