<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：净分差 DP —— f[i] = 面对后缀 i 的（先手 − 后手）最大分差</text>
  <text x="320" y="46" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#r)">边界 f[n] = 0；从右往左递推；答案 = f[0] 与 0 比大小</text>

  <!-- 石子数组 -->
  <g filter="url(#r)">
    <rect x="96" y="66" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="152" y="66" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="208" y="66" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="264" y="66" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="356" y="66" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="120" y="87" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#r)">v[i]</text>
  <text x="176" y="87" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#r)">v[i+1]</text>
  <text x="232" y="87" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#r)">v[i+2]</text>
  <text x="288" y="87" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#r)">v[i+3]</text>
  <text x="330" y="88" text-anchor="middle" font-size="15" fill="#888" filter="url(#r)">…</text>
  <text x="382" y="87" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#r)">v[n−1]</text>
  <text x="120" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">i</text>
  <text x="176" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">i+1</text>
  <text x="232" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">i+2</text>
  <text x="288" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">i+3</text>
  <text x="382" y="114" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">n−1</text>

  <!-- 括号：k=1/2/3 -->
  <g filter="url(#r)" stroke="#446688" stroke-width="1.6" fill="none">
    <path d="M96,128 v6 M96,131 h48 M144,128 v6"/>
    <path d="M96,148 v6 M96,151 h104 M200,148 v6"/>
    <path d="M96,168 v6 M96,171 h160 M256,168 v6"/>
  </g>
  <text x="150" y="136" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#r)">k=1</text>
  <text x="206" y="156" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#r)">k=2</text>
  <text x="262" y="176" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#r)">k=3</text>

  <!-- 三个候选 -->
  <g filter="url(#r)">
    <rect x="28" y="192" width="170" height="52" rx="8" fill="#fdfdfd" stroke="#446688" stroke-width="1.5"/>
    <rect x="218" y="192" width="170" height="52" rx="8" fill="#fdfdfd" stroke="#446688" stroke-width="1.5"/>
    <rect x="408" y="192" width="170" height="52" rx="8" fill="#fdfdfd" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="113" y="212" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#r)">拿 1 堆：s₁ = v[i]</text>
  <text x="113" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#r)">整局分差 = s₁ − f[i+1]</text>
  <text x="303" y="212" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#r)">拿 2 堆：s₂ = v[i]+v[i+1]</text>
  <text x="303" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#r)">整局分差 = s₂ − f[i+2]</text>
  <text x="493" y="212" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#r)">拿 3 堆：s₃ = 前 3 堆之和</text>
  <text x="493" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#r)">整局分差 = s₃ − f[i+3]</text>

  <!-- 汇聚到 max -->
  <path d="M 113 248 L 258 268" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 303 248 L 316 268" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <path d="M 493 248 L 382 268" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <g filter="url(#r)">
    <rect x="218" y="272" width="204" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="320" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#r)">f[i] = max(三个候选)</text>

  <!-- 终判 -->
  <text x="320" y="336" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#r)">答案看 f[0] 的符号（Alice 是后缀 0 的行动者）：</text>
  <g filter="url(#r)">
    <rect x="78" y="344" width="140" height="32" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="250" y="344" width="140" height="32" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="422" y="344" width="140" height="32" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="148" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">&gt; 0 → "Alice"</text>
  <text x="320" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0761e" filter="url(#r)">= 0 → "Tie"</text>
  <text x="492" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a4a44" filter="url(#r)">&lt; 0 → "Bob"</text>

  <!-- 两个关键点 -->
  <g filter="url(#r)">
    <rect x="20" y="388" width="292" height="80" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="328" y="388" width="292" height="80" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="166" y="410" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">① 状态只需一个下标 i（无后效性）</text>
  <text x="166" y="431" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#r)">已拿走的堆与历史比分都不影响未来，</text>
  <text x="166" y="449" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#r)">合法动作只看剩余后缀的起点，历史分差是常数偏移</text>
  <text x="474" y="410" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">② 角色互换（minimax）</text>
  <text x="474" y="431" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#r)">我拿 k 堆后，对手成为后缀 i+k 的先手，</text>
  <text x="474" y="449" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#r)">他的最优净分差是 f[i+k]，所以要「减去」它</text>
</svg>
