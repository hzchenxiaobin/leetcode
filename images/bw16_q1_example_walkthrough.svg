<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="102"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="330" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">逐格走查：arr = [17,18,5,4,6,1]</text>

  <!-- 表头 -->
  <text x="120" y="66" font-size="13" fill="#666" filter="url(#rough2)">下标 i</text>
  <text x="250" y="66" font-size="13" fill="#666" filter="url(#rough2)">进入时 mx（右侧最大）</text>
  <text x="450" y="66" font-size="13" fill="#666" filter="url(#rough2)">写出 ans[i]</text>

  <!-- 行：i=5 -->
  <rect x="100" y="80" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="230" y="80" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="256" y="100" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">-1</text>
  <rect x="430" y="80" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">-1</text>
  <text x="500" y="100" font-size="11.5" fill="#888" filter="url(#rough2)">右侧空 → 哨兵 -1</text>

  <!-- 行：i=4 -->
  <rect x="100" y="118" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="230" y="118" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="430" y="118" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="500" y="138" font-size="11.5" fill="#888" filter="url(#rough2)">mx = max(-1, 1) = 1</text>

  <!-- 行：i=3 -->
  <rect x="100" y="156" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="230" y="156" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="430" y="156" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="500" y="176" font-size="11.5" fill="#888" filter="url(#rough2)">mx = max(1, 6) = 6</text>

  <!-- 行：i=2 -->
  <rect x="100" y="194" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="230" y="194" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="430" y="194" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="500" y="214" font-size="11.5" fill="#888" filter="url(#rough2)">5 &lt; 6，mx 不变</text>

  <!-- 行：i=1 -->
  <rect x="100" y="232" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="252" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="230" y="232" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="252" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="430" y="232" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452" y="252" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="500" y="252" font-size="11.5" fill="#888" filter="url(#rough2)">4 &lt; 6，mx 不变</text>

  <!-- 行：i=0 -->
  <rect x="100" y="270" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="290" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="230" y="270" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="290" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">18</text>
  <rect x="430" y="270" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452" y="290" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">18</text>
  <text x="500" y="290" font-size="11.5" fill="#888" filter="url(#rough2)">进入时 mx 已是 18</text>

  <text x="320" y="322" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">结果 [18,6,6,6,1,-1]：i=0 的答案来自上一轮（i=1）涨上去的 mx=18</text>
</svg>
