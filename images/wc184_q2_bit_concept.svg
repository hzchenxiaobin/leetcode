<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444">核心观察：前插不搬元素，换个位置打标记</text>
  <text x="320" y="45" text-anchor="middle" font-size="11" fill="#888">位次 = 前缀计数；前插 = 旧位清零 + 新位置一 —— 两件事都交给树状数组</text>

  <!-- Section A: brute force -->
  <text x="70" y="74" font-size="12" font-weight="bold" fill="#b85450">① 暴力：真实维护排列，前插 = 整段平移</text>
  <g>
    <rect x="165" y="84" width="52" height="36" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="217" y="84" width="52" height="36" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="269" y="84" width="52" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="321" y="84" width="52" height="36" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="373" y="84" width="52" height="36" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="191" y="107" fill="#2e6e2e">1</text>
    <text x="243" y="107" fill="#2e6e2e">2</text>
    <text x="295" y="107" fill="#b85450">3</text>
    <text x="347" y="107" fill="#2e6e2e">4</text>
    <text x="399" y="107" fill="#2e6e2e">5</text>
  </g>
  <path d="M 295 80 Q 240 50 158 92" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="445" y="98" font-size="11" fill="#999">查找 O(m) + 平移 O(m)</text>
  <text x="445" y="116" font-size="11" font-weight="bold" fill="#b85450">n 次查询 → O(n·m)</text>
  <text x="290" y="140" text-anchor="middle" font-size="10.5" fill="#999">被越过的元素整体右移；m = 10^5 时达 10^10 必超时</text>
  <path d="M 60 156 L 580 156" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>

  <!-- Section B: BIT -->
  <text x="70" y="182" font-size="12" font-weight="bold" fill="#4a7a3a">② BIT：位置轴扩成 [1, n+m]，占据位只打 0/1 标记（例：n=4, m=5）</text>
  <text x="320" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">查询 3：清位 7 → 置位 4（落点 n−i 递减，无人平移）</text>
  <path d="M 404 234 Q 326 210 252 234" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <g>
    <rect x="66" y="240" width="52" height="40" rx="4" fill="#fffdf3" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <rect x="118" y="240" width="52" height="40" rx="4" fill="#fffdf3" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <rect x="170" y="240" width="52" height="40" rx="4" fill="#fffdf3" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <rect x="222" y="240" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <rect x="274" y="240" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="326" y="240" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="378" y="240" width="52" height="40" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <rect x="430" y="240" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="482" y="240" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  </g>
  <g text-anchor="middle">
    <text x="92" y="265" font-size="12" fill="#d6a040">·</text>
    <text x="144" y="265" font-size="12" fill="#d6a040">·</text>
    <text x="196" y="265" font-size="12" fill="#d6a040">·</text>
    <text x="248" y="266" font-size="14" font-weight="bold" fill="#b07818">3</text>
    <text x="300" y="266" font-size="14" font-weight="bold" fill="#2e6e2e">1</text>
    <text x="352" y="266" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>
    <text x="404" y="267" font-size="14" font-weight="bold" fill="#b85450">×</text>
    <text x="456" y="266" font-size="14" font-weight="bold" fill="#2e6e2e">4</text>
    <text x="508" y="266" font-size="14" font-weight="bold" fill="#2e6e2e">5</text>
  </g>
  <g font-size="9" fill="#999" text-anchor="middle">
    <text x="92" y="294">1</text>
    <text x="144" y="294">2</text>
    <text x="196" y="294">3</text>
    <text x="248" y="294">4</text>
    <text x="300" y="294">5</text>
    <text x="352" y="294">6</text>
    <text x="404" y="294">7</text>
    <text x="456" y="294">8</text>
    <text x="508" y="294">9</text>
  </g>
  <text x="56" y="294" font-size="10" fill="#666" text-anchor="end">位置</text>
  <text x="168" y="314" text-anchor="middle" font-size="10" fill="#d6a040">前插预留区（落点 4,3,2,1 递减）</text>
  <text x="404" y="314" text-anchor="middle" font-size="10" fill="#4a7a3a">初始区：数值 v 占 n + v</text>

  <!-- formula box -->
  <rect x="60" y="336" width="540" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="360" font-size="13" font-weight="bold" fill="#446688">位次（0-indexed）= query(pos[v]) − 1</text>
  <text x="80" y="380" font-size="11" fill="#555">前缀和包含 v 自身占据的 1，减 1 即「严格在前」的元素个数</text>
  <text x="80" y="400" font-size="11" font-weight="bold" fill="#b85450">前插 = 旧位 −1、新位 +1：两次 O(log N) 单点修改替代 O(m) 平移</text>
</svg>
