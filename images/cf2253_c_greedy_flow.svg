<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：归并降序 → 打标签 → 两种容量各贪心一次</text>

  <rect x="110" y="46" width="420" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="320" y="66" text-anchor="middle" font-size="12" fill="#3a4a66">输入 a（行可用值）、b（列可用值），两者各自严格递增</text>
  <text x="320" y="83" text-anchor="middle" font-size="11" fill="#7a8aa6">同一个数值可能在 a、b 中同时出现</text>

  <path d="M 320 92 L 320 110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="110" width="420" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="320" y="131" text-anchor="middle" font-size="12" fill="#3a5a30">双指针从尾部归并，得到“从大到小”的值序列，并打标签</text>
  <text x="320" y="152" text-anchor="middle" font-size="11" fill="#5a7a4a">标签 ∈ { 仅 A（只能当行值）, 仅 B（只能当列值）, 两边都有（谁都能当） }</text>

  <path d="M 320 166 L 320 184" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="184" width="420" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="9" filter="url(#rough2)"/>
  <text x="320" y="205" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">贪心：值从大到小扫，能放就放（能放 ⟺ 加入后仍满足三条容量）</text>
  <text x="320" y="228" text-anchor="middle" font-size="11.5" fill="#8a6a20">cntA ≤ k1 ⟶ 仅 A 的值的个数上限；  cntB ≤ k2 ⟶ 仅 B 的上限</text>
  <text x="320" y="249" text-anchor="middle" font-size="11.5" fill="#8a6a20">已选值总数 ≤ k1 + k2 （两边名额加起来就是总名额）</text>

  <path d="M 320 264 L 320 282" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="282" width="420" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="320" y="303" text-anchor="middle" font-size="12" fill="#3a4a66">跑两遍：容量 (k1,k2) = (n, m−1) 与 (n−1, m)</text>
  <text x="320" y="320" text-anchor="middle" font-size="11" fill="#7a8aa6">分别对应“留一条空列”与“留一条空行”</text>

  <path d="M 320 328 L 320 346" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="346" width="240" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="9" filter="url(#rough2)"/>
  <text x="320" y="370" text-anchor="middle" font-size="13" fill="#8a3a3a" font-weight="bold">答案 = max(两次贪心的和)</text>

  <text x="320" y="404" text-anchor="middle" font-size="11" fill="#888">“两边都有”的值只按一次计入答案，但可以自由选择充当行值还是列值</text>
</svg>
