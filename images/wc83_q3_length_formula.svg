<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把「长度 k 的连续段」写成公式</text>
  <path d="M 170.0 44 Q 320.0 54 470.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="320.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">从 a 开始的 k 个连续整数：a, a+1, …, a+k−1</text>
  <g filter="url(#rough2)"><rect x="140" y="96" width="74" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="177.0" y="123.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="226" y="96" width="74" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="263.0" y="123.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">a+1</text>
  <g filter="url(#rough2)"><rect x="312" y="96" width="74" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="349.0" y="123.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">a+2</text>
  <g filter="url(#rough2)"><rect x="398" y="96" width="74" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="435.0" y="123.2" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">a+3</text>
  <text x="177" y="158" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">+0</text>
  <text x="263" y="158" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">+1</text>
  <text x="349" y="158" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">+2</text>
  <text x="435" y="158" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">+3</text>
  <text x="320" y="182" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">k = 4 时：和 = 4a + (0+1+2+3)</text>
  <g filter="url(#rough2)"><rect x="90" y="196" width="460" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">n = k·a + k(k−1)/2</text>
  <text x="320" y="240" text-anchor="middle" font-size="10.5" fill="#2e5e22" filter="url(#rough2)">k 个整数各贡献一份 a，再加偏移量 0+1+…+(k−1)</text>
  <path d="M 320 252 Q 320.0 264.0 320 276" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="90" y="278" width="460" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">a = (n − k(k−1)/2) / k 必须是正整数</text>
  <text x="320" y="321" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#rough2)">⇒ 只需枚举 k，判整除；a ≥ 1 由 k(k+1)/2 ≤ n 保证</text>
  <text x="320" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">k 的枚举上界：k(k+1)/2 ≤ n ⇒ k = O(√n)</text>
  <text x="320" y="396" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">n ≤ 10⁹ 时最多枚举约 44721 个 k，远小于 n</text>
  </svg>