<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">倍增：2<tspan dy="-6" font-size="10">j</tspan><tspan dy="6"> 步拆成两段 2</tspan><tspan dy="-6" font-size="10">j−1</tspan><tspan dy="6"> 步</tspan></text>

  <!-- 时间轴：两段拼接 -->
  <text x="210" y="56" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">时间轴 t（第 t 次传球后的持球者）</text>

  <rect x="60" y="66" width="150" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="84" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">sum[j−1][i]</text>
  <text x="135" y="100" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">从 i 出发的前 2^(j−1) 个落脚点</text>

  <rect x="210" y="66" width="150" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="84" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">sum[j−1][mid]</text>
  <text x="285" y="100" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">从 mid 接着走的前 2^(j−1) 个</text>

  <path d="M 60,112 L 60,120" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 210,112 L 210,120" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 360,112 L 360,120" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="133" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="210" y="133" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2^(j−1)</text>
  <text x="360" y="133" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2^j</text>

  <text x="210" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">sum[j][i] = 绿 + 蓝（两段相加）</text>

  <!-- 右侧说明 -->
  <rect x="388" y="62" width="116" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="84" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">mid = nxt[j−1][i]</text>
  <text x="446" y="102" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">（i 走 2^(j−1) 步</text>
  <text x="446" y="118" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">的落点，两段</text>
  <text x="446" y="134" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">首尾相接）</text>

  <!-- 节点链：i → mid → end -->
  <circle cx="70" cy="222" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="227" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">i</text>

  <circle cx="260" cy="222" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="227" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">mid</text>

  <circle cx="450" cy="222" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="227" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">end</text>

  <path d="M 88,218 Q 174,204 241,218" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="165" y="205" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">走 2^(j−1) 步</text>

  <path d="M 278,218 Q 364,204 431,218" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="355" y="205" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">再走 2^(j−1) 步</text>

  <path d="M 74,206 Q 260,158 446,206" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">一步到位：跳 2^j 步</text>

  <text x="70" y="256" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">nxt[j][i] = nxt[j−1][nxt[j−1][i]] = end</text>

  <!-- 底部说明 -->
  <rect x="30" y="286" width="460" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">j = 0：nxt[0][i] = receiver[i]，sum[0][i] = i（只含起点自己）</text>
  <text x="260" y="323" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">k ≤ 10¹⁰ &lt; 2³⁴，只需 j = 0..33 共 34 层</text>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">预处理 O(n log k) 一张表，之后每个 x 查询 O(log k)</text>
</svg>
