<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 445"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="445" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">示例演算：k = 2 失败 vs k = 3 成功</text>
  <text x="260" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">同一对 s = "aabbcc", t = "bbaacc"，块长一变结论翻转</text>

  <!-- ===== section 1: k = 2, false ===== -->
  <rect x="35" y="66" width="450" height="164" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="55" y="90" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">k = 2（m = 3）→ false</text>

  <text x="85" y="121" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">s 块</text>
  <rect x="95" y="98" width="78" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="185" y="98" width="78" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">aab</text>
  <text x="224" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">bcc</text>

  <text x="85" y="169" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">t 块</text>
  <rect x="95" y="146" width="78" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="185" y="146" width="78" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">bba</text>
  <text x="224" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">acc</text>

  <text x="380" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" filter="url(#rough2)">哈希表 cnt（s +1，t −1）</text>
  <text x="380" y="132" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">aab → +1</text>
  <text x="380" y="150" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">bcc → +1</text>
  <rect x="298" y="160" width="164" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="176" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">bba −1 → 减穿！</text>
  <text x="380" y="204" text-anchor="middle" font-size="11.5" fill="#8a3a34" filter="url(#rough2)">acc 也无处可减</text>

  <text x="190" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">→ return false</text>

  <!-- ===== section 2: k = 3, true ===== -->
  <rect x="35" y="246" width="450" height="164" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="55" y="270" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">k = 3（m = 2）→ true</text>

  <text x="85" y="301" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">s 块</text>
  <rect x="95" y="278" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="163" y="278" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="231" y="278" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">aa</text>
  <text x="191" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">bb</text>
  <text x="259" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">cc</text>

  <text x="85" y="349" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">t 块</text>
  <rect x="95" y="326" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="163" y="326" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="231" y="326" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">bb</text>
  <text x="191" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">aa</text>
  <text x="259" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">cc</text>

  <text x="380" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" filter="url(#rough2)">哈希表 cnt（s +1，t −1）</text>
  <text x="380" y="312" text-anchor="middle" font-size="11.5" fill="#2d5a20" filter="url(#rough2)">aa +1 −1 → 0</text>
  <text x="380" y="330" text-anchor="middle" font-size="11.5" fill="#2d5a20" filter="url(#rough2)">bb +1 −1 → 0</text>
  <text x="380" y="348" text-anchor="middle" font-size="11.5" fill="#2d5a20" filter="url(#rough2)">cc +1 −1 → 0</text>

  <text x="190" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">→ 计数全零，return true</text>

  <text x="260" y="434" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">块长一变，块边界随之移动 —— 本题胜负在「块级」，与字符级异位无关</text>
</svg>
