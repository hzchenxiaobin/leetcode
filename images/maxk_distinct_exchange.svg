<svg xmlns="http://www.w3.org/2000/svg" width="640" height="306" viewBox="0 0 640 306" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="317" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="306" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">交换论证：没选到前 m 大，必能「小换大」</text>
  <path d="M 190 36 Q 320 44 450 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="168" y="64" width="64" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="246" y="64" width="64" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="324" y="64" width="64" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="402" y="64" width="64" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <path d="M 172 60 L 172 51 L 384 51 L 384 60" stroke="#4a8e4a" stroke-width="1.6" fill="none"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="200" y="87" fill="#8a3a36">100</text>
    <text x="278" y="87" fill="#2e6e2e">93</text>
    <text x="356" y="87" fill="#2e6e2e">84</text>
    <text x="434" y="87" fill="#2b6e9e">77</text>
  </g>
  <text x="396" y="58" font-size="11.5" font-weight="bold" fill="#2e6e2e">← 前 m 大（应选）</text>
  <g font-size="11" text-anchor="middle">
    <text x="200" y="118" fill="#b85450" font-weight="bold">未选（最大）</text>
    <text x="278" y="118" fill="#2e6e2e">已选 ✓</text>
    <text x="356" y="118" fill="#2e6e2e">已选 ✓</text>
    <text x="434" y="118" fill="#2b6e9e">已选（最小）</text>
  </g>

  <g filter="url(#sk)">
    <rect x="64" y="150" width="205" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="371" y="150" width="205" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <path d="M 285 173 L 350 173" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="166" y="170" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">S = {93, 84, 77}</text>
  <text x="166" y="187" text-anchor="middle" font-size="11" fill="#2b6e9e">和 = 254</text>
  <text x="317" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">用 100 换掉 77</text>
  <text x="473" y="170" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">S' = {93, 84, 100}</text>
  <text x="473" y="187" text-anchor="middle" font-size="11" fill="#2e6e2e">和 = 277（+23）</text>

  <g filter="url(#sk)">
    <rect x="80" y="228" width="480" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="251" text-anchor="middle" font-size="13" fill="#8a3a36">只要存在更大的未选值，「小换大」就让和严格变大</text>
  <text x="320" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36">⇒ 最优解必是去重后最大的 min(k, 个数) 个</text>
</svg>
