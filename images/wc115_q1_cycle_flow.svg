<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 326"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="326" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">模拟 + 首次出现表：把 10 亿天压成几十步</text>
  <rect x="70" y="48" width="420" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">① 压缩状态、模拟一天</text>
  <text x="280" y="85" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">state = nextState(state)，day++</text>
  <path d="M 280 94 L 280 108" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="110" width="420" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">② 记录每个状态首次出现的天</text>
  <text x="280" y="147" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">firstSeen[state] = day</text>
  <path d="M 280 156 L 280 170" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="172" width="420" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">③ 遇到重复状态即找到环</text>
  <text x="280" y="209" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">period = day - firstSeen[state]</text>
  <path d="M 280 218 L 280 232" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="234" width="420" height="46" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">④ 用取模跳过整周期</text>
  <text x="280" y="271" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">rest = (n - day) % period，再模拟 rest 天</text>
  <text x="280" y="300" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">循环若因 day == n 结束，说明还没进环，直接返回</text>
</svg>
