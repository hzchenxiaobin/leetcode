  <text x="486.0" y="125.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="576" y="102" width="70" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="611.0" y="125.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="56" y="148" width="130" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="121.0" y="171.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[0,10]</text>
  <rect x="196" y="148" width="80" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="236.0" y="171.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="286" y="148" width="110" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="341.0" y="171.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="406" y="148" width="160" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486.0" y="171.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="576" y="148" width="70" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="611.0" y="171.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="56" y="194" width="130" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="121.0" y="217.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1,3,6]</text>
  <rect x="196" y="194" width="80" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="236.0" y="217.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="286" y="194" width="110" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="341.0" y="217.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="406" y="194" width="160" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486.0" y="217.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1 → 截断</text>
  <rect x="576" y="194" width="70" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="611.0" y="217.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="340" y="268" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">第三个示例：区间只有 5 宽，两倍 k 已是 6，能全调成 4 → 分数 0</text>
</svg>
