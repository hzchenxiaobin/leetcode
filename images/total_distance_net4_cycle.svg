<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：一轮 = 耗 5 升 + 补 1 升 = 主油箱净减 4 升</text>
  <path d="M 130 44 Q 320 52 510 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- cycle: consume box -->
  <g filter="url(#sk)">
    <rect x="48" y="70" width="175" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="135" y="97" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">消耗 5 升</text>
  <text x="135" y="120" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">里程 +50 km</text>

  <!-- cycle: refill box -->
  <g filter="url(#sk)">
    <rect x="48" y="180" width="175" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="135" y="207" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e24" filter="url(#sk)">副油箱补 1 升</text>
  <text x="135" y="230" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#sk)">若副油箱非空</text>

  <!-- cycle arrows -->
  <path d="M 105 138 L 105 174" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 72 178 Q 28 124 66 74" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="40" y="130" text-anchor="middle" font-size="11" fill="#888888" filter="url(#sk)">循环</text>

  <!-- ledger -->
  <g filter="url(#sk)">
    <rect x="268" y="70" width="165" height="176" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="350" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415" filter="url(#sk)">每轮净变化</text>
  <g filter="url(#sk)">
    <rect x="284" y="112" width="133" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="350" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">主油箱 −4 升</text>
  <g filter="url(#sk)">
    <rect x="284" y="154" width="133" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="350" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e24" filter="url(#sk)">副油箱 −1 升</text>
  <g filter="url(#sk)">
    <rect x="284" y="196" width="133" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="350" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">里程 +50 km</text>

  <!-- formula -->
  <g filter="url(#sk)">
    <rect x="455" y="70" width="150" height="176" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="530" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">转移次数</text>
  <text x="530" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">t = min(a, ⌊(m−1)/4⌋)</text>
  <text x="530" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">最大里程</text>
  <text x="530" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">10 × (m + t) km</text>
  <text x="530" y="226" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">m、a 为两箱初始升数</text>

  <!-- milestone ruler box -->
  <g filter="url(#sk)">
    <rect x="40" y="262" width="560" height="112" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
  </g>
  <text x="320" y="288" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">第 k 次转移 ⇔ 原始主油恰好累计消耗 4k+1 升</text>
  <text x="500" y="322" text-anchor="middle" font-size="11" fill="#888888" filter="url(#sk)">原始主油累计消耗 →</text>
  <path d="M 80 330 L 570 330" stroke="#3a3a3a" stroke-width="1.6" filter="url(#sk)"/>
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.2">
    <line x1="80" y1="324" x2="80" y2="336"/>
    <line x1="155" y1="324" x2="155" y2="336"/>
    <line x1="215" y1="324" x2="215" y2="336"/>
    <line x1="275" y1="324" x2="275" y2="336"/>
    <line x1="335" y1="324" x2="335" y2="336"/>
    <line x1="395" y1="324" x2="395" y2="336"/>
  </g>
  <g filter="url(#sk)" fill="#fce4ec" stroke="#b85450" stroke-width="1.6">
    <circle cx="155" cy="330" r="5"/>
    <circle cx="215" cy="330" r="5"/>
    <circle cx="275" cy="330" r="5"/>
    <circle cx="335" cy="330" r="5"/>
    <circle cx="395" cy="330" r="5"/>
  </g>
  <text x="160" y="314" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">①</text>
  <text x="220" y="314" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">②</text>
  <text x="280" y="314" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">③</text>
  <text x="340" y="314" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">④</text>
  <text x="400" y="314" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">⑤</text>
  <text x="80" y="352" text-anchor="middle" font-size="11" fill="#555555" filter="url(#sk)">0</text>
  <text x="155" y="352" text-anchor="middle" font-size="11" fill="#555555" filter="url(#sk)">5</text>
  <text x="215" y="352" text-anchor="middle" font-size="11" fill="#555555" filter="url(#sk)">9</text>
  <text x="275" y="352" text-anchor="middle" font-size="11" fill="#555555" filter="url(#sk)">13</text>
  <text x="335" y="352" text-anchor="middle" font-size="11" fill="#555555" filter="url(#sk)">17</text>
  <text x="395" y="352" text-anchor="middle" font-size="11" fill="#555555" filter="url(#sk)">21</text>
  <text x="425" y="335" text-anchor="middle" font-size="13" fill="#888888" filter="url(#sk)">…</text>
  <path d="M 215 300 L 215 344" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" fill="none" filter="url(#sk)"/>
  <text x="222" y="300" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">m = 9</text>
  <text x="320" y="370" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">m = 9 只能撑到 ②（9 ≤ 9），第 ③ 个里程碑需要 13 &gt; 9 → 最多转移 2 次</text>
</svg>
