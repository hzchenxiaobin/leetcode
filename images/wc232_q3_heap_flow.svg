<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：大顶堆上的 E 轮增量分配</text>

  <!-- 开始 -->
  <ellipse cx="280" cy="50" rx="44" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="55" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M280,66 L280,78" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 建堆 -->
  <rect x="105" y="80" width="350" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="99" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">对每个班 (p,t) 计算 g = (t−p) / t(t+1)</text>
  <text x="280" y="117" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(g, p, t) 全部入大顶堆</text>
  <path d="M280,126 L280,148" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="280,150 380,190 280,230 180,190" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">E 个名额</text>
  <text x="280" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">用完？</text>

  <!-- 否：向下 -->
  <text x="296" y="250" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M280,230 L280,270" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 更新框 -->
  <rect x="140" y="272" width="280" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">弹堆顶 (g, p, t)</text>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p++, t++ → 重算 g → 回推入堆</text>

  <!-- 回环 -->
  <path d="M140,302 L80,302 L80,190 L172,190" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98" y="178" font-size="10.5" fill="#b85450" filter="url(#rough2)">循环 E 次</text>

  <!-- 是：向右再向下 -->
  <text x="388" y="180" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M380,190 L455,190 L455,266" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 汇总框 -->
  <rect x="382" y="268" width="146" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="290" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">弹出所有班</text>
  <text x="455" y="310" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">sum = Σ p/t</text>
  <path d="M455,324 L455,352" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <ellipse cx="455" cy="372" rx="58" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="377" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">返回 sum / n</text>

  <!-- 底部注释 -->
  <rect x="30" y="408" width="500" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="430" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">· 不变量：每轮结束时堆顶 = 当前加一人收益最大的班</text>
  <text x="46" y="450" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">· 每轮 1 次 pop + 1 次 push = O(log n)，全程 O((n+E) log n)</text>
</svg>
