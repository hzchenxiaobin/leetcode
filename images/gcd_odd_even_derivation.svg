<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">n = 4：闭式演算 + 欧几里得验证</text>
  <path d="M 200 42 Q 340 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left: closed forms for n=4 -->
  <g filter="url(#sk)">
    <rect x="40" y="70" width="300" height="150" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="190" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">闭式计算</text>
  <text x="190" y="120" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">sumOdd  = 4² = 16</text>
  <text x="190" y="144" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">sumEven = 4×5 = 20</text>
  <text x="190" y="172" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">提出公因子 4：</text>
  <text x="190" y="196" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">gcd(16,20)=4·gcd(4,5)=4</text>

  <!-- Arrow to Euclid -->
  <g filter="url(#sk)">
    <path d="M 340 145 L 375 145" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- Right: Euclid verification -->
  <g filter="url(#sk)">
    <rect x="385" y="70" width="265" height="150" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="517" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">欧几里得算法验证</text>
  <text x="517" y="120" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">20 = 1×16 + 4</text>
  <text x="517" y="144" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">16 = 4×4 + 0</text>
  <text x="517" y="172" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">gcd(16, 20) = 4</text>
  <text x="517" y="196" text-anchor="middle" font-size="13" fill="#b03a3a" font-weight="bold" font-family="monospace">= n ✓</text>

  <!-- Bottom: another route gcd(a,b)=gcd(a,b-a) -->
  <g filter="url(#sk)">
    <rect x="40" y="250" width="610" height="120" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="345" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">另一条等价路线：gcd(a, b) = gcd(a, b − a)</text>
  <text x="345" y="302" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">gcd(n², n² + n) = gcd(n², n)</text>
  <text x="345" y="326" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">n 整除 n²，故 gcd(n², n) = n</text>
  <text x="345" y="352" text-anchor="middle" font-size="11" fill="#888">两条路殊途同归，都得到答案 = n</text>
</svg>
