<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#333" filter="url(#rough2)">示例 1：排序后按 1、2、3 人切连续块</text>
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="#888"
        filter="url(#rough2)">grades = [10,6,12,7,3,5]  →  排序  →  [3, 5, 6, 7, 10, 12]</text>

  <rect x="112" y="72" width="46" height="44" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="164" y="72" width="46" height="44" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="216" y="72" width="46" height="44" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="268" y="72" width="46" height="44" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="320" y="72" width="46" height="44" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="372" y="72" width="46" height="44" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="135" y="100" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">3</text>
  <text x="187" y="100" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">5</text>
  <text x="239" y="100" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">6</text>
  <text x="291" y="100" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">7</text>
  <text x="343" y="100" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">10</text>
  <text x="395" y="100" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">12</text>

  <path d="M 118 126 Q 135 142 152 126" stroke="#446688" stroke-width="2"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 170 126 Q 213 144 256 126" stroke="#4a7a3a" stroke-width="2"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 274 126 Q 343 144 412 126" stroke="#d6a040" stroke-width="2"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>

  <text x="135" y="154" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#446688" filter="url(#rough2)">第 1 组</text>
  <text x="213" y="154" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">第 2 组</text>
  <text x="343" y="154" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#a07820" filter="url(#rough2)">第 3 组</text>

  <text x="92" y="182" text-anchor="middle" font-size="12" fill="#888"
        filter="url(#rough2)">人数</text>
  <text x="135" y="182" text-anchor="middle" font-size="14" fill="#333"
        filter="url(#rough2)">1</text>
  <text x="174" y="182" text-anchor="middle" font-size="14" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">&lt;</text>
  <text x="213" y="182" text-anchor="middle" font-size="14" fill="#333"
        filter="url(#rough2)">2</text>
  <text x="278" y="182" text-anchor="middle" font-size="14" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">&lt;</text>
  <text x="343" y="182" text-anchor="middle" font-size="14" fill="#333"
        filter="url(#rough2)">3</text>

  <text x="92" y="206" text-anchor="middle" font-size="12" fill="#888"
        filter="url(#rough2)">总和</text>
  <text x="135" y="206" text-anchor="middle" font-size="14" fill="#333"
        filter="url(#rough2)">3</text>
  <text x="174" y="206" text-anchor="middle" font-size="14" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">&lt;</text>
  <text x="213" y="206" text-anchor="middle" font-size="14" fill="#333"
        filter="url(#rough2)">11</text>
  <text x="278" y="206" text-anchor="middle" font-size="14" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">&lt;</text>
  <text x="343" y="206" text-anchor="middle" font-size="14" fill="#333"
        filter="url(#rough2)">29</text>

  <rect x="112" y="222" width="306" height="42" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="238" text-anchor="middle" font-size="13" fill="#4a7a3a"
        filter="url(#rough2)">人数与总和都严格递增 ✓</text>
  <text x="265" y="257" text-anchor="middle" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">关键：后一组的最小值 ≥ 前一组的最大值，且成绩全为正</text>

  <rect x="112" y="280" width="306" height="52" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="298" text-anchor="middle" font-size="11" fill="#a07820"
        filter="url(#rough2)">n 不够凑第 k+1 组时（如 n = 7：1+2+3 = 6 ≤ 7 &lt; 10）</text>
  <text x="265" y="316" text-anchor="middle" font-size="11" fill="#a07820"
        filter="url(#rough2)">剩余学生全部并入第 k 组：人数 1、2、4，仍严格递增</text>

  <text x="260" y="352" text-anchor="middle" font-size="12" fill="#888"
        filter="url(#rough2)">n = 6：1+2+3 = 6 ≤ 6 &lt; 10 = 1+2+3+4 ⇒ 答案 3</text>
</svg>
