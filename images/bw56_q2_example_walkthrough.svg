<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：从 (1,2) 一步到出口 (0,2)</text>

  <!-- 迷宫格子放大 -->
  <g filter="url(#rough2)">
    <rect x="130" y="80" width="60" height="60" fill="#bbb" stroke="#888" stroke-width="1.5" rx="4"/>
    <rect x="196" y="80" width="60" height="60" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <rect x="262" y="80" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <rect x="328" y="80" width="60" height="60" fill="#bbb" stroke="#888" stroke-width="1.5" rx="4"/>

    <rect x="130" y="146" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <rect x="196" y="146" width="60" height="60" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="4"/>
    <rect x="262" y="146" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="2.6" rx="4"/>
    <rect x="328" y="146" width="60" height="60" fill="#bbb" stroke="#888" stroke-width="1.5" rx="4"/>

    <rect x="130" y="212" width="60" height="60" fill="#bbb" stroke="#888" stroke-width="1.5" rx="4"/>
    <rect x="196" y="212" width="60" height="60" fill="#bbb" stroke="#888" stroke-width="1.5" rx="4"/>
    <rect x="262" y="212" width="60" height="60" fill="#bbb" stroke="#888" stroke-width="1.5" rx="4"/>
    <rect x="328" y="212" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#666" filter="url(#rough2)">
    <text x="160" y="76">(0,0)</text><text x="226" y="76">(0,1)</text><text x="292" y="76">(0,2)</text><text x="358" y="76">(0,3)</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#666" filter="url(#rough2)">
    <text x="112" y="182" transform="rotate(-90 112 182)">行 1</text>
    <text x="112" y="248" transform="rotate(-90 112 248)">行 2</text>
  </g>
  <g font-size="11.5" fill="#888" filter="url(#rough2)">
    <text x="160" y="104">墙</text><text x="226" y="104">空</text>
    <text x="292" y="104">出口</text><text x="358" y="104">墙</text>
    <text x="160" y="170">出口</text><text x="226" y="170">空</text>
    <text x="292" y="170">入口</text><text x="358" y="170">墙</text>
    <text x="358" y="236">出口</text>
  </g>

  <!-- 一步箭头 -->
  <path d="M 292 142 L 292 116" stroke="#4a7a3a" stroke-width="2.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="316" y="132" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">1 步 → 返回 1</text>

  <!-- 不可达出口 -->
  <path d="M 328 250 C 380 260 420 270 448 278" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="400" y="292" width="150" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
  </g>
  <text x="475" y="314" text-anchor="middle" font-size="11.5" fill="#a0392f" font-weight="bold" filter="url(#rough2)">出口 (2,3) 被墙围死，</text>
  <text x="475" y="332" text-anchor="middle" font-size="11.5" fill="#a0392f" filter="url(#rough2)">不可达也无需关心</text>

  <!-- 左下：对比另一个出口 -->
  <g filter="url(#rough2)">
    <rect x="40" y="292" width="330" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
  </g>
  <text x="205" y="312" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">另一出口 (1,0) 距离 2（左两步）；</text>
  <text x="205" y="330" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">BFS 第 1 层先撞到 (0,2)，自然取更近者。</text>

  <g filter="url(#rough2)">
    <rect x="40" y="356" width="510" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8"/>
  </g>
  <text x="295" y="378" text-anchor="middle" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">把 (0,2) 堵上再跑：BFS 会从 (1,1) 触达 (1,0)，返回 2 —— 对拍覆盖这种变体。</text>
</svg>
