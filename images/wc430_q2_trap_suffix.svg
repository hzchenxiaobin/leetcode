<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="127" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">陷阱：满长窗口不一定是答案 —— 短后缀反杀</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#555">word = “abz”，k = 2，n = 3，L = 2</text>

  <!-- 左列：满长候选 -->
  <text x="160" y="92" text-anchor="middle" font-size="11" fill="#666">只看长度恰为 L 的窗口（i ≤ n−L）</text>
  <g filter="url(#sk)">
    <rect x="40" y="102" width="24" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="66" y="102" width="24" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="92" y="102" width="24" height="24" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="40" y="134" width="24" height="24" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="66" y="134" width="24" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="92" y="134" width="24" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <g font-size="13" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="52" y="119" fill="#2b6e9e">a</text>
    <text x="78" y="119" fill="#2b6e9e">b</text>
    <text x="104" y="119" fill="#777">z</text>
    <text x="52" y="151" fill="#777">a</text>
    <text x="78" y="151" fill="#2b6e9e">b</text>
    <text x="104" y="151" fill="#2b6e9e">z</text>
  </g>
  <text x="140" y="118" font-size="13" font-family="monospace" fill="#555">“ab”</text>
  <text x="140" y="150" font-size="13" font-family="monospace" fill="#555">“bz”</text>
  <text x="160" y="180" text-anchor="middle" font-size="11" fill="#555">两者取 max = “bz”</text>
  <text x="160" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">✗ 不是答案</text>

  <!-- 右列：截断候选 -->
  <text x="475" y="92" text-anchor="middle" font-size="11" fill="#666">尾部截断候选（i &gt; n−L，短后缀）</text>
  <g filter="url(#sk)">
    <rect x="350" y="118" width="24" height="24" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="376" y="118" width="24" height="24" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="402" y="118" width="24" height="24" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <g font-size="13" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="362" y="135" fill="#777">a</text>
    <text x="388" y="135" fill="#777">b</text>
    <text x="414" y="135" fill="#7a5415">z</text>
  </g>
  <text x="450" y="136" font-size="14" font-family="monospace" font-weight="bold" fill="#2e6e2e">“z”</text>
  <text x="478" y="136" font-size="10" fill="#999">（长度 1）</text>
  <text x="475" y="170" text-anchor="middle" font-size="11" fill="#7a5415">窗口延伸到串尾被截断，只剩 1 个字符</text>
  <text x="475" y="188" text-anchor="middle" font-size="11" fill="#7a5415">但首字符 z 是全局最大的字符</text>

  <!-- 比较面板 -->
  <g filter="url(#sk)">
    <rect x="70" y="212" width="500" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <ellipse cx="350" cy="254" rx="14" ry="18" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3"/>
  </g>
  <text x="320" y="230" text-anchor="middle" font-size="11" fill="#9c3a34">逐字符比较：“bz” vs “z”</text>
  <g font-family="monospace" text-anchor="middle">
    <text x="185" y="266" font-size="24" fill="#666">b</text>
    <text x="225" y="266" font-size="24" fill="#666">z</text>
    <text x="285" y="260" font-size="13" fill="#888">vs</text>
    <text x="350" y="266" font-size="24" font-weight="bold" fill="#2e6e2e">z</text>
  </g>
  <text x="415" y="252" font-size="12" fill="#9c3a34">首位 b &lt; z</text>
  <text x="415" y="268" font-size="12" fill="#9c3a34">→ “z” &gt; “bz”</text>

  <text x="320" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">合法分割 “ab” | “z”：“z” 就在盒子里，答案就是它</text>

  <!-- 底部教训条 -->
  <g filter="url(#sk)">
    <rect x="60" y="316" width="520" height="34" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="320" y="337" text-anchor="middle" font-size="11" fill="#b85450">教训：所有起点都要枚举（含截断出的短候选），整体取 max —— 随机用例约 19% 踩中此坑</text>
</svg>
