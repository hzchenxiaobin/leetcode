<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">并集面积 = 每一高度层“被覆盖的 x 总长度”的积分</text>
  <text x="320" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">重叠只算一次：同一层上取并集区间，而不是把各正方形长度相加</text>

  <line x1="70" y1="330" x2="330" y2="330" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="70" y1="330" x2="70" y2="80" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="336" y="334" font-size="9.5" fill="#999" filter="url(#rough2)">x</text>
  <text x="56" y="76" font-size="9.5" fill="#999" filter="url(#rough2)">y</text>

  <g filter="url(#rough2)">
    <rect x="100" y="150" width="150" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
    <rect x="190" y="190" width="100" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
    <rect x="230" y="240" width="80" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  </g>
  <text x="115" y="170" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">A</text>
  <text x="196" y="208" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">B</text>
  <text x="236" y="258" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">C</text>

  <line x1="60" y1="270" x2="340" y2="270" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="150" y="250" font-size="9.5" fill="#b85450" filter="url(#rough2)">在 t 处切一刀</text>
  <path d="M 100 285 L 310 285" stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <text x="196" y="302" font-size="9.5" fill="#b85450" filter="url(#rough2)">该层并集 = [100, 310]，L = 210</text>

  <text x="360" y="86" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">事件（只可能发生在这 2n 个高度）</text>
  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="360" y="108" filter="url(#rough2)">y = A 的底边 → 把 A 的 x 区间加入覆盖</text>
    <text x="360" y="128" filter="url(#rough2)">y = A 的顶边 → 把 A 的 x 区间移出覆盖</text>
    <text x="360" y="148" filter="url(#rough2)">两层事件之间 L(t) 恒定 → 该层面积 = L × 层高</text>
  </g>

  <rect x="360" y="164" width="260" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="374" y="184" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">A(y) = ∫₀^y L(t) dt（并集面积）</text>
  <text x="374" y="204" font-size="10" fill="#555" filter="url(#rough2)">L(t) 分段常值 ⇒ A(y) 分段线性、连续、单调不减</text>
  <text x="374" y="222" font-size="10" fill="#555" filter="url(#rough2)">目标：最小的 y 使 A(y) ≥ 总面积 / 2</text>

  <rect x="360" y="248" width="260" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="374" y="268" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">答案怎么求：扫一遍层，边扫边累加</text>
  <text x="374" y="288" font-size="10" fill="#555" filter="url(#rough2)">累加到某层时若跨过一半，就在该层内解</text>
  <text x="374" y="306" font-size="10" fill="#555" filter="url(#rough2)">y = 层底 + (剩余面积) / L，整数运算即可精确</text>

  <rect x="70" y="348" width="250" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="84" y="366" font-size="10" fill="#8a3a36" filter="url(#rough2)">与 Q2 的区别：重叠部分只算一次，</text>
  <text x="84" y="382" font-size="10" fill="#8a3a36" filter="url(#rough2)">所以不能把 l² 直接相加，必须维护并集。</text>

  <text x="404" y="368" font-size="10" fill="#888" filter="url(#rough2)">L(t) 用线段树维护：</text>
  <text x="404" y="384" font-size="10" fill="#888" filter="url(#rough2)">区间加 + 查询覆盖长度，O(log n) / 次</text>
</svg>
