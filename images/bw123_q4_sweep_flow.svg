<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="43"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">把「查矩形是否为空」换成「维护最大 y」</text>

  <rect x="120" y="40" width="320" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">按 x 升序、x 相同则 y 降序排序</text>
  <path d="M 280 74 L 280 90" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="92" width="280" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="113" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">for i = 0 … n−1：mx ← −∞</text>
  <path d="M 280 124 L 280 140" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="142" width="280" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="163" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">for j = i+1 … n−1（x 单调不减）</text>
  <path d="M 280 174 L 280 190" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,192 428,220 280,248 132,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="217" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">y_j ≤ y_i 且 y_j &gt; mx ?</text>
  <text x="280" y="234" text-anchor="middle" font-size="9.8" fill="#a08a50" filter="url(#rough2)">（y_j &gt; y_i 的点在矩形上方，直接忽略）</text>

  <path d="M 428 220 L 452 220" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="439" y="212" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="454" y="196" width="92" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="216" text-anchor="middle" font-size="9.8" fill="#2f5226" filter="url(#rough2)">++ans</text>
  <text x="500" y="232" text-anchor="middle" font-size="9.8" fill="#2f5226" filter="url(#rough2)">mx ← y_j</text>

  <path d="M 132 220 L 100 220" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="212" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="24" y="202" width="74" height="36" rx="6" fill="#f2f2f2" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="61" y="225" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">跳过</text>

  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">关键：mx 是「已扫描点里 y ≤ y_i 的最大 y」，随 j 单调不减</text>
  <text x="280" y="300" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">于是每个 B 只需 O(1) 判断，内层复杂度从 O(n) 降到 O(1)</text>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">总时间 O(n²)，n = 1000 时约 5×10⁵ 次内层判断</text>
  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">排序的 y 降序让「同一列」的点从上往下被扫到：上面的人先当 A，下面的人后当 B</text>
  <text x="280" y="370" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">若同列按 y 升序，A 会先遇到下方的点，竖直线段这一支就漏掉了</text>
</svg>
