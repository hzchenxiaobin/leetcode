<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="372" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">公式落地：repunit、快速幂与模逆元</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">k 最大 10^9，只能对指数做 log 级快速幂</text>
  <rect x="36" y="62" width="488" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="82" text-anchor="start" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 每位权重和 = 全 1 的数（repunit）</text>
  <text x="48" y="101" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">1 + 10 + 10^2 + … + 10^(k−1) = (10^k − 1) / 9</text>
  <rect x="36" y="126" width="488" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="146" text-anchor="start" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 总和</text>
  <text x="48" y="165" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">ans = Σd · C^(k−1) · repunit，其中 Σd = (l + r)·C/2，C = r − l + 1</text>
  <rect x="36" y="190" width="488" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="210" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ 模 10^9+7 下的除法</text>
  <text x="48" y="229" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">9 的逆元 = 9^(MOD−2) mod MOD（费马小定理），用快速幂求；C 的逆元不需要</text>
  <rect x="36" y="254" width="488" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="274" text-anchor="start" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">④ 两个易错点</text>
  <text x="48" y="291" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">k = 1 时 C^(k−1) = 1，(10^k−1)/9 = 1：公式天然成立，不必特判</text>
  <text x="48" y="308" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">先取模再相乘，全程 long long，避免 10^9 量级的指数爆掉</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">三例校验：66 / 444 / 555555520 ✓</text>
</svg>
