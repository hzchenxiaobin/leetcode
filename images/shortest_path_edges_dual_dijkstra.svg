<svg xmlns="http://www.w3.org/2000/svg" width="940" height="730" viewBox="0 0 940 730" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="730" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：双向 Dijkstra + 三段拼接判定</text>
  <path d="M 300 44 Q 470 52 640 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: path cut into three segments ===== -->
  <text x="470" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 经过边 e 的路径，被 e 切成三段</text>

  <!-- path nodes -->
  <g filter="url(#sk)"><ellipse cx="105" cy="160" rx="24" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="105" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">0</text>
  <text x="105" y="204" text-anchor="middle" font-size="10" fill="#888">起点</text>

  <g filter="url(#sk)"><circle cx="200" cy="160" r="6" fill="#c9c4b8" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><circle cx="255" cy="160" r="6" fill="#c9c4b8" stroke="#999" stroke-width="1"/></g>

  <g filter="url(#sk)"><ellipse cx="350" cy="160" rx="24" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="350" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">a</text>

  <g filter="url(#sk)"><ellipse cx="520" cy="160" rx="24" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="520" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">b</text>

  <g filter="url(#sk)"><circle cx="615" cy="160" r="6" fill="#c9c4b8" stroke="#999" stroke-width="1"/></g>
  <g filter="url(#sk)"><circle cx="670" cy="160" r="6" fill="#c9c4b8" stroke="#999" stroke-width="1"/></g>

  <g filter="url(#sk)"><ellipse cx="765" cy="160" rx="26" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="765" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">n−1</text>
  <text x="765" y="204" text-anchor="middle" font-size="10" fill="#888">终点</text>

  <!-- path segments -->
  <g stroke="#8aa4bd" stroke-width="2" fill="none">
    <path d="M 129 158 Q 165 150 196 158" filter="url(#sk)"/>
    <path d="M 206 162 Q 230 170 251 162" filter="url(#sk)"/>
    <path d="M 261 158 Q 305 150 326 158" filter="url(#sk)"/>
    <path d="M 544 158 Q 580 150 611 158" filter="url(#sk)"/>
    <path d="M 621 162 Q 645 170 666 162" filter="url(#sk)"/>
    <path d="M 676 158 Q 720 150 741 158" filter="url(#sk)"/>
  </g>

  <!-- the edge e, thick red -->
  <g filter="url(#sk)"><path d="M 374 160 L 496 160" stroke="#b85450" stroke-width="3.5" fill="none"/></g>
  <text x="435" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">w</text>
  <text x="435" y="188" text-anchor="middle" font-size="10" fill="#b03a3a">边 e = (a, b, w)</text>

  <!-- three segment braces -->
  <g stroke="#446688" stroke-width="1.6" fill="none">
    <path d="M 105 230 L 105 244 L 227 244 L 227 230" filter="url(#sk)"/>
  </g>
  <text x="166" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e">前段：0 → a</text>
  <text x="166" y="278" text-anchor="middle" font-size="10" fill="#666">长 ≥ d₀[a]</text>

  <g stroke="#b85450" stroke-width="1.6" fill="none">
    <path d="M 350 230 L 350 244 L 520 244 L 520 230" filter="url(#sk)"/>
  </g>
  <text x="435" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">边 e</text>
  <text x="435" y="278" text-anchor="middle" font-size="10" fill="#666">长 = w</text>

  <g stroke="#4a7a3a" stroke-width="1.6" fill="none">
    <path d="M 520 230 L 520 244 L 765 244 L 765 230" filter="url(#sk)"/>
  </g>
  <text x="642" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e2e">后段：b → n−1</text>
  <text x="642" y="278" text-anchor="middle" font-size="10" fill="#666">长 ≥ d₁[b]</text>

  <g filter="url(#sk)"><rect x="210" y="296" width="520" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="470" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">路径总长 ≥ d₀[a] + w + d₁[b]</text>

  <!-- ===== Panel 2: splice three shortest pieces ===== -->
  <text x="470" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">② 反过来：三段各自取最短，拼成一条 0 → n−1 的通道</text>

  <g filter="url(#sk)"><rect x="70" y="392" width="240" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="190" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">0 ⇒ a</text>
  <text x="190" y="440" text-anchor="middle" font-size="11" fill="#444">取最短路，长 = d₀[a]</text>
  <text x="190" y="457" text-anchor="middle" font-size="10" fill="#888">（一遍 Dijkstra 预处理）</text>

  <g filter="url(#sk)"><rect x="350" y="392" width="240" height="76" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="470" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">a → b 走边 e</text>
  <text x="470" y="440" text-anchor="middle" font-size="11" fill="#444">长 = w</text>
  <text x="470" y="457" text-anchor="middle" font-size="10" fill="#888">（被检验的那条边）</text>

  <g filter="url(#sk)"><rect x="630" y="392" width="240" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="750" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">b ⇒ n−1</text>
  <text x="750" y="440" text-anchor="middle" font-size="11" fill="#444">取最短路，长 = d₁[b]</text>
  <text x="750" y="457" text-anchor="middle" font-size="10" fill="#888">（另一遍 Dijkstra）</text>

  <g stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 312 430 L 344 430" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 592 430 L 624 430" marker-end="url(#ar)" filter="url(#sk)"/>
  </g>

  <g filter="url(#sk)"><rect x="150" y="488" width="640" height="34" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="470" y="510" text-anchor="middle" font-size="12" fill="#444">拼接通道总长 = d₀[a] + w + d₁[b]，而任何通道长都 ≥ D（最短距）⟹ 拼接和 ≥ D</text>

  <!-- ===== Panel 3: equality means real shortest path ===== -->
  <text x="470" y="556" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">③ 拼接和只有两种命运：严格大于 D，或恰好等于 D</text>

  <g filter="url(#sk)"><rect x="70" y="576" width="390" height="88" rx="10" fill="#f4f0e6" stroke="#9e9e9e" stroke-width="1.4"/></g>
  <text x="265" y="602" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">和 &gt; D：三段拼不出最短路</text>
  <text x="265" y="624" text-anchor="middle" font-size="11" fill="#444">由①，任何经过 e（a→b 方向）的路径长</text>
  <text x="265" y="642" text-anchor="middle" font-size="11" fill="#444">都 ≥ 这个和 &gt; D，e 上不了最短路</text>

  <g filter="url(#sk)"><rect x="480" y="576" width="390" height="88" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="675" y="602" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">和 = D：通道货真价实是最短路</text>
  <text x="675" y="624" text-anchor="middle" font-size="11" fill="#444">边权全为正 ⟹ 等长通道若有环，删环后</text>
  <text x="675" y="642" text-anchor="middle" font-size="11" fill="#444">更短，与 D 最小矛盾 ⟹ 无环，是真路径</text>

  <g filter="url(#sk)"><rect x="130" y="672" width="680" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="470" y="690" text-anchor="middle" font-size="11" fill="#666">判定公式（无向边正、反两个方向各判一次）</text>
  <text x="470" y="706" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">answer[i] = ( d₀[a]+w+d₁[b] = D ) ∨ ( d₀[b]+w+d₁[a] = D )</text>
</svg>
