<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：n ≤ 8 ⇒ 集合即状态，子集即转移</text>
  <path d="M 140 36 Q 320 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 贪心反例警示条 -->
  <g filter="url(#sk)"><rect x="18" y="46" width="604" height="96" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="320" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04a48">⚠ 先判死刑：贪心「每次给当前最轻的孩子」不可行（makespan 调度的 LPT 规则）</text>
  <text x="320" y="86" text-anchor="middle" font-size="11.5" fill="#a04a48">反例 cookies = [8, 7, 6, 5, 4]，k = 2：</text>
  <g filter="url(#sk)"><rect x="34" y="96" width="280" height="36" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="174" y="118" text-anchor="middle" font-size="11.5" fill="#a04a48">贪心：A = 8+5+4 = 17，B = 7+6 = 13 → 17</text>
  <g filter="url(#sk)"><rect x="326" y="96" width="280" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="466" y="118" text-anchor="middle" font-size="11.5" fill="#2e5e2e">最优：[8,7] = 15，[6,5,4] = 15 → 15</text>

  <!-- 状态框 -->
  <g filter="url(#sk)"><rect x="190" y="158" width="260" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="176" text-anchor="middle" font-size="12" fill="#33455e">状态 s：已分出去的零食包集合（bitmask）</text>

  <!-- 包格子 -->
  <g filter="url(#sk)"><rect x="190" y="196" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="242" y="196" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="294" y="196" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="346" y="196" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <g filter="url(#sk)"><rect x="398" y="196" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="216" y="215" text-anchor="middle" font-size="12" fill="#33455e">8</text>
  <text x="268" y="215" text-anchor="middle" font-size="12" fill="#33455e">15</text>
  <text x="320" y="215" text-anchor="middle" font-size="12" fill="#33455e">10</text>
  <text x="372" y="215" text-anchor="middle" font-size="12" fill="#33455e">20</text>
  <text x="424" y="215" text-anchor="middle" font-size="12" fill="#33455e">8</text>
  <text x="216" y="242" text-anchor="middle" font-size="10.5" fill="#666">b0</text>
  <text x="268" y="242" text-anchor="middle" font-size="10.5" fill="#666">b1</text>
  <text x="320" y="242" text-anchor="middle" font-size="10.5" fill="#666">b2</text>
  <text x="372" y="242" text-anchor="middle" font-size="10.5" fill="#666">b3</text>
  <text x="424" y="242" text-anchor="middle" font-size="10.5" fill="#666">b4</text>

  <!-- 右侧注 1 -->
  <g filter="url(#sk)"><rect x="466" y="196" width="150" height="66" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="541" y="215" text-anchor="middle" font-size="10.5" fill="#2e5e2e">n ≤ 8：</text>
  <text x="541" y="231" text-anchor="middle" font-size="10.5" fill="#2e5e2e">集合 2^8 = 256 个</text>
  <text x="541" y="247" text-anchor="middle" font-size="10.5" fill="#2e5e2e">子集对 3^8 = 6561</text>

  <!-- 分叉箭头 -->
  <path d="M 250 246 Q 210 258 180 260" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 390 246 Q 430 258 462 260" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 两个孩子的框 -->
  <g filter="url(#sk)"><rect x="40" y="262" width="270" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="175" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33455e">前 i−1 个孩子：拿 s∖t</text>
  <text x="175" y="304" text-anchor="middle" font-size="11.5" fill="#33455e">查上一层：f[i−1][s∖t]</text>
  <g filter="url(#sk)"><rect x="330" y="262" width="270" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="465" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">第 i 个孩子：拿子集 t ⊆ s</text>
  <text x="465" y="304" text-anchor="middle" font-size="11.5" fill="#7a5415">查预处理表：sum[t]</text>

  <!-- 汇聚到 max -->
  <path d="M 175 320 Q 215 334 250 338" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 465 320 Q 425 334 390 338" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="170" y="340" width="300" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="360" text-anchor="middle" font-size="12" fill="#33455e" font-family="monospace">max( f[i−1][s∖t], sum[t] )</text>

  <!-- min -->
  <path d="M 320 372 L 320 383" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="170" y="386" width="300" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="320" y="406" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">对全部子集 t ⊆ s 取 min ⇒ f[i][s]</text>

  <!-- 右侧注 2 -->
  <g filter="url(#sk)"><rect x="486" y="332" width="134" height="86" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="553" y="352" text-anchor="middle" font-size="10.5" fill="#7a5415">每包三态：</text>
  <text x="553" y="368" text-anchor="middle" font-size="10.5" fill="#7a5415">∈ t / ∈ s∖t / ∉ s</text>
  <text x="553" y="384" text-anchor="middle" font-size="10.5" fill="#7a5415">两两独立组合</text>
  <text x="553" y="400" text-anchor="middle" font-size="10.5" fill="#7a5415">⇒ 每层恰 3^n 次</text>
</svg>
