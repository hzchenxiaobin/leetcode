<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="600" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：操作按区间分组 —— 不同区间两两不相交，同区间串成一条链</text>
  <path d="M 150 44 Q 470 52 790 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== interval labels ===== -->
  <text x="240" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">区间 A [1,3]：bcd 变 cde，花 1</text>
  <text x="680" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">区间 B [5,7]：fgh 变 ghh，花 8</text>

  <!-- ===== source row ===== -->
  <text x="58" y="116" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">source</text>
  <g filter="url(#sk)"><rect x="140" y="92" width="40" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="160" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">a</text>
  <g filter="url(#sk)"><rect x="186" y="92" width="40" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="206" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">b</text>
  <g filter="url(#sk)"><rect x="232" y="92" width="40" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="252" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">c</text>
  <g filter="url(#sk)"><rect x="278" y="92" width="40" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="298" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">d</text>
  <g filter="url(#sk)"><rect x="324" y="92" width="40" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="344" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">e</text>
  <g filter="url(#sk)"><rect x="370" y="92" width="40" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="390" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#sk)">f</text>
  <g filter="url(#sk)"><rect x="416" y="92" width="40" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="436" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#sk)">g</text>
  <g filter="url(#sk)"><rect x="462" y="92" width="40" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="482" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#sk)">h</text>

  <!-- ===== target row ===== -->
  <text x="58" y="226" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">target</text>
  <g filter="url(#sk)"><rect x="140" y="202" width="40" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="160" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">a</text>
  <g filter="url(#sk)"><rect x="186" y="202" width="40" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="206" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">c</text>
  <g filter="url(#sk)"><rect x="232" y="202" width="40" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="252" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">d</text>
  <g filter="url(#sk)"><rect x="278" y="202" width="40" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="298" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">e</text>
  <g filter="url(#sk)"><rect x="324" y="202" width="40" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="344" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">e</text>
  <g filter="url(#sk)"><rect x="370" y="202" width="40" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="390" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#sk)">g</text>
  <g filter="url(#sk)"><rect x="416" y="202" width="40" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="436" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#sk)">h</text>
  <g filter="url(#sk)"><rect x="462" y="202" width="40" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="482" y="228" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#sk)">h</text>

  <!-- ===== arrows between rows ===== -->
  <path d="M 252 136 L 252 196" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 436 136 L 436 196" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== legend ===== -->
  <text x="140" y="266" font-size="11" fill="#444" filter="url(#sk)">■ 蓝色：不动位（source[i] == target[i]，成本 0）　■ 绿 / 橙：被区间 A / B 整体覆盖</text>

  <!-- ===== chain view ===== -->
  <g filter="url(#sk)"><rect x="40" y="292" width="430" height="150" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="255" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">时间视角：区间 B 上先后两次操作（下标都是 [5,7]）</text>
  <g filter="url(#sk)"><ellipse cx="120" cy="372" rx="44" ry="26" fill="#fdfcf7" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="120" y="377" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">fgh</text>
  <path d="M 168 372 L 208 372" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="188" y="358" text-anchor="middle" font-size="11" fill="#b03a3a" filter="url(#sk)">操作1 花3</text>
  <g filter="url(#sk)"><ellipse cx="255" cy="372" rx="44" ry="26" fill="#fdfcf7" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="255" y="377" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">thh</text>
  <path d="M 303 372 L 343 372" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="323" y="358" text-anchor="middle" font-size="11" fill="#b03a3a" filter="url(#sk)">操作2 花5</text>
  <g filter="url(#sk)"><ellipse cx="390" cy="372" rx="44" ry="26" fill="#fdfcf7" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="390" y="377" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">ghh</text>
  <text x="255" y="428" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">同一区间可反复操作 → 链上每一步都是一条规则</text>

  <!-- ===== graph view ===== -->
  <g filter="url(#sk)"><rect x="490" y="292" width="410" height="150" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="695" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">值视角：链 = 字符串图 G 上的一条路径</text>
  <g filter="url(#sk)"><ellipse cx="560" cy="382" rx="44" ry="26" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="560" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">fgh</text>
  <g filter="url(#sk)"><ellipse cx="700" cy="352" rx="44" ry="26" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="700" y="357" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">thh</text>
  <g filter="url(#sk)"><ellipse cx="840" cy="382" rx="44" ry="26" fill="#fdfcf7" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="840" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ghh</text>
  <path d="M 602 370 L 660 360" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="628" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">3</text>
  <path d="M 740 362 L 800 372" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="770" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">5</text>
  <text x="695" y="428" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">区间成本 = 从 source[a..b] 到 target[a..b] 的最短路</text>

  <!-- ===== bottom notes ===== -->
  <g filter="url(#sk)"><rect x="56" y="462" width="828" height="120" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="76" y="486" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">结构定理：任意合法操作序列 ⇔ 一组两两不相交的区间，每个区间上串成一条替换链</text>
  <text x="76" y="510" font-size="11" fill="#444" filter="url(#sk)">· 「不相交 或 完全相同」是对任意两次操作的约束 → 按区间分组：组间两两不相交，组内是时间上依次进行的链</text>
  <text x="76" y="532" font-size="11" fill="#444" filter="url(#sk)">· 规则保证 original[i] 与 changed[i] 等长 → 链上每个串等长、总长度与下标全程稳定</text>
  <text x="76" y="554" font-size="11" fill="#444" filter="url(#sk)">· 于是区间 [a,b] 的最小成本 = 图 G 上 dist(source[a..b], target[a..b])，且链的两端都必须是 G 中节点</text>
  <text x="76" y="576" font-size="11" fill="#444" filter="url(#sk)">· 不动位满足 source[i] == target[i]；其余位必须被某个区间整体覆盖 —— 剩下的问题只是「区间怎么切」，交给 DP</text>
</svg>
