<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2：n=3，边 1→2、2→0</text>

  <!-- 树：0(根) - 2 - 1，两条边都指向上方 -->
  <ellipse cx="260" cy="76" rx="28" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <ellipse cx="260" cy="170" rx="28" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <ellipse cx="260" cy="264" rx="28" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="270" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 262 94 L 262 146" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="296" y="118" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">原边 2→0：+1</text>
  <path d="M 262 188 L 262 240" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="296" y="214" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">原边 1→2：+1</text>

  <!-- 右侧答案推导 -->
  <rect x="392" y="60" width="112" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans[0] = 2</text>
  <rect x="392" y="154" width="112" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans[2] = 2−1</text>
  <rect x="392" y="248" width="112" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans[1] = 1−1</text>
  <path d="M 392 75 L 292 76" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 392 169 C 360 169, 330 172, 292 172" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 392 263 C 350 263, 310 266, 292 266" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 底部结论 -->
  <rect x="36" y="292" width="448" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">answer = [2, 0, 1]，两条 DFS 全程 O(n)</text>
</svg>
