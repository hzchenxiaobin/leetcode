<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="900" height="730" fill="#fafafa"/>

  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：[12, 9, 6, 7] → [2, 3, 6, 7]，共 2 次操作</text>
  <path d="M 235 42 Q 450 50 665 42" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- ===== 演算表 ===== -->
  <g filter="url(#rough2)">
    <rect x="80" y="58" width="740" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="115" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">i</text>
    <text x="205" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">x = nums[i]</text>
    <text x="390" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">判断</text>
    <text x="600" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">动作</text>
    <text x="750" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">bound / ops</text>

    <line x1="80" y1="92" x2="820" y2="92" stroke="#bbb" stroke-width="1"/>
    <line x1="80" y1="142" x2="820" y2="142" stroke="#ddd" stroke-width="1"/>
    <line x1="80" y1="192" x2="820" y2="192" stroke="#ddd" stroke-width="1"/>
    <line x1="80" y1="242" x2="820" y2="242" stroke="#ddd" stroke-width="1"/>
    <rect x="80" y="58" width="740" height="234" fill="none" stroke="#446688" stroke-width="1.5"/>
    <line x1="150" y1="58" x2="150" y2="292" stroke="#ccd" stroke-width="1"/>
    <line x1="260" y1="58" x2="260" y2="292" stroke="#ccd" stroke-width="1"/>
    <line x1="520" y1="58" x2="520" y2="292" stroke="#ccd" stroke-width="1"/>
    <line x1="680" y1="58" x2="680" y2="292" stroke="#ccd" stroke-width="1"/>

    <text x="115" y="121" text-anchor="middle" font-size="12.5" fill="#333">3</text>
    <text x="205" y="121" text-anchor="middle" font-size="12.5" fill="#333">7</text>
    <text x="268" y="121" font-size="11.5" fill="#333">7 ≤ +∞ ✓</text>
    <text x="600" y="121" text-anchor="middle" font-size="11.5" fill="#3a6e3a">保留原值</text>
    <text x="750" y="121" text-anchor="middle" font-size="11.5" fill="#555">bound=7, ops=0</text>

    <text x="115" y="171" text-anchor="middle" font-size="12.5" fill="#333">2</text>
    <text x="205" y="171" text-anchor="middle" font-size="12.5" fill="#333">6</text>
    <text x="268" y="171" font-size="11.5" fill="#333">6 ≤ 7 ✓</text>
    <text x="600" y="171" text-anchor="middle" font-size="11.5" fill="#3a6e3a">保留原值</text>
    <text x="750" y="171" text-anchor="middle" font-size="11.5" fill="#555">bound=6, ops=0</text>

    <text x="115" y="221" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="205" y="221" text-anchor="middle" font-size="12.5" fill="#333">9</text>
    <text x="268" y="221" font-size="11.5" fill="#333">9 &gt; 6；spf(9) = 3 ≤ 6 ✓</text>
    <text x="600" y="221" text-anchor="middle" font-size="11.5" fill="#8a6215">换成 3（+1 操作）</text>
    <text x="750" y="221" text-anchor="middle" font-size="11.5" fill="#8a6215">bound=3, ops=1</text>

    <text x="115" y="271" text-anchor="middle" font-size="12.5" fill="#333">0</text>
    <text x="205" y="271" text-anchor="middle" font-size="12.5" fill="#333">12</text>
    <text x="268" y="271" font-size="11.5" fill="#333">12 &gt; 3；spf(12) = 2 ≤ 3 ✓</text>
    <text x="600" y="271" text-anchor="middle" font-size="11.5" fill="#8a6215">换成 2（+1 操作）</text>
    <text x="750" y="271" text-anchor="middle" font-size="11.5" fill="#8a6215">bound=2, ops=2</text>
  </g>

  <!-- ===== 数组演变 ===== -->
  <g filter="url(#rough2)">
    <rect x="120" y="322" width="48" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <rect x="174" y="322" width="48" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <rect x="228" y="322" width="48" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <rect x="282" y="322" width="48" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="144" y="350" text-anchor="middle" font-size="16" fill="#333">12</text>
    <text x="198" y="350" text-anchor="middle" font-size="16" fill="#333">9</text>
    <text x="252" y="350" text-anchor="middle" font-size="16" fill="#333">6</text>
    <text x="306" y="350" text-anchor="middle" font-size="16" fill="#333">7</text>
    <text x="360" y="348" font-size="12" fill="#555">原始数组</text>

    <path d="M 198 372 V 392" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)"/>
    <text x="236" y="386" font-size="11" fill="#3a6e3a">i = 1：9 → 3（spf(9)）</text>

    <rect x="120" y="396" width="48" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <rect x="174" y="396" width="48" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="228" y="396" width="48" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <rect x="282" y="396" width="48" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="144" y="424" text-anchor="middle" font-size="16" fill="#333">12</text>
    <text x="198" y="424" text-anchor="middle" font-size="16" fill="#2b5a2b">3</text>
    <text x="252" y="424" text-anchor="middle" font-size="16" fill="#333">6</text>
    <text x="306" y="424" text-anchor="middle" font-size="16" fill="#333">7</text>
    <text x="360" y="422" font-size="12" fill="#555">第 1 次操作</text>

    <path d="M 144 446 V 466" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)"/>
    <text x="236" y="460" font-size="11" fill="#3a6e3a">i = 0：12 → 2（spf(12)）</text>

    <rect x="120" y="470" width="48" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="174" y="470" width="48" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="228" y="470" width="48" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <rect x="282" y="470" width="48" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="144" y="498" text-anchor="middle" font-size="16" fill="#2b5a2b">2</text>
    <text x="198" y="498" text-anchor="middle" font-size="16" fill="#2b5a2b">3</text>
    <text x="252" y="498" text-anchor="middle" font-size="16" fill="#333">6</text>
    <text x="306" y="498" text-anchor="middle" font-size="16" fill="#333">7</text>
    <text x="360" y="496" font-size="12" fill="#3a6e3a">非递减 ✓，共 2 次</text>
  </g>

  <!-- ===== -1 反例 ===== -->
  <text x="80" y="566" font-size="14" font-weight="bold" fill="#a04a46" filter="url(#rough2)">反例：[7, 7, 6] —— 素数是「硬地板」，返回 −1</text>

  <g filter="url(#rough2)">
    <rect x="120" y="584" width="48" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <rect x="174" y="584" width="48" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="228" y="584" width="48" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="144" y="612" text-anchor="middle" font-size="16" fill="#333">7</text>
    <text x="198" y="612" text-anchor="middle" font-size="16" fill="#a04a46">7</text>
    <text x="252" y="612" text-anchor="middle" font-size="16" fill="#333">6</text>
  </g>
  <text x="320" y="600" font-size="12" fill="#555" filter="url(#rough2)">i = 2：保留 6，bound = 6</text>
  <text x="320" y="624" font-size="12" fill="#555" filter="url(#rough2)">i = 1：7 &gt; 6，但 spf(7) = 7（素数除以 1 不动）</text>

  <rect x="80" y="650" width="740" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="672" text-anchor="middle" font-size="12.5" fill="#a04a46" filter="url(#rough2)">7 无法变得 ≤ 6 ⇒ 返回 −1（示例 2）</text>
  <text x="450" y="694" text-anchor="middle" font-size="11.5" fill="#a04a46" filter="url(#rough2)">−1 的唯一来源：x &gt; bound 且 spf(x) &gt; bound</text>
</svg>
