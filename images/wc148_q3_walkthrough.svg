<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例走查：set(0,5) → snap → set(0,6) → get(0,0)</text>
  <text x="320" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">前 4 行是官方示例，后 5 行为延伸演算；快照本身不存任何数组</text>

  <rect x="30" y="68" width="580" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="88" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">操作</text>
  <text x="240" y="88" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">snap_cnt / 动作</text>
  <text x="445" y="88" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">his[0] 版本链</text>
  <text x="585" y="88" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">返回</text>

  <rect x="30" y="98" width="580" height="30" fill="#ffffff" stroke="#c8d4e8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="90" y="118" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">set(0, 5)</text>
  <text x="155" y="118" font-size="9.5" fill="#555" filter="url(#rough2)">cnt = 0，立即生效</text>
  <text x="340" y="118" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">追加 (0, 5)</text>
  <text x="585" y="118" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">—</text>

  <rect x="30" y="128" width="580" height="30" fill="#ffffff" stroke="#c8d4e8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="90" y="148" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">snap()</text>
  <text x="155" y="148" font-size="9.5" fill="#555" filter="url(#rough2)">返回 0，然后 cnt → 1</text>
  <text x="340" y="148" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">(0, 5)</text>
  <text x="585" y="148" text-anchor="middle" font-size="9.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="30" y="158" width="580" height="30" fill="#fbfffd" stroke="#c8d4e8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="90" y="178" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">set(0, 6)</text>
  <text x="155" y="178" font-size="9.5" fill="#555" filter="url(#rough2)">cnt = 1，属快照 1</text>
  <text x="340" y="178" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">追加 (1, 6)</text>
  <text x="585" y="178" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">—</text>

  <rect x="30" y="188" width="580" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="208" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">get(0, 0)</text>
  <text x="155" y="208" font-size="9.5" fill="#555" filter="url(#rough2)">二分找 stamp ≤ 0</text>
  <text x="340" y="208" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">命中 (0, 5)</text>
  <text x="585" y="208" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="30" y="218" width="580" height="30" fill="#ffffff" stroke="#c8d4e8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="90" y="238" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">snap()</text>
  <text x="155" y="238" font-size="9.5" fill="#555" filter="url(#rough2)">返回 1，然后 cnt → 2</text>
  <text x="340" y="238" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">(0, 5) (1, 6)</text>
  <text x="585" y="238" text-anchor="middle" font-size="9.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="30" y="248" width="580" height="30" fill="#ffffff" stroke="#c8d4e8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="90" y="268" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">set(0, 9)</text>
  <text x="155" y="268" font-size="9.5" fill="#555" filter="url(#rough2)">cnt = 2，属快照 2</text>
  <text x="340" y="268" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">追加 (2, 9)</text>
  <text x="585" y="268" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">—</text>

  <rect x="30" y="278" width="580" height="30" fill="#ffffff" stroke="#c8d4e8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="90" y="298" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">snap()</text>
  <text x="155" y="298" font-size="9.5" fill="#555" filter="url(#rough2)">返回 2，然后 cnt → 3</text>
  <text x="340" y="298" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">(0,5) (1,6) (2,9)</text>
  <text x="585" y="298" text-anchor="middle" font-size="9.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="30" y="308" width="580" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="328" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">get(0, 1)</text>
  <text x="155" y="328" font-size="9.5" fill="#555" filter="url(#rough2)">二分找 stamp ≤ 1</text>
  <text x="340" y="328" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">命中 (1, 6)</text>
  <text x="585" y="328" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="30" y="338" width="580" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="358" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">get(0, 2)</text>
  <text x="155" y="358" font-size="9.5" fill="#555" filter="url(#rough2)">二分找 stamp ≤ 2</text>
  <text x="340" y="358" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">命中 (2, 9)</text>
  <text x="585" y="358" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">9</text>

  <text x="320" y="392" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">旧版本永不覆盖：查 snap_id = 1 拿到的仍是 (1, 6)，与之后的 set 无关</text>
  <text x="320" y="412" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">关键：get 只看 stamp，不看「某个快照里存了哪个数组」</text>
</svg>
