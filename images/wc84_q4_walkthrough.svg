<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="101" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="105" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：逐个节点套换根公式</text>
  <path d="M 160.0 44 Q 310.0 54 460.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="310.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">先由上往下求 sz，再自上而下推 ans</text>
  <g filter="url(#rough2)"><rect x="70" y="92" width="480" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="95.0" y="111.04" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">节点</text>
  <text x="160.0" y="111.04" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">父节点</text>
  <text x="235.0" y="111.04" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">sz</text>
  <text x="375.0" y="111.04" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">ans[v] = ans[parent] + n − 2·sz</text>
  <text x="515.0" y="111.04" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">结果</text>
  <g filter="url(#rough2)"><rect x="70" y="120" width="480" height="28" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="95.0" y="139.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="160.0" y="139.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">—</text>
  <text x="235.0" y="139.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="375.0" y="139.6" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">8</text>
  <text x="515.0" y="139.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Σ depth = 8</text>
  <g filter="url(#rough2)"><rect x="70" y="148" width="480" height="28" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="95.0" y="167.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="160.0" y="167.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="235.0" y="167.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="375.0" y="167.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8 + 6 − 2×1 = 12</text>
  <text x="515.0" y="167.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>
  <g filter="url(#rough2)"><rect x="70" y="176" width="480" height="28" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="95.0" y="195.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="160.0" y="195.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="235.0" y="195.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="375.0" y="195.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8 + 6 − 2×4 = 6</text>
  <text x="515.0" y="195.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="70" y="204" width="480" height="28" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="95.0" y="223.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="160.0" y="223.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="235.0" y="223.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="375.0" y="223.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6 + 6 − 2×1 = 10</text>
  <text x="515.0" y="223.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <g filter="url(#rough2)"><rect x="70" y="232" width="480" height="28" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="95.0" y="251.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="160.0" y="251.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="235.0" y="251.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="375.0" y="251.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6 + 6 − 2×1 = 10</text>
  <text x="515.0" y="251.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <g filter="url(#rough2)"><rect x="70" y="260" width="480" height="28" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="95.0" y="279.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="160.0" y="279.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="235.0" y="279.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="375.0" y="279.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6 + 6 − 2×1 = 10</text>
  <text x="515.0" y="279.6" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <g filter="url(#rough2)"><rect x="70" y="300" width="480" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="310.0" y="322" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">输出顺序与原节点编号一致：[8,12,6,10,10,10]</text>
  <text x="310.0" y="340" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">换根只依赖父节点已算好的答案，故按 BFS/DFS 序自上而下即可</text>
  <text x="310.0" y="358" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">整个过程两遍遍历，O(n)</text>
  </svg>