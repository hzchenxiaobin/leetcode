<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">演算：nums = [1,1,1,1,1]，target = 3 ⟹ w = (5 + 3) / 2 = 4</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第 i 行是处理完前 i 个 1 之后的 dp 数组，只画 j = 0..4</text>

  <!-- 表头 -->
  <rect x="46" y="64" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="86" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">已处理的元素</text>
  <rect x="196" y="64" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="86" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">j = 0</text>
  <rect x="258" y="64" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="86" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">j = 1</text>
  <rect x="320" y="64" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="351" y="86" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">j = 2</text>
  <rect x="382" y="64" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="413" y="86" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">j = 3</text>
  <rect x="444" y="64" width="62" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="475" y="86" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">j = 4</text>

  <!-- 第 0 行：初始 -->
  <rect x="46" y="98" width="150" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="121" y="120" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">初始（空集）</text>
  <rect x="196" y="98" width="62" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="258" y="98" width="62" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="289" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="320" y="98" width="62" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="382" y="98" width="62" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="413" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="444" y="98" width="62" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="120" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">0</text>

  <!-- 第 1 行 -->
  <rect x="46" y="132" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="121" y="154" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">第 1 个 1</text>
  <rect x="196" y="132" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="258" y="132" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="289" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="320" y="132" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="382" y="132" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="413" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="444" y="132" width="62" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="154" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">0</text>

  <!-- 第 2 行 -->
  <rect x="46" y="166" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="121" y="188" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">第 2 个 1</text>
  <rect x="196" y="166" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="258" y="166" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="289" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="320" y="166" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="382" y="166" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="413" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="444" y="166" width="62" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="188" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">0</text>

  <!-- 第 3 行 -->
  <rect x="46" y="200" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="121" y="222" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">第 3 个 1</text>
  <rect x="196" y="200" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="258" y="200" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="289" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="320" y="200" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="382" y="200" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="413" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="444" y="200" width="62" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="222" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">0</text>

  <!-- 第 4 行 -->
  <rect x="46" y="234" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="121" y="256" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">第 4 个 1</text>
  <rect x="196" y="234" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="258" y="234" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="289" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="320" y="234" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="382" y="234" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="413" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="444" y="234" width="62" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="256" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">1</text>

  <!-- 第 5 行：答案 -->
  <rect x="46" y="268" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="121" y="290" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">第 5 个 1</text>
  <rect x="196" y="268" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="227" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="258" y="268" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="289" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="320" y="268" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <rect x="382" y="268" width="62" height="34" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="413" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <rect x="444" y="268" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="475" y="290" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">5</text>

  <path d="M 438 336 L 464 308" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="338" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">答案 dp[4] = 5，与示例 1 的 5 种表达式一一对应</text>

  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">转移：dp[j] += dp[j − 1]（j 倒序），等价于从 5 个 1 里任选 4 个放进 P</text>
</svg>
