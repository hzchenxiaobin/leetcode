<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 545" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="680" height="545" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一趟插入计数 + 一趟查询累加</text>
  <path d="M 130 42 Q 340 50 550 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="36" y="58" width="612" height="228" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="56" y="88" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">阶段一 · 插入：对每个单词 w，沿路径给节点计数</text>

  <g filter="url(#sk)"><rect x="52" y="112" width="92" height="48" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="98" y="140" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">cur = root</text>

  <g filter="url(#sk)"><path d="M 146 136 L 174 136" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="178" y="112" width="148" height="48" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="252" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">取出 w 的</text>
  <text x="252" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">下一字符 c</text>

  <g filter="url(#sk)"><path d="M 328 136 L 354 136" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><path d="M 414 96 L 470 136 L 414 176 L 358 136 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="414" y="131" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#sk)">child[c]</text>
  <text x="414" y="147" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#sk)">存在？</text>

  <g filter="url(#sk)"><path d="M 470 136 L 514 136" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>
  <text x="492" y="124" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">是</text>

  <g filter="url(#sk)"><rect x="518" y="112" width="116" height="48" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="576" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">cur = child[c]</text>

  <g filter="url(#sk)"><path d="M 414 176 L 414 200" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>
  <text x="426" y="194" font-size="12" fill="#b07818" filter="url(#sk)">否</text>

  <g filter="url(#sk)"><rect x="358" y="204" width="112" height="44" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="414" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">新建并下移</text>

  <g filter="url(#sk)"><path d="M 576 160 L 576 200" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><path d="M 470 226 L 514 226" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="518" y="204" width="116" height="44" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="576" y="231" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">cur.cnt += 1</text>

  <g filter="url(#sk)"><path d="M 634 226 L 640 226 L 640 258 L 252 258 L 252 164" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arrG)"/></g>
  <text x="430" y="275" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">w 还有字符 → 继续；走完 → 下一个 w</text>

  <g filter="url(#sk)"><rect x="36" y="306" width="612" height="224" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="56" y="336" font-size="15" font-weight="bold" fill="#2b4a68" filter="url(#sk)">阶段二 · 查询：对每个 w[i]，沿路径累加 cnt</text>

  <g filter="url(#sk)"><rect x="52" y="360" width="138" height="48" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8"/></g>
  <text x="121" y="379" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">cur = root</text>
  <text x="121" y="397" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">sum = 0</text>

  <g filter="url(#sk)"><path d="M 192 384 L 218 384" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="222" y="360" width="150" height="48" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8"/></g>
  <text x="297" y="379" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">取出 w[i] 的</text>
  <text x="297" y="397" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">下一字符 c</text>

  <g filter="url(#sk)"><path d="M 374 384 L 400 384" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="404" y="360" width="118" height="48" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8"/></g>
  <text x="463" y="388" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">cur = child[c]</text>

  <g filter="url(#sk)"><path d="M 463 408 L 463 440" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="404" y="444" width="118" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="2.2"/></g>
  <text x="463" y="471" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">sum += cnt</text>

  <g filter="url(#sk)"><path d="M 402 466 L 330 466 L 330 414" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arrB)"/></g>
  <text x="338" y="486" font-size="11" fill="#555" filter="url(#sk)">还有字符 →</text>

  <g filter="url(#sk)"><rect x="52" y="444" width="216" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="160" y="471" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">answer[i] = sum</text>

  <g filter="url(#sk)"><path d="M 463 488 L 463 504 L 160 504 L 160 492" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/></g>
  <text x="312" y="521" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">w[i] 走完 → 记录答案</text>
</svg>
