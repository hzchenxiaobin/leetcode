<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：两串放在一起，多出的字母必然「落单」</text>
  <text x="280" y="49" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">异或满足 a ⊕ a = 0：同一字母出现两次就自我抵消，出现奇数次才留下自己</text>

  <text x="34" y="114" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">s</text>
  <text x="34" y="174" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">t</text>

  <g filter="url(#rough2)">
    <rect x="60" y="90" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="114" y="90" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="168" y="90" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="222" y="90" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="60" y="150" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="114" y="150" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="168" y="150" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="222" y="150" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="276" y="150" width="44" height="40" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="5"/>
  </g>

  <g filter="url(#rough2)" font-size="15" text-anchor="middle" fill="#333">
    <text x="82" y="117">a</text><text x="136" y="117">b</text><text x="190" y="117">c</text><text x="244" y="117">d</text>
    <text x="82" y="177">a</text><text x="136" y="177">b</text><text x="190" y="177">c</text><text x="244" y="177">d</text>
    <text x="298" y="177" fill="#8a3a36">e</text>
  </g>

  <g stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)">
    <path d="M 82 132 L 82 148"/>
    <path d="M 136 132 L 136 148"/>
    <path d="M 190 132 L 190 148"/>
    <path d="M 244 132 L 244 148"/>
  </g>

  <text x="140" y="208" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">a、b、c、d 各出现 2 次 → 全部抵消</text>
  <text x="314" y="208" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">只出现 1 次（奇数次）</text>

  <rect x="50" y="222" width="460" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="66" y="244" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">ans = (a⊕b⊕c⊕d) ⊕ (a⊕b⊕c⊕d⊕e)</text>
  <text x="66" y="264" font-size="10.5" fill="#555" filter="url(#rough2)">= (a⊕a)⊕(b⊕b)⊕(c⊕c)⊕(d⊕d)⊕e</text>
  <text x="66" y="284" font-size="10.5" fill="#555" filter="url(#rough2)">= 0⊕0⊕0⊕0⊕e = e</text>

  <rect x="50" y="310" width="460" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="66" y="332" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">因此根本不用把 t 与 s「对齐」：异或可交换，t 怎么重排都得到同一个结果。</text>
  <text x="66" y="351" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">把 s、t 两串的所有字符依次异或，唯一残留的那一位就是被添加的字母。</text>
</svg>
