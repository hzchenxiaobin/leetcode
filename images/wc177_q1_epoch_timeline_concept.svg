<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：把日期放到同一条"天数轴"上</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- definition box -->
  <g filter="url(#sk2)">
    <rect x="40" y="58" width="280" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="180" y="84" text-anchor="middle" font-size="13" fill="#2b4a6e">f(date)：以 1971-01-01 为第 1 天，</text>
  <text x="180" y="104" text-anchor="middle" font-size="13" fill="#2b4a6e">date 是第几天（一个整数）</text>

  <g filter="url(#sk2)">
    <rect x="350" y="58" width="250" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="475" y="84" text-anchor="middle" font-size="13" fill="#7a5415">每个日期换算成一个整数，</text>
  <text x="475" y="104" text-anchor="middle" font-size="13" fill="#7a5415">天数差 = 整数差的绝对值</text>

  <!-- timeline -->
  <path d="M 60 235 Q 320 247 585 235" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="588" y="222" text-anchor="end" font-size="11" fill="#666">天数增长</text>

  <!-- origin -->
  <line x1="100" y1="223" x2="100" y2="247" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <circle cx="100" cy="235" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk2)"/>
  <text x="100" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">1971-01-01</text>
  <text x="100" y="287" text-anchor="middle" font-size="11" fill="#2b4a6e">f = 1（原点）</text>

  <!-- date2 (earlier) -->
  <line x1="340" y1="221" x2="340" y2="249" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <circle cx="340" cy="235" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk2)"/>
  <text x="340" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">date2 = 2019-12-31</text>
  <text x="340" y="270" text-anchor="middle" font-size="12" fill="#b85450">f = 17897</text>

  <!-- date1 (later) -->
  <line x1="530" y1="221" x2="530" y2="249" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <circle cx="530" cy="235" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk2)"/>
  <text x="530" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">date1 = 2020-01-15</text>
  <text x="530" y="270" text-anchor="middle" font-size="12" fill="#4a7a3a">f = 17912</text>

  <!-- double-headed diff arrow -->
  <path d="M 348 302 L 522 302" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 480 302 L 522 302" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 390 302 L 348 302" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="435" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">相差 15 天</text>

  <!-- result box -->
  <g filter="url(#sk2)">
    <rect x="170" y="330" width="300" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">答案 = |17912 − 17897| = 15</text>
  <text x="320" y="371" text-anchor="middle" font-size="11" fill="#7a5415">谁早谁晚都一样——abs 兜底</text>
</svg>
