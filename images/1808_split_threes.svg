<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="460" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察②：整数拆分的乘积何时最大——"尽量拆 3"</text>
  <path d="M 150 40 Q 340 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="60" text-anchor="middle" font-size="11.5" fill="#666">三条局部交换规则，把任何拆分一步步改造成最优形状（每一步乘积都不变小）</text>

  <!-- panel 1: kill the 1 -->
  <g filter="url(#sk)">
    <rect x="42" y="76" width="188" height="196" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="136" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">规则①：1 不单独留</text>
  <text x="136" y="124" text-anchor="middle" font-size="11.5" fill="#444">x · 1 = x &lt; x + 1</text>
  <text x="136" y="142" text-anchor="middle" font-size="10.5" fill="#888">把 1 并进别的部分，乘积变大</text>
  <g filter="url(#sk)">
    <rect x="70" y="158" width="42" height="34" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="116" y="158" width="42" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="98" y="212" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <text x="91" y="180" fill="#444">3</text>
    <text x="137" y="180" fill="#b85450">1</text>
    <text x="129" y="234" fill="#2f6b26">4</text>
  </g>
  <path d="M 136 196 Q 136 204 132 210" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="136" y="262" text-anchor="middle" font-size="10.5" fill="#666">3+1 → 4：乘积 3 → 4</text>

  <!-- panel 2: split 3 from x >= 5 -->
  <g filter="url(#sk)">
    <rect x="246" y="76" width="188" height="196" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">规则②：x ≥ 5 就拆出一个 3</text>
  <text x="340" y="124" text-anchor="middle" font-size="11.5" fill="#444">3(x−3) &gt; x ⟺ 2x &gt; 9 ⟺ x ≥ 5</text>
  <text x="340" y="142" text-anchor="middle" font-size="10.5" fill="#888">拆出 3 后剩余 x−3 ≥ 2，不产生 1</text>
  <g filter="url(#sk)">
    <rect x="310" y="158" width="60" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="274" y="212" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="320" y="212" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <text x="340" y="180" fill="#444">5</text>
    <text x="295" y="234" fill="#2f6b26">3</text>
    <text x="341" y="234" fill="#2f6b26">2</text>
  </g>
  <path d="M 330 196 Q 310 204 298 210" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="340" y="262" text-anchor="middle" font-size="10.5" fill="#666">5 → 3+2：乘积 5 → 6</text>

  <!-- panel 3: three 2s -> two 3s -->
  <g filter="url(#sk)">
    <rect x="450" y="76" width="188" height="196" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="544" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f6b26">规则③：三个 2 换两个 3</text>
  <text x="544" y="124" text-anchor="middle" font-size="11.5" fill="#444">2 · 2 · 2 = 8 &lt; 9 = 3 · 3</text>
  <text x="544" y="142" text-anchor="middle" font-size="10.5" fill="#888">和同为 6，乘积 8 → 9</text>
  <g filter="url(#sk)">
    <rect x="472" y="158" width="32" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="508" y="158" width="32" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="544" y="158" width="32" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="490" y="212" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="534" y="212" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <text x="488" y="180" fill="#444">2</text>
    <text x="524" y="180" fill="#444">2</text>
    <text x="560" y="180" fill="#444">2</text>
    <text x="510" y="234" fill="#7a5415">3</text>
    <text x="554" y="234" fill="#7a5415">3</text>
  </g>
  <path d="M 530 196 Q 528 204 524 210" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="544" y="262" text-anchor="middle" font-size="10.5" fill="#666">2+2+2 → 3+3：乘积 8 → 9</text>

  <!-- conclusion panel -->
  <g filter="url(#sk)">
    <rect x="42" y="292" width="596" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="340" y="315" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">最优拆分只含 2 和 3，且 2 至多两个（4 = 2+2 乘积不变，统一按两个 2 看）</text>
  <text x="340" y="338" text-anchor="middle" font-size="11" fill="#555">于是最优拆分由 m mod 3 唯一确定形状：全 3，再按余数补一个 2、两个 2，或收回一个 3</text>

  <!-- mod 3 cases -->
  <g filter="url(#sk)">
    <rect x="42" y="368" width="188" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="246" y="368" width="188" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="450" y="368" width="188" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="136" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">m ≡ 0 (mod 3)</text>
  <text x="136" y="412" text-anchor="middle" font-size="11.5" fill="#444">3 + 3 + … + 3</text>
  <text x="136" y="431" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">乘积 = 3^(m/3)</text>
  <text x="340" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">m ≡ 1 (mod 3)，m ≥ 4</text>
  <text x="340" y="412" text-anchor="middle" font-size="11.5" fill="#444">3+1 换成 2+2：4 + 3 + … + 3</text>
  <text x="340" y="431" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">乘积 = 4·3^((m−4)/3)</text>
  <text x="544" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6b26">m ≡ 2 (mod 3)</text>
  <text x="544" y="412" text-anchor="middle" font-size="11.5" fill="#444">2 + 3 + 3 + … + 3</text>
  <text x="544" y="431" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">乘积 = 2·3^((m−2)/3)</text>
</svg>
