<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：灌水瞬时 ⇒ 锁步推进，相遇只看 n 的奇偶</text>
  <path d="M 120 40 Q 340 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="58" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">灌满「立即」完成、不占时序；每株耗时相同 —— 每轮两人各推进一株，位置与灌水历史无关</text>

  <rect x="90" y="68" width="500" height="24" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="340" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">第 r 轮：Alice 在植物 r，Bob 在植物 n−1−r —— 节奏锁定，与灌满与否无关</text>

  <!-- Row A: even n -->
  <text x="58" y="122" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">偶数 n = 6</text>
  <rect x="140" y="100" width="54" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="167" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <rect x="198" y="100" width="54" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="225" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <rect x="256" y="100" width="54" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="283" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">4</text>
  <rect x="314" y="100" width="54" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="341" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06a10" filter="url(#sk)">4</text>
  <rect x="372" y="100" width="54" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="399" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06a10" filter="url(#sk)">3</text>
  <rect x="430" y="100" width="54" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="457" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06a10" filter="url(#sk)">2</text>
  <text x="167" y="152" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">0</text>
  <text x="225" y="152" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">1</text>
  <text x="283" y="152" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">2</text>
  <text x="341" y="152" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">3</text>
  <text x="399" y="152" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">4</text>
  <text x="457" y="152" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">5</text>

  <path d="M 148 176 L 294 176" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="152" y="168" text-anchor="start" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">Alice</text>
  <path d="M 476 176 L 336 176" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <text x="472" y="168" text-anchor="end" font-size="10.5" font-weight="bold" fill="#b06a10" filter="url(#sk)">Bob</text>
  <path d="M 307 169 L 323 185" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" fill="none" filter="url(#sk)"/>
  <path d="M 323 169 L 307 185" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" fill="none" filter="url(#sk)"/>
  <text x="315" y="203" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">擦肩而过</text>
  <text x="340" y="220" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">最后一轮后 i = 3 &gt; j = 2：无相遇，n 株恰好全部浇完</text>

  <!-- Row B: odd n -->
  <text x="58" y="280" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">奇数 n = 5</text>
  <rect x="236" y="234" width="94" height="20" rx="6" fill="#b85450" filter="url(#sk)"/>
  <text x="283" y="248" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" filter="url(#sk)">相遇株 ⌊n/2⌋</text>
  <rect x="140" y="258" width="54" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="167" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <rect x="198" y="258" width="54" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="225" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>
  <rect x="256" y="258" width="54" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="283" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">3</text>
  <rect x="314" y="258" width="54" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="341" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06a10" filter="url(#sk)">3</text>
  <rect x="372" y="258" width="54" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="399" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06a10" filter="url(#sk)">2</text>
  <text x="167" y="310" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">0</text>
  <text x="225" y="310" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">1</text>
  <text x="283" y="310" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">2</text>
  <text x="341" y="310" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">3</text>
  <text x="399" y="310" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">4</text>

  <path d="M 148 334 L 246 334" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="152" y="326" text-anchor="start" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">Alice</text>
  <path d="M 418 334 L 320 334" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <text x="422" y="326" text-anchor="end" font-size="10.5" font-weight="bold" fill="#b06a10" filter="url(#sk)">Bob</text>
  <text x="340" y="358" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">i == j == 2：当前水量多者浇这株（平手归 Alice），另一人水量不动</text>

  <rect x="60" y="382" width="560" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="340" y="406" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8c3a36" filter="url(#sk)">相遇仅由下标奇偶决定 —— 无需时间线模拟，双指针锁步推进 O(n) 一遍完成</text>
  <text x="340" y="444" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#sk)">每条流内部照旧「够则必须浇、不够立即灌满再浇」；与单人版 2079 的区别：灌水不折返、只数次数不数步数</text>
</svg>
