<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="311" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：tickets = [2,3,2]，k = 2 → 答案 6</text>
  <path d="M 140 42 Q 320 52 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- timeline boxes: buyer each second -->
  <g font-size="11" fill="#888">
    <text x="35" y="90">每秒</text>
    <text x="35" y="106">买票人</text>
  </g>

  <g filter="url(#sk)">
    <rect x="70" y="66" width="78" height="62" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="109" y="84" text-anchor="middle" font-size="11" fill="#888">t = 1</text>
  <text x="109" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e">0 号</text>

  <g filter="url(#sk)">
    <rect x="156" y="66" width="78" height="62" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="195" y="84" text-anchor="middle" font-size="11" fill="#888">t = 2</text>
  <text x="195" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e">1 号</text>

  <g filter="url(#sk)">
    <rect x="242" y="66" width="78" height="62" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="281" y="84" text-anchor="middle" font-size="11" fill="#a0762a">t = 3</text>
  <text x="281" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">2 号 k</text>

  <g filter="url(#sk)">
    <rect x="328" y="66" width="78" height="62" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="367" y="84" text-anchor="middle" font-size="11" fill="#888">t = 4</text>
  <text x="367" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e">0 号</text>

  <g filter="url(#sk)">
    <rect x="414" y="66" width="78" height="62" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="453" y="84" text-anchor="middle" font-size="11" fill="#888">t = 5</text>
  <text x="453" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e">1 号</text>

  <g filter="url(#sk)">
    <rect x="500" y="66" width="78" height="62" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="539" y="84" text-anchor="middle" font-size="11" fill="#a0762a">t = 6</text>
  <text x="539" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">2 号 k</text>
  <text x="539" y="52" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">完成！✓</text>

  <!-- k remaining row -->
  <g font-size="11" fill="#888">
    <text x="35" y="152">k 的</text>
    <text x="35" y="168">剩余</text>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="bold">
    <text x="109" y="164" fill="#2b6e9e">2</text>
    <text x="195" y="164" fill="#2b6e9e">2</text>
    <text x="281" y="164" fill="#7a5415">1</text>
    <text x="367" y="164" fill="#7a5415">1</text>
    <text x="453" y="164" fill="#7a5415">1</text>
    <text x="539" y="164" fill="#b85450">0 ✓</text>
  </g>

  <!-- time arrow -->
  <path d="M 100 184 L 560 184" stroke="#9aa5b1" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="200" text-anchor="middle" font-size="11" fill="#8a94a0">时间流逝（每格 1 秒，橙色 = k 本人买票）</text>

  <!-- queue snapshots -->
  <text x="35" y="240" font-size="11" fill="#888">队伍</text>
  <text x="35" y="256" font-size="11" fill="#888">快照</text>

  <!-- t=1: [3,2,1] persons 1,2k,0 -->
  <g filter="url(#sk)">
    <rect x="88" y="226" width="20" height="20" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="112" y="226" width="20" height="20" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="136" y="226" width="20" height="20" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="98" y="241" fill="#2b6e9e">3</text>
    <text x="122" y="241" fill="#7a5415" font-weight="bold">2</text>
    <text x="146" y="241" fill="#2b6e9e">1</text>
  </g>

  <!-- t=2: [2,1,2] persons 2k,0,1 -->
  <g filter="url(#sk)">
    <rect x="174" y="226" width="20" height="20" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="198" y="226" width="20" height="20" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="222" y="226" width="20" height="20" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="184" y="241" fill="#7a5415" font-weight="bold">2</text>
    <text x="208" y="241" fill="#2b6e9e">1</text>
    <text x="232" y="241" fill="#2b6e9e">2</text>
  </g>

  <!-- t=3: [1,2,1] persons 0,1,2k -->
  <g filter="url(#sk)">
    <rect x="260" y="226" width="20" height="20" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="284" y="226" width="20" height="20" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="308" y="226" width="20" height="20" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="270" y="241" fill="#2b6e9e">1</text>
    <text x="294" y="241" fill="#2b6e9e">2</text>
    <text x="318" y="241" fill="#7a5415" font-weight="bold">1</text>
  </g>

  <!-- t=4: [2,1] persons 1,2k (0号离开) -->
  <g filter="url(#sk)">
    <rect x="354" y="226" width="20" height="20" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="378" y="226" width="20" height="20" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="364" y="241" fill="#2b6e9e">2</text>
    <text x="388" y="241" fill="#7a5415" font-weight="bold">1</text>
  </g>
  <text x="347" y="262" text-anchor="end" font-size="10" fill="#4a8e4a">0 号买完离开</text>

  <!-- t=5: [1,1] persons 2k,1 -->
  <g filter="url(#sk)">
    <rect x="440" y="226" width="20" height="20" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="464" y="226" width="20" height="20" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="450" y="241" fill="#7a5415" font-weight="bold">1</text>
    <text x="474" y="241" fill="#2b6e9e">1</text>
  </g>

  <!-- t=6: [1] person 1 (k完成离开) -->
  <g filter="url(#sk)">
    <rect x="526" y="226" width="20" height="20" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="536" y="241" fill="#2b6e9e">1</text>
  </g>
  <text x="556" y="241" font-size="10" fill="#4a8e4a">k 离开</text>

  <text x="330" y="282" text-anchor="middle" font-size="11" fill="#8a94a0">快照 = 每秒结束时队伍中各人的剩余张数（橙格 = k），与题面示例一致</text>

  <!-- formula verification -->
  <g filter="url(#sk)">
    <rect x="70" y="300" width="500" height="46" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="319" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">贡献法验证：t[k]=2，i=0: min(2,2)=2，i=1: min(3,2)=2</text>
  <text x="320" y="338" text-anchor="middle" font-size="13.5" fill="#2e6e2e" font-family="monospace" font-weight="bold">ans = 2 + 2 + 2 = 6 ✓</text>

  <!-- insight note -->
  <g filter="url(#sk)">
    <rect x="70" y="360" width="500" height="40" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="378" text-anchor="middle" font-size="11.5" fill="#7a5415">对比：模拟法逐秒走 6 步；贡献法只看 3 个人各买几张。</text>
  <text x="320" y="394" text-anchor="middle" font-size="11.5" fill="#7a5415">t = 6 前的购票张数 = 0 号 2 张 + 1 号 2 张 + k 自己 2 张 = 6 秒</text>
</svg>
