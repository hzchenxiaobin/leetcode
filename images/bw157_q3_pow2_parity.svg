<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="350" fill="#fafafa"/>

  <text x="270" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">d 条边上的奇数和：总 2^d 种里正好一半是奇数</text>
  <text x="270" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">权重只有 1（奇）与 2（偶）两种选择</text>
  <rect x="40" y="66" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="80.0" y="84.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">边数 d</text>
  <rect x="120" y="66" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190.0" y="84.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">全部赋值</text>
  <rect x="260" y="66" width="150" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="335.0" y="84.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">代价为奇数的赋值</text>
  <rect x="410" y="66" width="100" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="460.0" y="84.0" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">数量</text>
  <rect x="40" y="94" width="80" height="28" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80.0" y="112.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="120" y="94" width="140" height="28" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="190.0" y="112.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">{1},{2}</text>
  <rect x="260" y="94" width="150" height="28" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="335.0" y="112.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">{1}</text>
  <rect x="410" y="94" width="100" height="28" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="460.0" y="112.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2^0 = 1</text>
  <rect x="40" y="122" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80.0" y="140.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="120" y="122" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="190.0" y="140.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">{11,12,21,22}</text>
  <rect x="260" y="122" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="335.0" y="140.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">{12,21}</text>
  <rect x="410" y="122" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="460.0" y="140.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2^1 = 2</text>
  <rect x="40" y="150" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80.0" y="168.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="120" y="150" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="190.0" y="168.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">共 8 种</text>
  <rect x="260" y="150" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="335.0" y="168.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">4 种（奇数个 1）</text>
  <rect x="410" y="150" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="460.0" y="168.0" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2^2 = 4</text>
  <rect x="40" y="200" width="460" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270.0" y="221.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">把路径上最后一条边拿出来配对：固定前 d-1 条，最后一条选 1 或 2 恰好一奇一偶</text>
  <text x="270.0" y="241.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">所以奇数代价的赋值数 = 2^d / 2 = 2^(d-1)</text>
  <text x="40" y="290" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">d = 2 时答案 2，d = 1 时答案 1，与示例一致</text>
  <text x="40" y="312" font-size="10.5" fill="#999" text-anchor="start" filter="url(#rough2)">注意：路径外的边不参与，不必乘 2^(n-1-d)</text>
</svg>
