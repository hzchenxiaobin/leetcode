<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察:i² 的数字串切成连续段,段值之和恰为 i</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="56" y="68" font-size="11" font-weight="bold" fill="#777" filter="url(#sk)">以 i = 36、i² = 1296 为例(L = 4,含 3 个间隙)</text>

  <rect x="246" y="74" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="266" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#33517a" filter="url(#sk)">1</text>
  <rect x="294" y="74" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="314" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#33517a" filter="url(#sk)">2</text>
  <rect x="342" y="74" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="362" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#33517a" filter="url(#sk)">9</text>
  <rect x="390" y="74" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="410" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#33517a" filter="url(#sk)">6</text>

  <path d="M 290 66 L 290 126" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3" fill="none" filter="url(#sk)"/>
  <path d="M 338 66 L 338 126" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3" fill="none" filter="url(#sk)"/>
  <path d="M 386 66 L 386 126" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3" fill="none" filter="url(#sk)"/>
  <text x="290" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818" filter="url(#sk)">①切/不切</text>
  <text x="338" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818" filter="url(#sk)">②切/不切</text>
  <text x="386" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#b07818" filter="url(#sk)">③切/不切</text>

  <rect x="436" y="64" width="196" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="534" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#sk)">段必须连续、不重叠,</text>
  <text x="534" y="104" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#sk)">且完整覆盖整串</text>

  <text x="200" y="158" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">每个间隙二选一 ⇒ 2³ = 8 种切法(一般地 2^(L−1) 种)</text>

  <rect x="56" y="170" width="528" height="214" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="320" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#444" filter="url(#sk)">「1296」 的 8 种切法(节选 5 种):恰有一种命中</text>

  <rect x="84" y="202" width="36" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="102" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">1</text>
  <rect x="128" y="202" width="64" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="160" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">29</text>
  <rect x="200" y="202" width="36" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="218" y="219" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">6</text>
  <text x="266" y="219" font-size="12.5" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">1 + 29 + 6 = 36 ✓ 命中!</text>

  <rect x="84" y="234" width="64" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="116" y="251" text-anchor="middle" font-size="13" fill="#555" filter="url(#sk)">12</text>
  <rect x="156" y="234" width="36" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="174" y="251" text-anchor="middle" font-size="13" fill="#555" filter="url(#sk)">9</text>
  <rect x="200" y="234" width="36" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="218" y="251" text-anchor="middle" font-size="13" fill="#555" filter="url(#sk)">6</text>
  <text x="266" y="251" font-size="12" fill="#555" filter="url(#sk)">12 + 9 + 6 = 27 ≠ 36 ✗</text>

  <rect x="84" y="266" width="36" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="102" y="283" text-anchor="middle" font-size="13" fill="#555" filter="url(#sk)">1</text>
  <rect x="128" y="266" width="36" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="146" y="283" text-anchor="middle" font-size="13" fill="#555" filter="url(#sk)">2</text>
  <rect x="172" y="266" width="36" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="190" y="283" text-anchor="middle" font-size="13" fill="#555" filter="url(#sk)">9</text>
  <rect x="216" y="266" width="36" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="234" y="283" text-anchor="middle" font-size="13" fill="#555" filter="url(#sk)">6</text>
  <text x="266" y="283" font-size="12" fill="#555" filter="url(#sk)">1 + 2 + 9 + 6 = 18 ≠ 36 ✗</text>

  <rect x="84" y="298" width="100" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="134" y="315" text-anchor="middle" font-size="13" fill="#555" filter="url(#sk)">129</text>
  <rect x="192" y="298" width="36" height="24" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="210" y="315" text-anchor="middle" font-size="13" fill="#555" filter="url(#sk)">6</text>
  <text x="266" y="315" font-size="12" fill="#555" filter="url(#sk)">129 + 6 = 135 ≠ 36 ✗</text>

  <rect x="84" y="330" width="164" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#sk)"/>
  <text x="166" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">1296</text>
  <text x="266" y="347" font-size="12" fill="#8a3a3a" filter="url(#sk)">1296 > 36 ✗ 整段已超上,剪枝</text>

  <rect x="56" y="398" width="316" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="214" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6520" filter="url(#sk)">超上剪枝:val 随段长单调不减</text>
  <text x="214" y="436" text-anchor="middle" font-size="10.5" fill="#8a6520" filter="url(#sk)">val = val×10 + d;一旦 val > 剩余 target</text>
  <text x="214" y="452" text-anchor="middle" font-size="10.5" fill="#8a6520" filter="url(#sk)">立即 break,更长的首段只会更大</text>

  <rect x="388" y="398" width="196" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="486" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#sk)">段允许前导 0</text>
  <text x="486" y="436" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">「0」、「00」 段合法,值为 0</text>
  <text x="486" y="452" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">100 = [10][0] → 10 + 0 = 10 ✓</text>
</svg>
