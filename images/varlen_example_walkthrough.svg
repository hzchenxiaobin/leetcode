<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="173" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [3,1,1,2]</text>
  <path d="M 200 40 Q 340 50 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- prefix array -->
  <text x="140" y="72" font-size="12" fill="#666" font-family="monospace">pre =</text>
  <g font-family="monospace" font-size="12" fill="#333" text-anchor="middle">
    <g filter="url(#sk)"><rect x="190" y="54" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="234" y="54" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="278" y="54" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="322" y="54" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="366" y="54" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
    <text x="212" y="72">0</text><text x="256" y="72">3</text><text x="300" y="72">4</text>
    <text x="344" y="72">5</text><text x="388" y="72">7</text>
    <text x="212" y="94" font-size="10" fill="#999">pre[0]</text>
    <text x="256" y="94" font-size="10" fill="#999">pre[1]</text>
    <text x="300" y="94" font-size="10" fill="#999">pre[2]</text>
    <text x="344" y="94" font-size="10" fill="#999">pre[3]</text>
    <text x="388" y="94" font-size="10" fill="#999">pre[4]</text>
  </g>

  <!-- table -->
  <!-- header -->
  <g filter="url(#sk)">
    <rect x="60" y="112" width="56" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="116" y="112" width="64" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="180" y="112" width="84" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="264" y="112" width="64" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="328" y="112" width="110" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="438" y="112" width="182" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="12" fill="#2b4a6e" text-anchor="middle" font-weight="bold">
    <text x="88" y="132">i</text>
    <text x="148" y="132">nums[i]</text>
    <text x="222" y="132">i−nums[i]</text>
    <text x="296" y="132">start</text>
    <text x="383" y="132">子数组</text>
    <text x="529" y="132">pre[i+1]−pre[start]</text>
  </g>

  <!-- row 0 -->
  <g filter="url(#sk)">
    <rect x="60" y="146" width="56" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="116" y="146" width="64" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="180" y="146" width="84" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="264" y="146" width="64" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="328" y="146" width="110" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="438" y="146" width="182" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-family="monospace">
    <text x="88" y="167">0</text><text x="148" y="167">3</text>
    <text x="222" y="167" fill="#b85450" font-weight="bold">−3</text>
    <text x="296" y="167" fill="#9c6d14" font-weight="bold">0</text>
    <text x="383" y="167">[3]</text>
    <text x="529" y="167">pre[1]−pre[0] = 3</text>
  </g>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="60" y="182" width="56" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="116" y="182" width="64" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="180" y="182" width="84" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="264" y="182" width="64" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="328" y="182" width="110" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="438" y="182" width="182" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-family="monospace">
    <text x="88" y="203">1</text><text x="148" y="203">1</text>
    <text x="222" y="203" fill="#b85450" font-weight="bold">0</text>
    <text x="296" y="203" fill="#9c6d14" font-weight="bold">0</text>
    <text x="383" y="203">[3,1]</text>
    <text x="529" y="203">pre[2]−pre[0] = 4</text>
  </g>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="60" y="218" width="56" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="116" y="218" width="64" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="180" y="218" width="84" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="264" y="218" width="64" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="328" y="218" width="110" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="438" y="218" width="182" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-family="monospace">
    <text x="88" y="239">2</text><text x="148" y="239">1</text>
    <text x="222" y="239">1</text>
    <text x="296" y="239" fill="#9c6d14" font-weight="bold">1</text>
    <text x="383" y="239">[1,1]</text>
    <text x="529" y="239">pre[3]−pre[1] = 2</text>
  </g>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="60" y="254" width="56" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="116" y="254" width="64" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="180" y="254" width="84" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="264" y="254" width="64" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="328" y="254" width="110" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="438" y="254" width="182" height="32" rx="4" fill="#fdfdf8" stroke="#b8c4d4" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-family="monospace">
    <text x="88" y="275">3</text><text x="148" y="275">2</text>
    <text x="222" y="275">1</text>
    <text x="296" y="275" fill="#9c6d14" font-weight="bold">1</text>
    <text x="383" y="275">[1,1,2]</text>
    <text x="529" y="275">pre[4]−pre[1] = 4</text>
  </g>

  <!-- total row -->
  <g filter="url(#sk)">
    <rect x="60" y="292" width="268" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="328" y="292" width="292" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="194" y="316" text-anchor="middle" font-size="13" fill="#2e5e22" font-weight="bold">总和</text>
  <text x="474" y="316" text-anchor="middle" font-size="14" fill="#2e5e22" font-weight="bold" font-family="monospace">3 + 4 + 2 + 4 = 13</text>

  <!-- clamping annotation -->
  <path d="M 222 146 Q 200 120 190 100" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="76" y="362" font-size="12" fill="#b85450">i = 0、1 时 i−nums[i] ≤ 0（红格），start 均钳位为 0</text>

  <!-- footer -->
  <text x="76" y="388" font-size="12" fill="#888">前缀和数组在表格外一次建好，表内每一行都只是 O(1) 的两项相减</text>
  <text x="76" y="410" font-size="12" fill="#888">区间 [l, r] 的和恒为 pre[r+1] − pre[l]，l = 0 时同样成立，无需特判</text>
</svg>
