<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">把「选祖先」变成「选起点深度 U」：起点越浅，路径越长</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">长度 = dist[v] − dist[u]，节点数 = dep[v] − dep[u] + 1</text>
  <rect x="60" y="78" width="64" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" rx="4" filter="url(#rough2)"/>
  <text x="92.0" y="100.96" text-anchor="middle" font-size="11" fill="#333333" font-weight="bold" filter="url(#rough2)">根</text>
  <text x="92" y="132" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">深度 0</text>
  <text x="92" y="148" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">dist 0</text>
  <rect x="156" y="78" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="188.0" y="100.96" text-anchor="middle" font-size="11" fill="#333333" font-weight="bold" filter="url(#rough2)">·</text>
  <text x="188" y="132" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">深度 1</text>
  <text x="188" y="148" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">dist 4</text>
  <path d="M 124 112 L 156 112" stroke="#999999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="252" y="78" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="284.0" y="100.96" text-anchor="middle" font-size="11" fill="#333333" font-weight="bold" filter="url(#rough2)">·</text>
  <text x="284" y="132" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">深度 2</text>
  <text x="284" y="148" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">dist 9</text>
  <path d="M 220 112 L 252 112" stroke="#999999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="348" y="78" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="380.0" y="100.96" text-anchor="middle" font-size="11" fill="#333333" font-weight="bold" filter="url(#rough2)">·</text>
  <text x="380" y="132" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">深度 3</text>
  <text x="380" y="148" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">dist 15</text>
  <path d="M 316 112 L 348 112" stroke="#999999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="444" y="78" width="64" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.0" rx="4" filter="url(#rough2)"/>
  <text x="476.0" y="100.96" text-anchor="middle" font-size="11" fill="#333333" font-weight="bold" filter="url(#rough2)">v</text>
  <text x="476" y="132" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">深度 4</text>
  <text x="476" y="148" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">dist 18</text>
  <path d="M 412 112 L 444 112" stroke="#999999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="528" y="104" text-anchor="middle" font-size="13" fill="#888888" filter="url(#rough2)">…</text>
  <rect x="156" y="170" width="300" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2.0" rx="8" filter="url(#rough2)"/>
  <text x="306" y="192" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">允许的起点：深度 U = max(b1+1, s2+1, 0)</text>
  <text x="306" y="212" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">更深（更右侧）的起点都合法，越浅越可能违例</text>
  <path d="M 306 168 L 306 152" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="40" y="244" width="480" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">最深合法的起点 U 一定给最长路径：边权全为正，dist 沿路径严格递增</text>
  <text x="280" y="288" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">所以每个 v 只需算一个候选：u = 深度 U 的那个祖先</text>
  <rect x="40" y="320" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">长度 dist[v] − pathDist[U]；节点数 dep[v] − U + 1</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">长度相同则取节点数更少的（题目要求并列最小）</text>
  <text x="280.0" y="408" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">pathDist 按深度数组维护，DFS 回溯时自动被覆盖</text>
</svg>
