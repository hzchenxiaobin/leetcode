<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="660" height="340" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">示例 2 逐轮：people = [1,2,2,3]，limit = 3</text>

  <!-- 轮 1 -->
  <text x="24" y="66" font-size="12" fill="#b85450" filter="url(#rough2)">第 1 轮：1 + 3 = 4 &gt; 3 ⇒ 3 独坐</text>
  <rect x="24" y="76" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="47" y="98" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">3</text>
  <path d="M24 120 L300 120" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="312" y="100" font-size="11" fill="#8d3b37" filter="url(#rough2)">船 1 = {3}</text>

  <!-- 轮 2 -->
  <text x="24" y="152" font-size="12" fill="#4a7a3a" filter="url(#rough2)">第 2 轮：1 + 2 = 3 ≤ 3 ⇒ 同行</text>
  <rect x="24" y="162" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="47" y="184" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">1</text>
  <rect x="70" y="162" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="93" y="184" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">2</text>
  <path d="M24 206 L300 206" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="312" y="186" font-size="11" fill="#33562a" filter="url(#rough2)">船 2 = {1, 2}</text>

  <!-- 轮 3 -->
  <text x="24" y="238" font-size="12" fill="#b07d20" filter="url(#rough2)">第 3 轮：只剩 2，lo == hi ⇒ 独坐</text>
  <rect x="24" y="248" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="47" y="270" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">2</text>
  <path d="M24 292 L300 292" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="312" y="272" font-size="11" fill="#8a6410" filter="url(#rough2)">船 3 = {2}</text>

  <text x="24" y="324" font-size="12" fill="#333" filter="url(#rough2)">三轮结束 ⇒ 3 艘</text>

  <!-- 右侧要点 -->
  <rect x="400" y="60" width="236" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="518" y="84" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">每轮必消耗最重者</text>
  <text x="518" y="108" text-anchor="middle" font-size="11" fill="#2c4a63" filter="url(#rough2)">所以船的条数不会超过 n</text>
  <text x="518" y="132" text-anchor="middle" font-size="11" fill="#2c4a63" filter="url(#rough2)">循环次数 ≤ n，O(n)</text>

  <rect x="400" y="176" width="236" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="518" y="200" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">示例 3 全是独坐</text>
  <text x="518" y="224" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">[3,3,4,5] 任意两人和都 &gt; 5</text>
  <text x="518" y="248" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">⇒ 4 人 4 船（贪心的下界情形）</text>
</svg>
