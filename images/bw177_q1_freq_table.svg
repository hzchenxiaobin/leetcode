<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">不同频率的最小数对：频次表 + 从小到大试 x</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums = [1,1,2,2,3,4]，x 取最小的可用值，再看比它大的值里谁频次不同</text>
  <text x="36" y="90" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">nums =</text>
  <rect x="100" y="72" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122.0" y="94.68" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="122" y="124" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="148" y="72" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170.0" y="94.68" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="170" y="124" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <rect x="196" y="72" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218.0" y="94.68" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="218" y="124" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <rect x="244" y="72" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266.0" y="94.68" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="266" y="124" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <rect x="292" y="72" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="314.0" y="94.68" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="314" y="124" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <rect x="340" y="72" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362.0" y="94.68" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="362" y="124" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="396" y="96" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">下标</text>
  <text x="36" y="156" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">频次：</text>
  <rect x="100" y="138" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148.0" y="158.78" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1 出现 2 次</text>
  <rect x="208" y="138" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256.0" y="158.78" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">2 出现 2 次</text>
  <rect x="316" y="138" width="96" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364.0" y="158.78" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3 出现 1 次</text>
  <rect x="424" y="138" width="96" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472.0" y="158.78" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4 出现 1 次</text>
  <rect x="36" y="190" width="488" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="210" text-anchor="start" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">x = 1（频次 2）</text>
  <text x="48" y="229" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">y = 2：频次 2，与 x 相同 ✗ 跳过</text>
  <text x="48" y="248" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">y = 3：频次 1 ≠ 2 ✓ 首个可用 → 返回 [1, 3]</text>
  <rect x="36" y="280" width="236" height="62" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="300" text-anchor="start" font-size="10.5" fill="#666666" font-weight="bold" filter="url(#rough2)">为什么 x 只试一次</text>
  <text x="48" y="317" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">x 越小越优先：先定下最小的 x，</text>
  <text x="48" y="334" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">再在其右侧取最小的 y。</text>
  <rect x="288" y="280" width="236" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="300" text-anchor="start" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">退化情形</text>
  <text x="300" y="317" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">只剩 1 个不同值，或所有值频次相同</text>
  <text x="300" y="334" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">→ 返回 [-1, -1]</text>
  <text x="280" y="372" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">示例 2 [1,5]：两个值各 1 次，频次相同 → [-1,-1]；示例 3 [7]：只有一个值 → [-1,-1]</text>
</svg>
