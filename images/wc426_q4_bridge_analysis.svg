<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#446688" filter="url(#rough2)">加桥边后：i → w 的路径形态与奇偶配平</text>

  <rect x="25" y="58" width="205" height="134" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" rx="12" filter="url(#rough2)"/>
  <text x="127" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506b" filter="url(#rough2)">树 1（任选 a）</text>

  <path d="M 88 124 Q 135 138 158 154" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="120" y="150" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">p1 = dist1(i,a)</text>

  <circle cx="78" cy="110" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="78" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506b" filter="url(#rough2)">i</text>
  <circle cx="172" cy="168" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="172" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">a</text>

  <path d="M 188 170 Q 258 156 328 170" fill="none" stroke="#b85450" stroke-width="3" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="258" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">桥边：1 条</text>

  <rect x="290" y="58" width="205" height="134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" rx="12" filter="url(#rough2)"/>
  <text x="392" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">树 2（任选 b）</text>

  <path d="M 360 158 Q 412 138 436 122" fill="none" stroke="#99741c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <text x="410" y="152" text-anchor="middle" font-size="11" fill="#99741c" filter="url(#rough2)">p2 = dist2(b,w)</text>

  <circle cx="348" cy="168" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="348" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">b</text>
  <circle cx="448" cy="106" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#33506b" filter="url(#rough2)">w</text>

  <rect x="55" y="206" width="410" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="227" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">dist(i,w) = p1 + 1 + p2，为偶 ⇔ p1 + p2 ≡ 1 (mod 2)</text>
  <text x="260" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">p1 的奇偶由「a 与 i 是否同色」决定</text>

  <rect x="28" y="268" width="228" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="142" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506b" filter="url(#rough2)">情况 A：a 同色于 i（p1 偶）</text>
  <text x="142" y="312" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">需 p2 奇 → w 异色于 b</text>
  <text x="142" y="332" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">b 放小类，w 收满大类</text>
  <text x="142" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">贡献 = maxC2 ✓</text>

  <rect x="264" y="268" width="228" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="378" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">情况 B：a 异色于 i（p1 奇）</text>
  <text x="378" y="312" text-anchor="middle" font-size="11.5" fill="#99741c" filter="url(#rough2)">需 p2 偶 → w 同色于 b</text>
  <text x="378" y="332" text-anchor="middle" font-size="11.5" fill="#99741c" filter="url(#rough2)">b 放大类，w 收满大类</text>
  <text x="378" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#99741c" filter="url(#rough2)">贡献 = maxC2 ✓</text>

  <rect x="28" y="368" width="464" height="34" fill="#f4f4f4" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="389" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">树 1 内部两点的路径不跨桥（桥是唯一连接）→ 树 1 贡献恒为 C1[color(i)]</text>

  <rect x="45" y="412" width="430" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="434" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">answer[i] = C1[color(i)] + max(C2[0], C2[1])</text>
  <text x="260" y="452" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">连法任选、殊途同归 —— 树 2 贡献永远是较大类</text>
</svg>
