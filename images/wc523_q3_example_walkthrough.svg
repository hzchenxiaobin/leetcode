<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">示例 2 走查：快照的记入与退回（n = 10）</text>

  <rect x="30" y="48" width="460" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">操作</text>
  <text x="255" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">说明</text>
  <text x="400" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">total</text>
  <text x="465" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt</text>

  <rect x="30" y="76" width="460" height="34" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="98" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">toggle C7</text>
  <text x="255" y="98" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">预订 · 中间座 · 快照 1</text>
  <text x="400" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="465" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="30" y="110" width="460" height="34" rx="3" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">toggle D7</text>
  <text x="255" y="132" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">预订 · 邻居 C7 已订 · 快照 3</text>
  <text x="400" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="465" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <rect x="30" y="144" width="460" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="166" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">getTotalTime</text>
  <text x="255" y="166" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">返回 1 + 3 = 4 ✓</text>
  <text x="400" y="166" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="465" y="166" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>

  <rect x="30" y="178" width="460" height="34" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="200" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">toggle D7</text>
  <text x="255" y="200" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">释放 · 退回快照 3（不是重算 1）</text>
  <text x="400" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="465" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="30" y="212" width="460" height="34" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="234" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">toggle C7</text>
  <text x="255" y="234" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">释放 · 退回快照 1</text>
  <text x="400" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="465" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <rect x="30" y="246" width="460" height="34" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="268" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">toggle D7</text>
  <text x="255" y="268" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">重新预订 · C7 空着 · 新快照 1</text>
  <text x="400" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="465" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="30" y="280" width="460" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="302" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">getMinTime</text>
  <text x="255" y="302" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">返回 cnt = 1 ✓（先窗后中即可）</text>
  <text x="400" y="302" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="465" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 150 48 L 150 314" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 360 48 L 360 314" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 440 48 L 440 314" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <rect x="30" y="330" width="460" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">释放退的是「当初记下的快照」——不是按当前状态重算</text>
  <text x="260" y="372" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">重新预订则按当下邻居状态重新计价</text>
</svg>
