<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="620" height="640" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333" filter="url(#r)">单查询判定流程：三道闸门 + 一趟落槽</text>
  <path d="M 110 34 Q 310 42 510 34" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- start -->
  <g filter="url(#r)">
    <rect x="130" y="48" width="240" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="250" y="68" text-anchor="middle" font-size="11.5" font-family="monospace" font-weight="bold" fill="#2b4a6e" filter="url(#r)">子数组 nums[l[i]..r[i]]</text>
  <text x="250" y="86" text-anchor="middle" font-size="10" fill="#446688" filter="url(#r)">L = r[i] − l[i] + 1（约束保证 L ≥ 2）</text>
  <path d="M 250 94 L 250 106" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#r)"/>

  <!-- min/max -->
  <g filter="url(#r)">
    <rect x="130" y="108" width="240" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="250" y="126" text-anchor="middle" font-size="11.5" font-family="monospace" font-weight="bold" fill="#2b4a6e" filter="url(#r)">一趟扫描求 mn、mx</text>
  <text x="250" y="141" text-anchor="middle" font-size="9" fill="#446688" filter="url(#r)">（同时可得，无需排序）</text>
  <path d="M 250 148 L 250 162" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#r)"/>

  <!-- gate 1: all equal -->
  <g filter="url(#r)">
    <polygon points="250,166 348,202 250,238 152,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="250" y="207" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1a" filter="url(#r)">mx == mn ？</text>
  <path d="M 348 202 L 430 202" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#r)"/>
  <text x="388" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#r)">是</text>
  <g filter="url(#r)">
    <rect x="434" y="176" width="150" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="509" y="197" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">true</text>
  <text x="509" y="215" text-anchor="middle" font-size="9.5" fill="#2e6e2e" filter="url(#r)">d = 0：全相等，任意排列皆等差</text>
  <path d="M 250 238 L 250 252" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#r)"/>
  <text x="262" y="250" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">否</text>

  <!-- gate 2: divisibility -->
  <g filter="url(#r)">
    <polygon points="250,256 355,294 250,332 145,294" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="250" y="290" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a1a" filter="url(#r)">(mx − mn) % (L−1)</text>
  <text x="250" y="307" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a1a" filter="url(#r)">== 0 ？</text>
  <path d="M 355 294 L 430 294" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#r)"/>
  <text x="392" y="286" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">否</text>
  <g filter="url(#r)">
    <rect x="434" y="268" width="150" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="509" y="289" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#r)">false</text>
  <text x="509" y="307" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#r)">公差无法为整数</text>
  <path d="M 250 332 L 250 346" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#r)"/>
  <text x="262" y="344" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#r)">是</text>

  <!-- compute d -->
  <g filter="url(#r)">
    <rect x="140" y="350" width="220" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="250" y="369" text-anchor="middle" font-size="11.5" font-family="monospace" font-weight="bold" fill="#2b4a6e" filter="url(#r)">d ← (mx − mn)/(L − 1)</text>
  <text x="250" y="387" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#r)">此时 d ≥ 1，可安全取模、除法</text>
  <path d="M 250 396 L 250 410" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#r)"/>

  <!-- gate 3: slot filling -->
  <g filter="url(#r)">
    <polygon points="250,414 362,456 250,498 138,456" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="250" y="446" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6a1a" filter="url(#r)">逐元素落槽：off = x − mn</text>
  <text x="250" y="464" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6a1a" filter="url(#r)">off % d == 0 且 seen[off/d] 空 ？</text>
  <path d="M 362 456 L 430 456" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#r)"/>
  <text x="395" y="448" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">否</text>
  <g filter="url(#r)">
    <rect x="434" y="430" width="150" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="509" y="451" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#r)">false</text>
  <text x="509" y="468" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#r)">off 不整除 d（落不进槽）</text>
  <text x="509" y="483" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#r)">或 seen[k] 已标记（撞车）</text>
  <path d="M 250 498 L 250 512" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#r)"/>
  <text x="262" y="510" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#r)">是（全部通过）</text>

  <!-- final true -->
  <g filter="url(#r)">
    <rect x="125" y="516" width="250" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="250" y="536" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">L 个元素落满 L 个槽（双射）</text>
  <text x="250" y="555" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">→ true</text>

  <!-- bottom note -->
  <g filter="url(#r)">
    <rect x="40" y="582" width="546" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="58" y="604" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#r)">除零警报：mx == mn（d = 0）必须在整除闸门之前分支，否则 % d 崩溃</text>
  <text x="58" y="621" font-size="10.5" fill="#444" filter="url(#r)">L = 2 恒 true：任何两数皆等差，算法自然覆盖无需特判；负数亦安全：off = x − mn ≥ 0</text>
</svg>
