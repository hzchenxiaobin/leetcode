<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="580" height="380" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">左右两段互补：判等变成判「左段 = 总分的一半」</text>
  <text x="290" y="68" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s = "adcb"   字符值：a=1, d=4, c=3, b=2   总分 S = 10</text>
  <rect x="90" y="92" width="80" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="114" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="130" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">值 1</text>
  <rect x="200" y="92" width="80" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="240" y="114" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="240" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">值 4</text>
  <rect x="310" y="92" width="80" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="350" y="114" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="350" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">值 3</text>
  <rect x="420" y="92" width="80" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="114" text-anchor="middle" font-size="15" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="460" y="136" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">值 2</text>
  <path d="M 265 84 L 265 168" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="265" y="186" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">拆分点 i = 1</text>
  <rect x="90" y="208" width="250" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="215" y="234" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">左段 "ad"：L = 1 + 4 = 5</text>
  <rect x="360" y="208" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="234" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">右段 "cb"：3 + 2 = 5</text>
  <rect x="90" y="268" width="470" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="108" y="292" text-anchor="start" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">判等：L = S - L  ⟺  2L = S  ⟺  2 × 5 = 10 ✓</text>
  <text x="108" y="316" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">只需一边累加，另一边靠「总和 − 左段」隐式得到</text>
  <text x="290" y="356" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意：S 必须是偶数才可能相等，但逐个判定也能自然覆盖</text>
</svg>
