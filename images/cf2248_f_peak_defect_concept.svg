<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="820" height="420" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">峰值判定：把每个格子折成一个偏差 f</text>
  <text x="410" y="54" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">行和、列和都塞进同一个标量，后面的操作只需看它被压低多少</text>

  <!-- 左：峰值等价变形 -->
  <rect x="36" y="72" width="372" height="152" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="52" y="98" font-size="12.5" fill="#33517a" filter="url(#rough2)">峰值：本格 ≥ 同行其余之和 + 同列其余之和</text>
  <text x="52" y="128" font-size="13.5" fill="#333" filter="url(#rough2)">v ≥ (Rx − v) + (Cy − v)</text>
  <text x="52" y="156" font-size="13.5" fill="#333" filter="url(#rough2)">⟺ 3v ≥ Rx + Cy</text>
  <text x="52" y="188" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">⟺ f = Rx + Cy − 3v ≤ 0</text>
  <text x="52" y="212" font-size="11.5" fill="#446688" filter="url(#rough2)">Rx = 第 x 行和，Cy = 第 y 列和</text>

  <!-- 右：一次操作对 f 的减量 -->
  <text x="432" y="82" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">一次 a×b 矩形操作：f 的减量</text>

  <rect x="424" y="92" width="372" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="436" y="114" font-size="12" fill="#8a6212" filter="url(#rough2)">格子落在矩形内部（a 行 b 列全覆盖）</text>
  <text x="700" y="114" font-size="12.5" font-weight="bold" fill="#8a6212" filter="url(#rough2)">a + b − 3</text>

  <rect x="424" y="130" width="372" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="436" y="152" font-size="12" fill="#2e6e2e" filter="url(#rough2)">同行，但所在列被排除</text>
  <text x="712" y="152" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">b</text>

  <rect x="424" y="168" width="372" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="436" y="190" font-size="12" fill="#2e6e2e" filter="url(#rough2)">同列，但所在行被排除</text>
  <text x="712" y="190" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">a</text>

  <rect x="424" y="206" width="372" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="436" y="228" font-size="12" fill="#9c3b38" filter="url(#rough2)">既不同行也不同列</text>
  <text x="716" y="228" font-size="12.5" font-weight="bold" fill="#9c3b38" filter="url(#rough2)">0</text>

  <text x="36" y="252" font-size="11.5" fill="#777" filter="url(#rough2)">减量 = 操作后 f 比操作前小了多少；减得越多，越容易 ≤ 0</text>

  <!-- 结论 1 -->
  <rect x="36" y="268" width="760" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="52" y="293" font-size="12.5" fill="#8a6212" filter="url(#rough2)">a + b − 3 只有整矩阵（a = n，b = m）时最大，恰为 n + m − 3；另外两类最多 n−1 与 m−1</text>
  <text x="52" y="316" font-size="12.5" fill="#8a6212" filter="url(#rough2)">所以"整矩阵操作"对每一格的减量都不输任何别的操作（n, m ≥ 2 时）</text>

  <!-- 结论 2 -->
  <rect x="36" y="344" width="760" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="52" y="369" font-size="12.5" fill="#33517a" filter="url(#rough2)">记 F_k = 全部 f 中第 k 小的值：想凑出至少 k 个峰值，总减量至少要 F_k</text>
  <text x="52" y="392" font-size="12.5" fill="#33517a" filter="url(#rough2)">于是 ans = max(0, ⌈F_k / (n + m − 3)⌉)——二维情形到此结束</text>
</svg>
