<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描 [1, n−2]</text>
  <path d="M 195 36 Q 320 44 445 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 侧注 -->
  <g filter="url(#sk)"><rect x="430" y="62" width="190" height="128" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="445" y="86" font-size="11" font-weight="bold" fill="#7a5415">两个小注</text>
  <text x="445" y="106" font-size="11" fill="#666">① &amp;&amp; 短路：左侧失败</text>
  <text x="445" y="122" font-size="11" fill="#666">    即跳过右侧比较</text>
  <text x="445" y="144" font-size="11" fill="#666">② O(n) 即读取下界：</text>
  <text x="445" y="160" font-size="11" fill="#666">    要输出全部峰，最坏</text>
  <text x="445" y="176" font-size="11" fill="#666">    须读完整个数组</text>

  <!-- 开始 -->
  <g filter="url(#sk)"><ellipse cx="230" cy="70" rx="42" ry="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="230" y="75" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">开始</text>
  <path d="M 230 86 L 230 100" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)"><rect x="150" y="104" width="160" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="230" y="124" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">ans = [ ]；i = 1</text>
  <path d="M 230 136 L 230 152" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 循环条件 -->
  <g filter="url(#sk)"><path d="M 230 156 L 314 206 L 230 256 L 146 206 Z" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="230" y="211" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace" font-weight="bold">i ≤ n−2 ?</text>

  <!-- 否：返回 -->
  <path d="M 314 206 L 484 206" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="366" y="198" font-size="12" fill="#888">否（枚举完）</text>
  <g filter="url(#sk)"><ellipse cx="548" cy="206" rx="56" ry="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="548" y="211" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">返回 ans</text>

  <!-- 是：谓词判定 -->
  <path d="M 230 256 L 230 272" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="268" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)"><path d="M 230 276 L 330 324 L 230 372 L 130 324 Z" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="230" y="320" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace" font-weight="bold">m[i−1] &lt; m[i] 且</text>
  <text x="230" y="338" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace" font-weight="bold">m[i] &gt; m[i+1] ?</text>

  <!-- 是：收集 -->
  <path d="M 330 324 L 396 324" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="348" y="316" font-size="12" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)"><rect x="400" y="306" width="150" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="475" y="328" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">把 i 收进 ans</text>

  <!-- 收集后汇入 i++ -->
  <path d="M 475 342 L 475 396 L 289 396" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 否：i++ -->
  <path d="M 230 372 L 230 380" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="378" font-size="11" fill="#888">否</text>
  <g filter="url(#sk)"><rect x="175" y="380" width="110" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="230" y="400" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace">i++</text>

  <!-- 回到循环条件 -->
  <path d="M 175 396 L 105 396 L 105 206 L 142 206" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="96" y="300" font-size="11" fill="#888" text-anchor="middle" transform="rotate(-90 96 300)">i++ 后继续判定</text>

  <text x="320" y="428" text-anchor="middle" font-size="12" fill="#888">一趟扫描 [1, n−2]，每个位置至多两次比较 —— 既是暴力也是下界</text>
</svg>
