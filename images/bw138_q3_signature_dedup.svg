<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按数位多重集去重：同签名只统计一次</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">k 回文整数只是"钩子"，真正要数的是全部可重排成它的 n 位数</text>

  <rect x="42" y="66" width="220" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="88" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">回文 2112（能被 3 整除）</text>
  <text x="56" y="108" font-size="10.5" fill="#555" filter="url(#rough2)">数位：2, 1, 1, 2　数位和 6</text>
  <text x="56" y="124" font-size="10.5" fill="#555" filter="url(#rough2)">签名 sorted = "1122"</text>

  <rect x="286" y="66" width="232" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="88" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">回文 1221（也能被 3 整除）</text>
  <text x="300" y="108" font-size="10.5" fill="#555" filter="url(#rough2)">数位：1, 2, 2, 1</text>
  <text x="300" y="124" font-size="10.5" fill="#555" filter="url(#rough2)">签名 sorted = "1122"（同一个）</text>

  <path d="M 152 132 L 236 164" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 402 132 L 320 164" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="196" y="166" width="170" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="281" y="187" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">签名集合 {"1122"}</text>
  <text x="281" y="204" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">同一个签名只入集合一次</text>

  <path d="M 281 212 L 281 236" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="88" y="238" width="384" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="102" y="259" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">对一个签名，数出所有"无前导零"的排列数</text>
  <text x="102" y="278" font-size="10.5" fill="#555" filter="url(#rough2)">"1122" 的排列共 4!/(2!2!) = 6 个：1122、1212、1221、2112、2121、2211</text>

  <path d="M 281 294 L 281 316" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="88" y="318" width="384" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="102" y="339" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">累加：ans += 该签名的合法排列数</text>
  <text x="102" y="357" font-size="10.5" fill="#555" filter="url(#rough2)">不同签名的数位集合互不相同 ⇒ 它们对应的排列集合也互不相交</text>

  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">用"排序后的数字串"或"10 个计数"当键都可，n ≤ 10 时数量很小</text>
</svg>
