<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">关键观察：2025 与 2026 都只需在 e* 之后判定</text>

  <!-- 字符串 202516 -->
  <rect x="96" y="78" width="46" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="142" y="78" width="46" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="188" y="78" width="46" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="234" y="78" width="46" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <rect x="280" y="78" width="46" height="46" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="326" y="78" width="46" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="119" y="109" text-anchor="middle" font-size="21" fill="#333" filter="url(#rough2)">2</text>
  <text x="165" y="109" text-anchor="middle" font-size="21" fill="#333" filter="url(#rough2)">0</text>
  <text x="211" y="109" text-anchor="middle" font-size="21" fill="#333" filter="url(#rough2)">2</text>
  <text x="257" y="109" text-anchor="middle" font-size="21" font-weight="bold" fill="#a0761e" filter="url(#rough2)">5</text>
  <text x="303" y="109" text-anchor="middle" font-size="21" fill="#333" filter="url(#rough2)">1</text>
  <text x="349" y="109" text-anchor="middle" font-size="21" font-weight="bold" fill="#8d3a35" filter="url(#rough2)">6</text>
  <text x="119" y="142" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="165" y="142" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="211" y="142" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <text x="257" y="142" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>
  <text x="303" y="142" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>
  <text x="349" y="142" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">6</text>

  <!-- 贪心匹配 202 的括号 -->
  <path d="M 100 70 L 100 62 L 228 62 L 228 70" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="54" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">贪心匹配 202</text>

  <!-- e* 虚线 -->
  <path d="M 232 66 L 232 168" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="232" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">e* = 3</text>

  <path d="M 372 150 L 372 190" fill="none" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#rough2)"/>

  <!-- 三个步骤框 -->
  <rect x="30" y="196" width="206" height="70" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="133" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#33517a" filter="url(#rough2)">① 贪心匹配最短 202</text>
  <text x="133" y="246" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">结束位置记为 e*</text>

  <rect x="257" y="196" width="206" height="70" rx="9" fill="#ffffff" stroke="#888888" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#rough2)">② x = e* 后第一个 5 或 6</text>
  <text x="360" y="246" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">没有 5 也没有 6 → 该 l 全好</text>

  <rect x="484" y="196" width="206" height="70" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="587" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0761e" filter="url(#rough2)">③ 看 s[x] 是 5 还是 6</text>
  <text x="587" y="246" text-anchor="middle" font-size="11.5" fill="#a0761e" filter="url(#rough2)">是 5 → 坏 r 从 x 开始</text>

  <path d="M 238 231 L 251 231" fill="none" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#rough2)"/>
  <path d="M 465 231 L 478 231" fill="none" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#rough2)"/>

  <text x="360" y="294" text-anchor="middle" font-size="12.5" fill="#8d3a35" filter="url(#rough2)">坏 r 恰好是一段连续区间 [x, y − 1]，y 是 x 之后第一个 6</text>
  <text x="360" y="316" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">（x 之后没有 6 时取 y = n + 1，区间右端就是 n）</text>
</svg>
