<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：五个候选逐个二分判定，首个全命中即答案</text>

  <!-- 表头 -->
  <rect x="40" y="48" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="68" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">候选 v</text>
  <text x="200" y="68" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">第 2 行 [2,4,5,8,10]</text>
  <text x="330" y="68" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">第 3 行 [3,5,7,9,11]</text>
  <text x="470" y="68" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">第 4 行 [1,3,5,7,9]</text>

  <!-- 行 v=1 -->
  <rect x="40" y="80" width="480" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="101" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="200" y="101" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 无 1</text>
  <text x="330" y="101" text-anchor="middle" font-size="11.5" fill="#bbb" filter="url(#rough2)">— 跳过</text>
  <text x="470" y="101" text-anchor="middle" font-size="11.5" fill="#bbb" filter="url(#rough2)">— 跳过</text>

  <!-- 行 v=2 -->
  <rect x="40" y="114" width="480" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="135" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="200" y="135" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="330" y="135" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 无 2</text>
  <text x="470" y="135" text-anchor="middle" font-size="11.5" fill="#bbb" filter="url(#rough2)">— 跳过</text>

  <!-- 行 v=3 -->
  <rect x="40" y="148" width="480" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="169" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="200" y="169" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 无 3</text>
  <text x="330" y="169" text-anchor="middle" font-size="11.5" fill="#bbb" filter="url(#rough2)">— 跳过</text>
  <text x="470" y="169" text-anchor="middle" font-size="11.5" fill="#bbb" filter="url(#rough2)">— 跳过</text>

  <!-- 行 v=4 -->
  <rect x="40" y="182" width="480" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="203" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="200" y="203" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="330" y="203" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 无 4</text>
  <text x="470" y="203" text-anchor="middle" font-size="11.5" fill="#bbb" filter="url(#rough2)">— 跳过</text>

  <!-- 行 v=5 命中 -->
  <rect x="40" y="216" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="237" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="200" y="237" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓（下标 2）</text>
  <text x="330" y="237" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓（下标 1）</text>
  <text x="470" y="237" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓（下标 2）</text>

  <path d="M 330 252 L 280 268" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="272" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="58" y="292" font-size="12" fill="#4a7a3a" font-weight="bold">三行全部命中 → 返回 5</text>
  <text x="58" y="310" font-size="11" fill="#555">候选按第一行顺序枚举 = 按值从小到大，首个命中无需比较天然就是最小公共元素。</text>

  <rect x="40" y="330" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="58" y="350" font-size="11.5" fill="#333" font-weight="bold">失败候选的提前退出：</text>
  <text x="140" y="350" font-size="11" fill="#555">v=1 只查了第 2 行就换下一个；v=2 查到第 3 行失败即止，</text>
  <text x="58" y="368" font-size="11" fill="#555">多数候选两三步就被否决，实际比较次数远低于最坏估计 O(m·n·log m)。</text>
</svg>
