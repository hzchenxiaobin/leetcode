<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：每个点坍缩成极角，可见 ⟺ 落入视野弧</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">示例 1：视野 [−45°, 45°] 一次罩住 0°、45° 两个方向的三个点——边界上的点也算可见</text>

  <!-- 视野扇形 [-45°, 45°]，R=200，观测者 (95,240) -->
  <g filter="url(#r)">
    <path d="M 95,240 L 236.4,381.4 A 200,200 0 0 0 236.4,98.6 Z" fill="#e8f0fe" fill-opacity="0.8" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="168" y="316" font-size="11.5" fill="#446688" filter="url(#r)">视野扇形 α=90°</text>

  <!-- 正东基准 -->
  <g filter="url(#r)">
    <line x1="95" y1="240" x2="300" y2="240" stroke="#4a8edb" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ar)"/>
  </g>
  <text x="306" y="244" font-size="11" font-weight="bold" fill="#4a8edb" filter="url(#r)">正东 = 0°</text>

  <!-- θ 角度弧 0°→45° -->
  <g filter="url(#r)">
    <path d="M 150,240 A 55,55 0 0 0 133.9,201.1" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="152" y="218" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#r)">θ=45°</text>
  <text x="118" y="205" font-size="9.5" fill="#666" filter="url(#r)">θ = atan2(dy,dx)</text>

  <!-- 自转示意 -->
  <g filter="url(#r)">
    <path d="M 88.4,202.6 A 38,38 0 0 0 57.6,233.4" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <text x="52" y="192" font-size="10.5" fill="#888" filter="url(#r)">可自转 d</text>

  <!-- 观测者 -->
  <g filter="url(#r)">
    <circle cx="95" cy="240" r="11" fill="none" stroke="#446688" stroke-width="1.5"/>
    <circle cx="95" cy="240" r="6.5" fill="#446688"/>
  </g>
  <text x="95" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#r)">你 (1,1)</text>

  <!-- 三个点 -->
  <g filter="url(#r)">
    <circle cx="210" cy="240" r="5.5" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.2"/>
    <circle cx="197.5" cy="137.5" r="5.5" fill="#d6a040" stroke="#a67c1b" stroke-width="1.2"/>
    <circle cx="232.9" cy="102.1" r="5.5" fill="#b85450" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="210" y="225" text-anchor="middle" font-size="10.5" fill="#3a5c2e" filter="url(#r)">(2,1) θ=0°</text>
  <text x="196" y="124" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#r)">(2,2) θ=45°</text>
  <text x="240" y="90" text-anchor="middle" font-size="10.5" fill="#b03a3a" filter="url(#r)">(3,3) θ=45°</text>
  <text x="262" y="118" font-size="9.5" fill="#b85450" filter="url(#r)">同射线不遮挡，边界也可见！</text>

  <!-- 观察框 1 -->
  <g filter="url(#r)">
    <rect x="380" y="56" width="216" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="488" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">观察 1：方向即一切</text>
  <text x="390" y="100" font-size="10.5" fill="#555" filter="url(#r)">可见性只看方向：距离无关、点不遮挡</text>
  <text x="390" y="120" font-size="10.5" fill="#555" filter="url(#r)">每点 → 极角 θ = atan2(dy, dx)</text>
  <text x="390" y="140" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#r)">10^5 个点 → 10^5 个角度值</text>

  <!-- 观察框 2 -->
  <g filter="url(#r)">
    <rect x="380" y="168" width="216" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="488" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">观察 2：可见 ⟺ 落入弧</text>
  <text x="390" y="212" font-size="10.5" fill="#555" filter="url(#r)">自转 d 后视野 [d−α/2, d+α/2]，</text>
  <text x="390" y="232" font-size="10.5" fill="#555" filter="url(#r)">在极角圆上恰是长 α 的一段弧；</text>
  <text x="390" y="252" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#r)">答案 = 定长弧最多盖住几个极角</text>

  <!-- 观察框 3 -->
  <g filter="url(#r)">
    <rect x="380" y="280" width="216" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="488" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#a67c1b" filter="url(#r)">观察 3：重合点恒可见</text>
  <text x="390" y="324" font-size="10.5" fill="#555" filter="url(#r)">atan2(0,0) 无意义 → 剔除出极角，</text>
  <text x="390" y="344" font-size="10.5" fill="#555" filter="url(#r)">单独计数 cnt</text>
  <text x="390" y="364" font-size="10.5" font-weight="bold" fill="#a67c1b" filter="url(#r)">最终答案 = max(窗口) + cnt</text>

  <text x="310" y="404" text-anchor="middle" font-size="11" fill="#999" filter="url(#r)">三步转化：点 → 极角（atan2）→ 定长弧覆盖 → 排序 + 滑动窗口</text>
</svg>
