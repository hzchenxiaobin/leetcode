<svg xmlns="http://www.w3.org/2000/svg" width="560" height="460" viewBox="0 0 560 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="460" fill="#fdfcf7"/>
  <text x="280" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">算法流程：出现列表上的双指针</text>
  <path d="M 150 34 Q 280 42 410 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="180" y="48" width="200" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="68" text-anchor="middle" font-size="12.5" fill="#2b2b2b">按值分组：pos[v] ← 出现下标</text>
  <path d="M 280 82 L 280 98" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="150" y="102" width="260" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="122" text-anchor="middle" font-size="12.5" fill="#2b2b2b">取 p = pos[v]，置 i = 0, j = 0</text>
  <path d="M 280 136 L 280 150" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="280,154 392,182 280,210 168,182" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="280" y="187" text-anchor="middle" font-size="12.5" fill="#2b2b2b">j &lt; len(p) ?</text>

  <!-- no branch: next value -->
  <path d="M 392 182 L 446 182" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="416" y="172" text-anchor="middle" font-size="11" fill="#7a7a7a">否</text>
  <g filter="url(#sk)">
    <rect x="450" y="164" width="88" height="34" rx="8" fill="#f0eeea" stroke="#7a7a7a" stroke-width="1.4"/>
  </g>
  <text x="494" y="185" text-anchor="middle" font-size="12" fill="#2b2b2b">取下一个 v</text>
  <path d="M 494 164 L 494 118 L 416 118" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- yes branch -->
  <path d="M 280 210 L 280 240" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="296" y="230" font-size="11" fill="#4a7a3a">是</text>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="170" y="244" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="265" text-anchor="middle" font-size="12" fill="#2b2b2b">j ← j + 1，算 cost(i, j)</text>
  <path d="M 280 278 L 280 292" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- diamond 2 -->
  <g filter="url(#sk)">
    <polygon points="280,296 392,324 280,352 168,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="280" y="329" text-anchor="middle" font-size="12.5" fill="#2b2b2b">cost = (p[j]−p[i]+1)−(j−i+1) &gt; k ?</text>

  <!-- yes: shrink i -->
  <path d="M 392 324 L 440 324" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="414" y="314" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <g filter="url(#sk)">
    <rect x="444" y="306" width="92" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="490" y="327" text-anchor="middle" font-size="12.5" fill="#2b2b2b">i ← i + 1</text>
  <path d="M 490 306 L 490 272 L 280 272 L 280 290" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- no: update ans -->
  <path d="M 280 352 L 280 380" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <text x="296" y="372" font-size="11" fill="#4a7a3a">否，合法</text>
  <g filter="url(#sk)">
    <rect x="170" y="384" width="220" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="280" y="405" text-anchor="middle" font-size="12.5" fill="#2b2b2b">ans ← max(ans, j − i + 1)</text>
  <path d="M 170 401 L 108 401 L 108 182 L 162 182" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="428" width="480" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="280" y="446" text-anchor="middle" font-size="11" fill="#7a5415">i、j 都只单向右移、从不回退 → 每个值均摊 O(len(pos[v]))，总计 O(n)</text>
</svg>
