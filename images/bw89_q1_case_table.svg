<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">小时段「?」四种组合的计数表</text>

  <g filter="url(#rough2)" font-size="12.5" fill="#446688" font-weight="bold">
    <text x="80" y="56">情形</text>
    <text x="215" y="56" text-anchor="middle">示例</text>
    <text x="330" y="56" text-anchor="middle">计数</text>
    <text x="470" y="56" text-anchor="middle">原因</text>
  </g>
  <path d="M 60 64 L 510 64" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="80" y="92">??</text>
    <text x="215" y="92" text-anchor="middle">??:00 → 24</text>
    <text x="330" y="92" text-anchor="middle">24</text>
    <text x="470" y="92" text-anchor="middle">00..23 全部可选</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="200" y="102" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" opacity="0"/>
  </g>
  <path d="M 60 102 L 510 102" stroke="#c9d4e4" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="80" y="130">十位 ?</text>
    <text x="215" y="130" text-anchor="middle">?3 / ?5</text>
    <text x="330" y="130" text-anchor="middle">3 / 2</text>
    <text x="470" y="130" text-anchor="middle">个位≤3 取 0,1,2；否则 0,1</text>
  </g>
  <path d="M 60 140 L 510 140" stroke="#c9d4e4" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="80" y="168">个位 ?</text>
    <text x="215" y="168" text-anchor="middle">0? / 1? / 2?</text>
    <text x="330" y="168" text-anchor="middle">10 / 10 / 4</text>
    <text x="470" y="168" text-anchor="middle">00..19 全合法；20..23 仅 4 个</text>
  </g>
  <path d="M 60 178 L 510 178" stroke="#c9d4e4" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="80" y="206">无 ?</text>
    <text x="215" y="206" text-anchor="middle">05:00</text>
    <text x="330" y="206" text-anchor="middle">1</text>
    <text x="470" y="206" text-anchor="middle">题面保证本身合法</text>
  </g>
  <path d="M 60 216 L 510 216" stroke="#c9d4e4" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="56" y="234" width="458" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#1d3a17" text-anchor="middle">
    <text x="285" y="258">分钟段更宽松：个位 0..9 均合法，约束只在十位 ≤ 5</text>
    <text x="285" y="283">?? → 60　?d → 6　a? → 0/5 十位取 10，6..9 取 0</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="56" y="318" width="458" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a2f2b" text-anchor="middle">
    <text x="285" y="342">易错点：小时上界是不规则的 23</text>
    <text x="285" y="367">?5 = 2（25 非法）、2? = 4（只有 20..23）</text>
  </g>
</svg>
