<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">后缀 DP：编号整体 +1 的代价增量 = k × 后缀 cost 之和</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888">nums = [3,1,4]，cost = [4,6,6]，k = 1：同一段后缀换个「身份」看</text>

  <text x="140" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">后缀 [1,4] 独立成题：段编号从 1 开始</text>
  <rect x="50" y="86" width="80" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="90" y="108" text-anchor="middle" font-size="12" fill="#3a5a30">[1]</text>
  <text x="90" y="126" text-anchor="middle" font-size="9.5" fill="#666">第 1 段</text>
  <rect x="146" y="86" width="80" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="186" y="108" text-anchor="middle" font-size="12" fill="#3a5a30">[4]</text>
  <text x="186" y="126" text-anchor="middle" font-size="9.5" fill="#666">第 2 段</text>

  <text x="430" y="76" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">整体放在 [3] 之后：段编号整体 +1</text>
  <rect x="270" y="86" width="70" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="305" y="108" text-anchor="middle" font-size="12" fill="#3a4a66">[3]</text>
  <text x="305" y="126" text-anchor="middle" font-size="9.5" fill="#666">第 1 段</text>
  <rect x="352" y="86" width="70" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="387" y="108" text-anchor="middle" font-size="12" fill="#8a6a20">[1]</text>
  <text x="387" y="126" text-anchor="middle" font-size="9.5" fill="#666">第 2 段</text>
  <rect x="434" y="86" width="70" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="469" y="108" text-anchor="middle" font-size="12" fill="#8a6a20">[4]</text>
  <text x="469" y="126" text-anchor="middle" font-size="9.5" fill="#666">第 3 段</text>

  <path d="M 226 110 L 266 110" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="246" y="102" text-anchor="middle" font-size="9.5" fill="#b85450">+ k</text>

  <rect x="60" y="158" width="440" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="10" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">以 [4] 为例：独立时 (8+1)×6 = 54，变成第 2 段后 (8+2)×6 = 60</text>
  <text x="280" y="199" text-anchor="middle" font-size="10.5" fill="#777">每段只多出 k × 自己的 cost 和 ⇒ 整个后缀合计多出 k × 后缀 cost 和</text>

  <rect x="60" y="232" width="200" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="254" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">后缀 cost 之和</text>
  <text x="160" y="274" text-anchor="middle" font-size="11" fill="#3a4a66">C[n] − C[j+1]</text>
  <text x="160" y="291" text-anchor="middle" font-size="9.5" fill="#888">例：[4] 之后为 6</text>

  <rect x="300" y="232" width="200" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="254" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">编号增量代价</text>
  <text x="400" y="274" text-anchor="middle" font-size="11" fill="#8a6a20">k × ( C[n] − C[j+1] )</text>
  <text x="400" y="291" text-anchor="middle" font-size="9.5" fill="#888">例：1 × 6 = 6</text>

  <rect x="80" y="316" width="400" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="337" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">dp[i] = min over j ≥ i [ (P[j] + k)·(C[j+1] − C[i]) + dp[j+1] + k·(C[n] − C[j+1]) ]</text>
  <text x="280" y="355" text-anchor="middle" font-size="10" fill="#666">第一段 / 余下后缀 / 编号增量，三块恰好拼出完整划分</text>
</svg>
