<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：后序遍历，自底向上合并距离直方图</text>
  <path d="M 130 38 Q 320 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="120" y="52" width="140" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="190" y="70" text-anchor="middle" font-size="12.5" fill="#34506e" font-weight="bold">进入 dfs(node)</text>
  <path d="M 190 80 L 190 96" stroke="#8a7a4a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <path d="M 190 96 L 245 124 L 190 152 L 135 124 Z" fill="#fafafa" stroke="#446688" stroke-width="1.6" rx="3"/>
  </g>
  <text x="190" y="128" text-anchor="middle" font-size="11.5" fill="#34506e" font-weight="bold">node 为空？</text>
  <path d="M 245 124 L 288 124" stroke="#8a7a4a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="258" y="116" text-anchor="middle" font-size="10.5" fill="#8f3830">是</text>
  <g filter="url(#sk)">
    <rect x="292" y="110" width="108" height="28" rx="8" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.4"/>
  </g>
  <text x="346" y="128" text-anchor="middle" font-size="11.5" fill="#888">返回全 0 数组</text>

  <path d="M 190 152 L 190 168" stroke="#8a7a4a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="202" y="164" text-anchor="start" font-size="10.5" fill="#8f3830">否</text>

  <g filter="url(#sk)">
    <path d="M 190 168 L 245 196 L 190 224 L 135 196 Z" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="190" y="200" text-anchor="middle" font-size="11.5" fill="#2e5a24" font-weight="bold">叶子结点？</text>
  <path d="M 245 196 L 288 196" stroke="#8a7a4a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="258" y="188" text-anchor="middle" font-size="10.5" fill="#8f3830">是</text>
  <g filter="url(#sk)">
    <rect x="292" y="172" width="150" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="367" y="192" text-anchor="middle" font-size="11.5" fill="#2e5a24" font-weight="bold">返回 [1, 0, …, 0]</text>
  <text x="367" y="210" text-anchor="middle" font-size="10.5" fill="#66775f">自己到自己的距离为 0</text>

  <path d="M 190 224 L 190 240" stroke="#8a7a4a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="202" y="236" text-anchor="start" font-size="10.5" fill="#8f3830">否</text>

  <g filter="url(#sk)">
    <rect x="80" y="244" width="220" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="190" y="263" text-anchor="middle" font-size="11.5" fill="#34506e" font-weight="bold">L = dfs(left)，R = dfs(right)</text>
  <path d="M 190 274 L 190 292" stroke="#8a7a4a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="62" y="296" width="256" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="190" y="318" text-anchor="middle" font-size="11.5" fill="#8f3830" font-weight="bold">跨侧配对：若 (i+1) + (j+1) ≤ distance</text>
  <text x="190" y="338" text-anchor="middle" font-size="11.5" fill="#8f3830" font-weight="bold">则 ans += L[i] × R[j]</text>
  <path d="M 190 352 L 190 370" stroke="#8a7a4a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="62" y="374" width="256" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="190" y="396" text-anchor="middle" font-size="11.5" fill="#8a6415" font-weight="bold">合并上移：cnt[d+1] = L[d] + R[d]</text>
  <text x="190" y="416" text-anchor="middle" font-size="11" fill="#8a6415">下标超过 distance 的格子直接丢弃</text>
  <path d="M 190 430 L 190 448" stroke="#8a7a4a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="140" y="452" width="100" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="190" y="470" text-anchor="middle" font-size="12" fill="#34506e" font-weight="bold">返回 cnt</text>

  <g filter="url(#sk)">
    <rect x="464" y="60" width="164" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="546" y="84" text-anchor="middle" font-size="12.5" fill="#2e5a24" font-weight="bold">为什么不重不漏</text>
  <text x="546" y="106" text-anchor="middle" font-size="10.5" fill="#2e5a24">好对 {u, v} 分属 LCA 的左右两侧</text>
  <text x="546" y="126" text-anchor="middle" font-size="10.5" fill="#2e5a24">只会在处理 LCA 的叉乘中出现一次</text>
  <text x="546" y="146" text-anchor="middle" font-size="10.5" fill="#2e5a24">在其它结点处要么同侧、要么</text>
  <text x="546" y="162" text-anchor="middle" font-size="10.5" fill="#2e5a24">根本不在同一子树里</text>

  <g filter="url(#sk)">
    <rect x="464" y="190" width="164" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="546" y="214" text-anchor="middle" font-size="12.5" fill="#34506e" font-weight="bold">下标口径</text>
  <text x="546" y="236" text-anchor="middle" font-size="10.5" fill="#34506e">L[i]：距左孩子 i 的叶子</text>
  <text x="546" y="254" text-anchor="middle" font-size="10.5" fill="#34506e">⇒ 距本结点 i+1，右侧同理</text>
  <text x="546" y="274" text-anchor="middle" font-size="10.5" fill="#34506e">跨侧对路径 = (i+1) + (j+1)</text>
  <text x="546" y="292" text-anchor="middle" font-size="10.5" fill="#34506e">每上移一层，下标整体 +1</text>

  <g filter="url(#sk)">
    <rect x="464" y="320" width="164" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="546" y="344" text-anchor="middle" font-size="12.5" fill="#8a6415" font-weight="bold">为什么能截断</text>
  <text x="546" y="366" text-anchor="middle" font-size="10.5" fill="#8a6415">距自己 &gt; distance 的叶子</text>
  <text x="546" y="384" text-anchor="middle" font-size="10.5" fill="#8a6415">在祖先处只会更远，且对方</text>
  <text x="546" y="402" text-anchor="middle" font-size="10.5" fill="#8a6415">至少还差 1 ⇒ 永远凑不成好对</text>
  <text x="546" y="422" text-anchor="middle" font-size="10.5" fill="#8a6415">（更浅 LCA 的对已在其下方</text>
  <text x="546" y="438" text-anchor="middle" font-size="10.5" fill="#8a6415">的后序遍历中数完了）</text>
</svg>
