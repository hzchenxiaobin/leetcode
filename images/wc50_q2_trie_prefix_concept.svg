<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：前缀就是字典树上的一条路径</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">插入 apple = 3、app = 2 之后，每个节点记录「以该前缀开头的键值之和」</text>

  <g filter="url(#rough2)">
    <rect x="55" y="80" width="62" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="150" y="80" width="62" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="245" y="80" width="62" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="340" y="80" width="62" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="435" y="80" width="62" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="530" y="80" width="62" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="86" y="108" text-anchor="middle" font-size="11" fill="#2b5a80">root</text>
  <text x="181" y="108" text-anchor="middle" font-size="13" fill="#2b5a80">a</text>
  <text x="276" y="108" text-anchor="middle" font-size="12" fill="#2e6e2e">ap</text>
  <text x="371" y="108" text-anchor="middle" font-size="11" fill="#7a5415">app</text>
  <text x="466" y="108" text-anchor="middle" font-size="11" fill="#2b5a80">appl</text>
  <text x="561" y="108" text-anchor="middle" font-size="10" fill="#7a5415">apple</text>

  <g stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#rough2)">
    <path d="M 117 103 L 148 103" marker-end="url(#arr)"/>
    <path d="M 212 103 L 243 103" marker-end="url(#arr)"/>
    <path d="M 307 103 L 338 103" marker-end="url(#arr)"/>
    <path d="M 402 103 L 433 103" marker-end="url(#arr)"/>
    <path d="M 497 103 L 528 103" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="55" y="132" width="62" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="150" y="132" width="62" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="245" y="132" width="62" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="340" y="132" width="62" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="435" y="132" width="62" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="530" y="132" width="62" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="86" y="150" text-anchor="middle" font-size="12" fill="#b03a3a">Σ=5</text>
  <text x="181" y="150" text-anchor="middle" font-size="12" fill="#b03a3a">Σ=5</text>
  <text x="276" y="150" text-anchor="middle" font-size="12" fill="#b03a3a">Σ=5</text>
  <text x="371" y="150" text-anchor="middle" font-size="12" fill="#b03a3a">Σ=5</text>
  <text x="466" y="150" text-anchor="middle" font-size="12" fill="#b03a3a">Σ=3</text>
  <text x="561" y="150" text-anchor="middle" font-size="12" fill="#b03a3a">Σ=3</text>

  <text x="371" y="178" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#rough2)">键 app = 2</text>
  <text x="561" y="178" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#rough2)">键 apple = 3</text>

  <g filter="url(#rough2)">
    <rect x="40" y="196" width="220" height="104" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="270" y="196" width="220" height="104" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="500" y="196" width="220" height="104" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="150" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a80">节点和定义</text>
  <text x="150" y="242" text-anchor="middle" font-size="11" fill="#2b5a80">Σ(v) = 所有以 P(v) 为前缀</text>
  <text x="150" y="262" text-anchor="middle" font-size="11" fill="#2b5a80">的键的当前值之和</text>
  <text x="150" y="286" text-anchor="middle" font-size="10" fill="#446688">P(v)：根到 v 拼出的字符串</text>

  <text x="380" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">insert：增量传播</text>
  <text x="380" y="242" text-anchor="middle" font-size="11" fill="#2e6e2e">Δ = val − 旧值（覆盖语义）</text>
  <text x="380" y="262" text-anchor="middle" font-size="11" fill="#2e6e2e">Δ 加到 key 的每个前缀节点</text>
  <text x="380" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a">缺节点就新建，初始 Σ = 0</text>

  <text x="610" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">sum：沿路径下沉</text>
  <text x="610" y="242" text-anchor="middle" font-size="11" fill="#7a5415">走完 |prefix| 步，读末节点 Σ</text>
  <text x="610" y="262" text-anchor="middle" font-size="11" fill="#7a5415">路径断开 ⇒ 没有键匹配，返回 0</text>
  <text x="610" y="286" text-anchor="middle" font-size="10" fill="#d6a040">不遍历子树，O(|prefix|)</text>

  <g filter="url(#rough2)">
    <rect x="40" y="318" width="680" height="52" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.4" stroke-dasharray="7 5"/>
  </g>
  <text x="380" y="340" text-anchor="middle" font-size="12" fill="#b03a3a">sum("ap") 读到节点 ap 的 Σ = 3 + 2 = 5</text>
  <text x="380" y="360" text-anchor="middle" font-size="10" fill="#666">appl、apple 不是 ap 的直接终结点，但都在 ap 的子树里，值已被计入 Σ(ap)</text>
</svg>
