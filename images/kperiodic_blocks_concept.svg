<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="430" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：按 k 切块归桶，保留出现最多的块</text>
  <text x="270" y="48" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">word = "leetcoleet"，k = 2 → 切成 m = 5 个块，槽位起点均为 k 的倍数</text>

  <!-- blocks row -->
  <g filter="url(#rough2)">
    <rect x="86" y="64" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <rect x="162" y="64" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="238" y="64" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5"/>
    <rect x="314" y="64" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <rect x="390" y="64" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <text x="118" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">le</text>
    <text x="194" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">et</text>
    <text x="270" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">co</text>
    <text x="346" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">le</text>
    <text x="422" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">et</text>
  </g>
  <g filter="url(#rough2)">
    <text x="118" y="124" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="194" y="124" text-anchor="middle" font-size="10" fill="#888">2</text>
    <text x="270" y="124" text-anchor="middle" font-size="10" fill="#888">4</text>
    <text x="346" y="124" text-anchor="middle" font-size="10" fill="#888">6</text>
    <text x="422" y="124" text-anchor="middle" font-size="10" fill="#888">8</text>
  </g>

  <!-- arrow to buckets -->
  <path d="M240,140 L240,160" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="156" font-size="11" fill="#4a7a3a" filter="url(#rough2)">按块内容哈希归桶计数</text>

  <!-- buckets -->
  <g filter="url(#rough2)">
    <rect x="70" y="170" width="130" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
    <rect x="205" y="170" width="130" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8"/>
    <rect x="340" y="170" width="130" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)">
    <text x="135" y="192" text-anchor="middle" font-size="10" fill="#888">块</text>
    <text x="135" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">le</text>
    <text x="135" y="238" text-anchor="middle" font-size="11" fill="#446688">出现 2 次</text>
    <text x="270" y="192" text-anchor="middle" font-size="10" fill="#888">块</text>
    <text x="270" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">et</text>
    <text x="270" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a">出现 2 次</text>
    <text x="405" y="192" text-anchor="middle" font-size="10" fill="#888">块</text>
    <text x="405" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">co</text>
    <text x="405" y="238" text-anchor="middle" font-size="11" fill="#d6a040">出现 1 次</text>
  </g>
  <text x="270" y="274" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">le 与 et 并列最大（各 2 次）→ 保留谁都行，答案只看最大频率的「值」</text>

  <!-- formula box -->
  <g filter="url(#rough2)">
    <rect x="135" y="290" width="270" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
  </g>
  <text x="270" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">ans = m − max cnt = 5 − 2 = <tspan fill="#b85450">3</tspan></text>

  <!-- invariant note -->
  <g filter="url(#rough2)">
    <rect x="36" y="356" width="468" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="270" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">块结构不变式：i、j 均为 k 的倍数 → 槽位 0, k, 2k, … 永远对齐</text>
  <text x="270" y="400" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">一次操作 = 把一个槽的内容整体换成另一个槽的当前内容（槽位不动）</text>
</svg>
