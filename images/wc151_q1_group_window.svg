<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 412" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="412" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按姓名分组 → 组内按时间排序 → 滑动时间窗口</text>
  <text x="290" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">窗口 = 与该笔交易时间差不超过 60 分钟的所有同名交易，天然包含它自己</text>

  <rect x="24" y="66" width="156" height="94" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="38" y="88" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 解析</text>
  <text x="38" y="110" font-size="10" fill="#555" filter="url(#rough2)">按逗号切成 4 段</text>
  <text x="38" y="128" font-size="10" fill="#555" filter="url(#rough2)">name / time / amount / city</text>
  <text x="38" y="148" font-size="10" fill="#888" filter="url(#rough2)">time、amount 转 int</text>

  <path d="M 186 113 L 206 113" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="212" y="66" width="156" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="226" y="88" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② 按 name 分桶</text>
  <text x="226" y="110" font-size="10" fill="#555" filter="url(#rough2)">哈希表：name → 下标列表</text>
  <text x="226" y="128" font-size="10" fill="#555" filter="url(#rough2)">不同姓名互不干扰</text>
  <text x="226" y="148" font-size="10" fill="#888" filter="url(#rough2)">规则 B 只比较同名交易</text>

  <path d="M 374 113 L 394 113" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="400" y="66" width="156" height="94" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="88" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">③ 组内按 time 排序</text>
  <text x="414" y="110" font-size="10" fill="#555" filter="url(#rough2)">时间有序后，近邻交易</text>
  <text x="414" y="128" font-size="10" fill="#555" filter="url(#rough2)">就是一段连续区间</text>
  <text x="414" y="148" font-size="10" fill="#888" filter="url(#rough2)">双指针滑窗即可覆盖</text>

  <text x="30" y="200" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">alice 组（按 time 升序，共 4 笔）</text>

  <rect x="54" y="206" width="328" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"
        stroke-dasharray="6 4" opacity="0.85" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="214" width="96" height="58" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="166" y="214" width="96" height="58" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="272" y="214" width="96" height="58" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="378" y="214" width="96" height="58" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">
    <text x="108" y="238">t = 20</text>
    <text x="214" y="238">t = 50</text>
    <text x="320" y="238">t = 95</text>
    <text x="426" y="238" fill="#888">t = 200</text>
  </g>
  <g font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">
    <text x="108" y="258">mtv</text>
    <text x="214" y="258">mtv</text>
    <text x="320" y="258">beijing</text>
    <text x="426" y="258" fill="#999">mtv</text>
  </g>

  <g font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">
    <text x="108" y="296">l = 0</text>
    <text x="426" y="296" fill="#b85450">r = 3（出窗）</text>
  </g>
  <path d="M 108 284 L 108 290" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 426 284 L 426 290" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="312" width="520" height="84" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="334" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">判定技巧：窗口内「城市种数」≥ 2 就足以判定无效</text>
  <text x="44" y="354" font-size="10" fill="#555" filter="url(#rough2)">窗口必含当前交易本身，所以种数 ≥ 2 ⟺ 窗口里存在一笔与它城市不同的同名交易；</text>
  <text x="44" y="372" font-size="10" fill="#555" filter="url(#rough2)">以第 2 笔（t = 50）为例，窗口是 20 / 50 / 95，城市集合 {mtv, beijing}，种数 = 2 → 无效。</text>
  <text x="44" y="390" font-size="10" fill="#888" filter="url(#rough2)">两个指针都只向右移动，每笔交易的加入、移出各一次，组内总代价线性。</text>
</svg>
