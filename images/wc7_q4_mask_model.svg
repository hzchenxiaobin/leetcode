<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">位掩码建模：一个 5 位掩码确定一个缩写</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">target = "apple"，位 1 = 保留该字符，位 0 = 被数字吞掉；连续的 0 合并成一段数字</text>

  <g font-size="20" text-anchor="middle" fill="#3a4a66" filter="url(#rough2)">
    <rect x="174" y="76" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="202" y="102">a</text>
    <rect x="238" y="76" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="266" y="102">p</text>
    <rect x="302" y="76" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="330" y="102">p</text>
    <rect x="366" y="76" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="394" y="102">l</text>
    <rect x="430" y="76" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="458" y="102">e</text>
  </g>

  <g font-size="13" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <rect x="174" y="118" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="202" y="136" fill="#3a4a66">1</text>
    <rect x="238" y="118" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="266" y="136" fill="#8a6a20">0</text>
    <rect x="302" y="118" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="330" y="136" fill="#8a6a20">0</text>
    <rect x="366" y="118" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="394" y="136" fill="#3a4a66">1</text>
    <rect x="430" y="118" width="56" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="458" y="136" fill="#8a6a20">0</text>
  </g>

  <g font-size="10" text-anchor="middle" fill="#888" filter="url(#rough2)">
    <text x="202" y="160">0</text>
    <text x="266" y="160">1</text>
    <text x="330" y="160">2</text>
    <text x="394" y="160">3</text>
    <text x="458" y="160">4</text>
  </g>

  <g font-size="18" text-anchor="middle" filter="url(#rough2)">
    <rect x="174" y="180" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="202" y="206" fill="#3a5a30">a</text>
    <rect x="238" y="180" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="298" y="206" fill="#8a6a20">2</text>
    <rect x="366" y="180" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="394" y="206" fill="#3a5a30">l</text>
    <rect x="430" y="180" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="458" y="206" fill="#8a6a20">1</text>
  </g>

  <text x="500" y="196" font-size="11" fill="#555" filter="url(#rough2)">→ 缩写</text>
  <text x="500" y="214" font-size="11" fill="#555" filter="url(#rough2)">"a2l1"，长度 4</text>

  <rect x="40" y="240" width="580" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="262" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">冲突判定：也把每个等长词典词压成掩码 Mk(w)</text>
  <text x="56" y="284" font-size="10.5" fill="#555" filter="url(#rough2)">Mk(w) 第 i 位 = 1  ⇔  w[i] == target[i]；数字段只规定跳过多少字符，不约束字符内容</text>
  <text x="56" y="304" font-size="10.5" fill="#555" filter="url(#rough2)">所以 A(S) 同时是 w 的缩写  ⇔  S ⊆ Mk(w)（S 中所有保留位在 w 上也都相同）</text>
  <text x="56" y="324" font-size="10.5" fill="#555" filter="url(#rough2)">本图 S = {0,3} = 1 0 0 1 0；若词典词 "blade" 只在第 4 位相同，则 Mk = {4}</text>
  <text x="56" y="346" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">S ⊄ Mk ⇒ 不冲突；判定式 S &amp; ~Mk == 0 即冲突，一次位运算搞定</text>
</svg>
