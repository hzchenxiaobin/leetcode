<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">DFS：栈 + 入栈即标记，计数可达房间</text>

  <g filter="url(#rough2)">
    <rect x="120" y="42" width="280" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="63" text-anchor="middle" font-size="12" fill="#2f4a66">seen = [false]*n；seen[0]=true；栈 = [0]</text>
    <path d="M260,74 L260,92" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

    <polygon points="260,92 352,124 260,156 168,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="120" text-anchor="middle" font-size="11" fill="#7a5a10">栈非空？</text>
    <text x="260" y="136" text-anchor="middle" font-size="11" fill="#7a5a10">否 → 结束</text>

    <path d="M260,156 L260,178" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M352,124 L400,124 L400,178" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="410" y="150" font-size="10" fill="#666">是</text>

    <rect x="120" y="178" width="280" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="199" text-anchor="middle" font-size="12" fill="#2f4a66">弹出 u；遍历 rooms[u] 里的每把钥匙 v</text>
    <path d="M260,210 L260,228" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

    <polygon points="260,228 348,258 260,288 172,258" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="260" y="262" text-anchor="middle" font-size="11" fill="#2f5527">seen[v] 已为真？</text>
    <path d="M348,258 L400,258 L400,318" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="410" y="284" font-size="10" fill="#666">是，跳过</text>

    <path d="M260,288 L260,310" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="272" y="304" font-size="10" fill="#666">否</text>

    <rect x="120" y="310" width="280" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="260" y="331" text-anchor="middle" font-size="12" fill="#8a3020">seen[v]=true；cnt+=1；v 入栈</text>
    <path d="M260,342 L260,360" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="130" y="360" width="260" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="380" text-anchor="middle" font-size="12" fill="#7a5a10">返回 cnt == n</text>
  </g>
</svg>
