<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：大小写折到同一「字母槽」——双真槽 = 兼具大小写</text>
  <path d="M 150 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 顶部：s = "arRAzFif" -->
  <text x="148" y="80" text-anchor="end" font-size="13" font-weight="bold" fill="#2b2b2b">s =</text>
  <g filter="url(#sk)"><rect x="156" y="58" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="173" y="81" text-anchor="middle" font-size="14" fill="#33455e">a</text>
  <g filter="url(#sk)"><rect x="192" y="58" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="209" y="81" text-anchor="middle" font-size="14" fill="#33455e">r</text>
  <g filter="url(#sk)"><rect x="228" y="58" width="34" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="245" y="81" text-anchor="middle" font-size="14" fill="#7a5415">R</text>
  <g filter="url(#sk)"><rect x="264" y="58" width="34" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="281" y="81" text-anchor="middle" font-size="14" fill="#7a5415">A</text>
  <g filter="url(#sk)"><rect x="300" y="58" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="317" y="81" text-anchor="middle" font-size="14" fill="#33455e">z</text>
  <g filter="url(#sk)"><rect x="336" y="58" width="34" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="353" y="81" text-anchor="middle" font-size="14" fill="#7a5415">F</text>
  <g filter="url(#sk)"><rect x="372" y="58" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="389" y="81" text-anchor="middle" font-size="14" fill="#33455e">i</text>
  <g filter="url(#sk)"><rect x="408" y="58" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="425" y="81" text-anchor="middle" font-size="14" fill="#33455e">f</text>

  <!-- 分派箭头 -->
  <path d="M 240 98 Q 208 118 186 136" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 358 98 Q 392 120 448 136" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 两个出现集 -->
  <g filter="url(#sk)"><rect x="64" y="140" width="240" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="184" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">小写出现集 {a, f, i, r, z}</text>
  <text x="184" y="182" text-anchor="middle" font-size="11.5" fill="#444">折算字母序号 → {0, 5, 8, 17, 25}</text>

  <g filter="url(#sk)"><rect x="336" y="140" width="240" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="456" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">大写出现集 {A, F, R}</text>
  <text x="456" y="182" text-anchor="middle" font-size="11.5" fill="#444">折算字母序号 → {0, 5, 17}</text>

  <!-- 26 槽条 -->
  <text x="89" y="226" font-size="10.5" fill="#888">26 个「字母槽」（槽号 i = 字母序号，'a'+i 与 'A'+i 共用槽 i）</text>
  <g filter="url(#sk)"><rect x="89" y="232" width="17" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="106" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="123" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="140" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="157" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="174" y="232" width="17" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="191" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="208" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="225" y="232" width="17" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="242" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="259" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="276" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="293" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="310" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="327" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="344" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="361" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="378" y="232" width="17" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="395" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="412" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="429" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="446" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="463" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="480" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="497" y="232" width="17" height="22" rx="3" fill="#fdfcf7" stroke="#c7d2de" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="514" y="232" width="17" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><text x="97" y="247" text-anchor="middle" font-size="9.5" fill="#a04a48">A</text></g>
  <g filter="url(#sk)"><text x="114" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">B</text></g>
  <g filter="url(#sk)"><text x="131" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">C</text></g>
  <g filter="url(#sk)"><text x="148" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">D</text></g>
  <g filter="url(#sk)"><text x="165" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">E</text></g>
  <g filter="url(#sk)"><text x="182" y="247" text-anchor="middle" font-size="9.5" fill="#a04a48">F</text></g>
  <g filter="url(#sk)"><text x="199" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">G</text></g>
  <g filter="url(#sk)"><text x="216" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">H</text></g>
  <g filter="url(#sk)"><text x="233" y="247" text-anchor="middle" font-size="9.5" fill="#2e5e2e">I</text></g>
  <g filter="url(#sk)"><text x="250" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">J</text></g>
  <g filter="url(#sk)"><text x="267" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">K</text></g>
  <g filter="url(#sk)"><text x="284" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">L</text></g>
  <g filter="url(#sk)"><text x="301" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">M</text></g>
  <g filter="url(#sk)"><text x="318" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">N</text></g>
  <g filter="url(#sk)"><text x="335" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">O</text></g>
  <g filter="url(#sk)"><text x="352" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">P</text></g>
  <g filter="url(#sk)"><text x="369" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">Q</text></g>
  <g filter="url(#sk)"><text x="386" y="247" text-anchor="middle" font-size="9.5" fill="#a04a48">R</text></g>
  <g filter="url(#sk)"><text x="403" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">S</text></g>
  <g filter="url(#sk)"><text x="420" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">T</text></g>
  <g filter="url(#sk)"><text x="437" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">U</text></g>
  <g filter="url(#sk)"><text x="454" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">V</text></g>
  <g filter="url(#sk)"><text x="471" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">W</text></g>
  <g filter="url(#sk)"><text x="488" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">X</text></g>
  <g filter="url(#sk)"><text x="505" y="247" text-anchor="middle" font-size="9.5" fill="#9aa7b4">Y</text></g>
  <g filter="url(#sk)"><text x="522" y="247" text-anchor="middle" font-size="9.5" fill="#2e5e2e">Z</text></g>

  <!-- 图例 -->
  <g filter="url(#sk)"><rect x="89" y="262" width="12" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="106" y="272" font-size="10.5" fill="#555">仅小写</text>
  <g filter="url(#sk)"><rect x="152" y="262" width="12" height="12" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="169" y="272" font-size="10.5" fill="#555">仅大写</text>
  <g filter="url(#sk)"><rect x="215" y="262" width="12" height="12" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="232" y="272" font-size="10.5" fill="#555">双真 = 兼具大小写</text>

  <!-- R 槽标注 -->
  <path d="M 386 286 V 258" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="386" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">最大双真下标 i = 17</text>
  <text x="386" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" font-family="monospace">→ 'A' + 17 = 'R' 即答案</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="64" y="336" width="544" height="48" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="336" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">兼具大小写 ⟺ 槽 i 双真（lower[i] ∧ upper[i]）；最好 = 双真槽中 i 最大</text>
  <text x="336" y="376" text-anchor="middle" font-size="11" fill="#555">ASCII 里 'a'−'A' 恒为 32：小写减 'a'、大写减 'A' 落到同一槽 —— 对齐是「双真」有意义的前提</text>

  <text x="320" y="394" text-anchor="middle" font-size="11" fill="#888">一趟 O(n) 扫描收齐全部出现性，再常数 26 步倒序 —— 把「兼具 + 最好」压成两次查表</text>
</svg>
