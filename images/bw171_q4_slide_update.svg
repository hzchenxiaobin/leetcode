<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">滑动一格：inv(W') = inv(W) − A + B</text>

  <!-- 窗口 W -->
  <text x="56" y="62" font-size="11" fill="#446688" filter="url(#rough2)">W</text>
  <rect x="60" y="70" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="88" y="97" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="120" y="70" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="148" y="97" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">m₁</text>
  <rect x="180" y="70" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="208" y="97" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">m₂</text>
  <rect x="240" y="70" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="268" y="97" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">…</text>

  <!-- 窗口 W' -->
  <text x="56" y="152" font-size="11" fill="#4a7a3a" filter="url(#rough2)">W'</text>
  <rect x="120" y="160" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="148" y="187" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">m₁</text>
  <rect x="180" y="160" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="208" y="187" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">m₂</text>
  <rect x="240" y="160" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="268" y="187" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">…</text>
  <rect x="300" y="160" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="328" y="187" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>

  <!-- 删除 a -->
  <path d="M88,116 L118,154" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrM)" filter="url(#rough2)"/>
  <text x="34" y="136" font-size="10" fill="#b85450" filter="url(#rough2)">删 a，减去 A</text>

  <!-- 加入 b -->
  <path d="M328,152 L328,116" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>
  <text x="386" y="136" font-size="10" fill="#4a7a3a" filter="url(#rough2)">加 b，加上 B</text>

  <!-- A B 定义 -->
  <rect x="50" y="220" width="200" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="150" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">A = #{ j ∈ M : nums[j] &lt; a }</text>
  <text x="150" y="258" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">a 只能当「左且大」的一方</text>

  <rect x="266" y="220" width="204" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="368" y="240" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">B = #{ j ∈ M : nums[j] &gt; b }</text>
  <text x="368" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">b 只能当「右且小」的一方</text>

  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">M 内部的逆序对两窗口共有，抵消；只差 A 与 B</text>
  <text x="260" y="314" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">窗口大小 k−1 的「M」用树状数组维护</text>
</svg>
