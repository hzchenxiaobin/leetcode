<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 352" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="352" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">排序后：左边花能量换分，右边卖分换能量</text>
  <rect x="96" y="96" width="84" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">100</text>
  <rect x="200" y="96" width="84" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">200</text>
  <rect x="304" y="96" width="84" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="346" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">300</text>
  <rect x="408" y="96" width="84" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">400</text>
  <path d="M 60 118 L 92 118" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 524 118 L 492 118" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="66" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="518" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">j</text>
  <rect x="24" y="176" width="240" height="88" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="200" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">power >= tokens[i]</text>
  <text x="144" y="222" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">朝上：power -= tokens[i]</text>
  <text x="144" y="242" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">score += 1，i += 1</text>
  <rect x="316" y="176" width="240" height="88" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="436" y="200" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否则且 score > 0</text>
  <text x="436" y="222" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">朝下：power += tokens[j]</text>
  <text x="436" y="242" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">score -= 1，j -= 1</text>
  <text x="300" y="292" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">两种动作都只在「最便宜」或「最贵」的剩余令牌上做</text>
  <text x="300" y="316" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">随时用 best = max(best, score) 记录历史最高分</text>
  <text x="300" y="338" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">都不满足（能量不够且没分）⇒ 结束</text>
</svg>
