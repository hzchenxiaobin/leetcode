<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">得分 = 左半 '0' 的个数 + 右半 '1' 的个数</text>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">以 s = "011101"，分割点在第 1 个字符后为例</text>

  <rect x="84" y="80" width="72" height="64" fill="none" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <rect x="144" y="80" width="288" height="64" fill="none" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>

  <rect x="94" y="88" width="52" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="120" text-anchor="middle" font-size="22" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <rect x="150" y="88" width="52" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="120" text-anchor="middle" font-size="22" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>

  <rect x="206" y="88" width="52" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="120" text-anchor="middle" font-size="22" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>

  <rect x="262" y="88" width="52" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="120" text-anchor="middle" font-size="22" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>

  <rect x="318" y="88" width="52" height="48" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="120" text-anchor="middle" font-size="22" fill="#999999" filter="url(#rough2)">0</text>

  <rect x="374" y="88" width="52" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="120" text-anchor="middle" font-size="22" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>

  <line x1="148" y1="70" x2="148" y2="156" stroke="#b85450" stroke-width="2" stroke-dasharray="6,5" filter="url(#rough2)"/>
  <text x="156" y="70" font-size="14" fill="#b85450" filter="url(#rough2)">✂</text>
  <text x="148" y="172" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">分割点</text>

  <rect x="46" y="192" width="148" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="120" y="210" text-anchor="middle" font-size="12" fill="#2f5424" filter="url(#rough2)">左半：只数 '0'</text>
  <text x="120" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">共 1 个 → +1</text>

  <rect x="214" y="192" width="148" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="288" y="210" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">右半：只数 '1'</text>
  <text x="288" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">共 4 个 → +4</text>

  <text x="260" y="262" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（左半的 '1' 与右半灰色的 '0' 都不计分）</text>

  <rect x="92" y="280" width="336" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="15" fill="#2a4660" filter="url(#rough2)">score = 左半 0 数 + 右半 1 数 = 1 + 4 = 5</text>
</svg>
