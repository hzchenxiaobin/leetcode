<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，升则续累、断则重启</text>

  <!-- init box -->
  <rect x="150" y="44" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">cur = ans = nums[0]，i = 1</text>

  <path d="M 260 82 L 260 102" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1: loop condition, center (260,135) -->
  <polygon points="260,104 322,135 260,166 198,135" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <!-- no -> return -->
  <path d="M 322 135 L 388 135" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="127" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>
  <rect x="392" y="115" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="442" y="140" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- yes -> diamond 2 -->
  <path d="M 260 166 L 260 188" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="275" y="182" font-size="10.5" fill="#888" filter="url(#rough2)">是</text>

  <!-- diamond 2: compare, center (260,225) -->
  <polygon points="260,190 350,225 260,260 170,225" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">nums[i] &gt; nums[i-1]</text>
  <text x="260" y="240" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">?</text>

  <!-- yes -> cur += nums[i] (left, green) -->
  <path d="M 170 225 L 135 225 L 135 296" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="217" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="52" y="300" width="166" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="135" y="323" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cur += nums[i]（续接）</text>

  <!-- no -> cur = nums[i] (right, red) -->
  <path d="M 350 225 L 385 225 L 385 296" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="370" y="217" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="302" y="300" width="166" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="385" y="323" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">cur = nums[i]（重启）</text>

  <!-- merge to max box -->
  <path d="M 135 336 L 135 352 L 215 352" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 385 336 L 385 352 L 305 352" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="185" y="336" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">ans = max(ans, cur)</text>

  <!-- loop back: i += 1 -->
  <path d="M 185 353 L 96 353 L 96 135 L 194 135" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="232" width="66" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="63" y="250" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i += 1</text>

  <!-- footer note -->
  <text x="260" y="396" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每步只做一次相邻比较：续接/重启后立刻用 cur 刷新 ans，n = 1 时循环不执行直接返回 nums[0]</text>
</svg>
