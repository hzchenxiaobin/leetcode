  <!-- explanation -->
  <text x="290" y="254" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">cnt₁ / cnt₀ 即时反映「以当前字符结尾的段长」：本车道 +1、对侧清 0（红色）</text>

  <!-- note boxes -->
  <rect x="28" y="268" width="270" height="78" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="288" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">跨段事件（虚线处）</text>
  <text x="163" y="306" text-anchor="middle" font-size="10.5" fill="#445" filter="url(#rough2)">i=2 / i=4：1→0，cnt₁ 清 0、cnt₀ 起步</text>
  <text x="163" y="322" text-anchor="middle" font-size="10.5" fill="#445" filter="url(#rough2)">i=7：0→1，cnt₀ 清 0、cnt₁ 起步</text>
  <text x="163" y="338" text-anchor="middle" font-size="10.5" fill="#445" filter="url(#rough2)">对侧清零 = 段被切断，互不累加</text>
  <rect x="314" y="268" width="240" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="434" y="288" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">max 更新时刻（橙色）</text>
  <text x="434" y="306" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">max₁：i=1 升到 2（"11"）</text>
  <text x="434" y="322" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">max₀：i=6 升到 3（"000"）</text>
  <text x="434" y="338" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">每步即时更新，末段自动计入</text>

  <!-- summary strip -->
  <rect x="32" y="360" width="516" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="380" text-anchor="middle" font-size="12" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">返回 max₁ &gt; max₀，即 2 &gt; 3 不成立 → false ⭐</text>
  <text x="290" y="396" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">时间 O(n)，空间 O(1)，全程无「末段补结算」隐患</text>
</svg>
