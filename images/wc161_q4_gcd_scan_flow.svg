<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">一次扫描：g 单调不增，碰到 1 立刻返回</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">不变量：处理到第 i 个元素时，g = gcd(nums[0..i])</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="60" y="80" fill="#666" font-size="10">nums</text>
    <rect x="96" y="66" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="128" y="86" fill="#3a4a66">12</text>
    <rect x="176" y="66" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="208" y="86" fill="#3a4a66">5</text>
    <rect x="256" y="66" width="64" height="30" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2" rx="5" stroke-dasharray="4 3"/>
    <text x="288" y="86" fill="#aaa">7</text>
    <rect x="336" y="66" width="64" height="30" fill="#f3f3f3" stroke="#bbb" stroke-width="1.2" rx="5" stroke-dasharray="4 3"/>
    <text x="368" y="86" fill="#aaa">23</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <path d="M 128 98 L 128 114" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <path d="M 208 98 L 208 114" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <path d="M 288 98 L 288 114" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>
    <path d="M 368 98 L 368 114" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="60" y="134" fill="#666" font-size="10">g</text>
    <rect x="96" y="118" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="128" y="138" fill="#3a5a30" font-weight="bold">12</text>
    <rect x="176" y="118" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="5"/>
    <text x="208" y="138" fill="#b85450" font-weight="bold">1</text>
    <rect x="256" y="118" width="64" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="5" stroke-dasharray="4 3"/>
    <text x="288" y="138" fill="#bbb">—</text>
    <rect x="336" y="118" width="64" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="5" stroke-dasharray="4 3"/>
    <text x="368" y="138" fill="#bbb">—</text>
  </g>

  <text x="208" y="163" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">gcd(12, 5) = 1 → 提前返回 true</text>
  <text x="352" y="163" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">7、23 不必再看</text>

  <g filter="url(#rough2)">
    <rect x="30" y="176" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="46" y="195" font-size="10" fill="#8a6a20" font-weight="bold">为什么可以提前退出：gcd 只会变小，一旦等于 1 就再也降不下去</text>
    <text x="46" y="212" font-size="9.5" fill="#555">裴蜀证书：12·3 + 5·(−7) = 1；官方示例挑的 {5, 7} 也满足 5·3 + 7·(−2) = 1</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="30" y="236" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="105" y="259" fill="#3a4a66">g ← 0</text>
    <rect x="205" y="236" width="150" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="280" y="259" fill="#3a4a66">g ← gcd(g, x)</text>
    <rect x="380" y="236" width="150" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="455" y="259" fill="#8a3a36">g == 1 ? 返回 true</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 180 254 L 200 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 355 254 L 375 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 440 274 C 462 314, 306 322, 290 280" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)"/>
  </g>
  <text x="404" y="338" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">g ≠ 1 → 取下一个 x 继续</text>

  <g filter="url(#rough2)">
    <rect x="120" y="348" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="280" y="370" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">循环结束仍无 1 → return false</text>
  </g>

  <text x="280" y="394" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">时间 O(n log V)，空间 O(1)；V = max(nums) ≤ 10^9</text>
</svg>
