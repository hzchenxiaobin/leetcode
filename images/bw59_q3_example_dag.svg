<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="46"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：n = 7，答案 4 条最短路（均为 7 分钟）</text>

  <!-- 图结构（示例 1） -->
  <g filter="url(#rough2)">
    <circle cx="120" cy="120" r="22" fill="#b85450" stroke="#8a3a34" stroke-width="2"/>
    <circle cx="60" cy="220" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="180" cy="220" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="120" cy="320" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="250" cy="320" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="40" cy="320" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">
    <text x="120" y="125">0</text><text x="60" y="125" fill="#333">4</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="60" y="225">4</text><text x="180" y="225">1</text>
    <text x="120" y="325">3</text><text x="250" y="325">5</text><text x="40" y="325">2</text>
  </g>
  <!-- 目标节点 -->
  <g filter="url(#rough2)">
    <circle cx="330" cy="220" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
  </g>
  <text x="330" y="226" font-size="14" fill="#2d5a22" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- 边（虚线 = 非最路边，实线 = 最路边） -->
  <g filter="url(#rough2)">
    <line x1="140" y1="136" x2="312" y2="212" stroke="#b85450" stroke-width="2.5"/>
    <line x1="126" y1="141" x2="70" y2="199" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="114" y1="141" x2="172" y2="199" stroke="#4a7a3a" stroke-width="2.2"/>
    <line x1="64" y1="242" x2="112" y2="298" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="78" y1="220" x2="312" y2="220" stroke="#4a7a3a" stroke-width="2.2"/>
    <line x1="140" y1="220" x2="112" y2="298" stroke="#4a7a3a" stroke-width="2.2"/>
    <line x1="136" y1="332" x2="228" y2="332" stroke="#4a7a3a" stroke-width="2.2"/>
    <line x1="141" y1="316" x2="236" y2="292" stroke="#4a7a3a" stroke-width="2.2"/>
    <line x1="316" y1="240" x2="258" y2="298" stroke="#4a7a3a" stroke-width="2.2"/>
    <line x1="322" y1="242" x2="128" y2="298" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="58" y1="242" x2="46" y2="298" stroke="#4a7a3a" stroke-width="2.2"/>
    <line x1="252" y1="318" x2="60" y2="322" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#666">
    <text x="230" y="160">7</text>
    <text x="76" y="164">5</text>
    <text x="148" y="164">2</text>
    <text x="66" y="276">3</text>
    <text x="196" y="212">2</text>
    <text x="120" y="262">3</text>
    <text x="176" y="324">3</text>
    <text x="184" y="296">1</text>
    <text x="286" y="276">1</text>
    <text x="222" y="276">3</text>
    <text x="42" y="274">1</text>
    <text x="148" y="342">1</text>
  </g>
  <text x="120" y="380" font-size="12" fill="#2d5a22" filter="url(#rough2)" text-anchor="middle">绿实线 = 最路边（dist[u]+w = dist[v]）</text>
  <text x="120" y="398" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="middle">灰虚线 = 不在最短路 DAG 上的边</text>

  <!-- 右：DAG 计数表 -->
  <text x="452" y="72" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">最短路计数（出堆序）</text>
  <g filter="url(#rough2)">
    <rect x="378" y="84" width="148" height="26" fill="#446688" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="bold">
    <text x="408" y="101">节点 v</text><text x="452" y="101">dist</text><text x="500" y="101">ways</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="378" y="110" width="148" height="24" fill="#fce4ec" rx="4"/>
    <rect x="378" y="134" width="148" height="24" fill="#f4f8ff" rx="4"/>
    <rect x="378" y="158" width="148" height="24" fill="#fce4ec" rx="4"/>
    <rect x="378" y="182" width="148" height="24" fill="#f4f8ff" rx="4"/>
    <rect x="378" y="206" width="148" height="24" fill="#fce4ec" rx="4"/>
    <rect x="378" y="230" width="148" height="24" fill="#f4f8ff" rx="4"/>
    <rect x="378" y="254" width="148" height="24" fill="#e6f4ea" rx="4" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <text x="408" y="126">0</text><text x="452" y="126">0</text><text x="500" y="126">1</text>
    <text x="408" y="150">1</text><text x="452" y="150">2</text><text x="500" y="150">1</text>
    <text x="408" y="174">4</text><text x="452" y="174">5</text><text x="500" y="174">1</text>
    <text x="408" y="198">2</text><text x="452" y="198">5</text><text x="500" y="198">1</text>
    <text x="408" y="222">3</text><text x="452" y="222">5</text><text x="500" y="222">1</text>
    <text x="408" y="246">5</text><text x="452" y="246">6</text><text x="500" y="246">2</text>
    <text x="408" y="270" fill="#2d5a22" font-weight="bold">6</text><text x="452" y="270" fill="#2d5a22" font-weight="bold">7</text><text x="500" y="270" fill="#2d5a22" font-weight="bold">4</text>
  </g>
  <rect x="378" y="292" width="148" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11.5" fill="#7a5c1e">
    <text x="452" y="314" text-anchor="middle" font-weight="bold">节点 6 的计数来源：</text>
    <text x="452" y="334" text-anchor="middle">直接边 0→6：ways 1</text>
    <text x="452" y="352" text-anchor="middle">经 4：1；经 5：1+1 = 2</text>
  </g>
  <text x="452" y="386" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)" text-anchor="middle">1 + 3 = 4 条 ✓</text>
</svg>
