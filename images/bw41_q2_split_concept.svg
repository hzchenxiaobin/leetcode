<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">有序 ⇒ 以 i 为界，绝对值全部脱符号</text>

  <!-- 数组条 -->
  <g filter="url(#rough2)">
    <rect x="60" y="70" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="140" y="70" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="220" y="70" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="300" y="70" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="380" y="70" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="100" y="97">nums[j]</text>
    <text x="180" y="97">nums[i]</text>
    <text x="260" y="97">nums[j]</text>
    <text x="340" y="97">…</text>
    <text x="420" y="97">nums[n−1]</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#888" text-anchor="middle">
    <text x="100" y="126">都 ≤ nums[i]</text>
    <text x="260" y="126">都 ≥ nums[i]</text>
  </g>

  <!-- 左侧注释 -->
  <path d="M 100 134 C 80 170, 90 200, 120 216" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="40" y="220" width="230" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#446688" text-anchor="middle">
    <text x="155" y="244">左贡献（j &lt; i）：</text>
    <text x="155" y="266">nums[i]·i − Σ nums[j]</text>
  </g>

  <!-- 右侧注释 -->
  <path d="M 380 134 C 420 170, 410 200, 380 216" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="290" y="220" width="230" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#2d5a22" text-anchor="middle">
    <text x="405" y="244">右贡献（j &gt; i）：</text>
    <text x="405" y="266">Σ nums[j] − nums[i]·(n−1−i)</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="90" y="298" width="380" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="320" font-size="13" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">三个量用前缀和 / 滚动变量 O(1) 得到 → 整体 O(n)</text>
</svg>
