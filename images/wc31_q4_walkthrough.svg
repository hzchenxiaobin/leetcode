<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：m = n = 2，maxMove = 2，起点 (0,0)</text>

  <!-- 第 1 步前 -->
  <text x="100" y="56" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">第 1 步前（dp₀）</text>
  <rect x="62" y="74" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="81" y="99" text-anchor="middle" font-size="14" fill="#2f5a26" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="100" y="74" width="38" height="38" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="119" y="99" text-anchor="middle" font-size="14" fill="#ccc" filter="url(#rough2)">0</text>
  <rect x="62" y="112" width="38" height="38" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="81" y="137" text-anchor="middle" font-size="14" fill="#ccc" filter="url(#rough2)">0</text>
  <rect x="100" y="112" width="38" height="38" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="119" y="137" text-anchor="middle" font-size="14" fill="#ccc" filter="url(#rough2)">0</text>

  <text x="100" y="172" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">出界 +2（上、左）</text>
  <text x="100" y="190" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans = 2</text>

  <path d="M 150 112 L 236 112" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="193" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">走一步</text>

  <!-- 第 2 步前 -->
  <text x="285" y="56" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">第 2 步前（dp₁）</text>
  <rect x="247" y="74" width="38" height="38" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="266" y="99" text-anchor="middle" font-size="14" fill="#ccc" filter="url(#rough2)">0</text>
  <rect x="285" y="74" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="304" y="99" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="247" y="112" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="266" y="137" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="285" y="112" width="38" height="38" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="304" y="137" text-anchor="middle" font-size="14" fill="#ccc" filter="url(#rough2)">0</text>

  <text x="285" y="172" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">出界 +4（1×2 + 1×2）</text>
  <text x="285" y="190" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans = 2 + 4 = 6</text>

  <path d="M 335 112 L 420 112" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 答案 -->
  <text x="470" y="56" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">答案</text>
  <rect x="432" y="74" width="76" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="12" filter="url(#rough2)"/>
  <text x="470" y="122" text-anchor="middle" font-size="28" fill="#2f5a26" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="470" y="172" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2 + 4 = 6</text>
  <text x="470" y="190" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">共 6 条出界路径</text>

  <text x="28" y="224" font-size="10.5" fill="#333" filter="url(#rough2)">第 1 步：起点 (0,0) 是角格 e = 2，向上、向左两步即出界 → 贡献 2；</text>
  <text x="28" y="244" font-size="10.5" fill="#333" filter="url(#rough2)">向下、向右各得 1 条界内路径，落在 (1,0) 与 (0,1)。</text>
  <text x="28" y="264" font-size="10.5" fill="#333" filter="url(#rough2)">第 2 步：(1,0)、(0,1) 也都是角格 e = 2，各有 1 条路径 → 贡献 4，累计 6。</text>

  <rect x="28" y="282" width="504" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="44" y="304" font-size="10.5" fill="#2f4460" filter="url(#rough2)">对比暴力：DFS 要展开 4^maxMove 条走法，DP 只保留 m×n 个计数；</text>
  <text x="44" y="324" font-size="10.5" fill="#2f4460" filter="url(#rough2)">每轮每个格子至多被 4 个邻居更新，总转移量 O(m·n)。</text>

  <text x="28" y="366" font-size="10" fill="#666" filter="url(#rough2)">注：每一步都结算，所以「至多 maxMove 步」无需额外处理，也不会重复计数。</text>
</svg>
