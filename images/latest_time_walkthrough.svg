<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：三个典型输入</text>
  <path d="M 210 40 Q 340 50 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- band 1 -->
  <text x="70" y="66" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b">例 1  time = "??:??"（全部自由）</text>
  <g filter="url(#sk)">
    <rect x="70" y="76" width="34" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="109" y="76" width="34" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="148" y="76" width="34" height="44" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
    <rect x="187" y="76" width="34" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="226" y="76" width="34" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="87" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">?</text>
  <text x="126" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">?</text>
  <text x="165" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#999999">:</text>
  <text x="204" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">?</text>
  <text x="243" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">?</text>
  <text x="87" y="132" text-anchor="middle" font-size="9" fill="#888888">h₁</text>
  <text x="126" y="132" text-anchor="middle" font-size="9" fill="#888888">h₂</text>
  <text x="204" y="132" text-anchor="middle" font-size="9" fill="#888888">m₁</text>
  <text x="243" y="132" text-anchor="middle" font-size="9" fill="#888888">m₂</text>
  <g filter="url(#sk)">
    <path d="M 268 98 L 312 98" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="290" y="90" text-anchor="middle" font-size="9.5" fill="#888888">贪心</text>
  <g filter="url(#sk)">
    <rect x="320" y="76" width="34" height="44" rx="5" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="359" y="76" width="34" height="44" rx="5" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="398" y="76" width="34" height="44" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
    <rect x="437" y="76" width="34" height="44" rx="5" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="476" y="76" width="34" height="44" rx="5" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="337" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#7a5415">2</text>
  <text x="376" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#7a5415">3</text>
  <text x="415" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#999999">:</text>
  <text x="454" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#7a5415">5</text>
  <text x="493" y="104" text-anchor="middle" font-size="20" font-weight="bold" fill="#7a5415">9</text>
  <text x="525" y="94" text-anchor="start" font-size="10.5" fill="#444444">h₁ 取最大 2 ⇒ h₂ 只能 3</text>
  <text x="525" y="112" text-anchor="start" font-size="10.5" fill="#444444">m₁=5、m₂=9 与小时无关</text>

  <!-- band 2 -->
  <text x="70" y="176" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b">例 2  time = "?4:3?"（h₂ 固定为 4）</text>
  <g filter="url(#sk)">
    <rect x="70" y="186" width="34" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="109" y="186" width="34" height="44" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
    <rect x="148" y="186" width="34" height="44" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
    <rect x="187" y="186" width="34" height="44" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
    <rect x="226" y="186" width="34" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="87" y="214" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">?</text>
  <text x="126" y="214" text-anchor="middle" font-size="20" font-weight="bold" fill="#555555">4</text>
  <text x="165" y="214" text-anchor="middle" font-size="20" font-weight="bold" fill="#999999">:</text>
  <text x="204" y="214" text-anchor="middle" font-size="20" font-weight="bold" fill="#555555">3</text>
  <text x="243" y="214" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">?</text>
  <g filter="url(#sk)">
    <path d="M 268 208 L 312 208" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="290" y="200" text-anchor="middle" font-size="9.5" fill="#888888">贪心</text>
  <g filter="url(#sk)">
    <rect x="320" y="186" width="34" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="359" y="186" width="34" height="44" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
    <rect x="398" y="186" width="34" height="44" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
    <rect x="437" y="186" width="34" height="44" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
    <rect x="476" y="186" width="34" height="44" rx="5" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="337" y="214" text-anchor="middle" font-size="20" font-weight="bold" fill="#b03a3a">1</text>
  <text x="376" y="214" text-anchor="middle" font-size="20" font-weight="bold" fill="#555555">4</text>
  <text x="415" y="214" text-anchor="middle" font-size="20" font-weight="bold" fill="#999999">:</text>
  <text x="454" y="214" text-anchor="middle" font-size="20" font-weight="bold" fill="#555555">3</text>
  <text x="493" y="214" text-anchor="middle" font-size="20" font-weight="bold" fill="#7a5415">9</text>
  <text x="525" y="204" text-anchor="start" font-size="10.5" fill="#b03a3a" font-weight="bold">h₂=4 &gt; 3 ⇒ h₁ 不能取 2</text>
  <text x="525" y="222" text-anchor="start" font-size="10.5" fill="#444444">只能 14:39，不是 24:39！</text>

  <!-- band 3 -->
  <text x="70" y="286" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b">例 3  time = "2?:22"（h₁ 固定为 2）</text>
  <g filter="url(#sk)">
    <rect x="70" y="296" width="34" height="44" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
    <rect x="109" y="296" width="34" height="44" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="148" y="296" width="34" height="44" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
    <rect x="187" y="296" width="34" height="44" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
    <rect x="226" y="296" width="34" height="44" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
  </g>
  <text x="87" y="324" text-anchor="middle" font-size="20" font-weight="bold" fill="#555555">2</text>
  <text x="126" y="324" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6e9e">?</text>
  <text x="165" y="324" text-anchor="middle" font-size="20" font-weight="bold" fill="#999999">:</text>
  <text x="204" y="324" text-anchor="middle" font-size="20" font-weight="bold" fill="#555555">2</text>
  <text x="243" y="324" text-anchor="middle" font-size="20" font-weight="bold" fill="#555555">2</text>
  <g filter="url(#sk)">
    <path d="M 268 318 L 312 318" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="290" y="310" text-anchor="middle" font-size="9.5" fill="#888888">贪心</text>
  <g filter="url(#sk)">
    <rect x="320" y="296" width="34" height="44" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
    <rect x="359" y="296" width="34" height="44" rx="5" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="398" y="296" width="34" height="44" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
    <rect x="437" y="296" width="34" height="44" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
    <rect x="476" y="296" width="34" height="44" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
  </g>
  <text x="337" y="324" text-anchor="middle" font-size="20" font-weight="bold" fill="#555555">2</text>
  <text x="376" y="324" text-anchor="middle" font-size="20" font-weight="bold" fill="#7a5415">3</text>
  <text x="415" y="324" text-anchor="middle" font-size="20" font-weight="bold" fill="#999999">:</text>
  <text x="454" y="324" text-anchor="middle" font-size="20" font-weight="bold" fill="#555555">2</text>
  <text x="493" y="324" text-anchor="middle" font-size="20" font-weight="bold" fill="#555555">2</text>
  <text x="525" y="314" text-anchor="start" font-size="10.5" fill="#444444">h₁ 固定为 2 ⇒ h₂ 上限 3</text>
  <text x="525" y="332" text-anchor="start" font-size="10.5" fill="#444444">若填 9 得 29:22，非法</text>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="40" y="366" width="600" height="40" rx="8" fill="#fdfcf7" stroke="#bbbbbb" stroke-width="1"/>
  </g>
  <g filter="url(#sk)">
    <rect x="60" y="376" width="14" height="14" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="80" y="388" text-anchor="start" font-size="11" fill="#444444">'?' 待填</text>
  <g filter="url(#sk)">
    <rect x="150" y="376" width="14" height="14" rx="3" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="170" y="388" text-anchor="start" font-size="11" fill="#444444">贪心填入</text>
  <g filter="url(#sk)">
    <rect x="240" y="376" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="260" y="388" text-anchor="start" font-size="11" fill="#444444">被相邻位强制压低</text>
  <g filter="url(#sk)">
    <rect x="390" y="376" width="14" height="14" rx="3" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.3"/>
  </g>
  <text x="410" y="388" text-anchor="start" font-size="11" fill="#444444">固定字符（含 ':'）</text>
</svg>
