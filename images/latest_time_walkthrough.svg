<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：三条分支——个位到 1 / 个位到 9 / 十位兜底 0</text>

  <!-- Row 1: 1?:?4 -->
  <text x="98" y="58" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">s[1] → '1'</text>
  <path d="M 98 62 L 98 70" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="158" y="58" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">s[3] → '5'</text>
  <path d="M 158 62 L 158 70" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="40" y="72" width="36" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="58" y="97" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="80" y="72" width="36" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="98" y="97" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">?</text>
  <text x="128" y="97" text-anchor="middle" font-size="15" fill="#777" font-weight="bold" filter="url(#rough2)">:</text>
  <rect x="140" y="72" width="36" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="158" y="97" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">?</text>
  <rect x="180" y="72" width="36" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="198" y="97" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="234" y="96" text-anchor="middle" font-size="16" fill="#555" filter="url(#rough2)">→</text>

  <rect x="252" y="72" width="92" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="298" y="97" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11:54</text>

  <text x="40" y="132" font-size="11" fill="#555" filter="url(#rough2)">分支①：s[0]='1' 已定 → 个位 '?' 只能到 '1'（11）；分钟十位拉满 '5'</text>

  <path d="M 40 145 L 480 145" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>

  <!-- Row 2: 0?:5? -->
  <text x="98" y="162" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">s[1] → '9'</text>
  <path d="M 98 166 L 98 174" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="198" y="162" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">s[4] → '9'</text>
  <path d="M 198 166 L 198 174" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="40" y="176" width="36" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="58" y="201" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="80" y="176" width="36" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="98" y="201" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">?</text>
  <text x="128" y="201" text-anchor="middle" font-size="15" fill="#777" font-weight="bold" filter="url(#rough2)">:</text>
  <rect x="140" y="176" width="36" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="158" y="201" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="180" y="176" width="36" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="198" y="201" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">?</text>

  <text x="234" y="200" text-anchor="middle" font-size="16" fill="#555" filter="url(#rough2)">→</text>

  <rect x="252" y="176" width="92" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="298" y="201" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">09:59</text>

  <text x="40" y="236" font-size="11" fill="#555" filter="url(#rough2)">分支②：s[0]='0' → 个位 '?' 拉满 '9'（09）；分钟个位拉满 '9'</text>

  <path d="M 40 249 L 480 249" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>

  <!-- Row 3: ?4:?? -->
  <text x="58" y="266" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">s[0] → '0'（兜底）</text>
  <path d="M 58 270 L 58 278" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="158" y="266" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">s[3] → '5'</text>
  <path d="M 158 270 L 158 278" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="198" y="266" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">s[4] → '9'</text>
  <path d="M 198 270 L 198 278" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="40" y="280" width="36" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="58" y="305" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">?</text>
  <rect x="80" y="280" width="36" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="98" y="305" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="128" y="305" text-anchor="middle" font-size="15" fill="#777" font-weight="bold" filter="url(#rough2)">:</text>
  <rect x="140" y="280" width="36" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="158" y="305" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">?</text>
  <rect x="180" y="280" width="36" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="198" y="305" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold" filter="url(#rough2)">?</text>

  <text x="234" y="304" text-anchor="middle" font-size="16" fill="#555" filter="url(#rough2)">→</text>

  <rect x="252" y="280" width="92" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="298" y="305" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">04:59</text>

  <text x="40" y="340" font-size="11" fill="#555" filter="url(#rough2)">分支③：s[1]='4' &gt; '1'，十位冲 '1' 会得到 14（非法）→ 兜底 '0'；分钟拉满 '59'</text>

  <!-- bottom strip -->
  <rect x="40" y="354" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="373" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">第四条分支：??:?? → 11:59 —— 个位是 '?' 不拦路，十位直接冲 '1'</text>
</svg>
