  <!-- annotations -->
  <g filter="url(#sk)">
    <rect x="35" y="520" width="300" height="88" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="185" y="542" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04038" filter="url(#sk)">第 3 / 6 步 · flip()</text>
  <text x="185" y="562" text-anchor="middle" font-size="11" fill="#a04038" filter="url(#sk)">bits 一字未动（01010 → 01010、11010 → 11010）</text>
  <text x="185" y="580" text-anchor="middle" font-size="11" fill="#a04038" filter="url(#sk)">只翻 flipped，ones ← 5 − ones（2→3、2→3）</text>
  <text x="185" y="598" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">两次 O(1) 赋值，对比朴素的 O(n) 逐位翻转</text>

  <g filter="url(#sk)">
    <rect x="355" y="520" width="290" height="88" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="500" y="542" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">第 5 步 · 镜像下 unfix(0)</text>
  <text x="500" y="562" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">逻辑位 0 = bits[0] ⊕ 1 = 1，需清零</text>
  <text x="500" y="580" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">物理目标 = 0 ⊕ flipped = 1</text>
  <text x="500" y="598" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">物理把 bits[0] 写成 1（红框），ones 3 → 2</text>
