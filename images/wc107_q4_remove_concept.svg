<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="420" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">II 版的关键差异：删节点 = 连边一起删</text>
  <rect x="40" y="60" width="250" height="110" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">I 版（#924）：只取消初始感染</text>
  <text x="165" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">节点与边都保留</text>
  <text x="165" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→ 按连通块计数即可</text>
  <rect x="330" y="60" width="280" height="110" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="86" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">II 版（本题）：删除节点及其所有边</text>
  <text x="470" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">图结构改变，连通块会裂开</text>
  <text x="470" y="138" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">→ 必须对每个候选重新扩散</text>
  <rect x="60" y="194" width="180" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="219.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">候选 u ∈ initial（n 个）</text>
  <path d="M 150 240 L 150 262" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="60" y="262" width="180" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="287.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">在 graph 去掉 u 的图上</text>
  <path d="M 150 308 L 150 330" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="60" y="330" width="180" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="355.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">从其余源做一次 DFS</text>
  <text x="300" y="216" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">每次扩散 O(n^2)，共 |initial| ≤ n 次 → O(n^3)</text>
  <text x="300" y="246" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">n ≤ 300 时 2.7×10^7，完全可行</text>
  <text x="300" y="290" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">并列取最小下标：initial 升序遍历 + 严格小于才更新</text>
  <text x="330" y="400" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">不要照搬 I 版「块内源唯一 → 收益 = 块大小」的结论，删点后块的规模会变</text>
</svg>
