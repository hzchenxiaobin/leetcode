<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="227"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：prices = [8,4,6,2,3] → ans = [4,2,4,2,3]</text>

  <!-- 步骤表 -->
  <g filter="url(#rough2)">
    <rect x="60" y="56" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="126" y="56" width="90" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="222" y="56" width="110" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="338" y="56" width="100" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="444" y="56" width="60" height="34" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
  </g>
  <text y="78" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="90">步</tspan><tspan x="171">来向</tspan><tspan x="277">动作</tspan><tspan x="388">栈(价格)</tspan><tspan x="474">ans</tspan></text>

  <g filter="url(#rough2)">
    <rect x="60" y="96" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="126" y="96" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="222" y="96" width="110" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="338" y="96" width="100" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="444" y="96" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <text y="116" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="90">i=0</tspan><tspan x="171">8 入栈</tspan><tspan x="277">栈空直接进</tspan><tspan x="388">8</tspan><tspan x="474">—</tspan></text>

  <g filter="url(#rough2)">
    <rect x="60" y="132" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="126" y="132" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="222" y="132" width="110" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="338" y="132" width="100" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="444" y="132" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <text y="152" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="90">i=1</tspan><tspan x="171">4 &lt; 8</tspan><tspan x="277">弹 8 结算 8−4</tspan><tspan x="388">4</tspan><tspan x="474">[4]</tspan></text>

  <g filter="url(#rough2)">
    <rect x="60" y="168" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="126" y="168" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="222" y="168" width="110" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="338" y="168" width="100" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="444" y="168" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <text y="188" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="90">i=2</tspan><tspan x="171">6 &gt; 4</tspan><tspan x="277">6 入栈等待</tspan><tspan x="388">4,6</tspan><tspan x="474">[4]</tspan></text>

  <g filter="url(#rough2)">
    <rect x="60" y="204" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="126" y="204" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="222" y="204" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="338" y="204" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="444" y="204" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>
  <text y="224" font-size="11.5" fill="#8a6a20" font-weight="bold" text-anchor="middle" filter="url(#rough2)"><tspan x="90">i=3</tspan><tspan x="171">2 ≤ 6, 4</tspan><tspan x="277">连弹 6、4！</tspan><tspan x="388">2</tspan><tspan x="474">[4,2,4]</tspan></text>

  <g filter="url(#rough2)">
    <rect x="60" y="240" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="126" y="240" width="90" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="222" y="240" width="110" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="338" y="240" width="100" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="444" y="240" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <text y="260" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="90">i=4</tspan><tspan x="171">3 &gt; 2</tspan><tspan x="277">3 入栈</tspan><tspan x="388">2,3</tspan><tspan x="474">[4,2,4]</tspan></text>

  <!-- 终态 -->
  <rect x="60" y="286" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">收尾：2、3 无折扣原价保留 → ans = [4, 2, 4, 2, 3] ✓</text>
</svg>
