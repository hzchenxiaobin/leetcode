    <rect x="100" y="76" width="32" height="32" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
    <rect x="132" y="76" width="32" height="32" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
    <rect x="164" y="76" width="32" height="32" rx="3" fill="#ececec" stroke="#999" stroke-width="1.1"/>
    <rect x="196" y="76" width="32" height="32" rx="3" fill="#ececec" stroke="#999" stroke-width="1.1"/>
    <rect x="36" y="108" width="32" height="32" rx="3" fill="#ececec" stroke="#999" stroke-width="1.1"/>
    <rect x="68" y="108" width="32" height="32" rx="4" fill="#fdf0d0" stroke="#d6a040" stroke-width="1.8"/>
