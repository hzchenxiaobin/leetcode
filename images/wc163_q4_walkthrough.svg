<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">示例 3 演算：5 次推动（下、左、左、上、上）</text>

  <g filter="url(#rough2)">
    <rect x="36" y="44" width="32" height="32" rx="3" fill="#ececec" stroke="#999" stroke-width="1.1"/>
    <rect x="68" y="44" width="32" height="32" rx="3" fill="#ececec" stroke="#999" stroke-width="1.1"/>
    <rect x="100" y="44" width="32" height="32" rx="3" fill="#ececec" stroke="#999" stroke-width="1.1"/>
    <rect x="132" y="44" width="32" height="32" rx="3" fill="#ececec" stroke="#999" stroke-width="1.1"/>
