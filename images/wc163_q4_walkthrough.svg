    <rect x="132" y="140" width="32" height="32" rx="4" fill="#fdf0d0" stroke="#d6a040" stroke-width="1.8"/>
    <text x="148.0" y="161.0" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">1</text>
    <rect x="164" y="140" width="32" height="32" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
