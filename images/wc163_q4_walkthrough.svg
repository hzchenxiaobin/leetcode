  <g filter="url(#rough2)">
    <text x="36" y="258" font-size="8.8" fill="#888">格子中的数字 = 第 i 次推动后箱子所在格</text>
    <text x="36" y="274" font-size="8.8" fill="#888">B 左上角 0 表示推动次数起点</text>
  </g>

  <g filter="url(#rough2)">
    <text x="258" y="70" font-size="8.5" fill="#888">步</text>
    <text x="288" y="70" font-size="8.5" fill="#888">玩家站位</text>
    <text x="356" y="70" font-size="8.5" fill="#888">方向</text>
    <text x="386" y="70" font-size="8.5" fill="#888">箱子到</text>
    <text x="452" y="70" font-size="8.5" fill="#888">玩家到</text>
    <rect x="250" y="76" width="286" height="25" rx="5" fill="#fdf6e3" stroke="#ddd" stroke-width="1"/>
    <text x="258" y="94" font-size="9.3" fill="#333" font-weight="bold">1</text>
    <text x="288" y="94" font-size="9.3" fill="#333">(1,3)</text>
    <text x="356" y="94" font-size="9.3" fill="#b85450">↓</text>
    <text x="386" y="94" font-size="9.3" fill="#333">(3,3)</text>
    <text x="452" y="94" font-size="9.3" fill="#333">(2,3)</text>
    <rect x="250" y="103" width="286" height="25" rx="5" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
    <text x="258" y="121" font-size="9.3" fill="#333" font-weight="bold">2</text>
    <text x="288" y="121" font-size="9.3" fill="#333">(3,4)</text>
    <text x="356" y="121" font-size="9.3" fill="#b85450">←</text>
    <text x="386" y="121" font-size="9.3" fill="#333">(3,2)</text>
    <text x="452" y="121" font-size="9.3" fill="#333">(3,3)</text>
    <rect x="250" y="130" width="286" height="25" rx="5" fill="#fdf6e3" stroke="#ddd" stroke-width="1"/>
    <text x="258" y="148" font-size="9.3" fill="#333" font-weight="bold">3</text>
    <text x="288" y="148" font-size="9.3" fill="#333">(3,3)</text>
    <text x="356" y="148" font-size="9.3" fill="#b85450">←</text>
    <text x="386" y="148" font-size="9.3" fill="#333">(3,1)</text>
    <text x="452" y="148" font-size="9.3" fill="#333">(3,2)</text>
    <rect x="250" y="157" width="286" height="25" rx="5" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
    <text x="258" y="175" font-size="9.3" fill="#333" font-weight="bold">4</text>
    <text x="288" y="175" font-size="9.3" fill="#333">(4,1)</text>
    <text x="356" y="175" font-size="9.3" fill="#b85450">↑</text>
    <text x="386" y="175" font-size="9.3" fill="#333">(2,1)</text>
    <text x="452" y="175" font-size="9.3" fill="#333">(3,1)</text>
    <rect x="250" y="184" width="286" height="25" rx="5" fill="#fdf6e3" stroke="#ddd" stroke-width="1"/>
    <text x="258" y="202" font-size="9.3" fill="#333" font-weight="bold">5</text>
    <text x="288" y="202" font-size="9.3" fill="#333">(3,1)</text>
    <text x="356" y="202" font-size="9.3" fill="#b85450">↑</text>
    <text x="386" y="202" font-size="9.3" fill="#333">(1,1)</text>
    <text x="452" y="202" font-size="9.3" fill="#333">(2,1)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="302" width="512" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="9"/>
    <text x="38" y="321" font-size="9.5" fill="#3a5a30">玩家绕路：第 1 步从 (4,4) 走 4 步到 (1,3)；第 2 步走 2 步到 (3,4)；</text>
    <text x="38" y="338" font-size="9.5" fill="#3a5a30">第 4 步走 2 步到 (4,1)；第 3、5 步玩家恰好已就位，无需走动。</text>
    <text x="38" y="357" font-size="9.5" fill="#8a6a20">共 8 步免费走动 + 5 次推动 = 13 个动作，但答案只数推动：5</text>
  </g>
