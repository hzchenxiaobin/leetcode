    <rect x="196" y="172" width="32" height="32" rx="3" fill="#ececec" stroke="#999" stroke-width="1.1"/>
    <rect x="36" y="204" width="32" height="32" rx="3" fill="#ececec" stroke="#999" stroke-width="1.1"/>
    <rect x="68" y="204" width="32" height="32" rx="3" fill="#ececec" stroke="#999" stroke-width="1.1"/>
