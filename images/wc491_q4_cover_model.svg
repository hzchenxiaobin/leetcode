<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="760" height="452" fill="#fafafa"/>
  <text x="380" y="24" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">bad 的区间覆盖模型：每个值贡献一条「禁止区间」</text>
  <text x="380" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">值 2 的出现位置（nums = [2,2,1,1,2,2,2,2,2]，m = 4，r = 9）</text>

  <!-- timeline pm/last labels -->
  <text x="312" y="62" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">pm（倒数第 m 次）</text>
  <path d="M312,66 L312,76" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="466" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">last（最后出现）</text>
  <path d="M466,66 L466,76" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- timeline cells -->
  <rect x="70" y="80" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="102" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="114" y="80" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="102" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="158" y="80" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180" y="102" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
  <rect x="202" y="80" width="44" height="34" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="224" y="102" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">1</text>
  <rect x="246" y="80" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="102" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="290" y="80" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="312" y="102" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="334" y="80" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="356" y="102" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="378" y="80" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="102" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="422" y="80" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444" y="102" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="466" y="80" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="488" y="102" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="92" y="126" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="136" y="126" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="180" y="126" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="224" y="126" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="268" y="126" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>
  <text x="312" y="126" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="356" y="126" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">7</text>
  <text x="400" y="126" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">8</text>
  <text x="444" y="126" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">9</text>
  <text x="488" y="126" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">—</text>

  <!-- forbidden band over positions 7..9 -->
  <rect x="378" y="134" width="132" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="444" y="151" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">禁止区间 (pm, last]</text>

  <text x="70" y="178" font-size="10.5" fill="#333" filter="url(#rough2)">l 落在 (pm, last] 内 ⟺ 2 在 [l, r] 中出现且不足 m 次：l=7 时 3 次、l=8 时 2 次、l=9 时 1 次 → bad +1</text>
  <text x="70" y="196" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">l ≤ pm＝6 时 2 出现 ≥ 4 次（位置 6,7,8,9 全在窗口里）→ 不贡献 bad</text>

  <!-- three panels -->
  <!-- panel 1 -->
  <rect x="40" y="210" width="220" height="128" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="230" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① t ＜ m：还没凑满</text>
  <rect x="54" y="240" width="22" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="76" y="240" width="22" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="98" y="240" width="22" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="120" y="240" width="22" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="142" y="240" width="22" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="164" y="240" width="22" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="186" y="240" width="22" height="16" rx="3" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="208" y="240" width="22" height="16" rx="3" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="153" y="268" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">区间为 [1, last]，右端随 last 延伸</text>
  <text x="150" y="290" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">add [prev+1, r] +1</text>
  <text x="150" y="312" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（蓝＝旧覆盖，橙＝新增覆盖）</text>

  <!-- panel 2 -->
  <rect x="280" y="210" width="220" height="128" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="230" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">② t ＝ m：刚好凑满</text>
  <rect x="294" y="240" width="22" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="316" y="240" width="22" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="338" y="240" width="22" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="360" y="240" width="22" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="382" y="240" width="22" height="16" rx="3" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="404" y="240" width="22" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="426" y="240" width="22" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="448" y="240" width="22" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="268" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">旧禁止区间整条撤销，新区间从 p₁+1 起</text>
  <text x="390" y="290" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">add [1, prev] −1；add [p₁+1, r] +1</text>
  <text x="390" y="312" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（红＝撤销，橙＝新建）</text>

  <!-- panel 3 -->
  <rect x="520" y="210" width="220" height="128" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="630" y="230" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ t ＞ m：早已超过</text>
  <rect x="534" y="240" width="22" height="16" rx="3" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="556" y="240" width="22" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="578" y="240" width="22" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="600" y="240" width="22" height="16" rx="3" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="622" y="240" width="22" height="16" rx="3" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="644" y="240" width="22" height="16" rx="3" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="666" y="240" width="22" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="688" y="240" width="22" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="630" y="268" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">左端跳到新的倒数第 m 次，右端照常延伸</text>
  <text x="630" y="290" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">add [old_pm+1, new_pm] −1；add [prev+1, r] +1</text>
  <text x="630" y="312" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（红＝左端跳走，橙＝右端延伸）</text>

  <!-- bottom note -->
  <rect x="40" y="352" width="700" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="376" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cover(l) ＝ 覆盖 l 的禁止区间条数 ＝ bad(l)：线段树「区间加」维护，查询 [A,B] 内最右 0 即得 C</text>
  <text x="390" y="398" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">每个 r 只有值 v ＝ nums[r] 的一条区间变化 → 每 步 至 多 两 次 区 间 加，总复杂度 O(n log n)</text>
  <text x="390" y="420" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">m ＝ 1 时三类操作两两抵消 → cover 恒 0，退化为经典「恰好 k 个不同」计数</text>
</svg>
