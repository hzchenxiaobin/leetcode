<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="24" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 3：root = [5,2,3,null,1]，val = 4</text>
  <text x="280" y="42" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">a = [2,1,5,3] → b = [2,1,5,3,4]，重新构造后 4 成为 5 的右子，3 挂到 4 的左边</text>

  <circle cx="140" cy="90" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="96" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="80" cy="158" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="164" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <circle cx="196" cy="158" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="196" y="164" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <circle cx="126" cy="220" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="126" y="225" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>

  <path d="M 128 102 L 92 146" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 152 102 L 188 146" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 92 170 L 116 210" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="136" y="200" font-size="9" fill="#888" text-anchor="start" filter="url(#rough2)">右子</text>

  <text x="140" y="262" font-size="11" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">插入前</text>
  <text x="140" y="280" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">[5,2,3,null,1]</text>

  <path d="M 240 150 L 292 150" stroke="#999" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="140" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">插入 4</text>

  <circle cx="400" cy="90" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="96" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="340" cy="158" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="164" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <circle cx="462" cy="158" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="462" y="164" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="386" cy="220" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="386" y="225" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <circle cx="438" cy="220" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="438" y="225" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>

  <path d="M 388 102 L 352 146" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 412 102 L 450 146" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 352 170 L 376 210" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 450 174 L 442 206" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <text x="400" y="262" font-size="11" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">插入后</text>
  <text x="400" y="280" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">[5,2,4,null,1,3]</text>

  <rect x="30" y="292" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="42" y="312" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">4 &lt; 5，往右走到 3；4 &gt; 3，于是 4 取代 3 成为右子，3 被挂到 4 的左边。</text>
</svg>
