<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 328" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="580" height="328" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">从满 mask 回溯 par 还原拼接顺序</text>
  <rect x="40" y="56" width="500" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="82" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">par[mask][last] = 让 dp 取到最小的前驱，回溯到单点状态</text>
  <rect x="40" y="120" width="120" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="143" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">先反序收集</text>
  <rect x="60" y="174" width="90" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="196" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">gcta</text>
  <rect x="156" y="174" width="90" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="196" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">ctaagt</text>
  <path d="M 156 191 L 150 191" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="252" y="174" width="90" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="297" y="196" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">ttca</text>
  <path d="M 252 191 L 246 191" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="348" y="174" width="90" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="393" y="196" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">catg</text>
  <path d="M 348 191 L 342 191" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="444" y="174" width="90" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="489" y="196" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">atgcatc</text>
  <path d="M 444 191 L 438 191" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">reverse 得到 0 → 1 → 2 → 3 → 4 的顺序</text>
  <rect x="40" y="254" width="500" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="276" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">按顺序拼接：res = w[0]，之后每次追加 w[b].substr(ov[a][b])</text>
  <text x="290" y="298" text-anchor="middle" font-size="10.5" fill="#a9761f" filter="url(#rough2)">gcta + agt + tca + tg + gcatc = gctaagttcatgcatc（16 字符）</text>
</svg>
