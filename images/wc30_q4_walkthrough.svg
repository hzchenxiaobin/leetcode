<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：N = 3，K = 3，答案 12</text>

  <text x="180" y="58" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">days[c][w]（行 = 城市，列 = 周）</text>
  <text x="484" y="58" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dp[w][c] 递推结果</text>

  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="124" y="78">w=0</text>
    <text x="180" y="78">w=1</text>
    <text x="236" y="78">w=2</text>
    <text x="428" y="78">城市0</text>
    <text x="484" y="78">城市1</text>
    <text x="540" y="78">城市2</text>
  </g>

  <g stroke="#446688" stroke-width="1.3" fill="#e8f0fe" filter="url(#rough2)">
    <rect x="96" y="86" width="56" height="40" rx="3"/>
    <rect x="152" y="86" width="56" height="40" rx="3"/>
    <rect x="208" y="86" width="56" height="40" rx="3"/>
    <rect x="96" y="126" width="56" height="40" rx="3"/>
    <rect x="152" y="126" width="56" height="40" rx="3"/>
    <rect x="208" y="126" width="56" height="40" rx="3"/>
    <rect x="96" y="166" width="56" height="40" rx="3"/>
    <rect x="152" y="166" width="56" height="40" rx="3"/>
    <rect x="208" y="166" width="56" height="40" rx="3"/>
  </g>

  <g stroke="#446688" stroke-width="1.3" fill="#e8f0fe" filter="url(#rough2)">
    <rect x="400" y="86" width="56" height="40" rx="3"/>
    <rect x="456" y="86" width="56" height="40" rx="3"/>
    <rect x="512" y="86" width="56" height="40" rx="3"/>
    <rect x="400" y="126" width="56" height="40" rx="3"/>
    <rect x="456" y="126" width="56" height="40" rx="3"/>
    <rect x="512" y="126" width="56" height="40" rx="3"/>
    <rect x="400" y="166" width="56" height="40" rx="3"/>
    <rect x="456" y="166" width="56" height="40" rx="3"/>
    <rect x="512" y="166" width="56" height="40" rx="3"/>
  </g>

  <g stroke="#d6a040" stroke-width="2.2" fill="#fff8e1" filter="url(#rough2)">
    <rect x="96" y="126" width="56" height="40" rx="3"/>
    <rect x="152" y="166" width="56" height="40" rx="3"/>
    <rect x="208" y="166" width="56" height="40" rx="3"/>
    <rect x="456" y="86" width="56" height="40" rx="3"/>
    <rect x="512" y="126" width="56" height="40" rx="3"/>
    <rect x="512" y="166" width="56" height="40" rx="3"/>
  </g>

  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="124" y="112">1</text>
    <text x="180" y="112">3</text>
    <text x="236" y="112">1</text>
    <text x="124" y="152">6</text>
    <text x="180" y="152">0</text>
    <text x="236" y="152">3</text>
    <text x="124" y="192">3</text>
    <text x="180" y="192">3</text>
    <text x="236" y="192">3</text>
    <text x="428" y="112">1</text>
    <text x="484" y="112">6</text>
    <text x="540" y="112">3</text>
    <text x="428" y="152">9</text>
    <text x="484" y="152">6</text>
    <text x="540" y="152">9</text>
    <text x="428" y="192">10</text>
    <text x="484" y="192">12</text>
    <text x="540" y="192">12</text>
  </g>

  <g font-size="10.5" fill="#666" text-anchor="end" filter="url(#rough2)">
    <text x="88" y="111">城市 0</text>
    <text x="88" y="151">城市 1</text>
    <text x="88" y="191">城市 2</text>
    <text x="392" y="111">w = 0</text>
    <text x="392" y="151">w = 1</text>
    <text x="392" y="191">w = 2</text>
  </g>

  <path d="M 278 146 L 378 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">逐周递推</text>

  <rect x="64" y="228" width="512" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="80" y="252" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">初始化：dp[0][·] = (1, 6, 3) —— 城市 0 起步，也可直接飞往城市 1、2</text>
  <text x="80" y="274" font-size="10.5" fill="#555" filter="url(#rough2)">第 1 周：dp[1][·] = (9, 6, 9)；第 2 周：dp[2][·] = (10, 12, 12)</text>
  <text x="80" y="296" font-size="10.5" fill="#555" filter="url(#rough2)">最优：0 →(飞) 1 →(飞) 2 →(留) 2，休假 6 + 3 + 3 = 12 = max</text>
  <text x="80" y="318" font-size="10.5" fill="#555" filter="url(#rough2)">对照暴力：枚举全部 3 周城市序列，最大值同样是 12</text>

  <text x="320" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">橙色格 = 最优路线经过的 (周, 城市) 与对应 days 取值；dp 值只依赖上一周，可滚动压缩</text>
</svg>
