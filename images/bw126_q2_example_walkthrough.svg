<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 332" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="620" height="332" fill="#fafafa"/>
<text x="310" y="28" text-anchor="middle" font-size="13" fill="#555" font-weight="normal" filter="url(#roughs)">示例 1：nums = [1,2,2,1,2,3,1]，初始 rest = 12</text>
<rect x="26" y="44" width="578" height="34" rx="6" fill="#f2f2f2" stroke="#777777" stroke-width="1.5" filter="url(#rough2)"/>
<text x="75.0" y="66" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#roughs)">操作</text>
<text x="185.0" y="66" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#roughs)">标记 index</text>
<text x="360.0" y="66" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#roughs)">额外标记最小的 k 个</text>
<text x="535.0" y="66" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#roughs)">rest</text>
<rect x="26" y="78" width="578" height="46" rx="6" fill="#e8f0fe" stroke="#dddddd" stroke-width="1.2" filter="url(#rough2)"/>
<text x="75.0" y="106" text-anchor="middle" font-size="13" fill="#333333" font-weight="normal" filter="url(#roughs)">1</text>
<text x="185.0" y="106" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)">下标 1（值 2）</text>
<text x="360.0" y="106" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)">k=2：下标 0、3（值 1、1）</text>
<text x="535.0" y="106" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="normal" filter="url(#roughs)">8</text>
<rect x="26" y="124" width="578" height="46" rx="6" fill="#fbfbfb" stroke="#dddddd" stroke-width="1.2" filter="url(#rough2)"/>
<text x="75.0" y="152" text-anchor="middle" font-size="13" fill="#333333" font-weight="normal" filter="url(#roughs)">2</text>
<text x="185.0" y="152" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)">下标 3（已标记，跳过）</text>
<text x="360.0" y="152" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)">k=3：下标 6、2、4（值 1、2、2）</text>
<text x="535.0" y="152" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="normal" filter="url(#roughs)">3</text>
<rect x="26" y="170" width="578" height="46" rx="6" fill="#e8f0fe" stroke="#dddddd" stroke-width="1.2" filter="url(#rough2)"/>
<text x="75.0" y="198" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="normal" filter="url(#roughs)">3</text>
<text x="185.0" y="198" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)">下标 4（已标记，跳过）</text>
<text x="360.0" y="198" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)">k=2：下标 5（值 3），之后无元素</text>
<text x="535.0" y="198" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="normal" filter="url(#roughs)">0</text>
<text x="310" y="236" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#roughs)">两次「已标记跳过」说明 index 必须先判再标记，不能重复减和</text>
<text x="310" y="258" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#roughs)">k 用完后指针停在下一个未标记处，下次查询继续</text>
<rect x="90" y="276" width="440" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="310" y="304" text-anchor="middle" font-size="13" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">answer = [8, 3, 0]，每次压入当时的 rest</text>
</svg>
