<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：两条按 id 升序的 (id, val) 队列</text>
  <path d="M 130 44 Q 320 52 510 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums1 queue -->
  <text x="46" y="74" font-size="13" font-weight="bold" fill="#446688">nums1：id 严格递增</text>
  <g filter="url(#sk)">
    <rect x="46" y="82" width="64" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="116" y="82" width="64" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="186" y="82" width="64" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#2b4a6b" font-weight="bold">
    <text x="78" y="105">[1,2]</text>
    <text x="148" y="105">[2,3]</text>
    <text x="218" y="105">[4,5]</text>
  </g>
  <path d="M 78 152 L 78 124" stroke="#b85450" stroke-width="2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="90" y="150" font-size="14" font-weight="bold" fill="#b85450">i</text>

  <!-- compare badge -->
  <ellipse cx="160" cy="192" rx="82" ry="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="160" y="197" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">比较 id₁ 与 id₂</text>
  <path d="M 90 158 Q 118 176 118 176" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>

  <!-- nums2 queue -->
  <text x="46" y="266" font-size="13" font-weight="bold" fill="#4a7a3a">nums2：id 严格递增</text>
  <g filter="url(#sk)">
    <rect x="46" y="274" width="64" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="116" y="274" width="64" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="186" y="274" width="64" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="13" fill="#2e5a22" font-weight="bold">
    <text x="78" y="297">[1,4]</text>
    <text x="148" y="297">[3,2]</text>
    <text x="218" y="297">[4,1]</text>
  </g>
  <path d="M 78 244 L 78 270" stroke="#b85450" stroke-width="2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="90" y="250" font-size="14" font-weight="bold" fill="#b85450">j</text>
  <path d="M 94 238 Q 118 218 118 212" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#sk)"/>

  <!-- spine to branches -->
  <path d="M 244 192 L 320 192" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <path d="M 320 100 L 320 278" stroke="#7a7a7a" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- branch boxes -->
  <path d="M 320 106 L 344 106" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="348" y="86" width="268" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="482" y="104" text-anchor="middle" font-size="12" fill="#2b4a6b" font-weight="bold">id₁ &lt; id₂：收 [id₁, v₁]，i 前进</text>
  <text x="482" y="119" text-anchor="middle" font-size="10.5" fill="#6a88a8">（nums2 后面只会更大，不可能再有匹配）</text>

  <path d="M 320 192 L 344 192" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="348" y="166" width="268" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="482" y="186" text-anchor="middle" font-size="12" fill="#8a3430" font-weight="bold">id₁ = id₂：收 [id, v₁+v₂]，i、j 都前进</text>
  <text x="482" y="203" text-anchor="middle" font-size="10.5" fill="#a8605c">（两侧共同拥有此 id，求和后双侧消费）</text>

  <path d="M 320 274 L 344 274" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="348" y="254" width="268" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="482" y="272" text-anchor="middle" font-size="12" fill="#2e5a22" font-weight="bold">id₁ &gt; id₂：收 [id₂, v₂]，j 前进</text>
  <text x="482" y="287" text-anchor="middle" font-size="10.5" fill="#5a8a4e">（对称地，nums1 后面只会更大）</text>

  <!-- bottom notes -->
  <g filter="url(#sk)">
    <rect x="46" y="322" width="574" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="333" y="343" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">收入顺序天然按 id 升序 → 结果无需排序</text>
  <g filter="url(#sk)">
    <rect x="46" y="360" width="574" height="30" rx="8" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
  </g>
  <text x="333" y="380" text-anchor="middle" font-size="11" fill="#888">一侧游标耗尽后：另一侧剩余 id 都大于已收入的所有 id → 整段拷贝（扫尾）</text>
</svg>
