<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">时间块切分：起点锚定 startTime，末块截断到 endTime</text>
  <text x="330" y="48" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">以题面区间 [10, 10000] 为例，三种频率各自的切分结果</text>

  <text x="20" y="104" font-size="12" fill="#2f4560" font-weight="bold" filter="url(#rough2)">minute</text>
  <text x="20" y="120" font-size="9" fill="#777" filter="url(#rough2)">chunk = 60</text>

  <rect x="110" y="84" width="100" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="106" text-anchor="middle" font-size="9.5" fill="#2f4560" filter="url(#rough2)">10–69</text>
  <rect x="210" y="84" width="100" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="106" text-anchor="middle" font-size="9.5" fill="#2f4560" filter="url(#rough2)">70–129</text>
  <rect x="310" y="84" width="100" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="106" text-anchor="middle" font-size="9.5" fill="#2f4560" filter="url(#rough2)">130–189</text>
  <text x="432" y="108" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">⋯</text>
  <rect x="470" y="84" width="64" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="502" y="106" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">末块</text>
  <text x="502" y="134" text-anchor="middle" font-size="8.5" fill="#d6a040" filter="url(#rough2)">9970–10000（31 秒）</text>

  <text x="20" y="176" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">hour</text>
  <text x="20" y="192" font-size="9" fill="#777" filter="url(#rough2)">chunk = 3600</text>

  <rect x="110" y="156" width="170" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="178" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">10–3609</text>
  <rect x="280" y="156" width="170" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="178" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">3610–7209</text>
  <rect x="450" y="156" width="135" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="517" y="178" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">7210–10000</text>

  <text x="20" y="248" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">day</text>
  <text x="20" y="264" font-size="9" fill="#777" filter="url(#rough2)">chunk = 86400</text>

  <rect x="110" y="228" width="475" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="347" y="250" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">10–10000（唯一一块，长度 9991 远小于 86400）</text>

  <rect x="40" y="296" width="580" height="84" rx="10" fill="#ffffff" stroke="#bbb" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="56" y="320" font-size="9.5" fill="#445" filter="url(#rough2)">第 i 块 = [ startTime + i·chunk , min(startTime + (i+1)·chunk − 1, endTime) ]</text>
  <text x="56" y="342" font-size="9.5" fill="#445" filter="url(#rough2)">块数 k = (endTime − startTime) / chunk + 1，只有末块可能不满一整块</text>
  <text x="56" y="366" font-size="9.5" fill="#b85450" filter="url(#rough2)">块从 startTime 起算，不是把时间轴按整分钟对齐；块与块互不重叠、恰好覆盖整个区间</text>
</svg>
