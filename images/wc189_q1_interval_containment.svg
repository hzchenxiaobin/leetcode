<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="680" height="420" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：命中 = 两个端点不等式同时成立</text>
  <text x="340" y="52" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">每个学生占用的是一段连续时间，queryTime 落在区间内才算「正在做作业」</text>

  <text x="84" y="136" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">学生 0 [1,3]</text>
  <text x="204" y="186" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">学生 1 [2,6]</text>
  <text x="264" y="236" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">学生 2 [3,7]</text>

  <rect x="152" y="117" width="120" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="212" y="167" width="240" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="272" y="217" width="240" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <path d="M 332 104 L 332 332" stroke="#b85450" stroke-width="2" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>
  <text x="340" y="104" font-size="12" font-weight="bold" fill="#8f3830" filter="url(#rough2)">queryTime = 4</text>

  <text x="352" y="136" font-size="11.5" fill="#8f3830" filter="url(#rough2)">✗ 区间在 q 之前结束，不计数</text>
  <text x="462" y="186" font-size="11.5" fill="#2e5a24" filter="url(#rough2)">✓ 命中（q 落在区间内部）</text>
  <text x="522" y="236" font-size="11.5" fill="#2e5a24" filter="url(#rough2)">✓ 命中</text>

  <path d="M 92 300 L 622 300" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 92 300 L 92 307" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 152 300 L 152 307" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 212 300 L 212 307" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 272 300 L 272 307" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 332 300 L 332 307" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 392 300 L 392 307" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 452 300 L 452 307" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 512 300 L 512 307" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 572 300 L 572 307" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="92" y="322" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">0</text>
  <text x="152" y="322" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <text x="212" y="322" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <text x="272" y="322" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">3</text>
  <text x="332" y="322" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">4</text>
  <text x="392" y="322" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">5</text>
  <text x="452" y="322" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">6</text>
  <text x="512" y="322" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">7</text>
  <text x="572" y="322" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">8</text>
  <text x="646" y="322" font-size="11" fill="#777" filter="url(#rough2)">时间</text>

  <rect x="60" y="356" width="560" height="54" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">命中 ⟺ startTime[i] ≤ queryTime 且 queryTime ≤ endTime[i]</text>
  <text x="340" y="398" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">两端都是闭区间：queryTime 恰好等于端点时，学生仍在做作业</text>
</svg>
