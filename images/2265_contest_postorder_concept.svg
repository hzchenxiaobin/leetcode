<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="460" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：后序遍历，把 (sum, count) 自底向上合并</text>
  <path d="M 150 40 Q 340 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- upward info-flow arrow -->
  <g filter="url(#sk)">
    <path d="M 36 300 L 36 118" stroke="#3a3a3a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  </g>
  <text x="24" y="215" font-size="12" fill="#555" transform="rotate(-90 24 215)" text-anchor="middle">信息自底向上流动</text>

  <!-- subtree of node 8 dashed enclosure -->
  <ellipse cx="137" cy="234" rx="98" ry="88" fill="none" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="240" y="322" font-size="10.5" fill="#7a5415">以 8 为根的子树：9 / 3</text>

  <!-- edges -->
  <g filter="url(#sk)" stroke="#5a5a5a" stroke-width="1.6">
    <line x1="200" y1="126" x2="147" y2="170"/>
    <line x1="221" y1="126" x2="272" y2="170"/>
    <line x1="120" y1="212" x2="98" y2="252"/>
    <line x1="152" y1="212" x2="172" y2="252"/>
    <line x1="285" y1="214" x2="311" y2="252"/>
  </g>

  <!-- node 4 (hit) -->
  <circle cx="210" cy="103" r="27" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="210" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="210" y="116" text-anchor="middle" font-size="9.5" fill="#4a6a4a">(24, 6)</text>

  <!-- node 8 (miss) -->
  <circle cx="136" cy="190" r="27" fill="#fff3d9" stroke="#c98a2b" stroke-width="2.4" filter="url(#sk)"/>
  <text x="136" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5a15">8</text>
  <text x="136" y="203" text-anchor="middle" font-size="9.5" fill="#8a6a3a">(9, 3)</text>

  <!-- node 5 (hit) -->
  <circle cx="284" cy="190" r="27" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="284" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">5</text>
  <text x="284" y="203" text-anchor="middle" font-size="9.5" fill="#4a6a4a">(11, 2)</text>

  <!-- leaves (all hit) -->
  <circle cx="93" cy="277" r="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="93" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">0</text>
  <text x="93" y="289" text-anchor="middle" font-size="9" fill="#4a6a4a">(0, 1)</text>
  <circle cx="180" cy="277" r="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="180" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="180" y="289" text-anchor="middle" font-size="9" fill="#4a6a4a">(1, 1)</text>
  <circle cx="315" cy="277" r="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" filter="url(#sk)"/>
  <text x="315" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">6</text>
  <text x="315" y="289" text-anchor="middle" font-size="9" fill="#4a6a4a">(6, 1)</text>

  <!-- postorder badges -->
  <g filter="url(#sk)">
    <circle cx="60" cy="250" r="11" fill="#fff" stroke="#3a3a3a" stroke-width="1.3"/>
    <circle cx="213" cy="250" r="11" fill="#fff" stroke="#3a3a3a" stroke-width="1.3"/>
    <circle cx="101" cy="157" r="11" fill="#fff" stroke="#3a3a3a" stroke-width="1.3"/>
    <circle cx="345" cy="250" r="11" fill="#fff" stroke="#3a3a3a" stroke-width="1.3"/>
    <circle cx="319" cy="157" r="11" fill="#fff" stroke="#3a3a3a" stroke-width="1.3"/>
    <circle cx="173" cy="72" r="11" fill="#fff" stroke="#3a3a3a" stroke-width="1.3"/>
  </g>
  <text x="60" y="254" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="213" y="254" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="101" y="161" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="345" y="254" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <text x="319" y="161" text-anchor="middle" font-size="10.5" fill="#333">5</text>
  <text x="173" y="76" text-anchor="middle" font-size="10.5" fill="#333">6</text>
  <text x="60" y="278" font-size="10" fill="#888">后序序</text>

  <!-- right panel: aggregation identities -->
  <g filter="url(#sk)">
    <rect x="386" y="62" width="272" height="108" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="522" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">聚合等式（左右根合并）</text>
  <text x="522" y="110" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">sum(u) = u.val + sum(L) + sum(R)</text>
  <text x="522" y="130" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">cnt(u) = 1 + cnt(L) + cnt(R)</text>
  <text x="522" y="154" text-anchor="middle" font-size="11" fill="#666">空节点约定返回 (0, 0)</text>

  <!-- right panel: judge & count -->
  <g filter="url(#sk)">
    <rect x="386" y="184" width="272" height="96" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="522" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">回溯到 u 时判定</text>
  <text x="522" y="232" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace">⌊sum / cnt⌋ == u.val ?</text>
  <text x="522" y="256" text-anchor="middle" font-size="11.5" fill="#555">命中则 ans += 1，每个节点恰判定一次</text>

  <!-- right panel: floor detail -->
  <g filter="url(#sk)">
    <rect x="386" y="294" width="272" height="86" rx="10" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="522" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a15">关键细节：向下取整</text>
  <text x="522" y="342" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">11 / 2 = 5（不是 6）</text>
  <text x="522" y="364" text-anchor="middle" font-size="11" fill="#666">值域非负，整除 / 与 // 天然 floor</text>

  <!-- bottom result bar -->
  <g filter="url(#sk)">
    <rect x="40" y="402" width="618" height="44" rx="8" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="60" y="429" font-size="12.5" fill="#333">本例命中：</text>
  <text x="130" y="429" font-size="12.5" fill="#2e6e2e" font-weight="bold">0 ✓  1 ✓  6 ✓  5 ✓  4 ✓</text>
  <text x="330" y="429" font-size="12.5" fill="#8e3a36" font-weight="bold">仅 8 ✗（⌊9/3⌋ = 3 ≠ 8）</text>
  <text x="560" y="429" font-size="13" fill="#2e6e2e" font-weight="bold">ans = 5</text>
</svg>
