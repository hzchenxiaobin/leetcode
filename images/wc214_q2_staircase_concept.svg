<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：正频次槽位互不相同——降序贪心压成阶梯</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 左面板：冲突 -->
  <text x="168" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">冲突：两个字符抢同一档</text>

  <line x1="62" y1="160" x2="62" y2="292" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="70" y1="172" x2="292" y2="172" stroke="#ccc" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <line x1="70" y1="212" x2="292" y2="212" stroke="#ccc" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <line x1="70" y1="252" x2="292" y2="252" stroke="#ccc" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <text x="56" y="176" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="56" y="216" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="56" y="256" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">1</text>

  <g filter="url(#rough2)">
    <rect x="92" y="172" width="44" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="152" y="172" width="44" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="212" y="212" width="44" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="114" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="174" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="234" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="114" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <text x="174" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <text x="234" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>

  <g filter="url(#rough2)">
    <rect x="104" y="152" width="80" height="20" rx="4" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <text x="144" y="142" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">3 = 3 撞档！</text>
  <text x="168" y="330" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">频次 {3, 3, 2}：b 与 a 撞在 3 档</text>

  <!-- 中间箭头 -->
  <path d="M 302 224 L 330 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="214" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">贪心压低</text>

  <!-- 右面板：阶梯 -->
  <text x="475" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">贪心：从大到小压成阶梯 3-2-1</text>

  <line x1="369" y1="160" x2="369" y2="292" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="377" y1="172" x2="599" y2="172" stroke="#ccc" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <line x1="377" y1="212" x2="599" y2="212" stroke="#ccc" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <line x1="377" y1="252" x2="599" y2="252" stroke="#ccc" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <text x="363" y="176" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="363" y="216" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="363" y="256" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">1</text>

  <g filter="url(#rough2)">
    <rect x="399" y="172" width="44" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="459" y="212" width="44" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="519" y="252" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="421" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="481" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="541" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="421" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <text x="481" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">b</text>
  <text x="541" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>

  <path d="M 421 172 L 481 212 L 541 252" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 512 176 L 512 208" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="520" y="196" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">删 1</text>
  <path d="M 572 216 L 572 248" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="580" y="236" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">删 1</text>
  <text x="475" y="330" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">prev：∞ → 3 → 2 → 1，终频次 {3, 2, 1} 互不相同</text>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="40" y="348" width="560" height="68" rx="10" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">压穿 0：target = max(0, prev − 1) = 0 → 该字符全部删光，频次 0 不占槽</text>
  <text x="320" y="396" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">例：频次 [3, 3, 3, 3] → 3, 2, 1, 0，删除 0 + 1 + 2 + 3 = 6</text>
</svg>
