<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：一次排序 + 一次交换</text>
  <path d="M 150 44 Q 280 52 410 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <rect x="30" y="58" width="500" height="168" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">num = 310（正数：升序 + 前导零修正）</text>

  <text x="58" y="114" font-size="12" fill="#555" filter="url(#rough2)">数位</text>
  <rect x="120" y="94" width="34" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="158" y="94" width="34" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="196" y="94" width="34" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="175" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="213" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="280" y="114" font-size="12" fill="#555" filter="url(#rough2)">310</text>

  <path d="M 137 126 L 137 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="160" y="136" font-size="10.5" fill="#666" filter="url(#rough2)">升序排序</text>

  <text x="58" y="162" font-size="12" fill="#555" filter="url(#rough2)">升序</text>
  <rect x="120" y="142" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="158" y="142" width="34" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="196" y="142" width="34" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="175" y="162" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="213" y="162" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="262" y="162" font-size="12" fill="#b85450" filter="url(#rough2)">013 ✗ 前导零</text>

  <path d="M 137 174 L 137 186" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="160" y="184" font-size="10.5" fill="#666" filter="url(#rough2)">swap s[0] ↔ s[1]</text>

  <text x="58" y="210" font-size="12" fill="#555" filter="url(#rough2)">修正</text>
  <rect x="120" y="190" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="158" y="190" width="34" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="196" y="190" width="34" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="175" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="213" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="262" y="210" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">103 ✓</text>

  <rect x="30" y="238" width="500" height="128" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07830" filter="url(#rough2)">num = −7605（负数：降序 + 取负）</text>

  <text x="58" y="296" font-size="12" fill="#555" filter="url(#rough2)">数位</text>
  <rect x="120" y="276" width="34" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="158" y="276" width="34" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="196" y="276" width="34" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="234" y="276" width="34" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="296" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="175" y="296" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="213" y="296" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="251" y="296" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="300" y="296" font-size="12" fill="#555" filter="url(#rough2)">7605 的数位</text>

  <path d="M 175 308 L 175 320" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="198" y="318" font-size="10.5" fill="#666" filter="url(#rough2)">降序排序</text>

  <text x="58" y="344" font-size="12" fill="#555" filter="url(#rough2)">降序</text>
  <rect x="120" y="324" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="158" y="324" width="34" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="196" y="324" width="34" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="234" y="324" width="34" height="30" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <text x="175" y="344" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="213" y="344" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="251" y="344" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="300" y="338" font-size="12" fill="#4a7a3a" filter="url(#rough2)">首位 7 非零 ✓</text>
  <text x="300" y="356" font-size="12.5" font-weight="bold" fill="#a07830" filter="url(#rough2)">取负 → −7650 ✓</text>

  <rect x="30" y="380" width="500" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">自测例：num = 2900710</text>
  <text x="280" y="428" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">升序 → 0001279（前导零）→ 最小非零 1 换到首位 → 1000279 ✓</text>
</svg>
