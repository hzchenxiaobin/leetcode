<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="900" height="510" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：n = 33 与 n = 10^15</text>
  <path d="M 280 42 Q 450 52 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 上半：n = 33 -->
  <g filter="url(#sk)">
    <rect x="30" y="60" width="840" height="196" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="450" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e">n = 33：按升序摆出候选特殊数，找第一个 &gt; 33 的</text>
  <g filter="url(#sk)">
    <rect x="60" y="112" width="60" height="44" rx="6" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <rect x="150" y="112" width="60" height="44" rx="6" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <rect x="240" y="112" width="66" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="334" y="112" width="66" height="44" rx="6" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <rect x="428" y="112" width="76" height="44" rx="6" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <rect x="532" y="112" width="86" height="44" rx="6" fill="#fff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="90" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>
  <text x="180" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">22</text>
  <text x="273" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">212</text>
  <text x="367" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">333</text>
  <text x="466" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">4444</text>
  <text x="575" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">23332</text>
  <text x="636" y="140" font-size="14" font-weight="bold" fill="#888">…</text>
  <text x="90" y="170" text-anchor="middle" font-size="10" fill="#888">S={1}</text>
  <text x="180" y="170" text-anchor="middle" font-size="10" fill="#888">S={2}</text>
  <text x="273" y="170" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">S={1,2}</text>
  <text x="367" y="170" text-anchor="middle" font-size="10" fill="#888">S={3}</text>
  <text x="466" y="170" text-anchor="middle" font-size="10" fill="#888">S={4}</text>
  <text x="575" y="170" text-anchor="middle" font-size="10" fill="#888">S={2,3}</text>
  <path d="M 216 106 Q 233 92 250 106" stroke="#b85450" stroke-width="0" fill="none"/>
  <path d="M 205 185 Q 233 210 262 185" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="233" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">n = 33 落在 22 与 212 之间</text>
  <text x="660" y="200" font-size="12.5" font-weight="bold" fill="#2e6e2e">答案 = 212 ✓</text>
  <text x="60" y="240" font-size="11" fill="#888">（16 位以内的候选总共只有 2296 个，全部生成后取 &gt; n 的最小者）</text>

  <!-- 下半：n = 10^15 -->
  <g filter="url(#sk)">
    <rect x="30" y="276" width="840" height="216" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="450" y="304" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">n = 10^15：15 位之内最大的特殊数都不够，要看 16 位</text>
  <text x="60" y="330" font-size="12" fill="#444">15 位最大特殊数 = 999966696669999 &lt; 10^15 ✗，而 16 位的 S 只有 {2,6,8} 一种：</text>
  <text x="60" y="354" font-size="12" fill="#444">前半 H = {2, 6, 6, 6, 8, 8, 8, 8}，取最小排列 26668888，镜像拼接：</text>
  <g filter="url(#sk)">
    <rect x="60" y="372" width="27" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="89" y="372" width="27" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <rect x="118" y="372" width="27" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <rect x="147" y="372" width="27" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <rect x="176" y="372" width="27" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <rect x="205" y="372" width="27" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <rect x="234" y="372" width="27" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <rect x="263" y="372" width="27" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <rect x="300" y="372" width="27" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <rect x="329" y="372" width="27" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <rect x="358" y="372" width="27" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <rect x="387" y="372" width="27" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <rect x="416" y="372" width="27" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <rect x="445" y="372" width="27" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <rect x="474" y="372" width="27" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <rect x="503" y="372" width="27" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="73.5" y="394" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
  <text x="102.5" y="394" text-anchor="middle" font-size="14" fill="#333">6</text>
  <text x="131.5" y="394" text-anchor="middle" font-size="14" fill="#333">6</text>
  <text x="160.5" y="394" text-anchor="middle" font-size="14" fill="#333">6</text>
  <text x="189.5" y="394" text-anchor="middle" font-size="14" fill="#333">8</text>
  <text x="218.5" y="394" text-anchor="middle" font-size="14" fill="#333">8</text>
  <text x="247.5" y="394" text-anchor="middle" font-size="14" fill="#333">8</text>
  <text x="276.5" y="394" text-anchor="middle" font-size="14" fill="#333">8</text>
  <text x="313.5" y="394" text-anchor="middle" font-size="14" fill="#333">8</text>
  <text x="342.5" y="394" text-anchor="middle" font-size="14" fill="#333">8</text>
  <text x="371.5" y="394" text-anchor="middle" font-size="14" fill="#333">8</text>
  <text x="400.5" y="394" text-anchor="middle" font-size="14" fill="#333">8</text>
  <text x="429.5" y="394" text-anchor="middle" font-size="14" fill="#333">6</text>
  <text x="458.5" y="394" text-anchor="middle" font-size="14" fill="#333">6</text>
  <text x="487.5" y="394" text-anchor="middle" font-size="14" fill="#333">6</text>
  <text x="516.5" y="394" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
  <path d="M 292 412 Q 296 424 299 412" stroke="none" fill="none"/>
  <text x="290" y="362" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">前半（升序最小）</text>
  <text x="452" y="362" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">镜像</text>
  <path d="M 180 424 Q 290 448 400 424" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="290" y="452" text-anchor="middle" font-size="10.5" fill="#4a7a3a">以中缝为轴对称</text>
  <text x="560" y="394" font-size="13" font-weight="bold" fill="#2e6e2e">= 2666888888886662 ✓</text>
  <text x="560" y="416" font-size="11" fill="#555">它是 16 位特殊数中最小的，</text>
  <text x="560" y="434" font-size="11" fill="#555">且 &gt; 10^15 ⟹ 就是答案</text>
  <text x="60" y="476" font-size="11" fill="#888">（999966696669999 与 2666888888886662 之间没有任何特殊数，间隔约 1.7×10^15 —— 这就是不能逐个检查的原因）</text>
</svg>
