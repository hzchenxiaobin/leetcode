<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="165"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">f[i][j] = 以 (i,j) 为顶的完整金字塔最大高度（单格高度记 1）</text>

  <!-- 网格：金字塔 -->
  <text x="170" y="58" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">正金字塔（顶在上，向下展开）</text>
  <g filter="url(#rough2)">
    <rect x="130" y="74" width="40" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="90" y="112" width="40" height="36" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="130" y="112" width="40" height="36" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="170" y="112" width="40" height="36" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="50" y="150" width="40" height="36" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="90" y="150" width="40" height="36" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="130" y="150" width="40" height="36" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="170" y="150" width="40" height="36" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="210" y="150" width="40" height="36" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <text x="150" y="97" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">顶</text>
  <text x="150" y="136" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">h=2 层</text>
  <text x="150" y="173" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">h=3 层</text>

  <!-- 倒金字塔 -->
  <text x="460" y="58" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">倒金字塔（顶在下，向上展开）</text>
  <g filter="url(#rough2)">
    <rect x="340" y="74" width="40" height="36" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="380" y="74" width="40" height="36" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="420" y="74" width="40" height="36" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="460" y="74" width="40" height="36" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="500" y="74" width="40" height="36" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="380" y="112" width="40" height="36" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="420" y="112" width="40" height="36" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="460" y="112" width="40" height="36" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="420" y="150" width="40" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="440" y="173" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">顶</text>

  <!-- 递推 -->
  <rect x="50" y="204" width="520" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="230" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">递推（正金字塔从最后一行向上推，倒金字塔从第一行向下推）：</text>
  <text x="310" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">f[i][j] = 1 + min( f[i±1][j−1], f[i±1][j], f[i±1][j+1] )</text>
  <text x="310" y="286" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">（grid[i][j] = 0 时 f = 0；越界视作 0）</text>
  <text x="310" y="310" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">以 (i,j) 为顶的金字塔数 = f[i][j] − 1（高度 2..f[i][j] 各一个）</text>

  <!-- 依赖示意 -->
  <g filter="url(#rough2)">
    <rect x="150" y="344" width="34" height="30" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="188" y="344" width="34" height="30" rx="3" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="226" y="344" width="34" height="30" rx="3" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <g text-anchor="middle" font-size="11" filter="url(#rough2)">
    <text x="167" y="363" fill="#d6a040">j−1</text>
    <text x="205" y="363" fill="#d6a040">j</text>
    <text x="243" y="363" fill="#d6a040">j+1</text>
  </g>
  <text x="205" y="340" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下一行</text>
  <path d="M 205 376 Q 205 394 205 390" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="186" y="396" width="38" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="415" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(i,j)</text>
  <text x="330" y="380" font-size="12" fill="#446688" filter="url(#rough2)">三角形的下一层 = 三个子三角形</text>
  <text x="330" y="398" font-size="12" fill="#446688" filter="url(#rough2)">的"顶"一字排开，取 min 后 +1</text>
  <text x="330" y="416" font-size="11" fill="#888" filter="url(#rough2)">（这就是"最大高度"DP 的全部）</text>
</svg>
