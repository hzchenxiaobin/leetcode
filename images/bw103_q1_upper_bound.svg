<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：每步得分上界 M+t 与贪心得分重合</text>

  <!-- 阶梯条：得分 5,6,7 -->
  <g filter="url(#rough2)">
    <rect x="120" y="196" width="56" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="148" y="228" text-anchor="middle" font-size="15" fill="#2f4a66">5</text>
    <rect x="188" y="166" width="56" height="84" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="216" y="212" text-anchor="middle" font-size="15" fill="#2f5527">6</text>
    <rect x="256" y="136" width="56" height="114" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="284" y="196" text-anchor="middle" font-size="15" fill="#7a5a10">7</text>
    <text x="148" y="130" text-anchor="middle" font-size="12" fill="#666">t=0</text>
    <text x="216" y="130" text-anchor="middle" font-size="12" fill="#666">t=1</text>
    <text x="284" y="130" font-size="12" fill="#666" text-anchor="middle">t=2</text>
    <path d="M 120 250 L 320 250" stroke="#446688" stroke-width="2" marker-end="url(#arrB)"/>
    <text x="332" y="254" font-size="12" fill="#666">步数</text>
  </g>

  <!-- 上界对照表 -->
  <g filter="url(#rough2)">
    <rect x="350" y="140" width="150" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="360" y="158" font-size="12" fill="#2f4a66">上界 M+t：5, 6, 7</text>
    <rect x="350" y="174" width="150" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="360" y="192" font-size="12" fill="#2f5527">贪心：5, 6, 7（取等）</text>
  </g>

  <!-- 表格演算 -->
  <g filter="url(#rough2)">
    <rect x="60" y="286" width="410" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <text x="70" y="303" font-size="12" fill="#333">第 t 步可选的最大值 ≤ M+t（每次操作数组总和恰 +1）</text>
  </g>

  <!-- 公式框 -->
  <rect x="60" y="318" width="410" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="265" y="336" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">ans = M·k + k(k−1)/2 = 5×3 + 3 = 18</text>

  <text x="70" y="80" font-size="13" fill="#333" filter="url(#rough2)">为什么贪心最优？</text>
  <text x="70" y="102" font-size="12" fill="#555" filter="url(#rough2)">· 引理：t 步操作后，任何元素都不超过 M+t</text>
  <text x="70" y="120" font-size="12" fill="#555" filter="url(#rough2)">· 贪心每步恰好选到上界本身，总和即最大</text>
</svg>
