<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：两条队列模拟决斗，直到一方清空</text>
  <text x="300" y="42" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">队列里存「下标」，下标 + n 表示这个人下一轮的行动时刻</text>

  <rect x="110" y="58" width="300" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="81" text-anchor="middle" font-size="10.5" fill="#2b4a6b" filter="url(#rough2)">① 遍历 senate：'R' 入 R 队，'D' 入 D 队</text>
  <path d="M 260 94 L 260 114" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <polygon points="260,118 390,148 260,178 130,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="260" y="153" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">两队都非空？</text>

  <path d="M 390 148 L 452 148 L 452 184" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="418" y="140" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="440" y="188" width="146" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="513" y="208" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">R 队空 → "Dire"</text>
  <text x="513" y="228" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">D 队空 → "Radiant"</text>

  <path d="M 260 178 L 260 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="274" y="194" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="110" y="202" width="300" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="225" text-anchor="middle" font-size="10.5" fill="#2c5f2c" filter="url(#rough2)">② 弹出 r = R 队首，d = D 队首</text>
  <path d="M 260 238 L 260 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <polygon points="260,262 380,290 260,318 140,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="260" y="295" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">r &lt; d ？</text>

  <path d="M 140 290 L 96 290 L 96 330" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="115" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="36" y="334" width="170" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="121" y="354" text-anchor="middle" font-size="10.5" fill="#2c5f2c" filter="url(#rough2)">R.push(r + n)</text>
  <text x="121" y="374" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">R 赢下决斗，d 出局</text>

  <path d="M 380 290 L 424 290 L 424 330" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="402" y="282" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="316" y="334" width="170" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="401" y="354" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">D.push(d + n)</text>
  <text x="401" y="374" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">D 赢下决斗，r 出局</text>

  <path d="M 36 361 L 20 361 L 20 76 L 106 76" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="14" y="250" transform="rotate(-90 14 250)" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">回到循环</text>

  <text x="300" y="416" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每轮循环恰好淘汰一名 senator，最多 n 轮 ⇒ 时间 O(n)</text>
</svg>
