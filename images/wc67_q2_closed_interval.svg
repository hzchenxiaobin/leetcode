<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 348" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="348" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">片段必须「闭合」：同一字母的全部出现要落在同一段</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 s = "ababcc" 为例：字母 a 出现在下标 0、2，字母 c 出现在下标 4、5</text>

  <!-- 非法划分 -->
  <rect x="30" y="62" width="500" height="94" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="46" y="84" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">✗ 非法划分： ["aba", "bcc"]</text>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="70" y="94" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="87" y="114" fill="#3a4a66">a</text>
    <rect x="106" y="94" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="123" y="114" fill="#3a4a66">b</text>
    <rect x="142" y="94" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="159" y="114" fill="#3a4a66">a</text>

    <rect x="188" y="94" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="205" y="114" fill="#3a5a30">b</text>
    <rect x="224" y="94" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="241" y="114" fill="#3a5a30">c</text>
    <rect x="260" y="94" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="277" y="114" fill="#3a5a30">c</text>
  </g>
  <text x="310" y="114" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">← a 被切成两半，非法</text>
  <text x="46" y="146" font-size="10" fill="#555" filter="url(#rough2)">a 出现在下标 0 与 2，b 出现在 1 与 3，都被拆进两个片段 ⇒ 违反「同一字母最多出现在一个片段」</text>

  <!-- 合法划分 -->
  <rect x="30" y="168" width="500" height="94" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="46" y="190" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">✓ 合法划分： ["abab", "cc"]</text>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="70" y="200" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="87" y="220" fill="#3a4a66">a</text>
    <rect x="106" y="200" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="123" y="220" fill="#3a4a66">b</text>
    <rect x="142" y="200" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="159" y="220" fill="#3a4a66">a</text>
    <rect x="178" y="200" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <text x="195" y="220" fill="#3a4a66">b</text>

    <rect x="222" y="200" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="239" y="220" fill="#3a5a30">c</text>
    <rect x="258" y="200" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="275" y="220" fill="#3a5a30">c</text>
  </g>
  <text x="310" y="220" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">← 第一段吸收到 b 的最后一次出现为止</text>
  <text x="46" y="252" font-size="10" fill="#555" filter="url(#rough2)">a、b 的所有出现都在第一段内，c 的所有出现都在第二段内 ⇒ 每一段都是「闭合」的</text>

  <!-- 闭合条件 -->
  <rect x="30" y="274" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="46" y="294" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">闭合条件：[l, r] 能独立成段 ⟺ 每个 c ∈ s[l..r] 都满足 first[c] ≥ l 且 last[c] ≤ r</text>
  <text x="46" y="312" font-size="10" fill="#555" filter="url(#rough2)">贪心只需盯右边界（start 左侧已被前面的切分清干净），把 r 一路推到 max{last[c]} 即可</text>
  <text x="46" y="326" font-size="9.5" fill="#999" filter="url(#rough2)">反例：s = "abab" 里的 [2, 3] 看似右侧闭合，但 a 在下标 0 也出现过 ⇒ 不能单独成段</text>
</svg>
