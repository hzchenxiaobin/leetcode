<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="199"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">aabaa 的 5 个排列：答案 = 严格更小的排列数 = 2</text>

  <!-- 5 个排列，从上（大）到下（小） -->
  <g filter="url(#rough2)">
    <rect x="180" y="58" width="200" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="85" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" font-family="'Comic Sans MS', monospace" filter="url(#rough2)">baaaa</text>
  <text x="410" y="85" font-size="12" fill="#8a3a34" filter="url(#rough2)">第 5 名</text>

  <path d="M 280 100 L 280 116" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="180" y="120" width="200" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="147" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" font-family="'Comic Sans MS', monospace" filter="url(#rough2)">abaaa</text>
  <text x="410" y="147" font-size="12" fill="#8a3a34" filter="url(#rough2)">第 4 名</text>

  <path d="M 280 162 L 280 178" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="164" y="182" width="232" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="3" rx="8"/>
  </g>
  <text x="280" y="212" text-anchor="middle" font-size="18" fill="#7a5c1e" font-weight="bold" font-family="'Comic Sans MS', monospace" filter="url(#rough2)">aabaa</text>
  <text x="424" y="212" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">← s（起点）</text>

  <path d="M 280 230 L 280 248" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="180" y="252" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="279" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" font-family="'Comic Sans MS', monospace" filter="url(#rough2)">aaaba</text>
  <text x="410" y="279" font-size="12" fill="#2d5a22" filter="url(#rough2)">第 2 名</text>

  <path d="M 280 294 L 280 310" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="180" y="314" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8"/>
  </g>
  <text x="280" y="341" text-anchor="middle" font-size="16" fill="#2d5a22" font-weight="bold" font-family="'Comic Sans MS', monospace" filter="url(#rough2)">aaaab</text>
  <text x="410" y="341" font-size="12" fill="#2d5a22" filter="url(#rough2)">第 1 名（有序）</text>

  <!-- 左侧注释 -->
  <g filter="url(#rough2)" font-size="12" fill="#666">
    <text x="120" y="90" text-anchor="end">比 s 大：2 个</text>
    <text x="120" y="208" text-anchor="end" fill="#7a5c1e" font-weight="bold">排名 3</text>
    <text x="120" y="282" text-anchor="end" fill="#2d5a22">比 s 小：2 个</text>
  </g>
  <text x="120" y="120" text-anchor="end" font-size="12" fill="#8a3a34" filter="url(#rough2)">每次操作降一名</text>

  <!-- 结论框 -->
  <rect x="396" y="60" width="150" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" fill="#2d5a22" text-anchor="middle">
    <text x="471" y="84" font-weight="bold">答案 = 排名 − 1</text>
    <text x="471" y="104">= 3 − 1 = 2 ✓</text>
  </g>
</svg>
