<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <rect width="720" height="450" fill="#fdfcf7"/>
  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">回溯决策树（n = 3）：末位为 1 才允许接着选 0</text>
  <text x="360" y="50" text-anchor="middle" font-size="12" fill="#888">规则：前缀为空 或 末位 '1' → 可选 '0'；末位 '0' → 只能选 '1'（'1' 永远可选）</text>

  <!-- edges -->
  <g filter="url(#sk)">
    <path d="M 310 95 Q 200 120 122 146" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 310 95 Q 420 120 498 146" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 118 172 Q 95 200 82 228" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <path d="M 118 172 Q 140 200 155 228" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 502 172 Q 440 200 390 228" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 502 172 Q 570 200 613 228" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 157 268 Q 125 295 103 322" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 157 268 Q 190 295 212 322" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 387 268 Q 355 295 333 322" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <path d="M 387 268 Q 420 295 442 322" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 617 268 Q 585 295 563 322" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 617 268 Q 650 295 672 322" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- edge labels on root branches -->
  <text x="192" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a88">选 0</text>
  <text x="430" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a88">选 1</text>

  <!-- root -->
  <g filter="url(#sk)">
    <ellipse cx="310" cy="82" rx="42" ry="22" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="310" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">∅ 空</text>

  <!-- level 1 -->
  <g filter="url(#sk)">
    <ellipse cx="118" cy="165" rx="32" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="502" cy="165" rx="32" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="118" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5a88">0</text>
  <text x="502" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5a88">1</text>

  <!-- level 2 -->
  <g filter="url(#sk)">
    <ellipse cx="80" cy="252" rx="36" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4"/>
    <ellipse cx="157" cy="252" rx="36" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="387" cy="252" rx="36" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="617" cy="252" rx="36" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="80" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#a04038">00</text>
  <text x="80" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">✂ 剪：前一位是 0</text>
  <text x="157" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5a88">01</text>
  <text x="387" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5a88">10</text>
  <text x="617" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5a88">11</text>

  <!-- level 3 (leaves) -->
  <g filter="url(#sk)">
    <ellipse cx="100" cy="348" rx="38" ry="23" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="215" cy="348" rx="38" ry="23" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="330" cy="348" rx="38" ry="23" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4"/>
    <ellipse cx="445" cy="348" rx="38" ry="23" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="560" cy="348" rx="38" ry="23" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="675" cy="348" rx="38" ry="23" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="100" y="354" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">010</text>
  <text x="215" y="354" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">011</text>
  <text x="330" y="354" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a04038">100</text>
  <text x="445" y="354" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">101</text>
  <text x="560" y="354" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">110</text>
  <text x="675" y="354" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">111</text>
  <text x="330" y="388" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">✂ 剪：前一位是 0</text>

  <!-- result bar -->
  <g filter="url(#sk)">
    <rect x="40" y="402" width="640" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="360" y="425" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">按「先 0 后 1」展开（字典序）：010, 011, 101, 110, 111 ✓</text>
</svg>
