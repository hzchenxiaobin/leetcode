<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 3：n = 3，trust = [[1,3],[2,3],[3,1]]</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">候选人 3 虽然被两人信任，但他自己信任了 1 —— 出度不为 0</text>

  <rect x="30" y="66" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="65" y="85" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">人</text>
  <rect x="104" y="66" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="144" y="85" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">入度</text>
  <rect x="188" y="66" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="228" y="85" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">出度</text>
  <rect x="272" y="66" width="256" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="284" y="85" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">判定（入度 = 2 且出度 = 0 ？）</text>

  <rect x="30" y="98" width="70" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="65" y="118" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="104" y="98" width="80" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="144" y="118" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="188" y="98" width="80" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="228" y="118" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="272" y="98" width="256" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="284" y="118" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">入度不足</text>

  <rect x="30" y="132" width="70" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="65" y="152" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="104" y="132" width="80" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="144" y="152" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="188" y="132" width="80" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="228" y="152" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="272" y="132" width="256" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="284" y="152" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">入度不足</text>

  <rect x="30" y="166" width="70" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="65" y="186" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="104" y="166" width="80" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="144" y="186" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="188" y="166" width="80" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="228" y="186" font-size="11" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="272" y="166" width="256" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="284" y="186" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">入度够但出度 = 1 ≠ 0，他不是法官</text>

  <rect x="30" y="214" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="7" filter="url(#rough2)"/>
  <text x="42" y="234" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">无人满足两个条件 → 返回 -1。对照示例 2：[[1,3],[2,3]] 时 3 的入度 2、出度 0 → 返回 3。</text>

  <text x="30" y="270" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">n = 1 且 trust 为空时，1 号候选人的入度 0 = n−1、出度 0，返回 1（唯一的「法官」）。</text>
  <text x="30" y="289" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">注意题目保证 trust 中 (a, b) 互不相同，所以直接计数不会重复。</text>
</svg>
