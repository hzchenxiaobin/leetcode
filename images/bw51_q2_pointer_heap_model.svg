<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">模型：下一空位指针 smallest ＋ 回收小根堆 freed</text>

  <!-- 左侧：座位纵列 -->
  <text x="92" y="62" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">座位编号 1..n</text>
  <g filter="url(#rough2)">
    <rect x="60" y="74" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="60" y="108" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="60" y="142" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="60" y="176" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <rect x="60" y="210" width="64" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="60" y="244" width="64" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="92" y="94">1</text><text x="92" y="128">2</text><text x="92" y="162">3</text>
    <text x="92" y="196">4</text><text x="92" y="230">5</text><text x="92" y="264">6</text>
  </g>
  <text x="146" y="200" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">smallest = 4</text>
  <path d="M 208 196 L 130 192" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="216" font-size="10" fill="#888" filter="url(#rough2)">从未发出过的最小编号</text>
  <text x="92" y="296" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1–3 已发出过（可能正被预约，也可能被回收过）</text>

  <!-- 右侧：回收堆 -->
  <rect x="320" y="74" width="200" height="160" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="420" y="98" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">freed：已回收座位的小根堆</text>
  <rect x="400" y="116" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="139" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="420" y="110" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">堆顶（最小）</text>
  <path d="M 530 160 L 448 133" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="524" y="176" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">弹出 → reserve 返回</text>
  <path d="M 420 214 L 420 158" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="420" y="222" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">unreserve(seatNumber) 压入</text>

  <!-- 底部两个说明框 -->
  <rect x="40" y="320" width="235" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="344" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">reserve()：堆非空 → 弹堆顶；</text>
  <text x="56" y="362" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">堆空 → 返回 smallest++。</text>

  <rect x="285" y="320" width="235" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="301" y="344" font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">构造函数 O(1)：不必把 1..n 全入堆，</text>
  <text x="301" y="362" font-size="11.5" fill="#2f5226" filter="url(#rough2)">堆里只会出现被回收过的编号。</text>
</svg>
