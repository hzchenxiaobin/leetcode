<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">分数矩阵：列内严格递增，行内严格递减</text>

  <!-- 列标题 j -->
  <text x="230" y="74" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">j = 1</text>
  <text x="310" y="74" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">j = 2</text>
  <text x="390" y="74" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">j = 3</text>

  <!-- 行标题 i -->
  <text x="176" y="107" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">i = 0</text>
  <text x="176" y="161" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">i = 1</text>
  <text x="176" y="215" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">i = 2</text>
  <text x="176" y="269" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">i = 3</text>

  <!-- 无效格子（i >= j） -->
  <g filter="url(#rough2)">
    <rect x="190" y="134" width="80" height="54" rx="4" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="190" y="188" width="80" height="54" rx="4" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="270" y="188" width="80" height="54" rx="4" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="190" y="242" width="80" height="54" rx="4" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="270" y="242" width="80" height="54" rx="4" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="350" y="242" width="80" height="54" rx="4" fill="#f0f0f0" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="4 4"/>
  </g>
  <text x="230" y="166" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">i ≥ j</text>
  <text x="230" y="220" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">不合法</text>
  <text x="310" y="220" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">不合法</text>

  <!-- 有效格子 -->
  <g filter="url(#rough2)">
    <rect x="190" y="80" width="80" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="270" y="80" width="80" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="350" y="80" width="80" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="270" y="134" width="80" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="350" y="134" width="80" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="350" y="188" width="80" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>

  <g font-size="15" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="230" y="114">1/2</text>
    <text x="310" y="114">1/3</text>
    <text x="390" y="114">1/5</text>
    <text x="310" y="168">2/3</text>
    <text x="390" y="168">2/5</text>
    <text x="390" y="222">3/5</text>
  </g>

  <!-- 列内递增箭头（绿色高亮列 j=3） -->
  <path d="M444,96 L444,214" stroke="#4a7a3a" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="160" text-anchor="middle" font-size="10.5" fill="#4a7a3a"
        transform="rotate(-90 462 160)" filter="url(#rough2)">列内递增</text>

  <!-- 右侧说明 -->
  <rect x="478" y="84" width="216" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="106" font-size="11" fill="#2d4a66" filter="url(#rough2)">列 j 固定：分母不变、分子增</text>
  <text x="490" y="128" font-size="11" fill="#2d4a66" filter="url(#rough2)">⇒ 链首 arr[0]/arr[j] 最小</text>

  <rect x="478" y="152" width="216" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="174" font-size="11" fill="#8a3b38" filter="url(#rough2)">行 i 固定：分子不变、分母增</text>
  <text x="490" y="196" font-size="11" fill="#8a3b38" filter="url(#rough2)">⇒ 越靠右越小，行内递减</text>

  <rect x="478" y="220" width="216" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="242" font-size="11" fill="#8a6420" filter="url(#rough2)">第 j 列恰有 j 个分数</text>
  <text x="490" y="264" font-size="11" fill="#8a6420" filter="url(#rough2)">共 n-1 = 3 条有序链</text>

  <text x="190" y="316" font-size="11" fill="#666" filter="url(#rough2)">格子 = arr[i] / arr[j]，只取上三角 i &lt; j</text>

  <!-- 底部结论 -->
  <rect x="30" y="332" width="660" height="84" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="358" font-size="12" fill="#3a5a30" filter="url(#rough2)">n = 4 时共 C(4,2) = 6 个分数，被 3 条列链不重不漏地覆盖。</text>
  <text x="48" y="382" font-size="12" fill="#3a5a30" filter="url(#rough2)">于是「全体分数的第 k 小」=「3 条有序链归并的第 k 次出堆」。</text>
  <text x="48" y="406" font-size="12" fill="#3a5a30" filter="url(#rough2)">每条链的链首都是 arr[0]/arr[j]，只需 n-1 个候选即可启动归并。</text>
</svg>
