<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：示例 2 的增广矩阵 + 候选验收</text>

  <!-- 列标签 -->
  <text x="121" y="58" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">列 0</text>
  <text x="173" y="58" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">列 1</text>
  <text x="225" y="58" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">列 2</text>
  <text x="277" y="58" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">列 3</text>
  <text x="329" y="58" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">minRow</text>
  <!-- 行标签 -->
  <text x="88" y="92" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">行 0</text>
  <text x="88" y="136" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">行 1</text>
  <text x="88" y="180" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">行 2</text>
  <text x="88" y="224" text-anchor="end" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">maxCol</text>

  <!-- 第 0 行 -->
  <rect x="95" y="64" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="121" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="147" y="64" width="52" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="173" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <rect x="199" y="64" width="52" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="225" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="251" y="64" width="52" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="277" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="303" y="64" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="329" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- 第 1 行 -->
  <rect x="95" y="108" width="52" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="121" y="136" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="147" y="108" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="173" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="199" y="108" width="52" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="225" y="136" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="251" y="108" width="52" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="277" y="136" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="303" y="108" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="329" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- 第 2 行 -->
  <rect x="95" y="152" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="121" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">15</text>
  <rect x="147" y="152" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="173" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">16</text>
  <rect x="199" y="152" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">17</text>
  <rect x="251" y="152" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="277" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">12</text>
  <text x="295" y="166" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">★</text>
  <rect x="303" y="152" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="329" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">12</text>

  <!-- maxCol 行 -->
  <rect x="95" y="196" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="121" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">15</text>
  <rect x="147" y="196" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="173" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">16</text>
  <rect x="199" y="196" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="225" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">17</text>
  <rect x="251" y="196" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="277" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">12</text>

  <!-- 网格说明 -->
  <text x="225" y="262" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">增广矩阵：右列 = 行最小（绿），底行 = 列最大（橙）</text>
  <text x="225" y="280" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">同时被两色标记的格子只有一个：(2,3) = 12</text>

  <!-- 候选 → 右表 的箭头 -->
  <path d="M355,86 C 366,88 370,94 378,104" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="76" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">候选</text>

  <!-- 幸运格 → 结论框 的箭头 -->
  <path d="M303,174 C 330,182 352,196 378,212" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧候选验收表 -->
  <text x="465" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">只验 3 个行最小候选</text>
  <path d="M380,86 L550,86" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="385" y="108" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">(0,0) = 1</text>
  <text x="452" y="108" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">vs maxCol[0] = 15</text>
  <text x="533" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <path d="M380,120 L550,120" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="385" y="142" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">(1,1) = 3</text>
  <text x="452" y="142" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">vs maxCol[1] = 16</text>
  <text x="533" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <path d="M380,154 L550,154" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="385" y="176" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">(2,3) = 12</text>
  <text x="452" y="176" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">vs maxCol[3] = 12</text>
  <text x="533" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 结论框 -->
  <rect x="380" y="200" width="170" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="465" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = [12]</text>
  <text x="465" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">唯一的幸运数是 12</text>

  <!-- 说明框 -->
  <rect x="380" y="272" width="170" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="294" text-anchor="middle" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">元素互异 ⇒ 每行行最小</text>
  <text x="465" y="310" text-anchor="middle" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">位置唯一；幸运数必是</text>
  <text x="465" y="326" text-anchor="middle" font-size="10.5" fill="#2d5a2d" filter="url(#rough2)">行最小 ⇒ 只验 m 个候选</text>

  <!-- 底部对照 -->
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">对照示例 1：候选 (0,0)=3、(1,0)=9 均落选，(2,0)=15 ✓ ⇒ ans = [15]</text>
</svg>
