  <text x="380" y="336" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">每个结点的 left / right 指针原封不动，只把 val 换成「原值 + 所有更大值之和」</text>
  <text x="380" y="356" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">值为 8 的结点是整棵树的最大值，没有更大的值可加，因此保持不变</text>
