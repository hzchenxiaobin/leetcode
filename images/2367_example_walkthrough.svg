<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [0,1,4,6,7,10]，diff = 3</text>
  <path d="M 170 36 Q 340 44 510 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="62" text-anchor="middle" font-size="12" fill="#777" font-family="monospace" filter="url(#sk)">S = {0, 1, 4, 6, 7, 10}</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="45" y="76" width="590" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="95" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">中项 x</text>
  <text x="220" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">x−3 ∈ S ?</text>
  <text x="370" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">x+3 ∈ S ?</text>
  <text x="540" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">贡献</text>

  <!-- rows -->
  <g filter="url(#sk)">
    <rect x="45" y="110" width="590" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="95" y="136" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">0</text>
  <text x="220" y="136" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">−3 <tspan fill="#b85450" font-weight="bold">✗</tspan></text>
  <text x="370" y="136" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">3 <tspan fill="#b85450" font-weight="bold">✗</tspan></text>
  <text x="540" y="136" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#sk)">0</text>

  <g filter="url(#sk)">
    <rect x="45" y="150" width="590" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="95" y="176" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">1</text>
  <text x="220" y="176" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">−2 <tspan fill="#b85450" font-weight="bold">✗</tspan></text>
  <text x="370" y="176" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">4 <tspan fill="#4a8e4a" font-weight="bold">✓</tspan></text>
  <text x="540" y="176" text-anchor="middle" font-size="12.5" fill="#b03a3a" filter="url(#sk)">0（缺左邻）</text>

  <g filter="url(#sk)">
    <rect x="45" y="190" width="590" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="95" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">4</text>
  <text x="220" y="216" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">1 <tspan fill="#4a8e4a" font-weight="bold">✓</tspan></text>
  <text x="370" y="216" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">7 <tspan fill="#4a8e4a" font-weight="bold">✓</tspan></text>
  <text x="540" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">+1 → 值 (1,4,7)</text>

  <g filter="url(#sk)">
    <rect x="45" y="230" width="590" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="95" y="256" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">6</text>
  <text x="220" y="256" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">3 <tspan fill="#b85450" font-weight="bold">✗</tspan></text>
  <text x="370" y="256" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">9 <tspan fill="#b85450" font-weight="bold">✗</tspan></text>
  <text x="540" y="256" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#sk)">0</text>

  <g filter="url(#sk)">
    <rect x="45" y="270" width="590" height="40" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="95" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">7</text>
  <text x="220" y="296" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">4 <tspan fill="#4a8e4a" font-weight="bold">✓</tspan></text>
  <text x="370" y="296" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">10 <tspan fill="#4a8e4a" font-weight="bold">✓</tspan></text>
  <text x="540" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">+1 → 值 (4,7,10)</text>

  <g filter="url(#sk)">
    <rect x="45" y="310" width="590" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="95" y="336" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">10</text>
  <text x="220" y="336" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">7 <tspan fill="#4a8e4a" font-weight="bold">✓</tspan></text>
  <text x="370" y="336" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">13 <tspan fill="#b85450" font-weight="bold">✗</tspan></text>
  <text x="540" y="336" text-anchor="middle" font-size="12.5" fill="#b03a3a" filter="url(#sk)">0（缺右邻）</text>

  <!-- column separators -->
  <g filter="url(#sk)">
    <line x1="145" y1="76" x2="145" y2="350" stroke="#9db8d8" stroke-width="1.2"/>
    <line x1="295" y1="76" x2="295" y2="350" stroke="#9db8d8" stroke-width="1.2"/>
    <line x1="445" y1="76" x2="445" y2="350" stroke="#9db8d8" stroke-width="1.2"/>
  </g>

  <!-- summary -->
  <text x="340" y="384" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">合计：ans = 0 + 0 + 1 + 0 + 1 + 0 = 2 ✓</text>
  <text x="340" y="404" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">即下标三元组 (1,2,4) 与 (2,4,5)，对应值 (1,4,7) 与 (4,7,10)</text>

  <!-- note box -->
  <g filter="url(#sk)">
    <rect x="60" y="416" width="560" height="44" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="340" y="434" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">两端必须齐备：x=1 右邻 4 在场，但左邻 −2 缺失 → 不计</text>
  <text x="340" y="452" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">x=10 左邻 7 在场，但右邻 13 缺失 → 不计</text>
</svg>
