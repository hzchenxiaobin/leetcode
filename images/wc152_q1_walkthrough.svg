<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例走查：n = 5，答案 12</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">质数 3 个 / 质数下标 3 个 → 3!；非质数 2 个 / 非质数下标 2 个 → 2!</text>

  <text x="128" y="90" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">下标 i</text>
  <text x="128" y="126" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">类型</text>
  <text x="128" y="162" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">值</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="140" y="68" width="54" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="167" y="90" fill="#333">1</text>
    <rect x="202" y="68" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="229" y="90" fill="#333">2</text>
    <rect x="264" y="68" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="291" y="90" fill="#333">3</text>
    <rect x="326" y="68" width="54" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="353" y="90" fill="#333">4</text>
    <rect x="388" y="68" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="415" y="90" fill="#333">5</text>

    <rect x="140" y="108" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5"/>
    <text x="167" y="126" fill="#4a7a3a">非</text>
    <rect x="202" y="108" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5"/>
    <text x="229" y="126" fill="#446688">质</text>
    <rect x="264" y="108" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5"/>
    <text x="291" y="126" fill="#446688">质</text>
    <rect x="326" y="108" width="54" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5"/>
    <text x="353" y="126" fill="#4a7a3a">非</text>
    <rect x="388" y="108" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5"/>
    <text x="415" y="126" fill="#446688">质</text>

    <rect x="140" y="140" width="54" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="5"/>
    <text x="167" y="162" fill="#333">1</text>
    <rect x="202" y="140" width="54" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="5"/>
    <text x="229" y="162" fill="#333">2</text>
    <rect x="264" y="140" width="54" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="5"/>
    <text x="291" y="162" fill="#333">5</text>
    <rect x="326" y="140" width="54" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="5"/>
    <text x="353" y="162" fill="#333">4</text>
    <rect x="388" y="140" width="54" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.5" rx="5"/>
    <text x="415" y="162" fill="#333">3</text>
  </g>

  <text x="280" y="192" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">合法排列 [1, 2, 5, 4, 3]：蓝位放质数、绿位放非质数，逐格对得上</text>

  <rect x="50" y="204" width="225" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="162" y="228" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">质数 {2,3,5} → 下标 {2,3,5}</text>
  <text x="162" y="250" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3! = 6 种摆放</text>

  <text x="285" y="242" text-anchor="middle" font-size="17" fill="#8a6a20" filter="url(#rough2)">×</text>

  <rect x="295" y="204" width="225" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="407" y="228" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">非质数 {1,4} → 下标 {1,4}</text>
  <text x="407" y="250" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2! = 2 种摆放</text>

  <rect x="120" y="280" width="320" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">6 × 2 = 12 种合法排列</text>

  <text x="60" y="356" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">反例 [5, 2, 3, 4, 1]（非法）</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="143" y="366" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5"/>
    <text x="168" y="386" fill="#8a3a36" font-weight="bold">5</text>
    <rect x="199" y="366" width="50" height="30" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="224" y="386" fill="#333">2</text>
    <rect x="255" y="366" width="50" height="30" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="280" y="386" fill="#333">3</text>
    <rect x="311" y="366" width="50" height="30" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="336" y="386" fill="#333">4</text>
    <rect x="367" y="366" width="50" height="30" fill="#ffffff" stroke="#999999" stroke-width="1.4" rx="5"/>
    <text x="392" y="386" fill="#333">1</text>
  </g>

  <path d="M 133 381 L 100 381" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="385" text-anchor="end" font-size="10" fill="#8a3a36" filter="url(#rough2)">下标 1</text>

  <text x="280" y="422" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">质数 5 被放在下标 1（非质数下标）→ 违反「质数必须落在质数下标」</text>
</svg>
