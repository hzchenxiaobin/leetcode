<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：定形 → 定向 → 铺前两行 → 逐行剥落</text>

  <!-- A -->
  <rect x="165" y="44" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">建邻接表，统计每点度数</text>
  <path d="M 260 76 L 260 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- B 菱形 -->
  <polygon points="260,88 332,116 260,144 188,116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">存在度 1 的点？</text>

  <!-- 是 → 右分支 -->
  <path d="M 332 116 L 368 116" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="348" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="370" y="96" width="132" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="436" y="112" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">从度 1 端点走链</text>
  <text x="436" y="128" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">直接返回 1×n</text>

  <!-- 否 ↓ -->
  <path d="M 260 144 L 260 160" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="272" y="156" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- C -->
  <rect x="150" y="162" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">cnt3 反解 R+C，联立 R·C=n ⇒ R×C</text>
  <path d="M 260 194 L 260 206" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- D -->
  <rect x="150" y="208" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">取角 a（度 2），枚举 (b,c) 两种朝向</text>
  <path d="M 260 240 L 260 252" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- E -->
  <rect x="150" y="254" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">两条规则同铺前两行</text>

  <!-- 失败回环 -->
  <path d="M 372 270 C 404 270 404 224 372 224" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="428" y="252" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">候选不唯一</text>
  <text x="428" y="266" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">⇒ 换朝向</text>

  <path d="M 260 286 L 260 298" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- F -->
  <rect x="150" y="300" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">规则一逐行剥落至第 R 行 → 返回</text>

  <!-- 左侧注 -->
  <text x="128" y="118" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">链分支</text>
  <text x="128" y="272" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">R=C 时跳过枚举</text>
  <text x="128" y="286" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">一次即成</text>
</svg>
