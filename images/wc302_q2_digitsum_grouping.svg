<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：按数位和分组，组内取前两大</text>

  <!-- nums cells: [18,43,36,13,7], w=76, h=44, y=46 -->
  <rect x="62" y="46" width="76" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">18</text>
  <rect x="152" y="46" width="76" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">43</text>
  <rect x="242" y="46" width="76" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">36</text>
  <rect x="332" y="46" width="76" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">13</text>
  <rect x="422" y="46" width="76" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="75" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">7</text>

  <!-- digit sum annotations -->
  <text x="100" y="112" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">数位和 1+8=9</text>
  <text x="190" y="112" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">数位和 4+3=7</text>
  <text x="280" y="112" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">数位和 3+6=9</text>
  <text x="370" y="112" text-anchor="middle" font-size="11.5" fill="#a08030" filter="url(#rough2)">数位和 1+3=4</text>
  <text x="460" y="112" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">数位和 7</text>

  <!-- arrows into buckets -->
  <path d="M 100 118 Q 102 140 106 160" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 118 Q 220 140 152 160" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 190 118 Q 230 140 268 160" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 460 118 Q 400 140 342 160" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 118 Q 420 140 458 160" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bucket s=9 -->
  <rect x="40" y="166" width="160" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="120" y="190" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">数位和 = 9</text>
  <text x="120" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">组内元素：18, 36</text>
  <text x="120" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">前两大：18 + 36</text>
  <text x="120" y="260" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 54 ⭐</text>

  <!-- bucket s=7 -->
  <rect x="220" y="166" width="160" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="190" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">数位和 = 7</text>
  <text x="300" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">组内元素：43, 7</text>
  <text x="300" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">前两大：43 + 7</text>
  <text x="300" y="260" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 50</text>

  <!-- bucket s=4 -->
  <rect x="400" y="166" width="122" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="461" y="190" text-anchor="middle" font-size="12.5" fill="#a08030" font-weight="bold" filter="url(#rough2)">数位和 = 4</text>
  <text x="461" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">组内元素：13</text>
  <text x="461" y="234" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">只有 1 个元素</text>
  <text x="461" y="260" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">无法配对 ✗</text>

  <!-- result -->
  <rect x="110" y="306" width="340" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">answer = max(54, 50) = 54 ✓</text>

  <!-- bottom note -->
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">nums[i] ≤ 10⁹ ⟹ 数位和 ∈ [1, 81]，分组至多 81 个（键域极小）</text>
</svg>
