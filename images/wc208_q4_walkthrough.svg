<svg xmlns="http://www.w3.org/2000/svg" width="640" height="465" viewBox="0 0 640 465" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="85" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="465" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 走查：全选差一条，丢掉 [3,4] 恰好闭环</text>
  <path d="M 100 38 Q 320 46 540 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="40" y="60" text-anchor="start" font-size="11.5" font-weight="bold" fill="#555" filter="url(#sk)">requests（m = 6，n = 5）：</text>
  <g filter="url(#sk)"><rect x="40" y="70" width="84" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="82" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">r₀ 0→1</text>
  <g filter="url(#sk)"><rect x="130" y="70" width="84" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="172" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">r₁ 1→0</text>
  <g filter="url(#sk)"><rect x="220" y="70" width="84" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="262" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">r₂ 0→1</text>
  <g filter="url(#sk)"><rect x="310" y="70" width="84" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="352" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">r₃ 1→2</text>
  <g filter="url(#sk)"><rect x="400" y="70" width="84" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="442" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">r₄ 2→0</text>
  <g filter="url(#sk)"><rect x="490" y="70" width="84" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="532" y="90" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">r₅ 3→4</text>
  <rect x="486" y="66" width="92" height="38" rx="8" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="532" y="120" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">唯一被丢弃的请求</text>

  <g filter="url(#sk)"><rect x="40" y="132" width="560" height="116" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="60" y="154" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">尝试 ① mask = 111111₂（全选 6 条）</text>
  <text x="99" y="170" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">楼0</text>
  <text x="187" y="170" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">楼1</text>
  <text x="275" y="170" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">楼2</text>
  <text x="363" y="170" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">楼3</text>
  <text x="451" y="170" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">楼4</text>
  <g filter="url(#sk)"><rect x="60" y="176" width="78" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="99" y="197" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="148" y="176" width="78" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="187" y="197" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="236" y="176" width="78" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="275" y="197" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="324" y="176" width="78" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="363" y="197" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">−1</text>
  <g filter="url(#sk)"><rect x="412" y="176" width="78" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="451" y="197" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">+1</text>
  <text x="540" y="198" text-anchor="middle" font-size="24" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>
  <text x="60" y="232" text-anchor="start" font-size="11" fill="#777" filter="url(#sk)">3 号楼只出不进（−1）、4 号楼只进不出（+1）→ nonzero = 2</text>

  <g filter="url(#sk)"><rect x="40" y="262" width="560" height="116" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="60" y="284" text-anchor="start" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">尝试 ② mask = 011111₂（丢掉 r₅ = [3,4]）</text>
  <text x="99" y="300" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">楼0</text>
  <text x="187" y="300" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">楼1</text>
  <text x="275" y="300" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">楼2</text>
  <text x="363" y="300" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">楼3</text>
  <text x="451" y="300" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">楼4</text>
  <g filter="url(#sk)"><rect x="60" y="306" width="78" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="99" y="327" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="148" y="306" width="78" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="187" y="327" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="236" y="306" width="78" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="275" y="327" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="324" y="306" width="78" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="363" y="327" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="412" y="306" width="78" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="451" y="327" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">0</text>
  <text x="540" y="328" text-anchor="middle" font-size="24" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">✓</text>
  <text x="60" y="362" text-anchor="start" font-size="11" fill="#777" filter="url(#sk)">每栋楼 delta = 0 → 可行，ans = popcount = 5</text>

  <g filter="url(#sk)"><rect x="40" y="392" width="560" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="320" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">ans = 5：被选 5 条恰是两个闭环 —— {r₀,r₁} 互换、{r₂,r₃,r₄} 三角轮换</text>
  <text x="320" y="434" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">这正是题面里 “x 与 b 交换”“y、a、z 三人轮换” 的由来</text>
</svg>
