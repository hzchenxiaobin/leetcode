<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#a04038"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：flip() 只翻一个标志，物理数组一字不动</text>
  <path d="M 140 40 Q 340 50 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="60" text-anchor="middle" font-size="12" fill="#888">逻辑视图 logical[i] = bits[i] ⊕ flipped —— 翻转前后 bits 完全相同</text>

  <!-- physical storage -->
  <text x="340" y="90" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#sk)">物理存储 bits[]（唯一一份，flip 从不碰它）</text>
  <g filter="url(#sk)">
    <rect x="243" y="100" width="34" height="34" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="283" y="100" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="323" y="100" width="34" height="34" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="363" y="100" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="403" y="100" width="34" height="34" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="260" y="122">0</text>
    <text x="300" y="122">1</text>
    <text x="340" y="122">0</text>
    <text x="380" y="122">1</text>
    <text x="420" y="122">0</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="260" y="148">0</text>
    <text x="300" y="148">1</text>
    <text x="340" y="148">2</text>
    <text x="380" y="148">3</text>
    <text x="420" y="148">4</text>
  </g>

  <!-- branch arrows with lens labels -->
  <path d="M 285 156 Q 200 185 168 212" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 395 156 Q 480 185 512 212" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="212" y="180" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">⊕ 0 直通</text>
  <text x="448" y="180" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">⊕ 1 取反</text>

  <!-- left panel: flipped = false -->
  <g filter="url(#sk)">
    <rect x="30" y="212" width="280" height="168" rx="10" fill="#f7f8f4" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="170" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#33475e" filter="url(#sk)">视角① flipped = false：直通</text>
  <g filter="url(#sk)">
    <rect x="90" y="250" width="28" height="28" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="123" y="250" width="28" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="4"/>
    <rect x="156" y="250" width="28" height="28" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="189" y="250" width="28" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="4"/>
    <rect x="222" y="250" width="28" height="28" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="104" y="269">0</text>
    <text x="137" y="269">1</text>
    <text x="170" y="269">0</text>
    <text x="203" y="269">1</text>
    <text x="236" y="269">0</text>
  </g>
  <text x="170" y="308" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">逻辑视图 = 物理位（所见即所得）</text>
  <text x="170" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ones = 2</text>
  <text x="170" y="352" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">fix 物理写 1 / unfix 物理写 0（正向）</text>

  <!-- right panel: flipped = true -->
  <g filter="url(#sk)">
    <rect x="370" y="212" width="280" height="168" rx="10" fill="#fbf5f4" stroke="#b85450" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="510" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038" filter="url(#sk)">视角② flipped = true：取反（镜像世界）</text>
  <g filter="url(#sk)">
    <rect x="430" y="250" width="28" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="4"/>
    <rect x="463" y="250" width="28" height="28" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="496" y="250" width="28" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="4"/>
    <rect x="529" y="250" width="28" height="28" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="562" y="250" width="28" height="28" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="444" y="269">1</text>
    <text x="477" y="269">0</text>
    <text x="510" y="269">1</text>
    <text x="543" y="269">0</text>
    <text x="576" y="269">1</text>
  </g>
  <text x="510" y="308" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">逻辑视图 = 物理位取反（0↔1 互换）</text>
  <text x="510" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ones = 3 = 5 − 2</text>
  <text x="510" y="352" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">fix 物理写 0 / unfix 物理写 1（反向）</text>

  <!-- toggle between panels -->
  <path d="M 316 288 L 362 288" stroke="#a04038" stroke-width="2" fill="none" marker-start="url(#arR)" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="339" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038" filter="url(#sk)">flip()</text>
  <text x="339" y="308" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">O(1)</text>

  <!-- bottom banner -->
  <g filter="url(#sk)">
    <rect x="55" y="398" width="570" height="66" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="340" y="421" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">flip() 的全部动作：flipped ← ¬flipped，ones ← n − ones —— 两次赋值，O(1)</text>
  <text x="340" y="444" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">对比：朴素逐位翻转 O(n) × 至多 10⁵ 次 ≈ 5×10⁹ 次位写，必然 TLE</text>
</svg>
