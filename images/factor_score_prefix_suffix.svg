<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#446688"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
  </defs>
  <rect width="640" height="410" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#r)">前缀 / 后缀分解：删掉 i 后 O(1) 拼出 GCD 与 LCM</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- array band -->
  <text x="292" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">✂ 删除</text>
  <rect x="95" y="64" width="150" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <rect x="260" y="64" width="64" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#r)"/>
  <rect x="339" y="64" width="150" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r)"/>
  <text x="170" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#34507a" font-family="monospace" filter="url(#r)">nums[0..i-1]</text>
  <text x="292" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" font-family="monospace" filter="url(#r)">nums[i]</text>
  <line x1="264" y1="84" x2="320" y2="84" stroke="#b85450" stroke-width="1.6" filter="url(#r)"/>
  <text x="414" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#r)">nums[i+1..n-1]</text>
  <text x="170" y="122" text-anchor="middle" font-size="11" fill="#34507a" filter="url(#r)">前缀（保留）</text>
  <text x="414" y="122" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#r)">后缀（保留）</text>
  <path d="M 170 104 Q 170 130 172 146" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <path d="M 414 104 Q 414 130 412 146" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#ag)" filter="url(#r)"/>

  <!-- prefix panel -->
  <rect x="48" y="152" width="250" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#r)"/>
  <text x="173" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34507a" filter="url(#r)">前缀折叠（左 → 右）</text>
  <text x="64" y="196" font-size="12" fill="#333" font-family="monospace" filter="url(#r)">pg[i] = gcd(nums[0..i-1])</text>
  <text x="64" y="214" font-size="12" fill="#333" font-family="monospace" filter="url(#r)">pl[i] = lcm(nums[0..i-1])</text>
  <text x="64" y="234" font-size="11" fill="#666" font-family="monospace" filter="url(#r)">初值 pg[0]=0，pl[0]=1</text>

  <!-- suffix panel -->
  <rect x="342" y="152" width="250" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#r)"/>
  <text x="467" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">后缀折叠（右 → 左）</text>
  <text x="358" y="196" font-size="12" fill="#333" font-family="monospace" filter="url(#r)">sg[i+1] = gcd(nums[i+1..])</text>
  <text x="358" y="214" font-size="12" fill="#333" font-family="monospace" filter="url(#r)">sl[i+1] = lcm(nums[i+1..])</text>
  <text x="358" y="234" font-size="11" fill="#666" font-family="monospace" filter="url(#r)">初值 sg[n]=0，sl[n]=1</text>

  <path d="M 173 246 Q 220 256 262 262" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <path d="M 467 246 Q 420 256 378 262" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#ag)" filter="url(#r)"/>

  <!-- combine box -->
  <rect x="120" y="264" width="400" height="74" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#r)"/>
  <text x="320" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07520" filter="url(#r)">删掉 i 之后（两侧 O(1) 合并）</text>
  <text x="320" y="306" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">g = gcd( pg[i], sg[i+1] )</text>
  <text x="320" y="326" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">l = lcm( pl[i], sl[i+1] ) → 候选得分 = g × l</text>

  <!-- identity note -->
  <rect x="48" y="352" width="544" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#r)"/>
  <text x="320" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">单位元：gcd(0, x) = x，lcm(1, x) = x</text>
  <text x="320" y="390" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">i = 0 或 i = n-1 时一侧为空 → 自动退化，无需特判</text>
</svg>
