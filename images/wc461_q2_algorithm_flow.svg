<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="470" fill="#fafafa"/>
  <text x="350" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：一遍扫描，能闭合就尽早闭合</text>

  <!-- 第一行：开始 → 初始化 → 取元素 -->
  <ellipse cx="68" cy="85" rx="36" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="90" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M104,85 L128,85" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="132" y="63" width="180" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 0，curMax = 0</text>
  <text x="222" y="99" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">哨兵 0 小于任何重量</text>
  <path d="M312,85 L336,85" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="340" y="63" width="190" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="435" y="83" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一个元素 w</text>
  <text x="435" y="99" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">weight 依序扫描</text>
  <path d="M530,85 L556,85" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="543" y="76" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">扫完</text>

  <ellipse cx="604" cy="85" rx="46" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="604" y="90" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">返回 ans</text>

  <!-- 判断菱形 -->
  <path d="M435,107 L435,138" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M435,140 L350,185 L435,230 L520,185 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="435" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">w &lt; curMax ?</text>
  <text x="435" y="199" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">curMax：已扫段最大值</text>

  <!-- 是：闭合 -->
  <path d="M350,185 L302,185" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">是 ✓</text>
  <rect x="88" y="152" width="212" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="194" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans += 1，curMax = 0</text>
  <text x="194" y="194" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">闭合一段平衡装运</text>
  <text x="194" y="209" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">下一段从下一元素重新开始</text>

  <!-- 否：更新 -->
  <path d="M520,185 L570,185" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="545" y="175" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="574" y="160" width="110" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="629" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">curMax = w</text>
  <text x="629" y="198" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">刷新段最大值</text>

  <!-- 回环箭头 -->
  <path d="M194,152 C194,122 390,140 390,107" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="130" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">下一个元素</text>
  <path d="M629,160 C629,125 500,135 500,107" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="580" y="132" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">下一个元素</text>

  <!-- 易错警示框 -->
  <rect x="70" y="268" width="560" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">易错：判断是严格小于 &lt;，不是 ≤</text>
  <text x="350" y="310" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">[4,4]：末尾 4 不严格小于 max 4，不能闭合；写成 ≤ 会错判为平衡</text>

  <!-- 说明框 -->
  <rect x="70" y="352" width="560" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">闭合后 curMax = 0：闭合位置的包裹已属于刚结束的装运</text>
  <text x="350" y="394" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">下一段从下一个元素重新统计最大值；时间 O(n)，空间 O(1)</text>
</svg>
