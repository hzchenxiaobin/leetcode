<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：元音字符串 = 首尾皆元音，中间字符看都不用看</text>

  <!-- Panel 1：artro 解剖 -->
  <rect x="16" y="34" width="608" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="36" y="56" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">"artro"：长度 5</text>

  <rect x="48" y="66" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="66" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="90" y="66" width="36" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="108" y="89" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">r</text>
  <rect x="132" y="66" width="36" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="89" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">t</text>
  <rect x="174" y="66" width="36" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="192" y="89" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">r</text>
  <rect x="216" y="66" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="234" y="89" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o</text>

  <text x="66" y="118" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">首字符 w[0]</text>
  <text x="66" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">a ∈ V ✓</text>
  <text x="150" y="124" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">中间：无关</text>
  <text x="234" y="118" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">尾字符 back()</text>
  <text x="234" y="130" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">o ∈ V ✓</text>

  <path d="M262,84 L318,84" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="324" y="64" width="280" height="40" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="464" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">✓ 是元音字符串</text>
  <text x="464" y="97" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">首 ∧ 尾 两次 O(1) 判定，与串长无关</text>
  <text x="36" y="144" text-anchor="start" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">串长 5 也好、10 也好——判定成本完全相同，取两个下标各查一次 5 元素的集合</text>

  <!-- Panel 2：amy 陷阱 -->
  <rect x="16" y="162" width="608" height="88" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="36" y="184" text-anchor="start" font-size="11.5" font-weight="bold" fill="#a0433f" filter="url(#rough2)">"amy"：'y' 出局——官方示例 1 的考点</text>

  <rect x="48" y="194" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="66" y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="90" y="194" width="36" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="108" y="217" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">m</text>
  <rect x="132" y="194" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="150" y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">y</text>

  <text x="66" y="246" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">首 ✓</text>
  <text x="108" y="246" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">中间</text>
  <text x="150" y="240" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">尾 y ∉ V</text>
  <text x="150" y="250" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">✗</text>

  <path d="M178,212 L234,212" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="192" width="364" height="40" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="422" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0433f" filter="url(#rough2)">✗ 不是元音字符串</text>
  <text x="422" y="225" text-anchor="middle" font-size="9" fill="#a0433f" filter="url(#rough2)">V = {a, e, i, o, u}——'y' 不在其中，别带英语语感进来</text>

  <!-- Panel 3：单字符 -->
  <rect x="16" y="258" width="300" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="32" y="278" text-anchor="start" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">"u"：长度 1——首 = 尾是同一个字符</text>
  <rect x="44" y="288" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="61" y="310" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">u</text>
  <text x="90" y="300" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">w[0] 与 back() 指向同一格</text>
  <text x="90" y="314" text-anchor="start" font-size="9.5" fill="#33506b" filter="url(#rough2)">判定自动覆盖，无需特判长度 ✓</text>

  <!-- Panel 4：元音集合 -->
  <rect x="324" y="258" width="300" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="278" text-anchor="start" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">元音集合 V（题目硬性约定，恰 5 个）</text>
  <rect x="344" y="288" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="358" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="376" y="288" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">e</text>
  <rect x="408" y="288" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="422" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <rect x="440" y="288" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="454" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">o</text>
  <rect x="472" y="288" width="28" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="486" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">u</text>
  <text x="514" y="299" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">'y' ∉ V</text>
  <text x="514" y="313" text-anchor="start" font-size="8.5" fill="#b85450" filter="url(#rough2)">别心软</text>

  <!-- 底部结论 -->
  <rect x="60" y="346" width="520" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="363" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">判定 = V(w[0]) ∧ V(w.back())，与中间字符、与串长均无关，单串 O(1)</text>
  <text x="320" y="380" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">串长 1 时首尾重合于同一格——"u" ✓、"b" ✗，同一套逻辑全覆盖</text>
</svg>
