<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：从「数覆盖次数」到「累加覆盖权值」</text>
  <path d="M 150 38 Q 340 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="340" y="64" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">示例 1：nums = [2,0,2]，queries = [[0,2,1],[0,2,1],[1,1,3]]，考察前 k = 2 个查询</text>

  <!-- nums row -->
  <text x="188" y="112" text-anchor="end" font-size="13" fill="#2b2b2b" font-weight="bold">nums</text>
  <g filter="url(#sk)">
    <rect x="216" y="88" width="62" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="278" y="88" width="62" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="340" y="88" width="62" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="247" y="115" text-anchor="middle" font-size="14.5" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="309" y="115" text-anchor="middle" font-size="14.5" fill="#2b6e9e">0</text>
  <text x="371" y="115" text-anchor="middle" font-size="14.5" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="247" y="146" text-anchor="middle" font-size="10.5" fill="#888">j = 0</text>
  <text x="309" y="146" text-anchor="middle" font-size="10.5" fill="#888">j = 1</text>
  <text x="371" y="146" text-anchor="middle" font-size="10.5" fill="#888">j = 2</text>

  <!-- query bars -->
  <g filter="url(#sk)">
    <rect x="216" y="158" width="186" height="24" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="309" y="175" text-anchor="middle" font-size="11.5" fill="#2b6e9e" font-weight="bold">queries[0] = [0,2] val=1：每个下标各自至多减 1</text>
  <g filter="url(#sk)">
    <rect x="216" y="188" width="186" height="24" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="309" y="205" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">queries[1] = [0,2] val=1：每个下标各自至多减 1</text>
  <g filter="url(#sk)">
    <rect x="278" y="218" width="62" height="24" rx="6" fill="#f4f4f4" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="309" y="235" text-anchor="middle" font-size="10.5" fill="#999">val=3</text>
  <text x="352" y="235" text-anchor="start" font-size="10.5" fill="#999">← queries[2] = [1,1]，k = 2 时未启用</text>

  <!-- arrow -->
  <path d="M 309 250 L 309 264" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="321" y="260" font-size="10.5" fill="#888">按 val 加权累加</text>

  <!-- cover row -->
  <text x="188" y="291" text-anchor="end" font-size="13" fill="#2b2b2b" font-weight="bold">cover_k</text>
  <g filter="url(#sk)">
    <rect x="216" y="268" width="62" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="278" y="268" width="62" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="340" y="268" width="62" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="247" y="291" text-anchor="middle" font-size="14.5" fill="#8a6414" font-weight="bold">2</text>
  <text x="309" y="291" text-anchor="middle" font-size="14.5" fill="#8a6414" font-weight="bold">2</text>
  <text x="371" y="291" text-anchor="middle" font-size="14.5" fill="#8a6414" font-weight="bold">2</text>

  <!-- per-index verdicts -->
  <text x="247" y="326" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">2 ≤ 2 ✓</text>
  <text x="309" y="326" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">0 ≤ 2 ✓</text>
  <text x="371" y="326" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">2 ≤ 2 ✓</text>

  <!-- conclusion box -->
  <g filter="url(#sk)">
    <rect x="40" y="344" width="600" height="112" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="340" y="370" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b">判定(k) ⟺ 对每个 j 都有 nums[j] ≤ cover_k(j)</text>
  <text x="340" y="392" text-anchor="middle" font-size="11.5" fill="#444">cover_k(j) = 前 k 个查询中盖住 j 的那些查询的 val 之和（每个下标独立地在 [0, val_i] 里选减量）</text>
  <text x="340" y="414" text-anchor="middle" font-size="11.5" fill="#444">注意：是「每个下标各自至多减 val_i」，不是「区间总共减 val_i」</text>
  <text x="340" y="438" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">Q2 就是 val ≡ 1 且 k = q 的特例 —— 本题多出两个自由度：权值 val 与查询个数 k</text>
</svg>
