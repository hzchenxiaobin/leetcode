<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.027" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#fafafa"/>

  <g filter="url(#sk2)">
    <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：两个例子各走一遍</text>
    <path d="M 150 40 Q 360 50 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none"/>
  </g>

  <!-- 面板 A -->
  <g filter="url(#sk2)">
    <rect x="30" y="50" width="660" height="212" rx="12" fill="#f4f8ff" stroke="#446688" stroke-width="1.6"/>
    <text x="54" y="78" font-size="14" font-weight="bold" fill="#2b4a6e">示例 2：digits = [8, 6, 7, 1, 0]，S = 22，r = 1</text>
  </g>

  <g filter="url(#sk2)">
    <rect x="60" y="92" width="48" height="42" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="84" y="121" text-anchor="middle" font-size="21" fill="#7a5415">8</text>
    <text x="84" y="152" text-anchor="middle" font-size="11" fill="#7a5415">≡ 2</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="130" y="92" width="48" height="42" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="154" y="121" text-anchor="middle" font-size="21" fill="#2e5e22">6</text>
    <text x="154" y="152" text-anchor="middle" font-size="11" fill="#2e5e22">≡ 0</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="200" y="92" width="48" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="224" y="121" text-anchor="middle" font-size="21" fill="#2b4a6e">7</text>
    <text x="224" y="152" text-anchor="middle" font-size="11" fill="#2b4a6e">≡ 1</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="270" y="92" width="48" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="294" y="121" text-anchor="middle" font-size="21" fill="#2b4a6e">1</text>
    <text x="294" y="152" text-anchor="middle" font-size="11" fill="#2b4a6e">≡ 1</text>
    <ellipse cx="294" cy="113" rx="32" ry="27" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="294" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">删它</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="340" y="92" width="48" height="42" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="364" y="121" text-anchor="middle" font-size="21" fill="#2e5e22">0</text>
    <text x="364" y="152" text-anchor="middle" font-size="11" fill="#2e5e22">≡ 0</text>
  </g>

  <g filter="url(#sk2)">
    <text x="54" y="182" font-size="12" fill="#2b4a6e">类 1 有 {7, 1}，删较小的 1（只删 1 个）</text>
    <text x="54" y="205" font-size="12" fill="#2b4a6e">新数字和 S' = 22 − 1 = 21 ≡ 0 ✓</text>
    <text x="54" y="228" font-size="12" fill="#b85450">若删 7 则剩下 8610，比 8760 小</text>
    <path d="M 410 113 L 450 113" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="456" y="88" width="210" height="84" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="561" y="114" text-anchor="middle" font-size="12" fill="#2e5e22">剩余 {8, 6, 7, 0}</text>
    <text x="561" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e22">答案 "8760"</text>
    <text x="561" y="162" text-anchor="middle" font-size="11" fill="#3f6b33">降序拼接即最大</text>
  </g>

  <!-- 面板 B -->
  <g filter="url(#sk2)">
    <rect x="30" y="274" width="660" height="132" rx="12" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <text x="54" y="300" font-size="14" font-weight="bold" fill="#7a5415">示例 1：digits = [8, 1, 9]，S = 18，r = 0</text>
  </g>

  <g filter="url(#sk2)">
    <rect x="60" y="312" width="48" height="40" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="84" y="340" text-anchor="middle" font-size="21" fill="#7a5415">8</text>
    <text x="84" y="370" text-anchor="middle" font-size="11" fill="#7a5415">≡ 2</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="130" y="312" width="48" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="154" y="340" text-anchor="middle" font-size="21" fill="#2b4a6e">1</text>
    <text x="154" y="370" text-anchor="middle" font-size="11" fill="#2b4a6e">≡ 1</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="200" y="312" width="48" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="224" y="340" text-anchor="middle" font-size="21" fill="#2e5e22">9</text>
    <text x="224" y="370" text-anchor="middle" font-size="11" fill="#2e5e22">≡ 0</text>
  </g>

  <g filter="url(#sk2)">
    <text x="286" y="332" font-size="12" fill="#7a5415">2 + 1 + 0 = 3 ≡ 0，一个都不删</text>
    <text x="286" y="356" font-size="12" fill="#7a5415">全部保留才位数最多、数值最大</text>
    <rect x="470" y="306" width="198" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="569" y="332" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e22">答案 "981"</text>
    <text x="569" y="356" text-anchor="middle" font-size="11" fill="#3f6b33">9 → 8 → 1</text>
  </g>

  <!-- 底部提醒 -->
  <g filter="url(#sk2)">
    <rect x="30" y="420" width="660" height="50" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="360" y="442" text-anchor="middle" font-size="12" fill="#8a3a36">示例 3 [1]：唯一的 1 被删光 → 返回 ""；示例 4 全零 [0,0,0,0,0,0] → 返回 "0"</text>
    <text x="360" y="461" text-anchor="middle" font-size="12" fill="#8a3a36">注意不能返回 "000000"，多余的前导零要去掉。</text>
  </g>
</svg>
