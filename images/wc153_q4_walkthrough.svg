<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="27" font-size="14.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：arr1 = [1,5,3,6,7]，arr2 = [1,3,2,4]</text>
  <text x="320" y="48" font-size="10.5" fill="#777" text-anchor="middle" filter="url(#rough2)">先排序去重得 b = [1,2,3,4]；行 = 处理到 arr1[i] 之后，列 = 用掉的替换次数 c</text>

  <rect x="54" y="78" width="116" height="34" fill="#f0f4f8" stroke="#9db0c8" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="112" y="100" font-size="10.5" fill="#2f4a6b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">i / arr1[i]</text>

  <rect x="176" y="78" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="207" y="100" font-size="11" fill="#2f4a6b" text-anchor="middle" filter="url(#rough2)">c = 0</text>
  <rect x="238" y="78" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="269" y="100" font-size="11" fill="#2f4a6b" text-anchor="middle" filter="url(#rough2)">c = 1</text>
  <rect x="300" y="78" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="331" y="100" font-size="11" fill="#2f4a6b" text-anchor="middle" filter="url(#rough2)">c = 2</text>
  <rect x="362" y="78" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="393" y="100" font-size="11" fill="#2f4a6b" text-anchor="middle" filter="url(#rough2)">c = 3</text>
  <rect x="424" y="78" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="455" y="100" font-size="11" fill="#2f4a6b" text-anchor="middle" filter="url(#rough2)">c = 4</text>

  <rect x="54" y="112" width="116" height="34" fill="#f7f9fc" stroke="#9db0c8" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="112" y="134" font-size="10.5" fill="#444" text-anchor="middle" filter="url(#rough2)">i=0，x=1</text>
  <rect x="176" y="112" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="207" y="134" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="238" y="112" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="269" y="134" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="300" y="112" width="62" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="331" y="134" font-size="12" fill="#aaa" text-anchor="middle" filter="url(#rough2)">∞</text>
  <rect x="362" y="112" width="62" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="393" y="134" font-size="12" fill="#aaa" text-anchor="middle" filter="url(#rough2)">∞</text>
  <rect x="424" y="112" width="62" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="455" y="134" font-size="12" fill="#aaa" text-anchor="middle" filter="url(#rough2)">∞</text>

  <rect x="54" y="146" width="116" height="34" fill="#f7f9fc" stroke="#9db0c8" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="112" y="168" font-size="10.5" fill="#444" text-anchor="middle" filter="url(#rough2)">i=1，x=5</text>
  <rect x="176" y="146" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="207" y="168" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="238" y="146" width="62" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="269" y="168" font-size="12" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="300" y="146" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="331" y="168" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="362" y="146" width="62" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="393" y="168" font-size="12" fill="#aaa" text-anchor="middle" filter="url(#rough2)">∞</text>
  <rect x="424" y="146" width="62" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="455" y="168" font-size="12" fill="#aaa" text-anchor="middle" filter="url(#rough2)">∞</text>

  <rect x="54" y="180" width="116" height="34" fill="#f7f9fc" stroke="#9db0c8" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="112" y="202" font-size="10.5" fill="#444" text-anchor="middle" filter="url(#rough2)">i=2，x=3</text>
  <rect x="176" y="180" width="62" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="207" y="202" font-size="12" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">∞</text>
  <rect x="238" y="180" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="269" y="202" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="300" y="180" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="331" y="202" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="362" y="180" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="393" y="202" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="424" y="180" width="62" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="455" y="202" font-size="12" fill="#aaa" text-anchor="middle" filter="url(#rough2)">∞</text>

  <rect x="54" y="214" width="116" height="34" fill="#f7f9fc" stroke="#9db0c8" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="112" y="236" font-size="10.5" fill="#444" text-anchor="middle" filter="url(#rough2)">i=3，x=6</text>
  <rect x="176" y="214" width="62" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="207" y="236" font-size="12" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">∞</text>
  <rect x="238" y="214" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="269" y="236" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">6</text>
  <rect x="300" y="214" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="331" y="236" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="362" y="214" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="393" y="236" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="424" y="214" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="455" y="236" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">4</text>

  <rect x="54" y="248" width="116" height="34" fill="#f7f9fc" stroke="#9db0c8" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="112" y="270" font-size="10.5" fill="#444" text-anchor="middle" filter="url(#rough2)">i=4，x=7</text>
  <rect x="176" y="248" width="62" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="207" y="270" font-size="12" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">∞</text>
  <rect x="238" y="248" width="62" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="5" filter="url(#rough2)"/>
  <text x="269" y="270" font-size="12.5" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="300" y="248" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="331" y="270" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">7</text>
  <rect x="362" y="248" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="393" y="270" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">7</text>
  <rect x="424" y="248" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="455" y="270" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">7</text>

  <text x="520" y="262" font-size="10" fill="#d6a040" text-anchor="start" font-weight="bold" filter="url(#rough2)">答案 = 1</text>
  <text x="520" y="278" font-size="9.5" fill="#8a6a20" text-anchor="start" filter="url(#rough2)">最小有限 c</text>

  <rect x="40" y="300" width="560" height="104" fill="#f7f9fc" stroke="#9db0c8" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="322" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">读表：第 i 行第 c 列 = 处理完前 i+1 个元素、恰好 c 次替换时，末元素能取到的最小值（∞ 不可达）。</text>
  <text x="56" y="344" font-size="10.5" fill="#2f4a6b" text-anchor="start" filter="url(#rough2)">保留（列号不变）：i=1 行 dp[0]=1，5 &gt; 1 ⇒ i=1 行 c=0 得 5。</text>
  <text x="56" y="366" font-size="10.5" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">替换（列号 +1）：i=1 行 dp[1]=2，b 中 &gt; 2 的最小值是 3 ⇒ i=2 行 c=2 得 3。</text>
  <text x="56" y="388" font-size="10.5" fill="#8a6a20" text-anchor="start" filter="url(#rough2)">i=2 行 c=0 变 ∞：arr1[2]=3 不大于 last=5，且 b 中没有 &gt; 5 的值，这一格被彻底放弃。</text>
</svg>
