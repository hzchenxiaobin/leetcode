<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="'Comic Sans MS','Marker Felt','Kaiti SC','Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="45" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#fafafa"/>

  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：代入公式 + 5^5 的快速幂走查</text>
  <path d="M 250 42 Q 450 52 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 表一：代入公式 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="58" width="780" height="204" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="80" y="82" font-size="13.5" font-weight="bold" fill="#33517a">第一步：把 n 代入 ans = 5^e × 4^o（mod 10^9 + 7）</text>

  <g filter="url(#sk)">
    <rect x="90" y="92" width="730" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="110" y="112" font-size="11.5" font-weight="bold" fill="#33517a">n</text>
  <text x="160" y="112" font-size="11.5" font-weight="bold" fill="#33517a">偶位 e = (n+1)/2</text>
  <text x="300" y="112" font-size="11.5" font-weight="bold" fill="#33517a">奇位 o = n/2</text>
  <text x="440" y="112" font-size="11.5" font-weight="bold" fill="#33517a">公式代入</text>
  <text x="680" y="112" font-size="11.5" font-weight="bold" fill="#33517a">结果</text>

  <g filter="url(#sk)">
    <path d="M 90 122 Q 455 125 820 122" stroke="#446688" stroke-width="1" fill="none"/>
    <path d="M 90 152 Q 455 155 820 152" stroke="#9ab" stroke-width="1" fill="none"/>
    <path d="M 90 182 Q 455 185 820 182" stroke="#9ab" stroke-width="1" fill="none"/>
    <path d="M 90 212 Q 455 215 820 212" stroke="#9ab" stroke-width="1" fill="none"/>
    <path d="M 140 92 Q 143 167 140 242" stroke="#9ab" stroke-width="1" fill="none"/>
    <path d="M 280 92 Q 283 167 280 242" stroke="#9ab" stroke-width="1" fill="none"/>
    <path d="M 420 92 Q 423 167 420 242" stroke="#9ab" stroke-width="1" fill="none"/>
    <path d="M 660 92 Q 663 167 660 242" stroke="#9ab" stroke-width="1" fill="none"/>
  </g>

  <text x="110" y="142" font-size="11.5" fill="#333">1</text>
  <text x="160" y="142" font-size="11.5" fill="#333">1</text>
  <text x="300" y="142" font-size="11.5" fill="#333">0</text>
  <text x="440" y="142" font-size="11.5" fill="#333">5^1 × 4^0 = 5</text>
  <text x="680" y="142" font-size="11.5" font-weight="bold" fill="#4a7a3a">5 ✓</text>

  <text x="110" y="172" font-size="11.5" fill="#333">4</text>
  <text x="160" y="172" font-size="11.5" fill="#333">2</text>
  <text x="300" y="172" font-size="11.5" fill="#333">2</text>
  <text x="440" y="172" font-size="11.5" fill="#333">5^2 × 4^2 = 25 × 16</text>
  <text x="680" y="172" font-size="11.5" font-weight="bold" fill="#4a7a3a">400 ✓</text>

  <text x="110" y="202" font-size="11.5" fill="#333">10</text>
  <text x="160" y="202" font-size="11.5" fill="#333">5</text>
  <text x="300" y="202" font-size="11.5" fill="#333">5</text>
  <text x="440" y="202" font-size="11.5" fill="#333">5^5 × 4^5 = 20^5 = 3125 × 1024</text>
  <text x="680" y="202" font-size="11.5" font-weight="bold" fill="#4a7a3a">3,200,000 ✓</text>

  <text x="110" y="232" font-size="11.5" fill="#333">50</text>
  <text x="160" y="232" font-size="11.5" fill="#333">25</text>
  <text x="300" y="232" font-size="11.5" fill="#333">25</text>
  <text x="440" y="232" font-size="11.5" fill="#333">5^25 × 4^25 = 20^25 mod p</text>
  <text x="680" y="232" font-size="11.5" font-weight="bold" fill="#4a7a3a">564908303 ✓</text>

  <path d="M 450 262 L 450 280" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- ===== 表二：快速幂走查 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="284" width="780" height="256" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="80" y="308" font-size="13.5" font-weight="bold" fill="#2e5e2e">第二步：quickPow(5, 5) 逐轮走查（指数 5 = 101₂，仅 3 轮）</text>

  <g filter="url(#sk)">
    <rect x="90" y="318" width="730" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="108" y="338" font-size="11.5" font-weight="bold" fill="#2e5e2e">轮次</text>
  <text x="195" y="338" font-size="11.5" font-weight="bold" fill="#2e5e2e">exp（二进制）</text>
  <text x="325" y="338" font-size="11.5" font-weight="bold" fill="#2e5e2e">exp &amp; 1</text>
  <text x="455" y="338" font-size="11.5" font-weight="bold" fill="#2e5e2e">result</text>
  <text x="618" y="338" font-size="11.5" font-weight="bold" fill="#2e5e2e">base（轮末自平方后）</text>

  <g filter="url(#sk)">
    <path d="M 90 348 Q 455 351 820 348" stroke="#4a7a3a" stroke-width="1" fill="none"/>
    <path d="M 90 378 Q 455 381 820 378" stroke="#9ab" stroke-width="1" fill="none"/>
    <path d="M 90 408 Q 455 411 820 408" stroke="#9ab" stroke-width="1" fill="none"/>
    <path d="M 90 438 Q 455 441 820 438" stroke="#9ab" stroke-width="1" fill="none"/>
    <path d="M 175 318 Q 178 395 175 468" stroke="#9ab" stroke-width="1" fill="none"/>
    <path d="M 305 318 Q 308 395 305 468" stroke="#9ab" stroke-width="1" fill="none"/>
    <path d="M 435 318 Q 438 395 435 468" stroke="#9ab" stroke-width="1" fill="none"/>
    <path d="M 600 318 Q 603 395 600 468" stroke="#9ab" stroke-width="1" fill="none"/>
  </g>

  <text x="108" y="368" font-size="11.5" fill="#333">初始</text>
  <text x="195" y="368" font-size="11.5" fill="#333">101</text>
  <text x="325" y="368" font-size="11.5" fill="#888">—</text>
  <text x="455" y="368" font-size="11.5" fill="#333">1</text>
  <text x="618" y="368" font-size="11.5" fill="#333">5</text>

  <text x="108" y="398" font-size="11.5" fill="#333">第 1 轮</text>
  <text x="195" y="398" font-size="11.5" fill="#333">101</text>
  <text x="325" y="398" font-size="11" font-weight="bold" fill="#b85450">1 → 收乘</text>
  <text x="455" y="398" font-size="11.5" font-weight="bold" fill="#b85450">1 × 5 = 5</text>
  <text x="618" y="398" font-size="11.5" fill="#333">5² = 25</text>

  <text x="108" y="428" font-size="11.5" fill="#333">第 2 轮</text>
  <text x="195" y="428" font-size="11.5" fill="#333">10</text>
  <text x="325" y="428" font-size="11" font-weight="bold" fill="#888">0 → 跳过</text>
  <text x="455" y="428" font-size="11.5" fill="#888">5（不变）</text>
  <text x="618" y="428" font-size="11.5" fill="#333">25² = 625</text>

  <text x="108" y="458" font-size="11.5" fill="#333">第 3 轮</text>
  <text x="195" y="458" font-size="11.5" fill="#333">1</text>
  <text x="325" y="458" font-size="11" font-weight="bold" fill="#b85450">1 → 收乘</text>
  <text x="455" y="458" font-size="11.5" font-weight="bold" fill="#b85450">5 × 625 = 3125</text>
  <text x="618" y="458" font-size="11.5" fill="#888">625²（不再使用）</text>

  <text x="80" y="492" font-size="11.5" fill="#2e5e2e">exp 归零 → 返回 3125 = 5^5 ✓；n = 10 时 ans = 3125 × 1024 = 3,200,000 = 20^5 ✓</text>
  <text x="80" y="516" font-size="11.5" fill="#2e5e2e">收乘只发生在指数为 1 的二进制位（第 1、3 轮）；第 2 轮只做「平方 + 右移」。</text>

  <!-- ===== 底部观察 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="560" width="780" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="80" y="584" font-size="11.5" fill="#5a4a2a">① n = 1 时 o = 0，quickPow(4, 0) 循环零次直接返回 1——边界天然覆盖，无需特判；</text>
  <text x="80" y="606" font-size="11.5" fill="#5a4a2a">② n 从 10 涨到 10^15，轮数只从 ~4 涨到 ~50——log 复杂度对规模天然免疫，这是快速幂的全部意义。</text>
</svg>
