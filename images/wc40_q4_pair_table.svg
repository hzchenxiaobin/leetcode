<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">两位组合的计数 f(a, b)：只认 10–26</text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">把 '*' 展开成数字后，数「合法两位数」的个数</text>

  <rect x="36" y="60" width="488" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">相邻两位 (a, b)</text>
  <text x="320" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">合法个数 two</text>
  <text x="452" y="79" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">对应取值</text>

  <rect x="36" y="92" width="488" height="46" rx="6" fill="#ffffff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">'*' 与 '*'</text>
  <text x="320" y="120" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">15</text>
  <text x="452" y="120" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">11–19 有 9 个，21–26 有 6 个</text>

  <rect x="36" y="142" width="488" height="46" rx="6" fill="#f7f9fc" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">'*' 与数字 b</text>
  <text x="320" y="170" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2 或 1</text>
  <text x="452" y="170" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">b ≤ 6：1b、2b；b ≥ 7：仅 1b</text>

  <rect x="36" y="192" width="488" height="46" rx="6" fill="#ffffff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">数字 a 与 '*'</text>
  <text x="320" y="220" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">9 / 6 / 0</text>
  <text x="452" y="220" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">a = 1 → 11–19；a = 2 → 21–26</text>

  <rect x="36" y="242" width="488" height="46" rx="6" fill="#f7f9fc" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">数字 a 与数字 b</text>
  <text x="320" y="270" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1 或 0</text>
  <text x="452" y="270" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">10 ≤ 10a + b ≤ 26 才算 1 种</text>

  <text x="280" y="314" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">注意 "*0" 只有 10、20 两种合并方式：0 永远不能单独成码</text>
  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">单个 '*' 的系数恒为 9；两位的系数只可能是 0、1、2、6、9、15</text>
</svg>
