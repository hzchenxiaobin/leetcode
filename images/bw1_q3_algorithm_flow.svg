<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="510" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：按 mask 升序递推，逐状态松弛</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">mask | (1&lt;&lt;j) &gt; mask：转移只会指向数值更大的状态，升序枚举天然是拓扑序</text>

  <g filter="url(#rough2)">
    <rect x="212" y="50" width="96" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="14"/>
  </g>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 78 L 260 88" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="140" y="90" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="260" y="110" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">dp[0] = 0，其余 dp[mask] = INF</text>

  <path d="M 260 122 L 260 132" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="120" y="134" width="280" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="260" y="154" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">for mask = 0 .. 2^M − 1（升序枚举）</text>

  <path d="M 260 166 L 260 176" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,178 352,206 260,234 168,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">dp[mask] ≠ INF ?</text>

  <path d="M 260 234 L 260 246" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="244" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="120" y="248" width="280" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="260" y="268" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">i = popcount(mask)：下一个待分配工人 w_i</text>

  <g filter="url(#rough2)">
    <rect x="14" y="240" width="96" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" rx="6"/>
  </g>
  <text x="62" y="258" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">若 i == N：工人</text>
  <text x="62" y="272" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">已分完，不再转移</text>
  <text x="62" y="286" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">（跳到下一个 mask）</text>
  <path d="M 110 266 L 118 264" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 260 280 L 260 290" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="100" y="292" width="320" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="260" y="312" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">对每辆空闲车 j（mask 第 j 位为 0）</text>

  <path d="M 260 324 L 260 334" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="70" y="336" width="380" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="260" y="356" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">cost = |wx−bx| + |wy−by|（w_i 到 b_j 的曼哈顿距离）</text>
  <text x="260" y="374" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">dp[mask | (1&lt;&lt;j)] ← min(自身, dp[mask] + cost)</text>

  <path d="M 450 360 L 488 360 L 488 150 L 404 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 352 206 L 488 206" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="420" y="198" font-size="10" fill="#999" filter="url(#rough2)">否：不可达，跳过</text>
  <text x="496" y="230" font-size="9.5" fill="#446688" filter="url(#rough2)" transform="rotate(90 496 230)">mask++，重复</text>

  <path d="M 260 384 L 260 398" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="396" font-size="10" fill="#888" filter="url(#rough2)">全部 mask 扫完</text>

  <g filter="url(#rough2)">
    <rect x="100" y="400" width="320" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
  </g>
  <text x="260" y="422" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">答案 = min{ dp[mask] : popcount(mask) = N }</text>
  <text x="260" y="442" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">N &lt; M 时最优解未必用完全部的车——在所有恰含 N 个 1 的状态里取 min</text>

  <text x="260" y="486" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">易错点：只返回 dp[(1&lt;&lt;M)−1]（全部车用尽）在 N &lt; M 时是错的</text>
</svg>
