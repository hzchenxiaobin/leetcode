<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#fdfcf7"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：状压 DP f[S][u][v]</text>
  <path d="M 320 42 Q 480 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- state definition -->
  <g filter="url(#sk)">
    <rect x="90" y="58" width="780" height="82" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="110" y="84" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">状态：f[S][u][v] = 1 ⟺ 存在恰好经过点集 S 的全部节点、两端为 u、v 的回文路径</text>
  <text x="110" y="108" font-size="11.5" fill="#444" filter="url(#sk)">S ⊆ {0,…,n−1} 是「已用点集」（n ≤ 14，共 2¹⁴ 个）；u、v 是当前路径的两个端点</text>
  <text x="110" y="130" font-size="10.5" fill="#888" filter="url(#sk)">例如 S = {0,3,5,6}，u = 0，v = 6：串以节点 0 的字符开头、以节点 6 的字符结尾</text>

  <!-- Box A: init -->
  <g filter="url(#sk)">
    <rect x="60" y="168" width="260" height="190" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="190" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">① 初始化（播种中心）</text>
  <text x="80" y="226" font-size="12" font-family="monospace" fill="#2b2b2b" filter="url(#sk)">f[{w}][w][w] = 1</text>
  <text x="80" y="246" font-size="10.5" fill="#444" filter="url(#sk)">单节点，长度 1（奇回文中心）</text>
  <text x="80" y="280" font-size="12" font-family="monospace" fill="#2b2b2b" filter="url(#sk)">f[{u,v}][u][v] = 1</text>
  <text x="80" y="300" font-size="10.5" fill="#444" filter="url(#sk)">u—v 有边且同字符，长度 2</text>
  <text x="80" y="320" font-size="10.5" fill="#888" filter="url(#sk)">（偶回文中心）</text>
  <g filter="url(#sk)"><circle cx="258" cy="232" r="13" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="258" y="237" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">c</text>
  <line x1="243" y1="304" x2="285" y2="304" stroke="#b8b8b8" stroke-width="2" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="240" cy="304" r="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="240" y="309" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">c</text>
  <g filter="url(#sk)"><circle cx="288" cy="304" r="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="288" y="309" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">c</text>
  <text x="80" y="346" font-size="10.5" fill="#888" filter="url(#sk)">单点态兜底：ans ≥ 1</text>

  <path d="M 324 263 L 350 263" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Box B: transition -->
  <g filter="url(#sk)">
    <rect x="355" y="168" width="290" height="190" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="500" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">② 转移（双端生长）</text>
  <g stroke="#b8b8b8" stroke-width="2">
    <line x1="390" y1="248" x2="462" y2="248" filter="url(#sk)"/>
    <line x1="478" y1="248" x2="532" y2="248" filter="url(#sk)"/>
    <line x1="564" y1="248" x2="620" y2="248" filter="url(#sk)"/>
  </g>
  <g filter="url(#sk)"><circle cx="390" cy="248" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="390" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">a</text>
  <g filter="url(#sk)"><circle cx="462" cy="248" r="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="462" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">u</text>
  <text x="548" y="254" text-anchor="middle" font-size="15" fill="#888" filter="url(#sk)">· · ·</text>
  <g filter="url(#sk)"><circle cx="548" cy="248" r="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="548" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">v</text>
  <g filter="url(#sk)"><circle cx="620" cy="248" r="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="620" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">a</text>
  <text x="370" y="292" font-size="11" fill="#444" filter="url(#sk)">x ∈ N(u)，y ∈ N(v)：分别接在两端外侧</text>
  <text x="370" y="314" font-size="11" fill="#444" filter="url(#sk)">x,y ∉ S，x ≠ y，label(x) = label(y)</text>
  <text x="370" y="342" font-size="12" font-weight="bold" font-family="monospace" fill="#b03a3a" filter="url(#sk)">⟹ f[S∪{x,y}][x][y] = 1</text>

  <path d="M 649 263 L 675 263" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Box C: answer -->
  <g filter="url(#sk)">
    <rect x="680" y="168" width="220" height="190" rx="10" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.5"/>
  </g>
  <text x="790" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a" filter="url(#sk)">③ 汇答案</text>
  <text x="700" y="228" font-size="12.5" font-family="monospace" fill="#5a3a7a" filter="url(#sk)">ans = max popcount(S)</text>
  <text x="700" y="252" font-size="10.5" fill="#444" filter="url(#sk)">对所有 f[S][u][v] = 1 的状态取最大</text>
  <text x="700" y="280" font-size="10.5" fill="#444" filter="url(#sk)">单点态兜底 ans ≥ 1</text>
  <text x="700" y="308" font-size="10.5" fill="#888" filter="url(#sk)">全图无同字符对 → 1</text>
  <text x="700" y="336" font-size="10.5" fill="#888" filter="url(#sk)">（示例 2）</text>

  <!-- enumeration order -->
  <text x="480" y="392" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">枚举顺序：mask 升序，一轮即可</text>
  <g filter="url(#sk)">
    <rect x="70" y="412" width="210" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="175" y="438" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2b6e9e" filter="url(#sk)">for mask = 1 … 2ⁿ−1</text>
  <path d="M 284 434 L 312 434" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <polygon points="455,400 532,434 455,468 378,434" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="455" y="431" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">f[mask][u][v] = 1 ?</text>
  <text x="455" y="446" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">（逐对端点检查）</text>
  <path d="M 534 434 L 562 434" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="548" y="424" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="566" y="412" width="200" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="666" y="438" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">枚举 (x, y) 做双端生长</text>
  <text x="455" y="486" text-anchor="middle" font-size="10" fill="#b03a3a" filter="url(#sk)">否 → 跳过该 (u,v)</text>

  <g filter="url(#sk)">
    <rect x="70" y="502" width="820" height="52" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="90" y="524" font-size="11.5" fill="#444" filter="url(#sk)">关键：新 mask = mask | (1&lt;&lt;x) | (1&lt;&lt;y) 在数值上严格大于 mask，</text>
  <text x="90" y="544" font-size="11.5" fill="#444" filter="url(#sk)">所以 mask 升序单轮枚举即可 —— 处理每个 mask 时，它的所有「来源」都已被处理过。</text>

  <g filter="url(#sk)">
    <rect x="70" y="572" width="820" height="56" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2"/>
  </g>
  <text x="90" y="594" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">规模（n = 14）</text>
  <text x="210" y="594" font-size="11.5" fill="#444" filter="url(#sk)">状态 2¹⁴ × 14 × 14 ≈ 3.2×10⁶；每个状态转移 O(deg u · deg v)</text>
  <text x="90" y="616" font-size="11.5" fill="#444" filter="url(#sk)">最坏（完全图 + 全同字符）约 3.3×10⁷ 次转移；C++ 实测 ≈ 0.1s，Python 大整数位图 ≈ 0.2s</text>
</svg>
