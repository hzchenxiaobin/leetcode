<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：四个条件 = 一次长度检查 + 一趟扫描</text>
  <text x="270" y="50" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">word = "234Adas"：每个字符恰落入四类之一</text>

  <!-- word boxes: 2 3 4 A d a s -->
  <g filter="url(#rough2)">
    <rect x="104" y="66" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <rect x="152" y="66" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <rect x="200" y="66" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5"/>
    <rect x="248" y="66" width="44" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="5"/>
    <rect x="296" y="66" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="5"/>
    <rect x="344" y="66" width="44" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="5"/>
    <rect x="392" y="66" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="5"/>
  </g>
  <g filter="url(#rough2)">
    <text x="126" y="93" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">2</text>
    <text x="174" y="93" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">3</text>
    <text x="222" y="93" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">4</text>
    <text x="270" y="93" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">A</text>
    <text x="318" y="93" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">d</text>
    <text x="366" y="93" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">a</text>
    <text x="414" y="93" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">s</text>
  </g>
  <g filter="url(#rough2)">
    <text x="126" y="122" text-anchor="middle" font-size="11" fill="#446688">数字</text>
    <text x="174" y="122" text-anchor="middle" font-size="11" fill="#446688">数字</text>
    <text x="222" y="122" text-anchor="middle" font-size="11" fill="#446688">数字</text>
    <text x="270" y="122" text-anchor="middle" font-size="11" fill="#d6a040">元音</text>
    <text x="318" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a">辅音</text>
    <text x="366" y="122" text-anchor="middle" font-size="11" fill="#d6a040">元音</text>
    <text x="414" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a">辅音</text>
  </g>

  <!-- left panel: three flags -->
  <g filter="url(#rough2)">
    <rect x="36" y="152" width="240" height="158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="156" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">一趟扫描只需维护</text>
  <g filter="url(#rough2)">
    <text x="52" y="200" font-size="12" fill="#333">hasVowel ←→ 见元音置位</text>
    <text x="52" y="224" font-size="12" fill="#333">hasConsonant ←→ 见辅音置位</text>
    <text x="52" y="248" font-size="12" fill="#333">见 '@' '#' '$' → 立即 false</text>
    <text x="52" y="272" font-size="12" fill="#333">数字 → 合法，两个标记都不动</text>
    <text x="52" y="298" font-size="11" fill="#888">收尾：return hasVowel &amp;&amp; hasConsonant</text>
  </g>

  <!-- right panel: checklist -->
  <g filter="url(#rough2)">
    <rect x="300" y="152" width="204" height="158" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="402" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">四条件核对单</text>
  <g filter="url(#rough2)">
    <text x="316" y="200" font-size="12" fill="#333">① 长度 ≥ 3　✓（7）</text>
    <text x="316" y="224" font-size="12" fill="#333">② 只含字母/数字　✓</text>
    <text x="316" y="248" font-size="12" fill="#333">③ 有元音　✓（A、a）</text>
    <text x="316" y="272" font-size="12" fill="#333">④ 有辅音　✓（d、s）</text>
    <text x="316" y="298" font-size="12" font-weight="bold" fill="#4a7a3a">四条全过 → true</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="36" y="330" width="468" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="270" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">易错点：数字既不是元音也不是辅音（对 ③④ 无贡献）</text>
  <text x="270" y="372" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">另外 'y' 在本题中是辅音；大写元音 A/E/I/O/U 同样要算</text>
</svg>
