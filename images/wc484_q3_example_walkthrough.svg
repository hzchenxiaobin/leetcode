<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="436" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：words = ["ab","aa","za","aa"] 一趟流式计数走查</text>

  <!-- 走查表 -->
  <rect x="30" y="52" width="580" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="148" y="80" width="580" height="0" fill="none"/>
  <rect x="30" y="148" width="580" height="34" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="30" y="182" width="580" height="34" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="30" y="52" width="580" height="164" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="50" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#33506b" filter="url(#rough2)">i</text>
  <text x="115" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#33506b" filter="url(#rough2)">words[i]</text>
  <text x="270" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#33506b" filter="url(#rough2)">逐位 (c − 首字母) mod 26</text>
  <text x="425" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#33506b" filter="url(#rough2)">key</text>
  <text x="510" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#33506b" filter="url(#rough2)">入表前 cnt[key]</text>
  <text x="580" y="70" text-anchor="middle" font-size="10" font-weight="bold" fill="#33506b" filter="url(#rough2)">ans</text>

  <line x1="70" y1="52" x2="70" y2="216" stroke="#c5d5e8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="52" x2="160" y2="216" stroke="#c5d5e8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="52" x2="380" y2="216" stroke="#c5d5e8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="470" y1="52" x2="470" y2="216" stroke="#c5d5e8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="550" y1="52" x2="550" y2="216" stroke="#c5d5e8" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="80" x2="610" y2="80" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="30" y1="114" x2="610" y2="114" stroke="#d8e2ec" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="148" x2="610" y2="148" stroke="#d8e2ec" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="182" x2="610" y2="182" stroke="#d8e2ec" stroke-width="1" filter="url(#rough2)"/>

  <text x="50" y="101" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="115" y="101" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"ab"</text>
  <text x="270" y="101" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(a−a, b−a) = (0, 1)</text>
  <text x="425" y="101" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"ab"</text>
  <text x="510" y="101" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="580" y="101" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>

  <text x="50" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="115" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"aa"</text>
  <text x="270" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(a−a, a−a) = (0, 0)</text>
  <text x="425" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"aa"</text>
  <text x="510" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="580" y="135" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>

  <text x="50" y="169" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="115" y="169" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"za"</text>
  <text x="264" y="166" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">(z−z, a−z+26) = (0, 1)</text>
  <text x="270" y="178" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">a − z = −25 → +26 → 1 ⚠️</text>
  <text x="425" y="169" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">"ab"</text>
  <text x="510" y="169" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="580" y="169" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">1</text>

  <text x="50" y="203" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="115" y="203" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">"aa"</text>
  <text x="270" y="203" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(a−a, a−a) = (0, 0)</text>
  <text x="425" y="203" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">"aa"</text>
  <text x="510" y="203" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="580" y="203" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">2</text>

  <!-- 配对示意 -->
  <rect x="30" y="228" width="580" height="112" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">命中瞬间：ans += cnt[key] 把先前的同键串全部配上对</text>

  <path d="M116,282 C180,240 342,240 404,282" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="180" y="254" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">key 同为 "ab" ⇒ 数对 (0,2)</text>

  <path d="M261,282 C320,262 490,262 549,282" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="470" y="256" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">key 同为 "aa" ⇒ 数对 (1,3)</text>

  <rect x="80" y="284" width="72" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="116" y="298" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b" filter="url(#rough2)">"ab"</text>
  <text x="116" y="312" text-anchor="middle" font-size="9" fill="#6a86a3" filter="url(#rough2)">key: "ab"</text>

  <rect x="225" y="284" width="72" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="261" y="298" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">"aa"</text>
  <text x="261" y="312" text-anchor="middle" font-size="9" fill="#b08a30" filter="url(#rough2)">key: "aa"</text>

  <rect x="370" y="284" width="72" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="406" y="298" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b" filter="url(#rough2)">"za"</text>
  <text x="406" y="312" text-anchor="middle" font-size="9" fill="#6a86a3" filter="url(#rough2)">key: "ab"</text>

  <rect x="515" y="284" width="72" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="551" y="298" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">"aa"</text>
  <text x="551" y="312" text-anchor="middle" font-size="9" fill="#b08a30" filter="url(#rough2)">key: "aa"</text>

  <!-- 底部绿色结论框 -->
  <rect x="30" y="350" width="580" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="368" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">ans 增量 = 入表前同键个数：0 + 0 + 1 + 1 = 2 ✓</text>
  <text x="320" y="386" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">第 g 组第 j 个串入表时贡献 j−1，合计 Σ C(cnt, 2)——与两两枚举完全等价</text>

  <!-- 底部橙色警示框 -->
  <rect x="30" y="404" width="580" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="422" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">⚠️ 关键回绕："za" 第二位 a − z = −25，必须 +26 再取模——C++ 漏 +26 直接 WA（Python 的 % 天然非负）</text>
</svg>
