<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#aaaaaa"/>
    </marker>
  </defs>
  <rect width="700" height="430" fill="#fafafa" filter="url(#rough2)"/>
  <text x="350.0" y="26.0" text-anchor="middle" font-size="15.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">核心观察：状态 (i, j) = 已拼完 key[:i]，12:00 对准 ring[j]</text>
  <path d="M 150 38 Q 350.0 48 550 38" fill="none" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="186" cy="246" r="112" fill="none" stroke="#446688" stroke-width="9" stroke-opacity="0.16" filter="url(#rough2)"/>
  <circle cx="186.0" cy="246.0" r="40.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="186.0" y="240.0" text-anchor="middle" font-size="10.5" fill="#8a6412" filter="url(#rough2)">中心按钮</text>
  <text x="186.0" y="256.0" text-anchor="middle" font-size="10.5" fill="#8a6412" filter="url(#rough2)">press +1</text>
  <path d="M 186.0 162.0 A 84 84 0 0 1 267.9 264.7" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 300 124 L 260 172" fill="none" stroke="#b85450" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="296.0" y="116.0" text-anchor="middle" font-size="10.5" fill="#8f3830" filter="url(#rough2)">顺时针 2 步（取 min）</text>
  <circle cx="186.0" cy="134.0" r="13.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="186.0" y="138.5" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">g</text>
  <text x="186.0" y="112.0" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <circle cx="273.6" cy="176.2" r="13.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="273.6" y="180.7" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">o</text>
  <text x="293.9" y="164.0" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <circle cx="295.2" cy="270.9" r="13.0" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="295.2" y="275.4" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="320.5" y="280.7" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <circle cx="234.6" cy="346.9" r="13.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="234.6" y="351.4" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">d</text>
  <text x="245.9" y="374.3" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <circle cx="137.4" cy="346.9" r="13.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="137.4" y="351.4" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">i</text>
  <text x="126.1" y="374.3" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <circle cx="76.8" cy="270.9" r="13.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76.8" y="275.4" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">n</text>
  <text x="51.5" y="280.7" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <circle cx="98.4" cy="176.2" r="13.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="98.4" y="180.7" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">g</text>
  <text x="78.1" y="164.0" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>
  <path d="M 186 84 L 179 104 L 193 104 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="186.0" y="74.0" text-anchor="middle" font-size="11" fill="#2b4a6e" font-weight="bold" filter="url(#rough2)">12:00</text>
  <text x="350.0" y="392.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">ring = "godding"，n = 7，起点固定在 ring[0] = 'g'</text>
  <text x="350.0" y="410.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">绿色 = 当前 12:00 位置；橙色 = 目标字符 'd' 的两个候选位置 2、3</text>
  <rect x="356.0" y="66.0" width="318.0" height="314.0" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="372.0" y="92.0" text-anchor="start" font-size="13" fill="#2b4a6e" font-weight="bold" filter="url(#rough2)">状态定义</text>
  <text x="372.0" y="111.5" text-anchor="start" font-size="10.8" fill="#333" filter="url(#rough2)">dp[i][j]：拼完 key[:i]，</text>
  <text x="372.0" y="131.0" text-anchor="start" font-size="10.8" fill="#333" filter="url(#rough2)">　　　 12:00 正对 ring[j] 的最少总步数</text>
  <text x="372.0" y="170.0" text-anchor="start" font-size="13" fill="#2e5a24" font-weight="bold" filter="url(#rough2)">只考虑合法位置</text>
  <text x="372.0" y="189.5" text-anchor="start" font-size="10.8" fill="#333" filter="url(#rough2)">ring[j] == key[i] 的位置才可达；</text>
  <text x="372.0" y="209.0" text-anchor="start" font-size="10.8" fill="#333" filter="url(#rough2)">其余 j 的 dp 值为 +∞（剪枝的根源）</text>
  <text x="372.0" y="248.0" text-anchor="start" font-size="13" fill="#8f3830" font-weight="bold" filter="url(#rough2)">两段代价相加</text>
  <text x="372.0" y="267.5" text-anchor="start" font-size="10.8" fill="#333" filter="url(#rough2)">旋转：dist(k, j) = min(|j−k|, n−|j−k|)</text>
  <text x="372.0" y="287.0" text-anchor="start" font-size="10.8" fill="#333" filter="url(#rough2)">按键：固定 +1（拼一个字符必付一次）</text>
  <text x="372.0" y="306.5" text-anchor="start" font-size="10.2" fill="#8f3830" filter="url(#rough2)">本例 0→2：顺时针 2 步 &lt; 逆时针 5 步</text>
  <text x="372.0" y="345.5" text-anchor="start" font-size="11.2" fill="#2b4a6e" font-weight="bold" filter="url(#rough2)">dp[i][j] = min over k : ring[k]=key[i−1]</text>
  <text x="372.0" y="365.0" text-anchor="start" font-size="11.2" fill="#2b4a6e" filter="url(#rough2)">　　　　　{ dp[i−1][k] + dist(k, j) + 1 }</text>
</svg>
