<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arr_green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr_orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arr_red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr_gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#78909c"/>
    </marker>
    <marker id="arr_purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="620" height="390" fill="#fafafa"/>

  <text x="310.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">峰顶二分：只看 mid 与 mid+1 的大小关系</text>
  <text x="310.0" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">严格升 + 严格降 ⇒ 一次比较就能判断 mid 在峰的哪一侧</text>

  <rect x="24" y="66" width="276" height="258" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="320" y="66" width="276" height="258" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <path d="M 45 268 L 90 228 L 135 188 L 180 148 L 225 198 L 265 238" stroke="#7a5ea8" stroke-width="2.0" fill="none" filter="url(#rough2)"/>
  <path d="M 340 268 L 385 228 L 430 188 L 475 148 L 520 198 L 560 238" stroke="#7a5ea8" stroke-width="2.0" fill="none" filter="url(#rough2)"/>
  <text x="162" y="92" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">get(mid) &lt; get(mid+1)：在上升段</text>
  <text x="458" y="92" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">get(mid) ≥ get(mid+1)：在下降段</text>
  <circle cx="90" cy="228" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="232" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="90" y="208" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">mid</text>
  <circle cx="135" cy="188" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="135" y="192" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="135" y="168" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">mid+1</text>
  <path d="M 150 200 L 215 160" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr_green)" filter="url(#rough2)"/>
  <text x="196" y="140" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">峰必在 mid 右侧</text>
  <rect x="72" y="292" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="162.0" y="317.9" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">lo = mid + 1</text>
  <circle cx="520" cy="198" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="202" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="520" y="178" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">mid</text>
  <circle cx="560" cy="238" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="560" y="242" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="560" y="218" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">mid+1</text>
  <path d="M 510 212 L 445 250" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr_orange)" filter="url(#rough2)"/>
  <text x="430" y="276" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">峰在 mid 或左侧</text>
  <rect x="368" y="292" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="458.0" y="317.9" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">hi = mid</text>
  <text x="24" y="372" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">不变量：peak ∈ [lo, hi]。lo == hi 时收敛，唯一候选就是峰顶。</text>
  <text x="24" y="374" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">mid 取 lo + (hi-lo)/2，区间每次至少缩小一半。</text>
</svg>
