<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描，每个元素做一次 O(k) 桶迁移</text>
  <path d="M 160 35 Q 340 42 520 35" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)">
    <rect x="210" y="52" width="260" height="38" rx="8" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.3"/>
  </g>
  <text x="340" y="76" text-anchor="middle" font-size="12.5" fill="#444">初始化 cnt[0..k−1] = 0，result[0..k−1] = 0</text>
  <path d="M 340 90 L 340 108" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 取元素 -->
  <g filter="url(#sk)">
    <rect x="210" y="112" width="260" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="340" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">取 x = nums[i]，v = x mod k</text>
  <text x="340" y="150" text-anchor="middle" font-size="10.5" fill="#4a8edb">i = 0, 1, …, n−1，从左到右单趟</text>
  <path d="M 340 160 L 340 178" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 桶迁移 -->
  <g filter="url(#sk)">
    <rect x="130" y="182" width="420" height="72" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="340" y="203" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">桶迁移：新建 nxt 全 0</text>
  <text x="340" y="222" text-anchor="middle" font-size="12" fill="#2b2b2b">对每个 r ∈ [0, k)：nxt[(r·v) mod k] += cnt[r]（旧段延长）</text>
  <text x="340" y="241" text-anchor="middle" font-size="12" fill="#2e6e2e">nxt[v] += 1（单元素段 [i..i] 新起）；cnt ← nxt</text>
  <path d="M 340 254 L 340 272" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 累加 result -->
  <g filter="url(#sk)">
    <rect x="160" y="276" width="360" height="48" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="340" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">对每个 r：result[r] += cnt[r]</text>
  <text x="340" y="314" text-anchor="middle" font-size="10.5" fill="#2e6e2e">以 i 结尾的全部子数组此刻入账</text>

  <!-- i < n ? -->
  <path d="M 340 324 L 340 340" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <polygon points="340,344 424,382 340,420 256,382" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">i &lt; n ?</text>

  <!-- 是：回环 -->
  <path d="M 256 382 L 80 382 L 80 136 L 204 136" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="112" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- 否：返回 -->
  <path d="M 424 382 L 470 382" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="447" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="476" y="358" width="176" height="48" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="564" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 result</text>
  <text x="564" y="396" text-anchor="middle" font-size="10" fill="#2e6e2e">长度 k 的答案数组</text>

  <!-- 侧注 -->
  <g filter="url(#sk)">
    <rect x="476" y="182" width="176" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="564" y="204" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">⚠ 计数必须 long long</text>
  <text x="564" y="222" text-anchor="middle" font-size="10.5" fill="#b03a3a">总数可达 n(n+1)/2</text>
  <text x="564" y="238" text-anchor="middle" font-size="10.5" fill="#b03a3a">≈ 5×10⁹ &gt; int32</text>

  <g filter="url(#sk)">
    <rect x="28" y="182" width="96" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="76" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a1a">k ≤ 5</text>
  <text x="76" y="220" text-anchor="middle" font-size="10.5" fill="#8a6a1a">内层循环</text>
  <text x="76" y="236" text-anchor="middle" font-size="10.5" fill="#8a6a1a">是常数级</text>

  <text x="340" y="452" text-anchor="middle" font-size="11" fill="#888">对账：Σ result[x] = n(n+1)/2；k = 1 时全部塌缩到 result[0]</text>
</svg>
