<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：每一步只做「下行 + 终点动作」</text>

  <!-- 表头 -->
  <rect x="24" y="44" width="512" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <g font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="34" y="63">#</text>
    <text x="72" y="63">操作</text>
    <text x="272" y="63">实际发生的事</text>
    <text x="452" y="63">返回</text>
  </g>

  <!-- 行 -->
  <g filter="url(#rough2)">
    <rect x="24" y="72" width="512" height="30" fill="#fdfdfd" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="24" y="102" width="512" height="30" fill="#fdfdfd" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="24" y="132" width="512" height="30" fill="#fdfdfd" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="24" y="162" width="512" height="30" fill="#fdfdfd" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="24" y="192" width="512" height="30" fill="#fdfdfd" stroke="#bbb" stroke-width="1" rx="3"/>
  </g>

  <g font-size="9.5" fill="#555" filter="url(#rough2)">
    <text x="34" y="91">1</text>
    <text x="72" y="91">ls("/")</text>
    <text x="272" y="91">根节点 ch 还是空的</text>
    <text x="452" y="91" fill="#b85450">[]</text>

    <text x="34" y="121">2</text>
    <text x="72" y="121">mkdir("/a/b/c")</text>
    <text x="272" y="121">a、b、c 三级都不存在，逐个新建</text>
    <text x="452" y="121">null</text>

    <text x="34" y="151">3</text>
    <text x="72" y="151">add("/a/b/c/d","hello")</text>
    <text x="272" y="151">在 c 下新建文件 d，写入 hello</text>
    <text x="452" y="151">null</text>

    <text x="34" y="181">4</text>
    <text x="72" y="181">ls("/")</text>
    <text x="272" y="181">根的子节点表只有 a，排序后输出</text>
    <text x="452" y="181" fill="#4a7a3a">["a"]</text>

    <text x="34" y="211">5</text>
    <text x="72" y="211">read("/a/b/c/d")</text>
    <text x="272" y="211">下行到 d，返回它的 content</text>
    <text x="452" y="211" fill="#4a7a3a">"hello"</text>
  </g>

  <!-- 最终的内存结构 -->
  <text x="46" y="250" font-size="10" fill="#888" filter="url(#rough2)">第 3 步之后，内存里的结构是：</text>

  <g filter="url(#rough2)">
    <rect x="72" y="262" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <rect x="162" y="262" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="252" y="262" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="342" y="262" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="432" y="262" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="100" y="284" fill="#8a6a20">/</text>
    <text x="190" y="284" fill="#3a4a66">a</text>
    <text x="280" y="284" fill="#3a4a66">b</text>
    <text x="370" y="284" fill="#3a4a66">c</text>
    <text x="460" y="284" fill="#3a5a30">d</text>
  </g>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.5" fill="none">
    <path d="M 128 279 L 156 279" marker-end="url(#arr)"/>
    <path d="M 218 279 L 246 279" marker-end="url(#arr)"/>
    <path d="M 308 279 L 336 279" marker-end="url(#arr)"/>
    <path d="M 398 279 L 426 279" marker-end="url(#arr)"/>
  </g>
  <g font-size="9" text-anchor="middle" fill="#777" filter="url(#rough2)">
    <text x="100" y="310">root</text>
    <text x="460" y="310">isFile=true</text>
  </g>

  <rect x="24" y="326" width="512" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#8a6a20" filter="url(#rough2)">
    <text x="36" y="346">mkdir 与 add 共用「缺节点就新建」的下行逻辑，只在终点不同：add 还要把 isFile 置真并追加内容。</text>
    <text x="36" y="366">ls 的两种分支来自同一个 isFile 标记——目录列出 ch 的 key，文件只回自己的名字。</text>
  </g>
</svg>
