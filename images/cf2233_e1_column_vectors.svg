<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">位串是矩阵的行，信息全在列的多重集里</text>
  <text x="330" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">例子 p = [3, 1, 2, 4]：三个位串被切出来、打乱顺序后交给你</text>

  <rect x="22" y="76" width="186" height="232" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="115" y="102" text-anchor="middle" font-size="14" fill="#1f3b57" filter="url(#rough2)">① 按位切开</text>
  <text x="42" y="136" font-size="12.5" fill="#446688" filter="url(#rough2)">b0: 1 1 0 0</text>
  <text x="42" y="162" font-size="12.5" fill="#446688" filter="url(#rough2)">b1: 1 0 1 0</text>
  <text x="42" y="188" font-size="12.5" fill="#446688" filter="url(#rough2)">b2: 0 0 0 1</text>
  <text x="42" y="226" font-size="12" fill="#66788c" filter="url(#rough2)">行序丢失，可能是</text>
  <text x="42" y="250" font-size="12" fill="#66788c" filter="url(#rough2)">1010 / 0001 / 1100</text>
  <text x="42" y="286" font-size="12" fill="#66788c" filter="url(#rough2)">共 k = 3 个串</text>

  <rect x="237" y="76" width="186" height="232" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="330" y="102" text-anchor="middle" font-size="14" fill="#2c4a22" filter="url(#rough2)">② 竖着看 = 列向量</text>

  <rect x="268" y="124" width="26" height="24" fill="#ffffff" stroke="#4a7a3a" filter="url(#rough2)"/>
  <rect x="294" y="124" width="26" height="24" fill="#ffffff" stroke="#4a7a3a" filter="url(#rough2)"/>
  <rect x="320" y="124" width="26" height="24" fill="#ffffff" stroke="#4a7a3a" filter="url(#rough2)"/>
  <rect x="346" y="124" width="26" height="24" fill="#ffffff" stroke="#4a7a3a" filter="url(#rough2)"/>
  <text x="281" y="141" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">1</text>
  <text x="307" y="141" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">1</text>
  <text x="333" y="141" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">0</text>
  <text x="359" y="141" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">0</text>

  <rect x="268" y="148" width="26" height="24" fill="#ffffff" stroke="#4a7a3a" filter="url(#rough2)"/>
  <rect x="294" y="148" width="26" height="24" fill="#ffffff" stroke="#4a7a3a" filter="url(#rough2)"/>
  <rect x="320" y="148" width="26" height="24" fill="#ffffff" stroke="#4a7a3a" filter="url(#rough2)"/>
  <rect x="346" y="148" width="26" height="24" fill="#ffffff" stroke="#4a7a3a" filter="url(#rough2)"/>
  <text x="281" y="165" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">1</text>
  <text x="307" y="165" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">0</text>
  <text x="333" y="165" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">1</text>
  <text x="359" y="165" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">0</text>

  <rect x="268" y="172" width="26" height="24" fill="#ffffff" stroke="#4a7a3a" filter="url(#rough2)"/>
  <rect x="294" y="172" width="26" height="24" fill="#ffffff" stroke="#4a7a3a" filter="url(#rough2)"/>
  <rect x="320" y="172" width="26" height="24" fill="#ffffff" stroke="#4a7a3a" filter="url(#rough2)"/>
  <rect x="346" y="172" width="26" height="24" fill="#ffffff" stroke="#4a7a3a" filter="url(#rough2)"/>
  <text x="281" y="189" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">0</text>
  <text x="307" y="189" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">0</text>
  <text x="333" y="189" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">0</text>
  <text x="359" y="189" text-anchor="middle" font-size="13" fill="#2c4a22" filter="url(#rough2)">1</text>

  <text x="281" y="216" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="307" y="216" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="333" y="216" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="359" y="216" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">4</text>

  <text x="330" y="252" text-anchor="middle" font-size="12" fill="#2c4a22" filter="url(#rough2)">列 i 读出的数 = 3, 1, 2, 4</text>
  <text x="330" y="276" text-anchor="middle" font-size="11.5" fill="#6a8c5c" filter="url(#rough2)">但行序未知，读法与位序绑定</text>

  <rect x="452" y="76" width="186" height="232" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="545" y="102" text-anchor="middle" font-size="14" fill="#7a5a1c" filter="url(#rough2)">③ 只差坐标置换</text>
  <text x="470" y="138" font-size="12" fill="#8a6a2c" filter="url(#rough2)">合法 ⟺ 存在 σ ∈ S_k</text>
  <text x="470" y="162" font-size="12" fill="#8a6a2c" filter="url(#rough2)">使 σ(列多重集) = {1,…,n}</text>
  <text x="470" y="196" font-size="12" fill="#8a6a2c" filter="url(#rough2)">若有一个 σ₀ 成立，则</text>
  <text x="470" y="220" font-size="12" fill="#8a6a2c" filter="url(#rough2)">全部解 = σ₀ ∘ Aut({1..n})</text>
  <text x="470" y="252" font-size="12.5" fill="#b85450" filter="url(#rough2)">答案 = 0 或 |Aut({1..n})|</text>
  <text x="470" y="284" font-size="11.5" fill="#b08040" filter="url(#rough2)">与收到的串长什么样无关</text>

  <path d="M210,192 L233,192" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"
        filter="url(#rough2)"/>
  <path d="M425,192 L448,192" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"
        filter="url(#rough2)"/>

  <text x="330" y="344" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">换位序 = 对所有列向量同时施加同一个坐标置换</text>
  <text x="330" y="370" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">所以合法赋值的个数只取决于 n，而不取决于数据</text>
</svg>
