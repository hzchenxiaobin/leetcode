<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">只扫描一遍：四种字符，四个动作</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">数字 → 累积 k；'[' → 保存现场；']' → 结算并接回外层；字母 → 直接拼接</text>

  <rect x="200" y="68" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="93" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">遍历 s 中的每个字符 ch</text>

  <path d="M 320 108 L 90 148" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 108 L 242 148" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 108 L 394 148" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 108 L 546 148" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="20" y="152" width="140" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="90" y="179" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">数字 0-9</text>

  <rect x="172" y="152" width="140" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="242" y="179" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">'['</text>

  <rect x="324" y="152" width="140" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="394" y="179" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">']'</text>

  <rect x="476" y="152" width="140" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="546" y="179" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">其他（字母）</text>

  <rect x="20" y="204" width="140" height="78" fill="#fffdf5" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="30" y="228" font-size="9.5" fill="#555" filter="url(#rough2)">num = num*10 + d</text>
  <text x="30" y="248" font-size="9.5" fill="#555" filter="url(#rough2)">支持多位 k（≤300）</text>
  <text x="30" y="268" font-size="9.5" fill="#888" filter="url(#rough2)">如 100[leetcode]</text>

  <rect x="172" y="204" width="140" height="78" fill="#f5f8fd" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="182" y="228" font-size="9.5" fill="#555" filter="url(#rough2)">numStk.push(num)</text>
  <text x="182" y="248" font-size="9.5" fill="#555" filter="url(#rough2)">strStk.push(cur)</text>
  <text x="182" y="268" font-size="9.5" fill="#555" filter="url(#rough2)">num = 0, cur = ""</text>

  <rect x="324" y="204" width="140" height="78" fill="#f5faf3" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="334" y="228" font-size="9.5" fill="#555" filter="url(#rough2)">k = numStk.pop()</text>
  <text x="334" y="248" font-size="9.5" fill="#555" filter="url(#rough2)">base = strStk.pop()</text>
  <text x="334" y="268" font-size="9.5" fill="#555" filter="url(#rough2)">cur = base + cur×k</text>

  <rect x="476" y="204" width="140" height="78" fill="#fdf5f6" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="486" y="228" font-size="9.5" fill="#555" filter="url(#rough2)">cur += ch</text>
  <text x="486" y="248" font-size="9.5" fill="#555" filter="url(#rough2)">字母不涉及换层</text>
  <text x="486" y="268" font-size="9.5" fill="#888" filter="url(#rough2)">直接留在本层</text>

  <path d="M 90 282 C 90 306, 160 316, 232 326" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 242 282 L 296 326" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 394 282 L 382 326" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 546 282 C 546 306, 470 316, 408 326" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="330" width="360" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="320" y="352" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">扫描结束：两个栈都已空，cur 就是解码结果</text>
  <text x="320" y="370" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">直接返回 cur —— 不需要再展开任何东西</text>

  <text x="320" y="408" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">']' 之后之所以不用再拼外层前缀，是因为 base 在 '[' 时就已经存进了栈里</text>
  <text x="320" y="428" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">全程只扫一遍输入，每个字符都是 O(1) 动作（拼接代价另算）</text>
</svg>
