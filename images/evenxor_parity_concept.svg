<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：置位数的奇偶 = 逐节点奇偶之和</text>
  <path d="M 140 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ LEFT: bitwise additivity ============ -->
  <text x="162" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 异或不进位 ⇒ 奇偶可加</text>

  <!-- row x = 11 = 1011 -->
  <text x="80" y="92" text-anchor="end" font-size="11.5" fill="#444">x = 11</text>
  <g filter="url(#sk)">
    <rect x="88" y="76" width="26" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="116" y="76" width="26" height="24" rx="4" fill="#eef2f7" stroke="#9aa7b5" stroke-width="1.2"/>
    <rect x="144" y="76" width="26" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="172" y="76" width="26" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="101" y="93" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">1</text>
  <text x="129" y="93" text-anchor="middle" font-size="12.5" fill="#6a7887">0</text>
  <text x="157" y="93" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">1</text>
  <text x="185" y="93" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">1</text>
  <text x="210" y="93" font-size="11.5" font-weight="bold" fill="#b85450">置位 3 · 奇</text>

  <!-- row y = 6 = 0110 -->
  <text x="80" y="126" text-anchor="end" font-size="11.5" fill="#444">y = 6</text>
  <g filter="url(#sk)">
    <rect x="88" y="110" width="26" height="24" rx="4" fill="#eef2f7" stroke="#9aa7b5" stroke-width="1.2"/>
    <rect x="116" y="110" width="26" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="144" y="110" width="26" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="172" y="110" width="26" height="24" rx="4" fill="#eef2f7" stroke="#9aa7b5" stroke-width="1.2"/>
  </g>
  <text x="101" y="127" text-anchor="middle" font-size="12.5" fill="#6a7887">0</text>
  <text x="129" y="127" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">1</text>
  <text x="157" y="127" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">1</text>
  <text x="185" y="127" text-anchor="middle" font-size="12.5" fill="#6a7887">0</text>
  <text x="210" y="127" font-size="11.5" font-weight="bold" fill="#4a8edb">置位 2 · 偶</text>

  <!-- row xor = 13 = 1101 -->
  <text x="80" y="160" text-anchor="end" font-size="11.5" fill="#444">x ⊕ y = 13</text>
  <g filter="url(#sk)">
    <rect x="88" y="144" width="26" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="116" y="144" width="26" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="144" y="144" width="26" height="24" rx="4" fill="#eef2f7" stroke="#9aa7b5" stroke-width="1.2"/>
    <rect x="172" y="144" width="26" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="101" y="161" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">1</text>
  <text x="129" y="161" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">1</text>
  <text x="157" y="161" text-anchor="middle" font-size="12.5" fill="#6a7887">0</text>
  <text x="185" y="161" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">1</text>
  <text x="210" y="161" font-size="11.5" font-weight="bold" fill="#b85450">置位 3 · 奇</text>

  <text x="162" y="194" text-anchor="middle" font-size="11.5" fill="#555">奇 + 偶 = 奇 ✓（3 + 2 ≡ 3，mod 2）</text>

  <g filter="url(#sk)">
    <rect x="24" y="206" width="276" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="162" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">popcount(x ⊕ y)</text>
  <text x="162" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">≡ popcount(x) + popcount(y) (mod 2)</text>

  <g filter="url(#sk)">
    <rect x="24" y="276" width="276" height="66" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="162" y="298" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">推广：路径异或的置位奇偶</text>
  <text x="162" y="315" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">= 路径上各点置位奇偶之和 (mod 2)</text>
  <text x="162" y="331" text-anchor="middle" font-size="10.5" fill="#2e6e2e">⇒ 染色之后，无需真的计算异或</text>

  <!-- ============ RIGHT: coloring ============ -->
  <text x="466" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">② 染色：只数路径上「奇节点」个数</text>

  <!-- tree: edges 0=1 (5), 1=2 (10), example 2 -->
  <text x="380" y="118" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="466" y="118" text-anchor="middle" font-size="11" fill="#666">1</text>
  <text x="552" y="118" text-anchor="middle" font-size="11" fill="#666">2</text>
  <g filter="url(#sk)">
    <path d="M 404 150 L 442 150" stroke="#999999" stroke-width="2" fill="none"/>
    <path d="M 490 150 L 528 150" stroke="#999999" stroke-width="2" fill="none"/>
  </g>
  <!-- balanced edge highlight 0-1 -->
  <g filter="url(#sk)">
    <path d="M 404 150 L 442 150" stroke="#4a7a3a" stroke-width="4.5" opacity="0.5" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <rect x="413" y="128" width="20" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="499" y="128" width="20" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="423" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">5</text>
  <text x="509" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">10</text>

  <g filter="url(#sk)">
    <circle cx="380" cy="150" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="466" cy="150" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="552" cy="150" r="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="380" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">1</text>
  <text x="466" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">7</text>
  <text x="552" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="380" y="196" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">1 个 1 · 奇</text>
  <text x="466" y="196" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">3 个 1 · 奇</text>
  <text x="552" y="196" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a8edb">2 个 1 · 偶</text>

  <text x="316" y="232" font-size="11.5" font-weight="bold" fill="#2e6e2e">路径 0—1：红点 2 个（偶）→ 平衡 ✓ 开销 5</text>
  <text x="316" y="252" font-size="11.5" fill="#b85450">路径 1—2：红点 1 个（奇）→ 不平衡 ✗</text>
  <text x="316" y="272" font-size="11.5" fill="#2e6e2e">路径 0—1—2：红点 2 个 → 平衡 ✓ 开销 15</text>

  <g filter="url(#sk)">
    <circle cx="338" cy="306" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="460" cy="306" r="7" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="352" y="310" font-size="10.5" fill="#555">奇节点 b = 1</text>
  <text x="474" y="310" font-size="10.5" fill="#555">偶节点 b = 0</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="24" y="356" width="592" height="56" rx="8" fill="#f4f0e6" stroke="#9a8a5a" stroke-width="1.3"/>
  </g>
  <text x="320" y="378" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6a5a2a">b(v) = popcount(values[v]) mod 2 —— 红 = 1（置位奇数），蓝 = 0（置位偶数）</text>
  <text x="320" y="398" text-anchor="middle" font-size="11.5" fill="#6a5a2a">平衡异或路径 ⟺ 树上简单路径中红点个数恰为偶数（异或值本身不再需要）</text>
</svg>
