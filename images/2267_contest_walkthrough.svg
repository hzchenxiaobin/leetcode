  <text x="451" y="254" text-anchor="middle" font-size="11" fill="#9a6a15">B 在第 2 步贴到 0 —— 允许（只要不穿到 0 以下）</text>

  <!-- strip: example 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="300" width="620" height="124" rx="10" fill="#fdf6ee" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="60" y="324" font-size="13" font-weight="bold" fill="#9a6a15">示例 2：O(1) 剪枝直接出局</text>
  <g filter="url(#sk)">
    <rect x="76" y="336" width="38" height="38" rx="4" fill="#fff" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3"/>
    <rect x="114" y="336" width="38" height="38" rx="4" fill="#fff" stroke="#7a96ad" stroke-width="1.6"/>
    <rect x="76" y="374" width="38" height="38" rx="4" fill="#fff" stroke="#7a96ad" stroke-width="1.6"/>
    <rect x="114" y="374" width="38" height="38" rx="4" fill="#fff" stroke="#7a96ad" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)">
    <text x="95" y="361" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">)</text>
    <text x="133" y="361" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">)</text>
    <text x="95" y="399" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">(</text>
    <text x="133" y="399" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">(</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 80 340 L 110 370" stroke="#b85450" stroke-width="2.5"/>
    <path d="M 110 340 L 80 370" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <text x="180" y="348" font-size="12" fill="#333">首格即 ')'：起步 balance = −1 &lt; 0，违反下界；</text>
  <text x="180" y="372" font-size="12" fill="#333">无需任何搜索，O(1) 判定直接返回 false。</text>
  <text x="180" y="396" font-size="12" fill="#666">两条仅有的候选路径 "))(" 与 ")((" 也同样非法。</text>

  <!-- bottom bar -->
  <g filter="url(#sk)">
    <rect x="40" y="444" width="620" height="100" rx="8" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="60" y="470" font-size="12.5" fill="#333">剪枝清单（均为必要条件，任一不满足即 false）：m+n 为奇（路径长为偶）· 首 '(' · 末 ')'。</text>
  <text x="60" y="496" font-size="12.5" fill="#333">自构造示例 3：grid = [["(","("],[")",")"]]（2×2）→ m+n = 4 为偶，路径长 3 为奇数，</text>
  <text x="60" y="520" font-size="12.5" fill="#333">任何括号串都不合法 → false，搜索零成本。</text>
</svg>
