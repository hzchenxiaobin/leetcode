    <text x="259" y="130" text-anchor="middle" font-size="11" fill="#444">2</text><text x="309" y="130" text-anchor="middle" font-size="11" fill="#444">(0,1)</text><text x="364" y="130" text-anchor="middle" font-size="11" fill="#444">(</text><text x="410" y="130" text-anchor="middle" font-size="11" fill="#444">2</text>
    <text x="259" y="154" text-anchor="middle" font-size="11" fill="#444">3</text><text x="309" y="154" text-anchor="middle" font-size="11" fill="#444">(0,2)</text><text x="364" y="154" text-anchor="middle" font-size="11" fill="#444">(</text><text x="410" y="154" text-anchor="middle" font-size="11" fill="#444">3</text>
    <text x="259" y="178" text-anchor="middle" font-size="11" fill="#444">4</text><text x="309" y="178" text-anchor="middle" font-size="11" fill="#444">(1,2)</text><text x="364" y="178" text-anchor="middle" font-size="11" fill="#444">)</text><text x="410" y="178" text-anchor="middle" font-size="11" fill="#444">2</text>
    <text x="259" y="202" text-anchor="middle" font-size="11" fill="#444">5</text><text x="309" y="202" text-anchor="middle" font-size="11" fill="#444">(2,2)</text><text x="364" y="202" text-anchor="middle" font-size="11" fill="#444">)</text><text x="410" y="202" text-anchor="middle" font-size="11" fill="#444">1</text>
  </g>
  <g filter="url(#sk)">
    <rect x="388" y="210" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)">
    <text x="259" y="226" text-anchor="middle" font-size="11" fill="#444">6</text><text x="309" y="226" text-anchor="middle" font-size="11" fill="#444">(3,2)</text><text x="364" y="226" text-anchor="middle" font-size="11" fill="#444">)</text><text x="410" y="226" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">0</text>
