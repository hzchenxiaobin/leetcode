    <text x="489" y="130" text-anchor="middle" font-size="11" fill="#444">2</text><text x="539" y="130" text-anchor="middle" font-size="11" fill="#444">(1,0)</text><text x="594" y="130" text-anchor="middle" font-size="11" fill="#444">)</text><text x="640" y="130" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a6a15">0</text>
    <text x="489" y="154" text-anchor="middle" font-size="11" fill="#444">3</text><text x="539" y="154" text-anchor="middle" font-size="11" fill="#444">(1,1)</text><text x="594" y="154" text-anchor="middle" font-size="11" fill="#444">(</text><text x="640" y="154" text-anchor="middle" font-size="11" fill="#444">1</text>
    <text x="489" y="178" text-anchor="middle" font-size="11" fill="#444">4</text><text x="539" y="178" text-anchor="middle" font-size="11" fill="#444">(2,1)</text><text x="594" y="178" text-anchor="middle" font-size="11" fill="#444">(</text><text x="640" y="178" text-anchor="middle" font-size="11" fill="#444">2</text>
