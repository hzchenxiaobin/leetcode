<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">下标被分成两类：质数下标与非质数下标</text>
  <text x="290" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">质数只能落进质数下标；两侧个数恰好相等，于是变成「一一对应」</text>

  <text x="120" y="80" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">值集合 {1, 2, …, 7}</text>
  <text x="460" y="80" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">位置集合（下标 1…7）</text>

  <rect x="30" y="92" width="180" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="120" y="116" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">质数  p = 4</text>
  <text x="120" y="136" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2  3  5  7</text>
  <text x="120" y="156" text-anchor="middle" font-size="10" fill="#557" filter="url(#rough2)">个数 = π(n)</text>

  <rect x="30" y="190" width="180" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="120" y="214" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">非质数  c = 3</text>
  <text x="120" y="234" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1  4  6</text>
  <text x="120" y="254" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">个数 = n − p（1 在这里）</text>

  <rect x="370" y="92" width="180" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="460" y="116" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">质数下标  p 个</text>
  <text x="460" y="136" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2  3  5  7</text>
  <text x="460" y="156" text-anchor="middle" font-size="10" fill="#557" filter="url(#rough2)">位置 2,3,5,7</text>

  <rect x="370" y="190" width="180" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="460" y="214" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">非质数下标  c 个</text>
  <text x="460" y="234" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1  4  6</text>
  <text x="460" y="254" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">位置 1,4,6</text>

  <path d="M 216 129 L 362 129" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="289" y="120" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">p! = 4! 种双射</text>

  <path d="M 216 227 L 362 227" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="289" y="218" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">c! = 3! 种双射</text>

  <rect x="70" y="286" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="290" y="311" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">答案 = p! × c!   （乘法原理）</text>
  <text x="290" y="333" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">两类下标互不相交、互不争用，方案数可以直接相乘</text>

  <text x="290" y="374" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">n = 7 时：4! × 3! = 24 × 6 = 144</text>
</svg>
