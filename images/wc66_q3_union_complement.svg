<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">共同空闲 = 忙碌并集 U 的补集</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 1：schedule = [[[1,2],[5,6]], [[1,3]], [[4,10]]]</text>

  <text x="230" y="70" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">缺口：三人都空闲</text>

  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="end">
    <text x="78" y="114">员工 0</text>
    <text x="78" y="156">员工 1</text>
    <text x="78" y="198">员工 2</text>
    <text x="78" y="252" fill="#8a6a20">并集 U</text>
    <text x="78" y="316" fill="#3a5a30">空闲</text>
  </g>

  <rect x="90" y="96" width="420" height="24" rx="4" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="130" y="99" width="40" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="290" y="99" width="40" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="90" y="138" width="420" height="24" rx="4" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="130" y="141" width="80" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="90" y="180" width="420" height="24" rx="4" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="250" y="183" width="240" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="90" y="232" width="420" height="28" rx="4" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="130" y="236" width="80" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="250" y="236" width="240" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="90" y="296" width="420" height="26" rx="4" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="210" y="299" width="40" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>

  <rect x="210" y="84" width="40" height="252" fill="#e6f4ea" opacity="0.45" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="9" fill="#33506e" text-anchor="middle">
    <text x="150" y="112">1-2</text>
    <text x="310" y="112">5-6</text>
    <text x="170" y="154">1-3</text>
    <text x="370" y="196">4-10</text>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#7a5a10" text-anchor="middle">
    <text x="170" y="250">[1,3)</text>
    <text x="370" y="250">[4,10)</text>
  </g>
  <text x="230" y="313" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">[3,4)</text>

  <path d="M 90 350 L 530 350" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="9" fill="#999" text-anchor="middle">
    <text x="90" y="366">0</text>
    <text x="130" y="366">1</text>
    <text x="170" y="366">2</text>
    <text x="210" y="366">3</text>
    <text x="250" y="366">4</text>
    <text x="290" y="366">5</text>
    <text x="330" y="366">6</text>
    <text x="370" y="366">7</text>
    <text x="410" y="366">8</text>
    <text x="450" y="366">9</text>
    <text x="490" y="366">10</text>
    <text x="530" y="366">11</text>
  </g>

  <text x="310" y="392" text-anchor="middle" font-size="9.3" fill="#888" filter="url(#rough2)">并集段 [1,3)、[4,10) 之间的缝隙 [3,4) 就是答案；两端无限区间不计入</text>
</svg>
