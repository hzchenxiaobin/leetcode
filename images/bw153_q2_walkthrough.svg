<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">四个示例一起看：ones 与最大增益</text>
  <text x="270" y="47" text-anchor="middle" font-size="11" fill="#888">答案永远等于「原有 1 的个数 + 最优一次操作的净增益」</text>

  <rect x="40" y="62" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="115" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">s</text>
  <rect x="190" y="62" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">ones</text>
  <rect x="270" y="62" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="345" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">候选 Δ</text>
  <rect x="420" y="62" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="460" y="84" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">答案</text>

  <rect x="40" y="100" width="150" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="123" text-anchor="middle" font-size="11.5" fill="#333">"01"</text>
  <rect x="190" y="100" width="80" height="36" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="123" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <rect x="270" y="100" width="150" height="36" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="345" y="123" text-anchor="middle" font-size="10.5" fill="#888">无内部 1-段 → 0</text>
  <rect x="420" y="100" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="460" y="123" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">1</text>

  <rect x="40" y="140" width="150" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="163" text-anchor="middle" font-size="11.5" fill="#333">"0100"</text>
  <rect x="190" y="140" width="80" height="36" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="163" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <rect x="270" y="140" width="150" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="345" y="163" text-anchor="middle" font-size="10.5" fill="#8a6a20">1 + 2 = 3</text>
  <rect x="420" y="140" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="460" y="163" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">4</text>

  <rect x="40" y="180" width="150" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="203" text-anchor="middle" font-size="11.5" fill="#333">"1000100"</text>
  <rect x="190" y="180" width="80" height="36" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="203" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <rect x="270" y="180" width="150" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="345" y="203" text-anchor="middle" font-size="10.5" fill="#8a6a20">3 + 2 = 5</text>
  <rect x="420" y="180" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="460" y="203" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">7</text>

  <rect x="40" y="220" width="150" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="243" text-anchor="middle" font-size="11.5" fill="#333">"01010"</text>
  <rect x="190" y="220" width="80" height="36" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="243" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <rect x="270" y="220" width="150" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="345" y="243" text-anchor="middle" font-size="10.5" fill="#8a6a20">1 + 1 = 2（两段并列）</text>
  <rect x="420" y="220" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="460" y="243" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">4</text>

  <rect x="76" y="278" width="388" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="10" filter="url(#rough2)"/>
  <text x="270" y="299" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">"01010" 里两个 1-段都能翻，各自 Δ = 2，取其一即可</text>
  <text x="270" y="316" text-anchor="middle" font-size="10" fill="#888">多个候选时取最大——一次操作只能换一个 1-段</text>
</svg>
