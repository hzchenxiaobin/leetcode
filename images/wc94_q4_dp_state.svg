<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="660" height="370" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">状态设计：dp[j][i] = 以 arr[j]、arr[i] 结尾的最长斐波那契子序列长度</text>

  <!-- 数组 -->
  <g>
    <rect x="40" y="60" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="68" y="88" text-anchor="middle" font-size="14" fill="#2c4a63" filter="url(#rough2)">1</text>
    <rect x="102" y="60" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="130" y="88" text-anchor="middle" font-size="14" fill="#2c4a63" filter="url(#rough2)">2</text>
    <rect x="164" y="60" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="192" y="88" text-anchor="middle" font-size="14" fill="#2c4a63" filter="url(#rough2)">3</text>
    <rect x="226" y="60" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="254" y="88" text-anchor="middle" font-size="14" fill="#33562a" filter="url(#rough2)">5</text>
    <rect x="288" y="60" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="316" y="88" text-anchor="middle" font-size="14" fill="#8a6410" filter="url(#rough2)">8</text>
  </g>
  <text x="68" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">k=0</text>
  <text x="130" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="192" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="254" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j=3</text>
  <text x="316" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=4</text>

  <!-- 关系 -->
  <path d="M254 108 L254 140" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M316 108 L316 140" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M254 146 L316 146" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="285" y="166" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">最后两项</text>

  <!-- 递推框 -->
  <rect x="40" y="182" width="316" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="198" y="206" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">要找的前一项：arr[k] = arr[i] − arr[j]</text>
  <text x="198" y="232" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">= 8 − 5 = 3，查哈希表得 k = 2</text>
  <text x="198" y="256" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">要求 k &lt; j（否则顺序不对）</text>

  <!-- 转移 -->
  <path d="M356 224 L400 224" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="402" y="182" width="234" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="519" y="212" text-anchor="middle" font-size="13" fill="#8a6410" filter="url(#rough2)">dp[j][i] = dp[k][j] + 1</text>
  <text x="519" y="238" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">= dp[2][3] + 1 = 2 + 1 = 3</text>
  <text x="519" y="258" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">序列 [1, 2, 3] ... 待续</text>

  <!-- 注意 -->
  <rect x="40" y="290" width="596" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="338" y="314" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">三条必须同时满足的判定：① arr[i] − arr[j] 在数组中存在；② 它的下标 k &lt; j；③ 由 ① ② 才能累加</text>
  <text x="338" y="338" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">初值 dp[*][*] = 2（任何两个数都算长度为 2 的「准斐波那契」起点），答案只在发生转移时更新</text>
</svg>
