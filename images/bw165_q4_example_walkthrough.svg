<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1：nums = [1,2,3] 的全部子集异或</text>
  <rect x="70" y="80" width="100" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="120" y="104" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">S = {}</text>
  <text x="120" y="130" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">异或 = 0</text>
  <rect x="190" y="80" width="100" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="240" y="104" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">S = {1}</text>
  <text x="240" y="130" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">异或 = 1</text>
  <rect x="310" y="80" width="100" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="360" y="104" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">S = {2}</text>
  <text x="360" y="130" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">异或 = 2</text>
  <rect x="430" y="80" width="100" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="480" y="104" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">S = {3}</text>
  <text x="480" y="130" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">异或 = 3</text>
  <rect x="70" y="170" width="100" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="120" y="194" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">S = {1,2}</text>
  <text x="120" y="220" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">异或 = 3</text>
  <rect x="190" y="170" width="100" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="240" y="194" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">S = {1,3}</text>
  <text x="240" y="220" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">异或 = 2</text>
  <rect x="310" y="170" width="100" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="360" y="194" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">S = {2,3}</text>
  <text x="360" y="220" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">异或 = 1</text>
  <rect x="430" y="170" width="100" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="480" y="194" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">S = {1,2,3}</text>
  <text x="480" y="220" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">异或 = 0</text>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">最大值为 3（1⊕2、{3}、{1,2} 三种方式都能达到）</text>
  <text x="280" y="322" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">线性基实际存入 basis[0]=1 与 basis[1]=2，贪心从高位起取到 3</text>
</svg>
