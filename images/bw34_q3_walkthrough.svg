<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    示例 1 双指针演算：arr = [1,2,3,10,4,2,3,5]
  </text>

  <text x="150" y="62" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">
    left = 3，right = 5，初始 ans = min(5, 4) = 4
  </text>

  <!-- 表头 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="13" fill="#666">
    <text x="96" y="92">r</text>
    <text x="188" y="92">arr[r]</text>
    <text x="288" y="92">l 推进到</text>
    <text x="412" y="92">删除长度 r−l</text>
    <path d="M 60 100 L 470 100" stroke="#bbb" stroke-width="1.4"/>
  </g>

  <!-- 行 1 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="14">
    <rect x="70" y="110" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="96" y="136" fill="#446688">5</text>
    <text x="188" y="136" fill="#333">2</text>
    <text x="288" y="136" fill="#333">2（arr[2]=3 超过 2，停）</text>
    <rect x="352" y="110" width="120" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
    <text x="412" y="136" fill="#b85450">5−2 = 3 ★</text>
  </g>
  <!-- 行 2 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="14">
    <rect x="70" y="162" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="96" y="188" fill="#446688">6</text>
    <text x="188" y="188" fill="#333">3</text>
    <text x="288" y="188" fill="#333">3（arr[3]=10 超过 3，停）</text>
    <rect x="352" y="162" width="120" height="42" fill="#f2f2f2" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <text x="412" y="188" fill="#666">6−3 = 3</text>
  </g>
  <!-- 行 3 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="14">
    <rect x="70" y="214" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="96" y="240" fill="#446688">7</text>
    <text x="188" y="240" fill="#333">5</text>
    <text x="288" y="240" fill="#333">3（同上，不推进）</text>
    <rect x="352" y="214" width="120" height="42" fill="#f2f2f2" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <text x="412" y="240" fill="#666">7−3 = 4</text>
  </g>

  <path d="M 96 158 C 110 160, 112 160, 120 162" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 96 210 C 110 212, 112 212, 120 214" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结论 -->
  <rect x="100" y="276" width="320" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="301" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">
    ans = 3：删除 arr[3..5] = [10,4,2]，剩 [1,2,3,3,5]
  </text>

  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">
    l 从 0 只进不退：三个 r 一共只扫了一遍前缀
  </text>
</svg>
