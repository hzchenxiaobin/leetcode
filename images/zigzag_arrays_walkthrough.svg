<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">示例演算：n = 4，l = 1，r = 3（m = 3）</text>

  <!-- i=4 高亮底色 -->
  <rect x="89" y="256" width="450" height="56" fill="#fff8e1" opacity="0.9" filter="url(#rough2)"/>

  <!-- 表格外框与网格 -->
  <rect x="88" y="62" width="452" height="250" fill="none" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 88 88 L 540 88" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 240 62 L 240 312" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 340 62 L 340 312" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 440 62 L 440 312" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 88 116 L 540 116" stroke="#eaeaea" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 88 144 L 540 144" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 88 172 L 540 172" stroke="#eaeaea" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 88 200 L 540 200" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 88 228 L 540 228" stroke="#eaeaea" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 88 256 L 540 256" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 88 284 L 540 284" stroke="#eaeaea" stroke-width="1" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="164" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">阶段与状态</text>
  <text x="290" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">v = 1</text>
  <text x="390" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">v = 2</text>
  <text x="490" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">v = 3</text>

  <!-- i=1 -->
  <text x="164" y="107" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">i=1 · up</text>
  <text x="290" y="107" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="390" y="107" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="490" y="107" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="164" y="135" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">i=1 · down</text>
  <text x="290" y="135" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="390" y="135" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="490" y="135" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- i=2 -->
  <text x="164" y="163" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">i=2 · up</text>
  <text x="290" y="163" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0</text>
  <text x="390" y="163" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="490" y="163" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <text x="164" y="191" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">i=2 · down</text>
  <text x="290" y="191" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="390" y="191" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="490" y="191" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <!-- i=3 -->
  <text x="164" y="219" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">i=3 · up</text>
  <text x="290" y="219" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0</text>
  <text x="390" y="219" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <text x="490" y="219" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <text x="164" y="247" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">i=3 · down</text>
  <text x="290" y="247" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="390" y="247" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="490" y="247" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <!-- i=4（高亮） -->
  <text x="164" y="275" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">i=4 · up</text>
  <text x="290" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <text x="390" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="490" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <text x="164" y="303" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">i=4 · down</text>
  <text x="290" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="390" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="490" y="303" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <!-- 递检验证 -->
  <text x="320" y="336" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">递检验证：up[4][3] = down[3][1] + down[3][2] = 3 + 2 = 5；down[4][1] = up[3][2] + up[3][3] = 2 + 3 = 5</text>

  <!-- 答案框 -->
  <rect x="120" y="352" width="400" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="320" y="376" text-anchor="middle" font-size="13" fill="#2f5d2a" filter="url(#rough2)">答案 = Σ up[4] + Σ down[4] = (0+3+5) + (5+3+0)</text>
  <text x="320" y="397" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d2a" filter="url(#rough2)">= 16，即共 16 个锯齿形数组</text>
</svg>
