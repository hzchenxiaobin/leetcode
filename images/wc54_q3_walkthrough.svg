<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：一条可行的填桶状态链</text>
  <text x="310" y="49" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 1 排序后为 5, 4, 3, 3, 2, 2, 1，k = 4，target = 5，b0…b6 为二进制位序</text>
  <rect x="32" y="56" width="556" height="26" fill="#f0f2f5" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="74" text-anchor="start" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="96" y="74" text-anchor="start" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">加入</text>
  <text x="172" y="74" text-anchor="start" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">mask</text>
  <text x="272" y="74" text-anchor="start" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">十进制</text>
  <text x="362" y="74" text-anchor="start" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">残量 r</text>
  <text x="432" y="74" text-anchor="start" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">说明</text>
  <rect x="32" y="78" width="556" height="30" fill="#fbfbfb" stroke="#ddd" stroke-width="0.8" rx="5" filter="url(#rough2)"/>
  <text x="44" y="98" font-size="10.5" fill="#555" filter="url(#rough2)">初始</text>
  <text x="96" y="98" font-size="10.5" fill="#33445f" filter="url(#rough2)">—</text>
  <text x="172" y="98" font-size="10.5" fill="#446688" filter="url(#rough2)">0000000</text>
  <text x="272" y="98" font-size="10.5" fill="#66788f" filter="url(#rough2)">0</text>
  <text x="362" y="98" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="432" y="98" font-size="10" fill="#777" filter="url(#rough2)">起点</text>
  <text x="44" y="132" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="96" y="132" font-size="10.5" fill="#33445f" filter="url(#rough2)">5（b0）</text>
  <text x="172" y="132" font-size="10.5" fill="#446688" filter="url(#rough2)">0000001</text>
  <text x="272" y="132" font-size="10.5" fill="#66788f" filter="url(#rough2)">1</text>
  <text x="362" y="132" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="432" y="132" font-size="10" fill="#777" filter="url(#rough2)">桶 1 装满</text>
  <rect x="32" y="146" width="556" height="30" fill="#fbfbfb" stroke="#ddd" stroke-width="0.8" rx="5" filter="url(#rough2)"/>
  <text x="44" y="166" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="96" y="166" font-size="10.5" fill="#33445f" filter="url(#rough2)">4（b1）</text>
  <text x="172" y="166" font-size="10.5" fill="#446688" filter="url(#rough2)">0000011</text>
  <text x="272" y="166" font-size="10.5" fill="#66788f" filter="url(#rough2)">3</text>
  <text x="362" y="166" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="432" y="166" font-size="10" fill="#777" filter="url(#rough2)">桶 2 未满</text>
  <text x="44" y="200" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="96" y="200" font-size="10.5" fill="#33445f" filter="url(#rough2)">1（b6）</text>
  <text x="172" y="200" font-size="10.5" fill="#446688" filter="url(#rough2)">1000011</text>
  <text x="272" y="200" font-size="10.5" fill="#66788f" filter="url(#rough2)">67</text>
  <text x="362" y="200" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="432" y="200" font-size="10" fill="#777" filter="url(#rough2)">桶 2 装满</text>
  <rect x="32" y="214" width="556" height="30" fill="#fbfbfb" stroke="#ddd" stroke-width="0.8" rx="5" filter="url(#rough2)"/>
  <text x="44" y="234" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="96" y="234" font-size="10.5" fill="#33445f" filter="url(#rough2)">3（b2）</text>
  <text x="172" y="234" font-size="10.5" fill="#446688" filter="url(#rough2)">1000111</text>
  <text x="272" y="234" font-size="10.5" fill="#66788f" filter="url(#rough2)">71</text>
  <text x="362" y="234" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="432" y="234" font-size="10" fill="#777" filter="url(#rough2)">桶 3 未满</text>
  <text x="44" y="268" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="96" y="268" font-size="10.5" fill="#33445f" filter="url(#rough2)">2（b4）</text>
  <text x="172" y="268" font-size="10.5" fill="#446688" filter="url(#rough2)">1010111</text>
  <text x="272" y="268" font-size="10.5" fill="#66788f" filter="url(#rough2)">87</text>
  <text x="362" y="268" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="432" y="268" font-size="10" fill="#777" filter="url(#rough2)">桶 3 装满</text>
  <rect x="32" y="282" width="556" height="30" fill="#fbfbfb" stroke="#ddd" stroke-width="0.8" rx="5" filter="url(#rough2)"/>
  <text x="44" y="302" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="96" y="302" font-size="10.5" fill="#33445f" filter="url(#rough2)">3（b3）</text>
  <text x="172" y="302" font-size="10.5" fill="#446688" filter="url(#rough2)">1011111</text>
  <text x="272" y="302" font-size="10.5" fill="#66788f" filter="url(#rough2)">95</text>
  <text x="362" y="302" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="432" y="302" font-size="10" fill="#777" filter="url(#rough2)">桶 4 未满</text>
  <text x="44" y="336" font-size="10.5" fill="#555" filter="url(#rough2)">7</text>
  <text x="96" y="336" font-size="10.5" fill="#33445f" filter="url(#rough2)">2（b5）</text>
  <text x="172" y="336" font-size="10.5" fill="#446688" filter="url(#rough2)">1111111</text>
  <text x="272" y="336" font-size="10.5" fill="#66788f" filter="url(#rough2)">127</text>
  <text x="362" y="336" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="432" y="336" font-size="10" fill="#777" filter="url(#rough2)">桶 4 装满</text>
  <rect x="32" y="360" width="556" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="48" y="384" font-size="11" fill="#3a5a30" filter="url(#rough2)">最终 mask = 1111111 = 2⁷ − 1，残量 r = 0 ⇒ 恰好分完 4 个桶，返回 true</text>
  <text x="48" y="404" font-size="10" fill="#5a7a4a" filter="url(#rough2)">（这是 DP 中的一条状态链；其余不可达 mask 的 dp 值保持 −1）</text>
</svg>
