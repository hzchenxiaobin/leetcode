<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">排序 + 断口切分量 —— 跨段 = −1，段内 = 贪心跳跃求最短距离</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="11.5" fill="#555">示例 2：nums = [5,3,1,9,10]，maxDiff = 2 —— Q4 的 nums 乱序，但成边只看值，先排序</text>

  <g filter="url(#sk)"><rect x="62" y="96" width="278" height="98" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="201" y="116" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">分量 0（值 1, 3, 5 —— 原下标 2, 1, 0）</text>

  <g filter="url(#sk)"><circle cx="112" cy="158" r="22" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="112" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="112" y="167" text-anchor="middle" font-size="8.5" fill="#4a7a3a">节点 2</text>
  <g filter="url(#sk)"><circle cx="196" cy="158" r="22" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="196" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="196" y="167" text-anchor="middle" font-size="8.5" fill="#4a7a3a">节点 1</text>
  <g filter="url(#sk)"><circle cx="280" cy="158" r="22" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="280" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">5</text>
  <text x="280" y="167" text-anchor="middle" font-size="8.5" fill="#4a7a3a">节点 0</text>
  <g filter="url(#sk)"><path d="M 134 158 L 174 158" stroke="#4a7a3a" stroke-width="1.8" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 218 158 L 258 158" stroke="#4a7a3a" stroke-width="1.8" fill="none"/></g>
  <text x="155" y="149" text-anchor="middle" font-size="8" fill="#4a7a3a">差 2 ✓</text>
  <text x="239" y="149" text-anchor="middle" font-size="8" fill="#4a7a3a">差 2 ✓</text>

  <g filter="url(#sk)"><path d="M 356 106 L 376 196" stroke="#b85450" stroke-width="2.6"/></g>
  <g filter="url(#sk)"><path d="M 378 106 L 398 196" stroke="#b85450" stroke-width="2.6"/></g>
  <text x="390" y="97" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">断口：9−5=4 &gt; 2</text>
  <text x="390" y="212" text-anchor="middle" font-size="9" fill="#b85450">墙两侧任何点对差 ≥ 4，无任何边</text>

  <g filter="url(#sk)"><rect x="418" y="96" width="176" height="98" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="506" y="116" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5b84">分量 1（值 9, 10）</text>
  <g filter="url(#sk)"><circle cx="466" cy="158" r="22" fill="#fdfcf7" stroke="#446688" stroke-width="2"/></g>
  <text x="466" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5b84">9</text>
  <text x="466" y="167" text-anchor="middle" font-size="8.5" fill="#446688">节点 3</text>
  <g filter="url(#sk)"><circle cx="544" cy="158" r="22" fill="#fdfcf7" stroke="#446688" stroke-width="2"/></g>
  <text x="544" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5b84">10</text>
  <text x="544" y="167" text-anchor="middle" font-size="8.5" fill="#446688">节点 4</text>
  <g filter="url(#sk)"><path d="M 488 158 L 522 158" stroke="#446688" stroke-width="1.8" fill="none"/></g>
  <text x="505" y="149" text-anchor="middle" font-size="8" fill="#446688">差 1 ✓</text>

  <g filter="url(#sk)"><rect x="42" y="232" width="184" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="134" y="258" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">同段：可达 ✓</text>
  <text x="134" y="278" text-anchor="middle" font-size="9.5" fill="#444">最短距离 = 贪心跳跃次数</text>
  <text x="134" y="293" text-anchor="middle" font-size="9.5" fill="#444">（每步跳到值窗口内最远点）</text>

  <g filter="url(#sk)"><rect x="238" y="232" width="184" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="330" y="258" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a33">跨段：answer = −1</text>
  <text x="330" y="278" text-anchor="middle" font-size="9.5" fill="#444">u = v：answer = 0</text>
  <text x="330" y="293" text-anchor="middle" font-size="9.5" fill="#444">两者都要特判，O(1) 出结果</text>

  <g filter="url(#sk)"><rect x="434" y="232" width="168" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="518" y="258" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">别用值差公式！</text>
  <text x="518" y="278" text-anchor="middle" font-size="9.5" fill="#444">答案 ≠ ⌈值差 / D⌉</text>
  <text x="518" y="293" text-anchor="middle" font-size="9.5" fill="#444">每跳必须落在真实存在的值上</text>

  <g filter="url(#sk)">
    <rect x="42" y="328" width="560" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="322" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">与 Q2 的关系：断口切分连通分量完全一致，Q2 到此为止</text>
  <text x="322" y="378" text-anchor="middle" font-size="11" fill="#444">Q4 的两处升级：① nums 乱序 → 先排序并记 pos 映射回原下标；② 求的是距离 → 段内贪心跳跃 + 倍增</text>
  <text x="322" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">陷阱：值 [0,5,20]、D=10 时 0↔5 有边、5↔20 断开 —— 值差公式给 2，真答案是 −1</text>
</svg>
