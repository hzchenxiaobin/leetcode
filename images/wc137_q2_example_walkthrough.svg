<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "abbaca"</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">逐字符扫描，栈的每次变化如下</text>

  <g filter="url(#rough2)" font-size="11">
    <text x="60" y="76" font-weight="bold" fill="#333">字符</text>
    <text x="150" y="76" font-weight="bold" fill="#333">动作</text>
    <text x="330" y="76" font-weight="bold" fill="#333">栈（自底向上）</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <rect x="40" y="86" width="480" height="28" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="6"/>
    <text x="60" y="105" fill="#3a4a66">a</text>
    <text x="150" y="105">压入</text>
    <text x="330" y="105">a</text>

    <rect x="40" y="120" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6"/>
    <text x="60" y="139" fill="#3a4a66">b</text>
    <text x="150" y="139">压入</text>
    <text x="330" y="139">a b</text>

    <rect x="40" y="154" width="480" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="6"/>
    <text x="60" y="173" fill="#8a3a36">b</text>
    <text x="150" y="173" fill="#8a3a36">与栈顶 b 相同 → 弹出</text>
    <text x="330" y="173">a</text>

    <rect x="40" y="188" width="480" height="28" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="6"/>
    <text x="60" y="207" fill="#3a4a66">a</text>
    <text x="150" y="207" fill="#8a3a36">与栈顶 a 相同 → 弹出</text>
    <text x="330" y="207">（空）</text>

    <rect x="40" y="222" width="480" height="28" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="6"/>
    <text x="60" y="241" fill="#3a4a66">c</text>
    <text x="150" y="241">压入</text>
    <text x="330" y="241">c</text>

    <rect x="40" y="256" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6"/>
    <text x="60" y="275" fill="#3a4a66">a</text>
    <text x="150" y="275">压入</text>
    <text x="330" y="275">c a</text>
  </g>

  <rect x="150" y="300" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">栈内容 = "ca" → 返回 "ca"</text>
  <text x="280" y="338" text-anchor="middle" font-size="10" fill="#888">与示例输出一致</text>

  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#999">对比暴力：先删 "bb" 得 "aaca"，再删 "aa" 得 "ca"——两种路径结果相同，栈一次扫完</text>
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#999">示例 2 "azxxzy"：x 与 x 消掉、z 与 z 又消掉，最后剩 "ay"</text>
</svg>
