<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688" />
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa" />

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次计数，四步拼出答案</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">统计 26 个字母的频次后，所有数字的个数都是常数次加减法</text>

  <g filter="url(#rough2)">
    <rect x="14" y="72" width="136" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" />
    <text x="82" y="94" text-anchor="middle" font-size="12" fill="#2f4560" font-weight="bold">① 统计字母</text>
    <text x="82" y="116" text-anchor="middle" font-size="11" fill="#4a5a70">cnt[26] 计数</text>
    <text x="82" y="136" text-anchor="middle" font-size="10" fill="#889">扫描 s 一次</text>
  </g>

  <path d="M 152 111 L 164 111" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" />

  <g filter="url(#rough2)">
    <rect x="166" y="72" width="136" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" />
    <text x="234" y="94" text-anchor="middle" font-size="12" fill="#2f4a24" font-weight="bold">② 直接读 5 个</text>
    <text x="234" y="116" text-anchor="middle" font-size="11" fill="#33502a">z w u x g</text>
    <text x="234" y="136" text-anchor="middle" font-size="10" fill="#889">→ 0 2 4 6 8</text>
  </g>

  <path d="M 304 111 L 316 111" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" />

  <g filter="url(#rough2)">
    <rect x="318" y="72" width="136" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" />
    <text x="386" y="94" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold">③ 做减法 4 个</text>
    <text x="386" y="116" text-anchor="middle" font-size="11" fill="#6a5218">o h f s i</text>
    <text x="386" y="136" text-anchor="middle" font-size="10" fill="#889">→ 1 3 5 7 9</text>
  </g>

  <path d="M 456 111 L 468 111" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" />

  <g filter="url(#rough2)">
    <rect x="470" y="72" width="136" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" />
    <text x="538" y="94" text-anchor="middle" font-size="12" fill="#8a2f28" font-weight="bold">④ 升序拼接</text>
    <text x="538" y="116" text-anchor="middle" font-size="11" fill="#7a3a34">c[d] 个字符 d</text>
    <text x="538" y="136" text-anchor="middle" font-size="10" fill="#889">d = 0 → 9</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="14" y="170" width="592" height="118" fill="#fafafa" stroke="#aaa" stroke-width="1.4" stroke-dasharray="6 4" rx="10" />
    <text x="30" y="192" font-size="11" fill="#555" font-weight="bold">减法链（按依赖顺序，右边全部已知）</text>
    <text x="34" y="216" font-size="11" fill="#446688">c₁ = cnt[o] − c₀ − c₂ − c₄</text>
    <text x="34" y="240" font-size="11" fill="#446688">c₃ = cnt[h] − c₈</text>
    <text x="34" y="264" font-size="11" fill="#446688">c₅ = cnt[f] − c₄</text>
    <text x="330" y="216" font-size="11" fill="#4a7a3a">c₇ = cnt[s] − c₆</text>
    <text x="330" y="240" font-size="11" fill="#4a7a3a">c₉ = cnt[i] − c₅ − c₆ − c₈</text>
    <text x="330" y="266" font-size="10" fill="#999">（也可写成 cnt[i] − cnt[f] + c₄ − c₆ − c₈）</text>
  </g>

  <text x="310" y="314" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">依赖关系是一张有向无环图：c₉ 只用到 c₅、c₆、c₈，其中 c₅ 又在 c₄ 之后算出，所以顺序固定、无需尝试</text>
  <text x="310" y="336" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间 O(n)：扫 s 一遍 + 常数次加减 + 拼接答案；空间 O(1)：cnt[26] 与 c[10]</text>
  <text x="310" y="358" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">输入保证合法，所以减法结果一定非负；若不加保证，则需在减法后检查是否小于 0</text>
</svg>