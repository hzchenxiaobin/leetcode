<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 465" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
  </defs>
  <rect width="600" height="465" fill="#fafafa"/>
  <text x="300" y="28" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#r)">示例演算：按「第 j 个 c 结尾」拆贡献（s = "abada"，c = 'a'）</text>
  <path d="M 150 38 Q 300 46 450 38" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- legend -->
  <g filter="url(#r)">
    <rect x="300" y="50" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="392" y="50" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="480" y="50" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4"/>
  </g>
  <g font-size="10.5" fill="#555" filter="url(#r)">
    <text x="320" y="62">当前结尾</text>
    <text x="412" y="62">更早的 c</text>
    <text x="500" y="62">更晚的 c</text>
  </g>

  <!-- row 1: end at index 0 -->
  <text x="57" y="66" font-size="12" fill="#444" filter="url(#r)">第 1 个 'a'（下标 0）作结尾</text>
  <g filter="url(#r)">
    <rect x="70" y="74" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="104" y="74" width="34" height="30" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1.5"/>
    <rect x="138" y="74" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4"/>
    <rect x="172" y="74" width="34" height="30" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1.5"/>
    <rect x="206" y="74" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" filter="url(#r)">
    <text x="87" y="94" font-weight="bold" fill="#a3722a">a</text>
    <text x="121" y="94">b</text>
    <text x="155" y="94">a</text>
    <text x="189" y="94">d</text>
    <text x="223" y="94">a</text>
  </g>
  <g font-size="12" fill="#333" filter="url(#r)">
    <text x="290" y="82">生成 "a"</text>
    <text x="290" y="100" fill="#2e6e2e">→ 贡献 1</text>
  </g>
  <g filter="url(#r)">
    <circle cx="545" cy="91" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="545" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">+1</text>

  <!-- row 2: end at index 2 -->
  <text x="57" y="166" font-size="12" fill="#444" filter="url(#r)">第 2 个 'a'（下标 2）作结尾</text>
  <path d="M 87 172 Q 121 146 152 171" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#r)"/>
  <g filter="url(#r)">
    <rect x="70" y="174" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="104" y="174" width="34" height="30" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1.5"/>
    <rect x="138" y="174" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="172" y="174" width="34" height="30" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1.5"/>
    <rect x="206" y="174" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" filter="url(#r)">
    <text x="87" y="194">a</text>
    <text x="121" y="194">b</text>
    <text x="155" y="194" font-weight="bold" fill="#a3722a">a</text>
    <text x="189" y="194">d</text>
    <text x="223" y="194">a</text>
  </g>
  <g font-size="12" fill="#333" filter="url(#r)">
    <text x="290" y="182">生成 "a"、"aba"</text>
    <text x="290" y="200" fill="#2e6e2e">→ 贡献 2</text>
  </g>
  <g filter="url(#r)">
    <circle cx="545" cy="191" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="545" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">+2</text>

  <!-- row 3: end at index 4 -->
  <text x="57" y="266" font-size="12" fill="#444" filter="url(#r)">第 3 个 'a'（下标 4）作结尾</text>
  <g stroke="#446688" stroke-width="1.6" fill="none" filter="url(#r)">
    <path d="M 87 272 Q 155 232 220 271" marker-end="url(#arrB)"/>
    <path d="M 121 272 Q 172 248 219 271" marker-end="url(#arrB)"/>
  </g>
  <g filter="url(#r)">
    <rect x="70" y="274" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="104" y="274" width="34" height="30" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1.5"/>
    <rect x="138" y="274" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="172" y="274" width="34" height="30" rx="4" fill="#fdfcf7" stroke="#999" stroke-width="1.5"/>
    <rect x="206" y="274" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" filter="url(#r)">
    <text x="87" y="294">a</text>
    <text x="121" y="294">b</text>
    <text x="155" y="294">a</text>
    <text x="189" y="294">d</text>
    <text x="223" y="294" font-weight="bold" fill="#a3722a">a</text>
  </g>
  <g font-size="12" fill="#333" filter="url(#r)">
    <text x="290" y="282">生成 "a"、"ada"、"abada"</text>
    <text x="290" y="300" fill="#2e6e2e">→ 贡献 3</text>
  </g>
  <g filter="url(#r)">
    <circle cx="545" cy="291" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="545" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">+3</text>

  <!-- sum box -->
  <g filter="url(#r)">
    <rect x="140" y="330" width="320" height="46" rx="10" fill="#fdfcf7" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="300" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">1 + 2 + 3 = 6 = 3·4/2</text>

  <!-- conclusion callout -->
  <g filter="url(#r)">
    <rect x="40" y="396" width="520" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="62" y="418" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#r)">第 j 个 c 结尾的合法子串恰有 j 个：开头可取第 1 ∼ j 个 c 中任意一个</text>
  <text x="62" y="438" font-size="12" fill="#444" filter="url(#r)">按右端点分组不重不漏，求和得 1+2+⋯+m = m(m+1)/2</text>
</svg>
