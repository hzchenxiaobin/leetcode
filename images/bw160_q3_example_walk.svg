<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：n=4, edges 见题面</text>
  <text x="310" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">最优路径 0 -&gt; 2 -&gt; 3，到达时间 5</text>
  <rect x="40" y="66" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="85.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">时刻</text>
  <rect x="130" y="66" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="185.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">位置</text>
  <rect x="240" y="66" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="285.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">动作</text>
  <rect x="330" y="66" width="280" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="470.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">说明</text>
  <rect x="40" y="96" width="90" height="30" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="85.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">t = 0</text>
  <rect x="130" y="96" width="110" height="30" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="185.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="240" y="96" width="90" height="30" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="285.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">等待</text>
  <rect x="330" y="96" width="280" height="30" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="470.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">边 0-&gt;2 的窗口是 [1,5]，还没开</text>
  <rect x="40" y="126" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="85.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">t = 1</text>
  <rect x="130" y="126" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="185.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0 -&gt; 2</text>
  <rect x="240" y="126" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="285.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">通行</text>
  <rect x="330" y="126" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="470.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1 在 [1,5] 内，到达 t = 2</text>
  <rect x="40" y="156" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="85.0" y="175.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">t = 2</text>
  <rect x="130" y="156" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="185.0" y="175.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="240" y="156" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="285.0" y="175.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">等待</text>
  <rect x="330" y="156" width="280" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="470.0" y="175.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">边 2-&gt;3 的窗口是 [4,7]</text>
  <rect x="40" y="186" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="85.0" y="205.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">t = 4</text>
  <rect x="130" y="186" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="185.0" y="205.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2 -&gt; 3</text>
  <rect x="240" y="186" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="285.0" y="205.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">通行</text>
  <rect x="330" y="186" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="470.0" y="205.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">到达 t = 5，即终点</text>
  <rect x="40" y="200" width="540" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310.0" y="222.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">另一条路 0-&gt;1-&gt;3：t=1 到达 1，再等窗口 [7,8]，t=8 才到，更差</text>
  <text x="310.0" y="242.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">还有 0-&gt;2-&gt;3 的直接比较：Dijkstra 保证第一次出堆的就是最优</text>
  <text x="40" y="290" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">示例 3 中节点 0 没有出边，dist[n-1] 保持 +inf -&gt; 返回 -1</text>
</svg>
