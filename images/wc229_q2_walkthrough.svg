<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="617" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="450" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：boxes = "001011" → [11, 8, 5, 4, 3, 4]</text>
  <path d="M 190 38 Q 320 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 盒子行 -->
  <g filter="url(#sk)">
    <rect x="130" y="52" width="50" height="36" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="196" y="52" width="50" height="36" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="262" y="52" width="50" height="36" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="328" y="52" width="50" height="36" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="394" y="52" width="50" height="36" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="460" y="52" width="50" height="36" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.4"/>
    <circle cx="287" cy="70" r="8" fill="#f2c14e" stroke="#c98a2b" stroke-width="1.5"/>
    <circle cx="419" cy="70" r="8" fill="#f2c14e" stroke="#c98a2b" stroke-width="1.5"/>
    <circle cx="485" cy="70" r="8" fill="#f2c14e" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <g font-size="11" fill="#666" font-family="monospace">
    <text x="155" y="102" text-anchor="middle">i=0</text>
    <text x="221" y="102" text-anchor="middle">i=1</text>
    <text x="287" y="102" text-anchor="middle">i=2</text>
    <text x="353" y="102" text-anchor="middle">i=3</text>
    <text x="419" y="102" text-anchor="middle">i=4</text>
    <text x="485" y="102" text-anchor="middle">i=5</text>
  </g>
  <text x="565" y="66" text-anchor="middle" font-size="11" fill="#666">total = 3</text>
  <text x="565" y="84" text-anchor="middle" font-size="11" fill="#666">球在 2、4、5</text>

  <!-- 演算表：表头 -->
  <g filter="url(#sk)">
    <rect x="60" y="124" width="520" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="12" fill="#2b6e9e" font-weight="bold" font-family="monospace">
    <text x="95" y="141" text-anchor="middle">i</text>
    <text x="185" y="141" text-anchor="middle">boxes[i]</text>
    <text x="300" y="141" text-anchor="middle">left（左球数）</text>
    <text x="415" y="141" text-anchor="middle">Δ = 2L − total</text>
    <text x="535" y="141" text-anchor="middle">answer[i]</text>
  </g>

  <!-- 行0：基例 -->
  <g filter="url(#sk)">
    <rect x="60" y="150" width="520" height="31" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <g font-size="13" font-family="monospace">
    <text x="95" y="170" text-anchor="middle" fill="#333">0</text>
    <text x="185" y="170" text-anchor="middle" fill="#333">0</text>
    <text x="300" y="170" text-anchor="middle" fill="#333">0</text>
    <text x="415" y="170" text-anchor="middle" fill="#7a5415">—</text>
    <text x="535" y="170" text-anchor="middle" fill="#7a5415" font-weight="bold">11 ← 2+4+5</text>
  </g>

  <!-- 行1：i=1 -->
  <g filter="url(#sk)">
    <rect x="60" y="181" width="520" height="31" fill="#ffffff" stroke="#cfd8e3" stroke-width="1"/>
  </g>
  <g font-size="13" font-family="monospace">
    <text x="95" y="201" text-anchor="middle" fill="#333">1</text>
    <text x="185" y="201" text-anchor="middle" fill="#333">0</text>
    <text x="300" y="201" text-anchor="middle" fill="#333">0</text>
    <text x="415" y="201" text-anchor="middle" fill="#a04348">−3</text>
    <text x="535" y="201" text-anchor="middle" fill="#333" font-weight="bold">8</text>
  </g>

  <!-- 行2：i=2 -->
  <g filter="url(#sk)">
    <rect x="60" y="212" width="520" height="31" fill="#ffffff" stroke="#cfd8e3" stroke-width="1"/>
  </g>
  <g font-size="13" font-family="monospace">
    <text x="95" y="232" text-anchor="middle" fill="#333">2</text>
    <text x="185" y="232" text-anchor="middle" fill="#333">1</text>
    <text x="300" y="232" text-anchor="middle" fill="#333">0</text>
    <text x="415" y="232" text-anchor="middle" fill="#a04348">−3</text>
    <text x="535" y="232" text-anchor="middle" fill="#333" font-weight="bold">5</text>
  </g>

  <!-- 行3：i=3 -->
  <g filter="url(#sk)">
    <rect x="60" y="243" width="520" height="31" fill="#ffffff" stroke="#cfd8e3" stroke-width="1"/>
  </g>
  <g font-size="13" font-family="monospace">
    <text x="95" y="263" text-anchor="middle" fill="#333">3</text>
    <text x="185" y="263" text-anchor="middle" fill="#333">0</text>
    <text x="300" y="263" text-anchor="middle" fill="#333">1</text>
    <text x="415" y="263" text-anchor="middle" fill="#a04348">−1</text>
    <text x="535" y="263" text-anchor="middle" fill="#333" font-weight="bold">4</text>
  </g>

  <!-- 行4：i=4（最小） -->
  <g filter="url(#sk)">
    <rect x="60" y="274" width="520" height="31" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <g font-size="13" font-family="monospace">
    <text x="95" y="294" text-anchor="middle" fill="#333">4</text>
    <text x="185" y="294" text-anchor="middle" fill="#333">1</text>
    <text x="300" y="294" text-anchor="middle" fill="#333">1</text>
    <text x="415" y="294" text-anchor="middle" fill="#a04348">−1</text>
    <text x="535" y="294" text-anchor="middle" fill="#2e6e2e" font-weight="bold">3 ←</text>
  </g>

  <!-- 行5：i=5 -->
  <g filter="url(#sk)">
    <rect x="60" y="305" width="520" height="31" fill="#ffffff" stroke="#cfd8e3" stroke-width="1"/>
  </g>
  <g font-size="13" font-family="monospace">
    <text x="95" y="325" text-anchor="middle" fill="#333">5</text>
    <text x="185" y="325" text-anchor="middle" fill="#333">1</text>
    <text x="300" y="325" text-anchor="middle" fill="#333">2</text>
    <text x="415" y="325" text-anchor="middle" fill="#2e6e2e">+1</text>
    <text x="535" y="325" text-anchor="middle" fill="#333" font-weight="bold">4</text>
  </g>

  <!-- 注释 -->
  <text x="320" y="354" text-anchor="middle" font-size="11" fill="#666">left 为位置 &lt; i 的球数：先用后加，boxes[i] 要到下一轮才计入 left</text>

  <!-- 结果条 -->
  <g filter="url(#sk)">
    <rect x="120" y="372" width="400" height="58" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="394" text-anchor="middle" font-size="12" fill="#7a5415">5 步递推出全部 6 个答案，与示例输出一致</text>
  <text x="320" y="418" text-anchor="middle" font-size="17" fill="#7a5415" font-weight="bold" font-family="monospace">[11, 8, 5, 4, 3, 4] ✓</text>
</svg>
