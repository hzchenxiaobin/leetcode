<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">状态转移：f[i][j][p] 的三个来源</text>
  <path d="M 180 36 Q 320 44 460 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- grid -->
  <text x="116" y="84" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="162" y="84" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="208" y="84" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="254" y="84" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="300" y="84" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="88" y="114" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="88" y="158" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="88" y="202" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="88" y="246" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="208" y="74" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">行 = i（nums1 下标），列 = j（nums2 下标）</text>

  <rect x="96" y="90" width="40" height="38" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="90" width="40" height="38" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="188" y="90" width="40" height="38" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="234" y="90" width="40" height="38" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="90" width="40" height="38" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="134" width="40" height="38" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="134" width="40" height="38" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="188" y="134" width="40" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">③</text>
  <rect x="234" y="134" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">①</text>
  <rect x="280" y="134" width="40" height="38" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="178" width="40" height="38" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="178" width="40" height="38" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="188" y="178" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">②</text>
  <rect x="234" y="178" width="40" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="202" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">(i, j)</text>
  <rect x="280" y="178" width="40" height="38" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="96" y="222" width="40" height="38" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="142" y="222" width="40" height="38" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="188" y="222" width="40" height="38" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="234" y="222" width="40" height="38" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="280" y="222" width="40" height="38" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>

  <path d="M 254 160 L 254 192" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210 197 L 246 197" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 214 163 Q 236 176 250 192" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- legend -->
  <circle cx="62" cy="282" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="286" font-size="10.5" fill="#446688" filter="url(#rough2)">方案中没有任何对落在第 i−1 行 → 取 f[i−1][j][p]</text>
  <circle cx="62" cy="304" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="308" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">方案中没有任何对落在第 j−1 列 → 取 f[i][j−1][p]</text>
  <circle cx="62" cy="326" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="330" font-size="10.5" fill="#b85450" filter="url(#rough2)">把 (i−1, j−1) 选作最后一对 → 取 f[i−1][j−1][p−1] + a[i−1]·b[j−1]</text>

  <!-- right panel: formula -->
  <rect x="352" y="64" width="252" height="262" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="478" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">转移方程（p ≥ 1）</text>
  <rect x="366" y="100" width="224" height="92" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="478" y="120" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">f[i][j][p] = max(</text>
  <text x="382" y="140" font-size="10.5" fill="#446688" filter="url(#rough2)">① f[i−1][j][p]，</text>
  <text x="382" y="158" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">② f[i][j−1][p]，</text>
  <text x="382" y="178" font-size="10.5" fill="#b85450" filter="url(#rough2)">③ f[i−1][j−1][p−1] + a[i−1]·b[j−1] )</text>
  <text x="478" y="214" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">边界：f[i][j][0] = 0</text>
  <text x="478" y="232" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">p &gt; min(i, j)（放不下）时 f[i][j][p] = −∞</text>
  <rect x="378" y="244" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="478" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = f[n][m][k]</text>
  <text x="478" y="296" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">哨兵 −∞ 沿转移自动传播，</text>
  <text x="478" y="312" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">代码里无需可行性特判</text>

  <!-- conclusion -->
  <rect x="36" y="344" width="568" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="368" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">三个来源不重不漏地覆盖了「(i−1, j−1) 选作末对 / 不选」的所有情形（证明见正文 §5）</text>
  <text x="320" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">实现：i 作外层滚动，两层 (k+1)×(m+1) 数组交替，时间 O(n·m·k) ≈ 10⁶</text>
</svg>
