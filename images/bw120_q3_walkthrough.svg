<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">双示例演算：pre、s 与逐个 l 的贡献</text>

  <!-- 示例 2 -->
  <rect x="40" y="48" width="480" height="158" rx="10" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="13.5" fill="#446688" filter="url(#rough2)">示例 2：[6,5,7,8]，pre = 1，s = 1</text>
  <g filter="url(#rough2)">
    <rect x="70" y="92" width="90" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="115" y="114" text-anchor="middle" font-size="12" fill="#28415e">l = 0</text>
    <text x="175" y="114" font-size="12" fill="#555">空前缀，无台阶</text>
    <text x="350" y="114" font-size="12" fill="#1c3a1c">r ∈ [1, 4] → +4</text>

    <rect x="70" y="134" width="90" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="115" y="156" text-anchor="middle" font-size="12" fill="#28415e">l = 1</text>
    <text x="175" y="156" font-size="12" fill="#555">6 &lt; 5？否 → r 从 1 右移到 2</text>
    <text x="350" y="156" font-size="12" fill="#1c3a1c">r ∈ [2, 4] → +3</text>

    <rect x="70" y="166" width="440" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="290" y="187" text-anchor="middle" font-size="12.5" fill="#1c3a1c">合计 4 + 3 = 7 ✓（r=4 表示删到末尾、后缀为空）</text>
  </g>

  <!-- 示例 3 -->
  <rect x="40" y="222" width="480" height="158" rx="10" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="13.5" fill="#446688" filter="url(#rough2)">示例 3：[8,7,6,6]，pre = 1，s = 3（6 ≮ 6，后缀只有 [6]）</text>
  <g filter="url(#rough2)">
    <rect x="70" y="266" width="90" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="115" y="288" text-anchor="middle" font-size="12" fill="#28415e">l = 0</text>
    <text x="175" y="288" font-size="12" fill="#555">空前缀，r ≥ max(1, s=3)</text>
    <text x="350" y="288" font-size="12" fill="#1c3a1c">r ∈ [3, 4] → +2</text>

    <rect x="70" y="308" width="90" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="115" y="330" text-anchor="middle" font-size="12" fill="#28415e">l = 1</text>
    <text x="175" y="330" font-size="12" fill="#555">8 &lt; 6？否，无台阶可接</text>
    <text x="350" y="330" font-size="12" fill="#1c3a1c">只剩 r = 4 → +1</text>

    <rect x="70" y="340" width="440" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="290" y="361" text-anchor="middle" font-size="12.5" fill="#1c3a1c">合计 2 + 1 = 3 ✓（对应删 [0,2]、[0,3]、[1,3]）</text>
  </g>
</svg>
