<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fafafa"/>
  <text x="340" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一次奇偶判定，O(1) 出答案</text>
  <path d="M 140 44 Q 340 52 540 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="240" y="64" width="200" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="340" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a68" filter="url(#sk)">输入正整数 n</text>

  <g filter="url(#sk)"><path d="M 340 110 L 340 136" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><polygon points="340,140 470,196 340,252 210,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="340" y="190" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">n 是偶数吗？</text>
  <text x="340" y="210" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">（即 n &amp; 1 == 0）</text>

  <g filter="url(#sk)"><path d="M 208 196 L 156 196" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="182" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><path d="M 472 196 L 524 196" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <text x="498" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">否（奇）</text>

  <g filter="url(#sk)"><rect x="40" y="166" width="116" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="98" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 n</text>
  <text x="98" y="212" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">n 已是 2 的倍数</text>

  <g filter="url(#sk)"><rect x="528" y="166" width="116" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="586" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">返回 2n</text>
  <text x="586" y="212" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">补一个因子 2</text>

  <g filter="url(#sk)"><path d="M 98 228 L 98 258 Q 98 268 108 268 L 200 268" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 586 228 L 586 258 Q 586 268 576 268 L 484 268" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/></g>
  <text x="340" y="272" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">两条分支都恰好一步到达，无循环无搜索</text>

  <g filter="url(#sk)"><rect x="40" y="300" width="292" height="158" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="186" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a3a" filter="url(#sk)">对照 A：暴力枚举路径</text>
  <text x="56" y="350" font-size="11.5" fill="#333" filter="url(#sk)">· 枚举 n, 2n, 3n, … 首个偶数即停</text>
  <text x="56" y="372" font-size="11.5" fill="#333" filter="url(#sk)">· 奇数 n 要走到 2n，约 n 步，O(n)</text>
  <text x="56" y="394" font-size="11.5" fill="#333" filter="url(#sk)">· 依赖「答案 ≤ 2n」才敢早停</text>
  <text x="56" y="418" font-size="11.5" fill="#333" filter="url(#sk)">· 循环 + 判整除，签到题里的多余出错点</text>
  <text x="186" y="444" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">能 AC，但慢且绕</text>

  <g filter="url(#sk)"><rect x="348" y="300" width="292" height="158" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="494" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#sk)">对照 B：LCM 公式路径</text>
  <text x="364" y="350" font-size="11.5" fill="#333" filter="url(#sk)">· ans = 2n / gcd(2, n)</text>
  <text x="364" y="372" font-size="11.5" fill="#333" filter="url(#sk)">· 通用、可推广到任意两数 LCM</text>
  <text x="364" y="394" font-size="11.5" fill="#333" filter="url(#sk)">· 但 gcd(2,n) 本身就是奇偶判定</text>
  <text x="364" y="418" font-size="11.5" fill="#333" filter="url(#sk)">· 固定操作数 2 ⟹ 通用算法退化为 O(1)</text>
  <text x="494" y="444" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a68" filter="url(#sk)">与奇偶判定殊途同归 ✓</text>
</svg>
