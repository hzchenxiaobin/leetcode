<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：一趟入度扫描，同时揪出「多父」和「根」</text>
  <path d="M 140 40 Q 320 50 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: example 1 tree -->
  <path d="M 152 118 Q 108 148 94 175" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 178 118 Q 222 148 236 175" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 245 212 L 245 261" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="112" y="155" font-size="11" fill="#666">L</text>
  <text x="220" y="155" font-size="11" fill="#666">R</text>
  <text x="256" y="242" font-size="11" fill="#666">L</text>

  <!-- root badge -->
  <g filter="url(#sk2)"><rect x="56" y="92" width="88" height="22" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="100" y="107" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">入度 0 = 根</text>

  <!-- nodes -->
  <g filter="url(#sk2)"><circle cx="165" cy="105" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="165" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22">0</text>
  <g filter="url(#sk2)"><circle cx="85" cy="195" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="85" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">1</text>
  <g filter="url(#sk2)"><circle cx="245" cy="195" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="245" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">2</text>
  <g filter="url(#sk2)"><circle cx="245" cy="285" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="245" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">3</text>

  <!-- indegree badges -->
  <g filter="url(#sk2)"><rect x="53" y="224" width="64" height="20" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="85" y="238" text-anchor="middle" font-size="11" fill="#2b4a6e">入度 1</text>
  <g filter="url(#sk2)"><rect x="213" y="224" width="64" height="20" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="245" y="238" text-anchor="middle" font-size="11" fill="#2b4a6e">入度 1</text>
  <g filter="url(#sk2)"><rect x="213" y="314" width="64" height="20" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="245" y="328" text-anchor="middle" font-size="11" fill="#2b4a6e">入度 1</text>

  <!-- left caption -->
  <g filter="url(#sk2)"><rect x="30" y="352" width="280" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="170" y="371" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22">示例 1：入度 [0,1,1,1]</text>
  <text x="170" y="388" text-anchor="middle" font-size="11" fill="#4a7a3a">根唯一为 0，其余全被指一次 → 三关全过</text>

  <!-- right panel: formula -->
  <g filter="url(#sk2)"><rect x="350" y="70" width="270" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="485" y="92" text-anchor="middle" font-size="12" fill="#2b4a6e">入度(v) = v 在 leftChild 与</text>
  <text x="485" y="110" text-anchor="middle" font-size="12" fill="#2b4a6e">rightChild 中出现的总次数</text>

  <!-- condition 1 -->
  <g filter="url(#sk2)"><rect x="350" y="148" width="270" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="485" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22">条件 ①：每个节点入度 ≤ 1</text>
  <text x="485" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a">入度 ≥ 2 ⇔ 有节点被指两次 → false</text>

  <!-- condition 2 -->
  <g filter="url(#sk2)"><rect x="350" y="232" width="270" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="485" y="254" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">条件 ②：入度 = 0 的节点恰 1 个</text>
  <text x="485" y="276" text-anchor="middle" font-size="11" fill="#9a7428">0 个 ⇔ 没根（成环）；≥ 2 个 ⇔ 森林</text>

  <!-- condition 3 -->
  <g filter="url(#sk2)"><rect x="350" y="316" width="270" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="485" y="338" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36">条件 ③：从根能访问全部 n 个节点</text>
  <text x="485" y="360" text-anchor="middle" font-size="11" fill="#8a3a36">入度看不见的藏环、断连由它兜底</text>
</svg>
