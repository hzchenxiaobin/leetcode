<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">二分答案：猜总时间 T → O(n) 可行性检查</text>
  <path d="M 150 41 Q 320 50 490 41" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- init range box -->
  <rect x="170" y="58" width="300" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">二分区间 [0, w_min·H(H+1)/2]</text>
  <text x="320" y="95" text-anchor="middle" font-size="9.5" fill="#888">上界 = 最快工人独力把山挖完的耗时</text>

  <path d="M 320 104 L 320 126" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- mid box -->
  <rect x="235" y="130" width="170" height="38" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="154" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">mid = (lo+hi)/2</text>

  <path d="M 320 168 L 320 190" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check box -->
  <rect x="105" y="194" width="430" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="320" y="218" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">check(mid)：对每个工人 i，O(1) 解二次不等式</text>
  <text x="320" y="240" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">w·x(x+1)/2 ≤ mid → 最大 x_i</text>
  <text x="320" y="260" text-anchor="middle" font-size="10" fill="#a08040">求根公式 / 整数开方，不必逐单位模拟</text>

  <path d="M 320 272 L 320 296" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="320,300 452,342 320,384 188,342" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" font-family="monospace">Σ x_i ≥ H ?</text>
  <text x="320" y="356" text-anchor="middle" font-size="9.5" fill="#b85450">（各工人最大工作量之和是否够挖平山）</text>

  <!-- yes branch -->
  <path d="M 186 342 L 236 344" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>
  <rect x="40" y="312" width="196" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="138" y="336" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">mid 秒可行</text>
  <text x="138" y="356" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333">hi = mid</text>

  <!-- no branch -->
  <path d="M 454 344 L 404 342" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <rect x="404" y="312" width="196" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="502" y="336" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">mid 秒不可行</text>
  <text x="502" y="356" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333">lo = mid + 1</text>

  <!-- loop back dashed arrows -->
  <path d="M 90 310 C 40 260 60 190 230 148" stroke="#999" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 550 310 C 600 260 580 190 410 148" stroke="#999" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="230" text-anchor="middle" font-size="10" fill="#999">继续二分</text>
  <text x="578" y="230" text-anchor="middle" font-size="10" fill="#999">继续二分</text>

  <!-- final -->
  <path d="M 320 388 L 320 406" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="165" y="410" width="310" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="320" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">lo == hi 收敛</text>
  <text x="320" y="448" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">返回 lo = 最少秒数</text>
</svg>
