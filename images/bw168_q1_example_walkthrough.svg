  <text x="46" y="336" text-anchor="start" font-size="10" fill="#8a6a20" filter="url(#rough2)">全局最小是 "acdb"（k=3 反转前 3 个）：以 'a' 开头，其余候选都以 'b'/'c'/'d' 开头</text>
  <text x="46" y="354" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">注意 "dcab" 本身也是候选（k=1），所以即使原串最小也必须做一次操作也不会漏</text>
