<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">单次查询流程：multiset 增删位置 + 线段树撤销 / 重加区间</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">old = nums[idx]；S(v)：质数 v 的下标有序集合；C：当前不同质数个数</text>

  <!-- N1 -->
  <g filter="url(#rough2)">
    <rect x="115" y="52" width="170" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="200" y="67" text-anchor="middle" font-size="10.5" fill="#2a4666" font-weight="bold">查询 (idx, val)</text>
    <text x="200" y="81" text-anchor="middle" font-size="10.5" fill="#2a4666" font-weight="bold">old = nums[idx]</text>
  </g>

  <path d="M 200 88 L 200 104" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: old == val ? -->
  <g filter="url(#rough2)">
    <polygon points="200,104 280,132 200,160 120,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="200" y="136" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">old == val ?</text>
  </g>
  <path d="M 120 132 L 46 132 L 46 380 L 104 380" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="34" y="124" font-size="9.5" fill="#777" filter="url(#rough2)">是：数组不变</text>

  <path d="M 200 160 L 200 176" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="172" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <!-- D2: old 是质数 ? -->
  <g filter="url(#rough2)">
    <polygon points="200,176 285,202 200,228 115,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="200" y="206" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">old 是质数 ?</text>
  </g>
  <path d="M 285 202 L 306 202" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="196" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 200 228 L 200 244" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="240" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <!-- N2: 删除 old -->
  <g filter="url(#rough2)">
    <rect x="308" y="180" width="207" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="411" y="194" text-anchor="middle" font-size="9.5" fill="#2a4666" font-weight="bold">从 S(old) 删除 idx</text>
    <text x="411" y="207" text-anchor="middle" font-size="9.5" fill="#2a4666">先撤销旧区间 [f0+1, l0]（|S|≥2 时）</text>
    <text x="411" y="220" text-anchor="middle" font-size="9.5" fill="#2a4666">删后空 → C−−；仍 ≥2 → 加 [f1+1, l1]</text>
  </g>

  <!-- D3: val 是质数 ? -->
  <g filter="url(#rough2)">
    <polygon points="200,244 285,270 200,296 115,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="200" y="274" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">val 是质数 ?</text>
  </g>
  <path d="M 285 270 L 306 270" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="264" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 200 296 L 200 312" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="308" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <!-- N3: 插入 val -->
  <g filter="url(#rough2)">
    <rect x="308" y="248" width="207" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="411" y="262" text-anchor="middle" font-size="9.5" fill="#2a5a2a" font-weight="bold">向 S(val) 插入 idx</text>
    <text x="411" y="275" text-anchor="middle" font-size="9.5" fill="#2a5a2a">原 |S|≥2 → 先撤销旧区间</text>
    <text x="411" y="288" text-anchor="middle" font-size="9.5" fill="#2a5a2a">空→1 则 C++；插后 ≥2 → 加 [f1+1, l1]</text>
  </g>

  <!-- N4 -->
  <g filter="url(#rough2)">
    <rect x="125" y="312" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="200" y="333" text-anchor="middle" font-size="11" fill="#2a4666" font-weight="bold">nums[idx] = val</text>
  </g>

  <path d="M 200 344 L 200 362" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N5: 输出 -->
  <g filter="url(#rough2)">
    <rect x="108" y="362" width="184" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8"/>
    <text x="200" y="385" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold">ans = C + max D(k)</text>
  </g>

  <!-- 底部要点 -->
  <g filter="url(#rough2)">
    <rect x="28" y="412" width="464" height="40" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="8"/>
    <text x="260" y="428" text-anchor="middle" font-size="9.5" fill="#555">old ≠ val ⇒ S(old) 与 S(val) 必为不同集合，删除与插入互不干扰、顺序随意</text>
    <text x="260" y="446" text-anchor="middle" font-size="9.5" fill="#555">每轮至多 2 次集合操作、4 次区间加，总复杂度 O((n + q) log n)</text>
  </g>
</svg>
