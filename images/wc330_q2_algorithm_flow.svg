<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：正难则反数「不碰撞」，快速幂算 2ⁿ mod p</text>

  <!-- step 1: total -->
  <rect x="40" y="46" width="210" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">每只猴 2 选 1（顺 / 逆）</text>
  <text x="145" y="81" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">总方案数 = 2ⁿ</text>

  <!-- diamond: count collisions directly? -->
  <polygon points="330,40 425,68 330,96 235,68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="64" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">直接数「碰撞」？</text>
  <text x="330" y="79" text-anchor="middle" font-size="9" fill="#888">同顶 / 边交 / 多对…</text>

  <path d="M 250 68 L 235 68" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- right branch: hard -->
  <rect x="404" y="112" width="140" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="474" y="130" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 类别多、相交判定繁</text>
  <text x="474" y="146" text-anchor="middle" font-size="10" fill="#b85450">组合爆炸 + 易重易漏</text>
  <text x="474" y="162" text-anchor="middle" font-size="9" fill="#888">n ≤ 10⁹ 时更不可能</text>
  <path d="M 385 74 L 440 108" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="424" y="86" font-size="9.5" fill="#b85450" font-weight="bold">难 ✗</text>

  <!-- down branch: reverse -->
  <path d="M 330 96 L 330 122" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="348" y="113" font-size="9.5" fill="#4a7a3a" font-weight="bold">正难则反 ✓</text>

  <!-- step 2: count safe -->
  <rect x="40" y="124" width="210" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">改数「不碰撞」（补集）</text>
  <text x="145" y="160" text-anchor="middle" font-size="10.5" fill="#333">不碰撞 ⟺ 全员同向</text>
  <text x="145" y="176" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">= 全顺 1 种 + 全逆 1 种 = 2 种</text>

  <path d="M 250 153 L 282 153" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="146" text-anchor="middle" font-size="8.5" fill="#888">补集相减</text>

  <!-- step 3: formula -->
  <rect x="40" y="208" width="250" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="165" y="228" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = 2ⁿ − 2 (mod 10⁹+7)</text>
  <text x="165" y="246" text-anchor="middle" font-size="9.5" fill="#b85450">n = 3 → 6 ✓   n = 4 → 14 ✓</text>

  <path d="M 145 182 L 150 204" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- step 4: fast pow -->
  <rect x="330" y="208" width="200" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="227" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">n ≤ 10⁹ ⇒ 快速幂 O(log n)</text>
  <text x="430" y="243" text-anchor="middle" font-size="9.5" fill="#333">n 二进制逐位：base 自乘平方</text>
  <text x="430" y="258" text-anchor="middle" font-size="9.5" fill="#333">位为 1 则 ans ×= base，全程取模</text>

  <path d="M 290 232 L 326 232" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 5: output -->
  <rect x="120" y="286" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">输出 (2ⁿ mod p − 2 + p) mod p</text>
  <text x="280" y="314" text-anchor="middle" font-size="9" fill="#888">加 p 再取模：防 2ⁿ mod p &lt; 2 导致减出负数</text>

  <path d="M 430 270 L 400 284" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
