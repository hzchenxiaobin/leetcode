<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="360" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, 3, 2, 3, 1]，自底向上四次数跨区间</text>
  <text x="330" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">判定一律严格大于：2 · nums[j] &lt; nums[i] 才算一对</text>

  <rect x="16" y="60" width="624" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#3a4a66" text-anchor="middle" font-weight="bold">
    <text x="64" y="80">合并区间</text>
    <text x="160" y="80">左半 L</text>
    <text x="251" y="80">右半 R</text>
    <text x="401" y="80">双指针判定</text>
    <text x="542" y="80">本次</text>
    <text x="608" y="80">累计</text>
  </g>

  <g filter="url(#rough2)" font-size="9" fill="#888" text-anchor="middle">
    <text x="64" y="108">(0,1)</text>
    <text x="64" y="158">(0,2)</text>
    <text x="64" y="208">(3,4)</text>
    <text x="64" y="258">(0,4)</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#333" text-anchor="middle">
    <text x="160" y="108">[1]</text>
    <text x="160" y="158">[1, 3]</text>
    <text x="160" y="208">[3]</text>
    <text x="160" y="258">[1, 2, 3]</text>
    <text x="251" y="108">[3]</text>
    <text x="251" y="158">[2]</text>
    <text x="251" y="208">[1]</text>
    <text x="251" y="258">[1, 3]</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#555">
    <text x="304" y="105">1 &gt; 6？✗</text>
    <text x="304" y="121" font-size="8.5" fill="#999">j 不动，贡献 0</text>
    <text x="304" y="155">1 &gt; 4？✗；3 &gt; 4？✗</text>
    <text x="304" y="171" font-size="8.5" fill="#999">j 不动，贡献 0</text>
    <text x="304" y="205">3 &gt; 2 ✓</text>
    <text x="304" y="221" font-size="8.5" fill="#999">j：4 → 5（越界），贡献 1</text>
    <text x="304" y="255">1&gt;2 ✗；2&gt;2 ✗；3&gt;2 ✓；3&gt;6 ✗</text>
    <text x="304" y="271" font-size="8.5" fill="#999">j：3 → 4，同一节点内不重置</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#b85450" text-anchor="middle">
    <text x="542" y="108">0</text>
    <text x="542" y="158">0</text>
    <text x="542" y="208">1</text>
    <text x="542" y="258">1</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#4a7a3a" text-anchor="middle">
    <text x="608" y="108">0</text>
    <text x="608" y="158">0</text>
    <text x="608" y="208">1</text>
    <text x="608" y="258">2</text>
  </g>

  <g filter="url(#rough2)" fill="none" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 3">
    <path d="M 16 122 L 640 122"/>
    <path d="M 16 172 L 640 172"/>
    <path d="M 16 222 L 640 222"/>
  </g>

  <rect x="16" y="288" width="624" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="30" y="307" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">合并后回溯：[1] + [3] ⇒ [1,3]；[1,3] + [2] ⇒ [1,2,3]；[3] + [1] ⇒ [1,3]；顶层 [1,2,3] + [1,3]</text>
  <text x="30" y="325" font-size="9.5" fill="#666" filter="url(#rough2)">等号不计数：示例 1 的 (0,4) 是 1 &gt; 2 ✗，示例 2 的 (0,4) 是 2 &gt; 2 ✗ ⇒ 必须严格大于才 +1</text>

  <text x="330" y="354" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">答案 2，与示例 1 输出一致；每个合并节点内 j 都从 m + 1 重新出发，只向右移动</text>
</svg>
