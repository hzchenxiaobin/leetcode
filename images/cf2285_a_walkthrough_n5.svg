<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：n = 5 的构造 p = (4, 2, 3, 1, 5)</text>
  <path d="M 130 44 Q 360 50 590 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 表头：i 的取值 -->
  <rect x="150" y="64" width="92" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="196" y="91" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="248" y="64" width="92" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="294" y="91" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <rect x="346" y="64" width="92" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="392" y="91" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <rect x="444" y="64" width="92" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="490" y="91" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">4</text>
  <rect x="542" y="64" width="92" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="588" y="91" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="122" y="91" text-anchor="end" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">位置 i</text>

  <!-- p_i 行 -->
  <rect x="150" y="114" width="92" height="44" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <rect x="248" y="114" width="92" height="44" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="294" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <rect x="346" y="114" width="92" height="44" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="392" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <rect x="444" y="114" width="92" height="44" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="542" y="114" width="92" height="44" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="588" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="122" y="141" text-anchor="end" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">pᵢ</text>

  <!-- i*p_i 行 -->
  <rect x="150" y="164" width="92" height="44" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="196" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="248" y="164" width="92" height="44" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="294" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="346" y="164" width="92" height="44" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="392" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">9</text>
  <rect x="444" y="164" width="92" height="44" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="490" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="542" y="164" width="92" height="44" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="588" y="191" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">25</text>
  <text x="122" y="191" text-anchor="end" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">i·pᵢ</text>

  <!-- 判定行 -->
  <rect x="150" y="214" width="92" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="196" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">✓ 合数</text>
  <rect x="248" y="214" width="92" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="294" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">✓ 合数</text>
  <rect x="346" y="214" width="92" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="392" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">✓ 合数</text>
  <rect x="444" y="214" width="92" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="490" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">✓ 合数</text>
  <rect x="542" y="214" width="92" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="588" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">✓ 合数</text>
  <text x="122" y="240" text-anchor="end" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">判定</text>

  <!-- 底部说明 -->
  <rect x="22" y="290" width="676" height="98" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="314" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">四条乘积为什么全是合数</text>
  <text x="360" y="338" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">i = 1 与 i = 4：交换后乘积都是 4 = 2²；i = 2：2 × 2 = 4；i = 3：3 × 3 = 9</text>
  <text x="360" y="360" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">i ≥ 5：pᵢ = i 没被改动，乘积就是 i²，而 i 是 i² 的非平凡因子 ⇒ 合数</text>
  <text x="360" y="380" text-anchor="middle" font-size="11.5" fill="#a3762a" filter="url(#rough2)">整个构造只交换 p₁ 与 p₄，其余位置取自恒等排列</text>
</svg>
