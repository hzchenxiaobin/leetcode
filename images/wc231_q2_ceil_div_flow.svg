<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：求和 → 差距 → 上取整，一步闭式 O(1) 收尾</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">全程只有一次 O(n) 求和，其余都是常数操作</text>

  <!-- Box 1 -->
  <rect x="70" y="58" width="220" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="180" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">① 求和 S = Σ nums[i]</text>
  <text x="180" y="95" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（C++ 必须 long long 累加）</text>

  <path d="M 180 106 L 180 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Box 2 -->
  <rect x="70" y="132" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="180" y="159" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">② 差距 d = |goal − S|</text>

  <path d="M 180 176 L 180 198" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond -->
  <polygon points="180,200 254,232 180,264 106,232" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="237" text-anchor="middle" font-size="12" fill="#8a6a1c" font-weight="bold" filter="url(#rough2)">d = 0 ?</text>

  <!-- Yes branch -->
  <text x="272" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 254 232 L 316 232" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="320" y="212" width="110" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="375" y="237" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 0</text>
  <text x="375" y="268" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（公式天然返回 0，可不特判）</text>

  <!-- No branch -->
  <text x="192" y="282" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 180 264 L 180 292" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="60" y="296" width="310" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="215" y="323" text-anchor="middle" font-size="12" fill="#8a6a1c" font-weight="bold" filter="url(#rough2)">③ ans = (d + limit − 1) // limit（上取整）</text>
  <path d="M 370 318 L 402 318" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="406" y="296" width="110" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="461" y="323" text-anchor="middle" font-size="12.5" fill="#2b4c6e" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- Warning box -->
  <rect x="330" y="58" width="210" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4" rx="8" filter="url(#rough2)"/>
  <text x="435" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 溢出警戒线</text>
  <text x="435" y="100" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">|S| ≤ 10⁵ × 10⁶ = 10¹¹</text>
  <text x="435" y="118" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">远超 int 上界 ≈ 2.1×10⁹</text>
  <text x="435" y="138" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">求和、作差全程 64 位</text>

  <!-- Footer -->
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">整数上取整技巧：⌈a / b⌉ = (a + b − 1) // b（a ≥ 0，b ≥ 1），完全避开浮点</text>
</svg>
