<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="320" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">Hexspeak 转换流水线：一趟短除法完成转换与判定</text>

  <!-- 第一行：十进制 -> 短除法 -> 十六进制 -->
  <rect x="40" y="72" width="140" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="96" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">十进制串 num</text>
  <text x="110" y="117" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">"257"</text>

  <line x1="180" y1="101" x2="222" y2="101" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="224" y="72" width="160" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="304" y="96" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">短除法取余</text>
  <text x="304" y="117" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">d = n mod 16</text>

  <line x1="384" y1="101" x2="426" y2="101" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="428" y="72" width="160" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="508" y="96" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">十六进制（逆序取）</text>
  <text x="508" y="117" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">"101"</text>

  <!-- 竖直箭头到映射框 -->
  <line x1="508" y1="130" x2="508" y2="184" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第二行：映射规则 -> 结果 -->
  <rect x="428" y="186" width="160" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="508" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">逐位映射</text>
  <text x="508" y="228" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">0→O　1→I</text>
  <text x="508" y="246" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2~9→ERROR</text>
  <text x="508" y="262" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">10~15→A..F</text>

  <line x1="428" y1="225" x2="386" y2="225" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="196" y="190" width="190" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="291" y="214" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">返回 Hexspeak</text>
  <text x="291" y="236" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">"IOI"</text>
  <text x="291" y="254" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">或 "ERROR"</text>

  <text x="120" y="298" font-size="13" fill="#666" filter="url(#rough2)">要点：遇到余数 2~9 立即报错，</text>
  <text x="120" y="315" font-size="13" fill="#666" filter="url(#rough2)">无需先构出完整十六进制串。</text>
</svg>
