<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 404"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="404" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="27" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    核心构造：取 y = 10^d + 1，让乘积变成 x 把自己复制一遍
  </text>
  <text x="330" y="48" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">
    d 是 x 的十进制位数；x × (10^d + 1) = x·10^d + x = 2d 位的「x x」
  </text>

  <text x="42" y="82" font-size="12.5" fill="#446688" filter="url(#rough2)">
    x = 73，d = 2 位（x 至多 2 种数字）
  </text>
  <rect x="60" y="90" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="88" y="116" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">7</text>
  <rect x="122" y="90" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="116" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>

  <text x="42" y="164" font-size="12.5" fill="#d6a040" filter="url(#rough2)">
    y = 10^2 + 1 = 101，只有 0、1
  </text>
  <rect x="60" y="172" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="88" y="198" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="122" y="172" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="198" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <rect x="184" y="172" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="212" y="198" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <text x="42" y="246" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">
    x × y = 7373：高低两半都是 x
  </text>
  <rect x="60" y="254" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="88" y="280" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">7</text>
  <rect x="122" y="254" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="280" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="184" y="254" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="212" y="280" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">7</text>
  <rect x="246" y="254" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="274" y="280" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <text x="119" y="312" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">高 d 位 = x</text>
  <text x="243" y="312" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">低 d 位 = x</text>

  <rect x="344" y="76" width="288" height="238" rx="10" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="98" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">为什么一定成立（无进位）</text>
  <text x="488" y="122" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① x &lt; 10^d，x·10^d 的低 d 位全 0</text>
  <text x="488" y="146" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② 加上 x 后，低 d 位恰好是 x</text>
  <text x="488" y="170" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">③ 高位部分就是 x 本身</text>
  <text x="488" y="196" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">⇒ x·y 的数字 = x 的数字两遍，</text>
  <text x="488" y="218" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">仍至多 2 种 ✓</text>
  <text x="488" y="248" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">y = 1 后跟 d−1 个 0 再跟 1</text>
  <text x="488" y="272" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">⇒ 只含 0、1 两种数字 ✓</text>
  <text x="488" y="298" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">d = 1 时 y = 11，只含 1 种，也合法</text>

  <rect x="42" y="330" width="576" height="56" rx="10" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="352" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    范围：x &lt; 10^8 ⇒ d ≤ 8 ⇒ y = 10^d+1 ≤ 100000001 &lt; 10^9 ✓，且 y ≥ 11 ≥ 2 ✓
  </text>
  <text x="330" y="374" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">
    乘积最大 99999999 × 100000001 ≈ 10^16 —— C++ 里要用 long long
  </text>
</svg>
