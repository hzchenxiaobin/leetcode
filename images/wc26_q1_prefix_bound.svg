<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：长度上界 max(|a|, |b|) 与相等判定</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">特殊序列必须「是某一串的子序列，但不是另一串的子序列」</text>

  <g filter="url(#rough2)">
    <rect x="70" y="66" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="310" y="86" text-anchor="middle" font-size="11.5" fill="#3a4a66">候选串 t 一定来自 a 或 b 的子序列集合</text>
  </g>

  <path d="M 310 98 L 310 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="70" y="120" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="310" y="140" text-anchor="middle" font-size="11.5" fill="#3a4a66">子序列不增字符 ⇒ |t| ≤ |a|，或 |t| ≤ |b|</text>
  </g>

  <path d="M 310 152 L 310 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="174" width="320" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="310" y="195" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">上界：|t| ≤ max(|a|, |b|)</text>
  </g>

  <path d="M 310 206 L 310 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10.5">
    <rect x="40" y="232" width="255" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="56" y="252" fill="#3a5a30" font-weight="bold">情形一：a ≠ b（上界可达）</text>
    <text x="56" y="272" fill="#555">较长者自身长度就是 max；</text>
    <text x="56" y="288" fill="#555">它不可能落在短串的子序列集合里，</text>
    <text x="56" y="303" fill="#555">（更长；等长则内容必不同）</text>

    <rect x="325" y="232" width="255" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
    <text x="341" y="252" fill="#8a3a36" font-weight="bold">情形二：a == b（差集为空）</text>
    <text x="341" y="272" fill="#555">两串完全相同，子序列集合也相同，</text>
    <text x="341" y="288" fill="#555">任何子序列同时属于双方，</text>
    <text x="341" y="303" fill="#555">不存在特殊序列，返回 −1</text>
  </g>

  <path d="M 310 314 L 310 334" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="338" width="500" height="52" fill="#f0f4ff" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="76" y="358" font-size="11" fill="#3a4a66" font-weight="bold">结论：答案只有两种取值，O(min(|a|, |b|)) 判定</text>
    <text x="76" y="377" font-size="11" fill="#555">return a == b ? −1 : max(|a|, |b|)</text>
  </g>

  <text x="310" y="414" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">反例提醒：答案既不是 |a| − |b|，也不是 min(|a|, |b|)</text>
</svg>
