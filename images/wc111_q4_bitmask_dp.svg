<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 348" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="348" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">状压 DP：dp[mask][last] = 覆盖 mask 且以 last 结尾的最短长度</text>
  <rect x="50" y="80" width="112" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="106" y="102" text-anchor="middle" font-size="11.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">mask {0}</text>
  <text x="106" y="122" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">last ∈ 0</text>
  <rect x="180" y="80" width="112" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="236" y="102" text-anchor="middle" font-size="11.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">mask {1}</text>
  <text x="236" y="122" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">last ∈ 1</text>
  <rect x="320" y="190" width="112" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="212" text-anchor="middle" font-size="11.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">mask {0,1}</text>
  <text x="376" y="232" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">last ∈ 0/1</text>
  <rect x="470" y="300" width="112" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="526" y="322" text-anchor="middle" font-size="11.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">mask {0,1,2}</text>
  <text x="526" y="342" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">last ∈ 0/1/2</text>
  <path d="M 162 100 L 180 100" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 292 100 Q 300 130 320 190" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 292 100 Q 360 150 470 300" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="148" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">append nxt</text>
  <text x="430" y="210" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">代价 = len(w[nxt]) − ov[last][nxt]</text>
  <rect x="50" y="200" width="240" height="74" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="222" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">转移</text>
  <text x="170" y="242" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">dp[mask|1<<nxt][nxt] = min(</text>
  <text x="170" y="260" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">  dp[mask][last] + len − ov )</text>
  <text x="310" y="330" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">状态数 2^n · n ≤ 2^12 × 12 ≈ 4.9 万，转移 × n ≈ 59 万</text>
</svg>
