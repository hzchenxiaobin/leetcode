<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：平方整除化简 + 前缀双键配对</text>
  <path d="M 150 32 Q 320 40 470 32" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="36" y="46" width="200" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="136" y="70" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">判定① 平衡：v == c</text>
  <g filter="url(#sk)"><rect x="404" y="46" width="200" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="504" y="70" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">判定② k | v·c</text>

  <path d="M 136 84 Q 150 104 235 112" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 504 84 Q 490 104 405 112" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="190" y="112" width="260" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="320" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a10">平衡时代入 c = v</text>
  <text x="320" y="148" text-anchor="middle" font-size="11.5" fill="#7a5415">条件② 化为 k | v²（乘积 = v·v）</text>

  <path d="M 320 156 L 320 176" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="140" y="178" width="360" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="320" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">分解 k = ∏ p^e_p ⟹ m = ∏ p^⌈e_p/2⌉</text>
  <text x="320" y="220" text-anchor="middle" font-size="12" fill="#2e6e2e">k | v² ⟺ m | v（平方整除 → 线性整除）</text>

  <g filter="url(#sk)"><rect x="520" y="170" width="108" height="66" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="574" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">m 速查</text>
  <text x="574" y="204" text-anchor="middle" font-size="10.5" fill="#555">k=4 → m=2</text>
  <text x="574" y="218" text-anchor="middle" font-size="10.5" fill="#555">k=8 → m=4</text>
  <text x="574" y="232" text-anchor="middle" font-size="10.5" fill="#555">k=12 → m=6</text>

  <path d="M 320 230 L 320 256" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="248" font-size="10.5" fill="#888">m | v 可进键</text>

  <g filter="url(#sk)"><rect x="56" y="258" width="528" height="64" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="320" y="282" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">前缀量：V(p) = 前 p 个字符的元音数，D(p) = 2V(p) − p</text>
  <text x="320" y="306" text-anchor="middle" font-size="11.5" fill="#333">子串 (i, j]：D(i) == D(j) ⟺ 平衡；V(i) ≡ V(j) (mod m) ⟺ m | v</text>

  <path d="M 320 322 L 320 344" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="338" font-size="10.5" fill="#888">双条件合并</text>

  <g filter="url(#sk)"><rect x="56" y="346" width="528" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">双键 key(p) = ( D(p) , V(p) mod m )</text>
  <text x="320" y="396" text-anchor="middle" font-size="11.5" fill="#333">i &lt; j 且同键 ⟺ 子串 (i, j] 美丽；同键 c 个前缀两两配对 ⟹ C(c, 2)</text>

  <text x="320" y="448" text-anchor="middle" font-size="12" fill="#666">两条区间判定 → 一个前缀等值键 → 单趟哈希配对，O(n) 收工</text>
</svg>
