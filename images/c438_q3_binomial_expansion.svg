<svg xmlns="http://www.w3.org/2000/svg" width="660" height="390" viewBox="0 0 660 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="660" height="390" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：收缩 n−2 层 = 杨辉三角第 n−2 行系数加权</text>
  <path d="M 190 40 Q 330 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="125" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">杨辉三角（第 k 行 = C(k,·)）</text>

  <g filter="url(#sk)">
    <rect x="109" y="78" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="125" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="44" y="96" font-size="10" fill="#999" text-anchor="end">k=0</text>

  <g filter="url(#sk)">
    <rect x="90" y="114" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="128" y="114" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="106" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="144" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="44" y="132" font-size="10" fill="#999" text-anchor="end">k=1</text>

  <g filter="url(#sk)">
    <rect x="71" y="150" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="109" y="150" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="147" y="150" width="32" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="87" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="125" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="163" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="44" y="168" font-size="10" fill="#999" text-anchor="end">k=2</text>

  <g filter="url(#sk)">
    <rect x="52" y="186" width="32" height="26" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="90" y="186" width="32" height="26" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="128" y="186" width="32" height="26" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="166" y="186" width="32" height="26" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <text x="68" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">1</text>
  <text x="106" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">3</text>
  <text x="144" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">3</text>
  <text x="182" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">1</text>
  <text x="44" y="204" font-size="10" fill="#999" text-anchor="end">k=3</text>

  <text x="125" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">m = n−2 = 3 行</text>
  <text x="125" y="254" text-anchor="middle" font-size="11" fill="#888">= 终态加权系数</text>

  <text x="430" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#555">以 s = "34789" 为例（n = 5，收缩 3 层）</text>

  <g filter="url(#sk)">
    <rect x="304" y="78" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="356" y="78" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="408" y="78" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="460" y="78" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="512" y="78" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="326" y="98">3</text>
    <text x="378" y="98">4</text>
    <text x="430" y="98">7</text>
    <text x="482" y="98">8</text>
    <text x="534" y="98">9</text>
  </g>
  <text x="576" y="96" font-size="10" fill="#999">第 0 层（初始）</text>

  <path d="M 326 106 Q 330 115 340 124" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 378 106 Q 382 115 392 124" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 430 106 Q 434 115 444 124" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 482 106 Q 486 115 496 124" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="330" y="124" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="382" y="124" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="434" y="124" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="486" y="124" width="44" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="352" y="144">7</text>
    <text x="404" y="144">1</text>
    <text x="456" y="144">5</text>
    <text x="508" y="144">7</text>
  </g>
  <text x="576" y="142" font-size="10" fill="#999">第 1 层</text>

  <path d="M 352 152 Q 356 161 366 170" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 404 152 Q 408 161 418 170" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 456 152 Q 460 161 470 170" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="356" y="170" width="44" height="28" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="408" y="170" width="44" height="28" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="460" y="170" width="44" height="28" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#7a5415" text-anchor="middle">
    <text x="378" y="190">8</text>
    <text x="430" y="190">6</text>
    <text x="482" y="190">2</text>
  </g>
  <text x="576" y="188" font-size="10" fill="#999">第 2 层</text>

  <path d="M 378 198 Q 382 207 392 216" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 430 198 Q 434 207 444 216" stroke="#4a8edb" stroke-width="1.4" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="382" y="216" width="44" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="434" y="216" width="44" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="404" y="236">4</text>
    <text x="456" y="236">8</text>
  </g>
  <text x="576" y="234" font-size="10" fill="#999">第 3 层（终态）</text>

  <text x="430" y="268" text-anchor="middle" font-size="12" fill="#333">L = 1·3 + 3·4 + 3·7 + 1·8 = 44 ≡ 4 (mod 10)</text>
  <text x="430" y="288" text-anchor="middle" font-size="12" fill="#333">R = 1·4 + 3·7 + 3·8 + 1·9 = 58 ≡ 8 (mod 10)</text>
  <text x="430" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">L ≠ R → false（正是示例 2）</text>

  <g filter="url(#sk)">
    <rect x="30" y="330" width="600" height="48" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="330" y="350" text-anchor="middle" font-size="12" fill="#555">第 k 轮后：s^(k)_i = Σ C(k,j) · s[i+j] (mod 10) —— 帕斯卡恒等式归纳可证</text>
  <text x="330" y="369" text-anchor="middle" font-size="11" fill="#888">终态取 k = m = n−2、i = 0 与 i = 1：两位闭式一次算清，跳过全部中间层</text>
</svg>
