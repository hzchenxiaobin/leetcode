<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">切成长度 k 的块，块内哈希值求和再对 26 取模</text>
  <text x="270" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例：s = "abcd"，k = 2 → 输出 "bf"</text>

  <text x="52" y="88" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">s =</text>
  <g filter="url(#rough2)">
    <rect x="92" y="70" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="142" y="70" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="192" y="70" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="242" y="70" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="115" y="93" fill="#3a5a30">a</text>
    <text x="165" y="93" fill="#3a5a30">b</text>
    <text x="215" y="93" fill="#3a4a66">c</text>
    <text x="265" y="93" fill="#3a4a66">d</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="115" y="118">0</text>
    <text x="165" y="118">1</text>
    <text x="215" y="118">2</text>
    <text x="265" y="118">3</text>
  </g>

  <path d="M 137 128 L 137 152" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 237 128 L 237 152" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="52" y="154" width="170" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="66" y="176" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">第 1 块 "ab"</text>
  <text x="66" y="195" font-size="10.5" fill="#555" filter="url(#rough2)">0 + 1 = 1，1 % 26 = 1</text>
  <text x="66" y="209" font-size="10.5" fill="#555" filter="url(#rough2)">1 → 'b'</text>

  <rect x="236" y="154" width="170" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="176" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">第 2 块 "cd"</text>
  <text x="250" y="195" font-size="10.5" fill="#555" filter="url(#rough2)">2 + 3 = 5，5 % 26 = 5</text>
  <text x="250" y="209" font-size="10.5" fill="#555" filter="url(#rough2)">5 → 'f'</text>

  <path d="M 137 216 L 137 244" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 321 216 L 321 244" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="52" y="246" width="354" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="66" y="268" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">result = "b" + "f" = "bf"</text>
  <text x="66" y="287" font-size="10.5" fill="#555" filter="url(#rough2)">块数恰为 n / k，逐块拼接即得答案</text>

  <text x="60" y="330" font-size="11" fill="#555" filter="url(#rough2)">哈希映射：'a' → 0，'b' → 1，…，'z' → 25（字母表下标）</text>
  <text x="60" y="352" font-size="11" fill="#555" filter="url(#rough2)">取模后的值再映射回字母：chr(ord('a') + hashedChar)</text>
</svg>
