<svg xmlns="http://www.w3.org/2000/svg" width="720" height="512" viewBox="0 0 720 512"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="512" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">交互时序：随机量必须晚于隐藏量</text>
  <path d="M 196 42 Q 360 50 524 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="46" y="58" width="150" height="36" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="121" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">我们（解法）</text>
  <rect x="524" y="58" width="150" height="36" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="599" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">交 互 器</text>
  <path d="M 196 94 L 196 400" stroke="#c9c9c9" stroke-width="1.2" stroke-dasharray="5 6" filter="url(#rough2)"/>
  <path d="M 524 94 L 524 400" stroke="#c9c9c9" stroke-width="1.2" stroke-dasharray="5 6" filter="url(#rough2)"/>

  <!-- ① -->
  <path d="M 200 126 L 518 126" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="118" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① x = 1（挑最低位当探针）</text>

  <!-- ② -->
  <path d="M 520 186 L 202 186" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="360" y="178" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">② o = v ty 1（只回一个数）</text>
  <rect x="30" y="198" width="196" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="223" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">此刻才能决定走哪一支</text>

  <!-- ③ -->
  <path d="M 200 268 L 518 268" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="260" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">③ m0, m1（随机数在这一步才生成）</text>
  <rect x="500" y="280" width="196" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="598" y="302" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">v、ty、b 早在 ② 之前</text>
  <text x="598" y="322" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">就固定，看不到 d = m0⊕m1</text>

  <!-- ④ -->
  <path d="M 520 358 L 202 358" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="360" y="350" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">④ r = m_b ⊕ v</text>

  <rect x="46" y="378" width="300" height="38" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="196" y="403" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">⑤ 由 r 反推 b，输出并进入下一组</text>

  <rect x="24" y="424" width="672" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="44" y="444" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">反例：若 d 被交互器提前知道，它取 v0 = x &amp; ~d（ty=|）、v1 = x | d（ty=&amp;），</text>
  <text x="44" y="462" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">于是 v0⊕m0 = v1⊕m1：同一个 r 同时对应 b=0 与 b=1。</text>
  <text x="44" y="480" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">⇒ 确定性解法不存在，必须在「看到 o 之后」随机化 m0, m1。</text>
</svg>
