<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="560" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一条翻译规则统一 fix 与 unfix</text>
  <path d="M 140 40 Q 340 50 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- top banner -->
  <g filter="url(#sk)">
    <rect x="60" y="52" width="560" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33475e" filter="url(#sk)">翻译规则：物理目标 target = 逻辑目标 ⊕ flipped</text>
  <text x="340" y="90" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">当前逻辑值 = bits[idx] ⊕ flipped —— 判与写同源，flipped 切换后状态不错乱</text>

  <!-- ===== left column: fix ===== -->
  <g filter="url(#sk)">
    <rect x="95" y="112" width="200" height="32" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="195" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#33475e" filter="url(#sk)">fix(idx)：逻辑目标 = 1</text>
  <path d="M 195 144 L 195 158" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="95" y="162" width="200" height="32" rx="9" fill="#fff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="195" y="183" text-anchor="middle" font-size="12.5" fill="#33475e" filter="url(#sk)">target = 1 ⊕ flipped</text>
  <path d="M 195 194 L 195 208" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <polygon points="195,212 268,248 195,284 122,248" fill="#fff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="195" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475e" filter="url(#sk)">bits[idx] == target ?</text>
  <path d="M 122 248 L 115 300" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="112" y="240" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <path d="M 268 248 L 275 300" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="272" y="240" font-size="12" font-weight="bold" fill="#a04038" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="45" y="304" width="140" height="58" rx="8" fill="#f4f4ee" stroke="#8a8a8a" stroke-width="1.3"/>
  </g>
  <text x="115" y="326" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#666" filter="url(#sk)">无操作（幂等）</text>
  <text x="115" y="344" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">逻辑位已是 1</text>
  <text x="115" y="357" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">ones 不变</text>
  <g filter="url(#sk)">
    <rect x="205" y="304" width="140" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="275" y="326" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">bits[idx] ← target</text>
  <text x="275" y="344" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">逻辑位 0 → 1</text>
  <text x="275" y="357" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">ones += 1</text>

  <!-- ===== right column: unfix ===== -->
  <g filter="url(#sk)">
    <rect x="410" y="112" width="200" height="32" rx="9" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="510" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">unfix(idx)：逻辑目标 = 0</text>
  <path d="M 510 144 L 510 158" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="410" y="162" width="200" height="32" rx="9" fill="#fff" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="510" y="183" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">target = 0 ⊕ flipped（= flipped）</text>
  <path d="M 510 194 L 510 208" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <polygon points="510,212 583,248 510,284 437,248" fill="#fff" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="510" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">bits[idx] == target ?</text>
  <path d="M 437 248 L 430 300" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="404" y="240" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <path d="M 583 248 L 590 300" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="588" y="240" font-size="12" font-weight="bold" fill="#a04038" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="360" y="304" width="140" height="58" rx="8" fill="#f4f4ee" stroke="#8a8a8a" stroke-width="1.3"/>
  </g>
  <text x="430" y="326" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#666" filter="url(#sk)">无操作（幂等）</text>
  <text x="430" y="344" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">逻辑位已是 0</text>
  <text x="430" y="357" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">ones 不变</text>
  <g filter="url(#sk)">
    <rect x="520" y="304" width="140" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="590" y="326" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">bits[idx] ← target</text>
  <text x="590" y="344" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">逻辑位 1 → 0</text>
  <text x="590" y="357" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">ones −= 1</text>

  <!-- ===== bottom: flip and queries ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="400" width="280" height="76" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/>
  </g>
  <text x="200" y="422" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a04038" filter="url(#sk)">flip() —— O(1)</text>
  <text x="200" y="443" text-anchor="middle" font-size="11.5" fill="#a04038" filter="url(#sk)">flipped ← ¬flipped</text>
  <text x="200" y="462" text-anchor="middle" font-size="11.5" fill="#a04038" filter="url(#sk)">ones ← n − ones（不碰数组）</text>
  <g filter="url(#sk)">
    <rect x="370" y="400" width="250" height="76" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.7"/>
  </g>
  <text x="495" y="422" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">查询 —— 直接读 ones</text>
  <text x="495" y="443" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">all()：ones == n　　one()：ones &gt; 0</text>
  <text x="495" y="462" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">count()：ones　toString()：逐位 ⊕，O(n)·≤5 次</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="500" width="560" height="44" rx="8" fill="#f4f4ee" stroke="#8a8a8a" stroke-width="1.2"/>
  </g>
  <text x="340" y="518" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">判定「bits[idx] == target ?」本身就是逻辑判定的化身：</text>
  <text x="340" y="536" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">bits[idx] ≠ target ⇔ bits[idx] ⊕ flipped ≠ 逻辑目标 ⇔ 当前逻辑值 ≠ 目标值</text>
</svg>
