<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="77"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 的 BFS 分层：dist[9] = 3，最短路径 0 → 4 → 3 → 9</text>

  <!-- d=0 层 -->
  <text x="70" y="76" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">dist = 0</text>
  <circle cx="120" cy="70" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- d=1 层 -->
  <text x="70" y="150" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">dist = 1</text>
  <circle cx="200" cy="144" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="340" cy="144" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="340" y="149" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <path d="M 128 84 L 190 128" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="98" font-size="11" fill="#446688" filter="url(#rough2)">0 + 1 步</text>
  <path d="M 132 62 C 220 20, 320 60, 336 122" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="236" y="44" font-size="11" fill="#b85450" filter="url(#rough2)">同值 100：一次传送！</text>

  <!-- d=2 层 -->
  <text x="70" y="246" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">dist = 2</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <circle cx="130" cy="240" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="220" cy="240" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="340" cy="240" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="420" cy="240" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="500" cy="240" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="130" y="245">2</text><text x="220" y="245" font-weight="bold">3</text><text x="340" y="245">5</text>
    <text x="420" y="245">6</text><text x="500" y="245">7</text>
  </g>
  <path d="M 200 166 L 150 222" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="192" font-size="11" fill="#446688" filter="url(#rough2)">1−1</text>
  <path d="M 340 166 L 236 222" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="196" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4−1（走步边）</text>
  <path d="M 352 166 L 348 220" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 160 C 420 175, 500 185, 510 220" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="196" font-size="11" fill="#b85450" filter="url(#rough2)">同值 23</text>

  <!-- d=3 层 -->
  <text x="70" y="342" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">dist = 3</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <circle cx="220" cy="336" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <circle cx="500" cy="336" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="220" y="341">8</text>
    <circle cx="420" cy="336" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <text x="420" y="341" font-weight="bold">9</text>
  </g>
  <path d="M 220 314 L 220 262" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 500 314 L 500 262" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 236 252 C 300 300, 356 320, 398 332" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="316" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">同值 404：3 → 9 到终点！</text>

  <!-- 高亮路径汇总 -->
  <rect x="60" y="366" width="440" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">红色路径 0 → 4 → 3 → 9：BFS 首次弹出 9 时 dist = 3</text>
</svg>
