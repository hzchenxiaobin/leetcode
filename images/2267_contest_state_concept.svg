<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="700" height="470" fill="#fdfcf7"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：把指数条路径折叠成 (i, j, balance) 状态</text>
  <path d="M 130 42 Q 350 52 570 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left panel: grid with two paths -->
  <g filter="url(#sk)">
    <rect x="26" y="58" width="306" height="314" rx="10" fill="#f2f7fc" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="179" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">示例 1：4×3 括号网格（两条合法路径）</text>

  <g filter="url(#sk)">
    <rect x="85" y="98" width="48" height="48" rx="4" fill="#fff" stroke="#7a96ad" stroke-width="1.6"/>
    <rect x="133" y="98" width="48" height="48" rx="4" fill="#fff" stroke="#7a96ad" stroke-width="1.6"/>
    <rect x="181" y="98" width="48" height="48" rx="4" fill="#fff" stroke="#7a96ad" stroke-width="1.6"/>
    <rect x="85" y="146" width="48" height="48" rx="4" fill="#fff" stroke="#7a96ad" stroke-width="1.6"/>
    <rect x="133" y="146" width="48" height="48" rx="4" fill="#fff" stroke="#7a96ad" stroke-width="1.6"/>
    <rect x="181" y="146" width="48" height="48" rx="4" fill="#fff" stroke="#7a96ad" stroke-width="1.6"/>
    <rect x="85" y="194" width="48" height="48" rx="4" fill="#fff" stroke="#7a96ad" stroke-width="1.6"/>
    <rect x="133" y="194" width="48" height="48" rx="4" fill="#fff" stroke="#7a96ad" stroke-width="1.6"/>
    <rect x="181" y="194" width="48" height="48" rx="4" fill="#fff" stroke="#7a96ad" stroke-width="1.6"/>
    <rect x="85" y="242" width="48" height="48" rx="4" fill="#fff" stroke="#7a96ad" stroke-width="1.6"/>
    <rect x="133" y="242" width="48" height="48" rx="4" fill="#fff" stroke="#7a96ad" stroke-width="1.6"/>
    <rect x="181" y="242" width="48" height="48" rx="4" fill="#fff" stroke="#7a96ad" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)">
    <text x="109" y="127" text-anchor="middle" font-size="17" font-weight="bold" fill="#444">(</text>
    <text x="157" y="127" text-anchor="middle" font-size="17" font-weight="bold" fill="#444">(</text>
    <text x="205" y="127" text-anchor="middle" font-size="17" font-weight="bold" fill="#444">(</text>
    <text x="109" y="175" text-anchor="middle" font-size="17" font-weight="bold" fill="#444">)</text>
    <text x="157" y="175" text-anchor="middle" font-size="17" font-weight="bold" fill="#444">(</text>
    <text x="205" y="175" text-anchor="middle" font-size="17" font-weight="bold" fill="#444">)</text>
    <text x="109" y="223" text-anchor="middle" font-size="17" font-weight="bold" fill="#444">(</text>
    <text x="157" y="223" text-anchor="middle" font-size="17" font-weight="bold" fill="#444">(</text>
    <text x="205" y="223" text-anchor="middle" font-size="17" font-weight="bold" fill="#444">)</text>
    <text x="109" y="271" text-anchor="middle" font-size="17" font-weight="bold" fill="#444">(</text>
    <text x="157" y="271" text-anchor="middle" font-size="17" font-weight="bold" fill="#444">(</text>
    <text x="205" y="271" text-anchor="middle" font-size="17" font-weight="bold" fill="#444">)</text>
  </g>

  <!-- path A: right,right,down,down,down -->
  <path d="M 109 122 L 157 122 L 205 122 L 205 170 L 205 218 L 205 266"
        stroke="#4a8edb" stroke-width="3" fill="none" stroke-linejoin="round"
        stroke-linecap="round" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="109" cy="122" r="3.5" fill="#4a8edb"/>
    <circle cx="157" cy="122" r="3.5" fill="#4a8edb"/>
    <circle cx="205" cy="122" r="3.5" fill="#4a8edb"/>
    <circle cx="205" cy="170" r="3.5" fill="#4a8edb"/>
    <circle cx="205" cy="218" r="3.5" fill="#4a8edb"/>
    <circle cx="205" cy="266" r="3.5" fill="#4a8edb"/>
  </g>
  <!-- path B: down,right,down,right,down -->
  <path d="M 109 122 L 109 170 L 157 170 L 157 218 L 205 218 L 205 266"
        stroke="#4a8e4a" stroke-width="3" fill="none" stroke-linejoin="round"
        stroke-linecap="round" stroke-dasharray="7 5" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="109" cy="170" r="3.5" fill="#4a8e4a"/>
    <circle cx="157" cy="170" r="3.5" fill="#4a8e4a"/>
    <circle cx="157" cy="218" r="3.5" fill="#4a8e4a"/>
  </g>
  <text x="85" y="93" font-size="11" fill="#b85450">起点 (0,0)</text>
  <text x="205" y="306" text-anchor="middle" font-size="11" fill="#b85450">终点 (3,2)</text>
  <text x="60" y="332" font-size="12" fill="#2b6e9e">A（蓝实线）：右右下下下 → "((()))"</text>
  <text x="60" y="352" font-size="12" fill="#2e6e2e">B（绿虚线）：下右下右下 → "()(())"</text>

  <!-- right panel: balance corridor -->
  <g filter="url(#sk)">
    <rect x="352" y="58" width="322" height="314" rx="10" fill="#fdf9ef" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="513" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a15">balance 走廊：0 ≤ bal ≤ 剩余格数 rem</text>

  <g filter="url(#sk)">
    <polygon points="392,300 442,300 492,300 542,300 592,300 642,300 642,300 592,258 542,216 492,174 442,174 392,174" fill="#fff8e1"/>
  </g>
  <path d="M 392 174 L 442 174 L 492 174 L 542 216 L 592 258 L 642 300"
        stroke="#c98a2b" stroke-width="1.8" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <path d="M 392 300 L 642 300" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="513" y="164" text-anchor="middle" font-size="11" fill="#9a6a15">上界 bal = rem（剩余全是 ) 也拉得回 0）</text>
  <text x="517" y="318" text-anchor="middle" font-size="11" fill="#b85450">下界 bal = 0</text>

  <g filter="url(#sk)">
    <text x="380" y="178" text-anchor="end" font-size="11" fill="#666">3</text>
    <text x="380" y="220" text-anchor="end" font-size="11" fill="#666">2</text>
    <text x="380" y="262" text-anchor="end" font-size="11" fill="#666">1</text>
    <text x="380" y="304" text-anchor="end" font-size="11" fill="#666">0</text>
    <text x="378" y="146" text-anchor="end" font-size="11" font-weight="bold" fill="#888">bal</text>
    <text x="392" y="332" text-anchor="middle" font-size="11" fill="#666">1</text>
    <text x="442" y="332" text-anchor="middle" font-size="11" fill="#666">2</text>
    <text x="492" y="332" text-anchor="middle" font-size="11" fill="#666">3</text>
    <text x="542" y="332" text-anchor="middle" font-size="11" fill="#666">4</text>
    <text x="592" y="332" text-anchor="middle" font-size="11" fill="#666">5</text>
    <text x="642" y="332" text-anchor="middle" font-size="11" fill="#666">6</text>
    <text x="517" y="354" text-anchor="middle" font-size="11" fill="#666">步数 t（已读格数）</text>
  </g>

  <!-- curve A -->
  <path d="M 392 258 L 442 216 L 492 174 L 542 216 L 592 258 L 642 300"
        stroke="#4a8edb" stroke-width="2.4" fill="none" stroke-linejoin="round" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="392" cy="258" r="3.5" fill="#4a8edb"/>
    <circle cx="442" cy="216" r="3.5" fill="#4a8edb"/>
    <circle cx="492" cy="174" r="3.5" fill="#4a8edb"/>
    <circle cx="542" cy="216" r="3.5" fill="#4a8edb"/>
    <circle cx="592" cy="258" r="3.5" fill="#4a8edb"/>
  </g>
  <!-- curve B -->
  <path d="M 392 258 L 442 300 L 492 258 L 542 216 L 592 258 L 642 300"
        stroke="#4a8e4a" stroke-width="2.4" fill="none" stroke-linejoin="round"
        stroke-dasharray="6 4" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="442" cy="300" r="3.5" fill="#4a8e4a"/>
    <circle cx="492" cy="258" r="3.5" fill="#4a8e4a"/>
    <circle cx="542" cy="216" r="3.5" fill="#4a8e4a"/>
    <circle cx="592" cy="258" r="3.5" fill="#4a8e4a"/>
  </g>
  <text x="506" y="170" font-size="12" font-weight="bold" fill="#2b6e9e">A</text>
  <text x="452" y="294" font-size="12" font-weight="bold" fill="#2e6e2e">B</text>
  <g filter="url(#sk)">
    <circle cx="642" cy="300" r="6.5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="630" y="290" text-anchor="end" font-size="11" font-weight="bold" fill="#b85450">终点 bal = 0 ✓</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="26" y="390" width="648" height="62" rx="8" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="46" y="415" font-size="12.5" fill="#333">状态折叠：同格同 balance 的路径前途完全相同 → 合并为一类状态 (i, j, bal)；</text>
  <text x="46" y="439" font-size="12.5" fill="#333">合法 ⇔ bal 全程 ≥ 0 且终点 = 0；上界 bal ≤ rem 提前剪掉「( 堆太多回不来」的死分支。</text>
</svg>
