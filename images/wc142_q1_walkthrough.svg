<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arr_green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr_orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arr_red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr_gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#78909c"/>
    </marker>
    <marker id="arr_purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="640" height="320" fill="#fafafa"/>

  <text x="320.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两个官方示例的五个统计量</text>
  <text x="320.0" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">中位数是唯一需要「定位」的量，其余都是聚合</text>

  <rect x="30" y="66" width="580" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="42" y="86" text-anchor="start" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1：count[1..3] = 1, 3, 4</text>
  <text x="42" y="103" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">样本 = [1, 2,2,2, 3,3,3,3]，N = 8（偶）</text>
  <text x="42" y="120" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">min=1，max=3，mean=19/8=2.375，mode=3（count[3]=4 最大）</text>
  <text x="42" y="137" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">median：rank 4 → 2，rank 5 → 3 ⇒ (2+3)/2 = 2.5</text>
  <rect x="30" y="188" width="580" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="42" y="208" text-anchor="start" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2：count[1..4] = 4, 3, 2, 2</text>
  <text x="42" y="225" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">样本 = [1,1,1,1, 2,2,2, 3,3, 4,4]，N = 11（奇）</text>
  <text x="42" y="242" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">min=1，max=4，mean=24/11≈2.18182，mode=1（count[1]=4 最大）</text>
  <text x="42" y="259" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">median：rank 6 → 2（P(1)=4 &lt; 6 ≤ P(2)=7）</text>
  <text x="24" y="304" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">输出允许 1e-5 误差，但 19/8、24/11 这类值应直接以浮点除得到，避免中间取整。</text>
</svg>
