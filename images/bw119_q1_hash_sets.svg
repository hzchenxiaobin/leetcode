<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">思路：只问「是否出现」→ 建值集合，双向各扫一遍</text>

  <!-- nums1 行 -->
  <text x="42" y="73" font-size="14" fill="#446688" filter="url(#rough2)">nums1</text>
  <g filter="url(#rough2)">
    <rect x="100" y="52" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="138" y="52" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="176" y="52" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="214" y="52" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="252" y="52" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="117" y="72" text-anchor="middle" font-size="13" fill="#333">4</text>
    <text x="155" y="72" text-anchor="middle" font-size="13" fill="#1c3a1c">3</text>
    <text x="193" y="72" text-anchor="middle" font-size="13" fill="#1c3a1c">2</text>
    <text x="231" y="72" text-anchor="middle" font-size="13" fill="#1c3a1c">3</text>
    <text x="269" y="72" text-anchor="middle" font-size="13" fill="#333">1</text>
  </g>
  <text x="300" y="72" font-size="12" fill="#4a7a3a" filter="url(#rough2)">绿色 = 该值出现在另一数组</text>

  <!-- nums2 行 -->
  <text x="42" y="133" font-size="14" fill="#446688" filter="url(#rough2)">nums2</text>
  <g filter="url(#rough2)">
    <rect x="100" y="112" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="138" y="112" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="176" y="112" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="214" y="112" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="252" y="112" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="290" y="112" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="117" y="132" text-anchor="middle" font-size="13" fill="#1c3a1c">2</text>
    <text x="155" y="132" text-anchor="middle" font-size="13" fill="#1c3a1c">2</text>
    <text x="193" y="132" text-anchor="middle" font-size="13" fill="#333">5</text>
    <text x="231" y="132" text-anchor="middle" font-size="13" fill="#1c3a1c">2</text>
    <text x="269" y="132" text-anchor="middle" font-size="13" fill="#1c3a1c">3</text>
    <text x="307" y="132" text-anchor="middle" font-size="13" fill="#333">6</text>
  </g>

  <!-- 交叉查询箭头 -->
  <path d="M300,90 C345,120 380,150 405,205" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="128" font-size="12" fill="#b85450" filter="url(#rough2)">nums1 逐个去 s2 查</text>
  <path d="M120,148 C112,165 112,185 140,205" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="185" font-size="12" fill="#d6a040" filter="url(#rough2)">nums2 逐个去 s1 查</text>

  <!-- 两个集合 -->
  <ellipse cx="150" cy="245" rx="78" ry="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="242" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">s1 = {1,2,3,4}</text>
  <text x="150" y="258" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">set(nums1)</text>
  <ellipse cx="410" cy="245" rx="78" ry="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="242" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">s2 = {2,3,5,6}</text>
  <text x="410" y="258" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">set(nums2)</text>

  <!-- 结果 -->
  <rect x="55" y="300" width="230" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="319" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">answer1 = 3</text>
  <text x="170" y="334" text-anchor="middle" font-size="11" fill="#997722" filter="url(#rough2)">nums1 中落在 s2 的下标数</text>
  <rect x="305" y="300" width="230" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="319" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">answer2 = 4</text>
  <text x="420" y="334" text-anchor="middle" font-size="11" fill="#997722" filter="url(#rough2)">nums2 中落在 s1 的下标数</text>
</svg>
