<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：a/b = 2.0，b/c = 3.0</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每一步只做两件事：把两个根连起来并写下「新根 / 老根」的比值；查询时做一次除法</text>

  <rect x="36" y="64" width="528" height="270" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>

  <rect x="36" y="64" width="528" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="66" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="170" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">操作</text>
  <text x="315" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">parent（ratio）</text>
  <text x="474" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">依据</text>

  <path d="M 96 64 L 96 334" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 246 64 L 246 334" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 386 64 L 386 334" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <path d="M 36 130 L 564 130" stroke="#c9d6e8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 36 164 L 564 164" stroke="#c9d6e8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 36 198 L 564 198" stroke="#c9d6e8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 36 232 L 564 232" stroke="#c9d6e8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 36 266 L 564 266" stroke="#c9d6e8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 36 300 L 564 300" stroke="#c9d6e8" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="66" y="118" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="170" y="118" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">建点 a, b, c</text>
  <text x="315" y="118" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">三个孤立根</text>
  <text x="474" y="118" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">ratio 全为 1</text>

  <text x="66" y="152" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="170" y="152" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">union(a, b, 2.0)</text>
  <text x="315" y="152" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">b → a，ratio = 0.5</text>
  <text x="474" y="152" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1 / (2.0 × 1)</text>

  <text x="66" y="186" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">3</text>
  <text x="170" y="186" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">union(b, c, 3.0)</text>
  <text x="315" y="186" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">c → a，ratio = 1/6</text>
  <text x="474" y="186" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">0.5 / (3.0 × 1)</text>

  <text x="66" y="220" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">4</text>
  <text x="170" y="220" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">查询 a / c</text>
  <text x="315" y="220" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">同根 a</text>
  <text x="474" y="220" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1 / (1/6) = 6.0</text>

  <text x="66" y="254" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">5</text>
  <text x="170" y="254" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">查询 b / a</text>
  <text x="315" y="254" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">同根 a</text>
  <text x="474" y="254" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">0.5 / 1 = 0.5</text>

  <text x="66" y="288" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">6</text>
  <text x="170" y="288" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">查询 a / a</text>
  <text x="315" y="288" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">同根 a</text>
  <text x="474" y="288" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1 / 1 = 1.0</text>

  <text x="66" y="322" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">7</text>
  <text x="170" y="322" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">查询 x / x</text>
  <text x="315" y="322" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">无编号</text>
  <text x="474" y="322" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">未定义 ⇒ −1.0</text>

  <text x="300" y="360" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">最终答案 [6.0, 0.5, −1.0, 1.0, −1.0]，与官方输出完全一致</text>
  <text x="300" y="382" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意：x 没在 equations 里出现，绝不能因为 x == x 就返回 1.0</text>
</svg>
