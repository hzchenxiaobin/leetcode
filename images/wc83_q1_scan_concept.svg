<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="15" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">扫描一遍即可切出所有分组</text>
  <path d="M 170.0 44 Q 320.0 54 470.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="320.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">相邻的相同字符构成一个分组，长度 ≥ 3 才算「较大分组」</text>
  <g filter="url(#rough2)"><rect x="100" y="100" width="36" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="118.0" y="125.84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="144" y="100" width="36" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="162.0" y="125.84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="188" y="100" width="36" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="206.0" y="125.84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="232" y="100" width="36" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="250.0" y="125.84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">x</text>
  <g filter="url(#rough2)"><rect x="276" y="100" width="36" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="294.0" y="125.84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">x</text>
  <g filter="url(#rough2)"><rect x="320" y="100" width="36" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="338.0" y="125.84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">x</text>
  <g filter="url(#rough2)"><rect x="364" y="100" width="36" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="382.0" y="125.84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">x</text>
  <g filter="url(#rough2)"><rect x="408" y="100" width="36" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="426.0" y="125.84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">z</text>
  <g filter="url(#rough2)"><rect x="452" y="100" width="36" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="470.0" y="125.84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">z</text>
  <g filter="url(#rough2)"><rect x="496" y="100" width="36" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="514.0" y="125.84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">y</text>
  <text x="118" y="154" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">0</text>
  <text x="162" y="154" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <text x="206" y="154" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">2</text>
  <text x="250" y="154" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">3</text>
  <text x="294" y="154" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">4</text>
  <text x="338" y="154" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">5</text>
  <text x="382" y="154" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">6</text>
  <text x="426" y="154" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">7</text>
  <text x="470" y="154" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">8</text>
  <text x="514" y="154" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><rect x="98" y="164" width="40" height="26" rx="5" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.4"/></g>
  <text x="118.0" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="142" y="164" width="84" height="26" rx="5" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.4"/></g>
  <text x="184.0" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="230" y="164" width="172" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="316.0" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="406" y="164" width="40" height="26" rx="5" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.4"/></g>
  <text x="426.0" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="450" y="164" width="84" height="26" rx="5" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1.4"/></g>
  <text x="492.0" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="118.0" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="184.0" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="316.0" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="426.0" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="492.0" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <path d="M 315 224 Q 315.0 239.0 315 254" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="175" y="256" width="290" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="320" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#rough2)">较大分组：[3,6]</text>
  <text x="320" y="297" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#rough2)">只有 xxxx 的长度 4 ≥ 3，其余 1/2/1/2 全部跳过</text>
  <g filter="url(#rough2)"><rect x="90" y="330" width="460" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320.0" y="352" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">i 从分组起点出发，j 一路右移直到字符改变</text>
  <text x="320.0" y="370" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">区间 [i, j−1] 天然左闭右闭，且按起点递增输出</text>
  </svg>