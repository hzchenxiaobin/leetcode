<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">Bob 守恒策略回放：num = "?3295???"（qL=1, qR=3, d=9, Φ₀=0）</text>

  <!-- 表格 -->
  <g filter="url(#rough2)">
    <rect x="40" y="52" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="40" y="86" width="480" height="30" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="40" y="116" width="480" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="40" y="146" width="480" height="30" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="40" y="176" width="480" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="40" y="206" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="160" y1="52" x2="160" y2="236"/>
    <line x1="300" y1="52" x2="300" y2="236"/>
    <line x1="400" y1="52" x2="400" y2="236"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="100" y="74">回合</text><text x="230" y="74">操作</text><text x="350" y="74">d（左−右）</text><text x="464" y="74">Φ</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="100" y="106">初始</text><text x="230" y="106">—</text><text x="350" y="106">9</text><text x="464" y="106">0</text>
    <text x="100" y="136">Alice</text><text x="230" y="136">左填 9</text><text x="350" y="136">18</text><text x="464" y="136" fill="#b85450" font-weight="bold">+4.5</text>
    <text x="100" y="166">Bob</text><text x="230" y="166">右填 9</text><text x="350" y="166">9</text><text x="464" y="166" fill="#2f5226" font-weight="bold">0 ←拨回</text>
    <text x="100" y="196">Alice</text><text x="230" y="196">右填 2</text><text x="350" y="196">7</text><text x="464" y="196" fill="#b85450" font-weight="bold">+2.5</text>
    <text x="100" y="226">Bob</text><text x="230" y="226">右填 7</text><text x="350" y="226">0</text><text x="464" y="226" fill="#2f5226" font-weight="bold">0 ←终局相等</text>
  </g>
  <text x="230" y="252" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">Bob 的应手不是抄数字，而是算「把 Φ 拨回 0」所需的补值：Φ=4.5 → 右填 9；Φ=2.5 → 右填 7</text>

  <!-- 数轴走位 -->
  <text x="280" y="288" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">指针 Φ 在数轴上的走位：</text>
  <line x1="80" y1="340" x2="480" y2="340" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
  <g stroke="#666" stroke-width="1.5" filter="url(#rough2)">
    <line x1="130" y1="332" x2="130" y2="348"/><line x1="190" y1="334" x2="190" y2="346"/>
    <line x1="250" y1="332" x2="250" y2="348"/><line x1="310" y1="334" x2="310" y2="346"/>
    <line x1="370" y1="332" x2="370" y2="348"/><line x1="430" y1="334" x2="430" y2="346"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="130" y="362">0</text><text x="190" y="362">+2.5</text><text x="250" y="362">+4.5</text>
    <text x="310" y="362">+5.5</text><text x="370" y="362">+7</text><text x="430" y="362">+9</text>
  </g>
  <g filter="url(#rough2)">
    <circle cx="130" cy="340" r="7" fill="#3a4a66"/>
    <circle cx="250" cy="340" r="7" fill="#b85450"/>
    <circle cx="190" cy="340" r="7" fill="#4a7a3a"/>
  </g>
  <path d="M 138 336 L 240 336" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="326" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">Alice 拨出 +4.5</text>
  <path d="M 242 352 L 138 352" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="372" text-anchor="middle" font-size="10" fill="#2f5226" filter="url(#rough2)">Bob 拨回 0（在射程内）</text>
  <path d="M 138 348 L 182 348" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="474" y="352" font-size="10.5" fill="#888" filter="url(#rough2)">→ 0</text>

  <!-- 底部 -->
  <g filter="url(#rough2)">
    <rect x="40" y="384" width="500" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8"/>
  </g>
  <text x="290" y="403" text-anchor="middle" font-size="11.5" fill="#a0392f" font-weight="bold" filter="url(#rough2)">对比 "25??"：Φ₀ = −2，Alice 左/右填 9 把 Φ 拨到 −6.5，超出射程 → Bob 无力回天。</text>
</svg>
