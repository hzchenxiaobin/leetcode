<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="600" height="350" fill="#fafafa"/>
  <text x="300" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">固定上下边界，把二维压成一维</text>
  <text x="300" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">对每一对 (top, bottom)，列和数组的每个子数组对应一个子矩阵</text>
  <text x="40" y="88" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">矩阵</text>
  <rect x="100" y="60" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="80.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="140" y="60" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="160" y="80.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="180" y="60" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="200" y="80.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="100" y="100" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="120.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="140" y="100" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="160" y="120.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="180" y="100" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="200" y="120.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="100" y="140" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="160.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="140" y="140" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="160" y="160.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="180" y="140" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="200" y="160.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0</text>
  <path d="M 100 204 Q 100 196 108 196 L 172 196 Q 180 196 180 204" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="140" y="188" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">bottom = 2</text>
  <text x="255" y="84" font-size="18" fill="#888" text-anchor="start" filter="url(#rough2)">→</text>
  <text x="285" y="84" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">列和</text>
  <text x="285" y="108" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">1+1+0 = 1</text>
  <text x="285" y="126" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">1+1+1 = 3</text>
  <text x="285" y="144" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">0+1+0 = 1</text>
  <rect x="400" y="60" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="420" y="80.3" font-size="12" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="440" y="60" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="460" y="80.3" font-size="12" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="480" y="60" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="500" y="80.3" font-size="12" fill="#8a6a10" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="400" y="112" font-size="10.5" fill="#8a6a10" text-anchor="start" filter="url(#rough2)">列和数组</text>
  <rect x="40" y="216" width="250" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="52" y="246.6" font-size="10" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">子矩阵 (top, bottom, l, r) 的和</text>
  <text x="52" y="262.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">= 列和数组在 [l, r] 上的子数组和</text>
  <rect x="320" y="216" width="240" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="332" y="246.6" font-size="10" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">于是问题变成：</text>
  <text x="332" y="262.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">统计和等于 target 的连续子数组个数</text>
  <text x="40" y="312" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">枚举 top 与 bottom 共 O(m²) 对，每对做一次 O(n) 的一维统计</text>
</svg>
