<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="157"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">数轴视角：同余目标构成一个「同余组」</text>

  <path d="M 50 120 L 510 120" stroke="#888" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <g><ellipse cx="90" cy="108" rx="16" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="90" y="113">1</text>
    <g><ellipse cx="150" cy="132" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="150" y="137">3</text>
    <g><ellipse cx="210" cy="108" rx="16" ry="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="210" y="113">8</text>
    <g><ellipse cx="270" cy="132" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="270" y="137">5</text>
    <g><ellipse cx="330" cy="132" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="330" y="137">7</text>
    <g><ellipse cx="90" cy="132" rx="16" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
    <text x="66" y="166">1（重复）</text>
  </g>

  <path d="M 74 96 L 74 62 L 356 62" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="215" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">x mod 2 = 1 的组：{1, 1, 3, 5, 7}，共 5 个</text>

  <path d="M 210 150 L 210 200" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="252" y="180" font-size="12" fill="#a3721d" filter="url(#rough2)">x mod 2 = 0 的组：{8}，仅 1 个</text>

  <g filter="url(#rough2)">
    <rect x="60" y="212" width="440" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#1d3a17" text-anchor="middle">
    <text x="280" y="238">种子 x 摧毁 y ⟺ y ≥ x 且 y ≡ x (mod s)</text>
    <text x="280" y="262">同组互达（方向对即可），跨组永远打不着</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="296" width="440" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a2f2b" text-anchor="middle">
    <text x="280" y="320">问题坍缩为：找最大的组，</text>
    <text x="280" y="344">答案 = 最大组内最小值（并列时取更小者）</text>
  </g>
</svg>
