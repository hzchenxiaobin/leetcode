<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">对角线两侧：topLeft 与 bottomRight</text>

  <rect x="64" y="84" width="52" height="52" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="116" y="84" width="52" height="52" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="168" y="84" width="52" height="52" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="220" y="84" width="52" height="52" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="64" y="136" width="52" height="52" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="116" y="136" width="52" height="52" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="168" y="136" width="52" height="52" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="220" y="136" width="52" height="52" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="64" y="188" width="52" height="52" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="116" y="188" width="52" height="52" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="168" y="188" width="52" height="52" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="220" y="188" width="52" height="52" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="64" y="240" width="52" height="52" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="116" y="240" width="52" height="52" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="168" y="240" width="52" height="52" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="220" y="240" width="52" height="52" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <path d="M 194 214 L 96 116" stroke="#b85450" stroke-width="2.2"
        stroke-dasharray="6 4" fill="none" stroke-linecap="round"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 194 214 L 240 258" stroke="#446688" stroke-width="2.2"
        fill="none" stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="90" y="116" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="142" y="116" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="194" y="116" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <text x="246" y="116" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <text x="90" y="168" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <text x="142" y="168" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="194" y="168" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">6</text>
  <text x="246" y="168" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="90" y="220" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">7</text>
  <text x="142" y="220" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">8</text>
  <text x="194" y="220" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">9</text>
  <text x="246" y="220" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <text x="90" y="272" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <text x="142" y="272" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <text x="194" y="272" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="246" y="272" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">7</text>

  <rect x="316" y="84" width="14" height="14" rx="3" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="96" font-size="12.5" fill="#b85450" filter="url(#rough2)">左上对角线 ⇒ topLeft</text>
  <rect x="316" y="112" width="14" height="14" rx="3" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="124" font-size="12.5" fill="#446688" filter="url(#rough2)">右下对角线 ⇒ bottomRight</text>
  <rect x="316" y="140" width="14" height="14" rx="3" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="152" font-size="12.5" fill="#333" filter="url(#rough2)">当前格 (2,2)，值 = 9</text>

  <text x="316" y="192" font-size="12.5" fill="#b85450" filter="url(#rough2)">topLeft：{5, 2} → 2 种</text>
  <text x="316" y="216" font-size="12.5" fill="#446688" filter="url(#rough2)">bottomRight：{7} → 1 种</text>

  <rect x="316" y="236" width="184" height="32" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="408" y="257" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">answer = |2 − 1| = 1</text>

  <text x="260" y="312" text-anchor="middle" font-size="13"
        fill="#4a7a3a" filter="url(#rough2)">同一条对角线 ⇔ r − c 为定值（本例 d = 0）</text>
  <text x="260" y="338" text-anchor="middle" font-size="12"
        fill="#888" filter="url(#rough2)">topLeft / bottomRight = 对角线上当前格的前缀 / 后缀</text>
</svg>
