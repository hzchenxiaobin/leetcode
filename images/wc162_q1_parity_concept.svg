<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 386" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="386" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：单元格只关心「行增量 + 列增量」的奇偶</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">不建矩阵，只维护每行、每列被加了多少次 → 取模 2 即异或</text>

  <rect x="24" y="64" width="512" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">a[i][j] = rowAdd[i] + colAdd[j]　⇒　奇 ⟺ rowParity[i] XOR colParity[j] = 1</text>

  <!-- 2x2 组合表 -->
  <rect x="100" y="118" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="140" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">行 ＼ 列</text>

  <rect x="250" y="118" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="325" y="140" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">列偶：n − C 列</text>

  <rect x="400" y="118" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="475" y="140" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">列奇：C 列</text>

  <rect x="100" y="152" width="150" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="176" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">行奇：R 行</text>
  <text x="175" y="194" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">rowParity 为 1</text>

  <rect x="250" y="152" width="150" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="175" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">奇数：R·(n−C)</text>
  <text x="325" y="194" text-anchor="middle" font-size="10" fill="#a0605c" filter="url(#rough2)">1 XOR 0 = 1</text>

  <rect x="400" y="152" width="150" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="475" y="175" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">偶数：R·C</text>
  <text x="475" y="194" text-anchor="middle" font-size="10" fill="#6a8a5a" filter="url(#rough2)">1 XOR 1 = 0</text>

  <rect x="100" y="206" width="150" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="230" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">行偶：m − R 行</text>
  <text x="175" y="248" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">rowParity 为 0</text>

  <rect x="250" y="206" width="150" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="325" y="229" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">偶数：(m−R)·(n−C)</text>
  <text x="325" y="248" text-anchor="middle" font-size="10" fill="#6a8a5a" filter="url(#rough2)">0 XOR 0 = 0</text>

  <rect x="400" y="206" width="150" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="229" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">奇数：(m−R)·C</text>
  <text x="475" y="248" text-anchor="middle" font-size="10" fill="#a0605c" filter="url(#rough2)">0 XOR 1 = 1</text>

  <path d="M 280 266 L 280 288" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="88" y="292" width="384" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">答案 = R·(n − C) + (m − R)·C</text>
  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#997a3a" filter="url(#rough2)">红格两块的计数之和，就是矩阵里所有奇数值单元格</text>

  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">R = 行 parity 为 1 的行数，C = 列 parity 为 1 的列数</text>
</svg>
