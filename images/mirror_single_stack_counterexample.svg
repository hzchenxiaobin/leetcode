<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="69" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">易错点：单栈括号匹配会「挡住」配对 —— 反例 s = "yabz"</text>

  <!-- match arcs -->
  <g fill="none" filter="url(#sk)">
    <path d="M 110 80 Q 230 32 350 80" stroke="#4a8e4a" stroke-width="2.2"/>
    <path d="M 230 80 Q 350 44 470 80" stroke="#4a8edb" stroke-width="2.2"/>
  </g>
  <text x="230" y="46" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">y↔b：+2</text>
  <text x="350" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">a↔z：+2</text>

  <!-- string cells -->
  <g filter="url(#sk)">
    <rect x="86" y="80" width="48" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="206" y="80" width="48" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="326" y="80" width="48" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="446" y="80" width="48" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="110" y="108">y</text>
    <text x="230" y="108">a</text>
    <text x="350" y="108">b</text>
    <text x="470" y="108">z</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="110" y="138">0</text>
    <text x="230" y="138">1</text>
    <text x="350" y="138">2</text>
    <text x="470" y="138">3</text>
  </g>

  <!-- correct vs wrong summary -->
  <g filter="url(#sk)">
    <rect x="40" y="156" width="282" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="181" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">按题意模拟：0↔2 得 2，1↔3 得 2</text>
  <text x="181" y="195" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">总分 4 ✓</text>

  <g filter="url(#sk)">
    <rect x="338" y="156" width="262" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="469" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a3a">单栈做法（下）：总分 0 ✗</text>
  <text x="469" y="195" text-anchor="middle" font-size="11" fill="#8a3a3a">y0 被 a1 挡住，永远配不上</text>

  <!-- wrong trace container -->
  <g filter="url(#sk)">
    <rect x="40" y="216" width="560" height="168" rx="10" fill="#fdf0f2" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a3a">✗ 单栈括号匹配的执行轨迹</text>
  <g font-size="11.5" fill="#444">
    <text x="64" y="266">i=0 'y'：栈空 → 压入 [ y0 ]</text>
    <text x="64" y="290">i=1 'a'：栈顶 y0 不是 'z' → 压入 [ y0, a1 ]</text>
    <text x="64" y="314">i=2 'b'：要找 'y'，栈顶却是 a1 → 只能压入 [ y0, a1, b2 ]   ← y0 被挡住！</text>
    <text x="64" y="338">i=3 'z'：要找 'a'，栈顶却是 b2 → 只能压入，总分 0</text>
    <text x="320" y="362" text-anchor="middle" font-weight="bold" fill="#8a3a3a">单栈只看得见「最近的未标记下标（不分字母）」，题目要「字母恰为镜像的最近下标」</text>
    <text x="320" y="380" text-anchor="middle" font-weight="bold" fill="#8a3a3a">→ 必须按字母分组：26 个栈（或哈希表 字母 → 栈）</text>
  </g>
</svg>
