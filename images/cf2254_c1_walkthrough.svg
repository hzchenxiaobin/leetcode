<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa" filter="url(#rough2)"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">官方样例走查：两个奇偶类的 1 的个数对上就 YES</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">c₀ = 偶数位（0、2、4、…）中 1 的个数；c₁ = 奇数位（1、3、5、…）中 1 的个数</text>

  <rect x="30" y="72" width="660" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">样例</text>
  <text x="180" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="315" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="452" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c₀(a), c₀(b)</text>
  <text x="572" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c₁(a), c₁(b)</text>
  <text x="660" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">结论</text>

  <rect x="30" y="110" width="660" height="46" rx="6" fill="#ffffff" stroke="#c8d6e5" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="139" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">#3</text>
  <text x="180" y="139" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">001</text>
  <text x="315" y="139" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">100</text>
  <text x="452" y="139" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1, 1</text>
  <text x="572" y="139" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0, 0</text>
  <text x="660" y="139" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">YES</text>

  <rect x="30" y="160" width="660" height="46" rx="6" fill="#f7fbff" stroke="#c8d6e5" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="189" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">#6</text>
  <text x="180" y="189" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">01001</text>
  <text x="315" y="189" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10010</text>
  <text x="452" y="189" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1, 1</text>
  <text x="572" y="189" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1, 1</text>
  <text x="660" y="189" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">YES</text>

  <rect x="30" y="210" width="660" height="46" rx="6" fill="#ffffff" stroke="#c8d6e5" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="239" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">#7</text>
  <text x="180" y="239" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">110000</text>
  <text x="315" y="239" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">000011</text>
  <text x="452" y="239" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1, 1</text>
  <text x="572" y="239" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1, 1</text>
  <text x="660" y="239" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">YES</text>

  <rect x="30" y="260" width="660" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="289" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">#8</text>
  <text x="180" y="289" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">111000</text>
  <text x="315" y="289" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">000111</text>
  <text x="452" y="289" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2, 1</text>
  <text x="572" y="289" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1, 2</text>
  <text x="660" y="289" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">NO</text>

  <rect x="30" y="310" width="660" height="46" rx="6" fill="#ffffff" stroke="#c8d6e5" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="339" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">#9</text>
  <text x="180" y="339" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1001100</text>
  <text x="315" y="339" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0000111</text>
  <text x="452" y="339" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2, 2</text>
  <text x="572" y="339" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1, 1</text>
  <text x="660" y="339" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">YES</text>

  <text x="360" y="386" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">#8 的 c₀ 是 2 → 1、c₁ 是 1 → 2：一个 1 永远跳不出自己的奇偶类，所以不可能</text>
  <text x="360" y="408" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">#2（01 → 10）也同理：c₀ 从 0 变 1、c₁ 从 1 变 0</text>
</svg>
