<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="392" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：nums = [3, 1, 3, 2]，答案 = 10</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" fill="#e8f0fe" stroke="#446688" stroke-width="1.4">
    <rect x="24" y="58" width="34" height="28"/>
    <rect x="58" y="58" width="38" height="28"/>
    <rect x="96" y="58" width="38" height="28"/>
    <rect x="134" y="58" width="38" height="28"/>
    <rect x="172" y="58" width="62" height="28"/>
    <rect x="234" y="58" width="62" height="28"/>
    <rect x="296" y="58" width="50" height="28"/>
    <rect x="346" y="58" width="270" height="28"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" font-weight="bold" fill="#446688" text-anchor="middle">
    <text x="41" y="76">k</text>
    <text x="77" y="76">值</text>
    <text x="115" y="76">L</text>
    <text x="153" y="76">R</text>
    <text x="203" y="76">左端点数</text>
    <text x="265" y="76">右端点数</text>
    <text x="321" y="76">贡献</text>
    <text x="481" y="76">归属的好子数组（最左最大值）</text>
  </g>

  <g filter="url(#rough2)" fill="#ffffff" stroke="#bbb" stroke-width="1.1">
    <rect x="24" y="86" width="34" height="32"/>
    <rect x="58" y="86" width="38" height="32"/>
    <rect x="96" y="86" width="38" height="32"/>
    <rect x="134" y="86" width="38" height="32"/>
    <rect x="172" y="86" width="62" height="32"/>
    <rect x="234" y="86" width="62" height="32"/>
    <rect x="296" y="86" width="50" height="32"/>
    <rect x="346" y="86" width="270" height="32"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#444" text-anchor="middle">
    <text x="41" y="106">0</text>
    <text x="77" y="106">3</text>
    <text x="115" y="106">−1</text>
    <text x="153" y="106">4</text>
    <text x="203" y="106">1</text>
    <text x="265" y="106">4</text>
    <text x="321" y="106" font-weight="bold" fill="#446688">4</text>
    <text x="481" y="106" font-size="10.5">[3] [3,1] [3,1,3] [3,1,3,2]</text>
  </g>

  <g filter="url(#rough2)" fill="#ffffff" stroke="#bbb" stroke-width="1.1">
    <rect x="24" y="118" width="34" height="32"/>
    <rect x="58" y="118" width="38" height="32"/>
    <rect x="96" y="118" width="38" height="32"/>
    <rect x="134" y="118" width="38" height="32"/>
    <rect x="172" y="118" width="62" height="32"/>
    <rect x="234" y="118" width="62" height="32"/>
    <rect x="296" y="118" width="50" height="32"/>
    <rect x="346" y="118" width="270" height="32"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#444" text-anchor="middle">
    <text x="41" y="138">1</text>
    <text x="77" y="138">1</text>
    <text x="115" y="138">0</text>
    <text x="153" y="138">2</text>
    <text x="203" y="138">1</text>
    <text x="265" y="138">1</text>
    <text x="321" y="138" font-weight="bold" fill="#446688">1</text>
    <text x="481" y="138" font-size="10.5">[1]</text>
  </g>

  <g filter="url(#rough2)" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4">
    <rect x="24" y="150" width="34" height="32"/>
    <rect x="58" y="150" width="38" height="32"/>
    <rect x="96" y="150" width="38" height="32"/>
    <rect x="134" y="150" width="38" height="32"/>
    <rect x="172" y="150" width="62" height="32"/>
    <rect x="234" y="150" width="62" height="32"/>
    <rect x="296" y="150" width="50" height="32"/>
    <rect x="346" y="150" width="270" height="32"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#444" text-anchor="middle">
    <text x="41" y="170">2</text>
    <text x="77" y="170" font-weight="bold" fill="#a06a10">3</text>
    <text x="115" y="170">0</text>
    <text x="153" y="170">4</text>
    <text x="203" y="170">2</text>
    <text x="265" y="170">2</text>
    <text x="321" y="170" font-weight="bold" fill="#a06a10">4</text>
    <text x="481" y="170" font-size="10.5">[3] [3,2] [1,3] [1,3,2]</text>
  </g>

  <g filter="url(#rough2)" fill="#ffffff" stroke="#bbb" stroke-width="1.1">
    <rect x="24" y="182" width="34" height="32"/>
    <rect x="58" y="182" width="38" height="32"/>
    <rect x="96" y="182" width="38" height="32"/>
    <rect x="134" y="182" width="38" height="32"/>
    <rect x="172" y="182" width="62" height="32"/>
    <rect x="234" y="182" width="62" height="32"/>
    <rect x="296" y="182" width="50" height="32"/>
    <rect x="346" y="182" width="270" height="32"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#444" text-anchor="middle">
    <text x="41" y="202">3</text>
    <text x="77" y="202">2</text>
    <text x="115" y="202">2</text>
    <text x="153" y="202">4</text>
    <text x="203" y="202">1</text>
    <text x="265" y="202">1</text>
    <text x="321" y="202" font-weight="bold" fill="#446688">1</text>
    <text x="481" y="202" font-size="10.5">[2]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="214" width="592" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">合计 = 4 + 1 + 4 + 1 = 10，与暴力枚举一致 ✓</text>

  <g filter="url(#rough2)">
    <rect x="24" y="262" width="592" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="320" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#rough2)">去重视角：最大值 3 出现在下标 0 和 2</text>
  <text x="320" y="310" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">[3,1,3] 与 [3,1,3,2] 同时被两个 3 支配，只归给下标 0（左侧「相等」即阻断）</text>
  <text x="320" y="332" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">k=2 只接管左端点 ≥ 1 的子数组；两行各自的 [3] 是不同位置的单元素子数组</text>
  <text x="320" y="356" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">全部 10 个子数组都是好子数组：任何一段的 OR 都等于 3 = max</text>
</svg>
