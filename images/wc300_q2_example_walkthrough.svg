<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：3×5 矩阵的螺旋填充（示例 1）</text>

  <!-- linked list nodes: 13 values -->
  <text x="60" y="50" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">head（13 个节点 = 第 1..13 个填入值）→</text>

  <g filter="url(#rough2)">
    <rect x="60" y="58" width="33" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="76.5" y="77" text-anchor="middle" font-size="11" fill="#333">3</text>
    <rect x="97" y="58" width="33" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="113.5" y="77" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="134" y="58" width="33" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="150.5" y="77" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="171" y="58" width="33" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="187.5" y="77" text-anchor="middle" font-size="11" fill="#333">6</text>
    <rect x="208" y="58" width="33" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="224.5" y="77" text-anchor="middle" font-size="11" fill="#333">8</text>
    <rect x="245" y="58" width="33" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="261.5" y="77" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="282" y="58" width="33" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="298.5" y="77" text-anchor="middle" font-size="11" fill="#333">7</text>
    <rect x="319" y="58" width="33" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="335.5" y="77" text-anchor="middle" font-size="11" fill="#333">9</text>
    <rect x="356" y="58" width="33" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="372.5" y="77" text-anchor="middle" font-size="11" fill="#333">4</text>
    <rect x="393" y="58" width="33" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="409.5" y="77" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="430" y="58" width="33" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="446.5" y="77" text-anchor="middle" font-size="11" fill="#333">5</text>
    <rect x="467" y="58" width="33" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="483.5" y="77" text-anchor="middle" font-size="11" fill="#333">5</text>
    <rect x="504" y="58" width="33" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="520.5" y="77" text-anchor="middle" font-size="11" fill="#a08030" font-weight="bold">0</text>
  </g>

  <!-- 3x5 grid -->
  <g filter="url(#rough2)">
    <!-- row 0 -->
    <rect x="130" y="120" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="136" y="133" font-size="9.5" fill="#888">#1</text>
    <text x="160" y="151" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
    <rect x="192" y="120" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="198" y="133" font-size="9.5" fill="#888">#2</text>
    <text x="222" y="151" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
    <rect x="254" y="120" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="260" y="133" font-size="9.5" fill="#888">#3</text>
    <text x="284" y="151" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
    <rect x="316" y="120" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="322" y="133" font-size="9.5" fill="#888">#4</text>
    <text x="346" y="151" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>
    <rect x="378" y="120" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="384" y="133" font-size="9.5" fill="#888">#5</text>
    <text x="408" y="151" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">8</text>

    <!-- row 1 -->
    <rect x="130" y="168" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="136" y="181" font-size="9.5" fill="#888">#12</text>
    <text x="160" y="199" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
    <rect x="192" y="168" width="60" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="198" y="181" font-size="9.5" fill="#a08030">#13</text>
    <text x="222" y="199" text-anchor="middle" font-size="15" fill="#a08030" font-weight="bold">0</text>
    <rect x="254" y="168" width="60" height="46" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5 3" rx="4"/>
    <text x="284" y="199" text-anchor="middle" font-size="15" fill="#999">−1</text>
    <rect x="316" y="168" width="60" height="46" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5 3" rx="4"/>
    <text x="346" y="199" text-anchor="middle" font-size="15" fill="#999">−1</text>
    <rect x="378" y="168" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="384" y="181" font-size="9.5" fill="#888">#6</text>
    <text x="408" y="199" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

    <!-- row 2 -->
    <rect x="130" y="216" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="136" y="229" font-size="9.5" fill="#888">#11</text>
    <text x="160" y="247" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
    <rect x="192" y="216" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="198" y="229" font-size="9.5" fill="#888">#10</text>
    <text x="222" y="247" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
    <rect x="254" y="216" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="260" y="229" font-size="9.5" fill="#888">#9</text>
    <text x="284" y="247" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
    <rect x="316" y="216" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="322" y="229" font-size="9.5" fill="#888">#8</text>
    <text x="346" y="247" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">9</text>
    <rect x="378" y="216" width="60" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="384" y="229" font-size="9.5" fill="#888">#7</text>
    <text x="408" y="247" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">7</text>
  </g>

  <!-- turn badges -->
  <g filter="url(#rough2)">
    <rect x="444" y="140" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="472" y="157" text-anchor="middle" font-size="11" fill="#a08030" font-weight="bold">转 ↓</text>
    <rect x="382" y="270" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="410" y="287" text-anchor="middle" font-size="11" fill="#a08030" font-weight="bold">转 ←</text>
    <rect x="134" y="270" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="162" y="287" text-anchor="middle" font-size="11" fill="#a08030" font-weight="bold">转 ↑</text>
    <rect x="58" y="174" width="64" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="90" y="190" text-anchor="middle" font-size="11" fill="#a08030" font-weight="bold">转 →</text>
    <text x="90" y="206" text-anchor="middle" font-size="10" fill="#a08030">入内层</text>
  </g>

  <!-- arrows from badges to turn points -->
  <path d="M 444 152 Q 440 160 440 166" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 270 Q 409 266 408 262" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 162 270 Q 161 266 160 262" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 122 194 Q 126 194 128 194" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="130" y="318" width="330" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="295" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">#i：第 i 个填入的节点值（i = 1..13，橙色为链表末节点）</text>
  <text x="295" y="362" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">灰色 −1：链表耗尽后未被访问，保持初始占位</text>

  <text x="280" y="410" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">结果 = [[3,0,2,6,8],[5,0,−1,−1,1],[5,2,4,9,7]]</text>
</svg>
