<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：s = "dart", k = 3（r = 3 mod 4 = 3）</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table -->
  <g filter="url(#sk)">
    <rect x="60" y="70" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="120" y="70" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="220" y="70" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="360" y="70" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="470" y="70" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="90" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a88">i</text>
  <text x="170" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a88">i + k</text>
  <text x="290" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a88">(i+k) mod 4</text>
  <text x="415" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a88">取到的字符</text>
  <text x="525" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a88">res 累积</text>

  <!-- data rows -->
  <g filter="url(#sk)">
    <rect x="60" y="102" width="60" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="120" y="102" width="100" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="220" y="102" width="140" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="360" y="102" width="110" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="470" y="102" width="110" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
  </g>
  <text x="90" y="126" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="170" y="126" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="290" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">3</text>
  <text x="415" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">'t'</text>
  <text x="525" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">"t"</text>

  <g filter="url(#sk)">
    <rect x="60" y="140" width="60" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="120" y="140" width="100" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="220" y="140" width="140" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="360" y="140" width="110" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="470" y="140" width="110" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
  </g>
  <text x="90" y="164" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="170" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">4 ≥ n</text>
  <text x="290" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">0 ↩ 绕回</text>
  <text x="415" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">'d'</text>
  <text x="525" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">"td"</text>

  <g filter="url(#sk)">
    <rect x="60" y="178" width="60" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="120" y="178" width="100" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="220" y="178" width="140" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="360" y="178" width="110" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="470" y="178" width="110" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
  </g>
  <text x="90" y="202" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="170" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">5 ≥ n</text>
  <text x="290" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">1 ↩ 绕回</text>
  <text x="415" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">'a'</text>
  <text x="525" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">"tda"</text>

  <g filter="url(#sk)">
    <rect x="60" y="216" width="60" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="120" y="216" width="100" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="220" y="216" width="140" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="360" y="216" width="110" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="470" y="216" width="110" height="38" fill="#ffffff" stroke="#999" stroke-width="1"/>
  </g>
  <text x="90" y="240" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="170" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">6 ≥ n</text>
  <text x="290" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">2 ↩ 绕回</text>
  <text x="415" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">'r'</text>
  <text x="525" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">"tdar"</text>

  <!-- result bar -->
  <g filter="url(#sk)">
    <rect x="60" y="272" width="520" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="320" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">res = "tdar"：每个字符都换成它往后第 3 个</text>

  <!-- left: slice view -->
  <g filter="url(#sk)">
    <rect x="40" y="326" width="280" height="112" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="180" y="348" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">切片视角（等价写法）</text>
  <text x="180" y="370" text-anchor="middle" font-size="12" fill="#2e6e2e">k mod 4 = 3，整体左旋 3 位</text>
  <text x="180" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">s[3:] + s[:3]</text>
  <text x="180" y="414" text-anchor="middle" font-size="12" fill="#2e6e2e">= "t" + "dar" = "tdar" ✓</text>

  <!-- right: pitfall -->
  <g filter="url(#sk)">
    <rect x="340" y="326" width="260" height="112" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="470" y="348" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">坑：切片前必须先取模</text>
  <text x="470" y="369" text-anchor="middle" font-size="11.5" fill="#b85450">k = 5 时直接 s[5:] + s[:5]</text>
  <text x="470" y="388" text-anchor="middle" font-size="11.5" fill="#b85450">= "" + "dart" = "dart" ✗</text>
  <text x="470" y="411" text-anchor="middle" font-size="11.5" fill="#b85450">先 k %= 4 → s[1:]+s[:1] = "artd" ✓</text>
</svg>
