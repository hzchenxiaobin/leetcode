<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：s = "011101" 的 5 个分割点</text>
  <text x="280" y="54" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">初始 score = 1 + 4 = 5，此后每搬一个字符得分 ±1</text>

  <rect x="45" y="70" width="470" height="200" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="45" y="70" width="470" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="105" y1="70" x2="105" y2="270" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="215" y1="70" x2="215" y2="270" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="275" y1="70" x2="275" y2="270" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="385" y1="70" x2="385" y2="270" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="445" y1="70" x2="445" y2="270" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="75" y="89" text-anchor="middle" font-size="12" fill="#2a4660" filter="url(#rough2)">分割点 i</text>
  <text x="160" y="89" text-anchor="middle" font-size="12" fill="#2a4660" filter="url(#rough2)">左子串</text>
  <text x="245" y="89" text-anchor="middle" font-size="12" fill="#2a4660" filter="url(#rough2)">左 0 数</text>
  <text x="330" y="89" text-anchor="middle" font-size="12" fill="#2a4660" filter="url(#rough2)">右子串</text>
  <text x="415" y="89" text-anchor="middle" font-size="12" fill="#2a4660" filter="url(#rough2)">右 1 数</text>
  <text x="480" y="89" text-anchor="middle" font-size="12" fill="#2a4660" filter="url(#rough2)">score</text>

  <rect x="46" y="100" width="468" height="34" fill="#e6f4ea" filter="url(#rough2)"/>
  <line x1="45" y1="134" x2="515" y2="134" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"0"</text>
  <text x="245" y="122" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="330" y="122" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"11101"</text>
  <text x="415" y="122" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">4</text>
  <text x="480" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5 ★</text>
  <text x="530" y="139" font-size="12" fill="#b85450" filter="url(#rough2)">−1</text>

  <line x1="45" y1="168" x2="515" y2="168" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"01"</text>
  <text x="245" y="156" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="330" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"1101"</text>
  <text x="415" y="156" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="480" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="530" y="173" font-size="12" fill="#b85450" filter="url(#rough2)">−1</text>

  <line x1="45" y1="202" x2="515" y2="202" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="160" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"011"</text>
  <text x="245" y="190" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="330" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"101"</text>
  <text x="415" y="190" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="480" y="190" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="530" y="207" font-size="12" fill="#b85450" filter="url(#rough2)">−1</text>

  <line x1="45" y1="236" x2="515" y2="236" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="160" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"0111"</text>
  <text x="245" y="224" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="330" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"01"</text>
  <text x="415" y="224" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="480" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="530" y="241" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+1</text>

  <text x="75" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="160" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"01110"</text>
  <text x="245" y="258" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="330" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"1"</text>
  <text x="415" y="258" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="480" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <text x="536" y="100" font-size="11" fill="#888" filter="url(#rough2)" transform="rotate(90 536 100)">增量</text>

  <rect x="80" y="296" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 5：分割点 i = 1，左 "0" + 右 "11101"</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#5a8a4a" filter="url(#rough2)">一次遍历即可比较全部 5 个分割点，无需反复重新数数</text>

  <text x="280" y="376" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">增量序列：5 → 4 → 3 → 2 → 3，每步 ±1 完全由搬家的字符 s[i] 决定</text>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（'0' 搬家 +1，'1' 搬家 −1）</text>
</svg>
