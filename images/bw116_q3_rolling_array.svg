<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="75"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">从暴力到一维：dp[i][s] 压成一维滚动数组，倒序枚举 s 防重复选取</text>

  <!-- 暴力树 -->
  <g filter="url(#rough2)">
    <text x="90" y="62" font-size="12.5" fill="#446688">暴力：对每个 x 分「不选 / 选」两叉 → 2ⁿ</text>

    <rect x="86" y="76" width="40" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="106" y="94" text-anchor="middle" font-size="11" fill="#333">x₁</text>
    <rect x="42" y="126" width="36" height="24" rx="4" fill="#ffffff" stroke="#bbb"/>
    <text x="60" y="142" text-anchor="middle" font-size="10.5" fill="#888">不选</text>
    <rect x="134" y="126" width="36" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="152" y="142" text-anchor="middle" font-size="10.5" fill="#888">选</text>
    <path d="M 96 102 C 80 112, 68 116, 62 122" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)"/>
    <path d="M 116 102 C 132 112, 144 116, 148 122" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)"/>

    <rect x="42" y="164" width="36" height="24" rx="4" fill="#ffffff" stroke="#bbb"/>
    <text x="60" y="180" text-anchor="middle" font-size="10.5" fill="#888">不选</text>
    <rect x="134" y="164" width="36" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="152" y="180" text-anchor="middle" font-size="10.5" fill="#888">选</text>
    <rect x="176" y="164" width="36" height="24" rx="4" fill="#ffffff" stroke="#bbb"/>
    <text x="194" y="180" text-anchor="middle" font-size="10.5" fill="#888">不选</text>
    <rect x="220" y="164" width="36" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="238" y="180" text-anchor="middle" font-size="10.5" fill="#888">选</text>
    <path d="M 60 150 L 60 160" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)"/>
    <path d="M 152 150 L 152 160" fill="none" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)"/>

    <text x="90" y="216" font-size="11.5" fill="#888">同一「和」的分支只需留最长 → 状态 (i, s)</text>
    <text x="90" y="238" font-size="11.5" fill="#888">n·target ≤ 10⁶，可行</text>
  </g>

  <!-- 右：二维到一维 -->
  <g filter="url(#rough2)">
    <rect x="300" y="56" width="184" height="192" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="392" y="82" text-anchor="middle" font-size="13" fill="#446688">降维关键</text>
    <text x="316" y="110" font-size="12" fill="#555">dp[i][s] 只依赖</text>
    <text x="316" y="130" font-size="12" fill="#555">dp[i−1][s] 与</text>
    <text x="316" y="150" font-size="12" fill="#555">dp[i−1][s−x]</text>
    <text x="316" y="178" font-size="12" fill="#b85450">倒序枚举 s：</text>
    <text x="316" y="198" font-size="12" fill="#555">先算大 s，再用小 s，</text>
    <text x="316" y="218" font-size="12" fill="#555">一个数组复用两层，</text>
    <text x="316" y="238" font-size="12" fill="#555">保证每个 x 只选一次</text>
  </g>

  <!-- 底 -->
  <g filter="url(#rough2)">
    <rect x="40" y="272" width="460" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="58" y="298" font-size="13" fill="#4a7a3a">「−1 表不可达」+「max 取长度」两件事别混：转移前必须检查 dp[s−x] ≥ 0</text>
    <text x="58" y="324" font-size="12" fill="#888">时间 O(n·target) = 10⁶，空间 O(target) = 10³</text>
  </g>
</svg>
