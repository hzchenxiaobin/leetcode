<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">示例演算：f("12")，min_sum = 1，max_sum = 8</text>

  <!-- 根节点 -->
  <rect x="190" y="42" width="180" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">pos=0, sum=0, 贴界</text>

  <!-- 分支边 -->
  <path d="M 240,74 C 200,96 172,108 152,134" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320,74 C 360,96 388,108 408,134" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="106" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">d=0（前导零）</text>
  <text x="384" y="106" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">d=1（= s[0]，贴界）</text>

  <!-- 左子节点 -->
  <rect x="80" y="138" width="145" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="152" y="159" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">pos=1, sum=0, 自由</text>

  <!-- 右子节点 -->
  <rect x="345" y="138" width="145" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="417" y="159" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">pos=1, sum=1, 贴界</text>

  <!-- 左侧叶子 -->
  <path d="M 130,170 C 120,182 110,186 100,190" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 152,170 L 152,190" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 174,170 C 184,182 194,186 204,190" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="24" y="194" width="256" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d=0 → "00" → x=0：sum=0 &lt; 1 ✗</text>

  <rect x="24" y="232" width="256" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="152" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d=1..8 → 一位数 1~8：sum=1..8 ✓ 共 8 个</text>

  <rect x="24" y="270" width="256" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d=9 → sum=9 &gt; 8：整条分支剪掉 ✗</text>

  <!-- 右侧叶子 -->
  <path d="M 395,170 C 385,182 375,186 365,190" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 417,170 L 417,190" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 439,170 C 449,182 459,186 469,190" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="194" width="236" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="418" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d=0 → x=10：sum=1 ✓（up=2）</text>

  <rect x="300" y="232" width="236" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="418" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d=1 → x=11：sum=2 ✓</text>

  <rect x="300" y="270" width="236" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="418" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d=2 → x=12：sum=3 ✓（贴界收尾）</text>

  <!-- 汇总 -->
  <text x="280" y="334" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">左支 8 个 + 右支 3 个 → f("12") = 11</text>

  <path d="M 280,344 L 280,362" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="368" width="380" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="389" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">num1="1" → num1−1="0"，f("0")=0（唯一路径 sum=0 &lt; 1）</text>

  <text x="280" y="432" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = f("12") − f("0") = 11 − 0 = 11 ✓</text>
</svg>
