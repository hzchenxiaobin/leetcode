<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：c 从左到右推进，每轮先查后建</text>
  <path d="M 150 38 Q 340 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start pill -->
  <g filter="url(#sk)">
    <rect x="130" y="58" width="180" height="38" rx="18" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="220" y="82" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">cnt ← {}，ans ← 0</text>

  <g filter="url(#sk)">
    <path d="M 220 96 L 220 118" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- loop box -->
  <g filter="url(#sk)">
    <rect x="120" y="122" width="200" height="42" rx="6" fill="#fffdf5" stroke="#a06a10" stroke-width="2"/>
  </g>
  <text x="220" y="148" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a06a10" filter="url(#sk)">for c = 0 … n−1</text>

  <g filter="url(#sk)">
    <path d="M 220 164 L 220 184" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- query box -->
  <g filter="url(#sk)">
    <rect x="50" y="188" width="340" height="66" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="220" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 查（右半 (c,d)）</text>
  <text x="220" y="230" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">for d = c+1 … n−1:</text>
  <text x="220" y="248" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">ans += cnt[nums[d] − nums[c]]</text>

  <g filter="url(#sk)">
    <path d="M 220 254 L 220 274" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- build box -->
  <g filter="url(#sk)">
    <rect x="50" y="278" width="340" height="66" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="220" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 建（左半以 c 结尾的对）</text>
  <text x="220" y="320" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">for a = 0 … c−1:</text>
  <text x="220" y="338" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">cnt[nums[a] + nums[c]] += 1</text>

  <!-- loop back edge -->
  <g filter="url(#sk)">
    <path d="M 390 311 L 436 311 L 436 143 L 326 143" stroke="#a06a10" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  </g>
  <text x="446" y="132" font-size="11" fill="#a06a10" filter="url(#sk)">下一轮 c</text>

  <!-- output arrow -->
  <g filter="url(#sk)">
    <path d="M 220 344 L 220 366" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="232" y="360" font-size="10.5" fill="#999" filter="url(#sk)">c = n 扫完</text>

  <!-- output pill -->
  <g filter="url(#sk)">
    <rect x="130" y="370" width="180" height="38" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="220" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 ans</text>

  <!-- warning box -->
  <g filter="url(#sk)">
    <rect x="470" y="188" width="190" height="156" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="565" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">⚠ 顺序不能反</text>
  <text x="482" y="234" font-size="11" fill="#444" filter="url(#sk)">必须先查后建：</text>
  <text x="482" y="252" font-size="11" fill="#444" filter="url(#sk)">查询时 cnt 只含</text>
  <text x="482" y="270" font-size="11" fill="#444" filter="url(#sk)">b &lt; c 的 (a,b) 对；</text>
  <text x="482" y="288" font-size="11" fill="#444" filter="url(#sk)">若先建后查，会混入</text>
  <text x="482" y="306" font-size="11" fill="#444" filter="url(#sk)">b = c 的非法对，</text>
  <text x="482" y="324" font-size="11" fill="#444" filter="url(#sk)">多算不存在的四元组</text>

  <text x="340" y="448" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">每轮「查 + 建」合计 O(n)，总时间 O(n²)；n = 50 时仅约 2500 步</text>
</svg>
