<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：「从第 i 条开始」= 重开一局，出发永远是 startPos</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 3x3 网格 -->
  <text x="82" y="70" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="134" y="70" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="186" y="70" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="48" y="106" text-anchor="end" font-size="10" fill="#888">0</text>
  <text x="48" y="158" text-anchor="end" font-size="10" fill="#888">1</text>
  <text x="48" y="210" text-anchor="end" font-size="10" fill="#888">2</text>
  <g filter="url(#sk)">
    <rect x="56" y="76" width="52" height="52" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="160" y="76" width="52" height="52" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="56" y="128" width="52" height="52" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="108" y="128" width="52" height="52" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="160" y="128" width="52" height="52" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="56" y="180" width="52" height="52" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="108" y="180" width="52" height="52" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="160" y="180" width="52" height="52" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="108" y="76" width="52" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="134" cy="102" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <circle cx="130" cy="99" r="1.7" fill="#446688"/>
  <circle cx="138" cy="99" r="1.7" fill="#446688"/>
  <path d="M 129 107 Q 134 110 139 107" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="134" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#c09028">startPos = (0, 1)</text>
  <text x="134" y="268" text-anchor="middle" font-size="10" fill="#888">n = 3 网格（示例 1）</text>

  <!-- 指令 chips：前 i 条跳过，从 s[i] 直接开始 -->
  <path d="M 150 98 Q 245 58 372 94" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="276" y="118" text-anchor="end" font-size="12" font-weight="bold" fill="#333">s =</text>
  <g filter="url(#sk)">
    <rect x="292" y="96" width="40" height="34" rx="6" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="337" y="96" width="40" height="34" rx="6" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
    <path d="M 298 122 L 326 104" stroke="#b85450" stroke-width="1.4" fill="none"/>
    <path d="M 343 122 L 371 104" stroke="#b85450" stroke-width="1.4" fill="none"/>
  </g>
  <text x="312" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#999">R</text>
  <text x="357" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#999">R</text>
  <text x="334" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#999">前 i 条整段跳过</text>
  <g filter="url(#sk)">
    <rect x="382" y="96" width="40" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="427" y="96" width="40" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="472" y="96" width="40" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="517" y="96" width="40" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <path d="M 382 138 L 382 146 L 557 146 L 557 138" stroke="#446688" stroke-width="1.6" fill="none"/>
  </g>
  <text x="402" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">D</text>
  <text x="447" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">D</text>
  <text x="492" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">L</text>
  <text x="537" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">U</text>
  <text x="469" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">实际执行 s[i..]（以 i = 2 为例）</text>

  <!-- 误读 vs 正解 -->
  <g filter="url(#sk)">
    <rect x="288" y="186" width="304" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="440" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">❌ 误读：机器人先执行 s[0..i−1] 走到某个位置</text>
  <text x="440" y="223" text-anchor="middle" font-size="11" fill="#b85450">再从那个位置继续执行 s[i..]</text>
  <g filter="url(#sk)">
    <rect x="288" y="242" width="304" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="440" y="262" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">✅ 正解：无论 i 取几，出发位置都是 startPos</text>
  <text x="440" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a">直接执行 s[i..]，各后缀轨迹互不共享</text>

  <!-- 底部结论 -->
  <g filter="url(#sk)">
    <rect x="24" y="300" width="592" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#c09028">推论：各后缀只能逐个独立模拟，O(m²)</text>
  <text x="320" y="336" text-anchor="middle" font-size="11" fill="#333">m ≤ 500 → 至多 m(m+1)/2 ≈ 1.25×10⁵ 步，稳过</text>
</svg>
