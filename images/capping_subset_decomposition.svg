<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="331" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：cap = x 的数组 = 值 &lt; x 的部分 + c 个 x</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="16" y="88" font-size="12" fill="#666">① 排序后（以 x = 3 为例）</text>
  <g filter="url(#sk)">
    <rect x="170" y="68" width="58" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="234" y="68" width="58" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="298" y="68" width="58" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="362" y="68" width="58" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="199" y="90" fill="#2b6e9e">2</text>
    <text x="263" y="90" fill="#8a3a36">3</text>
    <text x="327" y="90" fill="#8a3a36">4</text>
    <text x="391" y="90" fill="#8a3a36">4</text>
  </g>
  <text x="199" y="120" text-anchor="middle" font-size="11" fill="#2b6e9e">值 &lt; 3：保持原值</text>
  <text x="327" y="120" text-anchor="middle" font-size="11" fill="#8a3a36">值 ≥ 3：封顶为 x</text>

  <path d="M 295 128 L 295 148" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="308" y="142" font-size="11.5" fill="#666">每个元素替换为 min(aᵢ, x)</text>

  <text x="16" y="178" font-size="12" fill="#666">② cap = 3 后的数组</text>
  <g filter="url(#sk)">
    <rect x="170" y="158" width="58" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="234" y="158" width="58" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="298" y="158" width="58" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="362" y="158" width="58" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="199" y="180" fill="#2b6e9e">2</text>
    <text x="263" y="180" fill="#7a5415">3</text>
    <text x="327" y="180" fill="#7a5415">3</text>
    <text x="391" y="180" fill="#7a5415">3</text>
  </g>
  <text x="452" y="180" font-size="11" fill="#7a5415">c = 3 个副本</text>

  <path d="M 199 200 L 199 218" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 327 200 L 327 218" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="222" width="250" height="66" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="330" y="222" width="250" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="185" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">小数部分 {2}</text>
  <text x="185" y="272" text-anchor="middle" font-size="11.5" fill="#2b6e9e">子集和集合 S = {0, 2}</text>
  <text x="455" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">副本部分：3 个 x</text>
  <text x="455" y="272" text-anchor="middle" font-size="11.5" fill="#7a5415">选 j 个 ⇒ 贡献 j · x</text>
  <text x="310" y="260" text-anchor="middle" font-size="20" font-weight="bold" fill="#3a3a3a">＋</text>

  <path d="M 310 294 L 310 312" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="105" y="316" width="430" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="339" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">子序列和 = s + j·x，其中 s ∈ S，0 ≤ j ≤ c</text>

  <text x="320" y="380" text-anchor="middle" font-size="12" fill="#666">x 增大 ⇒ 小数部分只会扩张（双指针），每个元素只进背包一次</text>
</svg>
