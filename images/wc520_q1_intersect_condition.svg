<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">闭区间相交 ⇔ max(左端点) ≤ min(右端点)</text>

  <!-- 情况一：重叠相交 -->
  <text x="16" y="82" font-size="14" fill="#446688" filter="url(#rough2)">① 重叠相交</text>
  <text x="92" y="84" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">A=[1,5]</text>
  <rect x="100" y="70" width="240" height="16" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="106" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="340" y="106" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">5</text>
  <text x="212" y="132" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">B=[3,7]</text>
  <rect x="220" y="118" width="240" height="16" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="154" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
  <text x="460" y="154" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">7</text>
  <rect x="214" y="62" width="132" height="80" rx="6" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">交集 [3,5] 非空</text>
  <text x="280" y="200" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">max(1,3)=3 ≤ min(5,7)=5 → 相交 ✓</text>

  <!-- 情况二：仅共享一个端点 -->
  <text x="16" y="230" font-size="14" fill="#446688" filter="url(#rough2)">② 仅共享端点</text>
  <text x="130" y="224" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">A=[1,2]</text>
  <rect x="100" y="232" width="80" height="16" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="224" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">B=[2,3]</text>
  <rect x="180" y="232" width="80" height="16" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="180" cy="240" r="6" fill="#b85450" stroke="#8b3a36" stroke-width="1" filter="url(#rough2)"/>
  <path d="M190,246 L298,262" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="268" font-size="12" fill="#b85450" filter="url(#rough2)">公共点 2</text>
  <text x="100" y="266" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="180" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="260" y="266" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
  <text x="280" y="298" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">max(1,2)=2 ≤ min(2,3)=2 → 相交 ✓（等号也算！）</text>

  <!-- 情况三：完全分离 -->
  <text x="16" y="350" font-size="14" fill="#446688" filter="url(#rough2)">③ 完全分离</text>
  <text x="135" y="344" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">A=[1,2]</text>
  <rect x="100" y="352" width="70" height="16" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345" y="344" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">B=[4,5]</text>
  <rect x="310" y="352" width="70" height="16" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="344" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">空隙</text>
  <path d="M178,360 L300,360" stroke="#999" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="388" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="170" y="388" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="310" y="388" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>
  <text x="380" y="388" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">5</text>
  <text x="280" y="418" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">max(1,4)=4 &gt; min(2,5)=2 → 不相交 ✗</text>
</svg>
