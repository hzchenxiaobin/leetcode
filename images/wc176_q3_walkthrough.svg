<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：events = [[1,2], [2,3], [3,4], [1,2]]</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每天固定顺序：入池 → 清过期 → 取最小 end 参加 → day += 1</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="30" y="60" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="60" y="79" text-anchor="middle" fill="#3a4a66">天</text>
    <text x="145" y="79" text-anchor="middle" fill="#3a4a66">今日入池的 end</text>
    <text x="270" y="79" text-anchor="middle" fill="#3a4a66">堆内容（取前，升序）</text>
    <text x="390" y="79" text-anchor="middle" fill="#3a4a66">今日参加</text>
    <text x="487" y="79" text-anchor="middle" fill="#3a4a66">累计 ans</text>
  </g>

  <!-- 第 1 天 -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="30" y="88" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="60" y="109" text-anchor="middle" fill="#8a6a20">1</text>
    <rect x="90" y="88" width="110" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
    <text x="145" y="109" text-anchor="middle" fill="#555">2, 2</text>
    <rect x="200" y="88" width="140" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
    <text x="270" y="109" text-anchor="middle" fill="#555">{2, 2}</text>
    <rect x="340" y="88" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="390" y="109" text-anchor="middle" fill="#3a5a30">取 2</text>
    <rect x="440" y="88" width="90" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
    <text x="485" y="109" text-anchor="middle" fill="#555">1</text>
  </g>

  <!-- 第 2 天 -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="30" y="122" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="60" y="143" text-anchor="middle" fill="#8a6a20">2</text>
    <rect x="90" y="122" width="110" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
    <text x="145" y="143" text-anchor="middle" fill="#555">3</text>
    <rect x="200" y="122" width="140" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
    <text x="270" y="143" text-anchor="middle" fill="#555">{2, 3}</text>
    <rect x="340" y="122" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="390" y="143" text-anchor="middle" fill="#3a5a30">取 2</text>
    <rect x="440" y="122" width="90" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
    <text x="485" y="143" text-anchor="middle" fill="#555">2</text>
  </g>

  <!-- 第 3 天 -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="30" y="156" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="60" y="177" text-anchor="middle" fill="#8a6a20">3</text>
    <rect x="90" y="156" width="110" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
    <text x="145" y="177" text-anchor="middle" fill="#555">4</text>
    <rect x="200" y="156" width="140" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
    <text x="270" y="177" text-anchor="middle" fill="#555">{3, 4}</text>
    <rect x="340" y="156" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="390" y="177" text-anchor="middle" fill="#3a5a30">取 3</text>
    <rect x="440" y="156" width="90" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
    <text x="485" y="177" text-anchor="middle" fill="#555">3</text>
  </g>

  <!-- 第 4 天 -->
  <g filter="url(#rough2)" font-size="10">
    <rect x="30" y="190" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="60" y="211" text-anchor="middle" fill="#8a6a20">4</text>
    <rect x="90" y="190" width="110" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
    <text x="145" y="211" text-anchor="middle" fill="#777">—</text>
    <rect x="200" y="190" width="140" height="34" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="4"/>
    <text x="270" y="211" text-anchor="middle" fill="#555">{4}</text>
    <rect x="340" y="190" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="390" y="211" text-anchor="middle" fill="#3a5a30">取 4</text>
    <rect x="440" y="190" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="485" y="211" text-anchor="middle" fill="#3a5a30">4</text>
  </g>

  <path d="M 280 232 L 280 244" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 关键读表说明 -->
  <rect x="30" y="244" width="500" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g font-size="10" fill="#5a4a20" filter="url(#rough2)">
    <text x="46" y="266">第 1 天：A、D 同时开始，两者的 end 都是 2，随便取一个 ⇒ 堆里还剩一个 end=2。</text>
    <text x="46" y="286">第 2 天：B 入池（end=3），堆顶仍是 2，先消费掉它，避免到期浪费。</text>
    <text x="46" y="306">第 4 天：没有新会议，堆里仅剩 C 的 end=4，正好今天参加。</text>
  </g>

  <rect x="30" y="330" width="500" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#3a5a30" filter="url(#rough2)">
    <text x="46" y="352">结果 ans = 4 = 会议总数，已经取到上界，故必然最优。</text>
    <text x="46" y="372">注意：本例没有“过期弹出”，但 end &lt; 当天 的会议必须立即丢弃。</text>
  </g>
</svg>
