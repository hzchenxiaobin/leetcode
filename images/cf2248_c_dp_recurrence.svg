<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态转移：每个位置只有两种铺法</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">dp[i] = 用砖块恰好铺满前 i 个位置所能拿到的最大得分</text>
  <text x="205" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">p</text>  <text x="405" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>  <rect x="183" y="70" width="44" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="97" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="233" y="70" width="44" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="97" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="283" y="70" width="44" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="305" y="97" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="333" y="70" width="44" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="355" y="97" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <rect x="383" y="70" width="44" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="405" y="97" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="433" y="70" width="44" height="42" rx="6" fill="#f2f2f2" stroke="#8c8c8c" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="97" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="483" y="70" width="44" height="42" rx="6" fill="#f2f2f2" stroke="#8c8c8c" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="505" y="97" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="533" y="70" width="44" height="42" rx="6" fill="#f2f2f2" stroke="#8c8c8c" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="555" y="97" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <path d="M183,123 L183,130 L427,130 L427,123" fill="none" stroke="#446688" stroke-width="2" stroke-linecap="round" fill-opacity="1" filter="url(#rough2)"/>
  <text x="305" y="149" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">p = 1, i = 5, len = 5 ⇒ 25</text>
  <path d="M433,123 L433,130 L477,130 L477,123" fill="none" stroke="#8c8c8c" stroke-width="2" stroke-linecap="round" fill-opacity="1" filter="url(#rough2)"/>
  <text x="455" y="149" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c8c8c" filter="url(#rough2)">1</text>
  <path d="M483,123 L483,130 L527,130 L527,123" fill="none" stroke="#8c8c8c" stroke-width="2" stroke-linecap="round" fill-opacity="1" filter="url(#rough2)"/>
  <text x="505" y="149" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c8c8c" filter="url(#rough2)">1</text>
  <path d="M533,123 L533,130 L577,130 L577,123" fill="none" stroke="#8c8c8c" stroke-width="2" stroke-linecap="round" fill-opacity="1" filter="url(#rough2)"/>
  <text x="555" y="149" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c8c8c" filter="url(#rough2)">1</text>
  <rect x="48" y="200" width="180" height="56" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="138" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">dp[p−1]</text>  <text x="138" y="244" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#557799" filter="url(#rough2)">前缀 p−1 的最优解</text>  <rect x="48" y="288" width="180" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="138" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d3b" filter="url(#rough2)">dp[i−1]</text>  <text x="138" y="332" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#a08450" filter="url(#rough2)">前缀 i−1 的最优解</text>  <rect x="524" y="238" width="150" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="599" y="266" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">dp[i]</text>  <text x="599" y="290" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">两者的较大值</text>  <path d="M232,228 C320,228 430,252 518,258" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M232,316 C320,316 430,292 518,286" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="232" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#446688" filter="url(#rough2)">＋ len²：整段砖块，仅当 a[i] 是第二次出现</text>  <text x="372" y="342" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#a0761e" filter="url(#rough2)">＋ 1：单格砖块，任何时候都可以</text>  <text x="380" y="396" text-anchor="middle" font-size="12" font-weight="normal" fill="#666" filter="url(#rough2)">两种都可行时取较大者；a[i] 第一次出现时只能走 ＋1，并记下它的位置</text>  <text x="380" y="420" text-anchor="middle" font-size="12" font-weight="normal" fill="#b85450" filter="url(#rough2)">len 最大 4·10⁵，len² 可达 1.6·10¹¹ —— 必须用 64 位整数</text></svg>
