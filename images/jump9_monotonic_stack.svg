<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">单调栈：只存「严格后缀新低点」，二分找最远的 val &lt; V</text>

  <!-- ===== 数组：标出新低点 ===== -->
  <rect x="100" y="56" width="64" height="46" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="132" y="85" text-anchor="middle" font-size="16" fill="#777" filter="url(#rough2)">3</text>
  <rect x="180" y="56" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="212" y="85" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="260" y="56" width="64" height="46" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="292" y="85" text-anchor="middle" font-size="16" fill="#777" filter="url(#rough2)">4</text>
  <rect x="340" y="56" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="372" y="85" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="420" y="56" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="452" y="85" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <g font-size="8.5" fill="#999" filter="url(#rough2)">
    <text x="156" y="96">0</text><text x="236" y="96">1</text><text x="316" y="96">2</text>
    <text x="396" y="96">3</text><text x="476" y="96">4</text>
  </g>
  <g font-size="9" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="132" y="118">3 ≥ 1，非新低</text>
    <text x="292" y="118">4 ≥ 2，非新低</text>
  </g>
  <g font-size="9.5" font-weight="bold" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">
    <text x="212" y="118">新低 ✓</text>
    <text x="372" y="118">新低 ✓</text>
    <text x="452" y="118">新低 ✓</text>
  </g>
  <g filter="url(#rough2)">
    <circle cx="212" cy="42" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="372" cy="42" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="452" cy="42" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g font-size="9.5" fill="#2f5d26" text-anchor="middle" filter="url(#rough2)">
    <text x="212" y="46">③</text><text x="372" y="46">②</text><text x="452" y="46">①</text>
  </g>

  <text x="340" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">①②③ = 入栈顺序：栈自底向上恰为这些新低点</text>

  <!-- ===== 栈（竖直画） ===== -->
  <rect x="150" y="238" width="170" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="245" y="262" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">pos=1, val=1</text>
  <rect x="150" y="284" width="170" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="245" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a7218" filter="url(#rough2)">pos=3, val=2</text>
  <rect x="150" y="330" width="170" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="245" y="354" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">pos=4, val=5</text>
  <g filter="url(#rough2)">
    <circle cx="128" cy="257" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="128" cy="303" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="128" cy="349" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g font-size="9.5" text-anchor="middle" filter="url(#rough2)">
    <text x="128" y="261" fill="#2f5d26">③</text>
    <text x="128" y="307" fill="#9a7218">②</text>
    <text x="128" y="353" fill="#2f5d26">①</text>
  </g>
  <text x="235" y="392" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">自底向上：pos 递减，val 严格递减（永不弹出，只丢弃被支配者）</text>

  <!-- ===== 查询框 ===== -->
  <rect x="470" y="250" width="190" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="565" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">查询 i = 0</text>
  <text x="565" y="294" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">V = pm[0] = 3</text>
  <text x="565" y="314" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">二分找最靠底的</text>
  <text x="565" y="330" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">val &lt; 3 → (3, 2)</text>
  <path d="M468,298 L326,303" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== 底部规则 ===== -->
  <rect x="90" y="406" width="260" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="426" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">入栈：栈顶 val ≤ nums[i] 则丢弃 i</text>
  <text x="220" y="443" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">例：(2,4)、(0,3) 被更远更低者支配</text>
  <rect x="370" y="406" width="260" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="500" y="426" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">查询：val 自底向上严格递减</text>
  <text x="500" y="443" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">「val &lt; V」是顶部一段，二分其底端 = T(i)</text>
</svg>
