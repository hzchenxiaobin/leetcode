<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 486" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="486" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：按 mask 升序做「填桶」DP</text>
  <text x="320" y="49" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">dp[mask] 存当前桶已装的和，装满归零；−1 表示该 mask 不可达</text>
  <rect x="32" y="66" width="352" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="85" font-size="11.5" fill="#33445f" font-weight="bold" filter="url(#rough2)">① total = Σ nums</text>
  <text x="46" y="100" font-size="10" fill="#66788f" filter="url(#rough2)">若 total % k ≠ 0 → 返回 false</text>
  <path d="M 208 108 L 208 120" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="32" y="122" width="352" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="141" font-size="11.5" fill="#33445f" font-weight="bold" filter="url(#rough2)">② target = total / k</text>
  <text x="46" y="156" font-size="10" fill="#66788f" filter="url(#rough2)">若 max(nums) > target → 返回 false</text>
  <path d="M 208 164 L 208 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="32" y="178" width="352" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="197" font-size="11.5" fill="#33445f" font-weight="bold" filter="url(#rough2)">③ dp[0] = 0，其余全设 −1</text>
  <text x="46" y="212" font-size="10" fill="#66788f" filter="url(#rough2)">mask 从 0 到 2ⁿ − 1 升序遍历</text>
  <path d="M 208 220 L 208 232" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="32" y="234" width="352" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="253" font-size="11.5" fill="#33445f" font-weight="bold" filter="url(#rough2)">④ r = dp[mask]</text>
  <text x="46" y="268" font-size="10" fill="#66788f" filter="url(#rough2)">r &lt; 0 → 该状态不可达，直接跳过</text>
  <path d="M 208 276 L 208 288" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="32" y="290" width="352" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="309" font-size="11.5" fill="#33445f" font-weight="bold" filter="url(#rough2)">⑤ 枚举每个未使用的元素 i</text>
  <text x="46" y="324" font-size="10" fill="#66788f" filter="url(#rough2)">只有 r + nums[i] ≤ target 才能放</text>
  <path d="M 208 332 L 208 344" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="32" y="346" width="352" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="365" font-size="11.5" fill="#33445f" font-weight="bold" filter="url(#rough2)">⑥ dp[mask | 1≪i] = (r + nums[i]) % target</text>
  <text x="46" y="380" font-size="10" fill="#66788f" filter="url(#rough2)">同一个 mask 可能被多次写入，值相同</text>
  <path d="M 208 388 L 208 400" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="32" y="402" width="352" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="421" font-size="11.5" fill="#33445f" font-weight="bold" filter="url(#rough2)">⑦ 返回 dp[(1≪n) − 1] == 0</text>
  <text x="46" y="436" font-size="10" fill="#66788f" filter="url(#rough2)">全部元素装完 ⇒ 恰好装满 k 个桶</text>
  <rect x="32" y="402" width="352" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" rx="8" filter="url(#rough2)"/>
  <rect x="404" y="66" width="212" height="126" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="416" y="88" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">状态含义</text>
  <text x="416" y="110" font-size="10" fill="#8a6a20" filter="url(#rough2)">dp[mask] = 已用 mask 时</text>
  <text x="416" y="128" font-size="10" fill="#8a6a20" filter="url(#rough2)">当前桶里已装的和</text>
  <text x="416" y="152" font-size="10" fill="#8a6a20" filter="url(#rough2)">装满一个桶就归 0，</text>
  <text x="416" y="170" font-size="10" fill="#8a6a20" filter="url(#rough2)">因此值域是 [0, target)</text>
  <rect x="404" y="204" width="212" height="126" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="416" y="226" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">两个前置判断</text>
  <text x="416" y="248" font-size="10" fill="#8a3a36" filter="url(#rough2)">total % k ≠ 0：总和都</text>
  <text x="416" y="266" font-size="10" fill="#8a3a36" filter="url(#rough2)">分不平，必然 false</text>
  <text x="416" y="290" font-size="10" fill="#8a3a36" filter="url(#rough2)">max &gt; target：最大元素</text>
  <text x="416" y="308" font-size="10" fill="#8a3a36" filter="url(#rough2)">找不到能放下它的桶</text>
  <rect x="404" y="342" width="212" height="126" fill="#f5f7fa" stroke="#777" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="416" y="364" font-size="11" fill="#445566" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="416" y="386" font-size="10" fill="#445566" filter="url(#rough2)">时间 O(2ⁿ · n)：每个</text>
  <text x="416" y="404" font-size="10" fill="#445566" filter="url(#rough2)">状态扫一遍 n 个元素</text>
  <text x="416" y="426" font-size="10" fill="#445566" filter="url(#rough2)">空间 O(2ⁿ)：一个 dp</text>
  <text x="416" y="444" font-size="10" fill="#445566" filter="url(#rough2)">数组存残量</text>
</svg>
