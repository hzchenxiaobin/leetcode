<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">按值挑 Top-k，再按下标还原顺序</text>

  <!-- 原数组 -->
  <text x="40" y="78" font-size="13" fill="#666" filter="url(#rough2)">nums：</text>
  <rect x="95" y="56" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="150" y="56" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="205" y="56" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="231" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="260" y="56" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="121" y="104" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="176" y="104" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="231" y="104" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="286" y="104" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i=3</text>

  <!-- 选中集合 -->
  <path d="M 231 112 C 210 140, 200 150, 185 160" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 286 112 C 300 140, 305 150, 315 160" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="150" y="164" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="185" text-anchor="middle" font-size="13" fill="#2e4d24" filter="url(#rough2)">① 值最大的 k=2 个：S = {2, 3}</text>

  <path d="M 260 200 C 260 214, 260 220, 260 232" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 还原顺序 -->
  <rect x="95" y="236" width="275" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="232" y="257" text-anchor="middle" font-size="13" fill="#2b3d52" filter="url(#rough2)">② 下标升序 [2, 3] → 输出 [3, 3]</text>

  <rect x="95" y="290" width="330" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="12" fill="#7a3b37" filter="url(#rough2)">和是「集合属性」，与顺序无关；</text>
  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#7a3b37" filter="url(#rough2)">子序列 = 保序地保留下标集合 S</text>
</svg>
