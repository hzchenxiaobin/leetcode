<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：大顶堆每次取两个最高频的不同字符</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">把「最高的两个」配对输出，彼此一定不同，且不会与上一轮末尾相同</text>

  <rect x="150" y="58" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">统计 26 个字母的出现次数 cnt[26]</text>

  <path d="M 280 88 L 280 106" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="110" width="260" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">maxCnt &gt; ⌈n/2⌉ ？</text>

  <path d="M 410 125 L 448 125" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="452" y="110" width="96" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="130" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">返回 ""</text>
  <text x="430" y="102" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>

  <path d="M 280 140 L 280 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="156" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="150" y="162" width="260" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="11" fill="#35592c" filter="url(#rough2)">建大顶堆：(-cnt[i], i)，共 ≤ 26 个元素</text>

  <path d="M 280 192 L 280 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="214" width="420" height="120" fill="#ffffff" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4" rx="12" filter="url(#rough2)"/>
  <text x="86" y="234" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">循环：堆大小 &gt; 1</text>
  <text x="86" y="256" font-size="10.5" fill="#555" filter="url(#rough2)">① 弹出次数最多的两个字符 x、y（x ≠ y）</text>
  <text x="86" y="276" font-size="10.5" fill="#555" filter="url(#rough2)">② 依次追加到答案末尾：先 x 后 y</text>
  <text x="86" y="296" font-size="10.5" fill="#555" filter="url(#rough2)">③ cnt[x]−1、cnt[y]−1，仍 &gt; 0 的压回堆</text>
  <text x="86" y="318" font-size="10" fill="#888" filter="url(#rough2)">每轮消耗两个字符，堆中最多剩一个字符，故最多 n/2 轮</text>

  <path d="M 280 334 L 280 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="356" width="320" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">堆中剩 1 个字符 → 直接追加（其次数必为 1）</text>

  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间 O(n + 26 log 26) = O(n)；空间 O(26) = O(1)</text>
  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每轮取堆顶再压回，顺序保证相邻字符不同（见 §5 引理 2）</text>
</svg>
