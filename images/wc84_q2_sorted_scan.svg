<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="77" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按索引升序的单次扫描</text>
  <path d="M 170.0 44 Q 320.0 54 470.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="320.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">cur 始终指向「原串中尚未输出部分」的开头</text>
  <g filter="url(#rough2)"><rect x="210" y="92" width="220" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="320" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">按 indices 升序排好操作顺序</text>
  <path d="M 320 128 Q 320.0 138.0 320 148" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="210" y="150" width="220" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="320" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">cur = 0</text>
  <path d="M 320 186 Q 320.0 197.0 320 208" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><polygon points="320,210 440,250 320,290 200,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/></g>
  <text x="320" y="246" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">s[p..p+len) == source ?</text>
  <text x="320" y="266" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">在原串上比对</text>
  <text x="475" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="175" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)"><rect x="455" y="214" width="165" height="74" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="537" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">追加 s[cur..p)</text>
  <text x="537" y="252" text-anchor="middle" font-size="11" fill="#2e5e22" filter="url(#rough2)">再追加 target</text>
  <text x="537" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">cur = p + len</text>
  <g filter="url(#rough2)"><rect x="20" y="214" width="160" height="74" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="100" y="236" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">什么都不做</text>
  <text x="100" y="256" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">cur 保持不变</text>
  <text x="100" y="276" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">（这段留给后续补上）</text>
  <path d="M 537 288 Q 473.5 315.0 430 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <path d="M 100 288 Q 165.0 295.0 210 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="210" y="324" width="220" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="320" y="349" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">取下一条操作继续</text>
  <path d="M 320 362 Q 320.0 372.0 320 382" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="180" y="384" width="280" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="409" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">操作结束：追加 s[cur..n)</text>
  </svg>