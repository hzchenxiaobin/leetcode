<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">二分定位：最小的 t 使 g(t) ≥ k</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">g 严格递增 ⇒「g(t) ≥ k」是关于 t 的单调判定，可以二分</text>

  <rect x="70" y="64" width="420" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="87" text-anchor="middle" font-size="10.8" fill="#2f3f5c" filter="url(#rough2)">① 定界 lo = 0，hi = k（g(t) ≥ t ⇒ 若 g(t) = k 则 t ≤ k）</text>

  <path d="M 280 100 L 280 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,116 420,152 280,188 140,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="147" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">g(mid) ≥ k ?</text>
  <text x="280" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">mid = ⌊(lo + hi) / 2⌋</text>

  <path d="M 140 152 L 128 152 L 128 196" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 152 L 452 152 L 452 196" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="196" width="176" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="128" y="216" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">是：hi = mid</text>
  <text x="128" y="233" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">mid 可能就是答案</text>

  <rect x="364" y="196" width="176" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="452" y="216" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">否：lo = mid + 1</text>
  <text x="452" y="233" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">mid 必不是答案</text>

  <path d="M 128 242 L 128 256" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 452 242 L 452 256" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="260" width="360" height="34" rx="8" fill="#ffffff" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="283" text-anchor="middle" font-size="10.3" fill="#444" filter="url(#rough2)">② lo &lt; hi ？ 是 → 回到 ① 继续</text>

  <path d="M 460 277 L 536 277 L 536 82 L 494 82" stroke="#666" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 280 294 L 280 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="318" width="420" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="341" text-anchor="middle" font-size="10.8" fill="#2f3f5c" filter="url(#rough2)">③ 终止时 lo == hi，g(lo) 即 Im(g) 中不小于 k 的最小值</text>

  <path d="M 280 354 L 280 368" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 368 L 170 368 L 170 390" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 368 L 390 368 L 390 390" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="66" y="390" width="208" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="415" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">g(lo) == k → return 5</text>

  <rect x="286" y="390" width="208" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="415" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">g(lo) &gt; k → return 0</text>
</svg>
