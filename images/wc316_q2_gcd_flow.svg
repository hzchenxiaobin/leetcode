<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="600" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：双重枚举 + 前缀 gcd + k ∤ g 早退</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <rect x="185" y="52" width="270" height="32" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="73" text-anchor="middle" font-size="12.5" fill="#2b4a6e" filter="url(#sk)">开始：ans = 0，i = 0</text>
  <path d="M 320 84 L 320 96" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 外层判定菱形 -->
  <g filter="url(#sk)">
    <polygon points="320,100 395,132 320,164 245,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415" filter="url(#sk)">i &lt; n ?</text>

  <!-- 否 → 返回 -->
  <path d="M 395 132 L 468 132" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="430" y="124" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="472" y="116" width="110" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="527" y="137" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">返回 ans</text>

  <!-- 是 ↓ -->
  <path d="M 320 164 L 320 178" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="176" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">是</text>

  <!-- g ← 0 -->
  <g filter="url(#sk)">
    <rect x="245" y="182" width="150" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="202" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">g ← 0</text>
  <text x="408" y="202" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#sk)">gcd(0,x) = x，首元素直接进位</text>
  <path d="M 320 212 L 320 226" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- j 循环 -->
  <g filter="url(#sk)">
    <rect x="228" y="230" width="184" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="250" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22" filter="url(#sk)">for j = i to n−1</text>
  <path d="M 320 260 L 320 274" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- g 更新 -->
  <g filter="url(#sk)">
    <rect x="222" y="278" width="196" height="30" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.4"/>
  </g>
  <text x="320" y="298" text-anchor="middle" font-size="12.5" fill="#333333" filter="url(#sk)">g ← gcd(g, nums[j])</text>
  <path d="M 320 308 L 320 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形 1：k ∤ g ? -->
  <g filter="url(#sk)">
    <polygon points="320,326 415,364 320,402 225,364" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="369" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415" filter="url(#sk)">k ∤ g ?</text>

  <!-- 是 → break -->
  <path d="M 225 364 L 204 364" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="214" y="354" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="60" y="346" width="140" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="130" y="369" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">break：跳出 j 循环</text>

  <!-- break → 换下一个 i -->
  <path d="M 130 346 V 132 H 243" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="186" y="124" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">换下一个 i</text>

  <!-- 否 ↓ -->
  <path d="M 320 402 L 320 418" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="414" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">否</text>

  <!-- 菱形 2：g == k ? -->
  <g filter="url(#sk)">
    <polygon points="320,422 400,458 320,494 240,458" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#sk)">g == k ?</text>

  <!-- 是 → ans++ -->
  <path d="M 400 458 L 445 458" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="420" y="450" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="449" y="442" width="160" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="529" y="464" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22" filter="url(#sk)">ans++（不 break）</text>

  <!-- ans++ 回到 j 循环 -->
  <path d="M 529 442 V 250 H 412" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="242" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">继续 j++</text>

  <!-- 否：回到 j 循环 -->
  <path d="M 320 494 V 520 H 622 V 250 H 412" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="430" y="513" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">否：继续并入下一个 j</text>

  <!-- 底注 -->
  <g filter="url(#sk)">
    <rect x="60" y="536" width="520" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="320" y="553" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#sk)">j 循环自然结束（j = n）与 break 同效：回到外层（隐含 i++），g 重置</text>
  <text x="320" y="570" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#sk)">剪枝判据是 k ∤ g（不是 g &lt; k、更不是 g ≠ k）；命中 g == k 计数但不停</text>
</svg>
