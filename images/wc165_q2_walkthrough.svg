<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例走查：先算 T − 2C，再查奇偶与上下界</text>

  <g filter="url(#rough2)">
    <rect x="40" y="46" width="480" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="86" y="70" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">T</text>
    <text x="148" y="70" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">C</text>
    <text x="238" y="70" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">T − 2C</text>
    <text x="328" y="70" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">x</text>
    <text x="388" y="70" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">y</text>
    <text x="472" y="70" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">输出</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="84" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="86" y="110" text-anchor="middle" font-size="12" fill="#2f4a28">16</text>
    <text x="148" y="110" text-anchor="middle" font-size="12" fill="#2f4a28">7</text>
    <text x="238" y="110" text-anchor="middle" font-size="12" fill="#2f4a28">2</text>
    <text x="328" y="110" text-anchor="middle" font-size="12" fill="#2f4a28">1</text>
    <text x="388" y="110" text-anchor="middle" font-size="12" fill="#2f4a28">6</text>
    <text x="472" y="110" text-anchor="middle" font-size="12" fill="#2f6a3a" font-weight="bold">[1, 6]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="124" width="480" height="40" fill="#fdf4f6" stroke="#b85450" stroke-width="1.3" rx="6"/>
    <text x="86" y="150" text-anchor="middle" font-size="12" fill="#8a3a36">17</text>
    <text x="148" y="150" text-anchor="middle" font-size="12" fill="#8a3a36">4</text>
    <text x="238" y="150" text-anchor="middle" font-size="12" fill="#8a3a36">9（奇）</text>
    <text x="328" y="150" text-anchor="middle" font-size="12" fill="#aaa">—</text>
    <text x="388" y="150" text-anchor="middle" font-size="12" fill="#aaa">—</text>
    <text x="472" y="150" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">[]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="164" width="480" height="40" fill="#fdf4f6" stroke="#b85450" stroke-width="1.3" rx="6"/>
    <text x="86" y="190" text-anchor="middle" font-size="12" fill="#8a3a36">4</text>
    <text x="148" y="190" text-anchor="middle" font-size="12" fill="#8a3a36">17</text>
    <text x="238" y="190" text-anchor="middle" font-size="12" fill="#8a3a36">−30 &lt; 0</text>
    <text x="328" y="190" text-anchor="middle" font-size="12" fill="#aaa">—</text>
    <text x="388" y="190" text-anchor="middle" font-size="12" fill="#aaa">—</text>
    <text x="472" y="190" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">[]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="204" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6"/>
    <text x="86" y="230" text-anchor="middle" font-size="12" fill="#7a5a10">0</text>
    <text x="148" y="230" text-anchor="middle" font-size="12" fill="#7a5a10">0</text>
    <text x="238" y="230" text-anchor="middle" font-size="12" fill="#7a5a10">0</text>
    <text x="328" y="230" text-anchor="middle" font-size="12" fill="#7a5a10">0</text>
    <text x="388" y="230" text-anchor="middle" font-size="12" fill="#7a5a10">0</text>
    <text x="472" y="230" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">[0, 0]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="244" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6"/>
    <text x="86" y="270" text-anchor="middle" font-size="12" fill="#7a5a10">2</text>
    <text x="148" y="270" text-anchor="middle" font-size="12" fill="#7a5a10">1</text>
    <text x="238" y="270" text-anchor="middle" font-size="12" fill="#7a5a10">0</text>
    <text x="328" y="270" text-anchor="middle" font-size="12" fill="#7a5a10">0</text>
    <text x="388" y="270" text-anchor="middle" font-size="12" fill="#7a5a10">1</text>
    <text x="472" y="270" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">[0, 1]</text>
  </g>

  <text x="280" y="316" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">第 1 行：x = (16 − 14) / 2 = 1，y = 7 − 1 = 6，回代 4 + 12 = 16 ✓</text>
  <text x="280" y="338" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">第 2 行：差为奇数，x 不是整数；第 3 行：差为负，x &lt; 0 → 都返回 []</text>
  <text x="280" y="360" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">第 4/5 行：差为 0，全部番茄都来自「2 片打底」，巨无霸数量为 0</text>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意 y ≥ 0 这一步不能漏：T 过大时 x 会超过奶酪总数 C</text>
</svg>
