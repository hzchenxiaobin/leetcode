<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="372" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">单次查询：两端单独算，中间区间查线段树最大值</text>
  <text x="290" y="47" text-anchor="middle" font-size="11" fill="#888">游程下标 0…m−1，查询落在段 il（含 l）到段 ir（含 r）之间</text>

  <rect x="70" y="76" width="80" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="110" y="105" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">r0: 1</text>
  <rect x="160" y="76" width="130" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="225" y="105" text-anchor="middle" font-size="12" fill="#3a4a66">r1: 000</text>
  <rect x="300" y="76" width="90" height="46" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="345" y="105" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold">r2: 1</text>
  <rect x="400" y="76" width="120" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="460" y="105" text-anchor="middle" font-size="12" fill="#3a4a66">r3: 00</text>

  <text x="110" y="140" text-anchor="middle" font-size="10" fill="#999">val[0]=0（非 1-段）</text>
  <text x="225" y="140" text-anchor="middle" font-size="10" fill="#999">val[1]=0（非 1-段）</text>
  <text x="345" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">val[2]=3+2=5</text>
  <text x="460" y="140" text-anchor="middle" font-size="10" fill="#999">val[3]=0（非 1-段）</text>

  <text x="70" y="176" font-size="10.5" fill="#446688" font-weight="bold">查询 [1,5]：il = 1，ir = 3 ⇒ jlo = 2，jhi = 2</text>
  <text x="70" y="196" font-size="10.5" fill="#333">唯一的候选 j = 2 落在两端 ⇒ 直接算截断后的长度：3 + 1 = 4</text>
  <text x="70" y="216" font-size="10.5" fill="#333">答案 = 全局 ones 2 + 4 = 6</text>

  <text x="70" y="248" font-size="10.5" fill="#446688" font-weight="bold">查询 [0,6]：il = 0，ir = 3 ⇒ jlo = 1，jhi = 2</text>
  <text x="70" y="268" font-size="10.5" fill="#333">j = 1 是 0-段，跳过；j = 2 是右端候选 ⇒ 左 3 + 右 2 = 5</text>
  <text x="70" y="288" font-size="10.5" fill="#333">答案 = 2 + 5 = 7</text>

  <rect x="70" y="304" width="450" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="295" y="325" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">若 jlo + 1 ≤ jhi − 1（中间还夹着候选段），则对 [jlo+1, jhi−1] 做一次区间最大值查询</text>
  <text x="295" y="344" text-anchor="middle" font-size="10" fill="#777">这些候选段的左右 0-段完整落在查询内，val[j] 可直接用；只有两端需要修正</text>

  <path d="M 345 148 L 345 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="520" y="176" text-anchor="middle" font-size="9.5" fill="#999">预处理 O(n)，</text>
  <text x="520" y="192" text-anchor="middle" font-size="9.5" fill="#999">单次查询 O(log n)</text>
  <text x="520" y="208" text-anchor="middle" font-size="9.5" fill="#999">总 O((n+q)log n)</text>
</svg>
