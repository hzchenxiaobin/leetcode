<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">样例 1 走查：n = 5，k = 2</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">P = [0, 2, 3, 6, 7, 11]，余数 P mod 2 = [0, 0, 1, 0, 1, 1]</text>

  <g filter="url(#rough2)">
    <rect x="177" y="180" width="108" height="30" fill="#fff8e1"/>
    <rect x="177" y="210" width="108" height="30" fill="#fff8e1"/>
    <rect x="177" y="240" width="108" height="30" fill="#fff8e1"/>
    <rect x="397" y="180" width="80" height="30" fill="#e6f4ea"/>
    <rect x="477" y="180" width="78" height="30" fill="#e6f4ea"/>
    <rect x="397" y="240" width="80" height="30" fill="#e6f4ea"/>
    <rect x="477" y="240" width="78" height="30" fill="#e6f4ea"/>
    <rect x="55" y="62" width="500" height="28" fill="#e8f0fe"/>
  </g>

  <g filter="url(#rough2)" stroke="#999" stroke-width="0.9" fill="none">
    <rect x="55" y="62" width="500" height="208"/>
    <path d="M 55 90 H 555"/>
    <path d="M 55 120 H 555"/>
    <path d="M 55 150 H 555"/>
    <path d="M 55 180 H 555"/>
    <path d="M 55 210 H 555"/>
    <path d="M 55 240 H 555"/>
    <path d="M 105 62 V 270"/>
    <path d="M 177 62 V 270"/>
    <path d="M 285 62 V 270"/>
    <path d="M 397 62 V 270"/>
    <path d="M 477 62 V 270"/>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#3a4a66" text-anchor="middle">
    <text x="80" y="81">j</text>
    <text x="141" y="81">P_j mod 2</text>
    <text x="231" y="81">新增 i（余数）</text>
    <text x="341" y="81">cnt[0] / cnt[1]</text>
    <text x="437" y="81">本步贡献</text>
    <text x="516" y="81">累计 ans</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#333" text-anchor="middle">
    <text x="80" y="110">0</text>
    <text x="141" y="110">0</text>
    <text x="231" y="110">—</text>
    <text x="341" y="110">0 / 0</text>
    <text x="437" y="110">0</text>
    <text x="516" y="110">0</text>

    <text x="80" y="140">1</text>
    <text x="141" y="140">0</text>
    <text x="231" y="140">—</text>
    <text x="341" y="140">0 / 0</text>
    <text x="437" y="140">0</text>
    <text x="516" y="140">0</text>

    <text x="80" y="170">2</text>
    <text x="141" y="170">1</text>
    <text x="231" y="170">—</text>
    <text x="341" y="170">0 / 0</text>
    <text x="437" y="170">0</text>
    <text x="516" y="170">0</text>

    <text x="80" y="200">3</text>
    <text x="141" y="200">0</text>
    <text x="231" y="200" fill="#8a6a20">i=0（0）</text>
    <text x="341" y="200">1 / 0</text>
    <text x="437" y="200" fill="#3a5a30">+1</text>
    <text x="516" y="200" fill="#3a5a30">1</text>

    <text x="80" y="230">4</text>
    <text x="141" y="230">1</text>
    <text x="231" y="230" fill="#8a6a20">i=1（0）</text>
    <text x="341" y="230">2 / 0</text>
    <text x="437" y="230">0</text>
    <text x="516" y="230">1</text>

    <text x="80" y="260">5</text>
    <text x="141" y="260">1</text>
    <text x="231" y="260" fill="#8a6a20">i=2（1）</text>
    <text x="341" y="260">2 / 1</text>
    <text x="437" y="260" fill="#3a5a30">+1</text>
    <text x="516" y="260" fill="#3a5a30">2</text>
  </g>

  <text x="40" y="298" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">① j=3：加入 i=0（余数 0），cnt[0]=1；P₃ 余数 0 命中 ⇒ 子段 a₁..a₃</text>
  <text x="40" y="322" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">② j=5：加入 i=2（余数 1），cnt[1]=1；P₅ 余数 1 命中 ⇒ 子段 a₃..a₅</text>
  <text x="40" y="346" font-size="10.5" fill="#777" filter="url(#rough2)">③ j=4：加入 i=1 但其余数是 0，候选集中没有余数 1 ⇒ 贡献 0</text>
  <text x="40" y="370" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">最终 ans = 2，与官方样例输出一致</text>
</svg>
