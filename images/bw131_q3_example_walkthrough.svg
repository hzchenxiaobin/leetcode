<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>
  <text x="310" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：limit = 4，queries = [[1,4],[2,5],[1,3],[3,4]]</text>

  <!-- 四列状态 -->
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="24" y="58" width="136" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <rect x="176" y="58" width="136" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <rect x="328" y="58" width="136" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <rect x="480" y="58" width="136" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="92" y="80">操作 0</text>
    <text x="244" y="80">操作 1</text>
    <text x="396" y="80">操作 2</text>
    <text x="548" y="80">操作 3</text>
    <text x="92" y="100" fill="#666">[1, 4]</text>
    <text x="244" y="100" fill="#666">[2, 5]</text>
    <text x="396" y="100" fill="#666">[1, 3]</text>
    <text x="548" y="100" fill="#666">[3, 4]</text>
  </g>

  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="24" y="120" width="136" height="104" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
    <rect x="176" y="120" width="136" height="104" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
    <rect x="328" y="120" width="136" height="104" fill="#fafafa" stroke="#b85450" stroke-width="2" rx="6"/>
    <rect x="480" y="120" width="136" height="104" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="6"/>
    <text x="92" y="146">球1 = 4</text>
    <text x="92" y="172">球2 = —</text>
    <text x="92" y="198">球3 = —</text>
    <text x="244" y="146">球1 = 4</text>
    <text x="244" y="172">球2 = 5</text>
    <text x="244" y="198">球3 = —</text>
    <text x="396" y="146" fill="#b85450">球1 = 3</text>
    <text x="396" y="172">球2 = 5</text>
    <text x="396" y="198">球3 = —</text>
    <text x="548" y="146">球1 = 3</text>
    <text x="548" y="172">球2 = 5</text>
    <text x="548" y="198">球3 = 4</text>
  </g>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="24" y="236" width="136" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <rect x="176" y="236" width="136" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <rect x="328" y="236" width="136" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <rect x="480" y="236" width="136" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8"/>
    <text x="92" y="263" fill="#2d5a22">颜色数 1</text>
    <text x="244" y="263" fill="#2d5a22">颜色数 2</text>
    <text x="396" y="263" fill="#2d5a22">颜色数 2</text>
    <text x="548" y="263" fill="#2d5a22" font-weight="bold">颜色数 3</text>
  </g>

  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.6" fill="none">
    <path d="M 162 257 L 172 257" marker-end="url(#arr)"/>
    <path d="M 314 257 L 324 257" marker-end="url(#arr)"/>
    <path d="M 466 257 L 476 257" marker-end="url(#arr)"/>
  </g>

  <!-- 关键一步解释 -->
  <rect x="24" y="298" width="592" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="40" y="322" font-size="12" fill="#a06c10" filter="url(#rough2)">关键一步（操作 2）：球 1 由颜色 4 改成颜色 3</text>
  <text x="40" y="346" font-size="12" fill="#a06c10" filter="url(#rough2)">颜色 4 的球数 1 → 0，删除并 distinct − 1；颜色 3 首次出现，distinct + 1；总数仍是 2</text>

  <text x="310" y="392" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">输出 [1, 2, 2, 3]</text>
</svg>
