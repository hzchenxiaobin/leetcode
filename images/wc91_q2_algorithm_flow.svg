<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path filter="url(#rough2)" d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="320" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="30" font-size="16" fill="#333" filter="url(#rough2)">算法流程：一次建图 + 一次 BFS</text>

  <rect x="40" y="56" width="200" height="70" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">① DFS 遍历整棵树</text>
  <text x="140" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">记录 parent[child] = node</text>
  <text x="140" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">顺便定位值等于 target 的结点</text>

  <path d="M240,91 L300,91" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="56" width="200" height="70" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="80" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">② 从 target 开始 BFS</text>
  <text x="400" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">队列逐层推进，visited 去重</text>
  <text x="400" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每层扩展：左孩子、右孩子、父结点</text>

  <path d="M400,126 L400,164" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="400,166 540,208 400,250 260,208" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">当前层距离 dist == k ?</text>
  <text x="400" y="222" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">（BFS 保证第一次到达即最短）</text>

  <path d="M260,208 L150,208" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="180" width="110" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是：收集本层</text>
  <text x="95" y="224" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">全部结点值</text>

  <path d="M540,208 L600,208" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="600" y="186" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="600" y="230" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">dist++</text>
  <text x="24" y="288" font-size="12" fill="#333" filter="url(#rough2)">复杂度：建图 $O(n)$ + BFS 每个结点仅入队一次 $O(n)$，总计 $O(n)$ 时间、$O(n)$ 空间。</text>
  <text x="24" y="308" font-size="11" fill="#666" filter="url(#rough2)">注意：值互不相同，所以用 target 的「值」就能唯一确定起点。</text>
</svg>
