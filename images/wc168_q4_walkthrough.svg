<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：先有盒子、后有钥匙 ⇒ 糖果 16</text>
  <text x="40" y="48" font-size="9.5" fill="#666" filter="url(#rough2)">status = [1,0,1,0]   candies = [7,5,4,100]</text>
  <text x="40" y="64" font-size="9.5" fill="#666" filter="url(#rough2)">keys = [[],[],[1],[]]   containedBoxes = [[1,2],[3],[],[]]   initialBoxes = [0]</text>

  <!-- 表头 -->
  <rect x="34" y="78" width="92" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="80" y="95" text-anchor="middle" font-size="10" fill="#2f4f6f" filter="url(#rough2)">步骤</text>
  <rect x="126" y="78" width="348" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="300" y="95" text-anchor="middle" font-size="10" fill="#2f4f6f" filter="url(#rough2)">这一刻发生的事情（H = 手上，K = 钥匙）</text>
  <rect x="474" y="78" width="152" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="550" y="95" text-anchor="middle" font-size="10" fill="#2f4f6f" filter="url(#rough2)">累计糖果</text>

  <!-- 第 1 行 -->
  <rect x="34" y="108" width="92" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="80" y="139" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">开始</text>
  <rect x="126" y="108" width="348" height="52" fill="#fcfcfc" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="138" y="127" font-size="9" fill="#444" filter="url(#rough2)">H = {0}，status[0] = 1</text>
  <text x="138" y="145" font-size="9" fill="#444" filter="url(#rough2)">→ 盒子 0 直接入队</text>
  <rect x="474" y="108" width="152" height="52" fill="#fcfcfc" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="550" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- 第 2 行 -->
  <rect x="34" y="160" width="92" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="80" y="191" text-anchor="middle" font-size="10" fill="#8c3b36" filter="url(#rough2)">开 0</text>
  <rect x="126" y="160" width="348" height="52" fill="#fcfcfc" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="138" y="179" font-size="9" fill="#444" filter="url(#rough2)">+7 糖果；得到盒子 1、2，H = {0,1,2}</text>
  <text x="138" y="197" font-size="9" fill="#444" filter="url(#rough2)">1 关着且 K 里没有 → 搁置；2 本身开着 → 入队</text>
  <rect x="474" y="160" width="152" height="52" fill="#fcfcfc" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="550" y="191" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>

  <!-- 第 3 行 -->
  <rect x="34" y="212" width="92" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="80" y="243" text-anchor="middle" font-size="10" fill="#8c3b36" filter="url(#rough2)">开 2</text>
  <rect x="126" y="212" width="348" height="52" fill="#fcfcfc" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="138" y="231" font-size="9" fill="#444" filter="url(#rough2)">+4 糖果；得到钥匙 1，K = {1}</text>
  <text x="138" y="249" font-size="9" fill="#444" filter="url(#rough2)">盒子 1 已经在手上 → 立刻入队（钥匙等到了盒子）</text>
  <rect x="474" y="212" width="152" height="52" fill="#fcfcfc" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="550" y="243" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>

  <!-- 第 4 行 -->
  <rect x="34" y="264" width="92" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="80" y="295" text-anchor="middle" font-size="10" fill="#8c3b36" filter="url(#rough2)">开 1</text>
  <rect x="126" y="264" width="348" height="52" fill="#fcfcfc" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="138" y="283" font-size="9" fill="#444" filter="url(#rough2)">+5 糖果；得到盒子 3，H = {0,1,2,3}</text>
  <text x="138" y="301" font-size="9" fill="#444" filter="url(#rough2)">3 关着、且任何盒子都不给 3 的钥匙 → 永久搁置</text>
  <rect x="474" y="264" width="152" height="52" fill="#fcfcfc" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="550" y="295" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">16</text>

  <!-- 第 5 行 -->
  <rect x="34" y="316" width="92" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="80" y="341" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">结束</text>
  <rect x="126" y="316" width="348" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="138" y="341" font-size="9.5" fill="#2f6b4f" filter="url(#rough2)">队列空，不动点 = {0,2,1}；盒子 3 的 100 颗糖果永远拿不到</text>
  <rect x="474" y="316" width="152" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="550" y="341" text-anchor="middle" font-size="12" fill="#2f6b4f" font-weight="bold" filter="url(#rough2)">答案 = 16</text>

  <text x="34" y="380" font-size="9.5" fill="#888" filter="url(#rough2)">两种不对称：盒子 1 是「先有盒子、后有钥匙」，补入队就开了；盒子 3 是「有盒子、永无钥匙」，怎么等都开不了。</text>
  <text x="34" y="400" font-size="9.5" fill="#999" filter="url(#rough2)">若只看 status 为 1 的盒子就收工，会漏掉盒子 1；若一拿到盒子就无条件打开，会把盒子 3 的 100 也算进去。</text>
</svg>
