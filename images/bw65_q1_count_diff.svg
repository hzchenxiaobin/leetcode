<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：逐字母计数作差，|差| ≤ 3 才算"几乎相等"</text>

  <!-- 两个字符串 -->
  <rect x="42" y="64" width="110" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="97" y="88" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">aaaa</text>
  <text x="36" y="88" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">word1</text>
  <rect x="42" y="112" width="110" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="97" y="136" text-anchor="middle" font-size="16" fill="#d6a040" filter="url(#rough2)">bccb</text>
  <text x="36" y="136" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">word2</text>

  <path d="M 158 106 Q 196 106 214 128" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="98" font-size="12" fill="#666" filter="url(#rough2)">各自数一遍</text>

  <!-- 计数表：字母 | word1 | word2 | 差 -->
  <text x="300" y="66" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">示例 1 的计数对照</text>
  <rect x="212" y="76" width="60" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="242" y="95" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">字母</text>
  <rect x="272" y="76" width="72" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="308" y="95" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">word1</text>
  <rect x="344" y="76" width="72" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="380" y="95" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">word2</text>
  <rect x="416" y="76" width="76" height="28" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="454" y="95" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">频率差</text>

  <rect x="212" y="108" width="60" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="242" y="128" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="272" y="108" width="72" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="308" y="128" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="344" y="108" width="72" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="380" y="128" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">0</text>
  <rect x="416" y="108" width="76" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="454" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">+4 ✗</text>

  <rect x="212" y="142" width="60" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="242" y="162" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="272" y="142" width="72" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="308" y="162" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="344" y="142" width="72" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="380" y="162" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">2</text>
  <rect x="416" y="142" width="76" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="454" y="162" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">−2 ✓</text>

  <rect x="212" y="176" width="60" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="242" y="196" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="272" y="176" width="72" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="308" y="196" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="344" y="176" width="72" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="380" y="196" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">2</text>
  <rect x="416" y="176" width="76" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="454" y="196" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">−2 ✓</text>

  <text x="496" y="128" font-size="20" fill="#b85450" filter="url(#rough2)">&gt;3</text>
  <path d="M 492 118 Q 500 110 508 116" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 阈值示意 -->
  <rect x="42" y="236" width="470" height="78" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="277" y="262" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">只有一个数组 cnt[26]：word1 加、word2 减</text>
  <text x="277" y="286" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">最后扫一遍，只要出现 |cnt[c]| &gt; 3 即返回 false</text>
  <text x="277" y="306" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（本题的 3 是阈值上限，别写成 &gt;= 3）</text>
</svg>
