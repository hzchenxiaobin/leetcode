<svg xmlns="http://www.w3.org/2000/svg" width="780" height="600" viewBox="0 0 780 600"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="600" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：三趟登记 → 值域扫描 → popcount 筛选</text>
  <path d="M 200 42 Q 390 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- left note card -->
  <g filter="url(#rough2)">
    <rect x="40" y="62" width="195" height="110" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="137" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">登记要点</text>
  <text x="52" y="104" font-size="10.5" fill="#444" filter="url(#rough2)">· 三个数组 → bit0 / bit1 / bit2</text>
  <text x="52" y="122" font-size="10.5" fill="#444" filter="url(#rough2)">· mask[v] |= 001 / 010 / 100</text>
  <text x="52" y="140" font-size="10.5" fill="#444" filter="url(#rough2)">· 位或幂等：重复登记不变</text>
  <text x="52" y="158" font-size="10.5" fill="#444" filter="url(#rough2)">· 无需先 set 去重</text>

  <!-- right note card -->
  <g filter="url(#rough2)">
    <rect x="555" y="50" width="190" height="100" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="650" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">popcount 工具</text>
  <text x="567" y="92" font-size="10.5" fill="#444" filter="url(#rough2)">· C++：__builtin_popcount</text>
  <text x="567" y="110" font-size="10.5" fill="#444" filter="url(#rough2)">· Python：int.bit_count()（3.10+）</text>
  <text x="567" y="128" font-size="10.5" fill="#444" filter="url(#rough2)">· 掩码仅 3 位：三位取位相加即可</text>

  <!-- return box -->
  <g filter="url(#rough2)">
    <rect x="555" y="175" width="190" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="650" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">返回 ans</text>
  <text x="650" y="217" text-anchor="middle" font-size="10" fill="#567" filter="url(#rough2)">升序 · 元素互异 · 顺序任意</text>
  <path d="M 475 254 Q 515 254 552 208" stroke="#3a3a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="484" y="238" font-size="10" fill="#888" filter="url(#rough2)">v &gt; 100（扫描完毕）</text>

  <!-- box A -->
  <g filter="url(#rough2)">
    <rect x="265" y="62" width="230" height="36" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="380" y="85" text-anchor="middle" font-size="12.5" fill="#2b4666" filter="url(#rough2)">建桶：mask[0…100] ← 0</text>
  <path d="M 380 98 L 380 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box B: register three arrays -->
  <g filter="url(#rough2)">
    <rect x="285" y="120" width="190" height="92" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="380" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">逐数组登记归属</text>
  <text x="380" y="163" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">遍历 nums1 → mask[v] |= 001</text>
  <text x="380" y="181" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">遍历 nums2 → mask[v] |= 010</text>
  <text x="380" y="199" text-anchor="middle" font-size="11" fill="#a67c1e" filter="url(#rough2)">遍历 nums3 → mask[v] |= 100</text>
  <path d="M 380 212 L 380 230" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- box C: value scan loop -->
  <g filter="url(#rough2)">
    <rect x="285" y="234" width="190" height="40" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="380" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">v = 1 … 100 逐值检查</text>
  <text x="380" y="267" text-anchor="middle" font-size="9.5" fill="#778" filter="url(#rough2)">（每个值恰查一次：升序 + 互异）</text>
  <path d="M 380 274 L 380 292" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond -->
  <g filter="url(#rough2)">
    <polygon points="380,296 520,342 380,388 240,342" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="380" y="338" text-anchor="middle" font-size="12.5" fill="#2b4666" filter="url(#rough2)">popcount(mask[v]) ≥ 2 ？</text>
  <text x="380" y="356" text-anchor="middle" font-size="9.5" fill="#778" filter="url(#rough2)">（归属数组个数 ≥ 2？）</text>

  <path d="M 380 388 L 380 410" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="404" font-size="11" fill="#888" filter="url(#rough2)">是</text>
  <path d="M 520 342 L 552 342" stroke="#b0b0b0" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="528" y="332" font-size="11" fill="#999" filter="url(#rough2)">否</text>

  <!-- collect box -->
  <g filter="url(#rough2)">
    <rect x="285" y="414" width="190" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="380" y="432" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">收录：ans.push_back(v)</text>
  <text x="380" y="447" text-anchor="middle" font-size="9.5" fill="#567" filter="url(#rough2)">（含三个数组全中的情形）</text>

  <!-- skip box -->
  <g filter="url(#rough2)">
    <rect x="556" y="320" width="130" height="44" rx="10" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.5"/>
  </g>
  <text x="621" y="339" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">跳过 v</text>
  <text x="621" y="355" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">（归属 &lt; 2 个数组）</text>

  <!-- loop back -->
  <path d="M 380 454 L 380 484" stroke="#3a3a3a" stroke-width="1.5" fill="none" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <path d="M 621 364 L 621 484 L 100 484 L 100 254 L 281 254" stroke="#3a3a3a" stroke-width="1.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="504" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">处理完当前 v → 下一个 v，直至 v &gt; 100 循环结束</text>

  <text x="390" y="560" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">一趟登记 O(n₁+n₂+n₃) + 一趟值域扫描 O(100) —— 签到题的最短路径</text>
</svg>
