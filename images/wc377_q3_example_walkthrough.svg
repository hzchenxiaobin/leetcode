<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="940" height="620" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：source = &quot;abcd&quot; → target = &quot;acbe&quot;</text>
  <path d="M 210 44 Q 470 52 730 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== position strip ===== -->
  <g filter="url(#sk)"><rect x="490" y="64" width="160" height="192" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="210" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">位置 0</text>
  <text x="390" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">位置 1</text>
  <text x="570" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">位置 2 ★</text>
  <text x="750" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">位置 3</text>

  <text x="52" y="118" font-size="11" fill="#666" filter="url(#sk)">source</text>
  <g filter="url(#sk)"><rect x="182" y="96" width="56" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="210" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">a</text>
  <g filter="url(#sk)"><rect x="362" y="96" width="56" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="390" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">b</text>
  <g filter="url(#sk)"><rect x="542" y="96" width="56" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="570" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">c</text>
  <g filter="url(#sk)"><rect x="722" y="96" width="56" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="750" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">d</text>

  <text x="52" y="158" font-size="11" fill="#666" filter="url(#sk)">target</text>
  <g filter="url(#sk)"><rect x="182" y="136" width="56" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="210" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">a</text>
  <g filter="url(#sk)"><rect x="362" y="136" width="56" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="390" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">c</text>
  <g filter="url(#sk)"><rect x="542" y="136" width="56" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="570" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">b</text>
  <g filter="url(#sk)"><rect x="722" y="136" width="56" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="750" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">e</text>

  <text x="52" y="196" font-size="11" fill="#666" filter="url(#sk)">最短路</text>
  <text x="210" y="196" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">a（不变）</text>
  <text x="390" y="196" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">b → c</text>
  <text x="570" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">c → e → b</text>
  <text x="750" y="196" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">d → e</text>

  <text x="52" y="230" font-size="11" fill="#666" filter="url(#sk)">成本</text>
  <text x="210" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#444" filter="url(#sk)">0</text>
  <text x="390" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#444" filter="url(#sk)">5</text>
  <text x="570" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a" filter="url(#sk)">3</text>
  <text x="750" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#444" filter="url(#sk)">20</text>

  <path d="M 60 268 L 880 268" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#sk)"/>

  <!-- ===== distance matrix ===== -->
  <text x="80" y="294" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">Floyd 后的距离表 g（行 → 列，∞ = 不可达）</text>

  <text x="126" y="318" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">(行→列)</text>
  <text x="177" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#sk)">a</text>
  <text x="231" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#sk)">b</text>
  <text x="285" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#sk)">c</text>
  <text x="339" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#sk)">d</text>
  <text x="393" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#sk)">e</text>

  <!-- row a -->
  <text x="126" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#sk)">a</text>
  <g filter="url(#sk)"><rect x="150" y="336" width="54" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="177" y="359" text-anchor="middle" font-size="12" fill="#b03a3a" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="204" y="336" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="231" y="359" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="258" y="336" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="285" y="359" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">7</text>
  <g filter="url(#sk)"><rect x="312" y="336" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="339" y="359" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">∞</text>
  <g filter="url(#sk)"><rect x="366" y="336" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="393" y="359" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">8</text>

  <!-- row b -->
  <text x="126" y="394" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#sk)">b</text>
  <g filter="url(#sk)"><rect x="150" y="372" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="177" y="395" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">∞</text>
  <g filter="url(#sk)"><rect x="204" y="372" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="231" y="395" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="258" y="372" width="54" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="285" y="395" text-anchor="middle" font-size="12" fill="#b03a3a" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="312" y="372" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="339" y="395" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">∞</text>
  <g filter="url(#sk)"><rect x="366" y="372" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="393" y="395" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">6</text>

  <!-- row c -->
  <text x="126" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#sk)">c</text>
  <g filter="url(#sk)"><rect x="150" y="408" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="177" y="431" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">∞</text>
  <g filter="url(#sk)"><rect x="204" y="408" width="54" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="231" y="431" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">3 ★</text>
  <g filter="url(#sk)"><rect x="258" y="408" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="285" y="431" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="312" y="408" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="339" y="431" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">∞</text>
  <g filter="url(#sk)"><rect x="366" y="408" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="393" y="431" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">1</text>

  <!-- row d -->
  <text x="126" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#sk)">d</text>
  <g filter="url(#sk)"><rect x="150" y="444" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="177" y="467" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">∞</text>
  <g filter="url(#sk)"><rect x="204" y="444" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="231" y="467" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">22</text>
  <g filter="url(#sk)"><rect x="258" y="444" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="285" y="467" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">27</text>
  <g filter="url(#sk)"><rect x="312" y="444" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="339" y="467" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="366" y="444" width="54" height="36" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="393" y="467" text-anchor="middle" font-size="12" fill="#b03a3a" filter="url(#sk)">20</text>

  <!-- row e -->
  <text x="126" y="502" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#sk)">e</text>
  <g filter="url(#sk)"><rect x="150" y="480" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="177" y="503" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">∞</text>
  <g filter="url(#sk)"><rect x="204" y="480" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="231" y="503" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="258" y="480" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="285" y="503" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">7</text>
  <g filter="url(#sk)"><rect x="312" y="480" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="339" y="503" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">∞</text>
  <g filter="url(#sk)"><rect x="366" y="480" width="54" height="36" rx="3" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="393" y="503" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">0</text>

  <!-- ===== right panel ===== -->
  <g filter="url(#sk)"><rect x="470" y="300" width="420" height="84" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="490" y="326" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">逐位查表求和</text>
  <text x="490" y="350" font-size="12" fill="#2e6e2e" filter="url(#sk)">ans = g[a][a] + g[b][c] + g[c][b] + g[d][e]</text>
  <text x="490" y="372" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">     = 0 + 5 + 3 + 20 = 28 ✓</text>

  <path d="M 260 426 Q 366 452 462 456" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="470" y="404" width="420" height="104" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="490" y="430" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">关键：位置 2 的绕行</text>
  <text x="490" y="454" font-size="12" fill="#7a5415" filter="url(#sk)">直连 c→b = 5；绕行 c→e→b = 1+2 = 3</text>
  <text x="490" y="478" font-size="12" fill="#7a5415" filter="url(#sk)">Floyd 枚举中转字母 e 松弛出更短路 ——</text>
  <text x="490" y="498" font-size="12" fill="#7a5415" filter="url(#sk)">这正是 Floyd 存在的意义</text>

  <!-- ===== bottom notes ===== -->
  <g filter="url(#sk)"><rect x="56" y="548" width="828" height="56" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="76" y="572" font-size="11" fill="#444" filter="url(#sk)">· 示例 2：g[a][b] = 1+2 = 3（a→c→b 中转），四位共 3×4 = 12</text>
  <text x="76" y="594" font-size="11" fill="#444" filter="url(#sk)">· 示例 3：只有规则 a→e，g[d][e] = ∞ —— 任意一位不可达即返回 −1</text>
</svg>
