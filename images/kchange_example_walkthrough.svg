<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="960" height="680" fill="#fafafa"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：s = "NSWWEW"，k = 3 → 答案 6</text>
  <path d="M 310 42 Q 480 50 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 左侧：逐前缀表格 ===== -->
  <text x="80" y="76" font-size="13" font-weight="bold" fill="#2f4f6f">逐前缀计算 f(L) = L − 2w + 2·min(k, w)</text>

  <g filter="url(#sk)">
    <rect x="70" y="88" width="510" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="70" y="126" width="510" height="44" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="70" y="170" width="510" height="44" fill="#f6f8fb" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="70" y="214" width="510" height="44" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="70" y="258" width="510" height="44" fill="#f6f8fb" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="70" y="302" width="510" height="44" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="70" y="346" width="510" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <line x1="118" y1="88" x2="118" y2="394" stroke="#b8c4d4" stroke-width="1"/>
    <line x1="260" y1="88" x2="260" y2="394" stroke="#b8c4d4" stroke-width="1"/>
    <line x1="460" y1="88" x2="460" y2="394" stroke="#b8c4d4" stroke-width="1"/>
    <line x1="508" y1="88" x2="508" y2="394" stroke="#b8c4d4" stroke-width="1"/>
  </g>

  <text x="94" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4f6f">L</text>
  <text x="189" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4f6f">前缀</text>
  <text x="360" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4f6f">(cN, cS, cE, cW)</text>
  <text x="484" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4f6f">w</text>
  <text x="546" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4f6f">f(L)</text>

  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="94" y="153">1</text><text x="189" y="153">N</text><text x="360" y="153" font-family="monospace">(1, 0, 0, 0)</text><text x="484" y="153">0</text><text x="546" y="153">1</text>
    <text x="94" y="197">2</text><text x="189" y="197">NS</text><text x="360" y="197" font-family="monospace">(1, 1, 0, 0)</text><text x="484" y="197">1</text><text x="546" y="197">2</text>
    <text x="94" y="241">3</text><text x="189" y="241">NSW</text><text x="360" y="241" font-family="monospace">(1, 1, 0, 1)</text><text x="484" y="241">1</text><text x="546" y="241">3</text>
    <text x="94" y="285">4</text><text x="189" y="285">NSWW</text><text x="360" y="285" font-family="monospace">(1, 1, 0, 2)</text><text x="484" y="285">1</text><text x="546" y="285">4</text>
    <text x="94" y="329">5</text><text x="189" y="329">NSWWE</text><text x="360" y="329" font-family="monospace">(1, 1, 1, 2)</text><text x="484" y="329">2</text><text x="546" y="329">5</text>
  </g>
  <g font-size="12" fill="#2e5e2e" text-anchor="middle" font-weight="bold">
    <text x="94" y="375">6</text><text x="189" y="375">NSWWEW</text><text x="360" y="375" font-family="monospace">(1, 1, 1, 3)</text><text x="484" y="375">2</text><text x="546" y="375">6 ←</text>
  </g>
  <text x="70" y="420" font-size="11" fill="#888">k = 3 ≥ w = 2：f(6) = 6 − 4 + 2×2 = 6 = L，逐行取 max 得答案</text>

  <!-- ===== 右侧：修改后轨迹 ===== -->
  <text x="620" y="76" font-size="13" font-weight="bold" fill="#8a6515">修改后轨迹："NNWWWW"（S→N，E→W）</text>

  <g filter="url(#sk)" stroke="#d8dde4" stroke-width="1">
    <line x1="620" y1="140" x2="920" y2="140"/>
    <line x1="620" y1="190" x2="920" y2="190"/>
    <line x1="620" y1="290" x2="920" y2="290"/>
    <line x1="620" y1="340" x2="920" y2="340"/>
    <line x1="670" y1="110" x2="670" y2="360"/>
    <line x1="720" y1="110" x2="720" y2="360"/>
    <line x1="820" y1="110" x2="820" y2="360"/>
    <line x1="870" y1="110" x2="870" y2="360"/>
    <line x1="920" y1="110" x2="920" y2="360"/>
  </g>
  <line x1="620" y1="240" x2="920" y2="240" stroke="#8a8f98" stroke-width="1.4" filter="url(#sk)"/>
  <line x1="770" y1="110" x2="770" y2="360" stroke="#8a8f98" stroke-width="1.4" filter="url(#sk)"/>
  <text x="930" y="244" font-size="11" fill="#666">x</text>
  <text x="762" y="106" font-size="11" fill="#666">y</text>

  <circle cx="770" cy="240" r="4" fill="#444" filter="url(#sk)"/>
  <text x="752" y="260" font-size="11" fill="#444">原点</text>

  <g filter="url(#sk)">
    <path d="M 770 240 L 770 192" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arD)"/>
    <path d="M 772 191 L 772 143" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arD)"/>
    <path d="M 770 190 L 722 190" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arD)"/>
    <path d="M 720 192 L 672 192" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arD)"/>
    <path d="M 670 192 L 622 192" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arD)"/>
    <path d="M 620 192 L 620 190" stroke="#446688" stroke-width="2" fill="none"/>
  </g>
  <text x="780" y="205" font-size="11" fill="#3a5a80" font-weight="bold">N, N</text>
  <text x="668" y="178" font-size="11" fill="#3a5a80" font-weight="bold">W ×4</text>

  <circle cx="620" cy="190" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="620" y="130" text-anchor="middle" font-size="12" fill="#a04038" font-weight="bold">终点 (−4, 2)</text>
  <text x="620" y="146" text-anchor="middle" font-size="12" fill="#a04038" font-weight="bold">距离 = 4 + 2 = 6</text>

  <!-- ===== 底部说明 ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="450" width="820" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="480" y="476" text-anchor="middle" font-size="12" fill="#8a6515" font-weight="bold">最优时刻 L = 6：w = 2 ≤ k = 3，f = L = 6</text>
  <text x="480" y="500" text-anchor="middle" font-size="12" fill="#444">构造只需 2 次修改：'S'→'N' 救回 y 轴抵消对、'E'→'W' 救回 x 轴抵消对；第 3 次预算无处增益</text>

  <g filter="url(#sk)">
    <rect x="70" y="540" width="820" height="64" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="480" y="566" text-anchor="middle" font-size="12" fill="#5a3a7a" font-weight="bold">对照示例 1："NWSE"，k = 1</text>
  <text x="480" y="590" text-anchor="middle" font-size="12" fill="#444">f(3) = 3 − 2×1 + 2×1 = 3（前缀 "NWS" 改 S→N），f(4) = 4 − 4 + 2 = 2 —— 最大值出现在中间时刻</text>

  <text x="480" y="650" text-anchor="middle" font-size="11" fill="#888">时间 O(n) | 空间 O(1)</text>
</svg>
