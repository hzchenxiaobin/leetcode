<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：不枚举子数组，枚举「谁是最弱者」</text>
  <path d="M 110 38 Q 320 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="360" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">最弱者 i = 2（val = 1）</text>

  <g filter="url(#sk)"><rect x="180" y="76" width="64" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="212" y="105" text-anchor="middle" font-size="15" font-family="monospace" fill="#33455e">1</text>
  <g filter="url(#sk)"><rect x="254" y="76" width="64" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="286" y="105" text-anchor="middle" font-size="15" font-family="monospace" fill="#33455e">3</text>
  <g filter="url(#sk)"><rect x="328" y="76" width="64" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="360" y="105" text-anchor="middle" font-size="15" font-weight="bold" font-family="monospace" fill="#a04040">1</text>
  <g filter="url(#sk)"><rect x="402" y="76" width="64" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="434" y="105" text-anchor="middle" font-size="15" font-family="monospace" fill="#33455e">2</text>

  <text x="212" y="138" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="286" y="138" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="360" y="138" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="434" y="138" text-anchor="middle" font-size="11" fill="#888">3</text>

  <path d="M 168 72 V 130" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#sk)"/>
  <text x="160" y="94" text-anchor="end" font-size="12" font-weight="bold" fill="#2e5e2e">L = −1</text>
  <text x="160" y="110" text-anchor="end" font-size="10.5" fill="#666">左无严格更小</text>
  <path d="M 478 72 V 130" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" filter="url(#sk)"/>
  <text x="486" y="94" font-size="12" font-weight="bold" fill="#a04040">R = 4 = n</text>
  <text x="486" y="110" font-size="10.5" fill="#666">右无 ≤ 1</text>

  <path d="M 268 148 H 182" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 378 148 H 464" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="323" y="152" text-anchor="middle" font-size="11.5" fill="#2e5e2e">管辖窗口</text>
  <text x="323" y="170" text-anchor="middle" font-size="12" fill="#2b2b2b">左端点 l ∈ [L+1, i] = [0, 2]，右端点 r ∈ [i, R−1] = [2, 3]</text>

  <text x="320" y="196" text-anchor="middle" font-size="12.5" fill="#555">i = 2 管辖的全部 6 个子数组及各自元素和：</text>
  <g filter="url(#sk)"><rect x="52" y="208" width="168" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="136" y="229" text-anchor="middle" font-size="12" font-family="monospace" fill="#33455e">[1,3,1] → 5</text>
  <g filter="url(#sk)"><rect x="236" y="208" width="168" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="320" y="229" text-anchor="middle" font-size="12" font-family="monospace" fill="#33455e">[1,3,1,2] → 7</text>
  <g filter="url(#sk)"><rect x="420" y="208" width="168" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="504" y="229" text-anchor="middle" font-size="12" font-family="monospace" fill="#33455e">[3,1] → 4</text>
  <g filter="url(#sk)"><rect x="52" y="250" width="168" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="136" y="271" text-anchor="middle" font-size="12" font-family="monospace" fill="#33455e">[3,1,2] → 6</text>
  <g filter="url(#sk)"><rect x="236" y="250" width="168" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="320" y="271" text-anchor="middle" font-size="12" font-family="monospace" fill="#33455e">[1] → 1</text>
  <g filter="url(#sk)"><rect x="420" y="250" width="168" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="504" y="271" text-anchor="middle" font-size="12" font-family="monospace" fill="#33455e">[1,2] → 3</text>

  <g filter="url(#sk)"><rect x="92" y="296" width="456" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="318" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#2e5e2e">S(2) = 5+7+4+6+1+3 = 26 → 贡献 = val × S = 1 × 26 = 26</text>

  <g filter="url(#sk)"><rect x="36" y="344" width="568" height="68" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="368" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">贡献法：答案 = Σ strength[i] × S(i)，S(i) = i 管辖的所有子数组的元素和之和</text>
  <text x="320" y="392" text-anchor="middle" font-size="12" fill="#7a5415">窗口由 L(i)（左侧第一个严格更小）与 R(i)（右侧第一个 ≤）唯一确定，不重不漏</text>

  <text x="320" y="436" text-anchor="middle" font-size="12.5" fill="#2b2b2b">907 只需数个数 (i−L)×(R−i)；2281 多乘一个 sum ——「和之和」逼出二重前缀和</text>
  <text x="320" y="460" text-anchor="middle" font-size="11" fill="#888">每个子数组归给其最小值等值簇中最右侧的元素：左严格、右非严格</text>
</svg>
