<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#fdfcf7"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：集合化 → 双向过滤</text>
  <path d="M 190 42 Q 360 52 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- row 1: scan S1 -->
  <text x="50" y="80" font-size="11" font-weight="bold" fill="#999" filter="url(#sk)">第 1 趟 · 求 answer[0]</text>
  <g filter="url(#sk)">
    <rect x="48" y="93" width="170" height="44" rx="8" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
  </g>
  <text x="133" y="119" text-anchor="middle" font-size="12.5" font-family="monospace" font-weight="bold" fill="#333" filter="url(#sk)">nums1=[1,2,3,3]</text>
  <path d="M 218 115 L 260 115" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="239" y="105" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">set( )</text>
  <g filter="url(#sk)">
    <rect x="265" y="93" width="140" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="335" y="119" text-anchor="middle" font-size="13" font-family="monospace" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">S1 = {1,2,3}</text>
  <path d="M 405 115 L 446 115" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="425" y="105" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">遍历 x</text>
  <g filter="url(#sk)">
    <polygon points="480,75 558,115 480,155 402,115" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="480" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a6a15" filter="url(#sk)">x ∈ S2 ?</text>
  <path d="M 558 115 L 594 115" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="576" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="599" y="93" width="105" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="651" y="111" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">answer[0]</text>
  <text x="651" y="127" text-anchor="middle" font-size="10.5" fill="#555">收入 x</text>
  <path d="M 480 155 L 480 181" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="493" y="175" font-size="11" fill="#999" filter="url(#sk)">是 · 跳过</text>

  <!-- row 2: scan S2 -->
  <text x="50" y="250" font-size="11" font-weight="bold" fill="#999" filter="url(#sk)">第 2 趟 · 求 answer[1]</text>
  <g filter="url(#sk)">
    <rect x="48" y="263" width="170" height="44" rx="8" fill="#fff" stroke="#5a5a5a" stroke-width="1.4"/>
  </g>
  <text x="133" y="289" text-anchor="middle" font-size="12.5" font-family="monospace" font-weight="bold" fill="#333" filter="url(#sk)">nums2=[1,1,2,2]</text>
  <path d="M 218 285 L 260 285" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="239" y="275" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">set( )</text>
  <g filter="url(#sk)">
    <rect x="265" y="263" width="140" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="335" y="289" text-anchor="middle" font-size="13" font-family="monospace" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">S2 = {1,2}</text>
  <path d="M 405 285 L 446 285" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="425" y="275" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">遍历 x</text>
  <g filter="url(#sk)">
    <polygon points="480,245 558,285 480,325 402,285" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="480" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a6a15" filter="url(#sk)">x ∈ S1 ?</text>
  <path d="M 558 285 L 594 285" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="576" y="275" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="599" y="263" width="105" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="651" y="281" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04038" filter="url(#sk)">answer[1]</text>
  <text x="651" y="297" text-anchor="middle" font-size="10.5" fill="#555">收入 x</text>
  <path d="M 480 325 L 480 351" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="493" y="345" font-size="11" fill="#999" filter="url(#sk)">是 · 跳过</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="80" y="378" width="560" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="360" y="394" text-anchor="middle" font-size="12" fill="#2b6e9e">S1 与 S2 互为对方的过滤表：每个元素 O(1) 判定，两趟共 O(n + m)</text>
  <text x="360" y="410" text-anchor="middle" font-size="10.5" fill="#777">值域仅 2001 → 可用布尔数组直接寻址替代哈希集合（见「算法细节」）</text>
</svg>
