<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="380" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">核心观察：跨度 = 被今天价格「吞掉」的所有区间长度之和</text>
  <text x="340" y="60" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" font-style="" filter="url(#rough2)">价格 100, 80, 60, 70, 60, 75, 85 依次到来，栈内价格严格递减</text>
  <text x="120" y="92" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" font-style="" filter="url(#rough2)">栈：(价格, 跨度)</text>
  <rect x="80" y="108" width="90" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125.0" y="134.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">100</text>
  <rect x="170" y="108" width="90" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215.0" y="134.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1</text>
  <rect x="80" y="164" width="90" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125.0" y="190.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">80</text>
  <rect x="170" y="164" width="90" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215.0" y="190.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1</text>
  <rect x="80" y="220" width="90" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125.0" y="246.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">75</text>
  <rect x="170" y="220" width="90" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215.0" y="246.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">4</text>
  <rect x="80" y="276" width="90" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125.0" y="302.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">85</text>
  <rect x="170" y="276" width="90" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215.0" y="302.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">6</text>
  <rect x="300" y="108" width="330" height="200" rx="10" fill="#fafafa" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <text x="465" y="136" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="normal" font-style="" filter="url(#rough2)">next(70)：弹出 60（跨度 1）</text>
  <text x="465" y="166" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="normal" font-style="" filter="url(#rough2)">span = 1 + 1 = 2 ⇒ 压入 (70, 2)</text>
  <text x="465" y="200" text-anchor="middle" font-size="13" fill="#b85450" font-weight="normal" font-style="" filter="url(#rough2)">next(75)：弹 60(1)、70(2) ⇒ 4</text>
  <text x="465" y="230" text-anchor="middle" font-size="13" fill="#b85450" font-weight="normal" font-style="" filter="url(#rough2)">next(85)：弹 75(4)、80(1) ⇒ 6</text>
  <text x="465" y="268" text-anchor="middle" font-size="12" fill="#666" font-weight="normal" font-style="" filter="url(#rough2)">每个元素进出栈各一次 ⇒ 均摊 O(1)</text>
  <text x="340" y="348" text-anchor="middle" font-size="13" fill="#446688" font-weight="normal" font-style="" filter="url(#rough2)">跨度定义：从今天往前数，连续 ≤ 今天价格的天数（含今天）</text>
</svg>
