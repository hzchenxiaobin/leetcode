<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历，O(n) 时间 O(1) 空间</text>
  <text x="290" y="47" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">不需要模拟任何一次搬运，只累加前缀净盈余并取最大值</text>

  <g filter="url(#rough2)">
    <rect x="150" y="62" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="290" y="84" text-anchor="middle" font-size="11" fill="#3a4a66">输入 machines，n = machines.length</text>

    <rect x="150" y="112" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="290" y="134" text-anchor="middle" font-size="11" fill="#3a4a66">total = Σ machines[i]（用 64 位整数）</text>

    <polygon points="290,164 400,206 290,248 180,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="290" y="203" text-anchor="middle" font-size="11" fill="#8a6a20">total % n ≠ 0 ?</text>
    <text x="290" y="219" text-anchor="middle" font-size="9.5" fill="#8a6a20">总数无法均分</text>

    <rect x="425" y="190" width="130" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="490" y="211" text-anchor="middle" font-size="11" fill="#8a3a36">返回 −1</text>

    <rect x="130" y="268" width="320" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="290" y="290" text-anchor="middle" font-size="11" fill="#2f5426">avg = total / n，cur = 0，ans = 0</text>

    <rect x="90" y="318" width="400" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <text x="290" y="338" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">for a in machines:  d = a − avg</text>
    <text x="290" y="355" text-anchor="middle" font-size="10.5" fill="#3a4a66">cur += d；ans = max(ans, |cur|, d)</text>
    <text x="290" y="368" text-anchor="middle" font-size="9" fill="#7a8aa6">cur 是当前缝隙左侧的净盈余；d 是本机器的盈余</text>

    <rect x="170" y="386" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="290" y="406" text-anchor="middle" font-size="11.5" fill="#2f5426" font-weight="bold">返回 ans（最少操作步数）</text>
  </g>

  <g filter="url(#rough2)" stroke="#666" stroke-width="1.5" fill="none">
    <path d="M 290 96 L 290 110" marker-end="url(#arr)"/>
    <path d="M 290 146 L 290 162" marker-end="url(#arr)"/>
    <path d="M 400 206 L 423 206" marker-end="url(#arr)"/>
    <path d="M 290 248 L 290 266" marker-end="url(#arr)"/>
    <path d="M 290 302 L 290 316" marker-end="url(#arr)"/>
    <path d="M 290 374 L 290 384" marker-end="url(#arr)"/>
  </g>
  <text x="290" y="262" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是（能均分）</text>
  <text x="408" y="182" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
</svg>
