<svg xmlns="http://www.w3.org/2000/svg" width="640" height="396" viewBox="0 0 640 396" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="396" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：扫描 [0,1,0,0,1]，附三个边界</text>
  <path d="M 170 36 Q 320 44 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="46" y="56" width="36" height="28" fill="#f0f0f0" stroke="#888888" stroke-width="1.1"/>
    <rect x="82" y="56" width="52" height="28" fill="#f0f0f0" stroke="#888888" stroke-width="1.1"/>
    <rect x="134" y="56" width="168" height="28" fill="#f0f0f0" stroke="#888888" stroke-width="1.1"/>
    <rect x="302" y="56" width="70" height="28" fill="#f0f0f0" stroke="#888888" stroke-width="1.1"/>
  </g>
  <text x="64" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555">i</text>
  <text x="108" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555">nums[i]</text>
  <text x="218" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555">动作</text>
  <text x="337" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555">prev；ans</text>

  <g filter="url(#sk)">
    <rect x="46" y="84" width="36" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
    <rect x="82" y="84" width="52" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
    <rect x="134" y="84" width="168" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
    <rect x="302" y="84" width="70" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
  </g>
  <text x="64" y="104" text-anchor="middle" font-size="11" fill="#333333">0</text>
  <text x="108" y="104" text-anchor="middle" font-size="11" fill="#333333">0</text>
  <text x="218" y="104" text-anchor="middle" font-size="11" fill="#333333">跳过</text>
  <text x="337" y="104" text-anchor="middle" font-size="11" fill="#333333">−1；1</text>

  <g filter="url(#sk)">
    <rect x="46" y="116" width="36" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
    <rect x="82" y="116" width="52" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
    <rect x="134" y="116" width="168" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
    <rect x="302" y="116" width="70" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
  </g>
  <text x="64" y="136" text-anchor="middle" font-size="11" fill="#333333">1</text>
  <text x="108" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">1</text>
  <text x="218" y="136" text-anchor="middle" font-size="11" fill="#333333">首个 1：prev ← 1</text>
  <text x="337" y="136" text-anchor="middle" font-size="11" fill="#333333">1；1</text>

  <g filter="url(#sk)">
    <rect x="46" y="148" width="36" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
    <rect x="82" y="148" width="52" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
    <rect x="134" y="148" width="168" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
    <rect x="302" y="148" width="70" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
  </g>
  <text x="64" y="168" text-anchor="middle" font-size="11" fill="#333333">2</text>
  <text x="108" y="168" text-anchor="middle" font-size="11" fill="#333333">0</text>
  <text x="218" y="168" text-anchor="middle" font-size="11" fill="#333333">跳过</text>
  <text x="337" y="168" text-anchor="middle" font-size="11" fill="#333333">1；1</text>

  <g filter="url(#sk)">
    <rect x="46" y="180" width="36" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
    <rect x="82" y="180" width="52" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
    <rect x="134" y="180" width="168" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
    <rect x="302" y="180" width="70" height="32" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/>
  </g>
  <text x="64" y="200" text-anchor="middle" font-size="11" fill="#333333">3</text>
  <text x="108" y="200" text-anchor="middle" font-size="11" fill="#333333">0</text>
  <text x="218" y="200" text-anchor="middle" font-size="11" fill="#333333">跳过</text>
  <text x="337" y="200" text-anchor="middle" font-size="11" fill="#333333">1；1</text>

  <g filter="url(#sk)">
    <rect x="46" y="212" width="36" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="82" y="212" width="52" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="134" y="212" width="168" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="302" y="212" width="70" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="64" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333">4</text>
  <text x="108" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">1</text>
  <text x="218" y="226" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">ans ← 1×(4−1) = 3</text>
  <text x="218" y="240" text-anchor="middle" font-size="10.5" fill="#2e6e2e">prev ← 4</text>
  <text x="337" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">4；3</text>

  <g filter="url(#sk)">
    <rect x="46" y="244" width="326" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="209" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">遍历结束：prev ≠ −1（见过 1）→ 返回 3</text>

  <text x="509" y="58" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555">对应的 3 种切法：</text>

  <g filter="url(#sk)">
    <rect x="424" y="68" width="30" height="26" rx="3" fill="#f0f0f0" stroke="#999999" stroke-width="1.1"/>
    <rect x="458" y="68" width="30" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="492" y="68" width="30" height="26" rx="3" fill="#f0f0f0" stroke="#999999" stroke-width="1.1"/>
    <rect x="526" y="68" width="30" height="26" rx="3" fill="#f0f0f0" stroke="#999999" stroke-width="1.1"/>
    <rect x="560" y="68" width="30" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="439" y="85" text-anchor="middle" font-size="12" fill="#555555">0</text>
  <text x="473" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">1</text>
  <text x="507" y="85" text-anchor="middle" font-size="12" fill="#555555">0</text>
  <text x="541" y="85" text-anchor="middle" font-size="12" fill="#555555">0</text>
  <text x="575" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">1</text>
  <path d="M 490 64 L 490 98" stroke="#b85450" stroke-width="2.4" filter="url(#sk)"/>
  <text x="509" y="110" text-anchor="middle" font-size="10.5" fill="#b85450">[0,1] | [0,0,1]</text>

  <g filter="url(#sk)">
    <rect x="424" y="118" width="30" height="26" rx="3" fill="#f0f0f0" stroke="#999999" stroke-width="1.1"/>
    <rect x="458" y="118" width="30" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="492" y="118" width="30" height="26" rx="3" fill="#f0f0f0" stroke="#999999" stroke-width="1.1"/>
    <rect x="526" y="118" width="30" height="26" rx="3" fill="#f0f0f0" stroke="#999999" stroke-width="1.1"/>
    <rect x="560" y="118" width="30" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="439" y="135" text-anchor="middle" font-size="12" fill="#555555">0</text>
  <text x="473" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">1</text>
  <text x="507" y="135" text-anchor="middle" font-size="12" fill="#555555">0</text>
  <text x="541" y="135" text-anchor="middle" font-size="12" fill="#555555">0</text>
  <text x="575" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">1</text>
  <path d="M 524 114 L 524 148" stroke="#b85450" stroke-width="2.4" filter="url(#sk)"/>
  <text x="509" y="160" text-anchor="middle" font-size="10.5" fill="#b85450">[0,1,0] | [0,1]</text>

  <g filter="url(#sk)">
    <rect x="424" y="168" width="30" height="26" rx="3" fill="#f0f0f0" stroke="#999999" stroke-width="1.1"/>
    <rect x="458" y="168" width="30" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="492" y="168" width="30" height="26" rx="3" fill="#f0f0f0" stroke="#999999" stroke-width="1.1"/>
    <rect x="526" y="168" width="30" height="26" rx="3" fill="#f0f0f0" stroke="#999999" stroke-width="1.1"/>
    <rect x="560" y="168" width="30" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="439" y="185" text-anchor="middle" font-size="12" fill="#555555">0</text>
  <text x="473" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">1</text>
  <text x="507" y="185" text-anchor="middle" font-size="12" fill="#555555">0</text>
  <text x="541" y="185" text-anchor="middle" font-size="12" fill="#555555">0</text>
  <text x="575" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">1</text>
  <path d="M 558 164 L 558 198" stroke="#b85450" stroke-width="2.4" filter="url(#sk)"/>
  <text x="509" y="210" text-anchor="middle" font-size="10.5" fill="#b85450">[0,1,0,0] | [1]</text>

  <g filter="url(#sk)">
    <rect x="46" y="292" width="548" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">易错：[0,0,0] 一个 1 都没有 → 任何划分都含全 0 段 → 必须返回 0</text>
  <text x="320" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">乘法公式的空乘积 = 1 是坑：前提是 k ≥ 1，代码里用 prev == −1 兜底</text>

  <g filter="url(#sk)">
    <rect x="46" y="346" width="548" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="362" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">再验证 [1,0,1,0,1]：ans = (2−0) × (4−2) = 4</text>
  <text x="320" y="378" text-anchor="middle" font-size="10.5" fill="#2b6e9e">两个空隙各 2 选 1，乘法原理成立</text>
</svg>
