  <text x="299" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a66" filter="url(#r)">边界特判：n = 1（整串只有一个单词）</text>
  <text x="98" y="354" text-anchor="start" font-size="10.5" fill="#555" filter="url(#r)">没有间隔 → 除零！所有空格全部追加到末尾：</text>
  <text x="98" y="374" text-anchor="start" font-size="10.5" fill="#555" filter="url(#r)">"··hi··"（4 空格 1 词）→ "hi····"（4 个空格全在尾部，长度仍为 6）</text>
  <text x="98" y="390" text-anchor="start" font-size="10.5" fill="#555" filter="url(#r)">示例 3："a"（0 空格 1 词）→ "a"，特判同样成立</text>

  <text x="310" y="424" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">per ≥ 1 恒成立：题面保证相邻单词间 ≥ 1 空格 → spaces ≥ n−1</text>
  <text x="310" y="446" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">赛时最短路径：count → split → divmod → join</text>
