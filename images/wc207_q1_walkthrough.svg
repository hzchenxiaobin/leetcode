  <text x="299" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d28" filter="url(#r)">per = ⌊7 / 2⌋ = 3，extra = 7 − 3×2 = 1</text>
  <text x="299" y="168" text-anchor="middle" font-size="11" fill="#555" filter="url(#r)">守恒：per × (n−1) + extra = 3×2 + 1 = 7 = spaces ✓</text>

