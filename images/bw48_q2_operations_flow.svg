<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">三个操作的处理流程：一张哈希表 + 统一的「expiry &gt; now」判活</text>

  <!-- 哈希表 -->
  <g filter="url(#rough2)">
    <rect x="70" y="120" width="150" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="145" y="146" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">expire 哈希表</text>
  <text x="145" y="168" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">tokenId → expiry</text>
  <g filter="url(#rough2)">
    <rect x="86" y="182" width="118" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="86" y="212" width="118" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="86" y="242" width="118" height="26" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="145" y="199">"aaa" → 7</text>
    <text x="145" y="229">"bbb" → 15</text>
    <text x="145" y="259">（过期项可留着）</text>
  </g>

  <!-- generate -->
  <g filter="url(#rough2)">
    <rect x="290" y="60" width="230" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
  </g>
  <text x="405" y="84" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">generate(tokenId, now)</text>
  <text x="405" y="106" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">expire[tokenId] = now + ttl</text>
  <text x="405" y="124" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">直接写入 / 覆盖，不看过期与否</text>
  <path d="M 290 98 L 224 98" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- renew -->
  <g filter="url(#rough2)">
    <rect x="290" y="162" width="230" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
  </g>
  <text x="405" y="186" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">renew(tokenId, now)</text>
  <text x="405" y="208" text-anchor="middle" font-size="11.5" fill="#2f5226" filter="url(#rough2)">查表存在 且 expiry &gt; now：</text>
  <text x="405" y="226" text-anchor="middle" font-size="11.5" fill="#2f5226" filter="url(#rough2)">expire[tokenId] = now + ttl</text>
  <text x="405" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否则（不存在 / 已过期）什么都不做</text>
  <path d="M 290 208 L 224 208" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count -->
  <g filter="url(#rough2)">
    <rect x="290" y="280" width="230" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
  </g>
  <text x="405" y="304" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">countUnexpiredTokens(now)</text>
  <text x="405" y="326" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">遍历哈希表，统计 expiry &gt; now 的条目</text>
  <text x="405" y="344" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">（可顺手清理 ≤ now 的过期项）</text>
  <text x="405" y="362" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">题目保证调用 ≤ 2000 次，全表扫描也很快</text>
  <path d="M 290 326 L 224 290" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 构造 -->
  <g filter="url(#rough2)">
    <rect x="60" y="60" width="170" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
  </g>
  <text x="145" y="78" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">AuthenticationManager(ttl)</text>
  <text x="145" y="94" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">只保存 timeToLive</text>
  <path d="M 145 100 L 145 114" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
