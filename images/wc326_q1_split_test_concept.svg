<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">拆位用副本 t，试除用原值 num：职责分离</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: shrinking copy t -->
  <text x="218" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">拆位副本 t：每轮 ÷10，自右向左推进</text>
  <g filter="url(#sk)">
    <rect x="70" y="84" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="150" y="84" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="230" y="84" width="56" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="310" y="84" width="56" height="36" rx="4" fill="#f2f2ee" stroke="#999" stroke-width="1.5"/>
  </g>
  <text x="98" y="107" text-anchor="middle" font-size="13" fill="#333">121</text>
  <text x="178" y="107" text-anchor="middle" font-size="13" fill="#333">12</text>
  <text x="258" y="107" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="338" y="107" text-anchor="middle" font-size="13" fill="#777">0</text>
  <g filter="url(#sk)">
    <path d="M 126 102 L 148 102" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 206 102 L 228 102" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 286 102 L 308 102" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="137" y="95" text-anchor="middle" font-size="9" fill="#666">÷10</text>
  <text x="217" y="95" text-anchor="middle" font-size="9" fill="#666">÷10</text>
  <text x="297" y="95" text-anchor="middle" font-size="9" fill="#666">÷10</text>
  <text x="338" y="136" text-anchor="middle" font-size="9.5" fill="#999">t = 0 → 停止</text>

  <!-- extract digits -->
  <g filter="url(#sk)">
    <path d="M 98 122 L 98 150" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)"/>
    <path d="M 178 122 L 178 150" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)"/>
    <path d="M 258 122 L 258 150" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="106" y="140" font-size="9" fill="#b03a3a">%10</text>
  <text x="186" y="140" font-size="9" fill="#b03a3a">%10</text>
  <text x="266" y="140" font-size="9" fill="#b03a3a">%10</text>
  <g filter="url(#sk)">
    <rect x="81" y="152" width="34" height="30" rx="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="161" y="152" width="34" height="30" rx="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="241" y="152" width="34" height="30" rx="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="98" y="172" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">1</text>
  <text x="178" y="172" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">2</text>
  <text x="258" y="172" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">1</text>
  <text x="178" y="200" text-anchor="middle" font-size="10.5" fill="#888">d = t % 10：依次取出个位、十位、百位</text>

  <!-- tests against original num -->
  <g filter="url(#sk)">
    <path d="M 98 186 L 98 208" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 178 186 L 178 208" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 258 186 L 258 208" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="98" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">121%1=0 ✓</text>
  <text x="178" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">121%2=1 ✗</text>
  <text x="258" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">121%1=0 ✓</text>
  <text x="178" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">cnt：1 → 1 → 2（✗ 不加）</text>

  <!-- right: immutable num -->
  <g filter="url(#sk)">
    <rect x="486" y="56" width="100" height="22" rx="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="536" y="71" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">全程只读</text>
  <g filter="url(#sk)">
    <rect x="420" y="84" width="232" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
  </g>
  <text x="536" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e">num = 121</text>

  <g filter="url(#sk)">
    <rect x="420" y="140" width="232" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="536" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">取余判定的方向</text>
  <text x="536" y="182" text-anchor="middle" font-size="10.5" fill="#555">判定式：num % d == 0</text>
  <text x="536" y="200" text-anchor="middle" font-size="10.5" fill="#555">被除数是整个 num，不是数位自身</text>

  <g filter="url(#sk)">
    <rect x="420" y="228" width="232" height="84" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="536" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">同值数位计两次？</text>
  <text x="536" y="270" text-anchor="middle" font-size="10.5" fill="#555">判定按「位」独立：两个 1 各自</text>
  <text x="536" y="286" text-anchor="middle" font-size="10.5" fill="#555">问一遍 121%1==0，各命中一次</text>
  <text x="536" y="303" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">→ 计 2，不去重</text>

  <!-- key insight -->
  <g filter="url(#sk)">
    <rect x="40" y="336" width="600" height="64" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="58" y="362" font-size="12" font-weight="bold" fill="#2b2b2b">关键观察：整除的对象是整个 num（num % d == 0）；拆位副本 t 专司取数、num 专司被除，</text>
  <text x="58" y="384" font-size="11.5" fill="#444">职责分离。判定按位独立 ⇒ 同值数位不去重；题目保证无 0 位 ⇒ d ∈ {1,…,9}，无除零风险。</text>
</svg>
