<svg xmlns="http://www.w3.org/2000/svg" width="640" height="425" viewBox="0 0 640 425" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="425" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：n = 4 与 n = 1000</text>
  <path d="M 170 40 Q 320 50 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left panel: n = 4 -->
  <g filter="url(#sk)">
    <rect x="30" y="56" width="300" height="330" rx="10" fill="#ffffff" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="180" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">n = 4：逐个检查 [0, 4]</text>

  <g>
    <g filter="url(#sk)">
      <rect x="55" y="94" width="60" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
      <rect x="115" y="94" width="110" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
      <rect x="225" y="94" width="80" height="28" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    </g>
    <text x="85" y="113" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">x</text>
    <text x="170" y="113" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">二进制</text>
    <text x="265" y="113" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">单比特?</text>

    <g filter="url(#sk)">
      <rect x="55" y="122" width="60" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/>
      <rect x="115" y="122" width="110" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/>
      <rect x="225" y="122" width="80" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/>
    </g>
    <text x="85" y="143" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0</text>
    <text x="170" y="143" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0</text>
    <text x="265" y="143" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">✓</text>

    <g filter="url(#sk)">
      <rect x="55" y="154" width="60" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/>
      <rect x="115" y="154" width="110" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/>
      <rect x="225" y="154" width="80" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/>
    </g>
    <text x="85" y="175" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">1</text>
    <text x="170" y="175" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">1</text>
    <text x="265" y="175" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">✓</text>

    <g filter="url(#sk)">
      <rect x="55" y="186" width="60" height="32" fill="#fdf0f0" stroke="#b85450" stroke-width="1.1"/>
      <rect x="115" y="186" width="110" height="32" fill="#fdf0f0" stroke="#b85450" stroke-width="1.1"/>
      <rect x="225" y="186" width="80" height="32" fill="#fdf0f0" stroke="#b85450" stroke-width="1.1"/>
    </g>
    <text x="85" y="207" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">2</text>
    <text x="170" y="207" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">10</text>
    <text x="265" y="207" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>

    <g filter="url(#sk)">
      <rect x="55" y="218" width="60" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/>
      <rect x="115" y="218" width="110" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/>
      <rect x="225" y="218" width="80" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.1"/>
    </g>
    <text x="85" y="239" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">3</text>
    <text x="170" y="239" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">11</text>
    <text x="265" y="239" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">✓</text>

    <g filter="url(#sk)">
      <rect x="55" y="250" width="60" height="32" fill="#fdf0f0" stroke="#b85450" stroke-width="1.1"/>
      <rect x="115" y="250" width="110" height="32" fill="#fdf0f0" stroke="#b85450" stroke-width="1.1"/>
      <rect x="225" y="250" width="80" height="32" fill="#fdf0f0" stroke="#b85450" stroke-width="1.1"/>
    </g>
    <text x="85" y="271" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">4</text>
    <text x="170" y="271" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">100</text>
    <text x="265" y="271" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <text x="180" y="306" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">注：7 = 111₂ 也是单比特数，但 7 &gt; 4 不在范围内</text>
  <g filter="url(#sk)">
    <rect x="75" y="318" width="210" height="36" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="180" y="341" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold" font-family="monospace">0, 1, 3 → 答案 3 ✓</text>

  <!-- right panel: n = 1000 -->
  <g filter="url(#sk)">
    <rect x="350" y="56" width="260" height="330" rx="10" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="480" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">n = 1000：直接枚举全 1 数</text>

  <g font-size="13" font-family="monospace" fill="#2e6e2e" font-weight="bold">
    <g filter="url(#sk)">
      <rect x="370" y="96" width="90" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    </g>
    <text x="415" y="117" text-anchor="middle">0</text>
    <g filter="url(#sk)">
      <rect x="480" y="96" width="100" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    </g>
    <text x="530" y="117" text-anchor="middle">31</text>
    <g filter="url(#sk)">
      <rect x="370" y="136" width="90" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    </g>
    <text x="415" y="157" text-anchor="middle">1</text>
    <g filter="url(#sk)">
      <rect x="480" y="136" width="100" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    </g>
    <text x="530" y="157" text-anchor="middle">63</text>
    <g filter="url(#sk)">
      <rect x="370" y="176" width="90" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    </g>
    <text x="415" y="197" text-anchor="middle">3</text>
    <g filter="url(#sk)">
      <rect x="480" y="176" width="100" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    </g>
    <text x="530" y="197" text-anchor="middle">127</text>
    <g filter="url(#sk)">
      <rect x="370" y="216" width="90" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    </g>
    <text x="415" y="237" text-anchor="middle">7</text>
    <g filter="url(#sk)">
      <rect x="480" y="216" width="100" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    </g>
    <text x="530" y="237" text-anchor="middle">255</text>
    <g filter="url(#sk)">
      <rect x="370" y="256" width="90" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    </g>
    <text x="415" y="277" text-anchor="middle">15</text>
    <g filter="url(#sk)">
      <rect x="480" y="256" width="100" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    </g>
    <text x="530" y="277" text-anchor="middle">511</text>
  </g>

  <g filter="url(#sk)">
    <rect x="370" y="298" width="210" height="28" rx="8" fill="#fdf0f0" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="475" y="317" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace">1023 ✗ 超出 n = 1000</text>

  <g filter="url(#sk)">
    <rect x="370" y="336" width="210" height="36" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="475" y="359" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold" font-family="monospace">共 10 个 → 答案 10 ✓</text>

  <text x="320" y="410" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">套路：见到「二进制位满足某性质」的计数题，先想能否直接枚举 / 生成满足性质的数。</text>
</svg>
