<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：dp / g 双轨 DP，占位转移延迟结算未出现值</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">状态 x = 已处理组的异或和，x ∈ [0, 1024)，逐组滚动；绿色竖箭头 = 占位转移（至多一次）</text>

  <!-- dp lane -->
  <rect x="60" y="58" width="440" height="78" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="78" font-size="11.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">dp[x] ｜ 各组全部取「组内出现过的值」</text>
  <text x="80" y="96" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">出现值转移：枚举 v ∈ cnt_j，dp'[x⊕v] ← dp[x] + sz_j − cnt_j[v]</text>

  <rect x="90" y="106" width="56" height="24" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">组 0</text>
  <path d="M 148 118 L 177 118" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="180" y="106" width="56" height="24" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">组 1</text>
  <path d="M 238 118 L 267 118" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="270" y="106" width="56" height="24" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="298" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">组 2</text>
  <path d="M 328 118 L 387 118" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="357" y="122" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">……</text>
  <rect x="390" y="106" width="56" height="24" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="418" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">组 k−1</text>

  <!-- placeholder transition -->
  <path d="M 253 136 L 253 188" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="266" y="160" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">占位转移（至多一次）</text>
  <text x="266" y="175" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">代价 + sz_j，状态 x 不变 —— 取值延后到终点结算</text>

  <!-- g lane -->
  <rect x="60" y="190" width="440" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="210" font-size="11.5" fill="#8a6a1c" font-weight="bold" filter="url(#rough2)">g[x] ｜ 恰有一组取「未出现值」，占位待结算</text>
  <text x="80" y="228" font-size="9.5" fill="#8a6a1c" filter="url(#rough2)">出现值转移：同上，g'[x⊕v] ← g[x] + sz_j − cnt_j[v]</text>

  <rect x="90" y="238" width="56" height="24" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="254" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">组 0</text>
  <path d="M 148 250 L 177 250" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="180" y="238" width="56" height="24" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="254" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">组 1</text>
  <path d="M 238 250 L 267 250" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="270" y="238" width="56" height="24" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="298" y="254" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">组 2</text>
  <path d="M 328 250 L 387 250" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="357" y="254" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">……</text>
  <rect x="390" y="238" width="56" height="24" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="418" y="254" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">组 k−1</text>

  <!-- complexity note -->
  <text x="280" y="284" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">出现值转移合计 O(2¹⁰·Σt_j) ≤ O(2¹⁰·n)；占位转移每轮 O(2¹⁰) —— 总时间 O(2¹⁰·(n+k))</text>

  <!-- settlement -->
  <rect x="60" y="296" width="440" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">结算：ans = min( dp[0] , min_x g[x] )</text>
  <text x="280" y="332" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">占位组的取值被「总异或为零」逼成 x；若 x 恰好出现过，真实代价只会更小</text>

  <!-- lemma box -->
  <rect x="60" y="358" width="440" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="375" font-size="10" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">为什么占位一次就够？（交换论证）</text>
  <text x="280" y="392" text-anchor="middle" font-size="9.5" fill="#8a3a34" filter="url(#rough2)">两组都整组全改太浪费：A 改回组内已有值 a（至少省 1 处），</text>
  <text x="280" y="408" text-anchor="middle" font-size="9.5" fill="#8a3a34" filter="url(#rough2)">B 反正要全改、值调成 f_A ⊕ f_B ⊕ a 保住异或为零 ⇒ 严格更省 ⇒ 至多一组</text>
</svg>
