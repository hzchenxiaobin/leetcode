<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fdfcf7"/>
  <text x="280" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：一条对角线唯一确定轴对齐矩形</text>
  <path d="M 150 42 Q 280 50 410 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- candidate rectangle -->
  <g filter="url(#sk)">
    <rect x="150" y="95" width="230" height="160" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>

  <!-- diagonal -->
  <path d="M 152 253 L 372 99" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7,5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="238" y="188" font-size="13" fill="#b85450" font-weight="bold" transform="rotate(-35 238 188)">给定的对角点对</text>

  <!-- four corner dots -->
  <g filter="url(#sk)">
    <circle cx="150" cy="255" r="7" fill="#b85450"/>
    <circle cx="380" cy="95" r="7" fill="#b85450"/>
    <circle cx="150" cy="95" r="7" fill="#4a7a3a"/>
    <circle cx="380" cy="255" r="7" fill="#4a7a3a"/>
  </g>

  <!-- corner labels -->
  <g font-size="12" fill="#2b2b2b">
    <text x="140" y="280" text-anchor="end" fill="#b85450" font-weight="bold">对角点 (x₁,y₁)</text>
    <text x="390" y="86" text-anchor="start" fill="#b85450" font-weight="bold">对角点 (x₂,y₂)</text>
    <text x="140" y="86" text-anchor="end" fill="#2e6e2e" font-weight="bold">另两角别无选择</text>
    <text x="140" y="100" text-anchor="end" fill="#2e6e2e" font-weight="bold">必为 (x₁,y₂)</text>
    <text x="390" y="280" text-anchor="start" fill="#2e6e2e" font-weight="bold">必为 (x₂,y₁)</text>
  </g>

  <!-- bottom boxes -->
  <g filter="url(#sk)">
    <rect x="40" y="300" width="235" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="157" y="320" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">另两角 = (x₁,y₂)、(x₂,y₁)</text>
  <text x="157" y="338" text-anchor="middle" font-size="12" fill="#2b6e9e">哈希集合里 O(1) 查存在</text>

  <g filter="url(#sk)">
    <rect x="295" y="300" width="225" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="407" y="320" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">面积 = (x₂−x₁)×(y₂−y₁)</text>
  <text x="407" y="338" text-anchor="middle" font-size="11" fill="#9a7a3a">枚举 O(n²) 个点对，代替 O(n⁴) 四点组</text>

  <!-- prerequisite note -->
  <g filter="url(#sk)">
    <rect x="40" y="360" width="480" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="280" y="380" text-anchor="middle" font-size="12" fill="#b85450">前提：x₁ ≠ x₂ 且 y₁ ≠ y₂（同列/同行的点对拉不出矩形）</text>
</svg>
