<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="47"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#446688"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#r)">示例演算：abcyy, t = 2 —— 全程只动计数器</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- top: fast power trace for t=2 -->
  <rect x="42" y="56" width="556" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#r)"/>
  <text x="320" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34507a" filter="url(#r)">t = 2 = (10)₂ 的快速幂轨迹</text>
  <rect x="62" y="90" width="150" height="62" rx="6" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#r)"/>
  <text x="137" y="110" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">e = t = 10₂</text>
  <text x="137" y="128" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">M = M¹</text>
  <text x="137" y="146" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#r)">cnt = cnt₀</text>
  <path d="M 214 121 Q 226 121 238 121" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <rect x="242" y="90" width="150" height="62" rx="6" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" filter="url(#r)"/>
  <text x="317" y="110" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace" filter="url(#r)">最低位 = 0</text>
  <text x="317" y="128" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace" filter="url(#r)">跳过向量乘</text>
  <text x="317" y="146" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace" filter="url(#r)">M ← M²</text>
  <path d="M 394 121 Q 406 121 418 121" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <rect x="422" y="90" width="150" height="62" rx="6" fill="#fafafa" stroke="#b85450" stroke-width="1.5" filter="url(#r)"/>
  <text x="497" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace" filter="url(#r)">最低位 = 1</text>
  <text x="497" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace" filter="url(#r)">cnt ← M²·cnt₀</text>
  <text x="497" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace" filter="url(#r)">e = 0，结束</text>
  <text x="320" y="168" text-anchor="middle" font-size="11" fill="#34507a" filter="url(#r)">全程：1 次矩阵平方 + 1 次向量乘；t = 10⁹ 时也只需 ≤ 30 次平方</text>

  <!-- middle: count vector evolution -->
  <text x="320" y="202" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">计数向量演化（只列非零位）</text>
  <rect x="62" y="212" width="140" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r)"/>
  <text x="132" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">cnt₀（初始）</text>
  <text x="132" y="266" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace" filter="url(#r)">a:1 b:1 c:1 y:2</text>
  <text x="132" y="296" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#r)">总长 5</text>
  <path d="M 206 260 Q 226 260 246 260" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <text x="226" y="250" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#r)">×M</text>
  <rect x="250" y="212" width="140" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r)"/>
  <text x="320" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">cnt₁（t = 1）</text>
  <text x="320" y="266" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace" filter="url(#r)">b:1 c:1 d:1 z:2</text>
  <text x="320" y="296" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#r)">总长 5</text>
  <path d="M 394 260 Q 414 260 434 260" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <text x="414" y="250" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#r)">×M</text>
  <rect x="438" y="212" width="140" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#r)"/>
  <text x="508" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07520" filter="url(#r)">cnt₂（t = 2）</text>
  <text x="508" y="266" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace" filter="url(#r)">a:2 b:2 c:1 d:1 e:1</text>
  <text x="508" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">总长 7 ✓</text>
  <text x="320" y="326" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#r)">第 2 轮两个 z 各展开 "ab"（回绕到表头）⇒ 5 → 7，与 "bcdzz" → "cdeabab" 逐位吻合</text>

  <!-- bottom: example 2 -->
  <rect x="42" y="340" width="556" height="112" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#r)"/>
  <text x="320" y="364" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#r)">示例 2：s = "azbk"，t = 1，nums 全为 2 —— 一轮就翻倍</text>
  <rect x="80" y="384" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="95" y="403" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">a</text>
  <path d="M 112 398 Q 124 398 136 398" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <rect x="140" y="384" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="162" y="403" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">bc</text>
  <rect x="210" y="384" width="30" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#r)"/>
  <text x="225" y="403" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">z</text>
  <path d="M 242 398 Q 254 398 266 398" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <rect x="270" y="384" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#r)"/>
  <text x="292" y="403" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">ab</text>
  <rect x="340" y="384" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="355" y="403" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">b</text>
  <path d="M 372 398 Q 384 398 396 398" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <rect x="400" y="384" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="422" y="403" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">cd</text>
  <rect x="470" y="384" width="30" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="485" y="403" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">k</text>
  <path d="M 502 398 Q 514 398 526 398" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <rect x="530" y="384" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="552" y="403" text-anchor="middle" font-size="13" fill="#333" filter="url(#r)">lm</text>
  <text x="320" y="438" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#r)">⇒ "bcabcdlm"，长度 4 × 2 = 8；z 的展开 (25+k) mod 26 = 0, 1 ⇒ 回绕落在 a、b</text>
</svg>
