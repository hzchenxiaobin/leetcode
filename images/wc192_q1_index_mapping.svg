<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="560" height="410" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">下标映射：一条输入数组 → 交错后的输出数组</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" fill-opacity="1" filter="url(#rough2)">把 nums 看成 x 段与 y 段两半，第 i 对分到输出下标 2i 与 2i+1</text>
  <text x="184" y="74" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">x 段：下标 0 … n−1</text>
  <text x="376" y="74" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">y 段：下标 n … 2n−1</text>
  <path d="M 288 90 L 288 146" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <rect x="92" y="96" width="56" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="124" text-anchor="middle" font-size="13" fill="#33445f" filter="url(#rough2)">x<tspan font-size="8.6" dy="3">1</tspan></text>
  <rect x="156" y="96" width="56" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="184" y="124" text-anchor="middle" font-size="13" fill="#33445f" filter="url(#rough2)">x<tspan font-size="8.6" dy="3">2</tspan></text>
  <rect x="220" y="96" width="56" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="124" text-anchor="middle" font-size="13" fill="#33445f" filter="url(#rough2)">x<tspan font-size="8.6" dy="3">3</tspan></text>
  <rect x="284" y="96" width="56" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="124" text-anchor="middle" font-size="13" fill="#33502c" filter="url(#rough2)">y<tspan font-size="8.6" dy="3">1</tspan></text>
  <rect x="348" y="96" width="56" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="124" text-anchor="middle" font-size="13" fill="#33502c" filter="url(#rough2)">y<tspan font-size="8.6" dy="3">2</tspan></text>
  <rect x="412" y="96" width="56" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="124" text-anchor="middle" font-size="13" fill="#33502c" filter="url(#rough2)">y<tspan font-size="8.6" dy="3">3</tspan></text>
  <path d="M 120 140 C 120 172, 120 218, 120 264" fill="none" stroke="#a8bcd8" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 184 140 C 184 172, 248 218, 248 264" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 248 140 C 248 172, 376 218, 376 264" fill="none" stroke="#a8bcd8" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 312 140 C 312 172, 184 218, 184 264" fill="none" stroke="#a9c4a0" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 376 140 C 376 172, 312 218, 312 264" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 440 140 C 440 172, 440 218, 440 264" fill="none" stroke="#a9c4a0" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="84" y="299" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">res</text>
  <rect x="92" y="270" width="56" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="298" text-anchor="middle" font-size="13" fill="#33445f" filter="url(#rough2)">x<tspan font-size="8.6" dy="3">1</tspan></text>
  <text x="120" y="332" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <rect x="156" y="270" width="56" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="184" y="298" text-anchor="middle" font-size="13" fill="#33502c" filter="url(#rough2)">x<tspan font-size="8.6" dy="3">2</tspan></text>
  <text x="184" y="332" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <rect x="220" y="270" width="56" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="298" text-anchor="middle" font-size="13" fill="#33445f" filter="url(#rough2)">x<tspan font-size="8.6" dy="3">3</tspan></text>
  <text x="248" y="332" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <rect x="284" y="270" width="56" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="298" text-anchor="middle" font-size="13" fill="#33502c" filter="url(#rough2)">y<tspan font-size="8.6" dy="3">1</tspan></text>
  <text x="312" y="332" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <rect x="348" y="270" width="56" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="298" text-anchor="middle" font-size="13" fill="#33445f" filter="url(#rough2)">y<tspan font-size="8.6" dy="3">2</tspan></text>
  <text x="376" y="332" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <rect x="412" y="270" width="56" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="298" text-anchor="middle" font-size="13" fill="#33502c" filter="url(#rough2)">y<tspan font-size="8.6" dy="3">3</tspan></text>
  <text x="440" y="332" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <rect x="40" y="348" width="480" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">res[2i] = nums[i]　　res[2i+1] = nums[n+i]　（0 ≤ i &lt; n）</text>
  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">粗线是 i = 1 这一对：x₂（下标 1）→ res[2]，y₂（下标 4）→ res[3]</text>
</svg>
