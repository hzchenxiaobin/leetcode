<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="480" fill="#fdfcf7"/>
  <text x="360" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：非严格递增——相同高度可「接」，不可「替」</text>
  <path d="M 190 38 Q 360 48 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="360" y="58" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">试金石：全等数组 [2,2,2]。两个二分谓词对相同元素一个「替换自己」、一个「追加」，长度天差地别</text>

  <!-- Row A: lower_bound (wrong) -->
  <text x="56" y="92" font-size="12" font-weight="bold" fill="#a04038" filter="url(#sk)">反面 · lower_bound（第一个 ≥ x，严格递增的写法）</text>

  <text x="110" y="118" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">i=0，x=2</text>
  <rect x="92" y="126" width="36" height="34" rx="5" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="110" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">2</text>
  <text x="110" y="184" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">tails = [2]</text>
  <text x="110" y="202" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">ans[0] = 1</text>
  <path d="M 142 143 L 168 143" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="225" y="118" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">i=1，x=2</text>
  <rect x="207" y="126" width="36" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="225" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038" filter="url(#sk)">2</text>
  <path d="M 225 122 C 212 104 238 102 226 120" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="225" y="184" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">tails = [2]（自己换自己）</text>
  <text x="225" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04038" filter="url(#sk)">ans[1] = 1 ✗</text>
  <path d="M 257 143 L 283 143" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="340" y="118" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">i=2，x=2</text>
  <rect x="322" y="126" width="36" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="340" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04038" filter="url(#sk)">2</text>
  <text x="340" y="184" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">tails = [2]</text>
  <text x="340" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04038" filter="url(#sk)">ans[2] = 1 ✗</text>

  <rect x="440" y="104" width="240" height="106" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="560" y="140" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a04038" filter="url(#sk)">ans = [1, 1, 1]</text>
  <text x="560" y="166" text-anchor="middle" font-size="11" fill="#7a3a36" filter="url(#sk)">相同元素被反复「替换自己」</text>
  <text x="560" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#a04038" filter="url(#sk)">长度卡死在 1 —— 全错！</text>

  <!-- Row B: upper_bound (right) -->
  <text x="56" y="238" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">正面 · upper_bound（第一个 &gt; x，非严格递增的写法）</text>

  <text x="110" y="264" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">i=0，x=2</text>
  <rect x="92" y="272" width="36" height="34" rx="5" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="110" y="294" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">2</text>
  <text x="110" y="330" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">tails = [2]</text>
  <text x="110" y="348" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">ans[0] = 1</text>
  <path d="M 142 289 L 168 289" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="235" y="264" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">i=1，x=2</text>
  <rect x="207" y="272" width="36" height="34" rx="5" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="225" y="294" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">2</text>
  <path d="M 246 289 L 252 289" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arG)" filter="url(#sk)"/>
  <rect x="255" y="272" width="36" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#sk)"/>
  <text x="273" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <text x="235" y="330" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">tails = [2, 2]</text>
  <text x="235" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans[1] = 2 ✓</text>
  <text x="235" y="366" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">没有 &gt; 2 的元素 → pos=len → 追加</text>
  <path d="M 297 289 L 323 289" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="400" y="264" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">i=2，x=2</text>
  <rect x="322" y="272" width="36" height="34" rx="5" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="340" y="294" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">2</text>
  <rect x="368" y="272" width="36" height="34" rx="5" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="386" y="294" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">2</text>
  <rect x="414" y="272" width="36" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="432" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <text x="400" y="330" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">tails = [2, 2, 2]</text>
  <text x="400" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans[2] = 3 ✓</text>

  <rect x="490" y="252" width="200" height="120" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="590" y="288" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = [1, 2, 3]</text>
  <text x="590" y="314" text-anchor="middle" font-size="11" fill="#3d5a34" filter="url(#sk)">相同元素依次「接」上去</text>
  <text x="590" y="336" text-anchor="middle" font-size="11" fill="#3d5a34" filter="url(#sk)">长度稳步增长 ✓</text>
  <text x="590" y="358" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">[2,2]、[2,2,2] 都是合法路线</text>

  <!-- bottom note -->
  <rect x="60" y="392" width="600" height="74" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" filter="url(#sk)"/>
  <text x="360" y="420" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">口诀：二分找的是「破坏递增规则的第一个元素」——严格（&lt;）中 ≥ x 即破坏，用 lower_bound；</text>
  <text x="360" y="446" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">非严格（≤）中 &gt; x 才破坏，用 upper_bound —— 一字之差，全等输入见分晓</text>
</svg>
