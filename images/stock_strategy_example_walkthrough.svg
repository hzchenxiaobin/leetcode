<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="89" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：把亏钱的买入抹掉，白赚一次卖出</text>
  <path d="M 120 42 Q 340 52 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="340" y="72" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">prices=[4,2,8]  strategy=[−1,0,1]  k=2  →  base = −4+0+8 = 4</text>

  <!-- day columns -->
  <g filter="url(#sk)">
    <rect x="120" y="92" width="90" height="110" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="230" y="92" width="90" height="110" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="340" y="92" width="90" height="110" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="165" y="114" text-anchor="middle" font-size="12" fill="#666">第 0 天</text>
  <text x="275" y="114" text-anchor="middle" font-size="12" fill="#666">第 1 天</text>
  <text x="385" y="114" text-anchor="middle" font-size="12" fill="#666">第 2 天</text>
  <text x="165" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" font-family="monospace">p=4</text>
  <text x="275" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" font-family="monospace">p=2</text>
  <text x="385" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" font-family="monospace">p=8</text>
  <text x="165" y="166" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace">s=−1 买入</text>
  <text x="275" y="166" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">s=0 持有</text>
  <text x="385" y="166" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">s=1 卖出</text>
  <text x="165" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace">−4（亏）</text>
  <text x="275" y="190" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">0</text>
  <text x="385" y="190" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">+8</text>

  <!-- window l=0 bracket -->
  <g filter="url(#sk)">
    <path d="M 128 212 Q 165 224 202 212" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#ar3)"/>
  </g>
  <text x="165" y="238" text-anchor="middle" font-size="11.5" fill="#a06a10" font-weight="bold">窗口 l=0（k=2）</text>
  <text x="165" y="256" text-anchor="middle" font-size="11" fill="#666" font-family="monospace">改为 [0, 1]</text>

  <!-- window l=1 bracket -->
  <g filter="url(#sk)">
    <path d="M 348 212 Q 385 224 422 212" stroke="#8aa8c8" stroke-width="2" fill="none" marker-end="url(#ar3)"/>
  </g>
  <text x="470" y="238" text-anchor="middle" font-size="11.5" fill="#6a8aa8" font-weight="bold">窗口 l=1</text>
  <text x="470" y="256" text-anchor="middle" font-size="11" fill="#666" font-family="monospace">改为 [0, 1]</text>

  <!-- computation table -->
  <g filter="url(#sk)">
    <rect x="90" y="278" width="500" height="88" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="118" y="302" font-size="11.5" fill="#2b2b2b" font-weight="bold" font-family="monospace">候选</text>
  <text x="250" y="302" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" font-family="monospace">old（原贡献）</text>
  <text x="400" y="302" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" font-family="monospace">cur（后1天价格和）</text>
  <text x="556" y="302" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" font-family="monospace">base−old+cur</text>
  <g filter="url(#sk)">
    <line x1="100" y1="310" x2="580" y2="310" stroke="#8ab88a" stroke-width="1"/>
    <line x1="100" y1="338" x2="580" y2="338" stroke="#c8dCc8" stroke-width="1" stroke-dasharray="4 3"/>
  </g>
  <text x="118" y="328" font-size="11.5" fill="#a06a10" font-weight="bold" font-family="monospace">l=0</text>
  <text x="250" y="328" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">−4+0 = −4</text>
  <text x="400" y="328" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-family="monospace">p₁ = 2</text>
  <text x="556" y="328" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" font-family="monospace">4+4+2 = 10</text>
  <text x="118" y="356" font-size="11.5" fill="#6a8aa8" font-weight="bold" font-family="monospace">l=1</text>
  <text x="250" y="356" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">0+8 = 8</text>
  <text x="400" y="356" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-family="monospace">p₂ = 8</text>
  <text x="556" y="356" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">4−8+8 = 4</text>

  <!-- answer box -->
  <g filter="url(#sk)">
    <rect x="200" y="380" width="280" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="340" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a2e2a" font-family="monospace">ans = max(4, 10, 4) = 10 ✓</text>
</svg>
