<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough1">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="420" fill="#fafafa"/>

  <text x="340" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    两条隐藏边：同一对连通块 + 奇偶相反
  </text>
  <text x="340" y="54" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">
    其余连通块可以整体翻色，提供不了约束，所以两条边只能“共享”同一对块
  </text>

  <!-- ================= component A ================= -->
  <rect x="30" y="66" width="200" height="184" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="88" text-anchor="middle" font-size="14" fill="#2f4f6f" filter="url(#rough2)">连通块 A</text>

  <line x1="105" y1="122" x2="185" y2="122" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="105" y1="122" x2="105" y2="200" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="105" y1="200" x2="185" y2="200" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <circle cx="105" cy="122" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="105" cy="200" r="13" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="185" cy="122" r="13" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="185" cy="200" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="185" y="106" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">a₁</text>
  <text x="185" y="230" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">a₂</text>

  <!-- ================= component B ================= -->
  <rect x="450" y="66" width="200" height="184" rx="10" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="550" y="88" text-anchor="middle" font-size="14" fill="#3c6330" filter="url(#rough2)">连通块 B</text>

  <line x1="495" y1="122" x2="585" y2="122" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="585" y1="122" x2="495" y2="200" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="495" y1="200" x2="585" y2="200" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <circle cx="495" cy="122" r="13" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="585" cy="122" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="495" cy="200" r="13" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="585" cy="200" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="495" y="106" text-anchor="middle" font-size="12" fill="#3c6330" filter="url(#rough2)">b₁</text>
  <text x="495" y="230" text-anchor="middle" font-size="12" fill="#3c6330" filter="url(#rough2)">b₂</text>

  <!-- ================= hidden edges ================= -->
  <path d="M 201 118 C 285 94 375 94 477 114" fill="none" stroke="#b85450"
        stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="88" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    e₁ ： p(a₁) ⊕ p(b₁) = 0
  </text>

  <path d="M 201 204 C 285 230 375 230 477 208" fill="none" stroke="#4a7a3a"
        stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="252" text-anchor="middle" font-size="13" fill="#3c6330" filter="url(#rough2)">
    e₂ ： p(a₂) ⊕ p(b₂) = 1
  </text>

  <!-- legend -->
  <circle cx="52" cy="272" r="8" fill="#dbe7fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="277" font-size="11" fill="#555" filter="url(#rough2)">染色 0</text>
  <circle cx="132" cy="272" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="146" y="277" font-size="11" fill="#555" filter="url(#rough2)">染色 1</text>
  <text x="620" y="277" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">
    0 ≠ 1 ⇒ 出现奇圈
  </text>

  <!-- ================= conclusion box ================= -->
  <rect x="36" y="296" width="608" height="102" rx="10" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.8" filter="url(#rough1)"/>
  <text x="340" y="322" text-anchor="middle" font-size="14" fill="#8c3a36" filter="url(#rough2)">
    奇圈的唯一形状：e₁ + P_A(a₁,a₂) + e₂ + P_B(b₁,b₂)
  </text>
  <text x="340" y="348" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    每个奇圈都同时含 4 个端点；于是若 S 与每块之交连通（或空），则
  </text>
  <text x="340" y="376" text-anchor="middle" font-size="14" fill="#2f4f6f" filter="url(#rough2)">
    G'[S] 非二分 ⟺ 四个端点全在 S 内
  </text>
</svg>
