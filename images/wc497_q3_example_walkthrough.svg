<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：s = "100001" → 答案 4</text>

  <!-- 字符行 -->
  <rect x="105" y="40" width="42" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="126" y="65" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="157" y="40" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="178" y="65" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="209" y="40" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="65" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="261" y="40" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="65" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="313" y="40" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="334" y="65" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="365" y="40" width="42" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="386" y="65" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <text x="126" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="178" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="230" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="282" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
  <text x="334" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>
  <text x="386" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">5</text>

  <!-- 前缀和行：P[k] 画在位置 k（第 k 个字符的左边界） -->
  <text x="62" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">P =</text>
  <rect x="88" y="112" width="34" height="26" rx="4" fill="#f5f5f5" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <rect x="140" y="112" width="34" height="26" rx="4" fill="#f5f5f5" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="157" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="192" y="112" width="34" height="26" rx="4" fill="#f5f5f5" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="209" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <rect x="244" y="112" width="34" height="26" rx="4" fill="#f5f5f5" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="261" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="296" y="112" width="34" height="26" rx="4" fill="#f5f5f5" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="313" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="348" y="112" width="34" height="26" rx="4" fill="#f5f5f5" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="390" y="112" width="34" height="26" rx="4" fill="#f5f5f5" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="407" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">−2</text>
  <text x="280" y="158" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">P[k] 画在位置 k（第 k 个字符的左边界），d(l,r) = P[r+1] − P[l]</text>

  <!-- 方案 ①：窗口 [0,3]，'1' 在右侧（下标 5） -->
  <text x="30" y="182" font-size="12" fill="#333" filter="url(#rough2)">① 窗口 [0,3] = "1000"：d = P[4] − P[0] = −2，右侧外部有 '1'（下标 5）</text>

  <rect x="116" y="186" width="140" height="40" rx="6" fill="none" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="120" y="190" width="30" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="211" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="154" y="190" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="169" y="211" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="188" y="190" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="203" y="211" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="222" y="190" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="237" y="211" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="256" y="190" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="271" y="211" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="290" y="190" width="30" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="305" y="211" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <path d="M 237 228 C 237 244, 305 244, 305 228" fill="none" stroke="#b85450" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="262" font-size="12" fill="#4a7a3a" filter="url(#rough2)">交换 s[3] ↔ s[5]：s 变为 "100100"，窗口 [0,3] = "1001"，平衡 ✓，长度 4</text>

  <!-- 方案 ②：窗口 [2,5]，'1' 在左侧（下标 0） -->
  <text x="30" y="288" font-size="12" fill="#333" filter="url(#rough2)">② 窗口 [2,5] = "0001"：d = P[6] − P[2] = −2，左侧外部有 '1'（下标 0）</text>

  <rect x="184" y="292" width="140" height="40" rx="6" fill="none" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="120" y="296" width="30" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="135" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="154" y="296" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="169" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="188" y="296" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="203" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="222" y="296" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="256" y="296" width="30" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="271" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="290" y="296" width="30" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="305" y="317" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <path d="M 135 334 C 135 350, 203 350, 203 334" fill="none" stroke="#b85450" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="368" font-size="12" fill="#4a7a3a" filter="url(#rough2)">交换 s[0] ↔ s[2]：s 变为 "001001"，窗口 [2,5] = "1001"，平衡 ✓，长度 4</text>

  <!-- 答案框 -->
  <rect x="25" y="380" width="510" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="403" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">不交换（d=0）最长只有 2（"10"、"01"）；本例没有 d=+2 的窗口</text>
  <text x="280" y="426" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = max(2, 4) = 4</text>
</svg>
