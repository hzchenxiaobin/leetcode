<svg xmlns="http://www.w3.org/2000/svg" width="820" height="436" viewBox="0 0 820 436"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="820" height="436" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">数位 DP：低位 → 高位，一边算 u = r + 2t 一边和 B 比大小</text>
  <path d="M 76 43 Q 410 50 744 43" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="410" y="66" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">u_p = r_p + t_(p−1)，因为 r 没有相邻的 1，所以两项不会同时为 1 ⇒ 逐位无进位</text>

  <!-- 位示意 -->
  <text x="52" y="100" font-size="12" fill="#66788c" filter="url(#rough2)">r 的位（无相邻 1）：</text>
  <rect x="100" y="108" width="62" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="131" y="129" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">r_(p−1)</text>
  <rect x="176" y="108" width="62" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="207" y="129" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">r_p</text>
  <rect x="252" y="108" width="62" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="283" y="129" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">r_(p+1)</text>

  <text x="52" y="164" font-size="12" fill="#66788c" filter="url(#rough2)">t 的位（t ⊆ r）：</text>
  <rect x="100" y="172" width="62" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="131" y="193" text-anchor="middle" font-size="13" fill="#8a6a1f" filter="url(#rough2)">t_(p−1)</text>
  <rect x="176" y="172" width="62" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="207" y="193" text-anchor="middle" font-size="13" fill="#8a6a1f" filter="url(#rough2)">t_p</text>
  <rect x="252" y="172" width="62" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="283" y="193" text-anchor="middle" font-size="13" fill="#8a6a1f" filter="url(#rough2)">t_(p+1)</text>

  <!-- u_p 汇聚 -->
  <path d="M 207 140 L 207 214 L 236 214" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 131 204 L 131 232 L 236 232" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="240" y="206" width="86" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="283" y="231" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">u_p</text>

  <text x="52" y="278" font-size="12" fill="#446688" filter="url(#rough2)">r_p = 1 ⇒ p &lt; m 且 r_(p−1) = 0 ⇒ t_(p−1) = 0，于是 u_p = 1；</text>
  <text x="52" y="300" font-size="12" fill="#446688" filter="url(#rough2)">r_p = 0 ⇒ u_p = t_(p−1)；t_p = 1 只允许 r_p = 1 时出现。</text>
  <text x="52" y="330" font-size="12" fill="#b85450" filter="url(#rough2)">位宽 K = m + 2：由 r &lt; 2^m、t ⊆ r 得 u = r + 2t ≤ 3(2^m − 1) &lt; 2^K。</text>
  <text x="52" y="352" font-size="12" fill="#b85450" filter="url(#rough2)">超过 m 的位禁止 r_p = 1（这正是 r &lt; 2^m 的约束）。</text>

  <!-- 右侧流程 -->
  <rect x="452" y="86" width="336" height="42" rx="8" fill="#ffffff" stroke="#8c9bab" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="620" y="112" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">状态：(借位, r_(p−1), t_(p−1))，共 6 种</text>

  <path d="M 620 132 L 620 148" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="452" y="152" width="336" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="620" y="174" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">选 (r_p, t_p) = (0,0)，或 (1,0)，或 (1,1)</text>
  <text x="620" y="194" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">（后两者要求 p &lt; m 且 r_(p−1) = 0）</text>

  <path d="M 620 210 L 620 226" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="452" y="230" width="336" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="620" y="252" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">u_p = r_p + t_(p−1)，d = B_p − u_p − 借位</text>
  <text x="620" y="272" text-anchor="middle" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">新借位 = 1（若 d &lt; 0），否则 0</text>

  <path d="M 620 288 L 620 304" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="452" y="308" width="336" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="620" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">结束后借位 = 0 ⇔ u ≤ B</text>

  <text x="410" y="392" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">这等价于在 K 位上做无符号减法 B − u：借位为 0 表示 B ≥ u。</text>
  <text x="410" y="416" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">每组只需一趟 O(log n)；若 B ≥ 3(2^m − 1)，所有 (r,t) 都合法，直接取整组 A_h。</text>
</svg>
