<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：排序后逐列取最大，7 + 5 + 3 = 15</text>

  <!-- 排序后矩阵 + 列最大行 -->
  <g filter="url(#rough2)" font-size="14">
    <!-- 行 1 -->
    <rect x="90" y="60" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="122" y="85" text-anchor="middle" fill="#2f4a66">1</text>
    <rect x="154" y="60" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="186" y="85" text-anchor="middle" fill="#2f4a66">2</text>
    <rect x="218" y="60" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="250" y="85" text-anchor="middle" fill="#2f4a66">7</text>
    <!-- 行 2 -->
    <rect x="90" y="104" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="122" y="129" text-anchor="middle" fill="#2f4a66">2</text>
    <rect x="154" y="104" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="186" y="129" text-anchor="middle" fill="#2f4a66">4</text>
    <rect x="218" y="104" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="250" y="129" text-anchor="middle" fill="#2f4a66">6</text>
    <!-- 行 3 -->
    <rect x="90" y="148" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="122" y="173" text-anchor="middle" fill="#2f4a66">3</text>
    <rect x="154" y="148" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="186" y="173" text-anchor="middle" fill="#2f4a66">5</text>
    <rect x="218" y="148" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="250" y="173" text-anchor="middle" fill="#2f4a66">6</text>
    <!-- 行 4 -->
    <rect x="90" y="192" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="122" y="217" text-anchor="middle" fill="#2f4a66">1</text>
    <rect x="154" y="192" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="186" y="217" text-anchor="middle" fill="#2f4a66">2</text>
    <rect x="218" y="192" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="250" y="217" text-anchor="middle" fill="#2f4a66">3</text>

    <!-- 列最大行 -->
    <rect x="90" y="244" width="64" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="122" y="269" text-anchor="middle" fill="#8c3a36">1</text>
    <rect x="154" y="244" width="64" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="186" y="269" text-anchor="middle" fill="#8c3a36">2</text>
    <rect x="218" y="244" width="64" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="250" y="269" text-anchor="middle" fill="#8c3a36">3</text>
    <text x="160" y="262" font-size="11" fill="#8c3a36">（列：第 3 大）</text>
  </g>
  <text x="66" y="269" font-size="12" fill="#8c3a36" filter="url(#rough2)">列最大</text>

  <!-- 轮次标注 -->
  <g filter="url(#rough2)" font-size="12.5">
    <text x="330" y="82" fill="#7a5a10">轮 1：各行第 1 大</text>
    <text x="330" y="100" fill="#7a5a10">{7, 6, 6, 3} → 得分 +7</text>
    <text x="330" y="130" fill="#2f5527">轮 2：各行第 2 大</text>
    <text x="330" y="148" fill="#2f5527">{2, 4, 5, 2} → 得分 +5</text>
    <text x="330" y="178" fill="#446688">轮 3：各行第 3 大</text>
    <text x="330" y="196" fill="#446688">{1, 2, 3, 1} → 得分 +3</text>
  </g>

  <rect x="330" y="228" width="170" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="415" y="250" text-anchor="middle" font-size="14" fill="#2f5527" filter="url(#rough2)">总分 7+5+3 = 15</text>

  <text x="46" y="86" font-size="12" fill="#666" filter="url(#rough2)">升序</text>
</svg>
