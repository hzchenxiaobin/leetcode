<svg xmlns="http://www.w3.org/2000/svg" width="620" height="420" viewBox="0 0 620 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="420" fill="#fafafa"/>
  <text x="310.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">电话遮蔽：国家代码位数决定前缀</text>
  <path d="M 160.0 44 Q 310.0 54 460.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="120" y="88" width="440" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="175.0" y="107.04" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">数字总位数</text>
  <text x="290.0" y="107.04" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">国家码位数</text>
  <text x="455.0" y="107.04" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">输出格式</text>
  <g filter="url(#rough2)"><rect x="120" y="116" width="440" height="28" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="175.0" y="135.6" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="290.0" y="135.6" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="455.0" y="135.6" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">***-***-XXXX</text>
  <g filter="url(#rough2)"><rect x="120" y="144" width="440" height="28" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="175.0" y="163.6" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <text x="290.0" y="163.6" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="455.0" y="163.6" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">+*-***-***-XXXX</text>
  <g filter="url(#rough2)"><rect x="120" y="172" width="440" height="28" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="175.0" y="191.6" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12</text>
  <text x="290.0" y="191.6" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="455.0" y="191.6" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">+**-***-***-XXXX</text>
  <g filter="url(#rough2)"><rect x="120" y="200" width="440" height="28" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="175.0" y="219.6" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">13</text>
  <text x="290.0" y="219.6" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="455.0" y="219.6" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">+***-***-***-XXXX</text>
  <text x="310" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">示例：1(234)567-890</text>
  <text x="310" y="340" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">共 10 位数字 → 国家码 0 位 → ***-***-7890</text>
  <g filter="url(#rough2)"><rect x="120" y="358" width="380" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="310.0" y="380" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">** 的个数恰好等于国家码位数，最后 4 位始终保留</text>
  </svg>