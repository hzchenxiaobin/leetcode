<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 366" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="366" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">树状数组：区间加 delta + 单点求前缀和</text>
  <text x="290" y="47" text-anchor="middle" font-size="11" fill="#888">差分思想：区间 [L, R] 加 delta ⇔ 在 L 加 delta、在 R+1 减 delta</text>

  <rect x="40" y="64" width="240" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="84" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">更新 [1, u, v, w']</text>
  <text x="160" y="102" text-anchor="middle" font-size="10" fill="#666">child ← 更深的一端（parent[u]==v ? u : v）</text>
  <text x="160" y="119" text-anchor="middle" font-size="10" fill="#666">delta ← w' − upWeight[child]</text>

  <path d="M 284 100 L 316 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="320" y="64" width="220" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="84" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">子树内所有点距离整体 +delta</text>
  <text x="430" y="102" text-anchor="middle" font-size="10" fill="#666">= 区间 [tin[child], tout[child]] 加 delta</text>
  <text x="430" y="119" text-anchor="middle" font-size="10" fill="#666">子树外的点完全不受影响</text>

  <path d="M 430 134 L 430 152" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="156" width="200" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="177" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">add(tin[child], delta)</text>
  <text x="180" y="195" text-anchor="middle" font-size="10" fill="#666">在区间左端打一个 +delta</text>
  <text x="180" y="210" text-anchor="middle" font-size="9.5" fill="#888">树状数组单点加</text>

  <rect x="300" y="156" width="220" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="177" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">add(tout[child] + 1, −delta)</text>
  <text x="410" y="195" text-anchor="middle" font-size="10" fill="#666">在区间右端之后抵消掉</text>
  <text x="410" y="210" text-anchor="middle" font-size="9.5" fill="#888">越界时循环条件自然跳过</text>

  <path d="M 180 216 L 180 234 L 290 234 L 290 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 216 L 410 234 L 290 234" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <rect x="140" y="256" width="300" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="10" filter="url(#rough2)"/>
  <text x="290" y="277" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">查询 [2, x]：dist[x] + prefix(tin[x])</text>
  <text x="290" y="295" text-anchor="middle" font-size="10" fill="#666">dist 是建树时的初始距离，prefix 是累积的增量</text>

  <text x="290" y="326" text-anchor="middle" font-size="10" fill="#777">建树一次 O(n)，每次更新 2 次单点加，每次查询 1 次前缀和</text>
  <text x="290" y="344" text-anchor="middle" font-size="10" fill="#777">每次操作 O(log n)，总计 O((n + q) log n)</text>
  <text x="290" y="362" text-anchor="middle" font-size="9.5" fill="#999">答案是 int 范围：最远 10⁵ 条边 × 10⁴ ≤ 10⁹</text>
</svg>
