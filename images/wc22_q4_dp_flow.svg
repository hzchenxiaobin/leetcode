<svg xmlns="http://www.w3.org/2000/svg" width="730" height="450" viewBox="0 0 730 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#aaaaaa"/>
    </marker>
  </defs>
  <rect width="730" height="450" fill="#fafafa" filter="url(#rough2)"/>
  <text x="365.0" y="26.0" text-anchor="middle" font-size="14.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">转移流程：逐层只保留 ring[j] = key[i] 的位置，层间用环形距离松弛</text>
  <path d="M 60 38 Q 365.0 48 670 38" fill="none" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="104.0" y="62.0" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-weight="bold" filter="url(#rough2)">i = 0  key[0] = 'g'</text>
  <path d="M 20 72 L 188 72" fill="none" stroke="#bbbbbb" stroke-width="1.1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="356.0" y="62.0" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-weight="bold" filter="url(#rough2)">i = 1  key[1] = 'd'</text>
  <path d="M 272 72 L 440 72" fill="none" stroke="#bbbbbb" stroke-width="1.1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="600.0" y="62.0" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-weight="bold" filter="url(#rough2)">i = 2  key[2] = 'd'</text>
  <path d="M 516 72 L 684 72" fill="none" stroke="#bbbbbb" stroke-width="1.1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 156 138 C 230.0 108, 230.0 108, 304 138" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="230.0" y="130.0" text-anchor="middle" font-size="11" fill="#8f3830" font-weight="bold" filter="url(#rough2)">+3</text>
  <path d="M 156 138 C 230.0 152, 230.0 282, 304 268" fill="none" stroke="#c9c9c9" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="204.0" y="192.0" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">+4</text>
  <path d="M 156 268 C 230.0 282, 230.0 152, 304 138" fill="none" stroke="#c9c9c9" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="258.0" y="218.0" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">+4</text>
  <path d="M 156 268 C 230.0 282, 230.0 282, 304 268" fill="none" stroke="#c9c9c9" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="230.0" y="284.0" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">+3</text>
  <path d="M 408 138 C 478.0 108, 478.0 108, 548 138" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="478.0" y="130.0" text-anchor="middle" font-size="11" fill="#8f3830" font-weight="bold" filter="url(#rough2)">+1</text>
  <path d="M 408 138 C 478.0 152, 478.0 282, 548 268" fill="none" stroke="#c9c9c9" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="452.0" y="192.0" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">+2</text>
  <path d="M 408 268 C 478.0 282, 478.0 152, 548 138" fill="none" stroke="#c9c9c9" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="506.0" y="218.0" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">+2</text>
  <path d="M 408 268 C 478.0 282, 478.0 282, 548 268" fill="none" stroke="#c9c9c9" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="478.0" y="284.0" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">+1</text>
  <rect x="52.0" y="118.0" width="104.0" height="40.0" rx="6" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="104.0" y="135.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">j=0  'g'</text>
  <text x="104.0" y="151.0" text-anchor="middle" font-size="11" fill="#8f3830" font-weight="bold" filter="url(#rough2)">dp = 1</text>
  <rect x="52.0" y="248.0" width="104.0" height="40.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104.0" y="265.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">j=6  'g'</text>
  <text x="104.0" y="281.0" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dp = 2</text>
  <rect x="304.0" y="118.0" width="104.0" height="40.0" rx="6" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="356.0" y="135.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">j=2  'd'</text>
  <text x="356.0" y="151.0" text-anchor="middle" font-size="11" fill="#8f3830" font-weight="bold" filter="url(#rough2)">dp = 4</text>
  <rect x="304.0" y="248.0" width="104.0" height="40.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="356.0" y="265.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">j=3  'd'</text>
  <text x="356.0" y="281.0" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dp = 5</text>
  <rect x="548.0" y="118.0" width="104.0" height="40.0" rx="6" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="600.0" y="135.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">j=2  'd'</text>
  <text x="600.0" y="151.0" text-anchor="middle" font-size="11" fill="#8f3830" font-weight="bold" filter="url(#rough2)">dp = 5</text>
  <rect x="548.0" y="248.0" width="104.0" height="40.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="600.0" y="265.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">j=3  'd'</text>
  <text x="600.0" y="281.0" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dp = 6</text>
  <rect x="60.0" y="314.0" width="240.0" height="82.0" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180.0" y="336.0" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold" filter="url(#rough2)">最优路径 0 → 2 → 2</text>
  <text x="180.0" y="356.0" text-anchor="middle" font-size="11" fill="#8f3830" filter="url(#rough2)">1 + (2+1) = 4 → dp=4</text>
  <text x="180.0" y="374.0" text-anchor="middle" font-size="11" fill="#8f3830" filter="url(#rough2)">4 + (0+1) = 5 → 答案 5</text>
  <text x="180.0" y="390.0" text-anchor="middle" font-size="10" fill="#8f3830" filter="url(#rough2)">（key = "gdd" 时）</text>
  <rect x="330.0" y="314.0" width="330.0" height="82.0" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="495.0" y="336.0" text-anchor="middle" font-size="11.5" fill="#2e5a24" font-weight="bold" filter="url(#rough2)">层内规模：|候选(k)| × |候选(j)| ≤ n²</text>
  <text x="495.0" y="356.0" text-anchor="middle" font-size="11.5" fill="#2e5a24" filter="url(#rough2)">共 m 层 ⇒ 时间 O(m·n²) ≤ 10⁶</text>
  <text x="495.0" y="374.0" text-anchor="middle" font-size="11.5" fill="#2e5a24" filter="url(#rough2)">空间只需保留上一层 dp ⇒ O(n)</text>
  <text x="495.0" y="390.0" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">灰色虚线 = 未被选中的候选边</text>
  <text x="365.0" y="424.0" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">关键剪枝：非目标字符的位置永不入层，把 n² 的松弛压到「字符出现次数²」</text>
  <text x="365.0" y="442.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">边界：i = 0 时 dp[0][j] = dist(0, j) + 1（起点固定在 ring[0]）</text>
</svg>
