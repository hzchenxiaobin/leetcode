<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="83" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="#fdfcf7"/>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：五轮「弹顶 × 2 塞回」，并列取最前出现两次</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#666">nums = [2,1,3,5,6]，k = 5，multiplier = 2</text>

  <!-- 面板框 -->
  <g filter="url(#sk)">
    <rect x="34" y="64" width="132" height="110" rx="10" fill="#fffdf3" stroke="#d8d8d8" stroke-width="1.2"/>
    <rect x="186" y="64" width="132" height="110" rx="10" fill="#fffdf3" stroke="#d8d8d8" stroke-width="1.2"/>
    <rect x="338" y="64" width="132" height="110" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="490" y="64" width="132" height="110" rx="10" fill="#fffdf3" stroke="#d8d8d8" stroke-width="1.2"/>
    <rect x="642" y="64" width="132" height="110" rx="10" fill="#fffdf3" stroke="#d8d8d8" stroke-width="1.2"/>
    <rect x="794" y="64" width="132" height="110" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>

  <g font-size="11" fill="#444" text-anchor="middle">
    <text x="100" y="84" font-weight="bold">初始</text>
    <text x="252" y="84" font-weight="bold">① 弹 (1,1) ×2</text>
    <text x="404" y="84" font-weight="bold" fill="#7a5415">② 弹 (2,0) ×2 ←并列</text>
    <text x="556" y="84" font-weight="bold">③ 弹 (2,1) ×2</text>
    <text x="708" y="84" font-weight="bold">④ 弹 (3,2) ×2</text>
    <text x="860" y="84" font-weight="bold" fill="#7a5415">⑤ 弹 (4,0) ×2 ←并列</text>
  </g>

  <!-- 面板间箭头 -->
  <g stroke="#3a3a3a" stroke-width="1.5" filter="url(#sk)">
    <path d="M 170 108 L 182 108" marker-end="url(#ar)"/>
    <path d="M 322 108 L 334 108" marker-end="url(#ar)"/>
    <path d="M 474 108 L 486 108" marker-end="url(#ar)"/>
    <path d="M 626 108 L 638 108" marker-end="url(#ar)"/>
    <path d="M 778 108 L 790 108" marker-end="url(#ar)"/>
  </g>

  <!-- P0 初始 [2,1,3,5,6] -->
  <g font-size="13">
    <rect x="41" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="52" y="110" text-anchor="middle" fill="#2b4a6e">2</text>
    <rect x="65" y="92" width="22" height="26" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
    <text x="76" y="110" text-anchor="middle" fill="#b03a3a" font-weight="bold">1</text>
    <rect x="89" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="100" y="110" text-anchor="middle" fill="#2b4a6e">3</text>
    <rect x="113" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="124" y="110" text-anchor="middle" fill="#2b4a6e">5</text>
    <rect x="137" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="148" y="110" text-anchor="middle" fill="#2b4a6e">6</text>
  </g>

  <!-- P1 [2,2,3,5,6] idx1 变 -->
  <g font-size="13">
    <rect x="193" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="204" y="110" text-anchor="middle" fill="#2b4a6e">2</text>
    <rect x="217" y="92" width="22" height="26" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" filter="url(#sk)"/>
    <text x="228" y="110" text-anchor="middle" fill="#7a5415" font-weight="bold">2</text>
    <rect x="241" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="252" y="110" text-anchor="middle" fill="#2b4a6e">3</text>
    <rect x="265" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="276" y="110" text-anchor="middle" fill="#2b4a6e">5</text>
    <rect x="289" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="300" y="110" text-anchor="middle" fill="#2b4a6e">6</text>
  </g>

  <!-- P2 [4,2,3,5,6] idx0 变（并列取前） -->
  <g font-size="13">
    <rect x="345" y="92" width="22" height="26" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" filter="url(#sk)"/>
    <text x="356" y="110" text-anchor="middle" fill="#7a5415" font-weight="bold">4</text>
    <rect x="369" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="380" y="110" text-anchor="middle" fill="#2b4a6e">2</text>
    <rect x="393" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="404" y="110" text-anchor="middle" fill="#2b4a6e">3</text>
    <rect x="417" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="428" y="110" text-anchor="middle" fill="#2b4a6e">5</text>
    <rect x="441" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="452" y="110" text-anchor="middle" fill="#2b4a6e">6</text>
  </g>

  <!-- P3 [4,4,3,5,6] idx1 变 -->
  <g font-size="13">
    <rect x="497" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="508" y="110" text-anchor="middle" fill="#2b4a6e">4</text>
    <rect x="521" y="92" width="22" height="26" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" filter="url(#sk)"/>
    <text x="532" y="110" text-anchor="middle" fill="#7a5415" font-weight="bold">4</text>
    <rect x="545" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="556" y="110" text-anchor="middle" fill="#2b4a6e">3</text>
    <rect x="569" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="580" y="110" text-anchor="middle" fill="#2b4a6e">5</text>
    <rect x="593" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="604" y="110" text-anchor="middle" fill="#2b4a6e">6</text>
  </g>

  <!-- P4 [4,4,6,5,6] idx2 变 -->
  <g font-size="13">
    <rect x="649" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="660" y="110" text-anchor="middle" fill="#2b4a6e">4</text>
    <rect x="673" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="684" y="110" text-anchor="middle" fill="#2b4a6e">4</text>
    <rect x="697" y="92" width="22" height="26" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" filter="url(#sk)"/>
    <text x="708" y="110" text-anchor="middle" fill="#7a5415" font-weight="bold">6</text>
    <rect x="721" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="732" y="110" text-anchor="middle" fill="#2b4a6e">5</text>
    <rect x="745" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="756" y="110" text-anchor="middle" fill="#2b4a6e">6</text>
  </g>

  <!-- P5 [8,4,6,5,6] idx0 变（并列取前，最终答案） -->
  <g font-size="13">
    <rect x="801" y="92" width="22" height="26" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" filter="url(#sk)"/>
    <text x="812" y="110" text-anchor="middle" fill="#7a5415" font-weight="bold">8</text>
    <rect x="825" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="836" y="110" text-anchor="middle" fill="#2b4a6e">4</text>
    <rect x="849" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="860" y="110" text-anchor="middle" fill="#2b4a6e">6</text>
    <rect x="873" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="884" y="110" text-anchor="middle" fill="#2b4a6e">5</text>
    <rect x="897" y="92" width="22" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk)"/>
    <text x="908" y="110" text-anchor="middle" fill="#2b4a6e">6</text>
  </g>

  <!-- 下标标注 -->
  <g font-size="8" fill="#999" text-anchor="middle">
    <text x="52" y="130">0</text><text x="76" y="130">1</text><text x="100" y="130">2</text><text x="124" y="130">3</text><text x="148" y="130">4</text>
    <text x="204" y="130">0</text><text x="228" y="130">1</text><text x="252" y="130">2</text><text x="276" y="130">3</text><text x="300" y="130">4</text>
    <text x="356" y="130">0</text><text x="380" y="130">1</text><text x="404" y="130">2</text><text x="428" y="130">3</text><text x="452" y="130">4</text>
    <text x="508" y="130">0</text><text x="532" y="130">1</text><text x="556" y="130">2</text><text x="580" y="130">3</text><text x="604" y="130">4</text>
    <text x="660" y="130">0</text><text x="684" y="130">1</text><text x="708" y="130">2</text><text x="732" y="130">3</text><text x="756" y="130">4</text>
    <text x="812" y="130">0</text><text x="836" y="130">1</text><text x="860" y="130">2</text><text x="884" y="130">3</text><text x="908" y="130">4</text>
  </g>

  <!-- k 徽标 -->
  <g font-size="11" fill="#8e5db8" font-weight="bold" text-anchor="middle">
    <text x="100" y="158">k = 5</text>
    <text x="252" y="158">k = 4</text>
    <text x="404" y="158">k = 3</text>
    <text x="556" y="158">k = 2</text>
    <text x="708" y="158">k = 1</text>
    <text x="860" y="158">k = 0 → 返回</text>
  </g>

  <!-- 并列取最前说明 -->
  <rect x="36" y="192" width="440" height="78" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" filter="url(#sk)"/>
  <text x="52" y="216" font-size="12.5" fill="#7a5415" font-weight="bold">「并列取最前」在本例出现两次</text>
  <g font-size="11" fill="#444">
    <text x="52" y="240">第②轮：两个 2 并列，堆中 (2,0) 与 (2,1) 值相等</text>
    <text x="52" y="258">→ 比下标 → 弹 (2,0)；第⑤轮两个 4 并列同理弹 (4,0)</text>
  </g>

  <!-- 原地成答说明 -->
  <rect x="516" y="192" width="408" height="78" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="532" y="216" font-size="12.5" fill="#2e6e2e" font-weight="bold">同步写回，原数组即答案</text>
  <g font-size="11" fill="#444">
    <text x="532" y="240">每轮弹出的下标 i 顺手执行 nums[i] ← 新值，</text>
  </g>
  <text x="532" y="258" font-size="11" fill="#2e6e2e" font-weight="bold">五轮跑完 nums = [8,4,6,5,6] 就是返回值 ✓</text>

  <!-- 连续被乘横条 -->
  <rect x="36" y="286" width="888" height="56" rx="8" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.3" filter="url(#sk)"/>
  <text x="480" y="308" text-anchor="middle" font-size="12" fill="#5a3a7a" font-weight="bold">对照：同一元素连续被乘（乘完仍是全局最小时）</text>
  <text x="480" y="330" text-anchor="middle" font-size="11" fill="#444">nums = [1,100]、k = 3、m = 2：弹 (1,0)→2 仍最小 → 再弹 → 4 仍最小 → 再弹 → [8,100]，首元素连乘三次——堆不「嫌弃」刚塞回的元素</text>

  <text x="480" y="372" text-anchor="middle" font-size="10.5" fill="#888">堆视角：被乘的格子值变大后自动「沉」下去，下一轮自然轮到别的最小格子——乘法在堆上完成了一次自我调度</text>
</svg>
