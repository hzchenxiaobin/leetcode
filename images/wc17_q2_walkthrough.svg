<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold"
        filter="url(#rough2)">示例演算：timeSeries = [1, 2, 5]，duration = 2</text>
  <text x="310" y="52" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">基准 duration 秒 + 每个间隔的 min(duration, gap)</text>

  <!-- 表头 -->
  <rect x="55" y="64" width="510" height="30" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">i</text>
  <text x="220" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">t[i]</text>
  <text x="330" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">gap</text>
  <text x="440" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">min(2, gap)</text>
  <text x="540" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">累计 ans</text>

  <!-- 行 0 -->
  <rect x="55" y="94" width="510" height="30" fill="#fafafa" stroke="#ccd6e4"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="114" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">0（起点）</text>
  <text x="220" y="114" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="330" y="114" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="440" y="114" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">+2（基准）</text>
  <text x="540" y="114" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">2</text>

  <!-- 行 1 -->
  <rect x="55" y="124" width="510" height="30" fill="#ffffff" stroke="#ccd6e4"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="144" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="220" y="144" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="330" y="144" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="440" y="144" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="540" y="144" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">3</text>

  <!-- 行 2 -->
  <rect x="55" y="154" width="510" height="30" fill="#fafafa" stroke="#ccd6e4"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="174" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="220" y="174" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">5</text>
  <text x="330" y="174" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="440" y="174" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">2</text>
  <text x="540" y="174" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">5</text>

  <text x="310" y="206" text-anchor="middle" font-size="10.5" fill="#666"
        filter="url(#rough2)">gap = 1 &lt; 2 → 只新增 1 秒；gap = 3 ≥ 2 → 空档太长，只新增 2 秒</text>

  <!-- 时间轴 -->
  <text x="60" y="232" font-size="10.5" fill="#446688" filter="url(#rough2)">三次攻击覆盖的秒（涂色 = 中毒）</text>

  <rect x="110" y="242" width="140" height="10" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="180" y="258" width="140" height="10" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="390" y="274" width="140" height="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <text x="100" y="250" text-anchor="end" font-size="9" fill="#5a6a86" filter="url(#rough2)">攻击 1</text>
  <text x="100" y="266" text-anchor="end" font-size="9" fill="#5a7a4a" filter="url(#rough2)">攻击 2</text>
  <text x="100" y="282" text-anchor="end" font-size="9" fill="#8a6a20" filter="url(#rough2)">攻击 3</text>

  <!-- 秒格 -->
  <rect x="110" y="300" width="70" height="30" fill="#dbe9d5" stroke="#4a7a3a"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="180" y="300" width="70" height="30" fill="#dbe9d5" stroke="#4a7a3a"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="250" y="300" width="70" height="30" fill="#dbe9d5" stroke="#4a7a3a"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="320" y="300" width="70" height="30" fill="#ffffff" stroke="#b85450"
        stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="390" y="300" width="70" height="30" fill="#dbe9d5" stroke="#4a7a3a"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="460" y="300" width="70" height="30" fill="#dbe9d5" stroke="#4a7a3a"
        stroke-width="1.2" filter="url(#rough2)"/>

  <text x="145" y="320" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">1</text>
  <text x="215" y="320" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">2</text>
  <text x="285" y="320" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>
  <text x="355" y="320" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="425" y="320" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">5</text>
  <text x="495" y="320" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">6</text>

  <text x="355" y="346" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">空档，未中毒</text>

  <!-- 结论 -->
  <rect x="55" y="362" width="510" height="62" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="384" text-anchor="middle" font-size="10.5" fill="#8a6a20"
        filter="url(#rough2)">并集 = {1,2,3} ∪ {5,6}，共 5 秒；第 4 秒正是 gap = 3 &gt; duration = 2 的空档</text>
  <text x="310" y="406" text-anchor="middle" font-size="11" fill="#8a6a20"
        filter="url(#rough2)">2 + min(2, 1) + min(2, 3) = 2 + 1 + 2 = 5</text>
</svg>
