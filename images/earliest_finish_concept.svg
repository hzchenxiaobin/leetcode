<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="340" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">每个任务的完成时刻 = s + t，取最小</text>
  <path d="M 210 40 Q 320 48 430 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="150" y="56" width="340" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="78" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold">ans = min( s + t )，对每个任务 [s, t]</text>

  <text x="130" y="110" text-anchor="middle" font-size="12" fill="#2b6e9e">开始 s=1</text>
  <text x="497" y="110" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">完成 = 1+6 = 7</text>
  <g filter="url(#sk)">
    <rect x="130" y="118" width="360" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="310" y="139" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">任务 1：时长 6</text>

  <text x="190" y="164" text-anchor="middle" font-size="12" fill="#2e6e2e">开始 s=2</text>
  <text x="377" y="164" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">完成 = 2+3 = 5</text>
  <g filter="url(#sk)">
    <rect x="190" y="172" width="180" height="32" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="280" y="193" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">任务 2：时长 3</text>

  <path d="M 490 154 L 490 260" stroke="#4a8edb" stroke-width="1.2" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <path d="M 370 208 L 370 260" stroke="#4a8e4a" stroke-width="1.2" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>

  <path d="M 60 266 L 578 266" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g stroke="#3a3a3a" stroke-width="1.2" filter="url(#sk)">
    <path d="M 70 262 L 70 270"/><path d="M 130 262 L 130 270"/><path d="M 190 262 L 190 270"/>
    <path d="M 250 262 L 250 270"/><path d="M 310 262 L 310 270"/><path d="M 370 262 L 370 270"/>
    <path d="M 430 262 L 430 270"/><path d="M 490 262 L 490 270"/><path d="M 550 262 L 550 270"/>
  </g>
  <g font-size="11" fill="#666" text-anchor="middle">
    <text x="70" y="290">0</text><text x="130" y="290">1</text><text x="190" y="290">2</text>
    <text x="250" y="290">3</text><text x="310" y="290">4</text><text x="370" y="290">5</text>
    <text x="430" y="290">6</text><text x="490" y="290">7</text><text x="550" y="290">8</text>
  </g>
  <text x="596" y="270" font-size="12" fill="#666">t</text>

  <circle cx="370" cy="266" r="10" fill="none" stroke="#b85450" stroke-width="2.4" filter="url(#sk)"/>
  <text x="390" y="252" font-size="13" fill="#b85450" font-weight="bold">← 最早完成！</text>

  <g filter="url(#sk)">
    <rect x="356" y="300" width="264" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="488" y="322" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold">ans = min(7, 5) = 5 ✓</text>
</svg>
