<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="22" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：grid = [[3,5],[6,4]] · 从 bit 2 到 bit 0</text>
  <text x="330" y="40" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3 = 011 · 5 = 101 · 6 = 110 · 4 = 100</text>

  <!-- table header -->
  <rect x="32" y="58" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="68" y="58" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="102" y="58" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="158" y="58" width="118" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="276" y="58" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="416" y="58" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="556" y="58" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">轮</text>
  <text x="85" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">位 b</text>
  <text x="130" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>
  <text x="217" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">检查掩码</text>
  <text x="346" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">行 1 [3, 5]</text>
  <text x="486" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">行 2 [6, 4]</text>
  <text x="592" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">结论</text>

  <!-- row 1: b=2 -->
  <rect x="32" y="90" width="36" height="54" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="68" y="90" width="34" height="54" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="102" y="90" width="56" height="54" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="158" y="90" width="118" height="54" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="276" y="90" width="140" height="54" fill="#e6f4ea" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="416" y="90" width="140" height="54" fill="#fce4ec" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="556" y="90" width="72" height="54" fill="#fff8e1" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">①</text>
  <text x="85" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">000</text>
  <text x="217" y="111" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">000 ∪ {1,0}</text>
  <text x="217" y="128" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">= 011</text>
  <text x="346" y="111" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3 = 011 ⊆ 011 ✓</text>
  <text x="346" y="130" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5 = 101 ✗</text>
  <text x="486" y="111" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5 = 101 ✗</text>
  <text x="486" y="130" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">6 = 110 ✗ 断供</text>
  <text x="592" y="111" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">置 1</text>
  <text x="592" y="130" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">ans→100</text>

  <!-- row 2: b=1 -->
  <rect x="32" y="144" width="36" height="54" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="68" y="144" width="34" height="54" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="102" y="144" width="56" height="54" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="158" y="144" width="118" height="54" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="276" y="144" width="140" height="54" fill="#e6f4ea" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="416" y="144" width="140" height="54" fill="#e6f4ea" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="556" y="144" width="72" height="54" fill="#e6f4ea" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">②</text>
  <text x="85" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="130" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">100</text>
  <text x="217" y="165" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">100 ∪ {0}</text>
  <text x="217" y="182" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">= 101</text>
  <text x="346" y="165" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3 = 011 ✗</text>
  <text x="346" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">5 = 101 ⊆ 101 ✓</text>
  <text x="486" y="165" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6 = 110 ✗</text>
  <text x="486" y="184" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">4 = 100 ⊆ 101 ✓</text>
  <text x="592" y="175" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">保持 0</text>

  <!-- row 3: b=0 -->
  <rect x="32" y="198" width="36" height="54" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="68" y="198" width="34" height="54" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="102" y="198" width="56" height="54" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="158" y="198" width="118" height="54" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="276" y="198" width="140" height="54" fill="#fce4ec" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="416" y="198" width="140" height="54" fill="#f5f5f5" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="556" y="198" width="72" height="54" fill="#fff8e1" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="229" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③</text>
  <text x="85" y="229" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="130" y="229" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">100</text>
  <text x="217" y="219" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">100 ∪ ∅</text>
  <text x="217" y="236" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">= 100</text>
  <text x="346" y="219" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3 = 011 ✗</text>
  <text x="346" y="238" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">5 = 101 ✗ 断供</text>
  <text x="486" y="229" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—（行 1 已断供）</text>
  <text x="592" y="219" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">置 1</text>
  <text x="592" y="238" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">ans→101</text>

  <!-- result -->
  <rect x="32" y="268" width="596" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="287" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终 ans = 101₂ = 5</text>
  <text x="330" y="305" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">对应第一行选 5、第二行选 4：5 | 4 = 5 ✓（与官方示例 2 一致）</text>

  <!-- note -->
  <rect x="32" y="326" width="596" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="347" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">第 ③ 轮的细节：行 2 的 6 = 110、4 = 100 其实都是 100 的子罩，</text>
  <text x="330" y="365" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">但行 1 的 3、5 都带第 0 位且高位对不上，行 1 先断供——</text>
  <text x="330" y="381" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">检查要求「每一行都有子罩」，任何一行断供即整体判负，第 0 位被迫点亮</text>
</svg>
