<svg xmlns="http://www.w3.org/2000/svg" width="780" height="540" viewBox="0 0 780 540" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="780" height="540" fill="#fafafa"/>

  <text x="390" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：[[1,2],[2,3],[3,4]] → 答案 2</text>
  <path d="M 150 46 Q 390 54 630 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== 数轴上的三个区间 ===== -->
  <g filter="url(#rough2)"><rect x="200" y="70" width="80" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="240" y="88" text-anchor="middle" font-size="12" fill="#33526e" font-weight="bold" filter="url(#rough2)">[1,2]</text>
  <g filter="url(#rough2)"><rect x="280" y="104" width="80" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="320" y="122" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">[2,3]</text>
  <g filter="url(#rough2)"><rect x="360" y="138" width="80" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="400" y="156" text-anchor="middle" font-size="12" fill="#8a6510" font-weight="bold" filter="url(#rough2)">[3,4]</text>

  <!-- 相交点标记 -->
  <g filter="url(#rough2)"><circle cx="280" cy="97" r="5" fill="#b85450"/></g>
  <g filter="url(#rough2)"><circle cx="360" cy="131" r="5" fill="#b85450"/></g>

  <path d="M 110 200 L 560 200" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="11" fill="#999">
    <text x="120" y="218" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="200" y="218" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="280" y="218" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="360" y="218" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="440" y="218" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="520" y="218" text-anchor="middle" filter="url(#rough2)">5</text>
  </g>
  <text x="286" y="240" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">点 2 相交 ✓</text>
  <text x="366" y="258" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">点 3 相交 ✓</text>
  <text x="600" y="120" font-size="11" fill="#666" filter="url(#rough2)">[1,2] 与 [3,4]：</text>
  <text x="600" y="138" font-size="11" fill="#666" filter="url(#rough2)">2 &lt; 3 有缝隙，</text>
  <text x="600" y="156" font-size="11" fill="#b85450" filter="url(#rough2)">不相交 ✗</text>

  <!-- ===== 演算表格 ===== -->
  <text x="60" y="296" font-size="13" font-weight="bold" fill="#33526e" filter="url(#rough2)">逐区间统计不相交贡献（E = sort(ends) = [2, 3, 4]，总对数 C(3,2) = 3）</text>

  <!-- 表头 -->
  <g filter="url(#rough2)"><rect x="60" y="308" width="130" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="190" y="308" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="300" y="308" width="280" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="580" y="308" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="125" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#33526e" filter="url(#rough2)">区间</text>
  <text x="245" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#33526e" filter="url(#rough2)">start_i</text>
  <text x="440" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#33526e" filter="url(#rough2)">E 中严格小于 start_i 的元素</text>
  <text x="635" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#33526e" filter="url(#rough2)">贡献</text>

  <!-- 行 1 -->
  <g filter="url(#rough2)"><rect x="60" y="340" width="130" height="32" fill="#ffffff" stroke="#9aa8b8" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="190" y="340" width="110" height="32" fill="#ffffff" stroke="#9aa8b8" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="300" y="340" width="280" height="32" fill="#ffffff" stroke="#9aa8b8" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="580" y="340" width="110" height="32" fill="#ffffff" stroke="#9aa8b8" stroke-width="1"/></g>
  <text x="125" y="360" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[1,2]</text>
  <text x="245" y="360" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="440" y="360" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">（无）</text>
  <text x="635" y="360" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- 行 2 -->
  <g filter="url(#rough2)"><rect x="60" y="372" width="130" height="32" fill="#ffffff" stroke="#9aa8b8" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="190" y="372" width="110" height="32" fill="#ffffff" stroke="#9aa8b8" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="300" y="372" width="280" height="32" fill="#ffffff" stroke="#9aa8b8" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="580" y="372" width="110" height="32" fill="#ffffff" stroke="#9aa8b8" stroke-width="1"/></g>
  <text x="125" y="392" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2,3]</text>
  <text x="245" y="392" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="440" y="392" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">（无，end=2 不算严格小于）</text>
  <text x="635" y="392" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- 行 3 -->
  <g filter="url(#rough2)"><rect x="60" y="404" width="130" height="32" fill="#f7fdf8" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="190" y="404" width="110" height="32" fill="#f7fdf8" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="300" y="404" width="280" height="32" fill="#f7fdf8" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="580" y="404" width="110" height="32" fill="#f7fdf8" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="125" y="424" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[3,4]</text>
  <text x="245" y="424" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="440" y="424" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">{2}（[1,2] 整体在左侧）</text>
  <text x="635" y="424" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- ===== 结果 ===== -->
  <g filter="url(#rough2)"><rect x="60" y="456" width="630" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="82" y="481" font-size="13" fill="#2e5e2e" filter="url(#rough2)">disjoint = 0 + 0 + 1 = 1（正是 [1,2] 与 [3,4] 这一对）</text>
  <text x="82" y="504" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = C(3,2) − disjoint = 3 − 1 = 2 ✓</text>
</svg>
