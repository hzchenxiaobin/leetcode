<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">组件 = 值属于 nums 的极大连续段</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例：head = [0,1,2,3,4]，nums = [0,1,3,4] → 答案 2</text>

  <g filter="url(#rough2)" font-size="16" text-anchor="middle" font-weight="bold">
    <rect x="113" y="104" width="54" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="140" y="134" fill="#3a5a30" filter="url(#rough2)">0</text>
    <rect x="183" y="104" width="54" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="210" y="134" fill="#3a5a30" filter="url(#rough2)">1</text>
    <rect x="253" y="104" width="54" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <text x="280" y="134" fill="#8a3a36" filter="url(#rough2)">2</text>
    <rect x="323" y="104" width="54" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="350" y="134" fill="#3a5a30" filter="url(#rough2)">3</text>
    <rect x="393" y="104" width="54" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="420" y="134" fill="#3a5a30" filter="url(#rough2)">4</text>
  </g>

  <g filter="url(#rough2)" stroke="#666" stroke-width="1.4" fill="none">
    <path d="M 168 127 L 180 127" marker-end="url(#arr)"/>
    <path d="M 238 127 L 250 127" marker-end="url(#arr)"/>
    <path d="M 308 127 L 320 127" marker-end="url(#arr)"/>
    <path d="M 378 127 L 390 127" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="140" y="168" filter="url(#rough2)">i=0</text>
    <text x="210" y="168" filter="url(#rough2)">i=1</text>
    <text x="280" y="168" filter="url(#rough2)">i=2</text>
    <text x="350" y="168" filter="url(#rough2)">i=3</text>
    <text x="420" y="168" filter="url(#rough2)">i=4</text>
  </g>

  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.6" fill="none">
    <path d="M 110 182 L 110 191 L 240 191 L 240 182"/>
    <path d="M 320 182 L 320 191 L 450 191 L 450 182"/>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#3a5a30">
    <text x="175" y="210" filter="url(#rough2)">组件 1：[0, 1]</text>
    <text x="385" y="210" filter="url(#rough2)">组件 2：[3, 4]</text>
  </g>
  <text x="280" y="210" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">2 ∉ nums</text>

  <rect x="40" y="228" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="250" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么是 2 个组件</text>
  <text x="56" y="270" font-size="10" fill="#555" filter="url(#rough2)">节点 2 的值不在 nums 中，它把链表切成互不相连的两段；</text>
  <text x="56" y="288" font-size="10" fill="#555" filter="url(#rough2)">每一段内部的值都连续属于 nums，且不能再向左右延伸 → 各算一个组件。</text>

  <rect x="40" y="312" width="480" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="330" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">计数口径：数「段尾」</text>
  <text x="56" y="346" font-size="10" fill="#555" filter="url(#rough2)">cur.val ∈ nums 且（cur.next 为空 或 cur.next.val ∉ nums）→ 每个组件恰好贡献一个段尾</text>

  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">段首要看前驱（单向链表做不到），段尾只看后继（一次遍历即可）</text>
</svg>
