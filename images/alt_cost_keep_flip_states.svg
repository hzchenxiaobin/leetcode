<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#fdfcf7"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">状态机 DP：keep / flip——当前元素的两个身份</text>
  <path d="M 270 42 Q 450 48 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g font-size="11" fill="#888">
    <text x="265" y="80" text-anchor="middle">以 i−1 结尾</text>
    <text x="625" y="80" text-anchor="middle">以 i 结尾</text>
  </g>

  <!-- 左列状态 -->
  <g filter="url(#sk)"><rect x="185" y="92" width="160" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="265" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">keep(i−1)</text>
  <text x="265" y="136" text-anchor="middle" font-size="11" fill="#2e6e2e">符号 +</text>
  <g filter="url(#sk)"><rect x="185" y="252" width="160" height="56" rx="8" fill="#fbeaec" stroke="#b03a3a" stroke-width="1.8"/></g>
  <text x="265" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a">flip(i−1)</text>
  <text x="265" y="296" text-anchor="middle" font-size="11" fill="#b03a3a">符号 −</text>

  <!-- 右列状态 -->
  <g filter="url(#sk)"><rect x="545" y="92" width="160" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="625" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">keep(i)</text>
  <text x="625" y="136" text-anchor="middle" font-size="11" fill="#2e6e2e">符号 +</text>
  <g filter="url(#sk)"><rect x="545" y="252" width="160" height="56" rx="8" fill="#fbeaec" stroke="#b03a3a" stroke-width="1.8"/></g>
  <text x="625" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a">flip(i)</text>
  <text x="625" y="296" text-anchor="middle" font-size="11" fill="#b03a3a">符号 −</text>

  <!-- 转移箭头 -->
  <path d="M 349 112 L 541 112" stroke="#4a8edb" stroke-width="2.2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="445" y="102" text-anchor="middle" font-size="10.5" fill="#2b6e9e" filter="url(#sk)">＋＋界面：必切，i 开新段</text>

  <path d="M 349 140 Q 445 175 541 256" stroke="#c98a2b" stroke-width="2.2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="445" y="168" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">＋−：段内奇偏移，续段</text>

  <path d="M 349 262 Q 445 225 541 140" stroke="#4a8edb" stroke-width="2.2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="445" y="248" text-anchor="middle" font-size="10.5" fill="#2b6e9e" filter="url(#sk)">−＋：可续段、也可切</text>

  <path d="M 349 282 L 541 282" stroke="#b03a3a" stroke-width="2" stroke-dasharray="7 4" fill="none" filter="url(#sk)"/>
  <path d="M 435 272 L 455 292 M 455 272 L 435 292" stroke="#b03a3a" stroke-width="3" fill="none" filter="url(#sk)"/>
  <text x="445" y="312" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a" filter="url(#sk)">−−：非法（相邻负号不存在）</text>

  <!-- 底部方程框 -->
  <g filter="url(#sk)">
    <rect x="60" y="330" width="780" height="72" rx="9" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="280" y="360" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">keep(i) = max(keep(i−1), flip(i−1)) + nums[i]</text>
  <text x="620" y="360" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a" filter="url(#sk)">flip(i) = keep(i−1) − nums[i]</text>
  <text x="450" y="388" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">初始：keep(0) = nums[0]，flip(0) = −∞；答案 = max(keep(n−1), flip(n−1))</text>
</svg>
