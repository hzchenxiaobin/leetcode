<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#555" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">一次遍历：数清两侧筹码，取较小的一侧</text>

  <rect x="210" y="52" width="200" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="80" text-anchor="middle" font-size="14" fill="#8a3b38" filter="url(#rough2)">输入 position 数组</text>

  <path d="M310,99 L310,124" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="126" width="320" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="152" text-anchor="middle" font-size="12.5" fill="#2f4f66" filter="url(#rough2)">even ← 满足 p % 2 == 0 的筹码个数</text>
  <text x="310" y="176" text-anchor="middle" font-size="12.5" fill="#2f4f66" filter="url(#rough2)">odd ← n − even（奇数位置上的筹码）</text>

  <path d="M310,199 L310,216" stroke="#555" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M150,216 L470,216" stroke="#555" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M150,216 L150,234" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M470,216 L470,234" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="236" width="250" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="260" text-anchor="middle" font-size="12.5" fill="#33582a" filter="url(#rough2)">目标选奇数位（如 1 或 3）</text>
  <text x="165" y="284" text-anchor="middle" font-size="12.5" fill="#33582a" filter="url(#rough2)">代价 = odd，偶数位筹码各付 1</text>

  <rect x="330" y="236" width="250" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="260" text-anchor="middle" font-size="12.5" fill="#7a5a12" filter="url(#rough2)">目标选偶数位（如 2 或 4）</text>
  <text x="455" y="284" text-anchor="middle" font-size="12.5" fill="#7a5a12" filter="url(#rough2)">代价 = even，奇数位筹码各付 1</text>

  <path d="M165,303 L165,318 L248,318 L248,322" stroke="#555" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M455,303 L455,318 L372,318 L372,322" stroke="#555" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="324" width="220" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="355" text-anchor="middle" font-size="14.5" fill="#2f4f66" filter="url(#rough2)">return min(even, odd)</text>

  <text x="310" y="392" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">两条支路取更便宜的那条，O(n) 时间、O(1) 额外空间</text>
</svg>
