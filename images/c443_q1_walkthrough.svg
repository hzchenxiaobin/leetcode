<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/></marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：一次遍历，滚动维护前缀最小值</text>
  <text x="380" y="44" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">cost = [5, 3, 4, 1, 3, 2]，橙色列 = cur 在 i=3 处被刷新</text>

  <!-- highlight column i=3 -->
  <g filter="url(#rough2)"><rect x="435" y="60" width="90" height="196" fill="#fff8e1" opacity="0.9"/></g>

  <!-- grid lines -->
  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1.2">
    <line x1="60" y1="60" x2="715" y2="60"/>
    <line x1="60" y1="108" x2="715" y2="108"/>
    <line x1="60" y1="156" x2="715" y2="156"/>
    <line x1="60" y1="204" x2="715" y2="204"/>
    <line x1="60" y1="256" x2="715" y2="256"/>
    <line x1="60" y1="60" x2="60" y2="256"/>
    <line x1="150" y1="60" x2="150" y2="256"/>
    <line x1="245" y1="60" x2="245" y2="256"/>
    <line x1="340" y1="60" x2="340" y2="256"/>
    <line x1="435" y1="60" x2="435" y2="256"/>
    <line x1="530" y1="60" x2="530" y2="256"/>
    <line x1="625" y1="60" x2="625" y2="256"/>
    <line x1="715" y1="60" x2="715" y2="256"/>
  </g>

  <!-- header row: i -->
  <g filter="url(#rough2)"><rect x="60" y="60" width="90" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="105" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">i</text>
  <g filter="url(#rough2)"><rect x="150" y="60" width="90" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="245" y="60" width="90" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="340" y="60" width="90" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="435" y="60" width="90" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="530" y="60" width="90" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="625" y="60" width="90" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="195" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">0</text>
  <text x="290" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">1</text>
  <text x="385" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">2</text>
  <text x="480" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1a" filter="url(#rough2)">3</text>
  <text x="575" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">4</text>
  <text x="670" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">5</text>

  <!-- row labels -->
  <text x="105" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#rough2)">cost[i]</text>
  <text x="105" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#444" filter="url(#rough2)">cur ← 更新</text>
  <text x="105" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">answer[i]</text>

  <!-- row: cost[i] -->
  <text x="195" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="290" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="385" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="480" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="575" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="670" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- row: cur -->
  <text x="195" y="186" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="290" y="186" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="385" y="186" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="480" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="575" y="186" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="670" y="186" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- refresh note on i=3 -->
  <text x="480" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">3 → 1 刷新！</text>

  <!-- row: answer -->
  <text x="195" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">5</text>
  <text x="290" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">3</text>
  <text x="385" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">3</text>
  <text x="480" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="575" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">1</text>
  <text x="670" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">1</text>

  <!-- bottom note -->
  <g filter="url(#rough2)"><rect x="40" y="272" width="680" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="60" y="293" font-size="12" font-weight="bold" fill="#8a6d1a" filter="url(#rough2)">cur 只降不升：一旦在 i=3 见到更低的 ¥1，右侧所有 answer 都按新低价结算，</text>
  <text x="60" y="313" font-size="11" fill="#444" filter="url(#rough2)">这正是 answer 非严格递减的原因 —— 也可作为提交后的自检手段。</text>
</svg>
