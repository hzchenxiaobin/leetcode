<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三个切点切出四段，三个元素被丢弃</text>
  <text x="320" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">nums = [1,2,1,2,1,2,1]（示例 1：i = 1, j = 3, k = 5）</text>

  <path d="M 215 68 L 215 140" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 355 68 L 355 140" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 495 68 L 495 140" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="215" y="60" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">i = 1</text>
  <text x="355" y="60" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">j = 3</text>
  <text x="495" y="60" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">k = 5</text>

  <g filter="url(#rough2)">
    <rect x="79" y="76" width="62" height="56" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="110" y="111" text-anchor="middle" font-size="14" fill="#2f4f28">1</text>

    <rect x="149" y="76" width="62" height="56" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="180" y="111" text-anchor="middle" font-size="14" fill="#8a3a36">2</text>
    <path d="M 157 84 L 203 124" stroke="#b85450" stroke-width="1.1" opacity="0.65" fill="none"/>
    <path d="M 203 84 L 157 124" stroke="#b85450" stroke-width="1.1" opacity="0.65" fill="none"/>

    <rect x="219" y="76" width="62" height="56" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="250" y="111" text-anchor="middle" font-size="14" fill="#2f4f28">1</text>

    <rect x="289" y="76" width="62" height="56" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="320" y="111" text-anchor="middle" font-size="14" fill="#8a3a36">2</text>
    <path d="M 297 84 L 343 124" stroke="#b85450" stroke-width="1.1" opacity="0.65" fill="none"/>
    <path d="M 343 84 L 297 124" stroke="#b85450" stroke-width="1.1" opacity="0.65" fill="none"/>

    <rect x="359" y="76" width="62" height="56" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="390" y="111" text-anchor="middle" font-size="14" fill="#2f4f28">1</text>

    <rect x="429" y="76" width="62" height="56" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="460" y="111" text-anchor="middle" font-size="14" fill="#8a3a36">2</text>
    <path d="M 437 84 L 483 124" stroke="#b85450" stroke-width="1.1" opacity="0.65" fill="none"/>
    <path d="M 483 84 L 437 124" stroke="#b85450" stroke-width="1.1" opacity="0.65" fill="none"/>

    <rect x="499" y="76" width="62" height="56" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="530" y="111" text-anchor="middle" font-size="14" fill="#2f4f28">1</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#888" text-anchor="middle">
    <text x="110" y="148">0</text>
    <text x="180" y="148">1</text>
    <text x="250" y="148">2</text>
    <text x="320" y="148">3</text>
    <text x="390" y="148">4</text>
    <text x="460" y="148">5</text>
    <text x="530" y="148">6</text>
  </g>

  <path d="M 110 156 L 110 174" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 250 156 L 250 174" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 390 156 L 390 174" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 530 156 L 530 174" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="79" y="176" width="62" height="44" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="110" y="194" text-anchor="middle" font-size="9.5" fill="#4a7a3a">段1 [0,0]</text>
    <text x="110" y="211" text-anchor="middle" font-size="10.5" fill="#2f4f28" font-weight="bold">和 = 1</text>

    <rect x="219" y="176" width="62" height="44" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="250" y="194" text-anchor="middle" font-size="9.5" fill="#4a7a3a">段2 [2,2]</text>
    <text x="250" y="211" text-anchor="middle" font-size="10.5" fill="#2f4f28" font-weight="bold">和 = 1</text>

    <rect x="359" y="176" width="62" height="44" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="390" y="194" text-anchor="middle" font-size="9.5" fill="#4a7a3a">段3 [4,4]</text>
    <text x="390" y="211" text-anchor="middle" font-size="10.5" fill="#2f4f28" font-weight="bold">和 = 1</text>

    <rect x="499" y="176" width="62" height="44" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="530" y="194" text-anchor="middle" font-size="9.5" fill="#4a7a3a">段4 [6,6]</text>
    <text x="530" y="211" text-anchor="middle" font-size="10.5" fill="#2f4f28" font-weight="bold">和 = 1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="238" width="520" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="320" y="260" text-anchor="middle" font-size="10.5" fill="#3a4a66">sum(0,i−1) = sum(i+1,j−1) = sum(j+1,k−1) = sum(k+1,n−1) = 1</text>

    <rect x="60" y="280" width="520" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="320" y="300" text-anchor="middle" font-size="10.5" fill="#8a3a36">红叉元素 nums[i]、nums[j]、nums[k] 不进入任何一段求和</text>

    <rect x="60" y="318" width="520" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="320" y="338" text-anchor="middle" font-size="10.5" fill="#8a6a20">总量关系：total = 4S + nums[i] + nums[j] + nums[k]</text>
  </g>
</svg>
