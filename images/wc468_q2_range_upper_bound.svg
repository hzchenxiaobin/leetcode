<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：任何子数组的值 ≤ 全局极差 D = max − min</text>

  <!-- 数组行 -->
  <text x="118" y="70" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">nums</text>
  <rect x="160" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="234" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="308" y="48" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="330" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <rect x="382" y="48" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="404" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <text x="330" y="97" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">全局 max</text>
  <text x="404" y="97" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">全局 min</text>

  <!-- 极差 D 双箭头 -->
  <path d="M330,110 L404,110" stroke="#8a6d1f" stroke-width="1.6" fill="none" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="367" y="126" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">D = 5 − 1 = 4</text>
  <path d="M367,132 L367,158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧：整个数组连选 k 次 -->
  <rect x="486" y="100" width="130" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="478" y="76" width="130" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="470" y="52" width="130" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="535" y="68" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">nums[0..n−1]</text>
  <text x="551" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">整个数组连选 k 次</text>
  <text x="551" y="156" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（同一个子数组可重复选）</text>

  <!-- 观察一 -->
  <rect x="60" y="164" width="520" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="184" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">观察一：子集被全集封顶</text>
  <text x="320" y="204" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">max(nums[l..r]) ≤ max(nums)，min(nums[l..r]) ≥ min(nums) ⟹ 任何子数组的值 ≤ D</text>

  <!-- 观察二 -->
  <rect x="60" y="226" width="520" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="246" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">观察二：上界可达</text>
  <text x="320" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">整个数组 nums[0..n−1] 的 max、min 就是全局极值，值恰好 = D</text>

  <!-- 观察三 -->
  <rect x="60" y="288" width="520" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">观察三：可重复选 ⟹ 直接吃满</text>
  <text x="320" y="328" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">同一子数组可选超过一次，把整个数组复制 k 份，总值 = k × D</text>

  <!-- 结论框 -->
  <rect x="90" y="352" width="460" height="50" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = k × ( max(nums) − min(nums) )</text>
  <text x="320" y="392" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">上界封顶 + 整数组取等 + 复制 k 份</text>

  <!-- 图例 -->
  <rect x="150" y="428" width="12" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="438" font-size="11" fill="#666" filter="url(#rough2)">全局 max</text>
  <rect x="260" y="428" width="12" height="12" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="278" y="438" font-size="11" fill="#666" filter="url(#rough2)">全局 min</text>
  <text x="420" y="438" font-size="11" fill="#8a6d1f" filter="url(#rough2)">D 为全局极差</text>
</svg>
