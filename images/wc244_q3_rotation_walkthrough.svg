  <text x="537" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">n 偶 ⟹ 每步 a' = n − a</text>
  <text x="537" y="117" text-anchor="middle" font-size="11" fill="#555">a 与 b 每步互换，min(a, b) 不变</text>
  <g filter="url(#sk)">
