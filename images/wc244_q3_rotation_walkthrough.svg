  </g>
  <text x="472" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">a</text>
  <text x="560" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#c98a2b">b</text>
  <text x="537" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">旋转无效 → 答案 = min(a₀, n−a₀) = 2</text>

