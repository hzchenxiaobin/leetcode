<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="189"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：两遍计数 → 遍历 c1 → 双条件过滤</text>

  <!-- 步骤 1 -->
  <rect x="40" y="60" width="240" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="84" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">① 扫 words1 建计数表 c1</text>
  <text x="160" y="104" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">c1[w] = w 在 words1 的出现次数</text>

  <rect x="340" y="60" width="240" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="84" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">② 扫 words2 建计数表 c2</text>
  <text x="460" y="104" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">两遍独立，顺序可交换</text>

  <path d="M 160 118 Q 160 148 220 158" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 460 118 Q 460 148 400 158" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="150" y="160" width="320" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="182" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">③ 遍历 c1 的每个键 (w, k)</text>
  <text x="310" y="202" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">候选只来自 c1 的键，天然去重</text>

  <path d="M 310 212 L 310 238" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 -->
  <path d="M 310 242 L 240 274 L 310 306 L 380 274 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="278" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">k == 1 且</text>
  <text x="310" y="296" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">c2.get(w,0) == 1 ?</text>

  <path d="M 240 274 Q 160 274 140 300" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 274 Q 460 274 480 300" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="262" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="435" y="262" font-size="11.5" fill="#888" filter="url(#rough2)">否</text>

  <!-- 结果 -->
  <rect x="60" y="304" width="160" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="326" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">ans += 1</text>
  <text x="140" y="344" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">双条件全满足</text>

  <rect x="400" y="304" width="160" height="48" rx="8" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="326" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">跳过</text>
  <text x="480" y="344" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">任一条件不满足</text>

  <text x="310" y="380" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">总时间 O(L1 + L2)：每个字符串只被哈希一次；判定是 O(1) 查表</text>
</svg>
