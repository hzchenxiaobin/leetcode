<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">不相交的线 ⟺ nums1 与 nums2 的公共子序列</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">连线不交叉 + 每个数字至多用一次 ⟹ 两端下标都严格递增</text>

  <text x="60" y="96" font-size="11" fill="#446688" font-weight="bold">nums1</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="120" y="78" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="166" y="78" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="212" y="78" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="143" y="101" fill="#446688">1</text>
    <text x="189" y="101" fill="#446688">4</text>
    <text x="235" y="101" fill="#446688">2</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#888">
    <text x="143" y="126">i=0</text><text x="189" y="126">i=1</text><text x="235" y="126">i=2</text>
  </g>

  <text x="60" y="216" font-size="11" fill="#4a7a3a" font-weight="bold">nums2</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="120" y="198" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="166" y="198" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="212" y="198" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="143" y="221" fill="#4a7a3a">1</text>
    <text x="189" y="221" fill="#4a7a3a">2</text>
    <text x="235" y="221" fill="#4a7a3a">4</text>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#888">
    <text x="143" y="246">j=0</text><text x="189" y="246">j=1</text><text x="235" y="246">j=2</text>
  </g>

  <path d="M 143 112 L 143 198" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 235 112 L 189 198" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="270" y="140" font-size="10.5" fill="#4a7a3a">1–1 与 2–2 平行，合法</text>

  <path d="M 189 112 L 235 198" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="196" y="172" font-size="10.5" fill="#8a3a36">4–4 与前两条交叉 ✗</text>

  <rect x="330" y="78" width="200" height="122" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="344" y="98" font-size="11" fill="#3a5a30" font-weight="bold">合法连线 ⟹ 公共子序列</text>
  <text x="344" y="120" font-size="10" fill="#555">取连线端点得</text>
  <text x="344" y="138" font-size="10" fill="#555">i0 &lt; i1 &lt; … 且 j0 &lt; j1 &lt; …</text>
  <text x="344" y="156" font-size="10" fill="#555">两侧值一一相等</text>
  <text x="344" y="180" font-size="10" fill="#4a7a3a">最大值 = 2（本例）</text>

  <rect x="330" y="212" width="200" height="102" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="344" y="232" font-size="11" fill="#8a6a20" font-weight="bold">公共子序列 ⟹ 合法连线</text>
  <text x="344" y="254" font-size="10" fill="#555">按子序列顺序连直线：</text>
  <text x="344" y="272" font-size="10" fill="#555">下标均严格递增</text>
  <text x="344" y="290" font-size="10" fill="#555">→ 线段必不相交</text>

  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#999">两方向互相蕴含，故问题等价于最长公共子序列：dp[i][j] = 前缀 LCS 长度</text>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#999">相等取 dp[i−1][j−1]+1，否则取 max(dp[i−1][j], dp[i][j−1])</text>
</svg>
