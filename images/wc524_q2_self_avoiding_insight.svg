<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：路径自避 → 步数 ≤ m·n → 必停机</text>

  <!-- 功能图视角 -->
  <rect x="40" y="48" width="272" height="128" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">功能图视角</text>
  <!-- mini 网格 + 出边箭头 -->
  <rect x="62" y="84" width="30" height="30" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="77" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">R</text>
  <path d="M90,99 L102,99" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="62" y="118" width="30" height="30" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="77" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">U</text>
  <path d="M77,116 L77,105" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="104" y="84" width="30" height="30" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="119" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">D</text>
  <path d="M119,114 L119,126" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="104" y="130" width="30" height="30" rx="3" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="119" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">L</text>
  <path d="M104,145 L94,145" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="98" font-size="11" fill="#446688" filter="url(#rough2)">每格恰一条出边</text>
  <text x="188" y="118" font-size="11" fill="#446688" filter="url(#rough2)">= 出度 1 的功能图</text>
  <text x="188" y="138" font-size="11" fill="#446688" filter="url(#rough2)">边界格指向墙外汇点</text>
  <text x="188" y="158" font-size="11" fill="#446688" filter="url(#rough2)">行走 = 沿唯一出边追踪</text>

  <!-- 停机检查 -->
  <rect x="328" y="48" width="272" height="128" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="464" y="68" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">每步移动前先检查</text>
  <text x="348" y="94" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 目标出界 → 停（这步不执行）</text>
  <text x="348" y="118" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 目标已访问 → 停（这步不执行）</text>
  <text x="348" y="142" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 未访问 → 移动落地，立即标记</text>
  <text x="464" y="166" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">检查永远发生在移动之前</text>

  <!-- 推导链 -->
  <rect x="40" y="196" width="176" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="219" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">移动只落在未访问格</text>
  <text x="128" y="239" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">落地立即标记</text>
  <path d="M222,225 L244,225" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="248" y="196" width="176" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="336" y="219" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">访问序列两两不同</text>
  <text x="336" y="239" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">= 自避行走，永不自交</text>
  <path d="M430,225 L452,225" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="456" y="196" width="144" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="528" y="219" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">至多访问 m·n 格</text>
  <text x="528" y="239" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">循环 ≤ m·n 轮</text>

  <!-- 自避路径示意 -->
  <circle cx="90" cy="344" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M100,344 L131,344" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="142" cy="344" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M152,344 L183,344" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="194" cy="344" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M204,344 L235,344" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="246" cy="344" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M256,344 L287,344" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="298" cy="344" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M298,334 L298,313" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="298" cy="302" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M288,302 L257,302" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="246" cy="302" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M236,302 L205,302" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="194" cy="302" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="194" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">D</text>

  <!-- 撞已访问：从最左上点直下指回第 3 点 -->
  <path d="M194,291 L194,326" stroke="#b85450" stroke-width="1.8" fill="none"
        stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="194" cy="344" r="13" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="376" font-size="11" fill="#b85450" filter="url(#rough2)">D 指向已访问格 → 停！</text>

  <text x="400" y="298" font-size="11.5" fill="#446688" filter="url(#rough2)">绿点 = 访问序列，两两不同；</text>
  <text x="400" y="318" font-size="11.5" fill="#446688" filter="url(#rough2)">路径从不自交，想回头时</text>
  <text x="400" y="338" font-size="11.5" fill="#446688" filter="url(#rough2)">立即被「已访问」拦停，</text>
  <text x="400" y="358" font-size="11.5" fill="#446688" filter="url(#rough2)">所以步数被 m·n 兜住。</text>

  <rect x="40" y="388" width="560" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">O(m·n) 直接模拟就是正解，m·n ≤ 10^5 稳过</text>
</svg>
