<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">排序：把「删除 5%」变成掐头去尾</text>

  <!-- 原始乱序数组 -->
  <text x="30" y="70" font-size="13" fill="#888" filter="url(#rough2)">原始数组（顺序无关）：</text>
  <g filter="url(#rough2)">
    <rect x="30" y="80" width="42" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="72" y="80" width="42" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="114" y="80" width="42" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="156" y="80" width="42" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="198" y="80" width="42" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="240" y="80" width="42" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="282" y="80" width="42" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="324" y="80" width="42" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="366" y="80" width="42" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="408" y="80" width="42" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="450" y="80" width="42" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#555" text-anchor="middle">
    <text x="51" y="100">9</text>
    <text x="93" y="100">0</text>
    <text x="135" y="100">7</text>
    <text x="177" y="100">2</text>
    <text x="219" y="100">10</text>
    <text x="261" y="100">3</text>
    <text x="303" y="100">0</text>
    <text x="345" y="100">5</text>
    <text x="387" y="100">8</text>
    <text x="429" y="100">1</text>
    <text x="471" y="100">7</text>
  </g>

  <path d="M 280 122 C 280 150, 280 160, 280 182" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="152" font-size="13.5" fill="#446688" filter="url(#rough2)">升序排序</text>

  <!-- 排序后：n=20, m=1 -->
  <text x="30" y="210" font-size="13" fill="#888" filter="url(#rough2)">排序后（n = 20，m = n/20 = 1）：</text>
  <g filter="url(#rough2)">
    <rect x="30" y="220" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="72" y="220" width="420" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="492" y="220" width="42" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#555" text-anchor="middle">
    <text x="51" y="240" fill="#b85450" font-weight="bold">0</text>
    <text x="93" y="240">0</text>
    <text x="135" y="240">1</text>
    <text x="177" y="240">2</text>
    <text x="219" y="240">3</text>
    <text x="261" y="240">5</text>
    <text x="303" y="240">7</text>
    <text x="345" y="240">7</text>
    <text x="387" y="240">8</text>
    <text x="429" y="240">9</text>
    <text x="462" y="240">10</text>
    <text x="513" y="240" fill="#b8860b" font-weight="bold">10</text>
  </g>

  <!-- 标注 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#b85450" text-anchor="middle">
    <text x="51" y="266">删（最小 5%）</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#d6a040" text-anchor="middle">
    <text x="513" y="266">删（最大 5%）</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#4a7a3a" text-anchor="middle">
    <text x="282" y="266">保留区间 [m, n−m)：均值 = 这一段的和 ÷ (n − 2m)</text>
  </g>

  <!-- 公式框 -->
  <g filter="url(#rough2)">
    <rect x="90" y="290" width="380" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="315" text-anchor="middle" font-size="14.5" fill="#446688" filter="url(#rough2)">m = n / 20（n 是 20 的倍数 → 无歧义）</text>
  <text x="280" y="338" text-anchor="middle" font-size="14.5" fill="#446688" filter="url(#rough2)">答案 = sum(arr[m .. n−m−1]) / (n − 2m)</text>
</svg>
