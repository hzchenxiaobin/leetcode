<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：s = "zzabba"，偶中心 (3, 4) → 答案 5</text>

  <!-- Step 1 -->
  <text x="320" y="52" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">① 纯扩展（中心对 (3,4) = b b）</text>
  <rect x="143" y="62" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="203" y="62" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="263" y="62" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="323" y="62" width="54" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="383" y="62" width="54" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="443" y="62" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="86" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">z</text>
  <text x="230" y="86" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">z</text>
  <text x="290" y="86" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <text x="350" y="86" text-anchor="middle" font-size="16" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="410" y="86" text-anchor="middle" font-size="16" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="470" y="86" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <text x="170" y="112" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="230" y="112" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="290" y="112" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="350" y="112" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="410" y="112" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="470" y="112" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="380" y="130" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">b = b ✓</text>
  <text x="380" y="148" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">a = a ✓</text>
  <text x="530" y="148" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(1, 6)：</text>
  <text x="530" y="163" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">r 越界 ⟂</text>
  <path d="M263,168 L497,168" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M263,168 L263,174" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M497,168 L497,174" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="380" y="188" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">纯回文 [2, 5] = "abba"，长度 4</text>

  <path d="M320,198 L320,212" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <text x="320" y="228" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">② 越界也能删：删左 k = l = 1（把 z 收进 t，但不进回文 p）</text>
  <rect x="143" y="238" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="203" y="238" width="54" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="263" y="238" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="323" y="238" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="383" y="238" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="443" y="238" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="262" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">z</text>
  <text x="230" y="262" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">z</text>
  <text x="290" y="262" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <text x="350" y="262" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">b</text>
  <text x="410" y="262" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">b</text>
  <text x="470" y="262" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <text x="170" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="230" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="290" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="350" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="410" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="470" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <line x1="209" y1="256" x2="251" y2="256" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="230" y="232" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">k = 1</text>
  <text x="380" y="300" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">改比较 (0, 6)：r = 6 越界 → 停止（删除名额已用完）</text>

  <path d="M320,308 L320,322" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <text x="320" y="338" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">③ 候选区间 = 纯区 [2, 5] ∪ {k = 1} = [1, 5]</text>
  <rect x="143" y="348" width="54" height="36" rx="4" fill="#eeeeee" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="203" y="348" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="263" y="348" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="323" y="348" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="383" y="348" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="443" y="348" width="54" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="372" text-anchor="middle" font-size="16" fill="#aaa" filter="url(#rough2)">z</text>
  <text x="230" y="372" text-anchor="middle" font-size="16" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">z</text>
  <text x="290" y="372" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <text x="350" y="372" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">b</text>
  <text x="410" y="372" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">b</text>
  <text x="470" y="372" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <text x="170" y="398" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="230" y="398" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="290" y="398" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="350" y="398" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="410" y="398" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="470" y="398" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="128" y="372" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">排除</text>
  <path d="M203,410 L497,410" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <path d="M203,410 L203,416" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <path d="M497,410 L497,416" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <text x="350" y="432" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">t = "zabba"，删 z → "abba" ✓，长度 5</text>

  <!-- ans 徽章 -->
  <circle cx="560" cy="420" r="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="560" y="416" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">ans</text>
  <text x="560" y="434" text-anchor="middle" font-size="16" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">= 5</text>

  <!-- 底部小结 -->
  <rect x="40" y="462" width="560" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="480" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">💡 被删的 z 不需要参与任何匹配——它只需待在区间里，把 t 的左边界向外顶出一格（|t| = |p| + 1）</text>
  <text x="320" y="497" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">其余中心最多给出 "zz"（长度 2）与 "abba"（长度 4），均不超过 5，故答案为 5</text>
</svg>
