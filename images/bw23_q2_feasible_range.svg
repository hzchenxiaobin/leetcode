<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">可行区间：odd ≤ k ≤ n 时一定能构造</text>

  <!-- 数轴 -->
  <line x1="60" y1="120" x2="520" y2="120" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 520 120 L 506 113 M 520 120 L 506 127" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="110" cy="120" r="6" fill="#b85450"/>
    <circle cx="430" cy="120" r="6" fill="#4a7a3a"/>
  </g>
  <text x="110" y="96" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">k = m（奇计数种数）</text>
  <text x="110" y="148" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">下界：中心不够用</text>
  <text x="430" y="96" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">k = n（串总长）</text>
  <text x="430" y="148" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">上界：全拆单字符</text>
  <!-- 可行区间高亮 -->
  <rect x="110" y="108" width="320" height="24" rx="10" fill="#e6f4ea" opacity="0.65" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">可行：每个 k 落在 [m, n] 内都有构造方案</text>
  <!-- 左侧不可行 -->
  <text x="66" y="180" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">k &lt; m ✗</text>
  <text x="500" y="180" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">k &gt; n ✗</text>

  <!-- 构造积木 -->
  <g filter="url(#rough2)" font-size="12">
    <rect x="40" y="210" width="140" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="210" y="210" width="140" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="380" y="210" width="140" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="12" filter="url(#rough2)">
    <text x="110" y="234" fill="#446688">单字符 "c"</text><text x="110" y="256" fill="#446688">本身就是回文</text>
    <text x="280" y="234" fill="#8a6d1a">字符对 "cc"</text><text x="280" y="256" fill="#8a6d1a">可作串、可对称外挂</text>
    <text x="450" y="234" fill="#4a7a3a">对 X + "cc" → cXc</text><text x="450" y="256" fill="#4a7a3a">串数可自由伸缩</text>
  </g>
  <text x="280" y="292" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">拼装积木：m 个中心 + (n−m)/2 个对，覆盖 [m, n] 的一切 k</text>
</svg>
