<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">在父节点处判定：谁是「左叶子」</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">叶子 = 左右孩子都空；左叶子 = 叶子 且 是父节点的左孩子</text>

  <!-- 边 -->
  <path d="M 280 86 L 180 176" stroke="#9a9a9a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 86 L 380 176" stroke="#9a9a9a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 380 176 L 320 258" stroke="#9a9a9a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 380 176 L 440 258" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="214" y="126" font-size="10" fill="#999" filter="url(#rough2)">L</text>
  <text x="336" y="126" font-size="10" fill="#999" filter="url(#rough2)">R</text>
  <text x="340" y="212" font-size="10" fill="#999" filter="url(#rough2)">L</text>
  <text x="404" y="212" font-size="10" fill="#999" filter="url(#rough2)">R</text>

  <!-- 节点 -->
  <circle cx="280" cy="86" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="91" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">3</text>

  <circle cx="180" cy="176" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="180" y="181" text-anchor="middle" font-size="13" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">9</text>

  <circle cx="380" cy="176" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="380" y="181" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">20</text>

  <circle cx="320" cy="258" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="263" text-anchor="middle" font-size="13" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">15</text>

  <circle cx="440" cy="258" r="21" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="440" y="263" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">7</text>

  <!-- 标注框 -->
  <rect x="46" y="156" width="98" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="95" y="178" text-anchor="middle" font-size="10.5" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">左叶子 +9</text>

  <rect x="150" y="240" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="202" y="261" text-anchor="middle" font-size="10.5" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">左叶子 +15</text>

  <rect x="382" y="286" width="116" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="306" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">右叶子，不计</text>

  <rect x="170" y="336" width="360" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="350" y="357" text-anchor="middle" font-size="12" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">sum = 9 + 15 = 24</text>
  <text x="350" y="374" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">20 有孩子，不是叶子；7 是叶子但在右边</text>

  <rect x="40" y="398" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="419" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">判据：x.left 非空 且 x.left 的左右孩子都为空  ⟹  累加 x.left.val</text>
  <text x="56" y="441" font-size="10" fill="#555" filter="url(#rough2)">「左」的信息由父节点天然提供，不需要 parent 指针，也不需要 isLeft 参数</text>
</svg>
