<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fafafa"/>
  <text x="340" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：按位 AND 只清位、不减位 ⟹ 最大子数组 AND = max(nums)</text>
  <path d="M 150 44 Q 340 52 530 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="42" y="76" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">① 逐位做逻辑与：1 只会变少，不会变多</text>

  <g filter="url(#sk)"><rect x="150" y="88" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="163" y="106" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="176" y="88" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="189" y="106" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="202" y="88" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="215" y="106" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">1</text>
  <text x="250" y="106" font-size="12" fill="#4a4a4a" filter="url(#sk)">= 3</text>
  <text x="120" y="106" font-size="12" fill="#4a4a4a" filter="url(#sk)">a =</text>

  <g filter="url(#sk)"><rect x="150" y="118" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="163" y="136" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="176" y="118" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="189" y="136" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="202" y="118" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="215" y="136" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">1</text>
  <text x="250" y="136" font-size="12" fill="#4a4a4a" filter="url(#sk)">= 5</text>
  <text x="120" y="136" font-size="12" fill="#4a4a4a" filter="url(#sk)">b =</text>

  <g filter="url(#sk)"><rect x="150" y="152" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="163" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5c24" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="176" y="152" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="189" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5c24" filter="url(#sk)">0</text>
  <g filter="url(#sk)"><rect x="202" y="152" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="215" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5c24" filter="url(#sk)">1</text>
  <text x="250" y="170" font-size="12" font-weight="bold" fill="#2e5c24" filter="url(#sk)">= 1 ≤ min(3,5)</text>
  <text x="120" y="170" font-size="12" font-weight="bold" fill="#2e5c24" filter="url(#sk)">a&amp;b =</text>

  <text x="150" y="80" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">高位在左</text>

  <g filter="url(#sk)"><rect x="42" y="192" width="270" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="177" y="213" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">a &amp; b ≤ a 且 ≤ b ⟹ 段 AND ≤ 段内每个元素</text>

  <g filter="url(#sk)"><rect x="380" y="76" width="258" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="509" y="94" text-anchor="middle" font-size="11.5" fill="#2b4a68" filter="url(#sk)">任何非空子数组的 AND</text>
  <text x="509" y="112" text-anchor="middle" font-size="11.5" fill="#2b4a68" filter="url(#sk)">都 ≤ max(nums)（封顶）</text>
  <g filter="url(#sk)"><path d="M 509 120 L 509 140" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><rect x="380" y="144" width="258" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="509" y="162" text-anchor="middle" font-size="11.5" fill="#2e5c24" filter="url(#sk)">单元素子数组 [mx] 的 AND</text>
  <text x="509" y="180" text-anchor="middle" font-size="11.5" fill="#2e5c24" filter="url(#sk)">恰为 mx（顶格取等）</text>
  <g filter="url(#sk)"><path d="M 509 188 L 509 208" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><rect x="380" y="212" width="258" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="509" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a3a" filter="url(#sk)">k = max(nums)，别无可能</text>

  <text x="42" y="262" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#sk)">② 想让长 &gt; 1 的段 AND 仍 = k？整段必须全是 k</text>

  <g filter="url(#sk)"><rect x="52" y="276" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="82" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5c24" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="112" y="276" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="142" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5c24" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="172" y="276" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="202" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5c24" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><path d="M 240 293 L 268 293" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <text x="282" y="290" font-size="11.5" fill="#2e5c24" filter="url(#sk)">AND = 3 = k ✓</text>
  <text x="282" y="306" font-size="10.5" fill="#888" filter="url(#sk)">相同值按位与仍是自身</text>

  <g filter="url(#sk)"><rect x="52" y="326" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="82" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5c24" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="112" y="326" width="60" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="142" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a3a" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="172" y="326" width="60" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="202" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5c24" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><path d="M 240 343 L 268 343" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)"/></g>
  <text x="282" y="340" font-size="11.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">AND ≤ 2 &lt; 3 ✗</text>
  <text x="282" y="356" font-size="10.5" fill="#888" filter="url(#sk)">一个 2 就拖垮整段</text>

  <g filter="url(#sk)"><rect x="380" y="276" width="258" height="84" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="509" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">等价转化（解题钥匙）</text>
  <text x="509" y="322" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">AND = k ⟺ 段内每个元素都 = k</text>
  <text x="509" y="344" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">⟹ 问题变成「等于 max(nums) 的</text>
  <text x="509" y="354" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">元素构成的最长连续段长度」</text>

  <g filter="url(#sk)"><rect x="42" y="384" width="296" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="190" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">赛道提速点</text>
  <text x="190" y="430" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">n ≤ 10⁵ 排除枚举所有子数组</text>
  <text x="190" y="450" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">滑窗 / DP / 二分都是烟雾弹</text>

  <g filter="url(#sk)"><rect x="360" y="384" width="278" height="80" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="499" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#a03a3a" filter="url(#sk)">最反直觉的一步</text>
  <text x="499" y="430" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">转化后全程无需计算任何 AND</text>
  <text x="499" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#a03a3a" filter="url(#sk)">两趟 O(n) 扫描直接收工</text>
</svg>
