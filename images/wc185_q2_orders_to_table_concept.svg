  <!-- ===== 底部：三个要点 ===== -->
  <g filter="url(#sk)">
    <rect x="26" y="372" width="282" height="96" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="322" y="372" width="282" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
