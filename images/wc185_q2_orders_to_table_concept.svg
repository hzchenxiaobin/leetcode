  <text x="167" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">① 姓名是烟雾弹</text>
  <text x="40" y="420" font-size="10.5" fill="#444">每条订单对答案的贡献只有</text>
  <text x="40" y="438" font-size="10.5" fill="#444">(桌号 t, 餐品 f) 的一次计数</text>
  <text x="40" y="456" font-size="10.5" fill="#444">与「谁点的」完全无关</text>
  <text x="463" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">② 两种排序规则</text>
  <text x="336" y="420" font-size="10.5" fill="#444">列：餐品名按字典序升序</text>
  <text x="336" y="438" font-size="10.5" fill="#444">行：桌号按数值升序（转 int）</text>
  <text x="336" y="456" font-size="10.5" fill="#8f3830">字符串排序 "10"&lt;"3" 会翻车</text>
  <text x="759" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5a24">③ 输出是稠密矩阵</text>
  <text x="632" y="420" font-size="10.5" fill="#444">每行要填齐全部餐品列</text>
  <text x="632" y="438" font-size="10.5" fill="#444">未点的格子补 "0"</text>
  <text x="632" y="456" font-size="10.5" fill="#444">输出规模即复杂度下界</text>
