<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="307" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">闭式：每个交叉点贡献 min(h, v) —— 答案只由两条开销表决定</text>
  <path d="M 110 40 Q 320 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left panel: the cake with 3 h-lines and 2 v-lines -->
  <g filter="url(#sk)">
    <rect x="30" y="56" width="280" height="250" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="170" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">m=4, n=3 的蛋糕（示例 3）</text>
  <g filter="url(#sk)">
    <rect x="86" y="96" width="162" height="190" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.6" rx="3"/>
    <path d="M 86 143 L 248 143" stroke="#446688" stroke-width="2.2" stroke-dasharray="7 4" fill="none"/>
    <path d="M 86 191 L 248 191" stroke="#446688" stroke-width="2.2" stroke-dasharray="7 4" fill="none"/>
    <path d="M 86 238 L 248 238" stroke="#446688" stroke-width="2.2" stroke-dasharray="7 4" fill="none"/>
    <path d="M 140 96 L 140 286" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="7 4" fill="none"/>
    <path d="M 194 96 L 194 286" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="7 4" fill="none"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="140" y="90" fill="#a06a20" font-weight="bold">v=5</text>
    <text x="194" y="90" fill="#a06a20" font-weight="bold">v=3</text>
  </g>
  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="end">
    <text x="80" y="147">h=7</text>
    <text x="80" y="195">h=1</text>
    <text x="80" y="242">h=1</text>
  </g>
  <g filter="url(#sk)">
    <circle cx="140" cy="143" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="194" cy="143" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="140" cy="191" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="194" cy="191" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="140" cy="238" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="194" cy="238" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="170" y="298" text-anchor="middle" font-size="11" fill="#2e6e2e">每对 (h, v) 恰有一个交叉点 ●，共 3×2 = 6 对</text>

  <!-- right panel: the min table -->
  <g filter="url(#sk)">
    <rect x="330" y="56" width="280" height="250" rx="10" fill="#fff4e4" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="470" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a20">min 表：逐对取较便宜者</text>
  <g filter="url(#sk)">
    <rect x="392" y="92" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="482" y="92" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="346" y="124" width="46" height="46" fill="#e8f0fa" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="392" y="124" width="90" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="482" y="124" width="90" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="346" y="170" width="46" height="46" fill="#e8f0fa" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="392" y="170" width="90" height="46" fill="#e8f0fa" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="482" y="170" width="90" height="46" fill="#e8f0fa" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="346" y="216" width="46" height="46" fill="#e8f0fa" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="392" y="216" width="90" height="46" fill="#e8f0fa" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="482" y="216" width="90" height="46" fill="#e8f0fa" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <g text-anchor="middle" font-weight="bold" font-size="14">
    <text x="437" y="113" fill="#a06a20">5</text>
    <text x="527" y="113" fill="#a06a20">3</text>
    <text x="369" y="152" fill="#446688">7</text>
    <text x="369" y="198" fill="#446688">1</text>
    <text x="369" y="244" fill="#446688">1</text>
    <text x="437" y="152" fill="#a06a20">5</text>
    <text x="527" y="152" fill="#a06a20">3</text>
    <text x="437" y="198" fill="#446688">1</text>
    <text x="527" y="198" fill="#446688">1</text>
    <text x="437" y="244" fill="#446688">1</text>
    <text x="527" y="244" fill="#446688">1</text>
  </g>
  <g filter="url(#sk)">
    <rect x="346" y="272" width="11" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2"/>
    <rect x="346" y="290" width="11" height="11" fill="#e8f0fa" stroke="#446688" stroke-width="1.2" rx="2"/>
  </g>
  <text x="363" y="281" font-size="10.5" fill="#7a5a20">v 较便宜 → v 当“后切者”</text>
  <text x="363" y="299" font-size="10.5" fill="#3a5678">h 较便宜 → h 当“后切者”</text>
  <text x="576" y="176" text-anchor="end" font-size="12" font-weight="bold" fill="#a06a20">Σ min</text>
  <text x="576" y="192" text-anchor="end" font-size="12" font-weight="bold" fill="#a06a20">= 12</text>

  <!-- bottom formula box -->
  <g filter="url(#sk)">
    <rect x="40" y="322" width="560" height="96" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="320" y="348" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">ans = Σ 线开销 + Σ 每对交叉的 min(h, v)</text>
  <text x="320" y="372" text-anchor="middle" font-size="13" fill="#2b6e9e">= (7+1+1) + (5+3) + [5+3+1+1+1+1] = 17 + 12 = 29</text>
  <text x="320" y="396" text-anchor="middle" font-size="12" fill="#2b6e9e">与切线位置无关、与 m,n 具体值无关 —— 两条开销表的内容（多重集）决定一切</text>
</svg>
