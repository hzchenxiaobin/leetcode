<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：最后一层恰好是 books[j .. i-1]</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">切点 j 一旦确定，前缀与最后一层互不影响，可以分开最优</text>

  <!-- 书本：书脊宽度 = 厚度，书脊高度 = 高度 -->
  <g filter="url(#rough2)">
    <rect x="70" y="198" width="24" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2"/>
    <rect x="94" y="166" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2"/>
    <rect x="142" y="166" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2"/>
    <rect x="190" y="198" width="24" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="2"/>
    <rect x="214" y="198" width="24" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="2"/>
    <rect x="238" y="198" width="24" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="2"/>
    <rect x="262" y="182" width="24" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="2"/>
    <text x="82" y="210" text-anchor="middle" font-size="9" fill="#3a5a30">1</text>
    <text x="118" y="210" text-anchor="middle" font-size="9" fill="#3a5a30">3</text>
    <text x="166" y="210" text-anchor="middle" font-size="9" fill="#3a5a30">3</text>
    <text x="202" y="210" text-anchor="middle" font-size="9" fill="#3a4a66">1</text>
    <text x="226" y="210" text-anchor="middle" font-size="9" fill="#3a4a66">1</text>
    <text x="250" y="210" text-anchor="middle" font-size="9" fill="#3a4a66">1</text>
    <text x="274" y="210" text-anchor="middle" font-size="9" fill="#3a4a66">2</text>
  </g>

  <!-- 书架底板 -->
  <path d="M 62 216 L 292 216" stroke="#8a6a20" stroke-width="2.4" fill="none" filter="url(#rough2)"/>

  <!-- 厚度标注 -->
  <g font-size="9" text-anchor="middle" fill="#777" filter="url(#rough2)">
    <text x="82" y="232">t=1</text>
    <text x="118" y="232">t=2</text>
    <text x="166" y="232">t=2</text>
    <text x="202" y="232">t=1</text>
    <text x="226" y="232">t=1</text>
    <text x="250" y="232">t=1</text>
    <text x="274" y="232">t=1</text>
  </g>

  <!-- 切点虚线 -->
  <path d="M 190 104 L 190 236" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 286 104 L 286 236" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="186" y="98" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="292" y="98" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="118" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">前缀：dp[j] 已最优</text>
  <text x="238" y="160" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">最后一层（新建）</text>

  <!-- 覆盖括号 -->
  <path d="M 70 244 L 70 248 L 190 248 L 190 244" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 190 244 L 190 248 L 286 248 L 286 244" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="130" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">已按最优切分</text>
  <text x="238" y="264" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">Σt = 1+1+1+1 = 4 ≤ W</text>

  <!-- 公式框 -->
  <rect x="46" y="282" width="468" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">dp[i] = min over j { dp[j] + max(h[j .. i-1]) }</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#5a4a20" filter="url(#rough2)">约束：Σ t[j .. i-1] ≤ shelfWidth，层高取该层最高的一本</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#5a4a20" filter="url(#rough2)">j 从 i-1 逆序枚举，厚度一旦超限立即 break</text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">答案 = dp[n]</text>
</svg>
