<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">快慢指针找中点，反转后半段，再双指针同行</text>

  <!-- 第一步：快慢指针 -->
  <text x="120" y="58" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">第 1 步：fast 走两步、slow 走一步</text>
  <g filter="url(#rough2)">
    <rect x="50" y="72" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="116" y="72" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="182" y="72" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="248" y="72" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="314" y="72" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="380" y="72" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="73" y="93">5</text>
    <text x="139" y="93">4</text>
    <text x="205" y="93">2</text>
    <text x="271" y="93">1</text>
    <text x="337" y="93">6</text>
    <text x="403" y="93">3</text>
  </g>
  <g filter="url(#rough2)" fill="none" stroke="#446688" stroke-width="2">
    <path d="M 96 89 L 112 89" marker-end="url(#arr)"/>
    <path d="M 162 89 L 178 89" marker-end="url(#arr)"/>
    <path d="M 228 89 L 244 89" marker-end="url(#arr)"/>
    <path d="M 294 89 L 310 89" marker-end="url(#arr)"/>
    <path d="M 360 89 L 376 89" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <text x="139" y="122" fill="#4a7a3a">slow 终点（前半末）</text>
    <text x="403" y="122" fill="#b85450">fast 终点（尾节点）</text>
  </g>
  <path d="M 139 126 C 139 136, 139 138, 139 130" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 第二步：反转后半 -->
  <text x="120" y="168" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">第 2 步：反转 slow 之后的链表</text>
  <g filter="url(#rough2)">
    <rect x="50" y="182" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="116" y="182" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="314" y="240" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="380" y="240" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="446" y="240" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="73" y="203">5</text>
    <text x="139" y="203">4</text>
    <text x="337" y="261">3</text>
    <text x="403" y="261">6</text>
    <text x="469" y="261">1</text>
  </g>
  <g filter="url(#rough2)" fill="none" stroke="#446688" stroke-width="2">
    <path d="M 96 199 L 112 199" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" fill="none" stroke="#b85450" stroke-width="2">
    <path d="M 395 240 C 383 220, 355 220, 343 238" marker-end="url(#arrr)"/>
    <path d="M 461 240 C 449 220, 421 220, 409 238" marker-end="url(#arrr)"/>
  </g>
  <text x="280" y="168" font-size="11.5" fill="#b85450" filter="url(#rough2)" text-anchor="middle">后半 2→1→6→3 变成 3→6→1→2 方向的独立链</text>

  <!-- 第三步：双指针 -->
  <text x="120" y="316" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">第 3 步：a、b 同步前进，逐对求和取 max</text>
  <g filter="url(#rough2)">
    <rect x="50" y="330" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="314" y="330" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="73" y="351">5</text>
    <text x="337" y="351">3</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#666" text-anchor="middle">
    <text x="73" y="380">a 从 head 出发</text>
    <text x="337" y="380">b 从反转链头出发</text>
  </g>
  <path d="M 100 347 C 180 347, 230 347, 308 347" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="205" y="338" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">5+3, 4+6, 2+1, 1+2 → max</text>

  <text x="470" y="351" font-size="12.5" fill="#666" filter="url(#rough2)" text-anchor="middle">全程 O(1) 额外空间</text>
  <text x="470" y="370" font-size="12.5" fill="#666" filter="url(#rough2)" text-anchor="middle">（不建数组、不用栈）</text>
</svg>
