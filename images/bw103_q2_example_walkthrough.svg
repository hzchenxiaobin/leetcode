<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：A=[1,3,2,4]，B=[3,1,2,4] 逐位计数</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="12">
    <text x="80" y="60" text-anchor="middle" fill="#666">i</text>
    <text x="160" y="60" text-anchor="middle" fill="#666">新加入</text>
    <text x="300" y="60" text-anchor="middle" fill="#666">计数变化（值:次数）</text>
    <text x="450" y="60" text-anchor="middle" fill="#666">common → C[i]</text>
  </g>

  <!-- 四行 -->
  <g filter="url(#rough2)" font-size="12.5">
    <rect x="40" y="72" width="80" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="80" y="100" text-anchor="middle" fill="#2f4a66">i = 0</text>
    <text x="160" y="100" text-anchor="middle" fill="#555">1, 3</text>
    <text x="300" y="100" text-anchor="middle" fill="#555">1:1  3:1</text>
    <rect x="400" y="72" width="100" height="46" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="450" y="100" text-anchor="middle" fill="#666">0 → C[0]=0</text>

    <rect x="40" y="126" width="80" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="80" y="154" text-anchor="middle" fill="#2f4a66">i = 1</text>
    <text x="160" y="154" text-anchor="middle" fill="#555">3, 1</text>
    <text x="300" y="154" text-anchor="middle" fill="#555">3:2*  1:2*</text>
    <rect x="400" y="126" width="100" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="450" y="154" text-anchor="middle" fill="#2f5527">2 → C[1]=2</text>

    <rect x="40" y="180" width="80" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="80" y="208" text-anchor="middle" fill="#2f4a66">i = 2</text>
    <text x="160" y="208" text-anchor="middle" fill="#555">2, 2</text>
    <text x="300" y="208" text-anchor="middle" fill="#555">2:2*（同位一次到位）</text>
    <rect x="400" y="180" width="100" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="450" y="208" text-anchor="middle" fill="#2f5527">3 → C[2]=3</text>

    <rect x="40" y="234" width="80" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="80" y="262" text-anchor="middle" fill="#2f4a66">i = 3</text>
    <text x="160" y="262" text-anchor="middle" fill="#555">4, 4</text>
    <text x="300" y="262" text-anchor="middle" fill="#555">4:2*（同位一次到位）</text>
    <rect x="400" y="234" width="100" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="450" y="262" text-anchor="middle" fill="#2f5527">4 → C[3]=4</text>
  </g>

  <text x="40" y="312" font-size="12" fill="#7a5a10" filter="url(#rough2)">带 * 的自增恰使计数达到 2 —— 该值此刻转正（两侧前缀都含它），common 加一。</text>
  <text x="40" y="330" font-size="12" fill="#7a5a10" filter="url(#rough2)">i=2、i=3 处 A[i]=B[i]：先到 2 记一次，再到 3 不重复记。</text>
</svg>
