<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="600" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：packages = [3,5,8,10,11,12]</text>
  <path d="M 240 42 Q 470 50 700 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- common prefix -->
  <text x="470" y="72" text-anchor="middle" font-size="11" fill="#666" font-family="monospace">排序后 packages = [3,5,8,10,11,12]，prefix = [0,3,8,16,26,37,49]</text>

  <!-- ===== Supplier 2: [10,5,14] -> sorted [5,10,14] ===== -->
  <text x="470" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">供应商 2：boxes = [10,5,14] → 排序 [5,10,14]（最优）</text>

  <!-- table header -->
  <g font-size="11" font-weight="bold" fill="#2b4e6e">
    <text x="120" y="134" text-anchor="middle">箱 b</text>
    <text x="250" y="134" text-anchor="middle">upper_bound → idx</text>
    <text x="410" y="134" text-anchor="middle">本段包裹 (prev, idx]</text>
    <text x="590" y="134" text-anchor="middle">段和</text>
    <text x="780" y="134" text-anchor="middle">段浪费 = b·cnt − 段和</text>
  </g>
  <path d="M 80 142 Q 470 148 880 142" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- row 1: b=5 -->
  <g font-size="11">
    <text x="120" y="172" text-anchor="middle" fill="#2e6e2e" font-weight="bold">5</text>
    <text x="250" y="172" text-anchor="middle" fill="#444" font-family="monospace">idx = 2（3,5 ≤ 5）</text>
    <g filter="url(#sk)"><rect x="330" y="158" width="30" height="20" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" rx="3"/></g>
    <text x="345" y="172" text-anchor="middle" fill="#2e6e2e" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="366" y="158" width="30" height="20" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3" rx="3"/></g>
    <text x="381" y="172" text-anchor="middle" fill="#2e6e2e" font-weight="bold">5</text>
    <g filter="url(#sk)"><rect x="402" y="158" width="30" height="20" fill="#f0ede4" stroke="#ddd" stroke-width="1" rx="3"/></g>
    <text x="417" y="172" text-anchor="middle" fill="#bbb">8</text>
    <g filter="url(#sk)"><rect x="438" y="158" width="30" height="20" fill="#f0ede4" stroke="#ddd" stroke-width="1" rx="3"/></g>
    <text x="453" y="172" text-anchor="middle" fill="#bbb">10</text>
    <g filter="url(#sk)"><rect x="474" y="158" width="30" height="20" fill="#f0ede4" stroke="#ddd" stroke-width="1" rx="3"/></g>
    <text x="489" y="172" text-anchor="middle" fill="#bbb">11</text>
    <g filter="url(#sk)"><rect x="510" y="158" width="30" height="20" fill="#f0ede4" stroke="#ddd" stroke-width="1" rx="3"/></g>
    <text x="525" y="172" text-anchor="middle" fill="#bbb">12</text>
    <text x="590" y="172" text-anchor="middle" fill="#444" font-family="monospace">8</text>
    <text x="780" y="172" text-anchor="middle" fill="#b03a3a" font-family="monospace" font-weight="bold">5×2 − 8 = 2</text>
  </g>

  <!-- row 2: b=10 -->
  <g font-size="11">
    <text x="120" y="208" text-anchor="middle" fill="#7a5415" font-weight="bold">10</text>
    <text x="250" y="208" text-anchor="middle" fill="#444" font-family="monospace">idx = 4（8,10 ≤ 10）</text>
    <g filter="url(#sk)"><rect x="330" y="194" width="30" height="20" fill="#f0ede4" stroke="#ddd" stroke-width="1" rx="3"/></g>
    <text x="345" y="208" text-anchor="middle" fill="#bbb">3</text>
    <g filter="url(#sk)"><rect x="366" y="194" width="30" height="20" fill="#f0ede4" stroke="#ddd" stroke-width="1" rx="3"/></g>
    <text x="381" y="208" text-anchor="middle" fill="#bbb">5</text>
    <g filter="url(#sk)"><rect x="402" y="194" width="30" height="20" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5" rx="3"/></g>
    <text x="417" y="208" text-anchor="middle" fill="#7a5415" font-weight="bold">8</text>
    <g filter="url(#sk)"><rect x="438" y="194" width="30" height="20" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5" rx="3"/></g>
    <text x="453" y="208" text-anchor="middle" fill="#7a5415" font-weight="bold">10</text>
    <g filter="url(#sk)"><rect x="474" y="194" width="30" height="20" fill="#f0ede4" stroke="#ddd" stroke-width="1" rx="3"/></g>
    <text x="489" y="208" text-anchor="middle" fill="#bbb">11</text>
    <g filter="url(#sk)"><rect x="510" y="194" width="30" height="20" fill="#f0ede4" stroke="#ddd" stroke-width="1" rx="3"/></g>
    <text x="525" y="208" text-anchor="middle" fill="#bbb">12</text>
    <text x="590" y="208" text-anchor="middle" fill="#444" font-family="monospace">18</text>
    <text x="780" y="208" text-anchor="middle" fill="#b03a3a" font-family="monospace" font-weight="bold">10×2 − 18 = 2</text>
  </g>

  <!-- row 3: b=14 -->
  <g font-size="11">
    <text x="120" y="244" text-anchor="middle" fill="#a04440" font-weight="bold">14</text>
    <text x="250" y="244" text-anchor="middle" fill="#444" font-family="monospace">idx = 6（11,12 ≤ 14）</text>
    <g filter="url(#sk)"><rect x="330" y="230" width="30" height="20" fill="#f0ede4" stroke="#ddd" stroke-width="1" rx="3"/></g>
    <text x="345" y="244" text-anchor="middle" fill="#bbb">3</text>
    <g filter="url(#sk)"><rect x="366" y="230" width="30" height="20" fill="#f0ede4" stroke="#ddd" stroke-width="1" rx="3"/></g>
    <text x="381" y="244" text-anchor="middle" fill="#bbb">5</text>
    <g filter="url(#sk)"><rect x="402" y="230" width="30" height="20" fill="#f0ede4" stroke="#ddd" stroke-width="1" rx="3"/></g>
    <text x="417" y="244" text-anchor="middle" fill="#bbb">8</text>
    <g filter="url(#sk)"><rect x="438" y="230" width="30" height="20" fill="#f0ede4" stroke="#ddd" stroke-width="1" rx="3"/></g>
    <text x="453" y="244" text-anchor="middle" fill="#bbb">10</text>
    <g filter="url(#sk)"><rect x="474" y="230" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="489" y="244" text-anchor="middle" fill="#a04440" font-weight="bold">11</text>
    <g filter="url(#sk)"><rect x="510" y="230" width="30" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/></g>
    <text x="525" y="244" text-anchor="middle" fill="#a04440" font-weight="bold">12</text>
    <text x="590" y="244" text-anchor="middle" fill="#444" font-family="monospace">23</text>
    <text x="780" y="244" text-anchor="middle" fill="#b03a3a" font-family="monospace" font-weight="bold">14×2 − 23 = 5</text>
  </g>

  <!-- supplier 2 total -->
  <g filter="url(#sk)">
    <rect x="560" y="262" width="330" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="725" y="284" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">总浪费 = 2 + 2 + 5 = 9，prev = 6 = n ✓</text>

  <!-- ===== Supplier 0 and 1 ===== -->
  <text x="470" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">另外两个供应商（对照）</text>

  <!-- supplier 0 -->
  <g filter="url(#sk)">
    <rect x="80" y="356" width="370" height="120" rx="8" fill="#f0ede4" stroke="#aaa" stroke-width="1.3"/>
  </g>
  <text x="100" y="380" font-size="12" font-weight="bold" fill="#555">供应商 0：boxes = [12]</text>
  <text x="100" y="404" font-size="11" fill="#444" font-family="monospace">最大箱 12 ≥ 最大包裹 12 → 有效</text>
  <text x="100" y="426" font-size="11" fill="#444" font-family="monospace">唯一箱 12 装全部 6 个包裹</text>
  <text x="100" y="450" font-size="11" fill="#b03a3a" font-family="monospace" font-weight="bold">浪费 = 12×6 − 49 = 23</text>

  <!-- supplier 1 -->
  <g filter="url(#sk)">
    <rect x="490" y="356" width="400" height="120" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="510" y="380" font-size="12" font-weight="bold" fill="#a04440">供应商 1：boxes = [11,9]</text>
  <text x="510" y="404" font-size="11" fill="#444" font-family="monospace">最大箱 11 &lt; 最大包裹 12</text>
  <text x="510" y="426" font-size="11" fill="#a04440" font-weight="bold">→ O(1) 剪枝：整组跳过，不参与比较</text>
  <text x="510" y="450" font-size="11" fill="#666">即使遍历，prev 也到不了 n</text>

  <!-- final answer -->
  <g filter="url(#sk)">
    <rect x="80" y="500" width="810" height="72" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="485" y="528" text-anchor="middle" font-size="13" fill="#2b4e6e" font-weight="bold">ans = min(9, 23) = 9（供应商 2 最优）→ 9 mod (10⁹+7) = 9</text>
  <text x="485" y="552" text-anchor="middle" font-size="11" fill="#666">对照暴力逐包裹：(5−3)+(5−5)+(10−8)+(10−10)+(14−11)+(14−12) = 9 ✓</text>
</svg>
