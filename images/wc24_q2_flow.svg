<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>
  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：逆中序 + 一个累加和 acc</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">遍历到谁，acc 就是「所有不小于它的值之和」</text>
  <rect x="195" y="62" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="84" font-size="12" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dfs(node)</text>
  <path d="M 280 96 L 280 118" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="280,120 400,152 280,184 160,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="157" font-size="11.5" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">node 为空？</text>
  <path d="M 400 152 L 428 152" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="143" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">是</text>
  <rect x="430" y="138" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="157" font-size="11" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">return</text>
  <path d="M 280 184 L 280 212" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="202" font-size="10" fill="#888" text-anchor="start" filter="url(#rough2)">否</text>
  <rect x="175" y="214" width="210" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="237" font-size="11" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">dfs(node.right)  ← 先处理更大的值</text>
  <path d="M 280 250 L 280 272" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="274" width="260" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="295" font-size="11.5" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">acc += node.val</text>
  <text x="280" y="312" font-size="11.5" fill="#8a6a20" text-anchor="middle" font-weight="bold" filter="url(#rough2)">node.val = acc</text>
  <path d="M 280 320 L 280 344" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="175" y="346" width="210" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" font-size="11" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">dfs(node.left)  ← 最后处理更小的值</text>
  <text x="280" y="404" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">每个结点恰好进入一次，只做常数次加法与赋值 → 线性时间</text>
  <text x="280" y="420" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">树的结构（left / right 指针）完全不动</text>
</svg>
