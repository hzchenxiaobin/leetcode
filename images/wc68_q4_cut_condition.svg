<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 424" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="424" fill="#fafafa"/>
  <text x="280.0" y="28.0" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：在第 i 与 i+1 之间能否切开</text>
  <text x="280.0" y="48.0" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">充要条件：max(a[0..i]) ≤ min(a[i+1..n−1])</text>
  <text x="114.0" y="88.0" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">a[i]</text>
  <rect x="122.0" y="70.0" width="58.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="151.0" y="91.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="190.0" y="70.0" width="58.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="219.0" y="91.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="258.0" y="70.0" width="58.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="287.0" y="91.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="326.0" y="70.0" width="58.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="355.0" y="91.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="394.0" y="70.0" width="58.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="423.0" y="91.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="114.0" y="156.0" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">前缀 max</text>
  <rect x="122.0" y="136.0" width="58.0" height="32.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="151.0" y="156.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="190.0" y="136.0" width="58.0" height="32.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="219.0" y="156.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="258.0" y="136.0" width="58.0" height="32.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="287.0" y="156.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="326.0" y="136.0" width="58.0" height="32.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="355.0" y="156.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="394.0" y="136.0" width="58.0" height="32.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="423.0" y="156.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="114.0" y="204.0" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">右侧 min</text>
  <rect x="122.0" y="184.0" width="58.0" height="32.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="151.0" y="204.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="190.0" y="184.0" width="58.0" height="32.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="219.0" y="204.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="258.0" y="184.0" width="58.0" height="32.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="287.0" y="204.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="326.0" y="184.0" width="58.0" height="32.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="355.0" y="204.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="394.0" y="184.0" width="58.0" height="32.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="423.0" y="204.5" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="151.0" y="118.0" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="219.0" y="118.0" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="287.0" y="118.0" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="355.0" y="118.0" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="423.0" y="118.0" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="114.0" y="252.0" text-anchor="end" font-size="10.5" fill="#555" filter="url(#rough2)">可切？</text>
  <text x="185.0" y="252.0" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="232.0" y="234.0" width="42.0" height="26.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="253.0" y="252.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <path d="M 253.0 62 L 253.0 262" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>
  <rect x="300.0" y="234.0" width="42.0" height="26.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="321.0" y="252.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <path d="M 321.0 62 L 321.0 262" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>
  <rect x="368.0" y="234.0" width="42.0" height="26.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="389.0" y="252.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <path d="M 389.0 62 L 389.0 262" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>
  <text x="280.0" y="276.0" text-anchor="middle" font-size="9.4" fill="#888" filter="url(#rough2)">第 i 格的「右侧 min」= min(a[i+1..n−1])；✓ / ✗ 标在 i 与 i+1 的缝隙上，虚线即切点</text>
  <rect x="40.0" y="290.0" width="480.0" height="94.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="56.0" y="311.0" text-anchor="start" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">为什么？</text>
  <text x="56.0" y="330.0" text-anchor="start" font-size="9.6" fill="#555" filter="url(#rough2)">若左最大 &gt; 右最小：设 a[p] 为左侧最大、a[q] 为右侧最小（q &gt; p）。</text>
  <text x="56.0" y="347.0" text-anchor="start" font-size="9.6" fill="#555" filter="url(#rough2)">排序后 a[p] 必排在 a[q] 之后，二者跨过切点 → 此处不可切。</text>
  <text x="56.0" y="364.0" text-anchor="start" font-size="9.6" fill="#555" filter="url(#rough2)">反之左侧元素全 ≤ 右侧时，两块各自排序即可拼成有序 → 必可切。</text>
  <text x="280.0" y="410.0" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">示例 a = [2,1,3,4,4]：i = 1,2,3 三处可切 → 最多 4 块</text>
</svg>
