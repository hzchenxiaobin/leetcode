<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="149" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：答案就是 |a 数 − b 数|</text>
  <path d="M 190 44 Q 320 52 450 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- example 1: aabbab -->
  <text x="64" y="90" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1</text>
  <g filter="url(#sk)">
    <rect x="128" y="66" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="168" y="66" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="208" y="66" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="248" y="66" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="288" y="66" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="328" y="66" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="146" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="186" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="226" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#sk)">b</text>
  <text x="266" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#sk)">b</text>
  <text x="306" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="346" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#sk)">b</text>
  <text x="128" y="120" font-size="11.5" fill="#555" filter="url(#sk)">a×3，b×3 ⇒ |D| = 0</text>
  <path d="M 386 84 L 420 84" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <rect x="428" y="64" width="56" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="456" y="90" text-anchor="middle" font-size="18" font-weight="bold" fill="#a04a48" filter="url(#sk)">0</text>
  <text x="498" y="78" font-size="10.5" fill="#666" filter="url(#sk)">整串就是平衡子串</text>
  <text x="498" y="94" font-size="10.5" fill="#666" filter="url(#sk)">一次删空</text>

  <!-- example 2: aaaa -->
  <text x="64" y="174" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2</text>
  <g filter="url(#sk)">
    <rect x="128" y="150" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="168" y="150" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="208" y="150" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="248" y="150" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="146" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="186" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="226" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="266" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="128" y="204" font-size="11.5" fill="#555" filter="url(#sk)">a×4，b×0 ⇒ |D| = 4</text>
  <path d="M 306 168 L 340 168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <rect x="348" y="148" width="56" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="376" y="174" text-anchor="middle" font-size="18" font-weight="bold" fill="#a04a48" filter="url(#sk)">4</text>
  <text x="418" y="162" font-size="10.5" fill="#666" filter="url(#sk)">没有 b，任何子串都不平衡</text>
  <text x="418" y="178" font-size="10.5" fill="#666" filter="url(#sk)">一个也删不掉，长度不变</text>

  <!-- example 3: aaabb -->
  <text x="64" y="258" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 3</text>
  <g filter="url(#sk)">
    <rect x="128" y="234" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="168" y="234" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="208" y="234" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="248" y="234" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="288" y="234" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="146" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="186" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="226" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="266" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#sk)">b</text>
  <text x="306" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#sk)">b</text>
  <text x="128" y="288" font-size="11.5" fill="#555" filter="url(#sk)">a×3，b×2 ⇒ |D| = 1</text>
  <path d="M 346 252 L 380 252" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <rect x="388" y="232" width="56" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="416" y="258" text-anchor="middle" font-size="18" font-weight="bold" fill="#a04a48" filter="url(#sk)">1</text>
  <text x="458" y="246" font-size="10.5" fill="#666" filter="url(#sk)">相邻异对消两步</text>
  <text x="458" y="262" font-size="10.5" fill="#666" filter="url(#sk)">剩下 "a"</text>

  <!-- answer box -->
  <rect x="110" y="314" width="420" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="320" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">答案 = |cnt(a) − cnt(b)|，一趟计数即可</text>
</svg>
