<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">n = 5, k = 3 的全部 7 种方案：C(7,6) = 7</text>

  <!-- 7 行方案：每行一条数轴 0..4 与三条线段 -->
  <g stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)">
    <line x1="90" y1="66" x2="330" y2="66"/>
    <line x1="90" y1="104" x2="330" y2="104"/>
    <line x1="90" y1="142" x2="330" y2="142"/>
    <line x1="90" y1="180" x2="330" y2="180"/>
    <line x1="90" y1="218" x2="330" y2="218"/>
    <line x1="90" y1="256" x2="330" y2="256"/>
    <line x1="90" y1="294" x2="330" y2="294"/>
  </g>
  <g filter="url(#rough2)">
    <g fill="#fafafa" stroke="#aaa" stroke-width="1.4">
      <circle cx="90" cy="66" r="4"/><circle cx="165" cy="66" r="4"/><circle cx="240" cy="66" r="4"/><circle cx="315" cy="66" r="4"/>
      <circle cx="90" cy="104" r="4"/><circle cx="165" cy="104" r="4"/><circle cx="240" cy="104" r="4"/><circle cx="315" cy="104" r="4"/>
      <circle cx="90" cy="142" r="4"/><circle cx="165" cy="142" r="4"/><circle cx="240" cy="142" r="4"/><circle cx="315" cy="142" r="4"/>
      <circle cx="90" cy="180" r="4"/><circle cx="165" cy="180" r="4"/><circle cx="240" cy="180" r="4"/><circle cx="315" cy="180" r="4"/>
      <circle cx="90" cy="218" r="4"/><circle cx="165" cy="218" r="4"/><circle cx="240" cy="218" r="4"/><circle cx="315" cy="218" r="4"/>
      <circle cx="90" cy="256" r="4"/><circle cx="165" cy="256" r="4"/><circle cx="240" cy="256" r="4"/><circle cx="315" cy="256" r="4"/>
      <circle cx="90" cy="294" r="4"/><circle cx="165" cy="294" r="4"/><circle cx="240" cy="294" r="4"/><circle cx="315" cy="294" r="4"/>
    </g>
    <!-- 行1: (0,1)(1,2)(2,3) -->
    <g stroke="#446688" stroke-width="4.5" stroke-linecap="round">
      <line x1="90" y1="66" x2="165" y2="66"/>
      <line x1="165" y1="66" x2="240" y2="66"/>
      <line x1="240" y1="66" x2="315" y2="66"/>
    </g>
    <!-- 行2: (0,1)(1,2)(2,4) -->
    <g stroke="#446688" stroke-width="4.5" stroke-linecap="round">
      <line x1="90" y1="104" x2="165" y2="104"/>
      <line x1="165" y1="104" x2="240" y2="104"/>
      <line x1="240" y1="104" x2="330" y2="104"/>
    </g>
    <!-- 行3: (0,1)(1,2)(3,4) -->
    <g stroke="#446688" stroke-width="4.5" stroke-linecap="round">
      <line x1="90" y1="142" x2="165" y2="142"/>
      <line x1="165" y1="142" x2="240" y2="142"/>
      <line x1="315" y1="142" x2="330" y2="142"/>
    </g>
    <!-- 行4: (0,1)(1,3)(3,4) -->
    <g stroke="#446688" stroke-width="4.5" stroke-linecap="round">
      <line x1="90" y1="180" x2="165" y2="180"/>
      <line x1="165" y1="180" x2="315" y2="180"/>
      <line x1="315" y1="180" x2="330" y2="180"/>
    </g>
    <!-- 行5: (0,1)(2,3)(3,4) -->
    <g stroke="#446688" stroke-width="4.5" stroke-linecap="round">
      <line x1="90" y1="218" x2="165" y2="218"/>
      <line x1="240" y1="218" x2="315" y2="218"/>
      <line x1="315" y1="218" x2="330" y2="218"/>
    </g>
    <!-- 行6: (0,2)(2,3)(3,4) -->
    <g stroke="#446688" stroke-width="4.5" stroke-linecap="round">
      <line x1="90" y1="256" x2="240" y2="256"/>
      <line x1="240" y1="256" x2="315" y2="256"/>
      <line x1="315" y1="256" x2="330" y2="256"/>
    </g>
    <!-- 行7: (1,2)(2,3)(3,4) -->
    <g stroke="#446688" stroke-width="4.5" stroke-linecap="round">
      <line x1="165" y1="294" x2="240" y2="294"/>
      <line x1="240" y1="294" x2="315" y2="294"/>
      <line x1="315" y1="294" x2="330" y2="294"/>
    </g>
  </g>

  <!-- 右侧标签 -->
  <g filter="url(#rough2)" font-size="11.5" fill="#888">
    <text x="342" y="70">{(0,1),(1,2),(2,3)}</text>
    <text x="342" y="108">{(0,1),(1,2),(2,4)}</text>
    <text x="342" y="146">{(0,1),(1,2),(3,4)}</text>
    <text x="342" y="184">{(0,1),(1,3),(3,4)}</text>
    <text x="342" y="222">{(0,1),(2,3),(3,4)}</text>
    <text x="342" y="260">{(0,2),(2,3),(3,4)}</text>
    <text x="342" y="298">{(1,2),(2,3),(3,4)}</text>
  </g>

  <g filter="url(#rough2)" font-size="11.5" fill="#aaa" text-anchor="middle">
    <text x="90" y="60">0</text><text x="165" y="60">1</text><text x="240" y="60">2</text><text x="315" y="60">3</text><text x="330" y="60">4</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="30" y="62" width="30" height="238" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6,4" rx="8"/>
  </g>
  <text x="50" y="320" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">相邻段共端点</text>
  <text x="280" y="356" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">7 个方案与公式 C(n+k−1, 2k) = C(7,6) = 7 完全一致</text>
</svg>
