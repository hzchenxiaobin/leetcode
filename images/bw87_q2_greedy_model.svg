<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">排序 + 双指针：最弱的运动员配「刚够用」的训练师</text>

  <!-- players 行 -->
  <text x="80" y="84" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">运动员（升序）</text>
  <g filter="url(#rough2)">
    <rect x="150" y="66" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="234" y="66" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6"/>
    <rect x="318" y="66" width="64" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="182" y="90">4</text><text x="266" y="90">7</text><text x="350" y="90">9</text>
  </g>
  <text x="400" y="90" font-size="12" fill="#b85450" filter="url(#rough2)">← 没人能带他</text>

  <!-- trainers 行 -->
  <text x="80" y="180" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">训练师（升序）</text>
  <g filter="url(#rough2)">
    <rect x="150" y="162" width="64" height="38" fill="#f2f2f2" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" rx="6"/>
    <rect x="234" y="162" width="64" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="318" y="162" width="64" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="402" y="162" width="64" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="182" y="186">2</text><text x="266" y="186">5</text><text x="350" y="186">8</text><text x="434" y="186">8</text>
  </g>
  <text x="182" y="222" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">能力 2 &lt; 4，永久淘汰</text>

  <!-- 匹配箭头 -->
  <path d="M 182 106 C 182 130, 266 130, 266 158" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 266 106 C 266 128, 350 128, 350 158" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 350 106 C 350 132, 434 132, 434 158" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="132" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">4 ≤ 5 ✓</text>
  <text x="308" y="128" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">7 ≤ 8 ✓</text>
  <text x="400" y="140" font-size="11.5" fill="#b85450" filter="url(#rough2)">9 &gt; 8 ✗</text>

  <!-- 规则说明 -->
  <g filter="url(#rough2)">
    <rect x="70" y="248" width="420" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="270">指针 j 只前进：训练师一旦「带不动」当前运动员，</text>
    <text x="280" y="290">就永远带不动后面的（更弱的运动员已被处理完）→ 直接淘汰</text>
  </g>
  <text x="280" y="346" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">每名运动员占用「能带他的训练师中最便宜的一个」</text>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">强训练师留给更强的人，弱训练师尽早消耗</text>
</svg>
