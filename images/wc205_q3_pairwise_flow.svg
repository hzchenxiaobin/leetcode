<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="580" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：单次扫描，相邻同色「打擂台」</text>
  <path d="M 150 42 Q 300 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="165" y="52" width="270" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="300" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a3a">开始：ans = 0，kept = neededTime[0]</text>
  </g>
  <path d="M 300 86 L 300 102" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环条件菱形 -->
  <g filter="url(#rough2)">
    <polygon points="300,106 395,132 300,158 205,132" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="300" y="137" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">i ≤ n−1 ?</text>
    <text x="313" y="101" font-size="11" fill="#4a7a3a">是</text>
    <text x="405" y="122" font-size="11" fill="#b85450">否</text>
  </g>
  <path d="M 300 158 L 300 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 同色判断菱形 -->
  <g filter="url(#rough2)">
    <polygon points="300,180 415,216 300,252 185,216" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="300" y="213" text-anchor="middle" font-size="12.5" fill="#2b4a66">colors[i] ==</text>
    <text x="300" y="231" text-anchor="middle" font-size="12.5" fill="#2b4a66">colors[i−1] ?</text>
  </g>

  <!-- 分支箭头 -->
  <g filter="url(#rough2)">
    <path d="M 300 252 C 265 268, 190 262, 132 274" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 300 252 C 335 268, 410 262, 468 274" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <text x="218" y="262" font-size="11" fill="#b85450">是</text>
    <text x="374" y="262" font-size="11" fill="#4a7a3a">否</text>
  </g>

  <!-- 左：同色动作 -->
  <g filter="url(#rough2)">
    <rect x="40" y="276" width="170" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="125" y="298" text-anchor="middle" font-size="11.5" fill="#b85450">ans += min(t[i], kept)</text>
    <text x="125" y="316" text-anchor="middle" font-size="11.5" fill="#b85450">kept = max(kept, t[i])</text>
    <text x="125" y="336" text-anchor="middle" font-size="10" fill="#b85450">输家付费 · 赢家留守</text>
  </g>

  <!-- 右：换色动作 -->
  <g filter="url(#rough2)">
    <rect x="390" y="276" width="170" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="475" y="306" text-anchor="middle" font-size="11.5" fill="#3a5a3a">kept = t[i]</text>
    <text x="475" y="326" text-anchor="middle" font-size="11" fill="#3a5a3a">换色 → 开新段</text>
  </g>

  <!-- 汇合到 i+1 -->
  <g filter="url(#rough2)">
    <path d="M 125 346 C 125 362, 190 366, 252 376" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 475 346 C 475 362, 410 366, 348 376" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <rect x="240" y="378" width="120" height="32" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="300" y="398" text-anchor="middle" font-size="12.5" fill="#2b4a66">i ← i + 1</text>
  </g>

  <!-- 循环回边 -->
  <path d="M 300 410 L 300 432 L 26 432 L 26 132 L 198 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="16" y="300" font-size="10" fill="#888" transform="rotate(-90 16 300)" filter="url(#rough2)">扫描下一个气球</text>

  <!-- 循环出口 → 结束 -->
  <path d="M 395 132 L 575 132 L 575 492 L 378 492" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="228" y="476" width="144" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="300" y="497" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a3a">返回 ans</text>
  </g>

  <!-- 注解框 -->
  <g filter="url(#rough2)">
    <rect x="48" y="524" width="504" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="300" y="543" text-anchor="middle" font-size="11.5" fill="#b07818">kept = 当前同色段已扫部分的 neededTime 最大值（存活代表）</text>
    <text x="300" y="561" text-anchor="middle" font-size="11.5" fill="#b07818">每遇同色邻居比一场：较小者计入 ans 被删，较大者继续留守</text>
  </g>
</svg>
