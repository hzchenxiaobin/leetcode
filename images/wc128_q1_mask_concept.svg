<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">取反 = 与「同位数全 1 掩码」异或</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">N = 5（101）→ 掩码 111 → 010 = 2</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="60" y="76" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="83.0" y="100.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="114" y="76" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="137.0" y="100.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="168" y="76" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="191.0" y="100.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="30.0" y="102.0" font-size="12" fill="#888" text-anchor="start" font-weight="bold" filter="url(#rough2)">N</text>
  <text x="240.0" y="102.0" font-size="11" fill="#446688" text-anchor="start" filter="url(#rough2)">5 的二进制，共 3 位 → mask 也是 3 个 1</text>
  <rect x="60" y="132" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="83.0" y="156.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="114" y="132" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="137.0" y="156.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="168" y="132" width="46" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="191.0" y="156.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="30.0" y="158.0" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">mask</text>
  <text x="240.0" y="158.0" font-size="11" fill="#d6a040" text-anchor="start" filter="url(#rough2)">= 2^3 − 1 = 7</text>
  <text x="150.0" y="208.0" font-size="22" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">⊕</text>
  <path d="M 60.0 176.0 L 214.0 176.0" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="60" y="224" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="83.0" y="248.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="114" y="224" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="137.0" y="248.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="168" y="224" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="191.0" y="248.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="30.0" y="250.0" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">结果</text>
  <text x="240.0" y="250.0" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">逐位取反，十进制 2</text>
  <rect x="30" y="286" width="520" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="307.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">N = 0 例外：二进制是 "0"（1 位），取反得 "1"，答案是 1 而不是 0</text>
  <text x="40.0" y="323.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">所以掩码位数必须由 N 的实际位数决定，而 0 的位数按 1 处理</text>
</svg>
