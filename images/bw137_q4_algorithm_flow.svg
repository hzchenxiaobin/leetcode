<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">II 版算法：锚点 + 每列前 3 大 + 前 5 列配对</text>

  <rect x="150" y="44" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">每行前 3 大 → 候选表 C（≤ 3m 个）</text>

  <path d="M 280 82 L 280 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="102" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">每列前 4 大（跨行，按值降序）</text>

  <path d="M 280 140 L 280 158" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="160" width="320" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">枚举锚点 a = (行 i, 列 j)，共 3m 个</text>
  <text x="280" y="196" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">另两个车必须避开行 i 与列 j</text>

  <path d="M 280 202 L 280 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="108" y="222" width="344" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">每列去掉行 i、去掉列 j 后取前 3 大，按列首值排序</text>
  <text x="280" y="258" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">只留前 5 列（证明：更深的列不可能更优）</text>

  <path d="M 280 264 L 280 282" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="108" y="284" width="344" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">这 5 列 × 3 个候选 = 至多 15 个格子，两两配对</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">要求行号不同、列号不同，取最大和 → 更新答案</text>

  <rect x="72" y="350" width="416" height="60" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="86" y="372" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="86" y="390" font-size="10.5" fill="#555" filter="url(#rough2)">时间 O(m n log n + m · n · 15)，空间 O(m + n)；m = n = 500 时不到 10^6 量级</text>
  <text x="86" y="405" font-size="10" fill="#888" filter="url(#rough2)">配对只在前 5 列里做，是"每列只能用一个"这一约束的直接体现</text>
</svg>
