<svg xmlns="http://www.w3.org/2000/svg" width="720" height="578" viewBox="0 0 720 578" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="578" fill="#fdfcf7"/>
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">示例演算：n = 11（first=2, second=4）的 (l, m, r) 状态树 → [3, 4]</text>
  <path d="M 130 36 Q 360 42 590 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- root -->
  <g filter="url(#sk)">
    <rect x="312" y="52" width="96" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="360" y="72" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">(1, 1, 7)</text>
  <text x="360" y="90" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">T=11 · 回合 1</text>

  <!-- root -> R2 edges -->
  <path d="M 360 100 L 110 146" stroke="#c98a2b" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <path d="M 360 100 L 276 146" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 360 100 L 443 146" stroke="#4a8e4a" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <path d="M 360 100 L 610 146" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="110" y="126" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">1胜·3胜</text>
  <text x="276" y="126" text-anchor="middle" font-size="10.5" fill="#666">1胜·9胜</text>
  <text x="455" y="126" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">11胜·3胜</text>
  <text x="610" y="126" text-anchor="middle" font-size="10.5" fill="#666">11胜·9胜</text>

  <!-- R2 nodes -->
  <g filter="url(#sk)">
    <rect x="64" y="146" width="92" height="64" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="230" y="146" width="92" height="64" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="397" y="146" width="92" height="64" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="564" y="146" width="92" height="64" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="110" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">(1,1,2)</text>
  <text x="110" y="178" text-anchor="middle" font-size="9.5" fill="#666" font-family="monospace">T=6</text>
  <text x="110" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#444" font-family="monospace">(3,3)</text>
  <text x="110" y="204" text-anchor="middle" font-size="8.5" fill="#888" font-family="monospace">行 1,2,3,4,5,6</text>
  <text x="276" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">(1,0,3)</text>
  <text x="276" y="178" text-anchor="middle" font-size="9.5" fill="#666" font-family="monospace">T=6</text>
  <text x="276" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#444" font-family="monospace">(3,3)</text>
  <text x="276" y="204" text-anchor="middle" font-size="8.5" fill="#888" font-family="monospace">行 1,2,4,5,6,9</text>
  <text x="443" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">(0,1,3)</text>
  <text x="443" y="178" text-anchor="middle" font-size="9.5" fill="#666" font-family="monospace">T=6</text>
  <text x="443" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#444" font-family="monospace">(2,3)</text>
  <text x="443" y="204" text-anchor="middle" font-size="8.5" fill="#888" font-family="monospace">行 2,3,4,5,6,11</text>
  <text x="610" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">(0,0,4)</text>
  <text x="610" y="178" text-anchor="middle" font-size="9.5" fill="#666" font-family="monospace">T=6</text>
  <text x="610" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#444" font-family="monospace">(3,3)</text>
  <text x="610" y="204" text-anchor="middle" font-size="8.5" fill="#888" font-family="monospace">行 2,4,5,6,9,11</text>

  <!-- R2 -> R3 edges -->
  <path d="M 110 210 L 190 300" stroke="#c98a2b" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <path d="M 110 210 L 430 300" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <path d="M 276 210 L 190 300" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <path d="M 276 210 L 430 300" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <path d="M 443 210 L 610 300" stroke="#4a8e4a" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <path d="M 443 210 L 430 300" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <path d="M 610 210 L 430 300" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <text x="140" y="252" text-anchor="end" font-size="10" font-weight="bold" fill="#7a5415">1胜</text>
  <text x="252" y="242" text-anchor="start" font-size="10" fill="#888">6胜</text>
  <text x="218" y="260" text-anchor="end" font-size="10" fill="#888">1胜</text>
  <text x="345" y="238" text-anchor="start" font-size="10" fill="#888">9胜</text>
  <text x="530" y="242" text-anchor="start" font-size="10" font-weight="bold" fill="#2e6e2e">3胜</text>
  <text x="466" y="256" text-anchor="start" font-size="10" fill="#888">6胜</text>
  <text x="548" y="262" text-anchor="middle" font-size="10" fill="#888">必经</text>

  <!-- R3 nodes -->
  <g filter="url(#sk)">
    <rect x="144" y="300" width="92" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="384" y="300" width="92" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="564" y="300" width="92" height="52" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="190" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">(1,0,0)</text>
  <text x="190" y="333" text-anchor="middle" font-size="9.5" fill="#666" font-family="monospace">T=3</text>
  <text x="190" y="346" text-anchor="middle" font-size="11" font-weight="bold" fill="#444" font-family="monospace">(2,2)</text>
  <text x="430" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">(0,0,1)</text>
  <text x="430" y="333" text-anchor="middle" font-size="9.5" fill="#666" font-family="monospace">T=3</text>
  <text x="430" y="346" text-anchor="middle" font-size="11" font-weight="bold" fill="#444" font-family="monospace">(2,2)</text>
  <text x="610" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a" font-family="monospace">(0,1,0)</text>
  <text x="610" y="333" text-anchor="middle" font-size="9.5" fill="#666" font-family="monospace">T=3 · l=r</text>
  <text x="610" y="346" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a" font-family="monospace">(1,1) ✓相遇</text>
  <text x="610" y="372" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">回合 3 相遇 —— 最早</text>
  <text x="475" y="372" text-anchor="middle" font-size="10" fill="#888">← 共享 ⇒ 记忆化命中</text>

  <!-- R3 -> R4 edges -->
  <path d="M 190 352 L 430 440" stroke="#c98a2b" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <path d="M 430 352 L 430 440" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="322" y="394" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415">必经</text>
  <text x="448" y="398" text-anchor="start" font-size="10" fill="#666">必经</text>

  <!-- R4 node -->
  <g filter="url(#sk)">
    <rect x="384" y="440" width="92" height="52" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="430" y="458" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a" font-family="monospace">(0,0,0)</text>
  <text x="430" y="473" text-anchor="middle" font-size="9.5" fill="#666" font-family="monospace">T=2 · l=r</text>
  <text x="430" y="486" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a" font-family="monospace">(1,1) ✓相遇</text>
  <text x="430" y="506" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415">回合 4 相遇 —— 最晚</text>

  <!-- summary -->
  <text x="60" y="530" font-size="12" font-weight="bold" fill="#2e6e2e">最早 = 1 + min(3,3,2,3) = 3 —— 绿路 (1,1,7) → (0,1,3) → (0,1,0)，回合 3 相遇</text>
  <text x="60" y="550" font-size="12" font-weight="bold" fill="#7a5415">最晚 = 1 + max(3,3,3,3) = 4 —— 橙路 (1,1,7) → (1,1,2) → (1,0,0) → (0,0,0)，回合 4 相遇</text>
  <text x="60" y="570" font-size="10.5" fill="#888">虚线 = 多分支汇聚到同一状态（记忆化命中）；节点末行为该状态的递归返回值 (e, w)</text>
</svg>
