<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="87"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">单事件处理循环：弹堆 → 算候选 → 入堆</text>

  <!-- 流程步骤（循环体） -->
  <g filter="url(#rough2)">
    <rect x="40" y="62" width="160" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="200" y="62" width="160" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <rect x="360" y="62" width="160" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="120" y="86" fill="#2d5a22" font-weight="bold">① 弹出已结束活动</text>
    <text x="120" y="104" fill="#2d5a22">while 堆顶.end &lt; s：</text>
    <text x="120" y="122" fill="#2d5a22">best = max(best, v)</text>
    <text x="280" y="86" fill="#7a5c1e" font-weight="bold">② 计算候选</text>
    <text x="280" y="104" fill="#7a5c1e">ans = max(ans,</text>
    <text x="280" y="122" fill="#7a5c1e">当前价值 + best)</text>
    <text x="440" y="86" fill="#33506e" font-weight="bold">③ 当前活动入堆</text>
    <text x="440" y="104" fill="#33506e">push((end, value))</text>
    <text x="440" y="122" fill="#33506e">等待未来活动配对</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 200 98 L 194 98" stroke="#446688" stroke-width="2"/>
    <path d="M 198 98 L 190 98" stroke="#446688" stroke-width="2"/>
    <path d="M 182 98 L 194 98" stroke="#446688" stroke-width="2" marker-end="url(#arrB)"/>
    <path d="M 360 98 L 372 98" stroke="#446688" stroke-width="2" marker-end="url(#arrB)"/>
  </g>

  <!-- 循环回路 -->
  <g filter="url(#rough2)">
    <path d="M 440 136 C 440 168, 120 168, 120 138" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrB)"/>
  </g>
  <text x="280" y="182" font-size="12" fill="#8a3a34" filter="url(#rough2)" text-anchor="middle">处理下一个活动（按开始时间升序）</text>

  <!-- 不变量说明 -->
  <g filter="url(#rough2)">
    <rect x="60" y="204" width="440" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#33506e" text-anchor="middle">
    <text x="280" y="228" font-weight="bold">不变量：best = 已弹出活动（end &lt; 当前 s）的最大价值</text>
    <text x="280" y="248">堆内活动 = 已处理但 end ≥ s（与当前活动仍重叠）</text>
    <text x="280" y="266">best 单调不减；每个活动进出堆各一次</text>
  </g>

  <!-- 复杂度 -->
  <g filter="url(#rough2)">
    <rect x="110" y="296" width="340" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <text x="280" y="323" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)" text-anchor="middle">排序 O(n log n) + 堆操作 O(n log n)</text>
</svg>
