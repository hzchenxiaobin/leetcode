<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="452" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">示例演算：nums = [5,15,40,5,6]，去重后在场 {5,6,15,40}，V = 40</text>
  <text x="260" y="38" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">对每个 g 扫描其在场倍数并维护运行 gcd（记 G）；终态 G == g 则计入（★ = 提前 break）</text>

  <!-- 表格底色行 -->
  <rect x="28" y="78"  width="464" height="26" fill="#eef7ee" filter="url(#rough2)"/>
  <rect x="28" y="104" width="464" height="26" fill="#eef7ee" filter="url(#rough2)"/>
  <rect x="28" y="130" width="464" height="26" fill="#eef7ee" filter="url(#rough2)"/>
  <rect x="28" y="156" width="464" height="26" fill="#fdf0f2" filter="url(#rough2)"/>
  <rect x="28" y="182" width="464" height="26" fill="#eef7ee" filter="url(#rough2)"/>
  <rect x="28" y="208" width="464" height="26" fill="#eef7ee" filter="url(#rough2)"/>
  <rect x="28" y="234" width="464" height="26" fill="#fdf0f2" filter="url(#rough2)"/>
  <rect x="28" y="260" width="464" height="26" fill="#fdf0f2" filter="url(#rough2)"/>
  <rect x="28" y="286" width="464" height="26" fill="#eef7ee" filter="url(#rough2)"/>
  <rect x="28" y="312" width="464" height="26" fill="#fdf0f2" filter="url(#rough2)"/>
  <rect x="28" y="338" width="464" height="26" fill="#eef7ee" filter="url(#rough2)"/>
  <rect x="28" y="364" width="464" height="26" fill="#f2f2f2" filter="url(#rough2)"/>

  <!-- 表格外框与网格 -->
  <rect x="28" y="50" width="464" height="340" fill="none" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="28" y="50" width="464" height="28" fill="#e8f0fe" filter="url(#rough2)"/>
  <path d="M 70 50 L 70 390 M 210 50 L 210 390 M 400 50 L 400 390" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 28 78 L 492 78 M 28 104 L 492 104 M 28 130 L 492 130 M 28 156 L 492 156 M 28 182 L 492 182 M 28 208 L 492 208 M 28 234 L 492 234 M 28 260 L 492 260 M 28 286 L 492 286 M 28 312 L 492 312 M 28 338 L 492 338 M 28 364 L 492 364" stroke="#999999" stroke-width="1" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="49" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">g</text>
  <text x="140" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">在场倍数 M(g)</text>
  <text x="305" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">运行 gcd：G 的演化</text>
  <text x="446" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">计入？</text>

  <!-- 行 1：g=1 -->
  <text x="49" y="95" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="140" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5, 6, 15, 40</text>
  <text x="305" y="95" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">5 → 1（gcd(5,6)）→ break ★</text>
  <text x="446" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓</text>

  <!-- 行 2：g=2 -->
  <text x="49" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="140" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6, 40</text>
  <text x="305" y="121" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">6 → 2（gcd(6,40)）→ break ★</text>
  <text x="446" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓</text>

  <!-- 行 3：g=3 -->
  <text x="49" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="140" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6, 15</text>
  <text x="305" y="147" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">6 → 3（gcd(6,15)）→ break ★</text>
  <text x="446" y="147" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓</text>

  <!-- 行 4：g=4 -->
  <text x="49" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="140" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">40</text>
  <text x="305" y="173" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">40 ≠ 4（扫完全程）</text>
  <text x="446" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 行 5：g=5 -->
  <text x="49" y="199" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="140" y="199" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5, 15, 40</text>
  <text x="305" y="199" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">5 = g → 立即 break ★</text>
  <text x="446" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓</text>

  <!-- 行 6：g=6 -->
  <text x="49" y="225" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="140" y="225" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="305" y="225" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">6 = g → 立即 break ★</text>
  <text x="446" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓</text>

  <!-- 行 7：g=8 -->
  <text x="49" y="251" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="140" y="251" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">40</text>
  <text x="305" y="251" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">40 ≠ 8</text>
  <text x="446" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 行 8：g=10 -->
  <text x="49" y="277" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="140" y="277" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">40</text>
  <text x="305" y="277" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">40 ≠ 10</text>
  <text x="446" y="277" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 行 9：g=15 -->
  <text x="49" y="303" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">15</text>
  <text x="140" y="303" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">15</text>
  <text x="305" y="303" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">15 = g ★</text>
  <text x="446" y="303" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓</text>

  <!-- 行 10：g=20 -->
  <text x="49" y="329" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>
  <text x="140" y="329" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">40</text>
  <text x="305" y="329" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">40 ≠ 20</text>
  <text x="446" y="329" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 行 11：g=40 -->
  <text x="49" y="355" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">40</text>
  <text x="140" y="355" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">40</text>
  <text x="305" y="355" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">40 = g ★</text>
  <text x="446" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓</text>

  <!-- 行 12：其余 g -->
  <text x="49" y="381" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">其余</text>
  <text x="140" y="381" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">∅（无在场倍数）</text>
  <text x="305" y="381" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">G 保持 0 ≠ g，自动落选</text>
  <text x="446" y="381" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 汇总框 -->
  <rect x="28" y="402" width="464" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">计入 g ∈ {1, 2, 3, 5, 6, 15, 40} → 答案 = 7 ✓</text>
  <text x="260" y="437" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">其中 5,6,15,40 来自单元素子序列（在场值必计入）；1,2,3 只能靠组合拼出；7,9,11… 无在场倍数自动落选</text>
</svg>
