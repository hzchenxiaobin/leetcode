<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：双指针同步前进</text>
  <path d="M 210 38 Q 340 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="170" y="54" width="220" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="77" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold" font-family="monospace" filter="url(#sk)">初始化 i = j = x = y = 0</text>
  <g filter="url(#sk)">
    <path d="M 280 92 C 280 100 280 104 280 110" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <polygon points="160,150 285,112 410,150 285,188" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="285" y="145" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#sk)">两侧都未耗尽？</text>
  <text x="285" y="163" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#sk)">（i、x 均未越过数组末尾）</text>

  <g filter="url(#sk)">
    <path d="M 285 188 C 285 196 285 202 285 208" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="295" y="203" font-size="11.5" fill="#555" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <polygon points="155,248 285,210 415,248 285,286" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="285" y="253" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold" font-family="monospace" filter="url(#sk)">word1[i][j] == word2[x][y]？</text>

  <g filter="url(#sk)">
    <path d="M 285 286 C 285 294 285 300 285 306" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="295" y="301" font-size="11.5" fill="#555" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="150" y="308" width="270" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="285" y="330" text-anchor="middle" font-size="12" fill="#3a5a3a" filter="url(#sk)">两侧各前进一个字符：</text>
  <text x="285" y="348" text-anchor="middle" font-size="11.5" fill="#3a5a3a" font-family="monospace" filter="url(#sk)">j+1，若到串尾则 i+1、j=0</text>
  <text x="285" y="362" text-anchor="middle" font-size="11" fill="#3a5a3a" filter="url(#sk)">（x、y 对 word2 同理）</text>

  <g filter="url(#sk)">
    <path d="M 150 338 C 100 336 78 320 76 250 C 74 185 92 152 150 150" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="62" y="240" transform="rotate(-90 62 240)" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">循环</text>

  <g filter="url(#sk)">
    <path d="M 410 150 C 424 150 434 150 446 150" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="426" y="142" font-size="11.5" fill="#555" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <polygon points="450,150 555,114 660,150 555,186" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="555" y="155" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold" filter="url(#sk)">另一侧也读完？</text>

  <g filter="url(#sk)">
    <path d="M 555 186 C 555 192 555 198 555 204" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="565" y="200" font-size="11.5" fill="#555" filter="url(#sk)">是</text>

  <g filter="url(#sk)">
    <rect x="485" y="206" width="140" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="555" y="230" text-anchor="middle" font-size="14" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">返回 true ✓</text>

  <g filter="url(#sk)">
    <path d="M 660 150 C 674 200 630 240 604 264" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="668" y="210" font-size="11.5" fill="#555" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <rect x="485" y="268" width="140" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="555" y="284" text-anchor="middle" font-size="13" fill="#a03a36" font-weight="bold" filter="url(#sk)">返回 false</text>
  <text x="555" y="300" text-anchor="middle" font-size="10.5" fill="#a03a36" filter="url(#sk)">（长度不同）</text>

  <g filter="url(#sk)">
    <path d="M 415 248 C 445 300 470 345 520 352" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="432" y="242" font-size="11.5" fill="#555" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <rect x="485" y="334" width="140" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="555" y="350" text-anchor="middle" font-size="13" fill="#a03a36" font-weight="bold" filter="url(#sk)">返回 false</text>
  <text x="555" y="366" text-anchor="middle" font-size="10.5" fill="#a03a36" filter="url(#sk)">（字符不等）</text>

  <g filter="url(#sk)">
    <rect x="60" y="404" width="560" height="46" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="340" y="424" text-anchor="middle" font-size="12" fill="#b07818" filter="url(#sk)">每个字符至多访问一次 → 时间 O(N + M)；仅四个下标变量 → 额外空间 O(1)</text>
  <text x="340" y="441" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">（N、M 为两数组的字符总数）</text>
</svg>
