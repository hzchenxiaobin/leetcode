<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 2 演算：2020-01-15 与 2019-12-31</text>
  <path d="M 140 42 Q 320 52 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left card: date2 -->
  <g filter="url(#sk2)"><rect x="25" y="62" width="290" height="200" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="170" y="88" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">date2 = 2019-12-31</text>
  <path d="M 50 98 Q 170 104 290 98" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="170" y="120" text-anchor="middle" font-size="11.5" fill="#333">整年：365×(2019−1971) = 17520</text>
  <text x="170" y="140" text-anchor="middle" font-size="11.5" fill="#333">闰年：1972, 1976, …, 2016 → +12</text>
  <text x="170" y="160" text-anchor="middle" font-size="11.5" fill="#333">整月：1–11 月累计 = 334</text>
  <text x="170" y="180" text-anchor="middle" font-size="11.5" fill="#333">闰补：2019 是平年 → +0</text>
  <text x="170" y="200" text-anchor="middle" font-size="11.5" fill="#333">日块：+31</text>
  <g filter="url(#sk2)"><rect x="45" y="208" width="250" height="34" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="170" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22">f(date2) = 17897</text>

  <!-- right card: date1 -->
  <g filter="url(#sk2)"><rect x="325" y="62" width="290" height="200" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="470" y="88" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b4a6e">date1 = 2020-01-15</text>
  <path d="M 350 98 Q 470 104 590 98" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="470" y="120" text-anchor="middle" font-size="11.5" fill="#333">整年：365×(2020−1971) = 17885</text>
  <text x="470" y="140" text-anchor="middle" font-size="11.5" fill="#333">闰年：1972, …, 2016 → +12</text>
  <text x="470" y="160" text-anchor="middle" font-size="11.5" fill="#333">整月：1 月前累计 = 0</text>
  <text x="470" y="180" text-anchor="middle" font-size="11.5" fill="#333">闰补：m = 1 ≤ 2 → +0</text>
  <text x="470" y="200" text-anchor="middle" font-size="11.5" fill="#333">日块：+15</text>
  <g filter="url(#sk2)"><rect x="345" y="208" width="250" height="34" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5"/></g>
  <text x="470" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">f(date1) = 17912</text>

  <!-- arrows to result -->
  <path d="M 170 266 Q 190 296 246 316" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 470 266 Q 450 296 394 316" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- result box -->
  <g filter="url(#sk2)"><rect x="170" y="322" width="300" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="320" y="346" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#7a5415">答案 = |17912 − 17897| = 15 ✓</text>
  <text x="320" y="366" text-anchor="middle" font-size="11" fill="#7a5415">输入顺序反过来，结果也是 15</text>
</svg>
