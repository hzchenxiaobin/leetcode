<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">试除法流程：每个元素独立分解，质因子入集合</text>
  <path d="M 170 42 Q 340 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="60" y="196" width="120" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="120" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">取下一个元素 x</text>
  <g filter="url(#sk)">
    <path d="M 180 216 L 216 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- decision 1: d*d <= x -->
  <g filter="url(#sk)">
    <polygon points="288,168 352,216 288,264 224,216" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="288" y="212" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">d*d ≤ x ？</text>
  <text x="288" y="228" text-anchor="middle" font-size="9.5" fill="#8a6a30">d 从 2 起</text>

  <!-- no: exit down to decision 2 -->
  <g filter="url(#sk)">
    <path d="M 288 264 L 288 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="298" y="284" font-size="10.5" fill="#888">否（试除完毕）</text>

  <!-- decision 2: x % d == 0 -->
  <g filter="url(#sk)">
    <path d="M 288 216 L 388 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="330" y="206" font-size="10.5" fill="#888">是</text>

  <g filter="url(#sk)">
    <polygon points="288,296 356,340 288,384 220,340" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="288" y="336" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">剩余 x &gt; 1 ？</text>
  <text x="288" y="352" text-anchor="middle" font-size="9.5" fill="#8a6a30">残余是最大质因子</text>

  <!-- decision 2 yes: add x -->
  <g filter="url(#sk)">
    <path d="M 356 340 L 396 340" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  </g>
  <text x="366" y="330" font-size="10.5" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="400" y="318" width="118" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="459" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">x 入集合</text>
  <text x="459" y="352" text-anchor="middle" font-size="9.5" fill="#4a7a3a">（它必是质数）</text>

  <!-- decision 1 yes: decision 3 -->
  <g filter="url(#sk)">
    <polygon points="446,168 512,212 446,256 380,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="446" y="208" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">x % d == 0 ？</text>
  <text x="446" y="224" text-anchor="middle" font-size="9.5" fill="#8a6a30">内层 while</text>

  <!-- decision 3 yes: add d, divide -->
  <g filter="url(#sk)">
    <path d="M 446 256 L 446 284" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  </g>
  <text x="456" y="274" font-size="10.5" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="384" y="288" width="124" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="446" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">d 入集合</text>
  <text x="446" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a">x ← x / d（除尽重数）</text>

  <!-- loop back from divide to decision 3 -->
  <g filter="url(#sk)">
    <path d="M 508 312 Q 566 312 566 212 Q 566 168 512 204" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  </g>
  <text x="580" y="262" font-size="9.5" fill="#4a7a3a">再试同一个 d</text>

  <!-- decision 3 no: d++ -->
  <g filter="url(#sk)">
    <path d="M 512 212 Q 596 212 596 120 Q 596 60 470 60 Q 288 60 288 96" stroke="#b03a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="600" y="118" font-size="10.5" fill="#b03a3a">否 → d ← d+1</text>
  <g filter="url(#sk)">
    <rect x="250" y="96" width="76" height="30" rx="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="288" y="115" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">d ← d+1</text>
  <g filter="url(#sk)">
    <path d="M 288 126 L 288 166" stroke="#b03a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- decision 2 no: next element (wrap to left) -->
  <g filter="url(#sk)">
    <path d="M 220 340 Q 120 340 120 372 Q 120 402 92 372 Q 74 352 74 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="112" y="392" font-size="10.5" fill="#888">否 → 处理下一个元素</text>

  <!-- right annotation: why d must be prime -->
  <g filter="url(#sk)">
    <rect x="540" y="318" width="122" height="104" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="601" y="338" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6e">为什么 d 必是质数？</text>
  <text x="601" y="356" text-anchor="middle" font-size="9.5" fill="#555">遇到 d 时，&lt;d 的因子</text>
  <text x="601" y="370" text-anchor="middle" font-size="9.5" fill="#555">已全部除尽；若 d 是合数，</text>
  <text x="601" y="384" text-anchor="middle" font-size="9.5" fill="#555">其质因子已被除掉，</text>
  <text x="601" y="398" text-anchor="middle" font-size="9.5" fill="#555">d 不可能再整除剩余 x，</text>
  <text x="601" y="412" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b4a6e">故入集合的都是质数</text>

  <!-- bottom-left note -->
  <g filter="url(#sk)">
    <rect x="40" y="404" width="180" height="28" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="130" y="422" text-anchor="middle" font-size="10" fill="#444">全程无大数乘法，最后返回 set 大小</text>
</svg>
