<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">三种合法频率形态（条形高度 = 出现次数）</text>
  <text x="360" y="52" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">删一个元素后所有频率相等 ⇒ freqCnt 直方图只可能是下面三种</text>
  <rect x="30" y="66" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="130" y="89" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 全是单例</text>
  <rect x="30" y="100" width="200" height="226" fill="#ffffff" stroke="#c9d2dd" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <line x1="42" y1="250.0" x2="220" y2="250.0" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="52" y="220.0" width="30" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="67" y="266.0" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">a</text>
  <text x="67" y="215.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <rect x="94" y="220.0" width="30" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="109" y="266.0" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">b</text>
  <text x="109" y="215.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <rect x="136" y="220.0" width="30" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="151" y="266.0" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">c</text>
  <text x="151" y="215.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <rect x="178" y="220.0" width="30" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="193" y="266.0" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">d</text>
  <text x="193" y="215.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="130" y="300" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">maxF = 1</text>
  <text x="130" y="320" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">删任意一个 → 各 1 次</text>
  <rect x="260" y="66" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="360" y="89" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 唯一单例</text>
  <rect x="260" y="100" width="200" height="226" fill="#ffffff" stroke="#c9d2dd" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <line x1="272" y1="250.0" x2="450" y2="250.0" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="282" y="160.0" width="30" height="90.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="297" y="266.0" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">a</text>
  <text x="297" y="155.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <rect x="324" y="160.0" width="30" height="90.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="339" y="266.0" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">b</text>
  <text x="339" y="155.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <rect x="366" y="160.0" width="30" height="90.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="381" y="266.0" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">c</text>
  <text x="381" y="155.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <rect x="408" y="220.0" width="30" height="30.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="423" y="266.0" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">d</text>
  <text x="423" y="215.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="360" y="300" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">maxF = 3</text>
  <text x="360" y="320" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">删掉那个单例 → 全为 maxF</text>
  <rect x="490" y="66" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="590" y="89" text-anchor="middle" font-size="13.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 唯一尖峰</text>
  <rect x="490" y="100" width="200" height="226" fill="#ffffff" stroke="#c9d2dd" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <line x1="502" y1="250.0" x2="680" y2="250.0" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="512" y="130.0" width="30" height="120.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="527" y="266.0" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">a</text>
  <text x="527" y="125.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <rect x="554" y="160.0" width="30" height="90.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="569" y="266.0" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">b</text>
  <text x="569" y="155.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <rect x="596" y="160.0" width="30" height="90.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="611" y="266.0" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">c</text>
  <text x="611" y="155.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <rect x="638" y="160.0" width="30" height="90.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="653" y="266.0" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">d</text>
  <text x="653" y="155.0" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="590" y="300" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">maxF = 4</text>
  <text x="590" y="320" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">削最高频一次 → 全为 maxF−1</text>
  <path d="M414,226.0 L432,244.0" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M432,226.0 L414,244.0" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="423" y="190.0" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">删</text>
  <line x1="502" y1="160.0" x2="560" y2="160.0" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="527" y="150.0" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">削一次</text>
  <text x="360" y="356" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">②  freqCnt[maxF] · maxF + 1 = L</text>
  <text x="360" y="380" text-anchor="middle" font-size="12.5" fill="#b8860b" filter="url(#rough2)">③  freqCnt[maxF−1] · (maxF−1) + maxF = L</text>
</svg>
