<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#555"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">凸性 = 相邻边叉积同号（全左转或全右转）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每个顶点只看「拐弯方向」，零叉积（共线）不改变方向</text>

  <!-- 左：凸 -->
  <text x="155" y="74" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold">凸多边形：叉积全为正</text>
  <polygon points="80,110 190,95 225,200 100,220" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 134,102 L 168,99" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 207,138 L 216,170" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180,208 L 145,215" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 92,186 L 86,145" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <text x="95" y="124" fill="#3a5a30" font-weight="bold">+</text>
    <text x="176" y="111" fill="#3a5a30" font-weight="bold">+</text>
    <text x="209" y="187" fill="#3a5a30" font-weight="bold">+</text>
    <text x="116" y="206" fill="#3a5a30" font-weight="bold">+</text>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#3a5a30" text-anchor="middle">
    <text x="155" y="255">4 个顶点全部左转 → 凸</text>
  </g>

  <!-- 右：凹 -->
  <text x="405" y="74" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">凹多边形：出现负叉积</text>
  <polygon points="340,110 450,95 470,200 400,165 330,225" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 388,103 L 428,99" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 458,136 L 466,172" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 442,186 L 418,176" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 360,190 L 342,212" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 330,180 L 336,132" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <text x="356" y="126" fill="#8a3a36" font-weight="bold">+</text>
    <text x="439" y="112" fill="#8a3a36" font-weight="bold">+</text>
    <text x="452" y="187" fill="#8a3a36" font-weight="bold">+</text>
    <text x="399" y="151" fill="#b85450" font-weight="bold" font-size="15">−</text>
    <text x="348" y="209" fill="#8a3a36" font-weight="bold">+</text>
  </g>
  <circle cx="400" cy="165" r="5" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#8a3a36" text-anchor="middle">
    <text x="405" y="258">(400,165) 处向内凹 → 唯一一个右转</text>
  </g>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <rect x="40" y="286" width="480" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
    <text x="58" y="308" font-size="11" fill="#8a6a20" font-weight="bold">叉积符号的几何含义</text>
    <text x="58" y="328" font-size="10.5" fill="#555">cross &gt; 0 左转｜cross &lt; 0 右转｜cross = 0 共线，跳过</text>
    <text x="58" y="348" font-size="10.5" fill="#555">判定式：非零 cross 全同号 ⇒ 凸；正负号同时出现 ⇒ 凹</text>
  </g>

  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#999">关键在于：只比较符号，不需要开方、反三角函数，全程整数运算</text>
</svg>
