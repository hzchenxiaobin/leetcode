<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：13 → 4 走 2 步，14 → 13 无解</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Example 1 card -->
  <g filter="url(#sk)">
    <rect x="40" y="54" width="560" height="152" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="60" y="78" font-size="13" font-weight="bold" fill="#2b6e9e">示例 1：n = 13 = (1101)₂ → k = 4 = (0100)₂</text>
  <text x="90" y="102" text-anchor="middle" font-size="11" fill="#2b6e9e">b₃</text>
  <text x="136" y="102" text-anchor="middle" font-size="11" fill="#2b6e9e">b₂</text>
  <text x="182" y="102" text-anchor="middle" font-size="11" fill="#2b6e9e">b₁</text>
  <text x="228" y="102" text-anchor="middle" font-size="11" fill="#2b6e9e">b₀</text>
  <g filter="url(#sk)">
    <rect x="74" y="108" width="32" height="28" rx="4" fill="#c98a2b" stroke="#a06f1f" stroke-width="1.4"/>
    <rect x="120" y="108" width="32" height="28" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="166" y="108" width="32" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="212" y="108" width="32" height="28" rx="4" fill="#c98a2b" stroke="#a06f1f" stroke-width="1.4"/>
  </g>
  <text x="66" y="127" text-anchor="end" font-size="12" fill="#2b6e9e" font-weight="bold">n</text>
  <text x="90" y="127" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">1</text>
  <text x="136" y="127" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">1</text>
  <text x="182" y="127" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">0</text>
  <text x="228" y="127" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">1</text>
  <g filter="url(#sk)">
    <rect x="74" y="150" width="32" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="120" y="150" width="32" height="28" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="166" y="150" width="32" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="212" y="150" width="32" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="66" y="169" text-anchor="end" font-size="12" fill="#2b6e9e" font-weight="bold">k</text>
  <text x="90" y="169" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">0</text>
  <text x="136" y="169" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">1</text>
  <text x="182" y="169" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">0</text>
  <text x="228" y="169" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">0</text>
  <path d="M 90 142 Q 90 144 90 148" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 228 142 Q 228 144 228 148" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="300" y="120" font-size="12" fill="#b8761a" font-weight="bold">b₃、b₀：n=1，k=0</text>
  <text x="300" y="140" font-size="12" fill="#b8761a">→ 各关 1 次，共 2 次</text>
  <text x="300" y="164" font-size="12" fill="#2e6e2e">b₂：都是 1，保留；b₁：都是 0</text>
  <g filter="url(#sk)">
    <rect x="480" y="112" width="100" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="530" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">输出 2</text>
  <text x="530" y="156" text-anchor="middle" font-size="11" fill="#2e6e2e">popcount(13⊕4)</text>

  <!-- Example 2 card -->
  <g filter="url(#sk)">
    <rect x="40" y="222" width="560" height="152" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="60" y="246" font-size="13" font-weight="bold" fill="#b85450">示例 2：n = 14 = (1110)₂ → k = 13 = (1101)₂</text>
  <text x="90" y="270" text-anchor="middle" font-size="11" fill="#b85450">b₃</text>
  <text x="136" y="270" text-anchor="middle" font-size="11" fill="#b85450">b₂</text>
  <text x="182" y="270" text-anchor="middle" font-size="11" fill="#b85450">b₁</text>
  <text x="228" y="270" text-anchor="middle" font-size="11" fill="#b85450">b₀</text>
  <g filter="url(#sk)">
    <rect x="74" y="276" width="32" height="28" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="120" y="276" width="32" height="28" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="166" y="276" width="32" height="28" rx="4" fill="#c98a2b" stroke="#a06f1f" stroke-width="1.4"/>
    <rect x="212" y="276" width="32" height="28" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="66" y="295" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold">n</text>
  <text x="90" y="295" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">1</text>
  <text x="136" y="295" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">1</text>
  <text x="182" y="295" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">1</text>
  <text x="228" y="295" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <g filter="url(#sk)">
    <rect x="74" y="318" width="32" height="28" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="120" y="318" width="32" height="28" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="166" y="318" width="32" height="28" rx="4" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="212" y="318" width="32" height="28" rx="4" fill="#b85450" stroke="#8f3f3c" stroke-width="1.4"/>
  </g>
  <text x="66" y="337" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold">k</text>
  <text x="90" y="337" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">1</text>
  <text x="136" y="337" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">1</text>
  <text x="182" y="337" text-anchor="middle" font-size="13" fill="#4a8edb" font-weight="bold">0</text>
  <text x="228" y="337" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">1</text>
  <path d="M 182 310 Q 182 312 182 316" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 252 290 Q 286 290 300 290" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="310" y="288" font-size="12" fill="#b85450" font-weight="bold">b₀：n=0，k=1</text>
  <text x="310" y="308" font-size="12" fill="#b85450">→ 0 变不出 1，无解！</text>
  <text x="310" y="332" font-size="12" fill="#b8761a">b₁ 虽可关掉，但救不了 b₀</text>
  <g filter="url(#sk)">
    <rect x="480" y="280" width="100" height="56" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="530" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">输出 -1</text>
  <text x="530" y="324" text-anchor="middle" font-size="11" fill="#b85450">(14 &amp; 13) ≠ 13</text>

  <!-- Bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="390" width="560" height="36" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="320" y="413" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">顺序不能反：先判 (n &amp; k) == k，再算 popcount(n ⊕ k)，否则会把无解位也数进去</text>
</svg>
