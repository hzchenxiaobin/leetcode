<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 448"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="448" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：枚举被删节点 × 一次 DFS</text>
  <rect x="210" y="52" width="240" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="74.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">initial 升序排序</text>
  <rect x="210" y="106" width="240" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="127.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">bestCnt = ∞, best = initial[0]</text>
  <rect x="210" y="160" width="240" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="182.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">for ban in initial：</text>
  <rect x="210" y="214" width="240" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="235.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">把 ban 从图中删除后 DFS</text>
  <rect x="210" y="268" width="240" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="289.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt = 本次最终感染数</text>
  <polygon points="330 311.0 430.0 336 330 361.0 230.0 336" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="340.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt &lt; bestCnt ?</text>
  <rect x="470" y="314" width="160" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550.0" y="337.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">best = ban</text>
  <path d="M 330 88 L 330 104" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 142 L 330 158" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 196 L 330 212" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 250 L 330 266" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 330 304 L 330 310" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 336 L 468 334" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="456" y="328" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="330" y="396" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">否 → 保留旧的最优（相当于并列时选更小下标）</text>
  <text x="330" y="428" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">升序遍历保证「并列取最小下标」，严格小于保证不会被后来的同分候选覆盖</text>
</svg>
