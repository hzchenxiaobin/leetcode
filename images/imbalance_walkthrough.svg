<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="89" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="430" fill="#fdfcf7"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">演算走查：nums = [2, 3, 1, 4]</text>
  <path d="M 200 42 Q 350 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Table header -->
  <g filter="url(#sk)">
    <rect x="60" y="66" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="132" y="66" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="194" y="66" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="266" y="66" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="338" y="66" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="410" y="66" width="230" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="95" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">j</text>
  <text x="162" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">v=nums[j]</text>
  <text x="229" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">p（同值）</text>
  <text x="301" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">L（阻碍）</text>
  <text x="373" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a">q（后继2）</text>
  <text x="525" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">f(j)=(j−L)(q−j)</text>

  <!-- Row 0 -->
  <g filter="url(#sk)">
    <rect x="60" y="102" width="70" height="32" rx="4" fill="#f6f6f2" stroke="#aaa" stroke-width="1"/>
    <rect x="132" y="102" width="60" height="32" rx="4" fill="#f6f6f2" stroke="#aaa" stroke-width="1"/>
    <rect x="194" y="102" width="70" height="32" rx="4" fill="#f6f6f2" stroke="#aaa" stroke-width="1"/>
    <rect x="266" y="102" width="70" height="32" rx="4" fill="#f6f6f2" stroke="#aaa" stroke-width="1"/>
    <rect x="338" y="102" width="70" height="32" rx="4" fill="#f6f6f2" stroke="#aaa" stroke-width="1"/>
    <rect x="410" y="102" width="230" height="32" rx="4" fill="#fcf6e3" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="95" y="123" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <text x="162" y="123" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="229" y="123" text-anchor="middle" font-size="12.5" fill="#333">−1</text>
  <text x="301" y="123" text-anchor="middle" font-size="12.5" fill="#333">−1</text>
  <text x="373" y="123" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="525" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">(0+1)×(2−0) = 2</text>

  <!-- Row 1 (highlight j=1, v=3, v-1=2 at index 0 blocks) -->
  <g filter="url(#sk)">
    <rect x="60" y="136" width="70" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="132" y="136" width="60" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="194" y="136" width="70" height="32" rx="4" fill="#f6f6f2" stroke="#aaa" stroke-width="1"/>
    <rect x="266" y="136" width="70" height="32" rx="4" fill="#f6f6f2" stroke="#aaa" stroke-width="1"/>
    <rect x="338" y="136" width="70" height="32" rx="4" fill="#f6f6f2" stroke="#aaa" stroke-width="1"/>
    <rect x="410" y="136" width="230" height="32" rx="4" fill="#fcf6e3" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="95" y="157" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="162" y="157" text-anchor="middle" font-size="12.5" fill="#333">3</text>
  <text x="229" y="157" text-anchor="middle" font-size="12.5" fill="#333">−1</text>
  <text x="301" y="157" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <text x="373" y="157" text-anchor="middle" font-size="12.5" fill="#333">4</text>
  <text x="525" y="157" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">(1−0)×(4−1) = 3</text>

  <!-- Row 2 (v=1, v-1=0 never appears) -->
  <g filter="url(#sk)">
    <rect x="60" y="170" width="70" height="32" rx="4" fill="#f6f6f2" stroke="#aaa" stroke-width="1"/>
    <rect x="132" y="170" width="60" height="32" rx="4" fill="#f6f6f2" stroke="#aaa" stroke-width="1"/>
    <rect x="194" y="170" width="70" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="266" y="170" width="70" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="338" y="170" width="70" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="410" y="170" width="230" height="32" rx="4" fill="#fcf6e3" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="95" y="191" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="162" y="191" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="229" y="191" text-anchor="middle" font-size="12.5" fill="#333">−1</text>
  <text x="301" y="191" text-anchor="middle" font-size="12.5" fill="#333">−1</text>
  <text x="373" y="191" text-anchor="middle" font-size="12.5" fill="#333">4</text>
  <text x="525" y="191" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">(2+1)×(4−2) = 6</text>

  <!-- Row 3 -->
  <g filter="url(#sk)">
    <rect x="60" y="204" width="70" height="32" rx="4" fill="#f6f6f2" stroke="#aaa" stroke-width="1"/>
    <rect x="132" y="204" width="60" height="32" rx="4" fill="#f6f6f2" stroke="#aaa" stroke-width="1"/>
    <rect x="194" y="204" width="70" height="32" rx="4" fill="#f6f6f2" stroke="#aaa" stroke-width="1"/>
    <rect x="266" y="204" width="70" height="32" rx="4" fill="#f6f6f2" stroke="#aaa" stroke-width="1"/>
    <rect x="338" y="204" width="70" height="32" rx="4" fill="#f6f6f2" stroke="#aaa" stroke-width="1"/>
    <rect x="410" y="204" width="230" height="32" rx="4" fill="#fcf6e3" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="95" y="225" text-anchor="middle" font-size="12.5" fill="#333">3</text>
  <text x="162" y="225" text-anchor="middle" font-size="12.5" fill="#333">4</text>
  <text x="229" y="225" text-anchor="middle" font-size="12.5" fill="#333">−1</text>
  <text x="301" y="225" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="373" y="225" text-anchor="middle" font-size="12.5" fill="#333">4</text>
  <text x="525" y="225" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">(3−1)×(4−3) = 2</text>

  <!-- Sum -->
  <g filter="url(#sk)">
    <rect x="60" y="252" width="580" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="350" y="277" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33507a">Σf(j) = 2 + 3 + 6 + 2 = 13</text>

  <!-- Minus subarray count -->
  <g filter="url(#sk)">
    <rect x="60" y="304" width="580" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="350" y="329" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a3a36">ans = 13 − n(n+1)/2 = 13 − 10 = 3 ✓</text>

  <text x="350" y="376" text-anchor="middle" font-size="12" fill="#555">注：L = max(p, j 左边最近的 v−1)，q = j 右边第一个 v−1（无则 n）</text>
  <text x="350" y="396" text-anchor="middle" font-size="12" fill="#555">v = 1 时 v−1 = 0 永不出现，天然退化为 L = p、q = n</text>
</svg>
