<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 395"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="395" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：nums = [2, 8, 2, 2, 5]，i = 2 命中</text>

  <!-- 表头 -->
  <rect x="150" y="58" width="380" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="77" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">下标 i</text>
  <text x="272" y="77" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">左侧和 L</text>
  <text x="382" y="77" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">右侧积 R</text>
  <text x="485" y="77" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">平衡？</text>

  <!-- 行 -->
  <rect x="150" y="88" width="380" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="185" y="111" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="272" y="111" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0</text>
  <text x="382" y="111" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">160</text>
  <text x="485" y="111" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="150" y="124" width="380" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="185" y="147" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="272" y="147" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <text x="382" y="147" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">20</text>
  <text x="485" y="147" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="150" y="160" width="380" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="185" y="183" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="272" y="183" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="382" y="183" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="485" y="183" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 答案</text>

  <rect x="150" y="196" width="380" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="185" y="219" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="272" y="219" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">12</text>
  <text x="382" y="219" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="485" y="219" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="150" y="232" width="380" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="185" y="255" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="272" y="255" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">14</text>
  <text x="382" y="255" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1（空）</text>
  <text x="485" y="255" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 列分隔线与外框 -->
  <path d="M220,58 L220,268 M325,58 L325,268 M440,58 L440,268" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="150" y="58" width="380" height="210" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 左右递推箭头 -->
  <path d="M126,100 L126,250" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text transform="rotate(-90 96 175)" x="96" y="175" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">L 从上往下：+nums[i]</text>
  <path d="M554,250 L554,100" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text transform="rotate(-90 584 175)" x="584" y="175" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">R 从下往上：×nums[i+1]</text>

  <!-- 边界小例子 -->
  <rect x="60" y="288" width="245" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="309" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">[1]：i=0 处 L=0 vs R=1</text>
  <text x="182" y="328" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">空积是 1 不是 0 → 返回 −1</text>

  <rect x="335" y="288" width="245" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="457" y="309" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[1,5]：i=1 处 L=1 vs R=1</text>
  <text x="457" y="328" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">右侧空 ⇒ 空积 R=1，命中 → 返回 1</text>

  <!-- 底部提示 -->
  <rect x="60" y="352" width="520" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="373" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">第二趟从左往右扫，首个命中立即返回——天然拿到「最小」下标</text>
</svg>
