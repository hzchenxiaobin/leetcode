<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">walk(path, create)：一次下行，边下边补节点</text>

  <rect x="180" y="40" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">walk(path, create)</text>

  <path d="M 280 70 L 280 82" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="84" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="104" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">parts = path.split('/') 去空段；node = root</text>

  <path d="M 280 114 L 280 126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="128" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">part = 取下一段，在 node.ch 里查 part</text>

  <path d="M 280 158 L 280 168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,170 372,196 280,222 188,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">ch 里有 part？</text>

  <path d="M 372 196 L 388 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="188" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">无</text>

  <polygon points="458,170 524,196 458,222 392,196" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="458" y="200" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">create？</text>

  <path d="M 458 222 L 458 242" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="238" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">是</text>

  <rect x="392" y="246" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="402" y="265" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">新建 Node 挂进 node.ch</text>
  <text x="402" y="282" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">node = 新节点</text>

  <path d="M 280 222 L 280 242" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="238" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">有</text>

  <rect x="180" y="246" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">node = ch[part]（复用已有子节点）</text>

  <path d="M 280 276 L 280 290" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="292" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">i += 1，还没走完就回到上面继续</text>

  <path d="M 280 322 L 280 350" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)" opacity="0.9"/>
  <path d="M 462 290 L 462 350 L 280 350" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)" opacity="0.9"/>
  <path d="M 280 350 L 118 350 L 118 143 L 174 143" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="196" y="366" font-size="9.5" fill="#777" filter="url(#rough2)">回边：每处理完一段就回到「取下一段」</text>

  <text x="280" y="400" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">create=false 时中途缺节点属于非法查询，题面保证不会出现；四个接口只是 create 与「终点动作」不同</text>
</svg>
