<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：weight = [2, 5, 1, 4, 3]</text>

  <!-- 闭合列高亮（第 2、4 列） -->
  <rect x="340" y="48" width="90" height="185" fill="#fff8e1" filter="url(#rough2)"/>
  <rect x="520" y="48" width="90" height="185" fill="#fff8e1" filter="url(#rough2)"/>

  <!-- 表格线 -->
  <path d="M160,48 L610,48" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M24,48 L160,48" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M24,233 L610,233" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M160,44 L160,237" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M250,44 L250,233" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M340,44 L340,233" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M430,44 L430,233" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M520,44 L520,233" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M610,44 L610,233" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M24,85 L610,85" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M24,122 L610,122" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M24,159 L610,159" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M24,196 L610,196" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行标签 -->
  <text x="148" y="72" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">元素 w</text>
  <text x="148" y="109" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">curMax（判断前）</text>
  <text x="148" y="146" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">w &lt; curMax ?</text>
  <text x="148" y="183" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">动作</text>
  <text x="148" y="220" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">ans</text>

  <!-- 第 1 行：元素值 -->
  <text x="205" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="295" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="385" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="475" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="565" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>

  <!-- 第 2 行：curMax -->
  <text x="205" y="110" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>
  <text x="295" y="110" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">2</text>
  <text x="385" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <text x="475" y="110" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>
  <text x="565" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">4</text>

  <!-- 第 3 行：判断 -->
  <text x="205" y="147" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">✗</text>
  <text x="295" y="147" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">✗</text>
  <text x="385" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="475" y="147" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">✗</text>
  <text x="565" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 第 4 行：动作 -->
  <text x="205" y="184" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">更新</text>
  <text x="295" y="184" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">更新</text>
  <text x="385" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">闭合＋1</text>
  <text x="475" y="184" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">更新</text>
  <text x="565" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">闭合＋1</text>

  <!-- 第 5 行：ans -->
  <text x="205" y="221" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>
  <text x="295" y="221" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>
  <text x="385" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="475" y="221" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">1</text>
  <text x="565" y="221" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- 装运括注 -->
  <rect x="160" y="252" width="270" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="295" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">装运① [2,5,1]：max 5 &gt; 末尾 1 ✓</text>
  <text x="295" y="290" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">闭合于 i = 2，此后 curMax 归零</text>
  <rect x="430" y="252" width="180" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">装运② [4,3]：max 4 &gt; 末尾 3 ✓</text>
  <text x="520" y="290" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">闭合于 i = 4</text>

  <!-- 结论框 -->
  <rect x="70" y="326" width="520" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="330" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">ans = 2</text>
  <text x="330" y="372" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">每段平衡装运至少 2 个包裹，5 个包裹至多 ⌊5/2⌋ = 2 段，已取到上界</text>
</svg>
