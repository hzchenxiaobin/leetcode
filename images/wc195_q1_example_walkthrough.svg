<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="390" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：path = "NESWW"（起点先入集）</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">坐标约定：N→(0,+1)，S→(0,−1)，E→(+1,0)，W→(−1,0)</text>

  <g filter="url(#rough2)">
    <rect x="20" y="56" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="43" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">步</text>
    <rect x="66" y="56" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="91" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">方向</text>
    <rect x="116" y="56" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="176" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">新坐标 (x, y)</text>
    <rect x="236" y="56" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="316" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">是否已在 visited</text>
    <rect x="396" y="56" width="224" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="508" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">动作</text>

    <rect x="20" y="86" width="600" height="34" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="43" y="107" text-anchor="middle" font-size="11.5" fill="#333">起始</text>
    <text x="91" y="107" text-anchor="middle" font-size="11.5" fill="#999">—</text>
    <text x="176" y="107" text-anchor="middle" font-size="11.5" fill="#333">(0, 0)</text>
    <text x="316" y="107" text-anchor="middle" font-size="11" fill="#999">—（初始入集）</text>
    <text x="408" y="107" font-size="11.5" fill="#333">visited = {(0, 0)}</text>

    <rect x="20" y="120" width="600" height="34" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="43" y="141" text-anchor="middle" font-size="11.5" fill="#333">1</text>
    <ellipse cx="91" cy="137" rx="12" ry="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="91" y="142" text-anchor="middle" font-size="12.5" fill="#b07818">N</text>
    <text x="176" y="141" text-anchor="middle" font-size="11.5" fill="#333">(0, 1)</text>
    <text x="316" y="141" text-anchor="middle" font-size="11.5" fill="#333">否</text>
    <text x="408" y="141" font-size="11.5" fill="#333">加入，集合含 2 个坐标</text>

    <rect x="20" y="154" width="600" height="34" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="43" y="175" text-anchor="middle" font-size="11.5" fill="#333">2</text>
    <ellipse cx="91" cy="171" rx="12" ry="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="91" y="176" text-anchor="middle" font-size="12.5" fill="#b07818">E</text>
    <text x="176" y="175" text-anchor="middle" font-size="11.5" fill="#333">(1, 1)</text>
    <text x="316" y="175" text-anchor="middle" font-size="11.5" fill="#333">否</text>
    <text x="408" y="175" font-size="11.5" fill="#333">加入，集合含 3 个坐标</text>

    <rect x="20" y="188" width="600" height="34" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8"/>
    <text x="43" y="209" text-anchor="middle" font-size="11.5" fill="#333">3</text>
    <ellipse cx="91" cy="205" rx="12" ry="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="91" y="210" text-anchor="middle" font-size="12.5" fill="#b07818">S</text>
    <text x="176" y="209" text-anchor="middle" font-size="11.5" fill="#333">(1, 0)</text>
    <text x="316" y="209" text-anchor="middle" font-size="11.5" fill="#333">否</text>
    <text x="408" y="209" font-size="11.5" fill="#333">加入，集合含 4 个坐标</text>

    <rect x="20" y="222" width="600" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="43" y="243" text-anchor="middle" font-size="11.5" fill="#333">4</text>
    <ellipse cx="91" cy="239" rx="12" ry="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="91" y="244" text-anchor="middle" font-size="12.5" fill="#8a3a36">W</text>
    <text x="176" y="243" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36">(0, 0)</text>
    <text x="316" y="243" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">是！</text>
    <text x="408" y="243" font-size="11.5" font-weight="bold" fill="#b85450">返回 true ✓（第 5 个 W 无需处理）</text>

    <rect x="20" y="272" width="600" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="36" y="288" font-size="12" font-weight="bold" fill="#3a5a3a">NESWW → true：第 4 步 W 使 (1,0)→(0,0)，命中集合中的起点</text>
    <text x="36" y="304" font-size="10.5" fill="#555">提前终止 —— 剩余字符不再处理</text>

    <rect x="20" y="324" width="600" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="36" y="340" font-size="12" fill="#2b4a66">对照 path = "NES"：(0,0)→(0,1)→(1,1)→(1,0)，四点互异</text>
    <text x="36" y="356" font-size="10.5" fill="#555">遍历结束未命中 → 返回 false ✓</text>
  </g>
</svg>
