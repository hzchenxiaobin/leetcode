<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：l=10, r=15, k=1</text>
  <rect x="70" y="80" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100.0" y="107.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>
  <text x="100.0" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">好数</text>
  <rect x="138" y="80" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168.0" y="107.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">11</text>
  <text x="168.0" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">好数</text>
  <rect x="206" y="80" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236.0" y="107.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">12</text>
  <text x="236.0" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">好数</text>
  <rect x="274" y="80" width="60" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304.0" y="107.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">13</text>
  <text x="304.0" y="146" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">坏数</text>
  <rect x="342" y="80" width="60" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372.0" y="107.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">14</text>
  <text x="372.0" y="146" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">坏数</text>
  <rect x="410" y="80" width="60" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440.0" y="107.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">15</text>
  <text x="440.0" y="146" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">坏数</text>
  <text x="260" y="175" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">13: |1−3|=2 > 1 ✗    14: 3 ✗    15: 4 ✗</text>
  <rect x="70" y="200" width="380" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="82" y="218" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">为什么用前缀差</text>
  <text x="82" y="234" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">差分：答案 = f(15) − f(9)</text>
  <text x="82" y="249" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">f(15): 1 位全好(9 个) + 10,11,12 → 12</text>
  <text x="82" y="264" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">f(9) : 1,2,…,9 → 9</text>
  <text x="82" y="279" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">f(15) − f(9) = 3 ✓</text>
  <text x="82" y="294" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)"></text>
  <text x="82" y="309" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">再看示例 2：f(204)−f(200) = 2（201,202）</text>
</svg>
