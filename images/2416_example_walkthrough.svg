  <text x="476" y="238" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">2</text>
  <text x="500" y="239" text-anchor="middle" font-size="13" fill="#555" filter="url(#sk)">+</text>
  <g filter="url(#sk)"><circle cx="524" cy="234" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="524" y="238" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#sk)">1</text>

