  <text x="495" y="373" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">answer = [5, 4, 3, 2] ✓</text>

  <g filter="url(#sk)"><rect x="36" y="428" width="620" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="346" y="450" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">"abc" 与 "ab" 沿 a 支（绿）下行；"bc" 与 "b" 沿 b 支（橙）下行</text>
  <text x="346" y="472" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">"ab" 的 b 与 "b" 的 b 分属两支 —— cnt 挂在节点上，互不串扰</text>
