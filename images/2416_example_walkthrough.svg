  <text x="623" y="133" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" filter="url(#sk)">5</text>
  <text x="623" y="187" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" filter="url(#sk)">4</text>
