<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>
  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">让 1 的总数被 4 整除：余数 → 额外代价</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="40" y="50" width="500" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="290" y="72" fill="#446688">总数 ≡ 2a + c (mod 4)</text>
    <text x="290" y="92" fill="#666">a = 取全 1 的中间对个数，c = 中心最终值（0 或 1），四元组贡献恒为 0</text>

    <rect x="40" y="118" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="85" y="138" fill="#2d5a22">余数 rem</text>
    <rect x="138" y="118" width="250" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="263" y="138" fill="#2d5a22">调整手段</text>
    <rect x="396" y="118" width="144" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <text x="468" y="138" fill="#2d5a22">额外代价</text>

    <rect x="40" y="152" width="90" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="5"/>
    <text x="85" y="177">0</text>
    <rect x="138" y="152" width="250" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="5"/>
    <text x="263" y="177" fill="#666">无需调整</text>
    <rect x="396" y="152" width="144" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="5"/>
    <text x="468" y="177" font-weight="bold">0</text>

    <rect x="40" y="196" width="90" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="5"/>
    <text x="85" y="221">1</text>
    <rect x="138" y="196" width="250" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="5"/>
    <text x="263" y="221" fill="#666">只能翻转中心（1 → 0）</text>
    <rect x="396" y="196" width="144" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="5"/>
    <text x="468" y="221" font-weight="bold">1</text>

    <rect x="40" y="240" width="90" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="85" y="265" fill="#a06c10">2</text>
    <rect x="138" y="240" width="250" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="263" y="265" fill="#a06c10">切换一对取值（改 2a 的奇偶）</text>
    <rect x="396" y="240" width="144" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="468" y="265" fill="#a06c10">flex &gt; 0 ? 0 : 2</text>

    <rect x="40" y="284" width="90" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="85" y="309" fill="#b85450">3</text>
    <rect x="138" y="284" width="250" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="263" y="309" fill="#b85450">先翻中心 → 余数变 2，再按上一行处理</text>
    <rect x="396" y="284" width="144" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <text x="468" y="309" fill="#b85450">1 + (flex &gt; 0 ? 0 : 2)</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="40" y="336" width="500" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="56" y="358" fill="#2d5a22">为什么余数 1 只能翻中心：改一对只让 2a 变化 ±2，改四元组只让总数变化 ±4</text>
    <text x="56" y="378" fill="#666">两者都不改变 mod 4 的奇偶部分，只有中心能贡献 ±1</text>
  </g>
</svg>
