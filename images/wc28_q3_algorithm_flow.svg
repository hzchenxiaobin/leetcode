<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 432" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="432" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：贪心定朝向 + 枚举断点</text>
  <text x="290" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">三层循环，内层 O(L) 拼接，整体 O(L²)</text>

  <rect x="55" y="68" width="470" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="91" font-size="11" fill="#3a4a66" filter="url(#rough2)">输入 strs，记总长度 L = Σ |s_i|</text>
  <path d="M 290 104 L 290 122" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="124" width="470" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="147" font-size="11" fill="#3a5a2a" filter="url(#rough2)">best[i] ← max(s_i, rev(s_i))　（贪心：未被剪开的串取最大朝向）</text>
  <path d="M 290 160 L 290 178" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="180" width="470" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="203" font-size="11" fill="#8a6a20" filter="url(#rough2)">for i ← 0 … n-1　（枚举被剪开的那一个串）</text>
  <path d="M 290 216 L 290 234" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="236" width="470" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="259" font-size="11" fill="#3a4a66" filter="url(#rough2)">other ← best[i+1 … n-1] + best[0 … i-1]　（其余串按圆周顺序拼好）</text>
  <path d="M 290 272 L 290 290" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="292" width="470" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="315" font-size="11" fill="#8a6a20" filter="url(#rough2)">for c ∈ { best[i], rev(best[i]) }，for j ← 0 … |c|-1　（朝向 × 断点）</text>
  <path d="M 290 328 L 290 346" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="348" width="470" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="371" font-size="11" fill="#8a3a36" filter="url(#rough2)">cand ← c[j:] + other + c[:j]；ans ← max(ans, cand)</text>
  <path d="M 290 384 L 290 402" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="404" width="470" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="423" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">返回 ans：全部（朝向, 断点）组合中的字典序最大读出串</text>
</svg>
