<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：逐个读运算符，乘除改 cur、加减结算一块</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">cur = 当前块的正值，sign = 当前块的符号</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="150" y="64" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="86.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cur = n，sign = +1，total = 0</text>
  <path d="M 280.0 100.0 L 280.0 122.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="122" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="144.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">i 从 n−1 递减到 1，t = 0,1,2,…</text>
  <path d="M 280.0 158.0 L 280.0 180.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="280,180 420,206 280,232 140,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280.0" y="211.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">op = "*/+-"[t % 4] ?</text>
  <path d="M 420.0 206.0 L 452.0 206.0" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="458.0" y="200.0" font-size="10" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">* 或 /</text>
  <rect x="440" y="186" width="132" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="506.0" y="209.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cur *= i  或  cur /= i</text>
  <path d="M 280.0 232.0 L 280.0 256.0" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="288.0" y="250.0" font-size="10" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">+ 或 −</text>
  <rect x="140" y="256" width="280" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="280.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">total += sign*cur；sign = ±1；cur = i</text>
  <path d="M 280.0 296.0 L 280.0 318.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="318" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="339.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">收尾 total += sign*cur，返回 total</text>
</svg>
