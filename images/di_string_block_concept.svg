<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：连续 'D' 段 = 一段连续数字整体反转</text>
  <path d="M 130 40 Q 280 48 430 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- pattern 行 -->
  <text x="88" y="96" text-anchor="end" font-size="11" fill="#999" filter="url(#sk)">pattern</text>
  <text x="139" y="72" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#sk)">0</text>
  <text x="183" y="72" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#sk)">1</text>
  <text x="227" y="72" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#sk)">2</text>
  <text x="271" y="72" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#sk)">3</text>
  <text x="315" y="72" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#sk)">4</text>
  <text x="359" y="72" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#sk)">5</text>
  <text x="403" y="72" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#sk)">6</text>
  <text x="447" y="72" text-anchor="middle" font-size="8.5" fill="#aaa" filter="url(#sk)">7</text>

  <g filter="url(#sk)"><rect x="122" y="78" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="139" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">I</text>
  <g filter="url(#sk)"><rect x="166" y="78" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="183" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">I</text>
  <g filter="url(#sk)"><rect x="210" y="78" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="227" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">I</text>
  <g filter="url(#sk)"><rect x="254" y="78" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/></g>
  <text x="271" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#sk)">D</text>
  <g filter="url(#sk)"><rect x="298" y="78" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="315" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">I</text>
  <g filter="url(#sk)"><rect x="342" y="78" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/></g>
  <text x="359" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#sk)">D</text>
  <g filter="url(#sk)"><rect x="386" y="78" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/></g>
  <text x="403" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#sk)">D</text>
  <g filter="url(#sk)"><rect x="430" y="78" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/></g>
  <text x="447" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#sk)">D</text>

  <!-- 初始数字行 -->
  <text x="88" y="158" text-anchor="end" font-size="11" fill="#999" filter="url(#sk)">初始</text>
  <g filter="url(#sk)"><rect x="100" y="136" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="117" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="144" y="136" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="161" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="188" y="136" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="205" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="232" y="136" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="249" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="276" y="136" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="293" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="320" y="136" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="337" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">6</text>
  <g filter="url(#sk)"><rect x="364" y="136" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="381" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">7</text>
  <g filter="url(#sk)"><rect x="408" y="136" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="425" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">8</text>
  <g filter="url(#sk)"><rect x="452" y="136" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="469" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">9</text>

  <!-- D 段括号 -->
  <path d="M 232 174 L 232 184 L 310 184 L 310 174" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="271" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">D 段 ①</text>
  <path d="M 320 174 L 320 184 L 486 184 L 486 174" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="403" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">D 段 ②（DDD）</text>

  <!-- 反转箭头 -->
  <path d="M 271 208 Q 271 222 271 232" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="292" y="226" font-size="10.5" font-weight="bold" fill="#8a6a10" filter="url(#sk)">反转</text>
  <path d="M 403 208 Q 403 222 403 232" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="424" y="226" font-size="10.5" font-weight="bold" fill="#8a6a10" filter="url(#sk)">反转</text>

  <!-- 结果行 -->
  <text x="88" y="268" text-anchor="end" font-size="11" fill="#999" filter="url(#sk)">结果</text>
  <g filter="url(#sk)"><rect x="100" y="240" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="117" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="144" y="240" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="161" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="188" y="240" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/></g>
  <text x="205" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="232" y="240" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/></g>
  <text x="249" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a10" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="276" y="240" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/></g>
  <text x="293" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a10" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="320" y="240" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/></g>
  <text x="337" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a10" filter="url(#sk)">9</text>
  <g filter="url(#sk)"><rect x="364" y="240" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/></g>
  <text x="381" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a10" filter="url(#sk)">8</text>
  <g filter="url(#sk)"><rect x="408" y="240" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/></g>
  <text x="425" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a10" filter="url(#sk)">7</text>
  <g filter="url(#sk)"><rect x="452" y="240" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/></g>
  <text x="469" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a10" filter="url(#sk)">6</text>

  <!-- 底部要点框 -->
  <g filter="url(#sk)"><rect x="40" y="312" width="350" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/></g>
  <text x="215" y="336" text-anchor="middle" font-size="11.5" fill="#2e5e2e" filter="url(#sk)">· 'I' 是重启点：n+1 个位置切成若干块，块内相邻全是 'D'</text>
  <text x="215" y="356" text-anchor="middle" font-size="11.5" fill="#2e5e2e" filter="url(#sk)">· 第 t 块（长 s）分到连续数字区间 [S+1, S+s]，整段倒序填入</text>
  <text x="215" y="376" text-anchor="middle" font-size="11.5" fill="#2e5e2e" filter="url(#sk)">· 初始 123…(n+1)，把每个极大 'D' 段对应的数字段反转即答案</text>

  <!-- 右下角 'I' 约束说明 -->
  <g filter="url(#sk)"><rect x="404" y="312" width="140" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/></g>
  <text x="474" y="332" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">块间 'I' 自动满足</text>
  <text x="474" y="350" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">上块尾 = S+1</text>
  <text x="474" y="366" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">下块头 = S+s+1</text>
  <text x="474" y="380" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">S+1 &lt; S+s+1 ✓</text>
</svg>
