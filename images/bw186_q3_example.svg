<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：s1="01" → s2="10"</text>
  <text x="64" y="92" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">初始</text>
  <rect x="160" y="70" width="42" height="34" fill="#f0f0f0" stroke="#888888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="181.0" y="91.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="206" y="70" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227.0" y="91.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="270" y="92" text-anchor="start" font-size="10" fill="#444" filter="url(#rough2)">蓝色/绿色标出错位：位置1是 A</text>
  <text x="64" y="146" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">操作1 @0</text>
  <rect x="160" y="124" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="181.0" y="145.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="206" y="124" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227.0" y="145.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="270" y="146" text-anchor="start" font-size="10" fill="#444" filter="url(#rough2)">把 0 变 1，凑出相邻的两个 1</text>
  <text x="64" y="200" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">操作2 @(0,1)</text>
  <rect x="160" y="178" width="42" height="34" fill="#f0f0f0" stroke="#888888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="181.0" y="199.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="206" y="178" width="42" height="34" fill="#f0f0f0" stroke="#888888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227.0" y="199.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="270" y="200" text-anchor="start" font-size="10" fill="#444" filter="url(#rough2)">一步清空两个 1</text>
  <text x="64" y="254" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">操作1 @0</text>
  <rect x="160" y="232" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="181.0" y="253.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="206" y="232" width="42" height="34" fill="#f0f0f0" stroke="#888888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227.0" y="253.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="270" y="254" text-anchor="start" font-size="10" fill="#444" filter="url(#rough2)">把位置0重新置 1，达成目标</text>
  <rect x="60" y="292" width="400" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="310" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">结论：3 步</text>
  <text x="72" y="326" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">共 3 次操作，与公式 3K + Δ = 3×1 + (1−1) = 3 一致。</text>
</svg>
