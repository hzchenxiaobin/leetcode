<svg xmlns="http://www.w3.org/2000/svg" width="900" height="445" viewBox="0 0 900 445"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="900" height="445" fill="#fafafa"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：首字符定类型 → 过滤数字 → 滚动前驱</text>
  <path d="M 250 42 Q 450 50 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="40" y="72" font-size="12" font-family="monospace" fill="#555" filter="url(#rough2)">s = "1 box has 3 blue 4 red 6 green and 12 yellow marbles"</text>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="700" y="50" width="13" height="13" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="700" y="70" width="13" height="13" rx="3" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/>
  </g>
  <text x="719" y="61" font-size="10.5" fill="#555" filter="url(#rough2)">数字 token</text>
  <text x="719" y="81" font-size="10.5" fill="#555" filter="url(#rough2)">单词 token（跳过）</text>

  <!-- token row -->
  <g filter="url(#rough2)">
    <rect x="25" y="86" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="87" y="86" width="58" height="34" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="149" y="86" width="58" height="34" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="211" y="86" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="273" y="86" width="58" height="34" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="335" y="86" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="397" y="86" width="58" height="34" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="459" y="86" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="521" y="86" width="58" height="34" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="583" y="86" width="58" height="34" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="645" y="86" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="707" y="86" width="58" height="34" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/>
    <rect x="769" y="86" width="58" height="34" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.2"/>
  </g>
  <text x="54" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="116" y="107" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">box</text>
  <text x="178" y="107" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">has</text>
  <text x="240" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="302" y="107" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">blue</text>
  <text x="364" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="426" y="107" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">red</text>
  <text x="488" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>
  <text x="550" y="107" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">green</text>
  <text x="612" y="107" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">and</text>
  <text x="674" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">12</text>
  <text x="736" y="107" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">yellow</text>
  <text x="798" y="107" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">marbles</text>

  <!-- filter arrows -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.6" fill="none">
    <path d="M 54 123 Q 57 138 54 150" marker-end="url(#arrb)"/>
    <path d="M 240 123 Q 243 138 240 150" marker-end="url(#arrb)"/>
    <path d="M 364 123 Q 367 138 364 150" marker-end="url(#arrb)"/>
    <path d="M 488 123 Q 491 138 488 150" marker-end="url(#arrb)"/>
    <path d="M 674 123 Q 677 138 674 150" marker-end="url(#arrb)"/>
  </g>

  <!-- extracted numbers row -->
  <g filter="url(#rough2)">
    <rect x="25" y="156" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="211" y="156" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="335" y="156" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="459" y="156" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="645" y="156" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="54" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="240" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="364" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="488" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>
  <text x="674" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">12</text>
  <text x="147" y="179" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">&lt;</text>
  <text x="302" y="179" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">&lt;</text>
  <text x="426" y="179" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">&lt;</text>
  <text x="581" y="179" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">&lt;</text>
  <text x="828" y="178" font-size="11" fill="#888" filter="url(#rough2)">← prev 滚动比较</text>

  <text x="450" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">数字序列 1 &lt; 3 &lt; 4 &lt; 6 &lt; 12 —— 严格递增 ✓（return true）</text>

  <!-- observation cards -->
  <g filter="url(#rough2)">
    <rect x="35" y="240" width="270" height="175" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="315" y="240" width="270" height="175" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="595" y="240" width="270" height="175" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="170" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">① 首字符定类型</text>
  <text x="52" y="296" font-size="11.5" fill="#333" filter="url(#rough2)">· 数字 token ⊂ {0…9}（无前导零）</text>
  <text x="52" y="316" font-size="11.5" fill="#333" filter="url(#rough2)">· 单词 token ⊂ {a…z}</text>
  <text x="52" y="336" font-size="11.5" fill="#333" filter="url(#rough2)">· 字符集互斥 → 看首字符即判型</text>
  <text x="52" y="356" font-size="11.5" fill="#333" filter="url(#rough2)">· isdigit(token[0])，O(1)</text>
  <text x="52" y="386" font-size="10.5" fill="#667" filter="url(#rough2)">无需扫全 token，也不会遇到 "a1" 混合体</text>

  <text x="450" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 滚动前驱 prev</text>
  <text x="332" y="296" font-size="11.5" fill="#333" filter="url(#rough2)">· 严格递增 ⇔ 每对相邻 prev &lt; cur</text>
  <text x="332" y="316" font-size="11.5" fill="#333" filter="url(#rough2)">· 判定是局部的：只存 prev 一个变量</text>
  <text x="332" y="336" font-size="11.5" fill="#333" filter="url(#rough2)">· 过滤数字 + 判递增 = 一趟扫描</text>
  <text x="332" y="356" font-size="11.5" fill="#333" filter="url(#rough2)">· cur ≤ prev → 立即短路 false</text>
  <text x="332" y="386" font-size="10.5" fill="#567" filter="url(#rough2)">无需中间数组，两趟合并成一趟</text>

  <text x="730" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">③ 哨兵 prev = −1</text>
  <text x="612" y="296" font-size="11.5" fill="#333" filter="url(#rough2)">· 数字均为正数：≥ 1 &gt; −1</text>
  <text x="612" y="316" font-size="11.5" fill="#333" filter="url(#rough2)">· 首个数字天然通过比较</text>
  <text x="612" y="336" font-size="11.5" fill="#333" filter="url(#rough2)">· 免去「第一个数字」特判</text>
  <text x="612" y="356" font-size="11.5" fill="#333" filter="url(#rough2)">· 比 0 更鲁棒（兼容非负变体）</text>
  <text x="612" y="386" font-size="10.5" fill="#776" filter="url(#rough2)">若用 0 当哨兵：放宽为非负数时首数字 0 被误判</text>

  <text x="450" y="433" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">「过滤 + 归约」合并成一趟：token 流 → 首字符过滤出数字 → 滚动前驱归约出一个布尔值</text>
</svg>
