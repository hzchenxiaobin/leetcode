<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：nums = [1, 2, 3, 2]</text>

  <!-- 表头 -->
  <text x="132" y="56" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">扫描的相邻对</text>
  <text x="268" y="56" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">归一化为无序对</text>
  <text x="420" y="56" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">计数器</text>

  <!-- 第 1 行：(1,2) -->
  <rect x="106" y="70" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="121" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="140" y="70" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <path d="M180,85 L205,85" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="212" y="70" width="70" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="247" y="90" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">{1, 2}</text>
  <path d="M290,85 L318,85" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="326" y="70" width="150" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="401" y="90" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">{1,2}: 1</text>

  <!-- 第 2 行：(2,3) -->
  <rect x="106" y="110" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="121" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="140" y="110" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <path d="M180,125 L205,125" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="212" y="110" width="70" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="247" y="130" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">{2, 3}</text>
  <path d="M290,125 L318,125" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="326" y="110" width="150" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="401" y="130" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">{1,2}: 1  {2,3}: 1</text>

  <!-- 第 3 行：(3,2) —— 归一化关键行 -->
  <rect x="106" y="150" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="121" y="170" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="140" y="150" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="170" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <path d="M180,165 L205,165" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="212" y="150" width="70" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="247" y="170" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">{2, 3}</text>
  <path d="M290,165 L318,165" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="326" y="150" width="150" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="401" y="170" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">{1,2}: 1  {2,3}: 2</text>
  <text x="247" y="194" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">(3,2) 与 (2,3) 归一化成同一个 key！</text>

  <path d="M60,210 L500,210" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 5" fill="none" filter="url(#rough2)"/>

  <!-- 汇总 -->
  <text x="76" y="236" font-size="13" fill="#333" filter="url(#rough2)">base = 0（没有原本就相邻相等的对）</text>
  <text x="76" y="260" font-size="13" fill="#333" filter="url(#rough2)">max = 2（无序对 {2,3} 最大，取 x=3, y=2）</text>
  <text x="76" y="284" font-size="13.5" fill="#b85450" filter="url(#rough2)">ans = base + max = 0 + 2 = 2</text>

  <!-- 验证：替换后的数组 -->
  <text x="76" y="322" font-size="12.5" fill="#666" filter="url(#rough2)">验证：替换后</text>
  <rect x="150" y="304" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="328" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="198" y="304" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="328" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="246" y="304" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="328" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="294" y="304" width="44" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="328" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="196" y="356" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">✗</text>
  <text x="244" y="356" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✓</text>
  <text x="292" y="356" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✓</text>
  <text x="356" y="328" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">恰好 2 对相邻相等 ✓</text>

  <text x="280" y="386" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">同理示例 2：[1,2,1,2,1] 中 {1,2} 计 4 次，ans = 0 + 4 = 4</text>
</svg>
