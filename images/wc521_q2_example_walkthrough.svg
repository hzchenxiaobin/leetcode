<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：base + best 拼装答案</text>

  <!-- ===== 示例 2 ===== -->
  <text x="270" y="54" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">示例 2：nums = [1,2,1,2,1]</text>

  <rect x="60" y="66" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="89" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="104" y="66" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="89" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="148" y="66" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="89" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="192" y="66" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="89" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="236" y="66" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="89" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="81" y="112" width="42" height="24" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="102" y="129" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(1,2)</text>
  <rect x="125" y="112" width="42" height="24" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="146" y="129" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(2,1)</text>
  <rect x="169" y="112" width="42" height="24" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="129" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(1,2)</text>
  <rect x="213" y="112" width="42" height="24" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="234" y="129" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(2,1)</text>

  <path d="M168,140 L168,150" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="166" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">归一化后全是 (1,2)，计数 4</text>
  <text x="168" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">base = 0（无相等相邻对）</text>

  <rect x="310" y="70" width="220" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="95" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">哈希表：{1,2} → 4 ⇒ best = 4</text>
  <rect x="310" y="124" width="220" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = 0 + 4 = 4</text>
  <text x="420" y="167" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">x=1→y=2 ⇒ [2,2,2,2,2]</text>

  <path d="M40,204 L520,204" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- ===== 示例 1 ===== -->
  <text x="270" y="230" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">示例 1：nums = [1,2,3,2]</text>

  <rect x="60" y="242" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="265" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="104" y="242" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="265" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="148" y="242" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="265" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="192" y="242" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="265" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">2</text>

  <rect x="78" y="288" width="48" height="24" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="102" y="305" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(1,2)</text>
  <rect x="122" y="288" width="48" height="24" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="146" y="305" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(2,3)</text>
  <rect x="166" y="288" width="48" height="24" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="305" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(3,2)</text>

  <path d="M190,316 L190,326" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="342" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(3,2) 归一化为 (2,3)</text>
  <text x="190" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">base = 0</text>

  <rect x="310" y="246" width="220" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="271" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">哈希表：{1,2}→1，{2,3}→2</text>
  <rect x="310" y="300" width="220" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = 0 + 2 = 2</text>
  <text x="420" y="343" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">x=3→y=2 ⇒ [1,2,2,2]</text>

  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">两例 base 均为 0；一般情况答案 = base + best</text>
</svg>
