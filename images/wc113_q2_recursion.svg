<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 328" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="328" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">每层只有两种匹配方式</text>
  <rect x="24" y="54" width="250" height="120" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="149" y="78" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">方式 A：不交换</text>
  <text x="149" y="104" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">flipEquiv(l1, l2)</text>
  <text x="149" y="126" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">且 flipEquiv(r1, r2)</text>
  <text x="149" y="152" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">左右各自对应</text>
  <rect x="306" y="54" width="250" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="431" y="78" text-anchor="middle" font-size="12.5" fill="#a9761f" font-weight="bold" filter="url(#rough2)">方式 B：交换</text>
  <text x="431" y="104" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">flipEquiv(l1, r2)</text>
  <text x="431" y="126" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">且 flipEquiv(r1, l2)</text>
  <text x="431" y="152" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">交叉对应</text>
  <text x="280" y="196" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">两者任一成立即返回 true（递归出口：都为 null → true；一个 null → false）</text>
  <path d="M 274 114 L 306 114" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">为什么只有两种？交换一个节点的孩子，只会把它的「左↔右」对调，</text>
  <text x="280" y="254" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">子树内部还能继续换，所以两种方式都要递归试</text>
  <rect x="90" y="272" width="380" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="297" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">复杂度 O(min(n1, n2))，每个节点最多被访问常数次</text>
</svg>
