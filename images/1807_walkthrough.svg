<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="480" fill="#fafafa"/>
  <text x="340" y="22" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">示例演算：s = "(name)is(age)yearsold"</text>
  <text x="340" y="42" text-anchor="middle" font-size="11" fill="#666">map = { name→bob, age→two }；游标 i 单调前进，括号段被整体跳过</text>

  <!-- s strip -->
  <text x="50" y="77" font-size="12" font-style="italic" fill="#333">s =</text>
  <g filter="url(#sk)">
    <rect x="65" y="56" width="25" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="90" y="56" width="25" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="115" y="56" width="25" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="140" y="56" width="25" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="165" y="56" width="25" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="190" y="56" width="25" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="215" y="56" width="25" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="240" y="56" width="25" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="265" y="56" width="25" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="290" y="56" width="25" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="315" y="56" width="25" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="340" y="56" width="25" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="365" y="56" width="25" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="390" y="56" width="25" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="415" y="56" width="25" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="440" y="56" width="25" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="465" y="56" width="25" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="490" y="56" width="25" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="515" y="56" width="25" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="540" y="56" width="25" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="565" y="56" width="25" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="590" y="56" width="25" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#7a5415">
    <text x="77.5" y="77" font-weight="bold">(</text>
    <text x="102.5" y="77">n</text>
    <text x="127.5" y="77">a</text>
    <text x="152.5" y="77">m</text>
    <text x="177.5" y="77">e</text>
    <text x="202.5" y="77" font-weight="bold">)</text>
    <text x="277.5" y="77" font-weight="bold">(</text>
    <text x="302.5" y="77">a</text>
    <text x="327.5" y="77">g</text>
    <text x="352.5" y="77">e</text>
    <text x="377.5" y="77" font-weight="bold">)</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#446688">
    <text x="227.5" y="77">i</text>
    <text x="252.5" y="77">s</text>
    <text x="402.5" y="77">y</text>
    <text x="427.5" y="77">e</text>
    <text x="452.5" y="77">a</text>
    <text x="477.5" y="77">r</text>
    <text x="502.5" y="77">s</text>
    <text x="527.5" y="77">o</text>
    <text x="552.5" y="77">l</text>
    <text x="577.5" y="77">d</text>
  </g>

  <!-- segment bars + step labels -->
  <g filter="url(#sk)">
    <rect x="65" y="92" width="150" height="6" rx="3" fill="#d6a040"/>
    <rect x="215" y="92" width="50" height="6" rx="3" fill="#446688"/>
    <rect x="265" y="92" width="125" height="6" rx="3" fill="#d6a040"/>
    <rect x="390" y="92" width="200" height="6" rx="3" fill="#446688"/>
  </g>
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <text x="140" y="112" fill="#b07818">①</text>
    <text x="240" y="112" fill="#446688">②</text>
    <text x="327" y="112" fill="#b07818">③</text>
    <text x="490" y="112" fill="#446688">④</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#b85450">
    <text x="68" y="126">i=0</text>
    <text x="218" y="126">i=6</text>
    <text x="268" y="126">i=8</text>
    <text x="393" y="126">i=13</text>
    <text x="612" y="126">i=21</text>
  </g>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="138" width="600" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <circle cx="63" cy="160" r="13" fill="#d6a040"/>
    <rect x="88" y="148" width="15" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="103" y="148" width="15" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="118" y="148" width="15" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="133" y="148" width="15" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="148" y="148" width="15" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="163" y="148" width="15" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
  </g>
  <text x="63" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1</text>
  <g font-size="12" text-anchor="middle" fill="#7a5415">
    <text x="95.5" y="165" font-weight="bold">(</text>
    <text x="110.5" y="165">n</text>
    <text x="125.5" y="165">a</text>
    <text x="140.5" y="165">m</text>
    <text x="155.5" y="165">e</text>
    <text x="170.5" y="165" font-weight="bold">)</text>
  </g>
  <text x="250" y="162" font-size="11.5" fill="#444">key = "name" → 查表命中 → 追加 "bob"</text>
  <text x="250" y="184" font-size="10.5" fill="#888">j = 5：从 '(' 直达第一个 ')' 即配对，整段一次性消费</text>
  <text x="500" y="164" font-size="10.5" fill="#333">res = <tspan fill="#2f6b26" font-weight="bold">bob</tspan></text>
  <text x="500" y="188" font-size="11" font-weight="bold" fill="#b85450">i ← 6</text>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="214" width="600" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="63" cy="236" r="13" fill="#446688"/>
    <rect x="88" y="224" width="15" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="103" y="224" width="15" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3"/>
  </g>
  <text x="63" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>
  <g font-size="12" text-anchor="middle" fill="#446688">
    <text x="95.5" y="241">i</text>
    <text x="110.5" y="241">s</text>
  </g>
  <text x="250" y="238" font-size="11.5" fill="#444">普通字符：直接追加，不查表</text>
  <text x="250" y="260" font-size="10.5" fill="#888">i 每步 +1</text>
  <text x="500" y="240" font-size="10.5" fill="#333">res = <tspan fill="#2f6b26" font-weight="bold">bob</tspan><tspan fill="#446688">is</tspan></text>
  <text x="500" y="264" font-size="11" font-weight="bold" fill="#b85450">i ← 8</text>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="290" width="600" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <circle cx="63" cy="312" r="13" fill="#d6a040"/>
    <rect x="88" y="300" width="15" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="103" y="300" width="15" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="118" y="300" width="15" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="133" y="300" width="15" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="148" y="300" width="15" height="24" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="3"/>
  </g>
  <text x="63" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3</text>
  <g font-size="12" text-anchor="middle" fill="#7a5415">
    <text x="95.5" y="317" font-weight="bold">(</text>
    <text x="110.5" y="317">a</text>
    <text x="125.5" y="317">g</text>
    <text x="140.5" y="317">e</text>
    <text x="155.5" y="317" font-weight="bold">)</text>
  </g>
  <text x="250" y="314" font-size="11.5" fill="#444">key = "age" → 查表命中 → 追加 "two"</text>
  <text x="250" y="336" font-size="10.5" fill="#888">j = 12：若 map 无此键则追加 "?"，本例命中</text>
  <text x="500" y="316" font-size="10.5" fill="#333">res = <tspan fill="#2f6b26" font-weight="bold">bob</tspan><tspan fill="#446688">is</tspan><tspan fill="#2f6b26" font-weight="bold">two</tspan></text>
  <text x="500" y="340" font-size="11" font-weight="bold" fill="#b85450">i ← 13</text>

  <!-- row 4 -->
  <g filter="url(#sk)">
    <rect x="40" y="366" width="600" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="63" cy="388" r="13" fill="#446688"/>
    <rect x="88" y="376" width="15" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="103" y="376" width="15" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="118" y="376" width="15" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="133" y="376" width="15" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="148" y="376" width="15" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="163" y="376" width="15" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="178" y="376" width="15" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="193" y="376" width="15" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="208" y="376" width="15" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="223" y="376" width="15" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="3"/>
  </g>
  <text x="63" y="393" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">4</text>
  <g font-size="12" text-anchor="middle" fill="#446688">
    <text x="95.5" y="393">y</text>
    <text x="110.5" y="393">e</text>
    <text x="125.5" y="393">a</text>
    <text x="140.5" y="393">r</text>
    <text x="155.5" y="393">s</text>
    <text x="170.5" y="393">o</text>
    <text x="185.5" y="393">l</text>
    <text x="200.5" y="393">d</text>
  </g>
  <text x="278" y="390" font-size="11.5" fill="#444">普通字符：逐个直通，直到结尾</text>
  <text x="278" y="412" font-size="10.5" fill="#888">i 走到 21 = n，扫描结束</text>
  <text x="432" y="392" font-size="10.5" fill="#333">res = <tspan fill="#2f6b26" font-weight="bold">bob</tspan><tspan fill="#446688">is</tspan><tspan fill="#2f6b26" font-weight="bold">two</tspan><tspan fill="#446688">yearsold</tspan></text>
  <text x="432" y="416" font-size="11" font-weight="bold" fill="#b85450">i ← 21 = n ✓</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="446" width="600" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="340" y="463" text-anchor="middle" font-size="10.5" fill="#555">游标只进不退：普通字符 O(1)，括号段按段长一次性消费 —— 整体 O(n)</text>
</svg>
