<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：子集和恰为 [0, x−1]，x 是最小缺口</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 覆盖条：金额轴 -->
  <text x="90" y="66" font-size="12" font-weight="bold" fill="#2e6e2e">已处理硬币 + 已补硬币</text>
  <text x="90" y="83" font-size="11" fill="#666">（原生吸收的 ∪ 主动补的）</text>

  <g filter="url(#sk)"><rect x="90" y="94" width="250" height="34" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="102" y="116" font-size="12" fill="#2e6e2e" font-weight="bold">0</text>
  <text x="328" y="116" font-size="12" fill="#2e6e2e" font-weight="bold">x−1</text>
  <text x="215" y="116" text-anchor="middle" font-size="11" fill="#3a7a3a">连续全覆盖 ✓</text>

  <g filter="url(#sk)"><rect x="346" y="94" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4"/></g>
  <text x="368" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">x ✗</text>

  <g filter="url(#sk)"><rect x="396" y="94" width="160" height="34" rx="4" fill="#f0efea" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="476" y="116" text-anchor="middle" font-size="12" fill="#999">… 暂不可达 …</text>
  <text x="368" y="145" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最小凑不出的金额 = 缺口</text>

  <!-- 分支标题 -->
  <text x="320" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">排序后逐枚考察下一枚面值 c，只有两种情形：</text>

  <!-- 情况① 吸收 -->
  <g filter="url(#sk)"><rect x="35" y="190" width="277" height="128" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="52" y="215" font-size="14" font-weight="bold" fill="#2b6e9e">① c ≤ x：直接吸收</text>
  <g filter="url(#sk)"><rect x="52" y="228" width="105" height="20" rx="3" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="104" y="243" text-anchor="middle" font-size="10" fill="#2e6e2e">[0, x−1]</text>
  <g filter="url(#sk)"><rect x="163" y="228" width="105" height="20" rx="3" fill="#dcebfb" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="215" y="243" text-anchor="middle" font-size="10" fill="#2b6e9e">[c, c+x−1]</text>
  <text x="278" y="243" font-size="12" fill="#2b6e9e" font-weight="bold">→</text>
  <g filter="url(#sk)"><rect x="52" y="254" width="216" height="20" rx="3" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="160" y="269" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">合并 → [0, x+c−1]</text>
  <text x="52" y="300" font-size="12" fill="#444">两段相接或重叠（因 c ≤ x），无缝并成</text>
  <text x="52" y="313" font-size="12" fill="#444">更长前缀：<tspan font-family="monospace" font-weight="bold" fill="#2b6e9e">x += c</tspan></text>

  <!-- 情况② 补币 -->
  <g filter="url(#sk)"><rect x="328" y="190" width="277" height="128" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="345" y="215" font-size="14" font-weight="bold" fill="#a06a10">② c &gt; x（或用尽）：真缺口</text>
  <g filter="url(#sk)"><rect x="345" y="228" width="88" height="20" rx="3" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="389" y="243" text-anchor="middle" font-size="10" fill="#2e6e2e">[0, x−1]</text>
  <g filter="url(#sk)"><ellipse cx="447" cy="238" rx="17" ry="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="447" y="243" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">x</text>
  <text x="472" y="243" font-size="12" fill="#a06a10" font-weight="bold">→</text>
  <g filter="url(#sk)"><rect x="486" y="228" width="105" height="20" rx="3" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="538" y="243" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">[0, 2x−1]</text>
  <text x="345" y="272" font-size="12" fill="#444">补 y &gt; x 救不了缺口；y &lt; x 增长慢半拍</text>
  <text x="345" y="290" font-size="12" fill="#444">→ 最优是补面值 x：<tspan font-family="monospace" font-weight="bold" fill="#b85450">ans++</tspan><tspan font-family="monospace" font-weight="bold" fill="#b85450">, x *= 2</tspan></text>
  <text x="345" y="308" font-size="11" fill="#888">覆盖每补一次翻倍，i 原地不动再判同一枚 c</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="55" y="340" width="530" height="52" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">把「10¹⁰ 的子集和真值表」压成一个标量 x 的追赶</text>
  <text x="320" y="382" text-anchor="middle" font-size="11" fill="#555">与 330「按要求补齐数组」、1798「连续值的最大数目」是同一套不变式的三副面孔</text>
</svg>
