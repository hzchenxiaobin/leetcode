  <text x="608" y="244" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">24</text>
  <text x="702" y="244" text-anchor="middle" font-size="13" fill="#8a5a10" filter="url(#rough2)">120</text>

  <rect x="14" y="258" width="752" height="34" rx="6" fill="#fff8e1" stroke="#e0cdb0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="280" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10^9</text>
  <text x="92" y="280" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">20</text>
  <text x="144" y="280" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">21</text>
  <text x="226" y="280" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">≫ N</text>
  <text x="318" y="280" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="372" y="280" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">21</text>
