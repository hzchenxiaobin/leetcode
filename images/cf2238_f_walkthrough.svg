<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="780" height="450" fill="#fafafa" filter="url(#rough2)"/>

  <text x="390" y="30" text-anchor="middle" font-size="14" fill="#444" filter="url(#rough2)">六组官方样例演算：N = k + 1，t = q + popcount(r)，答案 = Cat(t − 1) · t! / q!</text>

  <rect x="14" y="46" width="752" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="66" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">n</text>
  <text x="92" y="66" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">k</text>
  <text x="144" y="66" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">N</text>
  <text x="226" y="66" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">M = 2^(n−1)</text>
  <text x="318" y="66" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">q</text>
  <text x="372" y="66" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">r</text>
  <text x="420" y="66" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">t</text>
  <text x="466" y="66" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">m</text>
  <text x="532" y="66" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">Cat(m)</text>
  <text x="608" y="66" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">t! / q!</text>
  <text x="702" y="66" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">答案</text>

  <rect x="14" y="78" width="752" height="34" rx="6" fill="#ffffff" stroke="#c9cfd6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="92" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="144" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="226" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="318" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="372" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="420" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="466" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="532" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="608" y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="702" y="100" text-anchor="middle" font-size="13" fill="#8a5a10" filter="url(#rough2)">1</text>

  <rect x="14" y="114" width="752" height="34" rx="6" fill="#fff8e1" stroke="#e0cdb0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="136" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="92" y="136" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
