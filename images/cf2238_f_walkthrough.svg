  <text x="608" y="136" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="702" y="136" text-anchor="middle" font-size="13" fill="#8a5a10" filter="url(#rough2)">2</text>

  <rect x="14" y="150" width="752" height="34" rx="6" fill="#ffffff" stroke="#c9cfd6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="92" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="144" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="226" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="318" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="372" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="420" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
