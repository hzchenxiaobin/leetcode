  <rect x="14" y="308" width="752" height="30" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="390" y="328" text-anchor="middle" font-size="12" fill="#2f4f2a" filter="url(#rough2)">r = 15 = 1111₂ → popcount = 4；r = 21 = 10101₂ → popcount = 3；只有这两个样例用到了 cap，其余 cap 都大于 N</text>

  <rect x="14" y="346" width="752" height="30" rx="7" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="390" y="366" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">n = 1 时 M = 1，所有指数只能取 0，于是 t = N = k + 1，答案直接是 Cat(k)</text>

  <rect x="14" y="384" width="752" height="46" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="390" y="404" text-anchor="middle" font-size="12" fill="#8a3230" filter="url(#rough2)">唯一需要特判的情形：N 本身是 2 的幂（如 k = 1, 3, 7, …），贪心给出 t = 1</text>
  <text x="390" y="422" text-anchor="middle" font-size="12" fill="#8a3230" filter="url(#rough2)">但 |S| = |R| + 1 ≥ 2，所以只能把这一项拆成两个半幂，t = 2，方案数恰为 1</text>
</svg>
