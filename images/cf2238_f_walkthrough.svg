  <text x="702" y="172" text-anchor="middle" font-size="13" fill="#8a5a10" filter="url(#rough2)">2</text>

  <rect x="14" y="186" width="752" height="34" rx="6" fill="#fff8e1" stroke="#e0cdb0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
