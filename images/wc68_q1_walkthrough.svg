<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="38" text-anchor="middle" font-size="16" fill="#334" filter="url(#rough2)">示例走查：(m−1)(n−1) = 6 次比较，全部成立即返回 true</text>

  <!-- 表头 -->
  <rect x="50" y="66" width="500" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="86" y="88" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">示例</text>
  <text x="228" y="88" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">比较（当前格 ← 左上邻居）</text>
  <text x="398" y="88" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">值</text>
  <text x="508" y="88" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">结论</text>

  <!-- 表格外框与横线 -->
  <rect x="50" y="100" width="500" height="224" rx="6" fill="none" stroke="#9aa4a8" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="51" y="293" width="498" height="30" fill="#fce4ec" stroke="none" opacity="0.7" filter="url(#rough2)"/>
  <path d="M50,132 H550" fill="none" stroke="#c9d2d6" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M50,164 H550" fill="none" stroke="#c9d2d6" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M50,196 H550" fill="none" stroke="#c9d2d6" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M50,228 H550" fill="none" stroke="#c9d2d6" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M50,260 H550" fill="none" stroke="#c9d2d6" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M50,292 H550" fill="none" stroke="#c9d2d6" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M118,66 V324" fill="none" stroke="#c9d2d6" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M340,66 V324" fill="none" stroke="#c9d2d6" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M452,66 V324" fill="none" stroke="#c9d2d6" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 示例 1：[[1,2,3,4],[5,1,2,3],[9,5,1,2]] -->
  <text x="86" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(1,1) ← (0,0)</text>
  <text x="398" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1 = 1</text>
  <text x="508" y="118" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="86" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(1,2) ← (0,1)</text>
  <text x="398" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2 = 2</text>
  <text x="508" y="150" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="86" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(1,3) ← (0,2)</text>
  <text x="398" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3 = 3</text>
  <text x="508" y="182" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="86" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(2,1) ← (1,0)</text>
  <text x="398" y="214" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5 = 5</text>
  <text x="508" y="214" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="86" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(2,2) ← (1,1)</text>
  <text x="398" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1 = 1</text>
  <text x="508" y="246" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="86" y="278" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="278" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(2,3) ← (1,2)</text>
  <text x="398" y="278" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2 = 2</text>
  <text x="508" y="278" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 示例 2：[[1,2],[2,2]] -->
  <text x="86" y="314" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="230" y="314" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(1,1) ← (0,0)</text>
  <text x="398" y="314" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">2 ≠ 1</text>
  <text x="504" y="314" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✗ false</text>

  <text x="300" y="344" text-anchor="middle" font-size="12" fill="#667" filter="url(#rough2)">示例 1 六次全过 → true；示例 2 第一次就失败 → 立即 false</text>
</svg>
