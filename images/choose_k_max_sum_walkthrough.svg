<svg xmlns="http://www.w3.org/2000/svg" width="640" height="395" viewBox="0 0 640 395" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="395" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 逐组演算（k = 2）：先作答、后入堆</text>
  <path d="M 130 44 Q 320 52 510 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- answer column tint -->
  <g filter="url(#sk)">
    <rect x="331" y="87" width="98" height="198" fill="#eef7ee" stroke="none"/>
  </g>

  <!-- header row -->
  <g filter="url(#sk)">
    <rect x="36" y="56" width="568" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="68" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">组值 v</text>
  <text x="152" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">组内下标 (nums2)</text>
  <text x="267" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">作答前堆</text>
  <text x="380" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a2b">answer</text>
  <text x="517" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">入堆后（淘汰）</text>

  <!-- row separators -->
  <g filter="url(#sk)" stroke="#ccc" stroke-width="1">
    <line x1="36" y1="126" x2="604" y2="126"/>
    <line x1="36" y1="166" x2="604" y2="166"/>
    <line x1="36" y1="206" x2="604" y2="206"/>
    <line x1="36" y1="246" x2="604" y2="246"/>
  </g>
  <!-- column separators -->
  <g filter="url(#sk)" stroke="#bbb" stroke-width="1">
    <line x1="100" y1="56" x2="100" y2="286"/>
    <line x1="204" y1="56" x2="204" y2="286"/>
    <line x1="330" y1="56" x2="330" y2="286"/>
    <line x1="430" y1="56" x2="430" y2="286"/>
  </g>
  <g filter="url(#sk)">
    <rect x="36" y="56" width="568" height="230" fill="none" stroke="#446688" stroke-width="1.4"/>
  </g>

  <!-- row 1: v=1 -->
  <text x="68" y="111" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>
  <text x="152" y="111" text-anchor="middle" font-size="12" fill="#2b2b2b">2 (30)</text>
  <text x="267" y="111" text-anchor="middle" font-size="12" fill="#999">空</text>
  <text x="380" y="111" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a2b">ans[2] = 0</text>
  <text x="517" y="111" text-anchor="middle" font-size="12" fill="#2b2b2b">{30}</text>

  <!-- row 2: v=2 -->
  <text x="68" y="151" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <text x="152" y="151" text-anchor="middle" font-size="12" fill="#2b2b2b">1 (20)</text>
  <text x="267" y="151" text-anchor="middle" font-size="12" fill="#2b2b2b">{30}</text>
  <text x="380" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a2b">ans[1] = 30</text>
  <text x="517" y="151" text-anchor="middle" font-size="12" fill="#2b2b2b">{20, 30}</text>

  <!-- row 3: v=3 -->
  <text x="68" y="191" text-anchor="middle" font-size="12" fill="#2b2b2b">3</text>
  <text x="152" y="191" text-anchor="middle" font-size="12" fill="#2b2b2b">4 (50)</text>
  <text x="267" y="191" text-anchor="middle" font-size="12" fill="#2b2b2b">{20, 30}</text>
  <text x="380" y="191" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a2b">ans[4] = 50</text>
  <text x="510" y="188" text-anchor="middle" font-size="12" fill="#2b2b2b">{30, 50}</text>
  <text x="510" y="203" text-anchor="middle" font-size="9.5" fill="#b85450">淘汰 20</text>

  <!-- row 4: v=4 -->
  <text x="68" y="231" text-anchor="middle" font-size="12" fill="#2b2b2b">4</text>
  <text x="152" y="231" text-anchor="middle" font-size="12" fill="#2b2b2b">0 (10)</text>
  <text x="267" y="231" text-anchor="middle" font-size="12" fill="#2b2b2b">{30, 50}</text>
  <text x="380" y="231" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a2b">ans[0] = 80</text>
  <text x="510" y="228" text-anchor="middle" font-size="12" fill="#2b2b2b">{30, 50}</text>
  <text x="510" y="243" text-anchor="middle" font-size="9.5" fill="#b85450">淘汰 10</text>

  <!-- row 5: v=5 -->
  <text x="68" y="271" text-anchor="middle" font-size="12" fill="#2b2b2b">5</text>
  <text x="152" y="271" text-anchor="middle" font-size="12" fill="#2b2b2b">3 (40)</text>
  <text x="267" y="271" text-anchor="middle" font-size="12" fill="#2b2b2b">{30, 50}</text>
  <text x="380" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a2b">ans[3] = 80</text>
  <text x="510" y="268" text-anchor="middle" font-size="12" fill="#2b2b2b">{40, 50}</text>
  <text x="510" y="283" text-anchor="middle" font-size="9.5" fill="#b85450">淘汰 30</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="36" y="300" width="568" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a2b">回填原下标：answer = [80, 30, 0, 80, 50] ✓</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="36" y="346" width="568" height="36" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="361" text-anchor="middle" font-size="10.5" fill="#888">作答发生在入堆之前 —— 同一组内值相等的元素互相看不见；</text>
  <text x="320" y="376" text-anchor="middle" font-size="10.5" fill="#888">sum 随「入堆 +x / 淘汰 −堆顶」增量维护，作答 O(1)。</text>
</svg>
