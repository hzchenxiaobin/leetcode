<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：建 Trie → 双层枚举，失配即剪枝</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">记录 [i, j] 之后继续下探（单词可能互为前缀）</text>

  <g filter="url(#rough2)">
    <rect x="212" y="56" width="96" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="14"/>
  </g>
  <text x="260" y="75" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 86 L 260 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="130" y="102" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="260" y="123" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">把 words 全部插入 Trie，结尾节点打 isEnd 标记</text>

  <path d="M 260 136 L 260 146" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,148 348,178 260,208 172,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 260 208 L 260 222" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="220" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="150" y="224" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="260" y="244" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">cur = root，j = i（内层从起点开始）</text>

  <path d="M 260 256 L 260 266" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,268 366,300 260,332 154,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">j &lt; n 且 cur 有</text>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">text[j] 子节点 ?</text>

  <path d="M 260 332 L 260 346" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="344" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="150" y="348" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="260" y="368" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">cur 下移到该子节点</text>

  <path d="M 260 380 L 260 392" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,394 348,422 260,450 172,422" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="426" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">cur.isEnd ?</text>

  <path d="M 348 422 L 364 422" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="414" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="366" y="404" width="136" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="434" y="426" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">记录 [i, j] 后</text>
  <text x="434" y="438" text-anchor="middle" font-size="10" fill="#555">继续下探，不停</text>
  <path d="M 434 440 L 434 470 L 260 470 L 260 460" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="464" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">j++ 回内层判定</text>

  <path d="M 154 300 L 60 300" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="292" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="16" y="282" width="92" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <text x="62" y="296" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">失配 / 到头</text>
  <text x="62" y="310" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">break 出内层</text>

  <path d="M 348 178 L 466 178 L 466 76 L 360 76" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="170" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j++ 回内层</text>
  <text x="472" y="152" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否（起点用尽）</text>
  <text x="472" y="270" font-size="10" fill="#888" filter="url(#rough2)">→ i++ 试下一个起点</text>
  <text x="472" y="286" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">全部起点扫完</text>
  <text x="472" y="300" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">返回 ans</text>
</svg>
