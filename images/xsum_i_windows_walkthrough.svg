<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="450" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 完整演算：k = 6，x = 2</text>
  <path d="M 165 36 Q 320 44 475 36" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 数组格子（下标 0..7） -->
  <text x="116" y="54" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="160" y="54" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="204" y="54" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="248" y="54" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="292" y="54" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="336" y="54" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="380" y="54" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="424" y="54" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">7</text>

  <rect x="96" y="58" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="140" y="58" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="184" y="58" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="204" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="228" y="58" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="272" y="58" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="316" y="58" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="360" y="58" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="404" y="58" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="84" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <!-- 三条窗口下划线 -->
  <path d="M 96 108 L 356 108" stroke="#446688" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="366" y="112" font-size="10" fill="#446688" filter="url(#rough2)">窗 0</text>
  <path d="M 140 120 L 400 120" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="410" y="124" font-size="10" fill="#4a7a3a" filter="url(#rough2)">窗 1</text>
  <path d="M 184 132 L 444 132" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="454" y="136" font-size="10" fill="#a06a15" filter="url(#rough2)">窗 2</text>

  <!-- 卡 0 -->
  <rect x="40" y="150" width="560" height="68" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="52" y="170" width="52" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="188" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">窗 0</text>
  <text x="122" y="188" font-size="11.5" fill="#444" filter="url(#rough2)">[1, 1, 2, 2, 3, 4]</text>
  <text x="288" y="180" font-size="10" fill="#888" filter="url(#rough2)">频次：1×2  2×2  3×1  4×1</text>
  <text x="288" y="200" font-size="11" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">top-2：1(×2)、2(×2)</text>
  <rect x="486" y="160" width="100" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="536" y="192" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">6</text>

  <!-- 卡 1 -->
  <rect x="40" y="228" width="560" height="68" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="52" y="248" width="52" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="266" text-anchor="middle" font-size="11" fill="#3a5f2e" filter="url(#rough2)">窗 1</text>
  <text x="122" y="266" font-size="11.5" fill="#444" filter="url(#rough2)">[1, 2, 2, 3, 4, 2]</text>
  <text x="288" y="258" font-size="10" fill="#888" filter="url(#rough2)">频次：2×3  1×1  3×1  4×1</text>
  <text x="288" y="278" font-size="11" fill="#3a5f2e" font-weight="bold" filter="url(#rough2)">top-2：2(×3)、4(×1 平局胜)</text>
  <rect x="486" y="238" width="100" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="536" y="270" text-anchor="middle" font-size="20" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">10</text>

  <!-- 卡 2 -->
  <rect x="40" y="306" width="560" height="68" rx="10" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="52" y="326" width="52" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="344" text-anchor="middle" font-size="11" fill="#a06a15" filter="url(#rough2)">窗 2</text>
  <text x="122" y="344" font-size="11.5" fill="#444" filter="url(#rough2)">[2, 2, 3, 4, 2, 3]</text>
  <text x="288" y="336" font-size="10" fill="#888" filter="url(#rough2)">频次：2×3  3×2  4×1</text>
  <text x="288" y="356" font-size="11" fill="#a06a15" font-weight="bold" filter="url(#rough2)">top-2：2(×3)、3(×2)</text>
  <rect x="486" y="316" width="100" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="536" y="348" text-anchor="middle" font-size="20" font-weight="bold" fill="#a06a15" filter="url(#rough2)">12</text>

  <!-- 底部答案 -->
  <text x="222" y="416" text-anchor="end" font-size="12.5" fill="#444" filter="url(#rough2)">answer =</text>
  <rect x="240" y="396" width="44" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="262" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">6</text>
  <rect x="290" y="396" width="44" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="312" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">10</text>
  <rect x="340" y="396" width="44" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="362" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a15" filter="url(#rough2)">12</text>
  <text x="420" y="416" font-size="10.5" fill="#888" filter="url(#rough2)">← 与题面输出一致</text>
</svg>
