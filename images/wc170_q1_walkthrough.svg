<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">演算：s = "10#11#12"，从右向左切分</text>

  <g font-size="9" text-anchor="middle" fill="#999">
    <text x="119" y="46" filter="url(#rough2)">0</text>
    <text x="165" y="46" filter="url(#rough2)">1</text>
    <text x="211" y="46" filter="url(#rough2)">2</text>
    <text x="257" y="46" filter="url(#rough2)">3</text>
    <text x="303" y="46" filter="url(#rough2)">4</text>
    <text x="349" y="46" filter="url(#rough2)">5</text>
    <text x="395" y="46" filter="url(#rough2)">6</text>
    <text x="441" y="46" filter="url(#rough2)">7</text>
  </g>

  <g font-size="14" text-anchor="middle" fill="#333">
    <rect x="96" y="52" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="119" y="76" filter="url(#rough2)">1</text>
    <rect x="142" y="52" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="165" y="76" filter="url(#rough2)">0</text>
    <rect x="188" y="52" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="211" y="76" filter="url(#rough2)">#</text>
    <rect x="234" y="52" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="257" y="76" filter="url(#rough2)">1</text>
    <rect x="280" y="52" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="303" y="76" filter="url(#rough2)">1</text>
    <rect x="326" y="52" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="349" y="76" filter="url(#rough2)">#</text>
    <rect x="372" y="52" width="46" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="395" y="76" filter="url(#rough2)">1</text>
    <rect x="418" y="52" width="46" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="441" y="76" filter="url(#rough2)">2</text>
  </g>

  <g font-size="11" text-anchor="middle" font-weight="bold">
    <rect x="96" y="96" width="138" height="6" fill="#446688" rx="3" filter="url(#rough2)"/>
    <text x="165" y="116" fill="#3a4a66" filter="url(#rough2)">10# → j</text>
    <rect x="234" y="96" width="138" height="6" fill="#4a7a3a" rx="3" filter="url(#rough2)"/>
    <text x="303" y="116" fill="#3a5a30" filter="url(#rough2)">11# → k</text>
    <rect x="372" y="96" width="46" height="6" fill="#d6a040" rx="3" filter="url(#rough2)"/>
    <text x="395" y="116" fill="#8a6a20" filter="url(#rough2)">a</text>
    <rect x="418" y="96" width="46" height="6" fill="#b85450" rx="3" filter="url(#rough2)"/>
    <text x="441" y="116" fill="#8a3a36" filter="url(#rough2)">b</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="132" width="490" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="40" y="160" width="490" height="126" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="40" y="286" width="490" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <path d="M 100 132 L 100 318 M 152 132 L 152 318 M 208 132 L 208 318 M 300 132 L 300 318 M 418 132 L 418 318 M 472 132 L 472 318"
          stroke="#8899aa" stroke-width="1" fill="none"/>
    <path d="M 40 160 L 530 160 M 40 192 L 530 192 M 40 224 L 530 224 M 40 256 L 530 256 M 40 286 L 530 286"
          stroke="#8899aa" stroke-width="1" fill="none"/>
  </g>

  <g font-size="10" text-anchor="middle" fill="#333">
    <text x="70" y="150" filter="url(#rough2)">步骤</text>
    <text x="126" y="150" filter="url(#rough2)">i</text>
    <text x="180" y="150" filter="url(#rough2)">s[i]</text>
    <text x="254" y="150" filter="url(#rough2)">判定</text>
    <text x="359" y="150" filter="url(#rough2)">取出的 token</text>
    <text x="445" y="150" filter="url(#rough2)">追加</text>
    <text x="501" y="150" filter="url(#rough2)">新 i</text>

    <text x="70" y="180" filter="url(#rough2)">1</text>
    <text x="126" y="180" filter="url(#rough2)">7</text>
    <text x="180" y="180" filter="url(#rough2)">'2'</text>
    <text x="254" y="180" filter="url(#rough2)">非 #，一位码</text>
    <text x="359" y="180" filter="url(#rough2)">"2" = 2</text>
    <text x="445" y="180" filter="url(#rough2)">'b'</text>
    <text x="501" y="180" filter="url(#rough2)">6</text>

    <text x="70" y="212" filter="url(#rough2)">2</text>
    <text x="126" y="212" filter="url(#rough2)">6</text>
    <text x="180" y="212" filter="url(#rough2)">'1'</text>
    <text x="254" y="212" filter="url(#rough2)">非 #，一位码</text>
    <text x="359" y="212" filter="url(#rough2)">"1" = 1</text>
    <text x="445" y="212" filter="url(#rough2)">'a'</text>
    <text x="501" y="212" filter="url(#rough2)">5</text>

    <text x="70" y="244" filter="url(#rough2)">3</text>
    <text x="126" y="244" filter="url(#rough2)">5</text>
    <text x="180" y="244" filter="url(#rough2)">'#'</text>
    <text x="254" y="244" filter="url(#rough2)">是 #，三位码</text>
    <text x="359" y="244" filter="url(#rough2)">"11#" = 11</text>
    <text x="445" y="244" filter="url(#rough2)">'k'</text>
    <text x="501" y="244" filter="url(#rough2)">2</text>

    <text x="70" y="276" filter="url(#rough2)">4</text>
    <text x="126" y="276" filter="url(#rough2)">2</text>
    <text x="180" y="276" filter="url(#rough2)">'#'</text>
    <text x="254" y="276" filter="url(#rough2)">是 #，三位码</text>
    <text x="359" y="276" filter="url(#rough2)">"10#" = 10</text>
    <text x="445" y="276" filter="url(#rough2)">'j'</text>
    <text x="501" y="276" filter="url(#rough2)">−1</text>

    <text x="70" y="306" filter="url(#rough2)">结束</text>
    <text x="126" y="306" filter="url(#rough2)">−1</text>
    <text x="180" y="306" filter="url(#rough2)">—</text>
    <text x="254" y="306" filter="url(#rough2)">i &lt; 0 退出</text>
    <text x="359" y="306" filter="url(#rough2)">res = "bakj"</text>
    <text x="445" y="306" filter="url(#rough2)">反转</text>
    <text x="501" y="306" filter="url(#rough2)">"jkab"</text>
  </g>

  <text x="280" y="344" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">共 4 次循环：两次减 1、两次减 3，指针走到 −1 退出，反转后得 "jkab"</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意：追加顺序是反的（b, a, k, j），必须反转后才与题面示例输出一致</text>
</svg>
