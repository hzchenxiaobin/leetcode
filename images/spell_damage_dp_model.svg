<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">DP 模型：不取继承，取则跳回兼容前缀</text>
  <text x="260" y="54" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">dp[i+1] = max( dp[i] ,  dp[j] + vals[i]·cnt(vals[i]) )</text>

  <!-- value cards: vals = [1, 3, 4], current i = 2 -->
  <rect x="60" y="86" width="92" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="106" y="112" text-anchor="middle" font-size="15" fill="#2d4d24" filter="url(#rough2)">1 ×2</text>
  <text x="106" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">收益 2</text>

  <rect x="210" y="86" width="92" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="256" y="112" text-anchor="middle" font-size="15" fill="#7c2b28" filter="url(#rough2)">3 ×1</text>
  <text x="256" y="132" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">收益 3</text>

  <rect x="360" y="86" width="92" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="406" y="112" text-anchor="middle" font-size="15" fill="#2f4358" filter="url(#rough2)">4 ×1</text>
  <text x="406" y="132" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">收益 4</text>
  <text x="406" y="76" text-anchor="middle" font-size="11.5" fill="#2f4358" filter="url(#rough2)">当前 vals[i] = 4</text>

  <!-- compatibility annotations between cards -->
  <text x="181" y="106" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">差3 ✓</text>
  <text x="331" y="106" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">差1 ✗</text>

  <!-- j pointer -->
  <path d="M118,180 C130,206 148,232 160,254" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="5,4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="112" y="172" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">j = 1：首个 ≥ v−2 的下标</text>
  <text x="112" y="156" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">兼容前缀 vals[0..j−1] = {1}</text>

  <!-- dp boxes -->
  <rect x="22" y="262" width="76" height="40" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="60" y="287" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">dp[0]=0</text>

  <rect x="127" y="262" width="76" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="165" y="287" text-anchor="middle" font-size="13" fill="#2d4d24" filter="url(#rough2)">dp[1]=2</text>

  <rect x="232" y="262" width="76" height="40" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="287" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">dp[2]=3</text>

  <rect x="392" y="262" width="76" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="430" y="287" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">dp[3]=6</text>

  <!-- take arrow: dp[1] -> dp[3] -->
  <path d="M205,256 C270,196 360,196 418,256" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="312" y="192" text-anchor="middle" font-size="12.5" fill="#2d4d24" filter="url(#rough2)">取：dp[j] + 收益 = 2 + 4 = 6</text>

  <!-- skip arrow: dp[2] -> dp[3] -->
  <path d="M300,258 C330,240 370,240 394,258" stroke="#8a8a8a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="347" y="236" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">不取：dp[2] = 3</text>

  <!-- summary box -->
  <rect x="40" y="330" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="351" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">双指针求 j：vals[i]−2 单调不减 → j 只前进不回退，均摊 O(1)</text>
  <text x="260" y="372" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">[v−2, v−1] 内至多 2 个互异整数 → 回看距离 ≤ 3，dp 可滚动</text>
</svg>
