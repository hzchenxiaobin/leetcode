<svg xmlns="http://www.w3.org/2000/svg" width="560" height="520" viewBox="0 0 560 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="560" height="520" fill="#fdfcf7"/>
  <text x="280" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：移位扫描，按下标奇偶分桶计数</text>
  <path d="M 130 38 Q 280 44 430 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="160" y="48" width="140" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="230" y="70" text-anchor="middle" font-size="12" fill="#2b2b2b">even = odd = 0，i = 0</text>
  <path d="M 230 84 L 230 96" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>

  <!-- diamond 1: n == 0 ? -->
  <g filter="url(#sk)">
    <polygon points="140,130 230,96 320,130 230,164" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="230" y="134" text-anchor="middle" font-size="12" fill="#2b2b2b">n == 0 ?</text>
  <path d="M 320 130 L 400 130" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="352" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="400" y="112" width="140" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="470" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">返回 [even, odd]</text>
  <path d="M 230 164 L 230 180" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="240" y="176" font-size="11" fill="#b85450">否</text>

  <!-- diamond 2: lowest bit == 1 ? -->
  <g filter="url(#sk)">
    <polygon points="128,216 230,182 332,216 230,250" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="230" y="220" text-anchor="middle" font-size="12" fill="#2b2b2b">n &amp; 1 == 1 ?</text>
  <path d="M 230 250 L 230 264" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="240" y="262" font-size="11" fill="#4a7a3a">是</text>
  <path d="M 332 216 L 520 216 L 520 424 L 300 424" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="400" y="208" text-anchor="middle" font-size="11" fill="#b85450">否（该位为 0，不计数）</text>

  <!-- diamond 3: i even ? -->
  <g filter="url(#sk)">
    <polygon points="125,298 230,266 335,298 230,330" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="230" y="302" text-anchor="middle" font-size="12" fill="#2b2b2b">i 是偶数 ?</text>
  <path d="M 125 298 L 110 298 L 110 314" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="103" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>
  <path d="M 335 298 L 370 298 L 370 314" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <text x="372" y="290" text-anchor="middle" font-size="11" fill="#b85450">否</text>

  <!-- count boxes -->
  <g filter="url(#sk)">
    <rect x="55" y="316" width="110" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="110" y="337" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4a6e">even += 1</text>
  <g filter="url(#sk)">
    <rect x="315" y="316" width="110" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="370" y="337" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">odd += 1</text>

  <!-- merge into shift box -->
  <path d="M 110 350 L 110 380 L 200 380 L 200 412" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  <path d="M 370 350 L 370 380 L 260 380 L 260 412" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>

  <!-- shift box -->
  <g filter="url(#sk)">
    <rect x="160" y="414" width="140" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="230" y="435" text-anchor="middle" font-size="12" fill="#2b2b2b" font-family="monospace">n &gt;&gt;= 1，i += 1</text>

  <!-- loop back -->
  <path d="M 160 424 L 25 424 L 25 130 L 140 130" stroke="#3a3a3a" stroke-width="1.2" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  <text x="92" y="416" text-anchor="middle" font-size="10.5" fill="#888">下一轮</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="486" width="480" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="280" y="503" text-anchor="middle" font-size="11" fill="#7a5415">每轮处理一个位：n ≤ 1000 &lt; 2¹⁰，至多 10 轮；返回顺序是 [even, odd]</text>
</svg>
