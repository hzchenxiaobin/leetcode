<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="520" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：left = 10, right = 19</text>
  <path d="M 200 38 Q 340 46 480 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 数字条 10..19 -->
  <g filter="url(#sk)">
    <rect x="40" y="56" width="60" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="100" y="56" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="160" y="56" width="60" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="220" y="56" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="280" y="56" width="60" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="340" y="56" width="60" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="400" y="56" width="60" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="460" y="56" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="520" y="56" width="60" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="580" y="56" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="70" y="81" text-anchor="middle" font-size="14" fill="#777">10</text>
  <text x="130" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">11</text>
  <text x="190" y="81" text-anchor="middle" font-size="14" fill="#777">12</text>
  <text x="250" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">13</text>
  <text x="310" y="81" text-anchor="middle" font-size="14" fill="#777">14</text>
  <text x="370" y="81" text-anchor="middle" font-size="14" fill="#777">15</text>
  <text x="430" y="81" text-anchor="middle" font-size="14" fill="#777">16</text>
  <text x="490" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">17</text>
  <text x="550" y="81" text-anchor="middle" font-size="14" fill="#777">18</text>
  <text x="610" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">19</text>
  <text x="340" y="116" text-anchor="middle" font-size="11" fill="#555">绿框 = 质数（11、13、17、19），灰框 = 合数，升序扫描时只看绿框</text>

  <!-- 相邻对扫描表 -->
  <g filter="url(#sk)">
    <rect x="40" y="130" width="600" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="120" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">相邻对</text>
  <text x="240" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">gap</text>
  <text x="380" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">与 best 比较</text>
  <text x="555" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">动作</text>

  <!-- 行 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="160" width="600" height="42" fill="#eaf4ea" stroke="none"/>
    <path d="M 40 202 H 640" stroke="#c8c8c8" stroke-width="1"/>
  </g>
  <text x="120" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">(11, 13)</text>
  <text x="240" y="186" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="380" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">2 &lt; +∞ ✓</text>
  <text x="555" y="186" text-anchor="middle" font-size="12" fill="#333">best=2，ans=[11,13]</text>

  <!-- 行 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="202" width="600" height="42" fill="#fdfdf6" stroke="none"/>
    <path d="M 40 244 H 640" stroke="#c8c8c8" stroke-width="1"/>
  </g>
  <text x="120" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">(13, 17)</text>
  <text x="240" y="228" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="380" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">4 ≮ 2 ✗</text>
  <text x="555" y="228" text-anchor="middle" font-size="12" fill="#777">不更新</text>

  <!-- 行 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="244" width="600" height="42" fill="#fdf3dd" stroke="none"/>
  </g>
  <text x="120" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">(17, 19)</text>
  <text x="240" y="270" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="380" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a1a">2 ≮ 2 ✗（并列！）</text>
  <text x="555" y="270" text-anchor="middle" font-size="12" fill="#777">不更新，保住 [11,13]</text>

  <!-- 表格外框与列分隔 -->
  <g filter="url(#sk)">
    <rect x="40" y="130" width="600" height="156" fill="none" stroke="#446688" stroke-width="1.5"/>
    <path d="M 180 130 V 286 M 300 130 V 286 M 460 130 V 286" stroke="#c8c8c8" stroke-width="1"/>
  </g>

  <!-- 对照：若误写成 <= -->
  <g filter="url(#sk)">
    <rect x="40" y="300" width="600" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="58" y="326" font-size="11.5" font-weight="bold" fill="#b03a3a">易错点预告：若把比较误写成 gap ≤ best，第三行会覆盖成 [17,19]——gap 同为 2，但 num1 = 17 &gt; 11，WA 于示例 1。</text>

  <!-- 结果框 -->
  <g filter="url(#sk)">
    <rect x="40" y="356" width="600" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="340" y="382" text-anchor="middle" font-size="12.5" fill="#333">扫描结束：best = 2，三次比较后 ans 未再变动</text>
  <text x="340" y="408" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">返回 [11, 13] ✓</text>
  <text x="340" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">对照例 2：left = 4, right = 6 内只有质数 5 → 无相邻对 → 返回 [-1, -1]</text>

  <!-- 小知识框 -->
  <g filter="url(#sk)">
    <rect x="40" y="456" width="600" height="46" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="340" y="475" text-anchor="middle" font-size="11" fill="#555">顺带一提：除 (2, 3) 外任意两质数 gap 都是偶数（2 是唯一的偶质数），</text>
  <text x="340" y="492" text-anchor="middle" font-size="11" fill="#555">所以相邻质数 gap = 1 当且仅当这对就是 (2, 3)——可当 sanity check 用。</text>
</svg>
