<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例 1 走查：s = dcab，pairs = [[0,3],[1,2]]</text>
  <text x="310" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">并查集把下标分成两个分量，各自「小字符占小下标」地回填</text>

  <text x="44" y="98" font-size="10" fill="#666" filter="url(#rough2)">下标 i</text>
  <text x="44" y="150" font-size="10" fill="#666" filter="url(#rough2)">s[i]</text>
  <text x="44" y="202" font-size="10" fill="#666" filter="url(#rough2)">分量根</text>
  <text x="44" y="254" font-size="10" fill="#666" filter="url(#rough2)">回填字符</text>

  <rect x="150" y="76" width="50" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="175" y="99" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <rect x="208" y="76" width="50" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="233" y="99" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <rect x="266" y="76" width="50" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="291" y="99" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <rect x="324" y="76" width="50" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="349" y="99" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>

  <rect x="150" y="128" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="175" y="151" text-anchor="middle" font-size="12" fill="#243b53" filter="url(#rough2)">d</text>
  <rect x="208" y="128" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="233" y="151" text-anchor="middle" font-size="12" fill="#274d22" filter="url(#rough2)">c</text>
  <rect x="266" y="128" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="291" y="151" text-anchor="middle" font-size="12" fill="#274d22" filter="url(#rough2)">a</text>
  <rect x="324" y="128" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="349" y="151" text-anchor="middle" font-size="12" fill="#243b53" filter="url(#rough2)">b</text>

  <rect x="150" y="180" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="175" y="203" text-anchor="middle" font-size="11" fill="#243b53" filter="url(#rough2)">0</text>
  <rect x="208" y="180" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="233" y="203" text-anchor="middle" font-size="11" fill="#274d22" filter="url(#rough2)">1</text>
  <rect x="266" y="180" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="291" y="203" text-anchor="middle" font-size="11" fill="#274d22" filter="url(#rough2)">1</text>
  <rect x="324" y="180" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="349" y="203" text-anchor="middle" font-size="11" fill="#243b53" filter="url(#rough2)">0</text>

  <rect x="150" y="232" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="175" y="255" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">b</text>
  <rect x="208" y="232" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="233" y="255" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">a</text>
  <rect x="266" y="232" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="291" y="255" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">c</text>
  <rect x="324" y="232" width="50" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="349" y="255" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">d</text>

  <rect x="392" y="76" width="200" height="98" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="406" y="98" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">分量 A = {0, 3}（蓝）</text>
  <text x="406" y="120" font-size="9.5" fill="#555" filter="url(#rough2)">字符 {d, b} → 升序 {b, d}</text>
  <text x="406" y="140" font-size="9.5" fill="#555" filter="url(#rough2)">下标 0 ← b，下标 3 ← d</text>
  <text x="406" y="160" font-size="9" fill="#999" filter="url(#rough2)">回填按下标升序：0 在前，3 在后</text>

  <rect x="392" y="186" width="200" height="92" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="406" y="208" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">分量 B = {1, 2}（绿）</text>
  <text x="406" y="230" font-size="9.5" fill="#555" filter="url(#rough2)">字符 {c, a} → 升序 {a, c}</text>
  <text x="406" y="250" font-size="9.5" fill="#555" filter="url(#rough2)">下标 1 ← a，下标 2 ← c</text>
  <text x="406" y="270" font-size="9" fill="#999" filter="url(#rough2)">两组互不影响，可以分别定</text>

  <rect x="44" y="292" width="548" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="320" font-size="11" fill="#274d22" filter="url(#rough2)">答案 = bacd（交换 (0,3) 再交换 (1,2) 即可达到）</text>

  <rect x="44" y="356" width="548" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="379" font-size="10" fill="#6b5a30" filter="url(#rough2)">若再加一对 [0,2]，四个下标并成同一个分量：字符 {d,c,a,b} 升序后一次性回填，</text>
  <text x="60" y="400" font-size="10" fill="#8a6a20" filter="url(#rough2)">答案变成 abcd —— 分量越大，能挪动的字符就越多。</text>
</svg>
