<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="920" height="720" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：奇偶压进坐标后的二维网格 Dijkstra</text>
  <path d="M 240 44 Q 460 52 680 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== main flow (center x = 380) ===== -->
  <g filter="url(#sk)"><ellipse cx="380" cy="72" rx="42" ry="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="380" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">开始</text>
  <path d="M 380 91 L 380 102" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="270" y="106" width="220" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="380" y="127" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">初始化 dist[0][0] = 0</text>
  <text x="380" y="145" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">小根堆压入 (0, 0, 0)</text>
  <path d="M 380 154 L 380 166" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="270" y="172" width="220" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="380" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">弹出堆顶 (d, x, y)</text>
  <path d="M 380 216 L 380 224" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <!-- D1: stale? -->
  <g filter="url(#sk)"><polygon points="380,230 456,266 380,302 304,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="380" y="270" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">d &gt; dist[x][y] ?</text>
  <text x="288" y="256" font-size="10.5" font-weight="bold" fill="#666" filter="url(#sk)">是</text>
  <path d="M 304 266 L 254 266" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="80" y="244" width="170" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="165" y="271" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a" filter="url(#sk)">丢弃过期项</text>
  <path d="M 80 266 L 40 266" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="396" y="320" font-size="10.5" font-weight="bold" fill="#666" filter="url(#sk)">否</text>
  <path d="M 380 302 L 380 318" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <!-- D2: target? -->
  <g filter="url(#sk)"><polygon points="380,324 456,360 380,396 304,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="380" y="364" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">(x, y) 是终点 ?</text>
  <text x="476" y="350" font-size="10.5" font-weight="bold" fill="#666" filter="url(#sk)">是</text>
  <path d="M 456 360 L 512 360" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="516" y="334" width="196" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="614" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 d ✓</text>
  <text x="614" y="374" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">弹出即最优，提前返回</text>
  <text x="396" y="414" font-size="10.5" font-weight="bold" fill="#666" filter="url(#sk)">否</text>
  <path d="M 380 396 L 380 412" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <!-- N3: cost -->
  <g filter="url(#sk)"><rect x="270" y="418" width="220" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="380" y="445" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">cost = (x+y) 为偶 ? 1 : 2</text>
  <path d="M 380 462 L 380 474" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="240" y="480" width="280" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="380" y="502" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">对每个邻居 (nx, ny)：</text>
  <text x="380" y="523" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#444" filter="url(#sk)">nd = max(d, moveTime[nx][ny]) + cost</text>
  <path d="M 380 536 L 380 548" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <!-- D3: improve? -->
  <g filter="url(#sk)"><polygon points="380,554 456,590 380,626 304,590" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="380" y="594" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">nd &lt; dist[nx][ny] ?</text>
  <text x="272" y="580" font-size="10.5" font-weight="bold" fill="#666" filter="url(#sk)">是</text>
  <path d="M 304 590 L 244 590" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="60" y="568" width="180" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="150" y="594" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">dist 更新并入堆</text>
  <path d="M 60 590 L 40 590" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>

  <!-- left rail back to N2 -->
  <path d="M 40 590 L 40 194 L 262 194" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <text x="398" y="640" font-size="10.5" font-weight="bold" fill="#666" filter="url(#sk)">否</text>
  <path d="M 380 626 L 380 652 L 560 652 L 560 508 L 526 508" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <text x="470" y="644" font-size="9.5" fill="#888" filter="url(#sk)">换下一个邻居</text>

  <!-- ===== side notes ===== -->
  <g filter="url(#sk)">
    <rect x="600" y="80" width="290" height="158" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="618" y="104" font-size="12" font-weight="bold" fill="#446688" filter="url(#sk)">为什么 Dijkstra 仍然正确？</text>
  <text x="618" y="128" font-size="10.5" fill="#444" filter="url(#sk)">FIFO 性质：d₁ ≤ d₂ ⟹</text>
  <text x="618" y="148" font-size="10.5" font-family="monospace" fill="#444" filter="url(#sk)">max(d₁,c)+w ≤ max(d₂,c)+w</text>
  <text x="618" y="170" font-size="10.5" fill="#444" filter="url(#sk)">晚出发不可能早到——时间依赖</text>
  <text x="618" y="190" font-size="10.5" fill="#444" filter="url(#sk)">边权下贪心依然成立；且每步</text>
  <text x="618" y="210" font-size="10.5" font-family="monospace" fill="#444" filter="url(#sk)">nd ≥ d+1</text>
  <text x="618" y="228" font-size="10.5" fill="#444" filter="url(#sk)">时刻严格递增，无零环。</text>

  <g filter="url(#sk)">
    <rect x="600" y="410" width="290" height="76" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="618" y="434" font-size="11.5" font-weight="bold" fill="#b03a3a" filter="url(#sk)">惰性删除</text>
  <text x="618" y="456" font-size="10.5" fill="#444" filter="url(#sk)">同一格子可多次入堆，弹出时</text>
  <text x="618" y="476" font-size="10.5" fill="#444" filter="url(#sk)">d &gt; dist 即为过期项，直接丢弃</text>

  <g filter="url(#sk)">
    <rect x="600" y="516" width="290" height="100" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="618" y="540" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">复杂度</text>
  <text x="618" y="562" font-size="10.5" fill="#444" filter="url(#sk)">状态 (x,y) 共 nm 个 × 4 条出边</text>
  <text x="618" y="582" font-size="10.5" fill="#444" filter="url(#sk)">每次松弛 O(log nm)</text>
  <text x="618" y="602" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">总计 O(nm·log nm)，750² 轻松</text>
</svg>
