<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="600" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：一趟扫描，把每处下坠累加进答案</text>
  <path d="M 300 42 Q 440 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <rect x="350" y="62" width="180" height="40" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="440" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">开始：ans = 0</text>

  <path d="M 440 102 L 440 124" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 循环条件菱形 -->
  <g filter="url(#sk)">
    <polygon points="440,128 570,176 440,224 310,176" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="440" y="182" text-anchor="middle" font-size="14" fill="#7a5415" filter="url(#sk)">还有相邻对？</text>

  <!-- 否 → 输出 -->
  <path d="M 570 176 L 656 176" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="598" y="166" font-size="12" fill="#7a7a7a" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="660" y="154" width="160" height="44" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="740" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">输出 ans</text>
  <text x="740" y="220" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#sk)">（= 全部下坠之和 D）</text>

  <!-- 是 → 下降 -->
  <path d="M 440 224 L 440 248" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="452" y="242" font-size="12" fill="#7a7a7a" filter="url(#sk)">是</text>

  <!-- 判断下坠菱形 -->
  <g filter="url(#sk)">
    <polygon points="440,252 585,304 440,356 295,304" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="440" y="300" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#sk)">nums[i] &gt; nums[i+1] ？</text>
  <text x="440" y="318" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#sk)">（出现下坠 δ）</text>

  <!-- 是 → 累加 -->
  <path d="M 585 304 L 621 304" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="592" y="294" font-size="12" fill="#7a7a7a" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="625" y="276" width="230" height="62" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="740" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">ans += nums[i] − nums[i+1]</text>
  <text x="740" y="322" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#sk)">概念上：后缀 [i+1..] 抬升 x = δ</text>

  <!-- 否 → 跳过 -->
  <path d="M 295 304 L 259 304" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="268" y="294" font-size="12" fill="#7a7a7a" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="85" y="282" width="170" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="170" y="310" text-anchor="middle" font-size="13" fill="#33608c" filter="url(#sk)">跳过（已合规）</text>

  <!-- 汇合到 i++ -->
  <path d="M 740 338 L 740 430 L 504 430" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 170 326 L 170 430 L 396 430" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="400" y="410" width="100" height="40" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.5"/>
  </g>
  <text x="450" y="436" text-anchor="middle" font-size="13" fill="#444" filter="url(#sk)">i += 1</text>

  <!-- 回边 -->
  <path d="M 450 450 L 450 492 L 40 492 L 40 176 L 306 176" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="60" y="520" width="760" height="62" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="544" font-size="12" fill="#444" filter="url(#sk)">✨ 不必模拟抬升、也不必差分数组：处理到每一对 (i, i+1) 时，此前的操作都是同时覆盖 i 与 i+1 的后缀，</text>
  <text x="80" y="566" font-size="12" fill="#444" filter="url(#sk)">该对的差值仍等于原始差值 —— 直接把 δ 累进 ans。时间 O(n)，额外空间 O(1)。</text>
</svg>
