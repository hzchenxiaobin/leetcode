<svg xmlns="http://www.w3.org/2000/svg" width="640" height="366" viewBox="0 0 640 366" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="366" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：n = 5, k = 2</text>
  <path d="M 225 42 Q 320 48 415 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header -->
  <rect x="50" y="66" width="540" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="95" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6b">轮次</text>
  <text x="190" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6b">持球者</text>
  <text x="300" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6b">传球距离 i×k</text>
  <text x="405" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6b">落点</text>
  <text x="520" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6b">received 集合</text>

  <!-- rows -->
  <rect x="50" y="102" width="540" height="38" fill="#ffffff" stroke="#b9c6d4" stroke-width="1" filter="url(#sk)"/>
  <text x="95" y="126" text-anchor="middle" font-size="12" fill="#333">起手</text>
  <text x="190" y="126" text-anchor="middle" font-size="12" fill="#333">1 号</text>
  <text x="300" y="126" text-anchor="middle" font-size="12" fill="#999">—</text>
  <text x="405" y="126" text-anchor="middle" font-size="12" fill="#999">—</text>
  <text x="520" y="126" text-anchor="middle" font-size="12" fill="#2b4a6b" font-family="monospace">{1}</text>

  <rect x="50" y="140" width="540" height="38" fill="#f7faf7" stroke="#b9c6d4" stroke-width="1" filter="url(#sk)"/>
  <text x="95" y="164" text-anchor="middle" font-size="12" fill="#333">第 1 轮</text>
  <text x="190" y="164" text-anchor="middle" font-size="12" fill="#333">1 号</text>
  <text x="300" y="164" text-anchor="middle" font-size="12" fill="#333">1×2 = 2 步</text>
  <text x="405" y="164" text-anchor="middle" font-size="12" fill="#333">3 号</text>
  <text x="520" y="164" text-anchor="middle" font-size="12" fill="#2b4a6b" font-family="monospace">{1, 3}</text>

  <rect x="50" y="178" width="540" height="38" fill="#ffffff" stroke="#b9c6d4" stroke-width="1" filter="url(#sk)"/>
  <text x="95" y="202" text-anchor="middle" font-size="12" fill="#333">第 2 轮</text>
  <text x="190" y="202" text-anchor="middle" font-size="12" fill="#333">3 号</text>
  <text x="300" y="202" text-anchor="middle" font-size="12" fill="#333">2×2 = 4 步</text>
  <text x="405" y="202" text-anchor="middle" font-size="12" fill="#333">2 号</text>
  <text x="520" y="202" text-anchor="middle" font-size="12" fill="#2b4a6b" font-family="monospace">{1, 2, 3}</text>

  <rect x="50" y="216" width="540" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="95" y="240" text-anchor="middle" font-size="12" fill="#333">第 3 轮</text>
  <text x="190" y="240" text-anchor="middle" font-size="12" fill="#333">2 号</text>
  <text x="300" y="240" text-anchor="middle" font-size="12" fill="#333">3×2 = 6 步</text>
  <text x="405" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">3 号 ✗</text>
  <text x="520" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">3 已接球 → 结束</text>

  <!-- column separators -->
  <path d="M 140 66 L 140 254 M 240 66 L 240 254 M 360 66 L 360 254 M 450 66 L 450 254" stroke="#b9c6d4" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- result -->
  <rect x="50" y="274" width="540" height="50" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="320" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">从未接球的朋友 = {4, 5}</text>
  <text x="320" y="315" text-anchor="middle" font-size="12.5" fill="#8a4040">answer = [4, 5]（升序）</text>

  <text x="320" y="348" text-anchor="middle" font-size="11" fill="#888">抽屉原理：连同起手共 n+1 次接球事件落在 n 个位置上，至多 n 轮内必现重复，循环 O(n) 必停</text>
</svg>
