<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：grid = [[0,0,1],[1,0,1],[0,0,0]]</text>
  <path d="M 200 40 Q 340 48 480 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- arena: two teams -->
  <!-- Step 1: champ=0, challenger j=1 -->
  <g filter="url(#sk)">
    <rect x="60" y="80" width="130" height="52" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="125" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">擂主：0 队</text>
  <text x="125" y="122" text-anchor="middle" font-size="11" fill="#666">champ = 0</text>

  <g filter="url(#sk)">
    <rect x="250" y="80" width="130" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="315" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">挑战者：1 队</text>
  <text x="315" y="122" text-anchor="middle" font-size="11" fill="#888">j = 1</text>

  <!-- query bubble -->
  <g filter="url(#sk)">
    <rect x="60" y="160" width="320" height="58" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="80" y="183" font-size="13" fill="#444" font-family="monospace">查询 grid[0][1] = 0</text>
  <text x="80" y="205" font-size="12.5" fill="#8a6a1a" font-weight="bold">⇒ 1 队强于 0 队 ⇒ 王冠易主，champ = 1</text>

  <g filter="url(#sk)">
    <path d="M 230 106 L 245 106" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- Step 2: champ=1, challenger j=2 -->
  <g filter="url(#sk)">
    <rect x="60" y="250" width="130" height="52" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/>
  </g>
  <text x="125" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">擂主：1 队</text>
  <text x="125" y="292" text-anchor="middle" font-size="11" fill="#666">champ = 1</text>

  <g filter="url(#sk)">
    <rect x="250" y="250" width="130" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="315" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">挑战者：2 队</text>
  <text x="315" y="292" text-anchor="middle" font-size="11" fill="#888">j = 2</text>

  <g filter="url(#sk)">
    <path d="M 230 276 L 245 276" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- query bubble 2 -->
  <g filter="url(#sk)">
    <rect x="420" y="250" width="230" height="58" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="440" y="273" font-size="13" fill="#444" font-family="monospace">查询 grid[1][2] = 1</text>
  <text x="440" y="295" font-size="12.5" fill="#2e6e2e" font-weight="bold">⇒ 1 队强于 2 队 ⇒ 守擂，champ 不变</text>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="420" y="80" width="230" height="130" rx="12" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="535" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">循环结束，返回 1 ✓</text>
  <text x="440" y="138" font-size="12" fill="#444">n − 1 = 2 次查询出冠军</text>
  <text x="440" y="160" font-size="12" fill="#444">与示例 2 答案一致</text>
  <text x="440" y="186" font-size="11.5" fill="#888">全序 ⇒ 擂主即全场最强，</text>
  <text x="440" y="202" font-size="11.5" fill="#888">无需二次验证</text>

  <!-- bottom link between steps -->
  <g filter="url(#sk)">
    <path d="M 125 218 Q 125 235 125 246" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- footer -->
  <g filter="url(#sk)">
    <rect x="60" y="330" width="560" height="48" rx="8" fill="#f4f0fa" stroke="#8a6ab0" stroke-width="1.2"/>
  </g>
  <text x="80" y="350" font-size="12" font-weight="bold" fill="#5a3a80">复核（可选）：</text>
  <text x="80" y="368" font-size="11.5" fill="#444">冠军列全 0 —— grid[0][1]=grid[2][1]=0，1 队无人能敌；冠军行全 1 —— grid[1][0]=grid[1][2]=1，1 队直接击败所有人。</text>
</svg>
