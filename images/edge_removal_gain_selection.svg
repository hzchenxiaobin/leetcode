<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">节点 u 的决策流程：增益排序 + 名额截断</text>
  <path d="M 270 42 Q 470 50 670 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="330" y="62" width="280" height="40" rx="16" fill="#f0ede4" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="470" y="87" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">开始处理节点 u（自底向上，孩子已算好）</text>
  <path d="M 470 102 L 470 124" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 1: collect gains -->
  <g filter="url(#sk)">
    <rect x="230" y="128" width="480" height="66" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="470" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">① 遍历每个孩子 v：累计保底，收集净增益</text>
  <text x="470" y="176" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">base += dp[v][1]；gains 收集 w + dp[v][0] − dp[v][1]</text>
  <path d="M 470 194 L 470 216" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2: sort -->
  <g filter="url(#sk)">
    <rect x="310" y="220" width="320" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="470" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">② gains 从大到小排序</text>
  <path d="M 470 266 L 470 288" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="470,292 610,338 470,384 330,338" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="470" y="332" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">还有未看的 gain，</text>
  <text x="470" y="350" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">且 gain &gt; 0，且已选 &lt; limit ?</text>

  <!-- yes: accumulate, loop back -->
  <path d="M 610 338 L 680 338" stroke="#4a8e4a" stroke-width="1.8" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="640" y="328" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="686" y="314" width="200" height="48" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="786" y="334" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">累加该 gain，已选数 +1</text>
  <text x="786" y="352" text-anchor="middle" font-size="10" fill="#888">名额还没用完就继续挑大的</text>
  <path d="M 786 314 Q 786 250 636 250" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)" stroke-dasharray="4 3"/>

  <!-- no: stop -->
  <path d="M 470 384 L 470 412" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="486" y="404" font-size="11" fill="#b03a3a" font-weight="bold">否（gain ≤ 0 或名额用尽）</text>
  <g filter="url(#sk)">
    <rect x="290" y="416" width="360" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="470" y="445" text-anchor="middle" font-size="12" fill="#b03a3a" font-family="monospace" font-weight="bold">dp[u][limit] = base + 已累加的 gain</text>

  <!-- two outputs -->
  <path d="M 420 464 L 320 496" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 520 464 L 620 496" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="180" y="500" width="280" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="524" text-anchor="middle" font-size="12" font-family="monospace" fill="#2e6e2e" font-weight="bold">dp[u][1]：limit = k</text>
  <text x="320" y="544" text-anchor="middle" font-size="10" fill="#888">父边不占名额（父边移除 / u 为根）</text>
  <g filter="url(#sk)">
    <rect x="480" y="500" width="280" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="620" y="524" text-anchor="middle" font-size="12" font-family="monospace" fill="#2b6e9e" font-weight="bold">dp[u][0]：limit = k − 1</text>
  <text x="620" y="544" text-anchor="middle" font-size="10" fill="#888">父边占 1 个名额（父边保留时用）</text>

  <!-- concrete example strip -->
  <g filter="url(#sk)">
    <rect x="60" y="580" width="840" height="60" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="604" font-size="12" font-weight="bold" fill="#2b2b2b">例子</text>
  <text x="80" y="626" font-size="11" fill="#444" font-family="monospace">gains 排序后 = [7, 4, −2, −5]，k = 2 → dp[u][1] = base + 7 + 4；dp[u][0] = base + 7（名额少 1，把 4 挤掉）</text>
</svg>
