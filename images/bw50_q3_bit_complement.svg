<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="149"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">位视角：k 逐位取反 P，把结果的每一位都补成 1</text>

  <!-- 位标 -->
  <g filter="url(#rough2)" font-size="12" fill="#666" text-anchor="middle">
    <text x="230" y="62">bit 3</text><text x="300" y="62">bit 2</text><text x="370" y="62">bit 1</text><text x="440" y="62">bit 0</text>
  </g>

  <!-- P 行 -->
  <text x="120" y="96" font-size="14" fill="#446688" font-weight="bold" text-anchor="end" filter="url(#rough2)">P（前缀异或）</text>
  <g filter="url(#rough2)">
    <rect x="200" y="72" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="270" y="72" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <rect x="340" y="72" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="410" y="72" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="230" y="96">1</text><text x="300" y="96">0</text><text x="370" y="96">1</text><text x="440" y="96">0</text>
  </g>

  <!-- XOR 提示 -->
  <g filter="url(#rough2)">
    <text x="280" y="140" font-size="13" fill="#666" text-anchor="middle">⊕ （k 的每一位都设成与 P 相反）</text>
  </g>

  <!-- k 行 -->
  <text x="120" y="186" font-size="14" fill="#2d5a22" font-weight="bold" text-anchor="end" filter="url(#rough2)">k（取反，合法 &lt; 2^mb）</text>
  <g filter="url(#rough2)">
    <rect x="200" y="162" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <rect x="270" y="162" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="340" y="162" width="60" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <rect x="410" y="162" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="230" y="186">0</text><text x="300" y="186">1</text><text x="370" y="186">0</text><text x="440" y="186">1</text>
  </g>

  <!-- = 提示 -->
  <text x="280" y="232" font-size="13" fill="#666" text-anchor="middle" filter="url(#rough2)">=</text>

  <!-- 结果行：全 1 -->
  <text x="120" y="278" font-size="14" fill="#2d5a22" font-weight="bold" text-anchor="end" filter="url(#rough2)">P ⊕ k（全 1）</text>
  <g filter="url(#rough2)">
    <rect x="200" y="254" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="270" y="254" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="340" y="254" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="410" y="254" width="60" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#2d5a22" text-anchor="middle" font-weight="bold">
    <text x="230" y="278">1</text><text x="300" y="278">1</text><text x="370" y="278">1</text><text x="440" y="278">1</text>
  </g>

  <!-- 说明 -->
  <rect x="60" y="312" width="460" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="332" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">结果恒为 2^maximumBit − 1：理论上界，一步撞满</text>
  <rect x="60" y="348" width="460" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="366" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">P &lt; 2^mb 保证了 k = P ⊕ mask 也 &lt; 2^mb，合法性自动成立</text>
</svg>
