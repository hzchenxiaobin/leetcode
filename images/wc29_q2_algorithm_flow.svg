<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 隔一个累加</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">没有循环决策，三步直通，O(n log n) 全部开销都在排序</text>

  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <rect x="110" y="62" width="340" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="280" y="88" fill="#3a4a66">① 读入 nums，长度 2n，n ≥ 1</text>

    <rect x="110" y="120" width="340" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="280" y="146" fill="#3a4a66">② 升序排序：a₀ ≤ a₁ ≤ … ≤ a₂ₙ₋₁</text>

    <rect x="110" y="178" width="340" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="8"/>
    <text x="280" y="204" fill="#8a6a20">③ 相邻成对：(a₀,a₁) (a₂,a₃) …</text>

    <rect x="110" y="236" width="340" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="8"/>
    <text x="280" y="262" fill="#8a6a20">④ 每对取较小者 = 偶数下标 a₂ᵢ</text>

    <rect x="110" y="294" width="340" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="280" y="320" fill="#3a5a30">⑤ 返回 a₀ + a₂ + … + a₂ₙ₋₂</text>
  </g>

  <g filter="url(#rough2)" stroke="#666" stroke-width="1.6" fill="none">
    <path d="M 280 104 L 280 118" marker-end="url(#arr)"/>
    <path d="M 280 162 L 280 176" marker-end="url(#arr)"/>
    <path d="M 280 220 L 280 234" marker-end="url(#arr)"/>
    <path d="M 280 278 L 280 292" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="350" width="420" height="34" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="10"/>
    <text x="86" y="371" font-size="9.5" fill="#666">进阶：值域仅 [−10⁴, 10⁴]，可用计数排序把 O(n log n) 降为 O(n + V)</text>
  </g>
</svg>
