<svg xmlns="http://www.w3.org/2000/svg" width="940" height="670" viewBox="0 0 940 670" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="940" height="670" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough)">算法流程：从 bit 14 到 bit 0 逐位贪心，扫描分段求最长前缀</text>
  <path d="M 200 42 Q 470 50 740 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- start -->
  <ellipse cx="470" cy="68" rx="46" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough)"/>
  <text x="470" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#34507a" filter="url(#rough)">开始</text>
  <path d="M 470 86 L 470 98" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough)"/>

  <!-- A: init -->
  <g filter="url(#rough)">
    <rect x="370" y="100" width="200" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="470" y="121" text-anchor="middle" font-size="12.5" fill="#34507a" font-weight="bold">初始化：segs = [ nums ]</text>
  </g>
  <path d="M 470 132 L 470 156" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough)"/>

  <!-- B: bit loop -->
  <g filter="url(#rough)">
    <rect x="330" y="158" width="280" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="470" y="180" text-anchor="middle" font-size="12.5" fill="#b07a20" font-weight="bold">位循环：b = 14, 13, …, 0（i = 14 − b）</text>
  </g>
  <path d="M 470 192 L 470 216" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough)"/>

  <!-- C: scan init -->
  <g filter="url(#rough)">
    <rect x="350" y="218" width="240" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="470" y="240" text-anchor="middle" font-size="12.5" fill="#34507a" font-weight="bold">acc = 0；j = 1（从最左段开始）</text>
  </g>
  <path d="M 470 252 L 470 296" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough)"/>

  <!-- D: full segment? -->
  <g filter="url(#rough)">
    <path d="M 340 345 L 470 298 L 600 345 L 470 392 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="470" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">G_j 的元素</text>
    <text x="470" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">都含第 b 位？</text>
  </g>

  <!-- yes: accumulate -->
  <path d="M 600 345 L 656 345" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough)"/>
  <text x="616" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough)">是</text>
  <g filter="url(#rough)">
    <rect x="658" y="322" width="254" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="785" y="346" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">acc += |G_j|；j + 1</text>
    <text x="785" y="368" text-anchor="middle" font-size="10.5" fill="#4a7a3a">看下一段，回到左侧判断</text>
  </g>
  <!-- loop back to diamond -->
  <path d="M 785 322 C 780 266, 640 256, 542 314" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrK)" filter="url(#rough)"/>
  <text x="672" y="266" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough)">还有段</text>

  <!-- exhausted -->
  <path d="M 785 382 L 785 402" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough)"/>
  <text x="798" y="399" font-size="10.5" fill="#888" filter="url(#rough)">段耗尽</text>
  <g filter="url(#rough)">
    <rect x="658" y="404" width="254" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="785" y="426" text-anchor="middle" font-size="12" fill="#b07a20">全是满段（所有元素都含 b）</text>
    <text x="785" y="446" text-anchor="middle" font-size="13" fill="#b07a20" font-weight="bold">power[i] = n，进入下一位</text>
  </g>

  <!-- no: stop inside -->
  <path d="M 470 392 L 470 418" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough)"/>
  <text x="488" y="410" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough)">否</text>
  <g filter="url(#rough)">
    <rect x="340" y="420" width="260" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="470" y="442" text-anchor="middle" font-size="12.5" fill="#34507a" font-weight="bold">power[i] = acc + |G_j ∩ S_b|</text>
  </g>
  <path d="M 470 454 L 470 482" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough)"/>
  <g filter="url(#rough)">
    <rect x="320" y="484" width="300" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="470" y="506" text-anchor="middle" font-size="12" fill="#34507a" font-weight="bold">G_j 分裂为 [ 含 b ｜ 不含 b ]（空前导段丢弃）</text>
  </g>
  <path d="M 470 518 L 470 533" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough)"/>

  <!-- merge from power=n box -->
  <path d="M 785 456 C 785 540, 690 565, 566 565" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arrK)" filter="url(#rough)"/>

  <!-- H: done? -->
  <g filter="url(#rough)">
    <path d="M 380 565 L 470 535 L 560 565 L 470 595 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="470" y="570" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">15 位都处理完？</text>
  </g>

  <!-- no: loop back to B -->
  <path d="M 380 565 C 195 570, 140 505, 140 360 C 140 235, 210 179, 326 179" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arrK)" filter="url(#rough)"/>
  <text x="366" y="552" text-anchor="end" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough)">否</text>
  <text x="98" y="432" font-size="11" fill="#888" filter="url(#rough)">下一位 b−1</text>

  <!-- yes: return -->
  <path d="M 470 595 L 470 612" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough)"/>
  <text x="488" y="610" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough)">是</text>
  <ellipse cx="470" cy="634" rx="62" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough)"/>
  <text x="470" y="640" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough)">返回 power</text>
</svg>
