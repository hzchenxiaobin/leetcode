<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#446688"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>

  <rect width="620" height="560" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：倍增定上界 + 二分答案</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">acc(mid)：枚举计费位 i = x, 2x, …（2^(i−1) ≤ mid），逐位套周期计数公式求和</text>

  <!-- A -->
  <g filter="url(#rough2)"><rect x="165" y="62" width="290" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="310" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">① 价格非负 ⇒ acc 单调不减 ⇒ 二段性</text>
  <text x="310" y="89" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">「acc ≤ k」前缀真、后缀假，分界点即最大廉价数字</text>

  <path d="M 310 94 L 310 108" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- B -->
  <g filter="url(#rough2)"><rect x="165" y="110" width="290" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="310" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">② 倍增定上界：hi = 1；acc(hi) ≤ k 就 hi ← 2·hi</text>
  <text x="310" y="137" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">出口保证 acc(hi) &gt; k，无需估算量级</text>

  <path d="M 310 142 L 310 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- C -->
  <g filter="url(#rough2)"><rect x="165" y="158" width="290" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="310" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">③ 二分：l = 0（acc(0)=0 廉价）、r = hi（超支）</text>
  <text x="310" y="185" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">不变式：acc(l) ≤ k &lt; acc(r)</text>

  <path d="M 310 190 L 310 222" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="322" y="210" font-size="10" fill="#666" filter="url(#rough2)">mid = (l + r) / 2</text>

  <!-- D -->
  <g filter="url(#rough2)"><polygon points="140,262 310,230 480,262 310,294" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="310" y="261" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">④ acc(mid) ≤ k ？</text>

  <path d="M 140 262 L 118 262" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="129" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)"><rect x="30" y="248" width="86" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="73" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">l = mid</text>

  <path d="M 480 262 L 502 262" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="491" y="254" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)"><rect x="505" y="248" width="106" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="558" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">r = mid</text>

  <!-- loop arrows to E -->
  <path d="M 73 276 C 73 310 180 306 298 311" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <path d="M 558 276 C 558 310 440 306 322 311" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>

  <!-- E -->
  <g filter="url(#rough2)"><polygon points="185,342 310,312 435,342 310,372" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="310" y="347" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">⑤ l + 1 &lt; r ？</text>

  <path d="M 435 342 C 540 342 560 285 416 249" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="556" y="320" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">是：继续二分</text>
  <text x="452" y="332" font-size="10" fill="#8a6a20" filter="url(#rough2)">是</text>

  <path d="M 310 372 L 310 386" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="322" y="382" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- F -->
  <g filter="url(#rough2)"><rect x="165" y="388" width="290" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="310" y="407" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">⑥ 返回 l：最大廉价数字，且 acc(l+1) &gt; k</text>

  <!-- ===== monotonicity panel ===== -->
  <g filter="url(#rough2)"><rect x="40" y="436" width="540" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="60" y="456" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">为什么能二分：累加价格单调不减（非严格）</text>
  <text x="60" y="474" font-size="10" fill="#444" filter="url(#rough2)">价格是计数、非负 ⇒ acc(num+1) ≥ acc(num)：num 由小到大，「acc ≤ k」由真变假恰好一次</text>

  <path d="M 100 494 L 312 494" stroke="#4a7a3a" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <path d="M 312 494 L 530 494" stroke="#b85450" stroke-width="3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="130" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="170" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="210" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="250" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="288" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="340" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="380" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="420" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="460" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="500" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <path d="M 310 482 L 310 510" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="310" y="517" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">答案 = 最后一个 ✓（分界点）</text>
  <text x="100" y="517" text-anchor="middle" font-size="9.5" fill="#2c5f2c" filter="url(#rough2)">1（廉价）</text>
  <text x="530" y="517" text-anchor="end" font-size="9.5" fill="#b85450" filter="url(#rough2)">num 增大 →（超支）</text>
</svg>
