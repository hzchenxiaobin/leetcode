<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="260" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">边界示例：grid = [[-1000000000],[1000000000],[0]]</text>

  <g filter="url(#rough2)">
    <rect x="80" y="58" width="190" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="175" y="85" text-anchor="middle" font-size="14" fill="#333">-1000000000</text>
    <text x="330" y="78" text-anchor="middle" font-size="13" fill="#b85450">长度 11（10 位 + 负号）</text>

    <rect x="80" y="108" width="190" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="175" y="135" text-anchor="middle" font-size="14" fill="#333">1000000000</text>
    <text x="330" y="128" text-anchor="middle" font-size="13" fill="#4a7a3a">长度 10（恰好 10 位）</text>

    <rect x="80" y="158" width="190" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="175" y="185" text-anchor="middle" font-size="14" fill="#333">0</text>
    <text x="330" y="178" text-anchor="middle" font-size="13" fill="#d6a040">长度 1（0 占 1 位）</text>
  </g>

  <rect x="130" y="212" width="300" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="235" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">ans = [max(11, 10, 1)] = [11]</text>
</svg>
