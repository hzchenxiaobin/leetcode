<svg xmlns="http://www.w3.org/2000/svg" width="940" height="556" viewBox="0 0 940 556" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c96a2b"/>
    </marker>
  </defs>
  <rect width="940" height="556" fill="#fdfcf7"/>
  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：第 i 位（i &lt; n）只有两种情况——同位双取 1，异位补给小者</text>
  <path d="M 240 40 Q 470 48 700 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="64" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">记 A = a ⊕ x，B = b ⊕ x。x &lt; 2^n 只触碰低 n 位 ⇒ 每一位的取值可独立定夺（从高位到低位）</text>

  <!-- ===== Panel 1: same bits ===== -->
  <g filter="url(#sk)"><rect x="40" y="84" width="432" height="336" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="60" y="108" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">情况① 同位 a_i = b_i：A_i 与 B_i 永远同值</text>

  <text x="62" y="134" font-size="11" fill="#446688" font-weight="bold" filter="url(#sk)">a 的第 i 位</text>
  <g filter="url(#sk)"><rect x="78" y="140" width="34" height="34" fill="#e8f0fa" stroke="#446688" stroke-width="1.6" rx="4"/></g>
  <text x="95" y="162" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">0</text>
  <text x="62" y="182" font-size="11" fill="#446688" font-weight="bold" filter="url(#sk)">b 的第 i 位</text>
  <g filter="url(#sk)"><rect x="78" y="188" width="34" height="34" fill="#e8f0fa" stroke="#446688" stroke-width="1.6" rx="4"/></g>
  <text x="95" y="210" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">0</text>

  <path d="M 122 181 L 180 181" stroke="#d6a040" stroke-width="2" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="151" y="170" text-anchor="middle" font-size="10.5" fill="#a3541c" filter="url(#sk)">x_i 翻成 1</text>

  <text x="192" y="134" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">A_i</text>
  <g filter="url(#sk)"><rect x="210" y="140" width="34" height="34" fill="#d8efd8" stroke="#4a8e4a" stroke-width="2.2" rx="4"/></g>
  <text x="227" y="162" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">1</text>
  <text x="192" y="182" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">B_i</text>
  <g filter="url(#sk)"><rect x="210" y="188" width="34" height="34" fill="#d8efd8" stroke="#4a8e4a" stroke-width="2.2" rx="4"/></g>
  <text x="227" y="210" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">1</text>

  <text x="270" y="138" font-size="11" fill="#333" filter="url(#sk)">把双双 0 翻成双双 1</text>
  <text x="270" y="156" font-size="11" fill="#333" filter="url(#sk)">A、B 各 +2^i，乘积增量：</text>
  <g filter="url(#sk)"><rect x="270" y="166" width="176" height="28" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.6" rx="6"/></g>
  <text x="358" y="185" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#sk)">2^i(A+B) + 2^(2i) &gt; 0</text>
  <text x="270" y="214" font-size="11" fill="#b03a3a" font-weight="bold" filter="url(#sk)">严格变大，与其他位无关 → 无脑取满</text>
  <text x="270" y="234" font-size="11" fill="#4a7a3a" filter="url(#sk)">副产物：两人同时 +2^i，</text>
  <text x="270" y="250" font-size="11" fill="#4a7a3a" filter="url(#sk)">差 D = A−B 纹丝不动</text>

  <g filter="url(#sk)"><rect x="58" y="272" width="396" height="128" rx="6" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="256" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">为什么敢无脑取满？（交换论证）</text>
  <text x="74" y="316" font-size="10.5" fill="#444" filter="url(#sk)">无论其余位怎么选，把同位的 0/0 改成 1/1</text>
  <text x="74" y="332" font-size="10.5" fill="#444" filter="url(#sk)">总是严格赚（A、B 非负 ⇒ 增量恒正）</text>
  <text x="74" y="354" font-size="10.5" fill="#888" filter="url(#sk)">a_i = b_i = 1 时取 x_i = 0 即已双 1，同理</text>
  <text x="74" y="380" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">⇒ 最优解里所有同位必是双双 1（引理 1）</text>

  <!-- ===== Panel 2: differ bits ===== -->
  <g filter="url(#sk)"><rect x="488" y="84" width="412" height="336" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="508" y="108" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">情况② 异位 a_i ≠ b_i：恰好一个 1，x_i 决定 1 归谁</text>

  <g filter="url(#sk)"><rect x="512" y="122" width="34" height="34" fill="#e8f0fa" stroke="#446688" stroke-width="1.6" rx="4"/></g>
  <text x="529" y="144" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="512" y="164" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/></g>
  <text x="529" y="186" text-anchor="middle" font-size="14" fill="#8f3a36" filter="url(#sk)">0</text>
  <text x="529" y="216" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">a_i / b_i</text>

  <path d="M 552 134 L 610 134" stroke="#446688" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 552 178 L 610 178" stroke="#446688" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="581" y="126" text-anchor="middle" font-size="10" fill="#446688" filter="url(#sk)">给 A</text>
  <text x="581" y="202" text-anchor="middle" font-size="10" fill="#446688" filter="url(#sk)">给 B</text>

  <g filter="url(#sk)"><rect x="618" y="118" width="128" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6"/></g>
  <text x="682" y="138" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#sk)">(A+2^i) · B</text>
  <g filter="url(#sk)"><rect x="618" y="162" width="128" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6"/></g>
  <text x="682" y="182" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#sk)">A · (B+2^i)</text>

  <path d="M 752 133 L 790 148" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 752 177 L 790 164" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arO)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="798" y="132" width="88" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/></g>
  <text x="842" y="152" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#sk)">两式相减</text>
  <text x="842" y="170" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#sk)">= 2^i(B−A)</text>

  <text x="508" y="238" font-size="11" fill="#b03a3a" font-weight="bold" filter="url(#sk)">A &lt; B 时给 A 严格更优；A = B 时两可 → 补给较小者</text>

  <g filter="url(#sk)"><rect x="506" y="252" width="376" height="86" rx="6" fill="#ffffff" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="520" y="274" font-size="10.5" fill="#444" filter="url(#sk)">异位上 A + B 恒定（恰有一人得 2^i）⇒ S = A+B 是定值</text>
  <text x="520" y="298" font-size="12.5" fill="#7a5415" font-weight="bold" filter="url(#sk)">AB = (S² − D²) / 4</text>
  <text x="520" y="322" font-size="10.5" fill="#444" filter="url(#sk)">S 定 ⇒ 最大化乘积 ⇔ 最小化 |A−B|：把每一份 2^i 用于拉平</text>

  <text x="508" y="360" font-size="10.5" fill="#888" filter="url(#sk)">这一份 2^i 只有一份：给了 A 就给不了 B——</text>
  <text x="508" y="376" font-size="10.5" fill="#888" filter="url(#sk)">贪心的实质是让两数越来越接近（和不变，差越小积越大）</text>

  <!-- ===== bottom strip ===== -->
  <g filter="url(#sk)"><rect x="40" y="440" width="860" height="96" rx="8" fill="#f3eefa" stroke="#8a6eb8" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="470" y="464" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a3a7a" filter="url(#sk)">贪心顺序：必须从高位 i = n−1 走到低位 i = 0</text>
  <text x="470" y="486" text-anchor="middle" font-size="11" fill="#5a3a7a" filter="url(#sk)">当前位一枚 2^i 压过剩余全部低位之和（≤ 2^i − 1，超递增）</text>
  <text x="470" y="506" text-anchor="middle" font-size="11" fill="#5a3a7a" filter="url(#sk)">高位先定、每步向「平衡」走，低位之后无法翻案；先定低位则会被高位重新拉开差距</text>
  <text x="470" y="526" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">紧凑规则：同位 ⇒ 双双置 1；异位 ⇒ 2^i 补给当前较小者（一趟 O(n)）</text>
</svg>
