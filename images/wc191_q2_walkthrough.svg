<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：h = 5, w = 4, [3,1], [1]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">把切口坐标投影到数轴上，相邻两点的距离就是一条带的长度</text>

  <rect x="36" y="54" width="488" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="50" y="72" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">水平方向：h = 5，horizontalCuts = [3, 1]（先排序得 [1, 3]）</text>
  <line x1="90" y1="112" x2="470" y2="112" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <g stroke="#446688" stroke-width="1.6" filter="url(#rough2)">
    <line x1="90" y1="105" x2="90" y2="119"/>
    <line x1="166" y1="105" x2="166" y2="119"/>
    <line x1="318" y1="105" x2="318" y2="119"/>
    <line x1="470" y1="105" x2="470" y2="119"/>
  </g>
  <line x1="166" y1="112" x2="318" y2="112" stroke="#4a7a3a" stroke-width="4" opacity="0.55" filter="url(#rough2)"/>
  <line x1="318" y1="112" x2="470" y2="112" stroke="#4a7a3a" stroke-width="4" opacity="0.55" filter="url(#rough2)"/>
  <g font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">
    <text x="90" y="134">0</text>
    <text x="166" y="134">1</text>
    <text x="318" y="134">3</text>
    <text x="470" y="134">5</text>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="128" y="100" fill="#666">1</text>
    <text x="242" y="100" fill="#3a5a30">2</text>
    <text x="394" y="100" fill="#3a5a30">2</text>
  </g>
  <text x="510" y="72" text-anchor="end" font-size="11" fill="#3a5a30" filter="url(#rough2)">水平最大间隔 = 2</text>

  <rect x="36" y="166" width="488" height="102" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="50" y="184" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">竖直方向：w = 4，verticalCuts = [1]（边界补 0 与 4）</text>
  <line x1="90" y1="224" x2="470" y2="224" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <g stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)">
    <line x1="90" y1="217" x2="90" y2="231"/>
    <line x1="185" y1="217" x2="185" y2="231"/>
    <line x1="470" y1="217" x2="470" y2="231"/>
  </g>
  <line x1="185" y1="224" x2="470" y2="224" stroke="#b85450" stroke-width="4" opacity="0.5" filter="url(#rough2)"/>
  <g font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">
    <text x="90" y="246">0</text>
    <text x="185" y="246">1</text>
    <text x="470" y="246">4</text>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="137" y="212" fill="#666">1</text>
    <text x="327" y="212" fill="#8a4a40">3</text>
  </g>
  <text x="510" y="184" text-anchor="end" font-size="11" fill="#8a4a40" filter="url(#rough2)">竖直最大间隔 = 3</text>

  <rect x="100" y="282" width="360" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">答案 = 2 × 3 = 6</text>
  <text x="280" y="324" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">6 mod (10⁹ + 7) = 6，与官方输出一致</text>

  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">horizontalCuts = [3, 1] 是乱序的：不排序直接算相邻差会得到错误的 1 和 2</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">最大间隔可能不止一条（这里水平方向有两条长度 2 的带），取任一条结果都相同</text>
</svg>
