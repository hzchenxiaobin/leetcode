<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="400" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="17.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两条链的位向量逐层演化（所有 sz = 1，掩码 c ≡ 0）</text>

  <!-- 左：L=4 -->
  <rect x="30" y="50" width="348" height="256" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="204" y="74" text-anchor="middle" font-size="12.6" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">L = 4（链 1-2-3-4，样例 ②）</text>

  <text x="48" y="102" font-size="11" fill="#2f4a66" filter="url(#rough2)">g=2（2 个位置）</text>
  <text x="48" y="124" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">边界　F1 = 0 0　　F2 = 1 1</text>
  <path d="M 204 132 L 204 144" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="164" font-size="11" fill="#2f4a66" filter="url(#rough2)">g=3（1 个位置）</text>
  <text x="48" y="186" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">a = ¬((00≫1)∧00) = 1　b = ¬((11≫1)∧11) = 0</text>
  <text x="48" y="208" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">F1 = a ∨ (c∧¬b) = 1　F2 = b ∨ (¬c∧¬a) = 0</text>
  <rect x="52" y="222" width="304" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="204" y="246" text-anchor="middle" font-size="12.2" fill="#33582a" filter="url(#rough2)">答案 = F1 的最低位 = 1</text>
  <text x="204" y="268" text-anchor="middle" font-size="10.8" fill="#33582a" filter="url(#rough2)">与「先手点 2 得 1 分、后手点 3 得 0 分」一致</text>

  <!-- 右：L=5 -->
  <rect x="402" y="50" width="348" height="256" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="576" y="74" text-anchor="middle" font-size="12.6" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">L = 5（链 1-2-3-4-5）</text>

  <text x="420" y="102" font-size="11" fill="#8c3a37" filter="url(#rough2)">g=2（3 个位置）</text>
  <text x="420" y="124" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">边界　F1 = 0 0 0　　F2 = 1 1 1</text>
  <path d="M 576 132 L 576 144" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="164" font-size="11" fill="#8c3a37" filter="url(#rough2)">g=3（2 个位置）</text>
  <text x="420" y="186" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">a = ¬((000≫1)∧000) = 1 1　b = ¬(011∧111) = 0 0</text>
  <text x="420" y="208" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">F1 = 1 1　　F2 = 0 0</text>
  <path d="M 576 216 L 576 226" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="244" font-size="11" fill="#8c3a37" filter="url(#rough2)">g=4（1 个位置）</text>
  <text x="420" y="264" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">a = ¬(01∧11) = 0　b = ¬(00∧00) = 1</text>
  <rect x="424" y="272" width="304" height="26" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="576" y="290" text-anchor="middle" font-size="11.4" fill="#8a6015" filter="url(#rough2)">答案 = F1 的最低位 = 0</text>

  <text x="390" y="332" text-anchor="middle" font-size="11.4" fill="#66788c" filter="url(#rough2)">每层宽度 L−g 都在缩小：算第 g 层只需处理前 ⌈(L−g)/64⌉ 个字，末字用 (1&lt;&lt;rem)−1 清掉高位</text>
  <text x="390" y="352" text-anchor="middle" font-size="11.4" fill="#66788c" filter="url(#rough2)">纯链上出现的规律「L 偶 → 1，L 奇 → 0」只是特例，一般树要靠整条 DP</text>
  <text x="390" y="374" text-anchor="middle" font-size="11.4" fill="#66788c" filter="url(#rough2)">两条向量恒满足 F1 ∨ F2 = 全 1（同一局面 f、g 至少一个为 1），位并行才安全</text>
</svg>
