<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">距离 = (x₁⊕x₂) + (y₁⊕y₂) = k：枚举 dx</text>

  <!-- 左：推导流程 -->
  <rect x="30" y="52" width="220" height="250" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">每个点只有 k+1 个候选</text>
  <text x="46" y="116" font-size="13" fill="#333" filter="url(#rough2)">记 dx = x₁ ⊕ x₂ ≥ 0</text>
  <text x="46" y="140" font-size="13" fill="#333" filter="url(#rough2)">则 dy = y₁ ⊕ y₂ = k − dx</text>
  <text x="46" y="168" font-size="13" fill="#333" filter="url(#rough2)">dy ≥ 0 ⇒ dx 只能取 0..k</text>
  <text x="46" y="196" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">x₂ = x₁ ⊕ dx（异或自反）</text>
  <text x="46" y="220" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">y₂ = y₁ ⊕ (k − dx)</text>
  <path d="M 46 236 C 46 262, 234 262, 234 236" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="140" y="282" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">查哈希表即可，无需遍历全平面</text>

  <!-- 右：P=(1,2), k=5 的枚举表 -->
  <text x="392" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">对 P=(1,2)，k=5：</text>
  <text x="348" y="86" font-size="12" fill="#666" filter="url(#rough2)">dx</text>
  <text x="392" y="86" font-size="12" fill="#666" filter="url(#rough2)">目标 (x₁⊕dx, y₁⊕(5−dx))</text>
  <rect x="326" y="96" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="343" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="392" y="114" font-size="12" fill="#666" filter="url(#rough2)">(1, 7) — 无</text>
  <rect x="326" y="126" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="343" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="392" y="144" font-size="12" fill="#666" filter="url(#rough2)">(0, 6) — 无</text>
  <rect x="326" y="156" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="343" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="392" y="174" font-size="12" fill="#666" filter="url(#rough2)">(3, 1) — 无</text>
  <rect x="326" y="186" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="343" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="392" y="204" font-size="12" fill="#666" filter="url(#rough2)">(2, 0) — 无</text>
  <rect x="326" y="216" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="343" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="392" y="234" font-size="12" fill="#666" filter="url(#rough2)">(5, 3) — 无</text>
  <rect x="326" y="246" width="34" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="343" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <rect x="368" y="246" width="130" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="433" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">(4, 2) — 命中！</text>

  <text x="392" y="296" font-size="12" fill="#666" filter="url(#rough2)">k = 5 = 101₂ 时 1⊕4 = 5、2⊕2 = 0</text>

  <rect x="36" y="316" width="448" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">k ≤ 100 ⇒ 每点至多 101 次哈希查询，总 O(n·k)</text>
</svg>
