<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="600" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：建矩阵取 min → Floyd 逐点中转 → 逐位累加</text>
  <path d="M 210 44 Q 470 52 730 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Row 1 ===== -->
  <g filter="url(#sk)"><rect x="40" y="66" width="250" height="64" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="165" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">初始化 26×26 矩阵</text>
  <text x="165" y="112" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">g[x][x] = 0，其余 = ∞</text>

  <path d="M 294 98 L 316 98" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="322" y="66" width="270" height="64" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="457" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">逐条规则加有向边</text>
  <text x="457" y="112" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">g[x][y] = min(g[x][y], cost[j])</text>

  <path d="M 596 98 L 618 98" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="624" y="66" width="276" height="64" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="762" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">重边自动取最小</text>
  <text x="762" y="112" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">同一 (x,y) 多条规则只留最便宜</text>

  <path d="M 457 130 L 457 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Row 2: Floyd ===== -->
  <g filter="url(#sk)"><rect x="140" y="156" width="660" height="100" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="470" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">Floyd-Warshall：枚举中转字母 k 松弛所有点对</text>
  <text x="200" y="206" font-size="12" fill="#2e6e2e" filter="url(#sk)">for k = 0 … 25：</text>
  <text x="230" y="228" font-size="12" fill="#2e6e2e" filter="url(#sk)">g[i][j] = min( g[i][j], g[i][k] + g[k][j] )</text>
  <text x="470" y="248" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">26³ ≈ 1.8×10⁴ 次运算 —— 比最后扫一遍字符串（10⁵）还轻</text>

  <path d="M 470 256 L 470 278" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Row 3: sum ===== -->
  <g filter="url(#sk)"><rect x="140" y="282" width="660" height="64" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="470" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">逐位查表累加（i = 0 … n−1）</text>
  <text x="470" y="328" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">ans += g[source[i]][target[i]]</text>

  <path d="M 470 346 L 470 368" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== Row 4: decision ===== -->
  <g filter="url(#sk)"><polygon points="470,376 574,418 470,460 366,418" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="470" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">存在某位置</text>
  <text x="470" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">g == ∞ ？</text>

  <path d="M 574 418 L 640 418" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="600" y="408" text-anchor="middle" font-size="11" fill="#b03a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><rect x="648" y="396" width="140" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="718" y="423" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#sk)">返回 −1</text>

  <path d="M 366 418 L 300 418" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="340" y="408" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="88" y="396" width="208" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="192" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 ans</text>
  <text x="192" y="432" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">（long long 累加）</text>

  <!-- ===== bottom notes ===== -->
  <g filter="url(#sk)"><rect x="56" y="486" width="828" height="96" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="76" y="510" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">实现要点</text>
  <text x="76" y="532" font-size="11" fill="#444" filter="url(#sk)">· 位置彼此独立 → 逐位查表求和即可，与处理顺序无关</text>
  <text x="76" y="554" font-size="11" fill="#444" filter="url(#sk)">· 总成本最高 ≈ 10⁵ × 2.5×10⁷ ≈ 2.5×10¹²，C++ 累加器必须 long long</text>
  <text x="76" y="576" font-size="11" fill="#444" filter="url(#sk)">· ∞ 取 10¹⁸：∞+∞ = 2×10¹⁸ 仍在 long long 范围内，松弛比较不会溢出误更新</text>
</svg>
