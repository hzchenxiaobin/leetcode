<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="372" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">base = 首尾相接的无限字母表</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">"...zabcdefghijklmnopqrstuvwxyzabcdefg..."：每个字符的后继唯一，z 的后继是 a</text>

  <g filter="url(#rough2)">
    <rect x="34" y="76" width="572" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <line x1="34" y1="91" x2="606" y2="91" stroke="#446688" stroke-width="0.6" opacity="0.35"/>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle" fill="#3a4a66" font-weight="bold">
    <text x="45" y="97">a</text><text x="67" y="97">b</text><text x="89" y="97">c</text><text x="111" y="97">d</text>
    <text x="133" y="97">e</text><text x="155" y="97">f</text><text x="177" y="97">g</text><text x="199" y="97">h</text>
    <text x="221" y="97">i</text><text x="243" y="97">j</text><text x="265" y="97">k</text><text x="287" y="97">l</text>
    <text x="309" y="97">m</text><text x="331" y="97">n</text><text x="353" y="97">o</text><text x="375" y="97">p</text>
    <text x="397" y="97">q</text><text x="419" y="97">r</text><text x="441" y="97">s</text><text x="463" y="97">t</text>
    <text x="485" y="97">u</text><text x="507" y="97">v</text><text x="529" y="97">w</text><text x="551" y="97">x</text>
    <text x="573" y="97">y</text><text x="595" y="97">z</text>
  </g>

  <path d="M 595 110 C 595 148, 45 148, 45 110" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="146" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">绕回：z 后面又是 a，所以 26 个字母接了环</text>

  <rect x="30" y="168" width="282" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="46" y="190" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">合法相邻：只有 26 种</text>
  <text x="46" y="212" font-size="10.5" fill="#555" filter="url(#rough2)">相邻两字符 b 紧跟在 a 后 ⟺</text>
  <text x="46" y="232" font-size="10.5" fill="#555" filter="url(#rough2)">( b − a ) mod 26 = 1</text>
  <text x="46" y="250" font-size="10" fill="#888" filter="url(#rough2)">a→b … y→z, z→a；其余 25 种都不行</text>

  <rect x="328" y="168" width="282" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="344" y="190" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">子串合法：逐对检查</text>
  <text x="344" y="212" font-size="10.5" fill="#555" filter="url(#rough2)">连续子串出现在 base 中 ⟺ 内部每一对</text>
  <text x="344" y="232" font-size="10.5" fill="#555" filter="url(#rough2)">相邻字符都满足上面的等式</text>
  <text x="344" y="250" font-size="10" fill="#888" filter="url(#rough2)">一段坏邻接，就把后面所有延伸全部否决</text>

  <rect x="30" y="276" width="580" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="46" y="298" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">两个例子</text>
  <text x="46" y="318" font-size="10.5" fill="#555" filter="url(#rough2)">"zab"：z→a 差 −25 ≡ 1，a→b 差 1，整段合法，于是 z、a、b、za、ab、zab 六个都出现。</text>
  <text x="46" y="338" font-size="10.5" fill="#555" filter="url(#rough2)">"cac"：c→a 差 24，a→c 差 2，两处都断，所以只有单字符 c、a 合法，共 2 个。</text>
</svg>
