<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">一次遍历：同时维护「最大值」与「第二大」</text>
  <text x="280" y="45" text-anchor="middle" font-size="11" fill="#888">时间 O(n)，空间 O(1)；两条分支必须互斥</text>

  <rect x="90" y="62" width="380" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="104" y="82" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">初始化</text>
  <text x="104" y="99" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">maxVal = maxIdx = −1，second = −1（nums[i] ≥ 0，−1 即 −∞）</text>

  <path d="M 280 108 L 280 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="132" width="380" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="104" y="152" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">读入 x = nums[i]，与 maxVal 比较：</text>
  <text x="104" y="173" font-size="10" fill="#555" filter="url(#rough2)">① x &gt; maxVal：second ← maxVal（旧最大值退位）</text>
  <text x="130" y="191" font-size="10" fill="#555" filter="url(#rough2)">maxVal ← x，maxIdx ← i</text>
  <text x="104" y="213" font-size="10" fill="#555" filter="url(#rough2)">② x ≤ maxVal：仅当 x &gt; second 时 second ← x</text>
  <text x="104" y="233" font-size="9.8" fill="#8a6a20" filter="url(#rough2)">（② 在补「其余元素里的最大值」，别漏掉）</text>

  <path d="M 96 248 C 40 258 40 148 84 142" stroke="#8f8f8f" stroke-width="1.3" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="266" font-size="9.5" fill="#999" filter="url(#rough2)">对每个 i 重复</text>

  <path d="M 280 252 L 280 272" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="276" width="380" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="104" y="298" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">遍历结束，只判定一次</text>
  <text x="104" y="318" font-size="10.5" fill="#555" filter="url(#rough2)">maxVal ≥ 2 × second ？　是 → maxIdx　　否 → −1</text>

  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">例：[3,6,1,0] → maxVal = 6（i = 1），second = 3，6 ≥ 6 → 返回 1</text>
</svg>
