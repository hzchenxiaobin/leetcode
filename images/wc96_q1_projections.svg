<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="660" height="380" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">grid[i][j] 表示格子 (i,j) 上叠了多少个立方体，三个方向各看到什么</text>

  <!-- 2x2 网格 -->
  <text x="60" y="64" font-size="11" fill="#666" filter="url(#rough2)">俯视（xy 平面）</text>
  <rect x="60" y="74" width="70" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="130" y="74" width="70" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="60" y="144" width="70" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="130" y="144" width="70" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="116" text-anchor="middle" font-size="15" fill="#2c4a63" filter="url(#rough2)">1</text>
  <text x="165" y="116" text-anchor="middle" font-size="15" fill="#2c4a63" filter="url(#rough2)">2</text>
  <text x="95" y="186" text-anchor="middle" font-size="15" fill="#2c4a63" filter="url(#rough2)">3</text>
  <text x="165" y="186" text-anchor="middle" font-size="15" fill="#2c4a63" filter="url(#rough2)">4</text>

  <!-- 三个投影 -->
  <rect x="300" y="60" width="150" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="375" y="84" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">俯视 top</text>
  <text x="375" y="108" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">非空格子数</text>
  <text x="375" y="132" text-anchor="middle" font-size="14" fill="#33562a" filter="url(#rough2)">4</text>

  <rect x="470" y="60" width="166" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="553" y="84" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">正视 front（按行）</text>
  <text x="553" y="108" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">每行最大值求和</text>
  <text x="553" y="132" text-anchor="middle" font-size="14" fill="#8a6410" filter="url(#rough2)">2 + 4 = 6</text>

  <rect x="300" y="164" width="150" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="375" y="188" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">侧视 side（按列）</text>
  <text x="375" y="212" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">每列最大值求和</text>
  <text x="375" y="236" text-anchor="middle" font-size="14" fill="#8d3b37" filter="url(#rough2)">3 + 4 = 7</text>

  <rect x="470" y="164" width="166" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="553" y="188" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">总面积</text>
  <text x="553" y="216" text-anchor="middle" font-size="15" fill="#2c4a63" filter="url(#rough2)">4 + 6 + 7</text>
  <text x="553" y="240" text-anchor="middle" font-size="16" fill="#2c4a63" filter="url(#rough2)">= 17</text>

  <path d="M206 110 L296 100" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M206 150 L296 196" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <rect x="24" y="272" width="612" height="92" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="330" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">为什么三个公式长这样？</text>
  <text x="330" y="320" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">俯视：只要格子上有立方体（值 &gt; 0），就投出一个 1×1 的方块</text>
  <text x="330" y="342" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">正视：沿列方向看过去，一行里最高的那摞决定这一行的投影高度</text>
  <text x="330" y="360" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">侧视：沿行方向看过去，一列里最高的那摞决定这一列的投影高度</text>
</svg>
