<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：逐周推进 + 全源取最大</text>

  <rect x="70" y="48" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="86" y="68" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 初始化第 0 周（周一早晨还在城市 0）</text>
  <text x="86" y="88" font-size="10.5" fill="#555" filter="url(#rough2)">dp[0][c] = days[c][0]，仅当 c = 0 或 flights[0][c] = 1；其余记 −∞</text>

  <path d="M 300 104 L 300 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="132" width="460" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="86" y="152" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② 从第 w 周推到第 w+1 周</text>
  <text x="86" y="172" font-size="10.5" fill="#555" filter="url(#rough2)">枚举上一周城市 p 与本同城 c，若 c = p 或 flights[p][c] = 1 则</text>
  <text x="86" y="192" font-size="10.5" fill="#555" filter="url(#rough2)">dp[w+1][c] = max( dp[w+1][c], dp[w][p] + days[c][w+1] )</text>

  <path d="M 300 206 L 300 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="234" width="460" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="86" y="254" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">③ 不可达状态保持 −∞（实现里用 −1）</text>
  <text x="86" y="272" font-size="10.5" fill="#555" filter="url(#rough2)">days ≥ 0，所以 −1 一定小于任何真实值，不会污染最大值</text>

  <path d="M 300 284 L 300 306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="312" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="86" y="332" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">④ 收尾：answer = max over c of dp[K−1][c]</text>
  <text x="86" y="348" font-size="10" fill="#555" filter="url(#rough2)">最后一行的最大值就是答案，不需要记录路径</text>

  <text x="300" y="382" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间 O(K·N²)，空间 O(N)（滚动两行）；N、K ≤ 100 时约 10⁶ 次运算</text>
</svg>
