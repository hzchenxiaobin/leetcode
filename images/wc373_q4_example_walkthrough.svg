  <text x="316" y="248" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="404" y="248" text-anchor="middle" font-size="12" fill="#555">(1, 0)</text>

  <g filter="url(#sk)"><rect x="56" y="256" width="396" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="70" y="272" text-anchor="middle" font-size="11.5" fill="#666">4</text>
  <text x="130" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10">y</text>
  <text x="190" y="272" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="250" y="272" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="316" y="272" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="404" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">(0, 0)</text>

  <g filter="url(#sk)"><rect x="56" y="280" width="396" height="22" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="70" y="296" text-anchor="middle" font-size="11.5" fill="#666">5</text>
  <text x="130" y="296" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10">h</text>
  <text x="190" y="296" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="250" y="296" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <text x="316" y="296" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="404" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">(−1, 0)</text>

  <g filter="url(#sk)"><rect x="486" y="150" width="140" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="556" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">key (0,0) → {0, 4}</text>
  <text x="556" y="188" text-anchor="middle" font-size="10.5" fill="#555">子串 (0,4] = baey ✓</text>
  <text x="556" y="206" text-anchor="middle" font-size="10.5" fill="#555">贡献 C(2,2) = 1</text>

  <g filter="url(#sk)"><rect x="486" y="226" width="140" height="66" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="556" y="246" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">key (−1,0) → {1, 5}</text>
  <text x="556" y="264" text-anchor="middle" font-size="10.5" fill="#555">子串 (1,5] = aeyh ✓</text>
  <text x="556" y="282" text-anchor="middle" font-size="10.5" fill="#555">贡献 C(2,2) = 1</text>

  <text x="556" y="310" text-anchor="middle" font-size="10.5" fill="#888">(0,1)、(1,0) 各孤身</text>
  <text x="556" y="326" text-anchor="middle" font-size="10.5" fill="#888">⟹ 贡献 0</text>

  <g filter="url(#sk)"><rect x="56" y="340" width="438" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="275" y="364" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">ans = 1 + 1 = 2：baey 与 aeyh 美丽</text>
  <text x="275" y="384" text-anchor="middle" font-size="11" fill="#666">两子串均 v = 2 ⟹ v² = 4，4 % 2 == 0 ✓</text>

  <g filter="url(#sk)"><rect x="56" y="406" width="438" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="275" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10">对照示例 2：abba，k = 1 ⟹ m = 1，键退化为单值 D</text>
  <text x="275" y="448" text-anchor="middle" font-size="11" fill="#666">D 序列 0,1,0,−1,0：D=0 组 {0,2,4} ⟹ C(3,2) = 3（ab/ba/abba）</text>
