  <text x="130" y="200" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10">b</text>
  <text x="190" y="200" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="250" y="200" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <text x="316" y="200" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="404" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">(−1, 0)</text>

