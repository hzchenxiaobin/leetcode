  <text x="456" y="71" font-size="11" fill="#666">元音</text>
  <g filter="url(#sk)"><rect x="436" y="82" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="456" y="93" font-size="11" fill="#666">辅音</text>

  <text x="70" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">p</text>
  <text x="130" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">字符</text>
  <text x="190" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">V</text>
  <text x="250" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">D=2V−p</text>
  <text x="316" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">V mod 2</text>
  <text x="404" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">key</text>
  <path d="M 56 156 Q 263 153 452 157" stroke="#999" stroke-width="1.2" fill="none" filter="url(#sk)"/>

