<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">判定流程：线性扫描 + 一次比较</text>
    <text x="260" y="48" text-anchor="middle" font-size="10.5" fill="#888">evenA = a 中偶数个数，evenB = b 中偶数个数</text>

    <rect x="170" y="62" width="180" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="260" y="86" text-anchor="middle" font-size="11" fill="#8a6a20">读入 n, k 与数组 a、b</text>

    <path d="M 260 100 L 260 122" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <rect x="120" y="124" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="260" y="143" text-anchor="middle" font-size="10" fill="#3a4a66">扫描 a：evenA = #{ i | a[i] 是偶数 }</text>
    <text x="260" y="160" text-anchor="middle" font-size="10" fill="#3a4a66">扫描 b：evenB = #{ i | b[i] 是偶数 }</text>

    <path d="M 260 170 L 260 185" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

    <polygon points="260,187 378,235 260,283 142,235" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="260" y="240" text-anchor="middle" font-size="11.5" fill="#8a3a36">k 是偶数？</text>

    <path d="M 142 235 L 115 235 L 115 296" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="124" y="228" text-anchor="middle" font-size="9.5" fill="#3a4a66">是</text>

    <path d="M 378 235 L 405 235 L 405 296" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="392" y="228" text-anchor="middle" font-size="9.5" fill="#3a4a66">否</text>

    <rect x="20" y="298" width="190" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="115" y="327" text-anchor="middle" font-size="10.5" fill="#3a4a66">偶类不能再变奇</text>
    <text x="115" y="343" text-anchor="middle" font-size="10.5" fill="#3a4a66">evenA ≤ evenB ?</text>

    <rect x="310" y="298" width="190" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="405" y="327" text-anchor="middle" font-size="10.5" fill="#3a5a30">奇类不能再变偶</text>
    <text x="405" y="343" text-anchor="middle" font-size="10.5" fill="#3a5a30">evenA ≥ evenB ?</text>

    <path d="M 100 346 L 68 374" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <path d="M 130 346 L 162 374" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="58" y="358" text-anchor="middle" font-size="9" fill="#3a4a66">是</text>
    <text x="182" y="358" text-anchor="middle" font-size="9" fill="#3a4a66">否</text>

    <path d="M 390 346 L 358 374" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <path d="M 420 346 L 452 374" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="344" y="358" text-anchor="middle" font-size="9" fill="#3a4a66">是</text>
    <text x="470" y="358" text-anchor="middle" font-size="9" fill="#3a4a66">否</text>

    <rect x="32" y="376" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="68" y="396" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">YES</text>
    <rect x="126" y="376" width="72" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="162" y="396" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">NO</text>
    <rect x="322" y="376" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="358" y="396" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">YES</text>
    <rect x="416" y="376" width="72" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="452" y="396" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">NO</text>

    <text x="260" y="422" text-anchor="middle" font-size="9.5" fill="#999">两条判据互为取反：evenA ≤ evenB ⟺ 奇数A ≥ 奇数B（两侧总数同为 n）</text>
  </g>
</svg>
