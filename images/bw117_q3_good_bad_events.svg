<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">容斥四项：从 26ⁿ 里逐层扣回</text>

  <!-- 总框 26^n -->
  <rect x="150" y="52" width="260" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">全部串 |U| = 26ⁿ</text>
  <text x="280" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">每位置 26 种字母独立选</text>

  <!-- 三个坏事件 -->
  <rect x="36" y="140" width="160" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="116" y="164" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">A：没有 l</text>
  <text x="116" y="186" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">|A| = 25ⁿ</text>
  <text x="116" y="202" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">（B 同理 = 25ⁿ）</text>

  <rect x="200" y="140" width="160" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="164" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">C：e 少于 2 个</text>
  <text x="280" y="186" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">|C| = 25ⁿ + n·25ⁿ⁻¹</text>
  <text x="280" y="202" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">（0 个 + 恰 1 个 e）</text>

  <rect x="364" y="140" width="160" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="444" y="164" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">交事件</text>
  <text x="444" y="184" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">A∩B = 24ⁿ</text>
  <text x="444" y="200" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">A∩C = 24ⁿ+n·24ⁿ⁻¹</text>

  <!-- 箭头 -->
  <path d="M 220 108 Q 180 120 140 138" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 108 Q 280 120 280 138" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 108 Q 400 122 434 138" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 闭式 -->
  <rect x="46" y="240" width="470" height="98" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="14" fill="#33506e" filter="url(#rough2)">ans = 26ⁿ − 3·25ⁿ − n·25ⁿ⁻¹</text>
  <text x="280" y="290" text-anchor="middle" font-size="14" fill="#33506e" filter="url(#rough2)">+ 3·24ⁿ + 2n·24ⁿ⁻¹</text>
  <text x="280" y="314" text-anchor="middle" font-size="14" fill="#33506e" filter="url(#rough2)">− 23ⁿ − n·23ⁿ⁻¹</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">（n &lt; 4 时自动为 0）</text>
</svg>
