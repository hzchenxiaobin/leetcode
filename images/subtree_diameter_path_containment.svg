<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：连通子树内的路径，不会"溜出"子树</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- panel headers -->
  <text x="175" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">S = {2,3,5,6}：连通 ✓ 合法子树</text>
  <text x="495" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">S′ = {1,3,6}：不连通 ✗ 不是子树</text>
  <path d="M 320 62 L 320 400" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- ================= left panel: connected S ================= -->
  <!-- edges outside S (gray) -->
  <g filter="url(#sk)">
    <path d="M 85 110 L 165 180" stroke="#bbbbbb" stroke-width="1.3" fill="none"/>
    <path d="M 245 110 L 295 190" stroke="#bbbbbb" stroke-width="1.3" fill="none"/>
    <path d="M 165 270 L 245 340" stroke="#bbbbbb" stroke-width="1.3" fill="none"/>
  </g>
  <!-- edges inside S (green thick) -->
  <g filter="url(#sk)">
    <path d="M 165 180 L 245 110" stroke="#2e6e2e" stroke-width="2.4" fill="none"/>
    <path d="M 165 180 L 165 270" stroke="#2e6e2e" stroke-width="2.4" fill="none"/>
    <path d="M 165 270 L 85 340" stroke="#2e6e2e" stroke-width="2.4" fill="none"/>
  </g>
  <!-- the unique path 3 -> 6, entirely inside S -->
  <path d="M 245 110 L 165 180 L 165 270 L 98 329" stroke="#d6a040" stroke-width="3.2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="118" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b08020">长 = 3</text>
  <text x="262" y="96" font-size="12" font-weight="bold" fill="#b85450">u = 3</text>
  <text x="85" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">v = 6</text>
  <!-- nodes -->
  <g filter="url(#sk)">
    <circle cx="85" cy="110" r="15" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3"/>
    <circle cx="295" cy="190" r="15" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3"/>
    <circle cx="245" cy="340" r="15" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3"/>
    <circle cx="165" cy="180" r="15" fill="#4a8e4a" stroke="#357035" stroke-width="1.6"/>
    <circle cx="245" cy="110" r="15" fill="#4a8e4a" stroke="#357035" stroke-width="1.6"/>
    <circle cx="165" cy="270" r="15" fill="#4a8e4a" stroke="#357035" stroke-width="1.6"/>
    <circle cx="85" cy="340" r="15" fill="#4a8e4a" stroke="#357035" stroke-width="1.6"/>
  </g>
  <text x="85" y="115" text-anchor="middle" font-size="13" fill="#999999">1</text>
  <text x="295" y="195" text-anchor="middle" font-size="13" fill="#999999">4</text>
  <text x="245" y="345" text-anchor="middle" font-size="13" fill="#999999">7</text>
  <text x="165" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text x="245" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text x="165" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5</text>
  <text x="85" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">6</text>
  <!-- left caption -->
  <text x="175" y="374" text-anchor="middle" font-size="11.5" fill="#333333">u = 3 → v = 6：唯一路径 3−2−5−6 全程在 S 内</text>
  <text x="175" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">子树内距离 = 全树距离 = 3，直接查全局 dist</text>

  <!-- ================= right panel: disconnected S' ================= -->
  <!-- all edges gray -->
  <g filter="url(#sk)">
    <path d="M 405 110 L 485 180" stroke="#bbbbbb" stroke-width="1.3" fill="none"/>
    <path d="M 485 180 L 565 110" stroke="#bbbbbb" stroke-width="1.3" fill="none"/>
    <path d="M 485 180 L 485 270" stroke="#bbbbbb" stroke-width="1.3" fill="none"/>
    <path d="M 565 110 L 615 190" stroke="#bbbbbb" stroke-width="1.3" fill="none"/>
    <path d="M 485 270 L 405 340" stroke="#bbbbbb" stroke-width="1.3" fill="none"/>
    <path d="M 485 270 L 565 340" stroke="#bbbbbb" stroke-width="1.3" fill="none"/>
  </g>
  <!-- tree path 1 -> 3 forced through outside vertex 2 -->
  <path d="M 405 110 L 485 180 L 565 110" stroke="#b85450" stroke-width="2.6" stroke-dasharray="7 5" fill="none" filter="url(#sk)"/>
  <text x="485" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">经 S′ 外的 2</text>
  <!-- nodes -->
  <g filter="url(#sk)">
    <circle cx="485" cy="180" r="15" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3"/>
    <circle cx="615" cy="190" r="15" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3"/>
    <circle cx="485" cy="270" r="15" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3"/>
    <circle cx="565" cy="340" r="15" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3"/>
    <circle cx="405" cy="110" r="15" fill="#4a8e4a" stroke="#357035" stroke-width="1.6"/>
    <circle cx="565" cy="110" r="15" fill="#4a8e4a" stroke="#357035" stroke-width="1.6"/>
    <circle cx="405" cy="340" r="15" fill="#4a8e4a" stroke="#357035" stroke-width="1.6"/>
  </g>
  <text x="485" y="185" text-anchor="middle" font-size="13" fill="#999999">2</text>
  <text x="615" y="195" text-anchor="middle" font-size="13" fill="#999999">4</text>
  <text x="485" y="275" text-anchor="middle" font-size="13" fill="#999999">5</text>
  <text x="565" y="345" text-anchor="middle" font-size="13" fill="#999999">7</text>
  <text x="405" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text x="565" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text x="405" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">6</text>
  <!-- right caption -->
  <text x="495" y="374" text-anchor="middle" font-size="11.5" fill="#333333">S′ 内没有任何边，1→3 的树路径被迫经过 S′ 外的 2</text>
  <text x="495" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">全局 dist[1][3] = 2 仍存在——不先判连通就会误计数！</text>

  <!-- ================= lemma band ================= -->
  <g filter="url(#sk)">
    <rect x="40" y="410" width="560" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="432" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415">引理（路径包含）：S 连通 ⇒ 树上唯一的 u–v 路径整条落在 S 内</text>
  <text x="320" y="451" text-anchor="middle" font-size="11.5" fill="#8a6415">⇒ 子树内距离 = 全树距离；dist 矩阵对全树预处理一次，任意子树直径 = max dist[i][j]</text>
</svg>
