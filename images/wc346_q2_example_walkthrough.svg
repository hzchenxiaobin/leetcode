<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="137" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：逐对决策，失配两侧同写 min</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- row 1: egcfe -> efcfe -->
  <rect x="48" y="66" width="56" height="22" rx="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="76" y="81" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33517a" filter="url(#sk)">示例 1</text>
  <rect x="120" y="64" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="135" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">e</text>
  <rect x="155" y="64" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="170" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">g</text>
  <rect x="190" y="64" width="30" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="205" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555" filter="url(#sk)">c</text>
  <rect x="225" y="64" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">f</text>
  <rect x="260" y="64" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="275" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">e</text>
  <path d="M 298 79 H 330" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <rect x="340" y="64" width="30" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="355" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555" filter="url(#sk)">e</text>
  <rect x="375" y="64" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
  <text x="390" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6520" filter="url(#sk)">f</text>
  <rect x="410" y="64" width="30" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="425" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555" filter="url(#sk)">c</text>
  <rect x="445" y="64" width="30" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="460" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555" filter="url(#sk)">f</text>
  <rect x="480" y="64" width="30" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="495" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555" filter="url(#sk)">e</text>
  <rect x="536" y="67" width="60" height="22" rx="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="566" y="82" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6520" filter="url(#sk)">1 次</text>
  <text x="320" y="116" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">对 (0,4)：e = e ✓ 不动　　对 (1,3)：g ≠ f，取 min = f，两侧同写 f（橙色 = 被改的位置）</text>
  <text x="320" y="132" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">中心位 c 免检 —— 1 次操作，恰好等于失配对数</text>

  <!-- row 2: abcd -> abba -->
  <rect x="48" y="162" width="56" height="22" rx="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="76" y="177" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33517a" filter="url(#sk)">示例 2</text>
  <rect x="120" y="160" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="135" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">a</text>
  <rect x="155" y="160" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="170" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">b</text>
  <rect x="190" y="160" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="205" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">c</text>
  <rect x="225" y="160" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">d</text>
  <path d="M 262 175 H 330" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <rect x="340" y="160" width="30" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="355" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555" filter="url(#sk)">a</text>
  <rect x="375" y="160" width="30" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="390" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555" filter="url(#sk)">b</text>
  <rect x="410" y="160" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
  <text x="425" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6520" filter="url(#sk)">b</text>
  <rect x="445" y="160" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
  <text x="460" y="181" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6520" filter="url(#sk)">a</text>
  <rect x="536" y="163" width="60" height="22" rx="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="566" y="178" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6520" filter="url(#sk)">2 次</text>
  <text x="320" y="212" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">对 (0,3)：a ≠ d → 双写 a　　对 (1,2)：b ≠ c → 双写 b</text>
  <text x="320" y="228" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">没有相等对，每个对称对都花 1 次 → 2 次操作</text>

  <!-- row 3: seven -> neven -->
  <rect x="48" y="258" width="56" height="22" rx="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="76" y="273" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33517a" filter="url(#sk)">示例 3</text>
  <rect x="120" y="256" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="135" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">s</text>
  <rect x="155" y="256" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="170" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">e</text>
  <rect x="190" y="256" width="30" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="205" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555" filter="url(#sk)">v</text>
  <rect x="225" y="256" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">e</text>
  <rect x="260" y="256" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="275" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">n</text>
  <path d="M 298 271 H 330" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <rect x="340" y="256" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
  <text x="355" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6520" filter="url(#sk)">n</text>
  <rect x="375" y="256" width="30" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="390" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555" filter="url(#sk)">e</text>
  <rect x="410" y="256" width="30" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="425" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555" filter="url(#sk)">v</text>
  <rect x="445" y="256" width="30" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="460" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555" filter="url(#sk)">e</text>
  <rect x="480" y="256" width="30" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="495" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555" filter="url(#sk)">n</text>
  <rect x="536" y="259" width="60" height="22" rx="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="566" y="274" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6520" filter="url(#sk)">1 次</text>
  <text x="320" y="308" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">对 (0,4)：s ≠ n，min = n —— 被改小的是靠前的 s（左侧也能被改！）</text>
  <text x="320" y="324" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">对 (1,3)：e = e ✓ 不动，中心 v 免检 → 1 次操作</text>

  <!-- row 4: bb -> bb (counterexample) -->
  <rect x="44" y="354" width="64" height="22" rx="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="76" y="369" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">自拟反例</text>
  <rect x="120" y="352" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="135" y="373" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">b</text>
  <rect x="155" y="352" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="170" y="373" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">b</text>
  <path d="M 192 367 H 330" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <rect x="340" y="352" width="30" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="355" y="373" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555" filter="url(#sk)">b</text>
  <rect x="375" y="352" width="30" height="30" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="390" y="373" text-anchor="middle" font-size="14" font-weight="bold" fill="#555555" filter="url(#sk)">b</text>
  <rect x="536" y="355" width="60" height="22" rx="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="566" y="370" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">0 次</text>
  <text x="320" y="404" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">bb 已是回文：相等对冻结，0 次已是最少</text>
  <text x="320" y="420" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">答案不是 aa（那要 2 次）——「操作数最少」优先于「字典序最小」</text>
</svg>
