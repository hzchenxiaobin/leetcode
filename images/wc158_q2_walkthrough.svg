<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="330" fill="#fafafa"/>
  <text x="350" y="26" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：king = [0,0]，逐方向扫描</text>
  <text x="350" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3 条射线命中并停止，其余 5 条第一步就越界</text>
  <rect x="40" y="64" width="620" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="95" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">方向 (dx,dy)</text>
  <text x="335" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">扫描序列（空 → 皇后即停）</text>
  <text x="590" y="86" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">结论</text>
  <rect x="40" y="98" width="620" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95" y="123" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1, 0) →</text>
  <text x="335" y="123" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">(1,0) 有皇后</text>
  <text x="590" y="123" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">加入 (1,0)</text>
  <rect x="40" y="138" width="620" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95" y="163" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1, 1) ↘</text>
  <text x="335" y="163" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">(1,1) 空 → (2,2) 空 → (3,3) 有皇后</text>
  <text x="590" y="163" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">加入 (3,3)</text>
  <rect x="40" y="178" width="620" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95" y="203" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(0, 1) ↓</text>
  <text x="335" y="203" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">(0,1) 有皇后</text>
  <text x="590" y="203" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">加入 (0,1)</text>
  <rect x="40" y="218" width="620" height="40" fill="#eef0f2" stroke="#7a8088" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95" y="243" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">其余 5 向</text>
  <text x="335" y="243" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">第一步即越界（如 (−1,0) 从 x=−1 开始）</text>
  <text x="590" y="243" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">无皇后</text>
  <path d="M 150 64 V 258 M 520 64 V 258" stroke="#c9d2e0" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="350" y="284" text-anchor="middle" font-size="9.5" fill="#8a5a20" filter="url(#rough2)">被挡住的候选：(4,0) 在 (1,0) 之后、(0,4) 在 (0,1) 之后；(2,4) 与国王不共线</text>
  <text x="350" y="306" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">答案与返回顺序无关，判题按集合比较</text>
</svg>
