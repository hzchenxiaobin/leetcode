<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#fdfcf7"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：怎么分段 ⇄ 给每个元素定符号</text>
  <path d="M 250 42 Q 450 48 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="60" y="62" font-size="12" fill="#555" filter="url(#sk)">nums = [1, −2, 3, 4]</text>

  <!-- 分割①：整段 -->
  <text x="60" y="112" font-size="14" font-weight="bold" fill="#444" filter="url(#sk)">分割 ①</text>
  <text x="60" y="132" font-size="11" fill="#888" filter="url(#sk)">整段不切</text>
  <path d="M 200 84 Q 205 70 220 68 L 490 68 Q 505 70 510 84" stroke="#666" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="355" y="58" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">一段</text>
  <g>
    <g filter="url(#sk)"><rect x="200" y="84" width="70" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
    <g filter="url(#sk)"><rect x="280" y="84" width="70" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
    <g filter="url(#sk)"><rect x="360" y="84" width="70" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
    <g filter="url(#sk)"><rect x="440" y="84" width="70" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
    <text x="235" y="113" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">1</text>
    <text x="315" y="113" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">−2</text>
    <text x="395" y="113" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">3</text>
    <text x="475" y="113" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">4</text>
  </g>
  <g font-size="14" font-weight="bold">
    <g filter="url(#sk)"><circle cx="235" cy="160" r="13" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="235" y="165" text-anchor="middle" fill="#2e6e2e">+</text>
    <g filter="url(#sk)"><circle cx="315" cy="160" r="13" fill="#fbeaec" stroke="#b03a3a" stroke-width="1.5"/></g>
    <text x="315" y="165" text-anchor="middle" fill="#b03a3a">−</text>
    <g filter="url(#sk)"><circle cx="395" cy="160" r="13" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="395" y="165" text-anchor="middle" fill="#2e6e2e">+</text>
    <g filter="url(#sk)"><circle cx="475" cy="160" r="13" fill="#fbeaec" stroke="#b03a3a" stroke-width="1.5"/></g>
    <text x="475" y="165" text-anchor="middle" fill="#b03a3a">−</text>
  </g>
  <text x="560" y="113" font-size="13" fill="#444" filter="url(#sk)">总成本 = 1 + 2 + 3 − 4 = 2</text>

  <!-- 分割②：切一刀 -->
  <text x="60" y="252" font-size="14" font-weight="bold" fill="#444" filter="url(#sk)">分割 ②</text>
  <text x="60" y="272" font-size="11" fill="#888" filter="url(#sk)">在 3 ∣ 4 间切一刀</text>
  <path d="M 200 224 Q 205 210 220 208 L 410 208 Q 425 210 430 224" stroke="#666" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="315" y="200" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">段 A</text>
  <path d="M 440 224 Q 445 210 455 208 L 500 208 Q 508 210 510 224" stroke="#666" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="475" y="200" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">段 B</text>
  <g>
    <g filter="url(#sk)"><rect x="200" y="224" width="70" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
    <g filter="url(#sk)"><rect x="280" y="224" width="70" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
    <g filter="url(#sk)"><rect x="360" y="224" width="70" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
    <g filter="url(#sk)"><rect x="440" y="224" width="70" height="46" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/></g>
    <text x="235" y="253" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">1</text>
    <text x="315" y="253" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">−2</text>
    <text x="395" y="253" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">3</text>
    <text x="475" y="253" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5415">4</text>
  </g>
  <path d="M 437 210 L 437 296" stroke="#c98a2b" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="437" y="206" text-anchor="middle" font-size="14" fill="#c98a2b" filter="url(#sk)">✂</text>
  <g font-size="14" font-weight="bold">
    <g filter="url(#sk)"><circle cx="235" cy="300" r="13" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="235" y="305" text-anchor="middle" fill="#2e6e2e">+</text>
    <g filter="url(#sk)"><circle cx="315" cy="300" r="13" fill="#fbeaec" stroke="#b03a3a" stroke-width="1.5"/></g>
    <text x="315" y="305" text-anchor="middle" fill="#b03a3a">−</text>
    <g filter="url(#sk)"><circle cx="395" cy="300" r="13" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
    <text x="395" y="305" text-anchor="middle" fill="#2e6e2e">+</text>
    <g filter="url(#sk)"><circle cx="475" cy="300" r="13" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/></g>
    <text x="475" y="305" text-anchor="middle" fill="#c98a2b">+</text>
  </g>
  <text x="560" y="253" font-size="14" font-weight="bold" fill="#c98a2b" filter="url(#sk)">总成本 = 1 + 2 + 3 + 4 = 10 ✓</text>
  <text x="560" y="305" font-size="11" font-weight="bold" fill="#c98a2b" filter="url(#sk)">← 段首恒 +（相位重置）</text>

  <!-- 底部规则框 -->
  <g filter="url(#sk)">
    <rect x="40" y="336" width="820" height="80" rx="9" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="360" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">合法符号序列只有两条规则</text>
  <text x="60" y="382" font-size="11.5" fill="#444" filter="url(#sk)">① s₀ = +（每段段首都乘 +）；② 无相邻两个 −（− 只能紧跟同段的 +）</text>
  <text x="60" y="404" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">目标：max Σ sᵢ · nums[i] ——「在哪里切」=「给谁配 − 号」</text>
</svg>
