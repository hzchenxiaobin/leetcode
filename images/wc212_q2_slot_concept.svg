<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：等差数列由 (mn, d) 唯一确定 —— 槽位双射判定</text>
  <path d="M 120 34 Q 340 42 560 34" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>
  <text x="340" y="56" text-anchor="middle" font-size="11" fill="#444" filter="url(#r)">长度 L 的可重集可重排成等差数列 ⇔ 恰好占满 L 个槽位 mn, mn+d, …, mn+(L−1)d，其中 d = (mx − mn)/(L − 1)</text>

  <!-- ===== left panel: true case ===== -->
  <g filter="url(#r)">
    <rect x="40" y="70" width="292" height="250" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="186" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">✓ [5, 9, 3, 7]（L = 4）</text>
  <text x="186" y="113" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#444" filter="url(#r)">mn=3, mx=9 ⇒ d=(9−3)/3=2</text>

  <!-- element chips -->
  <g filter="url(#r)">
    <rect x="60" y="128" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="104" y="128" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="148" y="128" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="192" y="128" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#r)" font-size="13" font-weight="bold" fill="#2b4a6e" text-anchor="middle">
    <text x="78" y="146">5</text>
    <text x="122" y="146">9</text>
    <text x="166" y="146">3</text>
    <text x="210" y="146">7</text>
  </g>
  <text x="60" y="124" font-size="9" fill="#999" filter="url(#r)">元素（原顺序）</text>

  <!-- arrows chip -> slot -->
  <g filter="url(#r)" stroke="#446688" stroke-width="1.4" fill="none">
    <path d="M 78 156 Q 82 195 89 218" marker-end="url(#ar)"/>
    <path d="M 122 156 Q 175 195 257 218" marker-end="url(#ar)"/>
    <path d="M 166 156 Q 158 195 152 218" marker-end="url(#ar)"/>
    <path d="M 210 156 Q 209 195 208 218" marker-end="url(#ar)"/>
  </g>

  <!-- slots -->
  <g filter="url(#r)">
    <rect x="58" y="222" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="118" y="222" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="178" y="222" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="238" y="222" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g filter="url(#r)" font-size="13" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="86" y="241">3</text>
    <text x="146" y="241">5</text>
    <text x="206" y="241">7</text>
    <text x="266" y="241">9</text>
  </g>
  <g filter="url(#r)" font-size="8.5" fill="#557" text-anchor="middle">
    <text x="86" y="252">k=0</text>
    <text x="146" y="252">k=1</text>
    <text x="206" y="252">k=2</text>
    <text x="266" y="252">k=3</text>
  </g>
  <text x="186" y="278" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">4 个元素恰好占满 4 个槽位 → true</text>
  <text x="186" y="296" text-anchor="middle" font-size="10" fill="#555" filter="url(#r)">单射 + 鸽笼（L 个元素 ↔ L 个槽）⇒ 双射</text>
  <text x="186" y="312" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#r)">检查只需：off 整除 d、槽位不撞车</text>

  <!-- ===== right panel: false case ===== -->
  <g filter="url(#r)">
    <rect x="348" y="70" width="292" height="250" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="494" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#r)">✗ [0, 2, 2, 6]（L = 4）</text>
  <text x="494" y="113" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#444" filter="url(#r)">mn=0, mx=6 ⇒ d=(6−0)/3=2</text>

  <!-- element chips -->
  <g filter="url(#r)">
    <rect x="368" y="128" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="412" y="128" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="456" y="128" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="500" y="128" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#r)" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="386" y="146" fill="#2b4a6e">0</text>
    <text x="430" y="146" fill="#2b4a6e">2</text>
    <text x="474" y="146" fill="#b85450">2</text>
    <text x="518" y="146" fill="#2b4a6e">6</text>
  </g>

  <!-- arrows chip -> slot -->
  <g filter="url(#r)" stroke="#446688" stroke-width="1.4" fill="none">
    <path d="M 386 156 Q 390 195 393 218" marker-end="url(#ar)"/>
    <path d="M 430 156 Q 441 195 451 218" marker-end="url(#ar)"/>
    <path d="M 518 156 Q 550 195 571 218" marker-end="url(#ar)"/>
  </g>
  <path d="M 474 156 Q 466 195 458 218" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="473" y="213" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">撞！</text>

  <!-- slots -->
  <g filter="url(#r)">
    <rect x="366" y="222" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="426" y="222" width="56" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="486" y="222" width="56" height="34" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="546" y="222" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#r)" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="394" y="241" fill="#2b4a6e">0</text>
    <text x="454" y="241" fill="#8a6a1a">2</text>
    <text x="514" y="241" fill="#999">4</text>
    <text x="574" y="241" fill="#2b4a6e">6</text>
  </g>
  <g filter="url(#r)" font-size="8.5" fill="#557" text-anchor="middle">
    <text x="394" y="252">k=0</text>
    <text x="454" y="252">k=1</text>
    <text x="514" y="252">k=2（空）</text>
    <text x="574" y="252">k=3</text>
  </g>
  <text x="494" y="278" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#r)">两个 2 同抢 k=1，k=2（值 4）空 → false</text>
  <text x="494" y="296" text-anchor="middle" font-size="10" fill="#555" filter="url(#r)">整除闸门与逐元素整除均通过 —— 只有查重能拦下</text>
  <text x="494" y="312" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#r)">seen[k] 已标记 ⇒ 立即 false</text>

  <!-- formula box -->
  <g filter="url(#r)">
    <rect x="40" y="334" width="600" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="58" y="356" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">判定三闸门（每查询 O(L)，无需排序）</text>
  <text x="58" y="374" font-size="11" fill="#333" filter="url(#r)">d = (mx − mn)/(L − 1)；① mx = mn ⇒ 全相等 → true；② (mx − mn) % (L−1) ≠ 0 → false</text>
  <text x="58" y="391" font-size="11" fill="#333" filter="url(#r)">③ 逐元素：off = x − mn 整除 d，且槽位 k = off / d 互不相同 → true</text>

  <!-- WA note -->
  <g filter="url(#r)">
    <rect x="40" y="412" width="600" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="58" y="434" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#r)">经典 WA：只查「off 整除 d」不查槽位撞车</text>
  <text x="58" y="451" font-size="10.5" fill="#444" filter="url(#r)">[0,2,2,6]：d=2，每个 off 都是偶数全通过，但缺 4、多一个 2 —— 必须用 seen[k] 查重；槽位范围自动合法（mn ≤ x ≤ mx ⇒ 0 ≤ k ≤ L−1）</text>
</svg>
