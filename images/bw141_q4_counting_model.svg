<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="384" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">按「有表演者的节目数 j」分三层计数</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">三类选择互相独立，逐层相乘，最后对 j 求和</text>

  <rect x="52" y="60" width="456" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">① 从 x 个节目里挑出「非空」的那 j 个</text>
  <text x="280" y="101" text-anchor="middle" font-size="12" fill="#3a4a66">C(x, j)　（组合数，节目是有区别的）</text>

  <path d="M 280 118 L 280 130" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="130" font-size="12" fill="#666">×</text>

  <rect x="52" y="136" width="456" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">② 把 n 个表演者安排到这 j 个节目，每个至少 1 人</text>
  <text x="280" y="177" text-anchor="middle" font-size="12" fill="#3a5a30">满射个数 = j! · S(n, j)　（S 为第二类斯特林数）</text>

  <path d="M 280 194 L 280 206" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="206" font-size="12" fill="#666">×</text>

  <rect x="52" y="212" width="456" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">③ 给这 j 个节目各打一个 [1, y] 的分数</text>
  <text x="280" y="253" text-anchor="middle" font-size="12" fill="#8a6a20">y^j　（每个节目独立打分；空节目不打分）</text>

  <path d="M 280 270 L 280 284" stroke="#b85450" stroke-width="1.9" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="52" y="288" width="456" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">答案 = Σ_{j=1 … min(n, x)} C(x, j) · j! · S(n, j) · y^j</text>
  <text x="280" y="329" text-anchor="middle" font-size="10" fill="#888">j 上界是 min(n, x)：节目数不超过 x，非空节目数不超过人数 n</text>

  <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#666">为什么不会漏也不会重？j 是「非空节目数」，它是被唯一确定的</text>
  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#666">不同 j 对应不同活动（非空集合大小不同），故按 j 分类天然不重不漏</text>
</svg>
