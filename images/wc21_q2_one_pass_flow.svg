<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="560" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">一次线性扫描：余数表 + 下标差判长</text>
  <text x="320" y="45" text-anchor="middle" font-size="11" fill="#888">哈希表只记录每个余数「最早」出现的元素下标，命中时检查长度是否 ≥ 2</text>

  <rect x="120" y="62" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="87" text-anchor="middle" font-size="11" fill="#3a4a66">初始化 first = {0: −1}，s = 0，i = 0</text>

  <polygon points="250,116 345,148 250,180 155,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="152" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">i &lt; n ?</text>

  <rect x="120" y="204" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="229" text-anchor="middle" font-size="11" fill="#3a4a66">s += nums[i]；r = s mod k</text>

  <polygon points="250,260 362,292 250,324 138,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="296" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">r ∈ first ?</text>

  <polygon points="250,366 372,400 250,434 128,400" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="404" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">i − first[r] ≥ 2 ?</text>

  <rect x="440" y="272" width="180" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="530" y="291" text-anchor="middle" font-size="12" fill="#3a5a30">first[r] = i</text>
  <text x="530" y="306" text-anchor="middle" font-size="9" fill="#5a7a50">（只记最早下标）</text>

  <rect x="440" y="378" width="180" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="530" y="402" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">return true</text>

  <rect x="440" y="118" width="180" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="530" y="138" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return false</text>
  <text x="530" y="155" text-anchor="middle" font-size="9" fill="#a06060">（扫完仍未命中）</text>

  <g stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M 250 102 L 250 114" marker-end="url(#arr)"/>
    <path d="M 250 180 L 250 202" marker-end="url(#arr)"/>
    <path d="M 250 244 L 250 258" marker-end="url(#arr)"/>
    <path d="M 250 324 L 250 364" marker-end="url(#arr)"/>
    <path d="M 345 148 L 438 148" marker-end="url(#arr)"/>
    <path d="M 362 292 L 438 292" marker-end="url(#arr)"/>
    <path d="M 372 400 L 438 400" marker-end="url(#arr)"/>
  </g>

  <g font-size="10" fill="#8a6a20">
    <text x="410" y="140" filter="url(#rough2)">否</text>
    <text x="262" y="196" filter="url(#rough2)">是</text>
    <text x="404" y="284" filter="url(#rough2)">否</text>
    <text x="386" y="392" filter="url(#rough2)">是</text>
    <text x="262" y="348" filter="url(#rough2)">是</text>
  </g>

  <g stroke="#d6a040" stroke-width="1.7" fill="none" filter="url(#rough2)">
    <path d="M 620 293 L 628 293 L 628 530 L 62 530 L 62 148 L 152 148" marker-end="url(#arr)"/>
    <path d="M 250 434 L 250 530"/>
  </g>
  <text x="360" y="524" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">i += 1，回到循环</text>

  <text x="320" y="552" text-anchor="middle" font-size="10" fill="#999">每个元素只进表一次、只查表一次：时间 O(n)，空间 O(min(n, k))</text>
</svg>
