  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：pizza = ["A..","AAA","..."], k = 3</text>
