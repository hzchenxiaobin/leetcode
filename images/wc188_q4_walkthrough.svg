  <text x="260.0" y="205" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">(r=0,c=0) → 3</text>
  <text x="410.0" y="74" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">t = 3</text>
  <rect x="356" y="84" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="108" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="392" y="84" width="36" height="36" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="108" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="428" y="84" width="36" height="36" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="108" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="356" y="120" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="144" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="392" y="120" width="36" height="36" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="144" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="428" y="120" width="36" height="36" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="144" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="356" y="156" width="36" height="36" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="180" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="392" y="156" width="36" height="36" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="180" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="428" y="156" width="36" height="36" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="180" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="410.0" y="205" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">(r=0,c=0) → 3</text>
  <rect x="496" y="68" width="128" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="560" y="90" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">答案</text>
  <text x="560" y="114" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">dp[0][0][3] = 3</text>
  <text x="560" y="138" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">三条切法</text>
  <text x="560" y="154" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">H@1 → V@1</text>
  <text x="560" y="168" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">H@1 → V@2</text>
  <text x="560" y="182" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">V@1 → V@2</text>
  <rect x="40" y="214" width="560" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="238" text-anchor="start" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">t = 3、(r,c) = (0,0) 的第一刀枚举（横切 2 个切点 + 竖切 2 个切点）</text>
  <text x="56" y="262" text-anchor="start" font-size="10" fill="#444" filter="url(#rough2)">dp[0][0][3] = dp[1][0][2] + dp[2][0][2] + dp[0][1][2] + dp[0][2][2]</text>
  <text x="56" y="284" text-anchor="start" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">             = 2 + 0 + 1 + 0 = 3</text>
  <text x="56" y="306" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">H@2 本身合法（送走两行共 4 个苹果），但剩下一行 "..." 没有苹果 → dp[2][0][2] = 0</text>
  <text x="40" y="344" text-anchor="start" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">三条方案（每一刀送出的那一条都至少含 1 个苹果）：</text>
  <text x="40" y="368" text-anchor="start" font-size="9.5" fill="#444" filter="url(#rough2)">① H@1 → V@1：送走 "A.."，再送走 col0 的 "A"/"."，剩 "AA"/".."</text>
  <text x="40" y="392" text-anchor="start" font-size="9.5" fill="#444" filter="url(#rough2)">② H@1 → V@2：送走 "A.."，再送走 cols0-1 的 "AA"/".."，剩 "A"/"."</text>
  <text x="40" y="416" text-anchor="start" font-size="9.5" fill="#444" filter="url(#rough2)">③ V@1 → V@2：送走 col0 的 "A"/"A"/"."，再送走 col1 的 "."/"A"/"."，剩 col2 的 "."/"A"/"."</text>
</svg>
