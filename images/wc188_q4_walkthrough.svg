  <text x="224" y="144" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="242" y="120" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="278" y="120" width="36" height="36" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="144" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="206" y="156" width="36" height="36" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="180" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
