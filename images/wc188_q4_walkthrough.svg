  <text x="110.0" y="205" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">(r=0,c=0) → 1</text>
  <text x="260.0" y="74" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">t = 2</text>
  <rect x="206" y="84" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="108" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="242" y="84" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="278" y="84" width="36" height="36" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="108" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">0</text>
