<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">倍增爬链：从大到小试跳 2^k，等价于在祖先链上二分</text>
  <text x="160" y="44" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">例 3 查询 [3,4] 的 v 侧爬链</text>
  <text x="427" y="44" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">条件：2·(dist[z]−dist[l]) ≥ B−A = 5</text>

  <!-- 祖先链 -->
  <line x1="160" y1="110" x2="160" y2="174" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="160" y1="218" x2="160" y2="282" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="146" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">w=5</text>
  <text x="134" y="254" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">w=3</text>

  <!-- 试跳曲线：2^1 失败（灰虚线） -->
  <path d="M 134 290 C 76 250, 76 134, 128 100" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="82" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2^1 ✗</text>

  <!-- 试跳曲线：2^0 成功（绿实线） -->
  <path d="M 138 288 C 102 262, 102 226, 136 216" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="98" y="206" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2^0 ✓</text>

  <!-- 链上节点 -->
  <circle cx="160" cy="88" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="160" y="93" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="160" y="54" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">root = LCA（止步线）</text>

  <circle cx="160" cy="196" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="160" y="201" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <circle cx="160" cy="304" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="309" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="160" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">v（爬链起点）</text>

  <!-- 条件标注 -->
  <text x="196" y="82" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">2·(0−0) = 0 ≥ 5 ✗</text>
  <text x="196" y="99" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">LCA 及其上方必为假，爬不出去</text>
  <text x="196" y="190" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2·(5−0) = 10 ≥ 5 ✓</text>
  <text x="196" y="207" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">最高满足者 = 答案 z</text>
  <text x="196" y="298" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2·(8−0) = 16 ≥ 5 ✓</text>
  <text x="196" y="315" text-anchor="start" font-size="10" fill="#888" filter="url(#rough2)">起点必真（2B ≥ B−A 恒成立）</text>

  <!-- 右侧试跳序列 -->
  <text x="427" y="68" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">试跳序列（k 从大到小）</text>
  <rect x="312" y="78" width="230" height="44" rx="6" fill="#f0f0f0" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="427" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k=1：up[1][4] = 0</text>
  <text x="427" y="113" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0 ≥ 5 为假 ⇒ 不跳</text>
  <rect x="312" y="130" width="230" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k=0：up[0][4] = 2</text>
  <text x="427" y="165" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10 ≥ 5 为真 ⇒ 跳到 2</text>
  <rect x="312" y="182" width="230" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="427" y="206" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">结束：z = 2，即带权中位节点</text>

  <!-- 二分同构 -->
  <rect x="312" y="236" width="230" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">为什么等价于二分？</text>
  <text x="427" y="278" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">条件沿祖先链单调（深端真、浅端假）</text>
  <text x="427" y="296" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">试跳 2^k 恰在确定答案步数的第 k 个</text>
  <text x="427" y="314" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">二进制位，与有序数组上二分同构</text>

  <!-- u 侧对称 -->
  <rect x="312" y="332" width="230" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="352" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">u 侧对称</text>
  <text x="427" y="370" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">爬到最深的 2·dist(u,y) &lt; W 的 y，</text>
  <text x="427" y="386" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">答案 = parent(y)（例 1：y=1 ⇒ 0）</text>
</svg>
