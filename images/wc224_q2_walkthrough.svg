<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 650"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="650" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：nums = [1, 2, 4, 5, 10]（示例 2）</text>

  <!-- nums 数组 -->
  <text x="163" y="63" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">nums =</text>
  <rect x="185" y="42" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="209" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">1</text>
  <rect x="241" y="42" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">2</text>
  <rect x="297" y="42" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="321" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">4</text>
  <rect x="353" y="42" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="377" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">5</text>
  <rect x="409" y="42" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="433" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">10</text>

  <!-- ① 枚举数对 -->
  <text x="205" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">① 枚举 C(5,2) = 10 个无序数对（同色 = 同乘积）</text>

  <rect x="40" y="106" width="155" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="128" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">{1, 2} → 2</text>
  <rect x="215" y="106" width="155" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="292" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">{2, 5} → 10</text>
  <rect x="40" y="148" width="155" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="170" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">{1, 4} → 4</text>
  <rect x="215" y="148" width="155" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="292" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">{2, 10} → 20</text>
  <rect x="40" y="190" width="155" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="212" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">{1, 5} → 5</text>
  <rect x="215" y="190" width="155" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="292" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">{4, 5} → 20</text>
  <rect x="40" y="232" width="155" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="117" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">{1, 10} → 10</text>
  <rect x="215" y="232" width="155" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="254" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">{4, 10} → 40</text>
  <rect x="40" y="274" width="155" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="296" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">{2, 4} → 8</text>
  <rect x="215" y="274" width="155" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="296" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">{5, 10} → 50</text>

  <!-- 图例 -->
  <rect x="40" y="316" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="328" font-size="10.5" fill="#666" filter="url(#rough2)">乘积 10（2 对）</text>
  <rect x="150" y="316" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="328" font-size="10.5" fill="#666" filter="url(#rough2)">乘积 20（2 对）</text>
  <rect x="260" y="316" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="328" font-size="10.5" fill="#666" filter="url(#rough2)">只出现 1 次</text>

  <!-- ② 聚合桶 -->
  <rect x="395" y="100" width="235" height="252" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="512" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">② 按乘积聚合 cnt</text>
  <text x="512" y="152" text-anchor="middle" font-size="11.5" fill="#2c4a6e" filter="url(#rough2)">2 → 1</text>
  <text x="512" y="178" text-anchor="middle" font-size="11.5" fill="#2c4a6e" filter="url(#rough2)">4 → 1</text>
  <text x="512" y="204" text-anchor="middle" font-size="11.5" fill="#2c4a6e" filter="url(#rough2)">5 → 1</text>
  <text x="512" y="230" text-anchor="middle" font-size="11.5" fill="#2c4a6e" filter="url(#rough2)">8 → 1</text>
  <rect x="412" y="240" width="200" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="512" y="257" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">10 → 2</text>
  <rect x="412" y="266" width="200" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="512" y="283" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">20 → 2</text>
  <text x="512" y="308" text-anchor="middle" font-size="11.5" fill="#2c4a6e" filter="url(#rough2)">40 → 1</text>
  <text x="512" y="334" text-anchor="middle" font-size="11.5" fill="#2c4a6e" filter="url(#rough2)">50 → 1</text>
  <text x="512" y="348" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">同色卡片聚进同色桶</text>

  <!-- ③ 套公式 -->
  <rect x="40" y="362" width="580" height="258" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">③ 套公式：ans = Σ 4·k·(k−1)</text>
  <text x="330" y="420" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">乘积 10：k = 2 → 4 × 2 × (2−1) = 8 个元组</text>
  <text x="330" y="450" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">乘积 20：k = 2 → 4 × 2 × (2−1) = 8 个元组</text>
  <text x="330" y="480" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">其余乘积（2, 4, 5, 8, 40, 50）：k = 1 → 贡献 0</text>
  <path d="M90,498 L570,498" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="330" y="532" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">ans = 8 + 8 = 16 ✓</text>
  <text x="330" y="572" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">示例 3 中 cnt[12] = 3 → 贡献 4×3×2 = 24 = C(3,2)×8，公式同样一行搞定</text>
</svg>
