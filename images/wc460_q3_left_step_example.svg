<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">为什么 i−1（向左走）不可省？</text>
  <text x="320" y="56" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">n = 20：只有下标 0（值 2）和下标 9（值 7）是质数位置</text>

  <!-- teleport arcs -->
  <path d="M62,148 C140,104 300,104 378,148" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="100" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">① 传送 p=2：8 % 2 == 0（第 1 步）</text>

  <path d="M240,148 C260,74 452,74 472,148" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="68" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">③ 传送 p=7：21 % 7 == 0（第 3 步）</text>

  <!-- array row at y=150, h=46 -->
  <rect x="40" y="150" width="44" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="62" y="179" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="90" y="150" width="118" height="46" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="149" y="172" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">15 ··· 15（×8）</text>
  <text x="149" y="188" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">下标 1 – 8</text>

  <rect x="214" y="150" width="44" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="236" y="179" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>

  <rect x="264" y="150" width="44" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="286" y="179" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold" filter="url(#rough2)">8</text>

  <rect x="314" y="150" width="118" height="46" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373" y="172" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">15 ··· 15（×8）</text>
  <text x="373" y="188" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">下标 11 – 18</text>

  <rect x="438" y="150" width="44" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="460" y="179" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">21</text>

  <text x="62" y="216" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="236" y="216" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=9</text>
  <text x="286" y="216" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=10</text>
  <text x="460" y="216" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=19 终点</text>

  <!-- left step: U-shape from idx10 down-left-up into idx9 -->
  <path d="M286,202 L286,238 L262,238 L262,208" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="296" y="234" font-size="12" fill="#446688" filter="url(#rough2)">② 左移一步（i−1）</text>

  <!-- explanation boxes -->
  <rect x="40" y="262" width="546" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="313" y="284" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">若删去 i−1 转移（只许往右走）：最优只有 10 步</text>
  <text x="313" y="304" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">（走到 9 再传送：9+1 步；或先传送到 10 再走到头：1+9 步）</text>

  <rect x="40" y="332" width="546" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="313" y="354" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">完整 BFS：0 ⇢(p=2) 10 →(左移) 9 ⇢(p=7) 19，共 3 步</text>
  <text x="313" y="374" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">传送把质数位置"跳过头"时，必须能回头去用它的传送</text>
</svg>
