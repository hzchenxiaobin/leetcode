<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例走查：nums = [1,1,2]，k = 1</text>

  <!-- i = 0 -->
  <rect x="40" y="56" width="60" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="79" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">x = 1</text>
  <path d="M 104 73 L 130 73" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="140" y="56" width="96" height="34" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="188" y="79" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 1)</text>
  <text x="288" y="79" font-size="11" fill="#4a7a3a" filter="url(#rough2)">值 = k ⇒ 答案 +1</text>
  <text x="486" y="79" font-size="11" fill="#333" filter="url(#rough2)">ans = 1</text>

  <!-- i = 1 -->
  <rect x="40" y="118" width="60" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="141" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">x = 1</text>
  <path d="M 104 135 L 130 135" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="140" y="118" width="96" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="188" y="141" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">(1, 2)</text>
  <text x="288" y="141" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 &amp; 1 = 1，两条合并 ⇒ +2</text>
  <text x="486" y="141" font-size="11" fill="#333" filter="url(#rough2)">ans = 3</text>

  <!-- i = 2 -->
  <rect x="40" y="180" width="60" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="203" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">x = 2</text>
  <path d="M 104 197 L 130 197" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="140" y="180" width="80" height="34" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180" y="203" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2, 1)</text>
  <rect x="228" y="180" width="80" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="268" y="203" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">(0, 2)</text>
  <text x="330" y="203" font-size="11" fill="#b85450" filter="url(#rough2)">1 &amp; 2 = 0，无命中</text>
  <text x="486" y="203" font-size="11" fill="#333" filter="url(#rough2)">ans = 3</text>

  <path d="M 40 228 L 500 228" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">三个右端点结束后 ans 停在 3：子数组 [1]、[1]（下标 0 处）、[1,1]</text>
  <text x="260" y="278" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">注意 x = 1 时表里只有 (1,1)，不是两条 —— 当前元素单独成段</text>

  <rect x="110" y="294" width="300" height="38" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="319" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">答案 = 3</text>
</svg>
