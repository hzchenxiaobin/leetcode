<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="940" height="700" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">状态压缩 + minimax：dp[mask][pos]</text>
  <path d="M 280 42 Q 470 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: state definition ===== -->
  <g filter="url(#sk)"><rect x="50" y="66" width="410" height="248" rx="10" fill="#f4f2ec" stroke="#b9b29c" stroke-width="1.2"/></g>
  <text x="255" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">① 状态 = (马所在关键点, 已吃集合 mask)</text>

  <!-- bit string: 15 cells of 24x28 starting x=80 y=126 -->
  <g filter="url(#sk)" fill="#fffdf7" stroke="#ccc" stroke-width="1">
    <rect x="80" y="126" width="24" height="28"/><rect x="104" y="126" width="24" height="28"/><rect x="128" y="126" width="24" height="28"/><rect x="152" y="126" width="24" height="28"/><rect x="176" y="126" width="24" height="28"/><rect x="200" y="126" width="24" height="28"/><rect x="224" y="126" width="24" height="28"/><rect x="248" y="126" width="24" height="28"/><rect x="272" y="126" width="24" height="28"/><rect x="296" y="126" width="24" height="28"/><rect x="320" y="126" width="24" height="28"/><rect x="344" y="126" width="24" height="28"/><rect x="368" y="126" width="24" height="28"/><rect x="392" y="126" width="24" height="28"/><rect x="416" y="126" width="24" height="28"/>
  </g>
  <g filter="url(#sk)" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5">
    <rect x="80" y="126" width="24" height="28"/><rect x="128" y="126" width="24" height="28"/><rect x="152" y="126" width="24" height="28"/>
  </g>
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="92" y="145" fill="#2e6e2e" font-weight="bold">1</text><text x="116" y="145">0</text><text x="140" y="145" fill="#2e6e2e" font-weight="bold">1</text><text x="164" y="145" fill="#2e6e2e" font-weight="bold">1</text><text x="188" y="145">0</text><text x="212" y="145">0</text><text x="236" y="145">0</text><text x="260" y="145">0</text><text x="284" y="145">0</text><text x="308" y="145">0</text><text x="332" y="145">0</text><text x="356" y="145">0</text><text x="380" y="145">0</text><text x="404" y="145">0</text><text x="428" y="145">0</text>
  </g>
  <g font-size="9" fill="#999" text-anchor="middle">
    <text x="92" y="168">0</text><text x="116" y="168">1</text><text x="140" y="168">2</text><text x="164" y="168">3</text><text x="188" y="168">4</text><text x="212" y="168">5</text><text x="236" y="168">6</text><text x="260" y="168">7</text><text x="284" y="168">8</text><text x="308" y="168">9</text><text x="332" y="168">10</text><text x="356" y="168">11</text><text x="380" y="168">12</text><text x="404" y="168">13</text><text x="428" y="168">14</text>
  </g>
  <text x="255" y="192" text-anchor="middle" font-size="11" fill="#666">第 i 位 = 兵 i 是否已被吃（上例：兵 0、2、3 已吃）</text>

  <g filter="url(#sk)"><rect x="80" y="210" width="360" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="260" y="235" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">pos = 兵 3 —— 马总停在「起点或刚吃的兵」上</text>
  <text x="80" y="278" font-size="12" fill="#444" font-weight="bold">状态总数：</text>
  <text x="170" y="278" font-size="12" fill="#5a3a7a" font-family="monospace">2ⁿ × (n+1) = 32768 × 16 = 524288</text>
  <text x="80" y="300" font-size="11" fill="#888">n ≤ 15，这是状态压缩能承受的规模</text>

  <!-- ===== Panel 2: whose turn ===== -->
  <g filter="url(#sk)"><rect x="480" y="66" width="410" height="248" rx="10" fill="#f4f2ec" stroke="#b9b29c" stroke-width="1.2"/></g>
  <text x="685" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">② 轮到谁：popcount(mask) 的奇偶</text>

  <g filter="url(#sk)"><rect x="505" y="110" width="360" height="60" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="685" y="134" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">已吃兵数为偶数（含 0）→ Alice 回合</text>
  <text x="685" y="156" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">她要拖长 → 取 max</text>

  <g filter="url(#sk)"><rect x="505" y="182" width="360" height="60" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="685" y="206" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">已吃兵数为奇数 → Bob 回合</text>
  <text x="685" y="228" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">他要速通 → 取 min</text>

  <text x="685" y="270" text-anchor="middle" font-size="11" fill="#666">开局 mask = ∅，popcount = 0（偶）→ Alice 先手 ✓</text>
  <text x="685" y="292" text-anchor="middle" font-size="11" fill="#888">回合由 mask 自动推出，不必存进状态</text>

  <!-- ===== Panel 3: recurrence ===== -->
  <g filter="url(#sk)"><rect x="50" y="332" width="410" height="330" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="255" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">③ 转移（记忆化搜索）</text>
  <g font-size="12" fill="#333" font-family="monospace">
    <text x="80" y="392">dp[mask][i]：</text>
    <text x="100" y="416">= 0                          mask 满</text>
    <text x="100" y="448" fill="#b03a3a" font-weight="bold">= max{ d[i][j] + dp[mask|1&lt;&lt;j][j] }</text>
    <text x="270" y="466" fill="#b03a3a">Alice 回合</text>
    <text x="100" y="494" fill="#2b6e9e" font-weight="bold">= min{ d[i][j] + dp[mask|1&lt;&lt;j][j] }</text>
    <text x="270" y="512" fill="#2b6e9e">Bob 回合</text>
    <text x="80" y="546">（j 取遍 mask 外的兵，d = BFS 距离）</text>
    <text x="80" y="580" fill="#444" font-weight="bold">答案 = dp[∅][n]  （起点编号为 n）</text>
  </g>
  <text x="80" y="620" font-size="11" fill="#888">叶：兵全吃光，游戏结束，剩余步数 0；</text>
  <text x="80" y="640" font-size="11" fill="#888">每次吃兵 popcount 恰好 +1，天然无环。</text>

  <!-- ===== Panel 4: minimax mini tree + complexity ===== -->
  <g filter="url(#sk)"><rect x="480" y="332" width="410" height="330" rx="10" fill="#f4f2ec" stroke="#b9b29c" stroke-width="1.2"/></g>
  <text x="685" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">④ minimax 交替决策</text>

  <!-- max root -->
  <g filter="url(#sk)"><circle cx="685" cy="410" r="26" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="685" y="415" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">max</text>
  <!-- min nodes -->
  <g filter="url(#sk)"><circle cx="560" cy="500" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><circle cx="685" cy="500" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><circle cx="810" cy="500" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="560" y="505" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">min</text>
  <text x="685" y="505" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">min</text>
  <text x="810" y="505" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">min</text>
  <!-- leaves -->
  <g filter="url(#sk)" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3">
    <rect x="516" y="560" width="34" height="22" rx="4"/><rect x="558" y="576" width="34" height="22" rx="4"/>
    <rect x="668" y="560" width="34" height="22" rx="4"/><rect x="710" y="576" width="34" height="22" rx="4"/>
    <rect x="793" y="560" width="34" height="22" rx="4"/><rect x="835" y="576" width="34" height="22" rx="4"/>
  </g>
  <!-- edges -->
  <g stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#sk)">
    <path d="M 667 428 Q 600 452 570 480" marker-end="url(#ar)"/>
    <path d="M 685 436 L 685 472" marker-end="url(#ar)"/>
    <path d="M 703 428 Q 770 452 800 480" marker-end="url(#ar)"/>
    <path d="M 550 520 L 536 556" marker-end="url(#ar)"/><path d="M 572 520 L 576 572" marker-end="url(#ar)"/>
    <path d="M 675 520 L 682 556" marker-end="url(#ar)"/><path d="M 697 520 L 722 572" marker-end="url(#ar)"/>
    <path d="M 800 520 L 810 556" marker-end="url(#ar)"/><path d="M 822 520 L 848 572" marker-end="url(#ar)"/>
  </g>
  <text x="540" y="440" font-size="10" fill="#888">Alice 选兵</text>
  <text x="790" y="440" font-size="10" fill="#888" text-anchor="end">代价 d[i][j]</text>
  <text x="685" y="630" text-anchor="middle" font-size="11" fill="#666">对同一 (mask, pos) 只算一次 → 记忆化</text>
  <g filter="url(#sk)"><rect x="510" y="644" width="350" height="1" fill="#b9b29c"/></g>
  <text x="685" y="636" font-size="1" fill="#f4f2ec">.</text>
  <text x="685" y="658" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace" font-weight="bold">时间 O(2ⁿ·(n+1)·n) ≈ 7.9×10⁶</text>
</svg>
