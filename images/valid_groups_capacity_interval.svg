<svg xmlns="http://www.w3.org/2000/svg" width="640" height="392" viewBox="0 0 640 392" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="392" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">g 个盒子恰好装下 [g·x, g·(x+1)] 里的每个整数</text>
  <text x="320" y="52" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">q 个盒装 x+1、其余装 x ⇒ 总球数 = g·x + q，而 q ∈ [0, g] 连续取值</text>

  <!-- left panel: x = 2 -->
  <text x="165" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">x = 2（盒大小 ∈ {2, 3}）</text>
  <g font-size="11.5" fill="#555">
    <text x="30" y="122" text-anchor="end" filter="url(#sk)">g=1</text>
    <text x="30" y="157" text-anchor="end" filter="url(#sk)">g=2</text>
    <text x="30" y="192" text-anchor="end" filter="url(#sk)">g=3</text>
    <text x="30" y="227" text-anchor="end" filter="url(#sk)">g=4</text>
  </g>
  <g filter="url(#sk)">
    <rect x="78"  y="106" width="19"  height="20" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="116" y="141" width="38"  height="20" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="154" y="176" width="57"  height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="192" y="211" width="76"  height="20" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="182" y="191" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a10" filter="url(#sk)">盖住 7</text>
  <path d="M 173 96 L 173 248" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#sk)"/>
  <text x="173" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">f = 7</text>
  <path d="M 40 248 L 292 248" stroke="#666" stroke-width="1.4" filter="url(#sk)"/>
  <g font-size="10.5" fill="#666" text-anchor="middle">
    <text x="40"  y="264" filter="url(#sk)">0</text>
    <text x="78"  y="264" filter="url(#sk)">2</text>
    <text x="116" y="264" filter="url(#sk)">4</text>
    <text x="154" y="264" filter="url(#sk)">6</text>
    <text x="192" y="264" filter="url(#sk)">8</text>
    <text x="230" y="264" filter="url(#sk)">10</text>
    <text x="268" y="264" filter="url(#sk)">12</text>
  </g>
  <g filter="url(#sk)">
    <rect x="36" y="278" width="268" height="50" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" fill="#2e6e2e">
    <text x="170" y="298" text-anchor="middle" font-weight="bold" filter="url(#sk)">g_min = ⌈7/3⌉ = 3，且 3×2 = 6 ≤ 7 ✓</text>
    <text x="170" y="318" text-anchor="middle" filter="url(#sk)">→ 3 盒装法：2 + 2 + 3 = 7</text>
  </g>

  <!-- right panel: x = 4 -->
  <text x="478" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">x = 4（盒大小 ∈ {4, 5}）</text>
  <g font-size="11.5" fill="#555">
    <text x="344" y="122" text-anchor="end" filter="url(#sk)">g=1</text>
    <text x="344" y="157" text-anchor="end" filter="url(#sk)">g=2</text>
    <text x="344" y="192" text-anchor="end" filter="url(#sk)">g=3</text>
  </g>
  <g filter="url(#sk)">
    <rect x="424" y="106" width="16" height="20" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="488" y="141" width="32" height="20" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="552" y="176" width="48" height="20" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <path d="M 472 96 L 472 248" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#sk)"/>
  <text x="472" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">f = 7</text>
  <path d="M 441 132 Q 465 122 485 138" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="464" y="120" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">落在空档里</text>
  <path d="M 354 248 L 616 248" stroke="#666" stroke-width="1.4" filter="url(#sk)"/>
  <g font-size="10.5" fill="#666" text-anchor="middle">
    <text x="354" y="264" filter="url(#sk)">0</text>
    <text x="418" y="264" filter="url(#sk)">4</text>
    <text x="450" y="264" filter="url(#sk)">6</text>
    <text x="482" y="264" filter="url(#sk)">8</text>
    <text x="546" y="264" filter="url(#sk)">12</text>
    <text x="610" y="264" filter="url(#sk)">16</text>
  </g>
  <g filter="url(#sk)">
    <rect x="352" y="278" width="264" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" fill="#8a3a36">
    <text x="484" y="298" text-anchor="middle" font-weight="bold" filter="url(#sk)">g_min = ⌈7/5⌉ = 2，但 2×4 = 8 &gt; 7 ✗</text>
    <text x="484" y="318" text-anchor="middle" filter="url(#sk)">→ 盒数最少也得装 8 个，装不下 ⇒ x=4 不可行</text>
  </g>

  <!-- bottom strip -->
  <g filter="url(#sk)">
    <rect x="48" y="342" width="544" height="40" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="320" y="367" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">可行 ⟺ g_min·x ≤ f（下限装得下）；盒数 g_min = ⌈f/(x+1)⌉（上限够得着）——一次乘法定生死</text>
</svg>
