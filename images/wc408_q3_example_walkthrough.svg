<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="620" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：s = "101101"（示例 2）→ 答案 16</text>

  <!-- ===== string cells ===== -->
  <g filter="url(#rough2)">
    <rect x="236" y="44" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="284" y="44" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="332" y="44" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="380" y="44" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="428" y="44" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="476" y="44" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="260" y="66" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="308" y="66" text-anchor="middle" font-size="13" fill="#a07820" filter="url(#rough2)">0</text>
  <text x="356" y="66" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="404" y="66" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="452" y="66" text-anchor="middle" font-size="13" fill="#a07820" filter="url(#rough2)">0</text>
  <text x="500" y="66" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="260" y="94" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">0</text>
  <text x="308" y="94" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">1</text>
  <text x="356" y="94" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">2</text>
  <text x="404" y="94" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">3</text>
  <text x="452" y="94" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">4</text>
  <text x="500" y="94" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">5</text>
  <text x="380" y="118" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">1 的位置 p = [0, 2, 3, 5]　　0 的位置 zpos = [1, 4]</text>

  <!-- ===== table ===== -->
  <!-- header -->
  <rect x="35" y="132" width="690" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62"  y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">L</text>
  <text x="120" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">z</text>
  <text x="290" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">0 窗口 [r1, r2]</text>
  <text x="445" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">需 R ≥ Q<tspan dy="3" font-size="9">z²</tspan></text>
  <text x="572" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">有效 R</text>
  <text x="645" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">个数</text>
  <text x="708" y="152" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">小计</text>

  <!-- group shading: L = 0, 2, 4 -->
  <rect x="35" y="162" width="690" height="90" fill="#f2f6fb" filter="url(#rough2)"/>
  <rect x="35" y="312" width="690" height="60" fill="#f2f6fb" filter="url(#rough2)"/>
  <rect x="35" y="432" width="690" height="60" fill="#f2f6fb" filter="url(#rough2)"/>

  <!-- group separator lines -->
  <line x1="35" y1="252" x2="725" y2="252" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="35" y1="312" x2="725" y2="312" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="35" y1="372" x2="725" y2="372" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="35" y1="432" x2="725" y2="432" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="35" y1="492" x2="725" y2="492" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- L = 0 -->
  <text x="62" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <text x="120" y="182" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">0</text>
  <text x="290" y="182" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[0, 0]</text>
  <text x="445" y="182" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">—</text>
  <text x="572" y="182" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[0, 0]</text>
  <text x="645" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444" filter="url(#rough2)">1</text>
  <text x="120" y="212" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">1</text>
  <text x="290" y="212" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[1, 3]</text>
  <text x="445" y="212" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">Q₁ = 0</text>
  <text x="572" y="212" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[1, 3]</text>
  <text x="645" y="212" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444" filter="url(#rough2)">3</text>
  <text x="120" y="242" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">2</text>
  <text x="290" y="242" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[4, 5]</text>
  <text x="445" y="242" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">Q₄ = 5</text>
  <text x="572" y="242" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[5, 5]</text>
  <text x="645" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444" filter="url(#rough2)">1</text>
  <text x="708" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">5</text>

