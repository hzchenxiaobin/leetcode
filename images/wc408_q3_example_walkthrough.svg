  <text x="62" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="120" y="272" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">0</text>
  <text x="290" y="272" text-anchor="middle" font-size="11" font-style="italic" fill="#999999" filter="url(#rough2)">[1, 0] 空</text>
  <text x="445" y="272" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">—</text>
  <text x="572" y="272" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">—</text>
  <text x="645" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#999999" filter="url(#rough2)">0</text>
  <text x="120" y="302" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">1</text>
  <text x="290" y="302" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[1, 3]</text>
  <text x="445" y="302" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">Q₁ = 2</text>
  <text x="572" y="302" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[2, 3]</text>
  <text x="645" y="302" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444" filter="url(#rough2)">2</text>
  <text x="708" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">2</text>

  <!-- L = 2 -->
  <text x="62" y="332" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="120" y="332" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">0</text>
  <text x="290" y="332" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[2, 3]</text>
  <text x="445" y="332" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">—</text>
  <text x="572" y="332" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[2, 3]</text>
  <text x="645" y="332" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444" filter="url(#rough2)">2</text>
  <text x="120" y="362" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">1</text>
  <text x="290" y="362" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[4, 5]</text>
  <text x="445" y="362" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">Q₁ = 2</text>
  <text x="572" y="362" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[4, 5]</text>
  <text x="645" y="362" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444" filter="url(#rough2)">2</text>
  <text x="708" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">4</text>

  <!-- L = 3 -->
  <text x="62" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="120" y="392" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">0</text>
  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[3, 3]</text>
  <text x="445" y="392" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">—</text>
  <text x="572" y="392" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[3, 3]</text>
  <text x="645" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444" filter="url(#rough2)">1</text>
  <text x="120" y="422" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">1</text>
  <text x="290" y="422" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[4, 5]</text>
  <text x="445" y="422" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">Q₁ = 3</text>
  <text x="572" y="422" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[4, 5]</text>
  <text x="645" y="422" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444" filter="url(#rough2)">2</text>
  <text x="708" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>

  <!-- L = 4 -->
  <text x="62" y="452" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="120" y="452" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">0</text>
  <text x="290" y="452" text-anchor="middle" font-size="11" font-style="italic" fill="#999999" filter="url(#rough2)">[4, 3] 空</text>
  <text x="445" y="452" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">—</text>
  <text x="572" y="452" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">—</text>
  <text x="645" y="452" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#999999" filter="url(#rough2)">0</text>
  <text x="120" y="482" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">1</text>
  <text x="290" y="482" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[4, 5]</text>
  <text x="445" y="482" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">Q₁ = 5</text>
  <text x="572" y="482" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[5, 5]</text>
  <text x="645" y="482" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444" filter="url(#rough2)">1</text>
  <text x="708" y="482" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>

  <!-- L = 5 -->
  <text x="62" y="512" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <text x="120" y="512" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">0</text>
  <text x="290" y="512" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[5, 5]</text>
  <text x="445" y="512" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">—</text>
  <text x="572" y="512" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">[5, 5]</text>
  <text x="645" y="512" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444" filter="url(#rough2)">1</text>
  <text x="120" y="542" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">1</text>
  <text x="290" y="542" text-anchor="middle" font-size="11" font-style="italic" fill="#999999" filter="url(#rough2)">Z₁ 不存在 → break</text>
  <text x="445" y="542" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">—</text>
  <text x="572" y="542" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">—</text>
  <text x="645" y="542" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#999999" filter="url(#rough2)">0</text>
  <text x="708" y="542" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>

  <!-- total row -->
  <rect x="35" y="552" width="690" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="573" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">合计</text>
  <text x="645" y="573" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">16</text>
  <text x="708" y="573" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">= 5+2+4+3+1+1</text>

  <!-- table outer border -->
  <rect x="35" y="132" width="690" height="452" rx="4" fill="none" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="380" y="606" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">每对 (L, z) 的贡献 = r2 − max(r1, Q<tspan dy="3" font-size="8">z²</tspan><tspan dy="-3">) + 1；z = 0 时无 1 个数约束；0 不够或 1 不足 z² 个即终止内层循环</tspan></text>
</svg>
