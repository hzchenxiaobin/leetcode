<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：求和 → 差距 → 上取整 → 验证</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">三行算例覆盖：普通情况、大 limit 小差距、limit = 1 的极限</text>

  <!-- Column headers -->
  <g filter="url(#rough2)" font-size="11" fill="#555" font-weight="bold" text-anchor="middle">
    <text x="106" y="64">① 求和 S</text>
    <text x="238" y="64">② 差距 d</text>
    <text x="364" y="64">③ ⌈d/limit⌉</text>
    <text x="488" y="64">④ 验证</text>
  </g>

  <!-- Row 1: 示例 1 -->
  <text x="8" y="100" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="48" y="74" width="116" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="106" y="100" fill="#333">1+(−1)+1 = 1</text>
    <rect x="186" y="74" width="104" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="238" y="100" fill="#333">|−4−1| = 5</text>
    <rect x="312" y="74" width="104" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="364" y="100" fill="#333">⌈5/3⌉ = 2</text>
    <rect x="438" y="74" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="488" y="100" fill="#2f5d24" font-weight="bold">−3, −2 ✓</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 164 96 L 184 96" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)"/>
    <path d="M 290 96 L 310 96" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)"/>
    <path d="M 416 96 L 436 96" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)"/>
  </g>

  <!-- Row 2: 示例 2 -->
  <text x="8" y="160" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">示例 2</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="48" y="134" width="116" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="106" y="160" fill="#333">1−10+9+1 = 1</text>
    <rect x="186" y="134" width="104" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="238" y="160" fill="#333">|0−1| = 1</text>
    <rect x="312" y="134" width="104" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="364" y="160" fill="#333">⌈1/100⌉ = 1</text>
    <rect x="438" y="134" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="488" y="160" fill="#2f5d24" font-weight="bold">−1 ✓</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 164 156 L 184 156" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrB)"/>
    <path d="M 290 156 L 310 156" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrB)"/>
    <path d="M 416 156 L 436 156" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrB)"/>
  </g>

  <!-- Row 3: 示例 4 -->
  <text x="8" y="212" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 4</text>
  <text x="8" y="226" font-size="9" fill="#888" filter="url(#rough2)">limit=1</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="48" y="194" width="116" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="106" y="220" fill="#333">5+5 = 10</text>
    <rect x="186" y="194" width="104" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="238" y="220" fill="#333">|0−10| = 10</text>
    <rect x="312" y="194" width="104" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6"/>
    <text x="364" y="220" fill="#333">⌈10/1⌉ = 10</text>
    <rect x="438" y="194" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="488" y="220" fill="#2f5d24" font-weight="bold">10×(−1) ✓</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 164 216 L 184 216" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrB)"/>
    <path d="M 290 216 L 310 216" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrB)"/>
    <path d="M 416 216 L 436 216" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrB)"/>
  </g>

  <!-- Insight box -->
  <rect x="44" y="254" width="472" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">差距非零 ⇒ 上取整至少为 1（示例 2：d = 1、limit = 100 也要 1 块）</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">差距为零 ⇒ 公式 (0 + limit − 1) // limit = 0，无需特判</text>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">补砖方案：k−1 块 ±limit 整砖 + 1 块余数砖，余数 ∈ (0, limit] 必合法</text>

  <!-- Footer -->
  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">示例 4 展示 limit = 1 的最「碎」情形：答案就是坑深本身</text>
</svg>
