<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：fruits = [4,2,5]，baskets = [3,5,4]</text>
  <path d="M 140 42 Q 320 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1 -->
  <g filter="url(#sk)">
    <rect x="30" y="60" width="580" height="74" rx="8" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.2"/>
  </g>
  <text x="52" y="86" font-size="13" font-weight="bold" fill="#2b2b2b">第 1 步：处理 fruits[0] = 4</text>
  <text x="52" y="110" font-size="11" fill="#666">篮0：3 &lt; 4 ✗ → 篮1：5 ≥ 4 ✓</text>
  <g filter="url(#sk)">
    <rect x="330" y="76" width="56" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="400" y="76" width="56" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="470" y="76" width="56" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="358" y="93" text-anchor="middle" font-size="10" fill="#666">篮0</text>
  <text x="358" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">3 ✗</text>
  <text x="428" y="93" text-anchor="middle" font-size="10" fill="#666">篮1</text>
  <text x="428" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">5 ✓</text>
  <text x="498" y="93" text-anchor="middle" font-size="10" fill="#666">篮2</text>
  <text x="498" y="111" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">4</text>
  <text x="556" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">放入篮1</text>

  <!-- step 2 -->
  <g filter="url(#sk)">
    <rect x="30" y="148" width="580" height="74" rx="8" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.2"/>
  </g>
  <text x="52" y="174" font-size="13" font-weight="bold" fill="#2b2b2b">第 2 步：处理 fruits[1] = 2</text>
  <text x="52" y="198" font-size="11" fill="#666">篮0：空闲且 3 ≥ 2 ✓（最左侧可用）</text>
  <g filter="url(#sk)">
    <rect x="330" y="164" width="56" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="400" y="164" width="56" height="40" rx="6" fill="#efefef" stroke="#999999" stroke-width="1.4"/>
    <rect x="470" y="164" width="56" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="358" y="181" text-anchor="middle" font-size="10" fill="#666">篮0</text>
  <text x="358" y="199" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">3 ✓</text>
  <text x="428" y="181" text-anchor="middle" font-size="10" fill="#666">篮1</text>
  <text x="428" y="199" text-anchor="middle" font-size="11" font-weight="bold" fill="#777">已放4</text>
  <text x="498" y="181" text-anchor="middle" font-size="10" fill="#666">篮2</text>
  <text x="498" y="199" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">4</text>
  <text x="556" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">放入篮0</text>

  <!-- step 3 -->
  <g filter="url(#sk)">
    <rect x="30" y="236" width="580" height="74" rx="8" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.2"/>
  </g>
  <text x="52" y="262" font-size="13" font-weight="bold" fill="#2b2b2b">第 3 步：处理 fruits[2] = 5</text>
  <text x="52" y="286" font-size="11" fill="#666">篮0、篮1 已占用 → 篮2：4 &lt; 5 ✗</text>
  <g filter="url(#sk)">
    <rect x="330" y="252" width="56" height="40" rx="6" fill="#efefef" stroke="#999999" stroke-width="1.4"/>
    <rect x="400" y="252" width="56" height="40" rx="6" fill="#efefef" stroke="#999999" stroke-width="1.4"/>
    <rect x="470" y="252" width="56" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="358" y="269" text-anchor="middle" font-size="10" fill="#666">篮0</text>
  <text x="358" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#777">已放2</text>
  <text x="428" y="269" text-anchor="middle" font-size="10" fill="#666">篮1</text>
  <text x="428" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#777">已放4</text>
  <text x="498" y="269" text-anchor="middle" font-size="10" fill="#666">篮2</text>
  <text x="498" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">4 ✗</text>
  <text x="556" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">未放置 ✗</text>

  <!-- answer -->
  <g filter="url(#sk)">
    <rect x="190" y="322" width="260" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="346" text-anchor="middle" font-size="11" fill="#7a5415">未放置的水果数量</text>
  <text x="320" y="370" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a5415">= 1</text>
</svg>
