<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="43"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>
  <text x="310" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">破环为链：排序后拼接 +360° 双副本，滑动窗口登场</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">以极角 {0°, 45°, 270°, 350°}、angle = 25° 为例——最优窗口恰好跨过 0°</text>

  <!-- 左：极角圆 -->
  <g filter="url(#r)">
    <circle cx="140" cy="158" r="85" fill="none" stroke="#8a8a8a" stroke-width="1.6"/>
    <circle cx="140" cy="158" r="4" fill="#446688"/>
  </g>
  <g filter="url(#r)">
    <circle cx="225" cy="158" r="5" fill="#446688"/>
    <circle cx="200.1" cy="97.9" r="5" fill="#446688"/>
    <circle cx="140" cy="243" r="5" fill="#446688"/>
    <circle cx="223.7" cy="172.8" r="5" fill="#446688"/>
  </g>
  <text x="234" y="152" font-size="10" fill="#446688" filter="url(#r)">0°</text>
  <text x="200" y="90" font-size="10" fill="#446688" filter="url(#r)">45°</text>
  <text x="140" y="260" text-anchor="middle" font-size="10" fill="#446688" filter="url(#r)">270°</text>
  <text x="230" y="188" font-size="10" fill="#446688" filter="url(#r)">350°</text>
  <g filter="url(#r)">
    <path d="M 223.7,172.8 A 85,85 0 0 0 222.1,136.0" fill="none" stroke="#d6a040" stroke-width="4"/>
  </g>
  <text x="258" y="128" font-size="10.5" font-weight="bold" fill="#a67c1b" filter="url(#r)">跨 0° 的视野弧</text>
  <g filter="url(#r)">
    <line x1="255" y1="134" x2="230" y2="152" stroke="#a67c1b" stroke-width="1.2" marker-end="url(#ar)"/>
  </g>
  <text x="140" y="282" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">极角圆（正东 0°，逆时针为正）</text>

  <!-- 右上：说明框 -->
  <g filter="url(#r)">
    <rect x="312" y="58" width="290" height="118" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="457" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#r)">为什么要拼接双副本？</text>
  <text x="322" y="102" font-size="10.5" fill="#555" filter="url(#r)">窗口条件 θi − θj ≤ α 只覆盖「不跨 0°」</text>
  <text x="322" y="122" font-size="10.5" fill="#555" filter="url(#r)">的窗口；但最优窗口可能跨 0°（350° 盖住 5°）</text>
  <text x="322" y="142" font-size="10.5" fill="#555" filter="url(#r)">把每个极角 +360° 再接一份，圆环摊平成长链，</text>
  <text x="322" y="162" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#r)">跨 0° 的窗口 → 普通的线性窗口</text>

  <!-- 中：展开条带 8 块 -->
  <g filter="url(#r)">
    <rect x="81" y="214" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="139" y="214" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="197" y="214" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="255" y="214" width="52" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="313" y="214" width="52" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="371" y="214" width="52" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="429" y="214" width="52" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="487" y="214" width="52" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#r)">
    <text x="107" y="234">0°</text>
    <text x="165" y="234">45°</text>
    <text x="223" y="234">270°</text>
    <text x="281" y="234">350°</text>
    <text x="339" y="234">360°</text>
    <text x="397" y="234">405°</text>
    <text x="455" y="234">630°</text>
    <text x="513" y="234">710°</text>
  </g>
  <g filter="url(#r)">
    <path d="M 107,210 Q 223,184 339,210" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <text x="223" y="192" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">每个极角 +360° 拼接到末尾</text>
  <g filter="url(#r)">
    <rect x="250" y="206" width="116" height="48" rx="8" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4"/>
  </g>
  <text x="310" y="274" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#r)">窗口 [350°, 365°]：350° 与 0°（=360° 副本）同时入窗</text>
  <text x="310" y="294" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">双指针：右端 i 右推，左端 j 收缩到 θi − θj ≤ α + ε 为止</text>

  <!-- 底部两框 -->
  <g filter="url(#r)">
    <rect x="56" y="310" width="250" height="110" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="181" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#r)">⚠ 陷阱：angle = 360</text>
  <text x="66" y="354" font-size="10.5" fill="#555" filter="url(#r)">视野覆盖全平面 → 所有点都可见；</text>
  <text x="66" y="374" font-size="10.5" fill="#555" filter="url(#r)">若仍走双副本，窗口 [θ, θ+360] 会把</text>
  <text x="66" y="394" font-size="10.5" fill="#555" filter="url(#r)">同一点的两个副本同时计入！</text>
  <text x="66" y="412" font-size="10.5" font-weight="bold" fill="#b03a3a" filter="url(#r)">特判：直接返回 n + cnt</text>

  <g filter="url(#r)">
    <rect x="314" y="310" width="250" height="110" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="439" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">别忘了 + cnt</text>
  <text x="324" y="354" font-size="10.5" fill="#555" filter="url(#r)">与 location 重合的点无论怎么转</text>
  <text x="324" y="374" font-size="10.5" fill="#555" filter="url(#r)">都可见：atan2(0,0) 无意义，</text>
  <text x="324" y="394" font-size="10.5" fill="#555" filter="url(#r)">必须剔除出极角、单独计数 cnt</text>
  <text x="324" y="412" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#r)">最终：ans = max(窗口) + cnt</text>

  <text x="310" y="448" text-anchor="middle" font-size="11" fill="#999" filter="url(#r)">破环三件套：排序 → +360° 副本 → 双指针——循环问题线性化的通用套路</text>
</svg>
