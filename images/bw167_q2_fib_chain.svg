<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="580" height="350" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">斐波那契性可以逐项增量检查</text>
  <text x="290" y="68" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">nums = [1,1,1,1,2,3,5,1]  →  最长 nums[2..6] = [1,1,2,3,5]</text>
  <rect x="40" y="92" width="56" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="68" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="68" y="134" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=0</text>
  <rect x="106" y="92" width="56" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="134" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="134" y="134" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=1</text>
  <rect x="172" y="92" width="56" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="200" y="134" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="200" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="238" y="92" width="56" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="266" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="266" y="134" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=3</text>
  <text x="266" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="304" y="92" width="56" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="332" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="332" y="134" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=4</text>
  <text x="332" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="370" y="92" width="56" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="398" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="398" y="134" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=5</text>
  <text x="398" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="436" y="92" width="56" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="464" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="464" y="134" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=6</text>
  <text x="464" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="502" y="92" width="56" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="530" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="530" y="134" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">i=7</text>
  <text x="530" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <path d="M 96 178 L 96 190 L 320 190" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="120" y="186" text-anchor="start" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">条件成立就向右延伸</text>
  <rect x="40" y="200" width="500" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="224" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">ok(i)：nums[i] == nums[i-1] + nums[i-2]</text>
  <text x="58" y="244" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">子数组 [l..r] 斐波那契 ⟺ 所有 i ∈ [l+2, r] 都满足 ok(i)</text>
  <rect x="40" y="268" width="500" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="292" text-anchor="start" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">len[i] = len[i-1] + 1（ok 成立）  /  2（ok 失败）</text>
  <text x="58" y="314" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">失败时仍然是 2：任意相邻两项都合法，这是最容易写错的地方</text>
</svg>
