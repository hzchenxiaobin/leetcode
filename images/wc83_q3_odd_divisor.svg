<svg xmlns="http://www.w3.org/2000/svg" width="620" height="410" viewBox="0 0 620 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="410" fill="#fafafa"/>
  <text x="310.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">答案 = n 的奇数因子个数</text>
  <path d="M 160.0 44 Q 310.0 54 460.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="310.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">把 n 写成 2^t · m（m 为奇数），拆法数与 t 无关</text>
  <g filter="url(#rough2)"><rect x="50" y="88" width="230" height="168" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="165" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">n = 15 的 4 种拆法</text>
  <text x="165" y="132" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">k = 1 → [15]</text>
  <text x="165" y="158" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">k = 2 → [7, 8]</text>
  <text x="165" y="184" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">k = 3 → [4, 5, 6]</text>
  <text x="165" y="210" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">k = 5 → [1, 2, 3, 4, 5]</text>
  <path d="M 288 172 Q 318.0 172.0 348 172" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="350" y="88" width="220" height="168" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="460" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">15 = 3 × 5 的奇数因子</text>
  <text x="460" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">1</text>
  <text x="460" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">3</text>
  <text x="460" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">5</text>
  <text x="460" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">15</text>
  <text x="460" y="246" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">共 4 个</text>
  <g filter="url(#rough2)"><rect x="50" y="282" width="520" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="310.0" y="304" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">k 为奇数时对应奇数因子 k；k 为偶数时对应奇数因子 2n/k</text>
  <text x="310.0" y="322" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">n = 8·3 = 24 的奇数因子是 1、3（答案 2），2 的幂部分不影响</text>
  <text x="310.0" y="340" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">实现上仍以枚举 k 为主线：判定简单，且不依赖这条等价性</text>
  </svg>