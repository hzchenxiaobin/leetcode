<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>
  <rect width="620" height="440" fill="#fafafa"/>
  <text x="310" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">核心观察：逆中序（右 → 根 → 左）输出严格降序</text>
  <text x="310" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">BST 中序升序，反过来遍历就正好从最大值开始</text>
  <path d="M 170 117 L 105 158" stroke="#9aa5b5" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 170 117 L 235 158" stroke="#9aa5b5" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 105 192 L 70 233" stroke="#9aa5b5" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 105 192 L 140 233" stroke="#9aa5b5" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 235 192 L 200 233" stroke="#9aa5b5" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 235 192 L 270 233" stroke="#9aa5b5" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 140 267 L 165 308" stroke="#9aa5b5" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 270 267 L 305 308" stroke="#9aa5b5" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="170" cy="100" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="105" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="105" cy="175" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105" y="180" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="235" cy="175" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="235" y="180" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="70" cy="250" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="255" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="140" cy="250" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="255" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="200" cy="250" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="255" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="270" cy="250" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="255" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <circle cx="165" cy="325" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="330" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="305" cy="325" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="305" y="330" font-size="13" fill="#2f3f55" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="345" y="92" width="255" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="360" y="114" font-size="11.5" fill="#8a6a20" text-anchor="start" font-weight="bold" filter="url(#rough2)">为什么逆中序是对的？</text>
  <text x="360" y="136" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">① 右子树的所有值都大于根</text>
  <text x="360" y="154" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">② 根大于左子树的所有值</text>
  <text x="360" y="172" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">③ 先右、再根、后左，</text>
  <text x="360" y="188" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">   访问到的值只会越来越小</text>
  <path d="M 300 327 L 320 345" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="354" font-size="10" fill="#b85450" text-anchor="start" filter="url(#rough2)">最大值先被访问</text>
  <rect x="135" y="372" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="150.0" y="391" font-size="12" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="175" y="372" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="190.0" y="391" font-size="12" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="168" y="390" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">→</text>
  <rect x="215" y="372" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="230.0" y="391" font-size="12" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="208" y="390" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">→</text>
  <rect x="255" y="372" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="270.0" y="391" font-size="12" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="248" y="390" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">→</text>
  <rect x="295" y="372" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="310.0" y="391" font-size="12" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="288" y="390" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">→</text>
  <rect x="335" y="372" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="350.0" y="391" font-size="12" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="328" y="390" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">→</text>
  <rect x="375" y="372" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="390.0" y="391" font-size="12" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="368" y="390" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">→</text>
  <rect x="415" y="372" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="430.0" y="391" font-size="12" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="408" y="390" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">→</text>
  <rect x="455" y="372" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="470.0" y="391" font-size="12" fill="#8a3a36" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="448" y="390" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">→</text>
  <text x="310" y="420" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">逆中序输出：8 → 7 → 6 → 5 → 4 → 3 → 2 → 1 → 0（严格降序）</text>
</svg>
