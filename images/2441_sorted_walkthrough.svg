<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">双指针走查：成功路径与失败路径</text>
  <path d="M 190 38 Q 340 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- walkthrough A -->
  <text x="40" y="66" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">示例 2：nums = [−1,10,6,7,−7,1] → 排序 [−7,−1,1,6,7,10]</text>
  <g filter="url(#sk)">
    <rect x="40" y="76" width="600" height="24" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="11" fill="#444" font-weight="bold" filter="url(#sk)">
    <text x="70" y="92" text-anchor="middle">步骤</text>
    <text x="122" y="92" text-anchor="middle">l</text>
    <text x="166" y="92" text-anchor="middle">r</text>
    <text x="226" y="92" text-anchor="middle">nums[l]</text>
    <text x="302" y="92" text-anchor="middle">nums[r]</text>
    <text x="370" y="92" text-anchor="middle">sum</text>
    <text x="520" y="92" text-anchor="middle">动作</text>
  </g>
  <g filter="url(#sk)">
    <rect x="40" y="100" width="600" height="24" fill="none" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="11" fill="#444" font-family="monospace" filter="url(#sk)">
    <text x="70" y="116" text-anchor="middle">1</text>
    <text x="122" y="116" text-anchor="middle">0</text>
    <text x="166" y="116" text-anchor="middle">5</text>
    <text x="226" y="116" text-anchor="middle">−7</text>
    <text x="302" y="116" text-anchor="middle">10</text>
    <text x="370" y="116" text-anchor="middle">3</text>
  </g>
  <text x="520" y="116" text-anchor="middle" font-size="11" fill="#a06a10" font-family="monospace" filter="url(#sk)">sum&gt;0 → r−−</text>
  <g filter="url(#sk)">
    <rect x="40" y="124" width="600" height="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g font-size="11" fill="#2e6e2e" font-family="monospace" font-weight="bold" filter="url(#sk)">
    <text x="70" y="140" text-anchor="middle">2</text>
    <text x="122" y="140" text-anchor="middle">0</text>
    <text x="166" y="140" text-anchor="middle">4</text>
    <text x="226" y="140" text-anchor="middle">−7</text>
    <text x="302" y="140" text-anchor="middle">7</text>
    <text x="370" y="140" text-anchor="middle">0</text>
  </g>
  <text x="520" y="140" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" font-family="monospace" filter="url(#sk)">sum==0 → 返回 7 ✓</text>

  <!-- walkthrough B -->
  <text x="40" y="182" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#sk)">示例 3：nums = [−10,8,6,7,−2,−3] → 排序 [−10,−3,−2,6,7,8]</text>
  <g filter="url(#sk)">
    <rect x="40" y="192" width="600" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g font-size="11" fill="#444" font-weight="bold" filter="url(#sk)">
    <text x="70" y="208" text-anchor="middle">步骤</text>
    <text x="122" y="208" text-anchor="middle">l</text>
    <text x="166" y="208" text-anchor="middle">r</text>
    <text x="226" y="208" text-anchor="middle">nums[l]</text>
    <text x="302" y="208" text-anchor="middle">nums[r]</text>
    <text x="370" y="208" text-anchor="middle">sum</text>
    <text x="520" y="208" text-anchor="middle">动作</text>
  </g>
  <g filter="url(#sk)">
    <rect x="40" y="216" width="600" height="24" fill="none" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="11" fill="#444" font-family="monospace" filter="url(#sk)">
    <text x="70" y="232" text-anchor="middle">1</text>
    <text x="122" y="232" text-anchor="middle">0</text>
    <text x="166" y="232" text-anchor="middle">5</text>
    <text x="226" y="232" text-anchor="middle">−10</text>
    <text x="302" y="232" text-anchor="middle">8</text>
    <text x="370" y="232" text-anchor="middle">−2</text>
  </g>
  <text x="520" y="232" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace" filter="url(#sk)">sum&lt;0 → l++</text>
  <g filter="url(#sk)">
    <rect x="40" y="240" width="600" height="24" fill="none" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="11" fill="#444" font-family="monospace" filter="url(#sk)">
    <text x="70" y="256" text-anchor="middle">2</text>
    <text x="122" y="256" text-anchor="middle">1</text>
    <text x="166" y="256" text-anchor="middle">5</text>
    <text x="226" y="256" text-anchor="middle">−3</text>
    <text x="302" y="256" text-anchor="middle">8</text>
    <text x="370" y="256" text-anchor="middle">5</text>
  </g>
  <text x="520" y="256" text-anchor="middle" font-size="11" fill="#a06a10" font-family="monospace" filter="url(#sk)">sum&gt;0 → r−−</text>
  <g filter="url(#sk)">
    <rect x="40" y="264" width="600" height="24" fill="none" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="11" fill="#444" font-family="monospace" filter="url(#sk)">
    <text x="70" y="280" text-anchor="middle">3</text>
    <text x="122" y="280" text-anchor="middle">1</text>
    <text x="166" y="280" text-anchor="middle">4</text>
    <text x="226" y="280" text-anchor="middle">−3</text>
    <text x="302" y="280" text-anchor="middle">7</text>
    <text x="370" y="280" text-anchor="middle">4</text>
  </g>
  <text x="520" y="280" text-anchor="middle" font-size="11" fill="#a06a10" font-family="monospace" filter="url(#sk)">sum&gt;0 → r−−</text>
  <g filter="url(#sk)">
    <rect x="40" y="288" width="600" height="24" fill="none" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="11" fill="#444" font-family="monospace" filter="url(#sk)">
    <text x="70" y="304" text-anchor="middle">4</text>
    <text x="122" y="304" text-anchor="middle">1</text>
    <text x="166" y="304" text-anchor="middle">3</text>
    <text x="226" y="304" text-anchor="middle">−3</text>
    <text x="302" y="304" text-anchor="middle">6</text>
    <text x="370" y="304" text-anchor="middle">3</text>
  </g>
  <text x="520" y="304" text-anchor="middle" font-size="11" fill="#a06a10" font-family="monospace" filter="url(#sk)">sum&gt;0 → r−−</text>
  <g filter="url(#sk)">
    <rect x="40" y="312" width="600" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g font-size="11" fill="#b03a3a" font-family="monospace" font-weight="bold" filter="url(#sk)">
    <text x="70" y="328" text-anchor="middle">5</text>
    <text x="122" y="328" text-anchor="middle">1</text>
    <text x="166" y="328" text-anchor="middle">2</text>
    <text x="226" y="328" text-anchor="middle">−3</text>
    <text x="302" y="328" text-anchor="middle">−2</text>
    <text x="370" y="328" text-anchor="middle">−5</text>
  </g>
  <text x="520" y="328" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold" font-family="monospace" filter="url(#sk)">l 与 r 相邻→l++ 后 l≥r，返回 −1</text>

  <!-- key insight -->
  <g filter="url(#sk)">
    <rect x="40" y="360" width="600" height="52" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="60" y="382" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">关键：</text>
  <text x="108" y="382" font-size="12" fill="#444" filter="url(#sk)">r 从最大端出发只减不增，第一次 sum==0 时 nums[r] 就是全局最大配对正数；</text>
  <text x="60" y="402" font-size="12" fill="#444" filter="url(#sk)">指针相遇（l≥r）说明每个元素都被证明无配对，安全返回 −1。</text>
</svg>
