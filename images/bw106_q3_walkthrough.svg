<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：nums = [−2, 0, 2]，s = "RLL"，d = 3</text>

  <!-- 初始 -->
  <path d="M60 76 L460 76" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#999" text-anchor="middle">
    <text x="100" y="66">−2</text><text x="260" y="66">0</text><text x="420" y="66">2</text>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <circle cx="100" cy="76" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="100" y="81" fill="#2f4a66">R</text>
    <circle cx="260" cy="76" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="260" y="81" fill="#2f5527">L</text>
    <circle cx="420" cy="76" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="420" y="81" fill="#2f5527">L</text>
  </g>
  <text x="468" y="80" font-size="10.5" fill="#666" filter="url(#rough2)">初始</text>

  <!-- 箭头到终点 -->
  <g filter="url(#rough2)">
    <path d="M100 92 L100 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M260 92 L260 132" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M420 92 L420 132" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#666">
    <text x="112" y="114">+3</text>
    <text x="272" y="114">−3</text>
    <text x="432" y="114">−3</text>
  </g>

  <!-- 幻影终点 -->
  <path d="M60 148 L460 148" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#999" text-anchor="middle">
    <text x="160" y="172">1</text><text x="200" y="172">−3</text><text x="330" y="172">−1</text>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <circle cx="160" cy="148" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="160" y="153" fill="#2f4a66">R</text>
    <circle cx="200" cy="148" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="200" y="153" fill="#2f5527">L</text>
    <circle cx="330" cy="148" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="330" y="153" fill="#2f5527">L</text>
  </g>
  <text x="468" y="152" font-size="10.5" fill="#666" filter="url(#rough2)">幻影终态</text>
  <text x="260" y="192" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">排序后：[−3, −1, 1]（与真实碰撞世界的多重集完全相同）</text>

  <!-- 距离配对 -->
  <path d="M60 244 L460 244" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <circle cx="140" cy="244" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="140" y="249" fill="#2f4a66">−3</text>
    <circle cx="260" cy="244" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="260" y="249" fill="#2f5527">−1</text>
    <circle cx="380" cy="244" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="380" y="249" fill="#7a5a10">1</text>
  </g>
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="1.6" fill="none">
    <path d="M140 262 Q 200 282 254 262" marker-end="url(#arr)"/>
    <path d="M260 262 Q 320 296 374 262" marker-end="url(#arr)"/>
    <path d="M148 262 Q 260 312 372 262" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#8c3a36">
    <text x="176" y="290">(−1) − (−3) = 2</text>
    <text x="292" y="306">1 − (−1) = 2</text>
    <text x="150" y="330">1 − (−3) = 4　→　总和 2 + 2 + 4 = 8，返回 8 ✓</text>
  </g>
</svg>
