<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="89" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1.5 L 7.5 4.5 L 1 7.5" fill="none" stroke="#8a7a4e" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2 演算：d₁ = d₂ = 4，连中心 ⟹ 答案 5</text>
  <path d="M 160 38 Q 320 46 480 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- tree edges T1 -->
  <g filter="url(#sk)">
    <path d="M 160 262 L 88 236" fill="none" stroke="#8aa4bd" stroke-width="1.6"/>
    <path d="M 160 262 L 160 196" fill="none" stroke="#8aa4bd" stroke-width="1.6"/>
    <path d="M 160 262 L 238 236" fill="none" stroke="#8aa4bd" stroke-width="1.6"/>
    <path d="M 160 196 L 116 126" fill="none" stroke="#8aa4bd" stroke-width="1.6"/>
    <path d="M 160 196 L 168 92" fill="none" stroke="#8aa4bd" stroke-width="1.6"/>
    <path d="M 160 196 L 222 126" fill="none" stroke="#8aa4bd" stroke-width="1.6"/>
    <path d="M 238 236 L 300 208" fill="none" stroke="#8aa4bd" stroke-width="1.6"/>
  </g>
  <!-- diameter path T1 -->
  <path d="M 116 126 L 160 196 L 160 262 L 238 236 L 300 208" fill="none" stroke="#446688" stroke-width="3.4" stroke-linecap="round" filter="url(#sk)"/>
  <!-- tree edges T2 -->
  <g filter="url(#sk)">
    <path d="M 480 262 L 552 236" fill="none" stroke="#8aa4bd" stroke-width="1.6"/>
    <path d="M 480 262 L 480 196" fill="none" stroke="#8aa4bd" stroke-width="1.6"/>
    <path d="M 480 262 L 402 236" fill="none" stroke="#8aa4bd" stroke-width="1.6"/>
    <path d="M 480 196 L 524 126" fill="none" stroke="#8aa4bd" stroke-width="1.6"/>
    <path d="M 480 196 L 472 92" fill="none" stroke="#8aa4bd" stroke-width="1.6"/>
    <path d="M 480 196 L 418 126" fill="none" stroke="#8aa4bd" stroke-width="1.6"/>
    <path d="M 402 236 L 340 208" fill="none" stroke="#8aa4bd" stroke-width="1.6"/>
  </g>
  <!-- diameter path T2 -->
  <path d="M 524 126 L 480 196 L 480 262 L 402 236 L 340 208" fill="none" stroke="#446688" stroke-width="3.4" stroke-linecap="round" filter="url(#sk)"/>

  <!-- new edge -->
  <path d="M 160 262 L 480 262" fill="none" stroke="#b85450" stroke-width="2.6" stroke-dasharray="8 6" stroke-linecap="round" filter="url(#sk)"/>

  <!-- crossing path arcs -->
  <path d="M 300 208 Q 245 322 166 264" fill="none" stroke="#d6a040" stroke-width="3.4" stroke-linecap="round" filter="url(#sk)"/>
  <path d="M 474 264 Q 395 322 340 208" fill="none" stroke="#d6a040" stroke-width="3.4" stroke-linecap="round" filter="url(#sk)"/>

  <!-- nodes T1 -->
  <g filter="url(#sk)">
    <circle cx="160" cy="262" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <circle cx="88" cy="236" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="160" cy="196" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="238" cy="236" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="116" cy="126" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="168" cy="92" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="222" cy="126" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="300" cy="208" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <!-- nodes T2 -->
  <g filter="url(#sk)">
    <circle cx="480" cy="262" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <circle cx="552" cy="236" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="480" cy="196" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="402" cy="236" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="524" cy="126" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="472" cy="92" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="418" cy="126" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="340" cy="208" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>

  <!-- node labels T1 -->
  <g font-size="12" font-weight="bold" fill="#2b5a88" text-anchor="middle" filter="url(#sk)">
    <text x="160" y="267">0</text>
    <text x="88" y="241">1</text>
    <text x="160" y="201">2</text>
    <text x="238" y="241">3</text>
    <text x="116" y="131">4</text>
    <text x="168" y="97">5</text>
    <text x="222" y="131">7</text>
    <text x="300" y="213">6</text>
  </g>
  <!-- node labels T2 -->
  <g font-size="11" font-weight="bold" fill="#2b5a88" text-anchor="middle" filter="url(#sk)">
    <text x="480" y="267">0′</text>
    <text x="552" y="241">1′</text>
    <text x="480" y="201">2′</text>
    <text x="402" y="241">3′</text>
    <text x="524" y="131">4′</text>
    <text x="472" y="97">5′</text>
    <text x="418" y="131">7′</text>
    <text x="340" y="213">6′</text>
  </g>

  <!-- annotations -->
  <text x="150" y="52" text-anchor="middle" font-size="11" fill="#2b5a88" filter="url(#sk)">T₁：BFS¹(0) 最远点 4；BFS²(4) 最远距离 4</text>
  <text x="150" y="70" text-anchor="middle" font-size="11" fill="#2b5a88" filter="url(#sk)">蓝色即直径 4→2→0→3→6，d₁ = 4</text>
  <text x="490" y="52" text-anchor="middle" font-size="11" fill="#2b5a88" filter="url(#sk)">T₂ 同构：d₂ = 4</text>
  <text x="490" y="70" text-anchor="middle" font-size="11" fill="#2b5a88" filter="url(#sk)">半径 ⌈4/2⌉ = 2，中心 0′</text>
  <text x="320" y="248" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">新边：中心 0 — 0′</text>
  <text x="238" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#b06a10" filter="url(#sk)">ecc₁(0) = 2</text>
  <text x="402" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#b06a10" filter="url(#sk)">ecc₂(0′) = 2</text>
  <text x="320" y="286" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b06a10" filter="url(#sk)">+1</text>
  <text x="160" y="290" text-anchor="middle" font-size="10.5" fill="#a04038" filter="url(#sk)">中心</text>
  <text x="480" y="290" text-anchor="middle" font-size="10.5" fill="#a04038" filter="url(#sk)">中心</text>

  <!-- bottom band -->
  <g filter="url(#sk)">
    <rect x="40" y="352" width="560" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="376" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b5a88" filter="url(#sk)">ans = max(4, 4, 2 + 1 + 2) = 5</text>
  <text x="320" y="398" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">新直径的实现：6 → 3 → 0 —新边→ 0′ → 3′ → 6′，长 2 + 1 + 2 = 5</text>
  <text x="320" y="446" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">（橙色弧线表示跨树路径在树内走的两段：6→3→0 与 0′→3′→6′）</text>
</svg>
