<svg xmlns="http://www.w3.org/2000/svg" width="640" height="580" viewBox="0 0 640 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="580" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">三步判定流程：任一关失败，立即 false</text>
  <path d="M 150 40 Q 320 50 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk2)"><rect x="110" y="44" width="240" height="34" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="230" y="66" text-anchor="middle" font-size="12.5" fill="#2b4a6e">读入 leftChild / rightChild（n ≤ 10⁴）</text>
  <path d="M 230 78 L 230 100" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk2)"><polygon points="230,104 356,148 230,192 104,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="230" y="143" text-anchor="middle" font-size="12" fill="#7a5415">扫描入度：任一节点</text>
  <text x="230" y="161" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">入度 ≥ 2 ？</text>
  <path d="M 356 148 L 416 148" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="380" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">是</text>
  <g filter="url(#sk2)"><rect x="420" y="130" width="190" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="515" y="153" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36">false：有节点两个爹</text>
  <path d="M 230 192 L 230 214" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="242" y="208" font-size="12" font-weight="bold" fill="#2e5e22">否</text>

  <!-- diamond 2 -->
  <g filter="url(#sk2)"><polygon points="230,218 356,262 230,306 104,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="230" y="257" text-anchor="middle" font-size="12" fill="#7a5415">入度 = 0 的节点</text>
  <text x="230" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">个数恰为 1 ？</text>
  <path d="M 356 262 L 416 262" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="380" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk2)"><rect x="420" y="236" width="190" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="515" y="256" text-anchor="middle" font-size="12" fill="#8a3a36">false：无根（全成环）</text>
  <text x="515" y="274" text-anchor="middle" font-size="12" fill="#8a3a36">或多根（森林）</text>
  <path d="M 230 306 L 230 328" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="242" y="322" font-size="12" font-weight="bold" fill="#2e5e22">是</text>

  <!-- bfs step -->
  <g filter="url(#sk2)"><rect x="110" y="330" width="240" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="230" y="352" text-anchor="middle" font-size="12.5" fill="#2b4a6e">从根 BFS，标记 visited</text>
  <path d="M 230 364 L 230 388" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 3 -->
  <g filter="url(#sk2)"><polygon points="230,392 356,436 230,480 104,436" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="230" y="431" text-anchor="middle" font-size="12" fill="#7a5415">访问到的节点数</text>
  <text x="230" y="449" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">= n ？</text>
  <path d="M 356 436 L 416 436" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="380" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk2)"><rect x="420" y="410" width="190" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="515" y="430" text-anchor="middle" font-size="12" fill="#8a3a36">false：不连通或有环</text>
  <text x="515" y="448" text-anchor="middle" font-size="12" fill="#8a3a36">（藏环在此现形）</text>
  <path d="M 230 480 L 230 502" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="242" y="496" font-size="12" font-weight="bold" fill="#2e5e22">是</text>

  <!-- true -->
  <g filter="url(#sk2)"><rect x="110" y="504" width="240" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="230" y="529" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22">true：恰好一棵二叉树 ✓</text>

  <!-- bottom note -->
  <g filter="url(#sk2)"><rect x="40" y="552" width="560" height="22" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="567" text-anchor="middle" font-size="11.5" fill="#7a5415">三步各拦一种毛病：多父 → 无根/多根 → 环与断连；示例 3 死在第二步，藏环用例死在第三步</text>
</svg>
