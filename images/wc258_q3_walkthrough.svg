<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="119" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：乘积最大 ≠ 各自最长</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 320 66 L 320 392" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
    <text x="167" y="80" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">示例 2：s = “bb”</text>
  <g filter="url(#sk)">
    <rect x="98" y="92" width="34" height="30" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="134" y="92" width="34" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
    <text x="115" y="112" text-anchor="middle" font-size="13" fill="#333">b</text>
    <text x="151" y="112" text-anchor="middle" font-size="13" fill="#333">b</text>
    <text x="115" y="133" text-anchor="middle" font-size="9" fill="#999">0</text>
    <text x="151" y="133" text-anchor="middle" font-size="9" fill="#999">1</text>
  <g filter="url(#sk)">
    <rect x="34" y="142" width="266" height="58" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
    <text x="167" y="160" text-anchor="middle" font-size="10.5" fill="#555555">dp[01] = 1（“b”）</text>
    <text x="167" y="177" text-anchor="middle" font-size="10.5" fill="#555555">dp[10] = 1（“b”）</text>
    <text x="167" y="194" text-anchor="middle" font-size="10.5" fill="#7a5415" font-weight="bold">dp[11] = dp[00] + 2 = 2（s[0] = s[1]）</text>
  <g filter="url(#sk)">
    <rect x="34" y="212" width="266" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
    <text x="167" y="235" text-anchor="middle" font-size="11" fill="#a04040">全并一边：dp[11] × dp[00] = 2 × 0 = 0</text>
  <path d="M 167 250 L 167 258" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="34" y="262" width="266" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
    <text x="167" y="285" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">拆成两半：dp[01] × dp[10] = 1 × 1 = 1 ✓</text>
  <g filter="url(#sk)">
    <rect x="34" y="312" width="266" height="50" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
    <text x="167" y="332" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">答案 = 1</text>
    <text x="167" y="350" text-anchor="middle" font-size="10" fill="#87663a">合并出 “bb” 反而输给各拿一个 b</text>
    <text x="475" y="80" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">示例 1：s = “leetcodecom”</text>
  <g filter="url(#sk)">
    <rect x="342" y="92" width="22" height="26" rx="3" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/>
    <rect x="367" y="92" width="22" height="26" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="392" y="92" width="22" height="26" rx="3" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/>
    <rect x="417" y="92" width="22" height="26" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="442" y="92" width="22" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="467" y="92" width="22" height="26" rx="3" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/>
    <rect x="492" y="92" width="22" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="517" y="92" width="22" height="26" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="542" y="92" width="22" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="567" y="92" width="22" height="26" rx="3" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/>
    <rect x="592" y="92" width="22" height="26" rx="3" fill="#f7f7f7" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="353" y="110" text-anchor="middle" font-size="11" fill="#333">l</text>
    <text x="378" y="110" text-anchor="middle" font-size="11" fill="#333">e</text>
    <text x="403" y="110" text-anchor="middle" font-size="11" fill="#333">e</text>
    <text x="428" y="110" text-anchor="middle" font-size="11" fill="#333">t</text>
    <text x="453" y="110" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="478" y="110" text-anchor="middle" font-size="11" fill="#333">o</text>
    <text x="503" y="110" text-anchor="middle" font-size="11" fill="#333">d</text>
    <text x="528" y="110" text-anchor="middle" font-size="11" fill="#333">e</text>
    <text x="553" y="110" text-anchor="middle" font-size="11" fill="#333">c</text>
    <text x="578" y="110" text-anchor="middle" font-size="11" fill="#333">o</text>
    <text x="603" y="110" text-anchor="middle" font-size="11" fill="#333">m</text>
  </g>
  <g font-size="8" fill="#999" text-anchor="middle">
    <text x="353" y="130" text-anchor="middle" font-size="8" fill="#999">0</text>
    <text x="378" y="130" text-anchor="middle" font-size="8" fill="#999">1</text>
    <text x="403" y="130" text-anchor="middle" font-size="8" fill="#999">2</text>
    <text x="428" y="130" text-anchor="middle" font-size="8" fill="#999">3</text>
    <text x="453" y="130" text-anchor="middle" font-size="8" fill="#999">4</text>
    <text x="478" y="130" text-anchor="middle" font-size="8" fill="#999">5</text>
    <text x="503" y="130" text-anchor="middle" font-size="8" fill="#999">6</text>
    <text x="528" y="130" text-anchor="middle" font-size="8" fill="#999">7</text>
    <text x="553" y="130" text-anchor="middle" font-size="8" fill="#999">8</text>
    <text x="578" y="130" text-anchor="middle" font-size="8" fill="#999">9</text>
    <text x="603" y="130" text-anchor="middle" font-size="8" fill="#999">10</text>
  </g>
  <g filter="url(#sk)">
    <rect x="350" y="140" width="250" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
    <text x="475" y="158" text-anchor="middle" font-size="11" fill="#2b5b8a" font-weight="bold">m1 = {1,3,7} → “ete”</text>
    <text x="475" y="174" text-anchor="middle" font-size="9.5" fill="#4a6a8a">最低位 1、最高位 7：s[1] = s[7] → 外壳 +2</text>
  <path d="M 475 186 L 475 194" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="350" y="196" width="250" height="34" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/>
  </g>
    <text x="475" y="217" text-anchor="middle" font-size="10.5" fill="#555555">去掉两端剩 {3}：dp[{3}] = 1（“t”）</text>
  <path d="M 475 230 L 475 238" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="350" y="240" width="250" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
    <text x="475" y="261" text-anchor="middle" font-size="12" fill="#2b5b8a" font-weight="bold">dp[m1] = 1 + 2 = 3</text>
  <path d="M 475 274 L 475 282" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="350" y="284" width="250" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
    <text x="475" y="302" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">FULL ⊕ m1 ∋ {4,6,8} → “cdc”</text>
    <text x="475" y="318" text-anchor="middle" font-size="9.5" fill="#4a7a3a">补集内最优：dp[FULL ⊕ m1] ≥ 3</text>
  <path d="M 475 330 L 475 338" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="350" y="340" width="250" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
    <text x="475" y="366" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">3 × 3 = 9 = 答案</text>
  <g filter="url(#sk)">
    <rect x="24" y="398" width="592" height="32" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
    <text x="320" y="418" text-anchor="middle" font-size="11" fill="#7a5415">最优对 (p1*, p2*) 必被划分 m = idx(p1*) 覆盖 —— 枚举全部 m 即不漏最优</text>
</svg>
