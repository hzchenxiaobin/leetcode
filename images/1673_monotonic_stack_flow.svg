<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="44" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一遍扫描，条件弹栈，限流入栈</text>
  <path d="M 170 34 Q 320 42 470 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="220" y="44" width="200" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="63" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">开始：空栈，i = 0</text>
  <g filter="url(#sk)">
    <path d="M 320 74 L 320 90" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="240" y="94" width="160" height="28" rx="6" fill="#fffdf3" stroke="#8a949e" stroke-width="1.4"/>
  </g>
  <text x="320" y="112" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">x ← nums[i]</text>
  <g filter="url(#sk)">
    <path d="M 320 122 L 320 140" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <polygon points="320,148 456,192 320,236 184,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="320" y="186" font-size="12" fill="#333">栈非空 ∧ 栈顶 &gt; x</text>
    <text x="320" y="204" font-size="12" fill="#333">∧ (栈长−1)+(n−i) ≥ k ?</text>
  </g>
  <text x="482" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <path d="M 456 192 L 500 192" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="504" y="178" width="104" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="556" y="197" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">弹出栈顶</text>
  <g filter="url(#sk)">
    <path d="M 556 208 C 580 246, 486 250, 412 222" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" stroke-dasharray="5,4"/>
  </g>
  <text x="556" y="242" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">回到判断</text>

  <text x="328" y="252" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <path d="M 320 236 L 320 254" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <polygon points="320,262 398,290 320,318 242,290" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="294" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">栈长 &lt; k ?</text>
  <text x="414" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <path d="M 398 290 L 468 290" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="472" y="276" width="104" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="524" y="294" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">x 入栈</text>
  <g filter="url(#sk)">
    <path d="M 524 304 C 524 330, 418 328, 330 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <text x="340" y="312" text-anchor="start" font-size="11" fill="#b85450" filter="url(#sk)">否（栈满，丢弃 x）</text>
  <g filter="url(#sk)">
    <path d="M 320 318 L 320 334" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="240" y="338" width="160" height="28" rx="6" fill="#fffdf3" stroke="#8a949e" stroke-width="1.4"/>
  </g>
  <text x="320" y="356" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">i ← i + 1</text>

  <g filter="url(#sk)">
    <path d="M 240 352 L 96 352 L 96 108 L 230 108" stroke="#8a949e" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="150" y="100" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">i &lt; n，处理下一个</text>

  <g filter="url(#sk)">
    <path d="M 400 352 L 464 352" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="432" y="344" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">i = n</text>
  <g filter="url(#sk)">
    <rect x="468" y="338" width="154" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="545" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">返回栈（长 = k）</text>

  <g filter="url(#sk)">
    <rect x="60" y="388" width="520" height="38" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="320" y="406" font-size="11" fill="#888">弹栈守门保证「弹后仍可凑满 k」，入栈限流保证「栈长 ≤ k」</text>
    <text x="320" y="420" font-size="11" fill="#888">两者合起来 ⟹ 扫描结束时栈长恰为 k，栈本身即答案（无需截断）</text>
  </g>
</svg>
