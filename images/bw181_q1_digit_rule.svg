<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">有效数字整数：一个数字串，两个独立条件</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">s = to_string(n)：先看首位 s[0]，再扫描数字 x 是否出现</text>
  <text x="36" y="90" text-anchor="start" font-size="12.5" fill="#333" font-weight="bold">n = 101，x = 0</text>
  <rect x="140" y="100" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="167.0" y="132.76" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="167.0" y="172" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <rect x="202" y="100" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="229.0" y="132.76" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">0</text>
  <text x="229.0" y="172" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <rect x="264" y="100" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="291.0" y="132.76" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="291.0" y="172" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <rect x="60" y="100" width="62" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="91" y="117" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">首位</text>
  <path d="M 122 113 L 138 120" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="340" y="92" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="111" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">s[1] == '0' → 命中 x</text>
  <path d="M 340 107 L 262 124" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="188" width="300" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">含 0 ✓ 且不以 0 开头 ✓ → true</text>
  <text x="36" y="258" text-anchor="start" font-size="12.5" fill="#333" font-weight="bold">n = 232，x = 2</text>
  <rect x="140" y="268" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="162.0" y="295.04" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <text x="162.0" y="328" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <rect x="192" y="268" width="44" height="44" fill="#f2f2f2" stroke="#999999" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="214.0" y="295.04" text-anchor="middle" font-size="14" fill="#999999" font-weight="bold">3</text>
  <text x="214.0" y="328" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <rect x="244" y="268" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="266.0" y="295.04" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
  <text x="266.0" y="328" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <rect x="320" y="268" width="200" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="286" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">首位就是 2 → false</text>
  <path d="M 320 282 L 238 290" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="36" y="336" width="236" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="154" y="353" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">条件① 至少出现一次 x</text>
  <text x="154" y="367" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">s.find(c) != npos</text>
  <rect x="288" y="336" width="236" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="406" y="353" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">条件② 首位不是 x</text>
  <text x="406" y="367" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">s[0] != c</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">n = 0 时 s = "0"，首位正是 0 号数字，因此 x = 0 直接判 false</text>
</svg>
