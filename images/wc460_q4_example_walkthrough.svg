<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2, 3, 6, 7] → 答案 15</text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="16" y="52" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="88" y="52" width="72" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="160" y="52" width="118" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="278" y="52" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="326" y="52" width="148" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="474" y="52" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="516" y="52" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="52" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="124" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">AND(B)</text>
  <text x="219" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">T（补集）</text>
  <text x="302" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">τ</text>
  <text x="400" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">掩码后 {aᵢ&amp;~τ}</text>
  <text x="495" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">r</text>
  <text x="571" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">AND+τ+2r</text>

  <!-- row 1: B = empty -->
  <g filter="url(#rough2)">
    <rect x="16" y="82" width="72" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="88" y="82" width="72" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="160" y="82" width="118" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="278" y="82" width="48" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="326" y="82" width="148" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="474" y="82" width="42" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="516" y="82" width="110" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
  </g>
  <text x="52" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">∅</text>
  <text x="124" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="219" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{2,3,6,7}</text>
  <text x="302" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="400" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{2,3,6,7}</text>
  <text x="495" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="571" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">14</text>

  <!-- row 2: B = {2} -->
  <g filter="url(#rough2)">
    <rect x="16" y="114" width="72" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="88" y="114" width="72" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="160" y="114" width="118" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="278" y="114" width="48" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="326" y="114" width="148" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="474" y="114" width="42" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="516" y="114" width="110" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
  </g>
  <text x="52" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{2}</text>
  <text x="124" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="219" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{3,6,7}</text>
  <text x="302" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="400" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{1,4,5}</text>
  <text x="495" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="571" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">14</text>

  <!-- row 3: B = {3} -->
  <g filter="url(#rough2)">
    <rect x="16" y="146" width="72" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="88" y="146" width="72" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="160" y="146" width="118" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="278" y="146" width="48" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="326" y="146" width="148" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="474" y="146" width="42" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="516" y="146" width="110" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
  </g>
  <text x="52" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{3}</text>
  <text x="124" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="219" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{2,6,7}</text>
  <text x="302" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="400" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{0,4,4}</text>
  <text x="495" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="571" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">14</text>

  <!-- row 4: B = {7} -->
  <g filter="url(#rough2)">
    <rect x="16" y="178" width="72" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="88" y="178" width="72" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="160" y="178" width="118" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="278" y="178" width="48" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="326" y="178" width="148" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="474" y="178" width="42" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <rect x="516" y="178" width="110" height="32" fill="#fafafa" stroke="#999" stroke-width="1"/>
  </g>
  <text x="52" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{7}</text>
  <text x="124" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="219" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{2,3,6}</text>
  <text x="302" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="400" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{0,0,0}</text>
  <text x="495" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="571" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">14</text>

  <!-- row 5: B = {2,3} (optimal, highlighted) -->
  <g filter="url(#rough2)">
    <rect x="16" y="210" width="72" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="88" y="210" width="72" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="160" y="210" width="118" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="278" y="210" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="326" y="210" width="148" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="474" y="210" width="42" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="516" y="210" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="52" y="233" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">{2,3}</text>
  <text x="124" y="233" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="219" y="233" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">{6,7}</text>
  <text x="302" y="233" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="400" y="233" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">{6,6}</text>
  <text x="495" y="233" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="571" y="233" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">15 ★</text>

  <!-- optimal split annotation -->
  <text x="320" y="274" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">最优划分：A = {7}，B = {2,3}，C = {6}，即 XOR(7) + AND(2&amp;3) + XOR(6) = 7 + 2 + 6 = 15</text>

  <!-- why {2,3} -->
  <rect x="36" y="294" width="568" height="82" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="318" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">为什么把 3 也扔进 B 组？</text>
  <text x="320" y="340" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">3 留在 XOR 侧时与 6、7 抢关键位：f({3,6,7}) = 12；塞进 B 组后</text>
  <text x="320" y="360" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">AND(B) = 2&amp;3 = 2 一分不减，而 T = {6,7} 掩码后均为 6，r = 6，f = 1+12 = 13</text>

  <!-- caution -->
  <rect x="36" y="390" width="568" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="412" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">但元素也非越多越好：B = {2,3,6} 时 AND(B) = 2，T = {7}，f = 7 → 候选仅 9</text>
  <text x="320" y="436" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">「对 XOR 分组有害的元素，扔进 AND 组白拿」——这就是必须枚举全部 2ⁿ 个 B 的原因</text>
</svg>
