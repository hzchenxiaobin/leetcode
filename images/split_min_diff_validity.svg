<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 545"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="545" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：合法分割点构成连续区间</text>
  <text x="320" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">以 nums = [1,2,4,3] 为例（total = 10）</text>

  <!-- 递增前缀括号 -->
  <path d="M 126 84 L 126 78 L 449 78 L 449 84" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="287" y="72" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">最长严格递增前缀（L = 3）</text>

  <!-- 数组格子 -->
  <rect x="130" y="92" width="96" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="178" y="122" text-anchor="middle" font-size="20" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="238" y="92" width="96" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="286" y="122" text-anchor="middle" font-size="20" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="346" y="92" width="96" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="394" y="122" text-anchor="middle" font-size="20" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="454" y="92" width="96" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="502" y="122" text-anchor="middle" font-size="20" fill="#446688" filter="url(#rough2)">3</text>

  <!-- 递减后缀括号 -->
  <path d="M 342 148 L 342 154 L 557 154 L 557 148" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="449" y="170" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">最长严格递减后缀（起点 R = 2）</text>

  <!-- 列高亮：i=0 无效（红），i=1,2 有效（绿） -->
  <rect x="190" y="196" width="84" height="184" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="298" y="196" width="192" height="184" fill="#e6f4ea" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="232" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">i = 0</text>
  <text x="340" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">i = 1</text>
  <text x="448" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">i = 2</text>

  <!-- 行：分割方案 -->
  <text x="120" y="246" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">分割方案</text>
  <text x="232" y="246" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1] | [2,4,3]</text>
  <text x="340" y="246" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1,2] | [4,3]</text>
  <text x="448" y="246" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[1,2,4] | [3]</text>

  <!-- 行：left 递增 -->
  <text x="120" y="278" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">left 严格递增？</text>
  <text x="232" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="340" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="448" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 行：right 递减 -->
  <text x="120" y="310" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">right 严格递减？</text>
  <text x="232" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="340" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="448" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="232" y="328" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">（2 &lt; 4，不减）</text>

  <!-- 行：和 -->
  <text x="120" y="344" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">leftSum / rightSum</text>
  <text x="232" y="344" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1 / 9</text>
  <text x="340" y="344" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3 / 7</text>
  <text x="448" y="344" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">7 / 3</text>

  <!-- 行：绝对差 -->
  <text x="120" y="372" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">绝对差</text>
  <text x="232" y="374" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">—</text>
  <text x="340" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="448" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>

  <!-- 结论框 -->
  <rect x="40" y="400" width="560" height="125" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="426" text-anchor="middle" font-size="12" fill="#7a6020" filter="url(#rough2)">inc 合法 ⇔ i ≤ L−1（前缀连续段），dec 合法 ⇔ i+1 ≥ R（后缀连续段）</text>
  <text x="320" y="450" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a6020" filter="url(#rough2)">合法分割点 i ∈ [R−1, L−1] ∩ [0, n−2] = [1, 2]，是连续区间</text>
  <text x="320" y="474" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">标记一旦失效便不可恢复——出现 nums[j] ≥ nums[j+1] 后，更长的 left 必不再递增</text>
  <text x="320" y="498" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">等值相邻（nums[j] = nums[j+1]）会同时破坏两边的严格性</text>
</svg>
