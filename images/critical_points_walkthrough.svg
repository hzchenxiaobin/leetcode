<svg xmlns="http://www.w3.org/2000/svg" width="640" height="444" viewBox="0 0 640 444" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="444" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：[5,3,1,2,5,1,2] 滑动三元组走查</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- critical tags -->
  <text x="256" y="62" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">极小</text>
  <text x="384" y="62" text-anchor="middle" font-size="10.5" fill="#b07020" font-weight="bold">极大</text>
  <text x="448" y="62" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">极小</text>

  <!-- linked list boxes -->
  <g filter="url(#sk)">
    <rect x="100" y="66" width="56" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="164" y="66" width="56" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="228" y="66" width="56" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="292" y="66" width="56" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="356" y="66" width="56" height="46" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="420" y="66" width="56" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="484" y="66" width="56" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle" font-size="18" font-weight="bold" fill="#446688">
    <text x="128" y="94">5</text>
    <text x="192" y="94">3</text>
    <text x="256" y="94" fill="#2e6e2e">1</text>
    <text x="320" y="94">2</text>
    <text x="384" y="94" fill="#b07020">5</text>
    <text x="448" y="94" fill="#2e6e2e">1</text>
    <text x="512" y="94">2</text>
  </g>
  <g text-anchor="middle" font-size="9.5" fill="#889">
    <text x="128" y="126">i=0</text>
    <text x="192" y="126">i=1</text>
    <text x="256" y="126">i=2</text>
    <text x="320" y="126">i=3</text>
    <text x="384" y="126">i=4</text>
    <text x="448" y="126">i=5</text>
    <text x="512" y="126">i=6</text>
  </g>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="57" y="145" width="556" height="25" fill="#f0f0f0"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#555">
    <text x="81" y="161">pos</text>
    <text x="196" y="161">prev → curr → next</text>
    <text x="345" y="161">判定</text>
    <text x="509" y="161">first / prevIdx / minGap</text>
  </g>

  <!-- row tints -->
  <g filter="url(#sk)">
    <rect x="57" y="202" width="556" height="32" fill="#eaf6ee"/>
    <rect x="57" y="266" width="556" height="32" fill="#fff3d6"/>
    <rect x="57" y="298" width="556" height="32" fill="#eaf6ee"/>
    <rect x="57" y="330" width="556" height="32" fill="#f5f5f2"/>
  </g>

  <!-- table grid -->
  <g filter="url(#sk)" stroke="#999" stroke-width="1">
    <rect x="56" y="144" width="558" height="218" rx="6" fill="none"/>
    <line x1="106" y1="144" x2="106" y2="362"/>
    <line x1="286" y1="144" x2="286" y2="362"/>
    <line x1="404" y1="144" x2="404" y2="362"/>
    <line x1="56" y1="170" x2="614" y2="170" stroke-width="1.4"/>
    <line x1="56" y1="202" x2="614" y2="202"/>
    <line x1="56" y1="234" x2="614" y2="234"/>
    <line x1="56" y1="266" x2="614" y2="266"/>
    <line x1="56" y1="298" x2="614" y2="298"/>
    <line x1="56" y1="330" x2="614" y2="330"/>
  </g>

  <!-- rows -->
  <g text-anchor="middle" font-size="11">
    <text x="81" y="190" font-weight="bold" fill="#446688">1</text>
    <text x="196" y="190" fill="#446688">5 → <tspan font-weight="bold" fill="#a04040">3</tspan> → 1</text>
    <text x="345" y="190" font-size="10.5" fill="#557">3&lt;5 但 3&gt;1，非临界</text>
    <text x="509" y="190" font-size="10.5" fill="#557">−1 / −1 / ∞</text>

    <text x="81" y="222" font-weight="bold" fill="#446688">2</text>
    <text x="196" y="222" fill="#446688">3 → <tspan font-weight="bold" fill="#a04040">1</tspan> → 2</text>
    <text x="345" y="222" font-size="10.5" fill="#2e6e2e" font-weight="bold">1&lt;3 且 1&lt;2 → 极小 ✓</text>
    <text x="509" y="222" font-size="10.5" fill="#2e6e2e"><tspan font-weight="bold">2</tspan> / 2 / ∞（记 first）</text>

    <text x="81" y="254" font-weight="bold" fill="#446688">3</text>
    <text x="196" y="254" fill="#446688">1 → <tspan font-weight="bold" fill="#a04040">2</tspan> → 5</text>
    <text x="345" y="254" font-size="10.5" fill="#557">2&gt;1 但 2&lt;5，非临界</text>
    <text x="509" y="254" font-size="10.5" fill="#557">2 / 2 / ∞</text>

    <text x="81" y="286" font-weight="bold" fill="#446688">4</text>
    <text x="196" y="286" fill="#446688">2 → <tspan font-weight="bold" fill="#a04040">5</tspan> → 1</text>
    <text x="345" y="286" font-size="10.5" fill="#b07020" font-weight="bold">5&gt;2 且 5&gt;1 → 极大 ✓</text>
    <text x="509" y="286" font-size="10.5" fill="#557">2 / <tspan font-weight="bold">4</tspan> / minGap=2</text>

    <text x="81" y="318" font-weight="bold" fill="#446688">5</text>
    <text x="196" y="318" fill="#446688">5 → <tspan font-weight="bold" fill="#a04040">1</tspan> → 2</text>
    <text x="345" y="318" font-size="10.5" fill="#2e6e2e" font-weight="bold">1&lt;5 且 1&lt;2 → 极小 ✓</text>
    <text x="509" y="318" font-size="10.5" fill="#557">2 / <tspan font-weight="bold">5</tspan> / minGap=1 ★</text>

    <text x="81" y="350" font-weight="bold" fill="#446688">6</text>
    <text x="196" y="350" fill="#446688">1 → <tspan font-weight="bold" fill="#a04040">2</tspan> → <tspan fill="#999">∅</tspan></text>
    <text x="345" y="350" font-size="10.5" fill="#889">无后继，循环结束</text>
    <text x="509" y="350" font-size="10.5" fill="#889">→ 进入结算</text>
  </g>

  <!-- settlement -->
  <g filter="url(#sk)">
    <rect x="130" y="378" width="380" height="38" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="320" y="393" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">结算：first = 2，prevIdx = 5（最后临界点）</text>
  <text x="320" y="409" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">返回 [minGap = 1, maxGap = 5 − 2 = 3]</text>

  <text x="320" y="434" text-anchor="middle" font-size="10.5" fill="#888">相邻差（5−4=1）最小；首尾差（5−2=3）最大；pos 即当前节点下标（0 起）</text>
</svg>
