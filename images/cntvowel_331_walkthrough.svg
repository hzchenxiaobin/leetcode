<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：words = ["aba","bcb","ece","aa","e"]</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#666666">绿 = 元音（判定通过）　红 = 非元音（不通过）　蓝 = 前缀和　橙 = 查询结果</text>

  <!-- main table -->
  <g filter="url(#sk)">
    <rect x="25" y="54" width="590" height="186" rx="6" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="25" y="54" width="590" height="26" rx="6" fill="#e8f0fa" stroke="#3a3a3a" stroke-width="1.5"/>
    <line x1="75" y1="54" x2="75" y2="240" stroke="#8899aa" stroke-width="1"/>
    <line x1="185" y1="54" x2="185" y2="240" stroke="#8899aa" stroke-width="1"/>
    <line x1="245" y1="54" x2="245" y2="240" stroke="#8899aa" stroke-width="1"/>
    <line x1="305" y1="54" x2="305" y2="240" stroke="#8899aa" stroke-width="1"/>
    <line x1="375" y1="54" x2="375" y2="240" stroke="#8899aa" stroke-width="1"/>
    <line x1="490" y1="54" x2="490" y2="240" stroke="#8899aa" stroke-width="1"/>
    <line x1="25" y1="80" x2="615" y2="80" stroke="#8899aa" stroke-width="1"/>
    <line x1="25" y1="112" x2="615" y2="112" stroke="#8899aa" stroke-width="1"/>
    <line x1="25" y1="144" x2="615" y2="144" stroke="#8899aa" stroke-width="1"/>
    <line x1="25" y1="176" x2="615" y2="176" stroke="#8899aa" stroke-width="1"/>
    <line x1="25" y1="208" x2="615" y2="208" stroke="#8899aa" stroke-width="1"/>
  </g>

  <!-- header -->
  <text x="50" y="71" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">i</text>
  <text x="130" y="71" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">words[i]</text>
  <text x="215" y="71" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">首</text>
  <text x="275" y="71" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">末</text>
  <text x="340" y="71" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">b[i]</text>
  <text x="432" y="71" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">pre[i]</text>
  <text x="552" y="71" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">pre[i+1]</text>

  <!-- rows -->
  <text x="50" y="101" text-anchor="middle" font-size="12" fill="#555555">0</text>
  <text x="130" y="101" text-anchor="middle" font-size="12" fill="#2b2b2b">"aba"</text>
  <text x="215" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">a</text>
  <text x="275" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">a</text>
  <text x="340" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="432" y="101" text-anchor="middle" font-size="12" fill="#555555">0</text>
  <text x="552" y="101" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">1</text>

  <text x="50" y="133" text-anchor="middle" font-size="12" fill="#555555">1</text>
  <text x="130" y="133" text-anchor="middle" font-size="12" fill="#2b2b2b">"bcb"</text>
  <text x="215" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">b</text>
  <text x="275" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">b</text>
  <text x="340" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">0</text>
  <text x="432" y="133" text-anchor="middle" font-size="12" fill="#555555">1</text>
  <text x="552" y="133" text-anchor="middle" font-size="12" fill="#555555">1</text>

  <text x="50" y="165" text-anchor="middle" font-size="12" fill="#555555">2</text>
  <text x="130" y="165" text-anchor="middle" font-size="12" fill="#2b2b2b">"ece"</text>
  <text x="215" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">e</text>
  <text x="275" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">e</text>
  <text x="340" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="432" y="165" text-anchor="middle" font-size="12" fill="#555555">1</text>
  <text x="552" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">2</text>

  <text x="50" y="197" text-anchor="middle" font-size="12" fill="#555555">3</text>
  <text x="130" y="197" text-anchor="middle" font-size="12" fill="#2b2b2b">"aa"</text>
  <text x="215" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">a</text>
  <text x="275" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">a</text>
  <text x="340" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="432" y="197" text-anchor="middle" font-size="12" fill="#555555">2</text>
  <text x="552" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">3</text>

  <text x="50" y="229" text-anchor="middle" font-size="12" fill="#555555">4</text>
  <text x="130" y="229" text-anchor="middle" font-size="12" fill="#2b2b2b">"e" *</text>
  <text x="215" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">e</text>
  <text x="275" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">e</text>
  <text x="340" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="432" y="229" text-anchor="middle" font-size="12" fill="#555555">3</text>
  <text x="552" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">4</text>

  <text x="25" y="256" font-size="10.5" fill="#8a6415">* "e" 长度为 1：首末是同一个字符，仍判 1，无需特判；每行的 pre[i+1] 恰是下一行的 pre[i]（阶梯递推）</text>

  <!-- query table -->
  <text x="25" y="280" font-size="12.5" font-weight="bold" fill="#8a6415">三个查询逐一差分（每次 O(1)）：</text>
  <g filter="url(#sk)">
    <rect x="25" y="288" width="590" height="108" rx="6" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="25" y="288" width="590" height="24" rx="6" fill="#e8f0fa" stroke="#3a3a3a" stroke-width="1.5"/>
    <line x1="165" y1="288" x2="165" y2="396" stroke="#8899aa" stroke-width="1"/>
    <line x1="465" y1="288" x2="465" y2="396" stroke="#8899aa" stroke-width="1"/>
    <line x1="25" y1="312" x2="615" y2="312" stroke="#8899aa" stroke-width="1"/>
    <line x1="25" y1="340" x2="615" y2="340" stroke="#8899aa" stroke-width="1"/>
    <line x1="25" y1="368" x2="615" y2="368" stroke="#8899aa" stroke-width="1"/>
  </g>
  <text x="95" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">查询 [l, r]</text>
  <text x="315" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">差分计算</text>
  <text x="540" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">结果</text>

  <text x="95" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">[0,2]</text>
  <text x="315" y="330" text-anchor="middle" font-size="12" fill="#2b2b2b">pre[3] − pre[0] = 2 − 0</text>
  <text x="540" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">2</text>

  <text x="95" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">[1,4]</text>
  <text x="315" y="358" text-anchor="middle" font-size="12" fill="#2b2b2b">pre[5] − pre[1] = 4 − 1</text>
  <text x="540" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">3</text>

  <text x="95" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">[1,1]</text>
  <text x="315" y="386" text-anchor="middle" font-size="12" fill="#2b2b2b">pre[2] − pre[1] = 1 − 1</text>
  <text x="540" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">0</text>

  <!-- summary -->
  <g filter="url(#sk)">
    <rect x="55" y="410" width="530" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="427" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 [2, 3, 0] ✓　——　pre 只建一次，全部查询共花 O(q)</text>
  <text x="320" y="444" text-anchor="middle" font-size="10.5" fill="#555555">示例 2 自检：b = [1,1,1]，pre = [0,1,2,3] → [3,2,1] ✓</text>
</svg>
