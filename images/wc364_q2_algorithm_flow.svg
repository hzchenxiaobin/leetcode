<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="63" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：枚举峰 + 双向传播 —— O(n²) 即本题赛时正解</text>
  <text x="340" y="53" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">峰与峰之间互不依赖：每个峰独立做一趟线性扫描，想清楚一个峰就赢下整题</text>

  <g filter="url(#sk)">
    <rect x="150" y="74" width="300" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="150" y="130" width="300" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="150" y="184" width="300" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="150" y="254" width="300" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="150" y="324" width="300" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <polygon points="222,410 300,378 378,410 300,442" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="466" y="388" width="140" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>

  <g text-anchor="middle" filter="url(#sk)">
    <text x="300" y="100" font-size="13.5" fill="#6a4a10" font-weight="bold">① 枚举峰 i = 0, 1, …, n−1</text>
    <text x="300" y="155" font-size="13" fill="#2b4a6b">② sum = cur = h[i]</text>
    <text x="300" y="206" font-size="13" fill="#2b4a6b" font-weight="bold">③ 向左传播：j 从 i−1 到 0</text>
    <text x="300" y="227" font-size="11.5" fill="#446688">cur = min(cur, h[j])，sum += cur</text>
    <text x="300" y="276" font-size="13" fill="#2b4a6b" font-weight="bold">④ 向右传播：j 从 i+1 到 n−1</text>
    <text x="300" y="297" font-size="11.5" fill="#446688">cur = min(cur, h[j])，sum += cur</text>
    <text x="300" y="349" font-size="13" fill="#2d4f24" font-weight="bold">⑤ ans = max(ans, sum)</text>
    <text x="300" y="415" font-size="12.5" fill="#2b4a6b">还有峰？</text>
    <text x="536" y="415" font-size="13.5" fill="#3a6a2a" font-weight="bold">返回 ans</text>
  </g>

  <g fill="none" stroke="#888" stroke-width="1.6" filter="url(#sk)">
    <path d="M 300 116 L 300 128" marker-end="url(#arr)"/>
    <path d="M 300 170 L 300 182" marker-end="url(#arr)"/>
    <path d="M 300 240 L 300 252" marker-end="url(#arr)"/>
    <path d="M 300 310 L 300 322" marker-end="url(#arr)"/>
    <path d="M 300 364 L 300 376" marker-end="url(#arr)"/>
    <path d="M 378 410 L 462 410" marker-end="url(#arr)"/>
    <path d="M 222 410 L 84 410 L 84 95 L 144 95" marker-end="url(#arr)"/>
  </g>
  <text x="416" y="402" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">否</text>
  <text x="150" y="400" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">是：下一个峰</text>

  <!-- overflow warning card -->
  <rect x="496" y="118" width="166" height="112" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="579" y="142" font-size="12" font-weight="bold" fill="#8a3a3a">⚠ 全程 long long</text>
    <text x="579" y="162" font-size="11" fill="#a04a48">sum 上界 ≈</text>
    <text x="579" y="180" font-size="11.5" fill="#a04a48" font-weight="bold">10³ × 10⁹ = 10¹²</text>
    <text x="579" y="200" font-size="10.5" fill="#a04a48">int32 只有 ≈ 2.1×10⁹</text>
  </g>

  <text x="536" y="458" text-anchor="middle" font-size="11.5" fill="#3a6a2a" font-weight="bold" filter="url(#sk)">O(n²) ≈ 10⁶ 次运算，n ≤ 10³ 稳过</text>
</svg>
