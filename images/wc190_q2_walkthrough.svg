<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="404" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "abciiidef"，k = 3</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">v = 1 0 0 1 1 1 0 1 0，共 n−k+1 = 7 个窗口</text>

  <!-- 表头 -->
  <rect x="96" y="58" width="372" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">
    <text x="138" y="77">起点 i</text>
    <text x="232" y="77">窗口 s[i..i+2]</text>
    <text x="330" y="77">cur</text>
    <text x="422" y="77">best</text>
  </g>

  <!-- i = 3 命中上界，整行高亮 -->
  <rect x="96" y="176" width="372" height="30" fill="#e6f4ea" opacity="0.9" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1" fill="none">
    <line x1="96" y1="116" x2="468" y2="116"/>
    <line x1="96" y1="146" x2="468" y2="146"/>
    <line x1="96" y1="176" x2="468" y2="176"/>
    <line x1="96" y1="206" x2="468" y2="206"/>
    <line x1="96" y1="236" x2="468" y2="236"/>
    <line x1="96" y1="266" x2="468" y2="266"/>
    <line x1="180" y1="58" x2="180" y2="296"/>
    <line x1="284" y1="58" x2="284" y2="296"/>
    <line x1="376" y1="58" x2="376" y2="296"/>
    <rect x="96" y="58" width="372" height="238" stroke="#888" stroke-width="1.4"/>
  </g>

  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="138" y="105">0</text><text x="232" y="105">"abc"</text><text x="330" y="105">1</text><text x="422" y="105">1</text>
    <text x="138" y="135">1</text><text x="232" y="135">"bci"</text><text x="330" y="135">1</text><text x="422" y="135">1</text>
    <text x="138" y="165">2</text><text x="232" y="165">"cii"</text><text x="330" y="165">2</text><text x="422" y="165">2</text>
    <text x="138" y="195">3</text><text x="232" y="195">"iii"</text><text x="330" y="195">3</text><text x="422" y="195">3</text>
    <text x="138" y="225">4</text><text x="232" y="225">"iid"</text><text x="330" y="225">2</text><text x="422" y="225">3</text>
    <text x="138" y="255">5</text><text x="232" y="255">"ide"</text><text x="330" y="255">2</text><text x="422" y="255">3</text>
    <text x="138" y="285">6</text><text x="232" y="285">"def"</text><text x="330" y="285">1</text><text x="422" y="285">3</text>
  </g>

  <text x="480" y="195" font-size="10" fill="#4a7a3a" filter="url(#rough2)">达到 k</text>
  <text x="480" y="209" font-size="10" fill="#4a7a3a" filter="url(#rough2)">可提前停</text>

  <rect x="60" y="306" width="440" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74" y="326" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">2 → 3：cur = 2 − v[2] + v[5] = 2 − 0 + 1 = 3（首次触到上界）</text>
  <text x="74" y="346" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">3 → 4：cur = 3 − v[3] + v[6] = 3 − 1 + 0 = 2（移出元音 i，移入辅音 d）</text>
  <text x="74" y="366" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">best 只在变大时更新，故全程单调不减，终值即全局最大窗口和</text>
  <text x="74" y="384" font-size="10.5" fill="#b85450" filter="url(#rough2)">答案 = 3，对应子串 "iii"（下标 3、4、5）</text>
</svg>
