<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="540" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：单调队列维护「窗口 [i−k, i−1] 内 dp 的最大值」</text>
  <path d="M 170 34 Q 320 44 470 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="215" y="46" width="210" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="68" text-anchor="middle" font-size="11.5" fill="#2e5a24" filter="url(#sk)">初始化：dp[0]=nums[0]，队列 q ← [0]（存下标）</text>
  <path d="M 320 80 L 320 96" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#sk)"/>

  <!-- for loop -->
  <g filter="url(#sk)">
    <rect x="185" y="100" width="270" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="123" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#sk)">循环 i = 1 … n−1（每轮处理下标 i）</text>
  <path d="M 320 138 L 320 154" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#sk)"/>

  <!-- diamond 1: expiry -->
  <g filter="url(#sk)">
    <path d="M 320 158 L 432 197 L 320 236 L 208 197 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">队头 &lt; i − k ？</text>
  <text x="320" y="210" text-anchor="middle" font-size="10" fill="#8a6415" filter="url(#sk)">（队头滑出窗口）</text>

  <!-- yes: pop_front -->
  <text x="442" y="188" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">是</text>
  <path d="M 432 197 L 451 197" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="455" y="166" width="168" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)" text-anchor="middle">
    <text x="539" y="186" font-size="12" font-weight="bold" fill="#8f3830">过期出队 pop_front()</text>
    <text x="539" y="204" font-size="10.5" fill="#8f3830">队头下标已离开窗口</text>
    <text x="539" y="220" font-size="10.5" fill="#8f3830">不可能再当最大</text>
  </g>
  <path d="M 539 164 C 536 126, 420 128, 356 160" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#arrBlue)" filter="url(#sk)"/>

  <!-- no: query -->
  <text x="332" y="254" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">否</text>
  <path d="M 320 236 L 320 254" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="185" y="258" width="270" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5a24" filter="url(#sk)">查询：best ← dp[队头]</text>
  <text x="320" y="294" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">dp[i] ← nums[i] + best（队头即窗口最大）</text>
  <path d="M 320 302 L 320 318" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#sk)"/>

  <!-- diamond 2: pop back -->
  <g filter="url(#sk)">
    <path d="M 320 322 L 432 361 L 320 400 L 208 361 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">队尾 dp[队尾] ≤ dp[i] ？</text>
  <text x="320" y="374" text-anchor="middle" font-size="10" fill="#8a6415" filter="url(#sk)">（更小且更早 → 可丢弃）</text>

  <!-- yes: pop_back -->
  <text x="442" y="352" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">是</text>
  <path d="M 432 361 L 451 361" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="455" y="330" width="168" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)" text-anchor="middle">
    <text x="539" y="349" font-size="12" font-weight="bold" fill="#8f3830">弹尾出队 pop_back()</text>
    <text x="539" y="365" font-size="10.5" fill="#8f3830">dp 不更大且下标更早</text>
    <text x="539" y="381" font-size="10.5" fill="#8f3830">永不复用，安全丢弃</text>
  </g>
  <path d="M 539 328 C 542 298, 458 298, 366 316" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#arrBlue)" filter="url(#sk)"/>

  <!-- no: push back -->
  <text x="332" y="418" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">否</text>
  <path d="M 320 400 L 320 418" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="185" y="422" width="270" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="446" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#sk)">push_back(i)：i 入队尾（供后续窗口查询）</text>

  <!-- loop back -->
  <path d="M 185 442 L 108 442 L 108 119 L 181 119" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arrBlue)" filter="url(#sk)"/>
  <text x="146" y="434" font-size="10" fill="#666" text-anchor="middle" filter="url(#sk)">i++（下一轮）</text>

  <!-- exit -->
  <path d="M 455 442 L 545 442 L 545 458" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#sk)"/>
  <text x="500" y="434" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#sk)">循环完</text>
  <g filter="url(#sk)">
    <rect x="475" y="462" width="140" height="40" rx="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="545" y="487" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#sk)">返回 dp[n−1]</text>

  <!-- bottom notes -->
  <g filter="url(#sk)" text-anchor="middle">
    <text x="170" y="507" font-size="10.5" fill="#666">⚠ 顺序不能反：先过期出队 → 再查询 → 最后入队</text>
    <text x="170" y="526" font-size="10.5" fill="#666">查询时队列必非空：i−1 恒在窗口内</text>
  </g>
</svg>
