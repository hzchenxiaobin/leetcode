<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="500" height="370" fill="#fafafa"/>

  <text x="250" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程（I 版）</text>
  <text x="250" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">BFS 求最大深度，再算 2^(d-1) mod 1e9+7</text>
  <rect x="110" y="56" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250.0" y="78.0" font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">建邻接表（无向）</text>
  <path d="M 250.0 92 L 250.0 108" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="112" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250.0" y="134.0" font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">BFS 从节点 1 出发求 depth[]</text>
  <path d="M 250.0 148 L 250.0 164" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="168" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250.0" y="190.0" font-size="11" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">maxDepth = max(depth)</text>
  <path d="M 250.0 204 L 250.0 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="224" width="280" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250.0" y="246.0" font-size="11" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">快速幂 2^(maxDepth-1) mod 1e9+7</text>
  <text x="40" y="320" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">n ≥ 2，所以 maxDepth ≥ 1，指数非负；BFS 复杂度 O(n)</text>
</svg>
