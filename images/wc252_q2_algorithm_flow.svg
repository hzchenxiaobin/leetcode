<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="740" height="400" fill="#fafafa"/>
  <text x="370" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟求和与最值，一个比较出答案</text>
  <path d="M 190 40 Q 370 50 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start pill -->
  <g filter="url(#sk)"><rect x="24" y="108" width="104" height="44" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="76" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4a6e">输入 milestones</text>
  <text x="76" y="142" text-anchor="middle" font-size="9" fill="#446688">1 ≤ n ≤ 10⁵ · aᵢ ≤ 10⁹</text>

  <path d="M 128 130 L 144 130" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- one-pass box -->
  <g filter="url(#sk)"><rect x="148" y="108" width="164" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8"/></g>
  <text x="230" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">一趟遍历</text>
  <text x="230" y="143" text-anchor="middle" font-size="10.5" fill="#446688">S = Σaᵢ，M = max aᵢ</text>

  <path d="M 312 130 L 328 130" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- rest box -->
  <g filter="url(#sk)"><rect x="332" y="108" width="104" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8"/></g>
  <text x="384" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">rest = S − M</text>

  <path d="M 436 130 L 450 130" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision diamond -->
  <g filter="url(#sk)"><polygon points="518,90 584,130 518,170 452,130" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="518" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">M ≤ rest+1 ?</text>
  <text x="518" y="143" text-anchor="middle" font-size="9.5" fill="#a06a14">（即 2M ≤ S+1）</text>

  <!-- yes branch -->
  <path d="M 584 130 L 606 130" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="596" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>

  <g filter="url(#sk)"><rect x="610" y="106" width="106" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="663" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25">return S</text>
  <text x="663" y="144" text-anchor="middle" font-size="10.5" fill="#2f5d25">全部完成</text>

  <!-- no branch -->
  <path d="M 518 170 L 518 282" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="528" y="232" text-anchor="start" font-size="11" fill="#b85450">否</text>

  <g filter="url(#sk)"><rect x="452" y="286" width="132" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="518" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36">return 2·rest+1</text>
  <text x="518" y="328" text-anchor="middle" font-size="10" fill="#8a3a36">A 只能做 rest+1 个</text>

  <!-- complexity strip -->
  <g filter="url(#sk)"><rect x="24" y="356" width="710" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="379" y="378" text-anchor="middle" font-size="11.5" fill="#2c4a6e">O(n) 时间 · O(1) 空间 · 大根堆模拟为 O(S·log n) 且 S 可达 10¹⁴，完全不可行 —— 必须一步公式</text>
</svg>
