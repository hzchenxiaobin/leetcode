<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：m = 5 与 m = 8</text>
  <path d="M 150 40 Q 340 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left panel: m = 5 -->
  <g filter="url(#sk)">
    <rect x="42" y="56" width="292" height="256" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" opacity="0.35"/>
  </g>
  <text x="188" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">m = 5：5 ≡ 2 (mod 3) → 拆成 3 + 2</text>

  <text x="188" y="104" text-anchor="middle" font-size="10.5" fill="#888">5 个质因数配额</text>
  <g filter="url(#sk)">
    <rect x="88" y="112" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="132" y="112" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="176" y="112" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="220" y="112" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="264" y="112" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <path d="M 188 148 Q 188 158 188 166" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="98" y="170" width="86" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="192" y="170" width="86" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <text x="141" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">指数 3</text>
  <text x="235" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6b26">指数 2</text>
  <path d="M 188 208 Q 188 218 188 226" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="64" y="230" width="248" height="40" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="188" y="247" text-anchor="middle" font-size="12" fill="#444">n = 2³ × 5² = 200（官方示例的 n）</text>
  <text x="188" y="264" text-anchor="middle" font-size="11" fill="#888">质因数恰好用满 3 + 2 = 5 个</text>
  <g filter="url(#sk)">
    <rect x="64" y="278" width="248" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="188" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">好因子 = 3 × 2 = 6：10,20,40,50,100,200</text>

  <!-- right panel: m = 8 -->
  <g filter="url(#sk)">
    <rect x="346" y="56" width="292" height="256" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" opacity="0.35"/>
  </g>
  <text x="492" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6b26">m = 8：8 ≡ 2 (mod 3) → 拆成 3 + 3 + 2</text>

  <text x="492" y="104" text-anchor="middle" font-size="10.5" fill="#888">8 个质因数配额</text>
  <g filter="url(#sk)">
    <rect x="368" y="112" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="404" y="112" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="440" y="112" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="480" y="112" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="516" y="112" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="552" y="112" width="32" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="592" y="112" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <path d="M 492 148 Q 492 158 492 166" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="372" y="170" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="448" y="170" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="524" y="170" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <text x="407" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">指数 3</text>
  <text x="483" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">指数 3</text>
  <text x="559" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6b26">指数 2</text>
  <path d="M 492 208 Q 492 218 492 226" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="368" y="230" width="248" height="40" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="492" y="247" text-anchor="middle" font-size="12" fill="#444">n = 2³ × 3³ × 5² = 5400</text>
  <text x="492" y="264" text-anchor="middle" font-size="11" fill="#888">质因数恰好用满 3 + 3 + 2 = 8 个</text>
  <g filter="url(#sk)">
    <rect x="368" y="278" width="248" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="492" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">好因子 = 3 × 3 × 2 = 18</text>

  <!-- bottom summary -->
  <g filter="url(#sk)">
    <rect x="42" y="330" width="596" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">两例对照官方数据</text>
  <text x="340" y="378" text-anchor="middle" font-size="11.5" fill="#444">m = 5：公式 2·3^((5−2)/3) = 2·3 = 6 ✓（官方示例 1 输出 6）</text>
  <text x="340" y="400" text-anchor="middle" font-size="11.5" fill="#444">m = 8：公式 2·3^((8−2)/3) = 2·3² = 18 ✓（官方示例 2 输出 18）</text>
</svg>
