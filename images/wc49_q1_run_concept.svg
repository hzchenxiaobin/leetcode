<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="300" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">连续递增序列 = 严格递增的「连续段」（游程）</text>

  <!-- 遮罩层：两段极大递增游程 -->
  <rect x="50" y="72" width="290" height="70" rx="10" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="350" y="72" width="190" height="70" rx="10" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 数组格子 -->
  <rect x="60" y="82" width="70" height="50" rx="4" fill="#ffffff"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <rect x="160" y="82" width="70" height="50" rx="4" fill="#ffffff"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>

  <rect x="260" y="82" width="70" height="50" rx="4" fill="#ffffff"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>

  <rect x="360" y="82" width="70" height="50" rx="4" fill="#ffffff"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>

  <rect x="460" y="82" width="70" height="50" rx="4" fill="#ffffff"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="495" y="114" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">7</text>

  <!-- 下标 -->
  <text x="95" y="160" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <text x="195" y="160" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">1</text>
  <text x="295" y="160" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="395" y="160" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">3</text>
  <text x="495" y="160" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">4</text>

  <!-- 断点 -->
  <text x="340" y="62" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">断点 4 ≤ 5</text>
  <path d="M340,66 L340,146" stroke="#b85450" stroke-width="1.2"
        stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- 游程标注 -->
  <text x="195" y="186" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">游程 ①　长度 3</text>
  <text x="445" y="186" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">游程 ②　长度 2</text>

  <!-- 结论 -->
  <rect x="95" y="212" width="430" height="52" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="243" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">答案 = max(3, 2) = 3</text>

  <text x="310" y="288" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">游程内每步都满足 nums[i] &gt; nums[i-1]，跨游程必含断点</text>
</svg>
