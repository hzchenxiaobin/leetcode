<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 a = 1, b = 2, c = 5 的两种打法</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">一行是“最少步”，一行是“最多步”，最后都收敛到连续三格</text>

  <g filter="url(#rough2)" font-size="11" fill="#888">
    <text x="70" y="76">位置</text>
    <text x="120" y="76">1</text><text x="170" y="76">2</text><text x="220" y="76">3</text>
    <text x="270" y="76">4</text><text x="320" y="76">5</text><text x="370" y="76">6</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="108" y="88" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="158" y="88" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="308" y="88" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="128" y="111" fill="#446688">1</text>
    <text x="178" y="111" fill="#446688">2</text>
    <text x="328" y="111" fill="#8a6a20">5</text>
  </g>

  <path d="M 328 130 C 300 158, 258 158, 240 148" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="168" font-size="10.5" fill="#4a7a3a">min：5 → 3</text>

  <g filter="url(#rough2)">
    <rect x="108" y="184" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="158" y="184" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="208" y="184" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold" fill="#4a7a3a">
    <text x="128" y="207">1</text><text x="178" y="207">2</text><text x="228" y="207">3</text>
  </g>
  <text x="270" y="207" font-size="11" fill="#4a7a3a">连续！1 步结束</text>

  <g filter="url(#rough2)">
    <rect x="108" y="260" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="158" y="260" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="258" y="260" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="128" y="283" fill="#446688">1</text>
    <text x="178" y="283" fill="#446688">2</text>
    <text x="278" y="283" fill="#8a3a36">4</text>
  </g>
  <path d="M 278 302 C 258 322, 230 322, 228 316" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="318" font-size="10.5" fill="#8a3a36">max：5 → 4 → 3，2 步</text>

  <rect x="392" y="88" width="148" height="206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="466" y="112" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">答案</text>
  <text x="466" y="142" text-anchor="middle" font-size="12" fill="#555">min = 1</text>
  <text x="466" y="168" text-anchor="middle" font-size="12" fill="#555">max = 2</text>
  <text x="466" y="200" text-anchor="middle" font-size="10" fill="#888">z − x − 2</text>
  <text x="466" y="218" text-anchor="middle" font-size="10" fill="#888">= 5 − 1 − 2 = 2</text>
  <text x="466" y="252" text-anchor="middle" font-size="10" fill="#888">min 看空隙：</text>
  <text x="466" y="270" text-anchor="middle" font-size="10" fill="#888">g2 = 3 ≤ 2 ? 否</text>
  <text x="466" y="288" text-anchor="middle" font-size="10" fill="#888">但 g2 可一步到位</text>

  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#999">示例 2（4,3,2）排序后 2,3,4 已连续 → [0,0]；示例 3（3,5,1）排序后 1,3,5 → [1,2]</text>
</svg>
