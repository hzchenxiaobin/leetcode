<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">验证核心：LCP 的对角线递推</text>

  <rect x="70" y="46" width="420" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="14" fill="#2e5c1e" filter="url(#rough2)">lcp[i][j] = (word[i] = word[j]) ? 1 + lcp[i+1][j+1] : 0</text>

  <!-- 矩阵列标签 -->
  <text x="78" y="132" font-size="12" fill="#999" filter="url(#rough2)">i\j</text>
  <text x="115" y="132" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="155" y="132" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="195" y="132" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="235" y="132" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>

  <!-- 矩阵行标签 -->
  <text x="84" y="164" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="84" y="204" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="84" y="244" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="84" y="284" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>

  <!-- 行 0 -->
  <rect x="95" y="140" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="135" y="140" width="40" height="40" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="175" y="140" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="215" y="140" width="40" height="40" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="164" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="155" y="164" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="195" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5c1e" filter="url(#rough2)">2</text>
  <text x="235" y="164" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>

  <!-- 行 1 -->
  <rect x="95" y="180" width="40" height="40" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="135" y="180" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="175" y="180" width="40" height="40" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="215" y="180" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="115" y="204" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="155" y="204" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="195" y="204" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="235" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5c1e" filter="url(#rough2)">1</text>

  <!-- 行 2 -->
  <rect x="95" y="220" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="135" y="220" width="40" height="40" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="175" y="220" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="215" y="220" width="40" height="40" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115" y="244" text-anchor="middle" font-size="14" fill="#2e5c1e" filter="url(#rough2)">2</text>
  <text x="155" y="244" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="195" y="244" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="235" y="244" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>

  <!-- 行 3 -->
  <rect x="95" y="260" width="40" height="40" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="135" y="260" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="175" y="260" width="40" height="40" rx="4" fill="#ffffff" stroke="#b8b8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="215" y="260" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="284" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="155" y="284" text-anchor="middle" font-size="14" fill="#2e5c1e" filter="url(#rough2)">1</text>
  <text x="195" y="284" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="235" y="284" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- 递推箭头 (0,2) → (1,3) -->
  <path d="M 203 169 Q 226 187 230 191" fill="none" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="262" y="178" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>

  <!-- 卡片 1：正格 -->
  <rect x="330" y="118" width="200" height="110" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a" filter="url(#rough2)">正格：沿对角线递推</text>
  <text x="430" y="163" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">(0,2)=2：'a' = 'a'，下一格</text>
  <text x="430" y="182" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">(1,3) 必须等于 2 − 1 = 1 ✓</text>
  <text x="430" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">若 j+1 越界（后缀到底），值只能为 1</text>

  <!-- 卡片 2：零格 -->
  <rect x="330" y="242" width="200" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07828" filter="url(#rough2)">零格：字符必须不同</text>
  <text x="430" y="286" text-anchor="middle" font-size="12" fill="#a07828" filter="url(#rough2)">(0,1)=0：'a' ≠ 'b' ✓</text>
  <text x="430" y="306" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">若相同，公共前缀至少 1 个字符</text>

  <!-- 底部：后缀对齐 -->
  <text x="75" y="336" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">word = "abab"：后缀 0 与后缀 2 的 LCP</text>

  <text x="75" y="368" font-size="12" fill="#555" filter="url(#rough2)">后缀 0</text>
  <rect x="140" y="348" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="166" y="348" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="192" y="348" width="24" height="24" rx="4" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="218" y="348" width="24" height="24" rx="4" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="152" y="365" text-anchor="middle" font-size="13" fill="#33507a" filter="url(#rough2)">a</text>
  <text x="178" y="365" text-anchor="middle" font-size="13" fill="#33507a" filter="url(#rough2)">b</text>
  <text x="204" y="365" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">a</text>
  <text x="230" y="365" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">b</text>

  <text x="75" y="400" font-size="12" fill="#555" filter="url(#rough2)">后缀 2</text>
  <rect x="140" y="380" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="166" y="380" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="397" text-anchor="middle" font-size="13" fill="#33507a" filter="url(#rough2)">a</text>
  <text x="178" y="397" text-anchor="middle" font-size="13" fill="#33507a" filter="url(#rough2)">b</text>

  <rect x="136" y="344" width="60" height="64" rx="4" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <text x="300" y="368" font-size="12" fill="#333" filter="url(#rough2)">公共前缀 = "ab"</text>
  <text x="300" y="390" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">LCP = 2，与 lcp[0][2] 一致 ✓</text>
</svg>
