<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：解锁链复杂度严格递增 · 根必须严格唯一最小</text>

  <!-- 情形 A：c[0] 严格唯一最小，星形结构 -->
  <rect x="28" y="44" width="504" height="176" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="44" y="68" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">情形 A：c[0] 是严格唯一最小值 ⇒ 答案 (n−1)!</text>

  <g filter="url(#rough2)">
    <ellipse cx="130" cy="140" rx="34" ry="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="130" y="132" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0 号机</text>
    <text x="130" y="150" text-anchor="middle" font-size="11" fill="#446688">c = 1</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <path d="M 158 124 Q 216 92 254 84" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)"/>
    <path d="M 160 140 L 250 140" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)"/>
    <path d="M 158 156 Q 216 188 254 196" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)"/>
    <path d="M 152 168 Q 200 244 256 258" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)"/>

    <rect x="258" y="70" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="290" y="90" fill="#333">1 · c=3</text>
    <rect x="258" y="124" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="290" y="144" fill="#333">2 · c=2</text>
    <rect x="258" y="182" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="290" y="202" fill="#333">3 · c=5</text>
    <rect x="262" y="246" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="294" y="266" fill="#333">4 · c=4</text>
  </g>

  <text x="348" y="88" font-size="10.5" fill="#333" filter="url(#rough2)">c[0] &lt; c[i] 对所有 i ≥ 1 成立，</text>
  <text x="348" y="106" font-size="10.5" fill="#333" filter="url(#rough2)">0 号机排首位后，任何一台机器</text>
  <text x="348" y="124" font-size="10.5" fill="#333" filter="url(#rough2)">在任意时刻都能由它直接解锁——</text>
  <text x="348" y="142" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后 n−1 个位置怎么排都合法</text>
  <rect x="348" y="158" width="164" height="42" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="176" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = (n−1)! mod 1e9+7</text>
  <text x="430" y="193" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0 固定首位，其余任意排列</text>
  <text x="348" y="216" font-size="10.5" fill="#666" filter="url(#rough2)">如 [2,5,3,7]：3! = 6</text>

  <!-- 情形 B：存在 c[i] <= c[0]，死锁 -->
  <rect x="28" y="236" width="504" height="180" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="44" y="260" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">情形 B：存在 i ≥ 1 使 c[i] ≤ c[0] ⇒ 答案 0</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="76" y="288" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="132" y="288" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="188" y="288" width="52" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="244" y="288" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="102" y="310" fill="#333">c=3</text>
    <text x="158" y="310" fill="#333">c=5</text>
    <text x="214" y="310" fill="#b85450" font-weight="bold">c=2</text>
    <text x="270" y="310" fill="#333">c=7</text>
    <text x="102" y="338" font-size="10" fill="#888">0 号机</text>
    <text x="158" y="338" font-size="10" fill="#888">1 号机</text>
    <text x="214" y="338" font-size="10" fill="#b85450" font-weight="bold">2 号机</text>
    <text x="270" y="338" font-size="10" fill="#888">3 号机</text>
  </g>

  <path d="M 102 352 Q 140 376 180 376" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="396" font-size="10" fill="#b85450" filter="url(#rough2)">j=0：需要 3 &lt; 2 ✗</text>
  <path d="M 158 352 Q 196 362 212 356" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="196" y="376" font-size="10" fill="#b85450" filter="url(#rough2)">j=1：需要 5 &lt; 2 ✗</text>

  <text x="330" y="290" font-size="10.5" fill="#333" filter="url(#rough2)">解锁 2 号机只能靠 j &lt; 2 的机器，</text>
  <text x="330" y="308" font-size="10.5" fill="#333" filter="url(#rough2)">而 c=3、c=5 都不小于 2——</text>
  <text x="330" y="326" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">它永远无人能解，排列全灭。</text>
  <text x="330" y="348" font-size="10.5" fill="#333" filter="url(#rough2)">解锁链每步复杂度严格递增，</text>
  <text x="330" y="366" font-size="10.5" fill="#333" filter="url(#rough2)">故任何被解锁机器的 c 都 &gt; c[0]，</text>
  <text x="330" y="384" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">c[i] ≤ c[0]（含并列！）即锁死。</text>

  <rect x="60" y="428" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="450" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">answer = (n−1)!（c[0] 严格唯一最小）or 0（否则）</text>
</svg>
