<svg xmlns="http://www.w3.org/2000/svg" width="560" height="520" viewBox="0 0 560 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="520" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一趟正扫 + 奇偶分流</text>
  <path d="M 150 34 Q 280 42 410 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="235" y="44" width="90" height="30" rx="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="280" y="63" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">输入 n</text>
  <g filter="url(#sk)">
    <path d="M 280 74 L 280 86" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <!-- diamond 1: n == 0? -->
  <g filter="url(#sk)">
    <polygon points="280,90 346,118 280,146 214,118" fill="#fdfdf7" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">n == 0 ?</text>
  <text x="368" y="112" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <path d="M 346 118 L 392 118" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="396" y="104" width="110" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="451" y="122" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#sk)">返回 0</text>
  <text x="292" y="160" font-size="11" fill="#4a7a3a" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <path d="M 280 146 L 280 160" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="160" y="164" width="240" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="184" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-family="monospace" filter="url(#sk)">nums[0]=0, nums[1]=1, ans=1</text>
  <g filter="url(#sk)">
    <path d="M 280 196 L 280 210" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <!-- diamond 2: j <= n? -->
  <g filter="url(#sk)">
    <polygon points="280,214 342,242 280,270 218,242" fill="#fdfdf7" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="246" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">j ≤ n ?</text>
  <text x="368" y="236" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <path d="M 342 242 L 392 242" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="396" y="228" width="110" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="451" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#sk)">返回 ans ✓</text>
  <text x="292" y="286" font-size="11" fill="#4a7a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <path d="M 280 270 L 280 286" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <!-- diamond 3: j odd? -->
  <g filter="url(#sk)">
    <polygon points="280,290 352,318 280,346 208,318" fill="#fdfdf7" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">j 为奇数 ?</text>
  <text x="172" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">是·奇</text>
  <g filter="url(#sk)">
    <path d="M 208 318 L 125 318 L 125 374" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="390" y="306" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">否·偶</text>
  <g filter="url(#sk)">
    <path d="M 352 318 L 435 318 L 435 374" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- branch boxes -->
  <g filter="url(#sk)">
    <rect x="40" y="378" width="170" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="125" y="392" text-anchor="middle" font-size="10.5" fill="#2e5a24" font-family="monospace" filter="url(#sk)">nums[j] = nums[j&gt;&gt;1]</text>
  <text x="125" y="406" text-anchor="middle" font-size="10.5" fill="#2e5a24" font-family="monospace" filter="url(#sk)">+ nums[(j&gt;&gt;1)+1]</text>
  <g filter="url(#sk)">
    <rect x="350" y="378" width="170" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="435" y="400" text-anchor="middle" font-size="11" fill="#2b4a6e" font-family="monospace" filter="url(#sk)">nums[j] = nums[j&gt;&gt;1]</text>

  <!-- merge into ans update -->
  <g filter="url(#sk)">
    <path d="M 125 412 L 125 463 L 166 463" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 435 412 L 435 463 L 394 463" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="170" y="448" width="220" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="280" y="467" text-anchor="middle" font-size="11.5" fill="#7a5415" font-family="monospace" filter="url(#sk)">ans = max(ans, nums[j])</text>

  <!-- loop back -->
  <g filter="url(#sk)">
    <path d="M 280 478 L 280 496 L 22 496 L 22 242 L 212 242" stroke="#8a8a8a" stroke-width="1.6" fill="none" marker-end="url(#ar)" stroke-dasharray="5,4"/>
  </g>
  <text x="150" y="490" text-anchor="middle" font-size="11" fill="#888" font-family="monospace" filter="url(#sk)">j = j + 1</text>
</svg>
