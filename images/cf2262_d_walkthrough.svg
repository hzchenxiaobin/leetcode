<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="520" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">反例走查：13 步操作把 (1,1,2,3) 变成 (3,4,4,4)</text>
  <path d="M 128 40 Q 390 47 652 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="390" y="60" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">start = 1，b 边：1→3，3→4，2→4，4→4；橙色表示「跳出子树」的跳跃，绿色表示沿 b 边爬回</text>

  <!-- header -->
  <text x="60" y="88" font-size="11.5" fill="#8a94a0" filter="url(#rough2)">操作</text>
  <text x="215" y="88" font-size="11.5" fill="#8a94a0" filter="url(#rough2)">当前数组 a</text>
  <text x="400" y="88" font-size="11.5" fill="#8a94a0" filter="url(#rough2)">位置 p</text>
  <text x="470" y="88" font-size="11.5" fill="#8a94a0" filter="url(#rough2)">说明</text>
  <path d="M 52 98 L 730 98" stroke="#c9d3dd" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- row template y=118 + 42*k -->
  <!-- row 0 -->
  <text x="60" y="126" font-size="12" fill="#5b7a99" filter="url(#rough2)">（初始）</text>
  <text x="215" y="126" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(1, 1, 2, 3)</text>
  <text x="400" y="126" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="470" y="126" font-size="12" fill="#4a5a6a" filter="url(#rough2)">脏点 1、2、3、4</text>

  <!-- row 1 -->
  <rect x="52" y="138" width="56" height="24" rx="6" fill="#dce8f7" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="155" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">1 1</text>
  <text x="215" y="155" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(3, 1, 2, 3)</text>
  <text x="400" y="155" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="470" y="155" font-size="12" fill="#3c5e2e" filter="url(#rough2)">a₁ = 3 = b₁，1 归位</text>

  <!-- row 2 -->
  <rect x="52" y="180" width="56" height="24" rx="6" fill="#fbe6cf" stroke="#c77a1e" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="197" text-anchor="middle" font-size="12" fill="#8a4f0a" filter="url(#rough2)">2</text>
  <text x="215" y="197" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(3, 1, 2, 3)</text>
  <text x="400" y="197" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="470" y="197" font-size="12" fill="#4a5a6a" filter="url(#rough2)">跳到 a₁ = 3</text>

  <!-- row 3 -->
  <rect x="52" y="222" width="56" height="24" rx="6" fill="#fbe6cf" stroke="#c77a1e" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="239" text-anchor="middle" font-size="12" fill="#8a4f0a" filter="url(#rough2)">2</text>
  <text x="215" y="239" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(3, 1, 2, 3)</text>
  <text x="400" y="239" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="470" y="239" font-size="12" fill="#a14340" filter="url(#rough2)">a₃ = 2 还脏且 2 &lt; 3 ⇒ 跳出 subtree(3)！</text>

  <!-- row 4 -->
  <rect x="52" y="264" width="56" height="24" rx="6" fill="#dce8f7" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="281" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">1 1 1</text>
  <text x="215" y="281" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(3, 4, 2, 3)</text>
  <text x="400" y="281" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="470" y="281" font-size="12" fill="#3c5e2e" filter="url(#rough2)">a₂ = 4 = b₂，2 归位</text>

  <!-- row 5 -->
  <rect x="52" y="306" width="56" height="24" rx="6" fill="#e2f0e2" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="323" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <text x="215" y="323" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(3, 4, 2, 3)</text>
  <text x="400" y="323" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="470" y="323" font-size="12" fill="#3c5e2e" filter="url(#rough2)">沿 b₂ = 4 爬回祖先 4</text>

  <!-- row 6 -->
  <rect x="52" y="348" width="56" height="24" rx="6" fill="#fbe6cf" stroke="#c77a1e" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="365" text-anchor="middle" font-size="12" fill="#8a4f0a" filter="url(#rough2)">2</text>
  <text x="215" y="365" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(3, 4, 2, 3)</text>
  <text x="400" y="365" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="470" y="365" font-size="12" fill="#a14340" filter="url(#rough2)">a₄ = 3 还脏且 3 &lt; 4 ⇒ 跳回 3（二次跳板）</text>

  <!-- row 7 -->
  <rect x="52" y="390" width="56" height="24" rx="6" fill="#dce8f7" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="407" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">1 1</text>
  <text x="215" y="407" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(3, 4, 4, 3)</text>
  <text x="400" y="407" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="470" y="407" font-size="12" fill="#3c5e2e" filter="url(#rough2)">a₂ 已归位被跳过；a₃ = 4 = b₃，3 归位</text>

  <!-- row 8 -->
  <rect x="52" y="432" width="56" height="24" rx="6" fill="#e2f0e2" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="449" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <text x="215" y="449" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(3, 4, 4, 3)</text>
  <text x="400" y="449" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="470" y="449" font-size="12" fill="#4a5a6a" filter="url(#rough2)">沿 b₃ = 4 到 4</text>

  <!-- row 9 -->
  <rect x="52" y="474" width="56" height="24" rx="6" fill="#dce8f7" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="491" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="215" y="491" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(3, 4, 4, 4)</text>
  <text x="400" y="491" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="470" y="491" font-size="12" fill="#3c5e2e" filter="url(#rough2)">a₄ = 4 = b₄，rem = 0，结束</text>

  <text x="390" y="514" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">操作串：1 1 2 2 1 1 1 2 2 1 1 2 1　→　13 步，o ≤ 2n² = 32</text>
</svg>
