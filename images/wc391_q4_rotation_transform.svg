<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：45° 旋转变换，曼哈顿距离 → 切比雪夫距离</text>
  <path d="M 160 42 Q 340 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="205" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">原坐标 (x, y)：L1</text>
  <g filter="url(#sk)">
    <path d="M142,92 L154,104 L142,116 L130,104 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <text x="162" y="108" text-anchor="start" font-size="10.5" fill="#b03a3a">L1 球是菱形</text>

  <g filter="url(#sk)">
    <path d="M95,295 L305,295" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M110,318 L110,118" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="316" y="300" font-size="12" fill="#555">x</text>
  <text x="100" y="112" font-size="12" fill="#555">y</text>

  <g filter="url(#sk)">
    <rect x="155" y="160" width="135" height="90" rx="3" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4"/>
  </g>
  <text x="222" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">|Δx| = 3</text>
  <text x="296" y="208" text-anchor="start" font-size="11" font-weight="bold" fill="#2b6e9e">|Δy| = 2</text>

  <g filter="url(#sk)">
    <circle cx="155" cy="160" r="4.5" fill="#446688"/>
    <circle cx="290" cy="250" r="4.5" fill="#446688"/>
  </g>
  <text x="147" y="148" text-anchor="end" font-size="11.5" font-weight="bold" fill="#333">A(1,3)</text>
  <text x="296" y="264" text-anchor="start" font-size="11.5" font-weight="bold" fill="#333">B(4,1)</text>
  <text x="205" y="326" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">d(A,B) = 3 + 2 = 5</text>

  <g filter="url(#sk)">
    <path d="M318,208 C 342,196 362,196 384,208" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="351" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">旋转 45°</text>
  <text x="351" y="228" text-anchor="middle" font-size="9.5" fill="#888">(x,y)→(x+y, x−y)</text>

  <text x="520" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">变换后 (u, v)：L∞</text>
  <g filter="url(#sk)">
    <rect x="432" y="83" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <text x="464" y="99" text-anchor="start" font-size="10.5" fill="#2e6e2e">L∞ 球是正方形</text>

  <g filter="url(#sk)">
    <path d="M392,260 L655,260" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M405,286 L405,120" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="664" y="265" font-size="12" fill="#555">u</text>
  <text x="396" y="114" font-size="12" fill="#555">v</text>

  <g filter="url(#sk)">
    <rect x="501" y="188" width="24" height="120" rx="3" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6 4"/>
  </g>
  <text x="513" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">|Δu| = 1</text>
  <text x="533" y="252" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b03a3a">|Δv| = 5</text>

  <g filter="url(#sk)">
    <circle cx="501" cy="308" r="4.5" fill="#4a7a3a"/>
    <circle cx="525" cy="188" r="4.5" fill="#4a7a3a"/>
  </g>
  <text x="494" y="324" text-anchor="end" font-size="11.5" font-weight="bold" fill="#333">A'(4,−2)</text>
  <text x="533" y="182" text-anchor="start" font-size="11.5" font-weight="bold" fill="#333">B'(5,3)</text>
  <text x="540" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">d∞ = max(1, 5) = 5</text>

  <g filter="url(#sk)">
    <rect x="90" y="348" width="500" height="68" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="340" y="373" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">恒等式 |a| + |b| = max(|a+b|, |a−b|) ⇒ 两点距离变成 max(|Δu|, |Δv|)</text>
  <text x="340" y="399" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">点集直径 D = max(max u − min u, max v − min v)——只由 4 个极值决定！</text>
</svg>
