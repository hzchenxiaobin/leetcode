<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1：corridor = "SSPPSPS" 的三种方案</text>

  <!-- 三种方案，每行一条走廊 -->
  <g filter="url(#rough2)">
    <!-- cells: x from 80, w 52 -->
    <rect x="80" y="52" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="132" y="52" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="184" y="52" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="236" y="52" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="288" y="52" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="340" y="52" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="392" y="52" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="106" y="77">S</text><text x="158" y="77">S</text><text x="210" y="77">P</text>
    <text x="262" y="77">P</text><text x="314" y="77">S</text><text x="366" y="77">P</text><text x="418" y="77">S</text>
  </g>
  <!-- 方案 1 屏风：缝隙 1/2 之间（x=132 前缝 =106/158 之间? 用位置标） -->
  <g filter="url(#rough2)" fill="none" stroke="#b85450" stroke-width="4">
    <path d="M 132 46 L 132 98"/>
  </g>
  <text x="470" y="70" font-size="12.5" fill="#333" filter="url(#rough2)">方案 ①</text>
  <text x="470" y="88" font-size="11.5" fill="#666" filter="url(#rough2)">SS | PPSPS</text>

  <g filter="url(#rough2)">
    <rect x="80" y="122" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="132" y="122" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="184" y="122" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="236" y="122" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="288" y="122" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="340" y="122" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="392" y="122" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="106" y="147">S</text><text x="158" y="147">S</text><text x="210" y="147">P</text>
    <text x="262" y="147">P</text><text x="314" y="147">S</text><text x="366" y="147">P</text><text x="418" y="147">S</text>
  </g>
  <g filter="url(#rough2)" fill="none" stroke="#b85450" stroke-width="4">
    <path d="M 236 116 L 236 168"/>
  </g>
  <text x="470" y="140" font-size="12.5" fill="#333" filter="url(#rough2)">方案 ②</text>
  <text x="470" y="158" font-size="11.5" fill="#666" filter="url(#rough2)">SSP | PSPS</text>

  <g filter="url(#rough2)">
    <rect x="80" y="192" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="132" y="192" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="184" y="192" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="236" y="192" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="288" y="192" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="340" y="192" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="392" y="192" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="106" y="217">S</text><text x="158" y="217">S</text><text x="210" y="217">P</text>
    <text x="262" y="217">P</text><text x="314" y="217">S</text><text x="366" y="217">P</text><text x="418" y="217">S</text>
  </g>
  <g filter="url(#rough2)" fill="none" stroke="#b85450" stroke-width="4">
    <path d="M 288 186 L 288 238"/>
  </g>
  <text x="470" y="210" font-size="12.5" fill="#333" filter="url(#rough2)">方案 ③</text>
  <text x="470" y="228" font-size="11.5" fill="#666" filter="url(#rough2)">SSPP | SPS</text>

  <!-- 计算过程 -->
  <g filter="url(#rough2)">
    <rect x="60" y="262" width="440" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="286" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)" text-anchor="middle">公式计算</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="310">座位下标 0, 1, 4, 6；两段交界在座位 1 与 4 之间</text>
    <text x="280" y="332">植物数 = 4 − 1 − 1 = 2 ⇒ 选择数 = 2 + 1 = 3</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="60" y="360" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="160" y="388" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)" font-weight="bold">答案 = 3 ✓</text>
  <g filter="url(#rough2)" font-size="11.5" fill="#666" text-anchor="middle">
    <text x="370" y="378">另：PPSPSP 只有 2 个座位 → 1 段</text>
    <text x="370" y="396">不用放屏风，答案 1；"S" → 0</text>
  </g>
</svg>
