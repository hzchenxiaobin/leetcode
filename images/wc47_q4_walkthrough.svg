<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">走查：m = 3，n = 3，k = 5，答案 3</text>

  <!-- 表头 -->
  <rect x="30" y="48" width="640" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="67" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">轮次</text>
  <text x="157" y="67" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[lo, hi]</text>
  <text x="240" y="67" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">mid</text>
  <text x="352" y="67" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">逐行 min(n, ⌊mid/i⌋)</text>
  <text x="472" y="67" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt</text>
  <text x="592" y="67" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">判定</text>


  <!-- 行 1 -->
  <rect x="30" y="76" width="640" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="157" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 9]</text>
  <text x="240" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="352" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 , 2 , 1</text>
  <text x="472" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="518" y="79" width="149" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="592" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">≥ 5 → hi = 5</text>

  <!-- 行 2 -->
  <rect x="30" y="116" width="640" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="157" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 5]</text>
  <text x="240" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="352" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 , 1 , 1</text>
  <rect x="434" y="119" width="78" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="472" y="141" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">5</text>
  <rect x="518" y="119" width="149" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="592" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">≥ 5 → hi = 3</text>

  <!-- 行 3 -->
  <rect x="30" y="156" width="640" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="157" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 3]</text>
  <text x="240" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="352" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 , 1 , 0</text>
  <text x="472" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="518" y="159" width="149" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="592" y="181" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">&lt; 5 → lo = 3</text>

  <line x1="110" y1="48" x2="110" y2="196" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="205" y1="48" x2="205" y2="196" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="275" y1="48" x2="275" y2="196" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="430" y1="48" x2="430" y2="196" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="515" y1="48" x2="515" y2="196" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="204" width="640" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="229" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">收敛</text>
  <text x="157" y="229" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">lo = hi = 3</text>
  <text x="240" y="229" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">—</text>
  <text x="352" y="229" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">循环结束</text>
  <text x="472" y="229" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">—</text>
  <text x="592" y="229" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 3</text>

  <!-- 底部：升序拍平 -->
  <text x="40" y="272" font-size="11" fill="#446688" filter="url(#rough2)">升序拍平：</text>
  <text x="64" y="288" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="112" y="288" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="160" y="288" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="208" y="288" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="256" y="288" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="304" y="288" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="352" y="288" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">7</text>
  <text x="400" y="288" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">8</text>
  <text x="448" y="288" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">9</text>

  <rect x="40" y="292" width="48" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="88" y="292" width="48" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="136" y="292" width="48" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="184" y="292" width="48" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="232" y="292" width="48" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="280" y="292" width="48" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="328" y="292" width="48" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="376" y="292" width="48" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="424" y="292" width="48" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="64" y="322" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="112" y="322" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="322" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="208" y="322" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="256" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <text x="304" y="322" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="352" y="322" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <text x="400" y="322" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <text x="448" y="322" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>

  <text x="256" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">↑ 第 5 个 = 3</text>

  <rect x="500" y="284" width="180" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="590" y="305" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">f(4) = f(5) = 6：走平</text>
  <text x="590" y="321" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">故 mid 未必是表中元素</text>
  <text x="590" y="337" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">必须 hi = mid 收敛</text>

  <text x="350" y="380" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">f(1)=1，f(2)=3，f(3)=5，f(4)=6，f(5)=6 ⇒ 最小的 x 使 f(x) ≥ 5 就是 3</text>
</svg>
