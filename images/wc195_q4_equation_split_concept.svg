<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：方程裂解为「(y − x) + (y + x)」两个独立项</text>
  <text x="320" y="41" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">i &lt; j 且 x 严格递增 ⇒ |x_i − x_j| = x_j − x_i，与 j 配对的 i 只剩一个约束：x_j − x_i ≤ k</text>

  <g filter="url(#rough2)">
    <rect x="24" y="58" width="168" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="108" y="79" text-anchor="middle" font-size="12" fill="#333">y_i + y_j + |x_i − x_j|</text>

    <path d="M192,74 L228,74" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="210" y="54" text-anchor="middle" font-size="9" fill="#446688">i&lt;j ⇒ x_i&lt;x_j</text>

    <rect x="228" y="58" width="172" height="32" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="314" y="79" text-anchor="middle" font-size="12" fill="#333">y_i + y_j + (x_j − x_i)</text>

    <path d="M400,74 L432,74" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="416" y="54" text-anchor="middle" font-size="9.5" fill="#4a7a3a">裂解</text>

    <rect x="432" y="57" width="88" height="27" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="476" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">(y_i − x_i)</text>
    <text x="476" y="97" text-anchor="middle" font-size="9.5" fill="#446688">只与 i 有关</text>

    <text x="528" y="75" text-anchor="middle" font-size="14" fill="#333">+</text>

    <rect x="542" y="57" width="88" height="27" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="586" y="75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a3a">(y_j + x_j)</text>
    <text x="586" y="97" text-anchor="middle" font-size="9.5" fill="#4a7a3a">只与 j 有关</text>
  </g>

  <g filter="url(#rough2)">
    <text x="320" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">固定 j：在「x 距离 ≤ k」的左侧窗口里找 (y − x) 最大 → 滑动窗口最值</text>

    <rect x="150" y="150" width="330" height="88" fill="#e6f4ea" opacity="0.35"/>

    <text x="150" y="144" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a">x_j − k</text>
    <path d="M150,150 L150,246" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4,3" fill="none"/>

    <text x="470" y="144" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b07818">x_j</text>
    <path d="M470,150 L470,246" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4,3" fill="none"/>

    <path d="M40,232 L600,232" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="614" y="236" font-size="11" fill="#666">x</text>

    <ellipse cx="88" cy="232" rx="6.5" ry="6.5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="88" y="252" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450">过期</text>
    <text x="88" y="264" text-anchor="middle" font-size="8.5" fill="#b85450">x_i &lt; x_j − k</text>

    <ellipse cx="190" cy="232" rx="6.5" ry="6.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="190" y="252" text-anchor="middle" font-size="10" fill="#446688">i₁</text>
    <ellipse cx="258" cy="232" rx="6.5" ry="6.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="258" y="252" text-anchor="middle" font-size="10" fill="#446688">i₂</text>
    <ellipse cx="330" cy="232" rx="6.5" ry="6.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="330" y="252" text-anchor="middle" font-size="10" fill="#446688">i₃</text>

    <ellipse cx="470" cy="232" rx="7.5" ry="7.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="470" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#b07818">j</text>
    <text x="470" y="264" text-anchor="middle" font-size="8.5" fill="#b07818">(y_j + x_j) 已知</text>

    <text x="310" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a3a">max{ y_i − x_i }：单调队列 O(1) 查询</text>
    <text x="310" y="190" text-anchor="middle" font-size="10" fill="#555">窗口内所有 i &lt; j 都可与 j 配对</text>
    <text x="310" y="224" text-anchor="middle" font-size="9.5" fill="#4a7a3a">窗口宽度 = k（按 x 值滑动，非下标）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="278" width="580" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="48" y="300" font-size="12" font-weight="bold" fill="#b07818">candidate(j) = (y_j + x_j) + max{ (y_i − x_i) : x_j − x_i ≤ k }</text>
    <text x="48" y="322" font-size="11" fill="#555">经典滑窗：窗口 = 下标差 ≤ k，过期条件「队头 &lt; j − k」，维护 nums[i]</text>
    <text x="48" y="342" font-size="11" fill="#555">本题：窗口 = x 差 ≤ k，过期条件「x[队头] &lt; x_j − k」，维护 y[i] − x[i]</text>
    <text x="48" y="360" font-size="11" font-weight="bold" fill="#b85450">易错：窗口按「x 值」滑动（x 间距不均匀），别照抄下标窗口！</text>
  </g>

  <text x="320" y="410" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">对每个 j 均摊 O(1) 查询 → 总体 O(n)、空间 O(n)</text>
</svg>
