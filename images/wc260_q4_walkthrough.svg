<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="430" fill="#fafafa"/>
  <text x="350" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：s = "7+3*1*2" 的区间 DP 全过程</text>
  <path d="M 170 36 Q 350 46 530 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 列标 j -->
  <text x="84" y="54" text-anchor="middle" font-size="10" fill="#888">j=0</text>
  <text x="180" y="54" text-anchor="middle" font-size="10" fill="#888">j=1</text>
  <text x="276" y="54" text-anchor="middle" font-size="10" fill="#888">j=2</text>
  <text x="372" y="54" text-anchor="middle" font-size="10" fill="#888">j=3</text>

  <!-- 行标 i -->
  <text x="28" y="94" text-anchor="end" font-size="10" fill="#888">i=0</text>
  <text x="28" y="160" text-anchor="end" font-size="10" fill="#888">i=1</text>
  <text x="28" y="226" text-anchor="end" font-size="10" fill="#888">i=2</text>
  <text x="28" y="292" text-anchor="end" font-size="10" fill="#888">i=3</text>

  <!-- 单元格：上三角 (i<=j) 有内容，下三角淡化 -->
  <!-- (0,0) -->
  <g filter="url(#sk)"><rect x="40" y="62" width="88" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="84" y="84" text-anchor="middle" font-size="10" fill="#666">7</text>
  <text x="84" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">{7}</text>
  <!-- (0,1) -->
  <g filter="url(#sk)"><rect x="136" y="62" width="88" height="58" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="180" y="84" text-anchor="middle" font-size="10" fill="#666">7+3</text>
  <text x="180" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">{10}</text>
  <!-- (0,2) -->
  <g filter="url(#sk)"><rect x="232" y="62" width="88" height="58" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="276" y="84" text-anchor="middle" font-size="10" fill="#666">7+3*1</text>
  <text x="276" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">{10}</text>
  <!-- (0,3) 强调 -->
  <g filter="url(#sk)"><rect x="328" y="62" width="88" height="58" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6"/></g>
  <text x="372" y="84" text-anchor="middle" font-size="9" fill="#7a5415">7+3*1*2</text>
  <text x="372" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">{13, 20}</text>

  <!-- (1,1) -->
  <g filter="url(#sk)"><rect x="136" y="128" width="88" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="180" y="150" text-anchor="middle" font-size="10" fill="#666">3</text>
  <text x="180" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">{3}</text>
  <!-- (1,2) -->
  <g filter="url(#sk)"><rect x="232" y="128" width="88" height="58" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="276" y="150" text-anchor="middle" font-size="10" fill="#666">3*1</text>
  <text x="276" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">{3}</text>
  <!-- (1,3) -->
  <g filter="url(#sk)"><rect x="328" y="128" width="88" height="58" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="372" y="150" text-anchor="middle" font-size="10" fill="#666">3*1*2</text>
  <text x="372" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">{6}</text>

  <!-- (2,2) -->
  <g filter="url(#sk)"><rect x="232" y="194" width="88" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="276" y="216" text-anchor="middle" font-size="10" fill="#666">1</text>
  <text x="276" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">{1}</text>
  <!-- (2,3) -->
  <g filter="url(#sk)"><rect x="328" y="194" width="88" height="58" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="372" y="216" text-anchor="middle" font-size="10" fill="#666">1*2</text>
  <text x="372" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">{2}</text>

  <!-- (3,3) -->
  <g filter="url(#sk)"><rect x="328" y="260" width="88" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="372" y="282" text-anchor="middle" font-size="10" fill="#666">2</text>
  <text x="372" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">{2}</text>

  <!-- 下三角淡化 -->
  <g filter="url(#sk)">
    <rect x="40" y="128" width="88" height="58" rx="6" fill="#f2f2f2" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="40" y="194" width="88" height="58" rx="6" fill="#f2f2f2" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="136" y="194" width="88" height="58" rx="6" fill="#f2f2f2" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="40" y="260" width="88" height="58" rx="6" fill="#f2f2f2" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="136" y="260" width="88" height="58" rx="6" fill="#f2f2f2" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="232" y="260" width="88" height="58" rx="6" fill="#f2f2f2" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
  </g>
  <text x="84" y="162" text-anchor="middle" font-size="11" fill="#bbb">i &gt; j，空</text>
  <text x="84" y="228" text-anchor="middle" font-size="11" fill="#bbb">·</text>
  <text x="180" y="228" text-anchor="middle" font-size="11" fill="#bbb">·</text>
  <text x="84" y="294" text-anchor="middle" font-size="11" fill="#bbb">·</text>
  <text x="180" y="294" text-anchor="middle" font-size="11" fill="#bbb">·</text>
  <text x="276" y="294" text-anchor="middle" font-size="11" fill="#bbb">·</text>

  <text x="228" y="344" text-anchor="middle" font-size="10.5" fill="#888">按区间长度递推：对角线（单操作数）→ 长度 2 → 3 → 4；记忆化自动完成此拓扑</text>

  <!-- 右侧：f(0,3) 的合并 -->
  <g filter="url(#sk)">
    <rect x="440" y="60" width="240" height="128" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="560" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">f(0,3)：枚举分割点 k</text>
  <text x="452" y="102" font-size="10.5" fill="#446688">k=0：7 + f(1,3)={6} → 13 ← 正确值</text>
  <text x="452" y="122" font-size="10.5" fill="#446688">k=1：{10} × {2} → 20</text>
  <text x="452" y="142" font-size="10.5" fill="#446688">k=2：{10} × {2} → 20</text>
  <text x="452" y="164" font-size="11" font-weight="bold" fill="#446688">∴ f(0,3) = {13, 20}</text>

  <!-- 右侧：打分 -->
  <g filter="url(#sk)">
    <rect x="440" y="208" width="240" height="130" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="560" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d25">打分：correct = 13</text>
  <text x="452" y="250" font-size="10.5" fill="#4a7a3a">answers = [20, 13, 42]</text>
  <text x="452" y="270" font-size="10.5" fill="#4a7a3a">20 ∈ 可达集（错序）→ 2 分</text>
  <text x="452" y="290" font-size="10.5" fill="#4a7a3a">13 == correct → 5 分</text>
  <text x="452" y="310" font-size="10.5" fill="#4a7a3a">42 两者皆否 → 0 分</text>
  <text x="452" y="330" font-size="11" font-weight="bold" fill="#2f5d25">总分 = 2 + 5 + 0 = 7</text>

  <!-- 底注 -->
  <g filter="url(#sk)">
    <rect x="440" y="352" width="240" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="560" y="374" text-anchor="middle" font-size="10" fill="#5c4512">13 本就在可达集里（对应正确顺序）；</text>
  <text x="560" y="392" text-anchor="middle" font-size="10" fill="#5c4512">先判 correct 再判集合，保证按 5 分计</text>
</svg>
