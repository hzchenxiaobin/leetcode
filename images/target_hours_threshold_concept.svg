<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrC" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#d6a040" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="780" height="470" fill="#fdfcf7"/>
  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：「至少 target 小时」= hours[i] ≥ target（含等号）</text>
  <path d="M 220 44 Q 390 52 560 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- axes -->
  <line x1="90" y1="95" x2="90" y2="335" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <g font-size="11" fill="#777" filter="url(#sk)">
    <text x="80" y="339" text-anchor="end">0</text>
    <text x="80" y="287" text-anchor="end">1</text>
    <text x="80" y="235" text-anchor="end">2</text>
    <text x="80" y="183" text-anchor="end">3</text>
    <text x="80" y="131" text-anchor="end">4</text>
    <text x="88" y="84" text-anchor="end">小时</text>
  </g>
  <line x1="86" y1="335" x2="660" y2="335" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>

  <!-- target line -->
  <line x1="90" y1="231" x2="664" y2="231" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="670" y="236" font-size="13" font-weight="bold" fill="#a8781e" filter="url(#sk)">target = 2</text>

  <!-- bars: 达标绿色 / 不达标红色；恰好 = target 的员工 2 用橙框强调 -->
  <g filter="url(#sk)">
    <rect x="128" y="329" width="64" height="6" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="238" y="283" width="64" height="52" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="348" y="231" width="64" height="104" rx="3" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="458" y="179" width="64" height="156" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="568" y="127" width="64" height="208" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>

  <!-- value labels -->
  <g font-size="13" filter="url(#sk)" text-anchor="middle">
    <text x="160" y="319" fill="#b85450">0 ✗</text>
    <text x="270" y="271" fill="#b85450">1 ✗</text>
    <text x="380" y="219" fill="#a8781e" font-weight="bold">2 ✓</text>
    <text x="490" y="167" fill="#4a7a3a">3 ✓</text>
    <text x="600" y="115" fill="#4a7a3a">4 ✓</text>
  </g>

  <!-- employee labels -->
  <g font-size="11" fill="#666" text-anchor="middle" filter="url(#sk)">
    <text x="160" y="354">员工0</text>
    <text x="270" y="354">员工1</text>
    <text x="380" y="354">员工2</text>
    <text x="490" y="354">员工3</text>
    <text x="600" y="354">员工4</text>
  </g>

  <!-- callout: equality case -->
  <g filter="url(#sk)"><rect x="95" y="62" width="252" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="221" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">恰好 = target 也达标！</text>
  <text x="221" y="103" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">「至少」含等号 → 判定用 ≥</text>
  <path d="M 347 96 Q 380 150 374 224" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrC)" filter="url(#sk)"/>

  <!-- bottom notes -->
  <g filter="url(#sk)"><rect x="40" y="384" width="344" height="74" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="58" y="408" font-size="12" font-weight="bold" fill="#8f3a36" filter="url(#sk)">最常见 WA：把 ≥ 写成 &gt;</text>
  <text x="58" y="428" font-size="11" fill="#8f3a36" filter="url(#sk)">示例 1 会漏掉恰好 2 小时的员工 2，错答 2</text>
  <text x="58" y="446" font-size="11" fill="#8f3a36" filter="url(#sk)">读题先圈量词：「至少 / 不少于」= 含等号</text>
  <g filter="url(#sk)"><rect x="412" y="384" width="328" height="74" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="430" y="408" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">元素独立、与顺序无关</text>
  <text x="430" y="428" font-size="11" fill="#2b6e9e" filter="url(#sk)">→ 单趟扫描计数即可，O(1) 空间</text>
  <text x="430" y="446" font-size="11" fill="#2b6e9e" filter="url(#sk)">且无序数组必须读每个元素：O(n) 恰好最优</text>
</svg>
