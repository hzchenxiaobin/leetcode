<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：交集 = [max(起点), min(终点)]</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">长度 min(e₁,e₂) − max(s₁,s₂) ≥ duration 即可行，起点取 max(s₁,s₂)</text>

  <text x="52" y="82" font-size="12" fill="#3a4a66" font-weight="bold">人 1 时间线</text>
  <g filter="url(#rough2)">
    <line x1="120" y1="86" x2="520" y2="86" stroke="#999" stroke-width="1.2"/>
    <rect x="140" y="74" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="290" y="74" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#3a4a66">
    <text x="200" y="90">[10, 50]</text>
    <text x="365" y="90">[60, 120]</text>
  </g>

  <text x="52" y="152" font-size="12" fill="#3a5a30" font-weight="bold">人 2 时间线</text>
  <g filter="url(#rough2)">
    <line x1="120" y1="156" x2="520" y2="156" stroke="#999" stroke-width="1.2"/>
    <rect x="130" y="144" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <rect x="290" y="144" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#3a5a30">
    <text x="153" y="160">[0,15]</text>
    <text x="320" y="160">[60,70]</text>
  </g>

  <g filter="url(#rough2)">
    <line x1="290" y1="70" x2="290" y2="180" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
    <line x1="350" y1="70" x2="350" y2="180" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
  </g>

  <rect x="290" y="196" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="320" y="213" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">交集</text>
  <text x="380" y="212" font-size="10.5" fill="#b85450" filter="url(#rough2)">[60,70]，长 10 ≥ 8 ✓</text>

  <rect x="44" y="234" width="472" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">双指针的安全舍弃：先结束的时段出局</text>
  <text x="280" y="280" text-anchor="middle" font-size="10.5" fill="#555">若 A.end ≤ B.end 且当前交集不足 duration：</text>
  <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#555">人 2 后面的时段起点 &gt; B.end ≥ A.end，与 A 的交集必为空</text>
  <text x="280" y="316" text-anchor="middle" font-size="10.5" fill="#b85450">→ A 这条时段再也配不出可行交集，i 安全右移</text>
</svg>
