<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：BST 中序 = 升序数组 → 首尾双指针</text>

  <!-- 两棵 BST -->
  <g filter="url(#rough2)">
    <circle cx="120" cy="90" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="86" cy="140" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="154" cy="140" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <line x1="120" y1="108" x2="86" y2="124" stroke="#888" stroke-width="1.4"/>
    <line x1="120" y1="108" x2="154" y2="124" stroke="#888" stroke-width="1.4"/>
  </g>
  <text x="120" y="95" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="86" y="145" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="154" y="145" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="120" y="176" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">root1</text>

  <g filter="url(#rough2)">
    <circle cx="300" cy="90" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="266" cy="140" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="334" cy="140" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <line x1="300" y1="108" x2="266" y2="124" stroke="#888" stroke-width="1.4"/>
    <line x1="300" y1="108" x2="334" y2="124" stroke="#888" stroke-width="1.4"/>
  </g>
  <text x="300" y="95" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="266" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="334" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="300" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">root2</text>

  <!-- 中序箭头 -->
  <path d="M 86 160 Q 190 205 262 158" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="200" font-size="10.5" fill="#666" filter="url(#rough2)">中序遍历</text>

  <!-- 两条有序带 -->
  <text x="70" y="238" font-size="12" fill="#3a4a66" font-weight="bold">a = [1, 2, 4]（root1 升序）</text>
  <rect x="70" y="248" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text y="270" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="100">1</tspan><tspan x="160">2</tspan><tspan x="220">4</tspan></text>
  <path d="M 100 296 L 100 288" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="312" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">i：只向右 →</text>

  <text x="330" y="238" font-size="12" fill="#4a7a3a" font-weight="bold">b = [0, 1, 3]（root2 升序）</text>
  <rect x="330" y="248" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text y="270" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="360">0</tspan><tspan x="420">1</tspan><tspan x="480">3</tspan></text>
  <path d="M 480 296 L 480 288" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480" y="312" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">j：只向左 ←</text>

  <!-- 判定 -->
  <rect x="70" y="332" width="440" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="86" y="354" font-size="11.5" fill="#333" filter="url(#rough2)"><tspan font-weight="bold">s = a[i] + b[j]：</tspan> s == target → true</text>
  <text x="86" y="374" font-size="11.5" fill="#555" filter="url(#rough2)">s &lt; target → 和太小，b[j] 已是 b 里当前最大可选，i++</text>
  <text x="86" y="394" font-size="11.5" fill="#555" filter="url(#rough2)">s &gt; target → 和太大，a[i] 已是 a 里当前最小可选，j−−</text>

  <text x="70" y="62" font-size="11.5" fill="#555" filter="url(#rough2)">两棵树各取一个节点 → 归约为「两个有序数组的两数之和」</text>
</svg>
