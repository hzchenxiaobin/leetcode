<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">和谐子序列只含两个相邻值 → 长度 = cnt[x] + cnt[x+1]</text>

  <!-- 原数组 -->
  <text x="60" y="58" font-size="11" fill="#666" filter="url(#rough2)">nums</text>
  <rect x="104" y="36" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="61" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="148" y="36" width="40" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="61" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="192" y="36" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="61" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="236" y="36" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="61" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="280" y="36" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="61" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <rect x="324" y="36" width="40" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="61" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="368" y="36" width="40" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="61" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="412" y="36" width="40" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="61" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>

  <text x="280" y="94" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">按值归并计数（子序列不要求连续，同值元素可全部保留）</text>

  <!-- 值 → 次数 -->
  <rect x="60" y="104" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="92" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">值 1</text>
  <text x="92" y="139" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">×1</text>
  <rect x="160" y="104" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="192" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">值 2</text>
  <text x="192" y="139" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">×3</text>
  <rect x="260" y="104" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="292" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">值 3</text>
  <text x="292" y="139" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">×2</text>
  <rect x="360" y="104" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="392" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">值 5</text>
  <text x="392" y="139" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">×1</text>
  <rect x="460" y="104" width="64" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="492" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">值 7</text>
  <text x="492" y="139" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">×1</text>

  <!-- 相邻值对候选 -->
  <text x="530" y="170" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">相邻值对候选 →</text>
  <rect x="40" y="180" width="150" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="115" y="202" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 与 2</text>
  <text x="115" y="221" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">1 + 3 = 4</text>
  <rect x="205" y="180" width="150" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2 与 3 ⭐</text>
  <text x="280" y="221" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">3 + 2 = 5</text>
  <rect x="370" y="180" width="150" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="202" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5 与 6</text>
  <text x="445" y="221" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">1 + 0 无效</text>

  <!-- 承接箭头 -->
  <path d="M 92 148 V 176" stroke="#999" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 192 148 V 176" stroke="#999" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 292 148 V 176" stroke="#999" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 说明框 -->
  <rect x="40" y="252" width="480" height="94" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="278" font-size="11" fill="#2f5a26" filter="url(#rough2)">① 和谐 ⇒ 最大值与最小值恰好差 1；元素是整数，故值集合 ⊆ {x, x+1}。</text>
  <text x="60" y="303" font-size="11" fill="#2f5a26" filter="url(#rough2)">② 两个值都必须出现，否则只剩一个值、差为 0（如示例 3）。</text>
  <text x="60" y="328" font-size="11" fill="#2f5a26" filter="url(#rough2)">③ 同值元素全部保留不会破坏「保持原序」，故每个候选取满计数。</text>
  <text x="280" y="372" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">答案 = max { cnt[x] + cnt[x+1] : cnt[x] &gt; 0 且 cnt[x+1] &gt; 0 }</text>
</svg>
