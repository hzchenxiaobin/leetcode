<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [4,2,4,5,6] → 答案 17</text>
  <path d="M 190 36 Q 320 46 450 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- row highlight backgrounds -->
  <g filter="url(#sk)">
    <rect x="22" y="184" width="386" height="40" fill="#fff8e1"/>
    <rect x="22" y="272" width="386" height="40" fill="#e6f4ea"/>
  </g>

  <!-- table frame -->
  <g filter="url(#sk)">
    <rect x="20" y="64" width="390" height="30" fill="#e8f0fe"/>
    <rect x="20" y="64" width="390" height="250" fill="none" stroke="#446688" stroke-width="1.6"/>
    <path d="M 58 64 L 58 314 M 108 64 L 108 314 M 238 64 L 238 314 M 318 64 L 318 314 M 364 64 L 364 314" stroke="#446688" stroke-width="1.1"/>
    <path d="M 20 138 L 410 138 M 20 182 L 410 182 M 20 226 L 410 226 M 20 270 L 410 270" stroke="#446688" stroke-width="1.1"/>
  </g>

  <!-- header -->
  <g filter="url(#sk)" font-size="11.5" font-weight="bold" fill="#2b4a6e" text-anchor="middle">
    <text x="39" y="83">步骤</text>
    <text x="83" y="83">right</text>
    <text x="173" y="83">动作</text>
    <text x="278" y="83">窗口</text>
    <text x="341" y="83">sum</text>
    <text x="387" y="83">ans</text>
  </g>

  <!-- table rows -->
  <g filter="url(#sk)" font-size="11" fill="#333" text-anchor="middle">
    <text x="39" y="120">1</text><text x="83" y="120">0</text><text x="173" y="120">4 入窗</text><text x="278" y="120">[4]</text><text x="341" y="120">4</text><text x="387" y="120">4</text>
    <text x="39" y="164">2</text><text x="83" y="164">1</text><text x="173" y="164">2 入窗</text><text x="278" y="164">[4,2]</text><text x="341" y="164">6</text><text x="387" y="164">6</text>
    <text x="39" y="208">3</text><text x="83" y="208">2</text><text x="173" y="208" font-size="10">4 重复 → 移出再入窗</text><text x="278" y="208">[2,4]</text><text x="341" y="208">6</text><text x="387" y="208">6</text>
    <text x="39" y="252">4</text><text x="83" y="252">3</text><text x="173" y="252">5 入窗</text><text x="278" y="252">[2,4,5]</text><text x="341" y="252">11</text><text x="387" y="252">11</text>
    <text x="39" y="296">5</text><text x="83" y="296">4</text><text x="173" y="296">6 入窗</text><text x="278" y="296" font-size="10.5">[2,4,5,6]</text><text x="341" y="296">17</text><text x="387" y="296">17</text>
  </g>

  <!-- strip header -->
  <text x="505" y="58" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">数组状态（蓝 = 窗口内）</text>

  <!-- mini strips: window fills first -->
  <!-- row 1: window [0,0] -->
  <g filter="url(#sk)">
    <rect x="432" y="103" width="26" height="26" fill="#e8f0fe" stroke="#b85450" stroke-width="1.8"/>
    <rect x="462" y="103" width="26" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="492" y="103" width="26" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="522" y="103" width="26" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="552" y="103" width="26" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <!-- row 2: window [0,1] -->
    <rect x="432" y="147" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="462" y="147" width="26" height="26" fill="#e8f0fe" stroke="#b85450" stroke-width="1.8"/>
    <rect x="492" y="147" width="26" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="522" y="147" width="26" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="552" y="147" width="26" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <!-- row 3: window [1,2], cell0 just removed -->
    <rect x="432" y="191" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="462" y="191" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="492" y="191" width="26" height="26" fill="#e8f0fe" stroke="#b85450" stroke-width="1.8"/>
    <rect x="522" y="191" width="26" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="552" y="191" width="26" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <!-- row 4: window [1,3] -->
    <rect x="432" y="235" width="26" height="26" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="462" y="235" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="492" y="235" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="522" y="235" width="26" height="26" fill="#e8f0fe" stroke="#b85450" stroke-width="1.8"/>
    <rect x="552" y="235" width="26" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <!-- row 5: window [1,4] -->
    <rect x="432" y="279" width="26" height="26" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="462" y="279" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="492" y="279" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="522" y="279" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="552" y="279" width="26" height="26" fill="#e6f4ea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <!-- mini strip values -->
  <g filter="url(#sk)" font-size="11" fill="#333" text-anchor="middle">
    <text x="445" y="120">4</text><text x="475" y="120">2</text><text x="505" y="120">4</text><text x="535" y="120">5</text><text x="565" y="120">6</text>
    <text x="445" y="164">4</text><text x="475" y="164">2</text><text x="505" y="164">4</text><text x="535" y="164">5</text><text x="565" y="164">6</text>
    <text x="445" y="208">4</text><text x="475" y="208">2</text><text x="505" y="208">4</text><text x="535" y="208">5</text><text x="565" y="208">6</text>
    <text x="445" y="252">4</text><text x="475" y="252">2</text><text x="505" y="252">4</text><text x="535" y="252">5</text><text x="565" y="252">6</text>
    <text x="445" y="296">4</text><text x="475" y="296" fill="#2e5a24" font-weight="bold">2</text><text x="505" y="296" fill="#2e5a24" font-weight="bold">4</text><text x="535" y="296" fill="#2e5a24" font-weight="bold">5</text><text x="565" y="296" fill="#2e5a24" font-weight="bold">6</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="334" width="560" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g filter="url(#sk)" text-anchor="middle">
    <text x="320" y="360" font-size="13" font-weight="bold" fill="#2e5a24">最终 ans = 17，对应互异子数组 [2,4,5,6]</text>
    <text x="320" y="382" font-size="11.5" fill="#4a7a3a">全程只在第 3 步收缩一次：left 由 0 推进到 1，此后一路扩张到底</text>
    <text x="320" y="402" font-size="11.5" fill="#4a7a3a">left 全程只前进 1 步——均摊 O(n) 的直观体现</text>
  </g>
</svg>
