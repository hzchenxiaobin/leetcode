<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：BFS 队列的每一拍</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">children 表：0 → [3]，3 → [1, 5]，5 → [10]；kill = 5</text>

  <rect x="50" y="62" width="460" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <rect x="50" y="96" width="460" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <rect x="50" y="128" width="460" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>

  <path d="M 130 62 L 130 160" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 205 62 L 205 160" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 330 62 L 330 160" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>

  <text x="90" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="167" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">出队 u</text>
  <text x="267" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">ans</text>
  <text x="420" y="84" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">队列（待处理）</text>

  <text x="90" y="117" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="167" y="117" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="267" y="117" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[5]</text>
  <text x="420" y="117" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[10] ← children[5]</text>

  <text x="90" y="149" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="167" y="149" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">10</text>
  <text x="267" y="149" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[5, 10]</text>
  <text x="420" y="149" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">[] 空 → 遍历结束</text>

  <text x="50" y="180" font-size="10" fill="#888" filter="url(#rough2)">注意 3 是 5 的父进程、1 是 5 的兄弟，二者都不在 ans 里：感染只能向下传。</text>

  <rect x="60" y="200" width="440" height="110" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="76" y="220" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">链式数据：pid = [2, 4, 7]，ppid = [0, 2, 4]，kill = 2</text>

  <rect x="96" y="238" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="259" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">2</text>
  <path d="M 150 254 L 186 254" stroke="#c98a2a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="192" y="238" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="216" y="259" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">4</text>
  <path d="M 246 254 L 282 254" stroke="#c98a2a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="288" y="238" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="312" y="259" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">7</text>

  <text x="120" y="290" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">根</text>
  <text x="216" y="290" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">子</text>
  <text x="312" y="290" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">孙</text>
  <text x="360" y="259" font-size="10" fill="#555" filter="url(#rough2)">答案 [2, 4, 7]</text>

  <rect x="60" y="326" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="345" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">链可长达 n，所以遍历必须迭代实现：递归 DFS 在 n = 10⁵ 的链上会爆栈。</text>
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">每层只多压一个孩子，队列长度最坏是「兄弟总数」，仍不超过 n。</text>
</svg>
