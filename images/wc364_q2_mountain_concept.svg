<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：固定峰后，每座塔「尽量高」即最优</text>
  <text x="340" y="53" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">示例 2：maxHeights = [6,5,3,9,2,7]，峰取 i=3 —— 虚线框 = 砖块上限，实心柱 = 最终塔高 [3,3,3,9,2,2]，和 = 22</text>

  <!-- upper limit towers (dashed) -->
  <g filter="url(#sk)">
    <rect x="80"  y="282" width="56" height="78"  fill="#e8f0fe" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" rx="3"/>
    <rect x="162" y="295" width="56" height="65"  fill="#e8f0fe" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" rx="3"/>
    <rect x="244" y="321" width="56" height="39"  fill="#e8f0fe" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" rx="3"/>
    <rect x="326" y="243" width="56" height="117" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" rx="3"/>
    <rect x="408" y="334" width="56" height="26"  fill="#e8f0fe" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" rx="3"/>
    <rect x="490" y="269" width="56" height="91"  fill="#e8f0fe" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" rx="3"/>
  </g>

  <!-- final towers (solid, peak orange) -->
  <g filter="url(#sk)">
    <rect x="80"  y="321" width="56" height="39"  fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="162" y="321" width="56" height="39"  fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="244" y="321" width="56" height="39"  fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="326" y="243" width="56" height="117" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3"/>
    <rect x="408" y="334" width="56" height="26"  fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="490" y="334" width="56" height="26"  fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
  </g>

  <!-- flattened water levels -->
  <g stroke="#b85450" stroke-width="1.4" stroke-dasharray="7 5" fill="none" filter="url(#sk)">
    <path d="M 70 321 L 318 321"/>
    <path d="M 362 334 L 558 334"/>
  </g>
  <text x="72" y="313" font-size="10.5" fill="#b85450" filter="url(#sk)">min 水位 = 3</text>
  <text x="556" y="327" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#sk)">min 水位 = 2</text>

  <!-- propagation arrows -->
  <g fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#sk)">
    <path d="M 320 258 Q 225 234 120 280" marker-end="url(#arr)"/>
    <path d="M 388 258 Q 483 232 520 264" marker-end="url(#arr)"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="222" y="222" font-size="12" font-weight="bold" fill="#3a6a2a">向左传播 min</text>
    <text x="222" y="238" font-size="10.5" fill="#4a7a3a">左侧全部压平到 3</text>
    <text x="486" y="222" font-size="12" font-weight="bold" fill="#3a6a2a">向右传播 min</text>
    <text x="486" y="238" font-size="10.5" fill="#4a7a3a">右侧全部压平到 2</text>
  </g>

  <!-- tower values / peak label / h labels -->
  <g text-anchor="middle" filter="url(#sk)">
    <text x="108" y="342" font-size="12" font-weight="bold" fill="#3a6a2a">3</text>
    <text x="190" y="342" font-size="12" font-weight="bold" fill="#3a6a2a">3</text>
    <text x="272" y="342" font-size="12" font-weight="bold" fill="#3a6a2a">3</text>
    <text x="354" y="263" font-size="13" font-weight="bold" fill="#8a6520">9</text>
    <text x="436" y="352" font-size="12" font-weight="bold" fill="#3a6a2a">2</text>
    <text x="518" y="352" font-size="12" font-weight="bold" fill="#3a6a2a">2</text>
    <text x="354" y="231" font-size="13.5" font-weight="bold" fill="#b85450">峰 i=3</text>
    <text x="108" y="382" font-size="11.5" fill="#555">h=6</text>
    <text x="190" y="382" font-size="11.5" fill="#555">h=5</text>
    <text x="272" y="382" font-size="11.5" fill="#555">h=3</text>
    <text x="354" y="382" font-size="11.5" fill="#8a6520" font-weight="bold">h=9（峰）</text>
    <text x="436" y="382" font-size="11.5" fill="#555">h=2</text>
    <text x="518" y="382" font-size="11.5" fill="#555">h=7</text>
  </g>

  <!-- formula card -->
  <rect x="55" y="398" width="570" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="340" y="421" font-size="12" fill="#6a4a10">传播式：t[i] = h[i]，从峰向两侧逐格 t[k] = min(邻塔已定高度, h[k])</text>
    <text x="340" y="443" font-size="11.5" fill="#8a6520">等价区间式：左半 t[k] = min(h[k..i])，右半 t[k] = min(h[i..k]) —— 每座塔顶到约束允许的最高</text>
  </g>
</svg>
