<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">分成两个等和子集 ⇔ 0-1 背包凑出 S/2</text>
  <text x="280" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">只要有一侧的和为 S/2，另一侧（补集）的和自动也是 S/2</text>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold">
    <rect x="176" y="66" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="226" y="66" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="276" y="66" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="326" y="66" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="199" y="91" fill="#3a4a66">1</text>
    <text x="249" y="91" fill="#3a4a66">5</text>
    <text x="299" y="91" fill="#3a4a66">11</text>
    <text x="349" y="91" fill="#3a4a66">5</text>
  </g>
  <text x="166" y="91" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">nums =</text>

  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#b07a20" font-weight="bold" filter="url(#rough2)">S = 1+5+11+5 = 22（偶数）⇒ target = S/2 = 11</text>

  <path d="M 280 158 L 280 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="182" width="448" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="70" y="204" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">子集 A 的和 = 11 ⇒ 补集 B 的和 = 22 − 11 = 11</text>
  <text x="70" y="222" font-size="10.5" fill="#4a6a44" filter="url(#rough2)">所以「存在等和划分」⟺「存在一个子集，元素和恰为 target」</text>

  <path d="M 280 240 L 280 258" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="264" width="448" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="70" y="286" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">0-1 背包：每个 nums[i] 最多用 1 次，容量上限 target</text>
  <text x="70" y="305" font-size="10.5" fill="#7a6020" filter="url(#rough2)">dp[j]：能否用已处理的元素恰好凑出和 j（j = 0 … target）</text>

  <text x="280" y="342" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">① S 为奇数 → 直接 false：两半和相等意味着 S 必为偶数</text>
  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">② 存在元素 &gt; target → 直接 false：它放哪一侧，那一侧都会超过 target</text>
</svg>
