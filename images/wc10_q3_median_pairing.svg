<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">排序 + 两头配对：L1 代价只由两端差值决定</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">nums = [1, 10, 2, 9]，n = 4，中位数区间是 [2, 9]</text>

  <text x="72" y="118" font-size="10.5" fill="#888" filter="url(#rough2)">升序排列后的数轴</text>

  <rect x="166" y="158" width="266" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <path d="M 88 170 L 502 170" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <line x1="128" y1="162" x2="128" y2="178" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="166" y1="162" x2="166" y2="178" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="432" y1="162" x2="432" y2="178" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="470" y1="162" x2="470" y2="178" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <circle cx="128" cy="170" r="6.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="166" cy="170" r="6.5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="432" cy="170" r="6.5" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="470" cy="170" r="6.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <text x="128" y="146" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="166" y="146" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="432" y="146" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">9</text>
  <text x="470" y="146" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">10</text>

  <text x="299" y="202" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">目标 t 落在绿色区间 → 总代价最小</text>

  <line x1="166" y1="177" x2="166" y2="230" stroke="#446688" stroke-width="0.9" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <line x1="432" y1="177" x2="432" y2="230" stroke="#446688" stroke-width="0.9" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <line x1="166" y1="230" x2="432" y2="230" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="166" y1="225" x2="166" y2="235" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="432" y1="225" x2="432" y2="235" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="299" y="252" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">配对 2 ↔ 9：贡献 9 − 2 = 7（与 t 无关）</text>

  <line x1="128" y1="177" x2="128" y2="272" stroke="#d6a040" stroke-width="0.9" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <line x1="470" y1="177" x2="470" y2="272" stroke="#d6a040" stroke-width="0.9" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <line x1="128" y1="272" x2="470" y2="272" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="128" y1="267" x2="128" y2="277" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="470" y1="267" x2="470" y2="277" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="299" y="294" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">配对 1 ↔ 10：贡献 10 − 1 = 9（与 t 无关）</text>

  <rect x="110" y="308" width="340" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">总操作数 = (10 − 1) + (9 − 2) = 9 + 7 = 16</text>
  <text x="280" y="345" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">t 取区间内任意值（如 t = 2 或 t = 9）结果都一样</text>

  <text x="280" y="378" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">只要 t 落在 [a_l, a_r] 内，这对元素到 t 的距离之和恒等于 a_r − a_l</text>
</svg>
