<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：逐行递推，答案 4</text>
  <text x="310" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">列号从 0 起；绿格 = 安排学生，灰格 = 坏座位</text>

  <!-- 座次图 -->
  <g filter="url(#rough2)">
    <text x="44" y="76" text-anchor="end" font-size="10" fill="#888">r0</text>
    <text x="44" y="118" text-anchor="end" font-size="10" fill="#888">r1</text>
    <text x="44" y="160" text-anchor="end" font-size="10" fill="#888">r2</text>
  </g>
  <g filter="url(#rough2)" stroke-width="1.3">
    <rect x="52" y="56" width="36" height="36" fill="#e2e2e2" stroke="#b9b9b9"/>
    <rect x="90" y="56" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="128" y="56" width="36" height="36" fill="#e2e2e2" stroke="#b9b9b9"/>
    <rect x="166" y="56" width="36" height="36" fill="#e2e2e2" stroke="#b9b9b9"/>
    <rect x="204" y="56" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="242" y="56" width="36" height="36" fill="#e2e2e2" stroke="#b9b9b9"/>

    <rect x="52" y="98" width="36" height="36" fill="#ffffff" stroke="#b9b9b9"/>
    <rect x="90" y="98" width="36" height="36" fill="#e2e2e2" stroke="#b9b9b9"/>
    <rect x="128" y="98" width="36" height="36" fill="#e2e2e2" stroke="#b9b9b9"/>
    <rect x="166" y="98" width="36" height="36" fill="#e2e2e2" stroke="#b9b9b9"/>
    <rect x="204" y="98" width="36" height="36" fill="#e2e2e2" stroke="#b9b9b9"/>
    <rect x="242" y="98" width="36" height="36" fill="#ffffff" stroke="#b9b9b9"/>

    <rect x="52" y="140" width="36" height="36" fill="#e2e2e2" stroke="#b9b9b9"/>
    <rect x="90" y="140" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="128" y="140" width="36" height="36" fill="#e2e2e2" stroke="#b9b9b9"/>
    <rect x="166" y="140" width="36" height="36" fill="#e2e2e2" stroke="#b9b9b9"/>
    <rect x="204" y="140" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="242" y="140" width="36" height="36" fill="#e2e2e2" stroke="#b9b9b9"/>
  </g>
  <g filter="url(#rough2)">
    <text x="70" y="80" text-anchor="middle" font-size="11" fill="#8a8a8a">#</text>
    <text x="108" y="80" text-anchor="middle" font-size="11" fill="#2f5a2f">生</text>
    <text x="146" y="80" text-anchor="middle" font-size="11" fill="#8a8a8a">#</text>
    <text x="184" y="80" text-anchor="middle" font-size="11" fill="#8a8a8a">#</text>
    <text x="222" y="80" text-anchor="middle" font-size="11" fill="#2f5a2f">生</text>
    <text x="260" y="80" text-anchor="middle" font-size="11" fill="#8a8a8a">#</text>

    <text x="108" y="122" text-anchor="middle" font-size="11" fill="#2f5a2f">生</text>
    <text x="260" y="122" text-anchor="middle" font-size="11" fill="#2f5a2f">生</text>

    <text x="70" y="164" text-anchor="middle" font-size="11" fill="#8a8a8a">#</text>
    <text x="108" y="164" text-anchor="middle" font-size="11" fill="#2f5a2f">生</text>
    <text x="146" y="164" text-anchor="middle" font-size="11" fill="#8a8a8a">#</text>
    <text x="184" y="164" text-anchor="middle" font-size="11" fill="#8a8a8a">#</text>
    <text x="222" y="164" text-anchor="middle" font-size="11" fill="#2f5a2f">生</text>
    <text x="260" y="164" text-anchor="middle" font-size="11" fill="#8a8a8a">#</text>
  </g>

  <!-- 右侧：每行关键转移 -->
  <g filter="url(#rough2)">
    <rect x="300" y="56" width="286" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
    <text x="314" y="78" font-size="11" fill="#2f4a6a" font-weight="bold">每行的「关键转移」</text>
    <text x="314" y="100" font-size="10.5" fill="#33475e">r0：可用 {1,4}，空行之上 → dp = 2</text>
    <text x="314" y="122" font-size="10.5" fill="#33475e">r1：可用 {0,5}，四种坐法 dp 全为 2</text>
    <text x="314" y="142" font-size="10.5" fill="#33475e">　　（最多 2 人，且都留有回旋余地）</text>
    <text x="314" y="164" font-size="10.5" fill="#b85450">r2：与 r1 的空行无缝续上 → 2 + 2 = 4</text>
  </g>

  <!-- dp 明细表 -->
  <g filter="url(#rough2)">
    <rect x="40" y="196" width="546" height="30" fill="#f0f4f8" stroke="#8aa0b8" stroke-width="1.3" rx="6"/>
    <text x="52" y="216" font-size="10.5" fill="#33475e">行</text>
    <text x="96" y="216" font-size="10.5" fill="#33475e">可用列</text>
    <text x="170" y="216" font-size="10.5" fill="#33475e">每个合法掩码 → dp 值（取其中最大者为该行最优）</text>

    <rect x="40" y="226" width="546" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="6"/>
    <text x="52" y="246" font-size="10.5" fill="#888">r0</text>
    <text x="96" y="246" font-size="10.5" fill="#333">{1,4}</text>
    <text x="170" y="246" font-size="10.5" fill="#333">{} → 0　　{1} → 1　　{4} → 1　　{1,4} → 2</text>

    <rect x="40" y="256" width="546" height="30" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" rx="6"/>
    <text x="52" y="276" font-size="10.5" fill="#888">r1</text>
    <text x="96" y="276" font-size="10.5" fill="#333">{0,5}</text>
    <text x="170" y="276" font-size="10.5" fill="#333">{} → 2　　{0} → 2　　{5} → 2　　{0,5} → 2</text>

    <rect x="40" y="286" width="546" height="30" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.3" rx="6"/>
    <text x="52" y="306" font-size="10.5" fill="#8a6a20">r2</text>
    <text x="96" y="306" font-size="10.5" fill="#8a6a20">{1,4}</text>
    <text x="170" y="306" font-size="10.5" fill="#8a6a20">{} → 2　　{1} → 3　　{4} → 3　　{1,4} → 4</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="330" width="546" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="54" y="352" font-size="10.5" fill="#2f5a2f">答案 = max dp[2][*] = 4，回溯 r2 {1,4} ← r1 {} ← r0 {1,4}，人数 2 + 0 + 2 = 4</text>
    <text x="54" y="372" font-size="10" fill="#5d7a52">注意 r1 的 {0,5} 虽坐满 2 人，却挡住 r2 的 {1,4}，故不是通往最优的路径</text>
  </g>
</svg>
