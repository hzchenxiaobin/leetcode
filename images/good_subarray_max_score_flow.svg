<svg xmlns="http://www.w3.org/2000/svg" width="560" height="545" viewBox="0 0 560 545" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/></marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/></marker>
  </defs>
  <rect width="560" height="545" fill="#fdfcf7"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#sk)">算法流程：从 k 出发的贪心双向扩展</text>
  <g filter="url(#sk)"><rect x="130" y="38" width="300" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="58" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#sk)">初始化：l = r = k，mn = nums[k]</text>
  <text x="280" y="74" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">ans = nums[k]（窗口 [k,k] 本身就是候选）</text>
  <path d="M 280 84 L 280 98" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><polygon points="280,102 400,134 280,166 160,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="280" y="130" text-anchor="middle" font-size="11" fill="#b07818" font-weight="bold" filter="url(#sk)">还能扩展？</text>
  <text x="280" y="147" text-anchor="middle" font-size="9" fill="#666" filter="url(#sk)">(l &gt; 0 或 r &lt; n−1)</text>
  <path d="M 400 134 L 456 134" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="428" y="126" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><rect x="462" y="118" width="92" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="508" y="138" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">返回 ans</text>
  <path d="M 280 166 L 280 188" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="290" y="182" text-anchor="middle" font-size="10" fill="#4a8e4a" font-weight="bold" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><polygon points="280,192 408,228 280,264 152,228" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="216" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#sk)">哪边邻居更大？</text>
  <text x="280" y="232" text-anchor="middle" font-size="9" fill="#555" font-family="'Courier New',monospace" filter="url(#sk)">lv = nums[l−1]，rv = nums[r+1]</text>
  <text x="280" y="247" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#sk)">越界一侧记 −∞</text>
  <path d="M 152 228 L 112 228 L 112 254" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="122" y="220" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#sk)">lv > rv</text>
  <path d="M 408 228 L 448 228 L 448 254" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="440" y="220" text-anchor="middle" font-size="9" fill="#4a8e4a" font-weight="bold" filter="url(#sk)">lv ≤ rv</text>
  <text x="456" y="250" text-anchor="start" font-size="8.5" fill="#888" filter="url(#sk)">（相等走右）</text>
  <g filter="url(#sk)"><rect x="30" y="258" width="164" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="112" y="276" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">向左扩展</text>
  <text x="112" y="292" text-anchor="middle" font-size="8.5" fill="#555" font-family="'Courier New',monospace" filter="url(#sk)">l ← l−1，mn ← min(mn, nums[l])</text>
  <g filter="url(#sk)"><rect x="366" y="258" width="164" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="448" y="276" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">向右扩展</text>
  <text x="448" y="292" text-anchor="middle" font-size="8.5" fill="#555" font-family="'Courier New',monospace" filter="url(#sk)">r ← r+1，mn ← min(mn, nums[r])</text>
  <path d="M 112 302 L 112 347 L 161 347" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 448 302 L 448 347 L 399 347" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="165" y="326" width="230" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="280" y="346" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold" filter="url(#sk)">记录候选</text>
  <text x="280" y="364" text-anchor="middle" font-size="9.5" fill="#555" font-family="'Courier New',monospace" filter="url(#sk)">ans ← max(ans, mn × (r−l+1))</text>
  <path d="M 280 376 L 280 404 L 22 404 L 22 134 L 156 134" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#ar)" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="150" y="398" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">共 n−1 轮，每轮并入 1 个元素</text>
  <g filter="url(#sk)"><rect x="30" y="420" width="500" height="108" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="50" y="444" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">不变式（正确性骨架，详见 §5）</text>
  <text x="50" y="466" text-anchor="start" font-size="10" fill="#555" filter="url(#sk)">① 任意时刻：窗口 [l,r] ⊆ W(mn)（窗口内元素全 ≥ mn 且含 k）</text>
  <text x="50" y="486" text-anchor="start" font-size="10" fill="#555" filter="url(#sk)">② 窗口首次铺满 W(v) 的那一步，mn 恰等于 v → 记录候选 v×|W(v)|</text>
  <text x="50" y="506" text-anchor="start" font-size="10" fill="#555" filter="url(#sk)">③ mn 单调不增、宽度每轮 +1：所有「临界水位」自上而下逐个被考察</text>
</svg>
