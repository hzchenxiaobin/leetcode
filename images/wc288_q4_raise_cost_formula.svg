<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="450" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">抬升最小值：把低于 m 的花园都补到 m</text>
  <path d="M 150 40 Q 320 50 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#666">前缀 [2, 3, 4]（示例 2 的 k=3 行），目标最小值 m = 4</text>

  <!-- bars: baseline 290, unit 36 -->
  <g filter="url(#sk2)">
    <rect x="170" y="218" width="50" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="170" y="146" width="50" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk2)">
    <rect x="240" y="182" width="50" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="240" y="146" width="50" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk2)">
    <rect x="310" y="146" width="50" height="144" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="195" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">＋2</text>
  <text x="265" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">＋1</text>

  <!-- m line -->
  <path d="M 140 146 L 380 146" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="136" y="150" text-anchor="end" font-size="11.5" font-weight="bold" fill="#b07818">m = 4</text>
  <text x="335" y="136" text-anchor="middle" font-size="10" fill="#446688">= m，无需补</text>

  <!-- baseline + value labels -->
  <path d="M 140 290 L 380 290" stroke="#666" stroke-width="1.6" filter="url(#sk)"/>
  <text x="195" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">2</text>
  <text x="265" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">3</text>
  <text x="335" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">4</text>

  <!-- prefix bracket -->
  <path d="M 170 320 L 170 328 L 360 328 L 360 320" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="265" y="346" text-anchor="middle" font-size="11" fill="#2b4a6e">前缀 flowers[0..k−1]：p = 2 个低于 m，1 个已 ≥ m</text>

  <!-- formula box -->
  <g filter="url(#sk2)">
    <rect x="410" y="90" width="215" height="120" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="517" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" font-family="monospace">cost(m) = m·p − S_p</text>
  <text x="517" y="138" text-anchor="middle" font-size="11" fill="#7a5415">p = 前缀中 &lt; m 的个数（lower_bound）</text>
  <text x="517" y="158" text-anchor="middle" font-size="11" fill="#7a5415">S_p = 前 p 个之和（前缀和 pref）</text>
  <text x="517" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22" font-family="monospace">= 4×2 − (2+3) = 3 朵</text>

  <!-- binary search box -->
  <g filter="url(#sk2)">
    <rect x="410" y="226" width="215" height="96" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="517" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36">cost(m) 随 m 单调不减</text>
  <text x="517" y="270" text-anchor="middle" font-size="11.5" fill="#8a3a36">⇒ 二分最大的 m，使</text>
  <text x="517" y="290" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36" font-family="monospace">cost(m) ≤ remain</text>
  <text x="517" y="311" text-anchor="middle" font-size="10.5" fill="#8a3a36">m ∈ [flowers[0], target−1]</text>

  <!-- note box -->
  <g filter="url(#sk2)">
    <rect x="40" y="362" width="560" height="76" rx="8" fill="#f4f7fb" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="58" y="384" font-size="11.5" fill="#2b4a6e">1. 只补「低于 m」的：≥ m 的花园再补也不改变最小值，纯浪费（引理 3）。</text>
  <text x="58" y="405" font-size="11.5" fill="#2b4a6e">2. m 上界 target−1：一旦补到 target 该花园即完善，交给更小的 k 去枚举。</text>
  <text x="58" y="426" font-size="11.5" fill="#2b4a6e">3. p 由 lower_bound 定位、S_p 由前缀和 O(1) 取得，单次判定 O(log n)。</text>
</svg>
