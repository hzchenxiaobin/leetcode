<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：两个数据范围把搜索空间钉死在 10⁶ 量级</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#666666">路径可重复经过节点（是一条闭合 walk 而非简单路径），但「步数 × 分支数」都被约束限死</text>

  <g filter="url(#sk)">
    <rect x="36" y="58" width="270" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="50" y="78" font-size="11.5" font-weight="bold" fill="#8a6415">约束①：每条边 ≥ 10 秒，maxTime ≤ 100</text>
  <text x="50" y="96" font-size="10.5" fill="#555555">→ 一条 walk 至多 ⌊100/10⌋ = 10 条边</text>
  <text x="50" y="112" font-size="10.5" fill="#555555">→ 至多踩到 11 个不同节点</text>

  <g filter="url(#sk)">
    <rect x="36" y="132" width="270" height="62" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="50" y="152" font-size="11.5" font-weight="bold" fill="#2b6e9e">约束②：每个节点至多 4 条边</text>
  <text x="50" y="170" font-size="10.5" fill="#555555">→ 搜索树每一层至多 4 个分支</text>
  <text x="50" y="186" font-size="10.5" fill="#555555">→ 折返回父节点也要占掉一个分支</text>

  <g filter="url(#sk)">
    <rect x="36" y="206" width="270" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="50" y="226" font-size="11.5" font-weight="bold" fill="#2e6e2e">合计：状态数 ≤ 4⁰ + 4¹ + … + 4¹⁰</text>
  <text x="50" y="244" font-size="10.5" fill="#555555">≈ 1.4 × 10⁶ 条前缀 walk，上界还很松</text>
  <text x="50" y="260" font-size="10.5" fill="#555555">每个状态 O(1) 记账 → 整体毫秒级</text>

  <text x="477" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">从节点 0 出发的搜索树（示意）</text>

  <g filter="url(#sk)" stroke="#8899aa" stroke-width="1.1" fill="none">
    <path d="M477,109 L385,138"/>
    <path d="M477,109 L446,138"/>
    <path d="M477,109 L508,138"/>
    <path d="M477,109 L569,138"/>
    <path d="M385,154 L364,184"/>
    <path d="M385,154 L385,184"/>
    <path d="M385,154 L406,184"/>
    <path d="M446,154 L425,184"/>
    <path d="M446,154 L446,184"/>
    <path d="M446,154 L467,184"/>
    <path d="M508,154 L487,184"/>
    <path d="M508,154 L508,184"/>
    <path d="M508,154 L529,184"/>
    <path d="M569,154 L548,184"/>
    <path d="M569,154 L569,184"/>
    <path d="M569,154 L590,184"/>
  </g>

  <g filter="url(#sk)">
    <circle cx="477" cy="96" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="385" cy="146" r="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <circle cx="446" cy="146" r="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <circle cx="508" cy="146" r="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <circle cx="569" cy="146" r="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <circle cx="364" cy="192" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="385" cy="192" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="406" cy="192" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="425" cy="192" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="446" cy="192" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="467" cy="192" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="487" cy="192" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="508" cy="192" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="529" cy="192" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="548" cy="192" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="569" cy="192" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="590" cy="192" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
  </g>
  <text x="477" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">0</text>

  <text x="477" y="224" text-anchor="middle" font-size="20" fill="#888888">⋮</text>

  <g filter="url(#sk)">
    <circle cx="402" cy="254" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="429" cy="254" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="456" cy="254" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="483" cy="254" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="510" cy="254" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="537" cy="254" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
    <circle cx="564" cy="254" r="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/>
  </g>
  <path d="M338,240 L616,240" stroke="#b85450" stroke-width="1.3" stroke-dasharray="6,4" fill="none" filter="url(#sk)"/>
  <text x="477" y="278" text-anchor="middle" font-size="10.5" fill="#b85450">深度 ≤ 10：再走一步就有 t + w &gt; maxTime，被剪枝</text>

  <g filter="url(#sk)">
    <rect x="36" y="296" width="588" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="330" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">结论：无需任何图论优化，DFS 回溯直接枚举时间预算内的所有 walk</text>
  <text x="330" y="340" text-anchor="middle" font-size="10.5" fill="#555555">cnt[] 计数管「首访加值」；回到 0 就用当前 cur 刷新 ans，穿过 0 还能继续走</text>

  <text x="320" y="384" text-anchor="middle" font-size="10.5" fill="#888888">反证必要性：若 timeⱼ 可以为 1，深度可达 100、状态数 4¹⁰⁰ —— 本解法强依赖 timeⱼ ≥ 10 这一约定</text>
</svg>
