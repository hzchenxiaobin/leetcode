<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：逐层概率传播 + 滚动数组</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第 t 层只依赖第 t − 1 层，因此两个 n × n 概率表交替使用即可</text>

  <rect x="40" y="64" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="90" text-anchor="middle" font-size="11" fill="#33445f" filter="url(#rough2)">f[r][c] = 1（t = 0，还没走）</text>

  <path d="M 160 106 L 160 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="124" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="143" text-anchor="middle" font-size="11" fill="#33445f" filter="url(#rough2)">for t = 1 … k：逐层推进</text>
  <text x="160" y="158" text-anchor="middle" font-size="10" fill="#66788f" filter="url(#rough2)">每一层求出「还剩 t 步」的存活概率</text>

  <path d="M 160 166 L 160 182" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="184" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="203" text-anchor="middle" font-size="11" fill="#33445f" filter="url(#rough2)">枚举全部 n² 个格子 (r, c)</text>
  <text x="160" y="218" text-anchor="middle" font-size="10" fill="#66788f" filter="url(#rough2)">对每个格子试 8 个候选方向</text>

  <path d="M 140 226 L 104 244" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 226 L 216 244" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="246" width="112" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="96" y="266" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">界内：累加 f 邻格</text>
  <text x="96" y="281" text-anchor="middle" font-size="9.5" fill="#5a7a4a" filter="url(#rough2)">贡献 1/8 的权重</text>

  <rect x="168" y="246" width="112" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="224" y="266" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">越界：直接跳过</text>
  <text x="224" y="281" text-anchor="middle" font-size="9.5" fill="#a06a66" filter="url(#rough2)">贡献 0（骑士已停下）</text>

  <path d="M 96 286 L 138 302" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 224 286 L 182 302" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="304" width="240" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="324" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">g[r][c] = 累加和 ÷ 8，然后 swap(f, g)</text>
  <text x="160" y="340" text-anchor="middle" font-size="10" fill="#a08a50" filter="url(#rough2)">除以固定的 8，不是除以界的个数</text>

  <path d="M 160 350 L 160 366" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="368" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="388" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">t = k 时停止，返回 f[row][column]</text>
  <text x="160" y="403" text-anchor="middle" font-size="10" fill="#5a7a4a" filter="url(#rough2)">这就是骑士停步后仍在棋盘上的概率</text>

  <rect x="316" y="64" width="224" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="330" y="86" font-size="11" fill="#33445f" font-weight="bold" filter="url(#rough2)">状态转移</text>
  <text x="330" y="110" font-size="10" fill="#33445f" filter="url(#rough2)">f_t(r,c) = ⅛ · Σ f_{t−1}(r+dr, c+dc)</text>
  <text x="330" y="126" font-size="9.5" fill="#5a6a80" filter="url(#rough2)">（Σ 只累加 8 个候选里界内的那些）</text>
  <text x="330" y="152" font-size="10" fill="#445566" filter="url(#rough2)">· 只依赖上一层 → 两个表滚动</text>
  <text x="330" y="172" font-size="10" fill="#445566" filter="url(#rough2)">· 越界项当 0，不做额外判断</text>
  <text x="330" y="192" font-size="10" fill="#445566" filter="url(#rough2)">· 每层 n² 个格子 × 8 方向</text>

  <rect x="316" y="228" width="224" height="184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="330" y="250" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">递推为什么成立</text>
  <text x="330" y="274" font-size="10" fill="#8a6a20" filter="url(#rough2)">· 每一步均匀「8 选 1」</text>
  <text x="330" y="294" font-size="10" fill="#8a6a20" filter="url(#rough2)">· 选择与之前走过的路无关</text>
  <text x="330" y="314" font-size="10" fill="#8a6a20" filter="url(#rough2)">· 于是「在 (r,c) 还剩 t 步」</text>
  <text x="330" y="332" font-size="10" fill="#8a6a20" filter="url(#rough2)">  的概率是良定义的</text>
  <text x="330" y="356" font-size="10" fill="#8a6a20" filter="url(#rough2)">· 总概率 = 所有合法路径</text>
  <text x="330" y="374" font-size="10" fill="#8a6a20" filter="url(#rough2)">  概率之和 = 合法路径数 / 8^k</text>
  <text x="330" y="398" font-size="10" fill="#b85450" filter="url(#rough2)">· 最坏约 5×10⁵ 次加法，很快</text>
</svg>
