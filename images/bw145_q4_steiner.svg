<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">用"共同倍数"当枢纽：2 与 3 通过 6 合并</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 3：nums = [2,3]，threshold = 6（6 不在 nums 里也能当枢纽）</text>

  <rect x="80" y="92" width="72" height="190" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="6 5" rx="12" filter="url(#rough2)"/>
  <text x="114" y="82" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">并查集里同一块</text>

  <circle cx="114" cy="140" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="114" y="146" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="114" cy="238" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="114" y="244" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="238" y="170" width="72" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="274" y="196" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="274" y="230" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">6 ∉ nums（枢纽）</text>

  <rect x="404" y="170" width="72" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="440" y="196" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="440" y="230" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">另一个倍数</text>

  <path d="M 136 148 L 234 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="144" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2 | 6 ⇒ union</text>

  <path d="M 136 232 L 234 202" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3 | 6 ⇒ union</text>

  <path d="M 312 190 L 400 190" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">6 | 12</text>

  <text x="280" y="300" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">等价改写：lcm(a,b) ≤ T ⇔ 存在 L ≤ T 同时被 a、b 整除</text>
</svg>
