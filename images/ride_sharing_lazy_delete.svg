<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">惰性删除：cancelRider 只改集合，垃圾等到队首才丢</text>

  <text x="30" y="64" font-size="12" fill="#333" filter="url(#rough2)">① addRider 依次加入 3, 1, 7, 2，随后 cancelRider(7)：</text>
  <rect x="60" y="76" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="99" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="126" y="76" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="99" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="192" y="76" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="99" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <path d="M198 82 L242 106 M242 82 L198 106" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="258" y="76" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="99" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="30" y="99" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">队首</text>
  <path d="M34 93 L56 93" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="58" width="158" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5" rx="10" filter="url(#rough2)"/>
  <text x="459" y="80" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">waiting 集合</text>
  <text x="459" y="102" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">{3, 1, 2}</text>
  <path d="M252 80 C 300 70, 340 74, 376 82" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="312" y="62" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">只从集合删除</text>

  <text x="30" y="150" font-size="12" fill="#333" filter="url(#rough2)">② match：队首 3 ∈ waiting → 出队去匹配（7 原地不动）</text>
  <rect x="60" y="162" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="88" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="126" y="162" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="192" y="162" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <path d="M198 168 L242 192 M242 168 L198 192" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="258" y="162" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <path d="M88 158 L88 146" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">弹出匹配</text>

  <text x="30" y="238" font-size="12" fill="#333" filter="url(#rough2)">③ 1 也被匹配后，7 终于到队首：∉ waiting → 弹出丢弃</text>
  <rect x="60" y="250" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="273" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <path d="M66 256 L110 280 M110 256 L66 280" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="126" y="250" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="273" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <path d="M82 288 C 68 298, 56 304, 46 310" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="40" y="326" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">丢弃</text>

  <text x="330" y="322" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">队列从头到尾没做 O(n) 的中间删除，有效队首顺移到 2</text>
  <text x="330" y="342" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每个 ID 至多入队一次、丢弃一次 → match 均摊 O(1)</text>
</svg>
