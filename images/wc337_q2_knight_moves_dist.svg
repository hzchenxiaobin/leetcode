<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#446688"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：骑士的 8 个走法，坐标差平方和恒等于 5</text>
  <path d="M 150 44 Q 320 52 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 5x5 board: cell (r,c) -> x=64+48c, y=96+48r -->
  <!-- grey cells (out of knight reach from center) -->
  <g filter="url(#sk)">
    <rect x="64" y="96" width="48" height="48" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="160" y="96" width="48" height="48" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="256" y="96" width="48" height="48" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="112" y="144" width="48" height="48" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="160" y="144" width="48" height="48" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="208" y="144" width="48" height="48" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="64" y="192" width="48" height="48" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="112" y="192" width="48" height="48" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="208" y="192" width="48" height="48" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="256" y="192" width="48" height="48" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="112" y="240" width="48" height="48" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="160" y="240" width="48" height="48" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="208" y="240" width="48" height="48" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="64" y="288" width="48" height="48" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="160" y="288" width="48" height="48" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1"/>
    <rect x="256" y="288" width="48" height="48" rx="5" fill="#f1f1ef" stroke="#c9c9c2" stroke-width="1"/>
  </g>
  <!-- knight-reachable blue cells -->
  <g filter="url(#sk)">
    <rect x="112" y="96" width="48" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="208" y="96" width="48" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="64" y="144" width="48" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="256" y="144" width="48" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="64" y="240" width="48" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="256" y="240" width="48" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="112" y="288" width="48" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="208" y="288" width="48" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <!-- center green cell -->
  <g filter="url(#sk)">
    <rect x="160" y="192" width="48" height="48" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="184" y="216" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e5e2e">马</text>
  <text x="184" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a">(r, c)</text>

  <!-- arrows from center (184,216) to blue cell centers -->
  <g stroke="#7a94b8" stroke-width="1.4" fill="none">
    <path d="M 174.2 196.4 L 149.6 145.2" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 193.8 196.4 L 218.4 145.2" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 164.3 206.2 L 113.2 181.6" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 203.7 206.2 L 254.8 181.6" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 164.3 225.8 L 113.2 250.4" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 203.7 225.8 L 254.8 250.4" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 174.2 235.6 L 149.6 286.8" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 193.8 235.6 L 218.4 286.8" marker-end="url(#ar)" filter="url(#sk)"/>
  </g>

  <!-- labels of (dr,dc) inside blue cells -->
  <g font-size="10.5" text-anchor="middle" fill="#2c4a6e">
    <text x="136" y="124" filter="url(#sk)">(−2,−1)</text>
    <text x="232" y="124" filter="url(#sk)">(−2,+1)</text>
    <text x="88" y="172" filter="url(#sk)">(−1,−2)</text>
    <text x="280" y="172" filter="url(#sk)">(−1,+2)</text>
    <text x="88" y="268" filter="url(#sk)">(+1,−2)</text>
    <text x="280" y="268" filter="url(#sk)">(+1,+2)</text>
    <text x="136" y="316" filter="url(#sk)">(+2,−1)</text>
    <text x="232" y="316" filter="url(#sk)">(+2,+1)</text>
  </g>

  <!-- right info boxes -->
  <g filter="url(#sk)">
    <rect x="340" y="100" width="268" height="72" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="474" y="128" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2c4a6e">坐标差必为 (±1,±2) 或 (±2,±1)</text>
  <text x="474" y="152" text-anchor="middle" font-size="11.5" fill="#446688">8 个方向 = {1,2}×{2,1} 的全部带符号排列</text>

  <g filter="url(#sk)">
    <rect x="340" y="192" width="268" height="72" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="474" y="220" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">判定式：dr² + dc² = 1 + 4 = 5</text>
  <text x="474" y="244" text-anchor="middle" font-size="11.5" fill="#a07818">「日」字斜边长 √5，勾股数 (1, 2, √5)</text>

  <g filter="url(#sk)">
    <rect x="340" y="284" width="268" height="76" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="474" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">骑士一步 ⇔ 平方和恰为 5</text>
  <text x="474" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a">对照：|dr|·|dc| = 2 亦充要（另一等价视角）</text>
</svg>
