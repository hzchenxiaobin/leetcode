<svg xmlns="http://www.w3.org/2000/svg" width="760" height="412" viewBox="0 0 760 412"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="412" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把 n+1 次反射逐项展开：符号一定交替</text>
  <path d="M 170 42 Q 380 49 590 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="56" y="58" width="90" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="80" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">已反射</text>
  <rect x="152" y="58" width="110" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="80" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">这一次的点</text>
  <rect x="268" y="58" width="436" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="80" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">反射之后的坐标（从 0 出发）</text>

  <!-- 第 0 行 -->
  <rect x="56" y="96" width="90" height="34" rx="5" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="101" y="118" text-anchor="middle" font-size="13" fill="#6f6f6f" filter="url(#rough2)">0 次</text>
  <rect x="152" y="96" width="110" height="34" rx="5" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="207" y="118" text-anchor="middle" font-size="13" fill="#6f6f6f" filter="url(#rough2)">—</text>
  <rect x="268" y="96" width="436" height="34" rx="5" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="284" y="118" font-size="14" fill="#4a4a4a" filter="url(#rough2)">0</text>

  <!-- 第 1 行：p -->
  <rect x="56" y="134" width="90" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="101" y="156" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">1 次</text>
  <rect x="152" y="134" width="110" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="207" y="156" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">p</text>
  <rect x="268" y="134" width="436" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="284" y="156" font-size="14" fill="#8a6015" filter="url(#rough2)">2p</text>

  <!-- 第 2 行：a1 -->
  <rect x="56" y="172" width="90" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="194" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">2 次</text>
  <rect x="152" y="172" width="110" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="194" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">a₁</text>
  <rect x="268" y="172" width="436" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284" y="194" font-size="14" fill="#2f4a66" filter="url(#rough2)">2a₁ − 2p</text>

  <!-- 第 3 行：a2 -->
  <rect x="56" y="210" width="90" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="232" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">3 次</text>
  <rect x="152" y="210" width="110" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="232" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">a₂</text>
  <rect x="268" y="210" width="436" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284" y="232" font-size="14" fill="#2f4a66" filter="url(#rough2)">2a₂ − 2a₁ + 2p</text>

  <!-- 第 4 行：a3 -->
  <rect x="56" y="248" width="90" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="270" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">4 次</text>
  <rect x="152" y="248" width="110" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="270" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">a₃</text>
  <rect x="268" y="248" width="436" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284" y="270" font-size="14" fill="#2f4a66" filter="url(#rough2)">2a₃ − 2a₂ + 2a₁ − 2p</text>

  <!-- 省略行 -->
  <text x="101" y="308" text-anchor="middle" font-size="15" fill="#8a8a8a" filter="url(#rough2)">⋮</text>
  <text x="207" y="308" text-anchor="middle" font-size="15" fill="#8a8a8a" filter="url(#rough2)">⋮</text>
  <text x="284" y="308" font-size="15" fill="#8a8a8a" filter="url(#rough2)">⋮</text>

  <!-- 末行 -->
  <rect x="56" y="318" width="90" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="101" y="342" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">n+1 次</text>
  <rect x="152" y="318" width="110" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="207" y="342" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">aₙ</text>
  <rect x="268" y="318" width="436" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="284" y="342" font-size="13.5" fill="#3c5e2e" filter="url(#rough2)">2S + (−1)ⁿ·2p，其中 S = aₙ − aₙ₋₁ + ⋯ + (−1)ⁿ⁻¹a₁</text>

  <!-- 结论条 -->
  <rect x="46" y="366" width="668" height="34" rx="9" fill="#fafafa" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="388" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">令终值 = 0 ⇒ p = (−1)ⁿ⁺¹S = a₁ − a₂ + a₃ − ⋯ + (−1)ⁿ⁺¹aₙ</text>
</svg>
