<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：公共边「一石二鸟」，保留总数 = 2(n−1) − |公共森林|</text>
  <path d="M 150 44 Q 320 52 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 三类边卡片 -->
  <g filter="url(#rough2)">
    <rect x="16" y="60" width="192" height="68" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="112" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66">类型 1</text>
    <path d="M 76 104 L 148 104" stroke="#446688" stroke-width="2.5"/>
    <circle cx="76" cy="104" r="4" fill="#446688"/>
    <circle cx="148" cy="104" r="4" fill="#446688"/>
    <text x="112" y="124" text-anchor="middle" font-size="10.5" fill="#666">只有 Alice 能走</text>

    <rect x="224" y="60" width="192" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="320" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b5a20">类型 2</text>
    <path d="M 284 104 L 356 104" stroke="#4a7a3a" stroke-width="2.5"/>
    <circle cx="284" cy="104" r="4" fill="#4a7a3a"/>
    <circle cx="356" cy="104" r="4" fill="#4a7a3a"/>
    <text x="320" y="124" text-anchor="middle" font-size="10.5" fill="#666">只有 Bob 能走</text>

    <rect x="432" y="60" width="192" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="528" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a10">类型 3</text>
    <path d="M 492 104 L 564 104" stroke="#d6a040" stroke-width="4"/>
    <circle cx="492" cy="104" r="4" fill="#b07818"/>
    <circle cx="564" cy="104" r="4" fill="#b07818"/>
    <text x="528" y="124" text-anchor="middle" font-size="10.5" fill="#8a5a10">两人都能走 · 一石二鸟</text>
  </g>

  <!-- 左：4 点例子 -->
  <text x="175" y="152" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">一个 4 点例子（最优保留方案）</text>
  <g filter="url(#rough2)">
    <!-- 冗余对角线（灰虚线） -->
    <path d="M 112 200 L 240 300" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
    <text x="268" y="300" text-anchor="start" font-size="10" fill="#999">1 · (1,3)</text>
    <!-- 蓝对角线 2-4 -->
    <path d="M 240 200 L 112 300" stroke="#446688" stroke-width="2.4"/>
    <text x="130" y="284" text-anchor="end" font-size="10" fill="#446688">1 · (2,4)</text>
    <!-- 绿底边 3-4 -->
    <path d="M 236 310 L 116 310" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="176" y="332" text-anchor="middle" font-size="10" fill="#4a7a3a">2 · (3,4)</text>
    <!-- 橙边 1-2、2-3 -->
    <path d="M 116 190 L 236 190" stroke="#d6a040" stroke-width="4"/>
    <text x="176" y="178" text-anchor="middle" font-size="10" fill="#b07818">3 · (1,2)</text>
    <path d="M 252 206 L 252 294" stroke="#d6a040" stroke-width="4"/>
    <text x="268" y="252" text-anchor="start" font-size="10" fill="#b07818">3 · (2,3)</text>

    <!-- 节点 -->
    <circle cx="100" cy="190" r="16" fill="#ffffff" stroke="#555" stroke-width="1.8"/>
    <circle cx="252" cy="190" r="16" fill="#ffffff" stroke="#555" stroke-width="1.8"/>
    <circle cx="252" cy="310" r="16" fill="#ffffff" stroke="#555" stroke-width="1.8"/>
    <circle cx="100" cy="310" r="16" fill="#ffffff" stroke="#555" stroke-width="1.8"/>
    <text x="100" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">1</text>
    <text x="252" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">2</text>
    <text x="252" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">3</text>
    <text x="100" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">4</text>

    <!-- 冗余标记 -->
    <circle cx="176" cy="250" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="176" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗</text>
  </g>
  <text x="175" y="354" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">实线 = 保留（4 条）· 灰色虚线 = 两端已连通，可删</text>

  <!-- 右：两棵生成树 -->
  <g filter="url(#rough2)">
    <rect x="340" y="152" width="284" height="80" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="482" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">Alice 的生成树 · 3 条</text>
    <rect x="352" y="182" width="76" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="390" y="198" text-anchor="middle" font-size="10.5" fill="#8a5a10">橙 (1,2)</text>
    <rect x="434" y="182" width="76" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="472" y="198" text-anchor="middle" font-size="10.5" fill="#8a5a10">橙 (2,3)</text>
    <rect x="516" y="182" width="100" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="566" y="198" text-anchor="middle" font-size="10.5" fill="#2b4a66">蓝 (2,4)</text>
    <text x="482" y="224" text-anchor="middle" font-size="10" fill="#888">类型 3 + 类型 1，连通全部 4 点</text>

    <rect x="340" y="244" width="284" height="80" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="482" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a20">Bob 的生成树 · 3 条</text>
    <rect x="352" y="274" width="76" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="390" y="290" text-anchor="middle" font-size="10.5" fill="#8a5a10">橙 (1,2)</text>
    <rect x="434" y="274" width="76" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="472" y="290" text-anchor="middle" font-size="10.5" fill="#8a5a10">橙 (2,3)</text>
    <rect x="516" y="274" width="100" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="566" y="290" text-anchor="middle" font-size="10.5" fill="#2b5a20">绿 (3,4)</text>
    <text x="482" y="316" text-anchor="middle" font-size="10" fill="#888">类型 3 + 类型 2，连通全部 4 点</text>

    <text x="482" y="240" text-anchor="middle" font-size="10" fill="#b07818">↓ 橙色公共边两人共用，只数一次 ↓</text>
    <text x="482" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5a10">3 + 3 − 2（共享）= 保留 4 条</text>
  </g>

  <!-- 公式洞察框 -->
  <g filter="url(#rough2)">
    <rect x="26" y="358" width="588" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="320" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a10">保留总数 = |F₃| + (c−1) + (c−1) = 2(n−1) − |F₃|　（c 为公共图 G₃ 的分量数）</text>
    <text x="320" y="408" text-anchor="middle" font-size="11.5" fill="#b07818">两人各需 n−1 条边连通；公共边同时挂进两棵树 → 公共森林 F₃ 用满时，保留最少、删除最多</text>
  </g>

  <text x="320" y="462" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">本例 |F₃| = 2 → 保留 2×3 − 2 = 4 条；再删任何一条，必有一人断开</text>
</svg>
