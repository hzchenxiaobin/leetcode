<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="396" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">示例演算：root = [1,1,0,1,1,0,1,0] 的后序走查</text>

  <!-- 表头 -->
  <rect x="20" y="50" width="520" height="32" rx="5" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="45" y="71" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">步</text>
  <text x="100" y="71" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">节点</text>
  <text x="180" y="71" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">左返回</text>
  <text x="280" y="71" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">右返回</text>
  <text x="395" y="71" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">处理（u.left / u.right）</text>
  <text x="500" y="71" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">返回</text>

  <!-- 第 1 行：H(0) 叶子 -->
  <rect x="20" y="82" width="520" height="30" fill="#fff8e1" stroke="#e3e6ea" stroke-width="1" filter="url(#rough2)"/>
  <text x="45" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="100" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">H(0)</text>
  <text x="180" y="102" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">–</text>
  <text x="280" y="102" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">–</text>
  <text x="395" y="102" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">叶子，自己是 0</text>
  <text x="500" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">false</text>

  <!-- 第 2 行：D(1) 剪掉 H -->
  <rect x="20" y="112" width="520" height="30" fill="#fce4ec" stroke="#e3e6ea" stroke-width="1" filter="url(#rough2)"/>
  <text x="45" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="100" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">D(1)</text>
  <text x="180" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">H:false</text>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">–</text>
  <text x="395" y="132" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">剪掉左孩子 H</text>
  <text x="500" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">true</text>

  <!-- 第 3 行：E(1) 叶子 -->
  <rect x="20" y="142" width="520" height="30" fill="#ffffff" stroke="#e3e6ea" stroke-width="1" filter="url(#rough2)"/>
  <text x="45" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="100" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">E(1)</text>
  <text x="180" y="162" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">–</text>
  <text x="280" y="162" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">–</text>
  <text x="395" y="162" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">叶子，自己是 1</text>
  <text x="500" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">true</text>

  <!-- 第 4 行：B(1) -->
  <rect x="20" y="172" width="520" height="30" fill="#f7f9fc" stroke="#e3e6ea" stroke-width="1" filter="url(#rough2)"/>
  <text x="45" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="100" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">B(1)</text>
  <text x="180" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">D:true</text>
  <text x="280" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">E:true</text>
  <text x="395" y="192" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">两个孩子都保留</text>
  <text x="500" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">true</text>

  <!-- 第 5 行：F(0) 叶子 -->
  <rect x="20" y="202" width="520" height="30" fill="#fff8e1" stroke="#e3e6ea" stroke-width="1" filter="url(#rough2)"/>
  <text x="45" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="100" y="222" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">F(0)</text>
  <text x="180" y="222" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">–</text>
  <text x="280" y="222" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">–</text>
  <text x="395" y="222" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">叶子，自己是 0</text>
  <text x="500" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">false</text>

  <!-- 第 6 行：G(1) 叶子 -->
  <rect x="20" y="232" width="520" height="30" fill="#ffffff" stroke="#e3e6ea" stroke-width="1" filter="url(#rough2)"/>
  <text x="45" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="100" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">G(1)</text>
  <text x="180" y="252" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">–</text>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">–</text>
  <text x="395" y="252" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">叶子，自己是 1</text>
  <text x="500" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">true</text>

  <!-- 第 7 行：C(0) 剪掉 F -->
  <rect x="20" y="262" width="520" height="30" fill="#fce4ec" stroke="#e3e6ea" stroke-width="1" filter="url(#rough2)"/>
  <text x="45" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="100" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">C(0)</text>
  <text x="180" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">F:false</text>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">G:true</text>
  <text x="395" y="282" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">剪掉左孩子 F</text>
  <text x="500" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">true</text>

  <!-- 第 8 行：A(1) 根 -->
  <rect x="20" y="292" width="520" height="30" fill="#f7f9fc" stroke="#e3e6ea" stroke-width="1" filter="url(#rough2)"/>
  <text x="45" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="100" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">A(1)</text>
  <text x="180" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">B:true</text>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">C:true</text>
  <text x="395" y="312" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">两个孩子都保留</text>
  <text x="500" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">true</text>

  <rect x="20" y="82" width="520" height="240" fill="none" stroke="#c8ced6" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 结论 -->
  <rect x="20" y="332" width="520" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#33604a" filter="url(#rough2)">输出：[1,1,0,1,1,null,1] —— 全 0 的 H、F 子树消失</text>

  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">A=根；B、C 为 A 的左右孩子；D、E 是 B 的孩子；F、G 是 C 的孩子；H=D.left</text>
</svg>
