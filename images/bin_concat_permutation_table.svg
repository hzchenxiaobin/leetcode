<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [2, 8, 16] 的全部 6 种排列</text>
  <path d="M 160 42 Q 340 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Table header -->
  <g filter="url(#sk)">
    <rect x="50" y="66" width="580" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="110" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4e6e">顺序</text>
  <text x="275" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4e6e">二进制分段拼接</text>
  <text x="475" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4e6e">拼接串（11 位）</text>
  <text x="590" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4e6e">数值</text>

  <!-- Row 1: [2,8,16] best -->
  <g filter="url(#sk)">
    <rect x="50" y="104" width="580" height="46" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="110" y="132" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">[2, 8, 16]</text>
  <text x="275" y="132" text-anchor="middle" font-size="12" font-family="monospace"><tspan fill="#3a6a2a">10</tspan>+<tspan fill="#2b4e6e">1000</tspan>+<tspan fill="#8a6a1a">10000</tspan></text>
  <text x="475" y="132" text-anchor="middle" font-size="12" font-family="monospace"><tspan fill="#3a6a2a">10</tspan><tspan fill="#2b4e6e">1000</tspan><tspan fill="#8a6a1a">10000</tspan></text>
  <text x="590" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">1296 ★</text>

  <!-- Row 2 -->
  <g filter="url(#sk)">
    <rect x="50" y="154" width="580" height="42" rx="6" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="110" y="180" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">[2, 16, 8]</text>
  <text x="275" y="180" text-anchor="middle" font-size="12" font-family="monospace"><tspan fill="#3a6a2a">10</tspan>+<tspan fill="#8a6a1a">10000</tspan>+<tspan fill="#2b4e6e">1000</tspan></text>
  <text x="475" y="180" text-anchor="middle" font-size="12" font-family="monospace"><tspan fill="#3a6a2a">10</tspan><tspan fill="#8a6a1a">10000</tspan><tspan fill="#2b4e6e">1000</tspan></text>
  <text x="590" y="180" text-anchor="middle" font-size="12" fill="#444">1288</text>

  <!-- Row 3 -->
  <g filter="url(#sk)">
    <rect x="50" y="200" width="580" height="42" rx="6" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="110" y="226" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">[8, 2, 16]</text>
  <text x="275" y="226" text-anchor="middle" font-size="12" font-family="monospace"><tspan fill="#2b4e6e">1000</tspan>+<tspan fill="#3a6a2a">10</tspan>+<tspan fill="#8a6a1a">10000</tspan></text>
  <text x="475" y="226" text-anchor="middle" font-size="12" font-family="monospace"><tspan fill="#2b4e6e">1000</tspan><tspan fill="#3a6a2a">10</tspan><tspan fill="#8a6a1a">10000</tspan></text>
  <text x="590" y="226" text-anchor="middle" font-size="12" fill="#444">1104</text>

  <!-- Row 4 -->
  <g filter="url(#sk)">
    <rect x="50" y="246" width="580" height="42" rx="6" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="110" y="272" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">[8, 16, 2]</text>
  <text x="275" y="272" text-anchor="middle" font-size="12" font-family="monospace"><tspan fill="#2b4e6e">1000</tspan>+<tspan fill="#8a6a1a">10000</tspan>+<tspan fill="#3a6a2a">10</tspan></text>
  <text x="475" y="272" text-anchor="middle" font-size="12" font-family="monospace"><tspan fill="#2b4e6e">1000</tspan><tspan fill="#8a6a1a">10000</tspan><tspan fill="#3a6a2a">10</tspan></text>
  <text x="590" y="272" text-anchor="middle" font-size="12" fill="#444">1090</text>

  <!-- Row 5 -->
  <g filter="url(#sk)">
    <rect x="50" y="292" width="580" height="42" rx="6" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="110" y="318" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">[16, 2, 8]</text>
  <text x="275" y="318" text-anchor="middle" font-size="12" font-family="monospace"><tspan fill="#8a6a1a">10000</tspan>+<tspan fill="#3a6a2a">10</tspan>+<tspan fill="#2b4e6e">1000</tspan></text>
  <text x="475" y="318" text-anchor="middle" font-size="12" font-family="monospace"><tspan fill="#8a6a1a">10000</tspan><tspan fill="#3a6a2a">10</tspan><tspan fill="#2b4e6e">1000</tspan></text>
  <text x="590" y="318" text-anchor="middle" font-size="12" fill="#444">1064</text>

  <!-- Row 6: numeric descending, worst -->
  <g filter="url(#sk)">
    <rect x="50" y="338" width="580" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="110" y="366" text-anchor="middle" font-size="12" fill="#b03a3a" font-family="monospace">[16, 8, 2]</text>
  <text x="275" y="366" text-anchor="middle" font-size="12" font-family="monospace"><tspan fill="#8a6a1a">10000</tspan>+<tspan fill="#2b4e6e">1000</tspan>+<tspan fill="#3a6a2a">10</tspan></text>
  <text x="475" y="366" text-anchor="middle" font-size="12" font-family="monospace"><tspan fill="#8a6a1a">10000</tspan><tspan fill="#2b4e6e">1000</tspan><tspan fill="#3a6a2a">10</tspan></text>
  <text x="590" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">1058 ✗</text>

  <!-- Annotations -->
  <g filter="url(#sk)">
    <path d="M 600 128 Q 640 128 640 150 Q 640 356 620 360" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3 2"/>
  </g>
  <text x="648" y="248" text-anchor="middle" font-size="10" fill="#2e6e2e" transform="rotate(90 648 248)">最优 ✓</text>
  <g filter="url(#sk)">
    <path d="M 618 362 Q 636 362 636 380" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3 2"/>
  </g>
  <text x="630" y="398" text-anchor="middle" font-size="10" fill="#b03a3a">数值降序=最差</text>

  <!-- Bottom notes -->
  <g filter="url(#sk)">
    <rect x="50" y="404" width="580" height="52" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="340" y="425" text-anchor="middle" font-size="11.5" fill="#7a5415">有趣：本例最优恰是数值升序、最差恰是数值降序——纯属数据巧合，不可当作规律！</text>
  <text x="340" y="445" text-anchor="middle" font-size="11.5" fill="#7a5415">谁前谁后只能由「拼接比较器」(a&lt;&lt;L_b)|b 与 (b&lt;&lt;L_a)|a 的大小决定。</text>
</svg>
