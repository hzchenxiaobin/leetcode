<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="680" height="510" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：一趟双 Kadane（示例 2）</text>
  <path d="M 170 34 Q 340 42 510 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 数组与 diff -->
  <text x="36" y="68" font-size="12.5" font-family="monospace" fill="#333">nums1</text>
  <g filter="url(#sk)"><rect x="100" y="50" width="40" height="26" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="120" y="68" text-anchor="middle" font-size="11.5" fill="#333">20</text>
  <g filter="url(#sk)"><rect x="146" y="50" width="40" height="26" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="166" y="68" text-anchor="middle" font-size="11.5" fill="#333">40</text>
  <g filter="url(#sk)"><rect x="192" y="50" width="40" height="26" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="212" y="68" text-anchor="middle" font-size="11.5" fill="#333">20</text>
  <g filter="url(#sk)"><rect x="238" y="50" width="40" height="26" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="258" y="68" text-anchor="middle" font-size="11.5" fill="#333">70</text>
  <g filter="url(#sk)"><rect x="284" y="50" width="40" height="26" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="304" y="68" text-anchor="middle" font-size="11.5" fill="#333">30</text>
  <text x="352" y="68" font-size="12" font-family="monospace" fill="#555">sum1 = 180</text>

  <text x="36" y="94" font-size="12.5" font-family="monospace" fill="#333">nums2</text>
  <g filter="url(#sk)"><rect x="100" y="76" width="40" height="26" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="120" y="94" text-anchor="middle" font-size="11.5" fill="#333">50</text>
  <g filter="url(#sk)"><rect x="146" y="76" width="40" height="26" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="166" y="94" text-anchor="middle" font-size="11.5" fill="#333">20</text>
  <g filter="url(#sk)"><rect x="192" y="76" width="40" height="26" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="212" y="94" text-anchor="middle" font-size="11.5" fill="#333">50</text>
  <g filter="url(#sk)"><rect x="238" y="76" width="40" height="26" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="258" y="94" text-anchor="middle" font-size="11.5" fill="#333">40</text>
  <g filter="url(#sk)"><rect x="284" y="76" width="40" height="26" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="304" y="94" text-anchor="middle" font-size="11.5" fill="#333">20</text>
  <text x="352" y="94" font-size="12" font-family="monospace" fill="#555">sum2 = 180</text>

  <text x="36" y="120" font-size="12.5" font-family="monospace" fill="#333">diff</text>
  <g filter="url(#sk)"><rect x="100" y="102" width="40" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="120" y="120" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2e5e2e">+30</text>
  <g filter="url(#sk)"><rect x="146" y="102" width="40" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="166" y="120" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2e5e2e">−20</text>
  <g filter="url(#sk)"><rect x="192" y="102" width="40" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="212" y="120" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2e5e2e">+30</text>
  <g filter="url(#sk)"><rect x="238" y="102" width="40" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="258" y="120" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#a04a48">−30</text>
  <g filter="url(#sk)"><rect x="284" y="102" width="40" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="304" y="120" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#a04a48">−10</text>
  <text x="352" y="120" font-size="12" font-family="monospace" fill="#555">diff = nums2 − nums1</text>
  <path d="M 100 132 Q 240 140 270 132" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="212" y="146" text-anchor="middle" font-size="10.5" fill="#2e5e2e">最大子段（0–2）</text>
  <path d="M 240 132 Q 275 140 310 132" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="292" y="146" text-anchor="middle" font-size="10.5" fill="#a04a48">最小子段（3–4）</text>

  <!-- 演算表 -->
  <g filter="url(#sk)"><rect x="60" y="156" width="40" height="28" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="80" y="174" text-anchor="middle" font-size="11" font-weight="bold" font-family="monospace" fill="#2b6e9e">i</text>
  <g filter="url(#sk)"><rect x="100" y="156" width="52" height="28" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="126" y="174" text-anchor="middle" font-size="11" font-weight="bold" font-family="monospace" fill="#2b6e9e">d</text>
  <g filter="url(#sk)"><rect x="152" y="156" width="66" height="28" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="185" y="174" text-anchor="middle" font-size="11" font-weight="bold" font-family="monospace" fill="#2b6e9e">curMax</text>
  <g filter="url(#sk)"><rect x="218" y="156" width="58" height="28" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="247" y="174" text-anchor="middle" font-size="11" font-weight="bold" font-family="monospace" fill="#2b6e9e">maxS</text>
  <g filter="url(#sk)"><rect x="276" y="156" width="66" height="28" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="309" y="174" text-anchor="middle" font-size="11" font-weight="bold" font-family="monospace" fill="#2b6e9e">curMin</text>
  <g filter="url(#sk)"><rect x="342" y="156" width="58" height="28" rx="3" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="371" y="174" text-anchor="middle" font-size="11" font-weight="bold" font-family="monospace" fill="#2b6e9e">minS</text>

  <g filter="url(#sk)"><rect x="60" y="184" width="340" height="24" rx="3" fill="#f4f2ec" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="80" y="200" text-anchor="middle" font-size="11" font-family="monospace" fill="#888">初始</text>
  <text x="185" y="200" text-anchor="middle" font-size="11" font-family="monospace" fill="#888">0</text>
  <text x="247" y="200" text-anchor="middle" font-size="11" font-family="monospace" fill="#888">0</text>
  <text x="309" y="200" text-anchor="middle" font-size="11" font-family="monospace" fill="#888">0</text>
  <text x="371" y="200" text-anchor="middle" font-size="11" font-family="monospace" fill="#888">0</text>

  <g filter="url(#sk)"><rect x="60" y="208" width="340" height="24" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="80" y="224" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">0</text>
  <text x="126" y="224" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">+30</text>
  <text x="185" y="224" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">30</text>
  <text x="247" y="224" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">30</text>
  <text x="309" y="224" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">30</text>
  <text x="371" y="224" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">0</text>

  <g filter="url(#sk)"><rect x="60" y="232" width="340" height="24" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="80" y="248" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">1</text>
  <text x="126" y="248" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">−20</text>
  <text x="185" y="248" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">10</text>
  <text x="247" y="248" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">30</text>
  <text x="309" y="248" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">−20</text>
  <text x="371" y="248" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">−20</text>

  <g filter="url(#sk)"><rect x="60" y="256" width="340" height="24" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="80" y="272" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">2</text>
  <text x="126" y="272" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">+30</text>
  <text x="185" y="272" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">40</text>
  <g filter="url(#sk)"><rect x="218" y="256" width="58" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="247" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" font-family="monospace" fill="#2e5e2e">40</text>
  <text x="309" y="272" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">10</text>
  <text x="371" y="272" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">−20</text>

  <g filter="url(#sk)"><rect x="60" y="280" width="340" height="24" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="80" y="296" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">3</text>
  <text x="126" y="296" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">−30</text>
  <text x="185" y="296" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">10</text>
  <text x="247" y="296" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">40</text>
  <text x="309" y="296" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">−30</text>
  <text x="371" y="296" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">−30</text>

  <g filter="url(#sk)"><rect x="60" y="304" width="340" height="24" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="80" y="320" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">4</text>
  <text x="126" y="320" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">−10</text>
  <text x="185" y="320" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">0</text>
  <text x="247" y="320" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">40</text>
  <text x="309" y="320" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">−40</text>
  <g filter="url(#sk)"><rect x="342" y="304" width="58" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="371" y="320" text-anchor="middle" font-size="11.5" font-weight="bold" font-family="monospace" fill="#a04a48">−40</text>

  <!-- 候选框 -->
  <g filter="url(#sk)"><rect x="436" y="156" width="216" height="82" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="544" y="176" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e2e">候选 A（帮 nums1 抢最大段）</text>
  <text x="544" y="194" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#555">maxS = 40 ← 子段 [+30,−20,+30]</text>
  <text x="544" y="210" text-anchor="middle" font-size="10.5" fill="#555">即交换下标 0–2，把 50,20,50 换给 nums1</text>
  <text x="544" y="230" text-anchor="middle" font-size="12" font-weight="bold" font-family="monospace" fill="#2e5e2e">ans_A = 180 + 40 = 220</text>

  <g filter="url(#sk)"><rect x="436" y="250" width="216" height="82" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="544" y="270" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">候选 B（帮 nums2 抢最小段）</text>
  <text x="544" y="288" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#555">minS = −40 ← 子段 [−30,−10]</text>
  <text x="544" y="304" text-anchor="middle" font-size="10.5" fill="#555">即交换下标 3–4，把 70,30 换给 nums2</text>
  <text x="544" y="324" text-anchor="middle" font-size="12" font-weight="bold" font-family="monospace" fill="#2b6e9e">ans_B = 180 − (−40) = 220</text>

  <!-- 结论 -->
  <g filter="url(#sk)"><rect x="60" y="352" width="592" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="356" y="376" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace" fill="#7a5415">ans = max(220, 220) = 220 ✓</text>
  <text x="356" y="398" text-anchor="middle" font-size="11" fill="#555">sum1 = sum2 时两个候选对称，殊途同归；本题两个交换方案都命中 220</text>

  <text x="340" y="440" text-anchor="middle" font-size="11.5" fill="#555">示例 1（diff = [−50, 30, −50]）：maxS = 30 → ans = 180 + 30 = 210 ✓（候选 A 胜出）</text>
  <text x="340" y="462" text-anchor="middle" font-size="11.5" fill="#555">示例 3（diff 全负）：maxS 始终停在初值 0 → ans = 31 + 0 = 31 ✓（不交换最优）</text>
  <text x="340" y="492" text-anchor="middle" font-size="11" fill="#888">max 系（绿）与 min 系（红）同趟各跑各的：curMax 掉到 0 以下重启、curMin 升到 0 以上重启</text>
</svg>
