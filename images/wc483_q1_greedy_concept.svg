<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：偶数看末位，位数定大小</text>

  <!-- 例串 s = "112121" -->
  <text x="30" y="82" font-size="13" fill="#555" filter="url(#rough2)">s =</text>
  <text x="100" y="44" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 保留前缀 s[0..4] = 答案</text>

  <!-- 格子 6 个，宽 46，y=56 -->
  <rect x="76" y="56" width="46" height="44" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="99" y="84" text-anchor="middle" font-size="16" fill="#555" filter="url(#rough2)">1</text>
  <rect x="122" y="56" width="46" height="44" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="145" y="84" text-anchor="middle" font-size="16" fill="#555" filter="url(#rough2)">1</text>
  <rect x="168" y="56" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="191" y="84" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="214" y="56" width="46" height="44" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="237" y="84" text-anchor="middle" font-size="16" fill="#555" filter="url(#rough2)">1</text>
  <rect x="260" y="56" width="46" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="283" y="84" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="306" y="56" width="46" height="44" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="329" y="84" text-anchor="middle" font-size="16" fill="#999" filter="url(#rough2)">1</text>
  <line x1="312" y1="62" x2="346" y2="94" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="346" y1="62" x2="312" y2="94" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 下标 -->
  <text x="99" y="114" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="145" y="114" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="191" y="114" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="237" y="114" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="283" y="114" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=4</text>
  <text x="329" y="114" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="191" y="132" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">中间的 '2' 不能当末位（选它必丢位数）</text>
  <text x="283" y="148" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">最后一个 '2' 定答案</text>
  <text x="329" y="132" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">丢弃</text>

  <!-- 两条性质 -->
  <rect x="40" y="166" width="232" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="156" y="190" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">性质一：偶数 ⟺ 末位是 '2'</text>
  <text x="156" y="210" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">奇偶性只看个位；字符集里</text>
  <text x="156" y="226" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">唯一的偶数字符是 '2'</text>

  <rect x="288" y="166" width="232" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="404" y="190" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">性质二：位数多者数值大</text>
  <text x="404" y="210" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">字符集没有 '0'，保留结果无前导零，</text>
  <text x="404" y="226" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">⇒ 比大小先比位数，逐位比较都免了</text>

  <!-- 汇合箭头 -->
  <path d="M 156 244 L 156 264 L 252 278" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 404 244 L 404 264 L 308 278" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="40" y="288" width="480" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">答案 = 截到最后一个 '2' 为止的整个前缀 s[0..i]</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">长度 i+1 恰是所有以 '2' 结尾的子序列的长度上界，</text>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">且该前缀独占这个上界（凑满 i+1 位只能整段保留）</text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">一个 '2' 都没有 ⇒ 无解，返回 ""</text>
</svg>
