<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">BFS 按距离分层：第一个遇到的叶节点就是最近叶</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">仍以示例 3 为例：源点 k = 2，每扩一层距离 +1</text>

  <g stroke="#c9d6e6" stroke-width="1.1" stroke-dasharray="5 6" filter="url(#rough2)">
    <path d="M 158 70 L 158 322"/>
    <path d="M 312 70 L 312 322"/>
    <path d="M 462 70 L 462 322"/>
  </g>

  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="76">d = 0</text>
    <text x="235" y="76">d = 1</text>
    <text x="390" y="76">d = 2</text>
    <text x="535" y="76">d = 3</text>
  </g>

  <g stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)">
    <path d="M 80 190 L 235 130"/>
    <path d="M 80 190 L 235 270"/>
    <path d="M 235 130 L 390 130"/>
    <path d="M 235 270 L 390 270"/>
    <path d="M 390 270 L 535 270"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="13">
    <circle cx="80" cy="190" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="80" y="196" fill="#8a3a36">2</text>
    <circle cx="235" cy="130" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="235" y="136" fill="#3a4a66">1</text>
    <circle cx="235" cy="270" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="235" y="276" fill="#3a4a66">4</text>
    <circle cx="390" cy="130" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="390" y="136" fill="#3a5a30">3</text>
    <circle cx="390" cy="270" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="390" y="276" fill="#3a4a66">5</text>
    <circle cx="535" cy="270" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="535" y="276" fill="#8a6a20">6</text>
  </g>

  <g font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="226">源点</text>
    <text x="235" y="164">非叶</text>
    <text x="235" y="304">非叶</text>
    <text x="390" y="306">非叶（左孩子 6）</text>
    <text x="535" y="306">叶，但距离 3</text>
    <text x="535" y="322">不是最优</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="326" y="154" width="128" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="390" y="172" text-anchor="middle" font-size="10.5" fill="#3a5a30">叶 ✓ 距离 2 → 答案</text>
  </g>

  <rect x="26" y="336" width="568" height="50" rx="10" fill="#eef2f7" stroke="#c9d6e6" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="42" y="356" font-size="11" fill="#3a4a66" filter="url(#rough2)">按层扩展：d=0 {2} → d=1 {1,4} → d=2 {3,5}，其中 3 是叶 ⇒ 返回 3</text>
  <text x="42" y="375" font-size="10.5" fill="#666" filter="url(#rough2)">BFS 出队的距离单调不减，所以第一次碰到叶节点即可提前结束（同层先后无关）</text>
</svg>
