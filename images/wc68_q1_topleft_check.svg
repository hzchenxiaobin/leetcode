<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="34" text-anchor="middle" font-size="16" fill="#334" filter="url(#rough2)">一次扫描：每格只和「左上方邻居」比较</text>

  <ellipse cx="300" cy="66" rx="42" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="72" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">开始</text>
  <path d="M300,86 L300,104" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="106" width="280" height="46" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="128" text-anchor="middle" font-size="13" fill="#334" filter="url(#rough2)">i = 1 … m−1，j = 1 … n−1</text>
  <text x="300" y="145" text-anchor="middle" font-size="11.5" fill="#667" filter="url(#rough2)">（第 0 行、第 0 列没有左上方邻居，跳过）</text>
  <path d="M300,152 L300,172" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,174 452,228 300,282 148,228" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="222" text-anchor="middle" font-size="12.5" fill="#2f4f6f" filter="url(#rough2)">matrix[i][j] 与</text>
  <text x="300" y="241" text-anchor="middle" font-size="12.5" fill="#2f4f6f" filter="url(#rough2)">matrix[i−1][j−1] 相等？</text>

  <path d="M452,228 L468,228" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="460" y="218" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="468" y="206" width="112" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="524" y="233" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">返回 false</text>

  <path d="M300,282 L300,300" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="296" font-size="12" fill="#3a6a4a" filter="url(#rough2)">是</text>
  <rect x="190" y="302" width="220" height="42" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="328" text-anchor="middle" font-size="13" fill="#334" filter="url(#rough2)">移动到下一格</text>

  <path d="M190,323 C 118,312 112,240 146,231" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="322" font-size="11.5" fill="#667" filter="url(#rough2)">还有格子</text>

  <path d="M300,344 L300,360" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="357" font-size="11.5" fill="#667" filter="url(#rough2)">遍历结束</text>
  <rect x="180" y="360" width="240" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="294" y="382" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">全部相等 → 返回 true</text>
</svg>
