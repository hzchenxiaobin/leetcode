<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心结论：局面只需看「长度奇偶」与「异或和是否为 0」</text>
  <text x="360" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每擦掉一个数，长度奇偶翻转一次；异或和一旦变成 0，游戏立刻停在那里</text>

  <rect x="36" y="72" width="210" height="132" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="141" y="98" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">x = 0</text>
  <text x="141" y="124" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">轮到谁，谁立即获胜</text>
  <text x="141" y="148" text-anchor="middle" font-size="10.5" fill="#5a7a50" filter="url(#rough2)">终局：不必再擦任何数</text>
  <text x="141" y="172" text-anchor="middle" font-size="10.5" fill="#5a7a50" filter="url(#rough2)">与长度奇偶无关</text>

  <rect x="255" y="72" width="210" height="132" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="98" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">n 为偶数 且 x ≠ 0</text>
  <text x="360" y="124" text-anchor="middle" font-size="11.5" fill="#2f5f9e" font-weight="bold" filter="url(#rough2)">必胜态</text>
  <text x="360" y="148" text-anchor="middle" font-size="10.5" fill="#5a6a86" filter="url(#rough2)">总有一手可擦，把局面</text>
  <text x="360" y="172" text-anchor="middle" font-size="10.5" fill="#5a6a86" filter="url(#rough2)">换成对手的必败态</text>

  <rect x="474" y="72" width="210" height="132" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="579" y="98" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">n 为奇数 且 x ≠ 0</text>
  <text x="579" y="124" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">必败态</text>
  <text x="579" y="148" text-anchor="middle" font-size="10.5" fill="#a85a55" filter="url(#rough2)">每一手要么当场输掉</text>
  <text x="579" y="172" text-anchor="middle" font-size="10.5" fill="#a85a55" filter="url(#rough2)">要么把胜势递给对手</text>

  <text x="360" y="234" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">两名玩家交替擦数：箭头两侧互为「对手的处境」，胜负标签也随之翻转</text>

  <rect x="46" y="250" width="136" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="114" y="274" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">偶 · x ≠ 0</text>
  <text x="114" y="296" text-anchor="middle" font-size="11.5" fill="#2f5f9e" font-weight="bold" filter="url(#rough2)">轮到者胜</text>

  <path d="M 186 279 L 216 279" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="201" y="246" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">擦一手</text>

  <rect x="220" y="250" width="136" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="288" y="274" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">奇 · x ≠ 0</text>
  <text x="288" y="296" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">轮到者败</text>

  <path d="M 360 279 L 390 279" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="375" y="246" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">擦一手</text>

  <rect x="394" y="250" width="136" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="462" y="274" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">偶 · x ≠ 0</text>
  <text x="462" y="296" text-anchor="middle" font-size="11.5" fill="#2f5f9e" font-weight="bold" filter="url(#rough2)">轮到者胜</text>

  <path d="M 534 279 L 564 279" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="549" y="246" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">擦一手</text>

  <rect x="568" y="250" width="136" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="636" y="274" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">奇 · x ≠ 0</text>
  <text x="636" y="296" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">轮到者败</text>

  <rect x="90" y="326" width="540" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="350" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">一句话记法：x = 0 白拿一胜；否则长度是偶数就赢、是奇数就输。</text>
  <text x="360" y="374" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">return x == 0 || n % 2 == 0</text>
</svg>
