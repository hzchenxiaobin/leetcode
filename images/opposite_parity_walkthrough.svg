<svg xmlns="http://www.w3.org/2000/svg" width="640" height="462" viewBox="0 0 640 462" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="307" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="462" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1,2,3,4]，倒序先查后插</text>
  <path d="M 170 40 Q 320 50 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- legend -->
  <rect x="392" y="46" width="12" height="12" rx="2" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5" filter="url(#sk)"/>
  <text x="410" y="56" font-size="10.5" fill="#666">当前 i</text>
  <rect x="462" y="46" width="12" height="12" rx="2" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="480" y="56" font-size="10.5" fill="#666">右侧 j &gt; i</text>
  <text x="556" y="56" font-size="10.5" fill="#888">字色：红奇蓝偶</text>

  <!-- separators -->
  <path d="M 36 160 L 604 160" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
  <path d="M 36 252 L 604 252" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
  <path d="M 36 344 L 604 344" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" fill="none"/>

  <!-- row i=3 -->
  <text x="44" y="100" font-size="14" font-weight="bold" fill="#446688">i = 3</text>
  <g filter="url(#sk)">
    <rect x="92" y="80" width="34" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="126" y="80" width="34" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="160" y="80" width="34" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="194" y="80" width="34" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="109" y="101" fill="#b85450">1</text>
    <text x="143" y="101" fill="#4a8edb">2</text>
    <text x="177" y="101" fill="#b85450">3</text>
    <text x="211" y="101" fill="#4a8edb">4</text>
  </g>
  <g font-size="12" fill="#444" font-family="monospace">
    <text x="250" y="92">查前 (奇, 偶) = (0, 0)</text>
    <text x="250" y="112">4 为偶 → 查对面 cntOdd = 0</text>
  </g>
  <text x="250" y="132" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">ans[3] = 0</text>
  <g filter="url(#sk)">
    <rect x="452" y="84" width="164" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="534" y="104" text-anchor="middle" font-size="11.5" fill="#446688">插入本方：4 → 偶</text>
  <text x="534" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8edb" font-family="monospace">插后 (奇, 偶) = (0, 1)</text>

  <!-- row i=2 -->
  <text x="44" y="192" font-size="14" font-weight="bold" fill="#446688">i = 2</text>
  <g filter="url(#sk)">
    <rect x="92" y="172" width="34" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="126" y="172" width="34" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="160" y="172" width="34" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="194" y="172" width="34" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="109" y="193" fill="#b85450">1</text>
    <text x="143" y="193" fill="#4a8edb">2</text>
    <text x="177" y="193" fill="#b85450">3</text>
    <text x="211" y="193" fill="#4a8edb">4</text>
  </g>
  <g font-size="12" fill="#444" font-family="monospace">
    <text x="250" y="184">查前 (奇, 偶) = (0, 1)</text>
    <text x="250" y="204">3 为奇 → 查对面 cntEven = 1</text>
  </g>
  <text x="250" y="224" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">ans[2] = 1</text>
  <g filter="url(#sk)">
    <rect x="452" y="176" width="164" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="534" y="196" text-anchor="middle" font-size="11.5" fill="#b85450">插入本方：3 → 奇</text>
  <text x="534" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" font-family="monospace">插后 (奇, 偶) = (1, 1)</text>

  <!-- row i=1 -->
  <text x="44" y="284" font-size="14" font-weight="bold" fill="#446688">i = 1</text>
  <g filter="url(#sk)">
    <rect x="92" y="264" width="34" height="32" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="126" y="264" width="34" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="160" y="264" width="34" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="194" y="264" width="34" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="109" y="285" fill="#b85450">1</text>
    <text x="143" y="285" fill="#4a8edb">2</text>
    <text x="177" y="285" fill="#b85450">3</text>
    <text x="211" y="285" fill="#4a8edb">4</text>
  </g>
  <g font-size="12" fill="#444" font-family="monospace">
    <text x="250" y="276">查前 (奇, 偶) = (1, 1)</text>
    <text x="250" y="296">2 为偶 → 查对面 cntOdd = 1</text>
  </g>
  <text x="250" y="316" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">ans[1] = 1</text>
  <g filter="url(#sk)">
    <rect x="452" y="268" width="164" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="534" y="288" text-anchor="middle" font-size="11.5" fill="#446688">插入本方：2 → 偶</text>
  <text x="534" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8edb" font-family="monospace">插后 (奇, 偶) = (1, 2)</text>

  <!-- row i=0 -->
  <text x="44" y="376" font-size="14" font-weight="bold" fill="#446688">i = 0</text>
  <g filter="url(#sk)">
    <rect x="92" y="356" width="34" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="126" y="356" width="34" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="160" y="356" width="34" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="194" y="356" width="34" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="109" y="377" fill="#b85450">1</text>
    <text x="143" y="377" fill="#4a8edb">2</text>
    <text x="177" y="377" fill="#b85450">3</text>
    <text x="211" y="377" fill="#4a8edb">4</text>
  </g>
  <g font-size="12" fill="#444" font-family="monospace">
    <text x="250" y="368">查前 (奇, 偶) = (1, 2)</text>
    <text x="250" y="388">1 为奇 → 查对面 cntEven = 2</text>
  </g>
  <text x="250" y="408" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">ans[0] = 2</text>
  <g filter="url(#sk)">
    <rect x="452" y="360" width="164" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="534" y="380" text-anchor="middle" font-size="11.5" fill="#b85450">插入本方：1 → 奇</text>
  <text x="534" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" font-family="monospace">插后 (奇, 偶) = (2, 2)</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="200" y="426" width="240" height="30" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="320" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">ans = [2, 1, 1, 0] ✓</text>
</svg>
