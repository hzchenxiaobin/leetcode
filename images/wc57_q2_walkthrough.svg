<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：三次 union 之后只剩 3 个分量</text>
  <text x="54" y="50" font-size="9" fill="#888" filter="url(#rough2)">简写：js = johnsmith@mail.com　j0 = john00@mail.com　jn = john_newyork@mail.com</text>
  <text x="54" y="64" font-size="9" fill="#888" filter="url(#rough2)">　　　jb = johnnybravo@mail.com　m = mary@mail.com（账户按题面顺序处理）</text>

  <!-- 表头 -->
  <rect x="46" y="76" width="528" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="93" font-size="9.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="120" y="93" font-size="9.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">操作</text>
  <text x="316" y="93" font-size="9.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">集合状态（根 : 成员）</text>

  <!-- 行 1 -->
  <rect x="46" y="108" width="528" height="34" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="129" font-size="9.5" fill="#555" filter="url(#rough2)">账户1</text>
  <text x="120" y="129" font-size="9.5" fill="#333" filter="url(#rough2)">union(js, j0)</text>
  <text x="316" y="129" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">{ js : js, j0 }</text>

  <!-- 行 2 -->
  <rect x="46" y="148" width="528" height="34" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="169" font-size="9.5" fill="#555" filter="url(#rough2)">账户2</text>
  <text x="120" y="169" font-size="9.5" fill="#333" filter="url(#rough2)">jb 单独成集合</text>
  <text x="316" y="169" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">{ js : js, j0 }　{ jb : jb }</text>

  <!-- 行 3 -->
  <rect x="46" y="188" width="528" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="209" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">账户3</text>
  <text x="120" y="209" font-size="9.5" fill="#333" filter="url(#rough2)">union(js, jn) → jn 挂到 js</text>
  <text x="316" y="209" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">{ js : js, j0, jn }　{ jb : jb }</text>

  <!-- 行 4 -->
  <rect x="46" y="228" width="528" height="34" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="249" font-size="9.5" fill="#555" filter="url(#rough2)">账户4</text>
  <text x="120" y="249" font-size="9.5" fill="#333" filter="url(#rough2)">m 单独成集合</text>
  <text x="316" y="249" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">{ js : js, j0, jn }　{ jb : jb }　{ m : m }</text>

  <path d="M 310 264 L 310 278" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 输出 -->
  <text x="54" y="298" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">输出：3 个分量，每个分量内邮箱按 ASCII 升序</text>

  <rect x="46" y="306" width="528" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="327" font-size="9.3" fill="#8a3a36" filter="url(#rough2)">John</text>
  <text x="104" y="327" font-size="9.3" fill="#555" filter="url(#rough2)">john00@mail.com, john_newyork@mail.com, johnsmith@mail.com</text>

  <rect x="46" y="346" width="528" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="367" font-size="9.3" fill="#8a3a36" filter="url(#rough2)">John</text>
  <text x="104" y="367" font-size="9.3" fill="#555" filter="url(#rough2)">johnnybravo@mail.com</text>

  <rect x="46" y="386" width="528" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="407" font-size="9.3" fill="#8a3a36" filter="url(#rough2)">Mary</text>
  <text x="104" y="407" font-size="9.3" fill="#555" filter="url(#rough2)">mary@mail.com</text>

  <text x="54" y="440" font-size="9" fill="#888" filter="url(#rough2)">排序依据是字符 ASCII 码：'0'(48) &lt; '_'(95) &lt; 's'(115)，所以 john00 排在最前、johnsmith 排在最后。</text>
</svg>
