<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 452" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>

  <rect width="620" height="452" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：空格守恒 —— 只搬位置，不增不减</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">以示例 1 为例：9 个空格、4 个单词（this · is · a · sentence）</text>

  <!-- 行 1：原串 -->
  <text x="70" y="94" text-anchor="end" font-size="12.5" font-weight="bold" fill="#666" filter="url(#r)">原串</text>
  <g filter="url(#r)">
    <rect x="78" y="74" width="34" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="95" y="94" text-anchor="middle" font-size="12" fill="#7a5415">2</text>
    <rect x="118" y="74" width="56" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="146" y="94" text-anchor="middle" font-size="12" fill="#2c4a66">this</text>
    <rect x="178" y="74" width="34" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="195" y="94" text-anchor="middle" font-size="12" fill="#7a5415">3</text>
    <rect x="216" y="74" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="234" y="94" text-anchor="middle" font-size="12" fill="#2c4a66">is</text>
    <rect x="256" y="74" width="34" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="273" y="94" text-anchor="middle" font-size="12" fill="#7a5415">2</text>
    <rect x="294" y="74" width="26" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="307" y="94" text-anchor="middle" font-size="12" fill="#2c4a66">a</text>
    <rect x="324" y="74" width="34" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="341" y="94" text-anchor="middle" font-size="12" fill="#7a5415">1</text>
    <rect x="362" y="74" width="84" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="404" y="94" text-anchor="middle" font-size="12" fill="#2c4a66">sentence</text>
    <rect x="450" y="74" width="34" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="467" y="94" text-anchor="middle" font-size="12" fill="#7a5415">1</text>
  </g>
  <text x="494" y="84" text-anchor="start" font-size="10.5" fill="#b03a3a" filter="url(#r)">首/尾空格</text>
  <text x="494" y="98" text-anchor="start" font-size="10.5" fill="#b03a3a" filter="url(#r)">也要计入！</text>
  <g filter="url(#r)">
    <path d="M 492 92 C 478 94, 468 88, 458 90" fill="none" stroke="#b85450" stroke-width="1.3" marker-end="url(#arr)"/>
  </g>

  <!-- 箭头：统计 -->
  <g filter="url(#r)">
    <line x1="190" y1="106" x2="190" y2="130" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <text x="204" y="124" text-anchor="start" font-size="11" fill="#555" filter="url(#r)">一次遍历：数空格 + 提取单词</text>

  <!-- 行 2：统计 -->
  <text x="70" y="162" text-anchor="end" font-size="12.5" font-weight="bold" fill="#666" filter="url(#r)">统计</text>
  <g filter="url(#r)">
    <rect x="78" y="142" width="310" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="233" y="162" text-anchor="middle" font-size="11.5" fill="#2c4a66">words = [this, is, a, sentence]，n = 4</text>
    <rect x="404" y="142" width="120" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="464" y="162" text-anchor="middle" font-size="11.5" fill="#7a5415">spaces = 9</text>
  </g>

  <!-- 箭头：分配 -->
  <g filter="url(#r)">
    <line x1="190" y1="174" x2="190" y2="198" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <text x="204" y="192" text-anchor="start" font-size="11" fill="#555" filter="url(#r)">均匀分配（整除）</text>

  <!-- 行 3：重排 -->
  <text x="70" y="230" text-anchor="end" font-size="12.5" font-weight="bold" fill="#666" filter="url(#r)">重排</text>
  <g filter="url(#r)">
    <rect x="78" y="210" width="56" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="106" y="230" text-anchor="middle" font-size="12" fill="#2c4a66">this</text>
    <rect x="138" y="210" width="34" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="155" y="230" text-anchor="middle" font-size="12" fill="#7a5415">3</text>
    <rect x="176" y="210" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="194" y="230" text-anchor="middle" font-size="12" fill="#2c4a66">is</text>
    <rect x="216" y="210" width="34" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="233" y="230" text-anchor="middle" font-size="12" fill="#7a5415">3</text>
    <rect x="254" y="210" width="26" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="267" y="230" text-anchor="middle" font-size="12" fill="#2c4a66">a</text>
    <rect x="284" y="210" width="34" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="301" y="230" text-anchor="middle" font-size="12" fill="#7a5415">3</text>
    <rect x="322" y="210" width="84" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="364" y="230" text-anchor="middle" font-size="12" fill="#2c4a66">sentence</text>
  </g>
  <text x="420" y="224" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2f5d28" filter="url(#r)">extra = 0</text>
  <text x="420" y="238" text-anchor="start" font-size="10.5" fill="#2f5d28" filter="url(#r)">恰好分完，末尾无余量</text>
  <text x="228" y="260" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#r)">三个间隔均为 3 → 相等且最大</text>

  <!-- 公式框 -->
  <g filter="url(#r)">
    <rect x="78" y="278" width="440" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="298" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d28" filter="url(#r)">整除分配（守恒式）</text>
  <text x="98" y="322" text-anchor="start" font-size="11.5" fill="#444" filter="url(#r)">per = ⌊spaces / (n−1)⌋ = ⌊9 / 3⌋ = 3 （间隔格数，最大商）</text>
  <text x="98" y="342" text-anchor="start" font-size="11.5" fill="#444" filter="url(#r)">extra = spaces mod (n−1) = 0 （余数归尾）</text>
  <text x="98" y="362" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2f5d28" filter="url(#r)">per × (n−1) + extra = 3×3 + 0 = 9 = spaces ✓</text>

  <!-- 图例 -->
  <g filter="url(#r)">
    <rect x="78" y="386" width="16" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="386" width="16" height="12" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="100" y="396" text-anchor="start" font-size="10.5" fill="#666" filter="url(#r)">单词</text>
  <text x="172" y="396" text-anchor="start" font-size="10.5" fill="#666" filter="url(#r)">空格段（框内数字 = 空格数）</text>

  <text x="310" y="418" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">题面保证相邻单词间 ≥ 1 个空格 → spaces ≥ n−1 → per ≥ 1（间隔不会为 0）</text>
  <text x="310" y="438" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">结果串长度 = 单词总长 + spaces = 原串长度（长度守恒自检）</text>
</svg>
