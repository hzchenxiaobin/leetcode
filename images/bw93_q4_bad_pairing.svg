<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">坏下标：nums1[i] = nums2[i] 的位置</text>

  <!-- 示例行 -->
  <rect x="40" y="52" width="440" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="58" y="74" font-size="12" fill="#333" filter="url(#rough2)">nums1: [2, 2, 2, 1, 3]</text>
  <text x="58" y="94" font-size="12" fill="#333" filter="url(#rough2)">nums2: [1, 2, 2, 3, 3]</text>
  <text x="320" y="74" font-size="12" fill="#b85450" filter="url(#rough2)">↑ 坏下标 1、2、4</text>
  <text x="320" y="94" font-size="12" fill="#666" filter="url(#rough2)">（值分别为 2、2、3）</text>

  <!-- 同值配对：无效 -->
  <text x="60" y="140" font-size="14" fill="#333" filter="url(#rough2)">同值坏下标配对 —— 无效：</text>

  <rect x="60" y="156" width="70" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">下标 1</text>
  <text x="95" y="190" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">值 2</text>

  <rect x="180" y="156" width="70" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">下标 2</text>
  <text x="215" y="190" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">值 2</text>

  <path d="M132,166 L178,166" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <path d="M178,192 L132,192" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <path d="M138,150 L212,150 L212,206 L138,206 Z" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="275" y="182" font-size="13" fill="#b85450" filter="url(#rough2)">交换后两边还是 2，白付 1+2</text>

  <!-- 异值配对：一次修复两个 -->
  <text x="60" y="236" font-size="14" fill="#333" filter="url(#rough2)">异值坏下标配对 —— 一次修两个：</text>

  <rect x="60" y="252" width="70" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">下标 2</text>
  <text x="95" y="286" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">值 2</text>

  <rect x="180" y="252" width="70" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="215" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">下标 4</text>
  <text x="215" y="286" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">值 3</text>

  <path d="M132,262 L178,262" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrG)"/>
  <path d="M178,288 L132,288" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrG)"/>
  <text x="275" y="270" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2 号位得到 3 ≠ nums2[2] ✓</text>
  <text x="275" y="290" font-size="13" fill="#4a7a3a" filter="url(#rough2)">4 号位得到 2 ≠ nums2[4] ✓ 代价 2+4</text>

  <!-- 底部结论 -->
  <rect x="40" y="314" width="440" height="36" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">每个坏下标至少参与一次交换 → 代价 ≥ Σ(坏下标)</text>
</svg>
