<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：极大同色段至多留 1 个，保留「最贵」的</text>
  <path d="M 150 46 Q 320 54 490 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 绳子 -->
  <path d="M 62 118 C 200 106, 440 130, 578 114" stroke="#999" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- 气球：a a b a a -->
  <g filter="url(#rough2)">
    <ellipse cx="110" cy="106" rx="30" ry="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="220" cy="106" rx="30" ry="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="330" cy="106" rx="30" ry="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <ellipse cx="440" cy="106" rx="30" ry="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="550" cy="106" rx="30" ry="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="110" y="113" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b4a66">a</text>
    <text x="220" y="113" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b4a66">a</text>
    <text x="330" y="113" text-anchor="middle" font-size="20" font-weight="bold" fill="#b07818">b</text>
    <text x="440" y="113" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b4a66">a</text>
    <text x="550" y="113" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b4a66">a</text>
    <text x="110" y="156" text-anchor="middle" font-size="11" fill="#888">t=1</text>
    <text x="220" y="156" text-anchor="middle" font-size="11" fill="#888">t=2</text>
    <text x="330" y="156" text-anchor="middle" font-size="11" fill="#888">t=3</text>
    <text x="440" y="156" text-anchor="middle" font-size="11" fill="#888">t=4</text>
    <text x="550" y="156" text-anchor="middle" font-size="11" fill="#888">t=1</text>
  </g>

  <!-- 保留 / 删除徽章 -->
  <g filter="url(#rough2)">
    <circle cx="132" cy="80" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="132" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">✗</text>
    <circle cx="242" cy="80" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="242" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">✓</text>
    <circle cx="352" cy="80" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="352" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">✓</text>
    <circle cx="462" cy="80" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="462" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">✓</text>
    <circle cx="572" cy="80" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="572" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">✗</text>
  </g>

  <!-- 段括号 -->
  <g filter="url(#rough2)">
    <path d="M 80 172 L 80 182 L 242 182 L 242 172" stroke="#446688" stroke-width="1.6" fill="none"/>
    <path d="M 302 172 L 302 182 L 358 182 L 358 172" stroke="#446688" stroke-width="1.6" fill="none"/>
    <path d="M 410 172 L 410 182 L 572 182 L 572 172" stroke="#446688" stroke-width="1.6" fill="none"/>
    <text x="160" y="200" text-anchor="middle" font-size="12.5" fill="#2b4a66">极大段① 'aa'</text>
    <text x="330" y="200" text-anchor="middle" font-size="12.5" fill="#b07818">段② 'b'</text>
    <text x="491" y="200" text-anchor="middle" font-size="12.5" fill="#2b4a66">极大段③ 'aa'</text>
  </g>

  <!-- 每段结算框 -->
  <g filter="url(#rough2)">
    <rect x="48" y="220" width="168" height="92" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="132" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">段① 'aa'：t = 1, 2</text>
    <text x="132" y="268" text-anchor="middle" font-size="12" fill="#333">sum = 3，max = 2</text>
    <text x="132" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">代价 = 3 − 2 = 1</text>

    <rect x="236" y="220" width="168" height="92" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="320" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">段② 'b'：t = 3</text>
    <text x="320" y="268" text-anchor="middle" font-size="12" fill="#333">sum = 3，max = 3</text>
    <text x="320" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">代价 = 3 − 3 = 0</text>

    <rect x="424" y="220" width="168" height="92" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="508" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">段③ 'aa'：t = 4, 1</text>
    <text x="508" y="268" text-anchor="middle" font-size="12" fill="#333">sum = 5，max = 4</text>
    <text x="508" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">代价 = 5 − 4 = 1</text>

    <text x="226" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688">+</text>
    <text x="414" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688">+</text>
  </g>

  <text x="320" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">答案 = 1 + 0 + 1 = 2（删掉两个 t = 1 的 'a'）</text>

  <!-- 洞察框 -->
  <g filter="url(#rough2)">
    <rect x="56" y="358" width="528" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="320" y="384" text-anchor="middle" font-size="12" fill="#b07818">相邻极大段颜色必不同（极大性）⇒ 段与段之间天然「相邻异色」，删除只发生在段内</text>
    <text x="320" y="406" text-anchor="middle" font-size="12" fill="#b07818">段长 k 必删 k−1 个：段代价 = sum − max —— 保留项越贵，删得越便宜</text>
  </g>

  <text x="320" y="452" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 3：colors = "aabaa"，neededTime = [1,2,3,4,1]（✓ = 保留，✗ = 删除）</text>
</svg>
