<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 408" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="408" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">转移：用上一组的前缀和 + 二分，一次算出所有 dp_new</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">dp[j] = 以「当前组的第 j 个候选」结尾的合法方案数</text>
  <text x="36" y="96" text-anchor="start" font-size="9.5" fill="#666" font-weight="bold" filter="url(#rough2)">上一组 prev</text>
  <rect x="140" y="78" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168.0" y="97.42" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">799</text>
  <text x="168" y="126" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="202" y="78" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230.0" y="97.42" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">889</text>
  <text x="230" y="126" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="264" y="78" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292.0" y="97.42" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">898</text>
  <text x="292" y="126" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="326" y="78" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354.0" y="97.42" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">979</text>
  <text x="354" y="126" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="388" y="78" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416.0" y="97.42" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">988</text>
  <text x="416" y="126" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="450" y="78" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="478.0" y="97.42" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">997</text>
  <text x="478" y="126" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="140" y="148" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">dp_prev 全为 1：首个位置没有任何「前面的数」约束</text>
  <text x="36" y="186" text-anchor="start" font-size="9.5" fill="#666" font-weight="bold" filter="url(#rough2)">前缀和 pre</text>
  <rect x="140" y="168" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162.0" y="186.6" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="192" y="168" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214.0" y="186.6" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="244" y="168" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266.0" y="186.6" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="296" y="168" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318.0" y="186.6" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="348" y="168" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370.0" y="186.6" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="400" y="168" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="422.0" y="186.6" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="452" y="168" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="474.0" y="186.6" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">6</text>
  <path d="M 280 204 L 280 226" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="36" y="230" width="488" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="250" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">当前组：对每个候选 cur[j] 求 cnt</text>
  <text x="48" y="268" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">cnt = upper_bound(prev, cur[j])：上一组里 ≤ cur[j] 的候选个数</text>
  <text x="48" y="286" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">dp_new[j] = pre[cnt]  ← 把「以这些候选结尾」的方案全部接到 cur[j] 上</text>
  <rect x="36" y="302" width="488" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="322" text-anchor="start" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">为什么前缀和能一次算完</text>
  <text x="48" y="340" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">需要 prev[k] ≤ cur[j]，而 prev 升序 → 满足条件的恰好是前 cnt 个</text>
  <text x="48" y="358" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">每个 j 一次 O(1) 查询，整组 O(|组| log |组|)</text>
  <text x="280" y="382" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">最后一组所有 dp 值之和即答案（每个候选都可以作为数组结尾）</text>
</svg>
