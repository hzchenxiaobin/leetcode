<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="163"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：奇偶组合的四种情形</text>

  <!-- 例1 -->
  <g filter="url(#rough2)">
    <rect x="56" y="52" width="448" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="78" text-anchor="middle" font-size="13" fill="#1d3a17" font-weight="bold" filter="url(#rough2)">示例 1：nums1 = [2,1,3]（m=3 奇），nums2 = [10,2,5,0]（n=4 偶）</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="102">XOR(nums1) = 2⊕1⊕3 = 0，XOR(nums2) = 10⊕2⊕5⊕0 = 13</text>
    <text x="280" y="126">n=4 偶 → nums1 整组抵消；m=3 奇 → nums2 各留一个</text>
    <text x="280" y="152" fill="#b85450" font-weight="bold">答案 = 0 ⊕ 13 = 13 ✓（与官方一致）</text>
  </g>

  <!-- 例2 -->
  <g filter="url(#rough2)">
    <rect x="56" y="188" width="448" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="214" text-anchor="middle" font-size="13" fill="#7a5518" font-weight="bold" filter="url(#rough2)">示例 2：nums1 = [1,2]（m=2 偶），nums2 = [3,4]（n=2 偶）</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="238">nums3 = [1⊕3, 1⊕4, 2⊕3, 2⊕4] = [2, 5, 1, 6]</text>
    <text x="280" y="262">每行、每列都恰出现偶数次 → 全部两两抵消</text>
    <text x="280" y="284" fill="#b85450" font-weight="bold">答案 = 0 ✓</text>
  </g>

  <!-- 小结 -->
  <g filter="url(#rough2)">
    <rect x="56" y="308" width="448" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#1a2b45" text-anchor="middle">
    <text x="280" y="332">另两种组合：两奇 → XOR(nums1) ⊕ XOR(nums2)；</text>
    <text x="280" y="356">m 偶 n 奇 → 只剩 XOR(nums1)。四个组合一张 2×2 表就能记牢，</text>
    <text x="280" y="376">代码只需两个「按位与 1」的判断</text>
  </g>
</svg>
