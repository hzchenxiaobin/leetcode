<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="480" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：每人求一次交集</text>
  <text x="340" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">✓ 表示该用户收藏了这家公司；右侧是该用户清单所对应位集的交集</text>

  <!-- 表头 -->
  <rect x="40" y="58" width="626" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="77">用户</text>
    <text x="155" y="77">leetcode</text>
    <text x="243" y="77">google</text>
    <text x="331" y="77">facebook</text>
    <text x="419" y="77">microsoft</text>
    <text x="507" y="77">amazon</text>
    <text x="592" y="77">交集</text>
    <text x="653" y="77">答案</text>
  </g>

  <!-- 表格分隔线 -->
  <g stroke="#d8d8d8" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)">
    <line x1="40" y1="88" x2="666" y2="88"/>
    <line x1="40" y1="122" x2="666" y2="122"/>
    <line x1="40" y1="156" x2="666" y2="156"/>
    <line x1="40" y1="190" x2="666" y2="190"/>
    <line x1="40" y1="224" x2="666" y2="224"/>
    <line x1="40" y1="258" x2="666" y2="258"/>
    <line x1="110" y1="88" x2="110" y2="258"/>
    <line x1="552" y1="88" x2="552" y2="258"/>
    <line x1="634" y1="88" x2="634" y2="258"/>
  </g>

  <!-- 数据行：y = 92 + 34*k -->
  <!-- 用户 0 -->
  <rect x="46" y="94" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="112" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)">
    <rect x="141" y="97" width="28" height="20" fill="#446688" rx="3"/>
    <rect x="229" y="97" width="28" height="20" fill="#446688" rx="3"/>
    <rect x="317" y="97" width="28" height="20" fill="#446688" rx="3"/>
  </g>
  <text x="592" y="112" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">{0}</text>
  <text x="653" y="113" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 用户 1 -->
  <rect x="46" y="128" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="146" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <rect x="229" y="131" width="28" height="20" fill="#446688" rx="3"/>
    <rect x="405" y="131" width="28" height="20" fill="#446688" rx="3"/>
  </g>
  <text x="592" y="146" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">{1}</text>
  <text x="653" y="147" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 用户 2 -->
  <rect x="46" y="162" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="180" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)">
    <rect x="229" y="165" width="28" height="20" fill="#446688" rx="3"/>
    <rect x="317" y="165" width="28" height="20" fill="#446688" rx="3"/>
  </g>
  <text x="592" y="180" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">{0,2}</text>
  <text x="653" y="181" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 用户 3 -->
  <rect x="46" y="196" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="214" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)">
    <rect x="229" y="199" width="28" height="20" fill="#446688" rx="3"/>
  </g>
  <text x="592" y="214" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">{0,1,2,3}</text>
  <text x="653" y="215" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 用户 4 -->
  <rect x="46" y="230" width="58" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="248" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)">
    <rect x="493" y="233" width="28" height="20" fill="#446688" rx="3"/>
  </g>
  <text x="592" y="248" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">{4}</text>
  <text x="653" y="249" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="340" y="278" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">倒排表：like[google] = {0,1,2,3}　like[facebook] = {0,2}　like[leetcode] = {0}　like[microsoft] = {1}　like[amazon] = {4}</text>

  <rect x="40" y="292" width="600" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="316" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">用户 0（3 家公司）：{0} ∩ {0,1,2,3} ∩ {0,2} = {0} = 自己 → 是答案</text>

  <rect x="40" y="338" width="600" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="362" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">用户 2（2 家公司）：{0,1,2,3} ∩ {0,2} = {0,2} ⊋ {2} → 用户 0 也包含它，不是答案</text>

  <rect x="40" y="384" width="600" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="408" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">用户 3（只有 google）：只需一次与运算就得到 {0,1,2,3} → 被 0、1、2 包住，早停生效</text>

  <text x="340" y="446" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">升序扫描后输出 [0, 1, 4]，与官方答案一致</text>
  <text x="340" y="466" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">总共只做了 3+2+2+1+1 = 9 次位集与运算，而非 5×4/2 = 10 次两两比较 × 500 次查找</text>
</svg>
