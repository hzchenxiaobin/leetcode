<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#fafafa"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：stones = [5, 3, 1, 4, 2] —— prefix = [0, 5, 8, 9, 13, 15]</text>
  <path d="M 200 42 Q 450 50 700 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="450" y="62" text-anchor="middle" font-size="11.5" fill="#567" filter="url(#rough2)">5×5 上三角表：按对角线 len = 1 → 5 依次填充，右上角 dp[0][4] = 6 即答案</text>

  <!-- stones strip -->
  <g filter="url(#rough2)">
    <rect x="328" y="74" width="44" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="378" y="74" width="44" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="428" y="74" width="44" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="478" y="74" width="44" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="528" y="74" width="44" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="350" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e" filter="url(#rough2)">5</text>
  <text x="400" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e" filter="url(#rough2)">3</text>
  <text x="450" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e" filter="url(#rough2)">1</text>
  <text x="500" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e" filter="url(#rough2)">4</text>
  <text x="550" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e" filter="url(#rough2)">2</text>

  <!-- dp grid: j labels -->
  <text x="199" y="112" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="261" y="112" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j=1</text>
  <text x="323" y="112" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j=2</text>
  <text x="385" y="112" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j=3</text>
  <text x="447" y="112" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">j=4</text>
  <text x="160" y="142" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="160" y="186" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="160" y="230" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="160" y="274" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">i=3</text>
  <text x="160" y="318" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">i=4</text>

  <!-- len1 diagonal -->
  <g filter="url(#rough2)">
    <rect x="170" y="118" width="58" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="232" y="162" width="58" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="294" y="206" width="58" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="356" y="250" width="58" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="418" y="294" width="58" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <!-- len2 -->
    <rect x="232" y="118" width="58" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="294" y="162" width="58" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="356" y="206" width="58" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="418" y="250" width="58" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <!-- len3 -->
    <rect x="294" y="118" width="58" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="356" y="162" width="58" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="418" y="206" width="58" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <!-- len4 (deps highlighted blue) -->
    <rect x="356" y="118" width="58" height="40" rx="4" fill="#f0f0ee" stroke="#446688" stroke-width="2.2"/>
    <rect x="418" y="162" width="58" height="40" rx="4" fill="#f0f0ee" stroke="#446688" stroke-width="2.2"/>
    <!-- len5 answer -->
    <rect x="418" y="118" width="58" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <text x="199" y="143" text-anchor="middle" font-size="13" fill="#3a6a2a" filter="url(#rough2)">0</text>
  <text x="261" y="187" text-anchor="middle" font-size="13" fill="#3a6a2a" filter="url(#rough2)">0</text>
  <text x="323" y="231" text-anchor="middle" font-size="13" fill="#3a6a2a" filter="url(#rough2)">0</text>
  <text x="385" y="275" text-anchor="middle" font-size="13" fill="#3a6a2a" filter="url(#rough2)">0</text>
  <text x="447" y="319" text-anchor="middle" font-size="13" fill="#3a6a2a" filter="url(#rough2)">0</text>
  <text x="261" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="323" y="187" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="385" y="231" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="447" y="275" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="323" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">3</text>
  <text x="385" y="187" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">1</text>
  <text x="447" y="231" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">2</text>
  <text x="385" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <text x="447" y="187" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <text x="447" y="143" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">6</text>

  <!-- len labels + fill order -->
  <path d="M 494 308 Q 508 220 494 152" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="516" y="322" text-anchor="middle" font-size="10.5" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">len=1</text>
  <text x="516" y="278" text-anchor="middle" font-size="10.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">len=2</text>
  <text x="516" y="234" text-anchor="middle" font-size="10.5" fill="#a67c1e" font-weight="bold" filter="url(#rough2)">len=3</text>
  <text x="516" y="190" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">len=4</text>
  <text x="516" y="146" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">len=5</text>

  <!-- callouts -->
  <rect x="560" y="118" width="330" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="725" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">计算 dp[0][1]（len = 2）</text>
  <text x="725" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">max( sum(1,1) − dp[1][1] , sum(0,0) − dp[0][0] )</text>
  <text x="725" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">= max( 3 − 0 , 5 − 0 ) = 5 —— 移除右端 3，白拿剩下的 5</text>

  <rect x="560" y="212" width="330" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="725" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">计算 dp[0][4]（len = 5）</text>
  <text x="725" y="254" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">max( sum(1,4) − dp[1][4] , sum(0,3) − dp[0][3] )</text>
  <text x="725" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">= max( 10 − 7 , 13 − 7 ) = max( 3 , 6 ) = 6</text>
  <text x="725" y="292" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">移除右端 2：先拿 13 分，把鲍勃在 [5,3,1,4] 的净赚压到 7</text>

  <rect x="560" y="322" width="330" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="725" y="343" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">dp[0][4] = 6 —— 与官方示例一致 ✓</text>
  <text x="725" y="361" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">蓝框格 = 答案格的两个依赖：正下方 dp[1][4]=7、正左方 dp[0][3]=7</text>

  <!-- replay strip -->
  <text x="450" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最优对局回放（对应 dp[0][4] = 6 的一条最优路径）</text>
  <g filter="url(#rough2)">
    <rect x="45" y="398" width="140" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="215" y="398" width="140" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="385" y="398" width="140" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="555" y="398" width="140" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="725" y="398" width="140" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="115" y="418" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">爱丽丝移除 2</text>
  <text x="115" y="436" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">得 13（剩 5+3+1+4）</text>
  <text x="115" y="454" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">Alice 13 : Bob 0</text>
  <text x="285" y="418" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a6a2a" filter="url(#rough2)">鲍勃移除 5</text>
  <text x="285" y="436" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">得 8（剩 3+1+4）</text>
  <text x="285" y="454" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">Alice 13 : Bob 8</text>
  <text x="455" y="418" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">爱丽丝移除 3</text>
  <text x="455" y="436" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">得 5（剩 1+4）</text>
  <text x="455" y="454" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">Alice 18 : Bob 8</text>
  <text x="625" y="418" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a6a2a" filter="url(#rough2)">鲍勃移除 1</text>
  <text x="625" y="436" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">得 4（剩 4）</text>
  <text x="625" y="454" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">Alice 18 : Bob 12</text>
  <text x="795" y="418" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">爱丽丝移除 4</text>
  <text x="795" y="436" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">得 0（剩空）</text>
  <text x="795" y="454" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">Alice 18 : Bob 12</text>
  <path d="M 187 430 L 211 430" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 357 430 L 381 430" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 527 430 L 551 430" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 697 430 L 721 430" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="230" y="478" width="440" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="508" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">爱丽丝 18 − 鲍勃 12 = 6 ✓ 与 dp[0][4] 吻合</text>

  <text x="450" y="548" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每条对角线内部互不依赖，可任意顺序填；跨对角线必须先短后长</text>
</svg>
