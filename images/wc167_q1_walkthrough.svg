<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：head = [1, 0, 1] → 5</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888">每读一个结点，ans 左移一位并填入该位的值</text>

  <g filter="url(#rough2)">
    <rect x="40" y="80" width="480" height="34" fill="#dfe8f4" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="40" y="114" width="480" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="40" y="150" width="480" height="36" fill="#f7f9fc" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <rect x="40" y="186" width="480" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3"/>
  </g>

  <g stroke="#c9d3e0" stroke-width="1" filter="url(#rough2)">
    <path d="M 110 80 L 110 222"/>
    <path d="M 210 80 L 210 222"/>
    <path d="M 330 80 L 330 222"/>
    <path d="M 440 80 L 440 222"/>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66" text-anchor="middle" font-weight="bold">
    <text x="75" y="102">步骤</text>
    <text x="160" y="102">结点 v</text>
    <text x="270" y="102">移位前 ans</text>
    <text x="385" y="102">ans × 2 + v</text>
    <text x="480" y="102">结果</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="75" y="137" fill="#555">1</text>
    <text x="160" y="137" fill="#2f4463" font-weight="bold">1</text>
    <text x="270" y="137" fill="#555">0</text>
    <text x="385" y="137" fill="#8a6a20">0 × 2 + 1 = 1</text>
    <text x="480" y="137" fill="#4a7a3a" font-weight="bold">1</text>

    <text x="75" y="173" fill="#555">2</text>
    <text x="160" y="173" fill="#2f4463" font-weight="bold">0</text>
    <text x="270" y="173" fill="#555">1</text>
    <text x="385" y="173" fill="#8a6a20">1 × 2 + 0 = 2</text>
    <text x="480" y="173" fill="#4a7a3a" font-weight="bold">2</text>

    <text x="75" y="209" fill="#555">3</text>
    <text x="160" y="209" fill="#2f4463" font-weight="bold">1</text>
    <text x="270" y="209" fill="#555">2</text>
    <text x="385" y="209" fill="#8a6a20">2 × 2 + 1 = 5</text>
    <text x="480" y="209" fill="#4a7a3a" font-weight="bold">5</text>
  </g>

  <path d="M 280 228 L 280 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="254" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="78" y="276" font-size="11" fill="#3a5a30" font-weight="bold">遍历结束 ans = 5</text>
  <text x="78" y="298" font-size="10.5" fill="#555">验证 (101)₂ = 4 + 0 + 1 = 5 ✓　指针只前进一遍，无递归、无额外数组</text>

  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#999">若输入为 [0]：ans 始终为 0，返回 0；若为 [1,1,1,1]：得 15</text>
</svg>
