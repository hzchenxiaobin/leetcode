<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">示例 1：grid 3×3，k = 2，答案 7</text>
  <rect x="80" y="100" width="50" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105.0" y="130.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="130" y="100" width="50" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155.0" y="130.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="180" y="100" width="50" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205.0" y="130.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="80" y="150" width="50" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105.0" y="180.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="130" y="150" width="50" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155.0" y="180.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <rect x="180" y="150" width="50" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205.0" y="180.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="80" y="200" width="50" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105.0" y="230.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="130" y="200" width="50" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155.0" y="230.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="180" y="200" width="50" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205.0" y="230.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="68" y="130" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="68" y="180" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="68" y="230" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="105" y="90" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="155" y="90" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="205" y="90" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <rect x="300" y="96" width="350" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="122" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">一条最优路径</text>
  <text x="475" y="150" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(0,0) →下 (1,0)  +2 = 2</text>
  <text x="475" y="174" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1,0) →右 (1,1)  +5 = 7</text>
  <text x="475" y="198" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">(1,1) ⇢传送 (2,2)  +0 = 7</text>
  <text x="475" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">grid[2][2]=5 ≤ grid[1][1]=5 ✓</text>
  <rect x="60" y="270" width="590" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="355" y="296" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">为什么不是「不传送」：0→1→2 只能拿到 1+3+4 = 8、1+2+4 = 8 等</text>
  <text x="355" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">为什么不能更小：到 (1,1) 至少要 2+5 = 7，传送后 0 成本</text>
  <text x="355" y="348" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">若从 (0,1) 传送：到 (0,1) 已花 3，再传送到 (2,2) 也是 3，但到 (0,1) 后</text>
  <text x="355" y="370" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">grid[0][1]=3 &lt; 5，传不到 (2,2)</text>
</svg>
