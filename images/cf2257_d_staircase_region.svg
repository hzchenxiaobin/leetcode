<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="440" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">S = 6：所有可能矩形的并集是一把 14 格的阶梯</text>
  <text x="340" y="50" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">单元格 (i, j) 可被覆盖 ⟺ 存在因子 a 使 a ≥ i 且 S/a ≥ j</text>

  <!-- 6 × 6 网格：原点 (70, 330)，格宽 26 -->
  <rect x="70" y="304" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="70" y="278" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="70" y="252" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="70" y="226" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="70" y="200" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="70" y="174" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="96" y="304" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="96" y="278" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="96" y="252" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="96" y="226" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="96" y="200" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="96" y="174" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="122" y="304" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="122" y="278" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="122" y="252" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="122" y="226" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="122" y="200" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="122" y="174" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="148" y="304" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="148" y="278" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="148" y="252" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="148" y="226" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="148" y="200" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="148" y="174" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="174" y="304" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="174" y="278" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="174" y="252" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="174" y="226" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="174" y="200" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="174" y="174" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="200" y="304" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="200" y="278" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="200" y="252" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="200" y="226" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="200" y="200" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="200" y="174" width="26" height="26" fill="#f1f1f1" stroke="#c8c8c8" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- 坐标轴 -->
  <g filter="url(#rough2)" stroke="#555" stroke-width="1.4" fill="none">
    <path d="M 62 330 L 238 330"/>
    <path d="M 62 330 L 62 164"/>
  </g>
  <text x="242" y="334" font-size="10" fill="#555" filter="url(#rough2)">i</text>
  <text x="54" y="159" font-size="10" fill="#555" filter="url(#rough2)">j</text>

  <g filter="url(#rough2)" font-size="9.5" fill="#777" text-anchor="middle">
    <text x="83" y="345">1</text>
    <text x="109" y="345">2</text>
    <text x="135" y="345">3</text>
    <text x="161" y="345">4</text>
    <text x="187" y="345">5</text>
    <text x="213" y="345">6</text>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#777" text-anchor="end">
    <text x="58" y="321">1</text>
    <text x="58" y="295">2</text>
    <text x="58" y="269">3</text>
    <text x="58" y="243">4</text>
    <text x="58" y="217">5</text>
    <text x="58" y="191">6</text>
  </g>

  <!-- 阶梯边界 -->
  <path d="M 70 330 L 70 174 L 96 174 L 96 252 L 122 252 L 122 278 L 148 278 L 148 304 L 226 304 L 226 330"
        stroke="#b85450" stroke-width="2.2" fill="none" stroke-linejoin="round" filter="url(#rough2)"/>

  <!-- 右侧说明 -->
  <text x="278" y="92" font-size="11.5" font-weight="bold" fill="#444" filter="url(#rough2)">4 个因子各贡献一段台阶</text>

  <g filter="url(#rough2)">
    <rect x="272" y="104" width="378" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="7"/>
    <text x="284" y="120" font-size="10.5" fill="#8a3a36">a = 1，b = 6：1×6 竖条 → 列 1 的 6 格</text>
    <text x="284" y="134" font-size="9" fill="#a8696a">矩形 [0,1]×[0,6] 提供最高的那条腿</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="272" y="150" width="378" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="7"/>
    <text x="284" y="166" font-size="10.5" fill="#3a5a30">a = 2，b = 3：2×3 → 新增列 2 的 3 格</text>
    <text x="284" y="180" font-size="9" fill="#6b8f5c">前 3 行已被 a = 1 覆盖，不重复计数</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="272" y="196" width="378" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="7"/>
    <text x="284" y="212" font-size="10.5" fill="#8a6a20">a = 3，b = 2：3×2 → 新增列 3 的 2 格</text>
    <text x="284" y="226" font-size="9" fill="#a98a40">台阶只会往右下降低，绝不回头</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="272" y="242" width="378" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="7"/>
    <text x="284" y="258" font-size="10.5" fill="#2c3e50">a = 6，b = 1：6×1 → 新增列 4, 5, 6 各 1 格</text>
    <text x="284" y="272" font-size="9" fill="#5b7a99">最矮的横条兜住所有“靠右”的格子</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="272" y="292" width="378" height="44" fill="#fffdf5" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="284" y="311" font-size="11" font-weight="bold" fill="#444">6 + 3 + 2 + 3 = 14 格</text>
    <text x="284" y="327" font-size="9.2" fill="#8a6a20">正是 S=6、查询 (x,y)=(6,6) 的答案：每列高度 = S / f(i)</text>
  </g>

  <text x="70" y="368" font-size="9.6" fill="#666" filter="url(#rough2)">f(i) = 不小于 i 的最小因子：f(1)=1，f(2)=2，f(3)=3，f(4..6)=6</text>
  <text x="70" y="388" font-size="9.6" fill="#666" filter="url(#rough2)">于是每列的最大可用高度 b(i) = 6, 3, 2, 1, 1, 1 —— 分段常数，最多 τ(S) 段</text>
  <text x="70" y="408" font-size="9.6" fill="#666" filter="url(#rough2)">查询 (x,y) 的答案 = Σ_{i ≤ x} min(y, b(i))，只需在“段”上求和</text>
</svg>
