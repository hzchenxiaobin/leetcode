<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="700" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：镜像统一坐标系——两个重排区间进入同一条数轴</text>
  <path d="M 250 42 Q 470 52 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- original string -->
  <text x="80" y="76" font-size="13" fill="#2b2b2b">以 s = "acbcab"、查询 [a,b,c,d] = [1,2,4,5] 为例（m = 3）：</text>
  <g filter="url(#sk)">
    <rect x="80" y="94" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="124" y="94" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="168" y="94" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="212" y="94" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="256" y="94" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="300" y="94" width="44" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="102" y="120" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="146" y="120" text-anchor="middle" font-size="15" fill="#333">c</text>
  <text x="190" y="120" text-anchor="middle" font-size="15" fill="#333">b</text>
  <text x="234" y="120" text-anchor="middle" font-size="15" fill="#333">c</text>
  <text x="278" y="120" text-anchor="middle" font-size="15" fill="#333">a</text>
  <text x="322" y="120" text-anchor="middle" font-size="15" fill="#333">b</text>
  <text x="102" y="152" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="146" y="152" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="190" y="152" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="234" y="152" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="278" y="152" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="322" y="152" text-anchor="middle" font-size="10" fill="#999">5</text>
  <path d="M 124 158 L 124 164 L 212 164 L 212 158" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="168" y="180" text-anchor="middle" font-size="11" fill="#2b5a8e">重排 U1=[1,2]</text>
  <path d="M 256 158 L 256 164 L 344 164 L 344 158" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="300" y="180" text-anchor="middle" font-size="11" fill="#b8862a">重排 [4,5]</text>
  <text x="420" y="108" font-size="12" fill="#444">回文 ⟺ ∀ i ∈ [0,m)：s[i] = s[n−1−i]</text>
  <text x="420" y="130" font-size="12" fill="#444">把右半「翻转对齐」到左半：x[i]=s[i]，y[i]=s[n−1−i]</text>
  <text x="420" y="152" font-size="12" font-weight="bold" fill="#8e3a34">→ 右区间 [c,d] 变 [A,B] = [n−1−d, n−1−c]</text>

  <!-- mirror arrows -->
  <path d="M 322 140 Q 340 205 232 262" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 278 140 Q 288 200 292 260" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 234 140 Q 220 195 352 258" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="212" font-size="10" fill="#b8862a">镜像翻转 →</text>

  <!-- unified coordinate system -->
  <text x="120" y="240" font-size="12" fill="#2b5a8e" font-weight="bold">x[i] =</text>
  <g filter="url(#sk)">
    <rect x="200" y="218" width="56" height="40" rx="4" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="264" y="218" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="328" y="218" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="200" y="268" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="264" y="268" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="328" y="268" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="262" y="216" width="124" height="44" rx="6" fill="none" stroke="#b85450" stroke-width="2.2"/>
    <rect x="198" y="266" width="188" height="44" rx="6" fill="none" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="228" y="243" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="292" y="243" text-anchor="middle" font-size="14" fill="#333">c</text>
  <text x="356" y="243" text-anchor="middle" font-size="14" fill="#333">b</text>
  <text x="120" y="292" font-size="12" fill="#2e6e2e" font-weight="bold">y[i] =</text>
  <text x="228" y="293" text-anchor="middle" font-size="14" fill="#333">b</text>
  <text x="292" y="293" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="356" y="293" text-anchor="middle" font-size="14" fill="#333">c</text>
  <text x="420" y="238" font-size="12" font-weight="bold" fill="#8e3a34">U1 = [a,b] = [1,2]（上行红框）</text>
  <text x="420" y="260" font-size="12" fill="#444">U2 = [n−1−d, n−1−c] = [0,2]（下行橙框）</text>
  <text x="420" y="282" font-size="12" fill="#444">交集 I = [1,2] → 两个区间可以相交！</text>
  <text x="228" y="332" text-anchor="middle" font-size="10" fill="#999">i=0</text>
  <text x="292" y="332" text-anchor="middle" font-size="10" fill="#999">i=1</text>
  <text x="356" y="332" text-anchor="middle" font-size="10" fill="#999">i=2</text>
  <text x="228" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">仅②</text>
  <text x="292" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#8e3a34">双</text>
  <text x="356" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#8e3a34">双</text>

  <!-- four zone cards -->
  <g filter="url(#sk)">
    <rect x="80" y="384" width="380" height="82" rx="8" fill="#f4f4f4" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="100" y="410" font-size="13" font-weight="bold" fill="#555">门外：i ∉ U1 ∪ U2</text>
  <text x="100" y="434" font-size="12" fill="#444">x、y 都锁死，动不了 → 必须已经相等（条件 A）</text>
  <text x="100" y="454" font-size="11" fill="#888">本例：门外为空集</text>
  <g filter="url(#sk)">
    <rect x="480" y="384" width="380" height="82" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="500" y="410" font-size="13" font-weight="bold" fill="#2b5a8e">仅①：i ∈ U1 ∖ U2</text>
  <text x="500" y="434" font-size="12" fill="#444">x[i] 进左池可换；y[i] 锁死 → 左池的固定需求 Dx</text>
  <text x="500" y="454" font-size="11" fill="#888">锁死的 y 必须由左池里同字母的字符去配</text>
  <g filter="url(#sk)">
    <rect x="80" y="478" width="380" height="82" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="100" y="504" font-size="13" font-weight="bold" fill="#2e6e2e">仅②：i ∈ U2 ∖ U1</text>
  <text x="100" y="528" font-size="12" fill="#444">y[i] 进右池可换；x[i] 锁死 → 右池的固定需求 Dy</text>
  <text x="100" y="548" font-size="11" fill="#888">本例 i=0：x[0]=a 锁死，右池要留下一个 a</text>
  <g filter="url(#sk)">
    <rect x="480" y="478" width="380" height="82" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="500" y="504" font-size="13" font-weight="bold" fill="#8e3a34">双：i ∈ U1 ∩ U2</text>
  <text x="500" y="528" font-size="12" fill="#444">两侧都自由：从左右两池各取一个字符且必须相等</text>
  <text x="500" y="548" font-size="11" font-weight="bold" fill="#8e3a34">两池之间唯一的「桥」</text>

  <!-- final formula -->
  <g filter="url(#sk)">
    <rect x="80" y="578" width="780" height="94" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="6 3"/>
  </g>
  <text x="100" y="604" font-size="13" font-weight="bold" fill="#2b2b2b">判定式（逐字母 v）：双位置配对值 v 的个数 k[v] ≥ 0，消去后——</text>
  <text x="470" y="632" text-anchor="middle" font-size="15" font-family="monospace" font-weight="bold" fill="#333">Xv − Dxv  =  Yv − Dyv  ≥  0</text>
  <text x="470" y="656" text-anchor="middle" font-size="11" fill="#888">等式 = 并集总账相等（条件 B）；非负 = 左池喂饱固定需求后仍有余量（条件 C）</text>
</svg>
