<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">按位数分块：块内数字等长，块长可直接算</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">第 d 块 = 全部 d 位数，个数 9·10^(d−1)，共占 9·10^(d−1)·d 个字符</text>

  <rect x="40" y="64" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#3a4a66" font-weight="bold">
    <text x="90" y="84">位数 d</text>
    <text x="205" y="84">数字范围</text>
    <text x="330" y="84">块内个数</text>
    <text x="440" y="84">块长（字符）</text>
    <text x="545" y="84">累计字符</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#444">
    <rect x="40" y="98" width="540" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="90" y="118">1</text>
    <text x="205" y="118">1 – 9</text>
    <text x="330" y="118">9</text>
    <text x="440" y="118">9</text>
    <text x="545" y="118">9</text>

    <rect x="40" y="132" width="540" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="90" y="152">2</text>
    <text x="205" y="152">10 – 99</text>
    <text x="330" y="152">90</text>
    <text x="440" y="152">180</text>
    <text x="545" y="152">189</text>

    <rect x="40" y="166" width="540" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="90" y="186">3</text>
    <text x="205" y="186">100 – 999</text>
    <text x="330" y="186">900</text>
    <text x="440" y="186">2 700</text>
    <text x="545" y="186">2 889</text>

    <rect x="40" y="200" width="540" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="90" y="220">4</text>
    <text x="205" y="220">1000 – 9999</text>
    <text x="330" y="220">9 000</text>
    <text x="440" y="220">36 000</text>
    <text x="545" y="220">38 889</text>

    <text x="90" y="254" font-size="13" fill="#999">⋮</text>
    <text x="330" y="254" font-size="13" fill="#999">⋮</text>
    <text x="440" y="254" font-size="13" fill="#999">⋮</text>
    <text x="545" y="254" font-size="13" fill="#999">⋮</text>

    <rect x="40" y="264" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <text x="90" y="284">9</text>
    <text x="205" y="284">10⁸ – 10⁹−1</text>
    <text x="330" y="284">9·10⁸</text>
    <text x="440" y="284">8.1·10⁹</text>
    <text x="545" y="284">8 888 888 889</text>
  </g>

  <rect x="40" y="310" width="540" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="332" font-size="10.5" fill="#3a5a30">n ≤ 2³¹−1 = 2 147 483 647 &lt; 8 888 888 889</text>
  <text x="360" y="332" font-size="10.5" fill="#3a5a30">⇒ 答案必在 1–9 位块内，循环 ≤ 9 轮</text>

  <text x="310" y="386" text-anchor="middle" font-size="10.5" fill="#666">把「逐位遍历」换成「整块跳过」：先减完整块定位 d，再在块内 O(1) 算出 num 与偏移</text>
</svg>
