<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：两个方向到达 target</text>

  <!-- right path above cells -->
  <path d="M 226 90 C 226 54, 508 54, 508 90" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="367" y="44" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a1a">右移 3 步 → idx 4（dist 3）</text>

  <!-- cells -->
  <g filter="url(#sk)"><rect x="88" y="92" width="88" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="132" y="110" text-anchor="middle" font-size="12" fill="#2e5e2e">hello</text>
  <text x="132" y="130" text-anchor="middle" font-size="9.5" fill="#4a7a3a">idx 0</text>

  <g filter="url(#sk)"><rect x="182" y="92" width="88" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/></g>
  <text x="226" y="110" text-anchor="middle" font-size="12" fill="#2b4a66">i</text>
  <text x="226" y="130" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450">idx 1 · start</text>

  <g filter="url(#sk)"><rect x="276" y="92" width="88" height="48" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="320" y="110" text-anchor="middle" font-size="12" fill="#555">am</text>
  <text x="320" y="130" text-anchor="middle" font-size="9.5" fill="#999">idx 2</text>

  <g filter="url(#sk)"><rect x="370" y="92" width="88" height="48" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="414" y="110" text-anchor="middle" font-size="9.5" fill="#555">leetcode</text>
  <text x="414" y="130" text-anchor="middle" font-size="9.5" fill="#999">idx 3</text>

  <g filter="url(#sk)"><rect x="464" y="92" width="88" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="508" y="110" text-anchor="middle" font-size="12" fill="#2e5e2e">hello</text>
  <text x="508" y="130" text-anchor="middle" font-size="9.5" fill="#4a7a3a">idx 4</text>

  <!-- left path below cells -->
  <path d="M 226 142 C 226 180, 132 180, 132 142" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="179" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a6a2a">左移 1 步 → idx 0（dist 1）✓</text>

  <text x="320" y="210" text-anchor="middle" font-size="10" fill="#999">words = [hello, i, am, leetcode, hello]，target = "hello"，start = 1，n = 5</text>

  <!-- table -->
  <g filter="url(#sk)"><rect x="110" y="218" width="105" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="215" y="218" width="105" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="320" y="218" width="105" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="425" y="218" width="105" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="162.5" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">匹配 i</text>
  <text x="267.5" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">右移 dR</text>
  <text x="372.5" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">左移 dL</text>
  <text x="477.5" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">dist = min</text>

  <g filter="url(#sk)"><rect x="110" y="242" width="105" height="24" fill="#fdfdf6" stroke="#cccccc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="215" y="242" width="105" height="24" fill="#fdfdf6" stroke="#cccccc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="320" y="242" width="105" height="24" fill="#fdfdf6" stroke="#cccccc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="425" y="242" width="105" height="24" fill="#fdfdf6" stroke="#cccccc" stroke-width="1"/></g>
  <text x="162.5" y="258" text-anchor="middle" font-size="11" font-family="monospace" fill="#444">idx 0</text>
  <text x="267.5" y="258" text-anchor="middle" font-size="11" font-family="monospace" fill="#444">4</text>
  <text x="372.5" y="258" text-anchor="middle" font-size="11" font-family="monospace" fill="#444">1</text>
  <text x="477.5" y="258" text-anchor="middle" font-size="11" font-family="monospace" font-weight="bold" fill="#4a7a3a">1 ✓</text>

  <g filter="url(#sk)"><rect x="110" y="266" width="105" height="24" fill="#fdfdf6" stroke="#cccccc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="215" y="266" width="105" height="24" fill="#fdfdf6" stroke="#cccccc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="320" y="266" width="105" height="24" fill="#fdfdf6" stroke="#cccccc" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="425" y="266" width="105" height="24" fill="#fdfdf6" stroke="#cccccc" stroke-width="1"/></g>
  <text x="162.5" y="282" text-anchor="middle" font-size="11" font-family="monospace" fill="#444">idx 4</text>
  <text x="267.5" y="282" text-anchor="middle" font-size="11" font-family="monospace" fill="#444">3</text>
  <text x="372.5" y="282" text-anchor="middle" font-size="11" font-family="monospace" fill="#444">2</text>
  <text x="477.5" y="282" text-anchor="middle" font-size="11" font-family="monospace" fill="#444">2</text>

  <text x="320" y="306" text-anchor="middle" font-size="10" fill="#888">注：到 idx 4 向左需绕环（1→0→4），dL = 2；两处 target 取全局最小</text>

  <g filter="url(#sk)"><rect x="180" y="318" width="280" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="320" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">ans = min(1, 2) = 1 ✓</text>
</svg>
