<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：升序吞噬走查</text>

  <!-- 示例 1 -->
  <text x="260" y="50" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">示例 1：mass = 10 → 排序 [3, 5, 9, 19, 21]</text>

  <rect x="40" y="60" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">小行星 a</text>
  <rect x="140" y="60" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="208" y="60" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="276" y="60" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="344" y="60" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">19</text>
  <rect x="412" y="60" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="82" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">21</text>

  <rect x="40" y="94" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">碰前质量 m</text>
  <rect x="140" y="94" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="208" y="94" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">13</text>
  <rect x="276" y="94" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">18</text>
  <rect x="344" y="94" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">27</text>
  <rect x="412" y="94" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">46</text>

  <rect x="40" y="128" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">碰后质量 m</text>
  <rect x="140" y="128" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">13</text>
  <rect x="208" y="128" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">18</text>
  <rect x="276" y="128" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">27</text>
  <rect x="344" y="128" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">46</text>
  <rect x="412" y="128" width="68" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">67</text>

  <text x="174" y="180" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="242" y="180" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="310" y="180" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="378" y="180" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="446" y="180" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="260" y="206" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">10 → 13 → 18 → 27 → 46 → 67，全部吞噬，return true</text>

  <!-- 示例 2 -->
  <text x="260" y="240" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">示例 2：mass = 5 → 排序 [4, 4, 9, 23]</text>

  <rect x="74" y="250" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">小行星 a</text>
  <rect x="174" y="250" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="242" y="250" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="310" y="250" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="344" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="378" y="250" width="68" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="412" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">23</text>

  <rect x="74" y="284" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">碰前质量 m</text>
  <rect x="174" y="284" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="242" y="284" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="310" y="284" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="344" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">13</text>
  <rect x="378" y="284" width="68" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="412" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">22</text>

  <rect x="74" y="318" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="340" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">碰后质量 m</text>
  <rect x="174" y="318" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="340" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="242" y="318" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="340" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">13</text>
  <rect x="310" y="318" width="68" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="344" y="340" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">22</text>
  <rect x="378" y="318" width="68" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="412" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="260" y="374" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">22 &lt; 23：升序在最小的拦路虎处失败，return false</text>

  <rect x="74" y="386" width="372" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="402" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">摧毁 23 之前能吞的至多是另外三颗（合计 22），仍 &lt; 23；</text>
  <text x="260" y="418" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">换任何顺序也救不了——必然性证明见 §5</text>
</svg>
