<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="111"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 4 走查：[2,3,5,7,11,13,17,19] → [2,3,5,17,7,11,13,19]</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="13" fill="#446688" font-weight="bold" text-anchor="middle">
    <rect x="30" y="50" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="60" y="70">数值 x</text>
    <rect x="90" y="50" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="145" y="70">二进制</text>
    <rect x="200" y="50" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="240" y="70">1 的个数</text>
    <rect x="280" y="50" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="340" y="70">排序键</text>
    <rect x="400" y="50" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="465" y="70">输出位置</text>
  </g>

  <!-- 八行 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="30" y="84" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="60" y="104" font-weight="bold">2</text>
    <rect x="90" y="84" width="110" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="145" y="104">10</text>
    <rect x="200" y="84" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="240" y="104">1</text>
    <rect x="280" y="84" width="120" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="340" y="104">(1, 2)</text>
    <rect x="400" y="84" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="465" y="104">第 1 位</text>

    <rect x="30" y="116" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="60" y="136" font-weight="bold">3</text>
    <rect x="90" y="116" width="110" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="145" y="136">11</text>
    <rect x="200" y="116" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="240" y="136">2</text>
    <rect x="280" y="116" width="120" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="340" y="136">(2, 3)</text>
    <rect x="400" y="116" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="465" y="136">第 2 位</text>

    <rect x="30" y="148" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="60" y="168" font-weight="bold">5</text>
    <rect x="90" y="148" width="110" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="145" y="168">101</text>
    <rect x="200" y="148" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="240" y="168">2</text>
    <rect x="280" y="148" width="120" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="340" y="168">(2, 5)</text>
    <rect x="400" y="148" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="465" y="168">第 3 位</text>

    <rect x="30" y="180" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="60" y="200" font-weight="bold">17</text>
    <rect x="90" y="180" width="110" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="145" y="200">10001</text>
    <rect x="200" y="180" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="240" y="200">2</text>
    <rect x="280" y="180" width="120" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="340" y="200">(2, 17)</text>
    <rect x="400" y="180" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="465" y="200">第 4 位</text>

    <rect x="30" y="212" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="60" y="232" font-weight="bold">7</text>
    <rect x="90" y="212" width="110" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="145" y="232">111</text>
    <rect x="200" y="212" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="240" y="232">3</text>
    <rect x="280" y="212" width="120" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="340" y="232">(3, 7)</text>
    <rect x="400" y="212" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="465" y="232">第 5 位</text>

    <rect x="30" y="244" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="60" y="264" font-weight="bold">11</text>
    <rect x="90" y="244" width="110" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="145" y="264">1011</text>
    <rect x="200" y="244" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="240" y="264">3</text>
    <rect x="280" y="244" width="120" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="340" y="264">(3, 11)</text>
    <rect x="400" y="244" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="465" y="264">第 6 位</text>

    <rect x="30" y="276" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="60" y="296" font-weight="bold">13</text>
    <rect x="90" y="276" width="110" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="145" y="296">1101</text>
    <rect x="200" y="276" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="240" y="296">3</text>
    <rect x="280" y="276" width="120" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="340" y="296">(3, 13)</text>
    <rect x="400" y="276" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="465" y="296">第 7 位</text>

    <rect x="30" y="308" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="60" y="328" font-weight="bold">19</text>
    <rect x="90" y="308" width="110" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="145" y="328">10011</text>
    <rect x="200" y="308" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="240" y="328">3</text>
    <rect x="280" y="308" width="120" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="340" y="328">(3, 19)</text>
    <rect x="400" y="308" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="465" y="328">第 8 位</text>
  </g>

  <!-- 结论 -->
  <rect x="60" y="348" width="440" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">同是 2 个 1：3 &lt; 5 &lt; 17；同是 3 个 1：7 &lt; 11 &lt; 13 &lt; 19</text>
</svg>
