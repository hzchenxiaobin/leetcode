<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">n = 9 的完整演算：4 行数字，3 轮收缩</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">初始 head = 1，step = 1，rem = 9，left = true</text>

  <rect x="30" y="76" width="526" height="136" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="30" y="76" width="526" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="31" y="179" width="524" height="33" fill="#e6f4ea" filter="url(#rough2)"/>
  <line x1="68" y1="76" x2="68" y2="212" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="128" y1="76" x2="128" y2="212" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="310" y1="76" x2="310" y2="212" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="430" y1="76" x2="430" y2="212" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="478" y1="76" x2="478" y2="212" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="518" y1="76" x2="518" y2="212" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="49" y="98" text-anchor="middle" font-size="10.5" fill="#2a4660" filter="url(#rough2)">轮</text>
  <text x="98" y="98" text-anchor="middle" font-size="10.5" fill="#2a4660" filter="url(#rough2)">方向</text>
  <text x="219" y="98" text-anchor="middle" font-size="10.5" fill="#2a4660" filter="url(#rough2)">本轮删除后序列</text>
  <text x="370" y="98" text-anchor="middle" font-size="10.5" fill="#2a4660" filter="url(#rough2)">head 是否移动</text>
  <text x="454" y="98" text-anchor="middle" font-size="10.5" fill="#2a4660" filter="url(#rough2)">head</text>
  <text x="498" y="98" text-anchor="middle" font-size="10.5" fill="#2a4660" filter="url(#rough2)">step</text>
  <text x="537" y="98" text-anchor="middle" font-size="10.5" fill="#2a4660" filter="url(#rough2)">rem</text>

  <line x1="30" y1="144" x2="556" y2="144" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="49" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="98" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">L→R</text>
  <text x="219" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2, 4, 6, 8]</text>
  <text x="370" y="123" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">必动</text>
  <text x="454" y="123" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">2</text>
  <text x="498" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="537" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <line x1="30" y1="178" x2="556" y2="178" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="49" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="98" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">R→L</text>
  <text x="219" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2, 6]</text>
  <text x="370" y="157" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">rem=4 偶，不动</text>
  <text x="454" y="157" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">2</text>
  <text x="498" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="537" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <text x="49" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="98" y="199" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">L→R</text>
  <text x="219" y="199" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[6]</text>
  <text x="370" y="199" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">必动</text>
  <text x="454" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5424" filter="url(#rough2)">6</text>
  <text x="498" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="537" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="60" y="232" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">第 3 轮后 rem = 1，唯一剩下的数就是 head = 6</text>
  <text x="280" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">答案 6，与题目示例一致</text>

  <text x="280" y="310" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">对照实际列表：</text>
  <text x="280" y="328" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">[1…9] → [2,4,6,8] → [2,6] → [6]</text>
  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每轮长度 ⌊rem/2⌋，共 3 轮 ≈ ⌈log₂ 9⌉</text>
</svg>
