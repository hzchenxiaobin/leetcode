<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 322"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="322" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">按 |x| 升序处理：轮到 x 时只剩 2x 可选</text>
  <text x="280" y="54" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">处理顺序：-2 → 2 → -4 → 4（|x| = 2, 2, 4, 4）</text>
  <rect x="40" y="70" width="210" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="98" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">-2（|x| = 2，先处理）</text>
  <path d="M 252 92 L 300 92" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="302" y="70" width="218" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="411" y="98" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">2×(-2) = -4（唯一搭档）</text>
  <rect x="40" y="130" width="210" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="158" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">2（|x| = 2，再处理）</text>
  <path d="M 252 152 L 300 152" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="302" y="130" width="218" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="411" y="158" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">2×2 = 4（唯一搭档）</text>
  <rect x="40" y="196" width="480" height="52" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">x/2 的 |x| 更小，早已处理完且计数清零</text>
  <text x="280" y="238" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">⇒ 每个剩余的 x 别无选择，必须与 2x 配对</text>
  <rect x="40" y="262" width="480" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="291" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">若 cnt[2x] &lt; cnt[x]：无解，直接返回 false</text>
</svg>
