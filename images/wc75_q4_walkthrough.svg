<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2, 3, 1, 4, 0]，n = 5</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每行是一个元素 j（值 v）在哪些 k 上得分；列求和即 score[k]</text>

  <rect x="348" y="70" width="70" height="246" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="383" y="66" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">最优列</text>

  <text x="140" y="82" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">元素 j，值 v</text>
  <text x="179" y="82" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">k = 0</text>
  <text x="247" y="82" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">k = 1</text>
  <text x="315" y="82" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">k = 2</text>
  <text x="383" y="82" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">k = 3</text>
  <text x="451" y="82" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">k = 4</text>

  <rect x="150" y="98" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="218" y="98" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="286" y="98" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="354" y="98" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="422" y="98" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="140" y="122" text-anchor="end" font-size="10.5" fill="#333" filter="url(#rough2)">j = 0, v = 2</text>
  <rect x="171" y="115" width="15" height="3.5" fill="#c9b8a8" rx="1.5" filter="url(#rough2)"/>
  <ellipse cx="247" cy="117" rx="7.5" ry="7.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <ellipse cx="315" cy="117" rx="7.5" ry="7.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <ellipse cx="383" cy="117" rx="7.5" ry="7.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="443" y="115" width="15" height="3.5" fill="#c9b8a8" rx="1.5" filter="url(#rough2)"/>

  <rect x="150" y="142" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="218" y="142" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="286" y="142" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="354" y="142" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="422" y="142" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="140" y="166" text-anchor="end" font-size="10.5" fill="#333" filter="url(#rough2)">j = 1, v = 3</text>
  <rect x="171" y="159" width="15" height="3.5" fill="#c9b8a8" rx="1.5" filter="url(#rough2)"/>
  <rect x="239" y="159" width="15" height="3.5" fill="#c9b8a8" rx="1.5" filter="url(#rough2)"/>
  <ellipse cx="315" cy="161" rx="7.5" ry="7.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <ellipse cx="383" cy="161" rx="7.5" ry="7.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="443" y="159" width="15" height="3.5" fill="#c9b8a8" rx="1.5" filter="url(#rough2)"/>

  <rect x="150" y="186" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="218" y="186" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="286" y="186" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="354" y="186" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="422" y="186" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="140" y="210" text-anchor="end" font-size="10.5" fill="#333" filter="url(#rough2)">j = 2, v = 1</text>
  <ellipse cx="179" cy="205" rx="7.5" ry="7.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <ellipse cx="247" cy="205" rx="7.5" ry="7.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="307" y="203" width="15" height="3.5" fill="#c9b8a8" rx="1.5" filter="url(#rough2)"/>
  <ellipse cx="383" cy="205" rx="7.5" ry="7.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <ellipse cx="451" cy="205" rx="7.5" ry="7.5" fill="#4a7a3a" filter="url(#rough2)"/>

  <rect x="150" y="230" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="218" y="230" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="286" y="230" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="354" y="230" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="422" y="230" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="140" y="254" text-anchor="end" font-size="10.5" fill="#333" filter="url(#rough2)">j = 3, v = 4</text>
  <rect x="171" y="247" width="15" height="3.5" fill="#c9b8a8" rx="1.5" filter="url(#rough2)"/>
  <rect x="239" y="247" width="15" height="3.5" fill="#c9b8a8" rx="1.5" filter="url(#rough2)"/>
  <rect x="307" y="247" width="15" height="3.5" fill="#c9b8a8" rx="1.5" filter="url(#rough2)"/>
  <rect x="375" y="247" width="15" height="3.5" fill="#c9b8a8" rx="1.5" filter="url(#rough2)"/>
  <ellipse cx="451" cy="249" rx="7.5" ry="7.5" fill="#4a7a3a" filter="url(#rough2)"/>

  <rect x="150" y="274" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="218" y="274" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="286" y="274" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="354" y="274" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <rect x="422" y="274" width="58" height="38" fill="none" stroke="#b0b0b0" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="140" y="298" text-anchor="end" font-size="10.5" fill="#333" filter="url(#rough2)">j = 4, v = 0</text>
  <ellipse cx="179" cy="293" rx="7.5" ry="7.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <ellipse cx="247" cy="293" rx="7.5" ry="7.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <ellipse cx="315" cy="293" rx="7.5" ry="7.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <ellipse cx="383" cy="293" rx="7.5" ry="7.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <ellipse cx="451" cy="293" rx="7.5" ry="7.5" fill="#4a7a3a" filter="url(#rough2)"/>

  <rect x="150" y="322" width="330" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="344" text-anchor="end" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">score[k]</text>
  <text x="179" y="345" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="247" y="345" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="315" y="345" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="383" y="345" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="451" y="345" text-anchor="middle" font-size="14" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>

  <text x="44" y="386" font-size="10.5" fill="#555" filter="url(#rough2)">列和的最大值为 4，只在 k = 3 取到（k = 1、2、4 处均为 3），因此答案是 3。</text>
</svg>
