<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="310" fill="#fafafa"/>
  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：bfsFarthest(src) 的执行骨架</text>

  <g filter="url(#rough2)">
    <rect x="30" y="44" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="140" y="62" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dist 全部置 −1（兼作访问标记）</text>
  <text x="140" y="78" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">dist[src] = 0，far = src，q = [src]</text>

  <g filter="url(#rough2)">
    <path d="M 250 64 L 290 64" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <rect x="294" y="44" width="216" height="96" fill="#fff" stroke="#666" stroke-width="1.4" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5">
    <text x="308" y="66" fill="#333" font-weight="bold">while q 非空：</text>
    <text x="312" y="84" fill="#555">v ← q 出队</text>
    <text x="312" y="100" fill="#3a5a30">若 dist[v] &gt; dist[far]：far = v</text>
    <text x="312" y="116" fill="#555">for u in g[v]：若 dist[u] == −1</text>
    <text x="318" y="132" fill="#555">dist[u] = dist[v] + 1；u 入队</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 402 140 L 402 166" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
    <rect x="160" y="168" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
  </g>
  <text x="310" y="186" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回 (far, dist[far])</text>
  <text x="310" y="203" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">队列距离单调不减 → 出队时比较是安全的</text>

  <g filter="url(#rough2)">
    <rect x="30" y="168" width="100" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="80" y="186" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">BFS 按层推进</text>
  <text x="80" y="202" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">= 单源最短路</text>

  <g filter="url(#rough2)">
    <rect x="60" y="232" width="440" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="280" y="253" fill="#8a3a36" font-weight="bold">主流程：n = edges.length + 1；n == 1 直接返回 0</text>
    <text x="280" y="271" fill="#8a3a36">建邻接表（无向边双向加）→ a = bfs(0).first → 返回 bfs(a).second</text>
    <text x="280" y="289" fill="#777">⚠ 别用递归 DFS：10⁴ 深的链形树可能爆栈；BFS 天然免疫</text>
  </g>
</svg>
