<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">环形视角：只找「下降点」</text>

  <!-- 环形回绕比较：nums[n-1] vs nums[0] -->
  <path d="M 426 136 C 400 58, 94 58, 70 134" fill="none" stroke="#446688" stroke-width="2"
        stroke-dasharray="6 5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">环形比较 nums[n-1]=2 ≤ nums[0]=3 ✓ 无断点</text>

  <!-- 数组格子 -->
  <rect x="70"  y="120" width="64" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="142" y="120" width="64" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="214" y="120" width="64" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="286" y="120" width="64" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="358" y="120" width="64" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="149" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="174" y="149" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="246" y="149" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="318" y="149" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="390" y="149" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>

  <!-- 上方绿色方括号：非降段 A -->
  <path d="M 70 112 L 70 96 L 278 96 L 278 112" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="174" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">非降段</text>

  <!-- 下方蓝色方括号：非降段 B -->
  <path d="M 286 174 L 286 190 L 422 190 L 422 174" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="354" y="208" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">非降段</text>

  <!-- 下降点标注 -->
  <path d="M 246 172 C 246 212, 318 212, 318 172" fill="none" stroke="#b85450" stroke-width="2.5"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="282" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">下降点 i=2（5 &gt; 1）</text>

  <!-- 结论面板 -->
  <rect x="36" y="248" width="448" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="276" font-size="13" fill="#333" filter="url(#rough2)">断点恰 1 个：答案 = n − i − 1</text>
  <text x="56" y="298" font-size="13" fill="#333" filter="url(#rough2)">（把下标 i+1 转到开头所需的右移次数）</text>
  <text x="56" y="322" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">本例：5 − 2 − 1 = 2 次 → [1,2,3,4,5] ✓</text>
</svg>
