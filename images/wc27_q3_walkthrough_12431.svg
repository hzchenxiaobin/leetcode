<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="410" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n = 12431 → 13124</text>
  <text x="320" y="50" text-anchor="middle" font-size="10.5" fill="#888">四次线性操作：找枢纽 → 找交换点 → 交换 → 反转后缀</text>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="216" y="70">0</text>
    <text x="276" y="70">1</text>
    <text x="336" y="70">2</text>
    <text x="396" y="70">3</text>
    <text x="456" y="70">4</text>
  </g>

  <!-- 第 1 行：原始数位 -->
  <g filter="url(#rough2)" font-size="10" fill="#444">
    <text x="22" y="101">原始：n = 12431</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="190" y="76" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <rect x="250" y="76" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <rect x="310" y="76" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <rect x="370" y="76" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <rect x="430" y="76" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="18" text-anchor="middle" fill="#333">
    <text x="216" y="102">1</text>
    <text x="276" y="102">2</text>
    <text x="336" y="102">4</text>
    <text x="396" y="102">3</text>
    <text x="456" y="102">1</text>
  </g>

  <!-- 第 2 行：枢纽 i -->
  <g filter="url(#rough2)" font-size="10" fill="#8a6a20">
    <text x="22" y="157">① i 从右找首个 d[i] &lt; d[i+1]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="190" y="132" width="52" height="40" fill="#f7fafd" stroke="#a8bdd0" stroke-width="1.2" rx="6"/>
    <rect x="250" y="132" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6"/>
    <rect x="310" y="132" width="52" height="40" fill="#f7fafd" stroke="#a8bdd0" stroke-width="1.2" rx="6"/>
    <rect x="370" y="132" width="52" height="40" fill="#f7fafd" stroke="#a8bdd0" stroke-width="1.2" rx="6"/>
    <rect x="430" y="132" width="52" height="40" fill="#f7fafd" stroke="#a8bdd0" stroke-width="1.2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="18" text-anchor="middle" fill="#333">
    <text x="216" y="158">1</text>
    <text x="276" y="158">2</text>
    <text x="336" y="158">4</text>
    <text x="396" y="158">3</text>
    <text x="456" y="158">1</text>
  </g>
  <text x="494" y="158" font-size="10" fill="#8a6a20" filter="url(#rough2)">i = 1（2 &lt; 4）</text>

  <!-- 第 3 行：交换点 j -->
  <g filter="url(#rough2)" font-size="10" fill="#3a5a30">
    <text x="22" y="213">② j 从右找首个 d[j] &gt; d[i]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="190" y="188" width="52" height="40" fill="#f7fafd" stroke="#a8bdd0" stroke-width="1.2" rx="6"/>
    <rect x="250" y="188" width="52" height="40" fill="#f7fafd" stroke="#a8bdd0" stroke-width="1.2" rx="6"/>
    <rect x="310" y="188" width="52" height="40" fill="#f7fafd" stroke="#a8bdd0" stroke-width="1.2" rx="6"/>
    <rect x="370" y="188" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6"/>
    <rect x="430" y="188" width="52" height="40" fill="#f7fafd" stroke="#a8bdd0" stroke-width="1.2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="18" text-anchor="middle" fill="#333">
    <text x="216" y="214">1</text>
    <text x="276" y="214">2</text>
    <text x="336" y="214">4</text>
    <text x="396" y="214">3</text>
    <text x="456" y="214">1</text>
  </g>
  <text x="494" y="214" font-size="10" fill="#3a5a30" filter="url(#rough2)">j = 3（最右的 &gt; 2 者）</text>

  <!-- 第 4 行：交换 -->
  <g filter="url(#rough2)" font-size="10" fill="#8a3a36">
    <text x="22" y="269">③ 交换 d[1] ⇄ d[3]</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="190" y="244" width="52" height="40" fill="#f7fafd" stroke="#a8bdd0" stroke-width="1.2" rx="6"/>
    <rect x="250" y="244" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6"/>
    <rect x="310" y="244" width="52" height="40" fill="#f7fafd" stroke="#a8bdd0" stroke-width="1.2" rx="6"/>
    <rect x="370" y="244" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6"/>
    <rect x="430" y="244" width="52" height="40" fill="#f7fafd" stroke="#a8bdd0" stroke-width="1.2" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="18" text-anchor="middle" fill="#333">
    <text x="216" y="270">1</text>
    <text x="276" y="270">3</text>
    <text x="336" y="270">4</text>
    <text x="396" y="270">2</text>
    <text x="456" y="270">1</text>
  </g>
  <text x="494" y="270" font-size="10" fill="#8a3a36" filter="url(#rough2)">高位只升「最小一格」</text>

  <!-- 第 5 行：反转后缀 -->
  <g filter="url(#rough2)" font-size="10" fill="#3a5a30">
    <text x="22" y="325">④ 反转 d[2..4]：4,2,1 → 1,2,4</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="190" y="300" width="52" height="40" fill="#f7fafd" stroke="#a8bdd0" stroke-width="1.2" rx="6"/>
    <rect x="250" y="300" width="52" height="40" fill="#f7fafd" stroke="#a8bdd0" stroke-width="1.2" rx="6"/>
    <rect x="310" y="300" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <rect x="370" y="300" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <rect x="430" y="300" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="18" text-anchor="middle" fill="#333">
    <text x="216" y="326">1</text>
    <text x="276" y="326">3</text>
    <text x="336" y="326">1</text>
    <text x="396" y="326">2</text>
    <text x="456" y="326">4</text>
  </g>
  <text x="494" y="326" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">= 13124</text>

  <!-- 流程箭头 -->
  <g filter="url(#rough2)" stroke="#666" stroke-width="1.3" fill="none">
    <path d="M 336 118 L 336 130" marker-end="url(#arr)"/>
    <path d="M 336 174 L 336 186" marker-end="url(#arr)"/>
    <path d="M 336 230 L 336 242" marker-end="url(#arr)"/>
    <path d="M 336 286 L 336 298" marker-end="url(#arr)"/>
  </g>

  <!-- 边界提示 -->
  <rect x="22" y="352" width="596" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="38" y="370" font-size="10" fill="#8a3a36">边界：n = 1999999999 的「下一个排列」是 9199999999，已超出 2³¹−1 ⇒ 同样要返回 −1</text>
  <text x="38" y="386" font-size="10" fill="#555">所以算出下一个排列之后还得再判一次 32 位范围，不能直接返回（v 用 64 位承接）。</text>
</svg>
