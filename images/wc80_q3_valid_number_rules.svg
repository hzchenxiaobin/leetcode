<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">一段数字串的合法形态：只有两条规则</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">原表示「没有多余零」⇒ 前导零不许、小数末位零不许</text>

  <rect x="26" y="66" width="250" height="152" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="151" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">规则 A：不插小数点</text>
  <text x="151" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">合法 ⟺ L = 1 或 首位 ≠ '0'</text>
  <text x="44" y="134" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">✓ "0"  "7"  "123"  "405"</text>
  <text x="44" y="156" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ "00"  "012"  "001"</text>
  <text x="44" y="182" font-size="10" fill="#777" filter="url(#rough2)">长度 1 时首位就是 '0' 也合法</text>
  <text x="44" y="200" font-size="10" fill="#777" filter="url(#rough2)">（数字 0 本身必须有写法）</text>

  <rect x="288" y="66" width="246" height="152" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="411" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">规则 B：第 k 位后插小数点</text>
  <text x="411" y="110" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">合法 ⟺ (k = 1 或 首位 ≠ '0') 且 末位 ≠ '0'</text>
  <text x="304" y="134" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">✓ "0.1"  "1.23"  "0.011"  "10.5"</text>
  <text x="304" y="156" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ "1.0"  "00.1"  "0.10"  ".1"</text>
  <text x="304" y="182" font-size="10" fill="#777" filter="url(#rough2)">k 是「点前有几位」：1 ≤ k ≤ L−1</text>
  <text x="304" y="200" font-size="10" fill="#777" filter="url(#rough2)">k=1 时点前就是那一位，可为 '0'</text>

  <text x="280" y="248" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">每条禁令对应一种「等价但更短」的写法：</text>

  <rect x="36" y="262" width="488" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="284" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">前导零："012" 就是 "12"，多写的那一位是多余的 ⇒ 整数部不许以 '0' 开头</text>
  <text x="54" y="306" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">尾随零："1.0" 就是 "1"，小数末位 0 同样多余 ⇒ 小数部末位不许为 '0'</text>
  <text x="54" y="328" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">空整数部：".1" 少写了点前的 0 ⇒ 点前至少一位，即 k ≥ 1</text>

  <rect x="36" y="362" width="488" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="54" y="387" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">例：段 "012" 只有一种形态 "0.12"（整数形式被首位零否掉，k=2 的 "01.2" 也被否掉）</text>
</svg>
