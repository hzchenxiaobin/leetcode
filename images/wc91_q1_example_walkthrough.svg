<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="340" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="30" font-size="16" fill="#333" filter="url(#rough2)">示例演算：bills = [5, 5, 5, 10, 20] 逐位走查</text>

  <rect x="20" y="48" width="600" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="50" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">顾客</text>
  <text x="130" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">付款</text>
  <text x="300" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">找零动作</text>
  <text x="440" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">five</text>
  <text x="510" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ten</text>
  <text x="580" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">结果</text>

  <rect x="20" y="86" width="600" height="30" rx="5" fill="#ffffff" stroke="#c8d0da" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <text x="130" y="106" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="300" y="106" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">手头没有任何零钱</text>
  <text x="440" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="510" y="106" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="580" y="106" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">正常</text>

  <rect x="20" y="120" width="600" height="30" rx="5" fill="#f7f9fc" stroke="#c8d0da" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="130" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="300" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">收下，不找零</text>
  <text x="440" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="510" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="580" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">正常</text>

  <rect x="20" y="154" width="600" height="30" rx="5" fill="#ffffff" stroke="#c8d0da" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="300" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">收下，不找零</text>
  <text x="440" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="510" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="580" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">正常</text>

  <rect x="20" y="188" width="600" height="30" rx="5" fill="#f7f9fc" stroke="#c8d0da" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="130" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="300" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">收下，不找零</text>
  <text x="440" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="510" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="580" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">正常</text>

  <rect x="20" y="222" width="600" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="130" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="300" y="242" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">找 5：five −= 1，ten += 1</text>
  <text x="440" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="510" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="580" y="242" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">正常</text>

  <rect x="20" y="256" width="600" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="50" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="130" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">20</text>
  <text x="300" y="276" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">优先 10 + 5：ten −= 1，five −= 1</text>
  <text x="440" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="510" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="580" y="276" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">正常</text>

  <text x="24" y="316" font-size="13" fill="#333" filter="url(#rough2)">全部顾客都完成交易 ⇒ 返回 true；若第 5 位顾客前只剩两张 10 元，就无解。</text>
</svg>
