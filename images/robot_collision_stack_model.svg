<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="580" height="360" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：只有「左 R 右 L」会相撞</text>
  <path d="M 150 38 Q 290 46 430 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="8" y="52" width="132" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="42" cy="84" r="13" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="106" cy="84" r="13" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="42" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">R</text>
  <text x="106" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">L</text>
  <text x="74" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">✖</text>
  <path d="M 56 110 L 70 110" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arRed)" filter="url(#sk)"/>
  <path d="M 92 110 L 78 110" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arRed)" filter="url(#sk)"/>
  <text x="74" y="130" text-anchor="middle" font-size="10.5" fill="#b85450">左R · 右L：相向必撞</text>

  <g filter="url(#sk)">
    <rect x="152" y="52" width="132" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="186" cy="84" r="13" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="250" cy="84" r="13" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="186" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">L</text>
  <text x="250" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">R</text>
  <line x1="202" y1="84" x2="234" y2="84" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="3 3" filter="url(#sk)"/>
  <path d="M 172 110 L 156 110" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arGreen)" filter="url(#sk)"/>
  <path d="M 264 110 L 280 110" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arGreen)" filter="url(#sk)"/>
  <text x="218" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a">左L · 右R：相离不撞</text>

  <g filter="url(#sk)">
    <rect x="296" y="52" width="132" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="330" cy="84" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <circle cx="394" cy="84" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="330" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">R</text>
  <text x="394" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">R</text>
  <path d="M 346 110 L 362 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arBlue)" filter="url(#sk)"/>
  <path d="M 410 110 L 426 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arBlue)" filter="url(#sk)"/>
  <text x="362" y="130" text-anchor="middle" font-size="10.5" fill="#446688">双 R：同向同速不撞</text>

  <g filter="url(#sk)">
    <rect x="440" y="52" width="132" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="474" cy="84" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <circle cx="538" cy="84" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="474" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">L</text>
  <text x="538" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">L</text>
  <path d="M 490 110 L 476 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arBlue)" filter="url(#sk)"/>
  <path d="M 554 110 L 540 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arBlue)" filter="url(#sk)"/>
  <text x="506" y="130" text-anchor="middle" font-size="10.5" fill="#446688">双 L：同向同速不撞</text>

  <g filter="url(#sk)">
    <rect x="70" y="158" width="120" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="70" y="196" width="120" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="70" y="234" width="120" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="130" y="179" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">Y：R</text>
  <text x="130" y="217" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">X：R</text>
  <text x="130" y="255" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">Z：L（幸存）</text>
  <text x="130" y="290" text-anchor="middle" font-size="10.5" fill="#666666">栈（底 → 顶位置递增）</text>

  <path d="M 428 175 L 196 175" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arRed)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="445" cy="175" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="445" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">a</text>
  <path d="M 445 200 L 425 200" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arRed)" filter="url(#sk)"/>
  <text x="445" y="216" text-anchor="middle" font-size="10.5" fill="#b85450">a 向左（L）</text>

  <text x="310" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">a 的第一对手：位置最大的存活 R（栈顶 Y）</text>
  <text x="310" y="214" text-anchor="middle" font-size="11" fill="#555555">Y 被击毁弹出后，才轮到 X ——「只与栈顶碰撞」即 while 循环</text>
  <text x="310" y="234" text-anchor="middle" font-size="11" fill="#555555">a 与栈底的 Z 同向同速永不相遇，</text>
  <text x="310" y="252" text-anchor="middle" font-size="11" fill="#555555">while 遇到非 R 栈顶（幸存 L）立即停</text>
  <text x="310" y="274" text-anchor="middle" font-size="11" fill="#8a6415">胜者每赢一场扣 1 血，可能连战多场后被反杀</text>

  <g filter="url(#sk)">
    <rect x="20" y="298" width="540" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="290" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">处理完每个机器人后，栈从底到顶恒为 L…L R…R 形态</text>
  <text x="290" y="336" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">栈内任何两机器人都不构成「小 R 大 L」，此后永不再碰撞 ∎</text>
</svg>
