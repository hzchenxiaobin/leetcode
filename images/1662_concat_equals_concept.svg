<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：拼接结果逐字符比较，与分块方式无关</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="170" y="72" text-anchor="middle" font-size="13" fill="#555" font-family="monospace" filter="url(#sk)">word1 = ["ab", "c"]</text>
  <g filter="url(#sk)">
    <rect x="110" y="82" width="66" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="182" y="82" width="48" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="143" y="104" text-anchor="middle" font-size="14" fill="#2b4a66" font-weight="bold" filter="url(#sk)">ab</text>
  <text x="206" y="104" text-anchor="middle" font-size="14" fill="#2b4a66" font-weight="bold" filter="url(#sk)">c</text>

  <text x="466" y="72" text-anchor="middle" font-size="13" fill="#555" font-family="monospace" filter="url(#sk)">word2 = ["a", "bc"]</text>
  <g filter="url(#sk)">
    <rect x="404" y="82" width="48" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="458" y="82" width="66" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="428" y="104" text-anchor="middle" font-size="14" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">a</text>
  <text x="491" y="104" text-anchor="middle" font-size="14" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">bc</text>

  <g filter="url(#sk)">
    <path d="M 170 120 C 170 130 170 134 170 142" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 466 120 C 466 130 466 134 466 142" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="205" y="136" font-size="11" fill="#888" filter="url(#sk)">按顺序拼接</text>
  <text x="501" y="136" font-size="11" fill="#888" filter="url(#sk)">按顺序拼接</text>

  <g filter="url(#sk)">
    <rect x="109" y="148" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="151" y="148" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="193" y="148" width="38" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="15" fill="#2b4a66" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="128" y="173">a</text>
    <text x="170" y="173">b</text>
    <text x="212" y="173">c</text>
  </g>
  <text x="85" y="172" text-anchor="end" font-size="13" fill="#446688" font-weight="bold" filter="url(#sk)">S1</text>

  <g filter="url(#sk)">
    <rect x="405" y="148" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="447" y="148" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="489" y="148" width="38" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g font-size="15" fill="#3a5a3a" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="424" y="173">a</text>
    <text x="466" y="173">b</text>
    <text x="508" y="173">c</text>
  </g>
  <text x="381" y="172" text-anchor="end" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">S2</text>

  <text x="320" y="170" text-anchor="middle" font-size="24" fill="#b07818" font-weight="bold" filter="url(#sk)">≡</text>
  <text x="320" y="198" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">长度相同</text>
  <text x="320" y="216" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">逐字符相等</text>

  <g filter="url(#sk)">
    <path d="M 170 192 C 190 232 230 248 260 254" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 466 192 C 446 232 406 248 380 254" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="185" y="258" width="270" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="320" y="286" text-anchor="middle" font-size="15" fill="#3a5a3a" font-weight="bold" filter="url(#sk)">S1 == S2 → 返回 true ✓</text>

  <g filter="url(#sk)">
    <rect x="45" y="322" width="550" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="346" text-anchor="middle" font-size="12" fill="#b07818" filter="url(#sk)">比较只按顺序读每个字符一次 → 无需真正拼出 S1、S2，</text>
  <text x="320" y="366" text-anchor="middle" font-size="12" fill="#b07818" filter="url(#sk)">用 (i,j)、(x,y) 双指针在原数组上流式比较，额外空间 O(1)</text>
</svg>
