<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">一次扫描：把「找一对」变成「查两个搭档」</text>
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#888">N = 2M  等价于  2x ∈ S（x 当 M）  或  x/2 ∈ S（x 当 N）</text>

  <text x="40" y="108" font-size="12" fill="#444" filter="url(#rough2)">arr =</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="78" y="84" width="58" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="107" y="109" fill="#5a4a20">10</text>
    <rect x="150" y="84" width="58" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="179" y="109" fill="#3a4a66">2</text>
    <rect x="222" y="84" width="58" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="251" y="109" fill="#3a5a30">5</text>
    <rect x="294" y="84" width="58" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="323" y="109" fill="#8a3a36">3</text>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#999" text-anchor="middle">
    <text x="107" y="136">i=0</text>
    <text x="179" y="136">i=1</text>
    <text x="251" y="136">i=2</text>
    <text x="323" y="136">i=3</text>
  </g>

  <path d="M 366 103 L 424 103" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="92" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">从左到右</text>

  <g filter="url(#rough2)" font-size="11">
    <rect x="40" y="160" width="232" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="56" y="182" fill="#2f4a6a" font-weight="bold">条件① 2x ∈ S</text>
    <text x="56" y="202" fill="#3a4a66" font-size="10">x 当 M，之前出现过 N = 2x</text>
    <text x="56" y="220" fill="#3a4a66" font-size="10">例 [14,7]：扫到 7 时 14 已在集合 ✓</text>

    <rect x="288" y="160" width="232" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="304" y="182" fill="#31592a" font-weight="bold">条件② x 为偶数 且 x/2 ∈ S</text>
    <text x="304" y="202" fill="#3a5a30" font-size="10">x 当 N，之前出现过 M = x/2</text>
    <text x="304" y="220" fill="#3a5a30" font-size="10">例 [7,14]：扫到 14 时 7 已在集合 ✓</text>
  </g>
  <text x="280" y="204" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">或</text>

  <rect x="40" y="262" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="58" y="284" font-size="11" fill="#8a6a20" font-weight="bold">为什么两个方向都要查？</text>
  <text x="58" y="304" font-size="10" fill="#555">数组顺序任意：N 与 M 谁先被扫到都毫无规律（负数时 2M 甚至更小）。</text>
  <text x="58" y="322" font-size="10" fill="#555">只查 2x 会在「N 先出现」时漏判，只查 x/2 会在「M 先出现」时漏判。</text>
  <text x="58" y="340" font-size="10" fill="#555">特例 0：2×0 = 0 恒成立，必须有两个 0 —— 边查边插的一次扫描天然处理。</text>
</svg>
