<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 356" width="620" height="356" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="356" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：quality = [10,20,5]、wage = [70,50,30]、k = 2</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">按 w/q 升序：1 号(2.5) → 2 号(6.0) → 0 号(7.0)</text>
  <rect x="26" y="90" width="66" height="36" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="59" y="111.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">工人</text>
  <rect x="92" y="90" width="96" height="36" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="111.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">w/q</text>
  <rect x="188" y="90" width="96" height="36" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="236" y="111.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">quality</text>
  <rect x="284" y="90" width="122" height="36" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="345" y="111.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">堆与 sumQ</text>
  <rect x="406" y="90" width="118" height="36" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="111.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">本轮成本</text>
  <rect x="524" y="90" width="74" height="36" fill="#efefef" stroke="#8a8a8a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="561" y="111.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">当前最优</text>
  <rect x="26" y="126" width="66" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="59" y="147.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1 号</text>
  <rect x="92" y="126" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="147.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2.5</text>
  <rect x="188" y="126" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="236" y="147.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">20</text>
  <rect x="284" y="126" width="122" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="345" y="147.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">{20} = 20</text>
  <rect x="406" y="126" width="118" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="147.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">不足 2 人</text>
  <rect x="524" y="126" width="74" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="561" y="147.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">—</text>
  <rect x="26" y="162" width="66" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="59" y="183.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">2 号</text>
  <rect x="92" y="162" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="183.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">6.0</text>
  <rect x="188" y="162" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="236" y="183.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="284" y="162" width="122" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="345" y="183.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">{20, 5} = 25</text>
  <rect x="406" y="162" width="118" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="183.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">25 × 6.0</text>
  <rect x="524" y="162" width="74" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="561" y="183.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">150</text>
  <rect x="26" y="198" width="66" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="59" y="219.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">0 号</text>
  <rect x="92" y="198" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="219.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">7.0</text>
  <rect x="188" y="198" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="236" y="219.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">10</text>
  <rect x="284" y="198" width="122" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="345" y="219.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">弹掉 20 后 {10, 5} = 15</text>
  <rect x="406" y="198" width="118" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="219.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">15 × 7.0</text>
  <rect x="524" y="198" width="74" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="561" y="219.8" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">105</text>
  <rect x="26" y="240" width="568" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="36" y="258" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">· 第 2 行 k 已满，成本 25 × 6 = 150；</text>
  <text x="36" y="272.9" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">· 第 3 行 0 号单价更高，但 quality 只 10，加入后必须踢掉 quality 最大的 20 号 → 总和降到 15，</text>
  <text x="36" y="287.8" text-anchor="start" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">  15 × 7 = 105 &lt; 150，最优解被刷新；最终答案 105.00000。</text>
</svg>
