<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：旧窗口有效 ⇒ 新冲突必含新元素 x，只有两种形态</text>

  <!-- 形态 A -->
  <text x="24" y="64" font-size="13" fill="#446688" filter="url(#rough2)">形态 A：x 作「和」（k = r）</text>
  <rect x="60" y="80" width="76" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="98" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a = 2</text>
  <text x="152" y="106" font-size="15" fill="#333" filter="url(#rough2)">+</text>
  <rect x="170" y="80" width="76" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b = 3</text>
  <text x="262" y="106" font-size="15" fill="#333" filter="url(#rough2)">=</text>
  <rect x="280" y="80" width="76" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="318" y="105" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x = 5</text>
  <text x="372" y="98" font-size="11" fill="#d6a040" filter="url(#rough2)">x 是新加入的元素（位置 r）</text>
  <text x="372" y="114" font-size="11" fill="#446688" filter="url(#rough2)">a、b 都取自旧窗口 [l, r−1]</text>
  <text x="60" y="142" font-size="11" fill="#666" filter="url(#rough2)">加数须占两个互异位置：a ≠ b 查 cnt[a] &gt; 0 且 cnt[b] &gt; 0；a = b 需 cnt[a] ≥ 2</text>
  <text x="60" y="160" font-size="11" fill="#b85450" filter="url(#rough2)">例：窗口 [2, 3] 右端进入 5 ⇒ 2 + 3 = 5，冲突 ✗</text>

  <!-- 形态 B -->
  <text x="24" y="196" font-size="13" fill="#4a7a3a" filter="url(#rough2)">形态 B：x 作「加数」（i = r）</text>
  <rect x="60" y="212" width="76" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="98" y="237" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x = 2</text>
  <text x="152" y="238" font-size="15" fill="#333" filter="url(#rough2)">+</text>
  <rect x="170" y="212" width="76" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="237" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a = 3</text>
  <text x="262" y="238" font-size="15" fill="#333" filter="url(#rough2)">=</text>
  <rect x="280" y="212" width="76" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="237" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v = 5</text>
  <text x="372" y="230" font-size="11" fill="#4a7a3a" filter="url(#rough2)">x 与旧窗口的 a 相加，</text>
  <text x="372" y="246" font-size="11" fill="#4a7a3a" filter="url(#rough2)">恰好等于旧窗口中的 v</text>
  <text x="60" y="274" font-size="11" fill="#666" filter="url(#rough2)">v = a + x &gt; a ⇒ 两值不同 ⇒ 位置自动互异，只需 cnt[a] &gt; 0 且 cnt[a + x] &gt; 0</text>
  <text x="60" y="292" font-size="11" fill="#b85450" filter="url(#rough2)">例：窗口 [3, 5] 右端进入 2 ⇒ 3 + 2 = 5，冲突 ✗</text>

  <!-- 值域桶 -->
  <rect x="24" y="312" width="512" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">值域 1 ≤ nums[i] ≤ 500 ⇒ 用数组桶 cnt[1..500] 维护窗口内每个值的出现次数</text>
  <rect x="68" y="348" width="48" height="34" rx="4" fill="#f5f8fd" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="361" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">cnt[1]</text>
  <text x="92" y="376" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="122" y="348" width="48" height="34" rx="4" fill="#f5f8fd" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="146" y="361" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">cnt[2]</text>
  <text x="146" y="376" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="176" y="348" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="361" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">cnt[3]</text>
  <text x="200" y="376" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="230" y="348" width="48" height="34" rx="4" fill="#f5f8fd" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="254" y="361" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">cnt[4]</text>
  <text x="254" y="376" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="290" y="370" font-size="13" fill="#888" filter="url(#rough2)">⋯</text>
  <rect x="304" y="348" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="328" y="361" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">cnt[5]</text>
  <text x="328" y="376" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="366" y="364" font-size="10.5" fill="#446688" filter="url(#rough2)">（示意窗口 [3, 5, 3]）</text>
  <text x="366" y="380" font-size="10.5" fill="#446688" filter="url(#rough2)">值出现即点亮对应桶</text>
  <text x="280" y="400" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">两类检查各扫一遍值域 O(V)，配合双指针总体 O(n·V)</text>
</svg>
