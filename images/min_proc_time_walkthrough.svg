<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：双向排序，逐块取首元素</text>
  <path d="M 180 38 Q 320 48 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left steps -->
  <g filter="url(#sk)">
    <rect x="45" y="56" width="280" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="45" y="116" width="280" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="45" y="176" width="280" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="45" y="236" width="280" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="13" font-family="monospace">
    <text x="185" y="83" fill="#2b6e9e">① processorTime 升序 → [8, 10]</text>
    <text x="185" y="143" fill="#2b6e9e">② tasks 降序 → [8,7,5,4 ∣ 3,2,2,1]</text>
    <text x="185" y="203" fill="#2e6e2e">③ 8 + tasks[0] = 16；10 + tasks[4] = 13</text>
    <text x="185" y="263" fill="#7a5415" font-weight="bold">④ ans = max(16, 13) = 16 ✓</text>
  </g>
  <g stroke="#3a3a3a" stroke-width="1.5" fill="none">
    <path d="M 185 102 L 185 112" marker-end="url(#ar)"/>
    <path d="M 185 162 L 185 172" marker-end="url(#ar)"/>
    <path d="M 185 222 L 185 232" marker-end="url(#ar)"/>
  </g>

  <!-- right table -->
  <text x="485" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">三组样例验证</text>
  <g filter="url(#sk)">
    <rect x="350" y="82" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="410" y="82" width="115" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="525" y="82" width="95" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="350" y="108" width="60" height="36" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="410" y="108" width="115" height="36" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="525" y="108" width="95" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="350" y="144" width="60" height="36" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="410" y="144" width="115" height="36" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="525" y="144" width="95" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="350" y="180" width="60" height="36" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="410" y="180" width="115" height="36" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="525" y="180" width="95" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="380" y="99" fill="#2b6e9e" font-weight="bold">示例</text>
    <text x="467" y="99" fill="#2b6e9e" font-weight="bold">processorTime</text>
    <text x="572" y="99" fill="#2b6e9e" font-weight="bold">贪心答案</text>
    <text x="380" y="130">①</text>
    <text x="467" y="130">[8, 10]</text>
    <text x="572" y="130" fill="#2e6e2e" font-weight="bold">16 ✓</text>
    <text x="380" y="166">②</text>
    <text x="467" y="166">[10, 20]</text>
    <text x="572" y="166" fill="#2e6e2e" font-weight="bold">23 ✓</text>
    <text x="380" y="202">③</text>
    <text x="467" y="202">[0, 100]</text>
    <text x="572" y="202" fill="#2e6e2e" font-weight="bold">102 ✓</text>
  </g>

  <!-- warning box: same-direction pairing -->
  <g filter="url(#sk)">
    <rect x="350" y="232" width="270" height="112" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="485" y="254" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36">⚠ 同向配对（小配小）是经典 WA</text>
  <g font-size="11.5" fill="#8a3a36">
    <text x="362" y="276">p = [0,100]，任务降序 [50,2,2,2,2,1,1,1]</text>
    <text x="362" y="298">逆序配对：max(0+50, 100+2) = 102 ✓</text>
    <text x="362" y="320" font-weight="bold">同向配对：max(0+2, 100+50) = 150 ✗</text>
  </g>
</svg>
