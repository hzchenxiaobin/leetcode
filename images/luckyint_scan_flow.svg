<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：建桶一趟，倒序找首个 cnt[v] = v</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="11.5" fill="#888">「取最大」不靠比较，靠枚举顺序——从大到小第一个命中的就是答案</text>

  <!-- 建桶 -->
  <g filter="url(#sk)"><rect x="190" y="72" width="260" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="320" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">一趟建桶：遍历 arr，cnt[v] += 1</text>
  <path d="M 320 110 L 320 130" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- 初始化 v -->
  <g filter="url(#sk)"><rect x="230" y="134" width="180" height="34" rx="8" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.3"/></g>
  <text x="320" y="156" text-anchor="middle" font-size="12" fill="#6a7a90">v ← 500（值域上界）</text>
  <path d="M 320 168 L 320 190" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- 判定菱形 -->
  <g filter="url(#sk)"><polygon points="320,198 413,240 320,282 227,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a4a20">cnt[v] == v ？</text>

  <!-- 是：命中返回 -->
  <path d="M 413 240 L 458 240" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="436" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)"><rect x="462" y="216" width="164" height="48" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="544" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">return v</text>
  <text x="544" y="256" text-anchor="middle" font-size="10.5" fill="#2e6e2e">首个命中即最大幸运数</text>

  <!-- 否：继续 -->
  <path d="M 320 282 L 320 312" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="330" y="302" font-size="11.5" fill="#888">否</text>

  <!-- 还有更小的 v 吗 -->
  <g filter="url(#sk)"><polygon points="320,316 398,352 320,388 242,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="357" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a4a20">v &gt; 1 ？</text>

  <!-- 是：回边 -->
  <path d="M 242 352 L 150 352 L 150 240 L 223 240" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="222" y="344" text-anchor="end" font-size="11.5" fill="#888">是</text>
  <text x="142" y="300" text-anchor="end" font-size="11" fill="#888">v −= 1</text>

  <!-- 否：落空返回 -->
  <path d="M 320 388 L 320 414" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="330" y="406" font-size="11.5" fill="#888">否（扫到 1 仍未命中）</text>
  <g filter="url(#sk)"><rect x="205" y="418" width="230" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="320" y="443" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">return −1（不存在幸运数）</text>

  <text x="320" y="482" text-anchor="middle" font-size="11" fill="#999">两趟各 O(n) 与 O(500)：建桶看不重不漏，倒序看先到先得</text>
</svg>
