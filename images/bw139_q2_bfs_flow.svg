<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">0-1 BFS：边权只有 0 和 1，双端队列就够了</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">进入 (nx, ny) 的边权 = grid[nx][ny] ∈ {0, 1}</text>

  <rect x="150" y="62" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#3a4a66">dist[0][0] = grid[0][0]，(0,0) 入队首</text>

  <path d="M 280 96 L 280 116" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="116" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="11" fill="#8a6a20">弹出队首 (x, y)，取 d = dist[x][y]</text>

  <path d="M 280 150 L 280 166" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="166" width="320" height="34" fill="#fff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="188" text-anchor="middle" font-size="11" fill="#3a4a66">枚举四个邻居，nd = d + grid[nx][ny]</text>

  <path d="M 280 200 L 280 216" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,216 400,236 280,256 160,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="10.5" fill="#8a6a20">nd &lt; dist[nx][ny] ?</text>
  <text x="280" y="250" text-anchor="middle" font-size="9.5" fill="#999">（还能改进才松弛）</text>

  <path d="M 380 236 L 420 236 L 420 288" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="228" font-size="9.5" fill="#4a7a3a">是</text>
  <path d="M 120 236 L 80 236 L 80 288" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="228" font-size="9.5" fill="#b85450">否，跳过</text>

  <rect x="330" y="288" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425" y="308" text-anchor="middle" font-size="10" fill="#3a5a30">grid = 0 → 队首入队；= 1 → 队尾</text>

  <rect x="40" y="288" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="140" y="308" text-anchor="middle" font-size="10" fill="#8a3a36">dist 不变，队列继续</text>

  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#555">队列空 → 返回 dist[m−1][n−1] ≤ health − 1</text>
</svg>
