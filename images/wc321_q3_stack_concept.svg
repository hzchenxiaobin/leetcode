<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="860" height="470" fill="#fafafa"/>
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：栈里只留「右侧没见过更大值」的节点，栈底到顶非严格递减</text>
  <path d="M 200 40 Q 430 48 660 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 列头说明 -->
  <text x="88" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">读入</text>
  <text x="250" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">栈（左＝栈底，右＝栈顶）</text>
  <text x="560" y="66" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">本步动作</text>

  <!-- 行 1：读入 5 -->
  <rect x="66" y="76" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="88" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">5</text>
  <path d="M 118 94 L 146 94" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="160" y="76" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="182" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">5</text>
  <text x="330" y="98" font-size="12.5" fill="#333" filter="url(#rough2)">栈空，直接入栈</text>

  <!-- 行 2：读入 2 -->
  <rect x="66" y="138" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="88" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">2</text>
  <path d="M 118 156 L 146 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="160" y="138" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="212" y="138" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="182" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">5</text>
  <text x="234" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">2</text>
  <text x="330" y="160" font-size="12.5" fill="#333" filter="url(#rough2)">2 &lt; 5，不弹出，入栈（相等也入栈）</text>

  <!-- 行 3：读入 13，弹 2、5 -->
  <rect x="66" y="200" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="88" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#a07830" filter="url(#rough2)">13</text>
  <path d="M 118 218 L 146 218" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="160" y="200" width="44" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <rect x="212" y="200" width="44" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <rect x="264" y="200" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="182" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e3030" filter="url(#rough2)">5 ✗</text>
  <text x="234" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e3030" filter="url(#rough2)">2 ✗</text>
  <text x="286" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">13</text>
  <path d="M 332 214 Q 372 200 372 214" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="386" y="222" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">13 更大：弹 2，再弹 5 —— 13 在它们右侧，必删</text>

  <!-- 行 4：读入 3 -->
  <rect x="66" y="262" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="88" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">3</text>
  <path d="M 118 280 L 146 280" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="160" y="262" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="212" y="262" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="182" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">13</text>
  <text x="234" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">3</text>
  <text x="330" y="284" font-size="12.5" fill="#333" filter="url(#rough2)">3 &lt; 13，入栈</text>

  <!-- 行 5：读入 8，弹 3 -->
  <rect x="66" y="324" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="88" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#a07830" filter="url(#rough2)">8</text>
  <path d="M 118 342 L 146 342" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="160" y="324" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="212" y="324" width="44" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <rect x="264" y="324" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="182" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">13</text>
  <text x="234" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e3030" filter="url(#rough2)">3 ✗</text>
  <text x="286" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">8</text>
  <path d="M 332 338 Q 372 324 372 338" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="386" y="346" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">8 &gt; 3：弹 3（8 在 3 右侧）</text>

  <!-- 结论框 -->
  <rect x="50" y="384" width="760" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">遍历结束，栈内剩 [13, 8]：自底到顶串成链表即答案 [13, 8]</text>
  <text x="430" y="432" text-anchor="middle" font-size="12" fill="#2e5e28" filter="url(#rough2)">每个节点至多入栈一次、出栈一次 ⇒ O(n)；相等不弹（严格小于才弹）⇒ [1,1,1,1] 全保留</text>
</svg>
