<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：入栈 → 顶部比对 → 按需弹出</text>

  <g filter="url(#rough2)">
    <ellipse cx="280" cy="62" rx="46" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="67" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 280 80 L 280 94" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,100 380,134 280,168 180,134" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">还有字符 c 未读？</text>
  <text x="212" y="98" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">没有</text>
  <text x="386" y="98" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">有</text>

  <g filter="url(#rough2)">
    <rect x="196" y="182" width="168" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="280" y="205" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">c 压入栈顶</text>
  <path d="M 322 162 L 296 178" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,232 362,262 280,292 198,262" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="280" y="258" text-anchor="middle" font-size="11.5" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">|栈| ≥ m 且顶 m 位</text>
  <text x="280" y="272" text-anchor="middle" font-size="11.5" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">== part ？</text>
  <path d="M 280 218 L 280 228" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 命中：弹出 -->
  <g filter="url(#rough2)">
    <rect x="60" y="244" width="110" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <text x="115" y="268" text-anchor="middle" font-size="12" fill="#a0392f" font-weight="bold" filter="url(#rough2)">弹出 m 个字符</text>
  <path d="M 198 262 L 174 263" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="186" y="252" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">相等</text>

  <!-- 不等：继续 -->
  <g filter="url(#rough2)">
    <rect x="410" y="244" width="130" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
  </g>
  <text x="475" y="268" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">什么都不做</text>
  <path d="M 362 262 L 406 263" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="376" y="252" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">不等</text>

  <!-- 循环回去 -->
  <path d="M 115 282 C 60 320 120 96 214 122" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 475 282 C 528 322 470 96 350 118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="64" y="340" font-size="10.5" fill="#888" filter="url(#rough2)">弹出后不会级联：剩余是旧栈前缀，必无 part</text>

  <!-- 结束 -->
  <g filter="url(#rough2)">
    <rect x="120" y="346" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="180" y="371" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">输出栈内容</text>
  <path d="M 214 140 C 150 168 172 330 190 344" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 复杂度标注 -->
  <g filter="url(#rough2)">
    <rect x="290" y="346" width="236" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8"/>
  </g>
  <text x="408" y="364" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">每字符入栈 1 次、至多弹出 1 次，</text>
  <text x="408" y="380" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">每次入栈比较 O(m) → 总 O(n·m)</text>
</svg>
