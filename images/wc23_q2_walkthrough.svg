<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="500" fill="#fafafa"/>
  <text x="26" y="30" font-size="15" fill="#333" filter="url(#rough2)">示例演算：timePoints = ["00:10", "23:50", "12:00"]</text>

  <!-- 表头 -->
  <rect x="46" y="54" width="668" height="42" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="80" text-anchor="middle" font-size="12" fill="#2c3e50" filter="url(#rough2)">i</text>
  <text x="186" y="80" text-anchor="middle" font-size="12" fill="#2c3e50" filter="url(#rough2)">排序后时刻</text>
  <text x="322" y="80" text-anchor="middle" font-size="12" fill="#2c3e50" filter="url(#rough2)">分钟值</text>
  <text x="486" y="80" text-anchor="middle" font-size="12" fill="#2c3e50" filter="url(#rough2)">与前一个的差</text>
  <text x="648" y="80" text-anchor="middle" font-size="12" fill="#2c3e50" filter="url(#rough2)">ans</text>

  <!-- 第 0 行 -->
  <rect x="46" y="96" width="668" height="44" rx="6" fill="#ffffff" stroke="#bbb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="186" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">00:10</text>
  <text x="322" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="486" y="124" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—（无前驱）</text>
  <text x="648" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">20（先取回绕）</text>

  <!-- 第 1 行 -->
  <rect x="46" y="140" width="668" height="44" rx="6" fill="#ffffff" stroke="#bbb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="186" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12:00</text>
  <text x="322" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">720</text>
  <text x="486" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">720 − 10 = 710</text>
  <text x="648" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">min(20, 710) = 20</text>

  <!-- 第 2 行 -->
  <rect x="46" y="184" width="668" height="44" rx="6" fill="#ffffff" stroke="#bbb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="186" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">23:50</text>
  <text x="322" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1430</text>
  <text x="486" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1430 − 720 = 710</text>
  <text x="648" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">min(20, 710) = 20</text>

  <text x="60" y="256" font-size="12" fill="#7a5c1e" filter="url(#rough2)">回绕差 = t[0] + 1440 − t[n−1] = 10 + 1440 − 1430 = 20</text>

  <!-- 三个候选差 -->
  <rect x="56" y="278" width="190" height="66" rx="8" fill="#f2f2f2" stroke="#999"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="151" y="304" text-anchor="middle" font-size="14" fill="#444" filter="url(#rough2)">710 分钟</text>
  <text x="151" y="326" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">00:10 → 12:00</text>

  <rect x="266" y="278" width="190" height="66" rx="8" fill="#f2f2f2" stroke="#999"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="361" y="304" text-anchor="middle" font-size="14" fill="#444" filter="url(#rough2)">710 分钟</text>
  <text x="361" y="326" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">12:00 → 23:50</text>

  <rect x="476" y="278" width="212" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="2.4" filter="url(#rough2)"/>
  <text x="582" y="304" text-anchor="middle" font-size="14" fill="#2f4f2f" filter="url(#rough2)">20 分钟（最小）</text>
  <text x="582" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">23:50 → 次日 00:10</text>

  <text x="380" y="382" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">min(710, 710, 20) = 20，只保留首尾回绕这一条</text>

  <rect x="275" y="404" width="210" height="56" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2.2" filter="url(#rough2)"/>
  <text x="380" y="439" text-anchor="middle" font-size="15" fill="#7a5c1e" filter="url(#rough2)">答案 = 20 分钟</text>
</svg>
