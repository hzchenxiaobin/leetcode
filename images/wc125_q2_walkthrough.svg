<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 3：(行,列) = (3,3) 的车，只吃三条射线上的第一个兵</text>
  <text x="280" y="42" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">上 (2,3)、左 (3,1)、右 (3,5) 都能吃；下被 (5,3) 的象挡住，答案 3</text>

  
    <path filter="url(#rough2)" d="M 40 60 L 280 60 M 40 90 L 280 90 M 40 120 L 280 120 M 40 150 L 280 150 M 40 180 L 280 180 M 40 210 L 280 210 M 40 240 L 280 240 M 40 270 L 280 270 M 40 300 L 280 300" stroke="#cfd8dc" stroke-width="1.1" fill="none"/>
    <path filter="url(#rough2)" d="M 40 60 L 40 300 M 70 60 L 70 300 M 100 60 L 100 300 M 130 60 L 130 300 M 160 60 L 160 300 M 190 60 L 190 300 M 220 60 L 220 300 M 250 60 L 250 300 M 280 60 L 280 300" stroke="#cfd8dc" stroke-width="1.1" fill="none"/>
  

  <text x="145" y="110" font-size="12" fill="#90a4ae" text-anchor="middle" filter="url(#rough2)">p</text>
  <text x="145" y="140" font-size="13" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">p</text>
  <text x="55" y="170" font-size="12" fill="#90a4ae" text-anchor="middle" filter="url(#rough2)">p</text>
  <text x="85" y="170" font-size="13" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">p</text>
  <text x="145" y="170" font-size="15" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">R</text>
  <text x="205" y="170" font-size="13" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">p</text>
  <text x="235" y="170" font-size="12" fill="#b85450" text-anchor="middle" filter="url(#rough2)">B</text>
  <text x="145" y="230" font-size="13" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="145" y="260" font-size="12" fill="#90a4ae" text-anchor="middle" filter="url(#rough2)">p</text>

  <path d="M 145 153 L 145 146" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 128 165 L 98 165" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 162 165 L 192 165" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 145 182 L 145 220" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="40" y="316" font-size="10" fill="#90a4ae" text-anchor="start" filter="url(#rough2)">列 0</text>
  <text x="280" y="316" font-size="10" fill="#90a4ae" text-anchor="end" filter="url(#rough2)">列 7</text>

  <rect x="300" y="60" width="236" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="80" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">吃到的三个兵</text>
  <text x="312" y="100" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">上：(2,3)　左：(3,1)</text>
  <text x="312" y="118" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">右：(3,5)</text>
  <text x="312" y="138" font-size="10.5" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">都是该方向上的第一个棋子</text>
  <text x="312" y="158" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">(1,3) 与 (6,3) 的兵更远，不在</text>
  <text x="312" y="170" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">第一条命中范围内。</text>

  <rect x="300" y="182" width="236" height="112" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="202" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">被挡住的方向</text>
  <text x="312" y="222" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">下：先遇到 (5,3) 的象</text>
  <text x="312" y="240" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">象不可吃，路径终止</text>
  <text x="312" y="260" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">(6,3) 的兵因此永远吃不到</text>
  <text x="312" y="280" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">右方向 (3,6) 的象在兵之后，</text>
  <text x="312" y="292" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">不影响吃 (3,5)。</text>

  <text x="30" y="340" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">遇到 'p' 计数加一并 break；遇到 'B' 直接 break；'.' 继续前进。</text>
  <text x="30" y="360" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">漏掉 break 会把被挡住的兵也数进去 —— 这是本题最常见的错误。</text>
</svg>
