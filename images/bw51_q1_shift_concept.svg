<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">shift(c, x)：在字母表上把 c 向后挪 x 格</text>

  <!-- 字母条带 a..h + 省略 + x,y,z -->
  <g filter="url(#rough2)">
    <rect x="44" y="84" width="36" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="84" y="84" width="36" height="42" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="124" y="84" width="36" height="42" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="164" y="84" width="36" height="42" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="204" y="84" width="36" height="42" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="244" y="84" width="36" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="284" y="84" width="36" height="42" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="324" y="84" width="36" height="42" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="392" y="84" width="36" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="432" y="84" width="36" height="42" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="472" y="84" width="36" height="42" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="62" y="110">a</text><text x="102" y="110">b</text><text x="142" y="110">c</text>
    <text x="182" y="110">d</text><text x="222" y="110">e</text><text x="262" y="110">f</text>
    <text x="302" y="110">g</text><text x="342" y="110">h</text><text x="410" y="110">x</text>
    <text x="450" y="110">y</text><text x="490" y="110">z</text>
  </g>
  <text x="372" y="110" font-size="14" fill="#999" filter="url(#rough2)">……</text>

  <!-- a 到 f 的跳跃弧线 -->
  <path d="M 62 80 C 100 30, 218 26, 254 74" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="40" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">shift('a', 5) = 'f'：往后走 5 格</text>

  <text x="280" y="152" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">条带只画出 a–h 与 x–z（中间省略）；shift('x', 0) = 'x' 表示步数为 0、原地不动</text>

  <!-- 两个说明框 -->
  <rect x="40" y="180" width="480" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="58" y="206" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">数字字符还原成步数：x = s[i] − '0'，取值 0～9</text>
  <text x="58" y="228" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">奇数下标 s[i] 是数字，减去 '0'（字符码 48）就是整数步数。</text>

  <rect x="40" y="262" width="480" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="58" y="288" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">字符码直接相加：c + x，无需查字母表</text>
  <text x="58" y="310" font-size="11.5" fill="#2f5226" filter="url(#rough2)">'a' 的字符码是 97，97 + 5 = 102 恰为 'f'；题目保证结果不超过 'z'，不用回绕。</text>
</svg>
