<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="430" fill="#fdfcf7"/>
  <text x="280" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：两种终止合并进 while 条件</text>
  <path d="M 130 38 Q 280 45 430 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 起点 -->
  <g filter="url(#sk)">
    <rect x="175" y="52" width="210" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="280" y="74" text-anchor="middle" font-size="12.5" fill="#2b2b2b">i = 0，score = 0，visited 全 false</text>
  <path d="M 280 88 L 280 102" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判断 1：可执行？ -->
  <g filter="url(#sk)">
    <path d="M 280 104 L 390 146 L 280 188 L 170 146 Z" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="280" y="141" text-anchor="middle" font-size="12" fill="#2b2b2b">0 ≤ i &lt; n 且</text>
  <text x="280" y="157" text-anchor="middle" font-size="12" fill="#2b2b2b">!visited[i] ？</text>
  <text x="400" y="128" font-size="12" font-weight="bold" fill="#b85450">否</text>
  <path d="M 390 146 L 424 146" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="428" y="126" width="112" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="484" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 score</text>
  <text x="292" y="200" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 280 188 L 280 202" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 标记 -->
  <g filter="url(#sk)">
    <rect x="175" y="206" width="210" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="280" y="227" text-anchor="middle" font-size="12.5" fill="#2b2b2b">visited[i] = true（先标记）</text>
  <path d="M 280 240 L 280 252" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判断 2：指令类型 -->
  <g filter="url(#sk)">
    <path d="M 280 256 L 392 298 L 280 340 L 168 298 Z" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="280" y="293" text-anchor="middle" font-size="12" fill="#2b2b2b">instructions[i]</text>
  <text x="280" y="309" text-anchor="middle" font-size="12" fill="#2b2b2b">== "add" ？</text>

  <!-- add 分支 -->
  <text x="150" y="286" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">add</text>
  <path d="M 168 298 L 140 298" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="20" y="276" width="118" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="79" y="294" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2e6e2e">score += values[i]</text>
  <text x="79" y="310" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2e6e2e">i += 1</text>

  <!-- jump 分支 -->
  <text x="408" y="286" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a8edb">jump</text>
  <path d="M 392 298 L 416 298" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="420" y="276" width="124" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="482" y="294" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#2b6e2b">i += values[i]</text>
  <text x="482" y="310" text-anchor="middle" font-size="10.5" fill="#4a8edb">（可正可负）</text>

  <!-- 回环 -->
  <path d="M 79 276 L 79 258 L 40 258" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 482 276 L 482 258 L 40 258" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 40 258 L 40 146 L 164 146" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="58" y="205" font-size="10.5" fill="#888">下一轮</text>

  <!-- 底部注记 -->
  <g filter="url(#sk)">
    <rect x="30" y="356" width="500" height="58" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="280" y="379" text-anchor="middle" font-size="12" fill="#7a5415">循环体只做「标记 → 执行」；jump + 0 自环在下一轮被 visited 拦下</text>
  <text x="280" y="399" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">先标记再执行 + 条件短路 = 零特判代码</text>
</svg>
