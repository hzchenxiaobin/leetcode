<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">O(1) 判定：只看首尾两个检查点</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 读入 -->
  <rect x="250" y="56" width="140" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="77" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">读入 n, rounds</text>

  <path d="M 320 90 L 320 102" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 取首尾 -->
  <rect x="200" y="106" width="240" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="128" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">s = rounds[0]，e = rounds.back()</text>

  <path d="M 320 142 L 320 154" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="320,158 395,212 320,266 245,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">s ≤ e ?</text>

  <!-- 是分支 -->
  <path d="M 243 212 L 224 212" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="234" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="20" y="180" width="196" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="118" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">答案 = [s, s+1, …, e]</text>
  <text x="118" y="230" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">例：s=1, e=2 → [1, 2]</text>

  <!-- 否分支 -->
  <path d="M 397 212 L 416 212" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="406" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">否</text>

  <rect x="424" y="180" width="196" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="522" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415" filter="url(#rough2)">答案 = [1, …, e] ∪ [s, …, n]</text>
  <text x="522" y="230" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#rough2)">例：s=3, e=1, n=4 → [1, 3, 4]</text>

  <!-- 汇合 -->
  <path d="M 118 244 Q 118 300 226 310" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 522 244 Q 522 300 414 310" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="226" y="294" width="188" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">升序构造并返回</text>

  <!-- 注意事项 -->
  <rect x="24" y="352" width="292" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="170" y="375" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">s = e：恰好整数圈，答案 [s]（「是」分支覆盖）</text>

  <rect x="324" y="352" width="292" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="470" y="375" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">中间检查点 rounds[1..m−1] 全程不参与</text>
</svg>
