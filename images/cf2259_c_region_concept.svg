<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：用「固定 1」把数组切成若干段</text>
  <path d="M 118 43 Q 390 50 662 43" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="390" y="66" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">固定 1 变不成 0，只能出现在子数组两端；固定 0 落在中间完全没关系</text>

  <!-- 位置编号 -->
  <text x="186" y="94" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">1</text>
  <text x="254" y="94" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">2</text>
  <text x="322" y="94" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">3</text>
  <text x="390" y="94" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">4</text>
  <text x="458" y="94" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">5</text>
  <text x="526" y="94" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">6</text>
  <text x="594" y="94" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">7</text>

  <!-- 数组 a -->
  <rect x="155" y="100" width="62" height="54" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="186" y="135" text-anchor="middle" font-size="18" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="223" y="100" width="62" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="254" y="135" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="291" y="100" width="62" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="322" y="134" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">−1</text>
  <rect x="359" y="100" width="62" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="135" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="427" y="100" width="62" height="54" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="458" y="135" text-anchor="middle" font-size="18" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="495" y="100" width="62" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="526" y="135" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="563" y="100" width="62" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="594" y="134" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">−1</text>

  <!-- 被选中的两个端点 -->
  <rect x="158" y="103" width="56" height="48" rx="5" fill="none" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="430" y="103" width="56" height="48" rx="5" fill="none" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>

  <text x="390" y="176" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">红 = 固定 1（墙，只能当端点）　橙 = −1（可填 0 或 1）　蓝 = 固定 0（冻结的 0）</text>

  <!-- 两个区间 -->
  <rect x="150" y="192" width="346" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="323" y="212" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">区间① [1,5]：最左非 0 = 1，最右非 0 = 5 ⇒ 跨度 5 ✓</text>

  <rect x="418" y="230" width="222" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="529" y="250" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">区间② [5,7]：跨度 7−5+1 = 3</text>

  <!-- 结论 -->
  <rect x="95" y="278" width="590" height="64" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="390" y="303" text-anchor="middle" font-size="13.5" fill="#8a6015" filter="url(#rough2)">先把所有 −1 填成 0，再把选中区间的两个端点置成 1</text>
  <text x="390" y="326" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">得到 1 0 0 0 1 0 0 ，分数 = 5 − 1 + 1 = 5</text>

  <text x="390" y="366" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">为什么固定 1 只能当端点：它变不成 0，落在内部就破坏了「中间全为 0」</text>
  <text x="390" y="390" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">为什么取最左 / 最右：跨度越长分数越高；段内只有 −1 与固定 0，都能填 0</text>
  <text x="390" y="414" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">单元素也合法：只有一个 1 时中间没有元素，分数为 1</text>
</svg>
