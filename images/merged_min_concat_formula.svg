<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">合并 = 十进制拼接：把 b 接在 a 之后</text>
  <path d="M 130 40 Q 320 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Box A: a -->
  <g filter="url(#sk)">
    <rect x="50" y="56" width="250" height="100" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="175" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">a = 34</text>
  <g filter="url(#sk)">
    <rect x="145" y="90" width="26" height="24" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="179" y="90" width="26" height="24" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
  </g>
  <text x="158" y="107" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">3</text>
  <text x="192" y="107" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">4</text>
  <text x="175" y="140" text-anchor="middle" font-size="12" fill="#2b6e9e">a 的数位（先拼）</text>

  <!-- Box B: b -->
  <g filter="url(#sk)">
    <rect x="340" y="56" width="250" height="100" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="465" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">b = 7</text>
  <g filter="url(#sk)">
    <rect x="452" y="90" width="26" height="24" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.2"/>
  </g>
  <text x="465" y="107" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">7</text>
  <text x="465" y="140" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">d(b) = 1 位（后拼）</text>

  <!-- arrows down -->
  <path d="M 175 160 Q 240 176 292 194" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 465 160 Q 400 176 348 194" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- concatenation strip -->
  <text x="320" y="196" text-anchor="middle" font-size="12" fill="#555555">a 整体左移 d(b) 位，b 补在低位</text>
  <g filter="url(#sk)">
    <rect x="140" y="204" width="360" height="70" rx="10" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.2"/>
    <rect x="196" y="218" width="30" height="34" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="234" y="218" width="30" height="34" rx="4" fill="#4a8edb" stroke="#33669c" stroke-width="1.2"/>
    <rect x="272" y="218" width="30" height="34" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.2"/>
  </g>
  <text x="211" y="240" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">3</text>
  <text x="249" y="240" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">4</text>
  <text x="287" y="240" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">7</text>
  <text x="345" y="240" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">= 347</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="90" y="290" width="460" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">合并(a, b) = a × 10^d(b) + b，d(b) = b 的十进制位数</text>
  <text x="320" y="334" text-anchor="middle" font-size="12" fill="#8a6415">34 × 10¹ + 7 = 347　　23 × 10² + 55 = 2355</text>

  <!-- warning -->
  <g filter="url(#sk)">
    <rect x="40" y="356" width="560" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="320" y="378" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⚠ 顺序不可交换：34⊕7 = 347，但 7⊕34 = 734（谁先谁后，题目说了算）</text>
</svg>
