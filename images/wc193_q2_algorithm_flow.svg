<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：计数 → 排序 → 逐族消费 k</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">唯一需要的数据结构是「值 → 频次」的哈希表，之后只是对频次数组排序</text>

  <rect x="200" y="66" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="88" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">输入 arr 与 k（可为 0）</text>
  <path d="M 310 100 L 310 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="124" width="280" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">哈希表：对每个 x 执行 freq[x] += 1</text>
  <path d="M 310 160 L 310 182" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="184" width="280" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">counts = freq 的所有频次，升序排序</text>
  <path d="M 310 220 L 310 240" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="310,242 434,286 310,330 186,286" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="282" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">还有 c 且 c ≤ k ？</text>
  <text x="310" y="302" text-anchor="middle" font-size="9" fill="#a08040" filter="url(#rough2)">ans 初值 = 不同整数个数</text>

  <path d="M 434 286 L 452 286" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="456" y="258" width="146" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="529" y="282" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">否：买不起</text>
  <text x="529" y="300" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">break 跳出循环</text>

  <path d="M 529 314 L 529 348" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="452" y="350" width="154" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="529" y="372" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">返回 ans</text>
  <text x="529" y="390" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">剩余不同整数个数</text>

  <path d="M 310 330 L 310 356" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="132" y="358" width="250" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="257" y="380" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">是：k = k − c</text>
  <text x="257" y="399" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">ans = ans − 1（整族灭掉）</text>

  <path d="M 132 386 L 108 386 L 108 286 L 182 286" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="86" y="340" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">下一族</text>

  <text x="310" y="428" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">循环不变量：进入判定时，k 是「已付清前面若干薄族后」的剩余名额，ans 是尚未被灭掉的整数个数</text>
</svg>
