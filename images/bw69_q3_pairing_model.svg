<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">回文镜像约束：左放 "ab" ⇒ 右必须放 "ba"</text>

  <!-- 左：互异词配对 -->
  <text x="150" y="66" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">互异词对："lc" × "cl"</text>
  <!-- 回文串展示 -->
  <g filter="url(#rough2)">
    <rect x="48" y="86" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="90" y="86" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="190" y="86" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="232" y="86" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="274" y="86" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="68" y="107">l</text>
    <text x="110" y="107">c</text>
    <text x="210" y="107">·</text>
    <text x="252" y="107">c</text>
    <text x="294" y="107">l</text>
  </g>
  <!-- 镜像弧 -->
  <g filter="url(#rough2)" fill="none" stroke="#b85450" stroke-width="2">
    <path d="M 68 84 C 68 62, 294 62, 294 84"/>
    <path d="M 110 84 C 110 70, 252 70, 252 84"/>
  </g>
  <text x="181" y="60" font-size="11.5" fill="#b85450" filter="url(#rough2)" text-anchor="middle">整体镜像</text>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="150" y="142">cnt("lc") = 3, cnt("cl") = 2</text>
    <text x="150" y="162">⇒ 配成 min(3, 2) = 2 对，贡献 2 × 4 = 8</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="48" y="180" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="188" y="200" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">多出的 1 个 "lc" 找不到镜像搭档</text>
  <text x="188" y="217" font-size="12" fill="#666" text-anchor="middle" filter="url(#rough2)">（它自身不是回文，不能落单使用）</text>

  <!-- 右：同词自配 -->
  <text x="430" y="66" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">回文词对："gg" × "gg"</text>
  <g filter="url(#rough2)">
    <rect x="330" y="86" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="372" y="86" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="470" y="86" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="512" y="86" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="350" y="107">g</text>
    <text x="392" y="107">g</text>
    <text x="490" y="107">·</text>
    <text x="532" y="107">g</text>
  </g>
  <g filter="url(#rough2)" fill="none" stroke="#4a7a3a" stroke-width="2">
    <path d="M 392 84 C 420 62, 484 62, 512 84"/>
  </g>
  <text x="452" y="60" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">一个 "gg" 拆成左右两翼</text>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="430" y="142">cnt("gg") = 5</text>
    <text x="430" y="162">⇒ 5 / 2 = 2 对（4 个词），贡献 2 × 4 = 8</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="340" y="180" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <text x="460" y="200" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">剩下的 1 个 "gg" 不浪费</text>
  <text x="460" y="217" font-size="12" fill="#666" text-anchor="middle" filter="url(#rough2)">（可放到正中间，见右下图）</text>

  <!-- 底部总结 -->
  <g filter="url(#rough2)">
    <rect x="48" y="252" width="470" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
  </g>
  <text x="283" y="278" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">按 26 × 26 计数矩阵统计，答案分三块累加</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="283" y="304">① i &lt; j：ans += min(cnt[i][j], cnt[j][i]) × 4（互异对只算一次）</text>
    <text x="283" y="326">② i = i（aa 类）：ans += cnt[i][i] / 2 × 4（两两对称放置）</text>
    <text x="283" y="348">③ 若存在 cnt[i][i] 为奇数：ans += 2（中心还能塞一个）</text>
  </g>
</svg>
