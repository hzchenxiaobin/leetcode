<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两种 token：一位数字码 与 三位字符码</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">只有 10#–26# 带 '#' ⇒ '#' 是「双位码到此结束」的唯一信号</text>

  <rect x="40" y="64" width="230" height="106" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="86" font-size="11" fill="#3a4a66" font-weight="bold">一位码：1–9 → a–i</text>

  <g font-size="12" text-anchor="middle">
    <rect x="60" y="98" width="54" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="87" y="118" fill="#333" filter="url(#rough2)">1</text>
    <rect x="128" y="98" width="54" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="155" y="118" fill="#333" filter="url(#rough2)">5</text>
    <rect x="196" y="98" width="54" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="223" y="118" fill="#333" filter="url(#rough2)">9</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#3a4a66">
    <text x="87" y="152" filter="url(#rough2)">a</text>
    <text x="155" y="152" filter="url(#rough2)">e</text>
    <text x="223" y="152" filter="url(#rough2)">i</text>
  </g>
  <path d="M 87 132 L 87 142" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 155 132 L 155 142" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 223 132 L 223 142" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="64" width="220" height="106" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="316" y="86" font-size="11" fill="#8a6a20" font-weight="bold">三位码：10#–26# → j–z</text>

  <g font-size="12" text-anchor="middle">
    <rect x="316" y="98" width="58" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="345" y="118" fill="#333" filter="url(#rough2)">10#</text>
    <rect x="384" y="98" width="58" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="413" y="118" fill="#333" filter="url(#rough2)">18#</text>
    <rect x="452" y="98" width="58" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="481" y="118" fill="#333" filter="url(#rough2)">26#</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#8a6a20">
    <text x="345" y="152" filter="url(#rough2)">j</text>
    <text x="413" y="152" filter="url(#rough2)">r</text>
    <text x="481" y="152" filter="url(#rough2)">z</text>
  </g>
  <path d="M 345 132 L 345 142" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 413 132 L 413 142" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 481 132 L 481 142" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="196" text-anchor="middle" font-size="12" fill="#555">token 长度只能是 1 或 3，且 '#' 固定落在长度 3 的 token 末尾</text>

  <g font-size="9" text-anchor="middle" fill="#999">
    <text x="176" y="214" filter="url(#rough2)">s =</text>
  </g>

  <g font-size="14" text-anchor="middle">
    <rect x="200" y="222" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="220" y="245" fill="#333" filter="url(#rough2)">1</text>
    <rect x="240" y="222" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="260" y="245" fill="#333" filter="url(#rough2)">0</text>
    <rect x="280" y="222" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="300" y="245" fill="#333" filter="url(#rough2)">#</text>
    <rect x="320" y="222" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="340" y="245" fill="#333" filter="url(#rough2)">1</text>
    <rect x="360" y="222" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="380" y="245" fill="#333" filter="url(#rough2)">1</text>
    <rect x="400" y="222" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="420" y="245" fill="#333" filter="url(#rough2)">#</text>
    <rect x="440" y="222" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="460" y="245" fill="#333" filter="url(#rough2)">1</text>
    <rect x="480" y="222" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="500" y="245" fill="#333" filter="url(#rough2)">2</text>
  </g>

  <g font-size="12" text-anchor="middle" fill="#555">
    <rect x="200" y="266" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <text x="260" y="285" fill="#3a4a66" filter="url(#rough2)">10# → j</text>
    <rect x="320" y="266" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <text x="380" y="285" fill="#3a5a30" filter="url(#rough2)">11# → k</text>
    <rect x="440" y="266" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <text x="460" y="285" fill="#8a6a20" filter="url(#rough2)">a</text>
    <rect x="480" y="266" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <text x="500" y="285" fill="#8a3a36" filter="url(#rough2)">b</text>
  </g>

  <text x="280" y="322" text-anchor="middle" font-size="10.5" fill="#666">关键：token 之间不会重叠，'#' 的位置一旦确定，切分方式就唯一（题面保证可解）</text>
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#666">于是从右往左扫，每步只需看「当前字符是不是 '#'」</text>
</svg>
