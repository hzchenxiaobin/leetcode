<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察二：枚举字符种数 m，窗长锁定 m·k</text>
  <path d="M 140 36 Q 320 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="40" y="52" width="560" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="320" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10">d 种字符 × 每种恰 k 次 ⟹ 子串长 = d·k，合法长度只有 26 档</text>
  <text x="320" y="94" text-anchor="middle" font-size="12" fill="#444">枚举 m = 1..26 → 窗长 L = m·k 唯一确定，变长问题变定长</text>

  <text x="52" y="140" font-size="13" font-weight="bold" fill="#2b6e9e">k = 2，m = 2，L = 4：窗口 [0,3] = "igig"</text>
  <g filter="url(#sk)"><rect x="46" y="148" width="174" height="48" rx="6" fill="none" stroke="#4a8edb" stroke-width="2.4"/></g>
  <g filter="url(#sk)"><rect x="52" y="154" width="36" height="36" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.3"/></g>
  <text x="70" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">i</text>
  <g filter="url(#sk)"><rect x="94" y="154" width="36" height="36" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.3"/></g>
  <text x="112" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">g</text>
  <g filter="url(#sk)"><rect x="136" y="154" width="36" height="36" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.3"/></g>
  <text x="154" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">i</text>
  <g filter="url(#sk)"><rect x="178" y="154" width="36" height="36" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.3"/></g>
  <text x="196" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">g</text>
  <g filter="url(#sk)"><rect x="220" y="154" width="36" height="36" rx="4" fill="#f0efea" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="238" y="178" text-anchor="middle" font-size="15" fill="#999">e</text>
  <g filter="url(#sk)"><rect x="262" y="154" width="36" height="36" rx="4" fill="#f0efea" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="280" y="178" text-anchor="middle" font-size="15" fill="#999">e</text>
  <path d="M 228 160 Q 260 148 292 152" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="300" y="146" width="104" height="24" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="352" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">cnt[i] = 2 ✓</text>
  <g filter="url(#sk)"><rect x="300" y="174" width="104" height="24" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="352" y="191" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">cnt[g] = 2 ✓</text>
  <g filter="url(#sk)"><rect x="300" y="202" width="104" height="24" rx="4" fill="#f0efea" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="352" y="219" text-anchor="middle" font-size="12" fill="#999">cnt[e] = 0</text>
  <g filter="url(#sk)"><rect x="432" y="146" width="160" height="80" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="512" y="174" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">exactly = 2</text>
  <text x="512" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">= m ✓ 计数！</text>

  <text x="52" y="264" font-size="13" font-weight="bold" fill="#2b6e9e">窗口右滑一步：[1,4] = "gige"</text>
  <g filter="url(#sk)"><rect x="88" y="272" width="216" height="48" rx="6" fill="none" stroke="#4a8edb" stroke-width="2.4"/></g>
  <g filter="url(#sk)"><rect x="52" y="278" width="36" height="36" rx="4" fill="#f0efea" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="70" y="302" text-anchor="middle" font-size="15" fill="#999">i</text>
  <g filter="url(#sk)"><rect x="94" y="278" width="36" height="36" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.3"/></g>
  <text x="112" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">g</text>
  <g filter="url(#sk)"><rect x="136" y="278" width="36" height="36" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.3"/></g>
  <text x="154" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">i</text>
  <g filter="url(#sk)"><rect x="178" y="278" width="36" height="36" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.3"/></g>
  <text x="196" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">g</text>
  <g filter="url(#sk)"><rect x="220" y="278" width="36" height="36" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.3"/></g>
  <text x="238" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">e</text>
  <g filter="url(#sk)"><rect x="262" y="278" width="36" height="36" rx="4" fill="#f0efea" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="280" y="302" text-anchor="middle" font-size="15" fill="#999">e</text>
  <path d="M 240 284 Q 268 272 292 276" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="300" y="270" width="104" height="24" rx="4" fill="#f0efea" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="352" y="287" text-anchor="middle" font-size="12" fill="#999">cnt[i] = 1</text>
  <g filter="url(#sk)"><rect x="300" y="298" width="104" height="24" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="352" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">cnt[g] = 2 ✓</text>
  <g filter="url(#sk)"><rect x="300" y="326" width="104" height="24" rx="4" fill="#f0efea" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="352" y="343" text-anchor="middle" font-size="12" fill="#999">cnt[e] = 1</text>
  <g filter="url(#sk)"><rect x="432" y="284" width="160" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="512" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">exactly = 1</text>
  <text x="512" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">≠ m ✗ 不计</text>

  <g filter="url(#sk)"><rect x="40" y="372" width="560" height="92" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">O(1) 增量更新 —— 右端进 c / 左端出 d，各更新一次：</text>
  <text x="320" y="414" text-anchor="middle" font-size="12" fill="#444">进：cnt[c]++，新值 = k → exactly++；旧值 = k（新值 k+1）→ exactly−−</text>
  <text x="320" y="432" text-anchor="middle" font-size="12" fill="#444">出：cnt[d]−−，新值 = k → exactly++；旧值 = k（新值 k−1）→ exactly−−</text>
  <text x="320" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">判定：exactly == m ⟺ 完全（m 种 × 各 k 次 = m·k 恰装满窗口，挤不进别的字符）</text>
</svg>
