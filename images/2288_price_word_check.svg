<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="880" height="460" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：什么样的单词才算「价格」？</text>
  <path d="M 240 44 Q 440 52 640 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 绿区：是价格 -->
  <rect x="40" y="64" width="800" height="118" rx="12" fill="#f0f9f1" stroke="#4a8e4a" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="440" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">✓ 是价格 —— 「$」打头，后面跟一串数字</text>

  <rect x="70" y="104" width="170" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="155" y="130" text-anchor="middle" font-size="15" fill="#333">$100</text>
  <rect x="255" y="104" width="170" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="340" y="130" text-anchor="middle" font-size="15" fill="#333">$23</text>
  <rect x="440" y="104" width="170" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="525" y="130" text-anchor="middle" font-size="15" fill="#333">$6</text>
  <rect x="625" y="104" width="185" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="717" y="130" text-anchor="middle" font-size="15" fill="#333">$9999999999</text>

  <text x="440" y="168" text-anchor="middle" font-size="11.5" fill="#888">数字至少 1 位、最多 10 位；约束保证价格是不含前导零的正整数</text>

  <!-- 红区：不是价格 -->
  <rect x="40" y="198" width="800" height="138" rx="12" fill="#fdf0f0" stroke="#b85450" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="440" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c3a36">✗ 不是价格 —— 原样保留，不打折</text>

  <rect x="64" y="240" width="135" height="40" rx="6" fill="#faf0f0" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="131" y="266" text-anchor="middle" font-size="15" fill="#333">100</text>
  <rect x="215" y="240" width="135" height="40" rx="6" fill="#faf0f0" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="282" y="266" text-anchor="middle" font-size="15" fill="#333">$</text>
  <rect x="366" y="240" width="135" height="40" rx="6" fill="#faf0f0" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="433" y="266" text-anchor="middle" font-size="15" fill="#333">$1e5</text>
  <rect x="517" y="240" width="135" height="40" rx="6" fill="#faf0f0" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="584" y="266" text-anchor="middle" font-size="15" fill="#333">5$</text>
  <rect x="668" y="240" width="135" height="40" rx="6" fill="#faf0f0" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="735" y="266" text-anchor="middle" font-size="15" fill="#333">$$</text>

  <text x="131" y="312" text-anchor="middle" font-size="11" fill="#8c3a36">没有 $ 打头</text>
  <text x="282" y="312" text-anchor="middle" font-size="11" fill="#8c3a36">$ 后没有数字</text>
  <text x="433" y="312" text-anchor="middle" font-size="11" fill="#8c3a36">混有字母 e</text>
  <text x="584" y="312" text-anchor="middle" font-size="11" fill="#8c3a36">$ 不在开头</text>
  <text x="735" y="312" text-anchor="middle" font-size="11" fill="#8c3a36">$ 后还是 $</text>

  <!-- 底部规则 -->
  <rect x="40" y="352" width="800" height="86" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="440" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">判定：w[0] == '$' 且 |w| ≥ 2 且 w[1..] 全为数字 —— 三条缺一不可</text>
  <text x="440" y="406" text-anchor="middle" font-size="12" fill="#333">价格数值最大 9999999999（10 位）：解析必须用 64 位整数，32 位 int 会溢出</text>
  <text x="440" y="428" text-anchor="middle" font-size="12" fill="#333">换算乘积 v = p × (100 − discount) ≤ 10¹²，long long 稳稳装下</text>
</svg>
