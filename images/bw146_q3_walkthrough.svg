<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：在 y = 2 与 y = 4 两处水平切割</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">把每个矩形的 y 投影画成竖条，两条切线正好分出三段</text>

  <rect x="100" y="220" width="40" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="264" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="170" y="140" width="40" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="190" y="184" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="240" y="180" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">3</text>
  <rect x="310" y="100" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="330" y="124" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">4</text>

  <path d="M 84 220 L 384 220" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <path d="M 84 140 L 384 140" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="390" y="224" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">y = 2（切 1）</text>
  <text x="390" y="144" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">y = 4（切 2）</text>

  <text x="486" y="112" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">上段</text>
  <text x="486" y="186" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">中段</text>
  <text x="486" y="268" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">下段</text>

  <path d="M 74 304 L 74 90" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="66" y="308" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="66" y="228" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="66" y="188" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="66" y="148" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="66" y="108" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="82" y="86" font-size="9.5" fill="#666" filter="url(#rough2)">y</text>

  <rect x="52" y="332" width="456" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">同样方法看 x 方向：4 个 x 投影互相交叠，合并后只有 1 段</text>
  <text x="280" y="371" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">所以竖直切割不可行，答案来自水平方向 → true</text>
</svg>
