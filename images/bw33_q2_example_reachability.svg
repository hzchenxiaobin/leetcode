<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    示例 1：入度 0 的 {0, 3} 恰好覆盖全图
  </text>

  <!-- 边 -->
  <g filter="url(#rough2)" stroke="#666" stroke-width="1.8" fill="none">
    <path d="M 130 108 C 168 96, 196 92, 224 90" marker-end="url(#arr)"/>
    <path d="M 132 126 C 170 152, 196 168, 220 180" marker-end="url(#arr)"/>
    <path d="M 254 200 C 286 222, 300 236, 312 254" marker-end="url(#arr)"/>
    <path d="M 132 272 C 170 268, 196 264, 222 262" marker-end="url(#arr)"/>
    <path d="M 256 258 C 276 244, 284 228, 286 208" marker-end="url(#arr)"/>
  </g>

  <!-- 顶点 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="15">
    <ellipse cx="116" cy="100" rx="22" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="2.5"/>
    <text x="116" y="106" fill="#446688">0</text>
    <ellipse cx="248" cy="88" rx="20" ry="18" fill="#f2f2f2" stroke="#999" stroke-width="1.6"/>
    <text x="248" y="94" fill="#666">1</text>
    <ellipse cx="240" cy="192" rx="20" ry="18" fill="#f2f2f2" stroke="#999" stroke-width="1.6"/>
    <text x="240" y="198" fill="#666">2</text>
    <ellipse cx="322" cy="270" rx="20" ry="18" fill="#f2f2f2" stroke="#999" stroke-width="1.6"/>
    <text x="322" y="276" fill="#666">5</text>
    <ellipse cx="116" cy="280" rx="22" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="116" y="286" fill="#8a6a1a">3</text>
    <ellipse cx="238" cy="266" rx="20" ry="18" fill="#f2f2f2" stroke="#999" stroke-width="1.6"/>
    <text x="238" y="272" fill="#666">4</text>
  </g>

  <!-- 覆盖集说明 -->
  <g filter="url(#rough2)">
    <rect x="376" y="66" width="130" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="441" y="88" text-anchor="middle" font-size="13" fill="#446688">从 0 可达</text>
    <text x="441" y="110" text-anchor="middle" font-size="13" fill="#446688">{0,1,2,5}</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="376" y="240" width="130" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="441" y="262" text-anchor="middle" font-size="13" fill="#8a6a1a">从 3 可达</text>
    <text x="441" y="284" text-anchor="middle" font-size="13" fill="#8a6a1a">{3,4,2,5}</text>
  </g>

  <!-- 结论 -->
  <rect x="120" y="312" width="280" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">
    两集合并起来 = 全部 6 个点 → 输出 [0, 3]
  </text>
</svg>
