<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="108"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">示例 2 走查：board = [E12 / 1X1 / 21S] → [4,2]</text>

  <!-- 左：f 表 -->
  <text x="150" y="64" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">f（最大得分）</text>
  <g filter="url(#rough2)">
    <rect x="80" y="76" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="140" y="76" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="200" y="76" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="80" y="124" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="140" y="124" width="56" height="44" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.5"/>
    <rect x="200" y="124" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="80" y="172" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="140" y="172" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="200" y="172" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="108" y="104" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="168" y="104" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="228" y="104" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="108" y="152" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="168" y="152" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">−</text>
  <text x="228" y="152" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="108" y="200" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="168" y="200" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="228" y="200" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="150" y="244" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">「−」= 不可达（X 格或后继全断）</text>

  <!-- 右：g 表 -->
  <text x="430" y="64" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">g（方案数）</text>
  <g filter="url(#rough2)">
    <rect x="360" y="76" width="56" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="420" y="76" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="480" y="76" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="360" y="124" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="420" y="124" width="56" height="44" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.5"/>
    <rect x="480" y="124" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="360" y="172" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="420" y="172" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="480" y="172" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="388" y="104" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="448" y="104" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="508" y="104" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="388" y="152" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="448" y="152" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">0</text>
  <text x="508" y="152" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="388" y="200" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="448" y="200" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="508" y="200" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- 两条最优路径 -->
  <rect x="70" y="266" width="540" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="292" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">f[0][0]=4 的两条路径：S→(1,2)→(0,1)→E 与 S→(1,2)→(1,1)？否——</text>
  <text x="340" y="314" text-anchor="middle" font-size="13.5" fill="#8a6a20" filter="url(#rough2)">实为 S→左上→上→E（1+1+2=4）与 S→左→左上→E（1+2+1=4），g[0][0]=2</text>
  <text x="340" y="334" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（得分数值取自原板面：下排 21S、中排 1X1、上排 E12）</text>
</svg>
