<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">逐位取余：n = q · (-2) + r，其中 0 ≤ r ≤ 1</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">负基数只改变商的走向，不改变带余除法的结构</text>
  <rect x="40.0" y="76.0" width="92.0" height="50.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="86.0" y="97.1" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(-2)^4</text>
  <text x="86.0" y="112.3" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">= 16</text>
  <rect x="144.0" y="76.0" width="92.0" height="50.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="190.0" y="97.1" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(-2)^3</text>
  <text x="190.0" y="112.3" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">= -8</text>
  <rect x="248.0" y="76.0" width="92.0" height="50.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="294.0" y="97.1" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(-2)^2</text>
  <text x="294.0" y="112.3" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">= 4</text>
  <rect x="352.0" y="76.0" width="92.0" height="50.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="398.0" y="97.1" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(-2)^1</text>
  <text x="398.0" y="112.3" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">= -2</text>
  <rect x="456.0" y="76.0" width="92.0" height="50.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="502.0" y="97.1" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(-2)^0</text>
  <text x="502.0" y="112.3" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">= 1</text>
  <text x="280.0" y="146.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">权值正负交替：高位可能贡献负值</text>
  <rect x="40.0" y="176.0" width="120.0" height="54.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100.0" y="207.8" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n</text>
  <path d="M 160.0 194.0 L 240.0 194.0" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="200.0" y="184.0" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">÷ (-2)</text>
  <rect x="240.0" y="176.0" width="120.0" height="54.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300.0" y="207.4" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">q（商）</text>
  <path d="M 100.0 230.0 L 100.0 258.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="110.0" y="248.0" font-size="10" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">余 r</text>
  <rect x="40.0" y="258.0" width="120.0" height="50.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100.0" y="279.1" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">r = n mod 2</text>
  <text x="100.0" y="294.3" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">∈ {0,1}</text>
  <rect x="240.0" y="258.0" width="290.0" height="50.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="385.0" y="286.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n = q·(-2) + r  ⇒  最低位是 r，高位继续对 q 拆分</text>
  <path d="M 180.0 283.0 L 238.0 283.0" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="25.0" y="340.0" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">C++ 里 (-1) % 2 == -1，必须修正 r += 2，否则取不到合法的 0/1 位。</text>
</svg>
