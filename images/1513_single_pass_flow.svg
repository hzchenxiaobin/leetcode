<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">算法流程：单趟扫描（cur = 以当前字符结尾的全 1 后缀长度）</text>

  <!-- start -->
  <g filter="url(#r)">
    <rect x="225" y="54" width="190" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <path d="M 320 90 L 320 104" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="320" y="77" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">初始化 cur = ans = i = 0</text>

  <!-- diamond 1 -->
  <g filter="url(#r)">
    <polygon points="232,144 320,106 408,144 320,182" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818" filter="url(#r)">s[i] == '1' ?</text>

  <!-- yes branch -->
  <g filter="url(#r)">
    <path d="M 226 144 L 174 144" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 163 163 L 163 185" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 163 240 L 163 262 L 246 262" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="78" y="125" width="170" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="78" y="188" width="170" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="196" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">是</text>
  <text x="163" y="149" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">cur ← cur + 1</text>
  <text x="163" y="209" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">ans ← ans + cur</text>
  <text x="163" y="228" text-anchor="middle" font-size="10" fill="#777" filter="url(#r)">以 i 结尾的全 1 子串恰有 cur 个</text>

  <!-- no branch -->
  <g filter="url(#r)">
    <path d="M 414 144 L 470 144" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 544 163 L 544 262 L 394 262" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="474" y="125" width="140" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="442" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">否</text>
  <text x="544" y="149" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4a44" filter="url(#r)">cur ← 0</text>

  <!-- i increment -->
  <g filter="url(#r)">
    <rect x="250" y="244" width="140" height="36" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.6"/>
    <path d="M 320 280 L 320 296" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="320" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#r)">i ← i + 1</text>

  <!-- diamond 2 -->
  <g filter="url(#r)">
    <polygon points="240,330 320,298 400,330 320,362" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818" filter="url(#r)">i &lt; n ?</text>

  <!-- loop back -->
  <g filter="url(#r)">
    <path d="M 234 330 L 62 330 L 62 98 L 308 98" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="128" y="322" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">是 · 处理下一个字符</text>

  <!-- exit -->
  <g filter="url(#r)">
    <path d="M 320 362 L 320 386" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="200" y="390" width="240" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="334" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">否</text>
  <text x="320" y="416" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">返回 ans mod (10⁹ + 7)</text>

  <!-- key note -->
  <g filter="url(#r)">
    <rect x="56" y="452" width="528" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="472" text-anchor="middle" font-size="11.5" fill="#8a4a44" filter="url(#r)">关键增量含义：ans += cur —— 以 i 结尾的全 1 子串恰有 cur 个（起点可在后缀内任取）</text>
  <text x="320" y="492" text-anchor="middle" font-size="11.5" fill="#8a4a44" filter="url(#r)">每个子串按「右端点」唯一归账 → 全程不重不漏</text>

  <!-- equivalence note -->
  <g filter="url(#r)">
    <rect x="56" y="512" width="528" height="36" rx="8" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.3"/>
  </g>
  <text x="320" y="534" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#r)">等价两阶段：先收集所有段长 Lⱼ 再求 Σ Lⱼ(Lⱼ+1)/2 —— 结果与单趟完全一致</text>
</svg>
