<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：rowSum=[3,8]，colSum=[4,7]</text>

  <!-- 步骤 1：初始 -->
  <text x="80" y="70" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">初始剩余量</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="40" y="82" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="40" y="112" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="85" y="101">rs₀ = 3</text>
    <text x="85" y="131">rs₁ = 8</text>
    <rect x="150" y="54" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="244" y="54" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="195" y="72">cs₀ = 4</text>
    <text x="289" y="72">cs₁ = 7</text>
  </g>

  <!-- 步骤 2：四格演算 -->
  <g filter="url(#rough2)" font-size="11.5" fill="#333" text-anchor="middle">
    <!-- (0,0) -->
    <rect x="335" y="56" width="215" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="442" y="78">(0,0)：min(3,4)=3 → rs₀=0, cs₀=1</text>
    <!-- (0,1) -->
    <rect x="335" y="96" width="215" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <text x="442" y="118">(0,1)：min(0,7)=0 → 保持 0,7</text>
    <!-- (1,0) -->
    <rect x="335" y="136" width="215" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="442" y="158">(1,0)：min(8,1)=1 → rs₁=7, cs₀=0</text>
    <!-- (1,1) -->
    <rect x="335" y="176" width="215" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="442" y="198">(1,1)：min(7,7)=7 → 全部归零 ✓</text>
  </g>

  <!-- 结果矩阵 -->
  <text x="120" y="180" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">结果矩阵</text>
  <g filter="url(#rough2)">
    <rect x="60" y="192" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="120" y="192" width="60" height="40" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <rect x="60" y="232" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="120" y="232" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="90" y="217">3</text>
    <text x="150" y="217">0</text>
    <text x="90" y="257">1</text>
    <text x="150" y="257">7</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#4a7a3a" text-anchor="middle">
    <text x="90" y="290">列和 3+1=4 ✓</text>
    <text x="150" y="290">列和 0+7=7 ✓</text>
    <text x="60" y="186" font-size="0.1" fill="#fafafa">.</text>
  </g>
  <text x="118" y="160" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">行和 3+0=3 ✓</text>
  <text x="118" y="312" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">行和 1+7=8 ✓</text>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="60" y="326" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="352" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">[[3,0],[1,7]]：每个格子填完至少清零一侧，扫完即得解</text>
</svg>
