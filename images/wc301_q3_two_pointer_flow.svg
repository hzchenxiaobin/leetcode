<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">双指针判定流程</text>

  <ellipse cx="270" cy="60" rx="62" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">i = 0, j = 0</text>

  <path d="M 270,80 L 270,92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,96 386,128 270,160 154,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">i &lt; n 或 j &lt; n ?</text>
  <text x="270" y="141" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（还有未比对的部分）</text>

  <path d="M 386,128 L 412,128" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="397" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="416" y="110" width="112" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="472" y="133" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">返回 true</text>
  <text x="472" y="160" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（全部配对完成）</text>

  <path d="M 270,160 L 270,184" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="177" font-size="11" fill="#666" filter="url(#rough2)">是</text>

  <rect x="172" y="186" width="196" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="211" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">i、j 跳过连续的 '_'</text>

  <path d="M 270,226 L 270,246" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,250 382,282 270,314 158,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">i 或 j 到末尾 ?</text>
  <text x="270" y="295" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">(i == n || j == n)</text>

  <path d="M 382,282 L 406,282" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="393" y="274" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">是</text>
  <rect x="410" y="264" width="138" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="479" y="287" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">返回 i==n 且 j==n</text>
  <text x="479" y="312" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（片段数不等 ⇒ false）</text>

  <path d="M 270,314 L 270,326" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="324" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <polygon points="270,330 386,362 270,394 154,362" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="358" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">身份相同 ?</text>
  <text x="270" y="375" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">start[i] == target[j]</text>

  <path d="M 386,362 L 412,362" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="397" y="354" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="416" y="344" width="112" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="472" y="367" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">返回 false</text>
  <text x="472" y="392" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（片段 / 顺序不同）</text>

  <path d="M 270,394 L 270,406" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="404" font-size="11" fill="#666" filter="url(#rough2)">是</text>

  <polygon points="270,410 386,442 270,474 154,442" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="438" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">方向位置合法 ?</text>
  <text x="270" y="455" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">L: i ≥ j 且 R: i ≤ j</text>

  <path d="M 386,442 L 412,442" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="397" y="434" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="416" y="424" width="112" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="472" y="447" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">返回 false</text>
  <text x="472" y="472" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（L 要右移 / R 要左移）</text>

  <path d="M 270,474 L 270,486" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="484" font-size="11" fill="#666" filter="url(#rough2)">是</text>

  <rect x="222" y="488" width="96" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="511" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">i++, j++</text>

  <path d="M 222,506 L 40,506 L 40,128 L 150,128" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="498" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">循环（下一对）</text>
</svg>
