  <text x="390" y="354" text-anchor="middle" font-size="13.5" fill="#555" filter="url(#rough2)">切分点 j（把 s 切成前缀 s[1..j] 与后缀 s[j+1..n]）</text>

  <text x="70" y="382" font-size="15.5" fill="#333" filter="url(#rough2)">s = ( ( ) ( ) ) ( ) ) ( ，n = 10，k = 3，故 m = n − k = 7；峰值出现在 j = 9，L = 6</text>
  <text x="70" y="406" font-size="16" fill="#b85450" filter="url(#rough2)">最小代价 = 2 · max(0, m − L) = 2 · (7 − 6) = 2</text>
