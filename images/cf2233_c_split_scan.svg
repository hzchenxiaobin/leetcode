<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto">
      <path d="M0,0 L7,3.4 L0,6.8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="420" fill="#fafafa" filter="url(#rough2)"/>

  <text x="390" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">扫描切分点 j：f(j) = 前缀 ) 数 + 后缀 ( 数，取 L = max f(j)</text>

  <text x="46" y="180" font-size="15" fill="#446688" filter="url(#rough2)">f(j)</text>
  <path d="M70,106 L748,106" stroke="#b85450" stroke-width="1.4" stroke-dasharray="8 6" fill="none" filter="url(#rough2)"/>
  <text x="78" y="100" font-size="14" fill="#b85450" filter="url(#rough2)">L = 6</text>

