<svg xmlns="http://www.w3.org/2000/svg" width="820" height="516" viewBox="0 0 820 516"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
  </defs>

  <rect width="820" height="516" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">走查：s = 100111011 的全部翻转位置</text>
  <path d="M 214 42 Q 410 49 606 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="410" y="62" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">压缩串 c = 10101，k = 5 段，段长依次为 1, 2, 3, 1, 2；可翻转的位置是 p = 2 … 8</text>

  <!-- 表头 -->
  <rect x="24" y="76" width="772" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">位置 p</text>
  <text x="140" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">该位</text>
  <text x="250" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">所在段与段长</text>
  <text x="424" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">翻转后 s′</text>
  <text x="592" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">压缩结果</text>
  <text x="708" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">长度</text>
  <text x="772" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">结论</text>

  <!-- 行 0：不翻转 -->
  <rect x="24" y="120" width="772" height="40" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68" y="145" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">—</text>
  <text x="140" y="145" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">—</text>
  <text x="250" y="145" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">不翻转</text>
  <text x="424" y="145" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">100111011</text>
  <text x="592" y="145" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">10101</text>
  <text x="708" y="145" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="772" y="145" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">基准</text>

  <!-- 行 1：p=2 -->
  <rect x="24" y="160" width="772" height="40" fill="#f3f6f9" stroke="#c9d3dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68" y="185" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="140" y="185" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="250" y="185" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第2段 L=2 左端</text>
  <text x="424" y="185" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">110111011</text>
  <text x="592" y="185" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">10101</text>
  <text x="708" y="185" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="772" y="185" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">—</text>

  <!-- 行 2：p=3 -->
  <rect x="24" y="200" width="772" height="40" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68" y="225" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="140" y="225" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="250" y="225" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第2段 L=2 右端</text>
  <text x="424" y="225" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">101111011</text>
  <text x="592" y="225" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">10101</text>
  <text x="708" y="225" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="772" y="225" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">—</text>

  <!-- 行 3：p=4 -->
  <rect x="24" y="240" width="772" height="40" fill="#f3f6f9" stroke="#c9d3dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68" y="265" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="140" y="265" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="250" y="265" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第3段 L=3 左端</text>
  <text x="424" y="265" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">100011011</text>
  <text x="592" y="265" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">10101</text>
  <text x="708" y="265" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="772" y="265" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">—</text>

  <!-- 行 4：p=5 内部，新串 -->
  <rect x="24" y="280" width="772" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="68" y="305" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5</text>
  <text x="140" y="305" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="250" y="305" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">第3段 L=3 内部</text>
  <text x="424" y="305" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">100101011</text>
  <text x="592" y="305" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1010101</text>
  <text x="708" y="305" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">7</text>
  <text x="772" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">✓ 新</text>

  <!-- 行 5：p=6 -->
  <rect x="24" y="320" width="772" height="40" fill="#f3f6f9" stroke="#c9d3dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68" y="345" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="140" y="345" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="250" y="345" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第3段 L=3 右端</text>
  <text x="424" y="345" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">100110011</text>
  <text x="592" y="345" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">10101</text>
  <text x="708" y="345" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="772" y="345" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">—</text>

  <!-- 行 6：p=7 独苗 -->
  <rect x="24" y="360" width="772" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="68" y="385" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">7</text>
  <text x="140" y="385" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">0</text>
  <text x="250" y="385" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">第4段 L=1 独苗</text>
  <text x="424" y="385" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">100111111</text>
  <text x="592" y="385" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">101</text>
  <text x="708" y="385" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>
  <text x="772" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">✓ 新</text>

  <!-- 行 7：p=8 -->
  <rect x="24" y="400" width="772" height="40" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68" y="425" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="140" y="425" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="250" y="425" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第5段 L=2 左端</text>
  <text x="424" y="425" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">100111001</text>
  <text x="592" y="425" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">10101</text>
  <text x="708" y="425" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="772" y="425" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">—</text>

  <!-- 竖分隔线 -->
  <path d="M 112 76 L 112 440" stroke="#9fb0c0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 168 76 L 168 440" stroke="#9fb0c0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 332 76 L 332 440" stroke="#9fb0c0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 516 76 L 516 440" stroke="#9fb0c0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 668 76 L 668 440" stroke="#9fb0c0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 748 76 L 748 440" stroke="#9fb0c0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <text x="410" y="466" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">去重后只剩 3 个：10101（长度 k）、1010101（k+2）、101（k−2）</text>
  <text x="410" y="488" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">绿色行 = 段内部翻转（+2 位）；橙色行 = 独苗段翻转（−2 位）；其余 6 种都退回原压缩串 ⇒ 答案 3</text>
  <text x="410" y="506" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">注意 p = 5 与 p = 7 分别命中「存在段长 ≥ 3」与「存在内段 L = 1」两个独立条件</text>
</svg>
