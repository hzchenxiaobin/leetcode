<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">Top-K 只需要「前 k 名」，不需要完整全序</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">把距离平方当键：单调、无浮点、int 不溢出</text>
  <text x="30" y="74" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">按平方距离升序排好的候选（k = 3）</text>
  <rect x="30" y="88" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="70.0" y="113.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(-2,2)</text>
  <text x="70" y="156" font-size="11" fill="#b85450" text-anchor="middle" filter="url(#rough2)">d²=8</text>
  <rect x="118" y="88" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="158.0" y="113.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(1,3)</text>
  <text x="158" y="156" font-size="11" fill="#b85450" text-anchor="middle" filter="url(#rough2)">d²=10</text>
  <rect x="206" y="88" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="246.0" y="113.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(0,0)</text>
  <text x="246" y="156" font-size="11" fill="#b85450" text-anchor="middle" filter="url(#rough2)">d²=0</text>
  <rect x="294" y="88" width="80" height="44" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="334.0" y="113.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(3,3)</text>
  <text x="334" y="156" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">d²=18</text>
  <rect x="382" y="88" width="80" height="44" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="422.0" y="113.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(-2,4)</text>
  <text x="422" y="156" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">d²=20</text>
  <rect x="470" y="88" width="80" height="44" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="510.0" y="113.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(5,-1)</text>
  <text x="510" y="156" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">d²=26</text>
  <path d="M 296 80 L 296 170" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="296" y="190" font-size="11" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">第 k 名分界</text>
  <rect x="30" y="212" width="500" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="233" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">只关心前 k 名：左边三个是答案，右边三个的相对顺序无所谓</text><text x="40" y="248.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">全排序 O(n log n) → 快速选择平均 O(n) → 堆 O(n log k)</text><text x="40" y="264.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">本题 n ≤ 10^4，三者都能过，但 Top-K 的标准打法是后两者</text>
</svg>
