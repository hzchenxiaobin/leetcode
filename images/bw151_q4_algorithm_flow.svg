<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">算法流程：定槽型 → 算总数 → 逐位试值</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">每个位置只枚举「未使用且奇偶合法」的候选值</text>
  <rect x="120" y="62" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="88" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">由 n 的奇偶确定槽型与总方案数 total</text>
  <path d="M 280 106 L 280 124" stroke="#666666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="280,124.0 375.0,152 280,180.0 185.0,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="147" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">k &gt; total ？</text>
  <text x="280" y="165" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">空列表</text>
  <path d="M 375 152 L 430 152" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="402" y="144" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="434" y="130" width="110" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="489" y="157" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 []</text>
  <path d="M 280 180 L 280 200" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="194" text-anchor="start" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="120" y="204" width="320" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">pos 从 0 到 n−1，按值从小到大试候选 v</text>
  <text x="280" y="242" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">跳过已用的、跳过与上一位同奇偶的</text>
  <path d="M 280 252 L 280 272" stroke="#666666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="276" width="320" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">cnt = 剩余槽位填法数（o! × e!，槽型不符则 0）</text>
  <text x="280" y="314" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">o、e = 选走 v 之后剩余的奇数、偶数个数</text>
  <path d="M 280 324 L 280 344" stroke="#666666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="280,344.0 375.0,372 280,400.0 185.0,372" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="367" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">k &gt; cnt ？</text>
  <path d="M 375 372 L 428 372" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="364" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="432" y="350" width="116" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="490" y="372" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">k −= cnt</text>
  <text x="490" y="388" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">试下一个 v</text>
  <path d="M 280 400 L 280 420" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="414" text-anchor="start" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否：固定 v</text>
  <rect x="120" y="424" width="320" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="447" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">记录 v，进入下一位；填满即得答案</text>
</svg>
