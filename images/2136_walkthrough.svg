<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="440" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：plantTime = [1,4,3]，growTime = [2,3,1]</text>
  <text x="340" y="50" text-anchor="middle" font-size="12.5" fill="#555">按 growTime 降序 → 种子1 (p=4,g=3) → 种子0 (p=1,g=2) → 种子2 (p=3,g=1)</text>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="118" y="60" width="18" height="14" fill="#ececec" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="142" y="72" font-size="11" fill="#555">播种（占园丁）</text>
  <g filter="url(#sk)">
    <rect x="238" y="60" width="18" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="262" y="72" font-size="11" fill="#555">生长（并行免费）</text>
  <g filter="url(#sk)">
    <rect x="398" y="60" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="422" y="72" font-size="11" fill="#555">✿ 开花</text>

  <!-- day header -->
  <g font-size="11" text-anchor="middle" fill="#888">
    <text x="168" y="92">0</text><text x="208" y="92">1</text><text x="248" y="92">2</text><text x="288" y="92">3</text>
    <text x="328" y="92">4</text><text x="368" y="92">5</text><text x="408" y="92">6</text><text x="448" y="92">7</text>
    <text x="488" y="92">8</text><text x="528" y="92">9</text>
  </g>

  <!-- row: seed 1 -->
  <text x="142" y="118" text-anchor="end" font-size="11.5" fill="#333" font-weight="bold">种子1 (4,3)</text>
  <g filter="url(#sk)">
    <rect x="148" y="98" width="40" height="32" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="188" y="98" width="40" height="32" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="228" y="98" width="40" height="32" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="268" y="98" width="40" height="32" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="308" y="98" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="348" y="98" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="388" y="98" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="428" y="98" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#666">
    <text x="168" y="118">种</text><text x="208" y="118">种</text><text x="248" y="118">种</text><text x="288" y="118">种</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#446688">
    <text x="328" y="118">长</text><text x="368" y="118">长</text><text x="408" y="118">长</text>
  </g>
  <text x="448" y="119" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">✿</text>
  <text x="558" y="112" font-size="11" fill="#444">收工 P = 4</text>
  <text x="558" y="128" font-size="11.5" font-weight="bold" fill="#333">开花 = 4+3 = 7</text>

  <!-- row: seed 0 -->
  <text x="142" y="156" text-anchor="end" font-size="11.5" fill="#333" font-weight="bold">种子0 (1,2)</text>
  <g filter="url(#sk)">
    <rect x="308" y="136" width="40" height="32" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="348" y="136" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="388" y="136" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="428" y="136" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="328" y="156" text-anchor="middle" font-size="12" fill="#666">种</text>
  <g font-size="12" text-anchor="middle" fill="#4a7a3a">
    <text x="368" y="156">长</text><text x="408" y="156">长</text>
  </g>
  <text x="448" y="157" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">✿</text>
  <text x="558" y="150" font-size="11" fill="#444">收工 P = 5</text>
  <text x="558" y="166" font-size="11.5" font-weight="bold" fill="#333">开花 = 5+2 = 7</text>

  <!-- row: seed 2 -->
  <text x="142" y="194" text-anchor="end" font-size="11.5" fill="#333" font-weight="bold">种子2 (3,1)</text>
  <g filter="url(#sk)">
    <rect x="348" y="174" width="40" height="32" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="388" y="174" width="40" height="32" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="428" y="174" width="40" height="32" fill="#ececec" stroke="#999" stroke-width="1.4"/>
    <rect x="468" y="174" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="508" y="174" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#666">
    <text x="368" y="194">种</text><text x="408" y="194">种</text><text x="448" y="194">种</text>
  </g>
  <text x="488" y="195" text-anchor="middle" font-size="12" fill="#d6a040">长</text>
  <text x="528" y="196" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">✿</text>
  <text x="558" y="188" font-size="11" fill="#444">收工 P = 8</text>
  <text x="558" y="204" font-size="12" font-weight="bold" fill="#b85450">开花 = 8+1 = 9 ←max</text>

  <!-- row: gardener -->
  <text x="142" y="230" text-anchor="end" font-size="11.5" fill="#333" font-weight="bold">园丁</text>
  <g filter="url(#sk)">
    <rect x="148" y="212" width="40" height="28" fill="#ececec" stroke="#999" stroke-width="1.2"/>
    <rect x="188" y="212" width="40" height="28" fill="#ececec" stroke="#999" stroke-width="1.2"/>
    <rect x="228" y="212" width="40" height="28" fill="#ececec" stroke="#999" stroke-width="1.2"/>
    <rect x="268" y="212" width="40" height="28" fill="#ececec" stroke="#999" stroke-width="1.2"/>
    <rect x="308" y="212" width="40" height="28" fill="#ececec" stroke="#999" stroke-width="1.2"/>
    <rect x="348" y="212" width="40" height="28" fill="#ececec" stroke="#999" stroke-width="1.2"/>
    <rect x="388" y="212" width="40" height="28" fill="#ececec" stroke="#999" stroke-width="1.2"/>
    <rect x="428" y="212" width="40" height="28" fill="#ececec" stroke="#999" stroke-width="1.2"/>
    <rect x="468" y="212" width="40" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="508" y="212" width="40" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#777">
    <text x="168" y="230">忙</text><text x="208" y="230">忙</text><text x="248" y="230">忙</text><text x="288" y="230">忙</text>
    <text x="328" y="230">忙</text><text x="368" y="230">忙</text><text x="408" y="230">忙</text><text x="448" y="230">忙</text>
    <text x="488" y="230">闲</text><text x="528" y="230">闲</text>
  </g>
  <text x="558" y="230" font-size="10.5" fill="#888">Σp = 8 天全忙</text>

  <!-- answer banner -->
  <g filter="url(#sk)">
    <rect x="48" y="252" width="584" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="340" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d25">ans = max(7, 7, 9) = 9 ✓</text>

  <!-- notes -->
  <g filter="url(#sk)">
    <rect x="48" y="294" width="584" height="64" rx="8" fill="#ffffff" stroke="#bbb" stroke-width="1.3"/>
  </g>
  <text x="62" y="315" font-size="11" fill="#444">· 播种总量 Σp = 4+1+3 = 8 天一天没省——能优化的只有「谁先种完」</text>
  <text x="62" y="333" font-size="11" fill="#444">· 种子0 的生长期完全叠在种子1 的生长期上，「免费并行」的直观体现</text>
  <text x="62" y="351" font-size="11" fill="#444">· 第 8 天起园丁已闲，答案卡在种子2 那 1 天生长期的尾巴上</text>

  <g filter="url(#sk)">
    <rect x="48" y="368" width="584" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="340" y="386" text-anchor="middle" font-size="11" fill="#7a5415">官方解释按 0→1→2 的顺序同样得 9（开花日 3、8、9）——最优顺序不唯一，贪心给出的是最容易构造的一种</text>
  <text x="340" y="404" text-anchor="middle" font-size="11" fill="#7a5415">反过来按 growTime 升序种（2→0→1）开花日为 4、6、11，劣化为 11</text>
</svg>
