<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">示例演算：intervals = [[1,4],[2,4],[3,6],[4,4]]，queries = [2,3,4,5]</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">区间已按 left 排序；查询升序处理，答案按原下标写回 → [3, 3, 1, 4]</text>

  <!-- 表头 -->
  <text x="76" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">查询</text>
  <text x="270" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">入堆 / 弹出</text>
  <text x="456" y="58" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">堆顶 → 答案</text>
  <line x1="36" y1="66" x2="484" y2="66" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 升序指示箭头 -->
  <path d="M 24 90 L 24 296" stroke="#999" stroke-width="1.4" marker-end="url(#arrGrey)" filter="url(#rough2)"/>
  <text x="26" y="312" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">查询升序</text>

  <!-- 行分隔线 -->
  <line x1="36" y1="134" x2="484" y2="134" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="36" y1="200" x2="484" y2="200" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="36" y1="266" x2="484" y2="266" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- 第 1 行：q=2 -->
  <rect x="44" y="86" width="64" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">q = 2</text>
  <text x="120" y="96" font-size="9.8" fill="#4a7a3a" filter="url(#rough2)">入堆：(4,r4)=[1,4]、(3,r4)=[2,4]</text>
  <text x="120" y="114" font-size="9.8" fill="#555" filter="url(#rough2)">无弹出；堆顶 (3,[2,4])，r=4 ≥ 2 ✓</text>
  <rect x="420" y="86" width="72" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>

  <!-- 第 2 行：q=3 -->
  <rect x="44" y="152" width="64" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">q = 3</text>
  <text x="120" y="162" font-size="9.8" fill="#4a7a3a" filter="url(#rough2)">入堆：(4,r6)=[3,6]</text>
  <text x="120" y="180" font-size="9.8" fill="#555" filter="url(#rough2)">无弹出；堆顶仍 (3,[2,4])，r=4 ≥ 3 ✓</text>
  <rect x="420" y="152" width="72" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>

  <!-- 第 3 行：q=4 -->
  <rect x="44" y="218" width="64" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">q = 4</text>
  <text x="120" y="228" font-size="9.8" fill="#4a7a3a" filter="url(#rough2)">入堆：(1,r4)=[4,4]</text>
  <text x="120" y="246" font-size="9.8" fill="#555" filter="url(#rough2)">无弹出；新堆顶 (1,[4,4])，r=4 ≥ 4 ✓</text>
  <rect x="420" y="218" width="72" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>

  <!-- 第 4 行：q=5 -->
  <rect x="44" y="284" width="64" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4b6b" filter="url(#rough2)">q = 5</text>
  <text x="120" y="294" font-size="9.8" fill="#b85450" filter="url(#rough2)">无新入堆；弹出 (1,r4)、(3,r4)、(4,r4)——r=4 &lt; 5</text>
  <text x="120" y="312" font-size="9.8" fill="#555" filter="url(#rough2)">堆顶 (4,[3,6])，r=6 ≥ 5 ✓</text>
  <rect x="420" y="284" width="72" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">4</text>

  <!-- 底部结论 -->
  <text x="260" y="348" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">每个区间入堆一次、失效弹出一次 → 堆操作总量 O(n log n)</text>
</svg>
