<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="450" fill="#fafafa"/>

  <text x="320" y="34" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">插入的字符必须扮演 L / C / T 中的一个角色</text>

  <!-- Case 1: 插 L 在开头 -->
  <rect x="20" y="76" width="112" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="101" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">① 插入 L</text>

  <path d="M196,58 L196,72" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="78" width="48" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="194" y="104" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">L</text>
  <rect x="226" y="78" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="104" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">L</text>
  <rect x="282" y="78" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="306" y="104" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">C</text>
  <rect x="338" y="78" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="362" y="104" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">T</text>

  <rect x="402" y="72" width="216" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510" y="92" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">新增 = 后缀中 CT 子序列数</text>
  <text x="510" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">（L 是队头，插在最前最优）</text>

  <!-- Case 2: 插 C 在中间 -->
  <rect x="20" y="176" width="112" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="76" y="201" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">② 插入 C ★</text>

  <path d="M250,158 L250,172" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="178" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="204" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">L</text>
  <rect x="226" y="178" width="48" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="250" y="204" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">C</text>
  <rect x="282" y="178" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="306" y="204" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">C</text>
  <rect x="338" y="178" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="362" y="204" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">T</text>

  <rect x="402" y="172" width="216" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="192" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">新增 = 前缀 L 数 × 后缀 T 数</text>
  <text x="510" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">（位置要挑：枚举取最大！）</text>

  <!-- Case 3: 插 T 在末尾 -->
  <rect x="20" y="276" width="112" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="301" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">③ 插入 T</text>

  <path d="M362,258 L362,272" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="278" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="304" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">L</text>
  <rect x="226" y="278" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="304" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">C</text>
  <rect x="282" y="278" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="306" y="304" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">T</text>
  <rect x="338" y="278" width="48" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="362" y="304" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">T</text>

  <rect x="402" y="272" width="216" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510" y="292" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">新增 = 前缀中 LC 子序列数</text>
  <text x="510" y="312" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">（T 是队尾，插在最后最优）</text>

  <!-- 底部结论 -->
  <rect x="30" y="348" width="580" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="378" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">答案 = 原串 LCT 子序列数 + max(①, ②, ③ 的增益)</text>
  <text x="320" y="404" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">插入其他字母（A、B、…）不产生任何新子序列；</text>
  <text x="320" y="422" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">「最多插入一个」= 也可以不插，而三种增益均非负，公式自动覆盖</text>
</svg>
