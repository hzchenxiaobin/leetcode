<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">base[n] = [1, 2, …, n−1, n, n]：1~n−1 各一次，n 出现两次</text>

  <!-- 面板一：base[3] -->
  <g filter="url(#rough2)">
    <rect x="36" y="48" width="448" height="108" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="260" y="72" text-anchor="middle" font-size="13.5" fill="#446688">base[3] = [1, 2, 3, 3]，长度 n+1 = 4</text>
    <rect x="140" y="88" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="162" y="113" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="184" y="88" width="44" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="206" y="113" text-anchor="middle" font-size="15" fill="#333">2</text>
    <rect x="228" y="88" width="44" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="250" y="113" text-anchor="middle" font-size="15" fill="#b85450">3</text>
    <rect x="272" y="88" width="44" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="294" y="113" text-anchor="middle" font-size="15" fill="#b85450">3</text>
    <text x="352" y="110" font-size="12.5" fill="#b85450">← n = 3 出现两次</text>
  </g>

  <!-- 面板二：base[1] -->
  <g filter="url(#rough2)">
    <rect x="36" y="172" width="448" height="78" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="260" y="196" text-anchor="middle" font-size="13.5" fill="#4a7a3a">base[1] = [1, 1]，长度 n+1 = 2</text>
    <rect x="216" y="206" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="238" y="228" text-anchor="middle" font-size="15" fill="#b85450">1</text>
    <rect x="260" y="206" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="282" y="228" text-anchor="middle" font-size="15" fill="#b85450">1</text>
  </g>

  <!-- 面板三：判定结论 -->
  <g filter="url(#rough2)">
    <rect x="36" y="266" width="448" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="260" y="292" text-anchor="middle" font-size="13.5" fill="#8a6d1f">排序后应是 [1, 2, …, m−1, m−1]，其中 m = nums 长度</text>
    <text x="260" y="318" text-anchor="middle" font-size="12.5" fill="#555">好数组 ⇔ 排序结果逐位等于上面的“模板”（多重集相等）</text>
  </g>

  <path d="M 260 156 C 262 162, 262 164, 260 170" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 250 C 262 256, 262 258, 260 264" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
