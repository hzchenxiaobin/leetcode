<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="680" height="460" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：形状 → σ，不枚举任何因数</text>
  <path d="M 145 38 Q 340 48 535 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <rect x="26" y="56" width="628" height="278" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <rect x="26" y="56" width="628" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4258" filter="url(#rough2)">x</text>
  <text x="196" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4258" filter="url(#rough2)">质因数分解</text>
  <text x="306" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4258" filter="url(#rough2)">τ(x)</text>
  <text x="446" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4258" filter="url(#rough2)">σ(x) 按公式</text>
  <text x="600" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4258" filter="url(#rough2)">累加</text>

  <path d="M 26 94 L 654 94" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 126 56 L 126 334" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 266 56 L 266 334" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 346 56 L 346 334" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 546 56 L 546 334" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 1：21，计入 -->
  <rect x="27" y="95" width="626" height="34" fill="#e6f4ea" filter="url(#rough2)" opacity="0.85"/>
  <text x="76" y="117" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">21</text>
  <text x="196" y="117" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">3 · 7</text>
  <text x="306" y="117" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">2 × 2 = 4</text>
  <text x="446" y="117" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">(1+3)(1+7) = 32</text>
  <text x="600" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">+32</text>
  <path d="M 26 129 L 654 129" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 2：4，跳过 -->
  <text x="76" y="151" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">4</text>
  <text x="196" y="151" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2²</text>
  <text x="306" y="151" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2 + 1 = 3</text>
  <text x="446" y="151" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">—（3 个因数）</text>
  <text x="600" y="151" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <path d="M 26 163 L 654 163" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 3：7，跳过 -->
  <text x="76" y="185" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">7</text>
  <text x="196" y="185" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">7</text>
  <text x="306" y="185" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <text x="446" y="185" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">—（质数，2 个因数）</text>
  <text x="600" y="185" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <path d="M 26 197 L 654 197" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 4：8，计入 -->
  <rect x="27" y="198" width="626" height="34" fill="#e6f4ea" filter="url(#rough2)" opacity="0.85"/>
  <text x="76" y="220" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">8</text>
  <text x="196" y="220" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">2³</text>
  <text x="306" y="220" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">3 + 1 = 4</text>
  <text x="446" y="220" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">1+2+4+8 = 15</text>
  <text x="600" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">+15</text>
  <path d="M 26 232 L 654 232" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 5：6，计入 -->
  <rect x="27" y="233" width="626" height="34" fill="#e6f4ea" filter="url(#rough2)" opacity="0.85"/>
  <text x="76" y="255" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">6</text>
  <text x="196" y="255" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">2 · 3</text>
  <text x="306" y="255" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">2 × 2 = 4</text>
  <text x="446" y="255" text-anchor="middle" font-size="12" fill="#2f5a22" filter="url(#rough2)">(1+2)(1+3) = 12</text>
  <text x="600" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">+12</text>
  <path d="M 26 267 L 654 267" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 6：12，跳过 -->
  <text x="76" y="289" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">12</text>
  <text x="196" y="289" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2² · 3</text>
  <text x="306" y="289" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">3 × 2 = 6</text>
  <text x="446" y="289" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">—（6 个因数）</text>
  <text x="600" y="289" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <path d="M 26 301 L 654 301" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 7：99998，计入（最大贡献） -->
  <rect x="27" y="302" width="626" height="32" fill="#fff8e1" filter="url(#rough2)" opacity="0.9"/>
  <text x="76" y="323" text-anchor="middle" font-size="12" fill="#5a4a20" filter="url(#rough2)">99998</text>
  <text x="196" y="323" text-anchor="middle" font-size="12" fill="#5a4a20" filter="url(#rough2)">2 · 49999</text>
  <text x="306" y="323" text-anchor="middle" font-size="12" fill="#5a4a20" filter="url(#rough2)">2 × 2 = 4</text>
  <text x="446" y="323" text-anchor="middle" font-size="11.5" fill="#5a4a20" filter="url(#rough2)">(1+2)(1+49999) = 150000</text>
  <text x="600" y="323" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5a4a20" filter="url(#rough2)">+150000</text>

  <rect x="26" y="348" width="628" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="372" text-anchor="middle" font-size="12.5" fill="#2c4258" filter="url(#rough2)">nums = [21, 4, 7]：32 + 0 + 0 = 32</text>
  <text x="340" y="396" text-anchor="middle" font-size="12.5" fill="#2c4258" filter="url(#rough2)">nums = [21, 21]：32 + 32 = 64 —— 重复元素各算一次</text>
  <text x="340" y="422" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">最大值 150000 出现在 99998，×10⁴ 后仍小于 2³¹−1，但已逼近 int 上限</text>

</svg>
