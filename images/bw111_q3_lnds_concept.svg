<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="88"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">删除 ⇔ 保留子序列：最少删除 = n − 最长非降子序列</text>

  <!-- 原数组 -->
  <g filter="url(#rough2)">
    <text x="70" y="68" text-anchor="end" font-size="12.5" fill="#555">nums</text>
    <rect x="90" y="48" width="56" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="118" y="70" text-anchor="middle" font-size="15" fill="#333">2</text>
    <rect x="146" y="48" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="174" y="70" text-anchor="middle" font-size="15" fill="#333">1</text>
    <rect x="202" y="48" width="56" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="230" y="70" text-anchor="middle" font-size="15" fill="#333">3</text>
    <rect x="258" y="48" width="56" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="286" y="70" text-anchor="middle" font-size="15" fill="#333">2</text>
    <rect x="314" y="48" width="56" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="342" y="70" text-anchor="middle" font-size="15" fill="#333">1</text>
  </g>

  <!-- 保留与删除 -->
  <g filter="url(#rough2)">
    <text x="70" y="130" text-anchor="end" font-size="12.5" fill="#555">保留 ✓</text>
    <path d="M 118 88 C 118 100, 174 100, 174 112" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 286 88 C 286 100, 240 100, 240 112" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <rect x="146" y="114" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="174" y="136" text-anchor="middle" font-size="15" fill="#4a7a3a">2</text>
    <rect x="202" y="114" width="56" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="230" y="136" text-anchor="middle" font-size="15" fill="#4a7a3a">2</text>
    <text x="258" y="136" font-size="12" fill="#4a7a3a">← 子序列 [2,2] 非降</text>

    <text x="70" y="186" text-anchor="end" font-size="12.5" fill="#b85450">删除 ✗</text>
    <path d="M 118 88 C 118 160, 118 168, 118 176" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)" stroke-dasharray="5 4"/>
    <text x="150" y="186" font-size="12" fill="#b85450">删 3 个（下标 0、2、3）→ n − LNDS = 5 − 2 = 3</text>
  </g>

  <!-- 公式框 -->
  <g filter="url(#rough2)">
    <rect x="420" y="106" width="196" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="518" y="132" text-anchor="middle" font-size="13.5" fill="#333">答案 = n − LNDS(nums)</text>
    <text x="518" y="154" text-anchor="middle" font-size="12" fill="#555">非降（非严格）：v ≤ x</text>
    <text x="518" y="172" text-anchor="middle" font-size="12" fill="#555">相等元素可共存！</text>
  </g>

  <!-- 演算表 -->
  <g filter="url(#rough2)" font-size="12.5">
    <text x="320" y="224" text-anchor="middle" fill="#333">dp[v] 演算（示例 1）</text>
    <rect x="90" y="238" width="88" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="134" y="257" text-anchor="middle" fill="#333">元素 x</text>
    <rect x="178" y="238" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="218" y="257" text-anchor="middle" fill="#333">dp[1]</text>
    <rect x="258" y="238" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="298" y="257" text-anchor="middle" fill="#333">dp[2]</text>
    <rect x="338" y="238" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="378" y="257" text-anchor="middle" fill="#333">dp[3]</text>

    <g fill="#333">
      <rect x="90" y="270" width="88" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
      <text x="134" y="288" text-anchor="middle">2</text>
      <rect x="178" y="270" width="80" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
      <text x="218" y="288" text-anchor="middle">0</text>
      <rect x="258" y="270" width="80" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
      <text x="298" y="288" text-anchor="middle" fill="#4a7a3a">1</text>
      <rect x="338" y="270" width="80" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
      <text x="378" y="288" text-anchor="middle">0</text>

      <rect x="90" y="298" width="88" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
      <text x="134" y="316" text-anchor="middle">1</text>
      <rect x="178" y="298" width="80" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
      <text x="218" y="316" text-anchor="middle" fill="#4a7a3a">1</text>
      <rect x="258" y="298" width="80" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
      <text x="298" y="316" text-anchor="middle">1</text>
      <rect x="338" y="298" width="80" height="26" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
      <text x="378" y="316" text-anchor="middle">0</text>
    </g>
    <text x="470" y="288" font-size="12" fill="#888">… 继续滚到末尾</text>
    <text x="470" y="310" font-size="12" fill="#4a7a3a">max(dp) = 2 → 删 5−2 = 3 ✓</text>
  </g>
</svg>
