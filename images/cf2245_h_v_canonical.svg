  <text x="248.0" y="142.0" text-anchor="start" font-size="13" fill="#b85450" font-weight="normal" filter="url(#rough2)">(t*, c2)</text>
  <rect x="60" y="90" width="280" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="346" y="115.0" text-anchor="start" font-size="12" fill="#8a6410" font-weight="normal" filter="url(#rough2)">r &lt; t* 必须被挡住</text>
  <text x="30" y="400" text-anchor="start" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">判定：设 pu / pv = 两端点各自“上方最近的非零行”，L = max(pu,pv)。</text>
  <text x="30" y="424" text-anchor="start" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">t* 可行 ⇔ t* ∈ (L,R) 且第 t* 行在 (c1,c2) 开区间上全 0；</text>
  <text x="30" y="448" text-anchor="start" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">且 (L, t*-1) 中没有任何一行在 (c1,c2) 上全 0。</text>
  <text x="560" y="82" text-anchor="start" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">c2 &gt; c1 时：第 x 行全 0 ⇔ c2 ≤ nz_x(c1)</text>
  <path d="M 560 140 L 940 140" stroke="#446688" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 580 132 L 580 148" stroke="#446688" stroke-width="1.6" fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="580" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="normal" filter="url(#rough2)">c1</text>
  <path d="M 665 132 L 665 148" stroke="#446688" stroke-width="1.6" fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="665" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="normal" filter="url(#rough2)">nz1</text>
  <path d="M 750 132 L 750 148" stroke="#446688" stroke-width="1.6" fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="750" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="normal" filter="url(#rough2)">nz2</text>
  <path d="M 835 132 L 835 148" stroke="#446688" stroke-width="1.6" fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="835" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="normal" filter="url(#rough2)">nz3</text>
  <path d="M 920 132 L 920 148" stroke="#446688" stroke-width="1.6" fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="920" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="normal" filter="url(#rough2)">m-1</text>
  <rect x="580" y="104" width="170" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="590" y="122" text-anchor="start" font-size="12" fill="#33506a" font-weight="normal" filter="url(#rough2)">这些 c2 让第 x 行“空”</text>
  <rect x="750" y="104" width="170" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="760" y="122" text-anchor="start" font-size="12" fill="#7a2d2a" font-weight="normal" filter="url(#rough2)">这些 c2 让第 x 行“被挡”</text>
  <text x="560" y="220" text-anchor="start" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">对行集 (L, t*-1) 取 M = max nz_x(c1)：</text>
  <text x="560" y="246" text-anchor="start" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">右侧(c2&gt;c1) 合法 ⇔ c2 &gt; M.</text>
  <text x="560" y="278" text-anchor="start" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">左侧(c2&lt;c1) 同理取 P = min pz_x(c1)：</text>
  <text x="560" y="304" text-anchor="start" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">合法 ⇔ c2 &lt; min(c1,P).</text>
  <rect x="560" y="330" width="380" height="120" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="574" y="356" text-anchor="start" font-size="13" fill="#33502a" font-weight="normal" filter="url(#rough2)">M(c1)、P(c1) 对 c1 单调 ⇒ 双指针</text>
  <text x="574" y="380" text-anchor="start" font-size="13" fill="#33502a" font-weight="normal" filter="url(#rough2)">按 a2 = pv 分组：</text>
  <text x="574" y="404" text-anchor="start" font-size="12" fill="#33502a" font-weight="normal" filter="url(#rough2)">· a2 ≤ a1：M 只依赖 a1（一遍扫描）</text>
  <text x="574" y="428" text-anchor="start" font-size="12" fill="#33502a" font-weight="normal" filter="url(#rough2)">· a2 &gt; a1：M 只依赖 a2（再扫一遍）</text>
