<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察二：平方是凸函数 → 位流向最大的数 → 位集嵌套</text>
  <path d="M 140 36 Q 320 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- exchange argument box -->
  <g filter="url(#sk)">
    <rect x="40" y="52" width="560" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="74" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">交换论证：x ≥ y ≥ 2^b 时，把 y 的位 b 挪给 x：</text>
  <text x="320" y="97" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">Δ = (x+2^b)² + (y−2^b)² − x² − y² = 2·2^b·(x−y) + 2·4^b &gt; 0</text>
  <text x="320" y="119" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">同样的位库存，越集中平方和越大（马太效应）</text>

  <!-- bit inventory -->
  <text x="320" y="156" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">位库存（示例 1）：8×1 份、4×2 份、2×2 份、1×1 份，k = 2</text>
  <g filter="url(#sk)">
    <circle cx="150" cy="196" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="270" cy="196" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="270" cy="174" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="390" cy="196" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="390" cy="174" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="510" cy="196" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="150" y="224" text-anchor="middle" font-size="11.5" fill="#556">8（1 份）</text>
    <text x="270" y="224" text-anchor="middle" font-size="11.5" fill="#556">4（2 份）</text>
    <text x="390" y="224" text-anchor="middle" font-size="11.5" fill="#556">2（2 份）</text>
    <text x="510" y="224" text-anchor="middle" font-size="11.5" fill="#556">1（1 份）</text>
  </g>

  <!-- falling arrows -->
  <g stroke="#4a7a3a" fill="none" filter="url(#sk)">
    <path d="M 150 209 L 150 252" stroke-width="1.6" marker-end="url(#arG)"/>
    <path d="M 264 209 Q 254 232 260 252" stroke-width="1.6" marker-end="url(#arG)"/>
    <path d="M 280 172 Q 312 240 292 300" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arG)"/>
    <path d="M 384 209 Q 374 232 380 252" stroke-width="1.6" marker-end="url(#arG)"/>
    <path d="M 400 172 Q 432 240 412 300" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arG)"/>
    <path d="M 510 209 L 510 252" stroke-width="1.6" marker-end="url(#arG)"/>
  </g>

  <!-- v1 row -->
  <g filter="url(#sk)">
    <text x="120" y="278" text-anchor="end" font-size="14" font-weight="bold" fill="#2b2b2b">v₁ =</text>
    <rect x="129" y="258" width="42" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="150" y="278" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">1</text>
    <rect x="249" y="258" width="42" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="270" y="278" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">1</text>
    <rect x="369" y="258" width="42" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="390" y="278" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">1</text>
    <rect x="489" y="258" width="42" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="510" y="278" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">1</text>
    <text x="556" y="278" font-size="14" font-weight="bold" fill="#2e5e22">15</text>
  </g>

  <!-- v2 row -->
  <g filter="url(#sk)">
    <text x="120" y="328" text-anchor="end" font-size="14" font-weight="bold" fill="#2b2b2b">v₂ =</text>
    <rect x="129" y="308" width="42" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="150" y="328" text-anchor="middle" font-size="13.5" fill="#8899aa">0</text>
    <rect x="249" y="308" width="42" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="270" y="328" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">1</text>
    <rect x="369" y="308" width="42" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="390" y="328" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">1</text>
    <rect x="489" y="308" width="42" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="510" y="328" text-anchor="middle" font-size="13.5" fill="#8899aa">0</text>
    <text x="556" y="328" font-size="14" font-weight="bold" fill="#2e5e22">6</text>
  </g>

  <text x="320" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">位集嵌套 v₁ ⊇ v₂ ⊇ ⋯ ⊇ v_k：每位 b 恰好发给前 min(cnt[b], k) 个数</text>

  <!-- conclusion box -->
  <g filter="url(#sk)">
    <rect x="40" y="370" width="560" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="392" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#sk)">第 i 大的数 v_i = { b : cnt[b] ≥ i }；cnt[b] &gt; k 的多余份倾倒给未选中元素（不计入平方和）</text>
  <text x="320" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506b" filter="url(#sk)">平方和 = Σ v_i² —— 由位库存一步拼出，完全不关心操作过程</text>
</svg>
