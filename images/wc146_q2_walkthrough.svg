<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">演算走查：两状态 BFS 的出队顺序</text>
  <text x="330" y="48" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n = 5　红边 0→1, 1→2, 2→3, 0→4, 4→0　｜　蓝边 1→0, 3→4, 4→2</text>

  <rect x="24" y="64" width="612" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="48" y="85" text-anchor="middle">步</text>
    <text x="92" y="85">出队状态</text>
    <text x="222" y="85" text-anchor="middle">dist</text>
    <text x="300" y="85">按另一颜色扫描的边</text>
    <text x="470" y="85">更新 / 说明</text>
  </g>

  <g font-size="10" fill="#444" filter="url(#rough2)">
    <rect x="24" y="96" width="612" height="34" fill="#ffffff" stroke="#dcdcdc" stroke-width="1" filter="url(#rough2)"/>
    <text x="48" y="117" text-anchor="middle">1</text>
    <text x="92" y="117">(0, 红)</text>
    <text x="222" y="117" text-anchor="middle">0</text>
    <text x="300" y="117">蓝出边：0 没有蓝边</text>
    <text x="470" y="117" fill="#888">无变化</text>

    <rect x="24" y="130" width="612" height="34" fill="#f7f9fb" stroke="#dcdcdc" stroke-width="1" filter="url(#rough2)"/>
    <text x="48" y="151" text-anchor="middle">2</text>
    <text x="92" y="151">(0, 蓝)</text>
    <text x="222" y="151" text-anchor="middle">0</text>
    <text x="300" y="151">红 0→1、红 0→4</text>
    <text x="470" y="151" fill="#b85450">(1, 红)=1、(4, 红)=1</text>

    <rect x="24" y="164" width="612" height="34" fill="#ffffff" stroke="#dcdcdc" stroke-width="1" filter="url(#rough2)"/>
    <text x="48" y="185" text-anchor="middle">3</text>
    <text x="92" y="185">(1, 红)</text>
    <text x="222" y="185" text-anchor="middle">1</text>
    <text x="300" y="185">蓝 1→0</text>
    <text x="470" y="185" fill="#888">(0, 蓝) 已为 0，跳过</text>

    <rect x="24" y="198" width="612" height="34" fill="#f7f9fb" stroke="#dcdcdc" stroke-width="1" filter="url(#rough2)"/>
    <text x="48" y="219" text-anchor="middle">4</text>
    <text x="92" y="219">(4, 红)</text>
    <text x="222" y="219" text-anchor="middle">1</text>
    <text x="300" y="219">蓝 4→2</text>
    <text x="470" y="219" fill="#4a7a3a">(2, 蓝)=2</text>

    <rect x="24" y="232" width="612" height="34" fill="#ffffff" stroke="#dcdcdc" stroke-width="1" filter="url(#rough2)"/>
    <text x="48" y="253" text-anchor="middle">5</text>
    <text x="92" y="253">(2, 蓝)</text>
    <text x="222" y="253" text-anchor="middle">2</text>
    <text x="300" y="253">红 2→3</text>
    <text x="470" y="253" fill="#4a7a3a">(3, 红)=3</text>

    <rect x="24" y="266" width="612" height="34" fill="#f7f9fb" stroke="#dcdcdc" stroke-width="1" filter="url(#rough2)"/>
    <text x="48" y="287" text-anchor="middle">6</text>
    <text x="92" y="287">(3, 红)</text>
    <text x="222" y="287" text-anchor="middle">3</text>
    <text x="300" y="287">蓝 3→4</text>
    <text x="470" y="287" fill="#4a7a3a">(4, 蓝)=4</text>

    <rect x="24" y="300" width="612" height="34" fill="#ffffff" stroke="#dcdcdc" stroke-width="1" filter="url(#rough2)"/>
    <text x="48" y="321" text-anchor="middle">7</text>
    <text x="92" y="321">(4, 蓝)</text>
    <text x="222" y="321" text-anchor="middle">4</text>
    <text x="300" y="321">红 4→0</text>
    <text x="470" y="321" fill="#888">(0, 红) 已为 0，跳过</text>
  </g>

  <rect x="24" y="342" width="612" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="367" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">合并：answer[x] = min(dist[红][x], dist[蓝][x])</text>
  <text x="470" y="367" font-size="12" fill="#2f5a20" font-weight="bold" filter="url(#rough2)">[0, 1, 2, 3, 1]</text>

  <g font-size="10" fill="#999" filter="url(#rough2)">
    <text x="40" y="402">节点 4：红层 d=1、蓝层 d=4，取 min 得 1；节点 2：红层不可达（∞），只有蓝层 d=2</text>
    <text x="40" y="422">若只记录「每个节点被访问的距离」而不记录颜色，从节点 1 出队时就分不清该走红边还是蓝边</text>
    <text x="40" y="442">两层共 2n 个状态，故任意最短交替路径的边数不超过 2n；入队时即打标记，重复状态不会扩散</text>
  </g>
</svg>
