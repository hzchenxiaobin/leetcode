<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：边 0-1、1-2、1-3、3-4，w = [−1, +1, −1, +1, +1]</text>

  <!-- tree -->
  <path d="M 108 78 L 232 118" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 238 134 L 132 182" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 262 134 L 378 162" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 406 174 L 466 116" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- node 0 (bad) -->
  <circle cx="100" cy="72" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="100" y="52" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">w = −1</text>

  <!-- node 1 (good) -->
  <circle cx="245" cy="124" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="129" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="245" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">w = +1</text>

  <!-- node 2 (bad) -->
  <circle cx="124" cy="192" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="197" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="124" y="226" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">w = −1</text>

  <!-- node 3 (good) -->
  <circle cx="390" cy="168" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="173" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="390" y="144" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">w = +1</text>

  <!-- node 4 (good) -->
  <circle cx="478" cy="106" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="478" y="111" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="478" y="82" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">w = +1</text>

  <!-- down values under nodes -->
  <text x="64" y="86" font-size="10" fill="#446688" filter="url(#rough2)">down +2</text>
  <text x="262" y="148" font-size="10" fill="#446688" filter="url(#rough2)">down +3</text>
  <text x="158" y="212" font-size="10" fill="#446688" filter="url(#rough2)">down −1</text>
  <text x="352" y="196" font-size="10" fill="#446688" filter="url(#rough2)">down +2</text>
  <text x="478" y="140" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">down +1</text>

  <!-- pass 1 -->
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">第一遍 · 逆 BFS 序（4→3→2→1→0，自底向上）</text>
  <rect x="48" y="270" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="93" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4: +1</text>
  <rect x="150" y="270" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="195" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3: 1+1=+2</text>
  <rect x="252" y="270" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="297" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2: −1</text>
  <rect x="354" y="270" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="399" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1: 1+0+2=+3</text>
  <rect x="456" y="270" width="66" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="489" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0: +2</text>
  <path d="M 520 287 L 536 287" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- pass 2 -->
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">第二遍 · 正 BFS 序（0→1→2→3→4，自顶向下换根）</text>
  <rect x="40" y="346" width="94" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="87" y="365" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">g₀ = down₀</text>
  <text x="87" y="381" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">= 2</text>
  <rect x="146" y="346" width="100" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="196" y="365" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">g₁ = 3+max(0,2−3)</text>
  <text x="196" y="381" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">= 3</text>
  <rect x="258" y="346" width="102" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="309" y="365" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">g₂ = −1+max(0,3−0)</text>
  <text x="309" y="381" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">= 2</text>
  <rect x="372" y="346" width="88" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="416" y="365" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">g₃ = 2+max(0,3−2)</text>
  <text x="416" y="381" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">= 3</text>
  <rect x="472" y="346" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="502" y="365" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">g₄ = 1+</text>
  <text x="502" y="381" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">max(0,3−1)=3</text>

  <!-- highlight note for node 2 -->
  <text x="309" y="412" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">节点 2 自己 down = −1，全靠父侧借来 3 分翻盘 ↑</text>

  <!-- result -->
  <rect x="90" y="430" width="380" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="447" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">答案 = [2, 3, 2, 3, 3] ✓（与官方输出一致）</text>
  <text x="280" y="464" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">节点 1 的父侧贡献 max(0, 2−3) = 0：往 0 的方向带人是亏的，剪掉</text>

  <text x="280" y="492" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">BFS 序 order = [0,1,2,3,4]，parent = [−1,0,1,1,3]（根取 0，任取皆可）</text>
</svg>
