<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：固定 B 后，XOR(A) + XOR(C) 按位拆解</text>

  <!-- bit table for T = {3,6,7} -->
  <text x="165" y="58" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">以 T = {3, 6, 7} 为例，τ = X(T) = 3⊕6⊕7 = 2</text>

  <!-- header -->
  <rect x="70" y="70" width="76" height="26" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="108" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">元素</text>
  <rect x="146" y="70" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="166" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b₂</text>
  <rect x="186" y="70" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="206" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b₁</text>
  <rect x="226" y="70" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="246" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b₀</text>

  <!-- rows -->
  <rect x="70" y="96" width="76" height="26" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="108" y="114" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3 (011)</text>
  <rect x="146" y="96" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="166" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="186" y="96" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="206" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="226" y="96" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="246" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="70" y="122" width="76" height="26" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="108" y="140" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">6 (110)</text>
  <rect x="146" y="122" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="166" y="140" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="186" y="122" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="206" y="140" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="226" y="122" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="246" y="140" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <rect x="70" y="148" width="76" height="26" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="108" y="166" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">7 (111)</text>
  <rect x="146" y="148" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="166" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="186" y="148" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="206" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="226" y="148" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="246" y="166" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- counts -->
  <rect x="70" y="174" width="76" height="26" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="108" y="192" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">1 的个数</text>
  <rect x="146" y="174" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="166" y="192" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="186" y="174" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="206" y="192" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="226" y="174" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="246" y="192" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- tau row -->
  <rect x="70" y="200" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="218" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">τ = X(T)</text>
  <rect x="146" y="200" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="166" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="186" y="200" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="206" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="226" y="200" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="246" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <!-- panel: odd bit -->
  <rect x="330" y="76" width="276" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="468" y="98" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">奇数位（τ_p = 1）</text>
  <text x="468" y="118" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">XOR(A) 与 XOR(C) 该位必不相同</text>
  <text x="468" y="136" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">贡献恒为 2^p，与怎么分组无关（白送）</text>

  <!-- panel: even bit -->
  <rect x="330" y="156" width="276" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="468" y="178" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">关键位（τ_p = 0，偶数个 1）</text>
  <text x="468" y="198" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">两侧该位相同：要么都 0（贡献 0）</text>
  <text x="468" y="216" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">要么都 1（贡献 2·2^p）——取决于分组</text>

  <!-- masked strip -->
  <rect x="40" y="248" width="560" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="270" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">把元素截断到关键位：aᵢ &amp; ~τ</text>
  <text x="320" y="292" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3&amp;~2 = 001，6&amp;~2 = 100，7&amp;~2 = 101 → 建线性基，贪心得最大异或 r = 5 (101)</text>

  <!-- result -->
  <rect x="120" y="322" width="400" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="342" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold" filter="url(#rough2)">f(T) = τ + 2r = 2 + 2×5 = 12</text>
  <text x="320" y="362" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">对应 A = {3,6}：XOR = 5，C = {7}：XOR = 7，5 + 7 = 12 ✓</text>

  <!-- identity note -->
  <rect x="36" y="388" width="568" height="66" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="410" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">代数视角：x + y = (x⊕y) + 2(x&amp;y)，故 XOR(A)+XOR(C) = τ + 2·(XOR(A) &amp; XOR(C))</text>
  <text x="320" y="430" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">「公共 1 位」恰好全落在关键位上；在 {aᵢ &amp; ~τ} 的张成空间里取最大整数——</text>
  <text x="320" y="448" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">这正是线性基的看家本领（CF251D Two Sets / 洛谷 P3812）</text>
</svg>
