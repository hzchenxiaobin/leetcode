<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：d(u,x) = d(x,u)，把「逐点求距离」翻转成「三源各一次 BFS」</text>

  <!-- 左侧：星形树 + BFS 波前 -->
  <circle cx="165" cy="200" r="16" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <circle cx="165" cy="200" r="88" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 5" stroke-opacity="0.7" filter="url(#rough2)"/>
  <circle cx="165" cy="200" r="160" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="6 6" stroke-opacity="0.45" filter="url(#rough2)"/>

  <text x="124" y="188" font-size="11" fill="#446688" filter="url(#rough2)">d=0</text>
  <text x="230" y="120" font-size="11" fill="#446688" filter="url(#rough2)">d=1</text>
  <text x="266" y="86" font-size="11" fill="#446688" filter="url(#rough2)">d=2</text>

  <line x1="165" y1="200" x2="245" y2="170" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="245" y1="170" x2="320" y2="205" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="245" y1="170" x2="255" y2="275" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>

  <circle cx="245" cy="170" r="15" fill="#f5f5f5" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="175" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <circle cx="165" cy="200" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="165" y="205" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="138" y="192" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>

  <circle cx="320" cy="205" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="210" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="344" y="196" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">y</text>

  <circle cx="255" cy="275" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="255" y="280" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="280" y="297" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">z</text>

  <!-- 右侧：三次 BFS 的距离数组 -->
  <text x="384" y="80" font-size="11" fill="#888" filter="url(#rough2)">u →</text>
  <text x="442" y="80" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="487" y="80" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="532" y="80" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="577" y="80" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>

  <text x="368" y="105" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">dx</text>
  <rect x="420" y="86" width="44" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="464" y="86" width="44" height="26" rx="4" fill="#446688" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="508" y="86" width="44" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="552" y="86" width="44" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="442" y="104" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="486" y="104" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="530" y="104" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="574" y="104" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>

  <text x="368" y="141" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dy</text>
  <rect x="420" y="122" width="44" height="26" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="464" y="122" width="44" height="26" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="508" y="122" width="44" height="26" rx="4" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="552" y="122" width="44" height="26" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="442" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="486" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="530" y="140" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="574" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="368" y="177" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">dz</text>
  <rect x="420" y="158" width="44" height="26" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="464" y="158" width="44" height="26" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="508" y="158" width="44" height="26" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="552" y="158" width="44" height="26" rx="4" fill="#d6a040" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="442" y="176" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <text x="486" y="176" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <text x="530" y="176" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <text x="574" y="176" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="360" y="196" width="265" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="492" y="217" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">d(u,x) = d(x,u)：源与目标可互换（对称性）</text>

  <rect x="360" y="240" width="265" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="492" y="257" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 次 BFS ⇒ 三个距离数组全部到手</text>
  <text x="492" y="274" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">同一列 u 的三个距离，逐点判定即可</text>

  <!-- 底部：暴力 vs 翻转 对比 -->
  <rect x="30" y="378" width="265" height="74" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="162" y="398" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">暴力（不翻转）</text>
  <text x="162" y="418" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">外层 n 个 u × 每点求三距离 O(n)</text>
  <text x="162" y="438" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">总计 O(n²)，约百亿次运算，超时</text>

  <path d="M295,415 L345,415" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="403" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">翻转</text>

  <rect x="345" y="378" width="265" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="477" y="398" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">翻转循环（本题解法）</text>
  <text x="477" y="418" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">外层 3 个源 {x,y,z} × 一次 BFS 覆盖全部 u</text>
  <text x="477" y="438" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">总计 O(3n) = O(n)</text>
</svg>
