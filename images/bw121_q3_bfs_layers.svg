<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="352" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">BFS 按操作次数分层：第一次访问到 1 时的层号就是答案</text>
  <text x="40" y="80" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">第 0 层</text>
  <rect x="250" y="56" width="58" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="279" y="82" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">26</text>
  <text x="40" y="142" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">第 1 层</text>
  <rect x="180" y="118" width="58" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="209" y="144" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">25</text>
  <rect x="330" y="118" width="58" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="359" y="144" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">27</text>
  <text x="40" y="204" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">第 2 层</text>
  <rect x="90" y="180" width="58" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="119" y="206" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <rect x="240" y="180" width="58" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="269" y="206" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">24</text>
  <rect x="390" y="180" width="58" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="419" y="206" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">28</text>
  <text x="40" y="266" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">第 3 层</text>
  <rect x="90" y="242" width="58" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="119" y="268" text-anchor="middle" font-size="15" fill="#7a3030" filter="url(#rough2)">1</text>
  <rect x="240" y="242" width="58" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="269" y="268" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="390" y="242" width="58" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="419" y="268" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <path d="M279,96 L250,118" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M292,96 L330,118" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M209,158 L150,180" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M209,158 L240,180" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M330,158 L400,180" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M119,220 L119,242" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M260,220 L260,242" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="490" y="116" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">26−1</text>
  <text x="490" y="178" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">25÷5</text>
  <text x="160" y="236" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">5÷5</text>
  <rect x="50" y="300" width="460" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="325" text-anchor="middle" font-size="11.5" fill="#1c3a1c" filter="url(#rough2)">到达 1 用了 3 次操作；BFS 首次到达即最短，无需比较所有路径</text>
</svg>
