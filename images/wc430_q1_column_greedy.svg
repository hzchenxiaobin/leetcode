<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：列独立，逐格抬到 prev + 1</text>
  <path d="M 120 42 Q 320 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：4×2 矩阵，第 0 列高亮 -->
  <g font-size="10" fill="#888" text-anchor="end">
    <text x="42" y="85">i=0</text>
    <text x="42" y="121">i=1</text>
    <text x="42" y="157">i=2</text>
    <text x="42" y="193">i=3</text>
  </g>
  <g filter="url(#sk)">
    <rect x="48" y="64" width="46" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="48" y="100" width="46" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="48" y="136" width="46" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="48" y="172" width="46" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="96" y="64" width="46" height="34" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="96" y="100" width="46" height="34" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="96" y="136" width="46" height="34" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="96" y="172" width="46" height="34" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
  </g>
  <g font-size="13" text-anchor="middle" font-family="monospace">
    <text x="71" y="85" fill="#2b6e9e" font-weight="bold">3</text>
    <text x="71" y="121" fill="#2b6e9e" font-weight="bold">1</text>
    <text x="71" y="157" fill="#2b6e9e" font-weight="bold">3</text>
    <text x="71" y="193" fill="#2b6e9e" font-weight="bold">0</text>
    <text x="119" y="85" fill="#777">2</text>
    <text x="119" y="121" fill="#777">3</text>
    <text x="119" y="157" fill="#777">4</text>
    <text x="119" y="193" fill="#777">1</text>
  </g>
  <text x="95" y="224" text-anchor="middle" font-size="11" fill="#666">两列互不影响 → 逐列独立处理</text>

  <!-- 抽出第 0 列 -->
  <text x="182" y="106" text-anchor="middle" font-size="11" fill="#666">抽出第 0 列</text>
  <path d="M 152 116 L 212 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <!-- 右：贪心抬升表 -->
  <text x="422" y="50" text-anchor="middle" font-size="11" fill="#999">第 0 列：原值 → 终值（+操作数）</text>

  <g filter="url(#sk)">
    <rect x="225" y="62" width="56" height="34" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="225" y="110" width="56" height="34" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="225" y="158" width="56" height="34" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="225" y="206" width="56" height="34" rx="4" fill="#f2f2ee" stroke="#999999" stroke-width="1.2"/>
    <rect x="320" y="62" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="320" y="110" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="320" y="158" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="320" y="206" width="56" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="392" y="68" width="50" height="22" rx="11" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="392" y="116" width="50" height="22" rx="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="392" y="164" width="50" height="22" rx="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="392" y="212" width="50" height="22" rx="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <g font-size="13" text-anchor="middle" font-family="monospace">
    <text x="253" y="83" fill="#555">3</text>
    <text x="253" y="131" fill="#555">1</text>
    <text x="253" y="179" fill="#555">3</text>
    <text x="253" y="227" fill="#555">0</text>
    <text x="348" y="83" fill="#2b6e9e" font-weight="bold">3</text>
    <text x="348" y="131" fill="#2b6e9e" font-weight="bold">4</text>
    <text x="348" y="179" fill="#2b6e9e" font-weight="bold">5</text>
    <text x="348" y="227" fill="#2b6e9e" font-weight="bold">6</text>
  </g>
  <g font-size="12" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="417" y="83" fill="#2e6e2e">+0</text>
    <text x="417" y="131" fill="#b85450">+3</text>
    <text x="417" y="179" fill="#b85450">+2</text>
    <text x="417" y="227" fill="#b85450">+6</text>
  </g>
  <g font-size="11" font-family="monospace" fill="#888">
    <text x="452" y="83">v = max(3, −1+1) = 3</text>
    <text x="452" y="131">v = max(1, 4) = 4</text>
    <text x="452" y="179">v = max(3, 5) = 5</text>
    <text x="452" y="227">v = max(0, 6) = 6</text>
  </g>
  <g stroke="#3a3a3a" stroke-width="1.4" fill="none">
    <path d="M 284 79 L 313 79" marker-end="url(#ar)"/>
    <path d="M 284 127 L 313 127" marker-end="url(#ar)"/>
    <path d="M 284 175 L 313 175" marker-end="url(#ar)"/>
    <path d="M 284 223 L 313 223" marker-end="url(#ar)"/>
  </g>

  <!-- 贪心公式 -->
  <g filter="url(#sk)">
    <rect x="225" y="252" width="395" height="46" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="422" y="273" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">贪心转移：v = max(原值, prev + 1)，随后 prev = v</text>
  <text x="422" y="291" text-anchor="middle" font-size="11" fill="#b85450">prev 是上面一格的最终值 —— 拿原值比较是错的（连锁抬升）</text>
  <text x="320" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a">第 1 列同理：[2,3,4,1] → [2,3,4,5]，只补末格 +4</text>
</svg>
