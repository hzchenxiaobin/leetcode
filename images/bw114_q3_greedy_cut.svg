<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">T = 0：贪心最早切断（示例 [1,0,2,0,1,2]）</text>

  <!-- 数组格子 + 运行 AND -->
  <rect x="80"  y="56" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="150" y="56" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="220" y="56" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="290" y="56" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="360" y="56" width="60" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="180" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="250" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="320" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="390" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="430" y="56" width="60" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <!-- 运行 AND 值 -->
  <text x="110" y="122" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1</text>
  <text x="180" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">0 ✂</text>
  <text x="250" y="122" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">2</text>
  <text x="320" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">0 ✂</text>
  <text x="390" y="122" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">1</text>
  <text x="460" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">0 ✂</text>

  <!-- 剪刀标记（切割线） -->
  <path d="M 143 44 L 143 112" stroke="#b85450" stroke-width="2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 283 44 L 283 112" stroke="#b85450" stroke-width="2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 423 44 L 423 112" stroke="#b85450" stroke-width="2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- 段标注 -->
  <rect x="86"  y="140" width="112" height="28" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="159" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">段1 [1,0] 分数 0</text>
  <rect x="226" y="140" width="112" height="28" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="159" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">段2 [2,0] 分数 0</text>
  <rect x="366" y="140" width="112" height="28" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="159" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">段3 [1,2] 分数 0</text>

  <!-- 底部：尾部残余说明 -->
  <rect x="36" y="196" width="448" height="126" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="222" font-size="13" fill="#333" filter="url(#rough2)">尾部残余怎么办？如 [1,2,3,1]：切出 [1,2] 后剩 [3,1]，</text>
  <text x="56" y="244" font-size="13" fill="#333" filter="url(#rough2)">运行 AND = 3&amp;1 = 1 ≠ 0，切不动 → 并回最后一段</text>
  <text x="56" y="268" font-size="13" fill="#333" filter="url(#rough2)">并回后 0 &amp; 1 = 0，分数仍为 0，合法性不受影响</text>
  <text x="56" y="296" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">尽早切 ⇒ 每个切割点都不晚于任何其他方案（交换论证）</text>
</svg>
