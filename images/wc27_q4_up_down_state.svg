<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：连续路径必单调，最高点两侧各是一条单向链</text>
  <text x="300" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">树上路径 = 最高点向下两条链；相邻差恰为 ±1 ⇒ 两条链方向必然相反</text>

  <path d="M 50 258 L 95 190 L 150 120 L 205 190 L 250 258" fill="none"
        stroke="#b85450" stroke-width="7" stroke-linecap="round" opacity="0.22" filter="url(#rough2)"/>

  <g filter="url(#rough2)" stroke="#777" stroke-width="1.5" fill="none">
    <path d="M 141 138 L 104 172"/>
    <path d="M 159 138 L 196 172"/>
    <path d="M 86 208 L 59 240"/>
    <path d="M 214 208 L 241 240"/>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#666">
    <text x="102" y="150">−1</text>
    <text x="198" y="150">+1</text>
    <text x="56" y="218">−1</text>
    <text x="244" y="218">+1</text>
  </g>

  <text x="150" y="90" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">最高点 a</text>

  <g filter="url(#rough2)">
    <circle cx="150" cy="120" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="150" y="126" text-anchor="middle" font-size="14" fill="#7a5a10">3</text>
    <circle cx="95" cy="190" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="95" y="196" text-anchor="middle" font-size="14" fill="#3a5a30">2</text>
    <circle cx="50" cy="258" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="50" y="264" text-anchor="middle" font-size="14" fill="#3a5a30">1</text>
    <circle cx="205" cy="190" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="205" y="196" text-anchor="middle" font-size="14" fill="#334a66">4</text>
    <circle cx="250" cy="258" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="250" y="264" text-anchor="middle" font-size="14" fill="#334a66">5</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="322" y="78" width="252" height="90" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="338" y="101" font-size="12" fill="#3a4a66" font-weight="bold">up[v]：向下递增链</text>
    <text x="338" y="121" font-size="10" fill="#445">从 v 出发每步恰好 +1 的最长节点数</text>
    <text x="338" y="140" font-size="10.5" fill="#334a66">up[3] = 1 + up[4] = 3</text>
    <text x="338" y="158" font-size="10" fill="#668">路径 3 → 4 → 5</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="322" y="186" width="252" height="90" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="338" y="209" font-size="12" fill="#3a5a30" font-weight="bold">down[v]：向下递减链</text>
    <text x="338" y="229" font-size="10" fill="#445">从 v 出发每步恰好 −1 的最长节点数</text>
    <text x="338" y="248" font-size="10.5" fill="#3a5a30">down[3] = 1 + down[2] = 3</text>
    <text x="338" y="266" font-size="10" fill="#668">路径 3 → 2 → 1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="300" width="520" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="58" y="324" font-size="12" fill="#8a6a20">以 v 为最高点的最长连续路径长度 = up[v] + down[v] − 1</text>
    <text x="58" y="346" font-size="10.5" fill="#666">v = 3 时：3 + 3 − 1 = 5，即红色描边的路径 1 → 2 → 3 → 4 → 5</text>
  </g>
</svg>
