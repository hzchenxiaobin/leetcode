<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16.5" font-weight="bold"
        fill="#333" filter="url(#rough2)">示例 2 演算：s = "010101"（n = 6）</text>

  <text x="128" y="50" text-anchor="middle" font-size="11.5" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">b0</text>
  <text x="176" y="50" text-anchor="middle" font-size="11.5" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">b1</text>
  <text x="224" y="50" text-anchor="middle" font-size="11.5" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">b2</text>
  <text x="272" y="50" text-anchor="middle" font-size="11.5" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">b3</text>
  <text x="320" y="50" text-anchor="middle" font-size="11.5" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">b4</text>

  <line x1="128" y1="56" x2="128" y2="114" stroke="#b85450" stroke-width="2.2"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="176" y1="56" x2="176" y2="114" stroke="#b85450" stroke-width="2.2"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="224" y1="56" x2="224" y2="114" stroke="#b85450" stroke-width="2.2"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="272" y1="56" x2="272" y2="114" stroke="#b85450" stroke-width="2.2"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="320" y1="56" x2="320" y2="114" stroke="#b85450" stroke-width="2.2"
        stroke-dasharray="5 4" filter="url(#rough2)"/>

  <rect x="80" y="64" width="48" height="42" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="128" y="64" width="48" height="42" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="176" y="64" width="48" height="42" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="224" y="64" width="48" height="42" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="272" y="64" width="48" height="42" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="320" y="64" width="48" height="42" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="104" y="91" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#446688" filter="url(#rough2)">0</text>
  <text x="152" y="91" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">1</text>
  <text x="200" y="91" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#446688" filter="url(#rough2)">0</text>
  <text x="248" y="91" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">1</text>
  <text x="296" y="91" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#446688" filter="url(#rough2)">0</text>
  <text x="344" y="91" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">1</text>

  <text x="260" y="138" text-anchor="middle" font-size="12.5" fill="#b85450"
        filter="url(#rough2)">5 个边界全是差异边界（相邻字符均不等）</text>

  <rect x="60" y="158" width="390" height="198" rx="6" fill="#ffffff"
        stroke="#c8c8c8" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="60" y="158" width="390" height="28" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="341" y="187" width="107" height="167" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>

  <line x1="170" y1="158" x2="170" y2="356" stroke="#cccccc" stroke-width="1"
        filter="url(#rough2)"/>
  <line x1="260" y1="158" x2="260" y2="356" stroke="#cccccc" stroke-width="1"
        filter="url(#rough2)"/>
  <line x1="340" y1="158" x2="340" y2="356" stroke="#cccccc" stroke-width="1"
        filter="url(#rough2)"/>
  <line x1="60" y1="220" x2="450" y2="220" stroke="#cccccc" stroke-width="1"
        filter="url(#rough2)"/>
  <line x1="60" y1="254" x2="450" y2="254" stroke="#cccccc" stroke-width="1"
        filter="url(#rough2)"/>
  <line x1="60" y1="288" x2="450" y2="288" stroke="#cccccc" stroke-width="1"
        filter="url(#rough2)"/>
  <line x1="60" y1="322" x2="450" y2="322" stroke="#cccccc" stroke-width="1"
        filter="url(#rough2)"/>

  <text x="115" y="177" text-anchor="middle" font-size="12.5" font-weight="bold"
        fill="#446688" filter="url(#rough2)">边界 j</text>
  <text x="215" y="177" text-anchor="middle" font-size="12.5" font-weight="bold"
        fill="#446688" filter="url(#rough2)">前缀 j+1</text>
  <text x="300" y="177" text-anchor="middle" font-size="12.5" font-weight="bold"
        fill="#446688" filter="url(#rough2)">后缀 n−1−j</text>
  <text x="394" y="177" text-anchor="middle" font-size="12.5" font-weight="bold"
        fill="#446688" filter="url(#rough2)">取 min</text>

  <text x="115" y="209" text-anchor="middle" font-size="12.5" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">0</text>
  <text x="215" y="209" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">1</text>
  <text x="300" y="209" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">5</text>
  <text x="394" y="209" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">1</text>

  <text x="115" y="243" text-anchor="middle" font-size="12.5" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">1</text>
  <text x="215" y="243" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">2</text>
  <text x="300" y="243" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">4</text>
  <text x="394" y="243" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">2</text>

  <text x="115" y="277" text-anchor="middle" font-size="12.5" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">2</text>
  <text x="215" y="277" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">3</text>
  <text x="300" y="277" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">3</text>
  <text x="394" y="277" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">3</text>

  <text x="115" y="311" text-anchor="middle" font-size="12.5" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">3</text>
  <text x="215" y="311" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">4</text>
  <text x="300" y="311" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">2</text>
  <text x="394" y="311" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">2</text>

  <text x="115" y="345" text-anchor="middle" font-size="12.5" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">4</text>
  <text x="215" y="345" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">5</text>
  <text x="300" y="345" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">1</text>
  <text x="394" y="345" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">1</text>

  <rect x="95" y="376" width="330" height="36" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="399" text-anchor="middle" font-size="13.5" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">ans = 1+2+3+2+1 = 9 ✓ 与示例 2 一致</text>

  <text x="260" y="428" text-anchor="middle" font-size="12" fill="#888"
        filter="url(#rough2)">两条单价之和恒为 n：(j+1) + (n−1−j) = n</text>
  <text x="260" y="448" text-anchor="middle" font-size="12" fill="#888"
        filter="url(#rough2)">min 自动选短的一段，单价呈金字塔 1, 2, 3, 2, 1</text>
</svg>
