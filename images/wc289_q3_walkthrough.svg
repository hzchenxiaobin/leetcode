<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="900" height="660" fill="#fafafa"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：转角 (3,2) 的四个满臂组合</text>
  <path d="M 260 42 Q 450 52 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- column labels -->
  <text x="116" y="95" text-anchor="middle" font-size="10.5" fill="#888">j=0</text>
  <text x="168" y="95" text-anchor="middle" font-size="10.5" fill="#888">j=1</text>
  <text x="220" y="95" text-anchor="middle" font-size="10.5" fill="#888">j=2</text>
  <text x="272" y="95" text-anchor="middle" font-size="10.5" fill="#888">j=3</text>
  <text x="324" y="95" text-anchor="middle" font-size="10.5" fill="#888">j=4</text>
  <!-- row labels -->
  <text x="80" y="131" text-anchor="end" font-size="10.5" fill="#888">i=0</text>
  <text x="80" y="183" text-anchor="end" font-size="10.5" fill="#888">i=1</text>
  <text x="80" y="235" text-anchor="end" font-size="10.5" fill="#888">i=2</text>
  <text x="80" y="287" text-anchor="end" font-size="10.5" fill="#888">i=3</text>
  <text x="80" y="339" text-anchor="end" font-size="10.5" fill="#888">i=4</text>

  <!-- 5x5 grid, cell 52, origin (90,100) -->
  <g filter="url(#sk2)">
    <!-- white cells -->
    <rect x="90" y="100" width="52" height="52" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="142" y="100" width="52" height="52" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="246" y="100" width="52" height="52" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="298" y="100" width="52" height="52" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="90" y="152" width="52" height="52" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="142" y="152" width="52" height="52" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="246" y="152" width="52" height="52" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="298" y="152" width="52" height="52" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="90" y="204" width="52" height="52" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="142" y="204" width="52" height="52" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="246" y="204" width="52" height="52" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="298" y="204" width="52" height="52" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="90" y="308" width="52" height="52" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="142" y="308" width="52" height="52" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="246" y="308" width="52" height="52" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="298" y="308" width="52" height="52" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <!-- up arm: col 2, rows 0..2 (green, 含转角延伸至行3) -->
    <rect x="194" y="100" width="52" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="194" y="152" width="52" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="194" y="204" width="52" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <!-- down arm: col 2, row 4 (green) -->
    <rect x="194" y="308" width="52" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <!-- left arm: row 3, cols 0..1 (blue) -->
    <rect x="90" y="256" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="142" y="256" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <!-- right arm: row 3, cols 3..4 (blue) -->
    <rect x="246" y="256" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="298" y="256" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <!-- corner: (3,2) (orange) -->
    <rect x="194" y="256" width="52" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <!-- cell values -->
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="116" y="135">23</text><text x="168" y="135">17</text><text x="220" y="135" font-size="12.5" font-weight="bold" fill="#2e5e22">15</text><text x="272" y="135">3</text><text x="324" y="135">20</text>
    <text x="116" y="187">8</text><text x="168" y="187">1</text><text x="220" y="187" font-size="12.5" font-weight="bold" fill="#2e5e22">20</text><text x="272" y="187">27</text><text x="324" y="187">11</text>
    <text x="116" y="239">9</text><text x="168" y="239">4</text><text x="220" y="239" font-size="12.5" font-weight="bold" fill="#2e5e22">6</text><text x="272" y="239">2</text><text x="324" y="239">21</text>
    <text x="116" y="291" font-size="12.5" font-weight="bold" fill="#2b4a6e">40</text><text x="168" y="291" font-size="12.5" font-weight="bold" fill="#2b4a6e">9</text><text x="220" y="291" font-size="14" font-weight="bold" fill="#7a5415">1</text><text x="272" y="291" font-size="12.5" font-weight="bold" fill="#2b4a6e">10</text><text x="324" y="291" font-size="12.5" font-weight="bold" fill="#2b4a6e">6</text>
    <text x="116" y="343">22</text><text x="168" y="343">7</text><text x="220" y="343" font-size="12.5" font-weight="bold" fill="#2e5e22">4</text><text x="272" y="343">5</text><text x="324" y="343">3</text>
  </g>

  <!-- left legend -->
  <g filter="url(#sk2)">
    <rect x="90" y="384" width="20" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="90" y="414" width="20" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="90" y="444" width="20" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="118" y="399" font-size="11.5" fill="#444">转角 (3,2)：值 1，自身 (v₂,v₅)=(0,0)</text>
  <text x="118" y="429" font-size="11.5" fill="#444">水平臂：行 i 上的满臂（左/右）</text>
  <text x="118" y="459" font-size="11.5" fill="#444">竖直臂：列 j 上的满臂（上/下）</text>

  <!-- four-arm table -->
  <text x="630" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">四条满臂（均含转角）</text>
  <g filter="url(#sk2)">
    <rect x="390" y="100" width="480" height="148" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/>
    <rect x="390" y="100" width="480" height="28" rx="6" fill="#e8f0fa" stroke="#8a8a8a" stroke-width="1.3"/>
    <line x1="390" y1="158" x2="870" y2="158" stroke="#c8c8c8" stroke-width="1"/>
    <line x1="390" y1="188" x2="870" y2="188" stroke="#c8c8c8" stroke-width="1"/>
    <line x1="390" y1="218" x2="870" y2="218" stroke="#c8c8c8" stroke-width="1"/>
    <line x1="530" y1="100" x2="530" y2="248" stroke="#c8c8c8" stroke-width="1"/>
    <line x1="710" y1="100" x2="710" y2="248" stroke="#c8c8c8" stroke-width="1"/>
  </g>
  <g font-size="11.5" text-anchor="middle">
    <text x="460" y="119" font-weight="bold" fill="#2b4a6e">满臂</text>
    <text x="620" y="119" font-weight="bold" fill="#2b4a6e">格值</text>
    <text x="790" y="119" font-weight="bold" fill="#2b4a6e">(v₂,v₅) 之和</text>
    <text x="460" y="147" font-weight="bold" fill="#2b4a6e">左臂（行3 列0..2）</text><text x="620" y="147" fill="#444">40,9,1</text><text x="790" y="147" font-weight="bold" fill="#333">(3,1)</text>
    <text x="460" y="177" font-weight="bold" fill="#2b4a6e">右臂（行3 列2..4）</text><text x="620" y="177" fill="#444">1,10,6</text><text x="790" y="177" font-weight="bold" fill="#333">(2,1)</text>
    <text x="460" y="207" font-weight="bold" fill="#2e5e22">上臂（列2 行0..3）</text><text x="620" y="207" fill="#444">15,20,6,1</text><text x="790" y="207" font-weight="bold" fill="#333">(3,2)</text>
    <text x="460" y="237" font-weight="bold" fill="#2e5e22">下臂（列2 行3..4）</text><text x="620" y="237" fill="#444">1,4</text><text x="790" y="237" font-weight="bold" fill="#333">(2,0)</text>
  </g>

  <!-- combination table -->
  <text x="630" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">4 种组合：total = H + V − c</text>
  <g filter="url(#sk2)">
    <rect x="390" y="292" width="480" height="148" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/>
    <rect x="390" y="292" width="480" height="28" rx="6" fill="#fef6e6" stroke="#8a8a8a" stroke-width="1.3"/>
    <rect x="390" y="380" width="480" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <line x1="390" y1="350" x2="870" y2="350" stroke="#c8c8c8" stroke-width="1"/>
    <line x1="390" y1="380" x2="870" y2="380" stroke="#c8c8c8" stroke-width="1"/>
    <line x1="390" y1="410" x2="870" y2="410" stroke="#c8c8c8" stroke-width="1"/>
    <line x1="510" y1="292" x2="510" y2="440" stroke="#c8c8c8" stroke-width="1"/>
    <line x1="630" y1="292" x2="630" y2="440" stroke="#c8c8c8" stroke-width="1"/>
    <line x1="750" y1="292" x2="750" y2="440" stroke="#c8c8c8" stroke-width="1"/>
  </g>
  <g font-size="11.5" text-anchor="middle">
    <text x="450" y="311" font-weight="bold" fill="#7a5415">组合</text>
    <text x="570" y="311" font-weight="bold" fill="#7a5415">total₂</text>
    <text x="690" y="311" font-weight="bold" fill="#7a5415">total₅</text>
    <text x="810" y="311" font-weight="bold" fill="#7a5415">min</text>
    <text x="450" y="339" fill="#333">左+上</text><text x="570" y="339" fill="#333">6</text><text x="690" y="339" fill="#333">3</text><text x="810" y="339" fill="#333">3</text>
    <text x="450" y="369" fill="#333">左+下</text><text x="570" y="369" fill="#333">5</text><text x="690" y="369" fill="#333">1</text><text x="810" y="369" fill="#333">1</text>
    <text x="450" y="399" font-weight="bold" fill="#7a5415">右+上</text><text x="570" y="399" font-weight="bold" fill="#7a5415">5</text><text x="690" y="399" font-weight="bold" fill="#7a5415">3</text><text x="810" y="399" font-weight="bold" fill="#8a3a36">3（最优）</text>
    <text x="450" y="429" fill="#333">右+下</text><text x="570" y="429" fill="#333">4</text><text x="690" y="429" fill="#333">1</text><text x="810" y="429" fill="#333">1</text>
  </g>
  <text x="630" y="458" text-anchor="middle" font-size="10.5" fill="#888">两臂前缀和各含转角一次 → total 减去一份 c（此处 c = (0,0)）</text>

  <!-- bottom note -->
  <g filter="url(#sk2)">
    <rect x="60" y="496" width="780" height="76" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="450" y="522" text-anchor="middle" font-size="11.5" fill="#7a5415">官方解释的路径 15→20→6→1→10 正是「右+上」去掉末格 (3,4)=6 的情形：</text>
  <text x="450" y="546" text-anchor="middle" font-size="11.5" fill="#7a5415">满臂多带的 6 让 v₂ +1、v₅ 不变，min 仍为 3 —— 「满臂不降」的直接体现。</text>

  <!-- answer box -->
  <g filter="url(#sk2)">
    <rect x="60" y="588" width="780" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="450" y="617" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">该转角最优 = 3；全场答案 = 3（与示例 1 输出一致）</text>
</svg>
