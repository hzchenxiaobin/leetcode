<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：排序后相邻配对，答案是偶数下标之和</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个被计入答案的元素，都要牺牲一个不比它小的元素</text>

  <text x="60" y="76" font-size="10" fill="#888" filter="url(#rough2)">原始 nums</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="104" y="84" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="130" y="106" fill="#3a4a66">6</text>
    <rect x="164" y="84" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="190" y="106" fill="#3a4a66">2</text>
    <rect x="224" y="84" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="250" y="106" fill="#3a4a66">6</text>
    <rect x="284" y="84" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="310" y="106" fill="#3a4a66">5</text>
    <rect x="344" y="84" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="370" y="106" fill="#3a4a66">1</text>
    <rect x="404" y="84" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="430" y="106" fill="#3a4a66">2</text>
  </g>

  <path d="M 280 122 L 280 148" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="140" font-size="10" fill="#666" filter="url(#rough2)">升序排序</text>

  <text x="60" y="176" font-size="10" fill="#888" filter="url(#rough2)">排序后 a₀ … a₅</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="104" y="184" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="130" y="206" fill="#3a5a30">1</text>
    <rect x="164" y="184" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="190" y="206" fill="#3a5a30">2</text>
    <rect x="224" y="184" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="250" y="206" fill="#3a5a30">2</text>
    <rect x="284" y="184" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="310" y="206" fill="#8a6a20">5</text>
    <rect x="344" y="184" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="370" y="206" fill="#3a5a30">6</text>
    <rect x="404" y="184" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5"/>
    <text x="430" y="206" fill="#8a6a20">6</text>
  </g>

  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.6" fill="none">
    <path d="M 104 224 L 104 232 L 216 232 L 216 224"/>
    <path d="M 224 224 L 224 232 L 336 232 L 336 224"/>
    <path d="M 344 224 L 344 232 L 456 232 L 456 224"/>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#3a5a30">
    <text x="160" y="250">取 min = 1</text>
    <text x="280" y="250">取 min = 2</text>
    <text x="400" y="250">取 min = 6</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="272" width="230" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="56" y="292" font-size="10.5" fill="#3a5a30" font-weight="bold">相邻配对（最优）</text>
    <text x="56" y="310" font-size="10" fill="#555">(1,2) (2,5) (6,6)</text>
    <text x="56" y="328" font-size="10" fill="#3a5a30">1 + 2 + 6 = 9 ✓</text>

    <rect x="290" y="272" width="230" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
    <text x="306" y="292" font-size="10.5" fill="#8a3a36" font-weight="bold">交错配对（更差）</text>
    <text x="306" y="310" font-size="10" fill="#555">(1,6) (2,6) (2,5)</text>
    <text x="306" y="328" font-size="10" fill="#8a3a36">1 + 2 + 2 = 5 ✗</text>
  </g>

  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">结论：升序排序后答案即 a₀ + a₂ + a₄ + …，总复杂度 O(n log n)</text>
</svg>
