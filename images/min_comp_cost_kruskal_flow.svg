<svg xmlns="http://www.w3.org/2000/svg" width="660" height="560" viewBox="0 0 660 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="560" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：Kruskal 式升序扫描</text>
  <path d="M 200 40 Q 330 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <rect x="225" y="52" width="210" height="48" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="330" y="73" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">comp = n（初始 n 个分量）</text>
  <text x="330" y="90" text-anchor="middle" font-size="11" fill="#2b6e9e" filter="url(#sk)">若 comp ≤ k → 直接返回 0</text>
  <path d="M 330 100 L 330 120" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 排序 -->
  <rect x="225" y="122" width="210" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" filter="url(#sk)"/>
  <text x="330" y="146" text-anchor="middle" font-size="12.5" fill="#2b6e9e" filter="url(#sk)">edges 按边权 w 升序排序</text>
  <path d="M 330 160 L 330 182" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 取边 -->
  <rect x="225" y="184" width="210" height="38" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5" filter="url(#sk)"/>
  <text x="330" y="208" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">取出下一条最小边 (u, v, w)</text>
  <path d="M 330 222 L 330 246" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判断1 -->
  <polygon points="330,250 432,290 330,330 228,290" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="330" y="287" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">find(u) ≠ find(v) ?</text>
  <text x="330" y="305" text-anchor="middle" font-size="10" fill="#a07840" filter="url(#sk)">两端已同分量？</text>
  <text x="341" y="345" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <path d="M 330 330 L 330 352" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 合并 -->
  <rect x="225" y="354" width="210" height="38" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="330" y="378" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#sk)">union(u, v)，comp ← comp − 1</text>
  <path d="M 330 392 L 330 414" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判断2 -->
  <polygon points="330,416 424,452 330,488 236,452" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="330" y="449" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">comp ≤ k ?</text>
  <text x="330" y="466" text-anchor="middle" font-size="10" fill="#a07840" filter="url(#sk)">分量数够少了？</text>

  <!-- 是 → 返回 -->
  <text x="443" y="445" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <path d="M 424 452 L 468 452" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <rect x="470" y="430" width="160" height="44" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="550" y="448" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 w ✓</text>
  <text x="550" y="466" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">w = 最小可行阈值</text>

  <!-- 否 → 循环 -->
  <text x="222" y="441" font-size="11" font-weight="bold" fill="#a07840" filter="url(#sk)">否</text>
  <path d="M 236 452 L 185 452 L 185 203 L 221 203" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="170" y="330" transform="rotate(-90 170 330)" text-anchor="middle" font-size="10.5" fill="#a07840" filter="url(#sk)">comp 仍 &gt; k，继续</text>

  <!-- 冗余边 → 循环 -->
  <text x="512" y="250" font-size="10.5" fill="#a07840" filter="url(#sk)">否（冗余边）</text>
  <path d="M 432 290 L 505 290 L 505 203 L 439 203" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 底注 -->
  <rect x="95" y="512" width="470" height="40" rx="8" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="330" y="528" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">输入图连通：边全部加完后 comp = 1 ≤ k，必在循环内返回；</text>
  <text x="330" y="544" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">k ≥ n 的情形已在起点返回 0。</text>
</svg>
