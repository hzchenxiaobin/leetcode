<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：压缩 + 跳跃式贪心</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">O(n + time)，比枚举子集快无数倍</text>
  <rect x="130.0" y="62.0" width="300.0" height="40.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="85.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">① reach[s] = max(终点)，截断到 time</text>
  <path d="M 280.0 102.0 L 280.0 120.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130.0" y="120.0" width="300.0" height="40.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="143.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">② farthest = max(farthest, reach[i])</text>
  <path d="M 280.0 160.0 L 280.0 180.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="180.0" width="260.0" height="40.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="203.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">③ i == cur ?</text>
  <path d="M 410.0 200.0 L 428.0 200.0" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="428.0" y="180.0" width="120.0" height="40.0" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="488.0" y="203.2" font-size="9" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">否：继续 i++</text>
  <path d="M 280.0 220.0 L 280.0 244.0" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290.0" y="238.0" font-size="9" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">是</text>
  <rect x="150.0" y="244.0" width="260.0" height="52.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="266.5" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">farthest &lt;= cur ? → -1</text>
  <text x="280.0" y="280.3" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">否则 cur = farthest，ans++</text>
  <text x="25.0" y="330.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">扫描到 i = time-1 为止；ans 即最少片段数。</text>
</svg>
