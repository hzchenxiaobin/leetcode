<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：三个 word 的 z 贡献 → mn → 分层扩张</text>

  <!-- 死点列底色：列 3、4、7，列 x = 100 + 44p -->
  <g filter="url(#rough2)">
    <rect x="232" y="40" width="44" height="136" fill="#fce4ec" opacity="0.5"/>
    <rect x="276" y="40" width="44" height="136" fill="#fce4ec" opacity="0.5"/>
    <rect x="408" y="40" width="44" height="136" fill="#fce4ec" opacity="0.5"/>
  </g>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="28" y="40" width="424" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="64" y="54" text-anchor="middle" font-size="10" fill="#33507a">起点 j</text>
    <text x="122" y="54" text-anchor="middle" font-size="10" fill="#33507a">0</text>
    <text x="166" y="54" text-anchor="middle" font-size="10" fill="#33507a">1</text>
    <text x="210" y="54" text-anchor="middle" font-size="10" fill="#33507a">2</text>
    <text x="254" y="54" text-anchor="middle" font-size="10" fill="#8a3a34">3</text>
    <text x="298" y="54" text-anchor="middle" font-size="10" fill="#8a3a34">4</text>
    <text x="342" y="54" text-anchor="middle" font-size="10" fill="#33507a">5</text>
    <text x="386" y="54" text-anchor="middle" font-size="10" fill="#33507a">6</text>
    <text x="430" y="54" text-anchor="middle" font-size="10" fill="#8a3a34">7</text>
  </g>

  <!-- 各行：target / z(aaaaa) / z(abc) / z(bcdef) -->
  <g filter="url(#rough2)">
    <rect x="28" y="60" width="424" height="22" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <text x="64" y="76" text-anchor="middle" font-size="10" fill="#666">target</text>
    <text x="122" y="76" text-anchor="middle" font-size="12" fill="#333">a</text>
    <text x="166" y="76" text-anchor="middle" font-size="12" fill="#333">a</text>
    <text x="210" y="76" text-anchor="middle" font-size="12" fill="#333">b</text>
    <text x="254" y="76" text-anchor="middle" font-size="12" fill="#333">c</text>
    <text x="298" y="76" text-anchor="middle" font-size="12" fill="#333">d</text>
    <text x="342" y="76" text-anchor="middle" font-size="12" fill="#333">a</text>
    <text x="386" y="76" text-anchor="middle" font-size="12" fill="#333">b</text>
    <text x="430" y="76" text-anchor="middle" font-size="12" fill="#333">c</text>

    <rect x="28" y="82" width="424" height="22" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <text x="64" y="98" text-anchor="middle" font-size="10" fill="#666">z·aaaaa</text>
    <rect x="102" y="84" width="40" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="122" y="98" text-anchor="middle" font-size="12" fill="#2f5524" font-weight="bold">2</text>
    <text x="166" y="98" text-anchor="middle" font-size="12" fill="#777">1</text>
    <text x="210" y="98" text-anchor="middle" font-size="12" fill="#777">0</text>
    <text x="254" y="98" text-anchor="middle" font-size="12" fill="#777">0</text>
    <text x="298" y="98" text-anchor="middle" font-size="12" fill="#777">0</text>
    <text x="342" y="98" text-anchor="middle" font-size="12" fill="#777">1</text>
    <text x="386" y="98" text-anchor="middle" font-size="12" fill="#777">0</text>
    <text x="430" y="98" text-anchor="middle" font-size="12" fill="#777">0</text>

    <rect x="28" y="104" width="424" height="22" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <text x="64" y="120" text-anchor="middle" font-size="10" fill="#666">z·abc</text>
    <text x="122" y="120" text-anchor="middle" font-size="12" fill="#777">1</text>
    <rect x="146" y="106" width="40" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="166" y="120" text-anchor="middle" font-size="12" fill="#2f5524" font-weight="bold">3</text>
    <text x="210" y="120" text-anchor="middle" font-size="12" fill="#777">0</text>
    <text x="254" y="120" text-anchor="middle" font-size="12" fill="#777">0</text>
    <text x="298" y="120" text-anchor="middle" font-size="12" fill="#777">0</text>
    <rect x="322" y="106" width="40" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="342" y="120" text-anchor="middle" font-size="12" fill="#2f5524" font-weight="bold">3</text>
    <text x="386" y="120" text-anchor="middle" font-size="12" fill="#777">0</text>
    <text x="430" y="120" text-anchor="middle" font-size="12" fill="#777">0</text>

    <rect x="28" y="126" width="424" height="22" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <text x="64" y="142" text-anchor="middle" font-size="10" fill="#666">z·bcdef</text>
    <text x="122" y="142" text-anchor="middle" font-size="12" fill="#777">0</text>
    <text x="166" y="142" text-anchor="middle" font-size="12" fill="#777">0</text>
    <rect x="190" y="128" width="40" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="210" y="142" text-anchor="middle" font-size="12" fill="#2f5524" font-weight="bold">3</text>
    <text x="254" y="142" text-anchor="middle" font-size="12" fill="#777">0</text>
    <text x="298" y="142" text-anchor="middle" font-size="12" fill="#777">0</text>
    <text x="342" y="142" text-anchor="middle" font-size="12" fill="#777">0</text>
    <rect x="366" y="128" width="40" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="386" y="142" text-anchor="middle" font-size="12" fill="#2f5524" font-weight="bold">2</text>
    <text x="430" y="142" text-anchor="middle" font-size="12" fill="#777">0</text>
  </g>

  <!-- mn 行 -->
  <g filter="url(#rough2)">
    <rect x="28" y="148" width="424" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="64" y="167" text-anchor="middle" font-size="10.5" fill="#7a5410" font-weight="bold">mn = max</text>
    <text x="122" y="167" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <text x="166" y="167" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
    <text x="210" y="167" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
    <text x="254" y="167" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
    <text x="298" y="167" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
    <text x="342" y="167" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
    <text x="386" y="167" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <text x="430" y="167" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  </g>

  <!-- 分层扩张链 -->
  <text x="260" y="200" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">每层在窗口 [0, R] 内取 max(i + mn[i])：</text>

  <g filter="url(#rough2)">
    <rect x="36" y="210" width="72" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="72" y="233" text-anchor="middle" font-size="11" fill="#33507a">R₀ = 0</text>
    <line x1="112" y1="228" x2="134" y2="228" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="123" y="246" text-anchor="middle" font-size="9" fill="#666">层1</text>
    <rect x="138" y="210" width="96" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="186" y="233" text-anchor="middle" font-size="11" fill="#2f5524">R₁ = 0+2 = 2</text>
    <line x1="238" y1="228" x2="260" y2="228" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="249" y="246" text-anchor="middle" font-size="9" fill="#666">层2</text>
    <rect x="264" y="210" width="96" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="312" y="233" text-anchor="middle" font-size="11" fill="#2f5524">R₂ = 2+3 = 5</text>
    <line x1="364" y1="228" x2="386" y2="228" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="375" y="246" text-anchor="middle" font-size="9" fill="#666">层3</text>
    <rect x="390" y="210" width="102" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="441" y="233" text-anchor="middle" font-size="10.5" fill="#7a5410" font-weight="bold">R₃ = 5+3 = 8 ≥ n</text>
  </g>

  <!-- 答案框 -->
  <rect x="140" y="258" width="240" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="13" fill="#7a5410" font-weight="bold" filter="url(#rough2)">答案 3：aa | bcd | abc</text>

  <!-- 底部说明框 -->
  <rect x="28" y="302" width="464" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">死点 3、4、7 全被绕开——分层贪心只看每层窗口内的 max(i + mn[i])</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">与 Q3 的 Trie 演算表对照：同一张 mn，不同引擎算出</text>
</svg>
