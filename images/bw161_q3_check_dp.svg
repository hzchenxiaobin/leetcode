<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="420" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">示例演算：二分阈值后只需在 DAG 上跑一次 DP</text>
  <text x="170" y="66" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">check(5) 不可行</text>
  <path d="M 70 130 L 190 96" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120.0" y="109.0" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">5</text>
  <path d="M 190 96 L 300 136" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="235.0" y="112.0" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">10</text>
  <path d="M 70 130 L 190 176" fill="none" stroke="#cccccc" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120.0" y="149.0" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">3</text>
  <path d="M 190 176 L 300 136" fill="none" stroke="#cccccc" stroke-width="1.3" stroke-dasharray="5 5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="235.0" y="152.0" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">4</text>
  <rect x="52" y="112" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70.0" y="134.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="172" y="78" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190.0" y="100.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="172" y="158" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190.0" y="180.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="282" y="118" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300.0" y="140.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="170" y="218" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">0→1→3 成本 15 &gt; k ✗</text>
  <text x="520" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">check(3) 可行</text>
  <path d="M 440 130 L 560 96" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492.0" y="109.0" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <path d="M 560 96 L 670 136" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="607.0" y="112.0" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">10</text>
  <path d="M 440 130 L 560 176" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492.0" y="149.0" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <path d="M 560 176 L 670 136" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="607.0" y="152.0" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <rect x="422" y="112" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440.0" y="134.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="542" y="78" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="560.0" y="100.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="542" y="158" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="560.0" y="180.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="652" y="118" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="670.0" y="140.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="520" y="218" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0→2→3 成本 7 ≤ k ✓，分数 min(3,4) = 3</text>
  <rect x="60" y="250" width="580" height="140" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="278" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">拓扑序 0 → 1 → 2 → 3 上的 DP（阈值 3）</text>
  <text x="110" y="308" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">节点</text>
  <text x="230" y="308" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">0</text>
  <text x="350" y="308" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">1</text>
  <text x="470" y="308" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">2</text>
  <text x="590" y="308" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">3</text>
  <text x="110" y="340" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">dist</text>
  <text x="230" y="340" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="350" y="340" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="470" y="340" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="590" y="340" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="110" y="370" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是否在线</text>
  <text x="230" y="370" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="350" y="370" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="470" y="370" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="590" y="370" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>
</svg>
