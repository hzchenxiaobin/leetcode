<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：先扫 nums2 建表，再按 nums1 查表</text>
  <text x="290" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">while 循环把「还没等到答案」的元素留在栈里，弹出时答案已经确定</text>

  <rect x="170" y="58" width="210" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="275" y="79" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">x = nums2[i]（i 从左到右）</text>

  <path d="M 275 90 L 275 100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="275,102 400,140 275,178 150,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="275" y="145" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">栈非空 且 栈顶 &lt; x ？</text>

  <path d="M 402 140 L 414 140" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="132" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="420" y="112" width="140" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="490" y="134" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">弹出 t</text>
  <text x="490" y="153" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">nxt[t] = x</text>

  <path d="M 490 112 L 490 72 L 382 72" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="418" y="64" font-size="9" fill="#888" filter="url(#rough2)">回到同一个 x 继续弹</text>

  <path d="M 275 178 L 275 196" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="286" y="192" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="190" y="200" width="170" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="275" y="221" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">压入 x</text>

  <path d="M 275 232 L 275 266" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="275,270 380,306 275,342 170,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="275" y="311" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">i &lt; n ？</text>

  <path d="M 170 306 L 130 306 L 130 74 L 166 74" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="152" y="296" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 275 342 L 275 368" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="286" y="360" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="148" y="372" width="254" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="275" y="392" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">查表：对 nums1 中每个 v</text>
  <text x="275" y="410" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">ans[i] = nxt[v]，缺省为 −1</text>

  <text x="290" y="444" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">压栈前先弹出所有比 x 小的栈顶；每个元素只进栈一次，循环总次数 O(n)</text>
</svg>
