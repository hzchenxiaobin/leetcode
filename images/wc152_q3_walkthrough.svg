<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "abcda" 的五个查询</text>
  <text x="280" y="49" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">先建前缀掩码表，再对每个查询做一次异或 + 一次数位计数</text>

  <text x="40" y="72" font-size="10.5" fill="#666" filter="url(#rough2)">前缀掩码 pre[i]（读入 s[0..i) 之后；方框上为 i，方框内为十进制值）</text>

  <rect x="68" y="82" width="42" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="89" y="97" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">i=0</text>
  <text x="89" y="114" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="114" y="82" width="42" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="135" y="97" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">i=1</text>
  <text x="135" y="114" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="160" y="82" width="42" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="181" y="97" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">i=2</text>
  <text x="181" y="114" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="206" y="82" width="42" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="227" y="97" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">i=3</text>
  <text x="227" y="114" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">7</text>

  <rect x="252" y="82" width="42" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="273" y="97" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">i=4</text>
  <text x="273" y="114" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">15</text>

  <rect x="298" y="82" width="42" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="319" y="97" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">i=5</text>
  <text x="319" y="114" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">14</text>

  <text x="360" y="100" font-size="10" fill="#4a7a3a" filter="url(#rough2)">a b c d a 依次读入</text>
  <text x="360" y="118" font-size="10" fill="#4a7a3a" filter="url(#rough2)">末尾 a：15 ^ 1 = 14</text>

  <rect x="40" y="140" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="130" y="160" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">查询 [l, r], k</text>
  <text x="240" y="160" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">区间掩码</text>
  <text x="325" y="160" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">odd</text>
  <text x="390" y="160" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">odd//2</text>
  <text x="445" y="160" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="505" y="160" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">答案</text>

  <rect x="40" y="170" width="500" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="130" y="190" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">[3, 3], 0</text>
  <text x="240" y="190" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">0b1000</text>
  <text x="325" y="190" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="390" y="190" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">0</text>
  <text x="445" y="190" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">0</text>
  <text x="505" y="190" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <rect x="40" y="200" width="500" height="30" fill="#f3f6f9" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="130" y="220" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">[1, 2], 0</text>
  <text x="240" y="220" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">0b0110</text>
  <text x="325" y="220" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="390" y="220" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="445" y="220" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">0</text>
  <text x="505" y="220" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <rect x="40" y="230" width="500" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="130" y="250" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">[0, 3], 1</text>
  <text x="240" y="250" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">0b1111</text>
  <text x="325" y="250" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">4</text>
  <text x="390" y="250" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="445" y="250" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="505" y="250" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <rect x="40" y="260" width="500" height="30" fill="#f3f6f9" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="130" y="280" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">[0, 3], 2</text>
  <text x="240" y="280" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">0b1111</text>
  <text x="325" y="280" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">4</text>
  <text x="390" y="280" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="445" y="280" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="505" y="280" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <rect x="40" y="290" width="500" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="130" y="310" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">[0, 4], 1</text>
  <text x="240" y="310" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">0b1110</text>
  <text x="325" y="310" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">3</text>
  <text x="390" y="310" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="445" y="310" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="505" y="310" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <rect x="60" y="338" width="440" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">输出 [true, false, false, true, true] 与官方一致</text>
  <text x="280" y="384" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">注意 [0,3] 与 [0,4] 的掩码差一位：末尾的 a 把 bit0 抵消掉了</text>
</svg>
