<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="660" height="560" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：arr = ["cab","ad","bad","c"]</text>
  <path d="M 150 36 Q 330 44 510 36" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- legend -->
  <g filter="url(#r)"><rect x="112" y="52" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="132" y="64" font-size="11.5" fill="#555" filter="url(#r)">cnt = 1 非公共（候选）</text>
  <g filter="url(#r)"><rect x="288" y="52" width="14" height="14" rx="3" fill="#eeeeee" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="308" y="64" font-size="11.5" fill="#555" filter="url(#r)">cnt ≥ 2 公共（淘汰）</text>
  <g filter="url(#r)"><rect x="438" y="52" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="458" y="64" font-size="11.5" fill="#555" filter="url(#r)">最终答案</text>

  <!-- Row 1: "cab" -->
  <g filter="url(#r)"><rect x="30" y="100" width="72" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="66" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#r)">"cab"</text>

  <g filter="url(#r)"><rect x="115" y="100" width="62" height="34" rx="4" fill="#eeeeee" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="146" y="122" text-anchor="middle" font-size="12" fill="#777" filter="url(#r)">c : 2</text>
  <g filter="url(#r)"><rect x="183" y="100" width="62" height="34" rx="4" fill="#eeeeee" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="214" y="122" text-anchor="middle" font-size="12" fill="#777" filter="url(#r)">a : 3</text>
  <g filter="url(#r)"><rect x="251" y="100" width="62" height="34" rx="4" fill="#eeeeee" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="282" y="122" text-anchor="middle" font-size="12" fill="#777" filter="url(#r)">b : 2</text>
  <g filter="url(#r)"><rect x="319" y="100" width="62" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="350" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">ca : 1</text>
  <g filter="url(#r)"><rect x="387" y="100" width="62" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="418" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a3230" filter="url(#r)">ab : 1</text>
  <g filter="url(#r)"><rect x="455" y="100" width="62" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="486" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">cab : 1</text>

  <path d="M 521 117 L 543 117" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#r)"/>
  <g filter="url(#r)"><rect x="546" y="100" width="86" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="589" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a3230" filter="url(#r)">"ab"</text>

  <!-- Row 2: "ad" -->
  <g filter="url(#r)"><rect x="30" y="180" width="72" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="66" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#r)">"ad"</text>

  <g filter="url(#r)"><rect x="115" y="180" width="62" height="34" rx="4" fill="#eeeeee" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="146" y="202" text-anchor="middle" font-size="12" fill="#777" filter="url(#r)">a : 3</text>
  <g filter="url(#r)"><rect x="183" y="180" width="62" height="34" rx="4" fill="#eeeeee" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="214" y="202" text-anchor="middle" font-size="12" fill="#777" filter="url(#r)">d : 2</text>
  <g filter="url(#r)"><rect x="251" y="180" width="62" height="34" rx="4" fill="#eeeeee" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="282" y="202" text-anchor="middle" font-size="12" fill="#777" filter="url(#r)">ad : 2</text>

  <text x="350" y="202" font-size="11.5" fill="#999" filter="url(#r)">← 全部是公共子串，没有候选</text>
  <path d="M 521 197 L 543 197" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#r)"/>
  <g filter="url(#r)"><rect x="546" y="180" width="86" height="34" rx="6" fill="#fafafa" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4"/></g>
  <text x="589" y="202" text-anchor="middle" font-size="13" fill="#888" filter="url(#r)">"" 空串</text>

  <!-- Row 3: "bad" -->
  <g filter="url(#r)"><rect x="30" y="260" width="72" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="66" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#r)">"bad"</text>

  <g filter="url(#r)"><rect x="115" y="260" width="62" height="34" rx="4" fill="#eeeeee" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="146" y="282" text-anchor="middle" font-size="12" fill="#777" filter="url(#r)">b : 2</text>
  <g filter="url(#r)"><rect x="183" y="260" width="62" height="34" rx="4" fill="#eeeeee" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="214" y="282" text-anchor="middle" font-size="12" fill="#777" filter="url(#r)">a : 3</text>
  <g filter="url(#r)"><rect x="251" y="260" width="62" height="34" rx="4" fill="#eeeeee" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="282" y="282" text-anchor="middle" font-size="12" fill="#777" filter="url(#r)">d : 2</text>
  <g filter="url(#r)"><rect x="319" y="260" width="62" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="350" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a3230" filter="url(#r)">ba : 1</text>
  <g filter="url(#r)"><rect x="387" y="260" width="62" height="34" rx="4" fill="#eeeeee" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="418" y="282" text-anchor="middle" font-size="12" fill="#777" filter="url(#r)">ad : 2</text>
  <g filter="url(#r)"><rect x="455" y="260" width="62" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="486" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#r)">bad : 1</text>

  <path d="M 521 277 L 543 277" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#r)"/>
  <g filter="url(#r)"><rect x="546" y="260" width="86" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="589" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a3230" filter="url(#r)">"ba"</text>

  <!-- Row 4: "c" -->
  <g filter="url(#r)"><rect x="30" y="340" width="72" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="66" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#r)">"c"</text>

  <g filter="url(#r)"><rect x="115" y="340" width="62" height="34" rx="4" fill="#eeeeee" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="146" y="362" text-anchor="middle" font-size="12" fill="#777" filter="url(#r)">c : 2</text>

  <text x="214" y="362" font-size="11.5" fill="#999" filter="url(#r)">← 唯一的子串 c 也出现在 "cab" 中</text>
  <path d="M 521 357 L 543 357" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#r)"/>
  <g filter="url(#r)"><rect x="546" y="340" width="86" height="34" rx="6" fill="#fafafa" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4"/></g>
  <text x="589" y="362" text-anchor="middle" font-size="13" fill="#888" filter="url(#r)">"" 空串</text>

  <!-- tie-break note -->
  <g filter="url(#r)"><rect x="40" y="404" width="580" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="62" y="427" font-size="12.5" font-weight="bold" fill="#7a5a1e" filter="url(#r)">"cab" 的取舍：长度 1 的子串 c、a、b 全是公共的；长度 2 有 ca、ab 两个候选，</text>
  <text x="62" y="448" font-size="12.5" fill="#444" filter="url(#r)">长度相同 → 比字典序，"ab" &lt; "ca" → 选 "ab"。注意：起点顺序枚举不保证字典序，必须显式比较！</text>

  <!-- result box -->
  <g filter="url(#r)"><rect x="40" y="478" width="580" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="330" y="503" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">最终输出：answer = ["ab", "", "ba", ""]</text>
  <text x="330" y="525" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#r)">与官方示例 1 一致 ✓</text>
</svg>
