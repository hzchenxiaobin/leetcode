<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：把视角从「源头 i」切换到「目标 j」</text>
  <path d="M 165 40 Q 320 48 475 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left panel: source view -->
  <g filter="url(#sk)">
    <rect x="20" y="58" width="270" height="112" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="155" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">题面视角：枚举源头 i</text>
  <text x="36" y="103" font-size="11" fill="#444" font-family="monospace" filter="url(#sk)">nums[2i]   = nums[i]</text>
  <text x="36" y="120" font-size="11" fill="#444" font-family="monospace" filter="url(#sk)">nums[2i+1] = nums[i] + nums[i+1]</text>
  <text x="36" y="143" font-size="10.5" fill="#8a5050" filter="url(#sk)">一个 i 写两个位置：需分别判</text>
  <text x="36" y="158" font-size="10.5" fill="#8a5050" filter="url(#sk)">2i、2i+1 是否越界，上界取 n/2</text>

  <!-- switch arrow -->
  <text x="320" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">换视角</text>
  <g filter="url(#sk)">
    <path d="M 293 112 L 344 112" stroke="#c98a2b" stroke-width="2" marker-end="url(#ar)"/>
  </g>

  <!-- right panel: target view -->
  <g filter="url(#sk)">
    <rect x="350" y="58" width="270" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="485" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">目标视角：枚举下标 j</text>
  <text x="366" y="103" font-size="11" fill="#333" font-family="monospace" filter="url(#sk)">j 偶：nums[j] = nums[j/2]</text>
  <text x="366" y="120" font-size="11" fill="#333" font-family="monospace" filter="url(#sk)">j 奇：nums[j] = nums[j/2] + nums[j/2+1]</text>
  <text x="366" y="143" font-size="10.5" fill="#3a5a30" filter="url(#sk)">每个 j 恰对应一条规则，循环就是</text>
  <text x="366" y="158" font-size="10.5" fill="#3a5a30" filter="url(#sk)">依次填满 0..n，且依赖全部小于 j</text>

  <!-- dependency arcs over the n=7 array -->
  <g filter="url(#sk)">
    <path d="M 246 250 Q 336 150 426 250" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arb)"/>
    <path d="M 186 250 Q 276 186 366 250" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arg)"/>
    <path d="M 246 250 Q 306 214 366 250" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arg)"/>
  </g>

  <!-- cells: n = 7 array -->
  <g filter="url(#sk)">
    <rect x="40" y="252" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="100" y="252" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="160" y="252" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="220" y="252" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="280" y="252" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="340" y="252" width="52" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="400" y="252" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="460" y="252" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" fill="#333">
    <text x="66" y="276" filter="url(#sk)">0</text>
    <text x="126" y="276" filter="url(#sk)">1</text>
    <text x="186" y="276" filter="url(#sk)">1</text>
    <text x="246" y="276" filter="url(#sk)">2</text>
    <text x="306" y="276" filter="url(#sk)">1</text>
    <text x="366" y="276" fill="#b85450" filter="url(#sk)">3</text>
    <text x="426" y="276" filter="url(#sk)">2</text>
    <text x="486" y="276" filter="url(#sk)">3</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#888">
    <text x="66" y="307" filter="url(#sk)">j=0</text>
    <text x="126" y="307" filter="url(#sk)">j=1</text>
    <text x="186" y="307" filter="url(#sk)">j=2</text>
    <text x="246" y="307" filter="url(#sk)">j=3</text>
    <text x="306" y="307" filter="url(#sk)">j=4</text>
    <text x="366" y="307" filter="url(#sk)">j=5</text>
    <text x="426" y="307" filter="url(#sk)">j=6</text>
    <text x="486" y="307" filter="url(#sk)">j=7</text>
  </g>

  <text x="320" y="330" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">箭头即依赖方向：源头永远比目标小（蓝：偶位复制 6←3；绿：奇位求和 5←2,3）</text>
  <text x="320" y="348" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">所以从 j = 2 开始正向扫一趟，依赖天然就绪，无需递归或记忆化</text>
</svg>
