<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="179"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">剥因子示例（[2,11]，C = 2）：配额恰好扣满</text>

  <!-- 原数行 -->
  <text x="40" y="72" font-size="11.5" fill="#666" filter="url(#rough2)">区间数：</text>
  <g filter="url(#rough2)">
    <rect x="105" y="54" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="139" y="54" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="173" y="54" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="207" y="54" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="241" y="54" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="275" y="54" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="309" y="54" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="343" y="54" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="377" y="54" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="411" y="54" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="120" y="74">2</text><text x="154" y="74">3</text><text x="188" y="74">4</text><text x="222" y="74">5</text>
    <text x="256" y="74">6</text><text x="290" y="74">7</text><text x="324" y="74">8</text><text x="358" y="74">9</text>
    <text x="392" y="74">10</text><text x="426" y="74">11</text>
  </g>

  <!-- 剥离机 -->
  <rect x="105" y="108" width="336" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="273" y="126" text-anchor="middle" font-size="12.5" fill="#8a6d1a" filter="url(#rough2)">剥因子机：扣满配额 used2 ≤ 2、used5 ≤ 2 即停</text>
  <text x="273" y="143" text-anchor="middle" font-size="11.5" fill="#a3832c" filter="url(#rough2)">（10 剥掉一个 5 → 2；4 剥掉一个 2 → 2；5、2 剥光 → 1）</text>
  <g filter="url(#rough2)">
    <path d="M 120 86 L 120 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 154 86 L 154 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 188 86 L 188 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 222 86 L 222 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 256 86 L 256 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 290 86 L 290 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 324 86 L 324 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 358 86 L 358 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 392 86 L 392 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 426 86 L 426 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 剥后行 -->
  <g filter="url(#rough2)">
    <path d="M 120 156 L 120 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 154 156 L 154 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 188 156 L 188 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 222 156 L 222 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 256 156 L 256 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 290 156 L 290 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 324 156 L 324 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 358 156 L 358 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 392 156 L 392 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 426 156 L 426 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="105" y="176" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="139" y="176" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="173" y="176" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="207" y="176" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="241" y="176" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="275" y="176" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="309" y="176" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="343" y="176" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="377" y="176" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="411" y="176" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="12.5" fill="#2e4d24" text-anchor="middle" filter="url(#rough2)">
    <text x="120" y="196">1</text><text x="154" y="196">3</text><text x="188" y="196">2</text><text x="222" y="196">1</text>
    <text x="256" y="196">6</text><text x="290" y="196">7</text><text x="324" y="196">8</text><text x="358" y="196">9</text>
    <text x="392" y="196">2</text><text x="426" y="196">11</text>
  </g>
  <text x="40" y="196" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">剥后：</text>

  <rect x="55" y="232" width="410" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="13" fill="#2b3d52" filter="url(#rough2)">剥后连乘 = 1·3·2·1·6·7·8·9·2·11 = 399168 = M</text>
  <text x="260" y="274" text-anchor="middle" font-size="11.5" fill="#6b7f96" filter="url(#rough2)">（与 39916800 / 10² 完全一致；M 不以 0 结尾）</text>

  <rect x="55" y="300" width="410" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#7a3b37" filter="url(#rough2)">对模乘而言「先模再除」不可行（10ᶜ 的除法不可逆），</text>
  <text x="260" y="336" text-anchor="middle" font-size="12" fill="#7a3b37" filter="url(#rough2)">必须从乘数身上把 C 个 2、C 个 5 直接扣掉</text>
</svg>
