<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 336" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="336" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#333333" filter="url(#rough2)">双指针：I 取最小剩余，D 取最大剩余</text>
  <circle cx="120" cy="110" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="116" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="198" cy="110" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="198" y="116" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="276" cy="110" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="276" y="116" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="354" cy="110" r="26" fill="#f0f0f0" stroke="#888888" stroke-width="2" filter="url(#rough2)"/>
  <text x="354" y="116" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="432" cy="110" r="26" fill="#f0f0f0" stroke="#888888" stroke-width="2" filter="url(#rough2)"/>
  <text x="432" y="116" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="120" y="74" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="432" y="74" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">n</text>
  <text x="120" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">lo = 0</text>
  <text x="432" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">hi = n</text>
  <path d="M 120 82 L 120 92" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 432 82 L 432 92" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="30" y="196" width="250" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="220" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">s[i] == 'I'</text>
  <text x="155" y="242" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">放 lo，然后 lo += 1</text>
  <text x="155" y="264" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">（右边还剩值更大的）</text>
  <rect x="320" y="196" width="250" height="92" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="445" y="220" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">s[i] == 'D'</text>
  <text x="445" y="242" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">放 hi，然后 hi -= 1</text>
  <text x="445" y="264" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">（左边还剩值更小的）</text>
  <path d="M 250 236 L 314 236" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 306 L 254 306" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="322" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">用完 n 个字符后，lo == hi，最后的数直接补上</text>
</svg>
