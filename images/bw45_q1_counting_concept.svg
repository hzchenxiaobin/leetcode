<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">值域 1..100 开桶：cnt[v] == 1 的才计入</text>
  <text x="260" y="58" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">nums = [1, 2, 3, 2]</text>

  <!-- nums 一行四个数 -->
  <rect x="150" y="76" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="198" y="76" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="246" y="76" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="294" y="76" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="220" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="268" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="316" y="99" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>

  <!-- 落桶箭头 -->
  <path d="M172,116 Q172,146 122,168" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M220,116 Q220,150 240,168" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M268,116 Q268,150 338,168" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M316,116 Q316,152 244,170" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 三个桶 -->
  <rect x="90" y="176" width="64" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="122" y="198" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">值 1</text>
  <text x="122" y="220" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">cnt = 1</text>

  <rect x="210" y="176" width="64" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="242" y="198" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">值 2</text>
  <text x="242" y="220" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">cnt = 2</text>

  <rect x="330" y="176" width="64" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="362" y="198" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">值 3</text>
  <text x="362" y="220" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">cnt = 1</text>

  <text x="122" y="248" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">唯一 → 计入 1</text>
  <text x="242" y="248" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">重复 → 排除</text>
  <text x="362" y="248" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">唯一 → 计入 3</text>

  <rect x="120" y="270" width="280" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="14" fill="#7a5a20" filter="url(#rough2)">第二遍扫值域 1..100：</text>
  <text x="260" y="312" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">ans = 1 + 3 = 4</text>
</svg>
