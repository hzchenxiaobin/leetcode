<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">奇偶转移：奇数只能交出偶数，偶数总能交出奇数</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">每一局只要 n &gt; 1 就能操作（x = 1 永远合法）</text>
  <rect x="40.0" y="84.0" width="150.0" height="48.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="115.0" y="112.4" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n 为奇数</text>
  <path d="M 190.0 108.0 L 250.0 108.0" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="220.0" y="96.0" font-size="9" fill="#b85450" text-anchor="middle" filter="url(#rough2)">因子必为奇数</text>
  <rect x="250.0" y="84.0" width="150.0" height="48.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="325.0" y="112.4" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n - x 为偶数</text>
  <text x="420.0" y="106.0" font-size="10" fill="#888" text-anchor="start" filter="url(#rough2)">只能交出偶数</text>
  <rect x="40.0" y="170.0" width="150.0" height="48.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="115.0" y="198.4" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n 为偶数</text>
  <path d="M 190.0 194.0 L 250.0 194.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="218.0" y="182.0" font-size="9" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">取 x = 1</text>
  <rect x="250.0" y="170.0" width="150.0" height="48.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="325.0" y="198.4" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n - 1 为奇数</text>
  <text x="420.0" y="192.0" font-size="10" fill="#888" text-anchor="start" filter="url(#rough2)">可以交出奇数</text>
  <rect x="40.0" y="240.0" width="480.0" height="44.0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280.0" y="265.9" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">结论：偶数局面必胜，奇数局面必败（用强归纳证明）</text>
</svg>
