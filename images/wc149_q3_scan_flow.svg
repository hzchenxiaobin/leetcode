<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：统计 → 游程编码 → 每段两种候选 → 取最大</text>
  <text x="380" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">所有候选值都要先与 cnt[c] 取 min：同字符总数不够时，换不出更多</text>

  <rect x="250" y="62" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="380" y="89" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">统计每个字符的总数 cnt[c]</text>

  <rect x="200" y="132" width="360" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="380" y="159" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">游程编码：压成 (字符 c, 段长 L) 序列</text>

  <rect x="250" y="202" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="380" y="229" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">对每个段 k：字符 c、长度 L</text>

  <rect x="40" y="288" width="320" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="200" y="312" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">情况一：min(L + 1, cnt[c])</text>
  <text x="200" y="334" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">单段向旁边借一个同类字符</text>

  <rect x="400" y="288" width="320" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="560" y="312" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">情况二：min(L + L2 + 1, cnt[c])</text>
  <text x="560" y="334" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">k+2 段同字符 且 中间段长恰为 1</text>

  <rect x="230" y="378" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="380" y="405" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">ans = max(ans, 候选)；返回 ans</text>

  <path d="M 380 106 L 380 128" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 176 L 380 198" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 318 246 L 205 284" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 442 246 L 555 284" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 205 352 L 300 374" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 555 352 L 460 374" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
