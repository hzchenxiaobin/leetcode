<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="59" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="700" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：s = "aeiaaioooa"</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 第 1 行：原串格子 ===== -->
  <text x="80" y="78" font-size="13" fill="#444">原串（全是元音，m = 10）：</text>
  <g filter="url(#sk)" font-size="18" text-anchor="middle">
    <rect x="260" y="56" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="304" y="56" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="348" y="56" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="392" y="56" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="436" y="56" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="480" y="56" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="524" y="56" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="568" y="56" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="612" y="56" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="656" y="56" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <text x="282" y="84">a</text>
    <text x="326" y="84">e</text>
    <text x="370" y="84">i</text>
    <text x="414" y="84">a</text>
    <text x="458" y="84">a</text>
    <text x="502" y="84">i</text>
    <text x="546" y="84">o</text>
    <text x="590" y="84">o</text>
    <text x="634" y="84">o</text>
    <text x="678" y="84">a</text>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#888" text-anchor="middle">
    <text x="282" y="112">0</text>
    <text x="326" y="112">1</text>
    <text x="370" y="112">2</text>
    <text x="414" y="112">3</text>
    <text x="458" y="112">4</text>
    <text x="502" y="112">5</text>
    <text x="546" y="112">6</text>
    <text x="590" y="112">7</text>
    <text x="634" y="112">8</text>
    <text x="678" y="112">9</text>
  </g>

  <path d="M 470 122 L 470 138" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="486" y="136" font-size="11" fill="#7a7a7a">Step 1：一趟扫描统计</text>

  <!-- ===== 第 2 行：统计表 ===== -->
  <g filter="url(#sk)">
    <rect x="150" y="146" width="640" height="118" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="170" y="170" font-size="13" font-weight="bold" fill="#2e6e2e">统计结果</text>
  <g filter="url(#sk)" font-size="13" fill="#333" text-anchor="middle">
    <text x="230" y="196">字符</text>
    <text x="340" y="196">freq</text>
    <text x="470" y="196">first（首现下标）</text>
    <text x="640" y="196">备注</text>
    <text x="230" y="222">a</text>
    <text x="340" y="222">4</text>
    <text x="470" y="222">0</text>
    <text x="640" y="222">频率冠军</text>
    <text x="230" y="246">e / i / o</text>
    <text x="340" y="246">1 / 2 / 3</text>
    <text x="470" y="246">1 / 2 / 7</text>
    <text x="640" y="246">互不相同 ✓</text>
  </g>
  <text x="170" y="258" font-size="11" fill="#7a7a7a">u：freq = 0，未出现，不参与后续步骤</text>

  <path d="M 470 268 L 470 284" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="486" y="282" font-size="11" fill="#7a7a7a">Step 2：按键排序</text>

  <!-- ===== 第 3 行：排序 ===== -->
  <g filter="url(#sk)">
    <rect x="150" y="292" width="640" height="84" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="170" y="316" font-size="13" font-weight="bold" fill="#7a5415">排序键 (freq↓, first↑)</text>
  <g filter="url(#sk)" font-size="13" fill="#333">
    <text x="190" y="346">a(4,0)</text>
    <text x="252" y="346" fill="#c98a2b">→</text>
    <text x="278" y="346">o(3,7)</text>
    <text x="340" y="346" fill="#c98a2b">→</text>
    <text x="366" y="346">i(2,2)</text>
    <text x="428" y="346" fill="#c98a2b">→</text>
    <text x="454" y="346">e(1,1)</text>
    <text x="516" y="346" fill="#c98a2b">→</text>
    <text x="542" y="346" fill="#999">u(0,−)</text>
  </g>
  <text x="190" y="366" font-size="11" fill="#7a7a7a">频率两两不同，first 只是保险绳；频率打平时才靠 first 分胜负</text>

  <path d="M 470 380 L 470 396" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="486" y="394" font-size="11" fill="#7a7a7a">Step 3：分组连排展开</text>

  <!-- ===== 第 4 行：展开序列 ===== -->
  <text x="80" y="432" font-size="13" fill="#444">序列 t：</text>
  <g filter="url(#sk)" font-size="18" text-anchor="middle">
    <rect x="260" y="410" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="304" y="410" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="348" y="410" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="392" y="410" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="436" y="410" width="44" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="480" y="410" width="44" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="524" y="410" width="44" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="568" y="410" width="44" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="612" y="410" width="44" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="656" y="410" width="44" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="282" y="438">a</text>
    <text x="326" y="438">a</text>
    <text x="370" y="438">a</text>
    <text x="414" y="438">a</text>
    <text x="458" y="438">o</text>
    <text x="502" y="438">o</text>
    <text x="546" y="438">o</text>
    <text x="590" y="438">i</text>
    <text x="634" y="438">i</text>
    <text x="678" y="438">e</text>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#888" text-anchor="middle">
    <text x="370" y="466">a×4</text>
    <text x="500" y="466">o×3</text>
    <text x="612" y="466">i×2</text>
    <text x="678" y="466">e×1</text>
  </g>

  <path d="M 470 476 L 470 492" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="486" y="490" font-size="11" fill="#4a8e4a">Step 4：依序填回元音槽位</text>

  <!-- ===== 第 5 行：结果 ===== -->
  <text x="80" y="528" font-size="13" fill="#444">输出：</text>
  <g filter="url(#sk)" font-size="18" text-anchor="middle">
    <rect x="260" y="506" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="304" y="506" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="348" y="506" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="392" y="506" width="44" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="436" y="506" width="44" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="480" y="506" width="44" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="524" y="506" width="44" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="568" y="506" width="44" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="612" y="506" width="44" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="656" y="506" width="44" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="282" y="534">a</text>
    <text x="326" y="534">a</text>
    <text x="370" y="534">a</text>
    <text x="414" y="534">a</text>
    <text x="458" y="534">o</text>
    <text x="502" y="534">o</text>
    <text x="546" y="534">o</text>
    <text x="590" y="534">i</text>
    <text x="634" y="534">i</text>
    <text x="678" y="534">e</text>
  </g>
  <text x="740" y="534" font-size="15" fill="#2e6e2e" font-weight="bold">"aaaaoooiie" ✓</text>

  <!-- ===== 底部小结 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="576" width="810" height="100" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="602" font-size="12" fill="#444">对照：若 tie-break 误用「字母序」，频率打平的 i(2) 与 e(1)？—— 本例频率恰好互异看不出破绽；</text>
  <text x="80" y="624" font-size="12" fill="#444">换 "uoiea"（频率全 1）即穿帮：字母序输出 "aeiou"，而首现位置 tie-break 输出 <tspan fill="#b85450" font-weight="bold">"uoiea"</tspan>（原样）。</text>
  <text x="80" y="648" font-size="11" fill="#7a7a7a">首现位置基于原串 s；频率全相同时按首现排序 = 保持元音原有相对顺序（示例 3 同理）</text>
  <text x="80" y="668" font-size="11" fill="#7a7a7a">复杂度：时间 O(n) | 额外空间 O(1)（C++ 原地）/ O(n)（Python）</text>
</svg>
