<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ag" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M 0 0 L 9 3.5 L 0 7 Z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="470" fill="#fafafa"/>
  <text x="330" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#r)">示例演算：n = 12, threshold = 2（d 从 3 枚举到 12）</text>
  <path d="M 110 34 Q 330 42 550 34" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- highlight row d=4 -->
  <g filter="url(#r)">
    <rect x="24" y="106" width="612" height="30" fill="#fff8e1"/>
  </g>

  <!-- table grid -->
  <g filter="url(#r)" stroke="#8a8a8a" stroke-width="1.1" fill="none">
    <rect x="24" y="48" width="612" height="178"/>
    <rect x="24" y="48" width="612" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <path d="M 66 48 L 66 226"/>
    <path d="M 216 48 L 216 226"/>
    <path d="M 466 48 L 466 226"/>
    <path d="M 24 76 L 636 76"/>
    <path d="M 24 106 L 636 106"/>
    <path d="M 24 136 L 636 136"/>
    <path d="M 24 166 L 636 166"/>
    <path d="M 24 196 L 636 196"/>
  </g>

  <g filter="url(#r)" font-size="11.5" font-weight="bold" fill="#2f4a66" text-anchor="middle">
    <text x="45" y="66">d</text>
    <text x="141" y="66">d 的倍数（≤ 12）</text>
    <text x="341" y="66">执行的 union</text>
    <text x="551" y="66">连通块变化</text>
  </g>

  <g filter="url(#r)" font-size="11" fill="#333" text-anchor="middle">
    <text x="45" y="95" font-weight="bold">3</text>
    <text x="141" y="95">6, 9, 12</text>
    <text x="341" y="95">union(3,6)、(3,9)、(3,12)</text>
    <text x="551" y="95">凑出 {3,6,9,12}</text>

    <text x="45" y="125" font-weight="bold">4</text>
    <text x="141" y="125">8, 12</text>
    <text x="341" y="125">union(4,8)、(4,12)</text>
    <text x="551" y="125" font-size="10.5">12 牵线 → {3,4,6,8,9,12}</text>

    <text x="45" y="155" font-weight="bold">5</text>
    <text x="141" y="155">10</text>
    <text x="341" y="155">union(5,10)</text>
    <text x="551" y="155">凑出 {5,10}</text>

    <text x="45" y="185" font-weight="bold">6</text>
    <text x="141" y="185">12</text>
    <text x="341" y="185">union(6,12)（同集，无害）</text>
    <text x="551" y="185">不变</text>

    <text x="45" y="215" font-weight="bold">7…12</text>
    <text x="141" y="215">2d &gt; 12，无倍数</text>
    <text x="341" y="215">—</text>
    <text x="551" y="215">不变</text>
  </g>

  <!-- final components -->
  <text x="36" y="252" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">最终连通块：</text>
  <g filter="url(#r)">
    <rect x="128" y="264" width="44" height="30" rx="15" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
    <rect x="180" y="264" width="44" height="30" rx="15" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
    <rect x="232" y="264" width="44" height="30" rx="15" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
    <rect x="284" y="264" width="52" height="30" rx="15" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
    <rect x="348" y="264" width="76" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="436" y="264" width="182" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g filter="url(#r)" font-size="11" text-anchor="middle">
    <text x="150" y="283" fill="#777">{1}</text>
    <text x="202" y="283" fill="#777">{2}</text>
    <text x="254" y="283" fill="#777">{7}</text>
    <text x="310" y="283" fill="#777">{11}</text>
    <text x="386" y="283" fill="#2f4a66" font-weight="bold">{5,10}</text>
    <text x="527" y="283" fill="#2e6e2e" font-weight="bold">{3,4,6,8,9,12}</text>
  </g>
  <text x="36" y="316" font-size="10.5" fill="#999" filter="url(#r)">孤立城市 1、2、7、11：与任何数的 gcd 都 ≤ 2，搭不出超过阈值的桥</text>

  <!-- query demo -->
  <text x="36" y="346" font-size="12" font-weight="bold" fill="#8a6a1a" filter="url(#r)">查询 [6, 4]：gcd(6, 4) = 2 ≤ 2 没有直接边，但可以中转 ——</text>

  <g filter="url(#r)" stroke="#4a7a3a" stroke-width="2.4" fill="none">
    <path d="M 128 396 L 211 396"/>
    <path d="M 249 396 L 332 396"/>
  </g>
  <text x="170" y="376" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#r)">gcd = 6 &gt; 2</text>
  <text x="290" y="376" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#r)">gcd = 4 &gt; 2</text>

  <g filter="url(#r)">
    <circle cx="110" cy="396" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="230" cy="396" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="350" cy="396" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <g filter="url(#r)" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">
    <text x="110" y="401">6</text>
    <text x="230" y="401">12</text>
    <text x="350" y="401">4</text>
  </g>

  <path d="M 372 396 L 424 396" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#ag)" filter="url(#r)"/>
  <g filter="url(#r)">
    <rect x="430" y="372" width="180" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="520" y="394" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">answer = true</text>
  <text x="520" y="410" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#r)">（经 12 中转）</text>

  <text x="36" y="448" font-size="11" fill="#b85450" filter="url(#r)">查询 [2, 4]：gcd(2, ·) 只能取 1 或 2，2 是天然孤点 → answer = false</text>
</svg>
