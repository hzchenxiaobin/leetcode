<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="520" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">射线扫描流程：时间 O(m + 64)，空间 O(64)</text>
  <text x="330" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">m = 皇后个数；棋盘只有 8×8，每条射线最多走 7 步</text>
  <rect x="130" y="64" width="380" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="85" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">① 建 8×8 布尔棋盘，把所有皇后标记为 true（O(m)）</text>
  <rect x="130" y="126" width="380" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="147" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">② 枚举 8 个方向 (dx, dy) ≠ (0, 0)</text>
  <rect x="130" y="188" width="380" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="209" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">③ 从 (kx+dx, ky+dy) 起步，沿射线逐格前进</text>
  <polygon points="320,246 470,272 320,298 170,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="276" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">越界？</text>
  <polygon points="320,330 470,356 320,382 170,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="360" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">该格有皇后？</text>
  <rect x="130" y="438" width="380" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="459" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">④ 8 个方向都结束后输出答案（≤ 8 个坐标）</text>
  <path d="M 320 98 L 320 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 160 L 320 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 222 L 320 246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 298 L 320 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 170 356 H 70 V 205 H 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="76" y="300" font-size="10" fill="#777" filter="url(#rough2)">否：前进一格</text>
  <path d="M 470 272 H 580 V 143 H 510" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 356 H 560" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 560 356 V 455 H 512" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="262" font-size="9.5" fill="#b85450" filter="url(#rough2)">是：本方向无解</text>
  <text x="478" y="346" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是：记录坐标</text>
  <text x="572" y="420" font-size="9.5" fill="#666" filter="url(#rough2)" transform="rotate(-90 572 420)">8 向枚举完</text>
  <text x="330" y="504" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">棋盘扫描法无需排序或 gcd；每个格子最多被 8 条射线各访问一次</text>
</svg>
