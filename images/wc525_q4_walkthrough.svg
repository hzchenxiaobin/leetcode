<svg xmlns="http://www.w3.org/2000/svg" width="640" height="510" viewBox="0 0 640 510" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="510" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：nums = [5,8,8,2,2,2]（L=0 走全程，L=1 看 break）</text>
  <path d="M 100 35 Q 320 43 540 35" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- mini array -->
  <g filter="url(#sk)">
    <rect x="188" y="48" width="44" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="232" y="48" width="44" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="276" y="48" width="44" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="320" y="48" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="364" y="48" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="408" y="48" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="210" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">5</text>
  <text x="254" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">8</text>
  <text x="298" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">8</text>
  <text x="342" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">2</text>
  <text x="386" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">2</text>
  <text x="430" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">2</text>
  <text x="210" y="92" text-anchor="middle" font-size="9.5" fill="#999999">0</text>
  <text x="254" y="92" text-anchor="middle" font-size="9.5" fill="#999999">1</text>
  <text x="298" y="92" text-anchor="middle" font-size="9.5" fill="#999999">2</text>
  <text x="342" y="92" text-anchor="middle" font-size="9.5" fill="#999999">3</text>
  <text x="386" y="92" text-anchor="middle" font-size="9.5" fill="#999999">4</text>
  <text x="430" y="92" text-anchor="middle" font-size="9.5" fill="#999999">5</text>

  <!-- L=0 table -->
  <g filter="url(#sk)">
    <rect x="46" y="106" width="548" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="66" y="125" font-size="12" font-weight="bold" fill="#2b6e9e">L = 0：p1=0 → p2=1 → p3=3（链到 p4 不存在为止）</text>

  <g filter="url(#sk)">
    <rect x="46" y="138" width="44" height="26" fill="#f2f2ee" stroke="#aaa"/>
    <rect x="90" y="138" width="44" height="26" fill="#f2f2ee" stroke="#aaa"/>
    <rect x="134" y="138" width="44" height="26" fill="#f2f2ee" stroke="#aaa"/>
    <rect x="178" y="138" width="106" height="26" fill="#f2f2ee" stroke="#aaa"/>
    <rect x="284" y="138" width="44" height="26" fill="#f2f2ee" stroke="#aaa"/>
    <rect x="328" y="138" width="44" height="26" fill="#f2f2ee" stroke="#aaa"/>
    <rect x="372" y="138" width="50" height="26" fill="#f2f2ee" stroke="#aaa"/>
    <rect x="422" y="138" width="172" height="26" fill="#f2f2ee" stroke="#aaa"/>
    <rect x="46" y="164" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="90" y="164" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="134" y="164" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="178" y="164" width="106" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="284" y="164" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="328" y="164" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="372" y="164" width="50" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="422" y="164" width="172" height="26" fill="#eaf6ee" stroke="#4a8e4a"/>
    <rect x="46" y="190" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="90" y="190" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="134" y="190" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="178" y="190" width="106" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="284" y="190" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="328" y="190" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="372" y="190" width="50" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="422" y="190" width="172" height="26" fill="#eaf6ee" stroke="#4a8e4a"/>
    <rect x="46" y="216" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="90" y="216" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="134" y="216" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="178" y="216" width="106" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="284" y="216" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="328" y="216" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="372" y="216" width="50" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="422" y="216" width="172" height="26" fill="#eaf6ee" stroke="#4a8e4a"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="68" y="155" font-weight="bold">k</text><text x="112" y="155" font-weight="bold">v</text><text x="156" y="155" font-weight="bold">p</text><text x="231" y="155" font-weight="bold">[a, b]</text><text x="306" y="155" font-weight="bold">A</text><text x="350" y="155" font-weight="bold">B</text><text x="397" y="155" font-weight="bold">R*</text><text x="508" y="155" font-weight="bold">判定</text>
    <text x="68" y="181">1</text><text x="112" y="181" fill="#2b6e9e" font-weight="bold">5</text><text x="156" y="181">0</text><text x="231" y="181">[0, 5]</text><text x="306" y="181">0</text><text x="350" y="181">5</text><text x="397" y="181">0</text><text x="508" y="181" fill="#2e6e2e" font-weight="bold">✓ [5]</text>
    <text x="68" y="207">2</text><text x="112" y="207" fill="#2e6e2e" font-weight="bold">8</text><text x="156" y="207">1</text><text x="231" y="207">[2, 5]</text><text x="306" y="207">2</text><text x="350" y="207">5</text><text x="397" y="207">2</text><text x="508" y="207" fill="#2e6e2e" font-weight="bold">✓ [5,8,8]</text>
    <text x="68" y="233">3</text><text x="112" y="233" fill="#8a6415" font-weight="bold">2</text><text x="156" y="233">3</text><text x="231" y="233">[5, 5]</text><text x="306" y="233">5</text><text x="350" y="233">5</text><text x="397" y="233">5</text><text x="508" y="233" fill="#2e6e2e" font-weight="bold">✓ [5,8,8,2,2,2]</text>
  </g>
  <text x="66" y="258" font-size="11" fill="#7a7a7a">p4 不存在（无第 4 个不同值）→ 链自然终止；L=0 命中 3 个</text>

  <!-- L=1 table -->
  <g filter="url(#sk)">
    <rect x="46" y="274" width="548" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="66" y="293" font-size="12" font-weight="bold" fill="#2b6e9e">L = 1：p1=1 → p2=3（位置 0 已从链表删除）</text>

  <g filter="url(#sk)">
    <rect x="46" y="306" width="44" height="26" fill="#f2f2ee" stroke="#aaa"/>
    <rect x="90" y="306" width="44" height="26" fill="#f2f2ee" stroke="#aaa"/>
    <rect x="134" y="306" width="44" height="26" fill="#f2f2ee" stroke="#aaa"/>
    <rect x="178" y="306" width="106" height="26" fill="#f2f2ee" stroke="#aaa"/>
    <rect x="284" y="306" width="44" height="26" fill="#f2f2ee" stroke="#aaa"/>
    <rect x="328" y="306" width="44" height="26" fill="#f2f2ee" stroke="#aaa"/>
    <rect x="372" y="306" width="50" height="26" fill="#f2f2ee" stroke="#aaa"/>
    <rect x="422" y="306" width="172" height="26" fill="#f2f2ee" stroke="#aaa"/>
    <rect x="46" y="332" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="90" y="332" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="134" y="332" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="178" y="332" width="106" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="284" y="332" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="328" y="332" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="372" y="332" width="50" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="422" y="332" width="172" height="26" fill="#eaf6ee" stroke="#4a8e4a"/>
    <rect x="46" y="358" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="90" y="358" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="134" y="358" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="178" y="358" width="106" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="284" y="358" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="328" y="358" width="44" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="372" y="358" width="50" height="26" fill="#ffffff" stroke="#bbb"/>
    <rect x="422" y="358" width="172" height="26" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <text x="68" y="323" font-weight="bold">k</text><text x="112" y="323" font-weight="bold">v</text><text x="156" y="323" font-weight="bold">p</text><text x="231" y="323" font-weight="bold">[a, b]</text><text x="306" y="323" font-weight="bold">A</text><text x="350" y="323" font-weight="bold">B</text><text x="397" y="323" font-weight="bold">R*</text><text x="508" y="323" font-weight="bold">判定</text>
    <text x="68" y="349">1</text><text x="112" y="349" fill="#2e6e2e" font-weight="bold">8</text><text x="156" y="349">1</text><text x="231" y="349">[1, 1]</text><text x="306" y="349">1</text><text x="350" y="349">1</text><text x="397" y="349">1</text><text x="508" y="349" fill="#2e6e2e" font-weight="bold">✓ [8]</text>
    <text x="68" y="375">2</text><text x="112" y="375" fill="#8a6415" font-weight="bold">2</text><text x="156" y="375">3</text><text x="231" y="375">[4, 4]</text><text x="306" y="375" fill="#b85450" font-weight="bold">4</text><text x="350" y="375" fill="#b85450" font-weight="bold">1</text><text x="397" y="375">3</text><text x="508" y="375" fill="#8a2e28" font-weight="bold">✗ A&gt;B → break</text>
  </g>
  <text x="66" y="400" font-size="11" fill="#7a7a7a">a2=4 晚于 b1=1：区间交集已空，且 R*3=6 &gt; B=1 ⇒ 后续全不命中，break</text>

  <!-- summary -->
  <g filter="url(#sk)">
    <rect x="46" y="418" width="548" height="66" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="444" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">各左端点命中数：L=0:3，L=1:1，L=2:2，L=3:1，L=4:1，L=5:1</text>
  <text x="320" y="468" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">总计 3+1+2+1+1+1 = 9，与示例 1 一致 ✓</text>
</svg>
