<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="49"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">行列计数一次算好，diff 公式代入</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">m·n ≤ 10⁵，逐格现算行列会到 O(m·n·(m+n)) —— 必须预统计</text>

  <g filter="url(#rough2)">
    <rect x="50" y="70" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="86" y="70" width="36" height="36" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="122" y="70" width="36" height="36" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="50" y="106" width="36" height="36" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="86" y="106" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="122" y="106" width="36" height="36" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="50" y="142" width="36" height="36" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="86" y="142" width="36" height="36" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="122" y="142" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <text x="104" y="206" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">grid（m × n）</text>

  <g filter="url(#rough2)">
    <rect x="196" y="70" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="196" y="106" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="196" y="142" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <text x="241" y="90" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">rowOnes[0]</text>
  <text x="241" y="126" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">rowOnes[1]</text>
  <text x="241" y="162" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">rowOnes[m−1]</text>
  <text x="241" y="206" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">行计数</text>
  <text x="241" y="224" text-anchor="middle" font-size="10" fill="#999">zerosRow[i] = n − rowOnes[i]</text>

  <g filter="url(#rough2)">
    <rect x="196" y="248" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="196" y="282" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="196" y="316" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <text x="241" y="268" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">colOnes[0]</text>
  <text x="241" y="304" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">colOnes[1]</text>
  <text x="241" y="340" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">colOnes[n−1]</text>
  <text x="241" y="368" text-anchor="middle" font-size="10" fill="#999">zerosCol[j] = m − colOnes[j]</text>

  <path d="M 158 120 L 190 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 158 160 L 190 270" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="330" y="84" width="200" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="108" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">diff[i][j] = onesRow + onesCol</text>
  <text x="430" y="128" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">− zerosRow − zerosCol</text>
  <text x="430" y="146" text-anchor="middle" font-size="10.5" fill="#555">定义式，直接模拟每个格子的含义</text>

  <rect x="330" y="170" width="200" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">化简：diff[i][j] =</text>
  <text x="430" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2·rowOnes[i] + 2·colOnes[j] − n − m</text>
  <text x="430" y="232" text-anchor="middle" font-size="10.5" fill="#555">代入 zeros = 长度 − ones 即得</text>

  <rect x="330" y="256" width="200" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="430" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">复杂度对照</text>
  <text x="430" y="296" text-anchor="middle" font-size="10.5" fill="#555">预统计 O(mn) + 代入 O(mn) ✓</text>
  <text x="430" y="308" text-anchor="middle" font-size="10.5" fill="#555">逐格现算行列 O(mn(m+n)) ✗ 超时</text>

  <text x="430" y="344" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">值域：|diff| ≤ m + n ≤ 2×10⁵，int 足够</text>
  <text x="430" y="364" text-anchor="middle" font-size="10" fill="#999">空间 O(m + n) 额外计数数组 + O(mn) 输出</text>
</svg>
