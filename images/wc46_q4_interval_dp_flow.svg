<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">转移的几何含义与填写顺序</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">区间 [i, j] 被同字符的两次端点切成两段独立子问题</text>

  <rect x="120" y="62" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="143" y="86" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">i</text>
  <rect x="166" y="62" width="150" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="241" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">[i+1, k-1]</text>
  <rect x="316" y="62" width="180" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="406" y="85" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">[k, j]（含 k）</text>

  <path d="M 143 108 L 143 122 L 406 122 L 406 108" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275" y="140" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">s[i] 与 s[k] 用同一次涂色 → dp[i+1][k-1] + dp[k][j]</text>
  <text x="275" y="158" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">粉色区间共享第 1 次涂色，蓝色区间必须各涂各的</text>

  <rect x="60" y="176" width="500" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="202" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">① 长度 1：dp[i][i] = 1，一个字符总要有一次涂色</text>
  <line x1="310" y1="218" x2="310" y2="240" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="240" width="500" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="266" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">② 按 len = 2..n 递增枚举左端点 i，取 j = i + len - 1</text>
  <line x1="310" y1="282" x2="310" y2="304" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="304" width="500" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="330" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">③ 基准值 dp[i][j] = dp[i+1][j] + 1（s[i] 独占一次）</text>
  <line x1="310" y1="346" x2="310" y2="368" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="368" width="500" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="394" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">④ 遍历 k ∈ (i, j]：若 s[k] = s[i]，用 dp[i+1][k-1] + dp[k][j] 更新</text>
  <line x1="310" y1="410" x2="310" y2="428" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="310" y="452" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 dp[0][n-1]，表内每个格子只依赖更短的区间与右侧区间</text>
</svg>
