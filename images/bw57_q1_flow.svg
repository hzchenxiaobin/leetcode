<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟计数 → 基准 → 全等判定</text>

  <!-- 步骤 1 -->
  <rect x="40" y="66" width="140" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="110" y="92" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 扫描 s</text>
  <text x="110" y="112" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">cnt[c-'a']++，共 26 桶</text>

  <path d="M 184 98 L 218 98" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="222" y="66" width="140" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="292" y="92" text-anchor="middle" font-size="12" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">② 取基准 ref</text>
  <text x="292" y="112" text-anchor="middle" font-size="11" fill="#8a6a1f" filter="url(#rough2)">第一个非零桶的计数</text>

  <path d="M 366 98 L 400 98" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="404" y="66" width="140" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="474" y="92" text-anchor="middle" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">③ 全等判定</text>
  <text x="474" y="112" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">非零桶都 == ref ?</text>

  <!-- 判定分支 -->
  <path d="M 474 132 L 474 168 L 300 168 L 300 196" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 474 132 L 474 196" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="160" font-size="11" fill="#4a7a3a" filter="url(#rough2)">全部相等</text>
  <text x="488" y="168" font-size="11" fill="#b85450" filter="url(#rough2)">出现不等</text>

  <rect x="230" y="198" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="300" y="226" text-anchor="middle" font-size="13" fill="#2f5226" font-weight="bold" filter="url(#rough2)">返回 true</text>

  <rect x="404" y="198" width="140" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="474" y="226" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 false</text>

  <text x="280" y="276" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">时间 O(n + 26)，空间 O(26)：签到题的最短路径</text>
</svg>
