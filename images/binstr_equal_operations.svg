<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">把每个下标看成一列：上格 s[i]，下格 t[i]</text>

  <!-- 行标签 -->
  <text x="42" y="86" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">s →</text>
  <text x="42" y="122" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">t →</text>

  <!-- A 列 (0,0) 绿 -->
  <rect x="76" y="64" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="100" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="85" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="100" y="121" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="100" y="154" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">A (0,0)</text>
  <text x="100" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">匹配 ✓</text>

  <!-- B 列 (1,1) 绿 -->
  <rect x="186" y="64" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="186" y="100" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="85" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="210" y="121" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="210" y="154" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">B (1,1)</text>
  <text x="210" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">匹配 ✓</text>

  <!-- C 列 (0,1) 橙 -->
  <rect x="296" y="64" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="296" y="100" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="85" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="320" y="121" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="320" y="154" text-anchor="middle" font-size="12" fill="#b8860b" filter="url(#rough2)">C (0,1)</text>
  <text x="320" y="170" text-anchor="middle" font-size="12" fill="#b8860b" filter="url(#rough2)">不匹配</text>

  <!-- D 列 (1,0) 橙 -->
  <rect x="406" y="64" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="406" y="100" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="85" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="430" y="121" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="430" y="154" text-anchor="middle" font-size="12" fill="#b8860b" filter="url(#rough2)">D (1,0)</text>
  <text x="430" y="170" text-anchor="middle" font-size="12" fill="#b8860b" filter="url(#rough2)">不匹配</text>

  <!-- 分隔虚线 -->
  <path d="M30,190 Q260,196 490,190" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>

  <!-- 下半标题 -->
  <text x="260" y="214" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">三种操作</text>

  <!-- 块 1: flip -->
  <text x="100" y="242" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">翻转某一位 0↔1</text>
  <rect x="66" y="252" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="271" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="66" y="284" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="303" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <path d="M104,280 L118,280" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="124" y="252" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="271" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="124" y="284" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="303" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="100" y="336" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">成本 flipCost</text>
  <text x="100" y="352" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">(作用于 s[i] 或 t[i])</text>

  <!-- 块 2: swap -->
  <text x="260" y="242" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">同串交换两位</text>
  <rect x="206" y="252" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="271" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="206" y="284" width="32" height="28" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="222" y="303" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <rect x="282" y="252" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="271" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="282" y="284" width="32" height="28" fill="#f5f5f5" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="298" y="303" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">·</text>
  <path d="M244,266 L276,266" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M276,260 L244,260" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">成本 swapCost</text>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">(s 内或 t 内, i≠j)</text>

  <!-- 块 3: cross -->
  <text x="420" y="242" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">交换同列上下两位</text>
  <rect x="404" y="252" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="271" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="404" y="284" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="303" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <path d="M446,278 L446,292" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M456,292 L456,278" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="336" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">成本 crossCost</text>
  <text x="420" y="352" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">(s[i] ↔ t[i])</text>

  <!-- 底部提示框 -->
  <rect x="50" y="366" width="420" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠ cross 只能让 C↔D 互变，它自己无法修复任何不匹配！</text>
</svg>
