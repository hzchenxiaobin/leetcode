<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="800" height="540" fill="#fdfcf7"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：在每个分隔符处切一刀，空段一律丢弃</text>
  <path d="M 210 42 Q 400 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ Row A : one.two.three ============ -->
  <text x="60" y="74" font-size="12.5" fill="#555" filter="url(#sk)">words[0] = "one.two.three"    separator = '.'</text>

  <!-- scissors above separator cells -->
  <text x="165" y="95" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#sk)">✂</text>
  <text x="285" y="95" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#sk)">✂</text>

  <!-- cells: o n e . t w o . t h r e e -->
  <g filter="url(#sk)">
    <rect x="60"  y="100" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="90"  y="100" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="120" y="100" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="150" y="100" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="180" y="100" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="210" y="100" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="240" y="100" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="270" y="100" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="300" y="100" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="330" y="100" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="360" y="100" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="390" y="100" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="420" y="100" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="13" fill="#2b4a6e" filter="url(#sk)">
    <text x="75"  y="120" text-anchor="middle">o</text>
    <text x="105" y="120" text-anchor="middle">n</text>
    <text x="135" y="120" text-anchor="middle">e</text>
    <text x="165" y="120" text-anchor="middle" font-weight="bold" fill="#b85450">.</text>
    <text x="195" y="120" text-anchor="middle">t</text>
    <text x="225" y="120" text-anchor="middle">w</text>
    <text x="255" y="120" text-anchor="middle">o</text>
    <text x="285" y="120" text-anchor="middle" font-weight="bold" fill="#b85450">.</text>
    <text x="315" y="120" text-anchor="middle">t</text>
    <text x="345" y="120" text-anchor="middle">h</text>
    <text x="375" y="120" text-anchor="middle">r</text>
    <text x="405" y="120" text-anchor="middle">e</text>
    <text x="435" y="120" text-anchor="middle">e</text>
  </g>

  <!-- arrows down to segments -->
  <line x1="105" y1="132" x2="105" y2="148" stroke="#666" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#sk)"/>
  <line x1="225" y1="132" x2="225" y2="148" stroke="#666" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#sk)"/>
  <line x1="375" y1="132" x2="375" y2="148" stroke="#666" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#sk)"/>

  <!-- segment boxes -->
  <g filter="url(#sk)">
    <rect x="70"  y="152" width="70" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="190" y="152" width="70" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="337" y="152" width="76" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">
    <text x="105" y="172" text-anchor="middle">one</text>
    <text x="225" y="172" text-anchor="middle">two</text>
    <text x="375" y="172" text-anchor="middle">three</text>
  </g>

  <g font-size="11.5" fill="#4a7a3a" filter="url(#sk)">
    <text x="480" y="160">三段全非空 → 全保留</text>
    <text x="480" y="178" font-weight="bold">["one","two","three"] ✓</text>
  </g>

  <!-- ============ Row B : $easy$ ============ -->
  <text x="60" y="212" font-size="12.5" fill="#555" filter="url(#sk)">words[0] = "$easy$"    separator = '$'</text>

  <text x="75" y="233" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#sk)">✂</text>
  <text x="225" y="233" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#sk)">✂</text>

  <!-- cells: $ e a s y $ -->
  <g filter="url(#sk)">
    <rect x="60"  y="238" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="90"  y="238" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="120" y="238" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="150" y="238" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="180" y="238" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="210" y="238" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="13" fill="#2b4a6e" filter="url(#sk)">
    <text x="75"  y="258" text-anchor="middle" font-weight="bold" fill="#b85450">$</text>
    <text x="105" y="258" text-anchor="middle">e</text>
    <text x="135" y="258" text-anchor="middle">a</text>
    <text x="165" y="258" text-anchor="middle">s</text>
    <text x="195" y="258" text-anchor="middle">y</text>
    <text x="225" y="258" text-anchor="middle" font-weight="bold" fill="#b85450">$</text>
  </g>

  <line x1="82"  y1="270" x2="82"  y2="286" stroke="#666" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#sk)"/>
  <line x1="150" y1="270" x2="150" y2="286" stroke="#666" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#sk)"/>
  <line x1="226" y1="270" x2="226" y2="286" stroke="#666" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#sk)"/>

  <!-- segments: eps | easy | eps -->
  <g filter="url(#sk)">
    <rect x="62"  y="290" width="44" height="32" rx="8" fill="#f2f2f2" stroke="#aaa" stroke-width="1.3"/>
    <rect x="130" y="290" width="76" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="224" y="290" width="44" height="32" rx="8" fill="#f2f2f2" stroke="#aaa" stroke-width="1.3"/>
  </g>
  <text x="84"  y="311" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">ε</text>
  <text x="168" y="311" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">easy</text>
  <text x="246" y="311" text-anchor="middle" font-size="13" fill="#999" filter="url(#sk)">ε</text>

  <!-- strikethrough on eps boxes -->
  <line x1="64"  y1="292" x2="104" y2="320" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <line x1="226" y1="292" x2="266" y2="320" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>

  <g font-size="11.5" fill="#8f3a36" filter="url(#sk)">
    <text x="300" y="298">首分隔符 → 首段空 ε；尾分隔符 → 尾段空 ε</text>
    <text x="300" y="316" font-weight="bold">两个空段被丢弃，只保留 ["easy"] ✓</text>
  </g>

  <!-- ============ Row C : ||| ============ -->
  <text x="60" y="350" font-size="12.5" fill="#555" filter="url(#sk)">words[0] = "|||"    separator = '|'</text>

  <text x="75"  y="371" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#sk)">✂</text>
  <text x="105" y="371" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#sk)">✂</text>
  <text x="135" y="371" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#sk)">✂</text>

  <!-- cells: | | | -->
  <g filter="url(#sk)">
    <rect x="60"  y="376" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="90"  y="376" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="120" y="376" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">
    <text x="75"  y="396" text-anchor="middle">|</text>
    <text x="105" y="396" text-anchor="middle">|</text>
    <text x="135" y="396" text-anchor="middle">|</text>
  </g>

  <line x1="82"  y1="408" x2="82"  y2="424" stroke="#666" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#sk)"/>
  <line x1="136" y1="408" x2="136" y2="424" stroke="#666" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#sk)"/>

  <!-- segments: 4 x eps -->
  <g filter="url(#sk)">
    <rect x="62"  y="428" width="44" height="32" rx="8" fill="#f2f2f2" stroke="#aaa" stroke-width="1.3"/>
    <rect x="116" y="428" width="44" height="32" rx="8" fill="#f2f2f2" stroke="#aaa" stroke-width="1.3"/>
    <rect x="170" y="428" width="44" height="32" rx="8" fill="#f2f2f2" stroke="#aaa" stroke-width="1.3"/>
    <rect x="224" y="428" width="44" height="32" rx="8" fill="#f2f2f2" stroke="#aaa" stroke-width="1.3"/>
  </g>
  <g font-size="13" fill="#999" filter="url(#sk)">
    <text x="84"  y="449" text-anchor="middle">ε</text>
    <text x="138" y="449" text-anchor="middle">ε</text>
    <text x="192" y="449" text-anchor="middle">ε</text>
    <text x="246" y="449" text-anchor="middle">ε</text>
  </g>
  <line x1="64"  y1="430" x2="104" y2="458" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <line x1="118" y1="430" x2="158" y2="458" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <line x1="172" y1="430" x2="212" y2="458" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <line x1="226" y1="430" x2="266" y2="458" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>

  <g font-size="11.5" fill="#8f3a36" filter="url(#sk)">
    <text x="300" y="436">连续分隔符 → 每两刀之间夹一个空段</text>
    <text x="300" y="454" font-weight="bold">四个空段全部丢弃 → 返回 [] ✓</text>
  </g>

  <!-- ============ bottom note ============ -->
  <g filter="url(#sk)">
    <rect x="40" y="476" width="720" height="50" rx="9" fill="#fdfcf7" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="58" y="497" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">空段恰有三个来源：① 首分隔符之前  ② 尾分隔符之后  ③ 连续分隔符之间</text>
  <text x="58" y="515" font-size="11" fill="#444" filter="url(#sk)">三者无需分别特判——收集时统一「判空」即可全部拦截（对应代码里的 if seg / if !cur.empty()）</text>
</svg>
