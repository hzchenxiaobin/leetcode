<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text filter="url(#rough2)" x="300" y="28" text-anchor="middle" font-size="15.5" fill="#333" font-weight="bold">只看 left[i][j] 与 up[i][j] 是不够的</text>
  <text filter="url(#rough2)" x="300" y="50" text-anchor="middle" font-size="11" fill="#777">右下角 (3,3) 的两个量都等于 4，可上边中间有个洞</text>

  <!-- 4x4 网格 -->
  <g filter="url(#rough2)">
    <rect x="60"  y="104" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="106" y="104" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="152" y="104" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="198" y="104" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>

    <rect x="60"  y="150" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="106" y="150" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="152" y="150" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="198" y="150" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>

    <rect x="60"  y="196" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="106" y="196" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="152" y="196" width="46" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="198" y="196" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>

    <rect x="60"  y="242" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="106" y="242" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="152" y="242" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="198" y="242" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>

  <!-- 数值 -->
  <text filter="url(#rough2)" x="83"  y="134" text-anchor="middle" font-size="14" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="129" y="134" text-anchor="middle" font-size="14" fill="#8a3a36">0</text>
  <text filter="url(#rough2)" x="175" y="134" text-anchor="middle" font-size="14" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="221" y="134" text-anchor="middle" font-size="14" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="83"  y="180" text-anchor="middle" font-size="14" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="129" y="180" text-anchor="middle" font-size="14" fill="#8a3a36">0</text>
  <text filter="url(#rough2)" x="175" y="180" text-anchor="middle" font-size="14" fill="#8a3a36">0</text>
  <text filter="url(#rough2)" x="221" y="180" text-anchor="middle" font-size="14" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="83"  y="226" text-anchor="middle" font-size="14" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="129" y="226" text-anchor="middle" font-size="14" fill="#8a3a36">0</text>
  <text filter="url(#rough2)" x="175" y="226" text-anchor="middle" font-size="14" fill="#8a3a36">0</text>
  <text filter="url(#rough2)" x="221" y="226" text-anchor="middle" font-size="14" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="83"  y="272" text-anchor="middle" font-size="14" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="129" y="272" text-anchor="middle" font-size="14" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="175" y="272" text-anchor="middle" font-size="14" fill="#33506e">1</text>
  <text filter="url(#rough2)" x="221" y="272" text-anchor="middle" font-size="14" fill="#33506e">1</text>

  <!-- 上边标注 -->
  <text filter="url(#rough2)" x="152" y="98" text-anchor="middle" font-size="10.6" fill="#b85450" font-weight="bold">上边只有 2 个连续的 1</text>
  <path filter="url(#rough2)" d="M 106 104 L 106 96" stroke="#b85450" stroke-width="1.6"/>

  <!-- 右侧推导 -->
  <text filter="url(#rough2)" x="270" y="126" font-size="12" fill="#3a4a66" font-weight="bold">以 (3,3) 为右下角、试 s = 4：</text>
  <text filter="url(#rough2)" x="270" y="152" font-size="10.8" fill="#4a7a3a">left[3][3] = 4 → 下边满足 ✓</text>
  <text filter="url(#rough2)" x="270" y="174" font-size="10.8" fill="#4a7a3a">up[3][3] = 4 → 右边满足 ✓</text>
  <text filter="url(#rough2)" x="270" y="198" font-size="10.8" fill="#b85450">上边 left[0][3] = 2 ≥ 4 ✗</text>
  <text filter="url(#rough2)" x="270" y="220" font-size="10.8" fill="#4a7a3a">左边 up[3][0] = 4 ≥ 4 ✓</text>
  <text filter="url(#rough2)" x="270" y="246" font-size="10.8" fill="#555">s = 4 被否掉，再试 3、2、1</text>
  <text filter="url(#rough2)" x="270" y="268" font-size="10.8" fill="#8a6a20" font-weight="bold">这个网格的答案只有 1</text>

  <!-- 结论 -->
  <rect filter="url(#rough2)" x="60" y="312" width="480" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  <text filter="url(#rough2)" x="300" y="336" text-anchor="middle" font-size="11.2" fill="#7a5a10">四个量各自锚在不同格子上：上边锚在顶行、左边锚在左列</text>
  <text filter="url(#rough2)" x="300" y="358" text-anchor="middle" font-size="11.2" fill="#7a5a10">漏掉它们就会出现「两角够长、边却断了」的假阳性</text>
</svg>
