<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 306"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="306" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">示例 2：[1,2,3,4,5,null,7] 的层序占位</text>
  <rect x="48" y="66" width="58" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="77" y="93" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="77" y="124" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">位置 1</text>
  <rect x="116" y="66" width="58" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="145" y="93" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="145" y="124" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">位置 2</text>
  <rect x="184" y="66" width="58" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="213" y="93" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="213" y="124" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">位置 3</text>
  <rect x="252" y="66" width="58" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="281" y="93" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="281" y="124" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">位置 4</text>
  <rect x="320" y="66" width="58" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="349" y="93" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="349" y="124" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">位置 5</text>
  <rect x="388" y="66" width="58" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="417" y="93" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">null</text>
  <text x="417" y="124" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">位置 6</text>
  <rect x="456" y="66" width="58" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="485" y="93" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="485" y="124" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">位置 7</text>
  <text x="280" y="152" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">位置 6 为空、位置 7 有节点：编号集合出现「洞」</text>
  <path d="M 300 162 L 380 186" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="250" y="188" width="260" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="214" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">读到 7 时 ended 已为 true → false</text>
  <rect x="40" y="246" width="480" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">示例 1 序列 1,2,3,4,5,6,null,… 空位都在末尾 → true</text>
</svg>
