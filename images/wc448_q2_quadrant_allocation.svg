<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：右上 → 右下 → 左下 → 左上，依次领取连续数值块</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="80" y="80" font-size="12" fill="#555">以 N = 2 为例（block = 4^(N−1) = 4，每象限 4 个数）</text>

  <!-- ===== 左侧：4×4 网格（象限着色） ===== -->
  <g filter="url(#sk)"><rect x="80" y="100" width="92" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="172" y="100" width="92" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="80" y="192" width="92" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="172" y="192" width="92" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="80" y="100" width="184" height="184" fill="none" stroke="#2b2b2b" stroke-width="2"/></g>

  <!-- 象限内部细网格线 -->
  <path d="M 126 100 L 126 192 M 218 100 L 218 192 M 126 192 L 126 284 M 218 192 L 218 284" stroke="#aaa" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 80 146 L 172 146 M 80 238 L 172 238 M 172 146 L 264 146 M 172 238 L 264 238" stroke="#aaa" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- 格子数值 -->
  <text x="103" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a">15</text>
  <text x="149" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a">12</text>
  <text x="103" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a">14</text>
  <text x="149" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a">13</text>
  <text x="195" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="241" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">0</text>
  <text x="195" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="241" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="103" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">11</text>
  <text x="149" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">8</text>
  <text x="103" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">10</text>
  <text x="149" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">9</text>
  <text x="195" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4b66">7</text>
  <text x="241" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4b66">4</text>
  <text x="195" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4b66">6</text>
  <text x="241" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4b66">5</text>

  <!-- 象限名 -->
  <text x="126" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">左上</text>
  <text x="218" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">右上</text>
  <text x="126" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">左下</text>
  <text x="218" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">右下</text>

  <!-- ===== 右侧：数值块链 ===== -->
  <g filter="url(#sk)"><rect x="350" y="104" width="230" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="465" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">右上分到 [0, 4)（最小）</text>

  <path d="M 465 142 L 465 158" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arrr)"/>
  <text x="478" y="155" font-size="10" fill="#b03a3a">全部小于</text>

  <g filter="url(#sk)"><rect x="350" y="160" width="230" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="465" y="184" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4b66">右下分到 [4, 8)</text>

  <path d="M 465 198 L 465 214" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arrr)"/>
  <text x="478" y="211" font-size="10" fill="#b03a3a">全部小于</text>

  <g filter="url(#sk)"><rect x="350" y="216" width="230" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="465" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">左下分到 [8, 12)</text>

  <path d="M 465 254 L 465 270" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#arrr)"/>
  <text x="478" y="267" font-size="10" fill="#b03a3a">全部小于</text>

  <g filter="url(#sk)"><rect x="350" y="272" width="230" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="465" y="296" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">左上分到 [12, 16)（最大）</text>

  <!-- ===== 底部：关键观察 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="330" width="540" height="108" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="330" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">全称不等式 + 鸽笼：右上的每个数都小于象限外的每个数</text>
  <text x="330" y="384" text-anchor="middle" font-size="11.5" fill="#444">→ 右上必然恰为最小的 4^(N−1) 个数，其余象限依次领取后续连续块</text>
  <text x="330" y="410" text-anchor="middle" font-size="11.5" fill="#444">每段内部继续同样四分（自相似）→ 特殊网格唯一，示例输出即标准答案</text>
</svg>
