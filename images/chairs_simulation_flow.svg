<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="42" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="700" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">一次遍历模拟：算法流程</text>
  <path d="M 170 38 Q 360 46 550 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <ellipse cx="360" cy="66" rx="46" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="360" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">开始</text>

  <path d="M 360 88 L 360 98" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="280" y="102" width="160" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="360" y="127" text-anchor="middle" font-size="13" fill="#2b2b2b">cur = 0，ans = 0</text>

  <path d="M 360 142 L 360 154" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="272" y="158" width="176" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="360" y="178" text-anchor="middle" font-size="13" fill="#2b2b2b">取下一个字符 c</text>
  <text x="360" y="196" text-anchor="middle" font-size="10.5" fill="#888">（下标 i 前进一格）</text>

  <path d="M 360 204 L 360 218" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="360,222 462,272 360,322 258,272" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="360" y="277" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">c == 'E' ?</text>

  <path d="M 258 272 L 150 272 L 150 342" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="204" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">是</text>

  <g filter="url(#sk)">
    <rect x="60" y="346" width="180" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="150" y="370" text-anchor="middle" font-size="13" fill="#2b2b2b">cur = cur + 1</text>
  <text x="150" y="390" text-anchor="middle" font-size="13" fill="#2b2b2b">ans = max(ans, cur)</text>

  <path d="M 462 272 L 570 272 L 570 342" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="516" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">否</text>

  <g filter="url(#sk)">
    <rect x="480" y="346" width="180" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="570" y="380" text-anchor="middle" font-size="13" fill="#2b2b2b">cur = cur − 1</text>

  <path d="M 150 404 L 150 430 L 570 430" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 360 430 L 360 444" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="360,448 454,496 360,544 266,496" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="360" y="501" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">还有字符吗？</text>

  <path d="M 454 496 L 672 496 L 672 180 L 452 180" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="560" y="484" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">是：取下一个字符</text>

  <path d="M 360 544 L 360 562" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="378" y="558" font-size="12" font-weight="bold" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <ellipse cx="360" cy="588" rx="58" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="360" y="593" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">返回 ans</text>

  <g filter="url(#sk)">
    <rect x="40" y="632" width="640" height="52" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="360" y="654" text-anchor="middle" font-size="12" fill="#444">小提示：'L' 分支后 cur 只减不增，ans 不可能变大</text>
  <text x="360" y="674" text-anchor="middle" font-size="12" fill="#444">因此 ans = max(ans, cur) 的更新只需放在 'E' 分支内</text>
</svg>
