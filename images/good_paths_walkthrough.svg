<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="700" height="470" fill="#fafafa"/>

  <g filter="url(#sk2)">
    <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">示例 1 演算：按值 1 → 2 → 3 逐组「点亮」节点</text>
    <path d="M 120 40 Q 350 50 580 40" stroke="#2b2b2b" stroke-width="1.5" fill="none"/>
  </g>

  <!-- panel titles -->
  <g filter="url(#sk2)">
    <text x="127" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">处理 v = 1：组 {0, 3}</text>
    <text x="350" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">处理 v = 2：组 {2}</text>
    <text x="573" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">处理 v = 3：组 {1, 4}</text>
  </g>

  <!-- panel separators -->
  <g filter="url(#sk)">
    <path d="M 239 75 V 320" stroke="#ddd" stroke-width="1" stroke-dasharray="3 4"/>
    <path d="M 462 75 V 320" stroke="#ddd" stroke-width="1" stroke-dasharray="3 4"/>
    <path d="M 231 200 H 245" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
    <path d="M 454 200 H 468" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)"/>
  </g>

  <!-- panel 1 edges: all inactive -->
  <g filter="url(#sk)">
    <path d="M 125 170 Q 95 200 65 235" stroke="#bbb" stroke-width="1.4" fill="none" stroke-dasharray="4 4"/>
    <path d="M 125 170 Q 155 200 185 235" stroke="#bbb" stroke-width="1.4" fill="none" stroke-dasharray="4 4"/>
    <path d="M 185 235 Q 160 265 140 295" stroke="#bbb" stroke-width="1.4" fill="none" stroke-dasharray="4 4"/>
    <path d="M 185 235 Q 205 265 220 295" stroke="#bbb" stroke-width="1.4" fill="none" stroke-dasharray="4 4"/>
  </g>
  <!-- panel 2 edges: 0-2,2-3 merged (orange), rest inactive -->
  <g filter="url(#sk)">
    <path d="M 348 170 Q 318 200 288 235" stroke="#bbb" stroke-width="1.4" fill="none" stroke-dasharray="4 4"/>
    <path d="M 408 235 Q 428 265 443 295" stroke="#bbb" stroke-width="1.4" fill="none" stroke-dasharray="4 4"/>
    <path d="M 348 170 Q 378 200 408 235" stroke="#d6a040" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 408 235 Q 383 265 363 295" stroke="#d6a040" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- panel 3 edges: 0-2,2-3 old (green), 0-1,2-4 new (orange) -->
  <g filter="url(#sk)">
    <path d="M 571 170 Q 601 200 631 235" stroke="#4a7a3a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 631 235 Q 606 265 586 295" stroke="#4a7a3a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 571 170 Q 541 200 511 235" stroke="#d6a040" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 631 235 Q 651 265 666 295" stroke="#d6a040" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- panel 1 nodes: 0,3 group (orange), others inactive -->
  <g filter="url(#sk)">
    <circle cx="125" cy="170" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="65" cy="235" r="15" fill="#ffffff" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/>
    <circle cx="185" cy="235" r="15" fill="#ffffff" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/>
    <circle cx="140" cy="295" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="220" cy="295" r="15" fill="#ffffff" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/>
  </g>
  <!-- panel 2 nodes: 2 group, 0,3 blue, 1,4 inactive -->
  <g filter="url(#sk)">
    <circle cx="348" cy="170" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="288" cy="235" r="15" fill="#ffffff" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/>
    <circle cx="408" cy="235" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="363" cy="295" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="443" cy="295" r="15" fill="#ffffff" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/>
  </g>
  <!-- panel 3 nodes: 1,4 group + red ring, 0,2,3 blue -->
  <g filter="url(#sk)">
    <circle cx="571" cy="170" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="631" cy="235" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="586" cy="295" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="511" cy="235" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="666" cy="295" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="511" cy="235" r="20.5" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="666" cy="295" r="20.5" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4"/>
  </g>

  <!-- node ids + values -->
  <g filter="url(#sk2)">
    <text x="125" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">0</text>
    <text x="65" y="239" text-anchor="middle" font-size="11" font-weight="bold" fill="#999">1</text>
    <text x="185" y="239" text-anchor="middle" font-size="11" font-weight="bold" fill="#999">2</text>
    <text x="140" y="299" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">3</text>
    <text x="220" y="299" text-anchor="middle" font-size="11" font-weight="bold" fill="#999">4</text>
    <text x="125" y="196" text-anchor="middle" font-size="9" fill="#7a5415">1</text>
    <text x="65" y="261" text-anchor="middle" font-size="9" fill="#aaa">3</text>
    <text x="185" y="261" text-anchor="middle" font-size="9" fill="#aaa">2</text>
    <text x="140" y="321" text-anchor="middle" font-size="9" fill="#7a5415">1</text>
    <text x="220" y="321" text-anchor="middle" font-size="9" fill="#aaa">3</text>

    <text x="348" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">0</text>
    <text x="288" y="239" text-anchor="middle" font-size="11" font-weight="bold" fill="#999">1</text>
    <text x="408" y="239" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">2</text>
    <text x="363" y="299" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">3</text>
    <text x="443" y="299" text-anchor="middle" font-size="11" font-weight="bold" fill="#999">4</text>
    <text x="348" y="196" text-anchor="middle" font-size="9" fill="#2b4a6e">1</text>
    <text x="288" y="261" text-anchor="middle" font-size="9" fill="#aaa">3</text>
    <text x="408" y="261" text-anchor="middle" font-size="9" fill="#7a5415">2</text>
    <text x="363" y="321" text-anchor="middle" font-size="9" fill="#2b4a6e">1</text>
    <text x="443" y="321" text-anchor="middle" font-size="9" fill="#aaa">3</text>

    <text x="571" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">0</text>
    <text x="511" y="239" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">1</text>
    <text x="631" y="239" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">2</text>
    <text x="586" y="299" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">3</text>
    <text x="666" y="299" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">4</text>
    <text x="571" y="196" text-anchor="middle" font-size="9" fill="#2b4a6e">1</text>
    <text x="511" y="261" text-anchor="middle" font-size="9" fill="#7a5415">3</text>
    <text x="631" y="261" text-anchor="middle" font-size="9" fill="#2b4a6e">2</text>
    <text x="586" y="321" text-anchor="middle" font-size="9" fill="#2b4a6e">1</text>
    <text x="666" y="321" text-anchor="middle" font-size="9" fill="#7a5415">3</text>
  </g>

  <!-- panel captions -->
  <g filter="url(#sk2)">
    <text x="127" y="346" text-anchor="middle" font-size="9.5" fill="#444">0 的邻居值 3、2 &gt; 1，3 的邻居值 2 &gt; 1</text>
    <text x="127" y="362" text-anchor="middle" font-size="9.5" fill="#444">→ 无边可合并；各成单桶 → +0，ans = 5</text>
    <text x="350" y="346" text-anchor="middle" font-size="9.5" fill="#444">点亮 2：合并 2–0、2–3 → 连通块 {0,2,3}</text>
    <text x="350" y="362" text-anchor="middle" font-size="9.5" fill="#444">组 {2} 单独一桶 → +0，ans = 5</text>
    <text x="573" y="346" text-anchor="middle" font-size="9.5" fill="#444">点亮 1、4：合并 0–1、2–4 → 全树连通</text>
    <text x="573" y="362" text-anchor="middle" font-size="9.5" fill="#b03a3a" font-weight="bold">组 {1,4} 同根 k=2 → +1，ans = 6 ✓</text>
  </g>

  <!-- bottom formula -->
  <g filter="url(#sk)">
    <rect x="60" y="378" width="580" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk2)">
    <text x="350" y="406" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">ans = n（单节点路径）+ Σ 每组每桶 C(k, 2)</text>
    <text x="350" y="430" text-anchor="middle" font-size="11" fill="#555">本例 = 5 + (v=1: 0) + (v=2: 0) + (v=3: C(2,2)=1) = 6 ✓</text>
    <text x="350" y="448" text-anchor="middle" font-size="9" fill="#999">图例：橙 = 本组节点 / 本步合并边，绿 = 已合并边，虚线 = 未点亮</text>
  </g>
</svg>
