<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：s = "leetcode"，t = "coats" → 7 步</text>

  <!-- ===== frequency diff table ===== -->
  <g stroke="#ccc" stroke-width="1.2" fill="#fdfdfd">
    <rect x="40"  y="48" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="95"  y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="155" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="215" y="48" width="57" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="272" y="48" width="58" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="40" y="78"  width="55" height="29" filter="url(#rough2)"/><rect x="95" y="78"  width="60" height="29" filter="url(#rough2)"/><rect x="155" y="78"  width="60" height="29" filter="url(#rough2)"/><rect x="215" y="78"  width="57" height="29" filter="url(#rough2)"/><rect x="272" y="78"  width="58" height="29" fill="#fff8e1" filter="url(#rough2)"/>
    <rect x="40" y="107" width="55" height="29" filter="url(#rough2)"/><rect x="95" y="107" width="60" height="29" filter="url(#rough2)"/><rect x="155" y="107" width="60" height="29" filter="url(#rough2)"/><rect x="215" y="107" width="57" height="29" filter="url(#rough2)"/><rect x="272" y="107" width="58" height="29" filter="url(#rough2)"/>
    <rect x="40" y="136" width="55" height="29" filter="url(#rough2)"/><rect x="95" y="136" width="60" height="29" filter="url(#rough2)"/><rect x="155" y="136" width="60" height="29" filter="url(#rough2)"/><rect x="215" y="136" width="57" height="29" filter="url(#rough2)"/><rect x="272" y="136" width="58" height="29" fill="#fff8e1" filter="url(#rough2)"/>
    <rect x="40" y="165" width="55" height="29" filter="url(#rough2)"/><rect x="95" y="165" width="60" height="29" filter="url(#rough2)"/><rect x="155" y="165" width="60" height="29" filter="url(#rough2)"/><rect x="215" y="165" width="57" height="29" filter="url(#rough2)"/><rect x="272" y="165" width="58" height="29" fill="#fff8e1" filter="url(#rough2)"/>
    <rect x="40" y="194" width="55" height="29" filter="url(#rough2)"/><rect x="95" y="194" width="60" height="29" filter="url(#rough2)"/><rect x="155" y="194" width="60" height="29" filter="url(#rough2)"/><rect x="215" y="194" width="57" height="29" filter="url(#rough2)"/><rect x="272" y="194" width="58" height="29" fill="#fff8e1" filter="url(#rough2)"/>
    <rect x="40" y="223" width="55" height="29" filter="url(#rough2)"/><rect x="95" y="223" width="60" height="29" filter="url(#rough2)"/><rect x="155" y="223" width="60" height="29" filter="url(#rough2)"/><rect x="215" y="223" width="57" height="29" filter="url(#rough2)"/><rect x="272" y="223" width="58" height="29" filter="url(#rough2)"/>
    <rect x="40" y="252" width="55" height="29" filter="url(#rough2)"/><rect x="95" y="252" width="60" height="29" filter="url(#rough2)"/><rect x="155" y="252" width="60" height="29" filter="url(#rough2)"/><rect x="215" y="252" width="57" height="29" filter="url(#rough2)"/><rect x="272" y="252" width="58" height="29" fill="#fff8e1" filter="url(#rough2)"/>
    <rect x="40" y="281" width="55" height="29" filter="url(#rough2)"/><rect x="95" y="281" width="60" height="29" filter="url(#rough2)"/><rect x="155" y="281" width="60" height="29" filter="url(#rough2)"/><rect x="215" y="281" width="57" height="29" filter="url(#rough2)"/><rect x="272" y="281" width="58" height="29" filter="url(#rough2)"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#33506b" text-anchor="middle">
    <text x="67"  y="67" filter="url(#rough2)">字符</text>
    <text x="125" y="67" filter="url(#rough2)">cntS</text>
    <text x="185" y="67" filter="url(#rough2)">cntT</text>
    <text x="243" y="67" filter="url(#rough2)">差 S−T</text>
    <text x="301" y="67" filter="url(#rough2)">绝对差</text>
  </g>
  <g font-size="11.5" text-anchor="middle">
    <text x="67" y="98"  fill="#555" filter="url(#rough2)">a</text><text x="125" y="98"  fill="#555" filter="url(#rough2)">0</text><text x="185" y="98"  fill="#555" filter="url(#rough2)">1</text><text x="243" y="98"  fill="#b85450" filter="url(#rough2)">−1</text><text x="301" y="98"  font-weight="bold" fill="#7a5415" filter="url(#rough2)">1</text>
    <text x="67" y="127" fill="#555" filter="url(#rough2)">c</text><text x="125" y="127" fill="#555" filter="url(#rough2)">1</text><text x="185" y="127" fill="#555" filter="url(#rough2)">1</text><text x="243" y="127" fill="#999" filter="url(#rough2)">0</text><text x="301" y="127" fill="#999" filter="url(#rough2)">0</text>
    <text x="67" y="156" fill="#555" filter="url(#rough2)">d</text><text x="125" y="156" fill="#555" filter="url(#rough2)">1</text><text x="185" y="156" fill="#555" filter="url(#rough2)">0</text><text x="243" y="156" fill="#33506b" filter="url(#rough2)">+1</text><text x="301" y="156" font-weight="bold" fill="#7a5415" filter="url(#rough2)">1</text>
    <text x="67" y="185" fill="#555" filter="url(#rough2)">e</text><text x="125" y="185" fill="#555" filter="url(#rough2)">3</text><text x="185" y="185" fill="#555" filter="url(#rough2)">0</text><text x="243" y="185" font-weight="bold" fill="#33506b" filter="url(#rough2)">+3</text><text x="301" y="185" font-weight="bold" fill="#7a5415" filter="url(#rough2)">3</text>
    <text x="67" y="214" fill="#555" filter="url(#rough2)">l</text><text x="125" y="214" fill="#555" filter="url(#rough2)">1</text><text x="185" y="214" fill="#555" filter="url(#rough2)">0</text><text x="243" y="214" fill="#33506b" filter="url(#rough2)">+1</text><text x="301" y="214" font-weight="bold" fill="#7a5415" filter="url(#rough2)">1</text>
    <text x="67" y="243" fill="#555" filter="url(#rough2)">o</text><text x="125" y="243" fill="#555" filter="url(#rough2)">1</text><text x="185" y="243" fill="#555" filter="url(#rough2)">1</text><text x="243" y="243" fill="#999" filter="url(#rough2)">0</text><text x="301" y="243" fill="#999" filter="url(#rough2)">0</text>
    <text x="67" y="272" fill="#555" filter="url(#rough2)">s</text><text x="125" y="272" fill="#555" filter="url(#rough2)">0</text><text x="185" y="272" fill="#555" filter="url(#rough2)">1</text><text x="243" y="272" fill="#b85450" filter="url(#rough2)">−1</text><text x="301" y="272" font-weight="bold" fill="#7a5415" filter="url(#rough2)">1</text>
    <text x="67" y="301" fill="#555" filter="url(#rough2)">t</text><text x="125" y="301" fill="#555" filter="url(#rough2)">1</text><text x="185" y="301" fill="#555" filter="url(#rough2)">1</text><text x="243" y="301" fill="#999" filter="url(#rough2)">0</text><text x="301" y="301" fill="#999" filter="url(#rough2)">0</text>
  </g>
  <rect x="40" y="310" width="232" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="156" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">合计 Σ|差|</text>
  <rect x="272" y="310" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="301" y="333" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">7</text>
  <text x="185" y="366" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">只列出出现过的字符（其余字母 |diff| = 0）</text>

  <!-- ===== construction plan ===== -->
  <rect x="360" y="48" width="330" height="120" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="525" y="70" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">构造追加方案（恰好达到下界）</text>
  <g font-size="10.5" fill="#555">
    <text x="374" y="94" filter="url(#rough2)">向 s 追加：a、s（2 步）→ "leetcodeas"</text>
    <text x="374" y="113" filter="url(#rough2)">向 t 追加：d、e、e、e、l（5 步）→ "coatsleede"</text>
    <text x="374" y="136" font-size="9.5" fill="#888" filter="url(#rough2)">追加顺序任意——只看多重集合，不看排列</text>
  </g>

  <!-- ===== verify ===== -->
  <rect x="360" y="182" width="330" height="74" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="525" y="204" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b" filter="url(#rough2)">验证：多重集合相同</text>
  <g font-size="10.5" fill="#555">
    <text x="374" y="226" filter="url(#rough2)">两串均含 a1 c1 d1 e3 l1 o1 s1 t1（各 10 字符）</text>
    <text x="374" y="246" filter="url(#rough2)">互为字母异位词 ✓</text>
  </g>

  <!-- ===== equal-length view ===== -->
  <rect x="360" y="270" width="330" height="175" rx="8" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">等长视角：异位词 ⇒ 终长度相等</text>

  <rect x="390" y="312" width="192" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="582" y="312" width="48"  height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="384" y="328" text-anchor="end" font-size="10.5" fill="#33506b" filter="url(#rough2)">|s| = 8</text>
  <text x="606" y="328" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">+2</text>

  <rect x="390" y="352" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="510" y="352" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="384" y="368" text-anchor="end" font-size="10.5" fill="#2e5b2e" filter="url(#rough2)">|t| = 5</text>
  <text x="570" y="368" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">+5</text>

  <path d="M 630 304 L 630 386" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="630" y="400" text-anchor="middle" font-size="10" fill="#a8781f" filter="url(#rough2)">L* = Σmax = 10</text>

  <text x="525" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">ans = 2L* − |s| − |t| = 20 − 8 − 5 = 7</text>
  <text x="525" y="438" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">终长每 +1 两串各补 1 步 → 取最小可行终长</text>
</svg>
