<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：max 只增不减 ⇒ 越界即弃；结合律 ⇒ 顺序无关</text>
  <path d="M 130 40 Q 340 48 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① one dim over target => whole triplet discarded -->
  <text x="48" y="84" font-size="13" font-weight="bold" fill="#2b2b2b">① 一维越界 ⇒ 整个三元组弃用（例 1 的 [1,8,4]）</text>
  <text x="92" y="109" text-anchor="end" font-size="11" fill="#666" font-family="monospace">target</text>
  <g filter="url(#sk)">
    <rect x="100" y="92" width="34" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="138" y="92" width="34" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="176" y="92" width="34" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="117" y="110" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-family="monospace">2</text>
  <text x="155" y="110" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-family="monospace">7</text>
  <text x="193" y="110" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-family="monospace">5</text>
  <text x="92" y="143" text-anchor="end" font-size="11" fill="#666" font-family="monospace">t</text>
  <g filter="url(#sk)">
    <rect x="100" y="126" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="138" y="126" width="34" height="26" rx="4" fill="#fdecea" stroke="#b85450" stroke-width="2.2"/>
    <rect x="176" y="126" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="117" y="144" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">1</text>
  <text x="155" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" font-family="monospace">8</text>
  <text x="193" y="144" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">4</text>
  <text x="117" y="170" text-anchor="middle" font-size="11" fill="#2e6e2e">1≤2 ✓</text>
  <text x="155" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">8&gt;7 ✗</text>
  <text x="193" y="170" text-anchor="middle" font-size="11" fill="#2e6e2e">4≤5 ✓</text>
  <text x="222" y="143" font-size="12.5" font-weight="bold" fill="#b03a3a">⇒ 整体弃用</text>
  <text x="48" y="192" font-size="11" fill="#666">合并逐维同时进行，无法只取它「好」的维度</text>

  <!-- ② order irrelevant: merge == per-dim max over the set -->
  <text x="48" y="224" font-size="13" font-weight="bold" fill="#2b2b2b">② 顺序无关：合并结果 = 集合逐维取 max（例 3）</text>
  <g filter="url(#sk)">
    <rect x="48" y="236" width="32" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="86" y="236" width="32" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="124" y="236" width="32" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="190" y="236" width="32" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="228" y="236" width="32" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="266" y="236" width="32" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="332" y="236" width="32" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="370" y="236" width="32" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="408" y="236" width="32" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="48" y="272" width="32" height="26" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="86" y="272" width="32" height="26" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="124" y="272" width="32" height="26" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="190" y="272" width="32" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="228" y="272" width="32" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="266" y="272" width="32" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="332" y="272" width="32" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="370" y="272" width="32" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="408" y="272" width="32" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="64" y="254" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">2</text>
  <text x="102" y="254" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">5</text>
  <text x="140" y="254" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">3</text>
  <text x="172" y="254" text-anchor="middle" font-size="15" fill="#7a5415">⊕</text>
  <text x="206" y="254" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">1</text>
  <text x="244" y="254" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">2</text>
  <text x="282" y="254" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">5</text>
  <text x="312" y="254" text-anchor="middle" font-size="14" fill="#444">=</text>
  <text x="348" y="254" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">2</text>
  <text x="386" y="254" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">5</text>
  <text x="424" y="254" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">5</text>
  <text x="64" y="290" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">2</text>
  <text x="102" y="290" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">5</text>
  <text x="140" y="290" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace">5</text>
  <text x="172" y="290" text-anchor="middle" font-size="15" fill="#7a5415">⊕</text>
  <text x="206" y="290" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">5</text>
  <text x="244" y="290" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">2</text>
  <text x="282" y="290" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">3</text>
  <text x="312" y="290" text-anchor="middle" font-size="14" fill="#444">=</text>
  <text x="348" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">5</text>
  <text x="386" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">5</text>
  <text x="424" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">5</text>
  <text x="386" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">= target ✓</text>
  <text x="48" y="330" font-size="11" fill="#666">任意顺序、任意括号合并同一集合，结果都相同 —— max 的交换律 + 结合律</text>

  <!-- ③ only need M(U) of the usable全集 -->
  <text x="48" y="360" font-size="13" font-weight="bold" fill="#2b2b2b">③ 只需检查「可用全集 U」的聚合结果 M(U)</text>
  <text x="48" y="384" font-size="11.5" fill="#444">U = { t : a ≤ x 且 b ≤ y 且 c ≤ z }，M(U) = [max a, max b, max c]</text>
  <text x="48" y="402" font-size="11.5" fill="#444">S ⊆ U ⇒ M(S) ≤ M(U)，且 M(U) 每维 ≤ target</text>
  <text x="48" y="420" font-size="11.5" fill="#444">⇒ ∃S: M(S) = target ⟺ M(U) = target</text>
  <text x="48" y="442" font-size="12.5" font-weight="bold" fill="#2e6e2e">⇒ 一遍扫描聚合即可判定：O(n) 时间 / O(1) 空间</text>
  <text x="48" y="464" font-size="11" fill="#888">两条代数性质 ⇒ 无需模拟任何合并过程</text>

  <!-- right observation boxes -->
  <g filter="url(#sk)">
    <rect x="430" y="60" width="226" height="118" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="543" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">观察① max 单调</text>
  <text x="543" y="106" text-anchor="middle" font-size="11" fill="#444">逐维只增、不减</text>
  <text x="543" y="124" text-anchor="middle" font-size="11" fill="#444">一维一旦超过 target</text>
  <text x="543" y="142" text-anchor="middle" font-size="11" fill="#444">该维永久无法回退</text>
  <text x="543" y="160" text-anchor="middle" font-size="11" fill="#666">⇒ 越界三元组整体弃用</text>
  <g filter="url(#sk)">
    <rect x="430" y="192" width="226" height="118" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="543" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">观察② 代数塌缩</text>
  <text x="543" y="238" text-anchor="middle" font-size="11" fill="#444">max 可交换、可结合</text>
  <text x="543" y="256" text-anchor="middle" font-size="11" fill="#444">「合并过程」塌缩成</text>
  <text x="543" y="274" text-anchor="middle" font-size="11" fill="#444">「集合聚合」M(S)</text>
  <text x="543" y="292" text-anchor="middle" font-size="11" fill="#666">免枚举 2ⁿ 个子集</text>
  <g filter="url(#sk)">
    <rect x="430" y="324" width="226" height="118" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="543" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">观察③ 极值代表</text>
  <text x="543" y="370" text-anchor="middle" font-size="11" fill="#444">M(U) 每维 ≤ target</text>
  <text x="543" y="388" text-anchor="middle" font-size="11" fill="#444">是「最接近 target」的</text>
  <text x="543" y="406" text-anchor="middle" font-size="11" fill="#444">唯一代表候选</text>
  <text x="543" y="424" text-anchor="middle" font-size="11" fill="#666">查它一个 = 查所有子集</text>
</svg>
