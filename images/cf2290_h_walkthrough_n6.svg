<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="800" height="470" fill="#fafafa"/>

  <text x="390" y="28" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3 演算：n = 6，重链给出的 M = 2 ⇒ 答案 4</text>
  <path d="M 190 38 Q 390 45 590 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 未覆盖的子树 -->
  <ellipse cx="495" cy="312" rx="54" ry="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"
           stroke-dasharray="6 4" filter="url(#rough3)"/>

  <!-- 灰边（未覆盖部分） -->
  <line x1="390" y1="172" x2="495" y2="266" stroke="#9a9a9a" stroke-width="1.7" filter="url(#rough2)"/>
  <line x1="495" y1="266" x2="495" y2="358" stroke="#9a9a9a" stroke-width="1.7" filter="url(#rough2)"/>

  <!-- 蓝边（选中的链） -->
  <line x1="390" y1="84" x2="390" y2="172" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="390" y1="172" x2="285" y2="266" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="285" y1="266" x2="285" y2="358" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="390" cy="84" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <circle cx="390" cy="172" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <circle cx="285" cy="266" r="15" fill="#e3eefc" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="271" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="495" cy="266" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="495" y="271" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">4</text>
  <circle cx="285" cy="358" r="15" fill="#e3eefc" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="363" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <circle cx="495" cy="358" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="495" y="363" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">6</text>

  <!-- sz 标注 -->
  <text x="414" y="80" font-size="11" fill="#446688" filter="url(#rough2)">sz=6</text>
  <text x="414" y="168" font-size="11" fill="#446688" filter="url(#rough2)">sz=5</text>
  <text x="263" y="262" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">sz=2</text>
  <text x="517" y="262" font-size="11" fill="#a14340" filter="url(#rough2)">sz=2</text>
  <text x="263" y="354" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">sz=1</text>
  <text x="517" y="354" font-size="11" fill="#a14340" filter="url(#rough2)">sz=1</text>
  <text x="252" y="214" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">重儿子(与 4 并列取 3)</text>

  <!-- 右：候选对比 -->
  <rect x="576" y="66" width="196" height="86" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="674" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">✓ 路径 1-2-3-5</text>
  <text x="674" y="108" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">w = 1，未覆盖 {4, 6}</text>
  <text x="674" y="128" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">未覆盖最大 sz = 2</text>
  <text x="674" y="147" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">可达 6 − 2 = 4</text>

  <rect x="576" y="168" width="196" height="86" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="674" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">✗ 路径 5-3-2-4-6</text>
  <text x="674" y="210" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">w = 2，sz[2] = 5</text>
  <text x="674" y="230" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">父边没进环 ⇒ 全部失联</text>
  <text x="674" y="249" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a302c" filter="url(#rough2)">只剩 1 个可达</text>

  <text x="674" y="280" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">路径的顶端 w ≠ 1 时，</text>
  <text x="674" y="298" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">sz[w] 永远白丢 —— 所以 w 取根。</text>

  <!-- 结论 -->
  <rect x="40" y="408" width="732" height="50" rx="9" fill="#f2f7fd" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="406" y="428" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">dp(5)=dp(6)=0 ⇒ dp(3)=max(s₂=0, 0)=0；dp(4)=0 ⇒ dp(2)=max(s₂=2, dp(3))=2</text>
  <text x="406" y="447" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f3a55" filter="url(#rough2)">根只有 1 个儿子 ⇒ 单链 1-2-3-5；未覆盖 {4, 6} 的最大 sz = 2 ⇒ 答案 6 − 2 = 4</text>
</svg>
