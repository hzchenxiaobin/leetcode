<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 392"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="392" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：stamp = "abc"，target = "ababc"</text>
  <rect x="50" y="60" width="130" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="89.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">起始</text>
  <rect x="196" y="60" width="170" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281.0" y="90.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a b a b c</text>
  <text x="382" y="90" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">—</text>
  <rect x="50" y="122" width="130" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="151.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">第 1 擦 i=2</text>
  <rect x="196" y="122" width="170" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281.0" y="152.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a b ? ? ?</text>
  <text x="382" y="152" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">对照 abc 完全吻合，记录 2</text>
  <rect x="50" y="184" width="130" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="213.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">第 2 擦 i=0</text>
  <rect x="196" y="184" width="170" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281.0" y="214.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">? ? ? ? ?</text>
  <text x="382" y="214" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">'a','b' 吻合，其余已是 ?，记录 0</text>
  <rect x="50" y="246" width="130" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="275.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">反转</text>
  <rect x="196" y="246" width="170" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281.0" y="276.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[2, 0] → [0, 2]</text>
  <text x="382" y="276" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">盖章顺序：先 0 后 2</text>
  <text x="330" y="330" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">正向验证：[0,2] 依次盖 "abc" 于位置 0、2 → "abc??" → "ababc" ✓</text>
  <text x="330" y="372" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">第二个示例 stamp="abca"、target="aabcaca" 的解为 [3,0,1]，同样可逆序擦出</text>
</svg>
