<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">allowed 的字符集 → 一个 26 位整数掩码</text>

  <!-- allowed 字符串 -->
  <text x="120" y="70" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">allowed = "cad"</text>
  <g filter="url(#rough2)">
    <rect x="60" y="82" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="96" y="82" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="132" y="82" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="77" y="104">c</text><text x="113" y="104">a</text><text x="149" y="104">d</text>
  </g>
  <path d="M 165 100 L 210 100" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="90" font-size="12" fill="#446688" filter="url(#rough2)">置位</text>

  <!-- 位掩码行 -->
  <text x="420" y="70" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">mask（a b c d 四位为 1）</text>
  <g filter="url(#rough2)">
    <rect x="300" y="82" width="30" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="330" y="82" width="30" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="360" y="82" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="390" y="82" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="420" y="82" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="450" y="82" width="30" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="480" y="82" width="30" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="315" y="104">0</text><text x="345" y="104">0</text>
    <text x="375" y="104" fill="#2d5a22" font-weight="bold">1</text>
    <text x="405" y="104" fill="#2d5a22" font-weight="bold">1</text>
    <text x="435" y="104" fill="#2d5a22" font-weight="bold">1</text>
    <text x="465" y="104">0</text><text x="495" y="104">0</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="375" y="132">a</text><text x="405" y="132">c</text><text x="435" y="132">d</text>
  </g>

  <!-- 子集判断 -->
  <text x="120" y="176" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">word = "bad"</text>
  <g filter="url(#rough2)">
    <rect x="60" y="188" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="96" y="188" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="132" y="188" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#b85450" text-anchor="middle">
    <text x="77" y="210">b</text><text x="113" y="210">a</text><text x="149" y="210">d</text>
  </g>
  <text x="200" y="212" font-size="14" fill="#b85450" filter="url(#rough2)">'b' 位为 1，mask 上是 0 → 不是子集 ✗</text>

  <text x="120" y="266" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">word = "acd"</text>
  <g filter="url(#rough2)">
    <rect x="60" y="278" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="96" y="278" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="132" y="278" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#2d5a22" text-anchor="middle">
    <text x="77" y="300">a</text><text x="113" y="300">c</text><text x="149" y="300">d</text>
  </g>
  <text x="200" y="302" font-size="14" fill="#2d5a22" filter="url(#rough2)">全部位落在 mask 的 1 上 → 子集 ✓ 一致字符串</text>

  <rect x="330" y="256" width="200" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" fill="#7a5c1e" text-anchor="middle">
    <text x="430" y="282">m &amp; ~mask == 0</text>
    <text x="430" y="304">⟺ word 的字符集 ⊆ allowed</text>
  </g>
</svg>
