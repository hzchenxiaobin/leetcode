<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">dp 表从右往左填：每个位置只依赖右侧</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">j7、j30 都大于 i，所以倒序填表时它们已经算好</text>
  <text x="30" y="74" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">从右往左递推（示例 1）</text>
  <text x="30" y="100" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">days</text>
  <rect x="30" y="108" width="60" height="34" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="60.0" y="128.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="90" y="108" width="60" height="34" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="120.0" y="128.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="150" y="108" width="60" height="34" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="180.0" y="128.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="210" y="108" width="60" height="34" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="240.0" y="128.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="270" y="108" width="60" height="34" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="300.0" y="128.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="330" y="108" width="60" height="34" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="360.0" y="128.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">20</text>
  <text x="30" y="176" font-size="10.5" fill="#888" text-anchor="start" filter="url(#rough2)">dp[i]</text>
  <rect x="30" y="184" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="60.0" y="208.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="90" y="184" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="120.0" y="208.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="150" y="184" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="180.0" y="208.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="210" y="184" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="240.0" y="208.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="270" y="184" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="300.0" y="208.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="330" y="184" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="360.0" y="208.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="30" y="250" font-size="11" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">i = 5 → 4 → 3 → 2 → 1 → 0</text>
  <text x="30" y="272" font-size="11" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">每格做两次 lower_bound 就能定出 j7 / j30</text>
  <text x="30" y="294" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">dp[6] = 0 是哨兵：后面没有旅行日了</text>
  <rect x="30" y="312" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="333" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">答案 = dp[0] = 11</text><text x="40" y="348.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">对应买法：1 天票 + 7 天票（3~9）+ 1 天票，或 1 天票 + 7 天票（1~7）+ 7 天票</text>
</svg>
