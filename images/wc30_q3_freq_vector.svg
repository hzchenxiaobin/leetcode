<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：排列只由字符频次决定</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">s2 中某个长度 m=|s1| 的窗口，若其 26 维计数向量与 s1 逐格相同，它就是 s1 的一个排列</text>

  <rect x="40" y="62" width="214" height="218" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="58" y="88" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">s1 = "ab"</text>
  <rect x="58" y="98" width="32" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="74" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="96" y="98" width="32" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="112" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>

  <text x="58" y="152" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">cnt_s1（26 格频率表）</text>
  <rect x="58" y="160" width="178" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="176" font-size="10.5" fill="#555" filter="url(#rough2)">a</text>
  <text x="226" y="176" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="58" y="186" width="178" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="202" font-size="10.5" fill="#555" filter="url(#rough2)">b</text>
  <text x="226" y="202" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="58" y="212" width="178" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="228" font-size="10.5" fill="#555" filter="url(#rough2)">c ~ z</text>
  <text x="226" y="228" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="58" y="258" font-size="9" fill="#7a8aa0" filter="url(#rough2)">只画前几格，其余同理</text>

  <text x="280" y="180" text-anchor="middle" font-size="22" fill="#666" filter="url(#rough2)">=</text>
  <text x="280" y="202" text-anchor="middle" font-size="9" fill="#8a8a8a" filter="url(#rough2)">逐格</text>
  <text x="280" y="216" text-anchor="middle" font-size="9" fill="#8a8a8a" filter="url(#rough2)">相同</text>

  <rect x="306" y="62" width="214" height="218" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="324" y="88" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">窗口 s2[3..4] = "ba"</text>
  <rect x="324" y="98" width="32" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="340" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="362" y="98" width="32" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="378" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <text x="324" y="152" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">cnt_win（同长度窗口）</text>
  <rect x="324" y="160" width="178" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="336" y="176" font-size="10.5" fill="#555" filter="url(#rough2)">a</text>
  <text x="492" y="176" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="324" y="186" width="178" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="336" y="202" font-size="10.5" fill="#555" filter="url(#rough2)">b</text>
  <text x="492" y="202" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="324" y="212" width="178" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="336" y="228" font-size="10.5" fill="#555" filter="url(#rough2)">c ~ z</text>
  <text x="492" y="228" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="324" y="258" font-size="9" fill="#5a7a50" filter="url(#rough2)">窗口内只有 b、a 各一个</text>

  <rect x="40" y="292" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="58" y="316" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">⇒ 该窗口就是 s1 的一个排列，checkInclusion 返回 true</text>
  <text x="58" y="338" font-size="10" fill="#555" filter="url(#rough2)">于是问题化为：枚举 n−m+1 个定长窗口，逐个比对计数向量（不必真的生成排列）</text>
  <text x="58" y="357" font-size="9.5" fill="#7a7a7a" filter="url(#rough2)">示例 s1 = "ab"、s2 = "eidbaooo"：i = 3 的窗口 "ba" 逐格命中</text>
</svg>
