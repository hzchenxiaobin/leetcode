<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：s[i] = s[j] = c 时，回文只有三种来源</text>
  <text x="290" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">A 是内部区间 i+1..j-1 的全部不同回文，共 |A| = f(i+1, j-1) 个</text>

  <g filter="url(#rough2)">
    <rect x="30" y="70" width="160" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="110" y="92" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334a66">来源一：A 本身</text>
    <text x="110" y="110" text-anchor="middle" font-size="10.5" fill="#555">f(i+1, j-1)</text>
    <text x="110" y="126" text-anchor="middle" font-size="9.5" fill="#777">共 |A| 个</text>

    <rect x="210" y="70" width="170" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="295" y="92" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a30">来源二：包裹 c+q+c</text>
    <text x="295" y="110" text-anchor="middle" font-size="10.5" fill="#555">q ∈ A ∪ {ε}</text>
    <text x="295" y="126" text-anchor="middle" font-size="9.5" fill="#777">共 |A|+1 个（q 空给出 cc）</text>

    <rect x="400" y="70" width="150" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="475" y="92" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a20">来源三：单字符 c</text>
    <text x="475" y="110" text-anchor="middle" font-size="10.5" fill="#555">1 个</text>
    <text x="475" y="126" text-anchor="middle" font-size="9.5" fill="#777">可能已被 A 覆盖</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="88" y="172" width="44" height="36" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="110" y="196" text-anchor="middle" font-size="14" fill="#334">c</text>
    <rect x="228" y="172" width="44" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="196" text-anchor="middle" font-size="14" fill="#8a6a20">c</text>
    <rect x="348" y="172" width="44" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="370" y="196" text-anchor="middle" font-size="14" fill="#8a6a20">c</text>
    <rect x="478" y="172" width="44" height="36" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="500" y="196" text-anchor="middle" font-size="14" fill="#334">c</text>

    <text x="310" y="196" text-anchor="middle" font-size="13" fill="#aaa">…</text>
    <text x="435" y="196" text-anchor="middle" font-size="13" fill="#aaa">…</text>

    <text x="110" y="226" text-anchor="middle" font-size="11" fill="#446688">i</text>
    <text x="250" y="226" text-anchor="middle" font-size="11" fill="#b85450">a</text>
    <text x="370" y="226" text-anchor="middle" font-size="11" fill="#b85450">b</text>
    <text x="500" y="226" text-anchor="middle" font-size="11" fill="#446688">j</text>

    <rect x="220" y="238" width="188" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="314" y="256" text-anchor="middle" font-size="10" fill="#8a3a36">包裹的重叠只会落在这段内部</text>
  </g>

  <text x="290" y="288" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">c+q+c 在内部也出现 ⟺ 内部有两个 c 夹住 q ⟺ q ∈ f(a+1, b-1) ∪ {ε}，故重复 f(a+1, b-1)+1 个</text>

  <g filter="url(#rough2)">
    <rect x="18" y="304" width="180" height="78" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="108" y="326" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#334a66">内部 0 个 c（a &gt; b）</text>
    <text x="108" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#334a66">2·|A| + 2</text>
    <text x="108" y="370" text-anchor="middle" font-size="9.5" fill="#777">c 与 cc 都是新面孔</text>

    <rect x="206" y="304" width="178" height="78" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="295" y="326" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a5a30">内部恰 1 个 c（a = b）</text>
    <text x="295" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a5a30">2·|A| + 1</text>
    <text x="295" y="370" text-anchor="middle" font-size="9.5" fill="#777">c 已在 A 中，只有 cc 是新的</text>

    <rect x="392" y="304" width="170" height="78" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="477" y="326" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3a36">内部 ≥2 个 c（a &lt; b）</text>
    <text x="477" y="350" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36">2·|A| − f(a+1, b-1)</text>
    <text x="477" y="370" text-anchor="middle" font-size="9.5" fill="#777">cc 也能在内部找到</text>
  </g>

  <text x="290" y="414" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">a = i 之后第一个 c，b = j 之前最后一个 c：只有 4 个字母，用 next / prev 表 O(1) 查询</text>
</svg>
