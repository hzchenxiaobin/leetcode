<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 424" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="424" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：统计 ones + 找最大增益</text>
  <text x="260" y="47" text-anchor="middle" font-size="11" fill="#888">游程压缩后每个段只判一次，O(n)</text>

  <rect x="130" y="58" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">ones ← s 中 '1' 的个数</text>
  <text x="260" y="94" text-anchor="middle" font-size="10" fill="#666">同时做游程压缩，得到 ch[] 与 len[]</text>

  <path d="M 260 100 L 260 118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="122" width="260" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">best ← 0，遍历段 k = 0 … m−1</text>

  <path d="M 260 160 L 260 178" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,182 352,218 260,254 168,218" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">ch[k] == '1' 且 k 左右</text>
  <text x="260" y="230" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">都还有段？</text>

  <path d="M 352 218 L 396 218" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="374" y="210" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="400" y="198" width="104" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="452" y="216" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">跳过</text>
  <text x="452" y="231" text-anchor="middle" font-size="9.5" fill="#888">边界 1-段不可翻</text>

  <path d="M 260 254 L 260 274" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="268" font-size="10" fill="#4a7a3a">是</text>

  <rect x="130" y="278" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">best ← max(best, len[k−1] + len[k+1])</text>
  <text x="260" y="315" text-anchor="middle" font-size="10" fill="#666">两侧 0-段长度之和就是这次操作的净增益</text>

  <path d="M 390 300 L 428 300 L 428 141 L 394 141" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="444" y="262" text-anchor="middle" font-size="9.5" fill="#4a7a3a" transform="rotate(90 444 262)">下一个 k</text>

  <path d="M 260 322 L 260 342" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="346" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="366" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">返回 ones + best</text>
  <text x="260" y="383" text-anchor="middle" font-size="10" fill="#666">没有可翻的 1-段时 best = 0，答案就是 ones</text>

  <text x="260" y="414" text-anchor="middle" font-size="10" fill="#999">注意：只在整串上做一次操作，不需要考虑 l / r 截断</text>
</svg>
