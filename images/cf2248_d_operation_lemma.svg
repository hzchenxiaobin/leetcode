<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">单次操作的合法性：a ≥ |x − y|</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">以 c = 0 为例：取 a 个 (0,0)、x 个 (0,1)、y 个 (1,0)，则 k = a + x + y</text>

  <!-- 选中的位置：2 个 00、3 个 01、1 个 10 -->
  <rect x="233" y="74" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="277" y="74" width="34" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="321" y="74" width="34" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="365" y="74" width="34" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="409" y="74" width="34" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="453" y="74" width="34" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="250" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">00</text>
  <text x="294" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">00</text>
  <text x="338" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#9c3b38" filter="url(#rough2)">01</text>
  <text x="382" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#9c3b38" filter="url(#rough2)">01</text>
  <text x="426" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#9c3b38" filter="url(#rough2)">01</text>
  <text x="470" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">10</text>

  <text x="250" y="130" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a = 2</text>
  <text x="294" y="130" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">↑</text>
  <text x="382" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">x = 3</text>
  <text x="470" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">y = 1</text>

  <text x="60" y="166" font-size="12" fill="#333" filter="url(#rough2)">k = a + x + y = 2 + 3 + 1 = 6，门槛 ⌈k/2⌉ = 3</text>
  <text x="60" y="190" font-size="12" fill="#333" filter="url(#rough2)">s 侧「0」的票数 = a + x = 5（蓝 + 红），t 侧「0」的票数 = a + y = 3（蓝 + 绿）</text>

  <!-- 推导 -->
  <rect x="60" y="208" width="600" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="236" font-size="13" fill="#8a6212" filter="url(#rough2)">a + x ≥ ⌈k/2⌉ 且 a + y ≥ ⌈k/2⌉</text>
  <text x="76" y="262" font-size="13" fill="#8a6212" filter="url(#rough2)">⟺ a + min(x,y) ≥ ⌈(a+x+y)/2⌉ ⟺ a ≥ |x − y|</text>
  <text x="76" y="284" font-size="11" fill="#b08a3e" filter="url(#rough2)">（k 为奇数时两边差 1，最后一步正好由奇偶性补平）</text>

  <rect x="60" y="310" width="600" height="74" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="336" font-size="12" fill="#2e6e2e" filter="url(#rough2)">直觉：两个方向的异字符位置数量不等，差额必须由同字符位置来补；</text>
  <text x="76" y="360" font-size="12" fill="#2e6e2e" filter="url(#rough2)">多塞同字符位置只会把 k 撑大、票数不变，绝不会让操作更容易合法。</text>
</svg>
