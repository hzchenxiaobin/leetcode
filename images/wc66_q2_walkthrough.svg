<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="27" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：words = ["ab","bc"]，s = "aabcd"</text>
  <text x="280" y="46" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">掩码 bold = [F,T,T,T,F]，三个 true 只对应一对标签</text>

  <g filter="url(#rough2)" font-size="10" fill="#666">
    <text x="48" y="86">步骤</text>
    <text x="120" y="86" text-anchor="middle">i</text>
    <text x="178" y="86" text-anchor="middle">s[i]</text>
    <text x="262" y="86" text-anchor="middle">bold[i]</text>
    <text x="310" y="86">动作</text>
  </g>
  <path d="M 30 94 L 530 94" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10" fill="#444">
    <text x="48" y="118">1</text>
    <text x="120" y="118" text-anchor="middle">0</text>
    <text x="178" y="118" text-anchor="middle">a</text>
    <text x="310" y="118">掩码为假，直接输出 'a'</text>
    <rect x="238" y="102" width="48" height="22" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="262" y="118" text-anchor="middle" fill="#999">F</text>

    <text x="48" y="158">2</text>
    <text x="120" y="158" text-anchor="middle">1</text>
    <text x="178" y="158" text-anchor="middle">a</text>
    <text x="310" y="158">F→T：开标签 &lt;b&gt;，再输出 'a'</text>
    <rect x="238" y="142" width="48" height="22" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="262" y="158" text-anchor="middle" fill="#3a5a30">T</text>

    <text x="48" y="198">3</text>
    <text x="120" y="198" text-anchor="middle">2</text>
    <text x="178" y="198" text-anchor="middle">b</text>
    <text x="310" y="198">段内，继续输出 'b'</text>
    <rect x="238" y="182" width="48" height="22" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="262" y="198" text-anchor="middle" fill="#3a5a30">T</text>

    <text x="48" y="238">4</text>
    <text x="120" y="238" text-anchor="middle">3</text>
    <text x="178" y="238" text-anchor="middle">c</text>
    <text x="310" y="238">段内，继续输出 'c'</text>
    <rect x="238" y="222" width="48" height="22" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="262" y="238" text-anchor="middle" fill="#3a5a30">T</text>

    <text x="48" y="278">5</text>
    <text x="120" y="278" text-anchor="middle">4</text>
    <text x="178" y="278" text-anchor="middle">d</text>
    <text x="310" y="278">T→F：补 &lt;/b&gt;，再输出 'd'</text>
    <rect x="238" y="262" width="48" height="22" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="262" y="278" text-anchor="middle" fill="#999">F</text>
  </g>
  <path d="M 30 296 L 530 296" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="100" y="310" width="360" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="116" y="335" font-size="11.5" fill="#5a4620" filter="url(#rough2)">输出：a&lt;b&gt;abc&lt;/b&gt;d（1 对标签，最少）</text>

  <text x="290" y="372" text-anchor="middle" font-size="9.3" fill="#888" filter="url(#rough2)">标签只由掩码跳变决定：字符串开头的 false 不再开标签，结尾无需补</text>
</svg>
