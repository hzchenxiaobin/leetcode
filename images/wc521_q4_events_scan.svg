<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 455"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="455" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：事件扫描 —— 「结束」先进候选池，「开始」时结算</text>

  <!-- 时间轴与事件点 -->
  <line x1="50" y1="100" x2="518" y2="100" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="94" y="76" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="101" y="66" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">开始 m₁</text>
  <text x="101" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=1</text>

  <circle cx="145" cy="114" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="136" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">结束 m₁</text>
  <text x="145" y="66" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=2</text>

  <rect x="228" y="76" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="66" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">开始 m₂</text>
  <text x="235" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=4</text>

  <circle cx="280" cy="114" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">结束 m₂</text>
  <text x="280" y="66" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=5</text>

  <rect x="363" y="76" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="66" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">开始 m₃</text>
  <text x="370" y="122" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=7</text>

  <circle cx="460" cy="114" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="136" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">结束 m₃</text>
  <text x="460" y="66" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">t=9</text>

  <!-- 规则框 1：结束事件 -->
  <rect x="24" y="155" width="512" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="44" cy="178" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="60" y="174" font-size="12.5" fill="#333" filter="url(#rough2)">结束事件 (eᵢ, type=0)：cur ← max(cur, f[i] − eᵢ)</text>
  <text x="60" y="192" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">候选池新增一条「以 i 收尾」的链，池内只留最大值 cur</text>

  <!-- 规则框 2：开始事件 -->
  <rect x="24" y="210" width="512" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="38" y="172" width="0" height="0" filter="url(#rough2)"/>
  <rect x="38" y="224" width="12" height="12" rx="3" fill="#446688" filter="url(#rough2)"/>
  <text x="60" y="229" font-size="12.5" fill="#333" filter="url(#rough2)">开始事件 (sᵢ, type=1)：f[i] ← rᵢ + max(0, sᵢ + cur)，刷新 ans</text>
  <text x="60" y="247" font-size="10.5" fill="#446688" filter="url(#rough2)">cur = −∞（尚无候选）时自然退化为 f[i] = rᵢ，即单会议链</text>

  <!-- 顺序框 -->
  <rect x="24" y="265" width="512" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">关键顺序：同一时刻「结束(0)」排在「开始(1)」之前</text>
  <text x="280" y="304" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">区间左闭右开，eⱼ = sᵢ 端点相接不算重叠 ⟹ 相接的 j 是合法前驱，必须先入池</text>

  <!-- 无环保证 -->
  <rect x="24" y="330" width="512" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">无环保证：eⱼ ≤ sᵢ ⟹ sⱼ &lt; sᵢ ⟹ j 的开始事件更早被处理，f[j] 已结算</text>
  <text x="280" y="370" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">因此一遍扫描即可，f[j] 依赖的候选在其开始事件时就已全部入池</text>

  <!-- 复杂度 -->
  <rect x="24" y="397" width="512" height="42" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="415" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">排序 2n 个事件 O(n log n)，扫描 O(n)，单个滚动变量 cur</text>
  <text x="280" y="431" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">不需要树状数组 / 线段树，也不用担心 start 不单调</text>
</svg>
