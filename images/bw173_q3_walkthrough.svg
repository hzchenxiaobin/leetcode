<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="300" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#333">演算：n = 10，限制 a[3] ≤ 1、a[8] ≤ 1</text>

  <text x="30" y="72" font-size="12" fill="#666">下标</text>
  <text x="30" y="112" font-size="12" fill="#446688">左扫 up</text>
  <text x="30" y="152" font-size="12" fill="#b85450">右扫 b</text>

  <g font-size="12" fill="#333">
    <rect x="86" y="54" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="110" y="71" text-anchor="middle">0</text>
    <rect x="140" y="54" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="164" y="71" text-anchor="middle">1</text>
    <rect x="194" y="54" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="218" y="71" text-anchor="middle">2</text>
    <rect x="248" y="54" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="272" y="71" text-anchor="middle">3</text>
    <rect x="302" y="54" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="326" y="71" text-anchor="middle">4</text>
    <rect x="356" y="54" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="380" y="71" text-anchor="middle">5</text>
    <rect x="410" y="54" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="434" y="71" text-anchor="middle">6</text>
    <rect x="464" y="54" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="488" y="71" text-anchor="middle">7</text>
    <rect x="518" y="54" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/><text x="542" y="71" text-anchor="middle">8</text>
    <rect x="572" y="54" width="48" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/><text x="596" y="71" text-anchor="middle">9</text>
  </g>

  <g font-size="12" fill="#333">
    <text x="110" y="111" text-anchor="middle">0</text><text x="164" y="111" text-anchor="middle">2</text>
    <text x="218" y="111" text-anchor="middle">4</text><text x="272" y="111" text-anchor="middle">1</text>
    <text x="326" y="111" text-anchor="middle">2</text><text x="380" y="111" text-anchor="middle">6</text>
    <text x="434" y="111" text-anchor="middle">11</text><text x="488" y="111" text-anchor="middle">12</text>
    <text x="542" y="111" text-anchor="middle">1</text><text x="596" y="111" text-anchor="middle">3</text>
  </g>
  <g font-size="12" fill="#b85450">
    <text x="110" y="151" text-anchor="middle">0</text><text x="164" y="151" text-anchor="middle">2</text>
    <text x="218" y="151" text-anchor="middle">4</text><text x="272" y="151" text-anchor="middle">1</text>
    <text x="326" y="151" text-anchor="middle">2</text><text x="380" y="151" text-anchor="middle">6</text>
    <text x="434" y="151" text-anchor="middle">3</text><text x="488" y="151" text-anchor="middle">2</text>
    <text x="542" y="151" text-anchor="middle">1</text><text x="596" y="151" text-anchor="middle">3</text>
  </g>

  <path d="M540,170 Q500,196 460,176" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="212" font-size="11" fill="#b85450">a[8] ≤ 1 把 11、12 压成 3、2</text>

  <rect x="40" y="226" width="560" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="248" font-size="12" fill="#333">右扫后最大值 6（在 i = 5），对应构造 a = [0,2,4,1,2,6,2,1,1,3]</text>
  <text x="56" y="266" font-size="11" fill="#666">若只做左扫，会误报 12 —— 这就是必须右扫的原因</text>
</svg>
