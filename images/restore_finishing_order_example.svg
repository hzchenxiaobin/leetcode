<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>

  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：order = [3,1,2,5,4]，friends = {1,3,4}</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表格外框 -->
  <g filter="url(#sk)"><rect x="56" y="60" width="528" height="228" rx="6" fill="#ffffff" stroke="#5a5a56" stroke-width="1.6"/></g>

  <!-- 表头 -->
  <g filter="url(#sk)"><rect x="56" y="60" width="528" height="34" rx="6" fill="#e8f0fa" stroke="#5a5a56" stroke-width="1.2"/></g>
  <text x="88" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">步骤</text>
  <text x="165" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">当前 x</text>
  <text x="290" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">是否朋友</text>
  <text x="477" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">结果 res</text>

  <!-- 列分隔线 -->
  <path d="M 120 60 L 120 288" stroke="#9a9a96" stroke-width="1" filter="url(#sk)"/>
  <path d="M 210 60 L 210 288" stroke="#9a9a96" stroke-width="1" filter="url(#sk)"/>
  <path d="M 370 60 L 370 288" stroke="#9a9a96" stroke-width="1" filter="url(#sk)"/>
  <!-- 行分隔线 -->
  <path d="M 56 98 L 584 98" stroke="#9a9a96" stroke-width="1" filter="url(#sk)"/>
  <path d="M 56 136 L 584 136" stroke="#c9c9c4" stroke-width="0.8" filter="url(#sk)"/>
  <path d="M 56 174 L 584 174" stroke="#c9c9c4" stroke-width="0.8" filter="url(#sk)"/>
  <path d="M 56 212 L 584 212" stroke="#c9c9c4" stroke-width="0.8" filter="url(#sk)"/>
  <path d="M 56 250 L 584 250" stroke="#c9c9c4" stroke-width="0.8" filter="url(#sk)"/>

  <!-- 第 1 行：x=3 -->
  <text x="88" y="122" text-anchor="middle" font-size="12.5" fill="#444">1</text>
  <text x="165" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="290" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">✓ 是</text>
  <text x="477" y="122" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">[3]</text>

  <!-- 第 2 行：x=1 -->
  <text x="88" y="160" text-anchor="middle" font-size="12.5" fill="#444">2</text>
  <text x="165" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="290" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">✓ 是</text>
  <text x="477" y="160" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">[3, 1]</text>

  <!-- 第 3 行：x=2 -->
  <text x="88" y="198" text-anchor="middle" font-size="12.5" fill="#444">3</text>
  <text x="165" y="198" text-anchor="middle" font-size="14" fill="#8a8a86">2</text>
  <text x="290" y="198" text-anchor="middle" font-size="12.5" fill="#b85450">✗ 否</text>
  <text x="477" y="198" text-anchor="middle" font-size="13" fill="#8a8a86" font-family="monospace">[3, 1]</text>

  <!-- 第 4 行：x=5 -->
  <text x="88" y="236" text-anchor="middle" font-size="12.5" fill="#444">4</text>
  <text x="165" y="236" text-anchor="middle" font-size="14" fill="#8a8a86">5</text>
  <text x="290" y="236" text-anchor="middle" font-size="12.5" fill="#b85450">✗ 否</text>
  <text x="477" y="236" text-anchor="middle" font-size="13" fill="#8a8a86" font-family="monospace">[3, 1]</text>

  <!-- 第 5 行：x=4 -->
  <text x="88" y="274" text-anchor="middle" font-size="12.5" fill="#444">5</text>
  <text x="165" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">4</text>
  <text x="290" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">✓ 是</text>
  <text x="477" y="274" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">[3, 1, 4]</text>

  <!-- 最终答案 -->
  <g filter="url(#sk)"><rect x="170" y="310" width="300" height="50" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="320" y="341" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" font-family="monospace">最终答案 = [3, 1, 4] ✓</text>

  <text x="320" y="374" text-anchor="middle" font-size="11" fill="#888">一遍扫描：命中的追加到 res，未命中的直接跳过，res 长度最终为 friends.length</text>
</svg>
