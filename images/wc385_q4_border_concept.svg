<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">border：既是前缀又是后缀的子串</text>
  <path d="M 150 46 Q 320 54 490 46" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== d = 1 ===== -->
  <text x="60" y="98" font-size="14" font-weight="bold" fill="#555">d = 1</text>
  <g filter="url(#rough2)">
    <rect x="115" y="80" width="38" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="153" y="80" width="38" height="28" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="191" y="80" width="38" height="28" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="229" y="80" width="38" height="28" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="267" y="80" width="38" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="134" y="100" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="174" y="100" text-anchor="middle" font-size="14" fill="#333">b</text>
  <text x="214" y="100" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="254" y="100" text-anchor="middle" font-size="14" fill="#333">b</text>
  <text x="294" y="100" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="124" y="122" font-size="11" fill="#446688" font-weight="bold">↑前缀</text>
  <text x="276" y="122" font-size="11" fill="#4a7a3a" font-weight="bold">后缀↑</text>
  <text x="340" y="95" font-size="13" fill="#555">前缀 "a" ＝ 后缀 "a"</text>
  <text x="340" y="114" font-size="13" fill="#4a7a3a" font-weight="bold">✓ 是 border（长度 1）</text>

  <!-- ===== d = 3 ===== -->
  <text x="60" y="180" font-size="14" font-weight="bold" fill="#555">d = 3</text>
  <g filter="url(#rough2)">
    <rect x="115" y="162" width="38" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="153" y="162" width="38" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="191" y="162" width="38" height="28" rx="4" fill="#e6f4ea" stroke="#446688" stroke-width="2" stroke-dasharray="5,3"/>
    <rect x="229" y="162" width="38" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="267" y="162" width="38" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="134" y="182" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="174" y="182" text-anchor="middle" font-size="14" fill="#333">b</text>
  <text x="214" y="182" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="254" y="182" text-anchor="middle" font-size="14" fill="#333">b</text>
  <text x="294" y="182" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="152" y="204" font-size="11" fill="#446688" font-weight="bold">↑ 开头 3 格 "aba"</text>
  <text x="234" y="222" font-size="11" fill="#4a7a3a" font-weight="bold">↑ 末尾 3 格 "aba"（中间格两者重叠）</text>
  <text x="340" y="177" font-size="13" fill="#555">"aba" ＝ "aba"</text>
  <text x="340" y="196" font-size="13" fill="#4a7a3a" font-weight="bold">✓ 是 border（长度 3）</text>

  <!-- ===== d = 2 ===== -->
  <text x="60" y="262" font-size="14" font-weight="bold" fill="#555">d = 2</text>
  <g filter="url(#rough2)">
    <rect x="115" y="244" width="38" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="153" y="244" width="38" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="191" y="244" width="38" height="28" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="229" y="244" width="38" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="267" y="244" width="38" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="134" y="264" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="174" y="264" text-anchor="middle" font-size="14" fill="#333">b</text>
  <text x="214" y="264" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="254" y="264" text-anchor="middle" font-size="14" fill="#333">b</text>
  <text x="294" y="264" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="152" y="286" font-size="11" fill="#446688" font-weight="bold">↑ "ab"</text>
  <text x="254" y="286" font-size="11" fill="#b85450" font-weight="bold">"ba" ↑</text>
  <text x="340" y="259" font-size="13" fill="#555">前缀 "ab" ≠ 后缀 "ba"</text>
  <text x="340" y="278" font-size="13" fill="#b85450" font-weight="bold">✗ 不是 border</text>

  <!-- ===== equivalence box ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="316" width="520" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="342" text-anchor="middle" font-size="15" fill="#2e5b22" font-weight="bold">str1 是 str2 的前后缀 ⟺ str1 ＝ str2 的某个 border 前缀</text>
  <text x="320" y="366" text-anchor="middle" font-size="12" fill="#4a7a3a">"ababa" 的 border 前缀：{"a"(1)、"aba"(3)、"ababa"(5，自身)}</text>

  <!-- ===== problem transform box ===== -->
  <g filter="url(#rough2)">
    <rect x="60" y="398" width="520" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="422" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">计数转化：处理 words[j] 时，</text>
  <text x="320" y="442" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">数之前有多少个 words[i] 恰好等于 words[j] 的某个 border 前缀</text>
</svg>
