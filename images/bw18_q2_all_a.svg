<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">特例：前半全是 'a' 时，改最后一个字符为 'b'</text>
  <rect x="170" y="62" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197.5" y="87.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <rect x="230" y="62" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="257.5" y="87.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">b</text>
  <rect x="290" y="62" width="55" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317.5" y="87.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <text x="260" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"aba" → "abb"</text>
  <rect x="60" y="150" width="400" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="168" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">为什么是最后一位</text>
  <text x="72" y="184" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">前半（下标 0..n/2−1）没有非 'a'，说明只能把某位调大；</text>
  <text x="72" y="199" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">把最后一位改成 'b' 是对字典序影响最小的选择。</text>
  <text x="72" y="214" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">n = 1 时无字符可换 → 返回空串。</text>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">注意长度 1 的回文直接返回 ""</text>
</svg>
