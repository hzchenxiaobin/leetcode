<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="452" fill="#fafafa"/>

  <text x="320.0" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "(u(love)i)"</text>
  <text x="320.0" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">配对关系 0 ↔ 9、2 ↔ 7；dir = +1 表示向右读，−1 表示向左读</text>
  <rect x="24" y="72" width="592" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="52" y="91" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="100" y="91" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="148" y="91" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dir</text>
  <text x="196" y="91" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">读到</text>
  <text x="250" y="91" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="472" y="91" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">累计 ans</text>
  <rect x="24" y="100" width="592" height="26" fill="#ffffff" stroke="#dde3ea" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="52" y="118" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="100" y="118" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="148" y="118" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="196" y="118" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">(</text>
  <text x="250" y="118" font-size="10" fill="#8a6a20" filter="url(#rough2)">跳到 9，方向取反</text>
  <text x="472" y="118" font-size="10" fill="#bbb" filter="url(#rough2)">（空）</text>
  <rect x="24" y="126" width="592" height="26" fill="#f6f8fb" stroke="#dde3ea" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="52" y="144" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="100" y="144" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="148" y="144" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="196" y="144" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i</text>
  <text x="250" y="144" font-size="10" fill="#3a5a30" filter="url(#rough2)">输出 i</text>
  <text x="472" y="144" font-size="10.5" fill="#333" filter="url(#rough2)">i</text>
  <rect x="24" y="152" width="592" height="26" fill="#ffffff" stroke="#dde3ea" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="52" y="170" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="100" y="170" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="148" y="170" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="196" y="170" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">)</text>
  <text x="250" y="170" font-size="10" fill="#8a6a20" filter="url(#rough2)">跳到 2，方向取反</text>
  <text x="472" y="170" font-size="10.5" fill="#333" filter="url(#rough2)">i</text>
  <rect x="24" y="178" width="592" height="26" fill="#f6f8fb" stroke="#dde3ea" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="52" y="196" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="100" y="196" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="148" y="196" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="196" y="196" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">l</text>
  <text x="250" y="196" font-size="10" fill="#3a5a30" filter="url(#rough2)">输出 l</text>
  <text x="472" y="196" font-size="10.5" fill="#333" filter="url(#rough2)">il</text>
  <rect x="24" y="204" width="592" height="26" fill="#ffffff" stroke="#dde3ea" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="52" y="222" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="100" y="222" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="148" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="196" y="222" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">o</text>
  <text x="250" y="222" font-size="10" fill="#3a5a30" filter="url(#rough2)">输出 o</text>
  <text x="472" y="222" font-size="10.5" fill="#333" filter="url(#rough2)">ilo</text>
  <rect x="24" y="230" width="592" height="26" fill="#f6f8fb" stroke="#dde3ea" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="52" y="248" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>
  <text x="100" y="248" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="148" y="248" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="196" y="248" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">v</text>
  <text x="250" y="248" font-size="10" fill="#3a5a30" filter="url(#rough2)">输出 v</text>
  <text x="472" y="248" font-size="10.5" fill="#333" filter="url(#rough2)">ilov</text>
  <rect x="24" y="256" width="592" height="26" fill="#ffffff" stroke="#dde3ea" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="52" y="274" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>
  <text x="100" y="274" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="148" y="274" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="196" y="274" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">e</text>
  <text x="250" y="274" font-size="10" fill="#3a5a30" filter="url(#rough2)">输出 e</text>
  <text x="472" y="274" font-size="10.5" fill="#333" filter="url(#rough2)">ilove</text>
  <rect x="24" y="282" width="592" height="26" fill="#f6f8fb" stroke="#dde3ea" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="52" y="300" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">8</text>
  <text x="100" y="300" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="148" y="300" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="196" y="300" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">)</text>
  <text x="250" y="300" font-size="10" fill="#8a6a20" filter="url(#rough2)">跳到 2，方向取反</text>
  <text x="472" y="300" font-size="10.5" fill="#333" filter="url(#rough2)">ilove</text>
  <rect x="24" y="308" width="592" height="26" fill="#ffffff" stroke="#dde3ea" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="52" y="326" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">9</text>
  <text x="100" y="326" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="148" y="326" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="196" y="326" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">u</text>
  <text x="250" y="326" font-size="10" fill="#3a5a30" filter="url(#rough2)">输出 u</text>
  <text x="472" y="326" font-size="10.5" fill="#333" filter="url(#rough2)">iloveu</text>
  <rect x="24" y="334" width="592" height="26" fill="#f6f8fb" stroke="#dde3ea" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="52" y="352" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">10</text>
  <text x="100" y="352" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="148" y="352" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="196" y="352" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">(</text>
  <text x="250" y="352" font-size="10" fill="#8a6a20" filter="url(#rough2)">跳到 9，方向取反</text>
  <text x="472" y="352" font-size="10.5" fill="#333" filter="url(#rough2)">iloveu</text>
  <rect x="24" y="360" width="592" height="26" fill="#ffffff" stroke="#dde3ea" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="52" y="378" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">结束</text>
  <text x="100" y="378" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="148" y="378" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="196" y="378" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">—</text>
  <text x="250" y="378" font-size="10" fill="#8a3a36" filter="url(#rough2)">i 越界，退出循环</text>
  <text x="472" y="378" font-size="10.5" fill="#333" filter="url(#rough2)">iloveu</text>
  <rect x="24" y="392" width="592" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="40" y="412" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">每个字符只在「读到」时输出一次，两个括号各被跳过两次；共 10 步走完整串。</text>
  <text x="40" y="428" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">注意第 3、8 步：同一个 ) 先后在「向左」和「向右」两种行进中被跨过，方向因此翻回。</text>
</svg>

