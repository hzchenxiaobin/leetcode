<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">双指针反转单词：nice → ecin</text>

  <text x="120" y="74" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">第 1 轮</text>
  <rect x="144" y="52" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="202" y="52" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="52" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="318" y="52" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="170" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">n</text>
  <text x="228" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">i</text>
  <text x="286" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <text x="344" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>

  <path d="M170 104 L170 90" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="170" y="122" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">i</text>
  <path d="M344 104 L344 90" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="344" y="122" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">j</text>

  <path d="M257 130 L257 152" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="146" text-anchor="start" font-size="11" fill="#b07818" filter="url(#rough2)">交换 n 和 e</text>

  <text x="120" y="182" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">第 2 轮</text>
  <rect x="144" y="160" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="202" y="160" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="260" y="160" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="318" y="160" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="182" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <text x="228" y="182" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">i</text>
  <text x="286" y="182" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <text x="344" y="182" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">n</text>

  <path d="M228 212 L228 198" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="228" y="230" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">i</text>
  <path d="M286 212 L286 198" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="286" y="230" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">j</text>

  <path d="M257 238 L257 260" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="254" text-anchor="start" font-size="11" fill="#b07818" filter="url(#rough2)">交换 i 和 c</text>

  <text x="120" y="290" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">结果</text>
  <rect x="144" y="268" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="202" y="268" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="260" y="268" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="318" y="268" width="52" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="290" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <text x="228" y="290" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <text x="286" y="290" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">i</text>
  <text x="344" y="290" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">n</text>

  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i 与 j 相遇（i ≥ j）即停止，中间字符自然落位</text>
</svg>
