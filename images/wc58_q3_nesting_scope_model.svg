<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：括号 = 乘法作用域</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">原子最终数量 = 它所在每一层括号倍数的连乘</text>

  <g filter="url(#rough2)">
    <rect x="44" y="78" width="330" height="250" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="56" y="100" font-size="11" fill="#3a4a66">层 0 · ×1</text>

    <rect x="58" y="114" width="52" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="84" y="134" text-anchor="middle" font-size="12" fill="#334">K4</text>

    <rect x="132" y="112" width="228" height="200" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="142" y="132" font-size="11" fill="#3a5a30">层 1 · ×2</text>

    <rect x="148" y="146" width="38" height="28" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="167" y="165" text-anchor="middle" font-size="12" fill="#334">O</text>
    <rect x="194" y="146" width="38" height="28" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="213" y="165" text-anchor="middle" font-size="12" fill="#334">N</text>

    <rect x="150" y="190" width="196" height="106" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="160" y="210" font-size="11" fill="#8a6a20">层 2 · ×2</text>

    <rect x="166" y="222" width="38" height="28" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.4"/>
    <text x="185" y="241" text-anchor="middle" font-size="12" fill="#334">S</text>
    <rect x="212" y="222" width="50" height="28" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.4"/>
    <text x="237" y="241" text-anchor="middle" font-size="12" fill="#334">O3</text>

    <text x="248" y="276" text-anchor="middle" font-size="10" fill="#8a6a20">数字 3 只作用于紧邻的 O</text>

    <rect x="386" y="150" width="156" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="464" y="174" text-anchor="middle" font-size="11" fill="#8a3a36">S 的最终数量</text>
    <text x="464" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36">1 × 2 × 2 = 4</text>
    <text x="464" y="216" text-anchor="middle" font-size="9.5" fill="#a5646a">三层倍数的连乘</text>

    <path d="M 348 240 C 366 240 372 196 384 190" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="44" y="342" width="330" height="42" rx="8" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1.5"/>
    <text x="209" y="368" text-anchor="middle" font-size="10" fill="#556">遇 '(' 入栈；遇 ')' 出栈，整层乘倍数后并回上一层</text>
  </g>

  <text x="464" y="262" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">层数越深，乘得越多</text>
  <text x="280" y="398" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">字符串里的括号结构与栈的「嵌套深度」一一对应</text>
</svg>
