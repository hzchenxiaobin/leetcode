<svg xmlns="http://www.w3.org/2000/svg" width="620" height="470" viewBox="0 0 620 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="620" height="470" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：单趟扫描，失配即翻</text>
  <path d="M 170 38 Q 310 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="310" y="60" text-anchor="middle" font-size="12" fill="#666">用 prev 标志携带「翻转的传染效果」，不真翻数组</text>

  <g filter="url(#sk)">
    <rect x="30" y="92" width="160" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="110" y="113" text-anchor="middle" font-size="13" fill="#34506e" font-weight="bold">① 初始化</text>
  <text x="110" y="133" text-anchor="middle" font-size="12" fill="#34506e">prev ← '0'，ans ← 0</text>

  <path d="M 190 118 L 226 118" fill="none" stroke="#8a7a4a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="230" y="92" width="170" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="315" y="113" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">② 读下一个字符</text>
  <text x="315" y="133" text-anchor="middle" font-size="12" fill="#2e5a24">c ← target[i]</text>

  <path d="M 400 118 L 416 118" fill="none" stroke="#8a7a4a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="500,64 588,118 500,172 412,118" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="500" y="112" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">③ c ≠ prev ?</text>
  <text x="500" y="132" text-anchor="middle" font-size="10" fill="#8a6415">失配判定</text>

  <path d="M 500 172 L 500 206" fill="none" stroke="#8a7a4a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="513" y="194" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="390" y="210" width="220" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="500" y="232" text-anchor="middle" font-size="12.5" fill="#8f3830">ans ← ans ＋ 1</text>
  <text x="500" y="252" text-anchor="middle" font-size="12.5" fill="#8f3830">发起翻转 [i, n−1]</text>
  <text x="500" y="272" text-anchor="middle" font-size="12.5" fill="#8f3830">prev ← c</text>

  <path d="M 412 118 Q 350 132 318 188" fill="none" stroke="#8a7a4a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="378" y="140" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">否</text>

  <g filter="url(#sk)">
    <rect x="160" y="190" width="190" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="255" y="211" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">跳过：实值不变</text>
  <text x="255" y="231" text-anchor="middle" font-size="12" fill="#2e5a24">prev、ans 都不动</text>

  <path d="M 255 242 Q 255 296 270 314" fill="none" stroke="#8a7a4a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 500 282 Q 500 330 370 330" fill="none" stroke="#8a7a4a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="300,282 372,328 300,374 228,328" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="300" y="324" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">④ 还有字符？</text>
  <text x="300" y="342" text-anchor="middle" font-size="10.5" fill="#8a6415">( i ＜ n )</text>

  <path d="M 228 328 C 110 328 110 118 226 118" fill="none" stroke="#8a7a4a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="100" y="222" text-anchor="end" font-size="12.5" fill="#4a7a3a" font-weight="bold">否</text>
  <text x="100" y="242" text-anchor="end" font-size="11" fill="#4a7a3a">i ← i ＋ 1</text>

  <path d="M 300 374 L 300 394" fill="none" stroke="#8a7a4a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="313" y="390" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="230" y="398" width="140" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="300" y="424" text-anchor="middle" font-size="14" fill="#2e5a24" font-weight="bold">返回 ans</text>

  <g filter="url(#sk)">
    <rect x="24" y="398" width="182" height="60" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="115" y="420" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold">时间 O(n)｜空间 O(1)</text>
  <text x="115" y="440" text-anchor="middle" font-size="11" fill="#8f3830">不真翻数组，效果存进 prev</text>
</svg>
