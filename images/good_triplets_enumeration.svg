<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">三重循环枚举 + 三条件判定</text>
  <path d="M 180 38 Q 320 46 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- pointer labels -->
  <text x="150" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">i</text>
  <path d="M 150 48 L 150 55" stroke="#4a8edb" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="218" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">j</text>
  <path d="M 218 48 L 218 55" stroke="#4a8e4a" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="286" y="46" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">k</text>
  <path d="M 286 48 L 286 55" stroke="#c98a2b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- array cells -->
  <g filter="url(#sk)">
    <rect x="120" y="58" width="60" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <rect x="188" y="58" width="60" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="256" y="58" width="60" height="36" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
    <rect x="324" y="58" width="60" height="36" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="392" y="58" width="60" height="36" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
    <rect x="460" y="58" width="60" height="36" rx="4" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.3"/>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="150" y="81" fill="#2b6e9e">3</text>
    <text x="218" y="81" fill="#2e6e2e">0</text>
    <text x="286" y="81" fill="#7a5415">1</text>
    <text x="354" y="81" fill="#666">1</text>
    <text x="422" y="81" fill="#666">9</text>
    <text x="490" y="81" fill="#666">7</text>
  </g>
  <g font-size="11" fill="#999" text-anchor="middle">
    <text x="150" y="108">0</text>
    <text x="218" y="108">1</text>
    <text x="286" y="108">2</text>
    <text x="354" y="108">3</text>
    <text x="422" y="108">4</text>
    <text x="490" y="108">5</text>
  </g>

  <!-- condition boxes -->
  <g filter="url(#sk)">
    <rect x="100" y="122" width="440" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="144" text-anchor="middle" font-size="12.5" fill="#2b6e9e">① |arr[i] − arr[j]| ≤ a　　当前 (i=0, j=1)：|3 − 0| = 3 ≤ 7　✓</text>
  <g filter="url(#sk)">
    <rect x="100" y="162" width="440" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="320" y="184" text-anchor="middle" font-size="12.5" fill="#2e6e2e">② |arr[j] − arr[k]| ≤ b　　当前 (j=1, k=2)：|0 − 1| = 1 ≤ 2　✓</text>
  <g filter="url(#sk)">
    <rect x="100" y="202" width="440" height="34" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="224" text-anchor="middle" font-size="12.5" fill="#7a5415">③ |arr[i] − arr[k]| ≤ c　　当前 (i=0, k=2)：|3 − 1| = 2 ≤ 3　✓</text>

  <!-- result strip -->
  <g filter="url(#sk)">
    <rect x="100" y="244" width="440" height="32" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">三个条件全部成立 → 计入答案：ans += 1</text>

  <!-- code box -->
  <text x="320" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#777">三重循环模板（含剪枝）</text>
  <g filter="url(#sk)">
    <rect x="64" y="302" width="512" height="98" rx="8" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.3"/>
  </g>
  <g font-size="11" fill="#444" font-family="monospace">
    <text x="82" y="320">ans = 0</text>
    <text x="82" y="335">for i in range(n):</text>
    <text x="82" y="350">  for j in range(i+1, n):</text>
    <text x="82" y="365" fill="#b8641e" font-weight="bold">    if |arr[i]-arr[j]| &gt; a: continue        # 剪枝：跳过整层 k</text>
    <text x="82" y="380">    for k in range(j+1, n):</text>
    <text x="82" y="395">      if |arr[j]-arr[k]|&lt;=b and |arr[i]-arr[k]|&lt;=c: ans += 1</text>
  </g>
</svg>
