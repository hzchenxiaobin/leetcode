<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="660" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">并查集建模：两个「墙节点」+ 三类连边，其中「圆-圆」边最讲究</text>
  <path d="M 120 40 Q 380 50 640 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== rule cards ===== -->
  <!-- card 1 -->
  <g filter="url(#rough2)">
    <rect x="16" y="56" width="236" height="150" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="134" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07820" filter="url(#rough2)">边①：圆 ↔ W_A</text>
  <g filter="url(#rough2)">
    <rect x="36" y="94" width="70" height="70" rx="3" fill="none" stroke="#999999" stroke-width="1"/>
    <line x1="36" y1="94" x2="106" y2="94" stroke="#d6a040" stroke-width="3"/>
    <line x1="36" y1="94" x2="36" y2="164" stroke="#d6a040" stroke-width="3"/>
    <line x1="36" y1="164" x2="106" y2="164" stroke="#446688" stroke-width="3"/>
    <line x1="106" y1="94" x2="106" y2="164" stroke="#446688" stroke-width="3"/>
    <circle cx="58" cy="126" r="26" fill="#e8f0fe" fill-opacity="0.8" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="126" y="112" font-size="10.5" fill="#444" filter="url(#rough2)">圆与左边或上边</text>
  <text x="126" y="128" font-size="10.5" fill="#444" filter="url(#rough2)">线段相交</text>
  <text x="126" y="146" font-size="10.5" fill="#666" filter="url(#rough2)">判定：圆心到该线段</text>
  <text x="126" y="160" font-size="10.5" fill="#666" filter="url(#rough2)">的距离 ≤ r（含相切）</text>
  <text x="126" y="182" font-size="10" fill="#a07820" filter="url(#rough2)">注意是线段，不是直线！</text>

  <!-- card 2 -->
  <g filter="url(#rough2)">
    <rect x="262" y="56" width="236" height="150" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="380" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">边②：圆 ↔ W_B</text>
  <g filter="url(#rough2)">
    <rect x="282" y="94" width="70" height="70" rx="3" fill="none" stroke="#999999" stroke-width="1"/>
    <line x1="282" y1="94" x2="352" y2="94" stroke="#d6a040" stroke-width="3"/>
    <line x1="282" y1="94" x2="282" y2="164" stroke="#d6a040" stroke-width="3"/>
    <line x1="282" y1="164" x2="352" y2="164" stroke="#446688" stroke-width="3"/>
    <line x1="352" y1="94" x2="352" y2="164" stroke="#446688" stroke-width="3"/>
    <circle cx="330" cy="132" r="26" fill="#e8f0fe" fill-opacity="0.8" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="372" y="112" font-size="10.5" fill="#444" filter="url(#rough2)">圆与下边或右边</text>
  <text x="372" y="128" font-size="10.5" fill="#444" filter="url(#rough2)">线段相交</text>
  <text x="372" y="146" font-size="10.5" fill="#666" filter="url(#rough2)">判定同上：点到</text>
  <text x="372" y="160" font-size="10.5" fill="#666" filter="url(#rough2)">线段距离 ≤ r</text>
  <text x="372" y="182" font-size="10" fill="#446688" filter="url(#rough2)">单圆两边都沾 ⇒ 独自成墙</text>

  <!-- card 3 -->
  <g filter="url(#rough2)">
    <rect x="508" y="56" width="236" height="150" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="626" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">边③：圆 ↔ 圆（本题灵魂）</text>
  <g filter="url(#rough2)">
    <rect x="528" y="96" width="74" height="70" rx="3" fill="none" stroke="#999999" stroke-width="1"/>
    <circle cx="560" cy="132" r="27" fill="#fce4ec" fill-opacity="0.7" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="588" cy="150" r="27" fill="#fce4ec" fill-opacity="0.7" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="612" y="114" font-size="10.5" fill="#444" filter="url(#rough2)">两圆的公共透镜</text>
  <text x="612" y="130" font-size="10.5" fill="#444" filter="url(#rough2)">与闭矩形</text>
  <text x="612" y="146" font-size="10.5" fill="#444" filter="url(#rough2)">[0,X]×[0,Y] 有公共点</text>
  <text x="612" y="168" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">仅在平面相交是不够的！</text>
  <text x="612" y="186" font-size="10" fill="#7a2828" filter="url(#rough2)">（反例见上一张图）</text>

  <!-- ===== walkthrough: X=Y=10 ===== -->
  <text x="252" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">示例演算：X=Y=10, circles=[[5,5,3],[8,2,3],[2,8,3]]</text>

  <!-- box (60,262)-(360,562), unit 30 -->
  <g filter="url(#rough2)">
    <line x1="60" y1="262" x2="360" y2="262" stroke="#d6a040" stroke-width="4"/>
    <line x1="60" y1="262" x2="60" y2="562" stroke="#d6a040" stroke-width="4"/>
    <line x1="60" y1="562" x2="360" y2="562" stroke="#446688" stroke-width="4"/>
    <line x1="360" y1="262" x2="360" y2="562" stroke="#446688" stroke-width="4"/>
    <rect x="60" y="262" width="300" height="300" fill="none" stroke="#999999" stroke-width="1"/>
  </g>
  <text x="70" y="252" font-size="11.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">W_A</text>
  <text x="286" y="580" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">W_B</text>

  <!-- circles c1(230,440,90) c2(320,530,90) c3(140,350,90) -->
  <g filter="url(#rough2)">
    <circle cx="140" cy="350" r="90" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688" stroke-width="1.8"/>
    <circle cx="230" cy="440" r="90" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688" stroke-width="1.8"/>
    <circle cx="320" cy="530" r="90" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="140" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">c₃(2,8,3)</text>
  <text x="230" y="446" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">c₁(5,5,3)</text>
  <text x="320" y="536" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">c₂(8,2,3)</text>

  <!-- barrier band wall to wall -->
  <path d="M 60 350 L 140 350 L 185 395 L 230 440 L 275 485 L 320 530 L 320 562"
        stroke="#b85450" stroke-width="3.2" stroke-dasharray="9 5" fill="none" filter="url(#rough2)"/>

  <!-- sealed pocket near S -->
  <path d="M 60 562 L 60 391 A 90 90 0 0 0 140 440 A 90 90 0 0 0 230 530 A 90 90 0 0 0 236 562 Z"
        fill="#fce4ec" fill-opacity="0.55" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>

  <circle cx="60" cy="562" r="6" fill="#7a2828" filter="url(#rough2)"/>
  <text x="46" y="584" font-size="13" font-weight="bold" fill="#7a2828" filter="url(#rough2)">S 被封死</text>
  <text x="46" y="600" font-size="11" fill="#7a2828" filter="url(#rough2)">在左下角袋里</text>
  <circle cx="360" cy="262" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="348" y="250" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">E ✓</text>

  <!-- DSU graph inset -->
  <text x="565" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">对应的并查集</text>
  <g filter="url(#rough2)">
    <rect x="480" y="262" width="120" height="40" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="630" y="540" width="120" height="40" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="540" y="288" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">W_A</text>
  <text x="690" y="566" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">W_B</text>
  <g filter="url(#rough2)">
    <circle cx="640" cy="330" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="580" cy="420" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="640" cy="490" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="640" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">c₃</text>
  <text x="580" y="425" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">c₁</text>
  <text x="640" y="495" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">c₂</text>
  <g filter="url(#rough2)">
    <line x1="600" y1="290" x2="618" y2="312" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
    <line x1="625" y1="352" x2="598" y2="396" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
    <line x1="598" y1="443" x2="622" y2="467" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
    <line x1="655" y1="510" x2="678" y2="534" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)"/>
  </g>
  <text x="500" y="316" font-size="10.5" fill="#a07820" filter="url(#rough2)">边① 贴左墙</text>
  <text x="476" y="380" font-size="10.5" fill="#7a2828" filter="url(#rough2)">边③ 透镜∩矩形</text>
  <text x="476" y="396" font-size="10" fill="#7a2828" filter="url(#rough2)">(5.5,5.5) 在两圆内</text>
  <text x="662" y="500" font-size="10.5" fill="#7a2828" filter="url(#rough2)">边③</text>
  <text x="676" y="462" font-size="10.5" fill="#446688" filter="url(#rough2)">边② 贴下墙</text>
  <g filter="url(#rough2)">
    <rect x="476" y="596" width="276" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="614" y="616" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a2828" filter="url(#rough2)">W_A —c₃—c₁—c₂— W_B 连通</text>
  <text x="614" y="634" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a2828" filter="url(#rough2)">⇒ 返回 false（c₂、c₃ 距离 √72 > 6，不加边）</text>
</svg>
