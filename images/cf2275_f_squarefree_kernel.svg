<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" />
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a" />
    </marker>
  </defs>
  <rect width="760" height="372" fill="#fafafa" filter="url(#rough2)" />

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心转化：F(i,j) 是平方 ⟺ sf(a_i) = sf(P_j)</text>
  <text x="380" y="55" text-anchor="middle" font-size="11.5" fill="#7a7a7a" filter="url(#rough2)">约数个数为奇数 ⟺ 完全平方数；平方自由核把「是不是平方」变成「两个数相不相等」</text>

  <rect x="34" y="72" width="330" height="146" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <text x="50" y="96" font-size="12.5" font-weight="bold" fill="#2f4f70" filter="url(#rough2)">① 约数成对出现，只有平方会落单</text>
  <text x="50" y="122" font-size="12" fill="#3a3a3a" filter="url(#rough2)">F = 4：约数 1, 2, 4 → 3 个（奇）</text>
  <text x="50" y="146" font-size="12" fill="#3a3a3a" filter="url(#rough2)">F = 12：约数 1,2,3,4,6,12 → 6 个（偶）</text>
  <text x="50" y="176" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">d(F) 为奇数 ⟺ F 是完全平方</text>
  <text x="50" y="200" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">36 = 6²，因子 6 只能与自己配对，总数为奇</text>

  <rect x="396" y="72" width="330" height="146" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" />
  <text x="412" y="96" font-size="12.5" font-weight="bold" fill="#a0761e" filter="url(#rough2)">② 平方自由核 sf(x)：留奇次幂质因子</text>
  <text x="412" y="122" font-size="12" fill="#3a3a3a" filter="url(#rough2)">72 = 2³·3² → sf = 2，72 = 2·6²</text>
  <text x="412" y="146" font-size="12" fill="#3a3a3a" filter="url(#rough2)">45 = 3²·5 → sf = 5，45 = 5·3²</text>
  <text x="412" y="170" font-size="12" fill="#3a3a3a" filter="url(#rough2)">1 → sf = 1（空集），4 = 1·2²</text>
  <text x="412" y="196" font-size="12" font-weight="bold" fill="#a0761e" filter="url(#rough2)">x = sf(x)·t²，且 sf(x) ≤ x ≤ 10⁶</text>

  <rect x="34" y="240" width="692" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)" />
  <text x="380" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">F = a_i·P_j = sf(a_i)·sf(P_j)·t²，乘一个平方不改变「是否为平方」</text>
  <text x="380" y="292" text-anchor="middle" font-size="12.5" fill="#3a3a3a" filter="url(#rough2)">故 F 是平方 ⟺ sf(a_i)·sf(P_j) 是平方 ⟺ sf(a_i) = sf(P_j)</text>
  <text x="380" y="316" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">两个平方自由数相乘仍为平方，只能是同一批质因子各出现两次，即两者相等</text>
  <text x="380" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">答案 = #{(i,j)：sf(a_i) = sf(P_j)}，其中 P_j = a_1·a_2···a_j</text>
</svg>
