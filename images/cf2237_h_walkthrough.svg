<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="620" height="420" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">样例 2 演算：n=6, m=3，身体 {1,2,3}，食物 5,3,6,2</text>

  <rect x="24" y="46" width="572" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">询问</text>
  <text x="164" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">路径</text>
  <text x="314" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">片段（τ, 长度）</text>
  <text x="439" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">代价</text>
  <text x="535" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">配额（等级:个数）</text>

  <rect x="24" y="78" width="572" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c=5</text>
  <text x="164" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3 — 1 — 5</text>
  <text x="314" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(τ=0, 2)  (τ=−1, 1)</text>
  <text x="439" y="100" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="535" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{0:1, 1:2}</text>

  <rect x="24" y="112" width="572" height="34" fill="#f7fbff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c=3</text>
  <text x="164" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5 — 1 — 3</text>
  <text x="314" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(τ=1, 2)  (τ=0, 1)</text>
  <text x="439" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="535" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{2:3}</text>

  <rect x="24" y="146" width="572" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c=6</text>
  <text x="164" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3 — 1 — 6</text>
  <text x="314" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(τ=2, 2)  (τ=−1, 1)</text>
  <text x="439" y="168" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="535" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{2:1, 3:2}</text>

  <rect x="24" y="180" width="572" height="34" fill="#f7fbff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c=2</text>
  <text x="164" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6 — 1 — 2</text>
  <text x="314" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(τ=3, 2)  (τ=0, 1)</text>
  <text x="439" y="202" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="535" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{2:1, 4:2}</text>

  <rect x="24" y="214" width="572" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">合计</text>
  <text x="439" y="234" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="535" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">f = 1+0+1+1</text>

  <text x="30" y="280" font-size="12" fill="#333" filter="url(#rough2)">片段 = 路径上 τ 相同的极大连续段，括号里是 (τ, 长度)</text>
  <text x="30" y="304" font-size="12" fill="#333" filter="url(#rough2)">代价 = 没有被配额覆盖的位置数；覆盖的位置生成等级 = 当前时刻的新配额</text>
  <text x="30" y="328" font-size="12" fill="#333" filter="url(#rough2)">初始配额：身体 3 个顶点，等级都为 0；τ=−1 表示从未被扫过</text>
  <text x="30" y="352" font-size="12" fill="#666" filter="url(#rough2)">查询解码：c_i = ((p_i − 1 + ans_{i−1}) mod n) + 1</text>
</svg>
