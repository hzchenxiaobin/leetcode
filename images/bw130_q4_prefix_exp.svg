<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 356"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="34"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/></marker>
  </defs>
  <rect width="620" height="356" fill="#fafafa"/>
  <text x="310.0" y="26.0" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">二分定位 + 尾部补齐：一次查询 O(log² n)</text>
  <rect x="70.4" y="104.0" width="38.1" height="37.9" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="89.0" y="128.0" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">x=1</text>
  <rect x="109.6" y="103.9" width="37.7" height="37.6" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="129.0" y="128.0" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">x=2</text>
  <rect x="149.7" y="103.5" width="78.1" height="37.6" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="189.0" y="128.0" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">x=3</text>
  <rect x="230.1" y="103.9" width="38.4" height="38.2" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="249.0" y="128.0" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">x=4</text>
  <rect x="270.3" y="104.1" width="78.3" height="38.4" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="309.0" y="128.0" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">x=5</text>
  <rect x="350.5" y="103.7" width="77.8" height="37.8" rx="4" fill="#e8f0fe" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="389.0" y="128.0" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">x=6</text>
  <rect x="429.7" y="104.3" width="118.4" height="37.6" rx="4" fill="#e8f0fe" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="489.0" y="128.0" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">x=7</text>
  <path d="M 70.0 92.0 L 548.0 92.0" stroke="#888888" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="130.0" y="84.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">每个 x 贡献 popcount(x) 个元素</text>
  <path d="M 330.0 162.0 L 330.0 110.0" stroke="#b85450" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="330.0" y="182.0" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">第 x 个元素落在这里</text>
  <rect x="29.7" y="208.4" width="269.6" height="77.6" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165.0" y="233.0" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">1. 二分最小的 n 使 g(n) ≥ x</text>
  <text x="165.0" y="251.0" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">2. 前 n−1 个数完整贡献 h(n−1)</text>
  <text x="165.0" y="269.0" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">3. 还需 n 的最低 k = x − g(n−1) 个置位</text>
  <rect x="320.4" y="207.8" width="269.5" height="78.1" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="455.0" y="233.0" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">S(x) = h(n−1) + (n 的最低 k 个置位的指数和)</text>
  <text x="455.0" y="251.0" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">答案 = 2^(S(r+1) − S(l)) mod m</text>
  <text x="455.0" y="269.0" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">所有元素都是 2 的幂，乘积即指数相加</text>
  <text x="310.0" y="320.0" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">k 最多是 popcount(n)，从低位往高位补即可，代价 O(log n)</text>
  <text x="310.0" y="342.0" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">g(n) ≥ n ⇒ 二分的上界取 x 就够，不必估 n 的量级</text>
</svg>
