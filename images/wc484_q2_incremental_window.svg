<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="436" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：窗口右扩一格，sum 加一项、值集合进一个数——三件事全部 O(1)</text>

  <!-- 面板 A：窗口 [1,1] -->
  <rect x="30" y="60" width="264" height="200" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="162" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">状态 A：窗口 [1,1]（j = 1）</text>
  <rect x="114" y="94" width="32" height="28" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="146" y="94" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="162" y="113" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="178" y="94" width="32" height="28" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="194" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="130" y="136" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="162" y="136" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="194" y="136" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="162" y="160" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">sum = 1</text>
  <text x="162" y="182" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">vals = { 1 }</text>
  <text x="162" y="206" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">判定：1 ∈ {1} → ✓ 命中</text>
  <text x="162" y="228" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">（单元素窗口：sum 就是它自己）</text>

  <!-- 中间扩张箭头 -->
  <text x="320" y="148" text-anchor="middle" font-size="10" font-weight="bold" fill="#666" filter="url(#rough2)">j → j+1</text>
  <path d="M298,160 L342,160" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="178" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">扩入 nums[2] = 0</text>

  <!-- 面板 B：窗口 [1,2] -->
  <rect x="346" y="60" width="264" height="200" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="478" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">状态 B：窗口 [1,2]（j = 2）</text>
  <rect x="430" y="94" width="32" height="28" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="446" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="462" y="94" width="32" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="478" y="113" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="494" y="94" width="32" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="113" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">0</text>
  <text x="446" y="136" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="478" y="136" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="510" y="136" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">2 ↑ 新扩入</text>
  <text x="478" y="160" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">sum = 1 + 0 = 1（O(1) 累加）</text>
  <text x="478" y="182" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">vals = {1} ∪ {0} = {1, 0}（O(1) 插入）</text>
  <text x="478" y="206" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">判定：1 ∈ {1,0} → ✓ 命中</text>
  <text x="478" y="228" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">（和没变，但窗口内容变了——集合说了算）</text>

  <!-- 底部绿色结论框 -->
  <rect x="30" y="272" width="580" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="292" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">固定左端点 i：窗口只扩不缩 → 值集合只增不减，无需删除</text>
  <text x="320" y="312" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">「sum ∈ vals」逐字对应定义「和等于窗口内至少一个元素」</text>

  <!-- 底部橙色警示框 -->
  <rect x="30" y="340" width="580" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="360" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">⚠️ 为什么不能双指针：负数让 sum 无单调性，命中事件也不单调</text>
  <text x="320" y="378" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">造出命中：[−1,1]（✗）→ [−1,1,0]（✓）；毁掉命中：[1,0]（✓）→ [1,0,2]（✗）</text>
  <text x="320" y="396" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">→ O(n²) 枚举全部约 1.25×10⁵ 个窗口即意图解（枚举 + 哈希表）</text>
</svg>
