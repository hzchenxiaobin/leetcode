<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arY" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888888"/></marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
  </defs>

  <rect width="660" height="600" fill="#fafafa"/>
  <text x="330" y="18" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">算法流程：BFS 逐层快照 + prev 哨兵滚动检查</text>

  <!-- 开始 -->
  <g filter="url(#r)">
    <rect x="165" y="28" width="210" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="270" y="48" text-anchor="middle" font-size="10.5" fill="#2e4d27" filter="url(#r)">初始化：q ← [root]，level = 0</text>
  <line x1="270" y1="60" x2="270" y2="70" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arD)" filter="url(#r)"/>

  <!-- D1 队列空？ -->
  <g filter="url(#r)">
    <polygon points="270,72 372,102 270,132 168,102" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="270" y="106" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#r)">队列 q 为空？</text>
  <line x1="372" y1="102" x2="458" y2="102" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arG)" filter="url(#r)"/>
  <text x="398" y="96" font-size="10" fill="#4a7a3a" filter="url(#r)">是</text>
  <g filter="url(#r)">
    <rect x="458" y="84" width="170" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="543" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e4d27" filter="url(#r)">返回 true ✓</text>
  <line x1="270" y1="132" x2="270" y2="146" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arD)" filter="url(#r)"/>
  <text x="279" y="144" font-size="10" fill="#555" filter="url(#r)">否</text>

  <!-- B1 快照层宽 -->
  <g filter="url(#r)">
    <rect x="160" y="148" width="220" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="270" y="167" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#r)">sz = |q|：快照本层节点数</text>
  <line x1="270" y1="178" x2="270" y2="188" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arD)" filter="url(#r)"/>

  <!-- B2 哨兵 -->
  <g filter="url(#r)">
    <rect x="160" y="190" width="220" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="270" y="209" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#r)">prev = 偶层 ? 0 : 10^6 ← 哨兵</text>
  <line x1="270" y1="220" x2="270" y2="230" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arD)" filter="url(#r)"/>

  <!-- B3 出队 -->
  <g filter="url(#r)">
    <rect x="160" y="232" width="220" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="270" y="251" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#r)">node ← 队首出队；v = node.val</text>
  <line x1="270" y1="262" x2="270" y2="272" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arD)" filter="url(#r)"/>

  <!-- D2 奇偶检查 -->
  <g filter="url(#r)">
    <polygon points="270,274 382,306 270,338 158,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="270" y="310" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#r)">v % 2 == level % 2 ？</text>
  <line x1="382" y1="306" x2="462" y2="306" stroke="#b85450" stroke-width="1.5" marker-end="url(#arR)" filter="url(#r)"/>
  <text x="402" y="300" font-size="10" fill="#b85450" filter="url(#r)">是</text>
  <g filter="url(#r)">
    <rect x="462" y="288" width="182" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="553" y="310" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8f3230" filter="url(#r)">返回 false（奇偶不符）</text>
  <line x1="270" y1="338" x2="270" y2="350" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arD)" filter="url(#r)"/>
  <text x="280" y="348" font-size="9.5" fill="#4a7a3a" filter="url(#r)">否 · 奇偶相反 ✓</text>

  <!-- D3 单调检查 -->
  <g filter="url(#r)">
    <polygon points="270,362 388,394 270,426 152,394" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="270" y="390" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#r)">偶层: v ≤ prev ？</text>
  <text x="270" y="404" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#r)">奇层: v ≥ prev ？</text>
  <line x1="388" y1="394" x2="462" y2="394" stroke="#b85450" stroke-width="1.5" marker-end="url(#arR)" filter="url(#r)"/>
  <text x="408" y="388" font-size="10" fill="#b85450" filter="url(#r)">是</text>
  <g filter="url(#r)">
    <rect x="462" y="376" width="182" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="553" y="398" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8f3230" filter="url(#r)">返回 false（不严格单调）</text>
  <line x1="270" y1="426" x2="270" y2="438" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arD)" filter="url(#r)"/>
  <text x="280" y="436" font-size="9.5" fill="#4a7a3a" filter="url(#r)">否 · 严格单调 ✓</text>

  <!-- B4 更新并入队 -->
  <g filter="url(#r)">
    <rect x="160" y="440" width="220" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="270" y="460" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#r)">prev = v；左、右孩子依次入队</text>
  <line x1="270" y1="472" x2="270" y2="482" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arD)" filter="url(#r)"/>

  <!-- D4 本层完？ -->
  <g filter="url(#r)">
    <polygon points="270,484 365,514 270,544 175,514" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="270" y="518" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#r)">本层处理完？</text>

  <!-- 内层回路：下一个节点 -->
  <path d="M 175,514 L 112,514 L 112,247 L 156,247" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arY)" filter="url(#r)"/>
  <text x="118" y="506" font-size="9.5" fill="#888" filter="url(#r)">否 · 下一个</text>
  <text transform="rotate(-90 104 385)" x="104" y="385" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#r)">本层循环 sz 次</text>

  <!-- level += 1 与外层回路 -->
  <line x1="270" y1="544" x2="270" y2="556" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arD)" filter="url(#r)"/>
  <text x="279" y="554" font-size="10" fill="#555" filter="url(#r)">是</text>
  <g filter="url(#r)">
    <rect x="195" y="558" width="150" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="270" y="577" text-anchor="middle" font-size="10.5" fill="#2b4a66" filter="url(#r)">level += 1</text>
  <path d="M 195,573 L 48,573 L 48,102 L 160,102" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arY)" filter="url(#r)"/>
  <text transform="rotate(-90 40 340)" x="40" y="340" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#r)">进入下一层</text>

  <!-- 右下注释 -->
  <text x="462" y="466" font-size="9.5" fill="#888" filter="url(#r)">「先左后右」入队，</text>
  <text x="462" y="482" font-size="9.5" fill="#888" filter="url(#r)">保证下一层从左到右出队</text>
  <text x="462" y="498" font-size="9.5" fill="#888" filter="url(#r)">（引理 3 · FIFO 保序）</text>
  <text x="462" y="520" font-size="9.5" fill="#b85450" filter="url(#r)">任一检查失败 → 立即返回 false</text>
</svg>
