<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#5a6472"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">一行无限多的栈：push 找最左未满，pop 找最右非空</text>
  <text x="280" y="43" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每栈容量 capacity = 3，每个格子放一个餐盘（栈顶在上）</text>

  <text x="166" y="58" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">push 落点</text>
  <text x="466" y="58" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pop 落点</text>
  <path d="M 166 62 L 166 92" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <path d="M 466 92 L 466 63" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="35" y="96" width="62" height="114" fill="#eceff1" stroke="#93a1b0" stroke-width="1.8" rx="6"/>
    <rect x="135" y="96" width="62" height="114" fill="#e8f0fe" stroke="#446688" stroke-width="2.3" rx="6"/>
    <rect x="235" y="96" width="62" height="114" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <rect x="335" y="96" width="62" height="114" fill="#eceff1" stroke="#93a1b0" stroke-width="1.8" rx="6"/>
    <rect x="435" y="96" width="62" height="114" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.3" rx="6"/>
  </g>

  <g stroke="#b6c0cc" stroke-width="1" filter="url(#rough2)">
    <path d="M 35 134 L 97 134"/><path d="M 35 172 L 97 172"/>
    <path d="M 135 134 L 197 134"/><path d="M 135 172 L 197 172"/>
    <path d="M 235 134 L 297 134"/><path d="M 235 172 L 297 172"/>
    <path d="M 335 134 L 397 134"/><path d="M 335 172 L 397 172"/>
    <path d="M 435 134 L 497 134"/><path d="M 435 172 L 497 172"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="41" y="102" width="50" height="26" fill="#d7dee6" stroke="#93a1b0" stroke-width="1.2" rx="4"/>
    <rect x="41" y="140" width="50" height="26" fill="#d7dee6" stroke="#93a1b0" stroke-width="1.2" rx="4"/>
    <rect x="41" y="178" width="50" height="26" fill="#d7dee6" stroke="#93a1b0" stroke-width="1.2" rx="4"/>
    <rect x="141" y="140" width="50" height="26" fill="#c9dcf9" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="141" y="178" width="50" height="26" fill="#c9dcf9" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="241" y="178" width="50" height="26" fill="#f7e2ab" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="341" y="102" width="50" height="26" fill="#d7dee6" stroke="#93a1b0" stroke-width="1.2" rx="4"/>
    <rect x="341" y="140" width="50" height="26" fill="#d7dee6" stroke="#93a1b0" stroke-width="1.2" rx="4"/>
    <rect x="341" y="178" width="50" height="26" fill="#d7dee6" stroke="#93a1b0" stroke-width="1.2" rx="4"/>
    <rect x="441" y="140" width="50" height="26" fill="#c2e3cb" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="441" y="178" width="50" height="26" fill="#c2e3cb" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
  </g>

  <g font-size="10.5" fill="#66707c" text-anchor="middle" filter="url(#rough2)">
    <text x="66" y="230">栈 0</text>
    <text x="166" y="230">栈 1</text>
    <text x="266" y="230">栈 2</text>
    <text x="366" y="230">栈 3</text>
    <text x="466" y="230">栈 4</text>
  </g>
  <g font-size="9" text-anchor="middle" filter="url(#rough2)">
    <text x="66" y="246" fill="#8b95a1">3/3 满</text>
    <text x="166" y="246" fill="#446688">2/3 最左未满</text>
    <text x="266" y="246" fill="#a8811f">1/3</text>
    <text x="366" y="246" fill="#8b95a1">3/3 满</text>
    <text x="466" y="246" fill="#4a7a3a">2/3 最右非空</text>
  </g>

  <rect x="30" y="262" width="240" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <g font-size="9.5" filter="url(#rough2)">
    <text x="42" y="281" fill="#3a4a66" font-weight="bold" font-size="10">push(val) → 最左「未满」的栈</text>
    <text x="42" y="298" fill="#555">「未满」包含已建立但当前为空的栈</text>
    <text x="42" y="314" fill="#555">所以它优先回填旧栈，而不是开新栈</text>
  </g>

  <rect x="290" y="262" width="240" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <g font-size="9.5" filter="url(#rough2)">
    <text x="302" y="281" fill="#3a5a30" font-weight="bold" font-size="10">pop() → 最右「非空」的栈</text>
    <text x="302" y="298" fill="#555">弹出它的栈顶；所有栈都空返回 −1</text>
    <text x="302" y="314" fill="#555">实现上等价于裁掉尾部连续的空气</text>
  </g>

  <text x="280" y="346" text-anchor="middle" font-size="9.5" fill="#9a9a9a" filter="url(#rough2)">行是无限的：只有 push 时所有已有栈都满，才在最右端新增一个栈</text>
  <text x="280" y="364" text-anchor="middle" font-size="9.5" fill="#b06a6a" filter="url(#rough2)">中间被 popAtStack 清空的栈不会消失，仍然是 push 的候选落点</text>
</svg>
