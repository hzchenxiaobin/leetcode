<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：至多 4 轮「先比较、再旋转」</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1 -->
  <g filter="url(#sk)">
    <rect x="150" y="58" width="280" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="290" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 第 k 轮（k = 0 … 3）</text>
  <text x="290" y="97" text-anchor="middle" font-size="11" fill="#555">当前 mat = 原矩阵顺时针转 k 次后的状态</text>
  <g filter="url(#sk)">
    <path d="M 290 106 L 290 118" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>

  <!-- Diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="290,120 385,167 290,214 195,167" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="290" y="163" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">mat == target ?</text>
  <text x="290" y="183" text-anchor="middle" font-size="10" fill="#888">逐元素比较</text>

  <!-- yes: return true -->
  <g filter="url(#sk)">
    <path d="M 385 167 L 420 167" stroke="#4a8e4a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="402" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="424" y="143" width="176" height="50" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="512" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">return true</text>
  <text x="512" y="182" text-anchor="middle" font-size="10" fill="#666">第 k 种状态命中</text>

  <!-- no: down -->
  <g filter="url(#sk)">
    <path d="M 290 214 L 290 228" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="304" y="226" font-size="12" font-weight="bold" fill="#b03a3a">否</text>

  <!-- Diamond 2 -->
  <g filter="url(#sk)">
    <polygon points="290,230 385,277 290,324 195,277" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="290" y="273" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">k == 3 ?</text>
  <text x="290" y="293" text-anchor="middle" font-size="10" fill="#888">4 种状态已全部比完</text>

  <!-- yes: return false -->
  <g filter="url(#sk)">
    <path d="M 385 277 L 420 277" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="402" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">是</text>
  <g filter="url(#sk)">
    <rect x="424" y="253" width="176" height="50" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="512" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" font-family="monospace">return false</text>
  <text x="512" y="292" text-anchor="middle" font-size="10" fill="#666">4 种候选全不中</text>

  <!-- no: rotate and loop back -->
  <g filter="url(#sk)">
    <path d="M 195 277 L 176 277" stroke="#4a8edb" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="186" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">否</text>
  <g filter="url(#sk)">
    <rect x="44" y="251" width="130" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="109" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">② mat ←</text>
  <text x="109" y="291" text-anchor="middle" font-size="11" fill="#2b6e9e" font-family="monospace">rotate90(mat)</text>
  <g filter="url(#sk)">
    <path d="M 109 251 L 109 82 L 144 82" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="66" y="150" font-size="10" fill="#666">转完回①</text>
  <text x="66" y="164" font-size="10" fill="#666">继续比较</text>

  <!-- bottom notes -->
  <g filter="url(#sk)">
    <rect x="44" y="352" width="200" height="62" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="144" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">循环上限是 4 不是 3</text>
  <text x="144" y="390" text-anchor="middle" font-size="10.5" fill="#444">range(3) 漏掉 270° 状态</text>
  <text x="144" y="406" text-anchor="middle" font-size="10.5" fill="#888">官方三例均测不出这个 bug</text>

  <g filter="url(#sk)">
    <rect x="256" y="352" width="200" height="62" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="356" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">「先比再转」最直观</text>
  <text x="356" y="390" text-anchor="middle" font-size="10.5" fill="#444">第 0 轮比的就是 0° 原样</text>
  <text x="356" y="406" text-anchor="middle" font-size="10.5" fill="#888">先转后比碰巧也对（360°=0°）</text>

  <g filter="url(#sk)">
    <rect x="468" y="352" width="168" height="62" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="552" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">语言便利</text>
  <text x="552" y="390" text-anchor="middle" font-size="10.5" fill="#444">C++ / Python 的 ==</text>
  <text x="552" y="406" text-anchor="middle" font-size="10.5" fill="#888">都直接逐元素比较容器</text>
</svg>
