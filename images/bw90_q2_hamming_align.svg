<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="149"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">等长 + 只许替换 ⇒ 编辑距离 = 汉明距离</text>

  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <g filter="url(#rough2)">
      <rect x="80" y="54" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    </g>
    <text x="108" y="80">w</text>
    <g filter="url(#rough2)">
      <rect x="140" y="54" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5"/>
    </g>
    <text x="168" y="80" fill="#b85450" font-weight="bold">o</text>
    <g filter="url(#rough2)">
      <rect x="200" y="54" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    </g>
    <text x="228" y="80">r</text>
    <g filter="url(#rough2)">
      <rect x="260" y="54" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    </g>
    <text x="288" y="80">d</text>
  </g>
  <text x="180" y="46" font-size="12" fill="#888" filter="url(#rough2)">"word"（查询）</text>

  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <g filter="url(#rough2)">
      <rect x="80" y="118" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    </g>
    <text x="108" y="144">w</text>
    <g filter="url(#rough2)">
      <rect x="140" y="118" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5"/>
    </g>
    <text x="168" y="144" fill="#b85450" font-weight="bold">o</text>
    <g filter="url(#rough2)">
      <rect x="200" y="118" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    </g>
    <text x="228" y="144">o</text>
    <g filter="url(#rough2)">
      <rect x="260" y="118" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    </g>
    <text x="288" y="144">d</text>
  </g>
  <text x="180" y="110" font-size="12" fill="#888" filter="url(#rough2)">"wood"（字典）</text>

  <g filter="url(#rough2)" font-size="12.5" fill="#1d3a17" text-anchor="middle">
    <text x="108" y="176">相同 ✓</text>
    <text x="168" y="176" fill="#b85450" font-weight="bold">相同 ✓</text>
    <text x="228" y="176" fill="#b85450" font-weight="bold">不同 ✗ 改 1 处</text>
    <text x="288" y="176">相同 ✓</text>
  </g>

  <path d="M 360 96 L 360 130" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="375" y="118" font-size="12" fill="#b85450" filter="url(#rough2)">逐位对齐</text>

  <g filter="url(#rough2)">
    <rect x="360" y="140" width="160" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a5a14" text-anchor="middle">
    <text x="440" y="160">H(word, wood) = 1</text>
    <text x="440" y="180">≤ 2 → 收进答案</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="210" width="460" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#1a2b45" text-anchor="middle">
    <text x="290" y="234">为什么相等？每处不同必须各改一次（下界），</text>
    <text x="290" y="258">每次替换恰好修好一处（上界）→ 最少编辑 = 不同位数</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="296" width="460" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a2f2b" text-anchor="middle">
    <text x="290" y="320">⚠️ 前提是「等长 + 只许替换」</text>
    <text x="290" y="344">一旦允许插入/删除（经典编辑距离），</text>
    <text x="290" y="368">汉明距离立刻失效，需要 O(n²) 的 DP</text>
  </g>
</svg>
