  <text x="238" y="169" text-anchor="middle" font-size="12" fill="#2b4a6e">36</text>
  <text x="280" y="169" text-anchor="middle" font-size="12" fill="#2b4a6e">20</text>
  <text x="322" y="169" text-anchor="middle" font-size="12" fill="#2b4a6e">53</text>

  <!-- f 表：l=3 行 -->
  <rect x="218" y="180" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="260" y="180" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="302" y="180" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="238" y="199" text-anchor="middle" font-size="12" fill="#2b4a6e">32</text>
  <text x="280" y="199" text-anchor="middle" font-size="12" fill="#2b4a6e">48</text>
  <text x="322" y="199" text-anchor="middle" font-size="12" fill="#2b4a6e">33</text>

  <!-- f 表：l=4 行 -->
  <rect x="260" y="210" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="302" y="210" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="280" y="229" text-anchor="middle" font-size="12" fill="#2b4a6e">16</text>
  <text x="322" y="229" text-anchor="middle" font-size="12" fill="#2b4a6e">17</text>

  <!-- f 表：l=5 行 -->
  <rect x="302" y="240" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="322" y="259" text-anchor="middle" font-size="12" fill="#2b4a6e">1</text>

  <!-- g 表：l=0 行（g[0][2]、g[0][5] 红框 = 查询取数） -->
  <rect x="380" y="90" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="422" y="90" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="464" y="90" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <rect x="506" y="90" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="548" y="90" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="590" y="90" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="400" y="109" text-anchor="middle" font-size="12" fill="#2e5e2e">2</text>
  <text x="442" y="109" text-anchor="middle" font-size="12" fill="#2e5e2e">10</text>
  <text x="484" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a4440">12</text>
  <text x="526" y="109" text-anchor="middle" font-size="12" fill="#2e5e2e">46</text>
  <text x="568" y="109" text-anchor="middle" font-size="12" fill="#2e5e2e">60</text>
  <text x="610" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a4440">60</text>

  <!-- g 表：l=1 行（g[1][4] 红框） -->
  <rect x="422" y="120" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="464" y="120" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="506" y="120" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="548" y="120" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <rect x="590" y="120" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <text x="442" y="139" text-anchor="middle" font-size="12" fill="#2e5e2e">8</text>
  <text x="484" y="139" text-anchor="middle" font-size="12" fill="#2e5e2e">12</text>
  <text x="526" y="139" text-anchor="middle" font-size="12" fill="#2e5e2e">40</text>
  <text x="568" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a4440">60</text>
  <text x="610" y="139" text-anchor="middle" font-size="12" fill="#2e5e2e">60</text>

  <!-- g 表：l=2 行 -->
  <rect x="464" y="150" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="506" y="150" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="548" y="150" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="590" y="150" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <text x="484" y="169" text-anchor="middle" font-size="12" fill="#2e5e2e">4</text>
  <text x="526" y="169" text-anchor="middle" font-size="12" fill="#2e5e2e">36</text>
  <text x="568" y="169" text-anchor="middle" font-size="12" fill="#2e5e2e">48</text>
  <text x="610" y="169" text-anchor="middle" font-size="12" fill="#2e5e2e">53</text>

  <!-- g 表：l=3 行 -->
  <rect x="506" y="180" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="548" y="180" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="590" y="180" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <text x="526" y="199" text-anchor="middle" font-size="12" fill="#2e5e2e">32</text>
  <text x="568" y="199" text-anchor="middle" font-size="12" fill="#2e5e2e">48</text>
  <text x="610" y="199" text-anchor="middle" font-size="12" fill="#2e5e2e">48</text>

  <!-- g 表：l=4 行 -->
  <rect x="548" y="210" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="590" y="210" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <text x="568" y="229" text-anchor="middle" font-size="12" fill="#2e5e2e">16</text>
  <text x="610" y="229" text-anchor="middle" font-size="12" fill="#2e5e2e">17</text>

  <!-- g 表：l=5 行 -->
  <rect x="590" y="240" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk)"/>
  <text x="610" y="259" text-anchor="middle" font-size="12" fill="#2e5e2e">1</text>

  <!-- 图例 -->
  <rect x="118" y="286" width="18" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="146" y="298" font-size="11" fill="#333">红框 = 三个查询的取数：[0,2]→12，[1,4]→60，[0,5]→60</text>
  <rect x="118" y="312" width="18" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <text x="146" y="324" font-size="11" fill="#333">橙底 = 取到最大值的子数组：f[1][2]=12（[8,4]）、f[1][4]=60（[8,4,32,16]）</text>
  <text x="118" y="350" font-size="10.5" fill="#666">两张表都按 l 从 5 到 0 逐行递推（f、g 在同一双重循环里同步填出）</text>
</svg>
