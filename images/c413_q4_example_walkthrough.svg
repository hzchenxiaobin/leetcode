<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="419" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>

  <rect width="680" height="380" fill="#fdfcf7"/>

  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums = [2,8,4,32,16,1] 的 f 表与 g 表</text>

  <!-- 表标题 -->
  <text x="217" y="58" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">f 表：区间 [l,r] 折叠到底的分数</text>
  <text x="505" y="58" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">g 表：[l,r] 内所有子数组的最大分数</text>

  <!-- f 表列标 -->
  <text x="112" y="78" text-anchor="middle" font-size="10.5" fill="#666">0</text>
  <text x="154" y="78" text-anchor="middle" font-size="10.5" fill="#666">1</text>
  <text x="196" y="78" text-anchor="middle" font-size="10.5" fill="#666">2</text>
  <text x="238" y="78" text-anchor="middle" font-size="10.5" fill="#666">3</text>
  <text x="280" y="78" text-anchor="middle" font-size="10.5" fill="#666">4</text>
  <text x="322" y="78" text-anchor="middle" font-size="10.5" fill="#666">5</text>
  <!-- g 表列标 -->
  <text x="400" y="78" text-anchor="middle" font-size="10.5" fill="#666">0</text>
  <text x="442" y="78" text-anchor="middle" font-size="10.5" fill="#666">1</text>
  <text x="484" y="78" text-anchor="middle" font-size="10.5" fill="#666">2</text>
  <text x="526" y="78" text-anchor="middle" font-size="10.5" fill="#666">3</text>
  <text x="568" y="78" text-anchor="middle" font-size="10.5" fill="#666">4</text>
  <text x="610" y="78" text-anchor="middle" font-size="10.5" fill="#666">5</text>

  <!-- f 表行标 -->
  <text x="84" y="109" text-anchor="end" font-size="10.5" fill="#666">0</text>
  <text x="84" y="139" text-anchor="end" font-size="10.5" fill="#666">1</text>
  <text x="84" y="169" text-anchor="end" font-size="10.5" fill="#666">2</text>
  <text x="84" y="199" text-anchor="end" font-size="10.5" fill="#666">3</text>
  <text x="84" y="229" text-anchor="end" font-size="10.5" fill="#666">4</text>
  <text x="84" y="259" text-anchor="end" font-size="10.5" fill="#666">5</text>
  <!-- g 表行标 -->
  <text x="372" y="109" text-anchor="end" font-size="10.5" fill="#666">0</text>
  <text x="372" y="139" text-anchor="end" font-size="10.5" fill="#666">1</text>
  <text x="372" y="169" text-anchor="end" font-size="10.5" fill="#666">2</text>
  <text x="372" y="199" text-anchor="end" font-size="10.5" fill="#666">3</text>
  <text x="372" y="229" text-anchor="end" font-size="10.5" fill="#666">4</text>
  <text x="372" y="259" text-anchor="end" font-size="10.5" fill="#666">5</text>

  <!-- f 表：l=0 行 -->
  <rect x="92"  y="90" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="134" y="90" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="176" y="90" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="218" y="90" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="260" y="90" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="302" y="90" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="112" y="109" text-anchor="middle" font-size="12" fill="#2b4a6e">2</text>
  <text x="154" y="109" text-anchor="middle" font-size="12" fill="#2b4a6e">10</text>
  <text x="196" y="109" text-anchor="middle" font-size="12" fill="#2b4a6e">6</text>
  <text x="238" y="109" text-anchor="middle" font-size="12" fill="#2b4a6e">46</text>
  <text x="280" y="109" text-anchor="middle" font-size="12" fill="#2b4a6e">18</text>
  <text x="322" y="109" text-anchor="middle" font-size="12" fill="#2b4a6e">27</text>

  <!-- f 表：l=1 行（f[1][2]、f[1][4] 橙色高亮） -->
  <rect x="134" y="120" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="176" y="120" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <rect x="218" y="120" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="260" y="120" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#sk)"/>
  <rect x="302" y="120" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <text x="154" y="139" text-anchor="middle" font-size="12" fill="#2b4a6e">8</text>
  <text x="196" y="139" text-anchor="middle" font-size="12" fill="#7a5415">12</text>
  <text x="238" y="139" text-anchor="middle" font-size="12" fill="#2b4a6e">40</text>
  <text x="280" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">60</text>
  <text x="322" y="139" text-anchor="middle" font-size="12" fill="#2b4a6e">9</text>

  <!-- f 表：l=2 行 -->
  <rect x="176" y="150" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="218" y="150" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="260" y="150" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
  <rect x="302" y="150" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#sk)"/>
