<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 445"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="445" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：两个递归各管一个维度，用短路 ∨ 连接</text>

  <path d="M295,48 L295,360" stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <rect x="68" y="48" width="164" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4a66" filter="url(#rough2)">isSubPath(v) —— 枚举起点</text>

  <path d="M150,82 L150,100" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="150,105 206,130 150,155 94,130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="134" text-anchor="middle" font-size="11" fill="#2a4a66" filter="url(#rough2)">v == null ?</text>
  <path d="M208,130 L234,130" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="239" y="134" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">false</text>

  <path d="M150,155 L150,172" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="68" y="174" width="164" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">调用 match(v, head)</text>
  <text x="150" y="209" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">从 v 开始尝试匹配</text>
  <path d="M232,196 L266,196" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="234" y="187" text-anchor="start" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">true ⇒ 命中</text>

  <path d="M150,218 L150,236" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="230" text-anchor="start" font-size="9.5" fill="#666" filter="url(#rough2)">未命中</text>

  <rect x="68" y="238" width="164" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="256" text-anchor="middle" font-size="10.5" fill="#2a4a66" filter="url(#rough2)">isSubPath(v.left)</text>
  <text x="150" y="273" text-anchor="middle" font-size="10.5" fill="#2a4a66" filter="url(#rough2)">∨ isSubPath(v.right)</text>

  <text x="150" y="300" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">∨ 短路：任一成功即返回 true</text>
  <text x="150" y="316" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">左右子树继续枚举起点</text>

  <rect x="348" y="48" width="164" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">match(t, l) —— 向下对齐</text>

  <path d="M430,82 L430,100" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="430,105 492,130 430,155 368,130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="134" text-anchor="middle" font-size="11" fill="#2d5a2d" filter="url(#rough2)">l == null ?</text>
  <path d="M494,130 L520,130" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="525" y="128" text-anchor="start" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">true</text>
  <text x="525" y="142" text-anchor="start" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">链表耗尽，命中</text>

  <path d="M430,155 L430,176" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="430,180 492,205 430,230 368,205" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="201" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">t == null 或</text>
  <text x="430" y="216" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">t.val ≠ l.val ?</text>
  <path d="M494,205 L520,205" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="525" y="203" text-anchor="start" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">false</text>
  <text x="525" y="217" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">失配，换起点</text>

  <path d="M430,230 L430,244" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="241" text-anchor="start" font-size="9.5" fill="#666" filter="url(#rough2)">值相等</text>

  <rect x="348" y="248" width="164" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="270" text-anchor="middle" font-size="11" fill="#7a6020" filter="url(#rough2)">树、链表各进一步</text>

  <path d="M424,284 C402,292 388,296 381,302" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M436,284 C458,292 512,296 521,302" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="312" y="306" width="134" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="379" y="325" text-anchor="middle" font-size="10" fill="#2a4a66" filter="url(#rough2)">match(t.left, l.next)</text>
  <text x="449" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#666" filter="url(#rough2)">∨</text>
  <rect x="452" y="306" width="140" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="522" y="325" text-anchor="middle" font-size="10" fill="#2a4a66" filter="url(#rough2)">match(t.right, l.next)</text>

  <rect x="30" y="385" width="540" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="407" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">match 只管从固定起点向下对齐，失配立即返回 false、不做补救</text>
  <text x="300" y="427" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">「换起点」是 isSubPath 的职责——职责分离，两个递归都简单到不会写错</text>
</svg>
