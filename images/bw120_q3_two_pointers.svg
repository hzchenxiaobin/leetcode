<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">双指针：nums[l−1] 越大，r_min 只会右移 —— 同向单调推进</text>

  <!-- l 轴：前缀末值递增 -->
  <text x="60" y="70" font-size="12.5" fill="#446688" filter="url(#rough2)">l = 0 → 1 → … → pre：</text>
  <g filter="url(#rough2)">
    <rect x="230" y="52" width="70" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="265" y="78" text-anchor="middle" font-size="13" fill="#28415e">nums[l−1]</text>
    <rect x="310" y="52" width="56" height="42" rx="8" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <text x="338" y="78" text-anchor="middle" font-size="13" fill="#333">↑ 变大</text>
  </g>
  <path d="M375,73 L430,73" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="455" y="78" font-size="12.5" fill="#555" filter="url(#rough2)">台阶更难接</text>

  <!-- r 轴：后缀值递增 -->
  <text x="60" y="150" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">r 沿递增后缀滑动：</text>
  <g filter="url(#rough2)">
    <rect x="230" y="130" width="50" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="280" y="130" width="50" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="330" y="130" width="50" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="255" y="157" text-anchor="middle" font-size="14" fill="#1c3a1c">5</text>
    <text x="305" y="157" text-anchor="middle" font-size="14" fill="#1c3a1c">7</text>
    <text x="355" y="157" text-anchor="middle" font-size="14" fill="#1c3a1c">8</text>
    <text x="255" y="190" text-anchor="middle" font-size="10.5" fill="#888">s</text>
    <text x="305" y="190" text-anchor="middle" font-size="10.5" fill="#888">…</text>
    <text x="355" y="190" text-anchor="middle" font-size="10.5" fill="#888">n−1</text>
  </g>
  <path d="M245,205 C300,232 370,232 400,200" fill="none" stroke="#b85450" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="242" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">r 只前进、不回退 → 摊还 O(n)</text>

  <!-- 计数公式 -->
  <g filter="url(#rough2)">
    <rect x="60" y="262" width="440" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="288" text-anchor="middle" font-size="13.5" fill="#7a5a10">每个 l 的贡献：ans += n − r_min + 1（r ∈ [r_min, n] 整段合法）</text>
  </g>

  <text x="280" y="336" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">直觉：左段越长末值越大，右段必须更靠右（开头更大）才接得上</text>
</svg>
