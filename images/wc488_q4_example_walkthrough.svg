<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：乘积网格上的两个陷阱</text>
  <path d="M 190 36 Q 320 44 450 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- left panel: example 2 greedy trap -->
  <rect x="36" y="48" width="288" height="268" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 2：贪心锁死大乘积会翻车</text>

  <text x="127" y="88" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">−3</text>
  <text x="173" y="88" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="219" y="88" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">−1</text>
  <text x="265" y="88" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="98" y="112" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">−2</text>
  <text x="98" y="148" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="98" y="184" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">5</text>

  <rect x="106" y="92" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="127" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">6</text>
  <rect x="152" y="92" width="42" height="32" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="173" y="113" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">−8</text>
  <rect x="198" y="92" width="42" height="32" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="219" y="113" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <rect x="244" y="92" width="42" height="32" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="265" y="113" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">−4</text>
  <rect x="106" y="128" width="42" height="32" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="127" y="149" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <rect x="152" y="128" width="42" height="32" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="173" y="149" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <rect x="198" y="128" width="42" height="32" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="219" y="149" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <rect x="244" y="128" width="42" height="32" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="265" y="149" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <rect x="106" y="164" width="42" height="32" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="127" y="185" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">−15</text>
  <rect x="152" y="164" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="173" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">20</text>
  <rect x="198" y="164" width="42" height="32" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="219" y="185" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">−5</text>
  <rect x="244" y="164" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">10</text>

  <path d="M 127 110 Q 150 148 171 177" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="176" font-size="9.5" fill="#b85450" filter="url(#rough2)">次大</text>

  <text x="48" y="220" font-size="10.5" fill="#446688" filter="url(#rough2)">全局两大约积：20（i=2, j=1）与 10（i=2, j=3）</text>
  <text x="48" y="238" font-size="10.5" fill="#b85450" filter="url(#rough2)">但它们同在第 2 行，i 无法同时严格递增 ✗</text>
  <text x="48" y="258" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">最优链：(0,0) → (2,1)，得 6 + 20 = 26 ✓</text>
  <text x="48" y="278" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">锁死 20 之后，能与它兼容的次大只剩 6</text>
  <text x="48" y="298" font-size="10" fill="#666" filter="url(#rough2)">对与对之间「同行同列互斥」——耦合才是难点</text>

  <!-- right panel: example 3 forced negative -->
  <rect x="340" y="48" width="264" height="268" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="472" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">示例 3：恰好 k 对，负也得选</text>

  <text x="420" y="92" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="472" y="92" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="388" y="120" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">−3</text>
  <text x="388" y="164" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">−2</text>

  <rect x="396" y="96" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="420" y="121" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">−3</text>
  <rect x="448" y="96" width="48" height="40" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="472" y="121" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">−6</text>
  <rect x="396" y="140" width="48" height="40" fill="#fafafa" stroke="#8899aa" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="420" y="165" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">−2</text>
  <rect x="448" y="140" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="472" y="165" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">−4</text>

  <path d="M 420 118 Q 434 140 448 156" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="356" y="204" font-size="10.5" fill="#b85450" filter="url(#rough2)">k = min(n,m) = 2：i、j 都只能取 (0,1)</text>
  <text x="356" y="222" font-size="10.5" fill="#b85450" filter="url(#rough2)">唯一方案：(0,0) + (1,1) = −3 + (−4) = −7</text>

  <rect x="356" y="238" width="232" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="472" y="258" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">⚠ 若把「不可行」初始化成 0，</text>
  <text x="472" y="274" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">本题会答 0 而不是 −7 ——</text>
  <text x="472" y="290" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">0 是合法得分，哨兵必须是 −∞</text>

  <!-- conclusion -->
  <rect x="36" y="330" width="568" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="354" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">左：行列互斥让「局部最大 ≠ 全局可行」；右：「恰好 k」遇上负值必须硬着头皮选</text>
  <text x="320" y="376" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">把已选对数 p 写进状态、用 −∞ 标记不可行，冲突与负值全部自动处理</text>
  <text x="320" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = f[n][m][k]，k ≤ min(n,m) 保证它有限</text>
</svg>
