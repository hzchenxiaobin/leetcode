<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="390" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：gifts = [25, 64, 9, 4, 100]，k = 4</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#666666">红色 = 弹出的当前最大 v　　绿色 = 开方后回写的 ⌊√v⌋　　橙色 = 最终答案</text>

  <!-- hand-drawn table: 6 columns x 6 rows -->
  <g filter="url(#sk)">
    <rect x="25" y="60" width="590" height="250" rx="6" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.5"/>
    <rect x="25" y="60" width="590" height="30" rx="6" fill="#e8f0fa" stroke="#3a3a3a" stroke-width="1.5"/>
    <line x1="70" y1="60" x2="70" y2="310" stroke="#8899aa" stroke-width="1"/>
    <line x1="155" y1="60" x2="155" y2="310" stroke="#8899aa" stroke-width="1"/>
    <line x1="240" y1="60" x2="240" y2="310" stroke="#8899aa" stroke-width="1"/>
    <line x1="340" y1="60" x2="340" y2="310" stroke="#8899aa" stroke-width="1"/>
    <line x1="545" y1="60" x2="545" y2="310" stroke="#8899aa" stroke-width="1"/>
    <line x1="25" y1="134" x2="615" y2="134" stroke="#8899aa" stroke-width="1"/>
    <line x1="25" y1="178" x2="615" y2="178" stroke="#8899aa" stroke-width="1"/>
    <line x1="25" y1="222" x2="615" y2="222" stroke="#8899aa" stroke-width="1"/>
    <line x1="25" y1="266" x2="615" y2="266" stroke="#8899aa" stroke-width="1"/>
  </g>

  <!-- header -->
  <text x="47" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">步</text>
  <text x="112" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">弹出 v</text>
  <text x="197" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">回写 ⌊√v⌋</text>
  <text x="290" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">移走 v−⌊√v⌋</text>
  <text x="442" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">堆内剩余（降序）</text>
  <text x="580" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">合计 sum</text>

  <!-- row: initial -->
  <text x="47" y="118" text-anchor="middle" font-size="12" fill="#555555">初始</text>
  <text x="112" y="118" text-anchor="middle" font-size="12" fill="#999999">—</text>
  <text x="197" y="118" text-anchor="middle" font-size="12" fill="#999999">—</text>
  <text x="290" y="118" text-anchor="middle" font-size="12" fill="#999999">—</text>
  <text x="442" y="118" text-anchor="middle" font-size="12" fill="#2b2b2b">{100, 64, 25, 9, 4}</text>
  <text x="580" y="118" text-anchor="middle" font-size="12" fill="#2b2b2b">202</text>

  <!-- row 1 -->
  <text x="47" y="162" text-anchor="middle" font-size="12" fill="#555555">1</text>
  <text x="112" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">100</text>
  <text x="197" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">10</text>
  <text x="290" y="162" text-anchor="middle" font-size="12" fill="#2b2b2b">90</text>
  <text x="442" y="162" text-anchor="middle" font-size="12" fill="#2b2b2b">{64, 25, <tspan fill="#2e6e2e" font-weight="bold">10</tspan>, 9, 4}</text>
  <text x="580" y="162" text-anchor="middle" font-size="12" fill="#2b2b2b">112</text>

  <!-- row 2 -->
  <text x="47" y="206" text-anchor="middle" font-size="12" fill="#555555">2</text>
  <text x="112" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">64</text>
  <text x="197" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">8</text>
  <text x="290" y="206" text-anchor="middle" font-size="12" fill="#2b2b2b">56</text>
  <text x="442" y="206" text-anchor="middle" font-size="12" fill="#2b2b2b">{25, 10, 9, <tspan fill="#2e6e2e" font-weight="bold">8</tspan>, 4}</text>
  <text x="580" y="206" text-anchor="middle" font-size="12" fill="#2b2b2b">56</text>

  <!-- row 3 -->
  <text x="47" y="250" text-anchor="middle" font-size="12" fill="#555555">3</text>
  <text x="112" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">25</text>
  <text x="197" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">5</text>
  <text x="290" y="250" text-anchor="middle" font-size="12" fill="#2b2b2b">20</text>
  <text x="442" y="250" text-anchor="middle" font-size="12" fill="#2b2b2b">{10, 9, 8, <tspan fill="#2e6e2e" font-weight="bold">5</tspan>, 4}</text>
  <text x="580" y="250" text-anchor="middle" font-size="12" fill="#2b2b2b">36</text>

  <!-- row 4 -->
  <text x="47" y="294" text-anchor="middle" font-size="12" fill="#555555">4</text>
  <text x="112" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">10</text>
  <text x="197" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="290" y="294" text-anchor="middle" font-size="12" fill="#2b2b2b">7</text>
  <text x="442" y="294" text-anchor="middle" font-size="12" fill="#2b2b2b">{9, 8, 5, 4, <tspan fill="#2e6e2e" font-weight="bold">3</tspan>}</text>
  <text x="580" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040">29</text>

  <!-- summary box -->
  <g filter="url(#sk)">
    <rect x="55" y="335" width="530" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">sum = 202 − (90 + 56 + 20 + 7) = 29 ✓</text>
  <text x="320" y="368" text-anchor="middle" font-size="11" fill="#8a6415">第 4 步堆顶已是 10（不再是初始最大）——堆自动维护「当前最大」，无需手动判断</text>
</svg>
