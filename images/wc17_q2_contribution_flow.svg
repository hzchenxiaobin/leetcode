<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold"
        filter="url(#rough2)">线性扫描：一次遍历累加贡献</text>
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">不真的合并区间，只把「上一次攻击覆盖到哪」隐含在相邻间隔里</text>

  <rect x="170" y="72" width="220" height="44" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="91" text-anchor="middle" font-size="11.5" fill="#3a4a66"
        filter="url(#rough2)">ans ← duration</text>
  <text x="280" y="107" text-anchor="middle" font-size="9.5" fill="#5a6a86"
        filter="url(#rough2)">第一次攻击必定完整贡献 d 秒</text>

  <path d="M 280 116 L 280 138" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="140" width="360" height="50" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="160" text-anchor="middle" font-size="11" fill="#3a5a30"
        filter="url(#rough2)">for i = 1 … n−1：gap ← t[i] − t[i−1]</text>
  <text x="280" y="177" text-anchor="middle" font-size="9.5" fill="#5a7a4a"
        filter="url(#rough2)">gap = 0 表示同一秒内多次攻击</text>

  <path d="M 280 190 L 280 214" stroke="#666" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 280 216 L 410 258 L 280 300 L 150 258 Z" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="263" text-anchor="middle" font-size="11" fill="#8a6a20"
        filter="url(#rough2)">gap ≥ duration ?</text>

  <text x="196" y="241" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <text x="356" y="241" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <path d="M 150 258 L 126 320" stroke="#b85450" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410 258 L 434 320" stroke="#4a7a3a" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="20" y="322" width="210" height="48" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="125" y="343" text-anchor="middle" font-size="11.5" fill="#8a3a36"
        filter="url(#rough2)">ans += duration</text>
  <text x="125" y="360" text-anchor="middle" font-size="9.5" fill="#a05a56"
        filter="url(#rough2)">空档太长，只算 d 秒</text>

  <rect x="330" y="322" width="210" height="48" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="435" y="343" text-anchor="middle" font-size="11.5" fill="#3a5a30"
        filter="url(#rough2)">ans += gap</text>
  <text x="435" y="360" text-anchor="middle" font-size="9.5" fill="#5a7a4a"
        filter="url(#rough2)">被重置，只算新增的 gap 秒</text>

  <path d="M 125 370 L 125 381 L 280 381 L 280 392" stroke="#666" stroke-width="1.4"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 435 370 L 435 381 L 280 381" stroke="#666" stroke-width="1.4" fill="none"
        filter="url(#rough2)"/>

  <rect x="165" y="392" width="230" height="38" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#3a4a66"
        filter="url(#rough2)">返回 ans（中毒总秒数）</text>
</svg>
