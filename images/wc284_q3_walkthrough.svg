<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#556" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="620" height="400" fill="#fdfcf7"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：候选集取 max；奇数空转步用「垫一层」补齐</text>
  <path d="M 100 44 Q 310 54 520 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：示例 1 -->
  <text x="40" y="76" text-anchor="start" font-size="13.5" font-weight="bold" fill="#33475e" filter="url(#sk)">示例 1：nums = [5,2,2,4,0,6]，k = 4</text>
  <g filter="url(#sk)">
    <rect x="40" y="90" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="94" y="90" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="148" y="90" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="202" y="90" width="48" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="256" y="90" width="48" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="310" y="90" width="48" height="40" rx="4" fill="#f4f4ee" stroke="#9a9a9a" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="64" y="115">5</text><text x="118" y="115">2</text><text x="172" y="115">2</text>
    <text x="226" y="115">4</text><text x="280" y="115">0</text><text x="334" y="115">6</text>
  </g>
  <text x="226" y="119" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>
  <g font-size="10.5" fill="#777" text-anchor="middle" filter="url(#sk)">
    <text x="64" y="146">0</text><text x="118" y="146">1</text><text x="172" y="146">2</text>
    <text x="226" y="146">3</text><text x="280" y="146">4</text><text x="334" y="146">5</text>
  </g>
  <text x="118" y="170" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">删后推回（i ≤ k−2）</text>
  <text x="226" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">间隙 i=3</text>
  <text x="280" y="170" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">删 4 个露头</text>
  <text x="334" y="170" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">够不着</text>
  <g filter="url(#sk)">
    <rect x="40" y="188" width="320" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="200" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475e" filter="url(#sk)">候选 = {5, 2, 2} ∪ {0}（挖掉 nums[3] = 4）</text>
  <text x="200" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#33475e" filter="url(#sk)">ans = max(5, 2, 2, 0) = 5</text>

  <!-- 右：[1,3], k=6 构造 -->
  <text x="372" y="76" text-anchor="start" font-size="12.5" font-weight="bold" fill="#33475e" filter="url(#sk)">构造：nums = [1,3]，k = 6（k−n = 4 为偶）</text>
  <g filter="url(#sk)">
    <rect x="372" y="90" width="228" height="24" fill="#f4f4ee" stroke="#aaa" stroke-width="1"/>
    <rect x="372" y="210" width="228" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <rect x="372" y="234" width="228" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <rect x="372" y="114" width="228" height="144" fill="none" stroke="#888" stroke-width="1.2"/>
    <line x1="396" y1="90" x2="396" y2="258" stroke="#ccc" stroke-width="1"/>
    <line x1="442" y1="90" x2="442" y2="258" stroke="#ccc" stroke-width="1"/>
    <line x1="518" y1="90" x2="518" y2="258" stroke="#ccc" stroke-width="1"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#556" text-anchor="middle" filter="url(#sk)">
    <text x="384" y="106">步</text><text x="419" y="106">操作</text><text x="480" y="106">堆（顶在左）</text><text x="559" y="106">已删</text>
  </g>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="384" y="130">1</text><text x="419" y="130">删 1</text><text x="480" y="130">[3]</text><text x="559" y="130">{1}</text>
    <text x="384" y="154">2</text><text x="419" y="154">删 3</text><text x="480" y="154">[ ]</text><text x="559" y="154">{1,3}</text>
    <text x="384" y="178">3</text><text x="419" y="178">推 1</text><text x="480" y="178">[1]</text><text x="559" y="178">{3}</text>
    <text x="384" y="202">4</text><text x="419" y="202">删 1</text><text x="480" y="202">[ ]</text><text x="559" y="202">{1,3}</text>
    <text x="384" y="226">5</text><text x="419" y="226">推 1</text><text x="480" y="226">[1]</text><text x="559" y="226">{3}</text>
    <text x="384" y="250">6</text><text x="419" y="250">推 3</text><text x="480" y="250">[3,1]</text><text x="559" y="250">{1}</text>
  </g>
  <text x="486" y="278" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">第 5、6 步连续推回：先垫 1，再推目标 3（叠两层）</text>
  <text x="486" y="294" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">→ 堆 = [3,1]，堆顶 = 3 ✓</text>

  <!-- 要点 -->
  <g filter="url(#sk)">
    <rect x="40" y="316" width="540" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="310" y="341" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">要点：奇数空转步不必只靠「推-删对」——垫一层再推目标即可</text>
  <text x="310" y="362" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">依据是「推回不要求堆为空」：连续 push 叠放是合法操作序列</text>
</svg>
