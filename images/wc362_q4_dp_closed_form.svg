<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 445"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="445" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">核心观察三：对称性把 n 个位移状态压成 2 个 → 2×2 矩阵 → 闭式</text>

  <!-- 左：位移状态图 -->
  <text x="155" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">① 位移状态图（mod n = 6 示意）</text>

  <circle cx="150" cy="125" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="224" cy="168" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="224" cy="252" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="257" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="150" cy="295" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="300" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="76" cy="252" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="257" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="76" cy="168" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <!-- 从状态 1 出发的转移边 -->
  <path d="M 233 184 Q 252 210 233 236" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 231 183 Q 288 252 169 287" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 215 154 Q 190 118 170 128" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="258" y="196" font-size="10.5" fill="#888" filter="url(#rough2)">→ 其余每个状态</text>

  <!-- 被禁止的自环 -->
  <circle cx="238" cy="136" r="11" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 233 131 L 243 141 M 243 131 L 233 141" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="254" y="132" font-size="10.5" fill="#b85450" filter="url(#rough2)">自环被禁（l ≡ 0 不存在）</text>

  <text x="150" y="336" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">从任一状态一步可到其余 n−1 个状态，各恰 1 种 l</text>

  <!-- 右：两状态归并 -->
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">② 平移对称 ⇒ 非零状态全体同值，只剩 2 个数</text>

  <ellipse cx="398" cy="160" rx="62" ry="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="398" y="153" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">x(k)</text>
  <text x="398" y="173" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">净位移 ≡ 0</text>

  <ellipse cx="562" cy="160" rx="62" ry="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="562" y="153" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">y(k)</text>
  <text x="562" y="173" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">≡ r ≠ 0（同值）</text>

  <path d="M 552 130 Q 478 88 410 130" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="480" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">×(n−1)</text>
  <path d="M 410 190 Q 478 230 550 190" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="448" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">×1</text>
  <circle cx="562" cy="106" r="12" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 556 106 Q 562 96 568 106" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="582" y="102" font-size="11" fill="#446688" filter="url(#rough2)">×(n−2)</text>

  <text x="480" y="262" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">x(k+1) = (n−1) · y(k)</text>
  <text x="480" y="290" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">y(k+1) = x(k) + (n−2) · y(k)</text>
  <text x="480" y="322" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">矩阵 [[0, n−1], [1, n−2]] 的特征值：n−1 与 −1</text>

  <!-- 闭式结论框 -->
  <rect x="70" y="352" width="500" height="82" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="320" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">x(k) = [ (n−1)^k + (n−1)·(−1)^k ] / n</text>
  <text x="320" y="403" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">y(k) = [ (n−1)^k − (−1)^k ] / n</text>
  <text x="320" y="425" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">验证 k=1：x=0（一步转不回 0），y=1（每个非零位移恰 1 条路）</text>
</svg>
