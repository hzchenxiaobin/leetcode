<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：删首尾 = 双指针收拢；拼接 = 算术平移</text>
  <path d="M 110 42 Q 320 50 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left zone: the array -->
  <text x="46" y="72" font-size="13" font-weight="bold" fill="#446688">nums（示例 2，n = 5）</text>
  <g filter="url(#sk)">
    <rect x="46" y="80" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="116" y="80" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="186" y="80" width="60" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="256" y="80" width="60" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="326" y="80" width="60" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold">
    <text x="76" y="103" fill="#2b4a6b">5</text>
    <text x="146" y="103" fill="#2e5a22">14</text>
    <text x="216" y="103" fill="#8a6415">13</text>
    <text x="286" y="103" fill="#2e5a22">8</text>
    <text x="356" y="103" fill="#2b4a6b">12</text>
  </g>
  <path d="M 76 150 L 76 120" stroke="#b85450" stroke-width="2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="86" y="148" font-size="14" font-weight="bold" fill="#b85450">i</text>
  <path d="M 356 150 L 356 120" stroke="#b85450" stroke-width="2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="318" y="148" font-size="14" font-weight="bold" fill="#b85450">j</text>

  <!-- pairing arcs -->
  <path d="M 76 74 Q 106 56 136 74" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="106" y="54" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">第 2 对</text>
  <path d="M 356 74 Q 326 56 296 74" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 76 168 Q 216 192 356 168" stroke="#446688" stroke-width="1.8" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <text x="216" y="192" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第 1 对：5 ∥ 12（同色首尾配对）</text>
  <text x="216" y="162" text-anchor="middle" font-size="10.5" fill="#8a6415">13：n 为奇数时最后单独累加</text>

  <!-- arrow to formula card -->
  <path d="M 396 98 L 412 98" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>

  <!-- right zone: formula card -->
  <g filter="url(#sk)">
    <rect x="418" y="58" width="188" height="112" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="512" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3430">a 后接 b</text>
  <text x="512" y="101" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3430">= a × 10^d(b) + b</text>
  <text x="512" y="124" text-anchor="middle" font-size="11.5" fill="#a8605c">5 ∥ 12 = 5×100 + 12 = 512</text>
  <text x="512" y="143" text-anchor="middle" font-size="11.5" fill="#a8605c">14 ∥ 8 = 14×10 + 8 = 148</text>
  <text x="512" y="162" text-anchor="middle" font-size="10" fill="#a8605c">d(b)：b 的十进制位数</text>

  <!-- bottom notes -->
  <g filter="url(#sk)">
    <rect x="46" y="216" width="560" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="326" y="238" text-anchor="middle" font-size="12" fill="#2b4a6b" font-weight="bold">「删除首尾」只是语义：i、j 相向收拢即可，数组原地不动、无需真正删除</text>
  <g filter="url(#sk)">
    <rect x="46" y="260" width="560" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="326" y="282" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">p = 10^d(b) 由尾部 b 决定（b 在低位）：1 ≤ b ≤ 10⁴ → d ≤ 5 → p ≤ 10⁵</text>
  <g filter="url(#sk)">
    <rect x="46" y="304" width="560" height="34" rx="8" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
  </g>
  <text x="326" y="326" text-anchor="middle" font-size="11" fill="#888">求位数用「连除 10」整数循环：O(d) 且无浮点误差；别写 log10</text>
  <g filter="url(#sk)">
    <rect x="46" y="348" width="560" height="34" rx="8" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
  </g>
  <text x="326" y="370" text-anchor="middle" font-size="11" fill="#888">C++ 累加器用 long long：单次拼接可到 ~10⁹，500 对累加可达 ~5×10¹¹</text>
</svg>
