<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 395"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="395" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="16" font-weight="bold"
        fill="#333" filter="url(#rough2)">出度 ≤ 1 ⇒ 函数图：每个分量 = 挂链 + 至多一个环</text>

  <text x="185" y="64" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#446688" filter="url(#rough2)">分量一（ρ 形）</text>

  <ellipse cx="80" cy="95" rx="18" ry="18" fill="#e8f0fe" stroke="#446688"
           stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="100" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">0</text>

  <ellipse cx="80" cy="195" rx="18" ry="18" fill="#e8f0fe" stroke="#446688"
           stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="200" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">1</text>

  <path d="M 96 102 L 174 137" stroke="#446688" stroke-width="1.8" fill="none"
        stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 96 188 L 174 153" stroke="#446688" stroke-width="1.8" fill="none"
        stroke-linecap="round" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="34" y="149" font-size="12" fill="#446688" filter="url(#rough2)">挂链</text>

  <ellipse cx="190" cy="145" rx="18" ry="18" fill="#fce4ec" stroke="#b85450"
           stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="150" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">3</text>

  <ellipse cx="310" cy="95" rx="18" ry="18" fill="#fce4ec" stroke="#b85450"
           stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="100" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">2</text>

  <ellipse cx="310" cy="195" rx="18" ry="18" fill="#fce4ec" stroke="#b85450"
           stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="200" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">4</text>

  <path d="M 207 138 L 293 102" stroke="#b85450" stroke-width="2.2" fill="none"
        stroke-linecap="round" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 310 113 L 310 177" stroke="#b85450" stroke-width="2.2" fill="none"
        stroke-linecap="round" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 293 188 L 207 152" stroke="#b85450" stroke-width="2.2" fill="none"
        stroke-linecap="round" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="250" y="62" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">环（剥不动）</text>

  <text x="190" y="248" text-anchor="middle" font-size="12" fill="#b85450"
        filter="url(#rough2)">环长 3</text>

  <text x="462" y="64" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">分量二（无环）</text>

  <ellipse cx="420" cy="95" rx="18" ry="18" fill="#e6f4ea" stroke="#4a7a3a"
           stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="100" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">5</text>

  <ellipse cx="490" cy="165" rx="18" ry="18" fill="#e6f4ea" stroke="#4a7a3a"
           stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="170" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">6</text>

  <ellipse cx="420" cy="235" rx="18" ry="18" fill="#e6f4ea" stroke="#4a7a3a"
           stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="240" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">7</text>

  <path d="M 433 108 L 477 152" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        stroke-linecap="round" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 477 178 L 433 222" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        stroke-linecap="round" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 428 250 L 468 288" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        stroke-linecap="round" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="460" y="290" width="56" height="30" rx="6" fill="#eeeeee"
        stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"
        filter="url(#rough2)"/>
  <text x="488" y="310" text-anchor="middle" font-size="13" fill="#888"
        filter="url(#rough2)">−1</text>

  <text x="420" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">撞 −1 终止</text>

  <rect x="55" y="318" width="455" height="62" rx="9" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="282" y="338" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">入度 0 的节点 ⇒ 必不在环上（没有边指回来，自己回不去）</text>
  <text x="282" y="356" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">环上节点 ⇒ 环内前驱永远顶住入度 ≥ 1 ⇒ 剥不动</text>
  <text x="282" y="374" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">把入度 0 的节点反复剥光，剩下的恰是全部环上节点</text>
</svg>
