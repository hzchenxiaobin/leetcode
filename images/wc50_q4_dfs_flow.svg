<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">回溯流程：每次挑一对数合并，牌数减一，递归到只剩一张</text>

  <!-- A -->
  <rect x="118" y="44" width="330" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="283" y="68" text-anchor="middle" font-size="11.5" fill="#8a5a10" filter="url(#rough2)">cards 转成 vector&lt;double&gt; nums（实数除法）</text>
  <path d="M 283 82 L 283 120" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1 -->
  <polygon points="283,124 396,158 283,192 170,158" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="283" y="156" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">len(nums) == 1 ?</text>
  <text x="283" y="172" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">只剩一张牌</text>

  <!-- 是 -->
  <path d="M 396 158 L 448 158" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="150" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="452" y="138" width="152" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="528" y="155" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">return |x − 24| &lt; ε</text>
  <text x="528" y="170" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">ε = 1e−6，不能写 ==</text>

  <!-- 否 -->
  <path d="M 283 192 L 283 224" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="212" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- C -->
  <rect x="118" y="228" width="330" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="283" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">枚举 i &lt; j：rest = 其余 n−2 个数</text>
  <path d="M 283 266 L 283 292" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D -->
  <rect x="118" y="296" width="330" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="283" y="320" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">6 个候选：a+b, a−b, b−a, a×b, a÷b, b÷a</text>
  <path d="M 283 334 L 283 360" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- E -->
  <rect x="118" y="364" width="330" height="38" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="283" y="388" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rest 压入 v → dfs(rest) → 弹出（回溯）</text>
  <path d="M 283 402 L 283 424" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- F -->
  <rect x="118" y="428" width="330" height="34" fill="#f2f2f2" stroke="#999" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="283" y="450" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">全部分支失败 → return false</text>

  <!-- 回边 -->
  <path d="M 118 383 L 62 383 L 62 247 L 112 247" stroke="#b85450" stroke-width="1.5"
        stroke-dasharray="6 5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="50" y="315" text-anchor="middle" font-size="10" fill="#b85450" transform="rotate(-90 50 315)" filter="url(#rough2)">换下一对 / 下一个运算</text>

  <!-- 右侧标注 -->
  <rect x="452" y="206" width="152" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="466" y="226" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">每层分支数</text>
  <text x="466" y="246" font-size="10" fill="#555" filter="url(#rough2)">m=4：6 × 6 = 36</text>
  <text x="466" y="264" font-size="10" fill="#555" filter="url(#rough2)">m=3：3 × 6 = 18</text>
  <text x="466" y="282" font-size="10" fill="#555" filter="url(#rough2)">m=2：1 × 6 = 6</text>
  <text x="466" y="302" font-size="9.5" fill="#999" filter="url(#rough2)">C(m,2) 对 × ≤6 种运算</text>

  <rect x="452" y="326" width="152" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="466" y="346" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">搜索规模</text>
  <text x="466" y="366" font-size="10.5" fill="#555" filter="url(#rough2)">36 × 18 × 6</text>
  <text x="466" y="382" font-size="10.5" fill="#555" filter="url(#rough2)">= 3888 个叶子</text>
</svg>
