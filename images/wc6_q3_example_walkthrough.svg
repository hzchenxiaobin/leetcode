<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text filter="url(#rough2)" x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：排序后逐个插入，6 步得到答案</text>
  <text filter="url(#rough2)" x="310" y="46" text-anchor="middle" font-size="11" fill="#888">排序结果 (7,0) (7,1) (6,1) (5,0) (5,2) (4,4)：身高降序，同身高 k 升序</text>

  <g filter="url(#rough2)" font-size="10" fill="#888">
    <text x="42" y="80">步</text>
    <text x="100" y="80">当前人</text>
    <text x="196" y="80">插入位置</text>
    <text x="290" y="80">队列（插入后）</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <text x="42" y="112" fill="#999">1</text>
    <text x="100" y="112" fill="#3a4a66">(7,0)</text>
    <text x="196" y="112" fill="#8a6a20">k = 0</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="290" y="92" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="313" y="112" fill="#8a6a20">7,0</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <text x="42" y="164" fill="#999">2</text>
    <text x="100" y="164" fill="#3a4a66">(7,1)</text>
    <text x="196" y="164" fill="#8a6a20">k = 1</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="290" y="144" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="313" y="164" fill="#3a4a66">7,0</text>
    <rect x="340" y="144" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="363" y="164" fill="#8a6a20">7,1</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <text x="42" y="216" fill="#999">3</text>
    <text x="100" y="216" fill="#3a4a66">(6,1)</text>
    <text x="196" y="216" fill="#8a6a20">k = 1</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="290" y="196" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="313" y="216" fill="#3a4a66">7,0</text>
    <rect x="340" y="196" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="363" y="216" fill="#8a6a20">6,1</text>
    <rect x="390" y="196" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="413" y="216" fill="#3a4a66">7,1</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <text x="42" y="268" fill="#999">4</text>
    <text x="100" y="268" fill="#3a4a66">(5,0)</text>
    <text x="196" y="268" fill="#8a6a20">k = 0</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="290" y="248" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="313" y="268" fill="#8a6a20">5,0</text>
    <rect x="340" y="248" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="363" y="268" fill="#3a4a66">7,0</text>
    <rect x="390" y="248" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="413" y="268" fill="#3a4a66">6,1</text>
    <rect x="440" y="248" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="463" y="268" fill="#3a4a66">7,1</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <text x="42" y="320" fill="#999">5</text>
    <text x="100" y="320" fill="#3a4a66">(5,2)</text>
    <text x="196" y="320" fill="#8a6a20">k = 2</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="290" y="300" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="313" y="320" fill="#3a4a66">5,0</text>
    <rect x="340" y="300" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="363" y="320" fill="#3a4a66">7,0</text>
    <rect x="390" y="300" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="413" y="320" fill="#8a6a20">5,2</text>
    <rect x="440" y="300" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="463" y="320" fill="#3a4a66">6,1</text>
    <rect x="490" y="300" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="513" y="320" fill="#3a4a66">7,1</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <text x="42" y="372" fill="#999">6</text>
    <text x="100" y="372" fill="#3a4a66">(4,4)</text>
    <text x="196" y="372" fill="#8a6a20">k = 4</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="290" y="352" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="313" y="372" fill="#3a4a66">5,0</text>
    <rect x="340" y="352" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="363" y="372" fill="#3a4a66">7,0</text>
    <rect x="390" y="352" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="413" y="372" fill="#3a4a66">5,2</text>
    <rect x="440" y="352" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="463" y="372" fill="#3a4a66">6,1</text>
    <rect x="490" y="352" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="513" y="372" fill="#8a6a20">4,4</text>
    <rect x="540" y="352" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="563" y="372" fill="#3a4a66">7,1</text>
  </g>


  <text filter="url(#rough2)" x="310" y="404" text-anchor="middle" font-size="10" fill="#8a3a36">第 6 步结果与示例输出一致：[[5,0],[7,0],[5,2],[6,1],[4,4],[7,1]]</text>
  <text filter="url(#rough2)" x="310" y="422" text-anchor="middle" font-size="10" fill="#999">橙框 = 本步插入的人，它正好落在下标 k 上（前面 k 人都比他高或等高）</text>
</svg>
