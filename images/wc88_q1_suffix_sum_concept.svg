<svg xmlns="http://www.w3.org/2000/svg" width="660" height="445" viewBox="0 0 660 445" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="445" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">每个字母的总移位 = 从它开始的后缀和</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="172" y="150" text-anchor="end" font-size="10.5" fill="#2b2b2b">i=0（移 3 次）</text>
  <text x="172" y="194" text-anchor="end" font-size="10.5" fill="#2b2b2b">i=1（移 5 次）</text>
  <text x="172" y="238" text-anchor="end" font-size="10.5" fill="#2b2b2b">i=2（移 9 次）</text>
  <text x="210" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">a</text>
  <text x="270" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">b</text>
  <text x="330" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">c</text>
  <g filter="url(#sk2)"><rect x="180" y="120" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="210" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">3</text>
  <g filter="url(#sk2)"><rect x="240" y="120" width="60" height="44" fill="#ffffff" stroke="#d8dde3" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk2)"><rect x="300" y="120" width="60" height="44" fill="#ffffff" stroke="#d8dde3" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk2)"><rect x="180" y="164" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="210" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">5</text>
  <g filter="url(#sk2)"><rect x="240" y="164" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="270" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">5</text>
  <g filter="url(#sk2)"><rect x="300" y="164" width="60" height="44" fill="#ffffff" stroke="#d8dde3" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <g filter="url(#sk2)"><rect x="180" y="208" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="210" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">9</text>
  <g filter="url(#sk2)"><rect x="240" y="208" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="270" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">9</text>
  <g filter="url(#sk2)"><rect x="300" y="208" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="330" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">9</text>
  <text x="172" y="288" text-anchor="end" font-size="10.5" font-weight="bold" fill="#2e5e22">列和 = 17 / 14 / 9</text>
  <g filter="url(#sk2)"><rect x="180" y="264" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="210" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">17</text>
  <g filter="url(#sk2)"><rect x="240" y="264" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="270" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">14</text>
  <g filter="url(#sk2)"><rect x="300" y="264" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="330" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">9</text>
  <g filter="url(#sk2)"><rect x="60.0" y="312.0" width="480" height="56" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="300" y="336.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22">a 移 17 → r，b 移 14 → p，c 移 9 → l</text>
  <text x="300" y="352.3" text-anchor="middle" font-size="12" fill="#2e5e22">结果 "rpl"</text>
  <g filter="url(#sk2)"><rect x="425.0" y="85.0" width="210" height="66" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="530" y="114.4" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">后缀和 S[j] =</text>
  <text x="530" y="129.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">shifts[j] + … + shifts[n-1]</text>
  <g filter="url(#sk2)"><rect x="425.0" y="176.0" width="210" height="58" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="530" y="201.5" text-anchor="middle" font-size="10.5" fill="#2b4a6e">s[j] = 'a' +</text>
  <text x="530" y="216.0" text-anchor="middle" font-size="10.5" fill="#2b4a6e">((s[j]-'a') + S[j]) mod 26</text>
  <g filter="url(#sk2)"><rect x="425.0" y="259.0" width="210" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="530" y="281.5" text-anchor="middle" font-size="10.5" fill="#2b4a6e">每步对 26 取模，</text>
  <text x="530" y="296.0" text-anchor="middle" font-size="10.5" fill="#2b4a6e">避免大数累积</text>
  <g filter="url(#sk2)"><rect x="50.0" y="387.0" width="560" height="36" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="330" y="409.0" text-anchor="middle" font-size="11" fill="#2b4a6e">从右往左一次累加，每个字母只算一次 → 时间 O(n)，空间 O(1)</text>
</svg>
