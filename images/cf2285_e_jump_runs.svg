<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="450" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">沿「等差分极长段」跳跃：每跳 O(1)，最多跳 k+1 次</text>
  <text x="290" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以样例 a = [1, 2, 6, 4, 5]、i = 1、d = 1（直线要求 a[m] = m）为例</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="104" y="80" font-size="10.5" fill="#666" text-anchor="end">下标 m</text>
    <text x="104" y="118" font-size="10.5" fill="#666" text-anchor="end">a[m]</text>
    <text x="104" y="156" font-size="10.5" fill="#666" text-anchor="end">直线要求</text>
    <text x="104" y="192" font-size="10.5" fill="#666" text-anchor="end">差分</text>

    <rect x="116" y="64" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/><text x="144" y="80" fill="#6b5a30">1</text>
    <rect x="180" y="64" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/><text x="208" y="80" fill="#6b5a30">2</text>
    <rect x="244" y="64" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/><text x="272" y="80" fill="#6b5a30">3</text>
    <rect x="308" y="64" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/><text x="336" y="80" fill="#6b5a30">4</text>
    <rect x="372" y="64" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/><text x="400" y="80" fill="#6b5a30">5</text>

    <rect x="116" y="100" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/><text x="144" y="118" fill="#2f4f6f">1</text>
    <rect x="180" y="100" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/><text x="208" y="118" fill="#2f4f6f">2</text>
    <rect x="244" y="100" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/><text x="272" y="118" fill="#8a3a36" font-weight="bold">6</text>
    <rect x="308" y="100" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/><text x="336" y="118" fill="#2f4f6f">4</text>
    <rect x="372" y="100" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/><text x="400" y="118" fill="#2f4f6f">5</text>

    <text x="144" y="156" fill="#4a7a3a">1</text><text x="208" y="156" fill="#4a7a3a">2</text>
    <text x="272" y="156" fill="#b85450" font-weight="bold">3 ✗</text>
    <text x="336" y="156" fill="#4a7a3a">4</text><text x="400" y="156" fill="#4a7a3a">5</text>

    <rect x="116" y="176" width="56" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" stroke-dasharray="3 3"/><text x="144" y="192" fill="#aaa">—</text>
    <rect x="180" y="176" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/><text x="208" y="192" fill="#3a5a30">1</text>
    <rect x="244" y="176" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/><text x="272" y="192" fill="#8a6a20">4</text>
    <rect x="308" y="176" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/><text x="336" y="192" fill="#8a6a20">−2</text>
    <rect x="372" y="176" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/><text x="400" y="192" fill="#3a5a30">1</text>
  </g>

  <g filter="url(#rough2)">
    <text x="116" y="224" font-size="10.5" fill="#4a7a3a">绿色：差分等于 d，整段都匹配直线 ⇒ 一次跳过</text>
    <text x="116" y="242" font-size="10.5" fill="#8a6a20">黄色：差分不是 d，但它两侧的位置仍可能单独匹配，逐个 O(1) 核对</text>
    <text x="116" y="260" font-size="10.5" fill="#b85450">红色：该格必须修改（花掉 1 次额度），改完后继续从下一格推进</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="272" width="532" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="40" y="294" font-size="11.5" fill="#2f4f6f" font-weight="bold">跳表：nxt[m] = 最小的 p &gt; m 使 diff[p] ≠ diff[m]</text>
    <text x="40" y="313" font-size="10.5" fill="#3a4a66">pos 匹配时若 a[pos+1]、a[pos+2] 也匹配 ⇒ diff[pos+2] = d，下一个不匹配位置就是 nxt[pos+2]。</text>
    <text x="40" y="331" font-size="10.5" fill="#3a4a66">否则不匹配位置只可能是 pos+1 或 pos+2，直接返回。整段匹配因此 O(1) 跳过。</text>
  </g>

  <path d="M 290 342 L 290 356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="24" y="360" width="532" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="40" y="382" font-size="11.5" fill="#8a6a20" font-weight="bold">贪心推进：先把右侧推满，剩余额度再向左侧「买」长度</text>
    <text x="40" y="401" font-size="10.5" fill="#6b5a30">每遇到一个不匹配就 used++ 并以它为新起点，直到 used = k 或走到 n，记右端 cnt。</text>
    <text x="40" y="419" font-size="10.5" fill="#6b5a30">答案 = (cnt − i + 1) + min(i − 1, k − used)；样例：cnt = 5、used = 1 ⇒ 长度 5。</text>
  </g>
</svg>
