<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="900" height="660" fill="#fafafa"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：cuboids = [[50,45,20],[95,37,53],[45,23,12]] → 190</text>
  <path d="M 190 42 Q 450 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="450" y="63" text-anchor="middle" font-size="12" fill="#567" filter="url(#rough2)">三步：内部排序 → 字典序排序 → dp 递推（前驱判定 j 三维 ≤ i）</text>

  <!-- step 1: internal sort -->
  <rect x="40" y="80" width="430" height="158" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第一步：每块内部排序（最大维度当高）</text>
  <text x="90" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#567" filter="url(#rough2)">原下标</text>
  <text x="235" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#567" filter="url(#rough2)">原始</text>
  <text x="375" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#567" filter="url(#rough2)">排序后 (w,l,h)</text>
  <path d="M 60 138 L 450 138" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="90" y="160" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="235" y="160" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[50,45,20]</text>
  <text x="375" y="160" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506e" filter="url(#rough2)">[20,45,50]</text>
  <path d="M 60 170 L 450 170" stroke="#c5d3e3" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="90" y="188" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="235" y="188" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[95,37,53]</text>
  <text x="375" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506e" filter="url(#rough2)">[37,53,95]</text>
  <path d="M 60 198 L 450 198" stroke="#c5d3e3" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="90" y="216" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="235" y="216" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[45,23,12]</text>
  <text x="375" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506e" filter="url(#rough2)">[12,23,45]</text>
  <text x="255" y="232" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">高度 h = 排序后的第三个数（最大维度）</text>

  <!-- step 2: lexicographic sort -->
  <rect x="490" y="80" width="370" height="158" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="675" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">第二步：按 (w,l,h) 字典序升序</text>
  <g filter="url(#rough2)">
    <rect x="512" y="122" width="104" height="52" rx="6" fill="#fafafa" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="624" y="122" width="104" height="52" rx="6" fill="#fafafa" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="736" y="122" width="104" height="52" rx="6" fill="#fafafa" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="564" y="144" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">(12,23,45)</text>
  <text x="564" y="164" text-anchor="middle" font-size="10" fill="#567" filter="url(#rough2)">原 2</text>
  <text x="676" y="144" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">(20,45,50)</text>
  <text x="676" y="164" text-anchor="middle" font-size="10" fill="#567" filter="url(#rough2)">原 0</text>
  <text x="788" y="144" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">(37,53,95)</text>
  <text x="788" y="164" text-anchor="middle" font-size="10" fill="#567" filter="url(#rough2)">原 1</text>
  <text x="564" y="194" text-anchor="middle" font-size="10" font-weight="bold" fill="#888" filter="url(#rough2)">位置 0</text>
  <text x="676" y="194" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">位置 1</text>
  <text x="788" y="194" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">位置 2</text>
  <text x="675" y="226" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">字典序保证 j &lt; i ⇒ w_j ≤ w_i</text>

  <!-- step 3: dp -->
  <rect x="40" y="256" width="520" height="270" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第三步：dp 递推</text>
  <text x="300" y="304" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">dp[i] = h_i + max{ dp[j] : j &lt; i，j 三维 ≤ i }</text>
  <text x="80" y="328" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#567" filter="url(#rough2)">i</text>
  <text x="170" y="328" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#567" filter="url(#rough2)">(w,l,h)</text>
  <text x="330" y="328" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#567" filter="url(#rough2)">可接前驱 j（三维 ≤ i）</text>
  <text x="470" y="328" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#567" filter="url(#rough2)">dp[i]</text>
  <path d="M 60 336 L 540 336" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="80" y="358" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="170" y="358" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(12,23,45)</text>
  <text x="330" y="358" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">—（无前驱）</text>
  <text x="470" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">45</text>
  <text x="80" y="388" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="170" y="388" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(20,45,50)</text>
  <text x="330" y="388" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j=0 ✓（12≤20, 23≤45, 45≤50）</text>
  <text x="470" y="388" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">50+45 = 95</text>
  <text x="80" y="418" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="170" y="418" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(37,53,95)</text>
  <text x="330" y="418" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j=0 ✓ · j=1 ✓（取 dp[1]=95）</text>
  <text x="470" y="418" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">95+95 = 190 ★</text>
  <path d="M 268 344 Q 254 366 264 382" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 268 374 Q 254 396 264 412" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="120" y="436" width="360" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a2a" filter="url(#rough2)">dp = [45, 95, 190] → 答案 = max = 190</text>
  <text x="300" y="492" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">最优转移链 0 → 1 → 2（自顶向下），每步判定 3 个维度</text>
  <text x="300" y="512" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">n = 100 时总运算量级仅 10^4</text>

  <!-- tower card -->
  <rect x="580" y="256" width="280" height="270" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="720" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a2a" filter="url(#rough2)">对应的最优塔（自底向上）</text>
  <g filter="url(#rough2)">
    <path d="M 640 380 L 654 368 L 774 368 L 760 380 Z" fill="#d9e5f2" stroke="#446688" stroke-width="1.6"/>
    <path d="M 655 352 L 667 342 L 757 342 L 745 352 Z" fill="#d9e5f2" stroke="#446688" stroke-width="1.6"/>
    <path d="M 674 327 L 684 319 L 746 319 L 736 327 Z" fill="#f0f5fb" stroke="#446688" stroke-width="1.6"/>
    <rect x="640" y="380" width="120" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="655" y="352" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="674" y="327" width="62" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="628" y="343" text-anchor="end" font-size="10" fill="#2f5a2a" filter="url(#rough2)">(12,23,45) 原 2</text>
  <text x="628" y="369" text-anchor="end" font-size="10" fill="#2f5a2a" filter="url(#rough2)">(20,45,50) 原 0</text>
  <text x="628" y="410" text-anchor="end" font-size="10" fill="#2f5a2a" filter="url(#rough2)">(37,53,95) 原 1</text>
  <text x="792" y="343" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">45</text>
  <text x="792" y="369" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">50</text>
  <text x="792" y="410" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">95</text>
  <text x="720" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a2a" filter="url(#rough2)">95 + 50 + 45 = 190</text>
  <text x="720" y="488" text-anchor="middle" font-size="10.5" fill="#4a6a45" filter="url(#rough2)">官方解释的堆法 = 每块内部排序的朝向</text>
  <text x="720" y="508" text-anchor="middle" font-size="10.5" fill="#4a6a45" filter="url(#rough2)">最优解天然落在固定朝向的解空间里</text>

  <!-- footer -->
  <rect x="40" y="546" width="820" height="70" rx="10" fill="#f6f6f4" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="574" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两步排序把「旋转 + 顺序」的自由度全部消除，剩下的就是固定三元组上的 LIS 求和变体</text>
  <text x="450" y="598" text-anchor="middle" font-size="11" fill="#567" filter="url(#rough2)">n ≤ 100：O(n²) 一遍过；赛点在「敢不敢直接内部排序」这一步的信心</text>
</svg>
