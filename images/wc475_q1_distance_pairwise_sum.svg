<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">三个成对距离之和 = 2 × (c − a)</text>
  <text x="260" y="54" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">以下标 (0, 2, 3) 为例（示例 1 的最优三元组）</text>

  <!-- 数轴 -->
  <path d="M70 160 L470 160" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="110" y1="153" x2="110" y2="167" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="190" y1="153" x2="190" y2="167" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="270" y1="153" x2="270" y2="167" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="350" y1="153" x2="350" y2="167" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="430" y1="153" x2="430" y2="167" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 三个下标点 -->
  <circle cx="110" cy="160" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="184" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">a = 0</text>
  <circle cx="270" cy="160" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="184" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">b = 2</text>
  <circle cx="350" cy="160" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="184" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">c = 3</text>

  <!-- 上方两段弧：b−a 与 c−b -->
  <path d="M110 148 Q190 92 270 148" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">b − a = 2</text>
  <path d="M270 148 Q310 104 350 148" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="311" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">c − b = 1</text>

  <!-- 下方长弧：c−a -->
  <path d="M110 172 Q230 232 350 172" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="228" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">c − a = 3</text>

  <!-- 公式框 -->
  <rect x="70" y="252" width="380" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">(b−a) + (c−b) + (c−a) = 2 + 1 + 3 = 6</text>
  <text x="260" y="304" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">中间点 b 一加一减抵消 → 距离只由两端 a、c 决定</text>
</svg>
