<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：棘轮效应——上涨由 arr1 全额吃下，回落一分不还</text>
  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">示意例 nums = [2,6,3]：[1,1000,1] 的等比缩小，同样无解</text>

  <!-- legend -->
  <g filter="url(#rough2)">
    <rect x="40" y="50" width="20" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="66" y="60" font-size="10" fill="#555">可行带 [ℓ, nums]</text>
    <rect x="172" y="50" width="20" height="12" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="198" y="60" font-size="10" fill="#555">死区 [0, ℓ)</text>
  </g>

  <!-- column 0: nums=2, band [0,2] all green -->
  <g filter="url(#rough2)">
    <rect x="70" y="268" width="64" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2"/>
  </g>
  <!-- column 1: nums=6, band [4,6] green, dead [0,4] red -->
  <g filter="url(#rough2)">
    <rect x="160" y="164" width="64" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2"/>
    <rect x="160" y="216" width="64" height="104" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3" rx="2"/>
    <text x="192" y="272" text-anchor="middle" font-size="9.5" fill="#8a2f2a">死区：全 0</text>
  </g>
  <!-- column 2: nums=3, whole column dead -->
  <g filter="url(#rough2)">
    <rect x="250" y="242" width="64" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="2"/>
    <text x="282" y="264" text-anchor="middle" font-size="10" fill="#8a2f2a" font-weight="bold">全 0</text>
    <text x="282" y="298" text-anchor="middle" font-size="24" fill="#b85450" font-weight="bold">✗</text>
    <text x="282" y="232" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">ℓ=4 越过 nums=3</text>
  </g>

  <!-- band width bracket at column 1 -->
  <g filter="url(#rough2)">
    <path d="M 228 167 L 228 213" fill="none" stroke="#446688" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="230" y="192" font-size="9" fill="#446688" font-weight="bold">带宽</text>
  </g>

  <!-- nums polyline -->
  <g filter="url(#rough2)">
    <path d="M 70 268 L 160 164 L 250 242" fill="none" stroke="#d6a040" stroke-width="2.4"/>
    <circle cx="70" cy="268" r="3.5" fill="#d6a040"/>
    <circle cx="160" cy="164" r="3.5" fill="#d6a040"/>
    <circle cx="250" cy="242" r="3.5" fill="#d6a040"/>
    <text x="163" y="152" font-size="11" fill="#8a6a1a" font-weight="bold">nums</text>
  </g>

  <!-- ratchet staircase -->
  <g filter="url(#rough2)">
    <path d="M 56 320 L 120 319 L 136 318 L 150 218 L 258 215 L 334 218"
          fill="none" stroke="#446688" stroke-width="2.4" stroke-dasharray="7 5"/>
    <text x="88" y="312" font-size="10" fill="#446688" font-weight="bold">ℓ₀ = 0</text>
    <text x="295" y="208" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">ℓ 只升不降</text>
  </g>

  <!-- baseline + labels -->
  <g filter="url(#rough2)">
    <path d="M 52 322 L 330 320" stroke="#888" stroke-width="1.5"/>
    <text x="102" y="338" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">nums=2</text>
    <text x="192" y="338" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">nums=6</text>
    <text x="282" y="338" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">nums=3</text>
    <text x="131" y="356" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">Δ=+4</text>
    <text x="131" y="370" text-anchor="middle" font-size="9.5" fill="#8a2f2a">arr1 必涨 4</text>
    <text x="221" y="356" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">Δ=−3</text>
    <text x="221" y="370" text-anchor="middle" font-size="9.5" fill="#557">arr1 不还价，arr2 吞跌</text>
  </g>

  <!-- right panel -->
  <g filter="url(#rough2)">
    <rect x="344" y="56" width="192" height="250" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="440" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">记 s = arr1[i]，t = arr1[i−1]</text>
    <text x="440" y="94" text-anchor="middle" font-size="10" fill="#446688">Δ = nums[i] − nums[i−1]，d = max(0, Δ)</text>
    <text x="356" y="120" font-size="10.5" fill="#555">① arr1 非减：t ≤ s</text>
    <text x="356" y="140" font-size="10.5" fill="#555">② arr2 非增：t ≤ s − Δ</text>
    <rect x="352" y="150" width="176" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="440" y="167" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">合并：t ≤ s − d</text>
    <text x="356" y="198" font-size="10" fill="#555">d &gt; 0：涨幅由 arr1 全额吃下</text>
    <text x="356" y="214" font-size="10" fill="#555">d = 0：只剩非减一条</text>
    <text x="356" y="238" font-size="10" fill="#446688" font-weight="bold">棘轮：ℓᵢ = ℓᵢ₋₁ + dᵢ，只升不降</text>
    <rect x="352" y="248" width="176" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="440" y="265" text-anchor="middle" font-size="10.5" fill="#8a2f2a" font-weight="bold">某层 ℓᵢ 越过 nums[i] ⇒ 答案 0</text>
    <text x="440" y="294" text-anchor="middle" font-size="9.5" fill="#888">O(n) 即可预判无解</text>
  </g>

  <!-- bottom summary -->
  <g filter="url(#rough2)">
    <rect x="24" y="396" width="512" height="30" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="416" text-anchor="middle" font-size="10.5" fill="#2c4258" font-weight="bold">两条单调性合并成单侧上界 t ≤ s − d：窗口恒为前缀 [0, s−d]，前缀和一次查询 O(1)</text>
  </g>
</svg>
