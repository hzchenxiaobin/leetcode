<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>
  <text x="340" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">示例演算：n = 3，startPos = (0, 1)，s = "RRDDLU"</text>
  <text x="340" y="44" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">answer = [1, 5, 4, 3, 1, 0]</text>
  <path d="M 250 52 Q 340 58 430 52" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 3x3 网格与轨迹 -->
  <text x="88" y="78" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="144" y="78" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="200" y="78" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="52" y="116" text-anchor="end" font-size="10" fill="#888">0</text>
  <text x="52" y="172" text-anchor="end" font-size="10" fill="#888">1</text>
  <text x="52" y="228" text-anchor="end" font-size="10" fill="#888">2</text>
  <g filter="url(#sk)">
    <rect x="60" y="84" width="56" height="56" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="172" y="84" width="56" height="56" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="60" y="140" width="56" height="56" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="172" y="140" width="56" height="56" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="60" y="196" width="56" height="56" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="172" y="196" width="56" height="56" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <rect x="116" y="84" width="56" height="56" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="116" y="140" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="144" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#c09028">S</text>
  <text x="144" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">终</text>

  <!-- i=1 的完整轨迹 RDDLU -->
  <g filter="url(#sk)">
    <path d="M 154 112 L 186 112" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M 200 120 L 200 158" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M 200 176 L 200 214" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M 186 224 L 154 224" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M 144 214 L 144 180" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="170" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">R</text>
  <text x="210" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">D</text>
  <text x="210" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">D</text>
  <text x="170" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">L</text>
  <text x="132" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">U</text>

  <!-- i=0 的出界虚线 -->
  <path d="M 210 112 L 246 112" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="256" y="117" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">✗</text>

  <text x="144" y="272" text-anchor="middle" font-size="11" fill="#b85450">i=0：1 条 R 后，下一条 R 出界 ✗（answer=1）</text>
  <text x="144" y="290" text-anchor="middle" font-size="11" fill="#446688">i=1：R→D→D→L→U 共 5 条，终点 (1,1)</text>
  <text x="144" y="308" text-anchor="middle" font-size="10" fill="#888">蓝色箭头 = i=1 的轨迹；红色虚线 = 出界的那一步</text>

  <!-- 六个后缀的演算表 -->
  <g filter="url(#sk)">
    <rect x="272" y="84" width="392" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="286" y="101" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">i</text>
  <text x="349" y="101" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">s[i..]</text>
  <text x="475" y="101" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">执行情况</text>
  <text x="579" y="101" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">answer</text>
  <text x="635" y="101" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">j = i+ans</text>

  <g filter="url(#sk)">
    <rect x="272" y="110" width="392" height="27" fill="#ffffff" stroke="#9db0c4" stroke-width="0.8"/>
    <rect x="272" y="137" width="392" height="27" fill="#f4f7fb" stroke="#9db0c4" stroke-width="0.8"/>
    <rect x="272" y="164" width="392" height="27" fill="#ffffff" stroke="#9db0c4" stroke-width="0.8"/>
    <rect x="272" y="191" width="392" height="27" fill="#f4f7fb" stroke="#9db0c4" stroke-width="0.8"/>
    <rect x="272" y="218" width="392" height="27" fill="#ffffff" stroke="#9db0c4" stroke-width="0.8"/>
    <rect x="272" y="245" width="392" height="27" fill="#f4f7fb" stroke="#9db0c4" stroke-width="0.8"/>
  </g>
  <text x="286" y="127" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="349" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">RRDDLU</text>
  <text x="475" y="127" text-anchor="middle" font-size="10.5" fill="#555">R 后下一条 R 出界</text>
  <text x="579" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">1</text>
  <text x="635" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">1</text>

  <text x="286" y="154" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="349" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">RDDLU</text>
  <text x="475" y="154" text-anchor="middle" font-size="10.5" fill="#555">5 条全部执行，终点 (1,1)</text>
  <text x="579" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">5</text>
  <text x="635" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">6</text>

  <text x="286" y="181" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="349" y="181" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">DDLU</text>
  <text x="475" y="181" text-anchor="middle" font-size="10.5" fill="#555">4 条全部执行，终点 (1,0)</text>
  <text x="579" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">4</text>
  <text x="635" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">6</text>

  <text x="286" y="208" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="349" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">DLU</text>
  <text x="475" y="208" text-anchor="middle" font-size="10.5" fill="#555">3 条全部执行，终点 (0,0)</text>
  <text x="579" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">3</text>
  <text x="635" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">6</text>

  <text x="286" y="235" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="349" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">LU</text>
  <text x="475" y="235" text-anchor="middle" font-size="10.5" fill="#555">L 后 U 出界</text>
  <text x="579" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">1</text>
  <text x="635" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">5</text>

  <text x="286" y="262" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="349" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">U</text>
  <text x="475" y="262" text-anchor="middle" font-size="10.5" fill="#555">第 1 条即出界</text>
  <text x="579" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">0</text>
  <text x="635" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">6</text>

  <!-- j 不单调标注 -->
  <g filter="url(#sk)">
    <ellipse cx="635" cy="231" rx="15" ry="11" fill="none" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="468" y="296" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">j 序列 = 1, 6, 6, 6, 5, 6 —— 不单调！</text>
  <text x="468" y="313" text-anchor="middle" font-size="10.5" fill="#333">相邻后缀的停止下标无法相互推导，只能逐个模拟</text>

  <!-- 官方笔误提示 -->
  <g filter="url(#sk)">
    <rect x="40" y="330" width="600" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="340" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#c09028">⚠️ 官方解释称 i=1、i=2「最终到达 (0,0)」系笔误</text>
  <text x="340" y="366" text-anchor="middle" font-size="10.5" fill="#333">按题意模拟，实际终点为 (1,1) 与 (1,0)（(0,0) 是 i=3 的终点）；答案数组本身无误</text>
</svg>
