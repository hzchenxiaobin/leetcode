<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">同一张带权图，消失时刻不同则答案不同</text>

  <g stroke="#446688" stroke-width="1.8" filter="url(#rough2)">
    <path d="M 152 120 L 298 120"/>
    <path d="M 305 138 L 240 232"/>
    <path d="M 145 138 L 210 232"/>
  </g>
  <g font-size="12" fill="#b85450" text-anchor="middle" filter="url(#rough2)" font-weight="bold">
    <text x="225" y="112">2</text>
    <text x="288" y="192">1</text>
    <text x="160" y="192">4</text>
  </g>
  <g filter="url(#rough2)">
    <circle cx="130" cy="120" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="320" cy="120" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="225" cy="250" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="130" y="126">0</text><text x="320" y="126">1</text><text x="225" y="256">2</text>
  </g>
  <g font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">
    <text x="130" y="164">disappear = 1</text>
    <text x="320" y="164">disappear = 1</text>
    <text x="225" y="294">disappear = 5</text>
  </g>
  <text x="130" y="182" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">起点：时间 0 &lt; 1</text>

  <rect x="40" y="304" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11.5" fill="#8a2b26" filter="url(#rough2)">disappear = [1, 1, 5]：到 1 需 2 且 2 ≥ 1 ⇒ 不可达；到 2 需 4 且 4 &lt; 5 ⇒ 可达</text>
  <text x="280" y="340" text-anchor="middle" font-size="11.5" fill="#8a2b26" font-weight="bold" filter="url(#rough2)">answer = [0, −1, 4]</text>

  <rect x="40" y="356" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="11.5" fill="#2d5a22" filter="url(#rough2)">disappear = [1, 3, 5]：2 &lt; 3 可达；经 1 到 2 只花 3 &lt; 4，比直达更快</text>
  <text x="280" y="392" text-anchor="middle" font-size="11.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">answer = [0, 2, 3]</text>
</svg>
