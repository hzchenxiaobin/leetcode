<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 1 走查：7 步得到 6 段交集</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">firstList = [[0,2],[5,10],[13,23],[24,25]]，secondList = [[1,5],[8,12],[15,24],[25,26]]</text>

  <rect x="18" y="60" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="44" y="79" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">步</text>
  <rect x="74" y="60" width="112" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="79" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">firstList[i]</text>
  <rect x="190" y="60" width="112" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="246" y="79" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">secondList[j]</text>
  <rect x="306" y="60" width="132" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="372" y="79" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">交集</text>
  <rect x="442" y="60" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="492" y="79" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">前进</text>

  <rect x="18" y="92" width="52" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="44" y="112" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="74" y="92" width="112" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="130" y="112" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[0,2]</text>
  <rect x="190" y="92" width="112" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="246" y="112" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[1,5]</text>
  <rect x="306" y="92" width="132" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="372" y="112" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">[1,2]</text>
  <rect x="442" y="92" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="492" y="112" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2 &lt; 5，i++</text>

  <rect x="18" y="126" width="52" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="44" y="146" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="74" y="126" width="112" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="130" y="146" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[5,10]</text>
  <rect x="190" y="126" width="112" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="246" y="146" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[1,5]</text>
  <rect x="306" y="126" width="132" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="372" y="146" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">[5,5]</text>
  <rect x="442" y="126" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="492" y="146" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">10 &gt; 5，j++</text>

  <rect x="18" y="160" width="52" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="44" y="180" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="74" y="160" width="112" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="130" y="180" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[5,10]</text>
  <rect x="190" y="160" width="112" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="246" y="180" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[8,12]</text>
  <rect x="306" y="160" width="132" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="372" y="180" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">[8,10]</text>
  <rect x="442" y="160" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="492" y="180" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">10 &lt; 12，i++</text>

  <rect x="18" y="194" width="52" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="44" y="214" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="74" y="194" width="112" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="130" y="214" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[13,23]</text>
  <rect x="190" y="194" width="112" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="246" y="214" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[8,12]</text>
  <rect x="306" y="194" width="132" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="372" y="214" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">空（13 &gt; 12）</text>
  <rect x="442" y="194" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="492" y="214" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">23 &gt; 12，j++</text>

  <rect x="18" y="228" width="52" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="44" y="248" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="74" y="228" width="112" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="130" y="248" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[13,23]</text>
  <rect x="190" y="228" width="112" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="246" y="248" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[15,24]</text>
  <rect x="306" y="228" width="132" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="372" y="248" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">[15,23]</text>
  <rect x="442" y="228" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="492" y="248" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">23 &lt; 24，i++</text>

  <rect x="18" y="262" width="52" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="44" y="282" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">6</text>
  <rect x="74" y="262" width="112" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="130" y="282" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[24,25]</text>
  <rect x="190" y="262" width="112" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="246" y="282" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[15,24]</text>
  <rect x="306" y="262" width="132" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="372" y="282" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">[24,24]</text>
  <rect x="442" y="262" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="492" y="282" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">25 &gt; 24，j++</text>

  <rect x="18" y="296" width="52" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="44" y="316" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">7</text>
  <rect x="74" y="296" width="112" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="130" y="316" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[24,25]</text>
  <rect x="190" y="296" width="112" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1.1" rx="4" filter="url(#rough2)"/><text x="246" y="316" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[25,26]</text>
  <rect x="306" y="296" width="132" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="372" y="316" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">[25,25]</text>
  <rect x="442" y="296" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/><text x="492" y="316" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">25 &lt; 26，i++</text>

  <text x="18" y="352" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">第 4 步是一次「空交集」：lo = 13 &gt; hi = 12，说明两个当前区间已经错开，只前进不记录。</text>
  <text x="18" y="372" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">[5,5]、[24,24]、[25,25] 都是「单点」交集，闭区间下必须保留（lo ≤ hi 用 ≤ 而不是 &lt;）。</text>
  <text x="18" y="392" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">结果 [[1,2],[5,5],[8,10],[15,23],[24,24],[25,25]]，与题面一致。</text>
</svg>
