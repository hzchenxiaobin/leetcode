<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：渔夫可达范围 = 水格四连通块</text>

  <!-- 4x4 网格，格子 70x52，起点 (70, 56) -->
  <g filter="url(#rough2)" font-size="14">
    <!-- 行 0: 0 2 1 0 -->
    <rect x="70" y="56" width="70" height="52" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="105" y="88" text-anchor="middle" fill="#888">0</text>
    <rect x="140" y="56" width="70" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="175" y="88" text-anchor="middle" fill="#2f4a66">2</text>
    <rect x="210" y="56" width="70" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="245" y="88" text-anchor="middle" fill="#2f4a66">1</text>
    <rect x="280" y="56" width="70" height="52" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="315" y="88" text-anchor="middle" fill="#888">0</text>
    <!-- 行 1: 4 0 0 3 -->
    <rect x="70" y="108" width="70" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="105" y="140" text-anchor="middle" fill="#2f5527">4</text>
    <rect x="140" y="108" width="70" height="52" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="175" y="140" text-anchor="middle" fill="#888">0</text>
    <rect x="210" y="108" width="70" height="52" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="245" y="140" text-anchor="middle" fill="#888">0</text>
    <rect x="280" y="108" width="70" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="315" y="140" text-anchor="middle" fill="#7a5a10">3</text>
    <!-- 行 2: 1 0 0 4 -->
    <rect x="70" y="160" width="70" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="105" y="192" text-anchor="middle" fill="#2f5527">1</text>
    <rect x="140" y="160" width="70" height="52" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="175" y="192" text-anchor="middle" fill="#888">0</text>
    <rect x="210" y="160" width="70" height="52" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="245" y="192" text-anchor="middle" fill="#888">0</text>
    <rect x="280" y="160" width="70" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="315" y="192" text-anchor="middle" fill="#7a5a10">4</text>
    <!-- 行 3: 0 3 2 0 -->
    <rect x="70" y="212" width="70" height="52" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="105" y="244" text-anchor="middle" fill="#888">0</text>
    <rect x="140" y="212" width="70" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="175" y="244" text-anchor="middle" fill="#8c3a36">3</text>
    <rect x="210" y="212" width="70" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="245" y="244" text-anchor="middle" fill="#8c3a36">2</text>
    <rect x="280" y="212" width="70" height="52" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="315" y="244" text-anchor="middle" fill="#888">0</text>
  </g>

  <!-- 图例与块和 -->
  <g filter="url(#rough2)" font-size="12.5">
    <rect x="380" y="60" width="130" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="392" y="82" fill="#2f4a66">蓝块：2+1 = 3</text>
    <rect x="380" y="104" width="130" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="392" y="126" fill="#2f5527">绿块：4+1 = 5</text>
    <rect x="380" y="148" width="130" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="392" y="170" fill="#7a5a10">橙块：3+4 = 7 ★</text>
    <rect x="380" y="192" width="130" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="392" y="214" fill="#8c3a36">红块：3+2 = 5</text>
    <rect x="380" y="236" width="130" height="34" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="392" y="258" fill="#666">灰格：陆地(0)</text>
  </g>

  <text x="70" y="296" font-size="13" fill="#333" filter="url(#rough2)">渔夫从一个水格出发，能走遍且只能走遍该格所在的连通块；</text>
  <text x="70" y="318" font-size="13" fill="#333" filter="url(#rough2)">最优 = 把整块的鱼全部捞光 → 答案 = max{3, 5, 7, 5} = 7。</text>
  <text x="70" y="340" font-size="12" fill="#7a5a10" filter="url(#rough2)">每个格子只属于一个块 → 一次 DFS 恰好汇总一块，全程 O(mn)。</text>
</svg>
