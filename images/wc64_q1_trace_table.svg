<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">走查：nums = [3,6,1,0]</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888">逐元素更新 maxVal / second，遍历结束后只判定一次</text>

  <rect x="60" y="90" width="432" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="88" y="110" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">i</text>
  <text x="148" y="110" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">nums[i]</text>
  <text x="216" y="110" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">x &gt; max ?</text>
  <text x="294" y="110" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">second</text>
  <text x="378" y="110" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">max</text>
  <text x="456" y="110" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">maxIdx</text>

  <g filter="url(#rough2)">
    <rect x="60" y="120" width="432" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="60" y="154" width="432" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="60" y="188" width="432" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="60" y="222" width="432" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>

    <rect x="336" y="120" width="84" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="420" y="120" width="72" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="252" y="154" width="84" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="336" y="154" width="84" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="420" y="154" width="72" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>

    <path d="M 116 120 L 116 256" stroke="#bbb" stroke-width="1.1"/>
    <path d="M 180 120 L 180 256" stroke="#bbb" stroke-width="1.1"/>
    <path d="M 252 120 L 252 256" stroke="#bbb" stroke-width="1.1"/>
    <path d="M 336 120 L 336 256" stroke="#bbb" stroke-width="1.1"/>
    <path d="M 420 120 L 420 256" stroke="#bbb" stroke-width="1.1"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11">
    <text x="88" y="142" fill="#555">0</text>
    <text x="148" y="142" fill="#555">3</text>
    <text x="216" y="142" fill="#4a7a3a">是</text>
    <text x="294" y="142" fill="#999">−1</text>
    <text x="378" y="142" fill="#b8830f">3</text>
    <text x="456" y="142" fill="#b8830f">0</text>

    <text x="88" y="176" fill="#555">1</text>
    <text x="148" y="176" fill="#555">6</text>
    <text x="216" y="176" fill="#4a7a3a">是</text>
    <text x="294" y="176" fill="#446688">3</text>
    <text x="378" y="176" fill="#b8830f">6</text>
    <text x="456" y="176" fill="#b8830f">1</text>

    <text x="88" y="210" fill="#555">2</text>
    <text x="148" y="210" fill="#555">1</text>
    <text x="216" y="210" fill="#b85450">否</text>
    <text x="294" y="210" fill="#555">3</text>
    <text x="378" y="210" fill="#555">6</text>
    <text x="456" y="210" fill="#555">1</text>

    <text x="88" y="244" fill="#555">3</text>
    <text x="148" y="244" fill="#555">0</text>
    <text x="216" y="244" fill="#b85450">否</text>
    <text x="294" y="244" fill="#555">3</text>
    <text x="378" y="244" fill="#555">6</text>
    <text x="456" y="244" fill="#555">1</text>
  </g>

  <rect x="60" y="276" width="432" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="76" y="298" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">判定：6 ≥ 2 × second = 6 ✓（正好「至少两倍」）</text>
  <text x="76" y="318" font-size="10.5" fill="#555" filter="url(#rough2)">最大值唯一，返回它的下标 1；若是 [1,2,3,4] 则 second = 3、max = 4，4 &lt; 6 → −1</text>

  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意第 1 行：6 刷新 maxVal 时，旧的 3 正好落在 second 上</text>
</svg>
