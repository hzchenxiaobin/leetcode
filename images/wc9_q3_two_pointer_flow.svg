<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">滑动窗口流程：右指针扩张，左指针只在超标时收缩</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个下标最多被纳入一次、移出一次 ⇒ 线性扫描</text>

  <rect x="150" y="60" width="260" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="81" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">右指针 r 右移一格，把 s[r] 纳入窗口</text>

  <path d="M 280 94 L 280 116" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="118" width="220" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">cnt[s[r]] += 1，更新 maxf</text>

  <path d="M 280 150 L 280 168" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,170 386,206 280,242 174,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="203" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">len − maxf &gt; k ?</text>
  <text x="280" y="219" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">窗口内需要替换的字符数</text>

  <path d="M 174 206 L 132 206" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="198" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="24" y="188" width="104" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="203" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">l 右移一格</text>
  <text x="76" y="217" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">cnt[s[l]] −= 1</text>

  <path d="M 76 188 L 76 77 L 146 77" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="84" y="150" font-size="9.5" fill="#b85450" filter="url(#rough2)">收缩后再判一次</text>

  <path d="M 280 242 L 280 264" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="258" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="150" y="266" width="260" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="283" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">ans = max(ans, r − l + 1)</text>
  <text x="280" y="298" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">此时窗口是「以 r 结尾」的最长可行窗口</text>

  <path d="M 280 304 L 280 322" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="324" width="380" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="343" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">r 未到 n − 1 继续循环；否则返回 ans</text>

  <text x="280" y="376" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">时间 O(26n)，空间 O(1)；26 为字母表大小，可视为常数</text>
</svg>
