<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">整体流程：常数时间三步走</text>

  <!-- 步骤 1 -->
  <rect x="160" y="52" width="240" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 排序 sides，得 a ≤ b ≤ c</text>

  <line x1="280" y1="96" x2="280" y2="116" stroke="#999" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,120 420,170 280,220 140,170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5c1e" filter="url(#rough2)">a + b &gt; c ?</text>

  <!-- 否分支 -->
  <line x1="420" y1="170" x2="450" y2="170" stroke="#999" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="434" y="158" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="455" y="140" width="93" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="501" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 []</text>
  <text x="501" y="186" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">面积 0（退化）</text>

  <!-- 是分支 -->
  <line x1="280" y1="220" x2="280" y2="240" stroke="#999" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="236" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 步骤 2 -->
  <rect x="130" y="244" width="300" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 余弦定理算 cos A、cos B、cos C</text>

  <line x1="280" y1="288" x2="280" y2="308" stroke="#999" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="130" y="312" width="300" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="339" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ acos → 弧度 → ×180/π 转成度</text>

  <line x1="280" y1="356" x2="280" y2="376" stroke="#999" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 4 -->
  <rect x="130" y="380" width="300" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="405" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">④ 非递减排序，返回 [A, B, C]</text>

  <!-- 右侧注释：大边对大角 -->
  <rect x="438" y="252" width="114" height="104" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="495" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5c1e" filter="url(#rough2)">大边对大角</text>
  <text x="495" y="296" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">a ≤ b ≤ c</text>
  <text x="495" y="316" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">⇒ A ≤ B ≤ C</text>
  <text x="495" y="336" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">第④步排序只是保险</text>
</svg>
