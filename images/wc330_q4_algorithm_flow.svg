<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：外层 k 从右向左扫，入池 + 标量 cnt 增量维护（O(n²) / O(n)）</text>

  <!-- ====== invariant box (top right) ====== -->
  <rect x="320" y="44" width="212" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="426" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">不变量（处理当前 k 时）</text>
  <text x="426" y="78" text-anchor="middle" font-size="9.5" fill="#333">rightGreater[v] = #{ l &gt; k : nums[l] &gt; v }</text>
  <text x="426" y="94" text-anchor="middle" font-size="9.5" fill="#333">cnt = #{ i &lt; j : nums[i] &lt; nums[k] }</text>
  <text x="426" y="114" text-anchor="middle" font-size="9" fill="#555">阈值 nums[k] 在内层固定，</text>
  <text x="426" y="126" text-anchor="middle" font-size="9" fill="#555">所以 cnt 只需一个标量即可增量</text>

  <!-- ====== main flow ====== -->
  <rect x="45" y="44" width="230" height="26" fill="#ffffff" stroke="#888" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="160" y="61" text-anchor="middle" font-size="10.5" fill="#333">初始化：rightGreater[v] = 0，ans = 0</text>

  <path d="M 160 70 L 160 86" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

  <rect x="45" y="88" width="230" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="106" text-anchor="middle" font-size="10.5" fill="#333">外层：k = n−2 递减到 2</text>

  <path d="M 160 116 L 160 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

  <rect x="45" y="134" width="230" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="150" text-anchor="middle" font-size="10" fill="#8a6510" font-weight="bold">入池：位置 k+1 进入右侧</text>
  <text x="160" y="164" text-anchor="middle" font-size="9.5" fill="#8a6510">v &lt; nums[k+1] 的 rightGreater[v] 全部 +1</text>

  <path d="M 160 170 L 160 184" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

  <rect x="45" y="186" width="230" height="26" fill="#ffffff" stroke="#888" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="203" text-anchor="middle" font-size="10.5" fill="#333">cnt = [ nums[0] &lt; nums[k] ]（i=0 预折入）</text>

  <path d="M 160 212 L 160 226" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

  <rect x="45" y="228" width="230" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="246" text-anchor="middle" font-size="10.5" fill="#333">内层：j = 1 递增到 k−1</text>

  <path d="M 160 256 L 160 272" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

  <!-- decision 1 -->
  <polygon points="160,274 225,306 160,338 95,306" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="302" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">nums[j] &gt;</text>
  <text x="160" y="316" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">nums[k] ?</text>

  <path d="M 225 306 L 300 306" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>
  <text x="252" y="299" text-anchor="middle" font-size="9" fill="#b85450">是</text>

  <rect x="302" y="291" width="230" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="417" y="310" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">ans += cnt × rightGreater[nums[j]]</text>

  <path d="M 160 338 L 160 352" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>
  <text x="172" y="350" font-size="9" fill="#555">否</text>

  <!-- decision 2 -->
  <polygon points="160,354 225,384 160,414 95,384" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="381" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">nums[j] &lt;</text>
  <text x="160" y="394" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">nums[k] ?</text>

  <path d="M 225 384 L 300 384" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)"/>
  <text x="252" y="377" text-anchor="middle" font-size="9" fill="#4a7a3a">是</text>

  <rect x="302" y="369" width="230" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="417" y="388" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">cnt += 1（nums[j] 成为候选 i）</text>

  <path d="M 160 414 L 160 428" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>
  <text x="176" y="425" font-size="9" fill="#555">否（=，跳过）</text>

  <rect x="45" y="430" width="230" height="26" fill="#ffffff" stroke="#888" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="160" y="447" text-anchor="middle" font-size="10" fill="#333">下一个 j；j 扫完则 k−1，最后返回 ans</text>

  <!-- loop back edge -->
  <path d="M 45 443 L 24 443 L 24 242 L 43 242" stroke="#999" stroke-width="1.4" stroke-dasharray="5,3" fill="none" filter="url(#rough2)" marker-end="url(#arrB)"/>

  <!-- ====== complexity strip ====== -->
  <rect x="30" y="446" width="0" height="0" fill="none"/>
  <text x="426" y="440" text-anchor="middle" font-size="9.5" fill="#555">时间 O(n²)：入池总量 n(n+1)/2 ≈ n²/2，</text>
  <text x="426" y="454" text-anchor="middle" font-size="9.5" fill="#555">内层总量 Σ(k−1) ≈ n²/2；空间 O(n)</text>
</svg>
