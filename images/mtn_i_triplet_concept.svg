<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">山形三元组：i &lt; j &lt; k，两头都比 nums[j] 矮</text>
  <path d="M 140 42 Q 320 52 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array nums = [8,6,1,5,3] -->
  <g font-size="14" text-anchor="middle">
    <g filter="url(#sk)">
      <rect x="90" y="100" width="52" height="42" rx="5" fill="#f4f4f0" stroke="#999" stroke-width="1.3"/>
      <rect x="142" y="100" width="52" height="42" rx="5" fill="#f4f4f0" stroke="#999" stroke-width="1.3"/>
      <rect x="194" y="100" width="52" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
      <rect x="246" y="100" width="52" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
      <rect x="298" y="100" width="52" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    </g>
    <text x="116" y="127" fill="#666" filter="url(#sk)">8</text>
    <text x="168" y="127" fill="#666" filter="url(#sk)">6</text>
    <text x="220" y="127" fill="#446688" font-weight="bold" filter="url(#sk)">1</text>
    <text x="272" y="127" fill="#a06a10" font-weight="bold" font-size="16" filter="url(#sk)">5</text>
    <text x="324" y="127" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">3</text>
  </g>
  <!-- indices -->
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="116" y="158" filter="url(#sk)">0</text>
    <text x="168" y="158" filter="url(#sk)">1</text>
    <text x="220" y="158" filter="url(#sk)">2</text>
    <text x="272" y="158" filter="url(#sk)">3</text>
    <text x="324" y="158" filter="url(#sk)">4</text>
  </g>
  <!-- i j k labels -->
  <g font-size="15" font-weight="bold" text-anchor="middle">
    <text x="220" y="88" fill="#446688" filter="url(#sk)">i</text>
    <text x="272" y="86" fill="#b85450" font-size="17" filter="url(#sk)">j ← 山峰</text>
    <text x="324" y="88" fill="#4a7a3a" filter="url(#sk)">k</text>
  </g>
  <!-- mountain polyline over 2,3,4 -->
  <path d="M 220 100 L 272 74 L 324 100" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 4" filter="url(#sk)"/>
  <!-- arrows: sides lower than peak -->
  <path d="M 222 112 Q 240 104 258 106" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 322 112 Q 304 104 286 106" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- conditions box -->
  <g filter="url(#sk)">
    <rect x="400" y="92" width="216" height="66" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g font-size="12" fill="#2b6e9e">
    <text x="416" y="114" filter="url(#sk)">i &lt; j &lt; k</text>
    <text x="416" y="132" filter="url(#sk)">nums[i] &lt; nums[j]</text>
    <text x="416" y="150" filter="url(#sk)">nums[k] &lt; nums[j]</text>
  </g>

  <!-- sum callout -->
  <g filter="url(#sk)">
    <rect x="90" y="190" width="300" height="44" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="240" y="218" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold" filter="url(#sk)">最优和 = nums[2]+nums[3]+nums[4] = 1+5+3 = 9 ✓</text>

  <!-- counter example: valley -->
  <text x="320" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">反例：先降后升的「山谷」—— 一座山都没有，返回 −1</text>
  <g font-size="12" text-anchor="middle">
    <g filter="url(#sk)">
      <rect x="120" y="282" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
      <rect x="160" y="282" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
      <rect x="200" y="282" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
      <rect x="240" y="282" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
      <rect x="280" y="282" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
      <rect x="320" y="282" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    </g>
    <text x="140" y="303" fill="#b85450" filter="url(#sk)">6</text>
    <text x="180" y="303" fill="#b85450" filter="url(#sk)">5</text>
    <text x="220" y="303" fill="#b85450" filter="url(#sk)">4</text>
    <text x="260" y="303" fill="#b85450" filter="url(#sk)">3</text>
    <text x="300" y="303" fill="#b85450" filter="url(#sk)">4</text>
    <text x="340" y="303" fill="#b85450" filter="url(#sk)">5</text>
  </g>
  <path d="M 122 314 Q 240 336 398 314" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="440" y="303" font-size="13" fill="#b85450" font-weight="bold" filter="url(#sk)">→ ans = −1</text>
</svg>
