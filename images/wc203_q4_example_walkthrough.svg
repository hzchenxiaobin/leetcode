<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="680" height="500" fill="#fafafa"/>
  <text x="340" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：stoneValue = [6,2,3,4,5,5]，最优打法 → 18</text>
  <path d="M 150 34 Q 340 42 530 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== 第 1 轮 ===== -->
  <text x="52" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#rough2)">第 1 轮</text>
  <text x="52" y="102" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6 块</text>

  <g filter="url(#rough2)">
    <rect x="150" y="60" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="196" y="60" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="242" y="60" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="300" y="60" width="42" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="346" y="60" width="42" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="392" y="60" width="42" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="171" y="84" fill="#2e6e2e">6</text>
    <text x="217" y="84" fill="#2e6e2e">2</text>
    <text x="263" y="84" fill="#2e6e2e">3</text>
    <text x="321" y="84" fill="#b85450">4</text>
    <text x="367" y="84" fill="#b85450">5</text>
    <text x="413" y="84" fill="#b85450">5</text>
  </g>
  <path d="M 288 54 L 296 106" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 298 66 L 438 94" stroke="#b85450" stroke-width="2.2" fill="none" opacity="0.85" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="196" y="112" width="100" height="22" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="322" y="112" width="100" height="22" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="246" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">和 11 ✓ 留</text>
  <text x="372" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">和 14 ✗ 丢</text>

  <text x="530" y="82" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">+11</text>
  <text x="530" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">累计 = 11</text>
  <text x="616" y="82" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">切 [6,2,3]</text>
  <text x="616" y="97" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">| [4,5,5]</text>

  <path d="M 300 142 Q 250 160 200 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#rough2)"/>
  <text x="258" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">保留的左行 [6,2,3] 进入下一轮</text>

  <!-- ===== 第 2 轮 ===== -->
  <text x="52" y="208" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#rough2)">第 2 轮</text>
  <text x="52" y="224" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3 块</text>

  <g filter="url(#rough2)">
    <rect x="190" y="182" width="42" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="286" y="182" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="332" y="182" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="211" y="206" fill="#b85450">6</text>
    <text x="307" y="206" fill="#2e6e2e">2</text>
    <text x="353" y="206" fill="#2e6e2e">3</text>
  </g>
  <path d="M 246 176 L 268 228" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 186 214 L 236 190" stroke="#b85450" stroke-width="2.2" fill="none" opacity="0.85" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="161" y="234" width="100" height="22" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="283" y="234" width="100" height="22" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="211" y="249" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">和 6 ✗ 丢</text>
  <text x="333" y="249" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">和 5 ✓ 留</text>

  <text x="530" y="204" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">+5</text>
  <text x="530" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">累计 = 16</text>
  <text x="616" y="204" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">切 [6]</text>
  <text x="616" y="219" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">| [2,3]</text>

  <path d="M 330 264 Q 300 282 270 294" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#rough2)"/>
  <text x="300" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">保留的右行 [2,3] 进入下一轮</text>

  <!-- ===== 第 3 轮 ===== -->
  <text x="52" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#rough2)">第 3 轮</text>
  <text x="52" y="346" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2 块</text>

  <g filter="url(#rough2)">
    <rect x="240" y="304" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="330" y="304" width="42" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="261" y="328" fill="#2e6e2e">2</text>
    <text x="351" y="328" fill="#b85450">3</text>
  </g>
  <path d="M 308 298 L 312 350" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 326 338 L 376 310" stroke="#b85450" stroke-width="2.2" fill="none" opacity="0.85" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="211" y="356" width="100" height="22" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="301" y="356" width="100" height="22" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="261" y="371" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">和 2 ✓ 留</text>
  <text x="351" y="371" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">和 3 ✗ 丢</text>

  <text x="530" y="326" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">+2</text>
  <text x="530" y="346" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">累计 = 18</text>
  <text x="616" y="326" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">切 [2]</text>
  <text x="616" y="341" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">| [3]</text>

  <text x="300" y="398" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">只剩单块 [2]，游戏结束</text>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="20" y="414" width="640" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="340" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">答案 = 11 + 5 + 2 = 18</text>
  <text x="340" y="458" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">「保留和小的一边」是 Bob 强制的；Alice 的自由度只在选切分点（及平局时选保留哪边）</text>
  <text x="340" y="474" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">行和 25 → 11 → 5 → 2，每轮（近似）减半 —— 轮数只有 O(log n)，得分 &lt; 初始总和</text>
</svg>
