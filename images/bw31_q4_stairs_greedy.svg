<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">贪心：只数「正台阶」，答案 = Σ max(0, h[i] − h[i−1])</text>

  <!-- 左：折线图 -->
  <g filter="url(#rough2)" stroke="#b0b0b0" stroke-width="1">
    <line x1="70" y1="300" x2="330" y2="300"/>
    <line x1="70" y1="300" x2="70" y2="80"/>
  </g>
  <!-- 台阶折线 target = [1,2,3,2,1] -->
  <path d="M 70 300 L 70 290 L 118 290 L 118 275 L 166 275 L 166 260 L 214 260 L 214 275 L 262 275 L 262 290 L 310 290 L 310 300"
        fill="none" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <!-- 三次覆盖块：全局层、中层、顶层 -->
  <g filter="url(#rough2)">
    <rect x="70" y="290" width="240" height="10" fill="#e8f0fe" stroke="none" opacity="0.9"/>
    <rect x="118" y="275" width="96" height="15" fill="#e6f4ea" stroke="none" opacity="0.9"/>
    <rect x="166" y="260" width="0" height="15" fill="#fce4ec" stroke="none"/>
    <rect x="166" y="260" width="1" height="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="190" y="286" fill="#2d5a22">第 1 次操作覆盖全段</text>
    <text x="166" y="269" fill="#b85450">第 3 次只盖峰顶</text>
  </g>
  <text x="200" y="330" font-size="13" fill="#446688" filter="url(#rough2)" text-anchor="middle">target = [1, 2, 3, 2, 1] → 3 次操作</text>

  <!-- 右：差分视角 -->
  <text x="440" y="66" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">差分只看「上台阶」</text>
  <g filter="url(#rough2)">
    <rect x="380" y="80" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="380" y="114" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="380" y="148" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="380" y="182" width="120" height="30" fill="#f2f2f2" stroke="#999" stroke-width="1.5" rx="4"/>
    <rect x="380" y="216" width="120" height="30" fill="#f2f2f2" stroke="#999" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="440" y="100">1−0 = 1 ✔</text>
    <text x="440" y="134">2−1 = 1 ✔</text>
    <text x="440" y="168">3−2 = 1 ✔</text>
    <text x="440" y="202">2−3 &lt; 0 ✘</text>
    <text x="440" y="236">1−2 &lt; 0 ✘</text>
  </g>
  <path d="M 330 150 C 352 150, 360 110, 378 100" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="330" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="353" font-size="13" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">下坡与平台不花次数：新层只从「抬高」处开始</text>
</svg>
