<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8a6015"/>
    </marker>
  </defs>

  <rect width="720" height="404" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：一步只能把 {m−1, m, m+1} 变成 {m, m, m}</text>
  <path d="M 92 42 Q 360 49 628 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 移动前 -->
  <text x="150" y="120" text-anchor="end" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">移动前</text>
  <rect x="172" y="90" width="96" height="50" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">m−1</text>
  <rect x="288" y="90" width="96" height="50" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="336" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">m</text>
  <rect x="404" y="90" width="96" height="50" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="452" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">m+1</text>

  <text x="220" y="80" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">a（最少，收 1 颗）</text>
  <text x="336" y="80" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">b（不动）</text>
  <text x="452" y="80" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">c（最多，出 1 颗）</text>

  <!-- 箭头 -->
  <path d="M 220 146 L 220 214" stroke="#8a6015" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 336 146 L 336 214" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 452 146 L 452 214" stroke="#8a6015" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="186" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">＋1</text>
  <text x="348" y="186" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">保持 m</text>
  <text x="464" y="186" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">−1</text>

  <!-- 移动后 -->
  <text x="150" y="246" text-anchor="end" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">移动后</text>
  <rect x="172" y="220" width="96" height="50" rx="5" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="252" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">m</text>
  <rect x="288" y="220" width="96" height="50" rx="5" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="336" y="252" text-anchor="middle" font-size="18" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">m</text>
  <rect x="404" y="220" width="96" height="50" rx="5" fill="#fafafa" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="452" y="252" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">m</text>

  <rect x="30" y="296" width="660" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">反过来读：终态三堆都等于 m = (a+b+c)/3，于是步前的三堆被唯一确定</text>
  <text x="360" y="348" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">a ≤ b ≤ c 排序后只能是 a = m−1、b = m、c = m+1，即两个相邻差都为 1</text>
  <text x="360" y="372" text-anchor="middle" font-size="12" fill="#a3762a" filter="url(#rough2)">推论：总和必须被 3 整除（移动不改变总和），且 c − a = 2</text>
</svg>
