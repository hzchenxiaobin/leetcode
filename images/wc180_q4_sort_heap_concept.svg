<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：按效率降序扫描，小顶堆维护「速度 top-k」</text>

  <!-- 排序说明 -->
  <text x="320" y="56" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">工程师已按效率 e 降序排序 —— 扫描到谁，谁就是已见者中的最低效率</text>

  <!-- 候选池虚线框（盖住前 4 张卡） -->
  <rect x="46" y="66" width="332" height="66" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="7,5" filter="url(#rough2)"/>

  <!-- 6 张工程师卡片：e=9..2 -->
  <rect x="54" y="74" width="72" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">e=9</text>
  <text x="90" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">s=1</text>

  <rect x="136" y="74" width="72" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="172" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">e=7</text>
  <text x="172" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">s=5</text>

  <rect x="218" y="74" width="72" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="254" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">e=5</text>
  <text x="254" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">s=2</text>

  <rect x="300" y="74" width="72" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="336" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">e=4</text>
  <text x="336" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">s=10</text>

  <rect x="382" y="74" width="72" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="418" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">e=3</text>
  <text x="418" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">s=3</text>

  <rect x="464" y="74" width="72" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">e=2</text>
  <text x="500" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">s=8</text>

  <!-- 候选池标签 + 扫描箭头 -->
  <text x="62" y="160" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">虚线框 = 效率 ≥ e_i 的候选池（前缀）</text>
  <path d="M 336,140 L 336,168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="160" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">当前 i（e_i = 4）</text>

  <!-- 左：小顶堆 -->
  <text x="165" y="198" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">小顶堆（存速度，至多 k 个）</text>
  <line x1="164" y1="244" x2="211" y2="278" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="150" cy="234" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="239" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>
  <circle cx="225" cy="288" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="293" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">10</text>
  <text x="40" y="230" font-size="10.5" fill="#b85450" filter="url(#rough2)">堆顶 = 最小速度</text>
  <text x="40" y="246" font-size="10.5" fill="#b85450" filter="url(#rough2)">超员（&gt; k）先踢它</text>
  <text x="187" y="322" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">此刻堆 = {5, 10}（k = 2，第 4 步）</text>

  <!-- 右：公式框 -->
  <rect x="330" y="192" width="278" height="132" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="346" y="218" font-size="12" fill="#8a6d1f" filter="url(#rough2)">效率下界：e_i = 4（排序白送）</text>
  <text x="346" y="242" font-size="12" fill="#8a6d1f" filter="url(#rough2)">速度和：sum = 5 + 10 = 15</text>
  <text x="346" y="266" font-size="12" fill="#8a6d1f" filter="url(#rough2)">候选表现值 = sum × e_i</text>
  <text x="346" y="294" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">= 15 × 4 = 60 → 刷新 ans</text>
  <text x="346" y="314" font-size="10" fill="#888" filter="url(#rough2)">（示例 1 的最优解恰在此步出现）</text>

  <!-- 底部要点框 -->
  <rect x="60" y="344" width="520" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="368" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">「固定效率下界，最大化速度和」：排序把求 min(效率) 变成已知量</text>
  <text x="320" y="390" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">每步只答一问：效率 ≥ e_i 的至多 k 人中，速度和最大是多少？</text>
  <text x="320" y="408" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">答案 = 前缀速度 top-k 之和，小顶堆超员踢堆顶即可增量维护</text>
</svg>
