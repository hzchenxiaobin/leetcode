<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">观察一：任何方案 ⇔ 规范形（反转 → 交换 → 替换）</text>

  <!-- 三种操作卡 -->
  <rect x="36" y="44" width="152" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="112" y="66" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">替换：a → d</text>
  <text x="112" y="88" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">每个下标至多替换 1 次</text>

  <rect x="204" y="44" width="152" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">交换：ab ⇄ ba</text>
  <text x="280" y="88" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">每个下标至多参与 1 次交换</text>

  <rect x="372" y="44" width="152" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="448" y="66" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">反转：abc → cba</text>
  <text x="448" y="88" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">动用全部下标 ⇒ 至多 1 次</text>

  <!-- 规范形流水线 -->
  <rect x="24" y="166" width="72" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="60" y="194" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">子串 s</text>

  <polygon points="150,162 196,190 150,218 104,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="187" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">反转?</text>
  <text x="150" y="202" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">+1 / 跳过</text>

  <rect x="216" y="166" width="120" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="276" y="186" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">不相交交换</text>
  <text x="276" y="203" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">匹配：无公共下标</text>

  <rect x="368" y="166" width="120" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="428" y="186" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">逐点替换</text>
  <text x="428" y="203" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">恰 = 错配数</text>

  <rect x="520" y="166" width="28" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="534" y="194" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">t</text>

  <path d="M 96 189 L 102 190" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 196 190 L 214 190" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 336 190 L 366 190" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 488 190 L 518 190" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 流水线下注释 -->
  <text x="150" y="238" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第二次反转 ⇒ 每 下标参与 2 次，非法</text>
  <text x="276" y="238" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">A↔B 后 B↔C 的接力被禁止</text>
  <text x="428" y="238" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">一次替换可改成任意字母</text>

  <!-- 为什么顺序无关 -->
  <rect x="36" y="256" width="488" height="60" fill="#f0f4fa" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么操作顺序无关？</text>
  <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">反转与交换/替换可换序（下标按镜像重映射），交换与替换同理；</text>
  <text x="280" y="310" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">重排是下标双射 ⇒ 「每下标每类 ≤ 1 次」保持，操作数不变</text>

  <!-- 成本公式 -->
  <rect x="36" y="330" width="488" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">段成本 = [反转 1 次] + #交换 + #剩余错配（替换）</text>
  <text x="280" y="371" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">反转/交换只搬字母，替换负责改写 ⇒ 固定前两者后替换数被迫确定</text>
</svg>
