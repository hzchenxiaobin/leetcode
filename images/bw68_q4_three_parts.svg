<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="173"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">缩写三块拼图：C、suf、pre 各算各的</text>

  <!-- 中央大数 -->
  <ellipse cx="260" cy="118" rx="150" ry="52" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="13.5" fill="#2b3d52" filter="url(#rough2)">P = left × (left+1) × … × right</text>
  <text x="260" y="132" text-anchor="middle" font-size="11.5" fill="#6b7f96" filter="url(#rough2)">位数可达 4 万+，不必乘出来</text>

  <!-- 箭头 ×3 -->
  <path d="M 130 165 C 105 190, 95 205, 88 222" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 260 172 C 260 192, 260 202, 260 218" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG2)" filter="url(#rough2)"/>
  <path d="M 390 165 C 415 190, 425 205, 432 222" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 三块 -->
  <rect x="20" y="226" width="150" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="95" y="248" text-anchor="middle" font-size="12.5" fill="#8a6d1a" filter="url(#rough2)">① 尾零 C</text>
  <text x="95" y="270" text-anchor="middle" font-size="11" fill="#6b5215" filter="url(#rough2)">C = min(v₂(P), v₅(P))</text>
  <text x="95" y="288" text-anchor="middle" font-size="11" fill="#6b5215" filter="url(#rough2)">逐数剥离因子 2 / 5 计数</text>
  <text x="95" y="305" text-anchor="middle" font-size="11" fill="#6b5215" filter="url(#rough2)">→ 输出 "eC"</text>

  <rect x="185" y="226" width="150" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">② 后五位 suf</text>
  <text x="260" y="270" text-anchor="middle" font-size="11" fill="#4a6a3c" filter="url(#rough2)">剥掉 C 个 2 和 C 个 5</text>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#4a6a3c" filter="url(#rough2)">连乘模 10¹³（= M 整串）</text>
  <text x="260" y="305" text-anchor="middle" font-size="11" fill="#4a6a3c" filter="url(#rough2)">→ mod 10⁵ 补零到 5 位</text>

  <rect x="350" y="226" width="150" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="425" y="248" text-anchor="middle" font-size="12.5" fill="#2b3d52" filter="url(#rough2)">③ 前五位 pre + 位数</text>
  <text x="425" y="270" text-anchor="middle" font-size="11" fill="#4a6a90" filter="url(#rough2)">logM = Σlog₁₀i − C</text>
  <text x="425" y="288" text-anchor="middle" font-size="11" fill="#4a6a90" filter="url(#rough2)">pre = ⌊10^(frac+4)⌋</text>
  <text x="425" y="305" text-anchor="middle" font-size="11" fill="#4a6a90" filter="url(#rough2)">d = ⌊logM⌋+1</text>

  <!-- 拼装 -->
  <rect x="90" y="330" width="340" height="24" fill="#fafafa" filter="url(#rough2)"/>
  <text x="260" y="347" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">拼装："pre…suf eC"（d ≤ 10 时直接整串）</text>
</svg>
