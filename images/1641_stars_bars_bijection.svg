<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">换视角：非降串 ↔ 五桶分球，隔板法一步到闭式</text>
  <path d="M 170 38 Q 340 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="312" y="58" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">长度 n = 5 的非降串（重复合法）</text>

  <g filter="url(#sk)">
    <rect x="177" y="66" width="46" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="233" y="66" width="46" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="289" y="66" width="46" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="345" y="66" width="46" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="401" y="66" width="46" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="19" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="200" y="94" fill="#2b4a66">a</text>
    <text x="256" y="94" fill="#2b4a66">a</text>
    <text x="312" y="94" fill="#2b4a66">i</text>
    <text x="368" y="94" fill="#2b4a66">o</text>
    <text x="424" y="94" fill="#2b4a66">u</text>
  </g>

  <g filter="url(#sk)">
    <path d="M 312 112 L 312 134" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="324" y="130" font-size="10.5" fill="#666" filter="url(#sk)">数一数每种元音的个数（顺序已被非降锁死）</text>

  <g filter="url(#sk)">
    <rect x="177" y="140" width="46" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="233" y="140" width="46" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="289" y="140" width="46" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="345" y="140" width="46" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="401" y="140" width="46" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="200" y="156" font-size="10" fill="#4a7a3a">a</text>
    <text x="256" y="156" font-size="10" fill="#4a7a3a">e</text>
    <text x="312" y="156" font-size="10" fill="#4a7a3a">i</text>
    <text x="368" y="156" font-size="10" fill="#4a7a3a">o</text>
    <text x="424" y="156" font-size="10" fill="#4a7a3a">u</text>
    <text x="200" y="176" font-size="15" font-weight="bold" fill="#3a5a3a">2</text>
    <text x="256" y="176" font-size="15" font-weight="bold" fill="#3a5a3a">0</text>
    <text x="312" y="176" font-size="15" font-weight="bold" fill="#3a5a3a">1</text>
    <text x="368" y="176" font-size="15" font-weight="bold" fill="#3a5a3a">1</text>
    <text x="424" y="176" font-size="15" font-weight="bold" fill="#3a5a3a">1</text>
  </g>

  <g filter="url(#sk)">
    <path d="M 312 186 L 312 208" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="324" y="204" font-size="10.5" fill="#666" filter="url(#sk)">n 个相同的 ★ 分给 5 个有序桶</text>

  <g filter="url(#sk)">
    <rect x="62" y="214" width="96" height="92" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="170" y="214" width="96" height="92" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="278" y="214" width="96" height="92" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="386" y="214" width="96" height="92" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="494" y="214" width="96" height="92" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">
    <text x="110" y="234">a</text>
    <text x="218" y="234">e</text>
    <text x="326" y="234">i</text>
    <text x="434" y="234">o</text>
    <text x="542" y="234">u</text>
  </g>
  <g text-anchor="middle" font-size="20" fill="#d6a040" filter="url(#sk)">
    <text x="110" y="264">★</text>
    <text x="110" y="290">★</text>
    <text x="326" y="278">★</text>
    <text x="434" y="278">★</text>
    <text x="542" y="278">★</text>
  </g>
  <text x="218" y="280" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#sk)">（空）</text>

  <g filter="url(#sk)">
    <rect x="160" y="210" width="9" height="100" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="268" y="210" width="9" height="100" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="376" y="210" width="9" height="100" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="484" y="210" width="9" height="100" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="164.5" y="328" text-anchor="middle" font-size="9.5" fill="#b07818" filter="url(#sk)">隔板</text>

  <text x="340" y="338" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">n 个 ★ 排成一行、插入 4 块隔板切成 5 段：n+4 个位置里挑 4 个放隔板，方案数 = C(n+4, 4)</text>

  <g filter="url(#sk)">
    <rect x="40" y="352" width="310" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="195" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a3a" filter="url(#sk)">为什么是双射：非降锁死顺序，</text>
  <text x="195" y="394" text-anchor="middle" font-size="11" fill="#3a5a3a" filter="url(#sk)">计数向量 (2,0,1,1,1) 唯一对应 "aaiou"；若允许任意顺序可排 5! 种</text>

  <g filter="url(#sk)">
    <rect x="370" y="352" width="270" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="505" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">与 DP 殊途同归（曲棍球恒等式）：</text>
  <text x="505" y="394" text-anchor="middle" font-size="11" fill="#2b4a66" filter="url(#sk)">ans = Σ C(n−1+j, j) = C(n+4, 4)</text>
</svg>
