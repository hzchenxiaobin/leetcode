<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>
  <text x="310" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">候选 + 二分验证：全程 O(log n)</text>

  <!-- 候选框 -->
  <rect x="140" y="56" width="340" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">取候选 x ∈ { arr[⌊n/4⌋], arr[⌊n/2⌋], arr[⌊3n/4⌋] }</text>
  <text x="310" y="100" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">答案必在其中（连续块跨四分点）</text>

  <line x1="310" y1="112" x2="310" y2="140" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 二分 lo -->
  <rect x="160" y="142" width="300" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="163" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">二分 ①：第一个 ≥ x 的位置 lo</text>
  <text x="310" y="182" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">(lower_bound，即 x 的首次出现)</text>

  <line x1="310" y1="192" x2="310" y2="220" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 二分 hi -->
  <rect x="160" y="222" width="300" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="243" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">二分 ②：第一个 &gt; x 的位置 hi</text>
  <text x="310" y="262" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">(upper_bound)</text>

  <line x1="310" y1="272" x2="310" y2="300" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 次数 -->
  <rect x="200" y="302" width="220" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="328" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">出现次数 m = hi − lo</text>

  <line x1="310" y1="344" x2="310" y2="368" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 -->
  <polygon points="310,370 420,400 310,430 200,400" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="396" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4m &gt; n ?</text>
  <text x="310" y="414" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">整数运算等价于 m &gt; n/4</text>

  <!-- 侧面出口 -->
  <line x1="420" y1="400" x2="470" y2="400" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="390" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="472" y="378" width="130" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="537" y="396" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 x</text>
  <text x="537" y="414" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">唯一答案 ✓</text>

  <line x1="200" y1="400" x2="150" y2="400" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="390" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="26" y="378" width="122" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="87" y="396" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">试下一个候选</text>
  <text x="87" y="414" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(题目保证必有一个通过)</text>

  <text x="20" y="70" font-size="12" fill="#666" filter="url(#rough2)">哈希计数是 O(n)；</text>
  <text x="20" y="88" font-size="12" fill="#666" filter="url(#rough2)">这套流程把有序性</text>
  <text x="20" y="106" font-size="12" fill="#666" filter="url(#rough2)">兑换成 O(log n)。</text>
</svg>
