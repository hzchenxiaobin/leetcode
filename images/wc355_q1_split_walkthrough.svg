<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="800" height="510" fill="#fdfcf7"/>
  <text x="400" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：words = ["a.b..c", ".x", "d."]，separator = "."</text>
  <path d="M 190 42 Q 400 50 610 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header row : scanning word "a.b..c" -->
  <g filter="url(#sk)">
    <rect x="40" y="58" width="46" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="86" y="58" width="54" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="140" y="58" width="100" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="240" y="58" width="140" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="380" y="58" width="200" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="580" y="58" width="180" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">
    <text x="63" y="80" text-anchor="middle">j</text>
    <text x="113" y="80" text-anchor="middle">c</text>
    <text x="190" y="80" text-anchor="middle">c = '.' ?</text>
    <text x="310" y="80" text-anchor="middle">cur（冲刷后）</text>
    <text x="480" y="80" text-anchor="middle">ans</text>
    <text x="670" y="80" text-anchor="middle">说明</text>
  </g>
  <text x="672" y="45" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#sk)">以 word = "a.b..c" 为例逐字符走查</text>

  <!-- row 0 -->
  <g filter="url(#sk)">
    <rect x="40" y="92" width="46" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="86" y="92" width="54" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="140" y="92" width="100" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="240" y="92" width="140" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="380" y="92" width="200" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="580" y="92" width="180" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#444" filter="url(#sk)">
    <text x="63" y="116" text-anchor="middle">0</text>
    <text x="113" y="116" text-anchor="middle">a</text>
    <text x="190" y="116" text-anchor="middle" font-weight="bold" fill="#b85450">否</text>
    <text x="310" y="116" text-anchor="middle">"a"</text>
    <text x="480" y="116" text-anchor="middle">[ ]</text>
    <text x="670" y="116" text-anchor="middle">累积</text>
  </g>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="132" width="46" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="86" y="132" width="54" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="140" y="132" width="100" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="240" y="132" width="140" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="380" y="132" width="200" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="580" y="132" width="180" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#444" filter="url(#sk)">
    <text x="63" y="156" text-anchor="middle">1</text>
    <text x="113" y="156" text-anchor="middle" font-weight="bold" fill="#b85450">.</text>
    <text x="190" y="156" text-anchor="middle" font-weight="bold" fill="#4a7a3a">是</text>
    <text x="310" y="156" text-anchor="middle">ε</text>
    <text x="480" y="156" text-anchor="middle">["a"]</text>
    <text x="670" y="149" text-anchor="middle" font-size="11.5">冲刷：cur = "a" 非空</text>
    <text x="670" y="165" text-anchor="middle" font-size="11.5">→ 入 ans</text>
  </g>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="172" width="46" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="86" y="172" width="54" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="140" y="172" width="100" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="240" y="172" width="140" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="380" y="172" width="200" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="580" y="172" width="180" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#444" filter="url(#sk)">
    <text x="63" y="196" text-anchor="middle">2</text>
    <text x="113" y="196" text-anchor="middle">b</text>
    <text x="190" y="196" text-anchor="middle" font-weight="bold" fill="#b85450">否</text>
    <text x="310" y="196" text-anchor="middle">"b"</text>
    <text x="480" y="196" text-anchor="middle">["a"]</text>
    <text x="670" y="196" text-anchor="middle">累积</text>
  </g>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="212" width="46" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="86" y="212" width="54" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="140" y="212" width="100" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="240" y="212" width="140" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="380" y="212" width="200" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="580" y="212" width="180" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#444" filter="url(#sk)">
    <text x="63" y="236" text-anchor="middle">3</text>
    <text x="113" y="236" text-anchor="middle" font-weight="bold" fill="#b85450">.</text>
    <text x="190" y="236" text-anchor="middle" font-weight="bold" fill="#4a7a3a">是</text>
    <text x="310" y="236" text-anchor="middle">ε</text>
    <text x="480" y="236" text-anchor="middle">["a","b"]</text>
    <text x="670" y="236" text-anchor="middle" font-size="11.5">冲刷：cur = "b" 入 ans</text>
  </g>

  <!-- row 4 : consecutive separator, highlighted -->
  <g filter="url(#sk)">
    <rect x="40" y="252" width="46" height="40" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="86" y="252" width="54" height="40" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="140" y="252" width="100" height="40" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="240" y="252" width="140" height="40" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="380" y="252" width="200" height="40" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="580" y="252" width="180" height="40" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <g font-size="12.5" filter="url(#sk)">
    <text x="63" y="276" text-anchor="middle" fill="#7a5415" font-weight="bold">4</text>
    <text x="113" y="276" text-anchor="middle" fill="#7a5415" font-weight="bold">.</text>
    <text x="190" y="276" text-anchor="middle" font-weight="bold" fill="#4a7a3a">是</text>
    <text x="310" y="276" text-anchor="middle" fill="#7a5415" font-weight="bold">ε</text>
    <text x="480" y="276" text-anchor="middle" fill="#7a5415" font-weight="bold">["a","b"]</text>
    <text x="670" y="269" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">★ cur 已空 → 判空拦截</text>
    <text x="670" y="285" text-anchor="middle" font-size="11.5" fill="#7a5415">不入 ans（关键行）</text>
  </g>

  <!-- row 5 -->
  <g filter="url(#sk)">
    <rect x="40" y="292" width="46" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="86" y="292" width="54" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="140" y="292" width="100" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="240" y="292" width="140" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="380" y="292" width="200" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="580" y="292" width="180" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#444" filter="url(#sk)">
    <text x="63" y="316" text-anchor="middle">5</text>
    <text x="113" y="316" text-anchor="middle">c</text>
    <text x="190" y="316" text-anchor="middle" font-weight="bold" fill="#b85450">否</text>
    <text x="310" y="316" text-anchor="middle">"c"</text>
    <text x="480" y="316" text-anchor="middle">["a","b"]</text>
    <text x="670" y="316" text-anchor="middle">累积</text>
  </g>

  <!-- row 6 : tail flush -->
  <g filter="url(#sk)">
    <rect x="40" y="332" width="46" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="86" y="332" width="54" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="140" y="332" width="100" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="240" y="332" width="140" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="380" y="332" width="200" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="580" y="332" width="180" height="40" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#444" filter="url(#sk)">
    <text x="63" y="356" text-anchor="middle">尾</text>
    <text x="113" y="356" text-anchor="middle">⊥</text>
    <text x="190" y="356" text-anchor="middle" font-weight="bold" fill="#4a7a3a">串尾</text>
    <text x="310" y="356" text-anchor="middle">ε</text>
    <text x="480" y="356" text-anchor="middle">["a","b","c"]</text>
    <text x="670" y="349" text-anchor="middle" font-size="11.5">尾冲刷："c" 入 ans</text>
    <text x="670" y="365" text-anchor="middle" font-size="11.5">换下一个 word</text>
  </g>

  <!-- answer strip -->
  <g filter="url(#sk)"><rect x="40" y="386" width="720" height="42" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="400" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">最终 ans = ["a","b","c","x","d"]——".x" 的首空段、"d." 的尾空段同样被判空拦截 ✓</text>

  <!-- bottom notes -->
  <g filter="url(#sk)"><rect x="40" y="440" width="350" height="58" rx="9" fill="#fdfcf7" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="58" y="462" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">word = ".x"：j = 0 的 '.' 到来时 cur = ε</text>
  <text x="58" y="479" font-size="10.5" fill="#444" filter="url(#sk)">→ 首空段被拦截；尾冲刷收走 "x"</text>
  <text x="58" y="494" font-size="10.5" fill="#444" filter="url(#sk)">word = "d."：'.' 冲刷收走 "d"，串尾 ε 拦截</text>

  <g filter="url(#sk)"><rect x="410" y="440" width="350" height="58" rx="9" fill="#fdfcf7" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="428" y="462" font-size="11" font-weight="bold" fill="#8f3a36" filter="url(#sk)">易错对照：漏写「尾冲刷」</text>
  <text x="428" y="479" font-size="10.5" fill="#444" filter="url(#sk)">无分隔符的 word（如示例 1 的 "six"）整段</text>
  <text x="428" y="494" font-size="10.5" fill="#444" filter="url(#sk)">永远入不了 ans → 漏段 ✗</text>
</svg>
