<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">单调队列：滑动窗口最小值的维护</text>

  <!-- dp 序列上的窗口 -->
  <g font-size="11" fill="#33506e">
    <text x="80" y="66" text-anchor="middle" filter="url(#rough2)">j=1</text>
    <text x="130" y="66" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="180" y="66" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="230" y="66" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="280" y="66" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="330" y="66" text-anchor="middle" filter="url(#rough2)">6</text>
    <text x="380" y="66" text-anchor="middle" filter="url(#rough2)">7</text>
    <text x="430" y="66" text-anchor="middle" filter="url(#rough2)">8</text>
    <text x="480" y="66" text-anchor="middle" filter="url(#rough2)">9</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="62" y="76" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="112" y="76" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="162" y="76" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="212" y="76" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="262" y="76" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="312" y="76" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="362" y="76" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="412" y="76" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="462" y="76" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="180" y="96" text-anchor="middle" font-size="11" fill="#2d5a1f" filter="url(#rough2)">c=44</text>
  <text x="230" y="96" text-anchor="middle" font-size="11" fill="#2d5a1f" filter="url(#rough2)">c=32</text>
  <text x="330" y="96" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">c=39</text>
  <text x="80" y="96" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">26</text>
  <text x="130" y="96" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">44</text>
  <text x="280" y="96" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">81</text>
  <text x="380" y="96" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">77</text>
  <text x="430" y="96" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">84</text>
  <text x="480" y="96" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">…</text>

  <!-- 当前窗口框（i=8：j∈[4,8]） -->
  <rect x="208" y="70" width="244" height="42" rx="6" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="8 5" filter="url(#rough2)"/>
  <text x="330" y="130" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">当前窗口 j ∈ [⌈i/2⌉, i]（i = 8）</text>

  <!-- 队列内部 -->
  <text x="100" y="170" font-size="13" fill="#446688" filter="url(#rough2)">单调队列（值递增）：</text>
  <g filter="url(#rough2)">
    <rect x="230" y="152" width="70" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="304" y="152" width="70" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="378" y="152" width="70" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="265" y="174" text-anchor="middle" font-size="12" fill="#2d5a1f" filter="url(#rough2)">队首 32</text>
  <text x="339" y="174" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">44</text>
  <text x="413" y="174" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">队尾 39</text>
  <path d="M 200 169 L 228 169" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">↑ dp[8] 直取队首 = 32（示例3 中 dp[4] 取 32）</text>

  <!-- 两条维护规则 -->
  <rect x="40" y="222" width="240" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="244" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">入队：弹出队尾所有 ≥ 新值的</text>
  <text x="160" y="262" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">（被新候选支配）</text>
  <rect x="300" y="222" width="240" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="244" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">过期：队首 2j &lt; i 时弹出</text>
  <text x="420" y="262" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">（买 j 的赠送够不到 i）</text>

  <!-- 复杂度 -->
  <rect x="140" y="290" width="280" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="315" text-anchor="middle" font-size="13" fill="#2d5a1f" filter="url(#rough2)">每下标进出队各一次 → 总 O(n)</text>
</svg>
