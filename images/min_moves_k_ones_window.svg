<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">被迫移动时：以 z 为中心的大小 L 最优窗口</text>
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">pos = [1, 2, 4, 7, 8, 10]（1 的位置），L = 4，z = 7（下标 i = 3）</text>

  <!-- 数轴 -->
  <line x1="40" y1="120" x2="520" y2="120" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 窗口框（最优 [2,5]，即 pos 里的 4,7,8,10）-->
  <g filter="url(#rough2)">
    <rect x="212" y="88" width="286" height="64" fill="#e8f0fe" fill-opacity="0.45" stroke="#446688" stroke-width="2" rx="8"/>
  </g>
  <text x="296" y="80" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">最优窗口 [lo, hi]，大小 L，必含 z</text>

  <!-- pos 上的点：1,2,4,7,8,10 → x 坐标 = 40 + p*45 -->
  <g filter="url(#rough2)">
    <circle cx="85"  cy="120" r="6" fill="#bbb" stroke="#888" stroke-width="1"/>
    <circle cx="130" cy="120" r="6" fill="#bbb" stroke="#888" stroke-width="1"/>
    <circle cx="220" cy="120" r="7" fill="#4a7a3a" stroke="#2d5224" stroke-width="1.5"/>
    <circle cx="355" cy="120" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="400" cy="120" r="7" fill="#4a7a3a" stroke="#2d5224" stroke-width="1.5"/>
    <circle cx="490" cy="120" r="7" fill="#4a7a3a" stroke="#2d5224" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="85"  y="146">1</text>
    <text x="130" y="146">2</text>
    <text x="220" y="146" fill="#4a7a3a">4</text>
    <text x="355" y="146" fill="#b85450" font-weight="bold">7</text>
    <text x="400" y="146" fill="#4a7a3a">8</text>
    <text x="490" y="146" fill="#4a7a3a">10</text>
  </g>
  <text x="355" y="168" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">z（拾起点）</text>
  <text x="85" y="103" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">窗口外</text>

  <!-- 距离标注 -->
  <path d="M 220 186 L 355 186" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="287" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a = 1 个在左侧</text>
  <path d="M 355 208 L 490 208" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">b = 2 个在右侧</text>

  <!-- 公式框 -->
  <g filter="url(#rough2)">
    <rect x="46" y="232" width="230" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <rect x="292" y="232" width="222" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="60" y="252" fill="#d6a040">左侧距离和</text>
    <text x="60" y="272">S 左 = z·a − (pre[i] − pre[lo])</text>
    <text x="60" y="292" font-size="11" fill="#777">= 7×1 − 4 = 3（|4−7| = 3）</text>
    <text x="306" y="252" fill="#4a7a3a">右侧距离和</text>
    <text x="306" y="272">S 右 = (pre[hi+1] − pre[i+1]) − z·b</text>
    <text x="306" y="292" font-size="11" fill="#777">= 18 − 7×2 = 4（1 + 3）</text>
  </g>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">总距离和 S = 3 + 4 = 7，都是前缀和 O(1) 查询</text>

  <!-- 滑动示意 -->
  <g filter="url(#rough2)">
    <rect x="46" y="332" width="468" height="52" fill="#fce4ec" fill-opacity="0.5" stroke="#b85450" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">z 右移时窗口左端 lo 单调不减：判据 pos[lo+L] + pos[lo] &lt; 2z 就右滑一步</text>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">（f(lo) 的差分 = pos[lo+L] + pos[lo] − 2z 关于 lo 递增 → f 凸，滑到平衡即最优）</text>
</svg>
