<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="380" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">示例 1 / 2 的匹配演算（x = a）</text>
  <text x="50" y="78" text-anchor="start" font-size="12.5" fill="#446688" filter="url(#rough2)">示例 1：cards = [aa, ab, ba, ac]</text>
  <text x="54" y="100" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">类别</text>
  <text x="164" y="100" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">牌</text>
  <text x="314" y="100" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">数量</text>
  <line x1="50" y1="108" x2="460" y2="108" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="134" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">A = aa</text>
  <text x="164" y="134" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">aa</text>
  <text x="314" y="134" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="54" y="168" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">B (a?)</text>
  <text x="164" y="168" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">ab, ac</text>
  <text x="314" y="168" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2（字母 b、c）</text>
  <text x="54" y="202" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">C (?a)</text>
  <text x="164" y="202" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">ba</text>
  <text x="314" y="202" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1（字母 b）</text>
  <text x="50" y="240" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">第一轮：ab 与 ac（只差第 2 位）✓</text>
  <text x="50" y="264" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">第二轮：aa 与 ba（只差第 1 位）✓</text>
  <text x="50" y="288" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">剩不下能配的牌 → 得分 2</text>
  <rect x="470" y="100" width="190" height="120" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="565" y="126" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">示例 2</text>
  <text x="565" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">aa, ab, ba</text>
  <text x="565" y="178" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">只有 aa 能分别和</text>
  <text x="565" y="202" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">ab / ba 配 → 1 分</text>
  <rect x="50" y="312" width="610" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="355" y="336" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">示例 3（x = b）：ab 与 ba 两位都不同，不兼容 → 0 分</text>
  <text x="355" y="354" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">注意：x=b 时 ab 是「?x」型、ba 是「x?」型，正是 B–C 组合</text>
</svg>
