<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1 演算：染色 → 计数 → 拼答案</text>

  <text x="128" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">树 1（n = 5）</text>

  <line x1="120" y1="102" x2="72" y2="160" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="120" y1="102" x2="168" y2="160" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="168" y1="160" x2="130" y2="220" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="168" y1="160" x2="206" y2="220" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>

  <circle cx="120" cy="102" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">0</text>
  <circle cx="72" cy="160" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="72" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">1</text>
  <circle cx="168" cy="160" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="168" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">2</text>
  <circle cx="130" cy="220" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">3</text>
  <circle cx="206" cy="220" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="206" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">4</text>

  <text x="128" y="262" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">偶层 {0,3,4} → C1[0] = 3</text>
  <text x="128" y="284" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">奇层 {1,2} → C1[1] = 2</text>

  <text x="385" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">树 2（m = 8）</text>

  <line x1="400" y1="92" x2="338" y2="142" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="400" y1="92" x2="400" y2="142" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="400" y1="92" x2="462" y2="142" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="338" y1="142" x2="300" y2="196" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="400" y1="142" x2="400" y2="196" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="300" y1="196" x2="262" y2="250" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="300" y1="196" x2="332" y2="250" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>

  <circle cx="400" cy="92" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">0</text>
  <circle cx="338" cy="142" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="338" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">1</text>
  <circle cx="400" cy="142" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">2</text>
  <circle cx="462" cy="142" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="462" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">3</text>
  <circle cx="300" cy="196" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">4</text>
  <circle cx="400" cy="196" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">7</text>
  <circle cx="262" cy="250" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="262" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">5</text>
  <circle cx="332" cy="250" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="332" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">6</text>

  <text x="385" y="292" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">偶层 {0,4,7} → 3</text>
  <text x="385" y="314" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">奇层 {1,2,3,5,6} → 5</text>
  <text x="385" y="338" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">maxC2 = max(3, 5) = 5</text>

  <rect x="120" y="356" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">answer[i] = C1[color(i)] + 5</text>

  <rect x="34" y="414" width="84" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="436" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">i = 0</text>
  <text x="76" y="460" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">偶层，C1 = 3</text>
  <text x="76" y="488" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">3+5 = 8</text>

  <rect x="126" y="414" width="84" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="168" y="436" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">i = 1</text>
  <text x="168" y="460" text-anchor="middle" font-size="11" fill="#99741c" filter="url(#rough2)">奇层，C1 = 2</text>
  <text x="168" y="488" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">2+5 = 7</text>

  <rect x="218" y="414" width="84" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="436" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">i = 2</text>
  <text x="260" y="460" text-anchor="middle" font-size="11" fill="#99741c" filter="url(#rough2)">奇层，C1 = 2</text>
  <text x="260" y="488" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">2+5 = 7</text>

  <rect x="310" y="414" width="84" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="352" y="436" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">i = 3</text>
  <text x="352" y="460" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">偶层，C1 = 3</text>
  <text x="352" y="488" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">3+5 = 8</text>

  <rect x="402" y="414" width="84" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="444" y="436" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">i = 4</text>
  <text x="444" y="460" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">偶层，C1 = 3</text>
  <text x="444" y="488" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506b" filter="url(#rough2)">3+5 = 8</text>

  <rect x="90" y="516" width="340" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="541" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">answer = [8, 7, 7, 8, 8] ✓</text>
</svg>
