<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="436" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">算法流程：每位减去首字母（mod 26）得「轨道身份证」，一趟哈希流式计数</text>

  <!-- 面板 A：规范化建键 -->
  <rect x="30" y="46" width="580" height="148" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="68" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">规范化：把首字母转到 'a' —— 同轨道 ⇔ 同键</text>

  <text x="48" y="97" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">fusion</text>
  <rect x="110" y="79" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="123" y="97" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">f</text>
  <rect x="140" y="79" width="26" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="153" y="97" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">u</text>
  <rect x="170" y="79" width="26" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="183" y="97" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s</text>
  <rect x="200" y="79" width="26" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="213" y="97" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i</text>
  <rect x="230" y="79" width="26" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="243" y="97" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">o</text>
  <rect x="260" y="79" width="26" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="273" y="97" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n</text>

  <text x="322" y="88" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">每位 − 'f'(=5)</text>
  <path d="M296,96 Q322,88 348,96" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="358" y="79" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="371" y="97" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">a</text>
  <rect x="388" y="79" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="401" y="97" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">p</text>
  <rect x="418" y="79" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="431" y="97" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">n</text>
  <rect x="448" y="79" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="461" y="97" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">d</text>
  <rect x="478" y="79" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="491" y="97" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">j</text>
  <rect x="508" y="79" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="521" y="97" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">i</text>
  <text x="548" y="97" font-size="10" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">key</text>

  <text x="48" y="149" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">layout</text>
  <rect x="110" y="131" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="123" y="149" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">l</text>
  <rect x="140" y="131" width="26" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="153" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="170" y="131" width="26" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="183" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">y</text>
  <rect x="200" y="131" width="26" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="213" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">o</text>
  <rect x="230" y="131" width="26" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="243" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">u</text>
  <rect x="260" y="131" width="26" height="26" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="273" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t</text>

  <text x="322" y="140" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">每位 − 'l'(=11)</text>
  <path d="M296,148 Q322,140 348,148" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="162" text-anchor="middle" font-size="8.5" fill="#d6a040" filter="url(#rough2)">a−l = −11 → +26 → 15</text>

  <rect x="358" y="131" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="371" y="149" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">a</text>
  <rect x="388" y="131" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="401" y="149" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">p</text>
  <rect x="418" y="131" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="431" y="149" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">n</text>
  <rect x="448" y="131" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="461" y="149" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">d</text>
  <rect x="478" y="131" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="491" y="149" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">j</text>
  <rect x="508" y="131" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="521" y="149" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">i</text>
  <text x="548" y="149" font-size="10" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">key</text>

  <text x="320" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">两串的键都是 "apndji" ⇒ 同轨道 ⇒ 相似 ✓（负差要 +26 再取模）</text>

  <!-- 面板 B：单趟扫描流程 -->
  <rect x="30" y="206" width="580" height="116" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">单趟扫描：建键 → 查表累加 → 入表</text>

  <rect x="52" y="246" width="108" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="106" y="260" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">取下一个串 w</text>
  <text x="106" y="274" text-anchor="middle" font-size="8.5" fill="#6a86a3" filter="url(#rough2)">（for w in words）</text>

  <rect x="192" y="246" width="150" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="267" y="260" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">key ← 每位减首字母</text>
  <text x="267" y="274" text-anchor="middle" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">(c − w[0] + 26) mod 26，O(m)</text>

  <rect x="374" y="246" width="110" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="429" y="260" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">ans += cnt[key]</text>
  <text x="429" y="274" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">与先前同键串配对</text>

  <rect x="512" y="246" width="86" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="555" y="260" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">cnt[key]++</text>
  <text x="555" y="274" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">入表</text>

  <path d="M162,263 Q176,258 190,263" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M344,263 Q358,258 372,263" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M486,263 Q498,258 510,263" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M555,282 C480,306 180,306 106,282" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="308" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">重复 n 轮，处理完全部串后返回 ans</text>

  <!-- 底部绿色结论框 -->
  <rect x="30" y="334" width="580" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="352" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">时间 O(n·m)：每个字符恰处理一次 + 每串一次 O(m) 哈希</text>
  <text x="320" y="370" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">流式 ans += cnt[key]++ ≡ Σ C(cnt, 2)：第 j 个同键串入表时贡献 j−1</text>

  <!-- 底部橙色警示框 -->
  <rect x="30" y="390" width="580" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="408" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">⚠️ C++ 负差取模：c − w[0] 可能为负（如 "za" 的 a − z = −25）</text>
  <text x="320" y="424" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">必须写 (c − w[0] + 26) % 26，漏 +26 直接 WA；Python 的 % 天然非负</text>
</svg>
