<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <g filter="url(#sk2)">
    <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例 1：vals = [1,3,2,1,3]，答案 6</text>
    <path d="M 110 42 Q 280 52 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none"/>
    <text x="280" y="62" text-anchor="middle" font-size="10.5" fill="#888">（每个节点自身也是 1 条好路径，共 5 条）</text>
  </g>

  <!-- edges -->
  <g filter="url(#sk)">
    <path d="M 252 248 Q 228 276 216 310" stroke="#999" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 158 117 Q 112 152 97 199" stroke="#b85450" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 202 117 Q 232 150 250 199" stroke="#b85450" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 292 248 Q 342 284 374 311" stroke="#b85450" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- annotation arrow to good path -->
  <g filter="url(#sk)">
    <path d="M 385 108 Q 415 175 348 252" stroke="#b03a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#sk2)">
    <text x="405" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">好路径</text>
    <text x="405" y="106" text-anchor="middle" font-size="10.5" fill="#b03a3a">1 → 0 → 2 → 4</text>
  </g>

  <!-- nodes -->
  <g filter="url(#sk)">
    <circle cx="180" cy="100" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="90" cy="225" r="26" fill="#fff8e1" stroke="#b85450" stroke-width="2.4"/>
    <circle cx="270" cy="225" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="205" cy="335" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="400" cy="335" r="26" fill="#fff8e1" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <g filter="url(#sk2)">
    <text x="180" y="97" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">0</text>
    <text x="180" y="113" text-anchor="middle" font-size="10.5" fill="#2b4a6e">1</text>
    <text x="90" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>
    <text x="90" y="238" text-anchor="middle" font-size="10.5" fill="#7a5415">3</text>
    <text x="270" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>
    <text x="270" y="238" text-anchor="middle" font-size="10.5" fill="#2e6e2e">2</text>
    <text x="205" y="332" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
    <text x="205" y="348" text-anchor="middle" font-size="10.5" fill="#2b4a6e">1</text>
    <text x="400" y="332" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">4</text>
    <text x="400" y="348" text-anchor="middle" font-size="10.5" fill="#7a5415">3</text>
  </g>
  <g filter="url(#sk2)">
    <text x="90" y="178" text-anchor="middle" font-size="9.5" fill="#888">端点</text>
    <text x="400" y="288" text-anchor="middle" font-size="9.5" fill="#888">端点</text>
  </g>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="40" y="385" width="480" height="72" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 56 405 L 84 405" stroke="#b85450" stroke-width="4" stroke-linecap="round"/>
    <path d="M 56 432 L 84 432" stroke="#999" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g filter="url(#sk2)">
    <text x="94" y="409" font-size="10.5" fill="#444">好路径 1→0→2→4：端点值 3 是全程最大值，中间节点 0、2 的值 1、2 均 ≤ 3</text>
    <text x="94" y="436" font-size="10.5" fill="#444">0→2→3 不是好路径：端点值同为 1，但中间 vals[2]=2 &gt; 1，端点值不再是最大值</text>
  </g>
</svg>
