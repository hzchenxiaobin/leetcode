<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">从 Q3 到 Q4：n 放大 100 倍，判定引擎必须换掉</text>

  <!-- A. 左右对照 -->
  <rect x="25" y="52" width="225" height="158" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="78" text-anchor="middle" font-size="13" fill="#7a6020" filter="url(#rough2)">Q3 · #3398（n ≤ 10³）</text>
  <text x="137" y="102" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">赛时可用 DP 判定 f[i][c][l]</text>
  <text x="137" y="122" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">单轮 O(n·m)，最坏 m ≈ n</text>
  <text x="137" y="142" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">二分 ≈ 10³ × 10³ × 10 = 10⁷</text>
  <text x="137" y="162" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">能过，但埋着一颗雷</text>
  <text x="137" y="190" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">✓ 10³ 量级扛得住</text>

  <rect x="310" y="52" width="225" height="158" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="78" text-anchor="middle" font-size="13" fill="#2d4d24" filter="url(#rough2)">Q4 · #3399（n ≤ 10⁵）</text>
  <text x="422" y="102" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">DP 引擎原样搬来：10⁵ × 10⁵</text>
  <text x="422" y="122" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">= 10¹⁰ ✗ 超时上百倍</text>
  <text x="422" y="142" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">换闭式判定 Σ ⌊L/(m+1)⌋</text>
  <text x="422" y="162" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">单轮 O(k)，总 O(n log n) ≈ 1.7×10⁶</text>
  <text x="422" y="190" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">✓ 轻松通过</text>

  <path d="M252,128 L304,128" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="112" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">n × 100</text>
  <text x="278" y="150" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">同场同题意</text>

  <!-- B. 判定引擎对照表 -->
  <text x="60" y="242" font-size="12" fill="#333" filter="url(#rough2)">判定引擎对照（n = 10⁵，二分 ⌈log₂ 10⁵⌉ ≈ 17 轮）：</text>

  <rect x="55" y="252" width="150" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="205" y="252" width="130" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="335" y="252" width="120" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="455" y="252" width="80" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="273" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">判定方式</text>
  <text x="270" y="273" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">单轮代价</text>
  <text x="395" y="273" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">总代价</text>
  <text x="495" y="273" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">结论</text>

  <rect x="55" y="284" width="150" height="32" rx="4" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="205" y="284" width="130" height="32" rx="4" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="335" y="284" width="120" height="32" rx="4" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="455" y="284" width="80" height="32" rx="4" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="305" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">逐位 DP f[i][c][l]</text>
  <text x="270" y="305" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">O(n·m)</text>
  <text x="395" y="305" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">O(n²)</text>
  <text x="495" y="305" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">10¹⁰ ✗</text>

  <rect x="55" y="316" width="150" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="205" y="316" width="130" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="335" y="316" width="120" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="455" y="316" width="80" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="337" text-anchor="middle" font-size="11.5" fill="#2d4d24" filter="url(#rough2)">游程整除闭式</text>
  <text x="270" y="337" text-anchor="middle" font-size="11.5" fill="#2d4d24" filter="url(#rough2)">O(k)</text>
  <text x="395" y="337" text-anchor="middle" font-size="11.5" fill="#2d4d24" filter="url(#rough2)">O(n log n)</text>
  <text x="495" y="337" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">~10⁶ ✓</text>

  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">m = 1 的交替特判 O(n) 至多触发一次，不改变量级；k 为游程数（≤ n）</text>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">闭式的下界 / 构造两面论证见下一张图</text>
</svg>
