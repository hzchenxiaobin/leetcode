<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：word = "aaaaaaaaaaaaaabb"</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">14 个 a + 2 个 b，三段全部走查</text>

  <!-- header row: x = 40 | 86 | 140 | 226 | 268 | 376 | 424 | 540 -->
  <rect x="40" y="60" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">
    <text x="63" y="77" text-anchor="middle">轮次</text>
    <text x="113" y="77" text-anchor="middle">起始 i</text>
    <text x="183" y="77" text-anchor="middle">吃进</text>
    <text x="247" y="77" text-anchor="middle">len</text>
    <text x="322" y="77" text-anchor="middle">冲刷触发</text>
    <text x="400" y="77" text-anchor="middle">追加</text>
    <text x="482" y="77" text-anchor="middle">comp 变化</text>
  </g>
  <path d="M 86 60 L 86 186" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 140 60 L 140 186" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 226 60 L 226 186" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 268 60 L 268 186" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 376 60 L 376 186" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 424 60 L 424 186" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 1 -->
  <rect x="40" y="86" width="500" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="63" y="107" text-anchor="middle">1</text>
    <text x="113" y="107" text-anchor="middle">0</text>
    <text x="183" y="107" text-anchor="middle">a × 9</text>
    <text x="247" y="107" text-anchor="middle" fill="#d6a040" font-weight="bold">9</text>
    <text x="322" y="107" text-anchor="middle" fill="#d6a040" font-weight="bold">len 封顶 = 9</text>
    <text x="400" y="107" text-anchor="middle" fill="#4a7a3a" font-weight="bold">"9a"</text>
    <text x="482" y="107" text-anchor="middle">"9a"</text>
  </g>

  <!-- row 2 -->
  <rect x="40" y="120" width="500" height="34" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="63" y="141" text-anchor="middle">2</text>
    <text x="113" y="141" text-anchor="middle">9</text>
    <text x="183" y="141" text-anchor="middle">a × 5</text>
    <text x="247" y="141" text-anchor="middle">5</text>
    <text x="322" y="141" text-anchor="middle">字符切换 a→b</text>
    <text x="400" y="141" text-anchor="middle" fill="#4a7a3a" font-weight="bold">"5a"</text>
    <text x="482" y="141" text-anchor="middle">"9a5a"</text>
  </g>

  <!-- row 3 -->
  <rect x="40" y="154" width="500" height="32" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="63" y="174" text-anchor="middle">3</text>
    <text x="113" y="174" text-anchor="middle">14</text>
    <text x="183" y="174" text-anchor="middle">b × 2</text>
    <text x="247" y="174" text-anchor="middle">2</text>
    <text x="322" y="174" text-anchor="middle">到达末尾</text>
    <text x="400" y="174" text-anchor="middle" fill="#4a7a3a" font-weight="bold">"2b"</text>
    <text x="482" y="174" text-anchor="middle" fill="#446688" font-weight="bold">"9a5a2b"</text>
  </g>

  <!-- abcde mini walkthrough -->
  <text x="50" y="216" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">再看 "abcde"：5 轮全靠「字符切换」触发</text>

  <g filter="url(#rough2)">
    <rect x="60" y="226" width="40" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="80" y="246" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1a</text>
    <rect x="114" y="226" width="40" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="134" y="246" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1b</text>
    <rect x="168" y="226" width="40" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="188" y="246" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1c</text>
    <rect x="222" y="226" width="40" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="242" y="246" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1d</text>
    <rect x="276" y="226" width="40" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="296" y="246" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">1e</text>
  </g>
  <path d="M 316 241 L 336 241" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="340" y="226" width="185" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="432" y="246" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">comp = "1a1b1c1d1e"</text>

  <!-- summary -->
  <rect x="55" y="278" width="450" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a 游程：⌈14/9⌉ = 2 段；b 游程：⌈2/9⌉ = 1 段，共 3 段</text>
  <text x="280" y="312" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">"abcde" 则是 5 个长 1 游程 → 输出 2n 个字符，压缩反而变长</text>

  <text x="280" y="348" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">每轮内层至少吃 1 个字符（word 非空）→ 永不出现 0 段，无需特判</text>
  <text x="280" y="368" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">同一个字符相邻两段（如 9a5a）是合法输出，不要合并</text>
</svg>
