<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">示例演算：target = 2 要 3 步，target = 3 只要 2 步</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每一步只问两件事：S(n) 够不够大、差值 S(n) − t 是不是偶数</text>

  <text x="32" y="66" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">target = 2（示例 1）</text>

  <g filter="url(#rough2)">
    <rect x="24" y="72" width="512" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="58" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">n</text>
    <text x="145" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">S(n)</text>
    <text x="235" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">S(n) − 2</text>
    <text x="322" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">奇偶</text>
    <text x="430" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">判定结论</text>

    <rect x="24" y="100" width="512" height="30" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1" rx="3"/>
    <text x="58" y="119" text-anchor="middle" font-size="11" fill="#666">1</text>
    <text x="145" y="119" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="235" y="119" text-anchor="middle" font-size="11" fill="#333">−1</text>
    <text x="322" y="119" text-anchor="middle" font-size="11" fill="#999">—</text>
    <text x="430" y="119" text-anchor="middle" font-size="10.5" fill="#b85450">上界不足，跳过</text>

    <rect x="24" y="130" width="512" height="30" fill="#ffffff" stroke="#d5dde8" stroke-width="1" rx="3"/>
    <text x="58" y="149" text-anchor="middle" font-size="11" fill="#666">2</text>
    <text x="145" y="149" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text x="235" y="149" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="322" y="149" text-anchor="middle" font-size="11" fill="#b85450">奇</text>
    <text x="430" y="149" text-anchor="middle" font-size="10.5" fill="#b85450">差为奇数，不可达</text>

    <rect x="24" y="160" width="512" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <text x="58" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a30">3</text>
    <text x="145" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a30">6</text>
    <text x="235" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a30">4</text>
    <text x="322" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">偶</text>
    <text x="430" y="179" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a">✓ 差 4 可对消，答案 3</text>
  </g>

  <text x="32" y="214" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">target = 3（示例 2）</text>

  <g filter="url(#rough2)">
    <rect x="24" y="220" width="512" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="58" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">n</text>
    <text x="145" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">S(n)</text>
    <text x="235" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">S(n) − 3</text>
    <text x="322" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">奇偶</text>
    <text x="430" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66">判定结论</text>

    <rect x="24" y="248" width="512" height="30" fill="#f7f9fc" stroke="#d5dde8" stroke-width="1" rx="3"/>
    <text x="58" y="267" text-anchor="middle" font-size="11" fill="#666">1</text>
    <text x="145" y="267" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="235" y="267" text-anchor="middle" font-size="11" fill="#333">−2</text>
    <text x="322" y="267" text-anchor="middle" font-size="11" fill="#999">—</text>
    <text x="430" y="267" text-anchor="middle" font-size="10.5" fill="#b85450">上界不足，跳过</text>

    <rect x="24" y="278" width="512" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <text x="58" y="297" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a30">2</text>
    <text x="145" y="297" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a30">3</text>
    <text x="235" y="297" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a30">0</text>
    <text x="322" y="297" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">偶</text>
    <text x="430" y="297" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a">✓ 差 0 全正向，答案 2</text>
  </g>

  <rect x="24" y="320" width="512" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="339" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">构造：t = 2 时 d = (6 − 2)/2 = 2，把第 2 步反向得 +1 −2 +3 = 2</text>
  <text x="280" y="357" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">t = 3 时 d = 0，三步全正向 +1 +2 = 3；d 就是需要反向的那几步之和</text>

  <text x="280" y="388" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">只要 S(n) ≥ t 且差值为偶数，就必然存在一组 ± 恰好落在 t（§5 引理 3）</text>
</svg>
