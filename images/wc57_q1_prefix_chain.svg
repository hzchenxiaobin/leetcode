<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">链式条件：可构造 ⟺ 每个前缀都在词典里</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每次只能在末尾追加一个字母，于是「构造过程」就是一条前缀链</text>

  <text x="30" y="80" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 完整链：world 可以一步一步长出来</text>

  <g filter="url(#rough2)" font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="30" y="94" width="84" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="130" y="94" width="84" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="230" y="94" width="84" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="330" y="94" width="84" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="430" y="94" width="84" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="72" y="120" fill="#3a5a30">w</text>
    <text x="172" y="120" fill="#3a5a30">wo</text>
    <text x="272" y="120" fill="#3a5a30">wor</text>
    <text x="372" y="120" fill="#3a5a30">worl</text>
    <text x="472" y="120" fill="#3a5a30">world</text>
  </g>

  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrg)">
    <path d="M 117 115 L 127 115"/>
    <path d="M 217 115 L 227 115"/>
    <path d="M 317 115 L 327 115"/>
    <path d="M 417 115 L 427 115"/>
  </g>

  <text x="280" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">每一环的 w[:-1] 都在词典中 ⟹ world 可构造，长度 5</text>

  <text x="30" y="188" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 断链：banana 缺少前缀 banan，整条链作废</text>

  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="30" y="202" width="74" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="117" y="202" width="74" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="204" y="202" width="74" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="291" y="202" width="74" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="378" y="202" width="74" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" rx="4"/>
    <rect x="465" y="202" width="74" height="42" fill="#f1f1f1" stroke="#bbbbbb" stroke-width="1.5" rx="4"/>
    <text x="67" y="228" fill="#3a5a30">b</text>
    <text x="154" y="228" fill="#3a5a30">ba</text>
    <text x="241" y="228" fill="#3a5a30">ban</text>
    <text x="328" y="228" fill="#3a5a30">bana</text>
    <text x="415" y="228" fill="#b85450">banan</text>
    <text x="502" y="228" fill="#999999">banana</text>
  </g>

  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrg)">
    <path d="M 107 223 L 114 223"/>
    <path d="M 194 223 L 201 223"/>
    <path d="M 281 223 L 288 223"/>
  </g>
  <path d="M 368 223 L 375 223" stroke="#b85450" stroke-width="1.4" fill="none"
        stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 455 223 L 462 223" stroke="#b85450" stroke-width="1.4" fill="none"
        stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="415" y="262" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">词典里没有它 · 断点</text>
  <text x="502" y="262" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">不可构造</text>

  <text x="280" y="296" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">判定一个单词只需要看它的直接前缀：更早的环节由「前缀自身可构造」递归保证</text>
  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">所以按长度升序扫描：处理 w 时，w[:-1] 一定已经被判定过，只需一次集合查询</text>
  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">词典里单词的排列顺序无关紧要，关键只有「谁是谁的前缀」这一层结构</text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">同长度时再按字典序升序，第一次遇到的即字典序最小的那个答案</text>
</svg>
