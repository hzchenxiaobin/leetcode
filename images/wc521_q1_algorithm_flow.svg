<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="452" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">计数 + 逐轮扫描流程</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="56" rx="48" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M260,74 L260,90" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 计数 -->
  <rect x="130" y="94" width="260" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">① 桶计数 cnt[v]（值域 1..100）</text>
  <text x="260" y="134" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">出现过的值从小到大收集 → vals</text>
  <path d="M260,142 L260,158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 扫描一轮 -->
  <rect x="88" y="162" width="344" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">② 依序扫描 v ∈ vals（升序），changed = false</text>
  <text x="260" y="210" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">若 cnt[v] &gt; 0：ans 追加 v，计数减一，changed = true</text>
  <path d="M260,226 L260,242" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,246 368,284 260,322 152,284" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="14" fill="#8a6d1f" filter="url(#rough2)">本轮有输出？</text>

  <!-- 是：回到下一轮 -->
  <path d="M152,284 L70,284 L70,194 L84,194" stroke="#999" stroke-width="1.6" stroke-dasharray="7 5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="274" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="58" y="239" transform="rotate(-90 58 239)" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">进入下一轮</text>

  <!-- 否：返回 -->
  <path d="M260,322 L260,338" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="344" font-size="12" fill="#b85450" filter="url(#rough2)">否（全部取完）</text>
  <rect x="185" y="358" width="150" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="14" fill="#8a6d1f" filter="url(#rough2)">返回 ans</text>
  <path d="M260,400 L260,414" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <ellipse cx="260" cy="430" rx="42" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="435" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">结束</text>
</svg>
