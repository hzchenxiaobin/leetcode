<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">+1 / −1 变换：把「计数问题」变成「前缀和比较」</text>

  <!-- nums -->
  <text x="22" y="76" font-size="12" fill="#333" filter="url(#rough2)">nums</text>
  <rect x="74" y="56" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="101" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="132" y="56" width="54" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="159" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="190" y="56" width="54" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="217" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="248" y="56" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="316" y="79" font-size="11" fill="#4a7a3a" filter="url(#rough2)">target=2</text>

  <!-- arrow -->
  <path d="M150,96 L150,112" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M260,96 L260,112" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="272" y="110" font-size="11" fill="#999" filter="url(#rough2)">w[i]</text>

  <!-- w 行 -->
  <rect x="74" y="116" width="54" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="101" y="137" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−1</text>
  <rect x="132" y="116" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="159" y="137" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <rect x="190" y="116" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="217" y="137" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <rect x="248" y="116" width="54" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="275" y="137" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−1</text>

  <!-- prefix -->
  <text x="26" y="196" font-size="12" fill="#d6a040" filter="url(#rough2)">P</text>
  <rect x="56" y="172" width="54" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="83" y="194" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="114" y="172" width="54" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="141" y="194" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="172" y="172" width="54" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="194" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="230" y="172" width="54" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="257" y="194" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="288" y="172" width="54" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="194" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="352" y="194" font-size="11" fill="#d6a040" filter="url(#rough2)">共 n+1 个</text>

  <!-- 结论 -->
  <rect x="50" y="226" width="420" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">P[j] − P[i] = 2·cnt − len  ⇒  target 是主要元素 ⟺ P[i] &lt; P[j]</text>

  <rect x="50" y="278" width="420" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">于是问题 ⟺ 数下标对 (i &lt; j) 使 P[i] &lt; P[j]（顺序对计数）</text>
</svg>
