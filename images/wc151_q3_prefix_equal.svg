<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="28" font-size="15" fill="#333" font-weight="bold" text-anchor="middle" filter="url(#rough2)">前缀和相等 ⇒ 中间整段和为 0，可以整段删掉</text>
  <text x="320" y="50" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">示例 1：head = [1, 2, −3, 3, 1]，前缀和 p₀ … p₅ = 0, 1, 3, 0, 3, 4</text>
  <text x="85" y="88" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">哑结点</text>
  <rect x="44" y="96" width="82" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="85" y="118" font-size="12" fill="#555" text-anchor="middle" filter="url(#rough2)">v = 0</text>
  <text x="85" y="146" font-size="17" fill="#2f5e22" font-weight="bold" text-anchor="middle" filter="url(#rough2)">p₀ = 0</text>
  <text x="85" y="164" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">末次下标 3</text>
  <text x="179" y="88" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">节点 1</text>
  <rect x="138" y="96" width="82" height="76" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="179" y="118" font-size="12" fill="#555" text-anchor="middle" filter="url(#rough2)">v = 1</text>
  <text x="179" y="146" font-size="17" fill="#333" font-weight="bold" text-anchor="middle" filter="url(#rough2)">p₁ = 1</text>
  <text x="179" y="164" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">末次下标 1</text>
  <text x="273" y="88" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">节点 2</text>
  <rect x="232" y="96" width="82" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="273" y="118" font-size="12" fill="#555" text-anchor="middle" filter="url(#rough2)">v = 2</text>
  <text x="273" y="146" font-size="17" fill="#7a5c18" font-weight="bold" text-anchor="middle" filter="url(#rough2)">p₂ = 3</text>
  <text x="273" y="164" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">末次下标 4</text>
  <text x="367" y="88" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">节点 3</text>
  <rect x="326" y="96" width="82" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="367" y="118" font-size="12" fill="#555" text-anchor="middle" filter="url(#rough2)">v = −3</text>
  <text x="367" y="146" font-size="17" fill="#2f5e22" font-weight="bold" text-anchor="middle" filter="url(#rough2)">p₃ = 0</text>
  <text x="367" y="164" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">末次下标 3</text>
  <text x="461" y="88" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">节点 4</text>
  <rect x="420" y="96" width="82" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="461" y="118" font-size="12" fill="#555" text-anchor="middle" filter="url(#rough2)">v = 3</text>
  <text x="461" y="146" font-size="17" fill="#7a5c18" font-weight="bold" text-anchor="middle" filter="url(#rough2)">p₄ = 3</text>
  <text x="461" y="164" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">末次下标 4</text>
  <text x="555" y="88" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">节点 5</text>
  <rect x="514" y="96" width="82" height="76" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="555" y="118" font-size="12" fill="#555" text-anchor="middle" filter="url(#rough2)">v = 1</text>
  <text x="555" y="146" font-size="17" fill="#333" font-weight="bold" text-anchor="middle" filter="url(#rough2)">p₅ = 4</text>
  <text x="555" y="164" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">末次下标 5</text>
  <path d="M 85 184 L 85 196 L 367 196 L 367 184" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="226" y="218" font-size="10.3" fill="#2f5e22" text-anchor="middle" filter="url(#rough2)">p₀ = p₃ = 0 ⇒ 节点 1..3 之和为 0 ⇒ 删掉，得 [3, 1]</text>
  <path d="M 273 238 L 273 250 L 461 250 L 461 238" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="367" y="272" font-size="10.3" fill="#7a5c18" text-anchor="middle" filter="url(#rough2)">p₂ = p₄ = 3 ⇒ 删掉 −3 与 3 ⇒ 得 [1, 2, 1]，同样合法</text>
  <text x="44" y="310" font-size="11" fill="#555" filter="url(#rough2)">零和区间的两个端点，恰好是一对「前缀和相等的位置」——这就是哈希表能一次定位的依据。</text>
  <text x="44" y="336" font-size="11" fill="#2f5e22" filter="url(#rough2)">本文算法固定跳到「最后一个」同前缀和的节点，所以示例 1 输出官方答案 [3, 1]。</text>
  <text x="44" y="368" font-size="10.3" fill="#888" filter="url(#rough2)">括号高度只用于区分两组候选，不代表删除顺序；绿色这组才是算法最终采用的一组。</text>
</svg>
