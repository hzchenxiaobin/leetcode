<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">先过门槛，再挑最矮：达标箱子里选容量最小</text>

  <!-- 柱子：基线 y=320，34px/单位 -->
  <rect x="98" y="286" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <path d="M120,295 L142,311 M142,295 L120,311" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="278" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="218" y="150" width="64" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="250" y="142" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="338" y="218" width="64" height="102" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="370" y="238" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="458" y="82" width="64" height="238" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="490" y="74" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- 门槛虚线：capacity = 3 -->
  <path d="M75,218 L585,218" stroke="#b85450" stroke-width="2" stroke-dasharray="7,5" fill="none" filter="url(#rough2)"/>
  <text x="80" y="210" font-size="12" fill="#b85450" filter="url(#rough2)">门槛 itemSize = 3</text>
  <text x="80" y="234" font-size="10.5" fill="#888" filter="url(#rough2)">压线（=）也算达标</text>

  <!-- 答案标注 -->
  <text x="370" y="84" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">★ 达标者中容量最小</text>
  <text x="370" y="102" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5、3、7 里挑出 3</text>
  <path d="M370,110 L370,208" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 基线与下标 -->
  <path d="M70,320 L585,320" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="342" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 0</text>
  <text x="250" y="342" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 1</text>
  <text x="370" y="342" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">下标 2（答案）</text>
  <text x="490" y="342" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">下标 3</text>

  <!-- 图例 -->
  <rect x="84" y="360" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="106" y="372" font-size="11" fill="#4a7a3a" filter="url(#rough2)">达标（capacity ≥ itemSize）</text>
  <rect x="330" y="360" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="352" y="372" font-size="11" fill="#8a6d1f" filter="url(#rough2)">被选中（达标中最小）</text>
  <rect x="510" y="360" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="532" y="372" font-size="11" fill="#b85450" filter="url(#rough2)">不达标</text>

  <!-- 底部提示 -->
  <rect x="60" y="390" width="520" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="412" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">易错：不是「第一个达标的」（那是下标 1），是达标者中容量最小的（下标 2）</text>
</svg>
