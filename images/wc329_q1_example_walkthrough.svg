<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：n = 886996</text>
  <path d="M 220 42 Q 340 50 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- digits strip -->
  <g filter="url(#sk)">
    <rect x="150" y="62" width="44" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="172" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">8</text>
  <g filter="url(#sk)">
    <rect x="196" y="62" width="44" height="40" rx="6" fill="#fdecec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="218" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#a03030">8</text>
  <g filter="url(#sk)">
    <rect x="242" y="62" width="44" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="264" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">6</text>
  <g filter="url(#sk)">
    <rect x="288" y="62" width="44" height="40" rx="6" fill="#fdecec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="310" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#a03030">9</text>
  <g filter="url(#sk)">
    <rect x="334" y="62" width="44" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="356" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">9</text>
  <g filter="url(#sk)">
    <rect x="380" y="62" width="44" height="40" rx="6" fill="#fdecec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="402" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#a03030">6</text>
  <text x="172" y="118" text-anchor="middle" font-size="10" fill="#2e6e2e">i=0 +</text>
  <text x="218" y="118" text-anchor="middle" font-size="10" fill="#a03030">i=1 −</text>
  <text x="264" y="118" text-anchor="middle" font-size="10" fill="#2e6e2e">i=2 +</text>
  <text x="310" y="118" text-anchor="middle" font-size="10" fill="#a03030">i=3 −</text>
  <text x="356" y="118" text-anchor="middle" font-size="10" fill="#2e6e2e">i=4 +</text>
  <text x="402" y="118" text-anchor="middle" font-size="10" fill="#a03030">i=5 −</text>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="110" y="140" width="70" height="32" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="180" y="140" width="100" height="32" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="280" y="140" width="90" height="32" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="370" y="140" width="100" height="32" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="470" y="140" width="100" height="32" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="145" y="161" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">下标 i</text>
  <text x="230" y="161" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">数字 s[i]</text>
  <text x="325" y="161" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">符号</text>
  <text x="420" y="161" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">贡献</text>
  <text x="520" y="161" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">ans 累计</text>

  <!-- table rows -->
  <!-- row 0 -->
  <g filter="url(#sk)">
    <rect x="110" y="176" width="70" height="30" rx="4" fill="#eaf6ee" stroke="#9dc79d" stroke-width="1"/>
    <rect x="180" y="176" width="100" height="30" rx="4" fill="#eaf6ee" stroke="#9dc79d" stroke-width="1"/>
    <rect x="280" y="176" width="90" height="30" rx="4" fill="#eaf6ee" stroke="#9dc79d" stroke-width="1"/>
    <rect x="370" y="176" width="100" height="30" rx="4" fill="#eaf6ee" stroke="#9dc79d" stroke-width="1"/>
    <rect x="470" y="176" width="100" height="30" rx="4" fill="#eaf6ee" stroke="#9dc79d" stroke-width="1"/>
  </g>
  <text x="145" y="196" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">0</text>
  <text x="230" y="196" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">8</text>
  <text x="325" y="196" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">+</text>
  <text x="420" y="196" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">+8</text>
  <text x="520" y="196" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">8</text>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="110" y="208" width="70" height="30" rx="4" fill="#fdf4f4" stroke="#dba5a3" stroke-width="1"/>
    <rect x="180" y="208" width="100" height="30" rx="4" fill="#fdf4f4" stroke="#dba5a3" stroke-width="1"/>
    <rect x="280" y="208" width="90" height="30" rx="4" fill="#fdf4f4" stroke="#dba5a3" stroke-width="1"/>
    <rect x="370" y="208" width="100" height="30" rx="4" fill="#fdf4f4" stroke="#dba5a3" stroke-width="1"/>
    <rect x="470" y="208" width="100" height="30" rx="4" fill="#fdf4f4" stroke="#dba5a3" stroke-width="1"/>
  </g>
  <text x="145" y="228" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">1</text>
  <text x="230" y="228" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">8</text>
  <text x="325" y="228" text-anchor="middle" font-size="12" fill="#a03030" font-weight="bold">−</text>
  <text x="420" y="228" text-anchor="middle" font-size="12" fill="#a03030" font-family="monospace">−8</text>
  <text x="520" y="228" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">0</text>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="110" y="240" width="70" height="30" rx="4" fill="#eaf6ee" stroke="#9dc79d" stroke-width="1"/>
    <rect x="180" y="240" width="100" height="30" rx="4" fill="#eaf6ee" stroke="#9dc79d" stroke-width="1"/>
    <rect x="280" y="240" width="90" height="30" rx="4" fill="#eaf6ee" stroke="#9dc79d" stroke-width="1"/>
    <rect x="370" y="240" width="100" height="30" rx="4" fill="#eaf6ee" stroke="#9dc79d" stroke-width="1"/>
    <rect x="470" y="240" width="100" height="30" rx="4" fill="#eaf6ee" stroke="#9dc79d" stroke-width="1"/>
  </g>
  <text x="145" y="260" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">2</text>
  <text x="230" y="260" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">6</text>
  <text x="325" y="260" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">+</text>
  <text x="420" y="260" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">+6</text>
  <text x="520" y="260" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">6</text>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="110" y="272" width="70" height="30" rx="4" fill="#fdf4f4" stroke="#dba5a3" stroke-width="1"/>
    <rect x="180" y="272" width="100" height="30" rx="4" fill="#fdf4f4" stroke="#dba5a3" stroke-width="1"/>
    <rect x="280" y="272" width="90" height="30" rx="4" fill="#fdf4f4" stroke="#dba5a3" stroke-width="1"/>
    <rect x="370" y="272" width="100" height="30" rx="4" fill="#fdf4f4" stroke="#dba5a3" stroke-width="1"/>
    <rect x="470" y="272" width="100" height="30" rx="4" fill="#fdf4f4" stroke="#dba5a3" stroke-width="1"/>
  </g>
  <text x="145" y="292" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">3</text>
  <text x="230" y="292" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">9</text>
  <text x="325" y="292" text-anchor="middle" font-size="12" fill="#a03030" font-weight="bold">−</text>
  <text x="420" y="292" text-anchor="middle" font-size="12" fill="#a03030" font-family="monospace">−9</text>
  <text x="520" y="292" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold" font-family="monospace">−3</text>

  <!-- row 4 -->
  <g filter="url(#sk)">
    <rect x="110" y="304" width="70" height="30" rx="4" fill="#eaf6ee" stroke="#9dc79d" stroke-width="1"/>
    <rect x="180" y="304" width="100" height="30" rx="4" fill="#eaf6ee" stroke="#9dc79d" stroke-width="1"/>
    <rect x="280" y="304" width="90" height="30" rx="4" fill="#eaf6ee" stroke="#9dc79d" stroke-width="1"/>
    <rect x="370" y="304" width="100" height="30" rx="4" fill="#eaf6ee" stroke="#9dc79d" stroke-width="1"/>
    <rect x="470" y="304" width="100" height="30" rx="4" fill="#eaf6ee" stroke="#9dc79d" stroke-width="1"/>
  </g>
  <text x="145" y="324" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">4</text>
  <text x="230" y="324" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">9</text>
  <text x="325" y="324" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">+</text>
  <text x="420" y="324" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace">+9</text>
  <text x="520" y="324" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">6</text>

  <!-- row 5 (final) -->
  <g filter="url(#sk)">
    <rect x="110" y="336" width="70" height="30" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="180" y="336" width="100" height="30" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="280" y="336" width="90" height="30" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="370" y="336" width="100" height="30" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="470" y="336" width="100" height="30" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="145" y="356" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">5</text>
  <text x="230" y="356" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">6</text>
  <text x="325" y="356" text-anchor="middle" font-size="12" fill="#a03030" font-weight="bold">−</text>
  <text x="420" y="356" text-anchor="middle" font-size="12" fill="#a03030" font-family="monospace">−6</text>
  <text x="520" y="356" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold" font-family="monospace">0 ✓</text>

  <!-- annotations -->
  <g filter="url(#sk)">
    <path d="M 500 350 Q 540 350 545 350" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="590" y="344" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">最终答案 0</text>
  <text x="590" y="360" text-anchor="middle" font-size="10" fill="#888">(+8−8)+(6−9)+(9−6) = 0</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="382" width="560" height="26" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="340" y="400" text-anchor="middle" font-size="11" fill="#444">偶下标 (0,2,4) 一律取 +，奇下标 (1,3,5) 一律取 −，与数字大小无关</text>
</svg>
