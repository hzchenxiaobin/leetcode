<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="430" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例走查：nums = [1,2,3,4,5,6,7] —— 答案 3 × 4 = 12</text>
  <path d="M 220 42 Q 470 50 720 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <g filter="url(#sk)">
    <rect x="70" y="66" width="64" height="34" rx="4" fill="#eef1f4" stroke="#8a94a0" stroke-width="1.3"/>
    <rect x="142" y="66" width="112" height="34" rx="4" fill="#eef1f4" stroke="#8a94a0" stroke-width="1.3"/>
    <rect x="262" y="66" width="88" height="34" rx="4" fill="#eef1f4" stroke="#8a94a0" stroke-width="1.3"/>
    <rect x="358" y="66" width="96" height="34" rx="4" fill="#eef1f4" stroke="#8a94a0" stroke-width="1.3"/>
    <rect x="462" y="66" width="104" height="34" rx="4" fill="#eef1f4" stroke="#8a94a0" stroke-width="1.3"/>
  </g>
  <text x="102" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">x</text>
  <text x="198" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">二进制</text>
  <text x="306" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">~x</text>
  <text x="406" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">f[~x]</text>
  <text x="514" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">x · f[~x]</text>

  <!-- x=7 无搭档（灰） -->
  <g filter="url(#sk)">
    <rect x="70" y="104" width="64" height="34" rx="4" fill="#f4f4f4" stroke="#c8c8c8" stroke-width="1.3"/>
    <rect x="142" y="104" width="112" height="34" rx="4" fill="#f4f4f4" stroke="#c8c8c8" stroke-width="1.3"/>
    <rect x="262" y="104" width="88" height="34" rx="4" fill="#f4f4f4" stroke="#c8c8c8" stroke-width="1.3"/>
    <rect x="358" y="104" width="96" height="34" rx="4" fill="#f4f4f4" stroke="#c8c8c8" stroke-width="1.3"/>
    <rect x="462" y="104" width="104" height="34" rx="4" fill="#f4f4f4" stroke="#c8c8c8" stroke-width="1.3"/>
  </g>
  <text x="102" y="126" text-anchor="middle" font-size="13" fill="#999">7</text>
  <text x="198" y="126" text-anchor="middle" font-size="13" fill="#999">111</text>
  <text x="306" y="126" text-anchor="middle" font-size="13" fill="#999">000</text>
  <text x="406" y="126" text-anchor="middle" font-size="13" fill="#999">0</text>
  <text x="514" y="126" text-anchor="middle" font-size="13" fill="#999">0</text>
  <text x="586" y="126" font-size="11.5" fill="#999">← 补集为空，无搭档</text>

  <!-- x=6 -->
  <g filter="url(#sk)">
    <rect x="70" y="146" width="64" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
    <rect x="142" y="146" width="112" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
    <rect x="262" y="146" width="88" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
    <rect x="358" y="146" width="96" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
    <rect x="462" y="146" width="104" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
  </g>
  <text x="102" y="168" text-anchor="middle" font-size="13" fill="#333">6</text>
  <text x="198" y="168" text-anchor="middle" font-size="13" fill="#333">110</text>
  <text x="306" y="168" text-anchor="middle" font-size="13" fill="#333">001</text>
  <text x="406" y="168" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="514" y="168" text-anchor="middle" font-size="13" fill="#333">6</text>

  <!-- x=5 -->
  <g filter="url(#sk)">
    <rect x="70" y="188" width="64" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
    <rect x="142" y="188" width="112" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
    <rect x="262" y="188" width="88" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
    <rect x="358" y="188" width="96" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
    <rect x="462" y="188" width="104" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
  </g>
  <text x="102" y="210" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="198" y="210" text-anchor="middle" font-size="13" fill="#333">101</text>
  <text x="306" y="210" text-anchor="middle" font-size="13" fill="#333">010</text>
  <text x="406" y="210" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="514" y="210" text-anchor="middle" font-size="13" fill="#333">10</text>

  <!-- x=4 命中（绿） -->
  <g filter="url(#sk)">
    <rect x="70" y="230" width="64" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="142" y="230" width="112" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="262" y="230" width="88" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="358" y="230" width="96" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="462" y="230" width="104" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="102" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="198" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">100</text>
  <text x="306" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">011</text>
  <text x="406" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="514" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">12 ✓</text>

  <!-- x=3 命中（绿） -->
  <g filter="url(#sk)">
    <rect x="70" y="272" width="64" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="142" y="272" width="112" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="262" y="272" width="88" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="358" y="272" width="96" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="462" y="272" width="104" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="102" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="198" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">011</text>
  <text x="306" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">100</text>
  <text x="406" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="514" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">12 ✓</text>

  <!-- x=2 -->
  <g filter="url(#sk)">
    <rect x="70" y="314" width="64" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
    <rect x="142" y="314" width="112" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
    <rect x="262" y="314" width="88" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
    <rect x="358" y="314" width="96" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
    <rect x="462" y="314" width="104" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
  </g>
  <text x="102" y="336" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="198" y="336" text-anchor="middle" font-size="13" fill="#333">010</text>
  <text x="306" y="336" text-anchor="middle" font-size="13" fill="#333">101</text>
  <text x="406" y="336" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="514" y="336" text-anchor="middle" font-size="13" fill="#333">10</text>

  <!-- x=1 -->
  <g filter="url(#sk)">
    <rect x="70" y="356" width="64" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
    <rect x="142" y="356" width="112" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
    <rect x="262" y="356" width="88" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
    <rect x="358" y="356" width="96" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
    <rect x="462" y="356" width="104" height="34" rx="4" fill="#ffffff" stroke="#ccd4dc" stroke-width="1.3"/>
  </g>
  <text x="102" y="378" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="198" y="378" text-anchor="middle" font-size="13" fill="#333">001</text>
  <text x="306" y="378" text-anchor="middle" font-size="13" fill="#333">110</text>
  <text x="406" y="378" text-anchor="middle" font-size="13" fill="#333">6</text>
  <text x="514" y="378" text-anchor="middle" font-size="13" fill="#333">6</text>

  <!-- 右侧提醒框 -->
  <g filter="url(#sk)">
    <rect x="600" y="90" width="286" height="150" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="743" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">最大值 7 反而没有搭档！</text>
  <text x="743" y="140" text-anchor="middle" font-size="12" fill="#333">次大值 6 只能配上 1（乘积 6）</text>
  <text x="743" y="164" text-anchor="middle" font-size="12" fill="#333">最优对 3 × 4 出自「中间」的数</text>
  <text x="743" y="188" text-anchor="middle" font-size="12" fill="#333">⇒ 不能只盯最大的几个值偷懒，</text>
  <text x="743" y="212" text-anchor="middle" font-size="12" fill="#333">必须对每个 x 都查询 f[~x]</text>

  <g filter="url(#sk)">
    <rect x="600" y="258" width="286" height="88" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="743" y="282" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">为何 f[~x] 恰好如此整齐？</text>
  <text x="743" y="304" text-anchor="middle" font-size="12" fill="#333">1~7 全部出现，任何 m ≥ 1 的</text>
  <text x="743" y="326" text-anchor="middle" font-size="12" fill="#333">最大子掩码就是 m 自己（f[m]=m）</text>

  <text x="60" y="412" font-size="11.5" fill="#888">演示用 3 位宇宙；实际题目值域 10⁶ &lt; 2²⁰，流程同为「初始化 → 逐位松弛 → 补集查询」</text>
</svg>
