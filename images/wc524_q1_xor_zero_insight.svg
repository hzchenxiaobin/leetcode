<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：x ⊕ y = 0 ⟺ x = y</text>

  <!-- 示例数组一行 -->
  <rect x="143" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="205" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="267" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="289" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="329" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="391" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="413" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="453" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="74" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <!-- 相邻异或符号 -->
  <text x="196" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">=</text>
  <text x="258" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≠</text>
  <text x="320" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">=</text>
  <text x="382" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">=</text>
  <text x="444" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≠</text>

  <!-- 连续段括号 -->
  <path d="M143,92 C160,104 230,104 247,92" stroke="#8a6d1f" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="195" y="120" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">段1（值1）</text>
  <path d="M267,92 C300,104 378,104 411,92" stroke="#8a6d1f" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="339" y="120" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">段2（值2）</text>
  <path d="M453,92 C458,104 492,104 497,92" stroke="#8a6d1f" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="475" y="120" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">段3</text>

  <!-- 推导链 -->
  <rect x="60" y="140" width="250" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="163" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">x ⊕ y 逐位比较</text>
  <text x="185" y="183" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">结果为 0 ⟺ 每个二进制位都相同</text>
  <path d="M316,168 L348,168" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="354" y="140" width="226" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="467" y="163" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">x 与 y 完全相同</text>
  <text x="467" y="183" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">即 x = y</text>

  <!-- 约束转化 -->
  <rect x="60" y="210" width="520" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="230" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">约束转化：「相邻异或非零」=「相邻元素互不相等」</text>
  <text x="320" y="250" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">只需消灭相邻相等对；不相邻的重复值（如 1,2,1 中的两个 1）不用管</text>

  <!-- 每段保留策略 -->
  <rect x="60" y="276" width="160" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="294" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">段1 长 2</text>
  <text x="140" y="311" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">留 1 删 1</text>
  <rect x="240" y="276" width="160" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="294" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">段2 长 3</text>
  <text x="320" y="311" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">留 1 删 2</text>
  <rect x="420" y="276" width="160" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="294" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">段3 长 1</text>
  <text x="500" y="311" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">留 1 删 0</text>

  <!-- 最终答案 -->
  <rect x="60" y="338" width="520" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="357" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">答案 = Σ(段长 − 1) = 相邻相等对数</text>
  <text x="320" y="375" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">本例 = 1 + 2 + 0 = 3</text>

  <!-- 图例 -->
  <text x="140" y="404" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">= 相邻异或为 0</text>
  <text x="320" y="404" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">≠ 相邻异或非零</text>
  <text x="500" y="404" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">每段只留 1 个</text>
</svg>
