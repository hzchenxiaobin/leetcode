<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：s = "leetcode", k = 2</text>
  <path d="M 190 42 Q 340 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g font-size="16" fill="#333" font-family="monospace" text-anchor="middle" font-weight="bold">
    <g filter="url(#sk)"><rect x="80" y="62" width="56" height="38" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="108" y="87">l</text>
    <g filter="url(#sk)"><rect x="146" y="62" width="56" height="38" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="174" y="87">e</text>
    <g filter="url(#sk)"><rect x="212" y="62" width="56" height="38" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="240" y="87">e</text>
    <g filter="url(#sk)"><rect x="278" y="62" width="56" height="38" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="306" y="87">t</text>
    <g filter="url(#sk)"><rect x="344" y="62" width="56" height="38" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="372" y="87">c</text>
    <g filter="url(#sk)"><rect x="410" y="62" width="56" height="38" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="438" y="87">o</text>
    <g filter="url(#sk)"><rect x="476" y="62" width="56" height="38" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="504" y="87">d</text>
    <g filter="url(#sk)"><rect x="542" y="62" width="56" height="38" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g><text x="570" y="87">e</text>
  </g>

  <g font-size="12.5" fill="#7a5415" font-family="monospace" text-anchor="middle" font-weight="bold">
    <text x="108" y="124">12</text>
    <text x="174" y="124">5</text>
    <text x="240" y="124">5</text>
    <text x="306" y="124">20</text>
    <text x="372" y="124">3</text>
    <text x="438" y="124">15</text>
    <text x="504" y="124">4</text>
    <text x="570" y="124">5</text>
  </g>
  <text x="46" y="124" font-size="10.5" fill="#c98a2b" text-anchor="end">val</text>

  <g font-size="13.5" fill="#3a6e3a" font-family="monospace" text-anchor="middle" font-weight="bold">
    <text x="108" y="156">3</text>
    <text x="174" y="156">5</text>
    <text x="240" y="156">5</text>
    <text x="306" y="156">2</text>
    <text x="372" y="156">3</text>
    <text x="438" y="156">6</text>
    <text x="504" y="156">4</text>
    <text x="570" y="156">5</text>
  </g>
  <text x="46" y="156" font-size="10.5" fill="#4a8e4a" text-anchor="end">数位和</text>

  <path d="M 108 164 Q 108 184 200 192" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arG)"/>
  <path d="M 570 164 Q 570 184 478 192" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arG)"/>

  <g filter="url(#sk)">
    <rect x="170" y="196" width="340" height="46" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="340" y="225" text-anchor="middle" font-size="15" fill="#2f5d2f" font-family="monospace" font-weight="bold">R₁ = 3+5+5+2+3+6+4+5 = 33</text>

  <path d="M 340 242 L 340 264" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="170" y="266" width="340" height="46" rx="8" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="340" y="288" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">转换 #2（k = 2，最后一轮）</text>
  <text x="340" y="304" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace" font-weight="bold">R₂ = digit_sum(33) = 3 + 3 = 6</text>

  <path d="M 340 312 L 340 332" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="240" y="334" width="200" height="42" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="340" y="361" text-anchor="middle" font-size="17" fill="#7a5415" font-family="monospace" font-weight="bold">返回 6 ✓</text>

  <g filter="url(#sk)">
    <rect x="40" y="398" width="600" height="52" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="340" y="419" text-anchor="middle" font-size="11.5" fill="#8f6b1f" font-family="monospace">对照暴力路径：拼接 "12552031545" → 1+2+5+5+2+0+3+1+5+4+5 = 33 → 3+3 = 6</text>
  <text x="340" y="438" text-anchor="middle" font-size="11" fill="#888">两条路径结果一致；加法性路径全程未构造 11 位大数，R 最大只到 33。</text>
</svg>
