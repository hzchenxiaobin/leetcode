<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 404" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-8%" width="110%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="660" height="404" fill="#fafafa"/>
  <text x="330" y="28" font-size="14" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：一次扫描累计缝隙坐标，再取最大频次</text>
  <rect x="124" y="52" width="420" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="140" y="78" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 读入墙：n = wall.size()，哈希表 cnt 置空</text>
  <rect x="124" y="116" width="420" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="140" y="142" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 逐行扫描 row，令 pos = 0</text>
  <rect x="124" y="174" width="420" height="40" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="140" y="199" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ for j = 0 .. row.size()−2：pos += row[j]; cnt[pos]++</text>
  <rect x="124" y="240" width="420" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="140" y="266" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">④ maxc = max(cnt.values())，cnt 空则为 0</text>
  <rect x="124" y="306" width="420" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="140" y="332" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ 返回 n − maxc</text>
  <path d="M 334 96 L 334 114" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 334 160 L 334 172" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 334 214 L 334 238" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 334 284 L 334 304" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 124 196 L 64 196 L 64 138 L 122 138" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="172" font-size="9.5" fill="#446688" text-anchor="end" filter="url(#rough2)">每行</text>
  <text x="552" y="170" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">跳过最后一块砖</text>
  <text x="552" y="185" font-size="9.8" fill="#888" filter="url(#rough2)">其右边界 = total</text>
  <text x="552" y="199" font-size="9.8" fill="#888" filter="url(#rough2)">属墙边缘，不能画线</text>
  <text x="552" y="74" font-size="9.8" fill="#888" filter="url(#rough2)">单行也可能只有</text>
  <text x="552" y="88" font-size="9.8" fill="#888" filter="url(#rough2)">1 块砖 → 无缝隙</text>
  <rect x="58" y="366" width="544" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="330" y="387" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">时间 O(Σ 砖块数)，空间 O(不同缝隙坐标数)，各 ≤ 2×10⁴</text>
</svg>
