<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">演算：num = "1101111" 的前缀尝试</text>

  <g filter="url(#rough2)">
    <text x="34" y="56" font-size="11" fill="#666">前两块</text>
    <text x="170" y="56" font-size="11" fill="#666">need</text>
    <text x="250" y="56" font-size="11" fill="#666">下一块</text>
    <text x="380" y="56" font-size="11" fill="#666">结果</text>

    <rect x="30" y="64" width="460" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="34" y="83" font-size="11" fill="#8a3020">1, 1</text>
    <text x="170" y="83" font-size="11" fill="#8a3020">2</text>
    <text x="250" y="83" font-size="11" fill="#8a3020">"0" → 0</text>
    <text x="380" y="83" font-size="11" fill="#8a3020">0 &lt; 2 且无法再加长 → 失败</text>

    <rect x="30" y="96" width="460" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="34" y="115" font-size="11" fill="#8a3020">1, 10</text>
    <text x="170" y="115" font-size="11" fill="#8a3020">11</text>
    <text x="250" y="115" font-size="11" fill="#8a3020">"11" → 11</text>
    <text x="380" y="115" font-size="11" fill="#8a3020">need=21，剩余 "11" &lt; 21 → 失败</text>

    <rect x="30" y="128" width="460" height="28" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="34" y="147" font-size="11" fill="#8a3020">1, 101</text>
    <text x="170" y="147" font-size="11" fill="#8a3020">102</text>
    <text x="250" y="147" font-size="11" fill="#8a3020">"111" → 111</text>
    <text x="380" y="147" font-size="11" fill="#8a3020">111 &gt; 102 → 失败</text>

    <rect x="30" y="160" width="460" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="34" y="179" font-size="11" fill="#2f5527">11, 0</text>
    <text x="170" y="179" font-size="11" fill="#2f5527">11</text>
    <text x="250" y="179" font-size="11" fill="#2f5527">"11" → 11</text>
    <text x="380" y="179" font-size="11" fill="#2f5527">继续，need=11</text>

    <rect x="30" y="192" width="460" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="34" y="211" font-size="11" fill="#2f5527">11, 0, 11</text>
    <text x="170" y="211" font-size="11" fill="#2f5527">11</text>
    <text x="250" y="211" font-size="11" fill="#2f5527">"11" → 11</text>
    <text x="380" y="211" font-size="11" fill="#2f5527">用完且块数 4 ≥ 3 ✓</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="240" width="380" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="260" y="264" text-anchor="middle" font-size="13" fill="#7a5a10">答案：[11, 0, 11, 11]</text>
    <text x="260" y="284" text-anchor="middle" font-size="11" fill="#7a5a10">11+0=11，0+11=11，11+11=22（恰好用完）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="306" width="380" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="330" text-anchor="middle" font-size="12" fill="#2f4a66">另一组合法解 [110, 1, 111] 同样被搜索到</text>
    <text x="260" y="350" text-anchor="middle" font-size="12" fill="#2f4a66">题目只要求返回任意一组</text>
  </g>
</svg>
