<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：text = "loonbalxballpoon"</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">先把 16 个字符逐个归档到计数表，再对 5 个字母算“能支撑几份”</text>

  <!-- 字符串 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="13">
    <rect x="76" y="60" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="89" y="78" fill="#8a6a20">l</text>
    <rect x="104" y="60" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="117" y="78" fill="#8a3a36">o</text>
    <rect x="132" y="60" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="145" y="78" fill="#8a3a36">o</text>
    <rect x="160" y="60" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="173" y="78" fill="#3a5a30">n</text>
    <rect x="188" y="60" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="201" y="78" fill="#2f4460">b</text>
    <rect x="216" y="60" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="229" y="78" fill="#2f4460">a</text>
    <rect x="244" y="60" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="257" y="78" fill="#8a6a20">l</text>
    <rect x="272" y="60" width="26" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="285" y="78" fill="#999">x</text>
    <rect x="300" y="60" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="313" y="78" fill="#2f4460">b</text>
    <rect x="328" y="60" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="341" y="78" fill="#2f4460">a</text>
    <rect x="356" y="60" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="369" y="78" fill="#8a6a20">l</text>
    <rect x="384" y="60" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="397" y="78" fill="#8a6a20">l</text>
    <rect x="412" y="60" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="425" y="78" fill="#8a3a36">o</text>
    <rect x="440" y="60" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="453" y="78" fill="#8a3a36">o</text>
    <rect x="468" y="60" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="481" y="78" fill="#3a5a30">n</text>
  </g>
  <text x="280" y="102" text-anchor="middle" font-size="10" fill="#888">x 是无关字母，直接丢弃；l 与 o 各出现 4 次，b / a / n 各 2 次</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="80" y="116" width="400" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="110" y="136" font-size="11" fill="#2f4460">字母 x</text>
    <text x="200" y="136" font-size="11" fill="#2f4460">cnt[x]</text>
    <text x="290" y="136" font-size="11" fill="#2f4460">need[x]</text>
    <text x="392" y="136" font-size="11" fill="#2f4460">⌊cnt/need⌋</text>
  </g>

  <!-- 数据行 -->
  <g filter="url(#rough2)" font-size="11.5">
    <rect x="80" y="150" width="400" height="28" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
    <text x="110" y="169" fill="#333">b</text>
    <text x="200" y="169" fill="#333">2</text>
    <text x="290" y="169" fill="#333">1</text>
    <text x="392" y="169" fill="#333">2</text>

    <rect x="80" y="182" width="400" height="28" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
    <text x="110" y="201" fill="#333">a</text>
    <text x="200" y="201" fill="#333">2</text>
    <text x="290" y="201" fill="#333">1</text>
    <text x="392" y="201" fill="#333">2</text>

    <rect x="80" y="214" width="400" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="110" y="233" fill="#8a6a20">l</text>
    <text x="200" y="233" fill="#8a6a20">4</text>
    <text x="290" y="233" fill="#8a6a20">2</text>
    <text x="392" y="233" fill="#8a6a20">2</text>

    <rect x="80" y="246" width="400" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="110" y="265" fill="#8a6a20">o</text>
    <text x="200" y="265" fill="#8a6a20">4</text>
    <text x="290" y="265" fill="#8a6a20">2</text>
    <text x="392" y="265" fill="#8a6a20">2</text>

    <rect x="80" y="278" width="400" height="28" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
    <text x="110" y="297" fill="#333">n</text>
    <text x="200" y="297" fill="#333">2</text>
    <text x="290" y="297" fill="#333">1</text>
    <text x="392" y="297" fill="#333">2</text>
  </g>

  <path d="M 480 320 L 480 332" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="336" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="17" filter="url(#rough2)"/>
  <text x="290" y="358" text-anchor="middle" font-size="12" fill="#3a5a30">min(2, 2, 2, 2, 2) = 2</text>

  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#999">5 个字母都能支撑 2 份，故最多拼出 2 个 "balloon"（与官方示例一致）</text>
</svg>
