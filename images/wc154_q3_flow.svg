<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次前缀和遍历 + 两次 Kadane</text>

  <rect x="140" y="36" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="265" y="58" text-anchor="middle" font-size="11" fill="#2f4460" filter="url(#rough2)">输入 arr 与 k（n = arr.length）</text>

  <path d="M 265 70 L 265 86" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="88" width="250" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="265" y="110" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">total = Σ arr[i]，best₁ = Kadane(arr)</text>

  <path d="M 265 122 L 265 138" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="265,140 345,180 265,220 185,180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="184" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">k == 1 ?</text>

  <path d="M 345 180 L 396 180" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="400" y="152" width="205" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="502" y="176" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">直接返回 best₁</text>
  <text x="502" y="194" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">（模 10⁹+7）</text>

  <path d="M 265 220 L 265 238" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="234" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="140" y="240" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="265" y="262" text-anchor="middle" font-size="11" fill="#2f4460" filter="url(#rough2)">ans = best₂ = Kadane(arr 串两份)</text>

  <path d="M 265 274 L 265 290" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="265,292 345,332 265,372 185,332" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="336" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">total &gt; 0 ?</text>

  <path d="M 345 332 L 396 332" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="400" y="298" width="205" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="502" y="320" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">ans = max(ans,</text>
  <text x="502" y="338" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">pre + suf +</text>
  <text x="502" y="356" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">(k−2)·total)</text>

  <path d="M 502 368 L 502 408 L 265 408" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <path d="M 265 372 L 265 418" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="400" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="140" y="420" width="250" height="38" fill="#f2f2f2" stroke="#666" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="265" y="444" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">返回 ans mod (10⁹+7)</text>
</svg>
