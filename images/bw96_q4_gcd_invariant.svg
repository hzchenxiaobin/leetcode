<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">gcd 不变量：只能乘 2，奇数部分永远是 1</text>

  <!-- 左：操作对 gcd 的影响 -->
  <g filter="url(#rough2)">
    <rect x="40" y="56" width="230" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <rect x="40" y="118" width="230" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <rect x="40" y="180" width="230" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <rect x="40" y="242" width="230" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" text-anchor="middle">
    <text x="155" y="78" fill="#2d5a22">(x, y−x) / (x−y, y)</text>
    <text x="155" y="98" fill="#2d5a22">gcd 完全不变（辗转相减）</text>
    <text x="155" y="140" fill="#2d5a22">(x+y, y) / (x, x+y)（反向）</text>
    <text x="155" y="160" fill="#2d5a22">gcd 同样不变</text>
    <text x="155" y="202" fill="#7a5c1e">(2x, y) / (x, 2y)</text>
    <text x="155" y="222" fill="#7a5c1e">gcd ∈ {g, 2g}（至多乘 2）</text>
    <text x="155" y="264" fill="#7a5c1e">(x/2, y)（x 偶）</text>
    <text x="155" y="284" fill="#7a5c1e">奇素因子不增不减</text>
  </g>

  <!-- 右：可达集合 -->
  <text x="425" y="76" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">从 gcd(1,1)=1 出发</text>
  <g filter="url(#rough2)">
    <ellipse cx="425" cy="118" rx="70" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <ellipse cx="425" cy="170" rx="70" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <ellipse cx="425" cy="222" rx="70" ry="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="425" y="122">gcd = 1</text>
    <text x="425" y="174">gcd = 2</text>
    <text x="425" y="226">gcd = 4 …</text>
  </g>
  <path d="M 425 142 L 425 146" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 425 194 L 425 198" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="180" font-size="11.5" fill="#666" filter="url(#rough2)">翻倍 ×2</text>
  <text x="350" y="180" font-size="11.5" fill="#666" filter="url(#rough2)">减半 ÷2</text>

  <!-- 门外点 -->
  <g filter="url(#rough2)">
    <rect x="330" y="258" width="190" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#b85450" text-anchor="middle">
    <text x="425" y="276">(6, 9)：gcd = 3</text>
    <text x="425" y="292">奇素因子 3 进不来 → false</text>
  </g>
  <path d="M 425 246 C 425 250, 425 252, 425 256" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判据 -->
  <rect x="60" y="326" width="440" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13.5" fill="#446688" text-anchor="middle">
    <text x="280" y="347" font-weight="bold">可达 ⟺ gcd(targetX, targetY) 是 2 的幂（含 1）</text>
    <text x="280" y="368">判定：g = gcd(x, y)；返回 (g &amp; (g−1)) == 0</text>
  </g>
</svg>
