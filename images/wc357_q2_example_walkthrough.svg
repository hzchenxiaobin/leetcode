<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="440" fill="#fdfcf7"/>

  <!-- ===== Panel 1: example 2 (false) ===== -->
  <text x="60" y="40" font-size="13.5" font-weight="bold" fill="#2b2b2b">示例 2：nums = [2, 1, 3]，m = 5 → false</text>
  <g filter="url(#sk)">
    <rect x="70" y="56" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="128" y="56" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="186" y="56" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="92" y="76" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <text x="150" y="76" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>
  <text x="208" y="76" text-anchor="middle" font-size="12" fill="#2b2b2b">3</text>
  <path d="M 78 94 Q 121 108 164 94" stroke="#7a7a7a" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="121" y="126" text-anchor="middle" font-size="11" fill="#b85450">2+1 = 3 &lt; 5 ✗</text>
  <path d="M 136 98 Q 179 124 222 98" stroke="#7a7a7a" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="179" y="146" text-anchor="middle" font-size="11" fill="#b85450">1+3 = 4 &lt; 5 ✗</text>
  <g filter="url(#sk)">
    <rect x="316" y="66" width="214" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="423" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a2f2c">没有任何「好相邻对」</text>
  <text x="423" y="106" text-anchor="middle" font-size="11" fill="#7a2f2c">第一刀怎么切都违法 → false</text>
  <path d="M 40 172 Q 280 180 520 172" stroke="#7a7a7a" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 2: example 3 (true) ===== -->
  <text x="60" y="200" font-size="13.5" font-weight="bold" fill="#2b2b2b">示例 3：nums = [2, 3, 3, 2, 3]，m = 6 → true（锚点对 3 + 3 = 6 ≥ 6）</text>

  <!-- row 1 -->
  <text x="52" y="231" text-anchor="end" font-size="10.5" fill="#7a7a7a">第1刀</text>
  <g filter="url(#sk)">
    <rect x="60" y="216" width="30" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="104" y="216" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="138" y="216" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="172" y="216" width="30" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="206" y="216" width="30" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <rect x="95" y="213" width="5" height="28" rx="2" fill="#b85450" filter="url(#sk)"/>
  <text x="75" y="231" text-anchor="middle" font-size="11.5" fill="#2b2b2b">2</text>
  <text x="119" y="231" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="153" y="231" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="187" y="231" text-anchor="middle" font-size="11.5" fill="#2b2b2b">2</text>
  <text x="221" y="231" text-anchor="middle" font-size="11.5" fill="#2b2b2b">3</text>
  <text x="250" y="231" font-size="10.5" fill="#2b2b2b">[2] 长度 1 ✓ ｜ 剩余 [3,3,2,3] 和 11 ≥ 6 ✓</text>

  <!-- row 2 -->
  <text x="52" y="271" text-anchor="end" font-size="10.5" fill="#7a7a7a">第2刀</text>
  <g filter="url(#sk)">
    <rect x="60" y="256" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="94" y="256" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="128" y="256" width="30" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="172" y="256" width="30" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <rect x="163" y="253" width="5" height="28" rx="2" fill="#b85450" filter="url(#sk)"/>
  <text x="75" y="271" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="109" y="271" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="143" y="271" text-anchor="middle" font-size="11.5" fill="#2b2b2b">2</text>
  <text x="187" y="271" text-anchor="middle" font-size="11.5" fill="#2b2b2b">3</text>
  <text x="250" y="271" font-size="10.5" fill="#2b2b2b">[3] 长度 1 ✓ ｜ 剩余 [3,3,2] 和 8 ≥ 6 ✓</text>

  <!-- row 3 -->
  <text x="52" y="311" text-anchor="end" font-size="10.5" fill="#7a7a7a">第3刀</text>
  <g filter="url(#sk)">
    <rect x="60" y="296" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="94" y="296" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="138" y="296" width="30" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <rect x="129" y="293" width="5" height="28" rx="2" fill="#b85450" filter="url(#sk)"/>
  <text x="75" y="311" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="109" y="311" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="153" y="311" text-anchor="middle" font-size="11.5" fill="#2b2b2b">2</text>
  <text x="250" y="311" font-size="10.5" fill="#2b2b2b">[2] 长度 1 ✓ ｜ 剩余 [3,3] 和 6 ≥ 6 ✓</text>

  <!-- row 4 -->
  <text x="52" y="351" text-anchor="end" font-size="10.5" fill="#7a7a7a">第4刀</text>
  <g filter="url(#sk)">
    <rect x="60" y="336" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="104" y="336" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <rect x="95" y="333" width="5" height="28" rx="2" fill="#b85450" filter="url(#sk)"/>
  <text x="75" y="351" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="119" y="351" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="250" y="351" font-size="10.5" fill="#2b2b2b">[3] + [3]：两个长度 1 ✓ —— 拆分完成 → true</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="372" width="480" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="280" y="388" text-anchor="middle" font-size="10.5" fill="#2b5a1e">前三刀的剩余段都含锚点对 (3,3)，其和 ≥ 6 → 每刀切出的两段都是好数组；</text>
  <text x="280" y="404" text-anchor="middle" font-size="10.5" fill="#2b5a1e">最后一刀 [3,3] 一分为二 —— 这就是「充分性构造」的执行轨迹。</text>
  <text x="280" y="428" text-anchor="middle" font-size="10" fill="#7a7a7a">对比示例 2：相邻对之和 3、4 全 &lt; 5，没有锚点，无从下刀。</text>
</svg>
