<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="429" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：dp 表与末步 i = 7 的 j 扫描</text>
  <path d="M 150 36 Q 340 44 530 36" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="340" y="54" text-anchor="middle" font-size="12" fill="#7a7a7a" font-style="italic" filter="url(#sk)">nums = [1,2,1,2,1,3,3]，k = 2，n = 7 —— dp[i] = min(dp[j] + k + (i−j) − ones)</text>

  <!-- dp table -->
  <g font-size="10" text-anchor="middle" fill="#7a7a7a" filter="url(#sk)">
    <text x="158" y="70">i=0</text><text x="210" y="70">1</text><text x="262" y="70">2</text><text x="314" y="70">3</text>
    <text x="366" y="70">4</text><text x="418" y="70">5</text><text x="470" y="70">6</text><text x="522" y="70">7</text>
  </g>
  <g filter="url(#sk)">
    <rect x="135" y="74" width="46" height="32" rx="5" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="187" y="74" width="46" height="32" rx="5" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="239" y="74" width="46" height="32" rx="5" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="291" y="74" width="46" height="32" rx="5" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="343" y="74" width="46" height="32" rx="5" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="395" y="74" width="46" height="32" rx="5" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="447" y="74" width="46" height="32" rx="5" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="499" y="74" width="46" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#2b2b2b" filter="url(#sk)">
    <text x="158" y="95">0</text><text x="210" y="95">2</text><text x="262" y="95">2</text><text x="314" y="95">4</text>
    <text x="366" y="95">4</text><text x="418" y="95">6</text><text x="470" y="95">6</text><text x="522" y="95" fill="#d6a040">8</text>
  </g>
  <text x="128" y="95" text-anchor="end" font-size="11" fill="#7a7a7a" filter="url(#sk)">dp[i]</text>
  <text x="340" y="126" text-anchor="middle" font-size="11" fill="#7a7a7a" font-style="italic" filter="url(#sk)">逐列递推，dp[7] = 8 即答案；下面把末步 i = 7 的 j 扫描摊开</text>

  <!-- j-scan table -->
  <g filter="url(#sk)">
    <rect x="60" y="142" width="560" height="28" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="11.5" font-weight="bold" text-anchor="middle" fill="#446688" filter="url(#sk)">
    <text x="78" y="160">j</text>
    <text x="194" y="160">窗口 [j..6]</text>
    <text x="316" y="160">ones</text>
    <text x="358" y="160">L</text>
    <text x="424" y="160">trimmed = L−U</text>
    <text x="498" y="160">dp[j]</text>
    <text x="572" y="160">dp[j]+k+trim</text>
  </g>
  <!-- rows -->
  <g filter="url(#sk)">
    <rect x="60" y="170" width="560" height="32" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="60" y="202" width="560" height="32" fill="#f7f7f5" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="60" y="234" width="560" height="32" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="60" y="266" width="560" height="32" fill="#f7f7f5" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="60" y="298" width="560" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="60" y="330" width="560" height="32" fill="#f7f7f5" stroke="#c9c9c9" stroke-width="1"/>
    <rect x="60" y="362" width="560" height="32" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#2b2b2b" filter="url(#sk)">
    <text x="78" y="190">6</text><text x="194" y="190">[3]</text><text x="316" y="190">1</text><text x="358" y="190">1</text><text x="424" y="190">0</text><text x="498" y="190">6</text><text x="572" y="190">6+2+0 = 8</text>
    <text x="78" y="222">5</text><text x="194" y="222">[3,3]</text><text x="316" y="222">0</text><text x="358" y="222">2</text><text x="424" y="222">2</text><text x="498" y="222">6</text><text x="572" y="222">10</text>
    <text x="78" y="254">4</text><text x="194" y="254">[1,3,3]</text><text x="316" y="254">1</text><text x="358" y="254">3</text><text x="424" y="254">2</text><text x="498" y="254">4</text><text x="572" y="254">8</text>
    <text x="78" y="286">3</text><text x="194" y="286">[2,1,3,3]</text><text x="316" y="286">2</text><text x="358" y="286">4</text><text x="424" y="286">2</text><text x="498" y="286">4</text><text x="572" y="286">8</text>
    <text x="78" y="318" font-weight="bold" fill="#d6a040">2</text><text x="194" y="318" font-weight="bold">[1,2,1,3,3]</text><text x="316" y="318" font-weight="bold">1</text><text x="358" y="318" font-weight="bold">5</text><text x="424" y="318" font-weight="bold">4</text><text x="498" y="318" font-weight="bold">2</text><text x="572" y="318" font-weight="bold" fill="#d6a040">2+2+4 = 8</text>
    <text x="78" y="350">1</text><text x="194" y="350">[2,1,2,1,3,3]</text><text x="316" y="350">0</text><text x="358" y="350">6</text><text x="424" y="350">6</text><text x="498" y="350">2</text><text x="572" y="350">10</text>
    <text x="78" y="382">0</text><text x="194" y="382">[1,2,1,2,1,3,3]</text><text x="316" y="382">0</text><text x="358" y="382">7</text><text x="424" y="382">7</text><text x="498" y="382">0</text><text x="572" y="382">9</text>
  </g>
  <text x="628" y="318" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#sk)">← 命中</text>
  <text x="628" y="332" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#sk)">最优</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="416" width="560" height="38" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="340" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">最优切分：[1,2]（代价 2）+ [1,2,1,3,3]（重要性 2 + 4 = 6）→ 总代价 8 ✓</text>
</svg>
