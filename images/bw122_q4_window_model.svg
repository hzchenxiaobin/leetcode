<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="344" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">枚举第二段的起点 s：窗口内取 k−2 个最小值</text>
  <rect x="56" y="78" width="66" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="89.0" y="107.0" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="89" y="142" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="128" y="78" width="66" height="46" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="161.0" y="107.0" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="161" y="142" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <rect x="200" y="78" width="66" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="233.0" y="107.0" text-anchor="middle" font-size="15" fill="#7a5a10" filter="url(#rough2)">2</text>
  <text x="233" y="142" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <rect x="272" y="78" width="66" height="46" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="305.0" y="107.0" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <text x="305" y="142" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <rect x="344" y="78" width="66" height="46" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="377.0" y="107.0" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="377" y="142" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <rect x="416" y="78" width="66" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="449.0" y="107.0" text-anchor="middle" font-size="15" fill="#7a3030" filter="url(#rough2)">2</text>
  <text x="449" y="142" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <rect x="198" y="68" width="212" height="66" rx="8" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <text x="304" y="62" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">窗口 [s+1, min(s+dist, n−1)]，dist = 3</text>
  <path d="M89,150 L89,168" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M233,150 L233,168" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M449,150 L449,168" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="89" y="186" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">nums[0]</text>
  <text x="233" y="186" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">nums[s = 2]</text>
  <text x="449" y="186" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">窗口内最小 2</text>
  <rect x="50" y="200" width="460" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="11.5" fill="#1c3a1c" filter="url(#rough2)">总代价 = nums[0] + nums[s] + (窗口内 k−2 小之和) = 1 + 2 + 2 = 5</text>
  <rect x="50" y="252" width="460" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">最优解的第一个切点一定被枚举到，它的其余切点必落在自己的窗口内；</text>
  <text x="280" y="296" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">窗口内取最小的 k−2 个不会让答案变差 → 只需对每个 s 求「k−2 小之和」</text>
  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">注意 s 本身不算进窗口（切点必须严格递增）</text>
</svg>
