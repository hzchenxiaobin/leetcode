<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="81"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：dp[i] 按位置推进，订单按终点分组</text>

  <!-- 位置轴 1..n -->
  <line x1="70" y1="200" x2="500" y2="200" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="70" y="222">1</text><text x="138" y="222">2</text><text x="206" y="222">3</text>
    <text x="274" y="222">…</text><text x="342" y="222">i−1</text><text x="410" y="222">i</text>
    <text x="478" y="222">n</text>
  </g>
  <g filter="url(#rough2)">
    <circle cx="70" cy="200" r="5" fill="#446688"/>
    <circle cx="138" cy="200" r="5" fill="#446688"/>
    <circle cx="206" cy="200" r="5" fill="#446688"/>
    <circle cx="342" cy="200" r="5" fill="#446688"/>
    <circle cx="410" cy="200" r="6" fill="#b85450"/>
    <circle cx="478" cy="200" r="5" fill="#446688"/>
  </g>

  <!-- 订单区间示例 -->
  <path d="M 70 160 C 120 130, 330 130, 380 160" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="225" y="128" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">订单 (s, i, tip)：dp[i] = dp[s] + (i−s+tip)</text>
  <path d="M 206 176 C 240 160, 370 160, 410 178" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="310" y="152" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">更早的单在 s' ≤ s 结束，可链式衔接</text>

  <!-- 空驶转移 -->
  <path d="M 342 190 C 360 176, 390 176, 408 190" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="376" y="172" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">dp[i] = dp[i−1]（空驶）</text>

  <!-- endAt 分桶示意 -->
  <text x="70" y="262" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">endAt[e] 分桶：</text>
  <g filter="url(#rough2)">
    <rect x="70" y="274" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="210" y="274" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <rect x="350" y="274" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="130" y="292">endAt[i−1]：空</text><text x="130" y="308">无订单</text>
    <text x="270" y="292">endAt[i]：(s,w)…</text><text x="270" y="308">本位置要考察的</text>
    <text x="420" y="292">endAt[e&gt;i]</text><text x="420" y="308">之后再说</text>
  </g>

  <!-- 关键提示 -->
  <rect x="60" y="336" width="440" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">转移用 dp[s] 而非 dp[s−1]：端点相接合法</text>
  <text x="280" y="376" text-anchor="middle" font-size="13" fill="#7a2e2a" filter="url(#rough2)">（在 s 放下乘客、同一地点立刻接下一位）</text>
</svg>
