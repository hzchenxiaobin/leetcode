<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="510" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次扫描，两个状态滚动更新</text>
  <text x="300" y="49" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">关键顺序：先用旧 keep 更新 dele，再更新 keep</text>

  <rect x="150" y="68" width="300" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="88" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">初始化（只看第一个元素）</text>
  <text x="300" y="107" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">keep = arr[0]，dele = −∞，ans = arr[0]</text>

  <path d="M 300 118 L 300 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="142" width="340" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="164" text-anchor="middle" font-size="11.5" fill="#3a6a2c" font-weight="bold" filter="url(#rough2)">① dele = max(dele + x, keep)</text>
  <text x="300" y="184" text-anchor="middle" font-size="9.5" fill="#5c7a50" filter="url(#rough2)">沿用已删状态 / 在这一步把 x 删掉（用旧 keep）</text>

  <path d="M 300 198 L 300 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="218" width="340" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="240" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">② keep = max(keep + x, x)</text>
  <text x="300" y="260" text-anchor="middle" font-size="9.5" fill="#50718c" filter="url(#rough2)">接上 x 继续 / 从 x 另起一段（Kadane）</text>

  <path d="M 300 274 L 300 290" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="294" width="340" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="316" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ ans = max(ans, keep, dele)</text>
  <text x="300" y="335" text-anchor="middle" font-size="9.5" fill="#8a7a58" filter="url(#rough2)">两种状态都要参与，答案可能停在任意位置</text>

  <path d="M 300 344 L 300 362" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="366" width="240" height="44" fill="#ffffff" stroke="#666" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="384" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">还有下一个元素吗？</text>
  <text x="300" y="401" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">循环 i = 1 … n−1</text>

  <path d="M 420 388 L 520 388 L 520 170 L 476 170" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="380" font-size="9.5" fill="#446688" filter="url(#rough2)">有：i++ 回到 ①</text>

  <path d="M 300 410 L 300 430" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="426" font-size="9.5" fill="#888" filter="url(#rough2)">没有</text>

  <rect x="220" y="434" width="160" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="456" text-anchor="middle" font-size="12.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <text x="300" y="474" text-anchor="middle" font-size="9" fill="#a86a66" filter="url(#rough2)">可以是任何位置的最优值</text>
</svg>
