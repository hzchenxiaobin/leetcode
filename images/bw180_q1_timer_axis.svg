<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 356" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="356" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">交通信号灯：三个离散条件 + 一个兜底</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">timer = 0 → Green；timer = 30 → Orange；30 &lt; timer ≤ 90 → Red；其余 Invalid</text>
  <path d="M 56 132 L 512 132" stroke="#bbb" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <rect x="56" y="116" width="14" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="116" width="14" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="204" y="116" width="282" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <path d="M 60.0 106 L 60.0 158" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="176" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <path d="M 171.0 106 L 171.0 158" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="171.0" y="176" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">30</text>
  <path d="M 393.0 106 L 393.0 158" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="393.0" y="176" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">90</text>
  <path d="M 504.0 106 L 504.0 158" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="504.0" y="176" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">120</text>
  <text x="63" y="98" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">Green</text>
  <text x="183" y="98" text-anchor="middle" font-size="9.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">Orange</text>
  <text x="345" y="98" text-anchor="middle" font-size="9.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">Red（30 &lt; timer ≤ 90）</text>
  <text x="280" y="198" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0 到 90 之外的取值、以及 1…29、31…? 等未覆盖的点一律 Invalid</text>
  <rect x="36" y="216" width="236" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="236" text-anchor="start" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">命中即返回</text>
  <text x="48" y="252" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">三个条件互斥（0、30、(30,90]）</text>
  <text x="48" y="268" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">所以按顺序判断即可，先判先返回</text>
  <rect x="288" y="216" width="236" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="236" text-anchor="start" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">常见漏判</text>
  <text x="300" y="252" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">timer = 30 既不是 Red 也不是 Green；</text>
  <text x="300" y="268" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">timer = 0 不是「≤ 30 就一直绿」</text>
  <rect x="36" y="288" width="488" height="52" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="308" text-anchor="start" font-size="11.5" fill="#666666" font-weight="bold" filter="url(#rough2)">本题是纯分类讨论</text>
  <text x="48" y="325" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">没有循环、没有状态机：题目给的规则是「当前剩余时间 → 当前颜色」的静态映射。</text>
</svg>
