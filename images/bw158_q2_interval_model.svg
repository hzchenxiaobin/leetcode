<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">两种交易统一成「同一条公式」：|p[j] - p[i]|</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">普通交易 = 低价买高价卖；做空 = 高价卖低价买回，收益都是价差绝对值</text>
  <text x="40" y="84" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">prices =</text>
  <rect x="120" y="62" width="46" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="143.0" y="88.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="143.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="168" y="62" width="46" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="191.0" y="88.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="191.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="216" y="62" width="46" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="239.0" y="88.0" font-size="14" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="239.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="264" y="62" width="46" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="287.0" y="88.0" font-size="14" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="287.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="312" y="62" width="46" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="335.0" y="88.0" font-size="14" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="335.0" y="120" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="40" y="140" width="250" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="165.0" y="166.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">普通交易 [0, 2]：9 - 1 = 8</text>
  <text x="165.0" y="182.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">（第 0 天买、第 2 天卖）</text>
  <rect x="310" y="140" width="250" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435.0" y="166.0" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">做空交易 [3, 4]：8 - 2 = 6</text>
  <text x="435.0" y="182.0" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">（第 3 天卖、第 4 天买回）</text>
  <rect x="40" y="220" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="242.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">合计 8 + 6 = 14：两段区间不相交，且「上一笔结束日 &lt; 下一笔开始日」</text>
  <text x="300.0" y="262.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">因此问题 = 选至多 k 个互不重叠的区间，使 Σ|p[j] - p[i]| 最大</text>
  <text x="40" y="316" font-size="10" fill="#999" text-anchor="start" filter="url(#rough2)">区间端点不能同日：上一笔在第 j 天结束，下一笔最早第 j+1 天开始</text>
</svg>
