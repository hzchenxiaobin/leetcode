<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">不变量：每个位置的值 = 一段包含它的连续区间的 gcd</text>
  <path d="M 140 40 Q 360 48 580 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== row 1: 初始 ===== -->
  <text x="60" y="66" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">① 初始</text>
  <g filter="url(#rough2)">
    <rect x="70"  y="72" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="130" y="72" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="190" y="72" width="52" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="96"  y="94" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">6</text>
  <text x="156" y="94" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">10</text>
  <text x="216" y="94" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">15</text>
  <g filter="url(#rough2)">
    <path d="M 74 114 Q 96 124 118 114" stroke="#7a8aa0" stroke-width="1.4" fill="none"/>
    <path d="M 134 114 Q 156 124 178 114" stroke="#7a8aa0" stroke-width="1.4" fill="none"/>
    <path d="M 194 114 Q 216 124 238 114" stroke="#7a8aa0" stroke-width="1.4" fill="none"/>
  </g>
  <text x="96"  y="134" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">支撑 {0}</text>
  <text x="156" y="134" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">支撑 {1}</text>
  <text x="216" y="134" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">支撑 {2}</text>
  <text x="300" y="90" font-size="11" fill="#555555" filter="url(#rough2)">初始时每个值的支撑区间是单点：</text>
  <text x="300" y="108" font-size="11" fill="#555555" filter="url(#rough2)">值 = 自身，无 1 也无路可走</text>

  <!-- transition 1 -->
  <text x="60" y="158" font-size="10.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">↓ 操作①：i=0，nums[1] ← gcd(6, 10) = 2</text>

  <!-- ===== row 2: 支撑并成 [0,1] ===== -->
  <text x="60" y="182" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">② 一次操作后</text>
  <g filter="url(#rough2)">
    <rect x="70"  y="188" width="52" height="34" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="130" y="188" width="52" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="190" y="188" width="52" height="34" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="96"  y="210" text-anchor="middle" font-size="12.5" fill="#aaaaaa" filter="url(#rough2)">6</text>
  <text x="156" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06820" filter="url(#rough2)">2</text>
  <text x="216" y="210" text-anchor="middle" font-size="12.5" fill="#aaaaaa" filter="url(#rough2)">15</text>
  <g filter="url(#rough2)">
    <path d="M 74 230 Q 115 244 232 230" stroke="#d6a040" stroke-width="1.8" fill="none"/>
  </g>
  <text x="153" y="252" text-anchor="middle" font-size="9.5" fill="#a07820" filter="url(#rough2)">支撑 [0,1]：gcd(6,10) = 2</text>
  <text x="300" y="198" font-size="11" fill="#555555" filter="url(#rough2)">新值 = 两个旧支撑区间的并的 gcd：</text>
  <text x="300" y="216" font-size="11" fill="#555555" filter="url(#rough2)">区间分别含 i 与 i+1，并起来必连续</text>

  <!-- transition 2 -->
  <text x="60" y="276" font-size="10.5" font-weight="bold" fill="#a07820" filter="url(#rough2)">↓ 操作②：i=1，nums[2] ← gcd(2, 15) = 1</text>

  <!-- ===== row 3: 支撑并成 [0,2]，第一个 1 ===== -->
  <text x="60" y="300" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">③ 第二个操作后</text>
  <g filter="url(#rough2)">
    <rect x="70"  y="306" width="52" height="34" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="130" y="306" width="52" height="34" rx="4" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="190" y="306" width="52" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="96"  y="328" text-anchor="middle" font-size="12.5" fill="#aaaaaa" filter="url(#rough2)">6</text>
  <text x="156" y="328" text-anchor="middle" font-size="12.5" fill="#aaaaaa" filter="url(#rough2)">2</text>
  <text x="216" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03450" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)">
    <path d="M 74 348 Q 115 364 232 348" stroke="#b85450" stroke-width="1.8" fill="none"/>
  </g>
  <text x="153" y="370" text-anchor="middle" font-size="9.5" fill="#b03450" filter="url(#rough2)">支撑 [0,2]：整段 gcd = 1 → 第一个 1！</text>
  <text x="300" y="316" font-size="11" fill="#555555" filter="url(#rough2)">值变 1 ⟺ 支撑区间的原始 gcd = 1</text>
  <text x="300" y="334" font-size="11" fill="#555555" filter="url(#rough2)">本例最短这样的子数组 [6,10,15] 长 3</text>
  <text x="300" y="352" font-size="11" fill="#555555" filter="url(#rough2)">故造出第一个 1 至少要 3−1 = 2 次</text>

  <!-- bottom summary -->
  <g filter="url(#rough2)">
    <rect x="50" y="390" width="620" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="360" y="413" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">支撑区间只增不减：造出 1 ⟺ 把一段 gcd 为 1 的连续子数组「浓缩」到一个位置</text>
</svg>
