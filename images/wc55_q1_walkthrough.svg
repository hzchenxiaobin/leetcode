<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：prices = [1, 3, 2, 8, 4, 9]，fee = 2</text>
  <text x="280" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">先用旧 cash 算出 hold，再用旧 hold 算出 cash</text>

  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="70" y="76" text-anchor="middle" font-size="9.5">天数</text>
    <text x="150" y="76" text-anchor="middle">1</text>
    <text x="218" y="76" text-anchor="middle">2</text>
    <text x="286" y="76" text-anchor="middle">3</text>
    <text x="354" y="76" text-anchor="middle">4</text>
    <text x="422" y="76" text-anchor="middle">5</text>
    <text x="490" y="76" text-anchor="middle">6</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <text x="70" y="111" font-size="10.5" fill="#8a6a20">p</text>
    <rect x="120" y="90" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="188" y="90" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="256" y="90" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="324" y="90" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="392" y="90" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="460" y="90" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="150" y="112" fill="#8a6a20">1</text>
    <text x="218" y="112" fill="#8a6a20">3</text>
    <text x="286" y="112" fill="#8a6a20">2</text>
    <text x="354" y="112" fill="#8a6a20">8</text>
    <text x="422" y="112" fill="#8a6a20">4</text>
    <text x="490" y="112" fill="#8a6a20">9</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <text x="70" y="153" font-size="10.5" fill="#3a4a66">hold</text>
    <rect x="120" y="132" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="188" y="132" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="256" y="132" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="324" y="132" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="392" y="132" width="60" height="34" fill="#e8f0fe" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="460" y="132" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="150" y="154" fill="#3a4a66">-3</text>
    <text x="218" y="154" fill="#3a4a66">-3</text>
    <text x="286" y="154" fill="#3a4a66">-3</text>
    <text x="354" y="154" fill="#3a4a66">-3</text>
    <text x="422" y="154" fill="#8a3a36" font-weight="bold">-1</text>
    <text x="490" y="154" fill="#3a4a66">-1</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <text x="70" y="195" font-size="10.5" fill="#3a5a30">cash</text>
    <rect x="120" y="174" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="188" y="174" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="256" y="174" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="324" y="174" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="392" y="174" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="460" y="174" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <text x="150" y="196" fill="#3a5a30">0</text>
    <text x="218" y="196" fill="#3a5a30">0</text>
    <text x="286" y="196" fill="#3a5a30">0</text>
    <text x="354" y="196" fill="#8a3a36" font-weight="bold">5</text>
    <text x="422" y="196" fill="#3a5a30">5</text>
    <text x="490" y="196" fill="#8a3a36" font-weight="bold">8</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="60" y="238">第 4 天：8 + (-3) = 5 &gt; 0，卖出落袋，cash 由 0 变 5</text>
    <text x="60" y="258">第 5 天：5 - 4 - 2 = -1 &gt; -3，重新上车，hold 由 -3 变 -1</text>
    <text x="60" y="278">第 6 天：9 + (-1) = 8，cash 由 5 变 8；持股 -1 &lt; 8，故取 cash</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="190" y="296" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8"/>
    <text x="280" y="323" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold">答案 = 8</text>
  </g>

  <text x="280" y="372" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两笔交易：(8 - 1 - 2) + (9 - 4 - 2) = 5 + 3 = 8</text>
</svg>
