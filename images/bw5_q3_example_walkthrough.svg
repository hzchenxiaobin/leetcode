<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：两例对照（连通 / 不连通）</text>

  <!-- 示例 1：连通 -->
  <text x="60" y="64" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">例 1：N=3，边 (1,2,5) (1,3,6) (2,3,1)</text>
  <g filter="url(#rough2)">
    <circle cx="100" cy="120" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="220" cy="120" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="160" cy="208" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="100" y="125">1</text><text x="220" y="125">2</text><text x="160" y="213">3</text>
  </g>
  <!-- 被弃的边 (1,3) -->
  <path d="M 116 134 L 148 196" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="112" y="176" font-size="12" fill="#b85450" filter="url(#rough2)">6 ✗</text>
  <!-- 被选的边 -->
  <path d="M 122 122 L 196 122" fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="160" y="114" text-anchor="middle" font-size="12" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">5 ✓</text>
  <path d="M 208 138 L 176 192" fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="204" y="176" font-size="12" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">1 ✓</text>
  <rect x="300" y="96" width="232" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="416" y="120" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">按权排序后依次考察 1、5、6</text>
  <text x="416" y="140" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">选中 1 和 5 → 输出 6</text>

  <!-- 示例 2：不连通 -->
  <text x="60" y="268" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">例 2：N=4，边 (1,2,3) (3,4,4)</text>
  <g filter="url(#rough2)">
    <circle cx="100" cy="322" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="200" cy="322" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="320" cy="322" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <circle cx="420" cy="322" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="100" y="327">1</text><text x="200" y="327">2</text>
    <text x="320" y="327">3</text><text x="420" y="327">4</text>
  </g>
  <path d="M 122 322 L 178 322" fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="150" y="314" text-anchor="middle" font-size="12" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">3 ✓</text>
  <path d="M 342 322 L 398 322" fill="none" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="370" y="314" text-anchor="middle" font-size="12" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">4 ✓</text>
  <text x="260" y="308" text-anchor="middle" font-size="12" fill="#7a2e2a" filter="url(#rough2)">2 ↔ 3 之间无边</text>

  <rect x="300" y="344" width="232" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="416" y="364" text-anchor="middle" font-size="12" fill="#7a2e2a" filter="url(#rough2)">只选出 2 条边，used = 2 ≠ n−1 = 3</text>
  <text x="416" y="381" text-anchor="middle" font-size="13" fill="#7a2e2a" font-weight="bold" filter="url(#rough2)">图不连通 → 输出 −1</text>
</svg>
