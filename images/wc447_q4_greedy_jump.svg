<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="450" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">贪心跳跃 —— 每一步都跳到值窗口 [x−D, x+D] 内最远的点</text>
  <path d="M 170 38 Q 320 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="11.5" fill="#555">演算例：有序值 [0, 4, 7, 10, 13]，maxDiff = D = 6，从值 0 走到值 13（最短距离 = 3）</text>

  <g filter="url(#sk)"><rect x="88" y="168" width="448" height="66" rx="10" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="66" y="205" text-anchor="end" font-size="10" fill="#666">数轴</text>

  <g filter="url(#sk)"><rect x="60" y="174" width="108" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="114" y="166" text-anchor="middle" font-size="9.5" fill="#2e6e2e">窗口 [0−6, 0+6]：只覆盖值 4</text>

  <g filter="url(#sk)"><rect x="248" y="174" width="204" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="350" y="166" text-anchor="middle" font-size="9.5" fill="#2e6e2e">窗口 [4−6, 4+6]：覆盖 7 和 10 → 跳最远的 10</text>

  <g filter="url(#sk)"><circle cx="100" cy="202" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="100" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">0</text>
  <g filter="url(#sk)"><circle cx="212" cy="202" r="21" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="212" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">4</text>
  <g filter="url(#sk)"><circle cx="320" cy="202" r="21" fill="#fdfcf7" stroke="#446688" stroke-width="2"/></g>
  <text x="320" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5b84">7</text>
  <g filter="url(#sk)"><circle cx="428" cy="202" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="428" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">10</text>
  <g filter="url(#sk)"><circle cx="536" cy="202" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/></g>
  <text x="536" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5b84">13</text>

  <g filter="url(#sk)"><path d="M 116 186 Q 174 146 216 184" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrg)"/></g>
  <text x="166" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">第 1 跳：0 → 4（窗口内最远）</text>
  <g filter="url(#sk)"><path d="M 228 186 Q 316 138 424 184" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrg)"/></g>
  <text x="330" y="126" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">第 2 跳：4 → 10（越过 7，跳到最远）</text>
  <g filter="url(#sk)"><path d="M 230 216 Q 320 252 316 216" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrr)"/></g>
  <text x="308" y="246" text-anchor="middle" font-size="9" fill="#b85450">跳到 7 不更优：位置越靠右，最远可达 r 只增不减</text>
  <g filter="url(#sk)"><path d="M 444 190 Q 496 156 532 184" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrg)"/></g>
  <text x="508" y="146" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b5b84">第 3 跳直达 13</text>

  <g filter="url(#sk)"><rect x="42" y="278" width="278" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="181" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5b84">最优性来源：r(i) ≤ r(j)（i ≤ j）</text>
  <text x="181" y="324" text-anchor="middle" font-size="9.5" fill="#444">窗口右端点随起点值单调右移，跳得远</text>
  <text x="181" y="338" text-anchor="middle" font-size="9.5" fill="#444">后下一步的可达范围只会更大 —— 支配性</text>

  <g filter="url(#sk)"><rect x="340" y="278" width="262" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="471" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">计数目标</text>
  <text x="471" y="324" text-anchor="middle" font-size="9.5" fill="#444">答案 = 最小 t 使 r 迭代 t 次后 ≥ q</text>
  <text x="471" y="338" text-anchor="middle" font-size="9.5" fill="#444">跳 t−1 个落点后，第 t 跳直达 q</text>

  <g filter="url(#sk)">
    <rect x="42" y="366" width="560" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="322" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a33">为什么不能直接算 ⌈(13−0)/6⌉ = 3 交差？</text>
  <text x="322" y="414" text-anchor="middle" font-size="10.5" fill="#444">本例恰好等于 3 纯属巧合！反例：值 [0,5,20]、D=10 —— 0↔5 有边，5 与 20 差 15 断开，20 是孤立分量，真答案 −1</text>
</svg>
