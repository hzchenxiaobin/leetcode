<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：别构造大数 —— 余数一步一递推</text>
  <text x="310" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">末尾添一个 1 = 整体 ×10 再 +1；整除只看余数，与位数无关</text>

  <!-- 全 1 数与「添 1」操作 -->
  <g filter="url(#sk)">
    <text x="24" y="102" font-size="13" fill="#33506b" font-weight="bold">R =</text>
    <rect x="62" y="78" width="30" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="96" y="78" width="30" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="130" y="78" width="30" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="164" y="78" width="44" height="36" rx="4" fill="none" stroke="#7a8aa0" stroke-width="1.2" stroke-dasharray="5 4"/>
    <rect x="212" y="78" width="30" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="246" y="78" width="30" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="77" y="101" text-anchor="middle" font-size="13" fill="#33506b">1</text>
    <text x="111" y="101" text-anchor="middle" font-size="13" fill="#33506b">1</text>
    <text x="145" y="101" text-anchor="middle" font-size="13" fill="#33506b">1</text>
    <text x="186" y="101" text-anchor="middle" font-size="12" fill="#7a8aa0">...</text>
    <text x="227" y="101" text-anchor="middle" font-size="13" fill="#33506b">1</text>
    <text x="261" y="102" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
    <text x="261" y="70" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">新添的 1</text>
    <path d="M 261 72 L 261 74" stroke="none"/>
    <text x="330" y="94" font-size="13.5" fill="#2b6e9e" font-weight="bold">新数 = 旧数 × 10 + 1</text>
    <text x="330" y="112" font-size="11" fill="#555">（旧数整体左移一位，个位补上新 1）</text>
  </g>
  <text x="310" y="148" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">R 最坏近 10^5 位 —— 直接构造再取模是 O(k^2)，不可行</text>

  <!-- 递推公式 -->
  <g filter="url(#sk)">
    <rect x="90" y="168" width="440" height="60" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="310" y="193" text-anchor="middle" font-size="15" fill="#8a6d1a" font-weight="bold">r ← (r × 10 + 1) mod k</text>
    <text x="310" y="215" text-anchor="middle" font-size="11" fill="#7a6a3a">r 始终是当前全 1 数 mod k，永远落在 [0, k) 内，一个 int 装得下</text>
  </g>

  <!-- 状态机视角 -->
  <g filter="url(#sk)">
    <circle cx="150" cy="295" r="23" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="150" y="300" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold">r</text>
    <path d="M 175 295 L 236 295" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <text x="205" y="283" text-anchor="middle" font-size="11" fill="#444">添一个 1</text>
    <circle cx="262" cy="295" r="23" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="262" y="300" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold">r'</text>
    <text x="262" y="336" text-anchor="middle" font-size="10.5" fill="#8a6d1a">r' = (10r+1) mod k</text>
    <path d="M 287 295 L 346 295" stroke="#7a8aa0" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#ar)"/>
    <text x="316" y="283" text-anchor="middle" font-size="11" fill="#666">走若干步</text>
    <circle cx="374" cy="295" r="23" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <circle cx="374" cy="295" r="17" fill="none" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="374" y="300" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">0</text>
    <text x="374" y="336" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">余数 0 = 找到倍数!</text>
    <text x="430" y="282" font-size="11.5" fill="#444">状态机视角：余数 0..k−1 各有一条出边，</text>
    <text x="430" y="298" font-size="11.5" fill="#444">从空数出发走 L 步的落点 = R(L) mod k，</text>
    <text x="430" y="314" font-size="11.5" fill="#444">首次落到 0 的步数就是答案位数</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#sk)">
    <rect x="70" y="352" width="480" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="310" y="375" text-anchor="middle" font-size="12.5" fill="#2b2b2b">每步 O(1) 递推 → 总复杂度 O(k)；命中 r = 0 的步数 = 答案位数</text>
  </g>
</svg>
