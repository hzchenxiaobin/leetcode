<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：11 步抵达右下角</text>
  <text x="340" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">格内数字 = 到达该状态的最短步数（写在该步新进入的格子）；浅红格为障碍物</text>

  <!-- 6x6 网格 -->
  <g filter="url(#rough2)">
    <rect x="48" y="74" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="92" y="74" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="136" y="74" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="180" y="74" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="224" y="74" width="44" height="44" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" rx="4"/>
    <rect x="268" y="74" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="48" y="118" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="92" y="118" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="136" y="118" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="180" y="118" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="224" y="118" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="268" y="118" width="44" height="44" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" rx="4"/>
    <rect x="48" y="162" width="44" height="44" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" rx="4"/>
    <rect x="92" y="162" width="44" height="44" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" rx="4"/>
    <rect x="136" y="162" width="44" height="44" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" rx="4"/>
    <rect x="180" y="162" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="224" y="162" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="268" y="162" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="48" y="206" width="44" height="44" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" rx="4"/>
    <rect x="92" y="206" width="44" height="44" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" rx="4"/>
    <rect x="136" y="206" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="180" y="206" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="224" y="206" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="268" y="206" width="44" height="44" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" rx="4"/>
    <rect x="48" y="250" width="44" height="44" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" rx="4"/>
    <rect x="92" y="250" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="136" y="250" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="180" y="250" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="224" y="250" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="268" y="250" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="48" y="294" width="44" height="44" fill="#fafafa" stroke="#d8d8d8" stroke-width="1" rx="4"/>
    <rect x="92" y="294" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="136" y="294" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="180" y="294" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="224" y="294" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="268" y="294" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>

  <text x="114" y="101" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">0</text>
  <text x="158" y="101" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="202" y="101" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="158" y="145" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="202" y="145" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">4</text>
  <text x="202" y="189" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">5</text>
  <text x="202" y="233" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">6</text>
  <text x="202" y="277" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">7</text>
  <text x="202" y="321" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">8</text>
  <text x="246" y="277" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">9</text>
  <text x="290" y="277" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">10</text>
  <text x="290" y="321" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">11</text>

  <!-- 右侧说明 -->
  <text x="338" y="96" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">一条最优路径（11 步）</text>
  <g font-size="10.5" fill="#555" filter="url(#rough2)">
    <text x="338" y="122">右 → 右 → 顺时针 90° → 右</text>
    <text x="338" y="144">→ 下 → 下 → 下 → 下</text>
    <text x="338" y="166">→ 逆时针 90° → 右 → 下</text>
  </g>

  <rect x="330" y="188" width="334" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g font-size="10" fill="#3a4a66" filter="url(#rough2)">
    <text x="344" y="210" font-weight="bold">BFS 的层 = 移动次数</text>
    <text x="344" y="232">第 k 层收集「恰好 k 步可达」的全部状态；</text>
    <text x="344" y="252">目标状态第一次被碰到时所在的层号，</text>
    <text x="344" y="272">就是最少移动次数（这里 k = 11）。</text>
  </g>

  <rect x="330" y="312" width="334" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g font-size="10" fill="#8a6a20" filter="url(#rough2)">
    <text x="344" y="334" font-weight="bold">两处旋转的条件</text>
    <text x="344" y="356">③ 水平→竖直：下方 (1,2)、(1,3) 为空；</text>
    <text x="344" y="376">⑨ 竖直→水平：右侧 (4,4)、(5,4) 为空。</text>
    <text x="344" y="396">任一条件不满足，就只能绕更远或到不了。</text>
  </g>

  <text x="48" y="360" font-size="10" fill="#999" filter="url(#rough2)">起点 (0,0)、(0,1) 为水平</text>
  <text x="48" y="378" font-size="10" fill="#999" filter="url(#rough2)">终点 (5,4)、(5,5) 也是水平</text>
  <text x="340" y="450" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">坐标系：行 r 向下、列 c 向右，格子 (r,c) 左上角为原点</text>
</svg>
