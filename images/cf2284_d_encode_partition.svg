<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">编码 / 解码：把 s 的每一位塞进二分割</text>
  <text x="310" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 n = 4、s = 101：第 i−1 位为 1 表示顶点 i 与顶点 1 同侧</text>

  <!-- left panel -->
  <rect x="32" y="66" width="250" height="272" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="157" y="88" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">LCB：造一棵 K(A,B) 的生成树</text>

  <!-- tree edges -->
  <line x1="85" y1="140" x2="225" y2="215" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="85" y1="215" x2="225" y2="215" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="85" y1="290" x2="225" y2="215" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <circle cx="85" cy="140" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="85" cy="215" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="219" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="85" cy="290" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="294" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="225" cy="215" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="219" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <text x="85" y="316" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">A = 1, 2, 4</text>
  <text x="225" y="316" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">B = 3</text>
  <text x="157" y="331" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">边只连 A、B 之间 ⟹ 染色恰为此划分</text>

  <!-- middle arrow -->
  <path d="M 292 205 L 324 205" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="308" y="196" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">PUB</text>

  <!-- right panel -->
  <rect x="336" y="66" width="252" height="272" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="462" y="88" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">RCB：BFS 染色后按位读回</text>

  <text x="352" y="116" font-size="10.5" fill="#444" filter="url(#rough2)">① 对收到的图做 BFS 2-染色 col[v]</text>
  <text x="352" y="142" font-size="10.5" fill="#444" filter="url(#rough2)">② 若二分：s[i−1] = 1 当 col[i] = col[1]</text>
  <text x="352" y="168" font-size="10.5" fill="#444" filter="url(#rough2)">③ 若出现同色边（非二分）：输出全 1</text>
  <text x="352" y="194" font-size="10" fill="#888" filter="url(#rough2)">（顶点编号在操作中不变，方向由顶点 1 固定）</text>

  <!-- reserved non-bipartite graph -->
  <line x1="404" y1="272" x2="464" y2="272" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="404" y1="272" x2="434" y2="230" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="464" y1="272" x2="434" y2="230" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="434" cy="230" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="434" y="234" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="404" cy="272" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="404" y="276" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="464" cy="272" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="464" y="276" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="500" y="240" font-size="9.5" fill="#b85450" filter="url(#rough2)">保留串</text>
  <text x="500" y="256" font-size="9.5" fill="#b85450" filter="url(#rough2)">111…1</text>

  <text x="310" y="366" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">操作只可能让边数变小，但连通性、二分性、二分割三者全都不变</text>
  <text x="310" y="388" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">所以解码只依赖「划分」这一个不变量，与 PUB 具体删了哪条边、补了哪条边无关</text>
</svg>
