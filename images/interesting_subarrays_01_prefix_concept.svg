<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：0/1 化 + 前缀和，把趣味条件压成同余配对</text>

  <text x="40" y="52" font-size="11.5" fill="#555">以示例 2 为例：nums = [3,1,9,6]，m = 3，k = 0（好元素 ⇔ nums[i]%3==0）</text>

  <!-- nums 行 -->
  <rect x="40" y="62" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="59" y="83" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="84" y="62" width="38" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="83" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="128" y="62" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="147" y="83" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="172" y="62" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="191" y="83" text-anchor="middle" font-size="13" fill="#333">6</text>

  <path d="M 59 96 L 59 110" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 103 96 L 103 110" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 147 96 L 147 110" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 191 96 L 191 110" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 0/1 行 -->
  <rect x="40" y="114" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="59" y="135" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="84" y="114" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="135" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="128" y="114" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="135" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="172" y="114" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="135" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="232" y="134" font-size="11.5" fill="#446688">← 0/1 化：好元素记 1</text>

  <!-- 前缀和行 -->
  <text x="40" y="172" font-size="11.5" fill="#555">前缀和 s[j] = 前 j 个元素中好元素的个数：</text>
  <rect x="40" y="182" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="59" y="203" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="84" y="182" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="103" y="203" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="128" y="182" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="147" y="203" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="172" y="182" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="191" y="203" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="216" y="182" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="235" y="203" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="59" y="228" text-anchor="middle" font-size="10" fill="#888">j=0</text>
  <text x="103" y="228" text-anchor="middle" font-size="10" fill="#888">j=1</text>
  <text x="147" y="228" text-anchor="middle" font-size="10" fill="#888">j=2</text>
  <text x="191" y="228" text-anchor="middle" font-size="10" fill="#888">j=3</text>
  <text x="235" y="228" text-anchor="middle" font-size="10" fill="#888">j=4</text>

  <!-- 右侧推导面板 -->
  <rect x="300" y="62" width="230" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="415" y="86" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">子数组 nums[l..r] 的好元素个数</text>
  <text x="415" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">cnt = s[r+1] − s[l]</text>
  <text x="415" y="130" text-anchor="middle" font-size="12" fill="#333">趣味条件：cnt mod m == k</text>
  <text x="415" y="154" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">⇔ s[r+1] − k ≡ s[l] (mod m)</text>
  <text x="415" y="182" text-anchor="middle" font-size="11.5" fill="#333">固定右端点 j = r+1 后：</text>
  <text x="415" y="200" text-anchor="middle" font-size="11.5" fill="#333">左端点只需 s[i] ≡ (s[j]−k) mod m</text>

  <!-- 底部两步总结 -->
  <rect x="40" y="252" width="250" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="165" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">① 哈希表存 s[i] mod m 的出现次数</text>
  <text x="165" y="294" text-anchor="middle" font-size="11" fill="#333">键至多 n+1 个，与 modulo 大小无关</text>
  <rect x="306" y="252" width="250" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="431" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 固定 j：ans += 表中 (s[j]−k) mod m 计数</text>
  <text x="431" y="294" text-anchor="middle" font-size="11" fill="#333">恰为以 j−1 为右端点的趣味子数组个数</text>

  <text x="40" y="338" font-size="11" fill="#888">条件 cnt mod m == k 关于区间扩大不单调 → 滑动窗口失效，必须做同余配对</text>
  <text x="40" y="358" font-size="11" fill="#888">答案上限 n(n+1)/2 ≈ 5×10⁹（n=10⁵）→ ans 必须用 64 位整数</text>
</svg>
