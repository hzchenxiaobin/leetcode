<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="360" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">按 popcount 分类：先数「恰好 j 个 1」的整数，再看 depth(j)</text>
  <text x="70" y="82" text-anchor="start" font-size="13" fill="#666" filter="url(#rough2)">n = 13 = 1101₂，位数 L = 4</text>
  <rect x="96" y="104" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="119.0" y="132.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="148" y="104" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="171.0" y="132.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="200" y="104" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="223.0" y="132.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <rect x="252" y="104" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="275.0" y="132.6" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="119.0" y="168" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">p=3</text>
  <text x="171.0" y="168" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">p=2</text>
  <text x="223.0" y="168" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">p=1</text>
  <text x="275.0" y="168" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">p=0</text>
  <text x="200.0" y="194" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">每一位为 1 时：把这一位改成 0，低位任意</text>
  <rect x="70" y="196" width="270" height="130" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="222" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">这一位放 0 的方案</text>
  <text x="205" y="250" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">C(p, add) 种（低位任取）</text>
  <text x="205" y="276" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">add = 后面还要放的 1 的个数</text>
  <text x="205" y="304" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">累加到 cnt[已有 1 的个数 + add]</text>
  <rect x="370" y="196" width="260" height="130" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="222" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">最后统计</text>
  <text x="500" y="250" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans += cnt[j]（若 1+depth(j) = k）</text>
  <text x="500" y="278" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">j = 1 时要扣掉 x = 1</text>
  <text x="500" y="304" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">（depth(1) = 0，单独处理 k = 0）</text>
  <text x="640" y="262" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">j ≤ 50</text>
</svg>
