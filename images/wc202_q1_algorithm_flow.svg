<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">算法流程：一趟扫描，cnt 达 3 立即返回</text>
  <path d="M 130 38 Q 310 45 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 开始 -->
  <rect x="250" y="52" width="160" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="73" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">开始：cnt ← 0</text>

  <path d="M 330 86 L 330 104" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 取下一个元素 -->
  <rect x="240" y="108" width="180" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="129" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">取下一个元素 x</text>

  <path d="M 420 125 L 460 125" stroke="#999999" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="440" y="117" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">取尽</text>
  <rect x="466" y="108" width="124" height="34" rx="6" fill="#fafafa" stroke="#999999" stroke-width="1.5" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="528" y="129" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">返回 false</text>

  <path d="M 330 142 L 330 160" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 判奇菱形 -->
  <path d="M 245 209 L 330 164 L 415 209 L 330 254 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="213" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">x 是奇数？</text>

  <!-- 偶数分支 -->
  <path d="M 245 209 L 224 209" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="236" y="200" text-anchor="middle" font-size="11" fill="#3a3a3a" filter="url(#rough2)">否</text>
  <text x="165" y="184" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">偶数打断连续段</text>

  <rect x="110" y="192" width="110" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="213" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">cnt ← 0</text>

  <path d="M 165 192 L 165 132 L 236 132" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="172" y="150" font-size="10" fill="#3a3a3a" filter="url(#rough2)">继续</text>

  <!-- 奇数分支 -->
  <path d="M 330 254 L 330 278" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="338" y="270" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">是</text>

  <rect x="240" y="282" width="180" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="303" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">cnt ← cnt + 1</text>

  <path d="M 330 316 L 330 334" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 判 3 菱形 -->
  <path d="M 245 383 L 330 338 L 415 383 L 330 428 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="387" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">cnt == 3？</text>

  <!-- 是：返回 true -->
  <path d="M 415 383 L 460 383" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="438" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="466" y="366" width="124" height="34" rx="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="528" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 true</text>

  <!-- 否：回到循环 -->
  <path d="M 330 428 L 330 450 L 60 450 L 60 116 L 236 116" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="338" y="446" font-size="11" fill="#3a3a3a" filter="url(#rough2)">否</text>
  <text x="195" y="443" text-anchor="middle" font-size="10.5" fill="#3a3a3a" filter="url(#rough2)">否：继续处理下一个元素</text>
</svg>
