<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次预处理出 ans[0..K]，每个查询 O(1) 查表</text>
  <path d="M 96 38 Q 320 45 544 38" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 读入 -->
  <rect x="180" y="54" width="280" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="320" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">读入 a，升序排序得到 cur</text>
  <path d="M 320 96 L 320 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 记录 -->
  <rect x="180" y="114" width="280" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="320" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">ans[k] = cur[n−1] − cur[0]</text>
  <path d="M 320 156 L 320 172" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 -->
  <polygon points="320,172 415,206 320,240 225,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">cur 全为 0 ？</text>
  <text x="320" y="220" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">（即 cur[n−1] == 0）</text>

  <!-- 是 -->
  <path d="M 417 206 L 470 206" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="443" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="476" y="182" width="146" height="48" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="549" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">预处理结束</text>
  <text x="549" y="220" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">之后恒为全 0</text>

  <!-- 否 -->
  <path d="M 320 242 L 320 260" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="256" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 枚举 -->
  <rect x="166" y="262" width="308" height="40" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="287" text-anchor="middle" font-size="12.5" fill="#8c3a37" filter="url(#rough2)">枚举全部 C(n,2) 个 cur[i] ⊕ cur[j]</text>
  <path d="M 320 302 L 320 316" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取 n 小 -->
  <rect x="166" y="318" width="308" height="40" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="343" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">nth_element 取最小 n 个，再排序</text>

  <!-- 回边 -->
  <path d="M 164 338 L 112 338 L 112 135 L 176 135" stroke="#446688" stroke-width="1.6" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="240" text-anchor="middle" font-size="11" fill="#446688"
        transform="rotate(-90 100 240)" filter="url(#rough2)">k ← k+1，cur 换成新的 n 个数</text>

  <!-- 说明 -->
  <rect x="42" y="374" width="556" height="42" rx="10" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="400" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">K ≤ 60（n ≥ 6 时 ≤ 30，实测 ≤ 10）；查询 x：x &lt; len(ans) ? ans[x] : 0</text>
</svg>
