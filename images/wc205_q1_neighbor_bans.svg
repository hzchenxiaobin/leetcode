  </g>

  <text x="320" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">至多禁 2 个 → 至少 24 个字母可选 ✓</text>

  <g filter="url(#rough2)">
    <rect x="60" y="336" width="520" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="362" text-anchor="middle" font-size="12.5" fill="#b07818" filter="url(#rough2)">鸽笼原理：只需试 {a, b, c} —— 至多 2 条禁令，3 个候选必剩 1 个合法</text>
  <text x="320" y="386" text-anchor="middle" font-size="11.5" fill="#b07818" filter="url(#rough2)">内层循环 3 次即可，无需遍历 26 个字母</text>

  <text x="320" y="432" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">邻居不存在（i=0 / i=n−1）或邻居仍是 '?'（未填）→ 该侧不产生禁令</text>
</svg>
