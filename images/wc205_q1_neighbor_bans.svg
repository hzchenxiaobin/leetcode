    <rect x="548" y="262" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <path d="M 388 279 L 416 271" stroke="#b85450" stroke-width="2"/>
    <path d="M 429 279 L 457 271" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="11.5" fill="#3a5a3a" text-anchor="middle" filter="url(#rough2)">
    <text x="74" y="245">a</text>
    <text x="115" y="245">b</text>
    <text x="156" y="245">c</text>
    <text x="197" y="245">d</text>
    <text x="238" y="245">e</text>
    <text x="279" y="245">f</text>
