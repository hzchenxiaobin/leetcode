    <rect x="507" y="226" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="548" y="226" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="56" y="262" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="97" y="262" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="138" y="262" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="179" y="262" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="220" y="262" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="261" y="262" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="302" y="262" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="343" y="262" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="384" y="262" width="36" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="425" y="262" width="36" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="466" y="262" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
