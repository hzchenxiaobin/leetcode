<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ban" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：每个 '?' 至多被左右 2 个邻居约束</text>
  <path d="M 140 44 Q 320 52 500 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <text x="185" y="102" text-anchor="end" font-size="13" fill="#555">s = ubv?w</text>
    <rect x="200" y="72" width="54" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="260" y="72" width="54" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="320" y="72" width="54" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="380" y="72" width="54" height="48" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="440" y="72" width="54" height="48" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="227" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">u</text>
    <text x="287" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">b</text>
    <text x="347" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">v</text>
    <text x="407" y="104" text-anchor="middle" font-size="18" font-weight="bold" fill="#b07818">?</text>
    <text x="467" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a66">w</text>
    <text x="227" y="136" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="287" y="136" text-anchor="middle" font-size="10" fill="#888">1</text>
    <text x="347" y="136" text-anchor="middle" font-size="10" fill="#888">2</text>
    <text x="407" y="136" text-anchor="middle" font-size="10" fill="#888">3</text>
    <text x="467" y="136" text-anchor="middle" font-size="10" fill="#888">4</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 390 126 C 374 142 360 150 349 158" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#ban)"/>
    <path d="M 424 126 C 440 142 454 150 465 158" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#ban)"/>
    <text x="320" y="180" text-anchor="middle" font-size="11.5" fill="#b85450">左邻禁 'v'</text>
    <text x="494" y="180" text-anchor="middle" font-size="11.5" fill="#b85450">右邻禁 'w'</text>
  </g>

  <text x="56" y="216" font-size="12.5" fill="#555" filter="url(#rough2)">值域：26 个小写字母（红 = 被邻居禁用）</text>

  <g filter="url(#rough2)">
    <rect x="56" y="226" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="97" y="226" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
