<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">单元素最小代价 c_R(x)：枚举与 x 的「最高不同位」p</text>
  <path d="M 230 42 Q 470 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="72" text-anchor="middle" font-size="12" fill="#444">例：x = 8 = 1000₂，R = 3 = 0011₂　→　求最小的 v ≥ 8 且 v ⊇ R</text>

  <!-- bit labels -->
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="150" y="102">bit3</text>
    <text x="226" y="102">bit2</text>
    <text x="302" y="102">bit1</text>
    <text x="378" y="102">bit0</text>
  </g>

  <!-- x row -->
  <text x="118" y="132" text-anchor="end" font-size="12" fill="#444" font-weight="bold" font-family="monospace">x = 8</text>
  <g font-size="13" text-anchor="middle">
    <g filter="url(#sk)"><rect x="126" y="110" width="48" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="4"/></g>
    <text x="150" y="132" fill="#2b6e9e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="202" y="110" width="48" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="4"/></g>
    <text x="226" y="132" fill="#2b6e9e">0</text>
    <g filter="url(#sk)"><rect x="278" y="110" width="48" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="4"/></g>
    <text x="302" y="132" fill="#2b6e9e">0</text>
    <g filter="url(#sk)"><rect x="354" y="110" width="48" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="4"/></g>
    <text x="378" y="132" fill="#2b6e9e">0</text>
  </g>

  <!-- R row -->
  <text x="118" y="182" text-anchor="end" font-size="12" fill="#444" font-weight="bold" font-family="monospace">R = 3</text>
  <g font-size="13" text-anchor="middle">
    <g filter="url(#sk)"><rect x="126" y="160" width="48" height="34" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" rx="4"/></g>
    <text x="150" y="182" fill="#999">0</text>
    <g filter="url(#sk)"><rect x="202" y="160" width="48" height="34" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" rx="4"/></g>
    <text x="226" y="182" fill="#999">0</text>
    <g filter="url(#sk)"><rect x="278" y="160" width="48" height="34" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" rx="4"/></g>
    <text x="302" y="182" fill="#b0721b" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="354" y="160" width="48" height="34" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" rx="4"/></g>
    <text x="378" y="182" fill="#b0721b" font-weight="bold">1</text>
  </g>

  <!-- candidate p=2 row -->
  <text x="118" y="240" text-anchor="end" font-size="11" fill="#444" font-weight="bold" font-family="monospace">p = 2</text>
  <g font-size="13" text-anchor="middle">
    <g filter="url(#sk)"><rect x="126" y="218" width="48" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="4"/></g>
    <text x="150" y="240" fill="#2b6e9e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="202" y="218" width="48" height="34" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2" rx="4"/></g>
    <text x="226" y="240" fill="#b0721b" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="278" y="218" width="48" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="4"/></g>
    <text x="302" y="240" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="354" y="218" width="48" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="4"/></g>
    <text x="378" y="240" fill="#2e6e2e" font-weight="bold">1</text>
  </g>
  <text x="436" y="230" font-size="11" fill="#444" font-family="monospace">v = 1111₂ = 15，代价 15 − 8 = 7</text>
  <text x="436" y="248" font-size="10" fill="#888">高于 p 照抄 x，第 p 位强制 1，低位抄 R</text>

  <!-- candidate p=1 row (best) -->
  <text x="118" y="300" text-anchor="end" font-size="11" fill="#2e6e2e" font-weight="bold" font-family="monospace">p = 1</text>
  <g font-size="13" text-anchor="middle">
    <g filter="url(#sk)"><rect x="126" y="278" width="48" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="4"/></g>
    <text x="150" y="300" fill="#2b6e9e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="202" y="278" width="48" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5" rx="4"/></g>
    <text x="226" y="300" fill="#2b6e9e" font-weight="bold">0</text>
    <g filter="url(#sk)"><rect x="278" y="278" width="48" height="34" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2" rx="4"/></g>
    <text x="302" y="300" fill="#b0721b" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="354" y="278" width="48" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="4"/></g>
    <text x="378" y="300" fill="#2e6e2e" font-weight="bold">1</text>
  </g>
  <text x="436" y="290" font-size="11" fill="#2e6e2e" font-weight="bold" font-family="monospace">v = 1011₂ = 11，代价 11 − 8 = 3 ← 最小 ✓</text>
  <text x="436" y="308" font-size="10" fill="#888">bit2 高于 p，照抄 x 的 0（不必是 R 的位）</text>

  <!-- invalid p=0 row -->
  <text x="118" y="360" text-anchor="end" font-size="11" fill="#b03a3a" font-weight="bold" font-family="monospace">p = 0</text>
  <g font-size="13" text-anchor="middle" opacity="0.75">
    <g filter="url(#sk)"><rect x="126" y="338" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/></g>
    <text x="150" y="360" fill="#b03a3a" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="202" y="338" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/></g>
    <text x="226" y="360" fill="#b03a3a" font-weight="bold">0</text>
    <g filter="url(#sk)"><rect x="278" y="338" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/></g>
    <text x="302" y="360" fill="#b03a3a" font-weight="bold">0</text>
    <g filter="url(#sk)"><rect x="354" y="338" width="48" height="34" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2" rx="4"/></g>
    <text x="378" y="360" fill="#b0721b" font-weight="bold">1</text>
  </g>
  <text x="436" y="350" font-size="11" fill="#b03a3a" font-weight="bold" font-family="monospace">✗ 不合法！</text>
  <text x="436" y="368" font-size="10" fill="#888">R 的 bit1（高于 p=0）为 1，但 x 的 bit1 = 0</text>

  <!-- legend -->
  <g font-size="10" text-anchor="middle">
    <g filter="url(#sk)"><rect x="126" y="400" width="18" height="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2" rx="3"/></g>
    <text x="200" y="412" text-anchor="start" fill="#666">照抄 x（高于 p）</text>
    <g filter="url(#sk)"><rect x="320" y="400" width="18" height="16" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" rx="3"/></g>
    <text x="348" y="412" text-anchor="start" fill="#666">强制 1（第 p 位）</text>
    <g filter="url(#sk)"><rect x="470" y="400" width="18" height="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2" rx="3"/></g>
    <text x="498" y="412" text-anchor="start" fill="#666">照抄 R（低于 p）</text>
  </g>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="436" y="440" width="500" height="108" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="456" y="464" font-size="12" font-weight="bold" fill="#2b6e9e">构造公式与合法性</text>
  <text x="456" y="488" font-size="11" fill="#444" font-family="monospace">v_p = (x 中高于 p 的位) | 2^p | (R 中低于 p 的位)</text>
  <text x="456" y="510" font-size="11" fill="#444">合法 p：x 的第 p 位为 0，且 R 中高于 p 的每个 1 都已在 x 中</text>
  <text x="456" y="532" font-size="11" fill="#b03a3a" font-weight="bold" font-family="monospace">c_R(x) = 0（若 x ⊇ R），否则 min( v_p − x )</text>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="60" y="440" width="350" height="108" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="80" y="464" font-size="12" font-weight="bold" fill="#2e6e2e">本例结果</text>
  <text x="80" y="490" font-size="12" fill="#2e6e2e" font-family="monospace" font-weight="bold">c₃(8) = 3（目标值 v = 11）</text>
  <text x="80" y="514" font-size="10" fill="#666">实现：p 从 bit30 扫到 bit0，用 bad 标记</text>
  <text x="80" y="532" font-size="10" fill="#666">维护「R 高于 p 的 1 是否全在 x 中」，O(B) 完成</text>

  <!-- insight -->
  <g filter="url(#sk)">
    <rect x="60" y="568" width="876" height="56" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="590" font-size="11" font-weight="bold" fill="#2b2b2b">为什么枚举 p 就够了？</text>
  <text x="80" y="610" font-size="11" fill="#444">任何 v &gt; x 与 x 都存在唯一的最高不同位 p（该位 v 为 1、x 为 0）；固定 p 后低于 p 的位取 R 本身即最小 → v_p 是该 p 下的最小值，全部枚举即全局最小。</text>
</svg>
