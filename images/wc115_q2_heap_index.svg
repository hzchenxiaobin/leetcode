<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 332"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="332" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">完全二叉树 ⟺ 堆式编号恰好占满 1..n</text>
  <line x1="280" y1="66" x2="180" y2="126" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="280" y1="66" x2="380" y2="126" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="180" y1="126" x2="130" y2="186" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="180" y1="126" x2="230" y2="186" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="380" y1="126" x2="330" y2="186" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="380" y1="126" x2="430" y2="186" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="280" cy="66" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="180" cy="126" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="132" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="380" cy="126" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="132" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="130" cy="186" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="192" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="230" cy="186" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="192" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="330" cy="186" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="192" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="430" cy="186" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="192" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="330" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 3 层编号 4,5,6,7</text>
  <text x="280" y="262" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">编号 6 空着而 7 有节点 ⇒ 编号集合 {1,2,3,4,5,7} ≠ {1..6}</text>
  <rect x="60" y="276" width="440" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="303" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">判据：统计 n 与最大编号 maxIdx，比较 maxIdx == n</text>
</svg>
