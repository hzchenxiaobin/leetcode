<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 404"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="404" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="28" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">
    样例与边界走查：同一个公式 y = 10^d + 1 覆盖全部情形
  </text>
  <text x="330" y="49" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    官方样例给出的 11 / 4 / 26 / 3366 都是合法答案，我们的 y 是另一组合法答案（题目要求输出任意一组）
  </text>

  <rect x="22" y="64" width="618" height="30" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#446688" text-anchor="middle">
    <text x="67" y="84" filter="url(#rough2)">x</text>
    <text x="136" y="84" filter="url(#rough2)">d</text>
    <text x="235" y="84" filter="url(#rough2)">y = 10^d + 1</text>
    <text x="405" y="84" filter="url(#rough2)">x · y</text>
    <text x="545" y="84" filter="url(#rough2)">x·y 的数字</text>
    <text x="615" y="84" filter="url(#rough2)">成立</text>
  </g>

  <rect x="24" y="320" width="614" height="34" rx="5" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.2" filter="url(#rough2)"/>

  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="67" y="124" filter="url(#rough2)">8</text>
    <text x="136" y="124" filter="url(#rough2)">1</text>
    <text x="235" y="124" filter="url(#rough2)">11</text>
    <text x="405" y="124" filter="url(#rough2)">88</text>
    <text x="545" y="124" filter="url(#rough2)">{8}</text>
    <text x="615" y="124" fill="#4a7a3a" filter="url(#rough2)">✓</text>

    <text x="67" y="160" filter="url(#rough2)">73</text>
    <text x="136" y="160" filter="url(#rough2)">2</text>
    <text x="235" y="160" filter="url(#rough2)">101</text>
    <text x="405" y="160" filter="url(#rough2)">7373</text>
    <text x="545" y="160" filter="url(#rough2)">{7,3}</text>
    <text x="615" y="160" fill="#4a7a3a" filter="url(#rough2)">✓</text>

    <text x="67" y="196" filter="url(#rough2)">299</text>
    <text x="136" y="196" filter="url(#rough2)">3</text>
    <text x="235" y="196" filter="url(#rough2)">1001</text>
    <text x="405" y="196" filter="url(#rough2)">299299</text>
    <text x="545" y="196" filter="url(#rough2)">{2,9}</text>
    <text x="615" y="196" fill="#4a7a3a" filter="url(#rough2)">✓</text>

    <text x="67" y="232" filter="url(#rough2)">6767</text>
    <text x="136" y="232" filter="url(#rough2)">4</text>
    <text x="235" y="232" filter="url(#rough2)">10001</text>
    <text x="405" y="232" filter="url(#rough2)">67676767</text>
    <text x="545" y="232" filter="url(#rough2)">{6,7}</text>
    <text x="615" y="232" fill="#4a7a3a" filter="url(#rough2)">✓</text>

    <text x="67" y="268" filter="url(#rough2)">1</text>
    <text x="136" y="268" filter="url(#rough2)">1</text>
    <text x="235" y="268" filter="url(#rough2)">11</text>
    <text x="405" y="268" filter="url(#rough2)">11</text>
    <text x="545" y="268" filter="url(#rough2)">{1}</text>
    <text x="615" y="268" fill="#4a7a3a" filter="url(#rough2)">✓</text>

    <text x="67" y="304" filter="url(#rough2)">10</text>
    <text x="136" y="304" filter="url(#rough2)">2</text>
    <text x="235" y="304" filter="url(#rough2)">101</text>
    <text x="405" y="304" filter="url(#rough2)">1010</text>
    <text x="545" y="304" filter="url(#rough2)">{0,1}</text>
    <text x="615" y="304" fill="#4a7a3a" filter="url(#rough2)">✓</text>

    <text x="67" y="340" filter="url(#rough2)">99999999</text>
    <text x="136" y="340" filter="url(#rough2)">8</text>
    <text x="235" y="340" filter="url(#rough2)">100000001</text>
    <text x="405" y="340" font-size="9.5" filter="url(#rough2)">9999999999999999</text>
    <text x="545" y="340" filter="url(#rough2)">{9}</text>
    <text x="615" y="340" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  </g>

  <path d="M 22 110 L 640 110" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="330" y="374" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">
    粉底行 = 最大输入：d = 8，y = 100000001，乘积 16 位且只含数字 9
  </text>
  <text x="330" y="388" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">
    注意 d 随每组重新数，不能跨组复用（多测清空）
  </text>
</svg>
