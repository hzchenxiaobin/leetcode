<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历 + 四路分发</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">栈 st 初始为空；每个分支只改动栈顶（常数次操作）</text>

  <rect x="190" y="62" width="180" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="85" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">for op in operations</text>

  <path d="M 280 98 L 280 122" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 100 122 L 460 122" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <path d="M 100 122 L 100 138" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 220 122 L 220 138" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 122 L 340 138" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 460 122 L 460 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="52" y="140" width="96" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="166" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">op == "C"</text>

  <rect x="172" y="140" width="96" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="166" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">op == "D"</text>

  <rect x="292" y="140" width="96" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="166" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">op == "+"</text>

  <rect x="412" y="140" width="96" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="166" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">否则是整数</text>

  <path d="M 100 182 L 100 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 220 182 L 220 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 182 L 340 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 460 182 L 460 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="52" y="200" width="96" height="48" rx="6" fill="#fafafa" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="100" y="222" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">st.pop()</text>
  <text x="100" y="238" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">删除栈顶</text>

  <rect x="172" y="200" width="96" height="48" rx="6" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="222" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">st.push(2·top)</text>
  <text x="220" y="238" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">先读再压</text>

  <rect x="292" y="200" width="96" height="48" rx="6" fill="#fafafa" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="222" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">st.push(t1+t2)</text>
  <text x="340" y="238" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">t1=栈顶</text>

  <rect x="412" y="200" width="96" height="48" rx="6" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="460" y="222" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">st.push(stoi)</text>
  <text x="460" y="238" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">含负数</text>

  <path d="M 100 248 L 100 276" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 220 248 L 220 276" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 340 248 L 340 276" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 460 248 L 460 276" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 100 276 L 460 276" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 276 L 280 296" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="298" width="240" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11.5" fill="#33502a" font-weight="bold" filter="url(#rough2)">全部操作处理完</text>
  <text x="280" y="342" text-anchor="middle" font-size="11.5" fill="#33502a" filter="url(#rough2)">返回 sum(st)</text>

  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间复杂度：每个 op 常数次栈操作 ⇒ 总时间 O(n)</text>
  <text x="280" y="402" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">空间复杂度：栈最多保存 n 个分数 ⇒ O(n)</text>
</svg>
