<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例：nums = [5,2,1,4,3]，n = 5，m = 3（奇数）→ 峰的位置被唯一锁定为 {1, 3}</text>

  <!-- ===== 左：操作前 ===== -->
  <text x="150" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">操作前</text>

  <line x1="56" y1="250" x2="232" y2="250" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 柱子 [5,2,1,4,3]，高 = 值*22 -->
  <rect x="68" y="140" width="32" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="106" y="206" width="32" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="144" y="228" width="32" height="22" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="182" y="162" width="32" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="220" y="184" width="32" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>

  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="84" y="244">5</text><text x="122" y="244">2</text><text x="160" y="244">1</text>
    <text x="198" y="244">4</text><text x="236" y="244">3</text>
  </g>
  <g font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="84" y="266">0</text><text x="122" y="266">1</text><text x="160" y="266">2</text>
    <text x="198" y="266">3</text><text x="236" y="266">4</text>
  </g>

  <!-- 下标 1 的目标高度 6 -->
  <line x1="100" y1="118" x2="144" y2="118" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="150" y="122" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <line x1="122" y1="202" x2="122" y2="126" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="130" y="168" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">+4</text>
  <text x="198" y="154" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">已是峰 ✓</text>

  <text x="150" y="290" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">cost[1] = max(5,1)+1−2 = 4</text>
  <text x="150" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">cost[3] = max(1,3)+1−4 = 0</text>

  <!-- ===== 中间大箭头 ===== -->
  <path d="M275,170 L345,170" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="310" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">抬高 4 次</text>

  <!-- ===== 右：操作后 ===== -->
  <text x="480" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">操作后（nums[1]：2 → 6）</text>

  <line x1="388" y1="250" x2="564" y2="250" stroke="#666" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 柱子 [5,6,1,4,3] -->
  <rect x="400" y="140" width="32" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="438" y="118" width="32" height="132" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="476" y="228" width="32" height="22" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="514" y="162" width="32" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="552" y="184" width="32" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>

  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="416" y="244">5</text><text x="454" y="244">6</text><text x="492" y="244">1</text>
    <text x="530" y="244">4</text><text x="568" y="244">3</text>
  </g>
  <g font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="416" y="266">0</text><text x="454" y="266">1</text><text x="492" y="266">2</text>
    <text x="530" y="266">3</text><text x="568" y="266">4</text>
  </g>

  <g font-size="13" font-weight="bold" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">
    <text x="454" y="108">峰</text><text x="530" y="152">峰</text>
  </g>

  <text x="480" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">峰数 = 2 = ⌈3/2⌉（已最大化）</text>
  <text x="480" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">总操作数 = 4 → 答案 4</text>

  <!-- ===== 底部说明 ===== -->
  <rect x="55" y="330" width="550" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="354" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">为什么唯一：从 {1,2,3} 里选 2 个互不相邻的位置，{1,2}、{2,3} 都相邻被禁，只剩 {1,3}</text>
  <text x="330" y="378" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">m 为奇数时无需枚举 —— 直接把奇数位置的 cost 加起来即可</text>
</svg>
