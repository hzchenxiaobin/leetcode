<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="960" height="560" fill="#fafafa"/>

  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">示例演算：s = "abaccdbbd"，k = 3（只查长度 3 与 4）</text>
  <path d="M 230 38 Q 480 46 730 38" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 原串 -->
  <rect x="226" y="46" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">a</text>
  <rect x="284" y="46" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="306" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">b</text>
  <rect x="342" y="46" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="364" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">a</text>
  <rect x="400" y="46" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">c</text>
  <rect x="458" y="46" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">c</text>
  <rect x="516" y="46" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="538" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">d</text>
  <rect x="574" y="46" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="596" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">b</text>
  <rect x="632" y="46" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="654" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">b</text>
  <rect x="690" y="46" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="712" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">d</text>

  <text x="248" y="106" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="306" y="106" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="364" y="106" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="422" y="106" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="480" y="106" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="538" y="106" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="596" y="106" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="654" y="106" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="712" y="106" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">8</text>

  <!-- 演算表 -->
  <rect x="80" y="122" width="800" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">i</text>
  <text x="275" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">查 s[i..i+2]（长度 k = 3）</text>
  <text x="565" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">查 s[i..i+3]（长度 k+1 = 4）</text>
  <text x="795" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">动作</text>

  <rect x="80" y="152" width="800" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="181" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">0</text>
  <text x="275" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">"aba" ✓ 回文</text>
  <text x="565" y="181" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">——（已选长度 k）</text>
  <text x="795" y="181" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">选中 "aba"：ans=1，i → 3</text>

  <rect x="80" y="200" width="800" height="48" rx="4" fill="#f5f5f3" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="229" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">3</text>
  <text x="275" y="229" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">"ccd" ✗</text>
  <text x="565" y="229" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">"ccdb" ✗</text>
  <text x="795" y="229" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">无命中，i → 4</text>

  <rect x="80" y="248" width="800" height="48" rx="4" fill="#f5f5f3" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">4</text>
  <text x="275" y="277" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">"cdb" ✗</text>
  <text x="565" y="277" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">"cdbb" ✗</text>
  <text x="795" y="277" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">无命中，i → 5</text>

  <rect x="80" y="296" width="800" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">5</text>
  <text x="275" y="325" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">"dbb" ✗</text>
  <text x="565" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">"dbbd" ✓ 回文</text>
  <text x="795" y="325" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">选中 "dbbd"：ans=2，i → 9</text>

  <rect x="80" y="344" width="800" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="373" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410" filter="url(#rough2)">9</text>
  <text x="420" y="373" text-anchor="middle" font-size="11.5" fill="#7a5410" filter="url(#rough2)">i + k = 12 &gt; 9，循环结束</text>
  <text x="795" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5410" filter="url(#rough2)">返回 ans = 2</text>

  <!-- 结果串 -->
  <rect x="226" y="412" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="248" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">a</text>
  <rect x="284" y="412" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="306" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">b</text>
  <rect x="342" y="412" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="364" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">a</text>
  <rect x="400" y="412" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">c</text>
  <rect x="458" y="412" width="44" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">c</text>
  <rect x="516" y="412" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="538" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">d</text>
  <rect x="574" y="412" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="596" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">b</text>
  <rect x="632" y="412" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="654" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">b</text>
  <rect x="690" y="412" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="712" y="440" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">d</text>

  <text x="306" y="474" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">"aba"（长 3 = k）</text>
  <text x="627" y="474" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">"dbbd"（长 4 = k+1）</text>

  <rect x="100" y="488" width="760" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">两个回文互不重叠，答案 ans = 2 ✓</text>
  <text x="480" y="530" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">注意 "dbbd" 是长度 k+1 的回文 —— 本例恰好说明两种长度都必须检查</text>
</svg>
