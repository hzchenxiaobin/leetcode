<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = QQQQWWWW，t = 2，need = (Q:2, W:2)</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">下面按「加入 → 判断 → 收缩」的顺序走一遍，答案在窗口 [2, 5] 处定格</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="140" y="56" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="176" y="56" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="212" y="56" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="248" y="56" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="284" y="56" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="320" y="56" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="356" y="56" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="392" y="56" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="158" y="77" fill="#3a4a66">Q</text>
    <text x="194" y="77" fill="#3a4a66">Q</text>
    <text x="230" y="77" fill="#3a5a30">Q</text>
    <text x="266" y="77" fill="#3a5a30">Q</text>
    <text x="302" y="77" fill="#3a5a30">W</text>
    <text x="338" y="77" fill="#3a5a30">W</text>
    <text x="374" y="77" fill="#b85450">W</text>
    <text x="410" y="77" fill="#b85450">W</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="158" y="100">0</text><text x="194" y="100">1</text><text x="230" y="100">2</text><text x="266" y="100">3</text>
    <text x="302" y="100">4</text><text x="338" y="100">5</text><text x="374" y="100">6</text><text x="410" y="100">7</text>
  </g>

  <rect x="210" y="110" width="150" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)" opacity="0.8"/>
  <text x="285" y="126" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">绿色 = 最终答案窗口 [2, 5]</text>

  <rect x="26" y="142" width="528" height="226" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10.5" fill="#666" font-weight="bold">
    <text x="44" y="164">步骤</text>
    <text x="150" y="164" text-anchor="middle">l</text>
    <text x="190" y="164" text-anchor="middle">r</text>
    <text x="278" y="164" text-anchor="middle">窗口 s[l..r]</text>
    <text x="386" y="164" text-anchor="middle">inside (Q, W)</text>
    <text x="468" y="164" text-anchor="middle">missing</text>
    <text x="524" y="164" text-anchor="middle">ans</text>
  </g>
  <path d="M 38 172 L 542 172" stroke="#ccc" stroke-width="1.1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="44" y="194">初始</text>
    <text x="150" y="194" text-anchor="middle">0</text>
    <text x="190" y="194" text-anchor="middle">−</text>
    <text x="278" y="194" text-anchor="middle" fill="#999">空</text>
    <text x="386" y="194" text-anchor="middle">(0, 0)</text>
    <text x="468" y="194" text-anchor="middle" fill="#b85450">2</text>
    <text x="524" y="194" text-anchor="middle">8</text>

    <text x="44" y="218">r 扩到 5</text>
    <text x="150" y="218" text-anchor="middle">0</text>
    <text x="190" y="218" text-anchor="middle">5</text>
    <text x="278" y="218" text-anchor="middle" fill="#3a4a66">QQQQWW</text>
    <text x="386" y="218" text-anchor="middle">(4, 2)</text>
    <text x="468" y="218" text-anchor="middle" fill="#4a7a3a">0</text>
    <text x="524" y="218" text-anchor="middle">6</text>

    <text x="44" y="242">收缩 l→1</text>
    <text x="150" y="242" text-anchor="middle">1</text>
    <text x="190" y="242" text-anchor="middle">5</text>
    <text x="278" y="242" text-anchor="middle" fill="#3a4a66">QQQWW</text>
    <text x="386" y="242" text-anchor="middle">(3, 2)</text>
    <text x="468" y="242" text-anchor="middle" fill="#4a7a3a">0</text>
    <text x="524" y="242" text-anchor="middle">5</text>

    <text x="44" y="266">收缩 l→2</text>
    <text x="150" y="266" text-anchor="middle">2</text>
    <text x="190" y="266" text-anchor="middle">5</text>
    <text x="278" y="266" text-anchor="middle" fill="#4a7a3a" font-weight="bold">QQWW</text>
    <text x="386" y="266" text-anchor="middle">(2, 2)</text>
    <text x="468" y="266" text-anchor="middle" fill="#4a7a3a">0</text>
    <text x="524" y="266" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>

    <text x="44" y="290">再收 l→3</text>
    <text x="150" y="290" text-anchor="middle">3</text>
    <text x="190" y="290" text-anchor="middle">5</text>
    <text x="278" y="290" text-anchor="middle" fill="#b85450">QWW</text>
    <text x="386" y="290" text-anchor="middle">(1, 2)</text>
    <text x="468" y="290" text-anchor="middle" fill="#b85450">1</text>
    <text x="524" y="290" text-anchor="middle" fill="#999">4</text>

    <text x="44" y="314">r 扩到 7</text>
    <text x="150" y="314" text-anchor="middle">3</text>
    <text x="190" y="314" text-anchor="middle">7</text>
    <text x="278" y="314" text-anchor="middle" fill="#b85450">QWWWW</text>
    <text x="386" y="314" text-anchor="middle">(1, 4)</text>
    <text x="468" y="314" text-anchor="middle" fill="#b85450">1</text>
    <text x="524" y="314" text-anchor="middle" fill="#999">4</text>

    <text x="44" y="338" font-weight="bold" fill="#444">结束</text>
    <text x="278" y="338" text-anchor="middle" fill="#999">r = 8，退出循环</text>
    <text x="524" y="338" text-anchor="middle" font-weight="bold" fill="#4a7a3a">4</text>
  </g>

  <text x="290" y="386" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">关键一步：l = 2 时窗口内 Q 恰好 2 个，再右移就「欠账」（missing 回到 1），因此 4 已是最优</text>
</svg>
