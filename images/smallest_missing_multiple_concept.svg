<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：升序枚举 k 的倍数 + 集合判存在</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums array -->
  <text x="170" y="84" text-anchor="end" font-size="14" fill="#2b2b2b">nums =</text>
  <g filter="url(#sk)">
    <rect x="191" y="58" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="249" y="58" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="307" y="58" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="365" y="58" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="423" y="58" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="217" y="83">8</text>
    <text x="275" y="83">2</text>
    <text x="333" y="83">3</text>
    <text x="391" y="83">4</text>
    <text x="449" y="83">6</text>
  </g>

  <path d="M 320 102 Q 314 118 320 134" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- set pill -->
  <g filter="url(#sk)">
    <rect x="165" y="136" width="310" height="34" rx="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="158" text-anchor="middle" font-size="13.5" fill="#7a5415">S = set(nums) = {2, 3, 4, 6, 8}</text>

  <path d="M 320 174 Q 326 190 320 206" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- multiples row -->
  <text x="150" y="237" text-anchor="end" font-size="13" fill="#2b2b2b">k = 2 的倍数</text>
  <g filter="url(#sk)">
    <rect x="158" y="210" width="60" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="224" y="210" width="60" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="290" y="210" width="60" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="356" y="210" width="60" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="422" y="210" width="60" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6,4"/>
    <rect x="488" y="210" width="60" height="44" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.4"/>
  </g>
  <g font-size="15" text-anchor="middle">
    <text x="188" y="237" fill="#2e5e22">2 ✓</text>
    <text x="254" y="237" fill="#2e5e22">4 ✓</text>
    <text x="320" y="237" fill="#2e5e22">6 ✓</text>
    <text x="386" y="237" fill="#2e5e22">8 ✓</text>
    <text x="452" y="237" fill="#b85450" font-weight="bold">10 ✗</text>
    <text x="518" y="237" fill="#888">…</text>
  </g>
  <text x="188" y="268" text-anchor="middle" font-size="10.5" fill="#777">在 S 中</text>
  <text x="254" y="268" text-anchor="middle" font-size="10.5" fill="#777">在 S 中</text>
  <text x="320" y="268" text-anchor="middle" font-size="10.5" fill="#777">在 S 中</text>
  <text x="386" y="268" text-anchor="middle" font-size="10.5" fill="#777">在 S 中</text>
  <text x="452" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">不在 ⇒ 答案！</text>
  <text x="518" y="268" text-anchor="middle" font-size="10.5" fill="#888">无穷</text>

  <path d="M 452 278 Q 446 292 448 306" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- answer -->
  <g filter="url(#sk)">
    <rect x="352" y="308" width="190" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="447" y="336" text-anchor="middle" font-size="16" fill="#7a5415" font-weight="bold">ans = 10</text>

  <text x="320" y="378" text-anchor="middle" font-size="11" fill="#888">值域 nums[i] ≤ 100 ⇒ 大于 100 的倍数必缺失 ⇒ 爬升必在 200 以内停止</text>
</svg>
