<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="470" fill="#fdfcf7"/>
  <text x="470" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：双条件打擂台逐步走查</text>
  <path d="M 300 36 Q 470 44 640 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="58" text-anchor="middle" font-size="11.5" fill="#888">nums = [2, 9, 15, 50]，divisors = [5, 3, 7, 2]</text>

  <!-- 表头 -->
  <g filter="url(#sk)"><rect x="60" y="70" width="50" height="34" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="85" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">步骤</text>
  <g filter="url(#sk)"><rect x="110" y="70" width="70" height="34" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="145" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">除数 d</text>
  <g filter="url(#sk)"><rect x="180" y="70" width="80" height="34" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="220" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">得分 cnt</text>
  <g filter="url(#sk)"><rect x="260" y="70" width="320" height="34" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="420" y="92" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">判定（依次检查两个条件）</text>
  <g filter="url(#sk)"><rect x="580" y="70" width="110" height="34" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="635" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">动作</text>
  <g filter="url(#sk)"><rect x="690" y="70" width="190" height="34" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="785" y="92" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">擂主 (bestCnt, bestD)</text>

  <!-- 行 1：d=5 上擂 -->
  <g filter="url(#sk)"><rect x="60" y="104" width="50" height="52" fill="#eef4fb" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="85" y="136" text-anchor="middle" font-size="12" fill="#333">1</text>
  <g filter="url(#sk)"><rect x="110" y="104" width="70" height="52" fill="#eef4fb" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="145" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <g filter="url(#sk)"><rect x="180" y="104" width="80" height="52" fill="#eef4fb" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="220" y="136" text-anchor="middle" font-size="12" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="260" y="104" width="320" height="52" fill="#eef4fb" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="420" y="136" text-anchor="middle" font-size="12" fill="#444">2 &gt; <tspan fill="#2e6e2e" font-weight="bold">−1 ✓</tspan></text>
  <g filter="url(#sk)"><rect x="580" y="104" width="110" height="52" fill="#eef4fb" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="635" y="136" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">上擂</text>
  <g filter="url(#sk)"><rect x="690" y="104" width="190" height="52" fill="#eef4fb" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="785" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(2, 5)</text>

  <!-- 行 2：d=3 平局换擂 -->
  <g filter="url(#sk)"><rect x="60" y="156" width="50" height="52" fill="#eaf6ee" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="85" y="188" text-anchor="middle" font-size="12" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="110" y="156" width="70" height="52" fill="#eaf6ee" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="145" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <g filter="url(#sk)"><rect x="180" y="156" width="80" height="52" fill="#eaf6ee" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="220" y="188" text-anchor="middle" font-size="12" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="260" y="156" width="320" height="52" fill="#eaf6ee" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="420" y="188" text-anchor="middle" font-size="12" fill="#444">2 &gt; 2 <tspan fill="#b03a3a" font-weight="bold">✗</tspan>；2 == 2 且 3 &lt; 5 <tspan fill="#2e6e2e" font-weight="bold">✓</tspan></text>
  <g filter="url(#sk)"><rect x="580" y="156" width="110" height="52" fill="#eaf6ee" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="635" y="188" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">换擂</text>
  <g filter="url(#sk)"><rect x="690" y="156" width="190" height="52" fill="#eaf6ee" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="785" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(2, 3)</text>

  <!-- 行 3：d=7 跳过 -->
  <g filter="url(#sk)"><rect x="60" y="208" width="50" height="52" fill="#f0ede4" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="85" y="240" text-anchor="middle" font-size="12" fill="#333">3</text>
  <g filter="url(#sk)"><rect x="110" y="208" width="70" height="52" fill="#f0ede4" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="145" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <g filter="url(#sk)"><rect x="180" y="208" width="80" height="52" fill="#f0ede4" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="220" y="240" text-anchor="middle" font-size="12" fill="#333">0</text>
  <g filter="url(#sk)"><rect x="260" y="208" width="320" height="52" fill="#f0ede4" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="420" y="240" text-anchor="middle" font-size="12" fill="#444">0 &gt; 2 <tspan fill="#b03a3a" font-weight="bold">✗</tspan>；0 == 2 <tspan fill="#b03a3a" font-weight="bold">✗</tspan></text>
  <g filter="url(#sk)"><rect x="580" y="208" width="110" height="52" fill="#f0ede4" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="635" y="240" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">跳过</text>
  <g filter="url(#sk)"><rect x="690" y="208" width="190" height="52" fill="#f0ede4" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="785" y="240" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">(2, 3)</text>

  <!-- 行 4：d=2 平局换擂（最终答案） -->
  <g filter="url(#sk)"><rect x="60" y="260" width="50" height="52" fill="#eaf6ee" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="85" y="292" text-anchor="middle" font-size="12" fill="#333">4</text>
  <g filter="url(#sk)"><rect x="110" y="260" width="70" height="52" fill="#eaf6ee" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="145" y="292" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">2</text>
  <g filter="url(#sk)"><rect x="180" y="260" width="80" height="52" fill="#eaf6ee" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="220" y="292" text-anchor="middle" font-size="12" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="260" y="260" width="320" height="52" fill="#eaf6ee" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="420" y="292" text-anchor="middle" font-size="12" fill="#444">2 &gt; 2 <tspan fill="#b03a3a" font-weight="bold">✗</tspan>；2 == 2 且 2 &lt; 3 <tspan fill="#2e6e2e" font-weight="bold">✓</tspan></text>
  <g filter="url(#sk)"><rect x="580" y="260" width="110" height="52" fill="#eaf6ee" stroke="#b8b8b8" stroke-width="1"/></g>
  <text x="635" y="292" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">换擂</text>
  <g filter="url(#sk)"><rect x="690" y="260" width="190" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="785" y="292" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold">(2, 2) ★</text>

  <!-- 结论框 -->
  <g filter="url(#sk)">
    <rect x="60" y="336" width="520" height="88" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="82" y="360" font-size="13" font-weight="bold" fill="#2e6e2e">结论</text>
  <text x="82" y="384" font-size="11" fill="#444">两次换擂均由<tspan fill="#2e6e2e" font-weight="bold">第二条件</tspan>（平局且数值更小）触发：</text>
  <text x="82" y="406" font-size="11" fill="#444">bestD 依次 5 → 3 → 2；最高分 2 的并列者 {5, 3, 2} 中</text>
  <text x="82" y="428" font-size="11" fill="#444">数值最小者为 2 → 返回 <tspan fill="#b03a3a" font-weight="bold">2 ★</tspan></text>

  <!-- 反例对照框 -->
  <g filter="url(#sk)">
    <rect x="600" y="336" width="280" height="88" rx="8" fill="#fdf2f3" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="616" y="360" font-size="13" font-weight="bold" fill="#7a2828">反例对照</text>
  <text x="616" y="384" font-size="11" fill="#444">若只用单条件 cnt &gt; bestCnt：</text>
  <text x="616" y="406" font-size="11" fill="#444">步 2、步 4 均不换擂</text>
  <text x="616" y="428" font-size="11" fill="#444">→ 错留 5，正确答案应是 2</text>
</svg>
