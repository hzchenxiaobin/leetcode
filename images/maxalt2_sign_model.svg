<svg xmlns="http://www.w3.org/2000/svg" width="640" height="436" viewBox="0 0 640 436" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="436" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：得分只取决于「谁进 + 组」</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="320" y="72" text-anchor="middle" font-size="13" fill="#666">无论怎么重排，n = 7 个位置的正负号固定不变：</text>

  <g filter="url(#sk)">
    <rect x="118" y="84" width="52" height="50" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="178" y="84" width="52" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="238" y="84" width="52" height="50" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="298" y="84" width="52" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="358" y="84" width="52" height="50" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="418" y="84" width="52" height="50" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="478" y="84" width="52" height="50" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <g font-size="21" text-anchor="middle" font-weight="bold">
    <text x="144" y="117" fill="#2b6e9e">+</text>
    <text x="204" y="117" fill="#8e3a34">−</text>
    <text x="264" y="117" fill="#2b6e9e">+</text>
    <text x="324" y="117" fill="#8e3a34">−</text>
    <text x="384" y="117" fill="#2b6e9e">+</text>
    <text x="444" y="117" fill="#8e3a34">−</text>
    <text x="504" y="117" fill="#2b6e9e">+</text>
  </g>
  <text x="106" y="148" font-size="11" fill="#999" text-anchor="end">下标</text>
  <g font-size="11" text-anchor="middle" fill="#999">
    <text x="144" y="148">0</text>
    <text x="204" y="148">1</text>
    <text x="264" y="148">2</text>
    <text x="324" y="148">3</text>
    <text x="384" y="148">4</text>
    <text x="444" y="148">5</text>
    <text x="504" y="148">6</text>
  </g>

  <text x="320" y="172" text-anchor="middle" font-size="12.5" fill="#555">＋号位共 ⌈n/2⌉ = 4 个，－号位共 ⌊n/2⌋ = 3 个（n 为奇数时 + 号多一个）</text>

  <path d="M 264 182 Q 240 192 190 200" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 324 182 Q 350 192 400 200" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="48" y="206" width="264" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="328" y="206" width="264" height="86" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="180" y="232" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">＋ 组 → 放进 4 个偶数位</text>
  <text x="180" y="254" text-anchor="middle" font-size="12.5" fill="#2e5e22">每个元素贡献 +x²</text>
  <text x="180" y="276" text-anchor="middle" font-size="12" fill="#4a7a3a">组内怎么摆，得分都一样</text>
  <text x="460" y="232" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8e3a34">－ 组 → 放进 3 个奇数位</text>
  <text x="460" y="254" text-anchor="middle" font-size="12.5" fill="#8e3a34">每个元素贡献 −x²</text>
  <text x="460" y="276" text-anchor="middle" font-size="12" fill="#b85450">组内怎么摆，得分都一样</text>

  <g filter="url(#sk)">
    <rect x="70" y="306" width="500" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="331" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">score ＝ （＋组平方和） − （－组平方和）</text>

  <g filter="url(#sk)">
    <rect x="40" y="362" width="560" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="385" text-anchor="middle" font-size="12.5" fill="#7a5415">平方消灭符号：(−3)² ＝ 3² ＝ 9 ⇒ 元素正负无关，只看 |x|</text>
  <text x="320" y="408" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">问题归结为：挑 ⌈n/2⌉ 个平方最大的元素进 ＋ 组</text>
</svg>
