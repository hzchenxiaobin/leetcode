<svg xmlns="http://www.w3.org/2000/svg" width="920" height="530" viewBox="0 0 920 530" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="arP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8e5db8"/>
    </marker>
  </defs>
  <rect width="920" height="530" fill="#fdfcf7"/>
  <text x="460" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">状态设计与三类转移（状态都以某个下标 i 结尾）</text>
  <path d="M 290 42 Q 460 48 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左侧：状态定义 -->
  <g filter="url(#sk)">
    <rect x="40" y="70" width="262" height="140" rx="9" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="60" y="94" font-size="13" font-weight="bold" fill="#2b6e9e">A 状态（无删除）</text>
  <text x="60" y="116" font-size="11" fill="#444">子数组内部没有删除元素</text>
  <text x="60" y="136" font-size="11" fill="#444">记录 (lenA, sgnA)：</text>
  <text x="60" y="156" font-size="11" fill="#444">lenA = 以 i 结尾的最长长度</text>
  <text x="60" y="176" font-size="11" fill="#444">sgnA = 结尾比较的符号</text>
  <text x="60" y="196" font-size="10" fill="#888">lenA = 1 时结尾无比较，sgnA 记 0</text>

  <g filter="url(#sk)">
    <rect x="40" y="228" width="262" height="118" rx="9" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="60" y="252" font-size="13" font-weight="bold" fill="#7a5415">B 状态（恰好删 1 个）</text>
  <text x="60" y="274" font-size="11" fill="#444">子数组内部恰好删掉一个元素</text>
  <text x="60" y="294" font-size="11" fill="#444">按结尾符号存两个长度：</text>
  <text x="60" y="314" font-size="11" fill="#7a5415" font-weight="bold">bPos（结尾符号 +1）</text>
  <text x="60" y="334" font-size="11" fill="#7a5415" font-weight="bold">bNeg（结尾符号 −1）</text>

  <!-- 右侧：转移图 -->
  <g font-size="10" fill="#888">
    <text x="385" y="92" text-anchor="middle">以 i−2 结尾</text>
    <text x="605" y="92" text-anchor="middle">以 i−1 结尾</text>
    <text x="825" y="92" text-anchor="middle">以 i 结尾</text>
  </g>
  <g>
    <g filter="url(#sk)"><rect x="330" y="100" width="110" height="54" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" rx="8"/></g>
    <text x="385" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e">A</text>
    <text x="385" y="143" text-anchor="middle" font-size="10" fill="#2b6e9e">(lenA, sgnA)</text>
    <g filter="url(#sk)"><rect x="550" y="100" width="110" height="54" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" rx="8"/></g>
    <text x="605" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e">A</text>
    <text x="605" y="143" text-anchor="middle" font-size="10" fill="#2b6e9e">(lenA, sgnA)</text>
    <g filter="url(#sk)"><rect x="770" y="100" width="110" height="54" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" rx="8"/></g>
    <text x="825" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e">A</text>
    <text x="825" y="143" text-anchor="middle" font-size="10" fill="#2b6e9e">(lenA, sgnA)</text>
  </g>
  <path d="M 664 127 L 766 127" stroke="#4a8edb" stroke-width="2.2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="715" cy="107" r="11" fill="#4a8edb"/></g>
  <text x="715" y="111" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>

  <g font-size="10" fill="#888">
    <text x="605" y="268" text-anchor="middle">以 i−1 结尾</text>
    <text x="825" y="268" text-anchor="middle">以 i 结尾</text>
  </g>
  <g>
    <g filter="url(#sk)"><rect x="550" y="276" width="110" height="54" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" rx="8"/></g>
    <text x="605" y="300" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">B</text>
    <text x="605" y="319" text-anchor="middle" font-size="10" fill="#7a5415">bPos / bNeg</text>
    <g filter="url(#sk)"><rect x="770" y="276" width="110" height="54" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" rx="8"/></g>
    <text x="825" y="300" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">B</text>
    <text x="825" y="319" text-anchor="middle" font-size="10" fill="#7a5415">bPos / bNeg</text>
  </g>
  <path d="M 664 303 L 766 303" stroke="#c98a2b" stroke-width="2.2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="715" cy="283" r="11" fill="#c98a2b"/></g>
  <text x="715" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text>

  <path d="M 385 162 Q 540 260 762 300" stroke="#8e5db8" stroke-width="2.2" fill="none" stroke-dasharray="7 4" marker-end="url(#arP)" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="520" cy="228" r="11" fill="#8e5db8"/></g>
  <text x="520" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
  <text x="558" y="262" font-size="9.5" fill="#b03a3a" font-weight="bold">跳过 i−1（它被删除）</text>

  <!-- 左下：为什么 B 存两份 -->
  <g filter="url(#sk)">
    <rect x="40" y="364" width="262" height="118" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="60" y="388" font-size="12" font-weight="bold" fill="#2e6e2e">为什么 B 按符号存两份？</text>
  <text x="60" y="410" font-size="10.5" fill="#444">B 段的结尾比较有两种来源：</text>
  <text x="60" y="428" font-size="10.5" fill="#444">① nums[i−1] ↔ nums[i]（删除更早）</text>
  <text x="60" y="446" font-size="10.5" fill="#444">② nums[i−2] ↔ nums[i]（刚桥接）</text>
  <text x="60" y="464" font-size="10.5" fill="#444">两种来源的符号不一定相同，而</text>
  <text x="60" y="482" font-size="10.5" fill="#2e6e2e">后续延伸只看结尾符号 + 长度</text>

  <!-- 底部：三类转移说明 -->
  <g filter="url(#sk)">
    <rect x="330" y="364" width="550" height="118" rx="9" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="350" y="388" font-size="12" font-weight="bold" fill="#2b2b2b">三类转移（s = sgn(nums[i] − nums[i−1])）</text>
  <text x="350" y="410" font-size="10.5" fill="#2b6e9e">① A→A 延伸 / 重启：s=0 → lenA=1；s=−sgnA → lenA+1；否则重启为 2</text>
  <text x="350" y="432" font-size="10.5" fill="#7a5415">② B→B 延伸（删除在更早处）：s≠0 时 B[i][s] ← B[i−1][−s] + 1</text>
  <text x="350" y="454" font-size="10.5" fill="#5a3a7a">③ A(i−2)→B(i) 桥接（删除 i−1）：t = sgn(nums[i] − nums[i−2]) ≠ 0；</text>
  <text x="366" y="472" font-size="10.5" fill="#5a3a7a">t = −sgnA(i−2) 时长度 lenA(i−2)+1，否则退化为 2（[i−2, i] 本身合法）</text>
  <text x="350" y="490" font-size="10.5" fill="#2e6e2e" font-weight="bold">答案 = 所有位置的 max(lenA, bPos, bNeg)，下界 1</text>
</svg>
