<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察二：中间段——首步二选一，f(m) = 2 × f(m−1)</text>
  <path d="M 140 36 Q 320 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#666">设中间段为 [a, b, c, d]（m = 4），两端各紧贴一个 sick（红格）</text>

  <g filter="url(#sk)"><rect x="153" y="80" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="175" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">病</text>
  <g filter="url(#sk)"><rect x="211" y="80" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="233" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">a</text>
  <g filter="url(#sk)"><rect x="269" y="80" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="291" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">b</text>
  <g filter="url(#sk)"><rect x="327" y="80" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="349" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">c</text>
  <g filter="url(#sk)"><rect x="385" y="80" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="407" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">d</text>
  <g filter="url(#sk)"><rect x="443" y="80" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="465" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">病</text>

  <text x="233" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">紧贴 sick ✓</text>
  <text x="291" y="144" text-anchor="middle" font-size="11" fill="#888">只挨健康者 ✗</text>
  <text x="349" y="144" text-anchor="middle" font-size="11" fill="#888">只挨健康者 ✗</text>
  <text x="407" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">紧贴 sick ✓</text>

  <path d="M 233 150 Q 233 164 195 170" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 407 150 Q 407 164 445 170" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="55" y="174" width="260" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="185" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#a87b1e">先传染 a</text>
  <text x="185" y="216" text-anchor="middle" font-size="12" fill="#444">剩 [b, c, d] 夹在 sick(a) 与右 sick 之间</text>
  <text x="185" y="234" text-anchor="middle" font-size="12" fill="#444">—— 还是中间段，规模 m−1 = 3</text>
  <text x="185" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#a87b1e">剩余顺序：f(3) 种</text>

  <g filter="url(#sk)"><rect x="325" y="174" width="260" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="455" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#a87b1e">先传染 d</text>
  <text x="455" y="216" text-anchor="middle" font-size="12" fill="#444">剩 [a, b, c] 夹在左 sick 与 sick(d) 之间</text>
  <text x="455" y="234" text-anchor="middle" font-size="12" fill="#444">—— 还是中间段，规模 m−1 = 3</text>
  <text x="455" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#a87b1e">剩余顺序：f(3) 种</text>

  <g filter="url(#sk)"><rect x="55" y="272" width="530" height="88" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">递推与初值：f(1) = 1，f(m) = 2 × f(m−1)（m ≥ 2）</text>
  <text x="320" y="318" text-anchor="middle" font-size="12" fill="#444">⟹ f(m) = 2^(m−1)：m = 1→1，2→2，3→4，4→8，5→16</text>
  <text x="320" y="344" text-anchor="middle" font-size="12" fill="#444">首步二选一后，剩余部分是同型子问题（双射，不重不漏）</text>

  <g filter="url(#sk)"><rect x="55" y="376" width="530" height="62" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">对比：开放段首步别无选择（只有紧贴 sick 的那一端）</text>
  <text x="320" y="420" text-anchor="middle" font-size="12" fill="#444">所以开放段内部顺序恒为 1 种，不进入 2 的幂因子</text>

  <text x="320" y="456" text-anchor="middle" font-size="11" fill="#666">直觉：任意时刻段内已感染集合 = 左前缀 ∪ 右后缀，每步选一端推进；最后一人两条路合流</text>
</svg>
