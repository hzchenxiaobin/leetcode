<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>
  <text x="290" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">构造：峰值居中，两翼同奇偶递减（n = 6）</text>
  <path d="M 130 40 Q 290 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- 值序列格子：1 3 5 | 6 | 4 2 -->
  <text x="305" y="62" text-anchor="middle" font-size="12" fill="#8a6415">峰值 n：出场 2 次，居中</text>
  <g filter="url(#rough2)"><rect x="85" y="70" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="113" y="99" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e5e2e">1</text>
  <g filter="url(#rough2)"><rect x="149" y="70" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="177" y="99" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e5e2e">3</text>
  <g filter="url(#rough2)"><rect x="213" y="70" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="241" y="99" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e5e2e">5</text>
  <g filter="url(#rough2)"><rect x="277" y="70" width="56" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="305" y="99" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a6415">6</text>
  <g filter="url(#rough2)"><rect x="341" y="70" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="369" y="99" text-anchor="middle" font-size="18" font-weight="bold" fill="#3a5a7a">4</text>
  <g filter="url(#rough2)"><rect x="405" y="70" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="433" y="99" text-anchor="middle" font-size="18" font-weight="bold" fill="#3a5a7a">2</text>

  <!-- 两翼标注 -->
  <path d="M 105 128 Q 165 142 235 128" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="152" text-anchor="middle" font-size="12" fill="#2e5e2e">与 n 异奇偶，升序</text>
  <path d="M 415 128 Q 385 142 355 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="385" y="152" text-anchor="middle" font-size="12" fill="#3a5a7a">与 n 同奇偶，降序</text>

  <!-- 环闭合边 -->
  <path d="M 433 118 C 410 190 170 190 118 122" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4"
        fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="275" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36">环：闭合边 1 × 2 = 2</text>
  <text x="275" y="204" text-anchor="middle" font-size="12" fill="#a03a36">⟹ 环得分 = 路径得分 + 2</text>

  <!-- 底部：跳奇偶 vs 连续 -->
  <text x="290" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">为什么两翼「跳奇偶」而不是连续递减？（n = 8 顶部 5 值）</text>

  <text x="100" y="284" text-anchor="end" font-size="13" font-weight="bold" fill="#2e5e2e">跳奇偶</text>
  <g filter="url(#rough2)"><rect x="115" y="262" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="139" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e">5</text>
  <g filter="url(#rough2)"><rect x="171" y="262" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="195" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e">7</text>
  <g filter="url(#rough2)"><rect x="227" y="262" width="48" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="251" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415">8</text>
  <g filter="url(#rough2)"><rect x="283" y="262" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="307" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e">6</text>
  <g filter="url(#rough2)"><rect x="339" y="262" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="363" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e">4</text>
  <text x="240" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">35 + 56 + 48 + 24 = 163 ✓</text>
  <text x="435" y="286" text-anchor="start" font-size="12" fill="#555">（计入两翼外侧后 186）</text>

  <text x="100" y="352" text-anchor="end" font-size="13" font-weight="bold" fill="#a03a36">连续</text>
  <g filter="url(#rough2)"><rect x="115" y="330" width="48" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="139" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#a03a36">4</text>
  <g filter="url(#rough2)"><rect x="171" y="330" width="48" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="195" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#a03a36">6</text>
  <g filter="url(#rough2)"><rect x="227" y="330" width="48" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="251" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#a03a36">7</text>
  <g filter="url(#rough2)"><rect x="283" y="330" width="48" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="307" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#a03a36">8</text>
  <g filter="url(#rough2)"><rect x="339" y="330" width="48" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="363" y="354" text-anchor="middle" font-size="15" font-weight="bold" fill="#a03a36">5</text>
  <text x="240" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#a03a36">24 + 42 + 56 + 40 = 162 ✗</text>
  <text x="435" y="354" text-anchor="start" font-size="12" fill="#555">（计入两翼外侧后 184）</text>
</svg>
