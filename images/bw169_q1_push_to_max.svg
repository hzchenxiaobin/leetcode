<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">只能加不能减 —— 全部抬到 max = 3</text>

  <!-- 目标线 -->
  <path d="M80,150 L450,150" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="458" y="154" font-size="12" fill="#b85450" filter="url(#rough2)">max=3</text>

  <!-- 基线 -->
  <path d="M80,260 L450,260" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- 柱子 1: 值 2 -->
  <rect x="110" y="190" width="56" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="110" y="150" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="138" y="176" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">+1</text>
  <text x="138" y="281" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <!-- 柱子 2: 值 1 -->
  <rect x="200" y="230" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="150" width="56" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="228" y="196" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">+2</text>
  <text x="228" y="281" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- 柱子 3: 值 3 -->
  <rect x="290" y="150" width="56" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="318" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">已是 max</text>
  <text x="318" y="281" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <!-- 图例 -->
  <rect x="110" y="300" width="18" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="136" y="311" font-size="11" fill="#446688" filter="url(#rough2)">原有高度</text>
  <rect x="230" y="300" width="18" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="256" y="311" font-size="11" fill="#d6a040" filter="url(#rough2)">需要补的步数</text>

  <path d="M352,120 L410,120" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="118" font-size="11" fill="#b85450" filter="url(#rough2)">抬得越高</text>
  <text x="440" y="134" font-size="11" fill="#b85450" filter="url(#rough2)">步数越多</text>
</svg>
