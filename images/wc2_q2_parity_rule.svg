<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">首项会不会被删？只看方向与剩余个数的奇偶</text>
  <text x="280" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">不变量：序列 = head, head+step, …, head+(rem−1)·step</text>

  <rect x="30" y="60" width="500" height="106" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="82" font-size="11.5" font-weight="bold" fill="#2a4660" filter="url(#rough2)">① 从左到右：第一个数必被删，与 rem 无关</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="56" y="94" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="73" y="114" fill="#8a6a20" font-weight="bold">2</text>
    <rect x="96" y="94" width="34" height="30" fill="#f0f5ff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="113" y="114" fill="#333">4</text>
    <rect x="136" y="94" width="34" height="30" fill="#f0f5ff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="153" y="114" fill="#333">6</text>
    <rect x="176" y="94" width="34" height="30" fill="#f0f5ff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="193" y="114" fill="#333">8</text>
  </g>
  <g stroke="#b85450" stroke-width="1.6" filter="url(#rough2)">
    <line x1="64" y1="102" x2="82" y2="118"/>
    <line x1="82" y1="102" x2="64" y2="118"/>
  </g>
  <path d="M 226 109 L 268 109" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="286" y="104" font-size="10.5" fill="#2a4660" filter="url(#rough2)">删 2 与 6 → 剩 [4, 8]</text>
  <text x="286" y="120" font-size="10.5" fill="#2a4660" filter="url(#rough2)">head = 2 + step = 4</text>
  <text x="48" y="152" font-size="10" fill="#5a6a88" filter="url(#rough2)">规则：head ← head + step，无需任何判断</text>

  <rect x="30" y="174" width="500" height="166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="196" font-size="11.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">② 从右到左：先删最后一个，首项是否被删取决于 rem 的奇偶</text>

  <text x="46" y="224" font-size="10" fill="#8a6a20" filter="url(#rough2)">rem = 4（偶）</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="150" y="206" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="167" y="226" fill="#2f5424" font-weight="bold">2</text>
    <rect x="190" y="206" width="34" height="30" fill="#f7f7f7" stroke="#999" stroke-width="1.3" rx="4"/>
    <text x="207" y="226" fill="#666">4</text>
    <rect x="230" y="206" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="247" y="226" fill="#2f5424" font-weight="bold">6</text>
    <rect x="270" y="206" width="34" height="30" fill="#f7f7f7" stroke="#999" stroke-width="1.3" rx="4"/>
    <text x="287" y="226" fill="#666">8</text>
  </g>
  <g stroke="#b85450" stroke-width="1.6" filter="url(#rough2)">
    <line x1="198" y1="214" x2="216" y2="230"/>
    <line x1="216" y1="214" x2="198" y2="230"/>
    <line x1="278" y1="214" x2="296" y2="230"/>
    <line x1="296" y1="214" x2="278" y2="230"/>
  </g>
  <text x="322" y="220" font-size="10" fill="#3a5a30" filter="url(#rough2)">首项 2 幸存 ⇒ head 不变，仍为 2</text>
  <text x="322" y="234" font-size="10" fill="#3a5a30" filter="url(#rough2)">新序列 [2, 6]，step 翻倍为 4</text>

  <text x="46" y="298" font-size="10" fill="#8a6a20" filter="url(#rough2)">rem = 5（奇）</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="150" y="280" width="34" height="30" fill="#f7f7f7" stroke="#999" stroke-width="1.3" rx="4"/>
    <text x="167" y="300" fill="#666">2</text>
    <rect x="190" y="280" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="207" y="300" fill="#2f5424" font-weight="bold">4</text>
    <rect x="230" y="280" width="34" height="30" fill="#f7f7f7" stroke="#999" stroke-width="1.3" rx="4"/>
    <text x="247" y="300" fill="#666">6</text>
    <rect x="270" y="280" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="287" y="300" fill="#2f5424" font-weight="bold">8</text>
    <rect x="310" y="280" width="34" height="30" fill="#f7f7f7" stroke="#999" stroke-width="1.3" rx="4"/>
    <text x="327" y="300" fill="#666">10</text>
  </g>
  <g stroke="#b85450" stroke-width="1.6" filter="url(#rough2)">
    <line x1="158" y1="288" x2="176" y2="304"/>
    <line x1="176" y1="288" x2="158" y2="304"/>
    <line x1="238" y1="288" x2="256" y2="304"/>
    <line x1="256" y1="288" x2="238" y2="304"/>
    <line x1="318" y1="288" x2="336" y2="304"/>
    <line x1="336" y1="288" x2="318" y2="304"/>
  </g>
  <text x="362" y="294" font-size="10" fill="#3a5a30" filter="url(#rough2)">首项 2 也被删 ⇒ head ← 2 + 2 = 4</text>
  <text x="362" y="308" font-size="10" fill="#3a5a30" filter="url(#rough2)">新序列 [4, 8]，step 翻倍为 4</text>

  <rect x="40" y="356" width="480" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="377" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">口诀：左→右必动，右→左看奇偶（rem 为奇数才动 head）</text>
</svg>
