<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="42" text-anchor="middle" font-size="19" font-weight="bold" fill="#446688" filter="url(#rough2)">b = n 的二进制位数 ⟹ 答案 = 2^b − 1</text>

  <!-- n = 10 = 1010 -->
  <text x="115" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">n = 10 = 1010</text>
  <rect x="47" y="102" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="85" y="102" width="34" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="123" y="102" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="161" y="102" width="34" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="64" y="128" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="102" y="128" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="140" y="128" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="178" y="128" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="115" y="168" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">b = 4（红格是 0 位）</text>

  <!-- arrow -->
  <path d="M 212 122 Q 252 108 292 120" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="252" y="98" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">补满 b 位</text>

  <!-- x = 15 = 1111 -->
  <text x="405" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">x = 1111 = 15 = 2⁴ − 1</text>
  <rect x="337" y="102" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="375" y="102" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="413" y="102" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="451" y="102" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="354" y="128" text-anchor="middle" font-size="15" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="392" y="128" text-anchor="middle" font-size="15" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="430" y="128" text-anchor="middle" font-size="15" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="468" y="128" text-anchor="middle" font-size="15" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="405" y="168" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">b 位全 1</text>

  <!-- case A -->
  <rect x="25" y="205" width="230" height="105" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="140" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">情况 A：n 本身全 1</text>
  <text x="140" y="258" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">n = 3 = 11, n = 7 = 111</text>
  <text x="140" y="282" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">此时 n == 2^b − 1</text>
  <text x="140" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">答案 = n 自己 ✓</text>

  <!-- case B -->
  <rect x="275" y="205" width="230" height="105" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="390" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">情况 B：n 含 0 位</text>
  <text x="390" y="258" text-anchor="middle" font-size="13" fill="#99741c" filter="url(#rough2)">n = 5 → 7, n = 10 → 15</text>
  <text x="390" y="282" text-anchor="middle" font-size="13" fill="#99741c" filter="url(#rough2)">更小的全 1 数 &lt; 2^(b−1) ≤ n</text>
  <text x="390" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">答案 = 2^b − 1 ✓</text>

  <!-- unified formula -->
  <rect x="70" y="335" width="380" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">统一公式：ans = (1 &lt;&lt; b) − 1</text>
  <text x="260" y="382" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">一个表达式覆盖两种情况，无需 if 分支</text>
</svg>
