<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">双油箱机制：每耗满 5 升，副油箱向主油箱注入 1 升</text>
  <path d="M 170 44 Q 320 52 470 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- main tank -->
  <g filter="url(#sk)">
    <rect x="70" y="78" width="160" height="122" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="82" y="118" width="136" height="70" rx="6" fill="#cfe0f5" stroke="none"/>
  </g>
  <text x="150" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">主油箱 mainTank</text>
  <text x="150" y="168" text-anchor="middle" font-size="22" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">9 升</text>

  <!-- additional tank -->
  <g filter="url(#sk)">
    <rect x="430" y="88" width="130" height="102" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="442" y="128" width="106" height="52" rx="6" fill="#cde8d4" stroke="none"/>
  </g>
  <text x="495" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">副油箱</text>
  <text x="495" y="166" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e5e24" filter="url(#sk)">2 升</text>

  <!-- transfer arrow -->
  <text x="335" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">每耗满 5 升 → 注入 1 升</text>
  <text x="335" y="119" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">离散事件：副油箱空了就停</text>
  <path d="M 428 158 Q 330 128 236 152" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="7,5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- consumption arrow -->
  <path d="M 150 204 L 150 238" stroke="#446688" stroke-width="2" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- distance box -->
  <g filter="url(#sk)">
    <rect x="63" y="244" width="175" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="150" y="268" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">每消耗 1 升 → 行驶 10 km</text>
  <text x="150" y="290" text-anchor="middle" font-size="11.5" fill="#8a6415" filter="url(#sk)">里程 = 总耗油升数 × 10</text>

  <!-- milestone panel -->
  <g filter="url(#sk)">
    <rect x="420" y="240" width="160" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="500" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">累计耗油里程碑</text>
  <path d="M 438 298 L 562 298" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <g filter="url(#sk)" stroke="#b85450" stroke-width="1.3">
    <line x1="452" y1="292" x2="452" y2="304"/>
    <line x1="481" y1="292" x2="481" y2="304"/>
    <line x1="510" y1="292" x2="510" y2="304"/>
    <line x1="539" y1="292" x2="539" y2="304"/>
  </g>
  <g filter="url(#sk)" fill="#ffffff" stroke="#b85450" stroke-width="1.5">
    <circle cx="452" cy="298" r="4"/>
    <circle cx="481" cy="298" r="4"/>
    <circle cx="510" cy="298" r="4"/>
    <circle cx="539" cy="298" r="4"/>
  </g>
  <text x="438" y="320" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">0</text>
  <text x="452" y="320" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">5</text>
  <text x="481" y="320" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">10</text>
  <text x="510" y="320" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">15</text>
  <text x="539" y="320" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">20</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="348" width="560" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="320" y="372" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">读题点：注入只在 5、10、15… 的整点触发；触发条件只看副油箱是否 ≥ 1 升</text>
</svg>
