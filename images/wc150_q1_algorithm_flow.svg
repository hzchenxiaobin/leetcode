<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 704" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/>
    </marker>
  </defs>
  <rect width="720" height="704" fill="#fafafa"/>

  <text x="360" y="34" font-size="18" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：预算只算一次，判词用副本</text>
  <rect x="210" y="56" width="300" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="360" y="83.6" font-size="13.5" fill="#333333" text-anchor="middle" filter="url(#rough2)">统计 chars 得到预算 budget[26]</text>
  <text x="198" y="83.0" font-size="12" fill="#9a9a9a" text-anchor="end" filter="url(#rough2)">①</text>
  <rect x="210" y="124" width="300" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="360" y="151.6" font-size="13.5" fill="#333333" text-anchor="middle" filter="url(#rough2)">取下一个单词 w（按输入顺序）</text>
  <text x="198" y="151.0" font-size="12" fill="#9a9a9a" text-anchor="end" filter="url(#rough2)">②</text>
  <polygon points="360,184 470,218 360,252 250,218" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="222" font-size="12.5" fill="#5a4a1a" text-anchor="middle" filter="url(#rough2)">|w| &gt; |chars| ?</text>
  <rect x="500" y="196" width="176" height="44" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="588.0" y="222.5" font-size="12.5" fill="#666666" text-anchor="middle" filter="url(#rough2)">跳过该词（必然坏）</text>
  <text x="485" y="208" font-size="12" fill="#8a7a4a" text-anchor="end" filter="url(#rough2)">是</text>
  <path d="M 470 218 L 500 218" fill="none" stroke="#9a9a9a" stroke-width="1.8" marker-end="url(#arrGy)" filter="url(#rough2)"/>
  <text x="372" y="272" font-size="12" fill="#8a7a4a" text-anchor="start" filter="url(#rough2)">否</text>
  <rect x="210" y="282" width="300" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="360" y="309.6" font-size="13.5" fill="#333333" text-anchor="middle" filter="url(#rough2)">avail ← budget，复制 26 个计数</text>
  <text x="198" y="309.0" font-size="12" fill="#9a9a9a" text-anchor="end" filter="url(#rough2)">③</text>
  <rect x="210" y="344" width="300" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="360" y="371.6" font-size="13.5" fill="#333333" text-anchor="middle" filter="url(#rough2)">遍历 w：avail[c] 减 1</text>
  <text x="198" y="371.0" font-size="12" fill="#9a9a9a" text-anchor="end" filter="url(#rough2)">④</text>
  <polygon points="360,404 480,440 360,476 240,440" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="444" font-size="12.5" fill="#5a4a1a" text-anchor="middle" filter="url(#rough2)">出现 avail[c] &lt; 0 ?</text>
  <rect x="500" y="418" width="176" height="44" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="588.0" y="444.5" font-size="12.5" fill="#666666" text-anchor="middle" filter="url(#rough2)">该词不计入</text>
  <text x="494" y="430" font-size="12" fill="#8a7a4a" text-anchor="end" filter="url(#rough2)">是</text>
  <path d="M 480 440 L 500 440" fill="none" stroke="#9a9a9a" stroke-width="1.8" marker-end="url(#arrGy)" filter="url(#rough2)"/>
  <text x="372" y="492" font-size="12" fill="#8a7a4a" text-anchor="start" filter="url(#rough2)">否</text>
  <rect x="210" y="500" width="300" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="360" y="527.6" font-size="13.5" fill="#333333" text-anchor="middle" filter="url(#rough2)">ans += |w|（该词是好串）</text>
  <text x="198" y="527.0" font-size="12" fill="#9a9a9a" text-anchor="end" filter="url(#rough2)">⑤</text>
  <polygon points="360,566 450,600 360,634 270,600" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="604" font-size="12.5" fill="#5a4a1a" text-anchor="middle" filter="url(#rough2)">还有单词？</text>
  <text x="252" y="586" font-size="12" fill="#8a7a4a" text-anchor="end" filter="url(#rough2)">是</text>
  <rect x="270" y="650" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360.0" y="672.86" font-size="13.5" fill="#2f5f22" text-anchor="middle" filter="url(#rough2)">返回 ans</text>
  <text x="372" y="646" font-size="12" fill="#8a7a4a" text-anchor="start" filter="url(#rough2)">否</text>
  <path d="M 360 634 L 360 650" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 360 102 L 360 124" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 170 L 360 184" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 252 L 360 282" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 328 L 360 344" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 390 L 360 404" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 476 L 360 500" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 546 L 360 566" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 600 L 110 600 L 110 160 L 210 160" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 588 240 L 588 268 L 690 268 L 690 600 L 456 600" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrGy)" filter="url(#rough2)"/>
  <path d="M 588 462 L 588 480 L 690 480" fill="none" stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="40" y="690" font-size="11.5" fill="#8a8a8a" text-anchor="start" filter="url(#rough2)">灰色虚线：该词处理结束，回到步骤 ②</text>
</svg>
