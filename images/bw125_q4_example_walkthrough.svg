<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 348" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="660" height="348" fill="#fafafa"/>
<text x="320" y="30" text-anchor="middle" font-size="14" fill="#555" font-weight="normal" filter="url(#roughs)">三个示例：算出收益 d，看正收益个数的奇偶，再修正一次</text>
<rect x="20" y="46" width="620" height="34" rx="6" fill="#f2f2f2" stroke="#777777" stroke-width="1.5" filter="url(#rough2)"/>
<text x="71.0" y="68" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#roughs)">示例</text>
<text x="193.0" y="68" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#roughs)">nums / k</text>
<text x="330.0" y="68" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#roughs)">收益 d_i</text>
<text x="446.0" y="68" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#roughs)">正收益个数</text>
<text x="565.0" y="68" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#roughs)">处理与答案</text>
<rect x="20" y="80" width="620" height="48" rx="6" fill="#e8f0fe" stroke="#dddddd" stroke-width="1.2" filter="url(#rough2)"/>
<text x="71.0" y="110" text-anchor="middle" font-size="13" fill="#333333" font-weight="normal" filter="url(#roughs)">示例 1</text>
<text x="193.0" y="110" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)">[1,2,1] / k=3</text>
<text x="330.0" y="110" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)">+1, −1, +1</text>
<text x="446.0" y="110" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="normal" filter="url(#roughs)">2 个（偶）</text>
<text x="565.0" y="110" text-anchor="middle" font-size="13" fill="#333333" font-weight="normal" filter="url(#roughs)">全取 → 6</text>
<rect x="20" y="128" width="620" height="48" rx="6" fill="#e6f4ea" stroke="#dddddd" stroke-width="1.2" filter="url(#rough2)"/>
<text x="71.0" y="158" text-anchor="middle" font-size="13" fill="#333333" font-weight="normal" filter="url(#roughs)">示例 4</text>
<text x="193.0" y="158" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)">[8,4] / k=5</text>
<text x="330.0" y="158" text-anchor="middle" font-size="13" fill="#333333" font-weight="normal" filter="url(#roughs)">+5, −3</text>
<text x="446.0" y="158" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="normal" filter="url(#roughs)">1 个（奇）</text>
<text x="565.0" y="158" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)">两条路取大 → 14</text>
<rect x="20" y="176" width="620" height="48" rx="6" fill="#e8f0fe" stroke="#dddddd" stroke-width="1.2" filter="url(#rough2)"/>
<text x="71.0" y="206" text-anchor="middle" font-size="13" fill="#333333" font-weight="normal" filter="url(#roughs)">示例 3</text>
<text x="193.0" y="206" text-anchor="middle" font-size="11" fill="#333333" font-weight="normal" filter="url(#roughs)">六个 7 / k=3</text>
<text x="330.0" y="206" text-anchor="middle" font-size="13" fill="#333333" font-weight="normal" filter="url(#roughs)">全为 −3</text>
<text x="446.0" y="206" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="normal" filter="url(#roughs)">0 个（偶）</text>
<text x="565.0" y="206" text-anchor="middle" font-size="13" fill="#333333" font-weight="normal" filter="url(#roughs)">不翻转 → 42</text>
<rect x="40" y="240" width="580" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="330" y="268" text-anchor="middle" font-size="12" fill="#8a5a10" font-weight="bold" filter="url(#roughs)">奇数时：max(Σd⁺ − min d⁺， Σd⁺ + max d⁻)</text>
<text x="330" y="306" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#roughs)">示例 4：max(5 − 5, 5 + (−3)) = max(0, 2) = 2 → 12 + 2 = 14</text>
<text x="330" y="328" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#roughs)">示例 3：正收益 0 个（偶），直接 Σnums = 42</text>
</svg>
