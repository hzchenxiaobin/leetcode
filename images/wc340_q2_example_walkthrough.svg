<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：值 1 的组 g = [0, 2, 3]（m = 3，total = 5）</text>

  <!-- table header -->
  <rect x="30" y="52" width="580" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="51" y="76" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="105" y="76" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">p = g[i]</text>
  <text x="181" y="76" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">prefix</text>
  <text x="299" y="76" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">left = i·p − prefix</text>
  <text x="454" y="76" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">right = (total−prefix−p)−(m−1−i)·p</text>
  <text x="584" y="76" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans[p]</text>

  <!-- row 0 -->
  <rect x="30" y="90" width="580" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="51" y="118" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="105" y="118" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="181" y="118" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="299" y="118" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0·0 − 0 = 0</text>
  <text x="454" y="118" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">(5−0−0) − 2·0 = 5</text>
  <text x="584" y="118" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- row 1 -->
  <rect x="30" y="136" width="580" height="46" fill="#fdf6e3" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="51" y="164" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="105" y="164" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="181" y="164" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="299" y="164" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1·2 − 0 = 2</text>
  <text x="454" y="164" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">(5−0−2) − 1·2 = 1</text>
  <text x="584" y="164" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- row 2 -->
  <rect x="30" y="182" width="580" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="51" y="210" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="105" y="210" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="181" y="210" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0+2 = 2</text>
  <text x="299" y="210" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2·3 − 2 = 4</text>
  <text x="454" y="210" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">(5−2−3) − 0·3 = 0</text>
  <text x="584" y="210" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- column separators -->
  <path d="M 72 56 L 72 224" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 138 56 L 138 224" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 224 56 L 224 224" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 374 56 L 374 224" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 534 56 L 534 224" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- verification note -->
  <rect x="30" y="248" width="580" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="270" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">逐项核对定义：ans[0] = |0−2|+|0−3| = 5 ✓　ans[2] = |2−0|+|2−3| = 3 ✓　ans[3] = 3+1 = 4 ✓</text>
  <text x="320" y="292" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">prefix 滚动累加：每行用的是「进入该行时」的前缀和（不含当前 p）</text>

  <!-- bottom: other groups -->
  <rect x="30" y="324" width="580" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="348" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">值 3 的组 [1]、值 2 的组 [4]：m = 1 ⇒ 代入公式 left = right = 0，无需特判</text>
  <text x="320" y="376" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最终 arr = [5, 0, 3, 4, 0] ⭐</text>
</svg>
