<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">演算走查：s = ))())( 一步步记账</text>

  <!-- 走查表 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="60" y="56" width="70" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="130" y="56" width="70" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="200" y="56" width="90" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="290" y="56" width="90" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="380" y="56" width="120" height="28" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="95" y="74">字符</text><text x="165" y="74">读前 need</text><text x="245" y="74">动作</text>
    <text x="335" y="74">读后 need</text><text x="440" y="74">res 累计</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="60" y="84" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="130" y="84" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="200" y="84" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="290" y="84" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="380" y="84" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="95" y="101">)</text><text x="165" y="101">0</text><text x="245" y="101">孤立 → 补 (</text><text x="335" y="101">1</text><text x="440" y="101">1</text>

    <rect x="60" y="110" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="130" y="110" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="200" y="110" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="290" y="110" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="380" y="110" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="95" y="127">)</text><text x="165" y="127">1</text><text x="245" y="127">配对抵 1</text><text x="335" y="127">0</text><text x="440" y="127">1</text>

    <rect x="60" y="136" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="130" y="136" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="200" y="136" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="290" y="136" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="380" y="136" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="95" y="153">(</text><text x="165" y="153">0</text><text x="245" y="153">开新对，+2</text><text x="335" y="153">2</text><text x="440" y="153">1</text>

    <rect x="60" y="162" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="130" y="162" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="200" y="162" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="290" y="162" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="380" y="162" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="95" y="179">)</text><text x="165" y="179">2</text><text x="245" y="179">配对抵 1</text><text x="335" y="179">1</text><text x="440" y="179">1</text>

    <rect x="60" y="188" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="130" y="188" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="200" y="188" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="290" y="188" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <rect x="380" y="188" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="95" y="205">)</text><text x="165" y="205">1</text><text x="245" y="205">配对抵 1</text><text x="335" y="205">0</text><text x="440" y="205">1</text>

    <rect x="60" y="214" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="130" y="214" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="200" y="214" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="290" y="214" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="380" y="214" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="95" y="231">(</text><text x="165" y="231">0</text><text x="245" y="231">开新对，+2</text><text x="335" y="231">2</text><text x="440" y="231">1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="248" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="280" y="270" font-size="13.5" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)" font-weight="bold">扫完 res = 1，末尾还欠 need = 2 个 ')' ⟹ 答案 = 1 + 2 = 3</text>

  <!-- 隔断示例 -->
  <text x="280" y="306" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">「隔断」情形：s = ()) (  →  遇第二个 ( 时 need 为奇</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="110" y="318" width="340" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="280" y="338">前一个 ( 的半个 )) 中还差 1 个 ) ⟹ 紧贴补上，绝不让半对跨过 (</text>
  </g>
  <text x="280" y="370" font-size="12" fill="#7a7a7a" text-anchor="middle" filter="url(#rough2)">交换论证：把补的 ) 挪到更远只会更贵（见正文引理）</text>
</svg>
