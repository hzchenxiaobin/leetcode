<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">单调性：用得越多越容易 → 二分答案</text>
  <path d="M 150 38 Q 340 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- why box -->
  <g filter="url(#sk)">
    <rect x="40" y="50" width="600" height="78" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="340" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">为什么 check(k) 关于 k 单调？</text>
  <text x="340" y="96" text-anchor="middle" font-size="11.5" fill="#444">① k 变大时每个 cover_k(j) 只增不减 —— 新加入的查询 val_i ≥ 1，只会往上加</text>
  <text x="340" y="118" text-anchor="middle" font-size="11.5" fill="#444">② 多出来的查询还可以「每个下标都减 0」：前 k 个可行 ⟹ 前 k+1 个也可行</text>

  <!-- concrete section -->
  <text x="340" y="154" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">示例 1（q = 3）：逐个 k 判定，✗ 与 ✓ 一定各占连续一段</text>

  <text x="190" y="172" text-anchor="middle" font-size="10.5" fill="#888">k = 0</text>
  <text x="290" y="172" text-anchor="middle" font-size="10.5" fill="#888">k = 1</text>
  <text x="390" y="172" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">k = 2 ★</text>
  <text x="490" y="172" text-anchor="middle" font-size="10.5" fill="#888">k = 3</text>

  <g filter="url(#sk)">
    <rect x="146" y="178" width="88" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="246" y="178" width="88" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="346" y="178" width="88" height="42" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/>
    <rect x="446" y="178" width="88" height="42" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="190" y="206" text-anchor="middle" font-size="18" fill="#b03a3a" font-weight="bold">✗</text>
  <text x="290" y="206" text-anchor="middle" font-size="18" fill="#b03a3a" font-weight="bold">✗</text>
  <text x="390" y="206" text-anchor="middle" font-size="18" fill="#2e6e2e" font-weight="bold">✓</text>
  <text x="490" y="206" text-anchor="middle" font-size="18" fill="#2e6e2e" font-weight="bold">✓</text>

  <text x="190" y="238" text-anchor="middle" font-size="10.5" fill="#999">cover=[0,0,0]</text>
  <text x="290" y="238" text-anchor="middle" font-size="10.5" fill="#999">cover=[1,1,1]</text>
  <text x="390" y="238" text-anchor="middle" font-size="10.5" fill="#999">cover=[2,2,2]</text>
  <text x="490" y="238" text-anchor="middle" font-size="10.5" fill="#999">cover=[2,5,2]</text>

  <text x="340" y="258" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">第一个 ✓ 就是最小答案 k* = 2（k = 3 也行，但不是最小）</text>

  <!-- generic section -->
  <text x="340" y="286" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">一般情形：把 check 看成 [0, q] 上的 0/1 函数，二分找红绿分界</text>

  <g filter="url(#sk)">
    <rect x="88" y="298" width="54" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="144" y="298" width="54" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="200" y="298" width="54" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="256" y="298" width="54" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="312" y="298" width="54" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="368" y="298" width="54" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="424" y="298" width="54" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="480" y="298" width="54" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="536" y="298" width="54" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="115" y="320" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">✗</text>
  <text x="171" y="320" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">✗</text>
  <text x="227" y="320" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">✗</text>
  <text x="283" y="320" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">✗</text>
  <text x="339" y="320" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">✓</text>
  <text x="395" y="320" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">✓</text>
  <text x="451" y="320" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">✓</text>
  <text x="507" y="320" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">✓</text>
  <text x="563" y="320" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">✓</text>

  <text x="76" y="320" text-anchor="end" font-size="11" fill="#888" font-weight="bold">k=0</text>
  <text x="604" y="320" text-anchor="start" font-size="11" fill="#888" font-weight="bold">k=q</text>

  <path d="M 310 342 L 310 336" stroke="#8a6414" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="310" y="356" text-anchor="middle" font-size="11" fill="#8a6414" font-weight="bold">红绿分界 = 最小可行 k</text>

  <!-- binary search rules -->
  <text x="340" y="380" text-anchor="middle" font-size="11.5" fill="#2e6e2e">check(mid) = ✓ → 答案 ≤ mid：hi = mid（收缩右端）</text>
  <text x="340" y="402" text-anchor="middle" font-size="11.5" fill="#b03a3a">check(mid) = ✗ → 答案 &gt; mid：lo = mid + 1（抬高左端）</text>

  <!-- conclusion box -->
  <g filter="url(#sk)">
    <rect x="40" y="414" width="600" height="48" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="340" y="435" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">先 check(q)：不可行直接返回 −1</text>
  <text x="340" y="454" text-anchor="middle" font-size="11.5" fill="#444">再在 [0, q] 上二分最小可行 k：O(log q) 次 check，每次 O(n + q) → 总 O((n+q) log q)</text>
</svg>
