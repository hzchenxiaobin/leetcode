<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [10, 12, 14, 16]，全部是偶数</text>

  <!-- 数轴 -->
  <path d="M 36 196 L 526 196" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arrG)"/>

  <!-- 非元素刻度：v=6,7,9,11,13,15,17..21,23,24 -->
  <g filter="url(#rough2)" font-size="10" fill="#777">
    <line x1="50" y1="196" x2="50" y2="203" stroke="#888"/><text x="50" y="219" text-anchor="middle">6</text>
    <line x1="76" y1="196" x2="76" y2="203" stroke="#888"/><text x="76" y="219" text-anchor="middle">7</text>
    <line x1="128" y1="196" x2="128" y2="203" stroke="#888"/><text x="128" y="219" text-anchor="middle">9</text>
    <line x1="180" y1="196" x2="180" y2="203" stroke="#888"/><text x="180" y="219" text-anchor="middle">11</text>
    <line x1="232" y1="196" x2="232" y2="203" stroke="#888"/><text x="232" y="219" text-anchor="middle">13</text>
    <line x1="284" y1="196" x2="284" y2="203" stroke="#888"/><text x="284" y="219" text-anchor="middle">15</text>
    <line x1="336" y1="196" x2="336" y2="203" stroke="#888"/><text x="336" y="219" text-anchor="middle">17</text>
    <line x1="362" y1="196" x2="362" y2="203" stroke="#888"/><text x="362" y="219" text-anchor="middle">18</text>
    <line x1="388" y1="196" x2="388" y2="203" stroke="#888"/><text x="388" y="219" text-anchor="middle">19</text>
    <line x1="414" y1="196" x2="414" y2="203" stroke="#888"/><text x="414" y="219" text-anchor="middle">20</text>
    <line x1="440" y1="196" x2="440" y2="203" stroke="#888"/><text x="440" y="219" text-anchor="middle">21</text>
    <line x1="492" y1="196" x2="492" y2="203" stroke="#888"/><text x="492" y="219" text-anchor="middle">23</text>
    <line x1="518" y1="196" x2="518" y2="203" stroke="#888"/><text x="518" y="219" text-anchor="middle">24</text>
  </g>

  <!-- 偶回文目标格：8, 22 -->
  <g filter="url(#rough2)" font-size="11" font-weight="bold" fill="#33455c">
    <rect x="92" y="186" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/>
    <text x="102" y="200" text-anchor="middle">8</text>
    <rect x="456" y="186" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/>
    <text x="466" y="200" text-anchor="middle">22</text>
  </g>

  <!-- 元素橙圈：10, 12, 14, 16 -->
  <g filter="url(#rough2)" font-size="9" font-weight="bold" fill="#8a6a1a">
    <circle cx="154" cy="196" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="154" y="200" text-anchor="middle">10</text>
    <circle cx="206" cy="196" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="206" y="200" text-anchor="middle">12</text>
    <circle cx="258" cy="196" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="258" y="200" text-anchor="middle">14</text>
    <circle cx="310" cy="196" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="310" y="200" text-anchor="middle">16</text>
  </g>

  <!-- 跳跃弧线 -->
  <path d="M 150 184 Q 128 148 110 182" stroke="#b85450" stroke-width="1.7" fill="none" stroke-dasharray="5 4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="122" y="146" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1 步</text>

  <path d="M 202 184 Q 155 110 106 180" stroke="#b85450" stroke-width="1.7" fill="none" stroke-dasharray="5 4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="152" y="122" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2 步</text>

  <path d="M 254 184 Q 180 62 104 178" stroke="#b85450" stroke-width="1.7" fill="none" stroke-dasharray="5 4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="172" y="88" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3 步</text>

  <path d="M 314 184 Q 390 60 460 178" stroke="#b85450" stroke-width="1.7" fill="none" stroke-dasharray="5 4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="386" y="86" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3 步</text>

  <text x="388" y="52" text-anchor="middle" font-size="10.5" fill="#7c3a36" filter="url(#rough2)">16→8 要 4 步，16→22 只要 3 步 ✓</text>

  <!-- 汇总表 -->
  <g filter="url(#rough2)">
    <rect x="40" y="244" width="480" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="40" y="264" width="480" height="20" fill="none" stroke="#446688" stroke-width="1.3"/>
    <rect x="40" y="284" width="480" height="20" fill="none" stroke="#446688" stroke-width="1.3"/>
    <line x1="130" y1="244" x2="130" y2="304" stroke="#446688" stroke-width="1.3"/>
    <line x1="208" y1="244" x2="208" y2="304" stroke="#446688" stroke-width="1.3"/>
    <line x1="286" y1="244" x2="286" y2="304" stroke="#446688" stroke-width="1.3"/>
    <line x1="364" y1="244" x2="364" y2="304" stroke="#446688" stroke-width="1.3"/>
    <line x1="442" y1="244" x2="442" y2="304" stroke="#446688" stroke-width="1.3"/>
    <rect x="442" y="284" width="78" height="20" fill="#fce4ec"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#33455c" text-anchor="middle">
    <text x="85" y="258" font-weight="bold">元素 x</text>
    <text x="169" y="258" font-weight="bold">10</text>
    <text x="247" y="258" font-weight="bold">12</text>
    <text x="325" y="258" font-weight="bold">14</text>
    <text x="403" y="258" font-weight="bold">16</text>
    <text x="481" y="258" font-weight="bold">合计</text>
    <text x="85" y="278">目标 t</text>
    <text x="169" y="278">8</text>
    <text x="247" y="278">8</text>
    <text x="325" y="278">8</text>
    <text x="403" y="278">22</text>
    <text x="481" y="278">—</text>
    <text x="85" y="298">代价 |t−x|/2</text>
    <text x="169" y="298">1</text>
    <text x="247" y="298">2</text>
    <text x="325" y="298">3</text>
    <text x="403" y="298">3</text>
    <text x="481" y="298" fill="#b85450" font-weight="bold" font-size="12.5">9</text>
  </g>

  <text x="280" y="330" text-anchor="middle" font-size="11.5" fill="#6b5320" filter="url(#rough2)">四个元素相互独立，各自取最近偶回文，1 + 2 + 3 + 3 = 9 即为答案</text>
</svg>
