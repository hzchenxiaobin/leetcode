<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 2 演算：两步查询后的数组与最终异或</text>
  <path d="M 140 40 Q 340 50 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- index labels above row 0 -->
  <text x="186" y="88" text-anchor="middle" font-size="10" fill="#999999" font-family="monospace">0</text>
  <text x="242" y="88" text-anchor="middle" font-size="10" fill="#999999" font-family="monospace">1</text>
  <text x="298" y="88" text-anchor="middle" font-size="10" fill="#999999" font-family="monospace">2</text>
  <text x="354" y="88" text-anchor="middle" font-size="10" fill="#999999" font-family="monospace">3</text>
  <text x="410" y="88" text-anchor="middle" font-size="10" fill="#999999" font-family="monospace">4</text>

  <!-- row 0: initial -->
  <g filter="url(#sk)">
    <rect x="160" y="96" width="52" height="44" rx="4" fill="#f7f7f7" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="216" y="96" width="52" height="44" rx="4" fill="#f7f7f7" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="272" y="96" width="52" height="44" rx="4" fill="#f7f7f7" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="328" y="96" width="52" height="44" rx="4" fill="#f7f7f7" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="384" y="96" width="52" height="44" rx="4" fill="#f7f7f7" stroke="#aaaaaa" stroke-width="1.2"/>
  </g>
  <text x="186" y="123" text-anchor="middle" font-size="13" fill="#444444" font-family="monospace">2</text>
  <text x="242" y="123" text-anchor="middle" font-size="13" fill="#444444" font-family="monospace">3</text>
  <text x="298" y="123" text-anchor="middle" font-size="13" fill="#444444" font-family="monospace">1</text>
  <text x="354" y="123" text-anchor="middle" font-size="13" fill="#444444" font-family="monospace">5</text>
  <text x="410" y="123" text-anchor="middle" font-size="13" fill="#444444" font-family="monospace">4</text>
  <text x="150" y="122" text-anchor="end" font-size="11.5" fill="#888888">初始</text>

  <!-- arrow row0 -> row1 -->
  <path d="M 446 148 L 446 182" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- row 1: query 1 -->
  <text x="160" y="180" font-size="11.5" fill="#7a5a20">查询① [1,4,2,3]：摸下标 1、3，各 ×3</text>
  <g filter="url(#sk)">
    <rect x="160" y="190" width="52" height="44" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1"/>
    <rect x="216" y="190" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="272" y="190" width="52" height="44" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1"/>
    <rect x="328" y="190" width="52" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="384" y="190" width="52" height="44" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1"/>
  </g>
  <text x="186" y="217" text-anchor="middle" font-size="13" fill="#999999" font-family="monospace">2</text>
  <text x="242" y="217" text-anchor="middle" font-size="13" fill="#a06a10" font-weight="bold" font-family="monospace">9</text>
  <text x="298" y="217" text-anchor="middle" font-size="13" fill="#999999" font-family="monospace">1</text>
  <text x="354" y="217" text-anchor="middle" font-size="13" fill="#a06a10" font-weight="bold" font-family="monospace">15</text>
  <text x="410" y="217" text-anchor="middle" font-size="13" fill="#999999" font-family="monospace">4</text>
  <text x="242" y="230" text-anchor="middle" font-size="9.5" fill="#b85450" font-family="monospace">×3</text>
  <text x="354" y="230" text-anchor="middle" font-size="9.5" fill="#b85450" font-family="monospace">×3</text>

  <!-- arrow row1 -> row2 -->
  <path d="M 446 242 L 446 286" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- row 2: query 2 -->
  <text x="160" y="284" font-size="11.5" fill="#3a5a2a">查询② [0,2,1,2]：摸下标 0、1、2，各 ×2</text>
  <g filter="url(#sk)">
    <rect x="160" y="294" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="216" y="294" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="272" y="294" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="328" y="294" width="52" height="44" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1"/>
    <rect x="384" y="294" width="52" height="44" rx="4" fill="#f2f2f2" stroke="#cccccc" stroke-width="1"/>
  </g>
  <text x="186" y="321" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" font-family="monospace">4</text>
  <text x="242" y="321" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" font-family="monospace">18</text>
  <text x="298" y="321" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold" font-family="monospace">2</text>
  <text x="354" y="321" text-anchor="middle" font-size="13" fill="#999999" font-family="monospace">15</text>
  <text x="410" y="321" text-anchor="middle" font-size="13" fill="#999999" font-family="monospace">4</text>
  <text x="186" y="334" text-anchor="middle" font-size="9.5" fill="#b85450" font-family="monospace">×2</text>
  <text x="242" y="334" text-anchor="middle" font-size="9.5" fill="#b85450" font-family="monospace">×2</text>
  <text x="298" y="334" text-anchor="middle" font-size="9.5" fill="#b85450" font-family="monospace">×2</text>

  <!-- right box: bitwise xor -->
  <g filter="url(#sk)">
    <rect x="470" y="96" width="190" height="242" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="565" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">按位异或</text>
  <text x="565" y="142" text-anchor="middle" font-size="10" fill="#888888">对取模后的最终值</text>
  <text x="492" y="168" font-size="11.5" fill="#444444" font-family="monospace">4  = 00100</text>
  <text x="492" y="190" font-size="11.5" fill="#444444" font-family="monospace">18 = 10010</text>
  <text x="492" y="212" font-size="11.5" fill="#444444" font-family="monospace">2  = 00010</text>
  <text x="492" y="234" font-size="11.5" fill="#444444" font-family="monospace">15 = 01111</text>
  <text x="492" y="256" font-size="11.5" fill="#444444" font-family="monospace">4  = 00100</text>
  <path d="M 488 268 Q 565 274 642 268" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="492" y="296" font-size="13" fill="#2e6e2e" font-weight="bold" font-family="monospace">31 = 11111</text>
  <text x="565" y="322" text-anchor="middle" font-size="10.5" fill="#888888">五个数逐位异或</text>

  <!-- result strip -->
  <g filter="url(#sk)">
    <rect x="110" y="372" width="460" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="340" y="402" text-anchor="middle" font-size="14.5" fill="#2e6e2e" font-weight="bold">ans = 4 ⊕ 18 ⊕ 2 ⊕ 15 ⊕ 4 = 31</text>
  <text x="340" y="438" text-anchor="middle" font-size="11" fill="#888888">nums[2] 只被查询②乘过一次；查询①虽覆盖 [1,4] 却跳过了它</text>
</svg>
