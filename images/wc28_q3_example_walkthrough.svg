<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：strs = ["abc", "xyz"]</text>
  <text x="290" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">best = [cba, zyx]；共 2×(3+3) = 12 个候选，下表摘录 6 个</text>

  <text x="56" y="80" font-size="10.5" fill="#666" filter="url(#rough2)">断点串 i</text>
  <text x="176" y="80" font-size="10.5" fill="#666" filter="url(#rough2)">朝向 c</text>
  <text x="296" y="80" font-size="10.5" fill="#666" filter="url(#rough2)">断点 j</text>
  <text x="366" y="80" font-size="10.5" fill="#666" filter="url(#rough2)">候选串 cand</text>
  <path d="M 46 88 L 534 88" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 46 118 L 534 118" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4" fill="none" filter="url(#rough2)"/>
  <path d="M 46 144 L 534 144" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4" fill="none" filter="url(#rough2)"/>
  <path d="M 46 170 L 534 170" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4" fill="none" filter="url(#rough2)"/>
  <path d="M 46 222 L 534 222" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4" fill="none" filter="url(#rough2)"/>
  <path d="M 46 248 L 534 248" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4" fill="none" filter="url(#rough2)"/>

  <text x="56" y="106" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="176" y="106" font-size="11" fill="#555" filter="url(#rough2)">cba (best)</text>
  <text x="296" y="106" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="366" y="106" font-size="11" fill="#555" filter="url(#rough2)">cbazyx</text>

  <text x="56" y="132" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="176" y="132" font-size="11" fill="#555" filter="url(#rough2)">abc (rev)</text>
  <text x="296" y="132" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="366" y="132" font-size="11" fill="#555" filter="url(#rough2)">bczyxa</text>

  <text x="56" y="158" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="176" y="158" font-size="11" fill="#555" filter="url(#rough2)">cba (best)</text>
  <text x="296" y="158" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="366" y="158" font-size="11" fill="#555" filter="url(#rough2)">azyxcb</text>

  <rect x="44" y="169" width="492" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="184" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="176" y="184" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">zyx (best)</text>
  <text x="296" y="184" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="366" y="184" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">zyxcba ★</text>

  <text x="56" y="210" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="176" y="210" font-size="11" fill="#555" filter="url(#rough2)">zyx (best)</text>
  <text x="296" y="210" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="366" y="210" font-size="11" fill="#555" filter="url(#rough2)">yxcbaz</text>

  <text x="56" y="236" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="176" y="236" font-size="11" fill="#555" filter="url(#rough2)">xyz (rev)</text>
  <text x="296" y="236" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="366" y="236" font-size="11" fill="#555" filter="url(#rough2)">zcbaxy</text>

  <rect x="44" y="258" width="492" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="280" font-size="11.5" fill="#3a5a2a" font-weight="bold" filter="url(#rough2)">最优：在 zyx 的首字符前剪断 → zyx + cba = zyxcba</text>
  <text x="60" y="302" font-size="10" fill="#4a7a3a" filter="url(#rough2)">等价于把串 1 整体挪到串 0 前面，其余串按圆周顺序原样跟随</text>

  <text x="60" y="336" font-size="10" fill="#777" filter="url(#rough2)">· 候选串 = 被剪开串的后半段 + 其余串 + 被剪开串的前半段</text>
  <text x="60" y="356" font-size="10" fill="#777" filter="url(#rough2)">· 以 z 开头的候选只有 zyxcba 与 zcbaxy，比较第二位 y &gt; c，前者胜出</text>
  <text x="60" y="376" font-size="10" fill="#777" filter="url(#rough2)">· 本组数据即使只试 best 朝向也恰好对；换 ["ab", "ba"] 就必须试反向</text>

  <text x="290" y="406" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">答案 zyxcba 与官方输出一致</text>
</svg>
