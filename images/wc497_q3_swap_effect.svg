<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">一次交换对窗口差值 d = #1 − #0 的影响</text>

  <!-- ============ 情形 1：两个交换位置同侧 ============ -->
  <text x="16" y="70" font-size="12" fill="#333" filter="url(#rough2)">两个交换位置同侧</text>
  <text x="16" y="88" font-size="12" fill="#333" filter="url(#rough2)">（都在窗口内或外）</text>

  <rect x="171" y="54" width="156" height="42" rx="6" fill="none" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 192 50 C 192 32, 268 32, 268 50" fill="none" stroke="#b85450" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="58" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="192" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="213" y="58" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="251" y="58" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="268" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="289" y="58" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="306" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="249" y="112" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">窗口 d=+2，交换后还是 +2</text>

  <rect x="418" y="52" width="130" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="483" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">Δd = 0</text>
  <text x="483" y="90" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">怎么换都不变</text>

  <!-- ============ 情形 2：窗口内 '1' ↔ 窗口外 '0' ============ -->
  <text x="16" y="164" font-size="12" fill="#333" filter="url(#rough2)">一内一外：</text>
  <text x="16" y="182" font-size="12" fill="#333" filter="url(#rough2)">内的 '1' ↔ 外的 '0'</text>

  <rect x="151" y="148" width="156" height="42" rx="6" fill="none" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 286 144 C 286 126, 324 126, 324 144" fill="none" stroke="#b85450" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="155" y="152" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="193" y="152" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="231" y="152" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="269" y="152" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="286" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="307" y="152" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="324" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="229" y="206" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">窗口 d=+2，换走 '1' 换进 '0' 后变 0</text>

  <rect x="418" y="146" width="130" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="483" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Δd = −2</text>
  <text x="483" y="184" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d=+2 → 0 ✓</text>

  <!-- ============ 情形 3：窗口内 '0' ↔ 窗口外 '1' ============ -->
  <text x="16" y="264" font-size="12" fill="#333" filter="url(#rough2)">一内一外：</text>
  <text x="16" y="282" font-size="12" fill="#333" filter="url(#rough2)">内的 '0' ↔ 外的 '1'</text>

  <rect x="189" y="248" width="156" height="42" rx="6" fill="none" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 172 244 C 172 226, 210 226, 210 244" fill="none" stroke="#b85450" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="155" y="252" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="172" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="193" y="252" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="210" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="231" y="252" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="269" y="252" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="286" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="307" y="252" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="324" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="229" y="306" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">窗口 d=−2，换走 '0' 换进 '1' 后变 0</text>

  <rect x="418" y="246" width="130" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="483" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">Δd = +2</text>
  <text x="483" y="284" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d=−2 → 0 ✓</text>

  <!-- ============ 结论 ============ -->
  <rect x="22" y="328" width="516" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">结论：能在交换后平衡的窗口，交换前 d ∈ {0, +2, −2}</text>
  <text x="280" y="376" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = +2：窗口内至少有两个 '1'，只差窗口外有个 '0'（左右均可）</text>
  <text x="280" y="400" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = −2：窗口内至少有两个 '0'，只差窗口外有个 '1'（左右均可）</text>
</svg>
