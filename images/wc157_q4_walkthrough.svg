<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">走查：n = 1…5 的五状态计数表</text>
  <text x="320" y="56" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">每格 = 长度 k 且以该元音结尾的合法串数，最后一列即答案</text>

  <!-- 表头 -->
  <rect x="100" y="86" width="436" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="129" y="110" text-anchor="middle" font-size="13" fill="#2f4d68" filter="url(#rough2)">k</text>
  <text x="189" y="110" text-anchor="middle" font-size="14" fill="#2f4d68" filter="url(#rough2)">a</text>
  <text x="251" y="110" text-anchor="middle" font-size="14" fill="#2f4d68" filter="url(#rough2)">e</text>
  <text x="313" y="110" text-anchor="middle" font-size="14" fill="#2f4d68" filter="url(#rough2)">i</text>
  <text x="375" y="110" text-anchor="middle" font-size="14" fill="#2f4d68" filter="url(#rough2)">o</text>
  <text x="437" y="110" text-anchor="middle" font-size="14" fill="#2f4d68" filter="url(#rough2)">u</text>
  <text x="502" y="110" text-anchor="middle" font-size="13" fill="#2f4d68" filter="url(#rough2)">合计</text>

  <!-- 竖线 -->
  <path d="M158,86 L158,294" stroke="#446688" stroke-width="1.2" fill="none" opacity="0.55" filter="url(#rough2)"/>
  <path d="M468,86 L468,294" stroke="#446688" stroke-width="1.2" fill="none" opacity="0.55" filter="url(#rough2)"/>

  <!-- k=1 -->
  <rect x="100" y="122" width="436" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="129" y="144" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="189" y="144" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="251" y="144" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="313" y="144" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="375" y="144" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="437" y="144" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="502" y="144" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">5</text>

  <!-- k=2 -->
  <rect x="100" y="156" width="436" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="129" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="189" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="251" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="313" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="375" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="437" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="502" y="178" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">10</text>

  <!-- k=3 -->
  <rect x="100" y="190" width="436" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="129" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="189" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="251" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="313" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="375" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="437" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="502" y="212" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">19</text>

  <!-- k=4 -->
  <rect x="100" y="224" width="436" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="129" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="189" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">11</text>
  <text x="251" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="313" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="375" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="437" y="246" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="502" y="246" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">35</text>

  <!-- k=5 高亮 -->
  <rect x="100" y="258" width="436" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="129" y="281" text-anchor="middle" font-size="13" fill="#7a5a12" filter="url(#rough2)">5</text>
  <text x="189" y="281" text-anchor="middle" font-size="13" fill="#7a5a12" filter="url(#rough2)">21</text>
  <text x="251" y="281" text-anchor="middle" font-size="13" fill="#7a5a12" filter="url(#rough2)">18</text>
  <text x="313" y="281" text-anchor="middle" font-size="13" fill="#7a5a12" filter="url(#rough2)">12</text>
  <text x="375" y="281" text-anchor="middle" font-size="13" fill="#7a5a12" filter="url(#rough2)">7</text>
  <text x="437" y="281" text-anchor="middle" font-size="13" fill="#7a5a12" filter="url(#rough2)">10</text>
  <text x="502" y="281" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">68</text>

  <!-- 递推标注 -->
  <path d="M300,292 L262,318" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="298" y="310" font-size="11" fill="#b85450" filter="url(#rough2)">21 = 9 + 7 + 5</text>

  <rect x="90" y="326" width="466" height="76" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="348" font-size="12" fill="#2f4d68" filter="url(#rough2)">k = 5 的 a：21 = 上一层 e(9) + i(7) + u(5)，因为这三个都能接 a。</text>
  <text x="104" y="368" font-size="12" fill="#2f4d68" filter="url(#rough2)">k = 5 的 u：10 = 上一层 i(7) + o(3)；答案 21+18+12+7+10 = 68。</text>
  <text x="104" y="388" font-size="12" fill="#7a5a12" filter="url(#rough2)">每一行的加数都在上一行，这就是「只依赖前一层」。</text>
</svg>
