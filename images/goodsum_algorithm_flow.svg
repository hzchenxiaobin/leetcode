<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：一趟扫描，每个元素 O(1) 桶转移</text>

  <!-- 开始 -->
  <rect x="190" y="40" width="180" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="61" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始：f = g = 0</text>
  <path d="M 280 72 L 280 84" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取元素 -->
  <rect x="130" y="88" width="300" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="111" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">取下一个元素 x</text>
  <path d="M 280 124 L 280 136" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 读旧桶 -->
  <rect x="105" y="140" width="350" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="161" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">读旧桶（处理 x 之前的状态）</text>
  <text x="280" y="181" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">f[x−1]、f[x+1]、g[x−1]、g[x+1]</text>
  <path d="M 280 190 L 280 202" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 转移公式 -->
  <rect x="70" y="206" width="420" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">nf = f[x−1] + f[x+1] + 1　（含单元素 [x]）</text>
  <text x="280" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a" filter="url(#rough2)">ng = g[x−1] + g[x+1] + x · nf</text>
  <path d="M 280 272 L 280 284" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 累加进桶 -->
  <rect x="95" y="288" width="370" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="12.5" fill="#2f5a24" filter="url(#rough2)">f[x] += nf，g[x] += ng　（模 10^9 + 7）</text>
  <path d="M 280 324 L 280 336" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,340 392,376 280,412 168,376" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="381" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">还有元素？</text>

  <!-- 是：循环 -->
  <path d="M 168 376 L 104 376 L 104 106 L 124 106" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="96" y="244" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)" transform="rotate(-90 96 244)">循环 n 次</text>

  <!-- 否：收尾 -->
  <path d="M 280 412 L 280 430" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="427" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="130" y="436" width="300" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="463" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">答案 = Σ g[v]　（模 10^9 + 7）</text>

  <!-- 易错提示 -->
  <rect x="70" y="492" width="420" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="517" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">同值不能相邻拼接（|x − x| = 0 ≠ 1）→ 转移不读 f[x]、g[x]</text>

  <text x="280" y="548" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">时间 O(n + V)　空间 O(V)，V ≈ 10^5</text>
</svg>
