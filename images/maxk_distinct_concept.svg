<svg xmlns="http://www.w3.org/2000/svg" width="640" height="348" viewBox="0 0 640 348" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="348" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：去重 → 降序排序 → 取前 min(k, 个数) 个</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="16" y="90" font-size="12" fill="#666">① 原数组 nums</text>
  <g filter="url(#sk)">
    <rect x="150" y="70" width="58" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="214" y="70" width="58" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="278" y="70" width="58" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="342" y="70" width="58" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="406" y="70" width="58" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <path d="M 414 87 L 456 87" stroke="#b85450" stroke-width="2" fill="none"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="179" y="92" fill="#2b6e9e">84</text>
    <text x="243" y="92" fill="#2b6e9e">93</text>
    <text x="307" y="92" fill="#2b6e9e">100</text>
    <text x="371" y="92" fill="#2b6e9e">77</text>
    <text x="435" y="92" fill="#8a3a36">93</text>
  </g>
  <text x="435" y="60" text-anchor="middle" font-size="11" fill="#b85450">重复，只能选一次</text>

  <path d="M 307 108 L 307 126" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="16" y="154" font-size="12" fill="#666">② 哈希集合去重</text>
  <g filter="url(#sk)">
    <rect x="182" y="134" width="58" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="246" y="134" width="58" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="310" y="134" width="58" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="374" y="134" width="58" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#2b6e9e">
    <text x="211" y="156">77</text>
    <text x="275" y="156">84</text>
    <text x="339" y="156">93</text>
    <text x="403" y="156">100</text>
  </g>
  <text x="448" y="156" font-size="11" fill="#666">两个 93 合并成一个</text>

  <path d="M 307 172 L 307 190" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="16" y="218" font-size="12" fill="#666">③ 降序排序</text>
  <g filter="url(#sk)">
    <rect x="182" y="198" width="58" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="246" y="198" width="58" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="310" y="198" width="58" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="374" y="198" width="58" height="34" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2"/>
    <path d="M 185 240 L 185 249 L 365 249 L 365 240" stroke="#4a8e4a" stroke-width="1.6" fill="none"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="211" y="220" fill="#2e6e2e">100</text>
    <text x="275" y="220" fill="#2e6e2e">93</text>
    <text x="339" y="220" fill="#2e6e2e">84</text>
    <text x="403" y="220" fill="#999999">77</text>
  </g>
  <text x="275" y="268" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">取前 k = 3 个</text>
  <text x="403" y="268" text-anchor="middle" font-size="11" fill="#999999">舍弃</text>

  <path d="M 307 276 L 307 290" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="190" y="296" width="310" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="345" y="319" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">返回 [100, 93, 84]，和 = 277 ✓</text>
</svg>
