<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#446688"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b85450"/></marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：两条队列「对撞」，下标小的先出手</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">队列里存的是「下一次行动的时刻」，队首永远是下一个开口的人</text>

  <text x="36" y="76" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">senate = "RDDR"，n = 4，初始 R 队 = [0, 3]</text>

  <rect x="36" y="84" width="62" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="67" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">0</text>
  <rect x="104" y="84" width="62" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">3</text>
  <rect x="172" y="84" width="44" height="32" rx="4" fill="none" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="194" y="104" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">…</text>
  <text x="228" y="105" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">R 队（天辉），队首是 0</text>

  <path d="M 67 116 L 67 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="36" y="140" width="548" height="66" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="162" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">队首对决：r = 0，d = 1 ⇒ r &lt; d</text>
  <text x="56" y="180" font-size="10.5" fill="#555" filter="url(#rough2)">R 先动手：D@1 被永久 ban，此后每轮都被跳过</text>
  <text x="56" y="196" font-size="10.5" fill="#555" filter="url(#rough2)">R@0 改写为 R@(0 + 4) = R@4，回到自己队尾等下轮</text>

  <path d="M 67 228 L 67 208" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="36" y="230" width="62" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="67" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">1</text>
  <rect x="104" y="230" width="62" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">2</text>
  <rect x="172" y="230" width="44" height="32" rx="4" fill="none" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="194" y="250" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">…</text>
  <text x="228" y="251" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">D 队（夜魇），队首是 1</text>

  <rect x="36" y="280" width="258" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="52" y="300" font-size="11" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">r &lt; d ⇒ R 赢下这次决斗</text>
  <text x="52" y="318" font-size="10" fill="#555" filter="url(#rough2)">D 队首 d 出局，永不再投票</text>
  <text x="52" y="336" font-size="10" fill="#555" filter="url(#rough2)">r + n 入 R 队尾，等待下一轮</text>

  <rect x="326" y="280" width="258" height="76" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="342" y="300" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">d &lt; r ⇒ D 赢下这次决斗</text>
  <text x="342" y="318" font-size="10" fill="#555" filter="url(#rough2)">R 队首 r 出局，永不再投票</text>
  <text x="342" y="336" font-size="10" fill="#555" filter="url(#rough2)">d + n 入 D 队尾，等待下一轮</text>

  <text x="310" y="384" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">某队被弹空 ⇒ 该阵营全员失去权利 ⇒ 对手宣布胜利（时间 O(n)，空间 O(n)）</text>
</svg>
