<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">流程：排序 → 三个候选 → 取最小</text>

  <!-- 步骤 1 -->
  <rect x="190" y="52" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="13.5" fill="#2d4a66" font-weight="bold" filter="url(#rough2)">① sort(nums)</text>
  <path d="M 280 90 C 280 104, 280 108, 280 118" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2：三个候选 -->
  <text x="280" y="140" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">② 计算三个候选极差</text>

  <g filter="url(#rough2)">
    <rect x="60" y="152" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="280" y="174" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">c₁ = nums[n−1] − nums[2]</text>
    <rect x="60" y="192" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="280" y="214" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">c₂ = nums[n−3] − nums[0]</text>
    <rect x="60" y="232" width="440" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="280" y="254" text-anchor="middle" font-size="13" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">c₃ = nums[n−2] − nums[1]</text>
  </g>

  <path d="M 280 266 C 280 280, 280 284, 280 296" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="150" y="300" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="325" text-anchor="middle" font-size="14" fill="#2d4a66" font-weight="bold" filter="url(#rough2)">③ return min(c₁, c₂, c₃)</text>

  <!-- 底部要点 -->
  <rect x="60" y="348" width="440" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">n = 3 时三个候选全为 0（改两个必能全等），无需特判</text>
</svg>
