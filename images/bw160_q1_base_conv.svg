<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">两次进制转换：n² 转十六进制、n³ 转三十六进制</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">数字表 0-9 与 A-Z 共用一份</text>
  <rect x="40" y="58" width="110" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="95.0" y="77.0" font-size="12" fill="#446688" text-anchor="middle" filter="url(#rough2)">n</text>
  <text x="95.0" y="93.0" font-size="12" fill="#446688" text-anchor="middle" filter="url(#rough2)">13</text>
  <rect x="200" y="58" width="150" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="275.0" y="77.0" font-size="11" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">n² = 169</text>
  <text x="275.0" y="93.0" font-size="11" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">转 16 进制</text>
  <rect x="400" y="58" width="150" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="475.0" y="77.0" font-size="11" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">n³ = 2197</text>
  <text x="475.0" y="93.0" font-size="11" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">转 36 进制</text>
  <path d="M 152 81 L 196 81" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 352 81 L 396 81" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="132" width="150" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="275.0" y="159.0" font-size="13" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">"A9"</text>
  <rect x="400" y="132" width="150" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="475.0" y="159.0" font-size="13" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">"1P1"</text>
  <path d="M 275 106 L 275 130" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 475 106 L 475 130" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="208" width="350" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="375.0" y="237.0" font-size="12" fill="#446688" text-anchor="middle" filter="url(#rough2)">拼接："A9" + "1P1" = "A91P1"</text>
  <rect x="40" y="276" width="510" height="56" fill="#f1f3f4" stroke="#888" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="295.0" y="298.0" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">通用做法：不断 x % base 取余、x //= base，余数查表 "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"</text>
  <text x="295.0" y="318.0" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">最后把余数序列反向，就是该进制下的表示</text>
  <text x="40" y="348" font-size="10.5" fill="#999" text-anchor="start" filter="url(#rough2)">n &lt;= 1000，n³ &lt;= 1e9：一趟 O(log n) 搬运即可</text>
</svg>
