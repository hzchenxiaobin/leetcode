<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 4：["a==b", "b!=c", "c==a"] 必然矛盾</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">两条等号把 a、b、c 连成一体，于是 b 与 c 必须相等，与 b!=c 冲突</text>

  <ellipse cx="280" cy="150" rx="150" ry="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="280" y="76" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">同一个连通分量（同一个 find 值）</text>

  <path d="M 150 128 L 254 128" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="202" y="118" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">a==b</text>
  <path d="M 168 168 L 252 210" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="188" y="206" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">c==a</text>
  <path d="M 296 136 L 392 180" stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="356" y="150" font-size="10.5" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b!=c ✗</text>

  <circle cx="130" cy="128" r="20" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="134" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
  <circle cx="280" cy="128" r="20" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="134" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b</text>
  <circle cx="280" cy="228" r="20" fill="#fafafa" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="234" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">c</text>

  <rect x="30" y="252" width="506" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="272" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">第一遍合并 a–b、c–a ⇒ 三者同集合；第二遍检查 b!=c 时 find(b) == find(c)，直接返回 false。</text>
  <text x="42" y="292" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">对照示例 3（全是等号）⇒ 无冲突，返回 true；示例 5（x!=z 但 x、z 从未出现等号关系）⇒ true。</text>
</svg>
