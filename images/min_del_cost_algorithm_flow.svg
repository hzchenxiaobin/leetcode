<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一遍扫描，按字母分桶累加</text>
  <path d="M 170 42 Q 320 52 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Start -->
  <g filter="url(#sk)">
    <rect x="250" y="60" width="140" height="34" rx="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">开始</text>
  <path d="M 320 94 L 320 112" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <!-- Init -->
  <g filter="url(#sk)">
    <rect x="190" y="114" width="260" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="138" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace" filter="url(#sk)">total ← 0；sum[26] ← 0</text>
  <path d="M 320 152 L 320 170" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <!-- Diamond: i < n ? -->
  <g filter="url(#sk)">
    <polygon points="320,172 400,206 320,240 240,206" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="320" y="211" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold" filter="url(#sk)">i &lt; n ?</text>

  <!-- Loop body (right side) -->
  <path d="M 400 206 L 450 206" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="418" y="198" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="452" y="168" width="160" height="76" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="532" y="192" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace" filter="url(#sk)">total += cost[i]</text>
  <text x="532" y="212" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace" filter="url(#sk)">sum[s[i]] += cost[i]</text>
  <text x="532" y="232" text-anchor="middle" font-size="11" fill="#8aa8c0" font-family="monospace" filter="url(#sk)">i++，回到判断</text>
  <path d="M 532 244 Q 532 262 430 262 Q 340 262 320 244" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <!-- No branch -->
  <path d="M 320 240 L 320 262" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="332" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#sk)">否</text>

  <!-- Best -->
  <g filter="url(#sk)">
    <rect x="190" y="266" width="260" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="290" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace" filter="url(#sk)">best ← max(sum[c])</text>
  <path d="M 320 304 L 320 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <!-- Return -->
  <g filter="url(#sk)">
    <rect x="220" y="324" width="200" height="38" rx="19" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" font-family="monospace" filter="url(#sk)">return total − best</text>

  <!-- Bucket note -->
  <g filter="url(#sk)">
    <rect x="40" y="378" width="560" height="40" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="320" y="394" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">sum 就是一个 26 桶的哈希表：s[i] 直接定位桶号，</text>
  <text x="320" y="410" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">只需一趟遍历，无需排序、无需枚举子集</text>
</svg>
