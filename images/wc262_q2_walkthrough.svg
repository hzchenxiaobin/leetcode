<svg xmlns="http://www.w3.org/2000/svg" width="780" height="580" viewBox="0 0 780 580"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="580" fill="#fafafa"/>
  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：可行走中位数，不可行在同余处止损</text>
  <path d="M 190 44 Q 390 54 590 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- band 1: example 1 -->
  <text x="60" y="76" font-size="13" font-weight="bold" fill="#2b4666" filter="url(#rough2)">示例 1：grid = [[2,4],[6,8]]，x = 2 → 余数全 0，可行</text>
  <g filter="url(#rough2)">
    <rect x="60" y="90" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="110" y="90" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="60" y="126" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="110" y="126" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="82" y="110" text-anchor="middle" font-size="12.5" fill="#2b4666" filter="url(#rough2)">2</text>
  <text x="132" y="110" text-anchor="middle" font-size="12.5" fill="#2b4666" filter="url(#rough2)">4</text>
  <text x="82" y="146" text-anchor="middle" font-size="12.5" fill="#2b4666" filter="url(#rough2)">6</text>
  <text x="132" y="146" text-anchor="middle" font-size="12.5" fill="#2b4666" filter="url(#rough2)">8</text>

  <text x="180" y="104" font-size="11" fill="#444" filter="url(#rough2)">排序 → [2, 4, 6, 8]，N = 4</text>
  <text x="180" y="122" font-size="11" fill="#444" filter="url(#rough2)">med = a[N/2] = a[2] = 6</text>
  <text x="180" y="140" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（中间区间 [4, 6] 内任取可达值，代价相同）</text>

  <!-- number line -->
  <path d="M 70 208 L 720 208" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 160 202 L 160 214" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 330 202 L 330 214" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 500 202 L 500 214" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 670 202 L 670 214" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <ellipse cx="160" cy="208" rx="4" ry="4" fill="#446688" filter="url(#rough2)"/>
  <ellipse cx="330" cy="208" rx="4" ry="4" fill="#446688" filter="url(#rough2)"/>
  <ellipse cx="670" cy="208" rx="4" ry="4" fill="#446688" filter="url(#rough2)"/>
  <ellipse cx="500" cy="208" rx="5.5" ry="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="330" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="500" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="670" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>

  <path d="M 160 200 C 240 150, 420 150, 492 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="300" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2 → 6：+x 两次</text>
  <path d="M 330 200 C 380 168, 455 168, 494 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 670 200 C 615 158, 555 158, 508 200" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="600" y="164" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">8 → 6：−x 一次</text>

  <text x="160" y="252" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2 次</text>
  <text x="330" y="252" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1 次</text>
  <text x="500" y="252" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0 次</text>
  <text x="670" y="252" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1 次</text>

  <g filter="url(#rough2)">
    <rect x="215" y="266" width="350" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="390" y="289" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">总操作数 = (4 + 2 + 0 + 2) ÷ 2 = 4 ✓</text>

  <!-- band 2: example 2 -->
  <text x="60" y="336" font-size="13" font-weight="bold" fill="#2b4666" filter="url(#rough2)">示例 2：grid = [[1,5],[2,3]]，x = 1</text>
  <g filter="url(#rough2)">
    <rect x="60" y="348" width="660" height="58" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  </g>
  <text x="390" y="370" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">余数恒为 0，可行；排序 [1, 2, 3, 5]，med = a[2] = 3</text>
  <text x="390" y="392" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">|1−3| + |2−3| + |3−3| + |5−3| = 2 + 1 + 0 + 2 = 5 ✓（x = 1，无需再除）</text>

  <!-- band 3: example 3 -->
  <text x="60" y="428" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">示例 3：grid = [[1,2],[3,4]]，x = 2 → 同余检查处止损</text>
  <g filter="url(#rough2)">
    <rect x="60" y="442" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="110" y="442" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="60" y="478" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="110" y="478" width="44" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="82" y="462" text-anchor="middle" font-size="12.5" fill="#8a6414" filter="url(#rough2)">1</text>
  <text x="132" y="462" text-anchor="middle" font-size="12.5" fill="#8a6414" filter="url(#rough2)">2</text>
  <text x="82" y="498" text-anchor="middle" font-size="12.5" fill="#8a6414" filter="url(#rough2)">3</text>
  <text x="132" y="498" text-anchor="middle" font-size="12.5" fill="#8a6414" filter="url(#rough2)">4</text>

  <text x="180" y="466" font-size="11" fill="#b85450" filter="url(#rough2)">mod 2 → 1, 0, 1, 0：余数不全相同</text>
  <text x="180" y="486" font-size="10.5" fill="#b85450" filter="url(#rough2)">1 与 2 相差 1，不是 x = 2 的倍数，永远无法相等</text>

  <g filter="url(#rough2)">
    <rect x="500" y="450" width="190" height="50" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="595" y="472" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">return −1</text>
  <text x="595" y="490" text-anchor="middle" font-size="9.5" fill="#996" filter="url(#rough2)">（余数不变量止损）</text>

  <text x="390" y="548" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">同余检查 O(N) 先行：不可行立即返回 −1；可行时排序 + 中位数一步定目标，总代价 ÷ x 收尾</text>
</svg>
