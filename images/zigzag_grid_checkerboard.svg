<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 444"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="444" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：保留格恰好是棋盘格（i + j 为偶）</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">与列数 n 的奇偶、与行的方向全都无关——偶数行取偶数列，奇数行取奇数列</text>
  <text x="280" y="68" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">绿 = 保留（取），粉 = 跳过（跳）</text>

  <!-- ===== left grid: 3x3, n odd ===== -->
  <g filter="url(#rough2)"><rect x="60" y="88" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="92" y="121" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="132" y="88" width="64" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="164" y="121" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="204" y="88" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="236" y="121" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">3</text>

  <g filter="url(#rough2)"><rect x="60" y="148" width="64" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="92" y="181" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="132" y="148" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="164" y="181" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="204" y="148" width="64" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="236" y="181" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">6</text>

  <g filter="url(#rough2)"><rect x="60" y="208" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="92" y="241" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="132" y="208" width="64" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="164" y="241" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="204" y="208" width="64" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="236" y="241" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">9</text>

  <text x="288" y="119" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">→</text>
  <text x="288" y="179" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">←</text>
  <text x="288" y="239" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">→</text>
  <text x="164" y="286" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">n=3（奇数）: result = [1, 3, 5, 7, 9]</text>

  <!-- ===== right grid: 2x4, n even ===== -->
  <g filter="url(#rough2)"><rect x="310" y="88" width="50" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="335" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="368" y="88" width="50" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="393" y="121" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="426" y="88" width="50" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="451" y="121" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="484" y="88" width="50" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="509" y="121" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">4</text>

  <g filter="url(#rough2)"><rect x="310" y="148" width="50" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="335" y="181" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="368" y="148" width="50" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="393" y="181" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="426" y="148" width="50" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="451" y="181" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="484" y="148" width="50" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="509" y="181" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">8</text>

  <text x="545" y="119" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">→</text>
  <text x="545" y="179" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">←</text>
  <text x="422" y="286" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">n=4（偶数）: result = [1, 3, 8, 6]</text>

  <!-- ===== formula box ===== -->
  <g filter="url(#rough2)"><rect x="60" y="306" width="466" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="76" y="332" font-size="11.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">位置公式：p(i,j) = i·n + j（i 偶）；i·n + n−1−j（i 奇）</text>
  <text x="76" y="354" font-size="11.5" fill="#444" filter="url(#rough2)">mod 2：i 偶 ⇒ p ≡ j；i 奇 ⇒ p ≡ n + (n−1−j) ≡ j+1（两个 n 相消）</text>
  <text x="76" y="378" font-size="12" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">所以 p 为偶 ⟺ i+j 为偶，与 n 的奇偶无关 ∎</text>

  <!-- ===== implementation strip ===== -->
  <g filter="url(#rough2)"><rect x="60" y="412" width="466" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="76" y="430" font-size="11" fill="#2c5f2c" filter="url(#rough2)">实现：偶行从列 0 正序步长 2；奇行从最右奇数列倒序步长 2 —— 跳过格不进循环</text>
</svg>
