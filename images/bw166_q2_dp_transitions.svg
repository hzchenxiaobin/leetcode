<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="580" height="380" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">DP 转移：到达 j 的最后一跳只可能来自 j-1、j-2、j-3</text>
  <circle cx="60" cy="150" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="156" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="172" cy="150" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="172" y="156" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="284" cy="150" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="284" y="156" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="396" cy="150" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="396" y="156" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="500" cy="150" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="156" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="290" y="110" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">dp[j] = c_j + min{ dp[j-1]+1, dp[j-2]+4, dp[j-3]+9 }</text>
  <path d="M 86 150 L 146 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 198 150 L 258 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 310 150 L 370 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 422 150 L 474 150" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="415" y="138" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">d=1 代价 +1</text>
  <path d="M 172 128 C 250 78 420 78 496 130" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="74" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">d=2 代价 +4</text>
  <path d="M 60 128 C 200 40 430 40 494 126" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="270" y="40" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">d=3 代价 +9</text>
  <rect x="40" y="210" width="500" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="234" text-anchor="start" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">为什么三种都要试：距离平方 (j-i)² 是凸的</text>
  <text x="58" y="256" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">一次跨 3 格：9 分；三次跨 1 格：3 分（但要多付两级台阶成本）→ 需要比较</text>
  <rect x="40" y="292" width="500" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="316" text-anchor="start" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">c_j = costs[j-1]：台阶 j（1 编号）的成本</text>
  <text x="58" y="338" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">答案 = dp[n]，自底向上按 j 递增计算即可</text>
</svg>
