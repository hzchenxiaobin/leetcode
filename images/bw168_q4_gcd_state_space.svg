<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="380" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">gcd 状态空间被值域锁死：最多 150 种</text>
  <rect x="24" y="66" width="250" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="149" y="86" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">每行选一个数，共 n^m 种组合</text>
  <path d="M 274 81 L 320 81" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="322" y="66" width="274" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="459" y="86" text-anchor="middle" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">可能的 gcd 只有 1..150 共 150 种</text>
  <text x="310" y="122" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">因为 gcd 一定整除每一个被选元素，而每个元素 &lt;= 150</text>
  <text x="40" y="168" text-anchor="start" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">第 1 行</text>
  <rect x="110" y="146" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="133" y="172" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="166" y="146" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="189" y="172" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="40" y="234" text-anchor="start" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">第 2 行</text>
  <rect x="110" y="212" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="133" y="238" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="166" y="212" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="189" y="238" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="250" y="190" text-anchor="middle" font-size="16" fill="#666" font-weight="bold" filter="url(#rough2)">→</text>
  <rect x="300" y="156" width="130" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="365" y="184" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">gcd=1</text>
  <rect x="450" y="156" width="130" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="515" y="184" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">gcd=2</text>
  <text x="310" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">状态只需要两个：1 和 2</text>
  <rect x="24" y="244" width="572" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="42" y="268" text-anchor="start" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">dp[g] = 处理完前若干行后，所选数字的 gcd 恰为 g 的方案数</text>
  <text x="42" y="290" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">转移只需枚举 g 与新值 v，新的 gcd 是 gcd(g, v)</text>
  <rect x="24" y="312" width="572" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="42" y="336" text-anchor="start" font-size="10" fill="#8a3a36" filter="url(#rough2)">对比：指数枚举 n^m（最坏 150 的 150 次方）→ 多项式 DP（约 3.4e6 次 gcd）</text>
  <text x="42" y="356" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">这个转化成立的前提就是「值域小」——若值域是 1e9，状态数不可枚举</text>
</svg>
