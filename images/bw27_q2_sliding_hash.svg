<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="51"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">滚动哈希：窗口每右移一格，O(1) 更新 k 位编码</text>

  <!-- 字符串 -->
  <text x="60" y="62" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">s =</text>
  <g filter="url(#rough2)">
    <rect x="95" y="46" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="131" y="46" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="167" y="46" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="203" y="46" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="239" y="46" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="275" y="46" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text y="68" font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="113">0</tspan><tspan x="149">0</tspan><tspan x="185">1</tspan><tspan x="221">1</tspan><tspan x="257">0</tspan><tspan x="293">1</tspan></text>
  <text x="335" y="68" font-size="12" fill="#888" filter="url(#rough2)">…（k = 3 的当前窗口高亮）</text>

  <!-- 更新公式 -->
  <rect x="70" y="112" width="420" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cur ← ((cur &lt;&lt; 1) | bit) &amp; (2^k − 1)</text>
  <text x="280" y="158" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">左移腾位 + 塞进新位 + 掩码丢掉溢出的最高位</text>

  <!-- 演算步骤 -->
  <text x="60" y="205" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">窗口 [001] → cur = 0·4 + 0·2 + 1·1 = 1</text>
  <text x="60" y="230" font-size="12.5" fill="#444" filter="url(#rough2)">右移一位变 [011] → cur = 1·4 + 1·2 + 1·1 = 7</text>
  <text x="60" y="255" font-size="12.5" fill="#444" filter="url(#rough2)">再右移一位变 [110] → cur = 7·2 + 0 = 14（掩码下没溢出）</text>

  <!-- 说明框 -->
  <rect x="55" y="278" width="230" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="70" y="300" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">这是「精确哈希」，不会碰撞</text>
  <text x="70" y="320" font-size="11" fill="#555" filter="url(#rough2)">k 位 01 串 ↔ [0, 2^k) 整数一一对应</text>

  <rect x="305" y="278" width="230" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="300" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">别用字符串切片做键</text>
  <text x="320" y="320" font-size="11" fill="#555" filter="url(#rough2)">每次切 k 位是 O(k)，总代价 O(nk) 会超时</text>
</svg>
