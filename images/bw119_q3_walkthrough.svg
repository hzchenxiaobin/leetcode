<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [1,2,3,1,2,3,1,2]，k = 2</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="46" width="80" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="120" y="46" width="180" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="300" y="46" width="120" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="420" y="46" width="100" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="80" y="66" text-anchor="middle" font-size="12.5" fill="#28415e">右端 r</text>
    <text x="210" y="66" text-anchor="middle" font-size="12.5" fill="#28415e">窗口内容 [l..r]</text>
    <text x="360" y="66" text-anchor="middle" font-size="12.5" fill="#28415e">事件</text>
    <text x="470" y="66" text-anchor="middle" font-size="12.5" fill="#28415e">最长</text>
  </g>

  <!-- 行 1：r=0..4 -->
  <g filter="url(#rough2)">
    <rect x="40" y="82" width="80" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="120" y="82" width="180" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="300" y="82" width="120" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="420" y="82" width="100" height="34" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="80" y="104" text-anchor="middle" font-size="12" fill="#333">0 … 4</text>
    <text x="210" y="104" text-anchor="middle" font-size="12" fill="#333">[1,2,3,1,2]</text>
    <text x="360" y="104" text-anchor="middle" font-size="12" fill="#333">各值 ≤2 次</text>
    <text x="470" y="104" text-anchor="middle" font-size="12" fill="#333">5</text>
  </g>

  <!-- 行 2：r=5 -->
  <g filter="url(#rough2)">
    <rect x="40" y="122" width="80" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="120" y="122" width="180" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="300" y="122" width="120" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="420" y="122" width="100" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="80" y="144" text-anchor="middle" font-size="12" fill="#1c3a1c">5</text>
    <text x="210" y="144" text-anchor="middle" font-size="12" fill="#1c3a1c">[1,2,3,1,2,3]</text>
    <text x="360" y="144" text-anchor="middle" font-size="12" fill="#1c3a1c">3 第二次 ✓</text>
    <text x="470" y="144" text-anchor="middle" font-size="12" fill="#1c3a1c">6 ✓ 最长</text>
  </g>

  <!-- 行 3：r=6 -->
  <g filter="url(#rough2)">
    <rect x="40" y="162" width="80" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="120" y="162" width="180" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="300" y="162" width="120" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="420" y="162" width="100" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="80" y="184" text-anchor="middle" font-size="12" fill="#7a3030">6</text>
    <text x="210" y="184" text-anchor="middle" font-size="12" fill="#7a3030">1 超频 → [2,3,1,2,3,1]</text>
    <text x="360" y="184" text-anchor="middle" font-size="12" fill="#7a3030">弹出 1</text>
    <text x="470" y="184" text-anchor="middle" font-size="12" fill="#7a3030">6</text>
  </g>

  <!-- 行 4：r=7 -->
  <g filter="url(#rough2)">
    <rect x="40" y="202" width="80" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="120" y="202" width="180" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="300" y="202" width="120" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="420" y="202" width="100" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="80" y="224" text-anchor="middle" font-size="12" fill="#7a3030">7</text>
    <text x="210" y="224" text-anchor="middle" font-size="12" fill="#7a3030">2 超频 → [2,3,1,2]</text>
    <text x="360" y="224" text-anchor="middle" font-size="12" fill="#7a3030">连弹 2,3,1</text>
    <text x="470" y="224" text-anchor="middle" font-size="12" fill="#7a3030">4</text>
  </g>

  <text x="280" y="262" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">r = 7 的收缩连弹三个不同元素：只有弹到「越过第一个 2」频率才回到 k</text>

  <rect x="90" y="286" width="380" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="305" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">r 全程只走一遍，l 全程只前进 → 摊还 O(n)</text>
  <text x="280" y="322" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">最终答案 = 6</text>
</svg>
