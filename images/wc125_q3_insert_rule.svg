<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">val 追加到数组末尾 ⇒ 在最大树里只会落在「最右侧那条链」上</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">最大树 = 数组的笛卡尔树：根是最大值，左子树管左边、右子树管右边</text>

  <rect x="24" y="70" width="200" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="36" y="90" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">val &gt; root.val</text>
  <text x="36" y="110" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">val 成为整棵树的新根，</text>
  <text x="124" y="110" font-size="10.5" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">旧树挂到左子树</text>

  <rect x="336" y="70" width="200" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="348" y="90" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">val &lt; root.val</text>
  <text x="348" y="110" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">递归插入到 root.right</text>

  <path d="M 226 96 L 334 96" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="120" cy="180" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="120" y="186" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">val</text>
  <circle cx="120" cy="248" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="120" y="254" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">root</text>
  <path d="M 120 198 L 120 228" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="134" y="220" font-size="10" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">left</text>

  <circle cx="320" cy="180" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="320" y="186" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">root</text>
  <circle cx="420" cy="248" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="253" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">L</text>
  <circle cx="470" cy="248" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="470" y="253" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">…</text>
  <path d="M 320 198 L 320 214 L 420 240" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 320 214 L 470 240" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="478" y="222" font-size="9.5" fill="#d6a040" text-anchor="end" filter="url(#rough2)">继续往右找</text>

  <rect x="24" y="272" width="512" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="36" y="291" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">为什么只看右子树？val 在最右边，比它大的元素都在左边，不可能在左子树里。</text>
  <text x="36" y="306" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">整棵树只需走一条「一直往右」的链，深度不超过树高，最坏 O(n)。</text>
</svg>
