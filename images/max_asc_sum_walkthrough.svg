<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [10,20,30,5,10,50] 的滚动过程</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">cur 为当前升序段和，ans 为全局最大；断点处 cur 重启</text>

  <!-- array cells on top -->
  <text x="52" y="86" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">nums</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="92" y="66" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="120" y="87" fill="#333" font-weight="bold">10</text>
    <rect x="148" y="66" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="176" y="87" fill="#333" font-weight="bold">20</text>
    <rect x="204" y="66" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="232" y="87" fill="#333" font-weight="bold">30</text>
    <rect x="268" y="66" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="296" y="87" fill="#333" font-weight="bold">5</text>
    <rect x="324" y="66" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="352" y="87" fill="#333" font-weight="bold">10</text>
    <rect x="380" y="66" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="408" y="87" fill="#333" font-weight="bold">50</text>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="120" y="58">0</text>
    <text x="176" y="58">1</text>
    <text x="232" y="58">2</text>
    <text x="296" y="58">3</text>
    <text x="352" y="58">4</text>
    <text x="408" y="58">5</text>
  </g>
  <!-- break scissors between 30 and 5, gap center 264 -->
  <path d="M 264 56 L 260 66 L 268 70 L 262 80" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <rect x="226" y="44" width="80" height="19" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="266" y="57" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">5 &lt; 30 断裂</text>

  <!-- table: 6 columns x=60..500 -->
  <!-- header row y=118 h=24; rows h=25 -->
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <!-- header -->
    <rect x="60" y="118" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="78" y="134" fill="#446688" font-weight="bold">i</text>
    <rect x="96" y="118" width="58" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="125" y="134" fill="#446688" font-weight="bold">nums[i]</text>
    <rect x="154" y="118" width="108" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="208" y="134" fill="#446688" font-weight="bold">比较</text>
    <rect x="262" y="118" width="122" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="323" y="134" fill="#446688" font-weight="bold">动作</text>
    <rect x="384" y="118" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="412" y="134" fill="#446688" font-weight="bold">cur</text>
    <rect x="440" y="118" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="468" y="134" fill="#446688" font-weight="bold">ans</text>

    <!-- row i=0 -->
    <rect x="60" y="142" width="36" height="25" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="78" y="159" fill="#555">0</text>
    <rect x="96" y="142" width="58" height="25" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="125" y="159" fill="#555">10</text>
    <rect x="154" y="142" width="108" height="25" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="208" y="159" fill="#888">—（初始）</text>
    <rect x="262" y="142" width="122" height="25" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="323" y="159" fill="#555">单元素成段</text>
    <rect x="384" y="142" width="56" height="25" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="412" y="159" fill="#555" font-weight="bold">10</text>
    <rect x="440" y="142" width="56" height="25" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="468" y="159" fill="#555" font-weight="bold">10</text>

    <!-- row i=1 green: continue -->
    <rect x="60" y="167" width="36" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="78" y="184" fill="#4a7a3a">1</text>
    <rect x="96" y="167" width="58" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="125" y="184" fill="#4a7a3a">20</text>
    <rect x="154" y="167" width="108" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="208" y="184" fill="#4a7a3a">20 &gt; 10 ✓</text>
    <rect x="262" y="167" width="122" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="323" y="184" fill="#4a7a3a">cur += 20</text>
    <rect x="384" y="167" width="56" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="412" y="184" fill="#4a7a3a" font-weight="bold">30</text>
    <rect x="440" y="167" width="56" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="468" y="184" fill="#4a7a3a" font-weight="bold">30</text>

    <!-- row i=2 green: peak of run 1 -->
    <rect x="60" y="192" width="36" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="78" y="209" fill="#4a7a3a">2</text>
    <rect x="96" y="192" width="58" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="125" y="209" fill="#4a7a3a">30</text>
    <rect x="154" y="192" width="108" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="208" y="209" fill="#4a7a3a">30 &gt; 20 ✓</text>
    <rect x="262" y="192" width="122" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="323" y="209" fill="#4a7a3a">cur += 30</text>
    <rect x="384" y="192" width="56" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="412" y="209" fill="#4a7a3a" font-weight="bold">60</text>
    <rect x="440" y="192" width="56" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <text x="468" y="209" fill="#4a7a3a" font-weight="bold">60</text>

    <!-- row i=3 red: break -->
    <rect x="60" y="217" width="36" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <text x="78" y="234" fill="#b85450">3</text>
    <rect x="96" y="217" width="58" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <text x="125" y="234" fill="#b85450">5</text>
    <rect x="154" y="217" width="108" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <text x="208" y="234" fill="#b85450">5 &lt; 30 ✗</text>
    <rect x="262" y="217" width="122" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <text x="323" y="234" fill="#b85450" font-weight="bold">cur = 5 重启</text>
    <rect x="384" y="217" width="56" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <text x="412" y="234" fill="#b85450" font-weight="bold">5</text>
    <rect x="440" y="217" width="56" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <text x="468" y="234" fill="#b85450" font-weight="bold">60</text>

    <!-- row i=4 blue: continue -->
    <rect x="60" y="242" width="36" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="78" y="259" fill="#446688">4</text>
    <rect x="96" y="242" width="58" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="125" y="259" fill="#446688">10</text>
    <rect x="154" y="242" width="108" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="208" y="259" fill="#446688">10 &gt; 5 ✓</text>
    <rect x="262" y="242" width="122" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="323" y="259" fill="#446688">cur += 10</text>
    <rect x="384" y="242" width="56" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="412" y="259" fill="#446688" font-weight="bold">15</text>
    <rect x="440" y="242" width="56" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="468" y="259" fill="#446688" font-weight="bold">60</text>

    <!-- row i=5 orange: final refresh -->
    <rect x="60" y="267" width="36" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="78" y="284" fill="#d6a040">5</text>
    <rect x="96" y="267" width="58" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="125" y="284" fill="#d6a040">50</text>
    <rect x="154" y="267" width="108" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="208" y="284" fill="#d6a040">50 &gt; 10 ✓</text>
    <rect x="262" y="267" width="122" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="323" y="284" fill="#d6a040" font-weight="bold">cur += 50 ★</text>
    <rect x="384" y="267" width="56" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="412" y="284" fill="#d6a040" font-weight="bold">65</text>
    <rect x="440" y="267" width="56" height="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="468" y="284" fill="#d6a040" font-weight="bold">65</text>
  </g>

  <!-- conclusion box -->
  <rect x="90" y="312" width="380" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="331" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">段① [10,20,30] 和为 60；段② [5,10,50] 和为 65</text>
  <text x="280" y="347" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">最终 ans = 65 ✓</text>

  <!-- footer -->
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">扫描结束即得答案：无需回看，断点重启后 ans 保留历史最大值</text>
</svg>
