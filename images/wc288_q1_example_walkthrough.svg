<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：分组降序 → 逐位回填（奇=橙，偶=蓝）</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ======== lane 1: 1234 -> 3412 ======== -->
  <text x="48" y="72" font-size="13" font-weight="bold" fill="#2b2b2b">示例 1</text>
  <g filter="url(#sk2)">
    <rect x="48" y="78" width="32" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="84" y="78" width="32" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="120" y="78" width="32" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="156" y="78" width="32" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="64" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">1</text>
  <text x="100" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" font-family="monospace">2</text>
  <text x="136" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">3</text>
  <text x="172" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" font-family="monospace">4</text>
  <text x="64" y="128" text-anchor="middle" font-size="9" fill="#a06a1a">奇</text>
  <text x="100" y="128" text-anchor="middle" font-size="9" fill="#446688">偶</text>
  <text x="136" y="128" text-anchor="middle" font-size="9" fill="#a06a1a">奇</text>
  <text x="172" y="128" text-anchor="middle" font-size="9" fill="#446688">偶</text>
  <path d="M 200 96 L 244 96" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="222" y="88" text-anchor="middle" font-size="9" fill="#666">分组·降序</text>
  <g filter="url(#sk2)">
    <rect x="258" y="62" width="172" height="68" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="344" y="86" text-anchor="middle" font-size="12" fill="#a06a1a" font-family="monospace">奇 [1, 3] → [3, 1]</text>
  <text x="344" y="110" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">偶 [2, 4] → [4, 2]</text>
  <path d="M 434 96 L 458 96" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="446" y="88" text-anchor="middle" font-size="9" fill="#666">回填</text>
  <g filter="url(#sk2)">
    <rect x="466" y="78" width="32" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="502" y="78" width="32" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="538" y="78" width="32" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="574" y="78" width="32" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="482" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">3</text>
  <text x="518" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" font-family="monospace">4</text>
  <text x="554" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">1</text>
  <text x="590" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" font-family="monospace">2</text>
  <text x="536" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">= 3412 ✓</text>

  <!-- ======== lane 2: 65875 -> 87655 ======== -->
  <text x="48" y="182" font-size="13" font-weight="bold" fill="#2b2b2b">示例 2</text>
  <g filter="url(#sk2)">
    <rect x="48" y="188" width="32" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="84" y="188" width="32" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="120" y="188" width="32" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="156" y="188" width="32" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="192" y="188" width="32" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="64" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" font-family="monospace">6</text>
  <text x="100" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">5</text>
  <text x="136" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" font-family="monospace">8</text>
  <text x="172" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">7</text>
  <text x="208" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">5</text>
  <text x="64" y="238" text-anchor="middle" font-size="9" fill="#446688">偶</text>
  <text x="100" y="238" text-anchor="middle" font-size="9" fill="#a06a1a">奇</text>
  <text x="136" y="238" text-anchor="middle" font-size="9" fill="#446688">偶</text>
  <text x="172" y="238" text-anchor="middle" font-size="9" fill="#a06a1a">奇</text>
  <text x="208" y="238" text-anchor="middle" font-size="9" fill="#a06a1a">奇</text>
  <path d="M 236 206 L 252 206" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)">
    <rect x="258" y="172" width="172" height="68" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="344" y="196" text-anchor="middle" font-size="12" fill="#a06a1a" font-family="monospace">奇 [5, 7, 5] → [7, 5, 5]</text>
  <text x="344" y="220" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">偶 [6, 8] → [8, 6]</text>
  <path d="M 434 206 L 458 206" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="446" y="198" text-anchor="middle" font-size="9" fill="#666">回填</text>
  <g filter="url(#sk2)">
    <rect x="466" y="188" width="32" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="502" y="188" width="32" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="538" y="188" width="32" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="574" y="188" width="32" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="610" y="188" width="26" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="482" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" font-family="monospace">8</text>
  <text x="518" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">7</text>
  <text x="554" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" font-family="monospace">6</text>
  <text x="590" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">5</text>
  <text x="623" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">5</text>
  <text x="548" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">= 87655 ✓</text>

  <!-- ======== lane 3: 105 -> 501 ======== -->
  <text x="48" y="292" font-size="13" font-weight="bold" fill="#2b2b2b">补充 · 0 是偶数</text>
  <g filter="url(#sk2)">
    <rect x="48" y="302" width="32" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="84" y="302" width="32" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="120" y="302" width="32" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="64" y="325" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">1</text>
  <text x="100" y="325" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" font-family="monospace">0</text>
  <text x="136" y="325" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">5</text>
  <text x="64" y="352" text-anchor="middle" font-size="9" fill="#a06a1a">奇</text>
  <text x="100" y="352" text-anchor="middle" font-size="9" fill="#446688">偶</text>
  <text x="136" y="352" text-anchor="middle" font-size="9" fill="#a06a1a">奇</text>
  <text x="100" y="368" text-anchor="middle" font-size="10" fill="#b85450">0 是偶数，不能与 1、5 互换</text>
  <path d="M 166 320 L 252 320" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="209" y="312" text-anchor="middle" font-size="9" fill="#666">分组·降序</text>
  <g filter="url(#sk2)">
    <rect x="258" y="286" width="172" height="68" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="344" y="310" text-anchor="middle" font-size="12" fill="#a06a1a" font-family="monospace">奇 [1, 5] → [5, 1]</text>
  <text x="344" y="334" text-anchor="middle" font-size="12" fill="#2b4a6e" font-family="monospace">偶 [0] → [0]</text>
  <path d="M 434 320 L 458 320" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="446" y="312" text-anchor="middle" font-size="9" fill="#666">回填</text>
  <g filter="url(#sk2)">
    <rect x="466" y="302" width="32" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="502" y="302" width="32" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="538" y="302" width="32" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="482" y="325" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">5</text>
  <text x="518" y="325" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" font-family="monospace">0</text>
  <text x="554" y="325" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" font-family="monospace">1</text>
  <text x="518" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e22">= 501 ✓</text>

  <!-- note box -->
  <g filter="url(#sk2)">
    <rect x="40" y="382" width="560" height="62" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="404" text-anchor="middle" font-size="12" fill="#7a5415">边界天然覆盖：一位数（组内单元素，原样返回）；全部同奇偶（如 13579，退化为整体降序）；</text>
  <text x="320" y="430" text-anchor="middle" font-size="12" fill="#7a5415">答案也可能等于原数（如 4321，两组本已降序）——别因为「没变化」怀疑写错。</text>
</svg>
