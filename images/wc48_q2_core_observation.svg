<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：BST 有序 ⇒ 越界即整枝可弃</text>

  <!-- 数轴三区 -->
  <rect x="70" y="58" width="150" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="83" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">全部 &lt; low</text>
  <rect x="220" y="58" width="210" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325" y="83" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">保留区间 [low, high]</text>
  <rect x="430" y="58" width="140" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="83" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">全部 &gt; high</text>
  <path d="M70,106 L570,106" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M220,100 L220,112" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M430,100 L430,112" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="220" y="126" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">low</text>
  <text x="430" y="126" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">high</text>

  <!-- 左面板：u.val < low -->
  <text x="185" y="152" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">情形 A：u.val &lt; low</text>
  <rect x="95" y="168" width="118" height="120" rx="8" fill="#fce4ec" fill-opacity="0.55"
        stroke="#b85450" stroke-width="1.4" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <path d="M185,212 L120,241" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M185,212 L252,241" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="185" cy="192" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="185" y="197" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">u</text>
  <circle cx="120" cy="258" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="263" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">L</text>
  <circle cx="252" cy="258" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="252" y="263" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">R</text>
  <text x="164" y="284" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">整体丢弃</text>
  <text x="185" y="312" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">u 与整棵左子树都 &lt; low</text>
  <text x="185" y="330" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">答案 = trim(u.right)</text>

  <!-- 右面板：u.val > high -->
  <text x="455" y="152" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">情形 B：u.val &gt; high</text>
  <rect x="428" y="168" width="124" height="120" rx="8" fill="#fff8e1" fill-opacity="0.75"
        stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <path d="M455,212 L390,241" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M455,212 L522,241" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <circle cx="455" cy="192" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="455" y="197" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">u</text>
  <circle cx="390" cy="258" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="263" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#rough2)">L</text>
  <circle cx="522" cy="258" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="522" y="263" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">R</text>
  <text x="472" y="284" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">整体丢弃</text>
  <text x="455" y="312" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">u 与整棵右子树都 &gt; high</text>
  <text x="455" y="330" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">答案 = trim(u.left)</text>

  <!-- 底部要点 -->
  <rect x="60" y="352" width="520" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="374" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">越界节点不必逐个删除：一步跳到仍在区间内的一侧，沿单链收缩</text>
  <text x="320" y="393" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">递归返回值就是「修剪后的子树根」，由父节点 / 祖父节点接回</text>
</svg>
