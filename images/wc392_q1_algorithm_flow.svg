<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 505"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="580" height="505" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">一次遍历 · 三路转移 · 打擂台</text>

  <!-- start -->
  <g filter="url(#rough2)">
    <rect x="190" y="48" width="180" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="280" y="69" text-anchor="middle" font-size="12.5" fill="#333">ans = inc = dec = 1</text>
  </g>
  <path d="M 280 80 L 280 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop -->
  <g filter="url(#rough2)">
    <rect x="145" y="104" width="270" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="280" y="128" text-anchor="middle" font-size="12.5" fill="#333">循环 i = 1 … n−1</text>
  </g>
  <path d="M 280 142 L 280 162" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compare diamond -->
  <polygon points="280,166 400,216 280,266 160,216" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="211" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">nums[i] 与</text>
  <text x="280" y="231" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">nums[i−1] 比较？</text>

  <!-- > branch -->
  <path d="M 400 216 L 434 216" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="417" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">＞</text>
  <g filter="url(#rough2)">
    <rect x="438" y="196" width="100" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="488" y="211" text-anchor="middle" font-size="12" fill="#2f5e24">inc += 1</text>
    <text x="488" y="228" text-anchor="middle" font-size="12" fill="#2f5e24">dec = 1</text>
  </g>

  <!-- < branch -->
  <path d="M 160 216 L 126 216" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="143" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">＜</text>
  <g filter="url(#rough2)">
    <rect x="22" y="196" width="100" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="72" y="211" text-anchor="middle" font-size="12" fill="#446688">dec += 1</text>
    <text x="72" y="228" text-anchor="middle" font-size="12" fill="#446688">inc = 1</text>
  </g>

  <!-- = branch -->
  <path d="M 280 266 L 280 298" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="288" text-anchor="start" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">＝</text>
  <g filter="url(#rough2)">
    <rect x="205" y="302" width="150" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="280" y="327" text-anchor="middle" font-size="12" fill="#8a3a34">inc = dec = 1</text>
  </g>

  <!-- collector -->
  <path d="M 72 236 L 72 356 L 488 356 L 488 236" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 342 L 280 356" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 356 L 280 376" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- max box -->
  <g filter="url(#rough2)">
    <rect x="165" y="380" width="230" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="280" y="405" text-anchor="middle" font-size="13" fill="#8a6a1a">ans = max(ans, inc, dec)</text>
  </g>

  <!-- loopback -->
  <path d="M 395 400 L 552 400 L 552 123 L 419 123" stroke="#888" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="392" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">i ← i+1</text>

  <!-- return -->
  <path d="M 280 420 L 280 444" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="436" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">遍历结束</text>
  <g filter="url(#rough2)">
    <rect x="200" y="446" width="160" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="280" y="468" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5e24">返回 ans</text>
  </g>

  <text x="280" y="497" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">时间 O(n) ｜ 空间 O(1)</text>
</svg>
