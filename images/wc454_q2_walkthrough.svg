<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 3 演算：nums = [8, 4, 2, 8, 4]</text>

  <rect x="48" y="52" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="92" y="52" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="152" y="52" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="204" y="52" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="268" y="52" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="332" y="52" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="384" y="52" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="70" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="122" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">nums[j]</text>
  <text x="178" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">t = 2v</text>
  <text x="236" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">left[t]</text>
  <text x="300" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">right[t]</text>
  <text x="358" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">贡献</text>
  <text x="444" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">对应三元组</text>

  <rect x="48" y="80" width="436" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="48" y="110" width="436" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="48" y="140" width="436" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="48" y="170" width="436" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="48" y="200" width="436" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="48" y="230" width="436" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="70" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="122" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="178" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">16</text>
  <text x="236" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="300" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="358" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="444" y="100" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>

  <text x="70" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="122" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="178" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="236" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="300" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="358" y="130" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="444" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">(0, 1, 3)</text>

  <text x="70" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="122" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="178" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="236" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="300" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="358" y="160" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="444" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">(1, 2, 4)</text>

  <text x="70" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="122" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="178" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">16</text>
  <text x="236" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="300" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="358" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="444" y="190" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>

  <text x="70" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="122" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="178" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="236" y="220" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="300" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="358" y="220" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="444" y="220" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>

  <text x="70" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">合计</text>
  <text x="358" y="250" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="444" y="250" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">(0,1,3)、(1,2,4)</text>

  <text x="280" y="278" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">left[t]、right[t] 为处理 j 时严格左 / 右两侧的值计数</text>

  <rect x="36" y="290" width="488" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">j = 1：左侧 1 个 8（下标 0），右侧 1 个 8（下标 3）</text>
  <text x="280" y="326" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">j = 2：左侧 1 个 4（下标 1），右侧 1 个 4（下标 4）→ 各贡献 1</text>

  <rect x="36" y="344" width="488" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">j = 4：左侧有 2 个 8，右侧 0 个 → 贡献 2 × 0 = 0</text>
  <text x="280" y="380" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">乘积为 0 自动屏蔽，计数法不需要任何特判</text>
</svg>
