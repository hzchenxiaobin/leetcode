<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">"aabcbbca" 逐轮走查</text>

  <!-- 第 0 行：原始 -->
  <text x="26" y="60" font-size="10.5" fill="#888" filter="url(#rough2)">原始</text>
  <g filter="url(#rough2)">
    <rect x="70" y="44" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="116" y="44" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="162" y="44" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="208" y="44" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="254" y="44" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="300" y="44" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="346" y="44" width="42" height="30" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="392" y="44" width="42" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="91" y="65">a</text><text x="137" y="65">a</text><text x="183" y="65">b</text><text x="229" y="65">c</text>
    <text x="275" y="65">b</text><text x="321" y="65">b</text><text x="367" y="65">c</text><text x="413" y="65">a</text>
  </g>
  <text x="452" y="65" font-size="9.8" fill="#8c3a3a" filter="url(#rough2)">红 = 第 1 轮删</text>

  <path d="M 260 78 L 260 96" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="92" font-size="9.5" fill="#888" filter="url(#rough2)">删 a@0、b@2、c@3</text>

  <!-- 第 1 行：abbca -->
  <text x="26" y="126" font-size="10.5" fill="#888" filter="url(#rough2)">第 1 轮后</text>
  <g filter="url(#rough2)">
    <rect x="70" y="110" width="42" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="116" y="110" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="162" y="110" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="208" y="110" width="42" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="254" y="110" width="42" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="91" y="131">a</text><text x="137" y="131">b</text><text x="183" y="131">b</text>
    <text x="229" y="131">c</text><text x="275" y="131">a</text>
  </g>
  <text x="312" y="131" font-size="10" fill="#666" filter="url(#rough2)">"abbca"</text>

  <path d="M 260 144 L 260 162" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="158" font-size="9.5" fill="#888" filter="url(#rough2)">删 a@1、b@4、c@6</text>

  <!-- 第 2 行：ba -->
  <text x="26" y="192" font-size="10.5" fill="#888" filter="url(#rough2)">第 2 轮后</text>
  <g filter="url(#rough2)">
    <rect x="70" y="176" width="42" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="116" y="176" width="42" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="91" y="197">b</text><text x="137" y="197">a</text>
  </g>
  <text x="176" y="197" font-size="10" fill="#2f5226" font-weight="bold" filter="url(#rough2)">"ba" ← 答案（最后一次操作之前）</text>

  <path d="M 260 210 L 260 228" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="224" font-size="9.5" fill="#888" filter="url(#rough2)">删 b@5、a@7</text>
  <text x="70" y="258" font-size="10.5" fill="#999" filter="url(#rough2)">第 3 轮后：空串 ""</text>

  <rect x="30" y="276" width="500" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="296" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">每轮对 a→z 每个出现的字符删掉「最早一次」，所以每个字符恰好每轮少一个出现。</text>
  <text x="46" y="316" font-size="10.5" fill="#a08a50" filter="url(#rough2)">频次最高的字符（a、b 各 3 次）撑到第 3 轮，其余字符（c）在第 3 轮前已消失。</text>
</svg>
