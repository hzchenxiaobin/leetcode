<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">关键性质：任意 s×s 子阵恰取每个余数类各一格</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">连续 s 个行号 mod s 是 0..s−1 的排列，列同理 ⇒ 窗口内 s² 格余数两两不同</text>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="96" y="76">j=0</text><text x="144" y="76">j=1</text><text x="192" y="76">j=2</text>
    <text x="72" y="106">i=0</text><text x="72" y="152">i=1</text><text x="72" y="198">i=2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="84" y="84" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="130" y="84" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="176" y="84" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="84" y="130" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="130" y="130" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="176" y="130" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="84" y="176" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="130" y="176" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="176" y="176" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>

  <g filter="url(#rough2)" stroke-dasharray="none">
    <rect x="80" y="80" width="96" height="96" fill="none" stroke="#b85450" stroke-width="2.6" rx="6"/>
    <rect x="126" y="126" width="96" height="96" fill="none" stroke="#446688" stroke-width="2.6" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="10" font-weight="bold" fill="#8a3a36">
    <text x="84" y="72" font-size="9.5">窗口 (0,0)</text>
    <text x="196" y="72" font-size="9.5">窗口 (1,1)</text>
  </g>

  <text x="128" y="234" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">每窗 4 格 = 4 类各 1 格</text>

  <rect x="292" y="80" width="244" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="414" y="102" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">推论：整类填满 ⇒ 每窗恰 +1</text>
  <g filter="url(#rough2)" font-size="10.5" fill="#444" text-anchor="middle">
    <text x="414" y="124">填满 k 个类（k ≤ maxOnes）</text>
    <text x="414" y="144">⇒ 每个窗口恰好 k 个 1，不超限</text>
    <text x="414" y="164">⇒ 答案 ≥ Σ（所选类的大小）</text>
    <text x="414" y="190" fill="#3a5a30" font-weight="bold">同类两格行 / 列号差 ≥ s，永不同窗</text>
  </g>

  <path d="M 240 210 L 286 180" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="292" y="236" width="244" height="116" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="414" y="258" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">填满类 (0,0)（maxOnes=1）</text>
  <g filter="url(#rough2)">
    <rect x="352" y="270" width="30" height="28" fill="#446688" rx="4"/>
    <rect x="384" y="270" width="30" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="416" y="270" width="30" height="28" fill="#446688" rx="4"/>
    <rect x="352" y="300" width="30" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="384" y="300" width="30" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="416" y="300" width="30" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="352" y="330" width="30" height="28" fill="#446688" rx="4"/>
    <rect x="384" y="330" width="30" height="28" fill="#fff" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="416" y="330" width="30" height="28" fill="#446688" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">
    <text x="367" y="288">1</text><text x="431" y="288">1</text><text x="367" y="348">1</text><text x="431" y="348">1</text>
  </g>
  <text x="500" y="288" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1,0,1</text>
  <text x="500" y="316" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0,0,0</text>
  <text x="500" y="344" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1,0,1</text>

  <rect x="40" y="262" width="230" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="155" y="284" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">可达性（下界方向）</text>
  <g filter="url(#rough2)" font-size="10.5" fill="#555" text-anchor="middle">
    <text x="155" y="306">右侧矩阵即「整类填满」的产物：</text>
    <text x="155" y="326">4 个 2×2 窗口，每个恰 1 个 1 ✓</text>
    <text x="155" y="346">⇒ 4 个 1 合法，答案 ≥ 4</text>
  </g>
</svg>
