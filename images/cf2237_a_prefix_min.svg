<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arrR2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="520" fill="#fafafa"/>

  <text x="380" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：每座塔的最终高度 = 前缀最小值 mᵢ</text>
  <path d="M 132 46 Q 380 53 628 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380" y="68" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">开火只会把右侧某座塔改成左侧某座塔的（更小的）高度</text>

  <path d="M 80 300 L 648 300" stroke="#555" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <rect x="100" y="212" width="60" height="88" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="210" y="278" width="60" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="320" y="234" width="60" height="66" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="430" y="190" width="60" height="110" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="540" y="256" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="130" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="240" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="350" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>
  <text x="460" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">5</text>
  <text x="570" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>

  <text x="130" y="320" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">a₁</text>
  <text x="240" y="320" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">a₂ 最高优先</text>
  <text x="350" y="320" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">a₃</text>
  <text x="460" y="320" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">a₄</text>
  <text x="570" y="320" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">a₅</text>

  <path d="M 246 274 Q 286 252 318 240" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR2)" filter="url(#rough2)"/>
  <path d="M 382 234 Q 402 206 426 194" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR2)" filter="url(#rough2)"/>
  <path d="M 492 192 Q 522 226 536 254" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR2)" filter="url(#rough2)"/>
  <text x="286" y="272" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">→1</text>
  <text x="410" y="184" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">→1</text>
  <text x="528" y="240" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">→1</text>

  <text x="380" y="152" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">a₂ 先开火：沿「右边第一个更高的塔」连环传递，全部压成 1</text>
  <path d="M 330 162 Q 300 200 262 250" stroke="#a14340" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <text x="62" y="356" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">前缀最小值 mᵢ：</text>
  <text x="200" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="280" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="360" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="440" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="520" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="62" y="374" width="636" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="401" text-anchor="middle" font-size="13" fill="#2f4a2a" filter="url(#rough2)">最终塔高 [4,1,1,1,1]，和 = 4+1+1+1+1 = 8</text>

  <text x="380" y="444" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">下界：高度只在原值之间传递，第 i 座塔只可能被左侧的塔压低，故终值 ≥ mᵢ</text>
  <text x="380" y="468" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">上界：上面的连环开火恰好让每座塔都落到 mᵢ，两者相撞即为答案</text>

  <text x="380" y="500" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">答案 = Σ mᵢ，其中 mᵢ = min(a₁,…,aᵢ)</text>
</svg>
