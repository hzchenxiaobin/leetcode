<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16.5" font-weight="bold"
        fill="#333" filter="url(#rough2)">示例 1 演算：主对角线 d = 0（值 1,1,1）</text>

  <rect x="44" y="60" width="50" height="50" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="94" y="60" width="50" height="50" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="144" y="60" width="50" height="50" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="44" y="110" width="50" height="50" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="94" y="110" width="50" height="50" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="144" y="110" width="50" height="50" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="44" y="160" width="50" height="50" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="94" y="160" width="50" height="50" rx="4" fill="#ffffff"
        stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="144" y="160" width="50" height="50" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <text x="69" y="91" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="119" y="91" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="169" y="91" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="69" y="141" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="119" y="141" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="169" y="141" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="69" y="191" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="119" y="191" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="169" y="191" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <text x="119" y="232" text-anchor="middle" font-size="12"
        fill="#888" filter="url(#rough2)">grid（橙色 = 对角线 d = 0）</text>

  <rect x="250" y="60" width="250" height="24" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="266" y="77" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">遍</text>
  <text x="305" y="77" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">格子</text>
  <text x="367" y="77" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">加入前 seen</text>
  <text x="453" y="77" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">记录</text>

  <rect x="250" y="84" width="250" height="24" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="250" y="108" width="250" height="24" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="250" y="132" width="250" height="24" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="250" y="156" width="250" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="250" y="180" width="250" height="24" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="250" y="204" width="250" height="24" fill="#e8f0fe" filter="url(#rough2)"/>

  <rect x="250" y="60" width="250" height="168" fill="none"
        stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="266" y="101" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">正</text>
  <text x="305" y="101" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">(0,0)</text>
  <text x="367" y="101" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">{ }</text>
  <text x="453" y="101" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">topLeft = 0</text>

  <text x="266" y="125" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">正</text>
  <text x="305" y="125" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">(1,1)</text>
  <text x="367" y="125" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">{1}</text>
  <text x="453" y="125" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">topLeft = 1</text>

  <text x="266" y="149" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">正</text>
  <text x="305" y="149" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">(2,2)</text>
  <text x="367" y="149" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">{1}</text>
  <text x="453" y="149" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">topLeft = 1</text>

  <text x="266" y="173" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">逆</text>
  <text x="305" y="173" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">(2,2)</text>
  <text x="367" y="173" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">{ }</text>
  <text x="453" y="173" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">bottomRight = 0</text>

  <text x="266" y="197" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">逆</text>
  <text x="305" y="197" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">(1,1)</text>
  <text x="367" y="197" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">{1}</text>
  <text x="453" y="197" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">bottomRight = 1</text>

  <text x="266" y="221" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">逆</text>
  <text x="305" y="221" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">(0,0)</text>
  <text x="367" y="221" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">{1}</text>
  <text x="453" y="221" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">bottomRight = 1</text>

  <text x="260" y="258" text-anchor="middle" font-size="13"
        fill="#4a7a3a" filter="url(#rough2)">answer 主对角线：|0−1|=1，|1−1|=0，|1−0|=1</text>

  <rect x="182" y="272" width="44" height="48" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="238" y="272" width="44" height="48" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="294" y="272" width="44" height="48" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="204" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="260" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="316" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <text x="260" y="348" text-anchor="middle" font-size="12"
        fill="#888" filter="url(#rough2)">其余 4 条对角线同理 ⇒ answer = [[1,1,0],[1,0,1],[0,1,1]]</text>
</svg>
