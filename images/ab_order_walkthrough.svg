<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例走查：三个输入的判定过程</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 行 1：aaabbb ===== -->
  <text x="30" y="88" font-size="13" font-weight="bold" fill="#333">示例 1</text>
  <text x="30" y="106" font-size="12" fill="#666">s = "aaabbb"</text>
  <g filter="url(#sk)">
    <rect x="150" y="70" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="190" y="70" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="230" y="70" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="270" y="70" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="310" y="70" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="350" y="70" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="168" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">a</text>
  <text x="208" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">a</text>
  <text x="248" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">a</text>
  <text x="288" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">b</text>
  <text x="328" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">b</text>
  <text x="368" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">b</text>
  <text x="168" y="122" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="208" y="122" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="248" y="122" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="288" y="122" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="328" y="122" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="368" y="122" text-anchor="middle" font-size="10" fill="#888">5</text>
  <path d="M 264 62 L 264 114" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="420" y="94" font-size="12" fill="#4a7a3a">全程无相邻 ba</text>
  <g filter="url(#sk)">
    <rect x="500" y="70" width="100" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="550" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">✓ true</text>

  <!-- 分隔 -->
  <path d="M 40 146 Q 320 154 600 146" stroke="#d5d5d5" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- ===== 行 2：abab ===== -->
  <text x="30" y="208" font-size="13" font-weight="bold" fill="#333">示例 2</text>
  <text x="30" y="226" font-size="12" fill="#666">s = "abab"</text>
  <g filter="url(#sk)">
    <rect x="170" y="190" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="210" y="190" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="250" y="190" width="36" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="290" y="190" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="188" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">a</text>
  <text x="228" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">b</text>
  <text x="268" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">a</text>
  <text x="308" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">b</text>
  <text x="188" y="242" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="228" y="242" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="268" y="242" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="308" y="242" text-anchor="middle" font-size="10" fill="#888">3</text>
  <g filter="url(#sk)">
    <rect x="204" y="184" width="88" height="48" rx="6" fill="none" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <text x="320" y="240" font-size="12" font-weight="bold" fill="#b85450">← 相邻 ba！</text>
  <g filter="url(#sk)">
    <rect x="500" y="190" width="100" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="550" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">✗ false</text>

  <!-- 分隔 -->
  <path d="M 40 266 Q 320 274 600 266" stroke="#d5d5d5" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- ===== 行 3：bbb ===== -->
  <text x="30" y="328" font-size="13" font-weight="bold" fill="#333">示例 3</text>
  <text x="30" y="346" font-size="12" fill="#666">s = "bbb"</text>
  <g filter="url(#sk)">
    <rect x="190" y="310" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="230" y="310" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="270" y="310" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="208" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">b</text>
  <text x="248" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">b</text>
  <text x="288" y="334" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">b</text>
  <text x="208" y="362" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="248" y="362" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="288" y="362" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="340" y="334" font-size="12" fill="#4a7a3a">无 a，空段条件成立</text>
  <g filter="url(#sk)">
    <rect x="500" y="310" width="100" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="550" y="333" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">✓ true</text>

  <!-- 底部总结 -->
  <g filter="url(#sk)">
    <rect x="60" y="396" width="520" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">一行判定："ba" not in s —— 三个示例一视同仁，无需特判</text>
</svg>
