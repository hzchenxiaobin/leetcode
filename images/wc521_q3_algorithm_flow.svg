<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：双指针滑窗 + 值域计数桶 cnt[1..500]</text>

  <!-- 起始框 -->
  <rect x="165" y="44" width="230" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">r 从 0 到 n−1：取 x = nums[r]</text>

  <path d="M280,84 L280,106" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,112 462,164 280,216 98,164" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="155" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">检查 A：窗口 [l, r−1] 内有互异对 a+b=x？</text>
  <text x="280" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">检查 B：窗口内有 b, c 使 x+b=c？</text>

  <!-- 是：收缩 -->
  <text x="294" y="238" font-size="12" fill="#b85450" filter="url(#rough2)">是（有违规）</text>
  <path d="M280,216 L280,244" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="175" y="248" width="210" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">从左收缩：</text>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[nums[l]]−−，l++</text>

  <path d="M175,272 H70 V164 H92" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="240" text-anchor="end" font-size="10" fill="#999" filter="url(#rough2)">重新检查 x</text>

  <!-- 否：入窗 -->
  <text x="472" y="150" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否（无违规）</text>
  <path d="M462,164 H478 V292" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="395" y="296" width="160" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="316" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x 入窗：cnt[x]++</text>
  <text x="475" y="338" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = max(ans, r−l+1)</text>

  <!-- 回到下一轮 -->
  <path d="M395,321 H30 V64 H162" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="95" y="56" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">r++，进入下一轮</text>

  <!-- 底部说明 -->
  <rect x="40" y="356" width="480" height="54" rx="10" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt[v] = 值 v 在窗口 [l, r−1] 中的出现次数（值域 1..500 的桶）</text>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">收缩 / 入窗后只重查新元素 x 的两种形态，各 O(V)，总复杂度 O(n·V)</text>
</svg>
