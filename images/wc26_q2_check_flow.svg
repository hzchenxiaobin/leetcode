<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">判定流程：按长度降序，逐个查「被包含」</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第一个不被任何其他串包含的串就是答案；全被包含则返回 −1</text>

  <g filter="url(#rough2)">
    <rect x="170" y="64" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="280" y="84" text-anchor="middle" font-size="11" fill="#3a4a66">按长度降序排序 strs</text>
  </g>

  <path d="M 280 96 L 280 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="170" y="118" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="280" y="138" text-anchor="middle" font-size="11" fill="#3a4a66">取候选串 t = strs[i]</text>
  </g>

  <path d="M 280 150 L 280 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,172 404,212 280,252 156,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="208" text-anchor="middle" font-size="10.5" fill="#8a6a20">∃ j ≠ i 使</text>
    <text x="280" y="223" text-anchor="middle" font-size="10.5" fill="#8a6a20">t ⊆ strs[j] ？</text>
  </g>

  <path d="M 156 212 L 144 212" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="16" y="196" width="126" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="79" y="216" text-anchor="middle" font-size="10.5" fill="#8a3a36">是：跳过该串</text>
  </g>

  <path d="M 79 194 L 79 133 L 166 133" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="86" y="168" font-size="9" fill="#b85450" filter="url(#rough2)">继续循环</text>

  <path d="M 280 254 L 280 274" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="278" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="280" y="298" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">返回 len(t)</text>
    <text x="280" y="314" text-anchor="middle" font-size="9.5" fill="#3a5a30">降序后首个可行即最优</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="334" width="480" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
    <text x="56" y="354" font-size="10.5" fill="#8a6a20">isSub(t, s)：p 指向 t，从左到右扫 s，字符相同则 p++</text>
    <text x="56" y="374" font-size="10.5" fill="#8a6a20">扫完时 p == |t| 说明 t 是 s 的子序列，单次 O(|t| + |s|)</text>
  </g>
</svg>
