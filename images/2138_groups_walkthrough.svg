<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例走查：s = "abcdefghij"，k = 3，fill = 'x'（n = 10，r = 1）</text>
  <path d="M 150 42 Q 340 52 530 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ====== walkthrough table ====== -->
  <g filter="url(#sk)">
    <rect x="70" y="66" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="110" y="66" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="270" y="66" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="330" y="66" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="440" y="66" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#446688" font-weight="bold">
    <text x="90" y="85">i</text>
    <text x="190" y="85">切片 s[i : i+3]</text>
    <text x="300" y="85">长度</text>
    <text x="385" y="85">补 fill</text>
    <text x="510" y="85">组结果</text>
  </g>
  <g filter="url(#sk)">
    <rect x="70" y="96" width="40" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="110" y="96" width="160" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="270" y="96" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="330" y="96" width="110" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="440" y="96" width="140" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" font-family="monospace">
    <text x="90" y="115">0</text><text x="190" y="115">"abc"</text><text x="300" y="115">3</text><text x="385" y="115">—</text><text x="510" y="115">"abc"</text>
  </g>
  <g filter="url(#sk)">
    <rect x="70" y="126" width="40" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="110" y="126" width="160" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="270" y="126" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="330" y="126" width="110" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="440" y="126" width="140" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" font-family="monospace">
    <text x="90" y="145">3</text><text x="190" y="145">"def"</text><text x="300" y="145">3</text><text x="385" y="145">—</text><text x="510" y="145">"def"</text>
  </g>
  <g filter="url(#sk)">
    <rect x="70" y="156" width="40" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="110" y="156" width="160" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="270" y="156" width="60" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="330" y="156" width="110" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="440" y="156" width="140" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" font-family="monospace">
    <text x="90" y="175">6</text><text x="190" y="175">"ghi"</text><text x="300" y="175">3</text><text x="385" y="175">—</text><text x="510" y="175">"ghi"</text>
  </g>
  <g filter="url(#sk)">
    <rect x="70" y="186" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="110" y="186" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="270" y="186" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="330" y="186" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="440" y="186" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g font-size="12" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="90" y="205" fill="#7a5415">9</text><text x="190" y="205" fill="#7a5415">"j"（截断）</text><text x="300" y="205" fill="#b85450">1</text><text x="385" y="205" fill="#b85450">+ "xx"</text><text x="510" y="205" fill="#b85450">"jxx"</text>
  </g>
  <g filter="url(#sk)">
    <rect x="70" y="216" width="510" height="28" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,3"/>
  </g>
  <text x="325" y="235" text-anchor="middle" font-size="11.5" fill="#888" font-style="italic">i = 12 ≥ n = 10，循环结束 → 返回 ["abc", "def", "ghi", "jxx"]</text>

  <!-- ====== comparison panels ====== -->
  <text x="48" y="276" font-size="12.5" font-weight="bold" fill="#446688">③ 两个对照：整除无填充 / k &gt; n 单组</text>
  <g filter="url(#sk)">
    <rect x="55" y="288" width="280" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="195" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">n = 9，k = 3（整除）</text>
  <g font-size="12" text-anchor="middle" fill="#333" font-family="monospace">
    <text x="195" y="338">[abc] [def] [ghi]</text>
  </g>
  <text x="195" y="362" text-anchor="middle" font-size="10.5" fill="#666">i = 9 ≥ n = 9 即停，填充量 (3−0) mod 3 = 0</text>

  <g filter="url(#sk)">
    <rect x="350" y="288" width="280" height="96" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="490" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">n = 3，k = 5（k &gt; n）</text>
  <g font-size="12" text-anchor="middle" fill="#333" font-family="monospace">
    <text x="490" y="338">[abc<tspan fill="#b8860b" font-style="italic">xx</tspan>]</text>
  </g>
  <text x="490" y="362" text-anchor="middle" font-size="10.5" fill="#666">仅一组：3 原字符 + 2 个 fill，无需特判</text>

  <!-- ====== callout ====== -->
  <g filter="url(#sk)">
    <rect x="55" y="402" width="570" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="340" y="424" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">填充量 = (k − n mod k) mod k：整除时取 0，不整除时取 k − r</text>
  <text x="340" y="444" text-anchor="middle" font-size="11.5" fill="#444">别写死 k − n mod k——整除时它会算出 k，多补一整组（最高频翻车点）</text>
</svg>
