<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="95"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例走查：nums = [1, 2, 1, 1, 3]，k = 2 的逐元素状态</text>

  <text x="50" y="64" font-size="12" fill="#333" filter="url(#rough2)">f[x]：以 x 结尾的最长长度</text>
  <text x="340" y="64" font-size="12" fill="#333" filter="url(#rough2)">top1：每层全局最大值</text>

  <!-- 左表 -->
  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1.2" fill="none">
    <rect x="50" y="76" width="266" height="178" rx="4"/>
    <path d="M 50 106 L 316 106"/>
    <path d="M 50 136 L 316 136"/>
    <path d="M 50 166 L 316 166"/>
    <path d="M 50 196 L 316 196"/>
    <path d="M 50 226 L 316 226"/>
    <path d="M 116 76 L 116 254"/>
    <path d="M 183 76 L 183 254"/>
    <path d="M 250 76 L 250 254"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="83" y="97">x</text>
    <text x="149" y="97">j = 0</text>
    <text x="216" y="97">j = 1</text>
    <text x="283" y="97">j = 2</text>
    <text x="83" y="127">1</text>
    <text x="149" y="127">1</text>
    <text x="216" y="127">1</text>
    <text x="283" y="127">1</text>
    <text x="83" y="157">2</text>
    <text x="149" y="157">1</text>
    <text x="216" y="157">2</text>
    <text x="283" y="157">2</text>
    <text x="83" y="187">1</text>
    <text x="149" y="187">2</text>
    <text x="216" y="187">2</text>
    <text x="283" y="187">3</text>
    <text x="83" y="217">1</text>
    <text x="149" y="217">3</text>
    <text x="216" y="217">3</text>
    <text x="283" y="217">4</text>
    <text x="83" y="247">3</text>
    <text x="149" y="247">1</text>
    <text x="216" y="247">4</text>
    <text x="283" y="247">4</text>
  </g>

  <!-- 右表 -->
  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1.2" fill="none">
    <rect x="340" y="76" width="264" height="178" rx="4"/>
    <path d="M 340 106 L 604 106"/>
    <path d="M 340 136 L 604 136"/>
    <path d="M 340 166 L 604 166"/>
    <path d="M 340 196 L 604 196"/>
    <path d="M 340 226 L 604 226"/>
    <path d="M 406 76 L 406 254"/>
    <path d="M 472 76 L 472 254"/>
    <path d="M 538 76 L 538 254"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="373" y="97">元素</text>
    <text x="439" y="97">j = 0</text>
    <text x="505" y="97">j = 1</text>
    <text x="571" y="97">j = 2</text>
    <text x="373" y="127">1</text>
    <text x="439" y="127">1</text>
    <text x="505" y="127">1</text>
    <text x="571" y="127">1</text>
    <text x="373" y="157">2</text>
    <text x="439" y="157">1</text>
    <text x="505" y="157">2</text>
    <text x="571" y="157">2</text>
    <text x="373" y="187">1</text>
    <text x="439" y="187">2</text>
    <text x="505" y="187">2</text>
    <text x="571" y="187">3</text>
    <text x="373" y="217">1</text>
    <text x="439" y="217">3</text>
    <text x="505" y="217">3</text>
    <text x="571" y="217">4</text>
    <text x="373" y="247">3</text>
    <text x="439" y="247">3</text>
    <text x="505" y="247">4</text>
    <text x="571" y="247">4</text>
  </g>

  <text x="183" y="272" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">第 3、4 行都是值 1：f[1] 原地更新</text>
  <text x="472" y="272" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">最后一行为 max(top1) = 4</text>

  <text x="320" y="300" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第 5 个元素 x = 3：j=1 借 top1[0] = 3（值 1）→ 4；j=2 借 topOther[1] = 3 → 4</text>
  <text x="320" y="326" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">top1[2] 仍为 4（属值 1），top2[2] = 4（属值 3），并列但不冲突</text>
  <text x="320" y="356" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">答案 = 4，对应子序列 [1, 2, 1, 1]</text>
  <text x="320" y="384" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">每个元素只做 k+1 次 O(1) 更新 → 总时间 O(nk)，空间 O(nk)</text>
</svg>
