<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" width="760" height="448"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="448" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">check(k) 与二分：一次 O(n) 扫描判定 k 是否可行</text>

  <!-- 二分循环回边 -->
  <path d="M 58 361 L 34 361 L 34 69 L 244 69" stroke="#446688" stroke-width="1.3" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="140" y="60" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">lo &lt; hi 时继续二分</text>

  <rect x="250" y="48" width="260" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="74" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">二分 k ∈ [1, 最大相邻间隔]</text>

  <path d="M 380 90 L 380 112" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="200" y="114" width="360" height="48" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="136" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">扫一遍 a，标出所有孤立点</text>
  <text x="380" y="154" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">左右相邻的 a 间隔都 &gt; k 才算孤立</text>

  <path d="M 380 162 L 380 182" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="150" y="184" width="460" height="52" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="206" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">沿坐标贪心配对：相距 ≤ 2k 就共用一个补点</text>
  <text x="380" y="225" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">add = 孤立点数 − 成功配对的个数</text>

  <path d="M 380 236 L 380 252" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="380,252 514,290 380,328 246,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="296" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">add ≤ x ？</text>

  <path d="M 246 290 L 148 290 L 148 338" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="196" y="282" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <rect x="58" y="340" width="180" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="148" y="366" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">hi = mid</text>

  <path d="M 514 290 L 612 290 L 612 338" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="566" y="282" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">否</text>
  <rect x="522" y="340" width="180" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="612" y="366" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">lo = mid + 1</text>

  <path d="M 148 382 L 148 417 L 286 417" stroke="#66788c" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 612 382 L 612 417 L 474 417" stroke="#66788c" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="290" y="396" width="180" height="40" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="421" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">输出 lo（最小可行 k）</text>
</svg>
