<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#aaa"/>
    </marker>
  </defs>

  <rect width="880" height="660" fill="#fafafa"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 2 演算：nums = [1, 3, 2] → target = [2, 1, 4]，答案 5</text>
  <path d="M 240 44 Q 440 52 640 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Row 1: subtract elementwise ===== -->
  <text x="440" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 逐位作差：d = target − nums</text>
  <g text-anchor="end" font-size="12" fill="#888">
    <text x="158" y="108">nums =</text>
    <text x="158" y="156">target =</text>
    <text x="158" y="204">d =</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="170" y="88" width="56" height="32" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.8"/></g><text x="198" y="109" fill="#555">1</text>
    <g filter="url(#sk)"><rect x="226" y="88" width="56" height="32" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.8"/></g><text x="254" y="109" fill="#555">3</text>
    <g filter="url(#sk)"><rect x="282" y="88" width="56" height="32" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.8"/></g><text x="310" y="109" fill="#555">2</text>
    <g filter="url(#sk)"><rect x="170" y="136" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g><text x="198" y="157" fill="#446688">2</text>
    <g filter="url(#sk)"><rect x="226" y="136" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g><text x="254" y="157" fill="#446688">1</text>
    <g filter="url(#sk)"><rect x="282" y="136" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g><text x="310" y="157" fill="#446688">4</text>
    <g filter="url(#sk)"><rect x="170" y="184" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g><text x="198" y="205" fill="#2e6e2e">+1</text>
    <g filter="url(#sk)"><rect x="226" y="184" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g><text x="254" y="205" fill="#b85450">−2</text>
    <g filter="url(#sk)"><rect x="282" y="184" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g><text x="310" y="205" fill="#2e6e2e">+2</text>
  </g>

  <!-- ===== Row 2: sentinels + extended diff ===== -->
  <text x="440" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② 两端补哨兵 0，取扩展差分 g：相邻作差</text>
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="210" y="268" width="56" height="32" fill="#f0ede4" stroke="#999" stroke-width="1.2" stroke-dasharray="5,3"/></g><text x="238" y="289" fill="#999">0</text>
    <g filter="url(#sk)"><rect x="266" y="268" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g><text x="294" y="289" fill="#2e6e2e">1</text>
    <g filter="url(#sk)"><rect x="322" y="268" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g><text x="350" y="289" fill="#b85450">−2</text>
    <g filter="url(#sk)"><rect x="378" y="268" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g><text x="406" y="289" fill="#2e6e2e">2</text>
    <g filter="url(#sk)"><rect x="434" y="268" width="56" height="32" fill="#f0ede4" stroke="#999" stroke-width="1.2" stroke-dasharray="5,3"/></g><text x="462" y="289" fill="#999">0</text>
  </g>
  <g font-size="9" fill="#999" text-anchor="middle">
    <text x="238" y="316">哨兵</text>
    <text x="462" y="316">哨兵</text>
  </g>
  <g stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" fill="none">
    <path d="M 266 306 L 266 338" marker-end="url(#arrB)"/>
    <path d="M 322 306 L 322 338" marker-end="url(#arrB)"/>
    <path d="M 378 306 L 378 338" marker-end="url(#arrB)"/>
    <path d="M 434 306 L 434 338" marker-end="url(#arrB)"/>
  </g>
  <text x="230" y="366" text-anchor="end" font-size="12" fill="#888">g：</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="238" y="344" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g><text x="266" y="365" fill="#2e6e2e">+1</text>
    <g filter="url(#sk)"><rect x="294" y="344" width="56" height="32" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.8"/></g><text x="322" y="365" fill="#b85450">−3</text>
    <g filter="url(#sk)"><rect x="350" y="344" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g><text x="378" y="365" fill="#2e6e2e">+4</text>
    <g filter="url(#sk)"><rect x="406" y="344" width="56" height="32" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.8"/></g><text x="434" y="365" fill="#b85450">−2</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="266" y="392">0</text><text x="322" y="392">1</text><text x="378" y="392">2</text><text x="434" y="392">3</text>
  </g>
  <ellipse cx="700" cy="360" rx="118" ry="30" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <text x="700" y="354" text-anchor="middle" font-size="11" fill="#a87716">g 的正数部分之和</text>
  <text x="700" y="376" text-anchor="middle" font-size="17" font-weight="bold" fill="#a87716">ans = 1 + 4 = 5</text>

  <!-- ===== Row 3: pairing into operations ===== -->
  <text x="440" y="424" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">③ 配对：一个 +1 需求 × 一个 −1 需求 = 一次操作</text>
  <g filter="url(#sk)"><rect x="90" y="440" width="700" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="110" y="463" font-size="12" fill="#333">位置 0 的 1 个 +1　↔　位置 1 的 1 个 −1　　→　+1 操作 [0, 0] × 1</text>
  <g filter="url(#sk)"><rect x="90" y="484" width="700" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="110" y="507" font-size="12" fill="#333">位置 2 的 +4 拿 2 个　↔　位置 1 剩下的 2 个 −1　　→　−1 操作 [1, 1] × 2</text>
  <g filter="url(#sk)"><rect x="90" y="528" width="700" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="110" y="551" font-size="12" fill="#333">位置 2 的 +4 拿 2 个　↔　位置 3 的 2 个 −1　　→　+1 操作 [2, 2] × 2</text>

  <g filter="url(#sk)">
    <rect x="90" y="580" width="700" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="440" y="604" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">合计 1 + 2 + 2 = 5 次操作，把全 0 的 d 精确砌成 [+1, −2, +2] ✓</text>
  <text x="440" y="626" text-anchor="middle" font-size="11" fill="#4a7a3a">对 nums 依次执行这 5 次区间操作，nums 即变为 target（与官方解释一致）</text>
</svg>
