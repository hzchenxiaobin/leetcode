<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#999999"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>

  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：26 个字母建图，转换规则 = 有向边</text>
  <path d="M 210 44 Q 470 52 730 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left: rules ===== -->
  <g filter="url(#sk)"><rect x="40" y="72" width="216" height="200" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="148" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">转换规则（示例 1）</text>
  <text x="64" y="124" font-size="12" fill="#2b6e9e" filter="url(#sk)">a → b ：2</text>
  <text x="64" y="148" font-size="12" fill="#2b6e9e" filter="url(#sk)">b → c ：5</text>
  <text x="64" y="172" font-size="12" fill="#2b6e9e" filter="url(#sk)">c → b ：5</text>
  <text x="64" y="196" font-size="12" fill="#2b6e9e" filter="url(#sk)">c → e ：1</text>
  <text x="64" y="220" font-size="12" fill="#2b6e9e" filter="url(#sk)">e → b ：2</text>
  <text x="64" y="244" font-size="12" fill="#2b6e9e" filter="url(#sk)">d → e ：20</text>
  <text x="64" y="264" font-size="10" fill="#666" filter="url(#sk)">重边 (x,y) 相同 → 取 min</text>

  <path d="M 260 172 L 302 172" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== graph label ===== -->
  <text x="620" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">转换图 G（有向带权，仅 26 个节点）</text>

  <!-- ===== edges ===== -->
  <path d="M 398 140 L 652 140" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="525" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">2</text>

  <path d="M 672 162 L 672 296" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="656" y="232" text-anchor="end" font-size="13" fill="#333" filter="url(#sk)">5</text>

  <path d="M 696 296 L 696 162" stroke="#999999" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="712" y="232" font-size="11" fill="#999" filter="url(#sk)">直连 5</text>

  <path d="M 397 315 L 824 238" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="612" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">20</text>

  <!-- highlight path c -> e -> b -->
  <path d="M 707 308 L 827 242" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="782" y="262" font-size="14" font-weight="bold" fill="#b03a3a" filter="url(#sk)">1</text>
  <path d="M 831 218 L 713 156" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="782" y="172" font-size="14" font-weight="bold" fill="#b03a3a" filter="url(#sk)">2</text>

  <!-- ===== nodes ===== -->
  <g filter="url(#sk)"><circle cx="372" cy="140" r="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="372" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">a</text>
  <g filter="url(#sk)"><circle cx="684" cy="140" r="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="684" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">b</text>
  <g filter="url(#sk)"><circle cx="684" cy="320" r="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="684" y="326" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">c</text>
  <g filter="url(#sk)"><circle cx="372" cy="320" r="24" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="372" y="326" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">d</text>
  <g filter="url(#sk)"><circle cx="856" cy="230" r="24" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/></g>
  <text x="856" y="236" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" filter="url(#sk)">e</text>
  <text x="856" y="272" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk)">（中转字母）</text>

  <!-- badge -->
  <g filter="url(#sk)"><rect x="724" y="348" width="196" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="822" y="371" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">绕行 c→e→b = 3 更省！</text>

  <!-- ===== bottom notes ===== -->
  <g filter="url(#sk)"><rect x="56" y="436" width="828" height="104" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="76" y="460" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">关键推论</text>
  <text x="76" y="484" font-size="11" fill="#444" filter="url(#sk)">· 每个位置独立 → 总成本 = Σ g[source[i]][target[i]]，逐位查表求和即可</text>
  <text x="76" y="506" font-size="11" fill="#444" filter="url(#sk)">· 查询对 (x, y) 至多 26×26 = 676 种 → 一次全源最短路全覆盖，不必逐位现算</text>
  <text x="76" y="528" font-size="11" fill="#444" filter="url(#sk)">· 节点仅 26 个 → Floyd-Warshall O(26³) ≈ 1.8×10⁴ 次松弛，瞬间完成</text>
</svg>
