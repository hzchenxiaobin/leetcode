<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="600" height="390" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">长窗口的每一次出现，都内含一次短前缀的出现</text>
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">所以把长度压到 minSize，频次只会变大 —— 更长的窗口永远不是最优</text>

  <text x="130" y="82" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">合法子串 t（示例 s = "aabaab" 中的 "aaba"，长度 L = 4）</text>

  <g filter="url(#rough2)">
    <rect x="130" y="92" width="38" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="168" y="92" width="38" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="206" y="92" width="38" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="244" y="92" width="38" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="149" y="116" text-anchor="middle" font-size="14" fill="#2f4a66">a</text>
    <text x="187" y="116" text-anchor="middle" font-size="14" fill="#2f4a66">a</text>
    <text x="225" y="116" text-anchor="middle" font-size="14" fill="#2f4a66">b</text>
    <text x="263" y="116" text-anchor="middle" font-size="14" fill="#2f4a66">a</text>
  </g>
  <text x="130" y="144" text-anchor="start" font-size="10.5" fill="#7a8aa0" filter="url(#rough2)">出现 1 次，distinct = 2</text>

  <path d="M282,110 H344 V210 H252" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="152" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">截取前</text>
  <text x="392" y="168" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">minSize 个</text>
  <text x="392" y="184" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">字符</text>

  <text x="130" y="182" text-anchor="start" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">前缀 p（"aab"，长度 minSize = 3）</text>

  <g filter="url(#rough2)">
    <rect x="130" y="192" width="38" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="168" y="192" width="38" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="206" y="192" width="38" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="149" y="216" text-anchor="middle" font-size="14" fill="#3d6b2f">a</text>
    <text x="187" y="216" text-anchor="middle" font-size="14" fill="#3d6b2f">a</text>
    <text x="225" y="216" text-anchor="middle" font-size="14" fill="#3d6b2f">b</text>
  </g>
  <text x="130" y="244" text-anchor="start" font-size="10.5" fill="#5f8a50" filter="url(#rough2)">出现 2 次（起点 0 与 3），distinct = 2 依旧合法</text>

  <rect x="452" y="120" width="122" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="513" y="152" text-anchor="middle" font-size="19" fill="#3d6b2f" filter="url(#rough2)">f′ ≥ f</text>
  <text x="513" y="172" text-anchor="middle" font-size="10.5" fill="#5f8a50" filter="url(#rough2)">本例 2 &gt; 1</text>

  <text x="300" y="276" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">① p 是 t 的前缀 ⇒ distinct(p) ≤ distinct(t) ≤ maxLetters</text>
  <text x="300" y="300" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">② t 在位置 i 出现 ⇒ p 也在位置 i 出现，故 freq(p) ≥ freq(t)</text>
  <text x="300" y="324" text-anchor="middle" font-size="11" fill="#8c3b36" filter="url(#rough2)">③ 于是 maxSize 是冗余参数：最优值必定在长度恰为 minSize 时取到</text>

  <rect x="42" y="336" width="516" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="362" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">ans = max{ freq(w) : |w| = minSize 且 distinct(w) ≤ maxLetters }</text>
</svg>
