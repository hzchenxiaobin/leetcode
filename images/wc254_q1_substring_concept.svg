<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#fdfcf7"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：判定相互独立 + 库函数子串查找</text>
  <path d="M 280 44 Q 450 52 620 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== ① patterns 与 word ===== -->
  <text x="66" y="90" font-size="14" font-weight="bold" fill="#2b2b2b">① patterns：</text>
  <g filter="url(#sk)">
    <rect x="200" y="66" width="60" height="36" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="270" y="66" width="60" height="36" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="340" y="66" width="60" height="36" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="410" y="66" width="60" height="36" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="230" y="90" text-anchor="middle" font-size="14" fill="#7a5415">"a"</text>
  <text x="300" y="90" text-anchor="middle" font-size="14" fill="#7a5415">"abc"</text>
  <text x="370" y="90" text-anchor="middle" font-size="14" fill="#7a5415">"bc"</text>
  <text x="440" y="90" text-anchor="middle" font-size="14" fill="#7a5415">"d"</text>

  <text x="524" y="90" font-size="14" font-weight="bold" fill="#2b2b2b">word =</text>
  <g filter="url(#sk)">
    <rect x="588" y="66" width="42" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="638" y="66" width="42" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="688" y="66" width="42" height="36" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="609" y="90" text-anchor="middle" font-size="14" fill="#2b6e9e">a</text>
  <text x="659" y="90" text-anchor="middle" font-size="14" fill="#2b6e9e">b</text>
  <text x="709" y="90" text-anchor="middle" font-size="14" fill="#2b6e9e">c</text>
  <text x="609" y="116" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="659" y="116" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="709" y="116" text-anchor="middle" font-size="10" fill="#999">2</text>

  <!-- ===== ② 逐个判定 ===== -->
  <path d="M 230 102 L 230 142" stroke="#3a3a3a" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 300 102 L 300 142" stroke="#3a3a3a" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 370 102 L 370 142" stroke="#3a3a3a" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 440 102 L 440 142" stroke="#3a3a3a" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="66" y="172" font-size="14" font-weight="bold" fill="#2b2b2b">② 逐个判定：</text>
  <g filter="url(#sk)">
    <rect x="200" y="148" width="60" height="36" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="270" y="148" width="60" height="36" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="340" y="148" width="60" height="36" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="410" y="148" width="60" height="36" rx="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="230" y="172" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="300" y="172" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="370" y="172" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="440" y="172" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">✗</text>

  <g filter="url(#sk)">
    <rect x="500" y="146" width="340" height="46" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="516" y="164" font-size="11" font-weight="bold" fill="#555">库函数一次调用（无需手写匹配）：</text>
  <text x="516" y="180" font-size="11" fill="#444" font-family="monospace">C++: word.find(p) != string::npos</text>
  <text x="516" y="194" font-size="11" fill="#444" font-family="monospace">Python: p in word</text>

  <!-- ===== ③ 累加计数 ===== -->
  <path d="M 230 184 L 230 234" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 300 184 L 300 234" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 370 184 L 370 234" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 440 184 L 440 234" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="66" y="259" font-size="14" font-weight="bold" fill="#2b2b2b">③ 累加计数：</text>
  <path d="M 248 254 L 282 254" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 318 254 L 352 254" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 388 254 L 422 254" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="230" cy="254" r="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <circle cx="300" cy="254" r="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <circle cx="370" cy="254" r="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <circle cx="440" cy="254" r="16" fill="#f0f0f0" stroke="#999999" stroke-width="1.6"/>
  </g>
  <text x="230" y="259" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="300" y="259" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="370" y="259" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="440" y="259" text-anchor="middle" font-size="14" font-weight="bold" fill="#777777">3</text>
  <text x="230" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">+1</text>
  <text x="300" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">+1</text>
  <text x="370" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">+1</text>
  <text x="440" y="290" text-anchor="middle" font-size="11" fill="#999">+0</text>

  <path d="M 458 254 L 534 254" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="540" y="232" width="200" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="640" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 count = 3</text>
  <text x="640" y="268" text-anchor="middle" font-size="10" fill="#888">3 个命中 · 1 个未命中</text>

  <!-- ===== 易错提示 ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="320" width="380" height="96" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="90" y="346" font-size="13" font-weight="bold" fill="#a03030">易错 1：不能 set 去重！</text>
  <text x="90" y="370" font-size="12" fill="#444">示例 3：patterns = ["a","a","a"]，word = "ab"</text>
  <text x="90" y="390" font-size="12" fill="#444">每个 "a" 都各自计数 → 答案 3（按位置计数）</text>

  <g filter="url(#sk)">
    <rect x="470" y="320" width="380" height="96" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="490" y="346" font-size="13" font-weight="bold" fill="#7a5415">易错 2：子串 ≠ 子序列</text>
  <text x="490" y="370" font-size="12" fill="#444">"ac" 是 "abc" 的子序列，但不是子串（不连续）</text>
  <text x="490" y="390" font-size="12" fill="#444">find / in 天然保证连续，勿手写双指针判子序列</text>

  <g filter="url(#sk)">
    <rect x="70" y="440" width="780" height="64" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="450" y="468" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">count = Σ 1[p 是 word 的子串] —— 按 patterns 的位置求和，不去重</text>
  <text x="450" y="488" text-anchor="middle" font-size="11" fill="#666">每个 pattern 一次库函数调用：时间 O(Σ|pᵢ|·|word|)，空间 O(1)</text>

  <text x="450" y="532" text-anchor="middle" font-size="11" fill="#999">库函数已封装「枚举起点 + 逐字符比对」，签到题的最短路径</text>
</svg>
