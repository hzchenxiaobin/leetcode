<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：按值分块——跨块子数组与数对 (s,t) 一一对应</text>
  <path d="M 110 40 Q 320 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g font-size="12.5" text-anchor="middle" fill="#555">
    <text x="170" y="66">B₀（值 1 · 长 3）</text>
    <text x="310" y="66">B₁（值 2 · 长 2）</text>
    <text x="394" y="66">B₂（值 3）</text>
  </g>

  <g filter="url(#sk)">
    <rect x="88" y="76" width="52" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="144" y="76" width="52" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="200" y="76" width="52" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="256" y="76" width="52" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="312" y="76" width="52" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="368" y="76" width="52" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="138" y="68" width="174" height="60" rx="9" fill="none" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold" fill="#333">
    <text x="114" y="103">1</text>
    <text x="170" y="103">1</text>
    <text x="226" y="103">1</text>
    <text x="282" y="103">2</text>
    <text x="338" y="103">2</text>
    <text x="394" y="103">3</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#999">
    <text x="114" y="150">0</text>
    <text x="170" y="150">1</text>
    <text x="226" y="150">2</text>
    <text x="282" y="150">3</text>
    <text x="338" y="150">4</text>
    <text x="394" y="150">5</text>
  </g>
  <text x="470" y="99" font-size="12.5" fill="#b85450" font-weight="bold">跨块子数组 [1,1,2]</text>
  <text x="470" y="117" font-size="12" fill="#b85450">＝ nums[1..3] ↦ (s,t)=(1,3)</text>

  <path d="M 160 176 Q 200 160 226 134" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="28" y="184" width="306" height="156" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="181" y="208" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">跨块（含 ≥ 2 个不同值）⇒ 天然无重复</text>
  <g font-size="12" fill="#2e5e22" text-anchor="middle">
    <text x="181" y="232">首段：值 v_b 恰出现 c = 块尾 − s + 1 次</text>
    <text x="181" y="254">（子数组一路吃到块尾才换值）</text>
    <text x="181" y="280">首段钉死 s，尾段钉死 t</text>
    <text x="181" y="304" font-weight="bold" fill="#b85450">不同 (s,t) ⇔ 不同序列 ⇒ 去重消失！</text>
  </g>

  <g filter="url(#sk)">
    <rect x="352" y="184" width="260" height="156" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="482" y="208" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">单块 ⇒ 按长度去重</text>
  <g font-size="12" fill="#7a5415" text-anchor="middle">
    <text x="482" y="232">[1] 出现在 3 个位置，只有 1 个序列</text>
    <text x="482" y="254">[1,1] 出现在 2 个位置，也是 1 个</text>
    <text x="482" y="280">同块内：长度 c 相同 ⇔ 序列相同</text>
    <text x="482" y="304" font-weight="bold" fill="#b85450">良好 ⇔ c·v ≡ 0 (mod k)</text>
  </g>

  <g filter="url(#sk)">
    <rect x="28" y="362" width="584" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" fill="#8a3a36">
    <text x="320" y="388" font-size="14" font-weight="bold">答案 ＝ 跨块不同良好子数组数 ＋ 单块不同良好子数组数</text>
    <text x="320" y="412" font-size="12">跨块：数满足 P[t+1] ≡ P[s] (mod k) 且 block(s) ＜ block(t) 的点对 (s,t)</text>
    <text x="320" y="434" font-size="12">单块：每块 (v, L) 累加 ⌊L / (k / gcd(v,k))⌋</text>
  </g>
</svg>
