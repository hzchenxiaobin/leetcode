<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 452" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="452" fill="#fafafa"/>

  <g filter="url(#rough2)" text-anchor="middle">
    <text x="310" y="26" font-size="15" fill="#444" font-weight="bold">算法流程：候选生成 → 过滤 → 选择</text>
    <text x="310" y="46" font-size="10.5" fill="#888">只有常数个候选，时间 O(L)，与 n 的大小无关</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="60" width="500" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66">
    <text x="78" y="82">L = len(n)，h = ⌈L/2⌉，prefix = int(n[0 .. h))</text>
    <text x="78" y="99">n = 12932 → L = 5，h = 3，prefix = 129</text>
  </g>

  <path d="M 310 110 L 310 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="30" y="136" width="104" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="144" y="136" width="104" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="258" y="136" width="104" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="372" y="136" width="104" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="486" y="136" width="104" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="9.5">
    <text x="82" y="162" fill="#333">prefix − 1</text>
    <text x="82" y="182" fill="#666">镜像构造</text>
    <text x="196" y="162" fill="#333">prefix</text>
    <text x="196" y="182" fill="#666">镜像（≠ n 才收）</text>
    <text x="310" y="162" fill="#333">prefix + 1</text>
    <text x="310" y="182" fill="#666">镜像构造</text>
    <text x="424" y="162" fill="#333">10^L + 1</text>
    <text x="424" y="182" fill="#666">更长一位哨兵</text>
    <text x="538" y="162" fill="#333">10^(L−1) − 1</text>
    <text x="538" y="182" fill="#666">更短一位哨兵</text>
  </g>

  <g filter="url(#rough2)" fill="none" stroke="#999" stroke-width="1.2">
    <path d="M 82 198 L 82 212"/>
    <path d="M 196 198 L 196 212"/>
    <path d="M 310 198 L 310 212"/>
    <path d="M 424 198 L 424 212"/>
    <path d="M 538 198 L 538 212"/>
    <path d="M 82 212 L 538 212"/>
  </g>
  <path d="M 310 212 L 310 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="70" y="234" width="480" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#8a6a20">
    <text x="88" y="256">过滤 1：镜像结果位数 ≠ h（prefix 退位或进位，如 9 → 10）</text>
    <text x="88" y="276">过滤 2：结果等于 n 自身（同长度回文可能正好是 n）</text>
  </g>

  <path d="M 310 292 L 310 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="70" y="316" width="480" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#3a5a30">
    <text x="88" y="338">选择：best = argmin ( |x − n| , x )  over 候选集</text>
    <text x="88" y="358">先比绝对差，差值相同取较小值 → 天然满足「并列取小」</text>
  </g>

  <path d="M 310 372 L 310 394" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="240" y="396" width="140" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="310" y="418" text-anchor="middle" font-size="12" fill="#3a4a66">返回 str(best)</text>
  </g>
</svg>
