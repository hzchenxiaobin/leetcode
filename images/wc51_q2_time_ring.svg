<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="34" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">把时间摊成 1440 分钟的环：答案是环上「下一个」合法刻度</text>

  <!-- 时间环 -->
  <circle cx="155" cy="215" r="95" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="155" y="208" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">一天只有 1440 分钟</text>
  <text x="155" y="230" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">走完一圈就回到自身</text>

  <!-- 顺时针方向箭头 -->
  <path d="M171.5,121.4 A95,95 0 0 1 237.3,167.5" fill="none" stroke="#b85450"
        stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="155" y="110" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">00:00</text>
  <text x="257" y="220" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">06:00</text>
  <text x="155" y="330" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12:00</text>
  <text x="52" y="220" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">18:00</text>

  <!-- 起点 -->
  <circle cx="68" cy="177" r="6" fill="#fff8e1" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M58,160 L65,171" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="28" y="148" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">19:34</text>
  <text x="28" y="166" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">起点</text>

  <!-- 右侧要点 -->
  <rect x="290" y="92" width="245" height="228" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="304" y="122" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">① 候选：这 4 个数字拼出的全部</text>
  <text x="304" y="144" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">   合法时刻，至多 4×4×4×4 = 256 个</text>
  <text x="304" y="178" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">② 环上差值</text>
  <text x="304" y="200" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">   Δ = (t − start + 1440) mod 1440</text>
  <text x="304" y="222" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">   Δ = 0 表示候选就是自己，记作 1440</text>
  <text x="304" y="244" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">   （次日同一时刻）</text>
  <text x="304" y="278" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">③ 取 Δ 最小的候选</text>
  <text x="304" y="300" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">   = 严格晚于现在的最近时刻</text>
</svg>
