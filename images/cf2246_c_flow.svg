<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：一次线性扫描数块，两条公式相加</text>

  <rect x="110" y="50" width="440" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="78" text-anchor="middle" font-size="13.5" fill="#223" filter="url(#rough2)">读入 n 与 a[1..n]：非降序，−1 全在开头</text>

  <path d="M330 96 L330 108" stroke="#777" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="110" width="440" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="138" text-anchor="middle" font-size="13.5" fill="#223" filter="url(#rough2)">c = −1 的个数，P = n − c（正数个数）</text>

  <path d="M330 156 L330 168" stroke="#777" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="170" width="440" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="198" text-anchor="middle" font-size="13.5" fill="#223" filter="url(#rough2)">正数按值分块：块数 B'，G = 相邻块 (v, v+1) 对数</text>

  <path d="M330 216 L330 228" stroke="#777" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="230" width="440" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="258" text-anchor="middle" font-size="13.5" fill="#223" filter="url(#rough2)">even = 2^(n − B)，B = B' + [c &gt; 0] 含 −1 块</text>

  <path d="M330 276 L330 288" stroke="#777" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="290" width="440" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="318" text-anchor="middle" font-size="13.5" fill="#223" filter="url(#rough2)">odd = c &gt; 0 ? 2^(c−1+P−B') · G : 0</text>

  <path d="M330 336 L330 348" stroke="#777" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="350" width="440" height="54" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="330" y="374" text-anchor="middle" font-size="14" fill="#223" filter="url(#rough2)">answer = (even + odd) mod (10^9 + 7)</text>
  <text x="330" y="394" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">偶数长度与奇数长度互补，直接相加</text>

  <text x="330" y="432" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">分块扫描 O(n)，指数最大 n ≤ 2×10^5，预处理 2 的幂表即可</text>
  <text x="330" y="452" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">不需要 DP，也不需要枚举子序列</text>
</svg>
