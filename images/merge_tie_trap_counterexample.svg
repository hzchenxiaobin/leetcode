<svg xmlns="http://www.w3.org/2000/svg" width="680" height="352" viewBox="0 0 680 352" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="352" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">陷阱：首字符相同 ≠ 随便取 —— word1 = "aa"，word2 = "ab"</text>

  <!-- 初始状态 -->
  <text x="40" y="54" font-size="11" font-weight="bold" fill="#446688">word1</text>
  <g filter="url(#sk)">
    <rect x="40" y="60" width="20" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="63" y="60" width="20" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="50" y="77" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="73" y="77" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="130" y="54" font-size="11" font-weight="bold" fill="#4a7a3a">word2</text>
  <g filter="url(#sk)">
    <rect x="130" y="60" width="20" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="153" y="60" width="20" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="140" y="77" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="163" y="77" text-anchor="middle" font-size="11.5" fill="#333">b</text>
  <text x="215" y="78" font-size="11" font-weight="bold" fill="#b03a3a">首字符都是 'a'，看似取谁都一样？</text>

  <!-- 左：错误路线 -->
  <text x="40" y="118" font-size="12" font-weight="bold" fill="#b03a3a">✗ 并列时固定取 word1</text>
  <g filter="url(#sk)">
    <rect x="40" y="128" width="20" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <path d="M 62 140 L 78 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <rect x="82" y="128" width="20" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <path d="M 104 140 L 120 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <rect x="124" y="128" width="42" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <path d="M 168 140 L 186 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="50" y="145" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="92" y="145" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="145" y="145" text-anchor="middle" font-size="11.5" fill="#333">ab</text>
  <text x="50" y="166" text-anchor="middle" font-size="9" fill="#888">取 w1</text>
  <text x="92" y="166" text-anchor="middle" font-size="9" fill="#888">再取 w1</text>
  <text x="145" y="166" text-anchor="middle" font-size="9" fill="#888">w1 空接 w2</text>
  <text x="196" y="146" font-size="15" font-weight="bold" fill="#b03a3a">aaab</text>

  <!-- 右：正确路线 -->
  <text x="400" y="118" font-size="12" font-weight="bold" fill="#2e6e2e">✓ 比较后缀 "aa" &lt; "ab" → 取 word2</text>
  <g filter="url(#sk)">
    <rect x="400" y="128" width="20" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <path d="M 422 140 L 434 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <rect x="438" y="128" width="20" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <path d="M 460 140 L 472 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <rect x="476" y="128" width="42" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <path d="M 520 140 L 538 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="410" y="145" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="448" y="145" text-anchor="middle" font-size="11.5" fill="#333">b</text>
  <text x="497" y="145" text-anchor="middle" font-size="11.5" fill="#333">aa</text>
  <text x="410" y="166" text-anchor="middle" font-size="9" fill="#888">取 w2</text>
  <text x="448" y="166" text-anchor="middle" font-size="9" fill="#888">'b'&gt;'a' 取 w2</text>
  <text x="497" y="166" text-anchor="middle" font-size="9" fill="#888">拼上 w1</text>
  <text x="548" y="146" font-size="15" font-weight="bold" fill="#2e6e2e">abaa</text>

  <!-- 对比 -->
  <text x="40" y="196" font-size="12" font-weight="bold" fill="#2b2b2b">对比</text>
  <g filter="url(#sk)">
    <rect x="90" y="200" width="20" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="113" y="200" width="20" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="136" y="200" width="20" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="159" y="200" width="20" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="90" y="230" width="20" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="113" y="230" width="20" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="136" y="230" width="20" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="159" y="230" width="20" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <ellipse cx="123" cy="212" rx="14" ry="15" fill="none" stroke="#d6a040" stroke-width="2"/>
    <ellipse cx="123" cy="242" rx="14" ry="15" fill="none" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="100" y="217" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="123" y="217" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">b</text>
  <text x="146" y="217" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="169" y="217" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="100" y="247" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="123" y="247" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">a</text>
  <text x="146" y="247" text-anchor="middle" font-size="11.5" fill="#333">a</text>
  <text x="169" y="247" text-anchor="middle" font-size="11.5" fill="#333">b</text>
  <text x="225" y="216" font-size="11" font-weight="bold" fill="#2e6e2e">abaa（第 2 位 'b'）✓</text>
  <text x="225" y="246" font-size="11" font-weight="bold" fill="#b03a3a">aaab（第 2 位 'a'）✗</text>
  <text x="330" y="228" font-size="10.5" fill="#555">第 2 位 'b' &gt; 'a'，先手一步定胜负</text>

  <!-- 底部结论 -->
  <g filter="url(#sk)">
    <rect x="30" y="258" width="620" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="46" y="280" font-size="12" font-weight="bold" fill="#2b2b2b">为什么后缀大的先出？</text>
  <text x="46" y="300" font-size="10.5" fill="#555">后缀 "ab" &gt; "aa"：word2 攥着更大的 'b'，先消耗 word2 才能让 'b' 更早出场（严格证明见 §5 引理 2）</text>
  <text x="46" y="320" font-size="10.5" fill="#555">截断也不行：word1 = "aaa"、word2 = "aab" 需要比较到第 3 位才分胜负 → 必须比较整个后缀</text>
</svg>
