<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：链 + 一条弦，最短路只有两类候选</text>
  <path d="M 140 42 Q 320 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- chord arc above chain -->
  <path d="M 210 101 Q 330 45 450 101" stroke="#c98a2b" stroke-width="2.2" fill="none" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="330" y="62" text-anchor="middle" font-size="12" fill="#a06b1a">弦 x–y（x = 2，y = 4）</text>

  <!-- chain nodes: 1 2 3 4 5 -->
  <g filter="url(#sk)">
    <line x1="109" y1="120" x2="191" y2="120" stroke="#4a8edb" stroke-width="2"/>
    <line x1="229" y1="120" x2="311" y2="120" stroke="#4a8edb" stroke-width="2"/>
    <line x1="349" y1="120" x2="431" y2="120" stroke="#4a8edb" stroke-width="2"/>
    <line x1="469" y1="120" x2="551" y2="120" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="90"  cy="120" r="19" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <circle cx="210" cy="120" r="19" fill="#fff4e6" stroke="#c98a2b" stroke-width="2.2"/>
    <circle cx="330" cy="120" r="19" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <circle cx="450" cy="120" r="19" fill="#fff4e6" stroke="#c98a2b" stroke-width="2.2"/>
    <circle cx="570" cy="120" r="19" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="90"  y="126" fill="#2e6e2e">1</text>
    <text x="210" y="126" fill="#a06b1a">2</text>
    <text x="330" y="126" fill="#2b5d85">3</text>
    <text x="450" y="126" fill="#a06b1a">4</text>
    <text x="570" y="126" fill="#2e6e2e">5</text>
  </g>
  <g filter="url(#sk)" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="90"  y="158" fill="#2e6e2e">i</text>
    <text x="210" y="158" fill="#a06b1a">x</text>
    <text x="450" y="158" fill="#a06b1a">y</text>
    <text x="570" y="158" fill="#2e6e2e">j</text>
  </g>

  <!-- two candidate boxes -->
  <g filter="url(#sk)">
    <rect x="35" y="182" width="275" height="80" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="172" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">候选 ① 直走（不过弦）</text>
  <text x="172" y="230" text-anchor="middle" font-size="13" fill="#2e6e2e">长度 = j − i</text>
  <text x="172" y="251" text-anchor="middle" font-size="11" fill="#666">1→2→3→4→5，共 4 步</text>

  <g filter="url(#sk)">
    <rect x="330" y="182" width="275" height="80" rx="8" fill="#fce8ec" stroke="#b8546a" stroke-width="1.5"/>
  </g>
  <text x="467" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04a5a">候选 ② 绕弦（恰过一次）</text>
  <text x="467" y="230" text-anchor="middle" font-size="13" fill="#a04a5a">长度 = |i−x| + 1 + |j−y|</text>
  <text x="467" y="251" text-anchor="middle" font-size="11" fill="#666">1→2 ⇢弦⇢ 4→5，共 3 步 ★</text>

  <!-- formula banner -->
  <g filter="url(#sk)">
    <rect x="35" y="280" width="570" height="46" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="320" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b5d85">d(i, j) = min( j − i ， |i−x| + 1 + |j−y| )</text>

  <!-- notes -->
  <g filter="url(#sk)">
    <rect x="35" y="342" width="570" height="40" rx="8" fill="#f4f0fa" stroke="#8a6db5" stroke-width="1.4"/>
  </g>
  <text x="320" y="367" text-anchor="middle" font-size="12" fill="#5a4480">为什么只有两类？最短路可取简单路径，在「链 + 一条弦」上至多过弦一次</text>

  <g filter="url(#sk)">
    <rect x="35" y="392" width="570" height="40" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="417" text-anchor="middle" font-size="12" fill="#a06b1a">x = y 时弦是自环：绕行 ≥ 直走 + 1，公式自动退化为纯链，无需特判</text>
</svg>
