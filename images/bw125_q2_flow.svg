<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="560" height="344" fill="#fafafa"/>
<text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="normal" filter="url(#roughs)">堆模拟：堆顶达标即全体达标</text>
<ellipse cx="280" cy="66" rx="100" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
<text x="280" y="72" text-anchor="middle" font-size="13" fill="#333333" font-weight="normal" filter="url(#roughs)">把 nums 建成小根堆</text>
<path d="M280,92 L280,116" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
<path d="M280,118 L392,166 L280,214 L168,166 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
<text x="280" y="160" text-anchor="middle" font-size="13" fill="#8a5a10" font-weight="normal" filter="url(#roughs)">size ≥ 2 且</text>
<text x="280" y="180" text-anchor="middle" font-size="13" fill="#8a5a10" font-weight="normal" filter="url(#roughs)">top &amp;lt; k ?</text>
<path d="M392,166 L432,166" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
<text x="408" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="normal" filter="url(#roughs)">是</text>
<rect x="434" y="138" width="112" height="60" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="490" y="160" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">弹 a、b</text>
<text x="490" y="180" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">压 2a+b，ops++</text>
<path d="M490,138 L490,104 L280,104" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
<path d="M280,214 L280,250" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
<text x="300" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="normal" filter="url(#roughs)">否</text>
<rect x="190" y="252" width="180" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="280" y="282" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#roughs)">返回 ops</text>
<text x="280" y="328" text-anchor="middle" font-size="12" fill="#666" font-weight="normal" filter="url(#roughs)">top 是全局最小值：top ≥ k ⇔ 全体 ≥ k</text>
</svg>
