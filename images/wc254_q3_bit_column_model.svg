<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">核心观察：每一列 1 的个数守恒，把 1 尽量集中到少数元素</text>
  <path d="M 150 46 Q 450 54 750 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- ================= 左：原始数组 ================= -->
  <text x="70" y="80" font-size="13" font-weight="bold" fill="#2b4e6e"
        filter="url(#rough2)">原始 nums = 1 … 2^p − 1（图示 p = 3，共 7 个）</text>
  <rect x="60" y="92" width="360" height="300" rx="10" fill="#f4f8fc" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>

  <text x="240" y="122" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">位</text>
  <text x="262" y="122" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">b₂</text>
  <text x="289" y="122" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">b₁</text>
  <text x="316" y="122" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">b₀</text>

  <g filter="url(#rough2)">
    <rect x="250" y="132" width="24" height="24" rx="3" fill="#eef2f8" stroke="#8aa2bb" stroke-width="1.1"/><rect x="277" y="132" width="24" height="24" rx="3" fill="#eef2f8" stroke="#8aa2bb" stroke-width="1.1"/><rect x="304" y="132" width="24" height="24" rx="3" fill="#fce9c9" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="250" y="162" width="24" height="24" rx="3" fill="#eef2f8" stroke="#8aa2bb" stroke-width="1.1"/><rect x="277" y="162" width="24" height="24" rx="3" fill="#fce9c9" stroke="#c98a2b" stroke-width="1.4"/><rect x="304" y="162" width="24" height="24" rx="3" fill="#eef2f8" stroke="#8aa2bb" stroke-width="1.1"/>
    <rect x="250" y="192" width="24" height="24" rx="3" fill="#eef2f8" stroke="#8aa2bb" stroke-width="1.1"/><rect x="277" y="192" width="24" height="24" rx="3" fill="#fce9c9" stroke="#c98a2b" stroke-width="1.4"/><rect x="304" y="192" width="24" height="24" rx="3" fill="#fce9c9" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="250" y="222" width="24" height="24" rx="3" fill="#fce9c9" stroke="#c98a2b" stroke-width="1.4"/><rect x="277" y="222" width="24" height="24" rx="3" fill="#eef2f8" stroke="#8aa2bb" stroke-width="1.1"/><rect x="304" y="222" width="24" height="24" rx="3" fill="#eef2f8" stroke="#8aa2bb" stroke-width="1.1"/>
    <rect x="250" y="252" width="24" height="24" rx="3" fill="#fce9c9" stroke="#c98a2b" stroke-width="1.4"/><rect x="277" y="252" width="24" height="24" rx="3" fill="#eef2f8" stroke="#8aa2bb" stroke-width="1.1"/><rect x="304" y="252" width="24" height="24" rx="3" fill="#fce9c9" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="250" y="282" width="24" height="24" rx="3" fill="#fce9c9" stroke="#c98a2b" stroke-width="1.4"/><rect x="277" y="282" width="24" height="24" rx="3" fill="#fce9c9" stroke="#c98a2b" stroke-width="1.4"/><rect x="304" y="282" width="24" height="24" rx="3" fill="#eef2f8" stroke="#8aa2bb" stroke-width="1.1"/>
    <rect x="250" y="312" width="24" height="24" rx="3" fill="#fce9c9" stroke="#c98a2b" stroke-width="1.4"/><rect x="277" y="312" width="24" height="24" rx="3" fill="#fce9c9" stroke="#c98a2b" stroke-width="1.4"/><rect x="304" y="312" width="24" height="24" rx="3" fill="#fce9c9" stroke="#c98a2b" stroke-width="1.4"/>
  </g>

  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="238" y="149">1</text><text x="238" y="179">2</text><text x="238" y="209">3</text>
    <text x="238" y="239">4</text><text x="238" y="269">5</text><text x="238" y="299">6</text>
    <text x="238" y="329">7</text>
  </g>
  <g font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">
    <text x="262" y="149">0</text><text x="289" y="149">0</text><text x="316" y="149">1</text>
    <text x="262" y="179">0</text><text x="289" y="179">1</text><text x="316" y="179">0</text>
    <text x="262" y="209">0</text><text x="289" y="209">1</text><text x="316" y="209">1</text>
    <text x="262" y="239">1</text><text x="289" y="239">0</text><text x="316" y="239">0</text>
    <text x="262" y="269">1</text><text x="289" y="269">0</text><text x="316" y="269">1</text>
    <text x="262" y="299">1</text><text x="289" y="299">1</text><text x="316" y="299">0</text>
    <text x="262" y="329">1</text><text x="289" y="329">1</text><text x="316" y="329">1</text>
  </g>

  <path d="M 250 344 L 328 344" stroke="#8aa2bb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="238" y="368" text-anchor="end" font-size="11.5" fill="#b85450" filter="url(#rough2)">每列个数</text>
  <g font-size="13" font-weight="bold" fill="#b85450" text-anchor="middle" filter="url(#rough2)">
    <text x="262" y="368">4</text><text x="289" y="368">4</text><text x="316" y="368">4</text>
  </g>
  <text x="240" y="386" text-anchor="middle" font-size="11" fill="#666"
        filter="url(#rough2)">每列恰好 2^(p−1) = 4 个 1：交换不改变它</text>

  <!-- ================= 中间箭头 ================= -->
  <path d="M 432 240 L 512 240" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="472" y="206" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">同列内</text>
  <text x="472" y="222" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">任意重排</text>
  <text x="472" y="262" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">乘积变小</text>
  <text x="472" y="278" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">↓</text>

  <!-- ================= 右：最优形态 ================= -->
  <text x="540" y="80" font-size="13" font-weight="bold" fill="#3a6e46"
        filter="url(#rough2)">最优形态：3 个 1 + 3 个 6 + 1 个 7</text>
  <rect x="528" y="92" width="312" height="300" rx="10" fill="#f5faf6" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>

  <text x="640" y="122" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">b₂</text>
  <text x="667" y="122" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">b₁</text>
  <text x="694" y="122" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">b₀</text>

  <g filter="url(#rough2)">
    <rect x="628" y="132" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/><rect x="655" y="132" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/><rect x="682" y="132" width="24" height="24" rx="3" fill="#d6ecdb" stroke="#3f6b31" stroke-width="1.5"/>
    <rect x="628" y="162" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/><rect x="655" y="162" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/><rect x="682" y="162" width="24" height="24" rx="3" fill="#d6ecdb" stroke="#3f6b31" stroke-width="1.5"/>
    <rect x="628" y="192" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/><rect x="655" y="192" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/><rect x="682" y="192" width="24" height="24" rx="3" fill="#d6ecdb" stroke="#3f6b31" stroke-width="1.5"/>
    <rect x="628" y="222" width="24" height="24" rx="3" fill="#cfe6f7" stroke="#446688" stroke-width="1.5"/><rect x="655" y="222" width="24" height="24" rx="3" fill="#cfe6f7" stroke="#446688" stroke-width="1.5"/><rect x="682" y="222" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="628" y="252" width="24" height="24" rx="3" fill="#cfe6f7" stroke="#446688" stroke-width="1.5"/><rect x="655" y="252" width="24" height="24" rx="3" fill="#cfe6f7" stroke="#446688" stroke-width="1.5"/><rect x="682" y="252" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="628" y="282" width="24" height="24" rx="3" fill="#cfe6f7" stroke="#446688" stroke-width="1.5"/><rect x="655" y="282" width="24" height="24" rx="3" fill="#cfe6f7" stroke="#446688" stroke-width="1.5"/><rect x="682" y="282" width="24" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="628" y="312" width="24" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/><rect x="655" y="312" width="24" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/><rect x="682" y="312" width="24" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>

  <g font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">
    <text x="640" y="149">0</text><text x="667" y="149">0</text><text x="694" y="149">1</text>
    <text x="640" y="179">0</text><text x="667" y="179">0</text><text x="694" y="179">1</text>
    <text x="640" y="209">0</text><text x="667" y="209">0</text><text x="694" y="209">1</text>
    <text x="640" y="239">1</text><text x="667" y="239">1</text><text x="694" y="239">0</text>
    <text x="640" y="269">1</text><text x="667" y="269">1</text><text x="694" y="269">0</text>
    <text x="640" y="299">1</text><text x="667" y="299">1</text><text x="694" y="299">0</text>
    <text x="640" y="329">1</text><text x="667" y="329">1</text><text x="694" y="329">1</text>
  </g>

  <g font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">
    <text x="718" y="149">= 1</text>
    <text x="718" y="179">= 1</text>
    <text x="718" y="209">= 1</text>
    <text x="718" y="239">= 6</text>
    <text x="718" y="269">= 6</text>
    <text x="718" y="299">= 6</text>
    <text x="718" y="329">= 7</text>
  </g>

  <path d="M 628 344 L 706 344" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="616" y="368" text-anchor="end" font-size="11.5" fill="#b85450" filter="url(#rough2)">每列个数</text>
  <g font-size="13" font-weight="bold" fill="#b85450" text-anchor="middle" filter="url(#rough2)">
    <text x="640" y="368">4</text><text x="667" y="368">4</text><text x="694" y="368">4</text>
  </g>
  <text x="684" y="386" text-anchor="middle" font-size="11" fill="#666"
        filter="url(#rough2)">3 + 1 = 4，与原数组一致 ⇒ 可达</text>

  <!-- ================= 底部结论 ================= -->
  <rect x="60" y="410" width="780" height="126" rx="10" fill="#fdf8ec" stroke="#d6a040"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="438" font-size="13.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">最小非零乘积 = (2^p − 2)^(2^(p−1) − 1) × (2^p − 1)</text>
  <text x="80" y="462" font-size="12" fill="#444" filter="url(#rough2)">p = 3：1 × 1 × 1 × 6 × 6 × 6 × 7 = 1512 = 6³ × 7</text>
  <text x="80" y="486" font-size="12" fill="#444" filter="url(#rough2)">个数核对：(2^(p−1) − 1) + (2^(p−1) − 1) + 1 = 2^p − 1 ✓</text>
  <text x="80" y="512" font-size="11" fill="#888" filter="url(#rough2)">目标形态只由每列 1 的个数决定；同一列内的 1 可以任意换行</text>
  <text x="80" y="528" font-size="11" fill="#888" filter="url(#rough2)">这正是"位计数守恒"给出的全部约束</text>
</svg>
