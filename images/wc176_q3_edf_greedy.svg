<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：最早截止优先（EDF）贪心</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">同一天有多个会议可选时，先参加“结束最早”的那一个</text>

  <!-- 时间轴：4 个会议落在 3 个日子上 -->
  <g filter="url(#rough2)">
    <rect x="90" y="58" width="90" height="118" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="3"/>
    <rect x="180" y="58" width="90" height="118" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="3"/>
    <rect x="270" y="58" width="90" height="118" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="3"/>
    <rect x="360" y="58" width="90" height="118" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="3"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#777" text-anchor="middle">
    <text x="135" y="74">第 1 天</text>
    <text x="225" y="74">第 2 天</text>
    <text x="315" y="74">第 3 天</text>
    <text x="405" y="74">第 4 天</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="93" y="82" width="174" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="180" y="94" fill="#3a4a66">A [1,2]</text>
    <rect x="183" y="104" width="174" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="270" y="116" fill="#3a5a30">B [2,3]</text>
    <rect x="273" y="126" width="174" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="360" y="138" fill="#8a6a20">C [3,4]</text>
    <rect x="93" y="148" width="174" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="180" y="160" fill="#8a3a36">D [1,2]</text>
  </g>

  <text x="280" y="194" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">第 1 天面对 A、D 两个候选，第 2 天又新增 B —— 到底该参加谁？</text>

  <!-- 三条规则 -->
  <rect x="40" y="206" width="480" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#5a4a20" filter="url(#rough2)">
    <text x="56" y="228">① 堆里只存结束日 end，开始日仅用于决定“何时入池”</text>
    <text x="56" y="250">② 每天弹出堆中最小的 end —— 最早截止者优先</text>
    <text x="56" y="272">③ 堆顶 end &lt; 今天 ⇒ 已过期，无法再参加，直接丢弃</text>
  </g>

  <path d="M 280 298 L 280 306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 交换论证 -->
  <rect x="40" y="306" width="480" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#3a5a30" filter="url(#rough2)">
    <text x="56" y="328">为什么安全：把当天“更晚结束”的选择换成“更早结束”，</text>
    <text x="56" y="350">未来每天可选的会议集合只会变大 ⇒ 答案不会变小。</text>
  </g>
</svg>
