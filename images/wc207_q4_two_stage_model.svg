<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：任意合法方案都可规范化为「主连接 + 兜底」</text>

  <!-- legend -->
  <g filter="url(#r)">
    <line x1="140" y1="44" x2="172" y2="44" stroke="#446688" stroke-width="2.4"/>
    <line x1="250" y1="44" x2="282" y2="44" stroke="#d6a040" stroke-width="2.4" stroke-dasharray="6 4"/>
    <line x1="372" y1="44" x2="404" y2="44" stroke="#888" stroke-width="1.6"/>
  </g>
  <text x="180" y="48" font-size="10.5" fill="#666" filter="url(#r)">主连接（primary）</text>
  <text x="290" y="48" font-size="10.5" fill="#666" filter="url(#r)">兜底边（fixup）</text>
  <text x="412" y="48" font-size="10.5" fill="#666" filter="url(#r)">原方案普通边</text>

  <!-- ===== Left panel: arbitrary valid solution ===== -->
  <text x="161" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#r)">① 任意合法方案 S（题面解释的样例 2 最优解）</text>

  <!-- left nodes -->
  <g filter="url(#r)">
    <circle cx="88" cy="118" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="88" cy="196" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="88" cy="274" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="234" cy="118" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="234" cy="196" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="234" cy="274" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="13" font-weight="bold" filter="url(#r)">
    <text x="88" y="123" text-anchor="middle" fill="#2f5d28">1</text>
    <text x="88" y="201" text-anchor="middle" fill="#2f5d28">2</text>
    <text x="88" y="279" text-anchor="middle" fill="#2f5d28">3</text>
    <text x="234" y="123" text-anchor="middle" fill="#2c4a66">A</text>
    <text x="234" y="201" text-anchor="middle" fill="#2c4a66">B</text>
    <text x="234" y="279" text-anchor="middle" fill="#2c4a66">C</text>
  </g>
  <g filter="url(#r)">
    <line x1="105" y1="118" x2="217" y2="118" stroke="#888" stroke-width="1.6"/>
    <line x1="105" y1="196" x2="217" y2="196" stroke="#888" stroke-width="1.6"/>
    <line x1="105" y1="203" x2="217" y2="267" stroke="#888" stroke-width="1.6"/>
    <line x1="105" y1="267" x2="217" y2="125" stroke="#888" stroke-width="1.6"/>
  </g>
  <g font-size="10.5" fill="#777" filter="url(#r)">
    <text x="161" y="110" text-anchor="middle">1</text>
    <text x="161" y="188" text-anchor="middle">1</text>
    <text x="124" y="242" text-anchor="middle">1</text>
    <text x="200" y="180" text-anchor="middle">1</text>
  </g>
  <text x="161" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#r)">总成本 4 —— 点 2 连出两条边</text>
  <text x="161" y="330" text-anchor="middle" font-size="10" fill="#999" filter="url(#r)">两条边都「必要」吗？换个记账方式看看 →</text>

  <!-- center arrow -->
  <g filter="url(#r)">
    <path d="M 258 196 L 358 196" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="308" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#r)">规范化</text>
  <text x="308" y="214" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">去冗余 + 兜底</text>
  <text x="308" y="228" text-anchor="middle" font-size="10" fill="#888" filter="url(#r)">成本不增（§5 引理 1）</text>

  <!-- ===== Right panel: canonical form ===== -->
  <text x="465" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a66" filter="url(#r)">② 规范形 S′（主连接 + 兜底）</text>

  <g filter="url(#r)">
    <circle cx="392" cy="118" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="392" cy="196" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="392" cy="274" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="538" cy="118" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="538" cy="196" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="538" cy="274" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g font-size="13" font-weight="bold" filter="url(#r)">
    <text x="392" y="123" text-anchor="middle" fill="#2f5d28">1</text>
    <text x="392" y="201" text-anchor="middle" fill="#2f5d28">2</text>
    <text x="392" y="279" text-anchor="middle" fill="#2f5d28">3</text>
    <text x="538" y="123" text-anchor="middle" fill="#2c4a66">A</text>
    <text x="538" y="201" text-anchor="middle" fill="#2c4a66">B</text>
    <text x="538" y="279" text-anchor="middle" fill="#7a5415">C</text>
  </g>
  <g filter="url(#r)">
    <line x1="409" y1="118" x2="521" y2="118" stroke="#446688" stroke-width="2.4"/>
    <line x1="409" y1="196" x2="521" y2="196" stroke="#446688" stroke-width="2.4"/>
    <line x1="409" y1="267" x2="521" y2="125" stroke="#446688" stroke-width="2.4"/>
    <line x1="409" y1="203" x2="521" y2="267" stroke="#d6a040" stroke-width="2.4" stroke-dasharray="6 4"/>
  </g>
  <g font-size="10.5" filter="url(#r)">
    <text x="465" y="110" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="465" y="188" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="504" y="180" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="428" y="244" text-anchor="middle" fill="#b07818" font-weight="bold">1</text>
    <text x="462" y="252" text-anchor="middle" fill="#b07818" font-size="9">兜底</text>
  </g>
  <text x="465" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c4a66" filter="url(#r)">主连接 3 + 兜底 1 = 4（分毫未变）</text>
  <text x="465" y="330" text-anchor="middle" font-size="10" fill="#999" filter="url(#r)">兜底 cheap[C] = 1，恰好也来自点 2</text>

  <!-- ===== bottom insight box ===== -->
  <g filter="url(#r)">
    <rect x="36" y="352" width="548" height="114" rx="10" fill="#fffdf3" stroke="#999" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="56" y="376" font-size="12" font-weight="bold" fill="#333" filter="url(#r)">关键解耦</text>
  <text x="56" y="398" font-size="10.8" fill="#555" filter="url(#r)">兜底成本 cheap[j] = minᵢ cost[i][j] 只依赖 j —— 与主连接怎么选无关，mask 一定总成本就定</text>
  <text x="56" y="420" font-size="10.8" fill="#555" filter="url(#r)">兜底边不占主连接名额：点 2 以单价 1 同时服务 B、C 两列（主连接名额只有一条）</text>
  <text x="56" y="442" font-size="10.8" fill="#7a2828" filter="url(#r)">覆盖型约束从 DP 转移中剥离，推迟到末尾统一贪心补齐 → 转移只需枚举单个 j</text>
  <text x="56" y="460" font-size="9.5" fill="#999" filter="url(#r)">（表内 minᵢ 表示对所有第一组点 i 取最小）</text>
</svg>
