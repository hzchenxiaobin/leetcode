<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2 演算：n = 6，质数 {2,3,5}，孤岛 {1}、{4}、{6}</text>

  <!-- mini tree -->
  <g stroke="#999" stroke-width="1.4" filter="url(#sk)">
    <line x1="340" y1="58"  x2="268" y2="100"/>
    <line x1="340" y1="58"  x2="412" y2="100"/>
    <line x1="268" y1="100" x2="232" y2="138"/>
    <line x1="412" y1="100" x2="378" y2="138"/>
    <line x1="412" y1="100" x2="446" y2="138"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="340" cy="58"  r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="268" cy="100" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="412" cy="100" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="232" cy="138" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="378" cy="138" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="446" cy="138" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="bold" filter="url(#sk)">
    <text x="340" y="62"  fill="#2b3a52">1</text>
    <text x="268" y="104" fill="#7a3a34">2</text>
    <text x="412" y="104" fill="#7a3a34">3</text>
    <text x="232" y="142" fill="#2b3a52">4</text>
    <text x="378" y="142" fill="#7a3a34">5</text>
    <text x="446" y="142" fill="#2b3a52">6</text>
  </g>

  <!-- table -->
  <g filter="url(#sk)">
    <rect x="50" y="168" width="580" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="50" y="202" width="580" height="34" fill="#fdfdfd" stroke="#999" stroke-width="1"/>
    <rect x="50" y="236" width="580" height="34" fill="#fdfdfd" stroke="#999" stroke-width="1"/>
    <rect x="50" y="270" width="580" height="34" fill="#fdfdfd" stroke="#999" stroke-width="1"/>
    <rect x="50" y="304" width="580" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <line x1="114" y1="168" x2="114" y2="338" stroke="#bbb" stroke-width="1"/>
    <line x1="314" y1="168" x2="314" y2="338" stroke="#bbb" stroke-width="1"/>
    <line x1="370" y1="168" x2="370" y2="338" stroke="#bbb" stroke-width="1"/>
    <line x1="470" y1="168" x2="470" y2="338" stroke="#bbb" stroke-width="1"/>
    <line x1="554" y1="168" x2="554" y2="338" stroke="#bbb" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="11.5" filter="url(#sk)">
    <text x="82"  y="189" fill="#2b3a52" font-weight="bold">质数 p</text>
    <text x="214" y="189" fill="#2b3a52" font-weight="bold">邻接孤岛（大小）</text>
    <text x="342" y="189" fill="#2b3a52" font-weight="bold">S</text>
    <text x="420" y="189" fill="#2b3a52" font-weight="bold">跨孤岛对</text>
    <text x="512" y="189" fill="#2b3a52" font-weight="bold">(p,x) 对</text>
    <text x="592" y="189" fill="#2b3a52" font-weight="bold">小计</text>

    <text x="82"  y="223" fill="#b85450" font-weight="bold">2</text>
    <text x="214" y="223" fill="#333">{1}(1)、{4}(1)</text>
    <text x="342" y="223" fill="#333">2</text>
    <text x="420" y="223" fill="#333">1×1 = 1</text>
    <text x="512" y="223" fill="#333">2</text>
    <text x="592" y="223" fill="#333" font-weight="bold">3</text>

    <text x="82"  y="257" fill="#b85450" font-weight="bold">3</text>
    <text x="214" y="257" fill="#333">{1}(1)、{6}(1)</text>
    <text x="342" y="257" fill="#333">2</text>
    <text x="420" y="257" fill="#333">1×1 = 1</text>
    <text x="512" y="257" fill="#333">2</text>
    <text x="592" y="257" fill="#333" font-weight="bold">3</text>

    <text x="82"  y="291" fill="#b85450" font-weight="bold">5</text>
    <text x="214" y="291" fill="#666">邻居 3 是质数 → 无</text>
    <text x="342" y="291" fill="#333">0</text>
    <text x="420" y="291" fill="#333">0</text>
    <text x="512" y="291" fill="#333">0</text>
    <text x="592" y="291" fill="#333">0</text>

    <text x="82"  y="325" fill="#2f5a22" font-weight="bold">合计</text>
    <text x="342" y="325" fill="#2f5a22">3 + 3 + 0</text>
    <text x="592" y="326" fill="#2f5a22" font-weight="bold" font-size="14">6</text>
  </g>

  <!-- summary card -->
  <rect x="50" y="356" width="580" height="90" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="340" y="382" font-size="12" fill="#6a4a10">6 条合法路径 —— 经质数 2：(1,2)、(2,4)、(1,4)；经质数 3：(1,3)、(3,6)、(1,6)</text>
    <text x="340" y="406" font-size="11" fill="#8a6520">质数 5：唯一邻居是质数 3，「两质数相接」的路径至少含 2 个质数 → 贡献 0</text>
    <text x="340" y="428" font-size="11" fill="#8a6520">孤岛 {1}、{4}、{6} 内部无点对；不含质数的路径不满足「恰好一个」，均不计入</text>
  </g>
</svg>
