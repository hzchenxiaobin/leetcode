<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">0-1 Trie 逐位查询演算：Trie 已插入 {1, 2, 4}（4 位示意，实际 15 位）</text>

  <!-- Result banner -->
  <rect x="60" y="32" width="640" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="54" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">查询 x = 7（0111₂），L = 7（0111₂）：每逢 L 该位为 1，把「异或位取 0」的子树整块计入 → f(7) = 1+1+1 = 3</text>

  <!-- Legend -->
  <text x="560" y="96" text-anchor="start" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">红 = 下探（贴住 L 的前缀）</text>
  <text x="560" y="114" text-anchor="start" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">橙 = 整块累加 cnt</text>

  <!-- Edges -->
  <g filter="url(#rough2)" fill="none">
    <path d="M 359 124 L 280 181" stroke="#b85450" stroke-width="3"/>
    <path d="M 393 121 L 527 186" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M 251 204 L 183 261" stroke="#b85450" stroke-width="3"/>
    <path d="M 279 204 L 347 261" stroke="#d6a040" stroke-width="3"/>
    <path d="M 160 286 L 124 339" stroke="#b85450" stroke-width="3"/>
    <path d="M 182 284 L 243 341" stroke="#d6a040" stroke-width="3"/>
    <path d="M 368 287 L 393 338" stroke="#999" stroke-width="1.5"/>
    <path d="M 114 368 L 116 412" stroke="#d6a040" stroke-width="3"/>
    <path d="M 103 363 L 54 408" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M 256 368 L 257 412" stroke="#999" stroke-width="1.5"/>
    <path d="M 401 368 L 402 412" stroke="#999" stroke-width="1.5"/>
  </g>

  <!-- Edge labels -->
  <g filter="url(#rough2)" font-size="13" font-weight="bold">
    <text x="306" y="146" fill="#b85450">0</text>
    <text x="472" y="146" fill="#999">1</text>
    <text x="205" y="226" fill="#b85450">0</text>
    <text x="318" y="226" fill="#d6a040">1</text>
    <text x="132" y="308" fill="#b85450">0</text>
    <text x="225" y="308" fill="#d6a040">1</text>
    <text x="394" y="308" fill="#999">0</text>
    <text x="98" y="392" fill="#d6a040">1</text>
    <text x="70" y="382" fill="#b85450">0</text>
    <text x="243" y="392" fill="#999">0</text>
    <text x="389" y="392" fill="#999">0</text>
  </g>

  <!-- +1 badges -->
  <g filter="url(#rough2)">
    <circle cx="348" cy="244" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="348" y="248" text-anchor="middle" font-size="10" fill="#7a5a10" font-weight="bold">+1</text>
    <circle cx="232" cy="316" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="232" y="320" text-anchor="middle" font-size="10" fill="#7a5a10" font-weight="bold">+1</text>
    <circle cx="140" cy="390" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="140" y="394" text-anchor="middle" font-size="10" fill="#7a5a10" font-weight="bold">+1</text>
  </g>

  <!-- Nodes -->
  <g filter="url(#rough2)"><circle cx="375" cy="112" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="375" y="117" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">root</text>

  <g filter="url(#rough2)"><circle cx="265" cy="192" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="265" y="197" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="293" y="184" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">cnt=3</text>

  <g filter="url(#rough2)"><circle cx="540" cy="192" r="13" fill="#f2f2f2" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="540" y="197" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">∅</text>

  <g filter="url(#rough2)"><circle cx="170" cy="272" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="170" y="277" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">00</text>
  <text x="143" y="264" text-anchor="end" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">cnt=2</text>

  <g filter="url(#rough2)"><circle cx="360" cy="272" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="360" y="277" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">01</text>
  <text x="388" y="264" text-anchor="start" font-size="10.5" fill="#d6a040" filter="url(#rough2)">cnt=1</text>

  <g filter="url(#rough2)"><circle cx="115" cy="352" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="115" y="357" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">000</text>
  <text x="88" y="344" text-anchor="end" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">cnt=1</text>

  <g filter="url(#rough2)"><circle cx="255" cy="352" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="255" y="357" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">001</text>
  <text x="283" y="344" text-anchor="start" font-size="10.5" fill="#d6a040" filter="url(#rough2)">cnt=1</text>

  <g filter="url(#rough2)"><circle cx="400" cy="352" r="16" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/></g>
  <text x="400" y="357" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">010</text>
  <text x="428" y="344" text-anchor="start" font-size="10.5" fill="#999" filter="url(#rough2)">cnt=1</text>

  <!-- Leaves -->
  <rect x="82" y="412" width="70" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="117" y="430" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">0001 = 1</text>
  <rect x="222" y="412" width="70" height="26" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="257" y="430" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">0010 = 2</text>
  <rect x="367" y="412" width="70" height="26" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="430" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">0100 = 4</text>

  <!-- Empty node hit by the query -->
  <g filter="url(#rough2)"><circle cx="46" cy="415" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"/></g>
  <text x="46" y="420" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">∅</text>
  <text x="46" y="444" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">空 → 终止</text>

  <!-- Bit level labels -->
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="26" y="130" font-size="9" fill="#aaa">高位在前</text>
    <text x="26" y="156" font-size="11" fill="#888" font-weight="bold">第3位</text>
    <text x="26" y="170" font-size="8.5" fill="#aaa">xb=0, lb=0</text>
    <text x="26" y="234" font-size="11" fill="#888" font-weight="bold">第2位</text>
    <text x="26" y="248" font-size="8.5" fill="#aaa">xb=1, lb=1</text>
    <text x="26" y="314" font-size="11" fill="#888" font-weight="bold">第1位</text>
    <text x="26" y="328" font-size="8.5" fill="#aaa">xb=1, lb=1</text>
    <text x="26" y="392" font-size="11" fill="#888" font-weight="bold">第0位</text>
    <text x="26" y="404" font-size="8.5" fill="#aaa">xb=1, lb=1</text>
  </g>

  <!-- Per-bit annotation boxes -->
  <rect x="18" y="458" width="170" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="103" y="477" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">b3：lb=0 → 只能走 0 边下探</text>
  <text x="103" y="494" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">（异或位须=0），不累加 → A</text>

  <rect x="200" y="458" width="170" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="285" y="477" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">b2：lb=1 → 1 边子树 cnt=1</text>
  <text x="285" y="494" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">（{4}）整块 +1，再走 0 边 → B</text>

  <rect x="382" y="458" width="170" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="467" y="477" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">b1：lb=1 → 1 边子树 cnt=1</text>
  <text x="467" y="494" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">（{2}）+1，走 0 边 → D</text>

  <rect x="564" y="458" width="170" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="649" y="477" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">b0：lb=1 → 1 边 cnt=1（{1}）+1</text>
  <text x="649" y="494" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">0 边为空 → 终止，返回 3</text>
</svg>
