<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：逐个候选求数位乘积并判定整除</text>

  <rect x="215" y="48" width="150" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="73" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">x = n（初值）</text>

  <path d="M 290 88 L 290 118" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="120" width="260" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="147" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">p = x 各数位之积（含 0 即为 0）</text>

  <path d="M 290 164 L 290 184" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="290,186 400,216 290,246 180,216" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="221" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">p % t == 0 ?</text>

  <!-- 否：加大 x -->
  <path d="M 180 216 C 150 216, 130 210, 120 210" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="200" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="24" y="188" width="96" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x = x + 1</text>
  <path d="M 72 188 L 72 68 L 210 68" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 是：返回 -->
  <path d="M 290 246 L 290 274" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="266" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="200" y="276" width="180" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="303" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 x（首个合法即最小）</text>

  <text x="440" y="300" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">最多循环 10 次</text>
</svg>
