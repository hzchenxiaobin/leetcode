<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">固定 A 后，只有「不断刷新最高 y」的点才是合法 B</text>

  <!-- 坐标轴 -->
  <path d="M 60 282 L 240 282" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 60 282 L 60 58" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="246" y="286" font-size="10" fill="#888" filter="url(#rough2)">x</text>
  <text x="50" y="54" font-size="10" fill="#888" filter="url(#rough2)">y</text>

  <!-- 合法矩形 A→(2,5)：虚线 -->
  <rect x="86" y="92" width="52" height="104" fill="#e6f4ea" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <!-- 合法矩形 A→(3,6)：实线 -->
  <rect x="86" y="92" width="78" height="52" fill="#e6f4ea" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <circle cx="86" cy="92" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="78" y="84" text-anchor="end" font-size="10.5" fill="#8c3a3a" filter="url(#rough2)">A(1,7)</text>
  <circle cx="138" cy="196" r="4.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="146" y="208" font-size="10" fill="#2f5226" filter="url(#rough2)">(2,5)</text>
  <circle cx="164" cy="144" r="4.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="172" y="140" font-size="10" fill="#2f5226" filter="url(#rough2)">(3,6)</text>
  <circle cx="190" cy="222" r="4" fill="#999" filter="url(#rough2)"/>
  <text x="198" y="234" font-size="10" fill="#888" filter="url(#rough2)">(4,4)</text>
  <circle cx="216" cy="144" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="222" y="132" font-size="10" fill="#8c3a3a" filter="url(#rough2)">(5,6)</text>

  <!-- 右侧扫描记录 -->
  <rect x="286" y="44" width="256" height="242" rx="10" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="66" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">A = (1,7)，按 x 升序扫描，mx 初值 −∞</text>

  <g font-size="9.8" fill="#333" filter="url(#rough2)">
    <text x="300" y="92">(2,5)：5 &gt; −∞ → 计数，mx ← 5</text>
    <text x="300" y="120">(3,6)：6 &gt; 5 → 计数，mx ← 6</text>
    <text x="300" y="148">(4,4)：4 ≤ 6 → 跳过（被挡住）</text>
    <text x="300" y="176">(5,6)：6 ≤ 6 → 跳过（同高被挡）</text>
  </g>
  <rect x="294" y="186" width="240" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="304" y="204" font-size="9.8" fill="#8c3a3a" filter="url(#rough2)">(5,6) 与 (3,6) 等高：矩形退化</text>
  <text x="304" y="222" font-size="9.8" fill="#8c3a3a" filter="url(#rough2)">成一条线，(3,6) 正压在这条线上</text>

  <text x="300" y="256" font-size="9.8" fill="#666" filter="url(#rough2)">所以判断必须是严格「y &gt; mx」，等号要排除</text>
  <text x="300" y="274" font-size="9.8" fill="#666" filter="url(#rough2)">mx 只增不减，故一趟扫描即可</text>

  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">y &gt; mx ⇔ 前面扫描过的点没有一个落在 [xj, xi] × [yj, yi] 里</text>
  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">绿框是 A 与两个合法 B 围成的矩形，彼此都不含其它点</text>
</svg>
