<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>

  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">前两个一走，配对方式就被钉死了</text>

  <!-- 配对弧 -->
  <path d="M 70 84 C 88 44, 128 44, 146 84" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="108" y="42" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">3+2 = 5 ✓</text>
  <path d="M 222 84 C 240 44, 280 44, 298 84" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">1+4 = 5 ✓</text>
  <path d="M 374 84 C 392 44, 432 44, 450 84" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <text x="412" y="42" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">5+7 = 12 ✗</text>

  <!-- 格子 -->
  <g filter="url(#rough2)">
    <rect x="40" y="90" width="60" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9"/>
    <rect x="116" y="90" width="60" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9"/>
    <rect x="192" y="90" width="60" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9"/>
    <rect x="268" y="90" width="60" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9"/>
    <rect x="344" y="90" width="60" height="42" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.9"/>
    <rect x="420" y="90" width="60" height="42" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.9"/>
  </g>
  <g font-size="16" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="70" y="118">3</text><text x="146" y="118">2</text><text x="222" y="118">1</text>
    <text x="298" y="118">4</text><text x="374" y="118">5</text><text x="450" y="118">7</text>
  </g>
  <g font-size="9" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="146">0</text><text x="146" y="146">1</text><text x="222" y="146">2</text>
    <text x="298" y="146">3</text><text x="374" y="146">4</text><text x="450" y="146">5</text>
  </g>

  <!-- 结果条 -->
  <rect x="40" y="162" width="220" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="180" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">分数由第一对定为 5</text>
  <text x="150" y="195" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">之后每一对都必须恰好等于 5</text>

  <rect x="280" y="162" width="240" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="400" y="180" text-anchor="middle" font-size="11" fill="#2f5226" filter="url(#rough2)">成功的操作：2 次</text>
  <text x="400" y="195" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">(5,7) 配不上 5，到此为止</text>

  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">因为每次只能删「最前面两个」，第 1、2 个一定配成一对，第 3、4 个一定配成一对……</text>
  <text x="280" y="252" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">配对方案唯一 ⇒ 不需要搜索，顺着数下去即可</text>
  <text x="280" y="276" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">数组长度为奇数时最后会剩下一个元素，它不参与任何操作</text>
</svg>
