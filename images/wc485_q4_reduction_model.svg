<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：每个字母的「最后一份」永远删不掉</text>

  <!-- 上：单向棘轮 -->
  <rect x="32" y="44" width="276" height="180" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="66" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">方向一：次数的单向棘轮（删不到零）</text>

  <rect x="60" y="84" width="86" height="30" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103" y="104" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">次数 ≥ 2</text>
  <path d="M146,99 L188,99" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="167" y="92" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">删一次 ✓</text>
  <rect x="188" y="84" width="86" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="231" y="104" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">次数 ≥ 1</text>

  <rect x="60" y="128" width="86" height="30" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103" y="148" text-anchor="middle" font-size="11" fill="#a0433f" filter="url(#rough2)">次数 = 1</text>
  <path d="M146,143 L188,143" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="167" y="136" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">删一次 ✗</text>
  <rect x="188" y="128" width="86" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="231" y="148" text-anchor="middle" font-size="11" fill="#a0433f" filter="url(#rough2)">次数 = 0</text>

  <text x="170" y="180" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">操作要求被删字母「当前至少出现两次」</text>
  <text x="170" y="200" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">初始每字母 ≥ 1 ⟹ 任何时刻每字母 ≥ 1</text>
  <text x="170" y="216" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">⟹ 最终串必含 s 的全部不同字母</text>

  <!-- 右：留一即达 -->
  <rect x="332" y="44" width="276" height="180" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="66" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">方向二：留一即达（想留的都能留）</text>

  <text x="352" y="92" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">s =</text>
  <rect x="380" y="78" width="34" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="397" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="418" y="78" width="34" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="456" y="78" width="34" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="473" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <rect x="494" y="78" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="511" y="98" text-anchor="middle" font-size="12" fill="#a0433f" filter="url(#rough2)">c</text>
  <path d="M497,74 L508,60" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M519,74 L508,60" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="532" y="78" width="34" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="549" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="511" y="126" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">删这份 c 时 c 有 2 个 ✓</text>

  <text x="470" y="152" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">对每个字母 x：从 cnt_s(x) 删到 cnt_T(x) ≥ 1</text>
  <text x="470" y="170" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">每次动手时次数 ≥ cnt_T(x) + 1 ≥ 2，操作合法</text>
  <text x="470" y="192" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⟹ 任何「含全部字母的子序列」都可达</text>
  <text x="470" y="212" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">（不同字母的删除互不干扰，顺序随意）</text>

  <!-- 中：等价箭头 -->
  <rect x="36" y="248" width="568" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="270" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">等价改写：答案 = s 的「包含全部不同字母的子序列」中字典序最小者</text>
  <text x="320" y="292" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">例：s = "aaccb" 的候选有 aacb / acb / accb / aaccb …，最小为 "aacb"</text>

  <!-- 下：与 LC316 分野 -->
  <rect x="36" y="326" width="568" height="116" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="348" text-anchor="middle" font-size="12" fill="#a0433f" font-weight="bold" filter="url(#rough2)">与 LC316 的分野：至少一次 ≠ 恰好一次</text>
  <rect x="76" y="362" width="220" height="60" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="384" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">LC316：每个字母恰好一次</text>
  <text x="186" y="404" text-anchor="middle" font-size="10.5" fill="#a0433f" filter="url(#rough2)">"aaccb" → "acb"</text>
  <rect x="344" y="362" width="220" height="60" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="454" y="384" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">本题：每个字母至少一次</text>
  <text x="454" y="404" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">"aaccb" → "aacb" ✓ 更小！</text>
  <path d="M296,392 L344,392" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="320" y="436" text-anchor="middle" font-size="10" fill="#a0433f" filter="url(#rough2)">重复的小字母能把大字符往后顶——该留时要留</text>
</svg>
