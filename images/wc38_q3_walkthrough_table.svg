<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 395" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="395" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#444" filter="url(#rough2)">演算：n = 4 的 dp 表（j 是逆序对数）</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">蓝色 = 参与求和的三个加数，橙色 = 本轮算出的 dp[4][2]</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="140" y="84" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="204" y="84" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="268" y="84" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="332" y="84" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="396" y="84" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="460" y="84" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="524" y="84" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="172" y="105" text-anchor="middle" font-size="11" fill="#8a6a20">j=0</text>
    <text x="236" y="105" text-anchor="middle" font-size="11" fill="#8a6a20">j=1</text>
    <text x="300" y="105" text-anchor="middle" font-size="11" fill="#8a6a20">j=2</text>
    <text x="364" y="105" text-anchor="middle" font-size="11" fill="#8a6a20">j=3</text>
    <text x="428" y="105" text-anchor="middle" font-size="11" fill="#8a6a20">j=4</text>
    <text x="492" y="105" text-anchor="middle" font-size="11" fill="#8a6a20">j=5</text>
    <text x="556" y="105" text-anchor="middle" font-size="11" fill="#8a6a20">j=6</text>
    <text x="112" y="105" text-anchor="middle" font-size="10.5" fill="#666">i \ j</text>
    <text x="612" y="105" text-anchor="middle" font-size="10.5" fill="#666">行和</text>
  </g>

  <!-- i = 1 -->
  <text x="130" y="140" text-anchor="end" font-size="11" fill="#3a5a30" filter="url(#rough2)">i = 1</text>
  <g filter="url(#rough2)">
    <rect x="140" y="118" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="204" y="118" width="64" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="268" y="118" width="64" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="332" y="118" width="64" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="396" y="118" width="64" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="460" y="118" width="64" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="524" y="118" width="64" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="172" y="140" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
    <text x="236" y="140" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="300" y="140" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="364" y="140" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="428" y="140" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="492" y="140" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="556" y="140" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="612" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  </g>

  <!-- i = 2 -->
  <text x="130" y="174" text-anchor="end" font-size="11" fill="#3a5a30" filter="url(#rough2)">i = 2</text>
  <g filter="url(#rough2)">
    <rect x="140" y="152" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="204" y="152" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="268" y="152" width="64" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="332" y="152" width="64" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="396" y="152" width="64" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="460" y="152" width="64" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="524" y="152" width="64" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="172" y="174" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
    <text x="236" y="174" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
    <text x="300" y="174" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="364" y="174" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="428" y="174" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="492" y="174" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="556" y="174" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="612" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  </g>

  <!-- i = 3 -->
  <text x="130" y="208" text-anchor="end" font-size="11" fill="#3a5a30" filter="url(#rough2)">i = 3</text>
  <g filter="url(#rough2)">
    <rect x="140" y="186" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="204" y="186" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="268" y="186" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="332" y="186" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="396" y="186" width="64" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="460" y="186" width="64" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="524" y="186" width="64" height="32" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="172" y="208" text-anchor="middle" font-size="12" fill="#3a4a66">1</text>
    <text x="236" y="208" text-anchor="middle" font-size="12" fill="#3a4a66">2</text>
    <text x="300" y="208" text-anchor="middle" font-size="12" fill="#3a4a66">2</text>
    <text x="364" y="208" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
    <text x="428" y="208" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="492" y="208" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="556" y="208" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="612" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a">6</text>
  </g>

  <!-- i = 4 -->
  <text x="130" y="242" text-anchor="end" font-size="11" fill="#8a6a20" filter="url(#rough2)">i = 4</text>
  <g filter="url(#rough2)">
    <rect x="140" y="220" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="204" y="220" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="268" y="220" width="64" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <rect x="332" y="220" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="396" y="220" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="460" y="220" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="524" y="220" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="172" y="242" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
    <text x="236" y="242" text-anchor="middle" font-size="12" fill="#3a5a30">3</text>
    <text x="300" y="242" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">5</text>
    <text x="364" y="242" text-anchor="middle" font-size="12" fill="#3a5a30">6</text>
    <text x="428" y="242" text-anchor="middle" font-size="12" fill="#3a5a30">5</text>
    <text x="492" y="242" text-anchor="middle" font-size="12" fill="#3a5a30">3</text>
    <text x="556" y="242" text-anchor="middle" font-size="12" fill="#3a5a30">1</text>
    <text x="612" y="242" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">24</text>
  </g>

  <rect x="62" y="270" width="536" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="80" y="294" font-size="11.5" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">dp[4][2] = dp[3][0] + dp[3][1] + dp[3][2] = 1 + 2 + 2 = 5</text>
  <text x="80" y="315" font-size="10.5" fill="#555" filter="url(#rough2)">同一行内滑动：dp[4][4] = dp[4][3] + dp[3][4] − dp[3][0] = 6 + 0 − 1 = 5</text>

  <text x="330" y="350" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">行和依次为 1、2、6、24，正是 i!：n = 3 时 dp[3] 全行为 1 2 2 1，对应示例一、示例二</text>
  <text x="330" y="374" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">当 j &gt; i(i−1)/2 时格子恒为 0；最终答案就是第 n 行第 k 列</text>
</svg>
