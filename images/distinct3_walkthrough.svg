<svg xmlns="http://www.w3.org/2000/svg" width="640" height="445" viewBox="0 0 640 445" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="445" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：从右往左扫 [1,2,3,4,2,3,3,5,7]</text>
  <path d="M 170 44 Q 320 54 470 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- row i=8 -->
  <text x="52" y="77" font-size="12.5" fill="#555" font-family="monospace" filter="url(#sk)">i=8</text>
  <g font-family="monospace" font-size="12" fill="#333" text-anchor="middle">
    <g filter="url(#sk)"><rect x="90" y="58" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="116" y="58" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="142" y="58" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="168" y="58" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="194" y="58" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="220" y="58" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="246" y="58" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="272" y="58" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="298" y="58" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
    <text x="103" y="77">1</text><text x="129" y="77">2</text><text x="155" y="77">3</text>
    <text x="181" y="77">4</text><text x="207" y="77">2</text><text x="233" y="77">3</text>
    <text x="259" y="77">3</text><text x="285" y="77">5</text><text x="311" y="77" font-weight="bold">7</text>
  </g>
  <text x="352" y="77" font-size="12" fill="#333" font-family="monospace" filter="url(#sk)">seen = { }</text>
  <text x="500" y="77" font-size="12" fill="#4a7a3a" filter="url(#sk)">新值，加入</text>

  <path d="M 311 90 Q 300 102 287 112" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- row i=7 -->
  <text x="52" y="133" font-size="12.5" fill="#555" font-family="monospace" filter="url(#sk)">i=7</text>
  <g font-family="monospace" font-size="12" fill="#333" text-anchor="middle">
    <g filter="url(#sk)"><rect x="90" y="114" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="116" y="114" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="142" y="114" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="168" y="114" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="194" y="114" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="220" y="114" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="246" y="114" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="272" y="114" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
    <g filter="url(#sk)"><rect x="298" y="114" width="26" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/></g>
    <text x="103" y="133">1</text><text x="129" y="133">2</text><text x="155" y="133">3</text>
    <text x="181" y="133">4</text><text x="207" y="133">2</text><text x="233" y="133">3</text>
    <text x="259" y="133">3</text><text x="285" y="133" font-weight="bold">5</text><text x="311" y="133">7</text>
  </g>
  <text x="352" y="133" font-size="12" fill="#333" font-family="monospace" filter="url(#sk)">seen = {7}</text>
  <text x="500" y="133" font-size="12" fill="#4a7a3a" filter="url(#sk)">新值，加入</text>

  <path d="M 285 146 Q 274 158 261 168" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- row i=6 -->
  <text x="52" y="189" font-size="12.5" fill="#555" font-family="monospace" filter="url(#sk)">i=6</text>
  <g font-family="monospace" font-size="12" fill="#333" text-anchor="middle">
    <g filter="url(#sk)"><rect x="90" y="170" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="116" y="170" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="142" y="170" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="168" y="170" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="194" y="170" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="220" y="170" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="246" y="170" width="26" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
    <g filter="url(#sk)"><rect x="272" y="170" width="26" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="298" y="170" width="26" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/></g>
    <text x="103" y="189">1</text><text x="129" y="189">2</text><text x="155" y="189">3</text>
    <text x="181" y="189">4</text><text x="207" y="189">2</text><text x="233" y="189">3</text>
    <text x="259" y="189" font-weight="bold">3</text><text x="285" y="189">5</text><text x="311" y="189">7</text>
  </g>
  <text x="352" y="189" font-size="12" fill="#333" font-family="monospace" filter="url(#sk)">seen = {5,7}</text>
  <text x="500" y="189" font-size="12" fill="#4a7a3a" filter="url(#sk)">新值，加入</text>

  <path d="M 259 202 Q 248 214 235 224" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- row i=5 : conflict -->
  <text x="52" y="245" font-size="12.5" fill="#555" font-family="monospace" filter="url(#sk)">i=5</text>
  <g font-family="monospace" font-size="12" fill="#333" text-anchor="middle">
    <g filter="url(#sk)"><rect x="90" y="226" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="116" y="226" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="142" y="226" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="168" y="226" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="194" y="226" width="26" height="30" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="220" y="226" width="26" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
    <g filter="url(#sk)"><rect x="246" y="226" width="26" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="272" y="226" width="26" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/></g>
    <g filter="url(#sk)"><rect x="298" y="226" width="26" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/></g>
    <text x="103" y="245">1</text><text x="129" y="245">2</text><text x="155" y="245">3</text>
    <text x="181" y="245">4</text><text x="207" y="245">2</text><text x="233" y="245" font-weight="bold" fill="#b85450">3</text>
    <text x="259" y="245">3</text><text x="285" y="245">5</text><text x="311" y="245">7</text>
  </g>
  <text x="352" y="245" font-size="12" fill="#333" font-family="monospace" filter="url(#sk)">seen = {3,5,7}</text>
  <text x="500" y="245" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">撞见重复！</text>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="150" y="290" width="340" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="315" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e22" font-family="monospace" filter="url(#sk)">答案 = 5 // 3 + 1 = 2</text>
  <text x="320" y="340" text-anchor="middle" font-size="12.5" fill="#2e5e22" filter="url(#sk)">两次操作删去前 6 个 → 剩 [3,5,7] 互不相同 ✓</text>

  <!-- footer -->
  <text x="320" y="390" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">值 2 在 i=1 的冲突、值 3 在 i=2 的冲突都被更晚的 i*=5 覆盖</text>
  <text x="320" y="415" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">扫到第一个重复即可停：它就是最大的冲突下标</text>
</svg>
