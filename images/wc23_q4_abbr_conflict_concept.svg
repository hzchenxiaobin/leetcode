<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 392"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="392" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">核心观察：缩写自带长度指纹，撞车只会发生在同长、同首段、同末字符的串之间</text>
  <text x="260" y="42" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">以 internal（L = 8）为例：前缀长度 p = 1，省略 8−1−1 = 6 个字符，取末字符 l → 缩写「i6l」</text>

  <!-- 原串字符行 -->
  <text x="8" y="62" font-size="9" fill="#888" filter="url(#rough2)">原串</text>
  <rect x="34" y="66" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="85" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">i</text>
  <rect x="68" y="66" width="32" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84" y="85" text-anchor="middle" font-size="12" fill="#b27a10" filter="url(#rough2)">n</text>
  <rect x="102" y="66" width="32" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="118" y="85" text-anchor="middle" font-size="12" fill="#b27a10" filter="url(#rough2)">t</text>
  <rect x="136" y="66" width="32" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="152" y="85" text-anchor="middle" font-size="12" fill="#b27a10" filter="url(#rough2)">e</text>
  <rect x="170" y="66" width="32" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="186" y="85" text-anchor="middle" font-size="12" fill="#b27a10" filter="url(#rough2)">r</text>
  <rect x="204" y="66" width="32" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="85" text-anchor="middle" font-size="12" fill="#b27a10" filter="url(#rough2)">n</text>
  <rect x="238" y="66" width="32" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="254" y="85" text-anchor="middle" font-size="12" fill="#b27a10" filter="url(#rough2)">a</text>
  <rect x="272" y="66" width="32" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="85" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">l</text>

  <!-- 下行箭头 -->
  <path d="M 50 96 L 50 118" stroke="#446688" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 170 96 L 170 118" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 288 96 L 288 118" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 缩写行 -->
  <text x="8" y="132" font-size="9" fill="#888" filter="url(#rough2)">缩写</text>
  <rect x="34" y="122" width="32" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="50" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">i</text>
  <rect x="68" y="122" width="204" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#b27a10" filter="url(#rough2)">6</text>
  <rect x="272" y="122" width="32" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="288" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">l</text>

  <text x="34" y="166" font-size="9" fill="#888" filter="url(#rough2)">首字符 · 省略计数（吃掉中间 6 个字符）· 末字符，长度从 8 压到 3</text>

  <!-- 右上公式框 -->
  <rect x="330" y="58" width="176" height="70" rx="8" fill="#f0f4ff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="418" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">cnt = L − p − 1</text>
  <text x="418" y="94" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">len = p + digits(cnt) + 1</text>
  <text x="418" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">例：p=1, cnt=6 ⇒ len=3</text>

  <!-- ① 撞车三要素 -->
  <text x="20" y="196" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">① 撞车的三要素（缺一不可）</text>
  <rect x="20" y="204" width="150" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="223" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">同长度 L</text>
  <rect x="185" y="204" width="150" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">同前 p 个字符</text>
  <rect x="350" y="204" width="150" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="223" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">同末字符</text>
  <text x="260" y="250" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">缩写形如「字母段 + 数字段 + 字母段」，数字段唯一反解 cnt 与 L ⇒ 不同长度的缩写永不相同</text>

  <!-- ② 两条单调性 -->
  <text x="20" y="276" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 两条单调性（逐层加深才合法）</text>
  <rect x="20" y="284" width="480" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="30" y="301" font-size="9.5" fill="#2e6e2e" filter="url(#rough2)">唯一性单调：第 p 层已唯一 ⇒ 第 p+1 层必然唯一（前缀更长，能撞的伙伴只会更少）</text>
  <rect x="20" y="314" width="480" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="30" y="331" font-size="9.5" fill="#b27a10" filter="url(#rough2)">长度单调：len(p) 随 p 不减（p 加 1 最多省掉一位数字）⇒ 一旦不短，再加前缀也永远不短</text>

  <!-- 结论 -->
  <rect x="20" y="350" width="480" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="371" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">于是每个串的答案是「最浅的、独一无二的那一层」——可整体按层扫描，不必逐串试错</text>
</svg>
