<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：一场比赛 = 净淘汰 1 支队伍，总量守恒</text>
  <path d="M 130 44 Q 320 52 510 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: one match -->
  <g filter="url(#sk)">
    <rect x="40" y="68" width="210" height="140" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="145" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">一场比赛</text>
  <g filter="url(#sk)">
    <circle cx="85" cy="115" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="165" cy="115" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="85" y="119" text-anchor="middle" font-size="10" fill="#2b4a6e" filter="url(#sk)">A</text>
  <text x="165" y="119" text-anchor="middle" font-size="10" fill="#2b4a6e" filter="url(#sk)">B</text>
  <path d="M 85 132 Q 125 142 165 132" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 125 144 L 125 154" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="125" cy="172" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="125" y="176" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e24" filter="url(#sk)">W</text>
  <text x="145" y="224" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">队伍数 2 → 1，净减 1</text>

  <!-- middle: bye -->
  <g filter="url(#sk)">
    <rect x="270" y="68" width="140" height="140" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="340" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e24" filter="url(#sk)">一次轮空</text>
  <g filter="url(#sk)">
    <circle cx="340" cy="118" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="122" text-anchor="middle" font-size="10" fill="#8a6415" filter="url(#sk)">轮空</text>
  <path d="M 340 134 L 340 158" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="340" cy="178" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="182" text-anchor="middle" font-size="10" fill="#8a6415" filter="url(#sk)">晋级</text>
  <text x="340" y="224" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">0 场，队伍数不变</text>

  <!-- right: per-round effect -->
  <g filter="url(#sk)">
    <rect x="430" y="68" width="170" height="140" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="515" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">一轮的净效果</text>
  <text x="515" y="118" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">本轮 ⌊n/2⌋ 场</text>
  <text x="515" y="140" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">队伍数也 − ⌊n/2⌋</text>
  <text x="515" y="162" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">场次 = 淘汰数</text>
  <text x="515" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">每场恰淘汰 1 支</text>

  <!-- bottom: conservation strip -->
  <g filter="url(#sk)">
    <rect x="40" y="248" width="560" height="118" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
  </g>
  <text x="320" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">从 n 支队伍到唯一冠军：要淘汰 n − 1 支</text>
  <text x="80" y="288" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#sk)">n 支队伍</text>
  <g filter="url(#sk)">
    <circle cx="80" cy="316" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="80" y="321" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">n</text>
  <g filter="url(#sk)">
    <circle cx="560" cy="316" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="560" y="321" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">1</text>
  <text x="560" y="352" text-anchor="middle" font-size="10.5" fill="#2e5e24" filter="url(#sk)">冠军</text>
  <path d="M 110 316 L 532 316" stroke="#d6a040" stroke-width="3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="320" y="304" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">淘汰 n − 1 支</text>
  <text x="320" y="336" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#sk)">每场恰淘汰 1 支 ⇒ 恰需 n − 1 场</text>
  <text x="320" y="358" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">总场次 = n − 1（与奇偶、轮空无关）</text>
</svg>
