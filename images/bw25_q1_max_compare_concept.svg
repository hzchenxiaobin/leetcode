<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="38" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">
    只需与「全场最大值」比一次
  </text>

  <!-- 左侧：candies 数组格子 -->
  <text x="70" y="86" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">candies</text>
  <g filter="url(#rough2)">
    <rect x="22" y="96" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="60" y="96" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="98" y="96" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="136" y="96" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="174" y="96" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)">
    <text x="41" y="118" text-anchor="middle" font-size="15" fill="#446688">2</text>
    <text x="79" y="118" text-anchor="middle" font-size="15" fill="#446688">3</text>
    <text x="117" y="118" text-anchor="middle" font-size="15" fill="#446688">5</text>
    <text x="155" y="118" text-anchor="middle" font-size="15" fill="#446688">1</text>
    <text x="193" y="118" text-anchor="middle" font-size="15" fill="#446688">3</text>
  </g>

  <!-- 左下：extraCandies -->
  <rect x="60" y="170" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <text x="120" y="196" text-anchor="middle" font-size="15" fill="#8a6a1a" filter="url(#rough2)">
    extraCandies = 3
  </text>

  <!-- 中间箭头：一趟扫描 -->
  <path d="M 200 113 C 245 113, 265 113, 305 113" stroke="#446688" stroke-width="2"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="253" y="96" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">O(n) 一趟</text>

  <!-- 右侧：mx 大框 -->
  <rect x="312" y="78" width="150" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="12"
        filter="url(#rough2)"/>
  <text x="387" y="108" text-anchor="middle" font-size="17" fill="#b85450" filter="url(#rough2)">mx = 5</text>
  <text x="387" y="132" text-anchor="middle" font-size="12" fill="#8a5a55" filter="url(#rough2)">全场最多糖果数</text>

  <!-- 下方：判断式 -->
  <rect x="120" y="238" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">
    candies[i] + extraCandies ≥ mx ？
  </text>
  <path d="M 387 150 C 387 180, 340 200, 330 232" stroke="#b85450" stroke-width="2"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 120 190 C 120 210, 150 215, 160 234" stroke="#d6a040" stroke-width="2"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部结论 -->
  <rect x="80" y="306" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <text x="260" y="331" text-anchor="middle" font-size="14" fill="#2f5a24" filter="url(#rough2)">
    「不小于所有孩子」⇔「不小于最大者」，一次比较即可
  </text>
</svg>
