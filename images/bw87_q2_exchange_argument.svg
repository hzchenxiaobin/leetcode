<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">交换论证：把任意最优解改造成「小配小」</text>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="280" y="58">设 P 是当前最弱的未匹配运动员，T 是能带他的最弱训练师（贪心的选择）。</text>
    <text x="280" y="78">任取一个最优解 OPT，按「T 在 OPT 中的处境」分两种情况：</text>
  </g>

  <!-- 情况①：T 空闲 -->
  <g filter="url(#rough2)">
    <rect x="52" y="96" width="222" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
  </g>
  <text x="163" y="120" text-anchor="middle" font-size="13" fill="#1d3a17" font-weight="bold" filter="url(#rough2)">情况 ①：T 在 OPT 里空闲</text>
  <g filter="url(#rough2)">
    <rect x="76" y="136" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="190" y="136" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="105" y="158">P</text><text x="219" y="158">P′</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="76" y="196" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="190" y="196" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="105" y="218">T</text><text x="219" y="218">T″</text>
  </g>
  <path d="M 105 174 L 105 192" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 219 174 L 219 192" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="163" y="234" text-anchor="middle" font-size="11.5" fill="#1d3a17" filter="url(#rough2)">加上 P–T，匹配数 +1，与 OPT 最优矛盾</text>

  <!-- 情况②：T 被 P′ 占用 -->
  <g filter="url(#rough2)">
    <rect x="288" y="96" width="222" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="399" y="120" text-anchor="middle" font-size="13" fill="#7a5518" font-weight="bold" filter="url(#rough2)">情况 ②：OPT 让别的 P′ 占了 T</text>
  <g filter="url(#rough2)">
    <rect x="312" y="136" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="426" y="136" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="341" y="158">P</text><text x="455" y="158">P′</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="312" y="196" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="426" y="196" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="341" y="218">T</text><text x="455" y="218">T′</text>
  </g>
  <path d="M 341 174 C 341 186, 455 184, 455 192" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 455 174 L 455 192" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 341 174 L 341 192" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="399" y="234" text-anchor="middle" font-size="11.5" fill="#7a5518" filter="url(#rough2)">交换成 P–T 与 P′–T′，两边都可行，数量不变</text>

  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="270">可行性链：P ≤ T（贪心的定义）；P′ ≤ T（原配对）；T ≤ T′（T 是更弱的一方，</text>
    <text x="280" y="290">最优解里 P 只可能配上 ≥ T 的训练师 T′）⇒ 交换后 P′ ≤ T′ 依然成立</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="110" y="310" width="340" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#7a2f2b" text-anchor="middle">
    <text x="280" y="334">结论：存在一个最优解与贪心的第一个选择一致；</text>
    <text x="280" y="356">把这对拿掉、对剩下的子问题归纳 ⇒ 贪心 = 最优 ∎</text>
  </g>
</svg>
