<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：s = abcde，goal = cdeab</text>

  <rect x="60" y="58" width="600" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="80" text-anchor="middle" font-size="12" fill="#2b4a6f" filter="url(#rough2)">左移 k</text>
  <text x="290" y="80" text-anchor="middle" font-size="12" fill="#2b4a6f" filter="url(#rough2)">旋转结果 s[k:] + s[:k]</text>
  <text x="480" y="80" text-anchor="middle" font-size="12" fill="#2b4a6f" filter="url(#rough2)">与 goal 比较</text>
  <text x="590" y="80" text-anchor="middle" font-size="12" fill="#2b4a6f" filter="url(#rough2)">结论</text>

  <rect x="60" y="92" width="600" height="38" fill="#f7f7f7" stroke="#9aa5b1" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="117" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">k = 0</text>
  <text x="290" y="117" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">abcde</text>
  <text x="480" y="117" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">第 1 位就不同</text>
  <text x="590" y="117" text-anchor="middle" font-size="12.5" fill="#8f3b38" filter="url(#rough2)">✗ 不等</text>

  <rect x="60" y="130" width="600" height="38" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="155" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">k = 1</text>
  <text x="290" y="155" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">bcdea</text>
  <text x="480" y="155" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">第 1 位就不同</text>
  <text x="590" y="155" text-anchor="middle" font-size="12.5" fill="#8f3b38" filter="url(#rough2)">✗ 不等</text>

  <rect x="60" y="168" width="600" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="193" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">k = 2</text>
  <text x="290" y="193" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">cdeab</text>
  <text x="480" y="193" text-anchor="middle" font-size="12.5" fill="#33604a" filter="url(#rough2)">5 位全部相同</text>
  <text x="590" y="193" text-anchor="middle" font-size="12.5" fill="#33604a" filter="url(#rough2)">✓ 命中，返回 true</text>

  <rect x="60" y="206" width="600" height="38" fill="#f7f7f7" stroke="#9aa5b1" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="231" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">k = 3</text>
  <text x="290" y="231" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">deabc</text>
  <text x="480" y="231" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">不必再比</text>
  <text x="590" y="231" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">— 已提前返回</text>

  <rect x="60" y="244" width="600" height="38" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="269" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">k = 4</text>
  <text x="290" y="269" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">eabcd</text>
  <text x="480" y="269" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">不必再比</text>
  <text x="590" y="269" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">— 已提前返回</text>

  <text x="360" y="304" text-anchor="middle" font-size="12" fill="#2b4a6f" filter="url(#rough2)">同一件事在双写串上：t = abcdeabcde，goal 首次出现在下标 2，即 k = 2</text>

  <rect x="52" y="322" width="616" height="100" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="66" y="346" font-size="12.5" fill="#8f3b38" filter="url(#rough2)">反例：goal = abced（示例 2）</text>
  <text x="66" y="371" font-size="12" fill="#555" filter="url(#rough2)">五个旋转 abcde、bcdea、cdeab、deabc、eabcd 都不是 abced；</text>
  <text x="66" y="394" font-size="12" fill="#555" filter="url(#rough2)">字符多重集相同（a~e 各 1 个）只是必要条件，t 中根本不含子串 abced。</text>
  <text x="66" y="414" font-size="12" fill="#8f3b38" filter="url(#rough2)">所以「长度相同 + 字母计数相同」还不够，必须真的做一次子串匹配。</text>
</svg>
