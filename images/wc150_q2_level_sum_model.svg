<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按深度分组求和：一趟遍历拿下所有层</text>
  <text x="280" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">节点值可为负 ⇒ 层和没有单调性，必须每层实算</text>

  <!-- 层号标签 -->
  <text x="28" y="96" font-size="11" fill="#777" filter="url(#rough2)">第 1 层</text>
  <text x="28" y="172" font-size="11" fill="#777" filter="url(#rough2)">第 2 层</text>
  <text x="28" y="248" font-size="11" fill="#777" filter="url(#rough2)">第 3 层</text>

  <!-- 边 -->
  <path d="M 200 110 L 152 150" stroke="#8a9bb5" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 200 110 L 288 150" stroke="#8a9bb5" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 150 186 L 112 228" stroke="#8a9bb5" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 150 186 L 198 228" stroke="#8a9bb5" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 290 186 L 262 230" stroke="#c9c9c9" stroke-width="1.3" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <path d="M 290 186 L 330 230" stroke="#c9c9c9" stroke-width="1.3" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="200" cy="92" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="97" text-anchor="middle" font-size="13" fill="#2f4360" filter="url(#rough2)">1</text>

  <circle cx="150" cy="168" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="173" text-anchor="middle" font-size="13" fill="#2f4360" filter="url(#rough2)">7</text>

  <circle cx="290" cy="168" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="173" text-anchor="middle" font-size="13" fill="#2f4360" filter="url(#rough2)">0</text>

  <circle cx="110" cy="244" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="249" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">7</text>

  <circle cx="200" cy="244" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="249" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">−8</text>

  <circle cx="262" cy="244" r="10" fill="none" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="262" y="248" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">∅</text>
  <circle cx="330" cy="244" r="10" fill="none" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="248" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">∅</text>

  <!-- 右侧层和面板 -->
  <rect x="352" y="72" width="196" height="128" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="364" y="92" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">各层元素之和</text>
  <text x="364" y="116" font-size="11" fill="#555" filter="url(#rough2)">第 1 层：1</text>
  <rect x="358" y="126" width="184" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="364" y="142" font-size="11" fill="#3a5a30" filter="url(#rough2)">第 2 层：7 + 0 = 7</text>
  <text x="364" y="168" font-size="11" fill="#555" filter="url(#rough2)">第 3 层：7 + (−8) = −1</text>
  <text x="364" y="190" font-size="10" fill="#999" filter="url(#rough2)">虚线 ∅ = 空孩子，不参与求和</text>

  <text x="352" y="226" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">最大层和 = 7 ⇒ 返回第 2 层</text>
  <text x="352" y="246" font-size="10" fill="#777" filter="url(#rough2)">−1 在第 3 层说明「层和」会变小</text>
  <text x="352" y="262" font-size="10" fill="#777" filter="url(#rough2)">⇒ 只能逐层实算，不能提前剪枝</text>

  <!-- 底部要点 -->
  <rect x="60" y="284" width="488" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="304" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么「按层」这么自然</text>
  <text x="76" y="322" font-size="10" fill="#555" filter="url(#rough2)">① 每个节点恰属于一层，层号 = 根到它的边数 + 1</text>
  <text x="76" y="338" font-size="10" fill="#555" filter="url(#rough2)">② 一趟遍历把所有节点值累加到「所属层」的桶里即可</text>
  <text x="76" y="354" font-size="10" fill="#555" filter="url(#rough2)">③ 层号升序扫描 + 严格大于才更新 ⇒ 并列时保留最小层号</text>
  <text x="76" y="370" font-size="10" fill="#555" filter="url(#rough2)">④ BFS 的队列直接给出「逐层分组」，无需额外桶数组</text>
</svg>
