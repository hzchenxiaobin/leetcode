<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [3, 6, 2, 7, 1]，k = 6</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header -->
  <text x="66" y="68" text-anchor="middle" font-size="11" fill="#888">起点 i</text>
  <text x="178" y="68" text-anchor="middle" font-size="11" fill="#888">扩展路径 j</text>
  <text x="332" y="68" text-anchor="middle" font-size="11" fill="#888">前缀 lcm 序列（l 初值 1）</text>
  <text x="490" y="68" text-anchor="middle" font-size="11" fill="#888">命中子数组</text>
  <text x="596" y="68" text-anchor="middle" font-size="11" fill="#888">计数</text>

  <!-- row i=0 -->
  <g filter="url(#sk)"><rect x="36" y="78" width="60" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="66" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a94" font-family="monospace">i=0</text>
  <g filter="url(#sk)"><rect x="106" y="78" width="146" height="46" rx="8" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="179" y="106" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">0→1→2（7 截停）</text>
  <g filter="url(#sk)"><rect x="262" y="78" width="140" height="46" rx="8" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="332" y="106" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">1 → 3 → 6 → 6</text>
  <g filter="url(#sk)"><rect x="414" y="78" width="152" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="490" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" font-family="monospace">[3,6] [3,6,2]</text>
  <text x="596" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">2</text>

  <!-- row i=1 -->
  <g filter="url(#sk)"><rect x="36" y="132" width="60" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="66" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a94" font-family="monospace">i=1</text>
  <g filter="url(#sk)"><rect x="106" y="132" width="146" height="46" rx="8" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="179" y="160" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">1→2（7 截停）</text>
  <g filter="url(#sk)"><rect x="262" y="132" width="140" height="46" rx="8" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="332" y="160" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">1 → 6 → 6</text>
  <g filter="url(#sk)"><rect x="414" y="132" width="152" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="490" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" font-family="monospace">[6] [6,2]</text>
  <text x="596" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" font-family="monospace">2</text>

  <!-- row i=2 -->
  <g filter="url(#sk)"><rect x="36" y="186" width="60" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="66" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a94" font-family="monospace">i=2</text>
  <g filter="url(#sk)"><rect x="106" y="186" width="146" height="46" rx="8" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="179" y="214" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">2（7 截停）</text>
  <g filter="url(#sk)"><rect x="262" y="186" width="140" height="46" rx="8" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="332" y="214" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">1 → 2</text>
  <g filter="url(#sk)"><rect x="414" y="186" width="152" height="46" rx="8" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="490" y="214" text-anchor="middle" font-size="11" fill="#999">—（l=2 &lt; 6）</text>
  <text x="596" y="214" text-anchor="middle" font-size="13" fill="#999" font-family="monospace">0</text>

  <!-- row i=3 -->
  <g filter="url(#sk)"><rect x="36" y="240" width="60" height="46" rx="8" fill="#f5e0e0" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="66" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" font-family="monospace">i=3</text>
  <g filter="url(#sk)"><rect x="106" y="240" width="146" height="46" rx="8" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="179" y="262" text-anchor="middle" font-size="10" fill="#444" font-family="monospace">3（首步即截停）</text>
  <text x="179" y="277" text-anchor="middle" font-size="10" fill="#b03a3a">7 不是 6 的因子</text>
  <g filter="url(#sk)"><rect x="262" y="240" width="140" height="46" rx="8" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="332" y="268" text-anchor="middle" font-size="11" fill="#999">—</text>
  <g filter="url(#sk)"><rect x="414" y="240" width="152" height="46" rx="8" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="490" y="268" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="596" y="268" text-anchor="middle" font-size="13" fill="#999" font-family="monospace">0</text>

  <!-- row i=4 -->
  <g filter="url(#sk)"><rect x="36" y="294" width="60" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="66" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a94" font-family="monospace">i=4</text>
  <g filter="url(#sk)"><rect x="106" y="294" width="146" height="46" rx="8" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="179" y="322" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">4 → 末尾</text>
  <g filter="url(#sk)"><rect x="262" y="294" width="140" height="46" rx="8" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="332" y="322" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">1 → 1</text>
  <g filter="url(#sk)"><rect x="414" y="294" width="152" height="46" rx="8" fill="#fdfcf7" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="490" y="322" text-anchor="middle" font-size="11" fill="#999">—（l=1 &lt; 6）</text>
  <text x="596" y="322" text-anchor="middle" font-size="13" fill="#999" font-family="monospace">0</text>

  <!-- total -->
  <g filter="url(#sk)"><rect x="60" y="356" width="520" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="320" y="376" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">合计 ans = 4：[3,6]、[3,6,2]、[6]、[6,2]</text>
  <text x="320" y="393" text-anchor="middle" font-size="10" fill="#5a8a5a">与官方示例输出一致</text>

  <!-- notes -->
  <text x="70" y="424" font-size="11" fill="#555">① 命中勿停：i=0 处 l=6 后加入因子 2，lcm(6,2)=6，[3,6,2] 同样合法</text>
  <text x="70" y="444" font-size="11" fill="#555">② 元素 7 像一堵「墙」：起点 0/1/2 的内层扫描全部被它截停 —— 这就是早退剪枝</text>
</svg>
