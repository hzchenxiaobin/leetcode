<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="720" height="372" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">扫描 i：组 1 贡献常数项，组 2 贡献线性项</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">每个 l 只走一遍：加入组 1 → 移入组 2 → 删除</text>

  <rect x="24" y="72" width="290" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="169" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">组 1：A[l] &gt; i，还没开始坏</text>
  <text x="169" y="128" text-anchor="middle" font-size="12" fill="#33517a" filter="url(#rough2)">贡献 Σ (B[l] − A[l] + 1)，与 i 无关</text>
  <text x="169" y="156" text-anchor="middle" font-size="11.5" fill="#4a6a95" filter="url(#rough2)">i = l 时加入；i = A[l] 时移出</text>

  <rect x="406" y="72" width="290" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="551" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a0761e" filter="url(#rough2)">组 2：A[l] ≤ i ≤ B[l]，正在坏</text>
  <text x="551" y="128" text-anchor="middle" font-size="12" fill="#a0761e" filter="url(#rough2)">贡献 Σ (B[l] + 1 − i) = sumB − i·cnt2</text>
  <text x="551" y="156" text-anchor="middle" font-size="11.5" fill="#b08a3a" filter="url(#rough2)">i = B[l] + 1 时删除</text>

  <path d="M 318 128 L 400 128" fill="none" stroke="#5a5a5a" stroke-width="1.7" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="359" y="120" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">A[l] = i</text>

  <rect x="60" y="204" width="600" height="62" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="230" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#333" filter="url(#rough2)">坏(i) = total1 ＋ sumB2 ＋ cnt2 · (1 − i)</text>
  <text x="360" y="254" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">total1 = Σ 组 1 的 (B[l] − A[l] + 1)；sumB2、cnt2 是组 2 的 Σ B[l] 与元素个数</text>

  <rect x="150" y="286" width="420" height="46" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="360" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#8d3a35" filter="url(#rough2)">答案(i) = i · (n − i + 1) − 坏(i)</text>

  <text x="360" y="356" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">全部操作是 O(1) 均摊，单组数据线性时间</text>
</svg>
