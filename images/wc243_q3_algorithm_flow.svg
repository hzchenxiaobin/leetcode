<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 580"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="580" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：逐任务处理，时间只在事件处推进</text>

  <!-- 开始 -->
  <rect x="210" y="44" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="330" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化：free ← 全部 (权重, i)，busy ← ∅</text>
  <path d="M 330 78 L 330 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 对 j 循环 -->
  <rect x="210" y="100" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="330" y="117" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">对 j = 0 … m−1 循环</text>
  <text x="330" y="131" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">now ← max(now, j)（单调不减，勿写 now = j）</text>
  <path d="M 330 136 L 330 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：释放 -->
  <polygon points="320,152 430,190 320,228 210,190" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">busy 非空 且</text>
  <text x="320" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">堆顶完成 ≤ now ？</text>

  <path d="M 430 190 L 470 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="182" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="472" y="168" width="148" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="546" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">释放：pop busy</text>
  <text x="546" y="202" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">→ push free（while）</text>
  <!-- 回环到菱形1 -->
  <path d="M 546 168 L 546 152 Q 546 140 534 140 L 284 140 Q 272 140 272 152 L 272 165"
        stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 320 228 L 320 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="248" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 菱形2：free 空？ -->
  <polygon points="320,262 420,300 320,338 220,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="305" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">free 空 ？</text>

  <path d="M 420 300 L 472 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="292" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">是</text>
  <rect x="474" y="276" width="148" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="548" y="294" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">快进：now ← busy 顶</text>
  <text x="548" y="310" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">完成时刻（全忙必非空）</text>
  <!-- 从快进框回到释放框 -->
  <path d="M 548 276 L 548 216" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="556" y="250" font-size="9.5" fill="#b85450" filter="url(#rough2)">再释放一轮</text>

  <path d="M 320 338 L 320 362" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="354" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否（free 非空）</text>

  <!-- 分配 -->
  <rect x="200" y="364" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="381" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pop free 堆顶 (w, i)</text>
  <text x="320" y="396" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans[j] ← i</text>
  <path d="M 320 404 L 320 424" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="426" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="443" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">push busy：</text>
  <text x="320" y="458" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(now + tasks[j], w, i)</text>

  <!-- 循环回左侧 -->
  <path d="M 200 446 L 100 446 L 100 118 L 208 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="290" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">j+1</text>

  <!-- 结束 -->
  <path d="M 320 466 L 320 486" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="488" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="510" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">循环结束 → 返回 ans</text>

  <!-- 底部说明 -->
  <rect x="40" y="534" width="580" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="330" y="556" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">释放必须用 while（同刻可能多台完成）；free 空时 busy 必非空（|free|+|busy| = n ≥ 1）</text>
</svg>
