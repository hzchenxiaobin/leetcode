<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="620" height="490" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">一遍扫描流程：first 记首次，重遇到即更新 ans</text>
  <path d="M 130 34 Q 310 42 490 34" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- start -->
  <g filter="url(#r)">
    <rect x="160" y="52" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="250" y="77" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">first[26] ← −1，ans ← −1</text>
  <path d="M 250 92 L 250 100" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#r)"/>

  <!-- diamond 1: loop condition -->
  <g filter="url(#r)">
    <polygon points="250,106 354,140 250,174 146,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="250" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a1a" filter="url(#r)">还有字符 s[i] ？</text>
  <text x="250" y="153" text-anchor="middle" font-size="10" fill="#8a6a1a" filter="url(#r)">（i &lt; n）</text>

  <!-- exit: no more chars -->
  <path d="M 354 140 L 442 140" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#r)"/>
  <text x="396" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">否</text>
  <g filter="url(#r)">
    <rect x="446" y="112" width="160" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="526" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">返回 ans</text>
  <text x="526" y="155" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#r)">（无重复字符则保持 −1）</text>

  <!-- yes: go to body -->
  <path d="M 250 174 L 250 188" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#r)"/>
  <text x="262" y="186" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#r)">是</text>

  <!-- diamond 2: first occurrence? -->
  <g filter="url(#r)">
    <polygon points="250,192 372,230 250,268 128,230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="250" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a1a" filter="url(#r)">first[c] == −1 ？</text>
  <text x="250" y="246" text-anchor="middle" font-size="10" fill="#8a6a1a" filter="url(#r)">（c = s[i]）</text>

  <!-- yes: record first -->
  <path d="M 372 230 L 418 230" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#r)"/>
  <text x="393" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#r)">是</text>
  <g filter="url(#r)">
    <rect x="422" y="202" width="180" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="512" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#r)">first[c] ← i</text>
  <text x="512" y="246" text-anchor="middle" font-size="10" fill="#446688" filter="url(#r)">（记住首次下标，ans 不动）</text>

  <!-- no: update ans -->
  <path d="M 250 268 L 250 288" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" fill="none" filter="url(#r)"/>
  <text x="262" y="284" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#r)">否</text>
  <g filter="url(#r)">
    <rect x="150" y="292" width="200" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="250" y="316" text-anchor="middle" font-size="12.5" font-family="monospace" font-weight="bold" fill="#2e6e2e" filter="url(#r)">ans = max(ans,</text>
  <text x="250" y="336" text-anchor="middle" font-size="12.5" font-family="monospace" font-weight="bold" fill="#2e6e2e" filter="url(#r)">i − first[c] − 1)</text>

  <!-- loop back -->
  <path d="M 512 258 L 512 368" stroke="#8a8a8a" stroke-width="1.6" fill="none" filter="url(#r)"/>
  <path d="M 250 348 L 250 368" stroke="#8a8a8a" stroke-width="1.6" fill="none" filter="url(#r)"/>
  <path d="M 512 368 L 66 368 L 66 140 L 142 140" stroke="#8a8a8a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="289" y="390" text-anchor="middle" font-size="11" fill="#666" filter="url(#r)">i++，继续扫描</text>

  <!-- bottom note -->
  <g filter="url(#r)">
    <rect x="40" y="412" width="566" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="434" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#r)">两个易错点</text>
  <text x="60" y="452" font-size="11" fill="#444" filter="url(#r)">① 更新公式是 i − first[c] − 1，两端字符不计入（漏掉 −1 会把 "cabbac" 算成 5）</text>
  <text x="60" y="468" font-size="11" fill="#444" filter="url(#r)">② ans 初值必须 −1："aa" 的答案是 0，不能拿 0 当“无解”标记</text>
</svg>
