<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：n → m = n/2 → 扫描斐波那契序列</text>

  <!-- 列头 -->
  <text x="75" y="56" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">n 与 m</text>
  <text x="336" y="56" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">斐波那契序列 F(0), F(1), F(2), …</text>
  <text x="584" y="56" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">结论</text>

  <!-- 行 1：n = 16 -->
  <text x="75" y="84" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n = 16</text>
  <text x="75" y="104" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">m = 8</text>
  <path d="M108,96 L132,96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="70" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="91" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="184" y="70" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="204" y="91" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="228" y="70" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="91" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="272" y="70" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="91" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="316" y="70" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="91" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="360" y="70" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="91" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="404" y="70" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="424" y="91" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8 ✓</text>
  <rect x="448" y="70" width="40" height="34" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="468" y="91" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">13</text>
  <rect x="492" y="70" width="40" height="34" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="512" y="91" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">21</text>
  <rect x="544" y="70" width="80" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="584" y="91" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>
  <text x="140" y="122" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">扫过 0,1,1,2,3,5 后 a = 8 = m 命中 → 三元组 3 + 5 + 8</text>

  <!-- 行 2：n = 8 -->
  <text x="75" y="168" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n = 8</text>
  <text x="75" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">m = 4</text>
  <path d="M108,180 L132,180" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="154" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="175" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="184" y="154" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="204" y="175" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="228" y="154" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="175" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="272" y="154" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="175" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="316" y="154" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="175" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="360" y="154" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="380" y="175" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">5 ✗</text>
  <rect x="404" y="154" width="40" height="34" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="424" y="175" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">8</text>
  <rect x="448" y="154" width="40" height="34" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="468" y="175" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">13</text>
  <rect x="492" y="154" width="40" height="34" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="512" y="175" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">21</text>
  <rect x="544" y="154" width="80" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="584" y="175" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>
  <text x="140" y="206" font-size="10.5" fill="#b85450" filter="url(#rough2)">a 滚到 5 已越过 4，4 不是斐波那契数（1+2+5=8 下标不连续，不算）</text>

  <!-- 行 3：n = 2 -->
  <text x="75" y="252" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n = 2</text>
  <text x="75" y="272" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">m = 1</text>
  <path d="M108,264 L132,264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="238" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="259" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="184" y="238" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="204" y="259" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 ✓</text>
  <rect x="228" y="238" width="40" height="34" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="248" y="259" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">1</text>
  <rect x="272" y="238" width="40" height="34" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="292" y="259" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">2</text>
  <rect x="316" y="238" width="40" height="34" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="336" y="259" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">3</text>
  <rect x="360" y="238" width="40" height="34" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380" y="259" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">5</text>
  <rect x="404" y="238" width="40" height="34" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="424" y="259" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">8</text>
  <rect x="448" y="238" width="40" height="34" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="468" y="259" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">13</text>
  <rect x="492" y="238" width="40" height="34" rx="4" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="512" y="259" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">21</text>
  <rect x="544" y="238" width="80" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="584" y="259" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>
  <text x="140" y="290" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">第二项即命中 1 → 三元组 0 + 1 + 1（数列里有两个 1，不能去重）</text>

  <!-- 行 4：n = 1 -->
  <text x="75" y="336" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n = 1</text>
  <text x="75" y="356" text-anchor="middle" font-size="13" fill="#999" font-weight="bold" filter="url(#rough2)">奇数</text>
  <rect x="140" y="322" width="392" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="336" y="343" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">n 为奇数：三项和 2·F(i+2) 恒为偶数 → 直接 false，无需扫描</text>
  <rect x="544" y="322" width="80" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="584" y="343" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- 图例 -->
  <rect x="140" y="374" width="12" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="158" y="384" font-size="11" fill="#666" filter="url(#rough2)">已扫过</text>
  <rect x="230" y="374" width="12" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="248" y="384" font-size="11" fill="#666" filter="url(#rough2)">命中 m</text>
  <rect x="320" y="374" width="12" height="12" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="338" y="384" font-size="11" fill="#666" filter="url(#rough2)">越过 m</text>
  <rect x="410" y="374" width="12" height="12" rx="3" fill="#eeeeee" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="428" y="384" font-size="11" fill="#666" filter="url(#rough2)">未扫到</text>
</svg>
