<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">模意义下的前缀和：找 S_i ≡ S_j − r (mod p)</text>
  <text x="280" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">以 nums=[6,3,5,2]，p=9 为例：total=16，r = 16 mod 9 = 7</text>

  <!-- 前缀余数序列 -->
  <text x="70" y="90" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">前缀和余数（下标 0..4）</text>
  <line x1="70" y1="150" x2="500" y2="150" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="100" y="168">i=0</text>
    <text x="190" y="168">i=1</text>
    <text x="280" y="168">i=2</text>
    <text x="370" y="168">i=3</text>
    <text x="460" y="168">i=4</text>
  </g>
  <!-- S0=0 -->
  <g filter="url(#rough2)">
    <circle cx="100" cy="150" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="190" cy="150" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="280" cy="150" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <circle cx="370" cy="150" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="460" cy="150" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#333" text-anchor="middle">
    <text x="100" y="155">0</text>
    <text x="190" y="155">6</text>
    <text x="280" y="155" fill="#b8860b" font-weight="bold">0</text>
    <text x="370" y="155">5</text>
    <text x="460" y="155" fill="#b85450" font-weight="bold">7</text>
  </g>
  <text x="100" y="122" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">S₀</text>
  <text x="190" y="122" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">S₁</text>
  <text x="280" y="122" font-size="11" fill="#b8860b" text-anchor="middle" filter="url(#rough2)">S₂</text>
  <text x="370" y="122" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">S₃</text>
  <text x="460" y="122" font-size="11" fill="#b85450" text-anchor="middle" filter="url(#rough2)">S₄=Sₙ</text>

  <!-- want 计算 -->
  <g filter="url(#rough2)">
    <rect x="330" y="196" width="200" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="430" y="220">j = 4：cur = S₄ mod 9 = 7</text>
    <text x="430" y="240">want = (7 − 7) mod 9 = 0</text>
    <text x="430" y="258">找最近的 S_i ≡ 0</text>
  </g>

  <!-- 匹配箭头 -->
  <path d="M 340 205 C 250 220, 150 190, 116 168" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 336 224 C 300 236, 288 200, 282 172" fill="none" stroke="#4a7a3a" stroke-width="2.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="185" y="208" font-size="11.5" fill="#888" filter="url(#rough2)">i=0：长度 4−0=4（整段，禁）</text>
  <text x="240" y="238" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=2：长度 4−2=2（最优）</text>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="60" y="272" width="250" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="185" y="296">移除子数组 (i, j] = nums[3..4]</text>
    <text x="185" y="315">= [5, 2]，剩余 [6,3] 和为 9</text>
    <text x="185" y="340" fill="#b8860b" font-weight="bold">ans = j − i = 2 ✓</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="330" y="272" width="200" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="430" y="296">哈希表 last 存</text>
    <text x="430" y="314">「余数 → 最近下标」</text>
    <text x="430" y="340" fill="#4a7a3a" font-weight="bold">同一个余数保留下标大的</text>
  </g>
</svg>
