<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 492" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="492" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：哈希分组 + 两次 O(1) 判定</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">总复杂度 O(n)：一次扫描建表，一次按值遍历</text>

  <rect x="120" y="56" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="230" y="76" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">扫描 i = 0 … n-1</text>
  <text x="230" y="94" text-anchor="middle" font-size="10.5" fill="#555">pos[nums[i]].append(i)</text>

  <path d="M 230 102 L 230 122" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="126" width="220" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="230" y="146" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">对每个不同的值 x</text>
  <text x="230" y="164" text-anchor="middle" font-size="10.5" fill="#555">取出其下标列表 pos[x]（天然递增）</text>

  <path d="M 230 172 L 230 196" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="230,200 320,244 230,288 140,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="230" y="240" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">len(pos[x]) == 3 ？</text>
  <text x="230" y="258" text-anchor="middle" font-size="10" fill="#888">恰好出现三次</text>

  <path d="M 320 244 L 366 244" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="342" y="236" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="370" y="222" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="450" y="240" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">淘汰 x</text>
  <text x="450" y="257" text-anchor="middle" font-size="9.5" fill="#888">次数不到 3 或达到 4 及以上</text>

  <path d="M 230 288 L 230 312" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="244" y="304" font-size="10" fill="#4a7a3a">是</text>

  <polygon points="230,316 326,360 230,404 134,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="230" y="356" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">2·pos[x][1] ==</text>
  <text x="230" y="374" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">pos[x][0] + pos[x][2] ？</text>

  <path d="M 326 360 L 366 360" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="348" y="352" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="370" y="338" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="450" y="356" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">淘汰 x</text>
  <text x="450" y="373" text-anchor="middle" font-size="9.5" fill="#888">三个下标不是等差数列</text>

  <path d="M 230 404 L 230 424" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="244" y="418" font-size="10" fill="#4a7a3a">是</text>

  <rect x="120" y="428" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="446" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">ans += 1，x 是特别整数</text>
  <text x="230" y="464" text-anchor="middle" font-size="10.5" fill="#555">全部值检查完返回 ans</text>

  <text x="470" y="446" text-anchor="middle" font-size="10" fill="#999">判定顺序：先次数后间距</text>
</svg>
