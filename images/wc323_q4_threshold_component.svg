<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：q 的答案 =「值 &lt; q」区域中左上角的连通块大小</text>
  <text x="280" y="50" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">（示例 1 的矩阵，取 q = 5）</text>

  <path d="M24 56 L52 78" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="20" y="50" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">起点</text>

  <rect x="60" y="72" width="64" height="64" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="92" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1 ✓</text>
  <rect x="124" y="72" width="64" height="64" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="156" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2 ✓</text>
  <rect x="188" y="72" width="64" height="64" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3 ✓</text>

  <rect x="60" y="136" width="64" height="64" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="92" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2 ✓</text>
  <rect x="124" y="136" width="64" height="64" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="174" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">5 ✗</text>
  <rect x="188" y="136" width="64" height="64" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="174" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">7 ✗</text>

  <rect x="60" y="200" width="64" height="64" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="92" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3 ✓</text>
  <rect x="124" y="200" width="64" height="64" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="238" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">5 ✗</text>
  <rect x="188" y="200" width="64" height="64" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="220" y="238" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">1 ✗</text>

  <rect x="290" y="72" width="252" height="170" rx="10" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="416" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#rough2)">q = 5 时：</text>
  <text x="304" y="120" font-size="10.5" fill="#444" filter="url(#rough2)">绿色 ✓：可达并得分，共 5 格</text>
  <text x="304" y="142" font-size="10.5" fill="#444" filter="url(#rough2)">红色 ✗：值 5、5、7 ≥ q=5，挡住</text>
  <text x="304" y="157" font-size="10.5" fill="#444" filter="url(#rough2)">　　扩张（5 不「严格小于」5）</text>
  <text x="304" y="180" font-size="10.5" fill="#444" filter="url(#rough2)">(2,2)=1 虽 &lt; 5，但被 5、5、7 围</text>
  <text x="304" y="195" font-size="10.5" fill="#444" filter="url(#rough2)">　　死，与起点不连通 → 不得分</text>
  <text x="304" y="220" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">∴ answer = 5</text>

  <rect x="40" y="292" width="480" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">answer(q) = | CC((0,0), { 格子 c : grid[c] &lt; q }) |</text>

  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">CC = 从起点出发、只途经值 &lt; q 的格子所能到达的全体；grid[0][0] ≥ q 时 answer = 0</text>
</svg>
