<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="690" height="470" fill="#fafafa"/>

  <text x="345" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">演算：s = "3[a2[c]]" 的栈状态走查</text>
  <text x="345" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每一行是读完该字符后的状态；栈写作 (base, k) 列表，最右为栈顶</text>

  <rect x="28" y="76" width="636" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="52" y="97" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">#</text>
  <text x="108" y="97" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">读入</text>
  <text x="170" y="97" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">num</text>
  <text x="317" y="97" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">栈（底 → 顶）</text>
  <text x="512" y="97" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">cur</text>
  <text x="627" y="97" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">动作</text>

  <rect x="28" y="108" width="636" height="34" fill="#eef3fb" stroke="none" filter="url(#rough2)"/>
  <rect x="28" y="142" width="636" height="34" fill="#f7faf4" stroke="none" filter="url(#rough2)"/>
  <rect x="28" y="176" width="636" height="34" fill="#eef3fb" stroke="none" filter="url(#rough2)"/>
  <rect x="28" y="210" width="636" height="34" fill="#f7faf4" stroke="none" filter="url(#rough2)"/>
  <rect x="28" y="244" width="636" height="34" fill="#eef3fb" stroke="none" filter="url(#rough2)"/>
  <rect x="28" y="278" width="636" height="34" fill="#f7faf4" stroke="none" filter="url(#rough2)"/>
  <rect x="28" y="312" width="636" height="34" fill="#eef3fb" stroke="none" filter="url(#rough2)"/>
  <rect x="28" y="346" width="636" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <path d="M 76 76 L 76 380 M 140 76 L 140 380 M 200 76 L 200 380 M 434 76 L 434 380 M 590 76 L 590 380" stroke="#c8cede" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <rect x="28" y="76" width="636" height="304" fill="none" stroke="#8a94aa" stroke-width="1.4" rx="4" filter="url(#rough2)"/>

  <g font-size="10" fill="#333">
    <text filter="url(#rough2)" x="52" y="130" text-anchor="middle">1</text>
    <text filter="url(#rough2)" x="108" y="130" text-anchor="middle">3</text>
    <text filter="url(#rough2)" x="170" y="130" text-anchor="middle">3</text>
    <text filter="url(#rough2)" x="208" y="130">[]</text>
    <text filter="url(#rough2)" x="442" y="130">""</text>
    <text filter="url(#rough2)" x="627" y="130" text-anchor="middle" font-size="9.5">记下 k</text>

    <text filter="url(#rough2)" x="52" y="164" text-anchor="middle">2</text>
    <text filter="url(#rough2)" x="108" y="164" text-anchor="middle">[</text>
    <text filter="url(#rough2)" x="170" y="164" text-anchor="middle">0</text>
    <text filter="url(#rough2)" x="208" y="164">("",3)</text>
    <text filter="url(#rough2)" x="442" y="164">""</text>
    <text filter="url(#rough2)" x="627" y="164" text-anchor="middle" font-size="9.5">保存现场</text>

    <text filter="url(#rough2)" x="52" y="198" text-anchor="middle">3</text>
    <text filter="url(#rough2)" x="108" y="198" text-anchor="middle">a</text>
    <text filter="url(#rough2)" x="170" y="198" text-anchor="middle">0</text>
    <text filter="url(#rough2)" x="208" y="198">("",3)</text>
    <text filter="url(#rough2)" x="442" y="198">"a"</text>
    <text filter="url(#rough2)" x="627" y="198" text-anchor="middle" font-size="9.5">拼字母</text>

    <text filter="url(#rough2)" x="52" y="232" text-anchor="middle">4</text>
    <text filter="url(#rough2)" x="108" y="232" text-anchor="middle">2</text>
    <text filter="url(#rough2)" x="170" y="232" text-anchor="middle">2</text>
    <text filter="url(#rough2)" x="208" y="232">("",3)</text>
    <text filter="url(#rough2)" x="442" y="232">"a"</text>
    <text filter="url(#rough2)" x="627" y="232" text-anchor="middle" font-size="9.5">下一层 k</text>

    <text filter="url(#rough2)" x="52" y="266" text-anchor="middle">5</text>
    <text filter="url(#rough2)" x="108" y="266" text-anchor="middle">[</text>
    <text filter="url(#rough2)" x="170" y="266" text-anchor="middle">0</text>
    <text filter="url(#rough2)" x="208" y="266">("",3) ("a",2)</text>
    <text filter="url(#rough2)" x="442" y="266">""</text>
    <text filter="url(#rough2)" x="627" y="266" text-anchor="middle" font-size="9.5">保存现场</text>

    <text filter="url(#rough2)" x="52" y="300" text-anchor="middle">6</text>
    <text filter="url(#rough2)" x="108" y="300" text-anchor="middle">c</text>
    <text filter="url(#rough2)" x="170" y="300" text-anchor="middle">0</text>
    <text filter="url(#rough2)" x="208" y="300">("",3) ("a",2)</text>
    <text filter="url(#rough2)" x="442" y="300">"c"</text>
    <text filter="url(#rough2)" x="627" y="300" text-anchor="middle" font-size="9.5">拼字母</text>

    <text filter="url(#rough2)" x="52" y="334" text-anchor="middle">7</text>
    <text filter="url(#rough2)" x="108" y="334" text-anchor="middle">]</text>
    <text filter="url(#rough2)" x="170" y="334" text-anchor="middle">0</text>
    <text filter="url(#rough2)" x="208" y="334">("",3)</text>
    <text filter="url(#rough2)" x="442" y="334" fill="#8a3a36">"acc"</text>
    <text filter="url(#rough2)" x="627" y="334" text-anchor="middle" font-size="9.5" fill="#8a3a36">a+c×2</text>

    <text filter="url(#rough2)" x="52" y="368" text-anchor="middle" font-weight="bold">8</text>
    <text filter="url(#rough2)" x="108" y="368" text-anchor="middle" font-weight="bold">]</text>
    <text filter="url(#rough2)" x="170" y="368" text-anchor="middle" font-weight="bold">0</text>
    <text filter="url(#rough2)" x="208" y="368" font-weight="bold">[]</text>
    <text filter="url(#rough2)" x="442" y="368" font-weight="bold" fill="#8a6a20">"accaccacc"</text>
    <text filter="url(#rough2)" x="627" y="368" text-anchor="middle" font-size="9.5" fill="#8a6a20">×3 收尾</text>
  </g>

  <rect x="28" y="396" width="636" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="44" y="418" font-size="10" fill="#555" filter="url(#rough2)">第 7 行：栈顶 base = "a"、k = 2 → cur = "a" + "c"×2 = "acc"，内层结算完毕</text>
  <text x="44" y="438" font-size="10" fill="#555" filter="url(#rough2)">第 8 行：栈顶 base = ""、k = 3 → cur = "" + "acc"×3 = "accaccacc"，栈空即返回</text>
</svg>
