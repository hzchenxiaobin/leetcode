<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">答案 = 最小的缺失幂 2^i（不在数组中）</text>

  <!-- 幂链 -->
  <text x="280" y="64" font-size="13" fill="#446688" filter="url(#rough2)" text-anchor="middle">检查链：1, 2, 4, 8, 16, 32, …（nums = [1,2,4,8,3,7]）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="78" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="124" y="78" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="188" y="78" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="252" y="78" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="316" y="78" width="60" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="6"/>
    <rect x="380" y="78" width="60" height="46" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="90" y="107">1</text><text x="154" y="107">2</text><text x="218" y="107">4</text>
    <text x="282" y="107">8</text><text x="346" y="107">16</text><text x="410" y="107">32</text>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="90" y="138" fill="#4a7a3a">✓ 在</text><text x="154" y="138" fill="#4a7a3a">✓ 在</text>
    <text x="218" y="138" fill="#4a7a3a">✓ 在</text><text x="282" y="138" fill="#4a7a3a">✓ 在</text>
    <text x="346" y="138" fill="#b85450" font-weight="bold">✗ 缺 → 答案!</text><text x="410" y="138" fill="#999">不用看</text>
  </g>

  <!-- 覆盖示意：前缀幂可以拼出 1..15 -->
  <text x="280" y="176" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">为什么更小的数都可达：子集拼接</text>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <rect x="60" y="190" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="98" y="209" fill="#2d4a66">3 = 1 | 2</text>
    <rect x="144" y="190" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="187" y="209" fill="#2d4a66">5 = 1 | 4</text>
    <rect x="238" y="190" width="106" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="291" y="209" fill="#2d4a66">6 = 2 | 4</text>
    <rect x="352" y="190" width="118" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="411" y="209" fill="#2d4a66">15 = 1|2|4|8</text>
  </g>
  <text x="280" y="244" font-size="12" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">1 位幂全在场 ⇒ 每个非零数按二进制位选元素或出来即可</text>

  <!-- 陷阱提示 -->
  <rect x="60" y="262" width="440" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="283" text-anchor="middle" font-size="12.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">陷阱：「某位被覆盖」≠「纯该位可达」</text>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">如 nums=[3,2]：3 的第 0 位是 1，但 1 不可表达（或出 1 必带出 2），答案仍是 1</text>

  <!-- 底部结论 -->
  <rect x="60" y="326" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="345" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">2^i 可表达 ⇔ 2^i ∈ nums（或运算只置位不退位）</text>
  <text x="280" y="363" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">nums[i] &lt; 2^30 ⇒ i 只需查到 30，循环必停</text>
</svg>
