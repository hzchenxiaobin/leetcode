<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">倍增表 + 查询下降 —— up[t][k]：从 k 连跳 2^t 步到哪</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="11.5" fill="#555">沿用示例 2：vals = [1,3,5,9,10]，D = 2，far = r = [1,2,2,4,4]，LOG = 3</text>

  <g filter="url(#sk)"><rect x="42" y="92" width="292" height="196" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="188" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5b84">① 建表：up[0]=r，up[t][k]=up[t−1][up[t−1][k]]</text>

  <g filter="url(#sk)"><rect x="120" y="128" width="42" height="30" rx="5" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="141" y="148" text-anchor="middle" font-size="10" fill="#666">k</text>
  <g filter="url(#sk)"><rect x="162" y="128" width="42" height="30" rx="5" fill="#fdfcf7" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="183" y="148" text-anchor="middle" font-size="10.5" fill="#444">0</text>
  <g filter="url(#sk)"><rect x="204" y="128" width="42" height="30" rx="5" fill="#fdfcf7" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="225" y="148" text-anchor="middle" font-size="10.5" fill="#444">1</text>
  <g filter="url(#sk)"><rect x="246" y="128" width="42" height="30" rx="5" fill="#fdfcf7" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="267" y="148" text-anchor="middle" font-size="10.5" fill="#444">2</text>
  <g filter="url(#sk)"><rect x="288" y="128" width="42" height="30" rx="5" fill="#fff8e1" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="309" y="148" text-anchor="middle" font-size="10.5" fill="#444">3</text>

  <g filter="url(#sk)"><rect x="58" y="164" width="62" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="89" y="184" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2e6e2e">up[0] 跳1步</text>
  <g filter="url(#sk)"><rect x="120" y="164" width="42" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="141" y="184" text-anchor="middle" font-size="10.5" fill="#2e6e2e">r</text>
  <g filter="url(#sk)"><rect x="162" y="164" width="42" height="30" rx="5" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="183" y="184" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">1</text>
  <g filter="url(#sk)"><rect x="204" y="164" width="42" height="30" rx="5" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="225" y="184" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="246" y="164" width="42" height="30" rx="5" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="267" y="184" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="288" y="164" width="42" height="30" rx="5" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="309" y="184" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">4</text>

  <g filter="url(#sk)"><rect x="58" y="200" width="62" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="89" y="220" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b5b84">up[1] 跳2步</text>
  <g filter="url(#sk)"><rect x="162" y="200" width="42" height="30" rx="5" fill="#fdfcf7" stroke="#446688" stroke-width="1.2"/></g>
  <text x="183" y="220" text-anchor="middle" font-size="10.5" fill="#2b5b84">2</text>
  <g filter="url(#sk)"><rect x="204" y="200" width="42" height="30" rx="5" fill="#fdfcf7" stroke="#446688" stroke-width="1.2"/></g>
  <text x="225" y="220" text-anchor="middle" font-size="10.5" fill="#2b5b84">4</text>
  <g filter="url(#sk)"><rect x="246" y="200" width="42" height="30" rx="5" fill="#fdfcf7" stroke="#446688" stroke-width="1.2"/></g>
  <text x="267" y="220" text-anchor="middle" font-size="10.5" fill="#2b5b84">4</text>
  <g filter="url(#sk)"><rect x="288" y="200" width="42" height="30" rx="5" fill="#fdfcf7" stroke="#446688" stroke-width="1.2"/></g>
  <text x="309" y="220" text-anchor="middle" font-size="10.5" fill="#2b5b84">4</text>

  <g filter="url(#sk)"><rect x="58" y="236" width="62" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="89" y="256" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b5b84">up[2] 跳4步</text>
  <g filter="url(#sk)"><rect x="162" y="236" width="42" height="30" rx="5" fill="#fdfcf7" stroke="#446688" stroke-width="1.2"/></g>
  <text x="183" y="256" text-anchor="middle" font-size="10.5" fill="#2b5b84">4</text>
  <g filter="url(#sk)"><rect x="204" y="236" width="42" height="30" rx="5" fill="#fdfcf7" stroke="#446688" stroke-width="1.2"/></g>
  <text x="225" y="256" text-anchor="middle" font-size="10.5" fill="#2b5b84">4</text>
  <g filter="url(#sk)"><rect x="246" y="236" width="42" height="30" rx="5" fill="#fdfcf7" stroke="#446688" stroke-width="1.2"/></g>
  <text x="267" y="256" text-anchor="middle" font-size="10.5" fill="#2b5b84">4</text>
  <g filter="url(#sk)"><rect x="288" y="236" width="42" height="30" rx="5" fill="#fdfcf7" stroke="#446688" stroke-width="1.2"/></g>
  <text x="309" y="256" text-anchor="middle" font-size="10.5" fill="#2b5b84">4</text>
  <text x="188" y="278" text-anchor="middle" font-size="9.5" fill="#555">表列只画 k = 0..3：k = 4 处 r[4] = 4 是不动点，各层 up 全为 4</text>

  <g filter="url(#sk)"><rect x="360" y="92" width="242" height="196" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="481" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">② 下降：查询 [0,2]（p=0，q=2）</text>

  <text x="378" y="142" font-size="10.5" fill="#444">t=2：up[2][0]=4 ≥ 2 → 不跳</text>
  <text x="378" y="158" font-size="9.5" fill="#888">（跳过头就错过 q，只在 &lt; q 时跳）</text>
  <g filter="url(#sk)"><path d="M 470 168 L 470 180" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)"/></g>
  <text x="378" y="196" font-size="10.5" fill="#444">t=1：up[1][0]=2 = q → 不跳</text>
  <text x="378" y="212" font-size="9.5" fill="#888">（恰好等于 q：保持 cur 在 q 左侧，留给 +1）</text>
  <g filter="url(#sk)"><path d="M 470 222 L 470 234" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)"/></g>
  <text x="378" y="250" font-size="10.5" font-weight="bold" fill="#2e6e2e">t=0：up[0][0]=1 &lt; 2 → 跳！</text>
  <text x="378" y="266" font-size="9.5" fill="#2e6e2e">cur = 1，累计 s = 1</text>
  <text x="378" y="282" font-size="10.5" font-weight="bold" fill="#7a5415">答案 = s + 1 = 2</text>

  <g filter="url(#sk)">
    <rect x="42" y="318" width="560" height="102" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="322" y="344" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">为什么答案 = s + 1？下降结束时 cur 是「最后一个 &lt; q」的落点，r(cur) ≥ q ⟹ q 就在 cur 的窗口里</text>
  <text x="322" y="368" text-anchor="middle" font-size="10.5" fill="#444">从高位到低位恰好凑出最大的 s 使 r∘s(p) &lt; q（∘s = 迭代 s 次），故第 s+1 跳直达 q —— 与「最小 t 使跳 t 次越过 q」一致</text>
  <text x="322" y="390" text-anchor="middle" font-size="10.5" fill="#444">本题 n ≤ 10^5，LOG = 17（2^17 = 131072 > 10^5）：建表 17 层 O(n log n)，每查 17 次表访问 O(log n)</text>
  <text x="322" y="410" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">同款套路：1483 树的第 K 个祖先 —— up[t][k] = up[t−1][up[t−1][k]] 的函数迭代稀疏表</text>
</svg>
