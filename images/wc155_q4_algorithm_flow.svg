<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两级拓扑排序的完整流程</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两道环检测：群组图有环 或 某组内部有环，都只能返回空列表</text>

  <rect x="90" y="58" width="380" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">① 无组项目各分配一个独立的新组号</text>
  <path d="M 280 94 L 280 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <rect x="90" y="106" width="380" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">② 建项目图：对 u ∈ beforeItems[v] 加边 u→v</text>
  <path d="M 280 142 L 280 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <rect x="90" y="154" width="380" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">③ 建群组图：g[u] ≠ g[v] 时加边 g[u]→g[v]</text>
  <path d="M 280 190 L 280 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <rect x="90" y="202" width="380" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="223" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">④ 对群组图跑 Kahn 拓扑排序</text>
  <path d="M 280 236 L 280 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <polygon points="280,250 380,282 280,314 180,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">出队数 &lt; 总组数？</text>
  <path d="M 382 282 L 432 282" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="406" y="274" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="436" y="266" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="488" y="287" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">返回 []</text>

  <path d="M 280 316 L 280 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="292" y="322" font-size="9.5" fill="#888" filter="url(#rough2)">否</text>

  <rect x="90" y="328" width="380" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">⑤ 按群组拓扑序分块，块内再跑一次拓扑排序</text>
  <path d="M 280 364 L 280 374" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <polygon points="280,376 372,406 280,436 188,406" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">块内出队数 &lt; 块大小？</text>
  <path d="M 374 406 L 432 406" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="404" y="398" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="436" y="390" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="488" y="411" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">返回 []</text>

  <path d="M 280 438 L 280 448" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="292" y="444" font-size="9.5" fill="#888" filter="url(#rough2)">否</text>

  <rect x="110" y="450" width="340" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="471" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">⑥ 依次拼接各块，得到合法排列</text>
</svg>
