<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="720" fill="#fdfcf7"/>
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">一次遍历 + 22 次查表：先查后插</text>
  <text x="360" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">处理 d 时表中只有更早下标的元素 → 每对 (i &lt; j) 恰好被数一次</text>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <rect x="280" y="52" width="160" height="32" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="360" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">开始</text>
  <path d="M 360,84 L 360,100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 取下一道餐品 -->
  <g filter="url(#sk)">
    <rect x="230" y="104" width="260" height="48" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="360" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">取下一道餐品 d</text>
  <text x="360" y="142" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#sk)">（从左到右一次遍历）</text>
  <path d="M 360,152 L 360,168" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- k 循环头 -->
  <g filter="url(#sk)">
    <rect x="225" y="172" width="270" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="360" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">for k = 0 … 21（22 个目标）</text>
  <text x="360" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">c = 2^k − d</text>
  <path d="M 360,224 L 360,236" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形1：查表 -->
  <g filter="url(#sk)">
    <polygon points="360,240 480,290 360,340 240,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="360" y="295" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">c 在哈希表中？</text>

  <text x="492" y="282" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>
  <path d="M 480,290 L 541,290" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="545" y="266" width="150" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="620" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4a1a" filter="url(#sk)">ans += cnt[c]</text>
  <text x="620" y="306" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">（long long 累加）</text>

  <text x="372" y="336" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <path d="M 360,340 L 360,358" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 620,314 L 620,364 L 372,364" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <circle cx="360" cy="364" r="4.5" fill="#3a3a3a"/>
  </g>
  <path d="M 360,369 L 360,378" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形2：k 用完了吗 -->
  <g filter="url(#sk)">
    <polygon points="360,380 455,428 360,476 265,428" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="360" y="433" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">还有未试的 k？</text>

  <text x="280" y="416" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>
  <path d="M 265,428 L 185,428 L 185,198 L 221,198" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="372" y="462" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <path d="M 360,476 L 360,492" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 入表 -->
  <g filter="url(#sk)">
    <rect x="245" y="496" width="230" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="360" y="516" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">cnt[d] += 1</text>
  <text x="360" y="534" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#sk)">（先查后插：d 这才入表）</text>
  <path d="M 360,544 L 360,556" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形3：还有元素吗 -->
  <g filter="url(#sk)">
    <polygon points="360,560 470,608 360,656 250,608" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="360" y="613" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">还有元素？</text>

  <text x="238" y="598" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">是</text>
  <path d="M 250,608 L 165,608 L 165,128 L 226,128" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="372" y="642" font-size="10" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <path d="M 360,656 L 360,672" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 结束 -->
  <g filter="url(#sk)">
    <rect x="270" y="676" width="180" height="34" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="360" y="698" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a4a1a" filter="url(#sk)">输出 ans mod (10⁹+7)</text>

  <!-- 右上：复杂度速览 -->
  <g filter="url(#sk)">
    <rect x="515" y="100" width="190" height="90" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="610" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a4a1a" filter="url(#sk)">复杂度速览</text>
  <text x="610" y="144" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">每元素 22 查 + 1 插</text>
  <text x="610" y="162" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">时间 O(22n) ≈ O(n)</text>
  <text x="610" y="180" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">空间 O(不同值个数)</text>

  <!-- 右下：为什么先查后插 -->
  <g filter="url(#sk)">
    <rect x="505" y="380" width="200" height="110" rx="8" fill="#fdf2f2" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="605" y="402" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a04038" filter="url(#sk)">为什么先查后插？</text>
  <text x="605" y="422" text-anchor="middle" font-size="9.5" fill="#a04038" filter="url(#sk)">查询时表中只有下标</text>
  <text x="605" y="440" text-anchor="middle" font-size="9.5" fill="#a04038" filter="url(#sk)">更小的元素 ⇒ 每对</text>
  <text x="605" y="458" text-anchor="middle" font-size="9.5" fill="#a04038" filter="url(#sk)">恰好数一次，元素</text>
  <text x="605" y="476" text-anchor="middle" font-size="9.5" fill="#a04038" filter="url(#sk)">永远配不到自己</text>
</svg>
