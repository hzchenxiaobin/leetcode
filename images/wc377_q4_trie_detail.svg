<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="15" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="940" height="600" fill="#fdfcf7"/>

  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">双游标下探：一次走查枚举起点为 i 的所有区间（示例 2 的 i = 1）</text>
  <path d="M 150 44 Q 470 52 790 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left: trie ===== -->
  <g filter="url(#sk)"><rect x="40" y="64" width="500" height="376" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="290" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">Trie：{bcd, cde, fgh, ghh, thh}，★ = 终点（对应图节点）</text>

  <!-- root -->
  <g filter="url(#sk)"><circle cx="290" cy="126" r="15" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="290" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">r</text>

  <!-- edges root -> level1 -->
  <path d="M 282 136 L 108 178" stroke="#4a8e4a" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 280 138 L 188 178" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 290 141 L 278 178" stroke="#4a8edb" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 298 138 L 372 178" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 300 136 L 452 178" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>

  <!-- level 1 -->
  <g filter="url(#sk)"><circle cx="104" cy="192" r="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="104" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">b</text>
  <g filter="url(#sk)"><circle cx="184" cy="192" r="14" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="184" y="197" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">t</text>
  <g filter="url(#sk)"><circle cx="274" cy="192" r="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/></g>
  <text x="274" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">c</text>
  <g filter="url(#sk)"><circle cx="368" cy="192" r="14" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="368" y="197" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">f</text>
  <g filter="url(#sk)"><circle cx="456" cy="192" r="14" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="456" y="197" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">g</text>

  <!-- level 2 -->
  <path d="M 104 206 L 104 240" stroke="#4a8e4a" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 184 206 L 184 240" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 274 206 L 274 240" stroke="#4a8edb" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 368 206 L 368 240" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 456 206 L 456 240" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><circle cx="104" cy="254" r="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="104" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">c</text>
  <g filter="url(#sk)"><circle cx="184" cy="254" r="14" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="184" y="259" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">h</text>
  <g filter="url(#sk)"><circle cx="274" cy="254" r="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/></g>
  <text x="274" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">d</text>
  <g filter="url(#sk)"><circle cx="368" cy="254" r="14" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="368" y="259" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">g</text>
  <g filter="url(#sk)"><circle cx="456" cy="254" r="14" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="456" y="259" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">h</text>

  <!-- level 3 (terminals) -->
  <path d="M 104 268 L 104 302" stroke="#4a8e4a" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 184 268 L 184 302" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 274 268 L 274 302" stroke="#4a8edb" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 368 268 L 368 302" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 456 268 L 456 302" stroke="#999" stroke-width="1.3" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><circle cx="104" cy="316" r="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="104" y="321" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">d</text>
  <g filter="url(#sk)"><circle cx="184" cy="316" r="14" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="184" y="321" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">h</text>
  <g filter="url(#sk)"><circle cx="274" cy="316" r="14" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/></g>
  <text x="274" y="321" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">e</text>
  <g filter="url(#sk)"><circle cx="368" cy="316" r="14" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="368" y="321" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">h</text>
  <g filter="url(#sk)"><circle cx="456" cy="316" r="14" fill="#fdfcf7" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="456" y="321" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">h</text>

  <!-- terminal stars -->
  <text x="104" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">★bcd</text>
  <text x="184" y="352" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">★thh</text>
  <text x="274" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">★cde</text>
  <text x="368" y="352" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">★fgh</text>
  <text x="456" y="352" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">★ghh</text>

  <!-- walk badges on trie -->
  <text x="70" y="150" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">绿：source 游标</text>
  <text x="330" y="150" font-size="11" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">蓝：target 游标</text>
  <text x="290" y="408" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">绿游标沿 b→c→d，蓝游标沿 c→d→e，步数相同（同一段下标）</text>

  <!-- ===== right: walk steps ===== -->
  <g filter="url(#sk)"><rect x="572" y="64" width="328" height="376" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="736" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">深度走查（i = 1 起的双游标）</text>
  <text x="736" y="112" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">source = a b c d e f g h</text>
  <text x="736" y="130" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">target = a c d e e g h h</text>

  <g filter="url(#sk)"><rect x="592" y="146" width="288" height="46" rx="6" fill="#fdfcf7" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="736" y="165" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">L=1：source 侧到 b（非终点），target 侧到 c（非终点）</text>
  <text x="736" y="183" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">继续下探</text>

  <g filter="url(#sk)"><rect x="592" y="202" width="288" height="46" rx="6" fill="#fdfcf7" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="736" y="221" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">L=2：source 侧 bc，target 侧 cd（均非终点）</text>
  <text x="736" y="239" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">继续下探</text>

  <g filter="url(#sk)"><rect x="592" y="258" width="288" height="70" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="736" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">L=3：source 侧 bcd★，target 侧 cde★</text>
  <text x="736" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">dp[4] = dp[1] + dist[bcd][cde] = 0 + 1</text>
  <text x="736" y="316" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">→ 区间 [1,3] 整体跳转！</text>

  <g filter="url(#sk)"><rect x="592" y="340" width="288" height="70" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="736" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a" filter="url(#sk)">L=4：source 侧 d 下没有子节点 e</text>
  <text x="736" y="378" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a" filter="url(#sk)">→ 游标走死，break</text>
  <text x="736" y="398" text-anchor="middle" font-size="10" fill="#b03a3a" filter="url(#sk)">起点 1 的所有合法区间枚举完毕</text>

  <!-- ===== bottom notes ===== -->
  <g filter="url(#sk)"><rect x="56" y="462" width="828" height="118" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="76" y="486" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">走死即停的合理性</text>
  <text x="76" y="510" font-size="11" fill="#444" filter="url(#sk)">· source 游标走死 ⇔ source[i..i+L-1] 不是任何规则串的前缀 ⇒ 起点为 i、长度 ≥ L 的子串都不是规则串</text>
  <text x="76" y="532" font-size="11" fill="#444" filter="url(#sk)">· target 游标走死同理：链的终点必须是某条规则的 changed 串（图节点），走死则更长的也不可能是节点</text>
  <text x="76" y="554" font-size="11" fill="#444" filter="url(#sk)">· 两侧游标共享同一棵 Trie，一次下探同时完成「枚举长度 L」与「查两端节点编号」，单步 O(1) 无需哈希</text>
  <text x="76" y="576" font-size="11" fill="#444" filter="url(#sk)">· 对照：逐 (i, L) 切子串再哈希查表需 O(n³) 次字符操作（≈10⁸），Trie 把它压到 O(n²) 次下探（10⁶）</text>
</svg>
