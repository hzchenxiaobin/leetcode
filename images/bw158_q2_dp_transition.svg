<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">O(kn) 的 DP：把「枚举起点」换成两个滚动最大值</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">dp_j[i] = 前 i+1 天最多 j 笔的最大利润</text>
  <rect x="30" y="58" width="540" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="78.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">以第 i 天收尾的一笔</text>
  <text x="300.0" y="98.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">|p[i] - p[s]| = max( -p[i] + (prev(s)+p[s]),  p[i] + (prev(s)-p[s]) )</text>
  <rect x="140" y="118" width="330" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="305.0" y="140.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">bestA = max over s&lt;i 的 (prev(s) + p[s])</text>
  <path d="M 305.0 154 L 305.0 166" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="170" width="330" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="305.0" y="192.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">bestB = max over s&lt;i 的 (prev(s) - p[s])</text>
  <path d="M 305.0 206 L 305.0 218" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="222" width="330" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="305.0" y="244.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">cand = max(-p[i] + bestA, p[i] + bestB)</text>
  <rect x="40" y="290" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="312.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">dp_j[i] = max(dp_j[i-1], cand)：可以少用一笔，收益不会更差</text>
  <text x="300.0" y="332.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">prev(s) = dp_{j-1}[s-1]：上一笔必须在前一天之前结束</text>
  <text x="40" y="366" font-size="10" fill="#999" text-anchor="start" filter="url(#rough2)">每层 j 只扫一遍 i，O(kn)；k &lt;= n/2，n &lt;= 1000</text>
</svg>
