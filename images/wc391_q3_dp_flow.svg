<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">一次扫描 DP：cur = 以 i 结尾的交替子数组个数</text>
  <path d="M 150 38 Q 340 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="210" y="46" width="200" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="310" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">ans = 0，cur = 0</text>

  <path d="M 310 82 L 310 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="310,102 405,140 310,178 215,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="310" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">i &lt; n ?</text>
  <text x="310" y="154" text-anchor="middle" font-size="10" fill="#a08040">还有元素吗</text>

  <path d="M 405 140 L 455 140" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="430" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>

  <path d="M 215 140 L 175 140" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="196" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <rect x="30" y="118" width="140" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="100" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 ans</text>

  <g filter="url(#sk)">
    <polygon points="540,100 625,140 540,180 455,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="540" y="134" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">nums[i] ≠ nums[i−1] ?</text>
  <text x="540" y="152" text-anchor="middle" font-size="10" fill="#a08040">相邻不同吗</text>

  <path d="M 540 100 L 540 82" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="553" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>

  <g filter="url(#sk)">
    <rect x="455" y="42" width="170" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="540" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">cur = cur + 1</text>

  <path d="M 540 180 L 540 200" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="553" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <rect x="455" y="202" width="170" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="540" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">cur = 1</text>
  <text x="540" y="238" text-anchor="middle" font-size="10" fill="#b85450">重置，另起新段</text>

  <path d="M 540 246 L 540 268" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="455" y="270" width="170" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="540" y="291" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">ans += cur</text>
  <text x="540" y="309" text-anchor="middle" font-size="12.5" fill="#7a5415">i += 1</text>

  <path d="M 625 61 C 662 90 662 270 625 296" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 540 322 C 540 372 310 385 310 184" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="430" y="376" text-anchor="middle" font-size="10.5" fill="#555">处理下一个元素</text>

  <g filter="url(#sk)">
    <rect x="30" y="268" width="220" height="108" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="140" y="290" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">cur 恰等于以 i 结尾的</text>
  <text x="140" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">交替子数组个数</text>
  <text x="140" y="328" text-anchor="middle" font-size="10" fill="#446688">答案上界 n(n+1)÷2 ≈ 5×10⁹</text>
  <text x="140" y="345" text-anchor="middle" font-size="10" fill="#446688">C++ 必须用 long long 累加</text>
  <text x="140" y="362" text-anchor="middle" font-size="10" fill="#446688">一趟扫描，O(1) 额外空间</text>
</svg>
