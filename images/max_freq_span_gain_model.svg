<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a6515"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：x 确定后，区间里只有一种值能变成 k</text>
  <path d="M 250 46 Q 470 54 690 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== ① 原数组 ===== -->
  <text x="80" y="86" font-size="13" font-weight="bold" fill="#555">① 原数组（k = 目标值，v = 想点化成 k 的值，w = 其他值）</text>
  <text x="470" y="84" text-anchor="middle" font-size="12" fill="#8a6515">选子数组 [1..5]，整体加 x，其中 v + x = k</text>

  <!-- 区间框 -->
  <rect x="228" y="92" width="484" height="66" rx="10" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 4" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="140" y="100" width="84" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="236" y="100" width="84" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="332" y="100" width="84" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="428" y="100" width="84" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="524" y="100" width="84" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="620" y="100" width="84" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" filter="url(#sk)">
    <text x="182" y="130">k</text>
    <text x="278" y="130">v</text>
    <text x="374" y="130">w</text>
    <text x="470" y="130">v</text>
    <text x="566" y="130">k</text>
    <text x="662" y="130">v</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#888" filter="url(#sk)">
    <text x="182" y="170">i=0</text>
    <text x="278" y="170">i=1</text>
    <text x="374" y="170">i=2</text>
    <text x="470" y="170">i=3</text>
    <text x="566" y="170">i=4</text>
    <text x="662" y="170">i=5</text>
  </g>

  <!-- 大箭头：+x -->
  <path d="M 470 176 L 470 216" stroke="#8a6515" stroke-width="2.2" fill="none" filter="url(#sk)" marker-end="url(#arO)"/>
  <text x="486" y="202" font-size="13" font-weight="bold" fill="#8a6515" filter="url(#sk)">+x</text>

  <!-- ===== ② 操作后 ===== -->
  <text x="80" y="210" font-size="13" font-weight="bold" fill="#555">② 操作后</text>
  <g filter="url(#sk)">
    <rect x="140" y="222" width="84" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="236" y="222" width="84" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="332" y="222" width="84" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="428" y="222" width="84" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="524" y="222" width="84" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="620" y="222" width="84" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#333" filter="url(#sk)">
    <text x="182" y="252">k</text>
    <text x="278" y="252">k</text>
    <text x="374" y="252">w+x</text>
    <text x="470" y="252">k</text>
    <text x="566" y="252">k+x</text>
    <text x="662" y="252">k</text>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#sk)">
    <text x="182" y="288" fill="#4a7a3a">区间外，保留</text>
    <text x="278" y="288" fill="#4a7a3a">v+x=k ✓</text>
    <text x="374" y="288" fill="#446688">≠ k，无关</text>
    <text x="470" y="288" fill="#4a7a3a">v+x=k ✓</text>
    <text x="566" y="288" fill="#a04038">被破坏！</text>
    <text x="662" y="288" fill="#4a7a3a">v+x=k ✓</text>
  </g>

  <!-- ===== 图例 ===== -->
  <g filter="url(#sk)">
    <rect x="740" y="100" width="170" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="752" y="122" font-size="11" fill="#2e5e2e" filter="url(#sk)">v + x = k → 净赚 +1</text>
  <g filter="url(#sk)">
    <rect x="740" y="145" width="170" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="752" y="167" font-size="11" fill="#a04038" filter="url(#sk)">k + x = 2k−v ≠ k → −1</text>
  <g filter="url(#sk)">
    <rect x="740" y="190" width="170" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="752" y="212" font-size="11" fill="#2f4f6f" filter="url(#sk)">其他值 + x ≠ k → 0</text>

  <!-- ===== ③ 增益数组 ===== -->
  <text x="80" y="336" font-size="13" font-weight="bold" fill="#555">③ 转成增益数组 a（对整个数组定义，Kadane 自动选最优区间）</text>
  <g filter="url(#sk)">
    <rect x="140" y="348" width="84" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="236" y="348" width="84" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="332" y="348" width="84" height="42" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="428" y="348" width="84" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="524" y="348" width="84" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="620" y="348" width="84" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#sk)">
    <text x="182" y="375">−1</text>
    <text x="278" y="375">+1</text>
    <text x="374" y="375">0</text>
    <text x="470" y="375">+1</text>
    <text x="566" y="375">−1</text>
    <text x="662" y="375">+1</text>
  </g>
  <text x="80" y="412" font-size="11" fill="#666" filter="url(#sk)">a_i = +1（值为 v）／ −1（值为 k）／ 0（其他）；区间外的 k 也记 −1 —— 它是“把区间边界扩过去吞掉它”的代价</text>

  <!-- ===== 公式框 ===== -->
  <g filter="url(#sk)">
    <rect x="80" y="430" width="790" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="100" y="458" font-size="14" font-weight="bold" fill="#8a6515" filter="url(#sk)">操作后 k 的频率 = C_k − C_k(i,j) + C_v(i,j) = C_k + Σ a_t （t ∈ [i,j]）</text>
  <text x="100" y="486" font-size="13" fill="#8a6515" filter="url(#sk)">固定 v 后，最优区间 [i,j] = 使 Σ a_t 最大的区间 → 最大子数组和（Kadane，O(n)）</text>

  <!-- ===== 值域框 ===== -->
  <g filter="url(#sk)">
    <rect x="80" y="522" width="790" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="100" y="546" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">值域钥匙：1 ≤ nums[i], k ≤ 50 ⇒ v 只需枚举 1..50（跳过 v = k）</text>
  <text x="100" y="568" font-size="12" fill="#2e5e2e" filter="url(#sk)">总复杂度 O(50n)；v 枚举完取全局最大增益，答案 = C_k + max(0, 最大增益)</text>

  <text x="470" y="625" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">净收益 = 多少个 v 被点化（+1 each）− 多少个 k 被误伤（−1 each）</text>
</svg>
