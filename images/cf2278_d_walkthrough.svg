<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">样例 3 走查：a = [18, −2, 9, 11]，取 y = 9</text>
  <text x="320" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个元素要锁几次、锁在哪种操作里，全部由 a_i − y 的符号与大小决定</text>

  <!-- table header -->
  <rect x="60" y="64" width="530" height="32" fill="#eeeeee" stroke="#999999" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="105" y="85" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">a_i</text>
  <text x="210" y="85" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">a_i − y</text>
  <text x="315" y="85" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">c_i（锁几次）</text>
  <text x="440" y="85" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">锁在哪类操作</text>
  <text x="555" y="85" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">终值</text>

  <!-- row 1: 18 -->
  <rect x="60" y="96" width="530" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="105" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">18</text>
  <text x="210" y="120" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">+9</text>
  <text x="315" y="120" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">9</text>
  <text x="440" y="120" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">「+」操作 × 9</text>
  <text x="555" y="120" text-anchor="middle" font-size="12.5" fill="#3f6b32" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- row 2: 11 -->
  <rect x="60" y="132" width="530" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="105" y="156" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">11</text>
  <text x="210" y="156" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">+2</text>
  <text x="315" y="156" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="440" y="156" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">「+」操作 × 2</text>
  <text x="555" y="156" text-anchor="middle" font-size="12.5" fill="#3f6b32" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- row 3: 9 -->
  <rect x="60" y="168" width="530" height="36" fill="#eeeeee" stroke="#999999" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="105" y="192" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="210" y="192" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <text x="315" y="192" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">0</text>
  <text x="440" y="192" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">从不锁</text>
  <text x="555" y="192" text-anchor="middle" font-size="12.5" fill="#3f6b32" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- row 4: -2 -->
  <rect x="60" y="204" width="530" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="105" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−2</text>
  <text x="210" y="228" text-anchor="middle" font-size="12" fill="#7d3b38" filter="url(#rough2)">−11</text>
  <text x="315" y="228" text-anchor="middle" font-size="12" fill="#7d3b38" filter="url(#rough2)">11</text>
  <text x="440" y="228" text-anchor="middle" font-size="11.5" fill="#7d3b38" filter="url(#rough2)">「−」操作 × 11</text>
  <text x="555" y="228" text-anchor="middle" font-size="12.5" fill="#3f6b32" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- summary -->
  <rect x="60" y="256" width="530" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="325" y="277" text-anchor="middle" font-size="12.5" fill="#3f6b32" font-weight="bold" filter="url(#rough2)">总代价 = 9 + 2 + 0 + 11 = 22　　操作数 = 9 + 11 = 20 = max − min</text>

  <text x="320" y="312" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">「+」共 9 次、「−」共 11 次，两者独立排布 ⇒ T = 9 − 11 = −2</text>
  <text x="320" y="338" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">目标值 x = y + T = 9 + (−2) = 7，正好落在 [min, max] 之内</text>
  <text x="320" y="366" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">终值校验：a_i + T − L_i = a_i − 2 − (a_i − 9) = 7，四行全部一致 ✓</text>

  <text x="320" y="400" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意：18 需要 9 次「+」锁，所以「+」操作至少有 9 个；−2 需要 11 次「−」锁，所以「−」操作至少有 11 个</text>
</svg>
