<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="207" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">贡献法：按 i 与 k 的位置一遍统计</text>
  <path d="M 140 42 Q 320 52 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="55" y="56" width="530" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="82" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-family="monospace" font-weight="bold">ans = t[k] + Σ(i&lt;k) min(t[i], t[k]) + Σ(i&gt;k) min(t[i], t[k]−1)</text>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="320,128 425,172 320,216 215,172" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="320" y="167" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">位置 i 相对</text>
  <text x="320" y="184" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">于 k 在哪？</text>

  <!-- branch arrows -->
  <path d="M 240 195 C 180 210, 140 220, 127 240" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 216 L 320 240" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 400 195 C 460 210, 500 220, 513 240" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- three branch boxes -->
  <g filter="url(#sk)">
    <rect x="45" y="244" width="165" height="94" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="127" y="266" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">i &lt; k（k 前面）</text>
  <text x="127" y="288" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">min(t[i], t[k])</text>
  <text x="127" y="308" text-anchor="middle" font-size="11" fill="#666">k 的每轮里都先于 k 买</text>
  <text x="127" y="325" text-anchor="middle" font-size="11" fill="#666">→ 最多参与 t[k] 轮</text>

  <g filter="url(#sk)">
    <rect x="238" y="244" width="165" height="94" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="320" y="266" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">i = k（本人）</text>
  <text x="320" y="288" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">t[k]</text>
  <text x="320" y="308" text-anchor="middle" font-size="11" fill="#666">自己买 t[k] 张</text>
  <text x="320" y="325" text-anchor="middle" font-size="11" fill="#666">每张恰好 1 秒</text>

  <g filter="url(#sk)">
    <rect x="430" y="244" width="165" height="94" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="512" y="266" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">i &gt; k（k 后面）</text>
  <text x="512" y="288" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">min(t[i], t[k]−1)</text>
  <text x="512" y="308" text-anchor="middle" font-size="11" fill="#666">最后一轮 k 买完即停</text>
  <text x="512" y="325" text-anchor="middle" font-size="11" fill="#666">→ 少参与一轮</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="352" width="520" height="36" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="375" text-anchor="middle" font-size="12" fill="#7a5415">本质：每秒恰好一人买一张票，总时间 = k 完成前所有人买票总张数</text>
</svg>
