<svg xmlns="http://www.w3.org/2000/svg" width="720" height="592" viewBox="0 0 720 592" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="720" height="592" fill="#fdfcf7"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">受益点对分类：统一记 p = |a−x|，q = |b−y|，新距离 W = p + q + 1</text>
  <text x="360" y="52" text-anchor="middle" font-size="12.5" fill="#666">d = y − x，C = d + 1（环长）；受益 ⟺ W &lt; t（绕弦严格更短）—— 五类位置，除「同侧」外都可能受益</text>

  <!-- column headers -->
  <text x="120" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#666">示意</text>
  <text x="272" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#666">类型 / 位置（a &lt; b）</text>
  <text x="430" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#666">旧距离 t → 新距离 W</text>
  <text x="612" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#666">何时受益</text>
  <path d="M 50 92 Q 360 98 670 92" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- row 0: same side -->
  <g filter="url(#sk)">
    <rect x="36" y="100" width="648" height="78" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <path d="M 54 146 L 188 146" stroke="#666" stroke-width="1.5" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="102" y="122" width="46" height="48" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <ellipse cx="68" cy="146" rx="5" ry="5" fill="#b85450"/>
    <ellipse cx="88" cy="146" rx="5" ry="5" fill="#b85450"/>
  </g>
  <text x="68" y="118" text-anchor="middle" font-size="10" fill="#a04a5a">a</text>
  <text x="88" y="118" text-anchor="middle" font-size="10" fill="#a04a5a">b</text>
  <text x="208" y="134" font-size="14" font-weight="bold" fill="#2e6e2e">同侧尾巴</text>
  <text x="208" y="160" font-size="11.5" fill="#2e6e2e">a, b 同在 [1, x−1] 或同在 [y+1, n]</text>
  <text x="356" y="134" font-size="12.5" fill="#2b5d85">t = b − a</text>
  <text x="356" y="160" font-size="12.5" font-weight="bold" fill="#2b5d85">W ≥ t + d + 3（绕路必亏）</text>
  <text x="530" y="146" font-size="12" fill="#2e6e2e">永不：留在基线 n−k</text>

  <!-- row 1: cross tails -->
  <g filter="url(#sk)">
    <rect x="36" y="186" width="648" height="78" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <path d="M 54 232 L 188 232" stroke="#666" stroke-width="1.5" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="102" y="208" width="46" height="48" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <ellipse cx="66" cy="232" rx="5" ry="5" fill="#b85450"/>
    <ellipse cx="176" cy="232" rx="5" ry="5" fill="#b85450"/>
  </g>
  <text x="66" y="204" text-anchor="middle" font-size="10" fill="#a04a5a">a</text>
  <text x="176" y="204" text-anchor="middle" font-size="10" fill="#a04a5a">b</text>
  <text x="208" y="220" font-size="14" font-weight="bold" fill="#2b5d85">异侧尾巴</text>
  <text x="208" y="246" font-size="11.5" fill="#2b5d85">a ∈ [1, x−1]，b ∈ [y+1, n]</text>
  <text x="356" y="220" font-size="12.5" fill="#2b5d85">t = p + q + d</text>
  <text x="356" y="246" font-size="12.5" font-weight="bold" fill="#2b5d85">W = p + q + 1（恒省 d−1）</text>
  <text x="530" y="220" font-size="12" fill="#2b5d85">d ≥ 2</text>
  <text x="530" y="246" font-size="11.5" fill="#888">（d = 1 弦是冗余边）</text>

  <!-- row 2: left tail - cycle -->
  <g filter="url(#sk)">
    <rect x="36" y="272" width="648" height="78" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <path d="M 54 318 L 188 318" stroke="#666" stroke-width="1.5" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="102" y="294" width="46" height="48" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <ellipse cx="72" cy="318" rx="5" ry="5" fill="#b85450"/>
    <ellipse cx="125" cy="318" rx="5" ry="5" fill="#b85450"/>
  </g>
  <text x="72" y="290" text-anchor="middle" font-size="10" fill="#a04a5a">a</text>
  <text x="125" y="290" text-anchor="middle" font-size="10" fill="#a04a5a">b</text>
  <text x="208" y="306" font-size="14" font-weight="bold" fill="#2b5d85">左尾 — 环内</text>
  <text x="208" y="332" font-size="11.5" fill="#2b5d85">a ∈ [1, x−1]，b ∈ [x, y]</text>
  <text x="356" y="306" font-size="12.5" fill="#2b5d85">t = d + p − q</text>
  <text x="356" y="332" font-size="12.5" font-weight="bold" fill="#2b5d85">W = p + q + 1</text>
  <text x="530" y="306" font-size="12" fill="#2b5d85">2q ≤ d − 2</text>
  <text x="530" y="332" font-size="11.5" fill="#888">（b 越过环心偏 y 端）</text>

  <!-- row 3: cycle - right tail -->
  <g filter="url(#sk)">
    <rect x="36" y="358" width="648" height="78" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <path d="M 54 404 L 188 404" stroke="#666" stroke-width="1.5" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="102" y="380" width="46" height="48" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <ellipse cx="125" cy="404" rx="5" ry="5" fill="#b85450"/>
    <ellipse cx="174" cy="404" rx="5" ry="5" fill="#b85450"/>
  </g>
  <text x="125" y="376" text-anchor="middle" font-size="10" fill="#a04a5a">a</text>
  <text x="174" y="376" text-anchor="middle" font-size="10" fill="#a04a5a">b</text>
  <text x="208" y="392" font-size="14" font-weight="bold" fill="#2b5d85">环内 — 右尾</text>
  <text x="208" y="418" font-size="11.5" fill="#2b5d85">a ∈ [x, y]，b ∈ [y+1, n]</text>
  <text x="356" y="392" font-size="12.5" fill="#2b5d85">t = d + q − p</text>
  <text x="356" y="418" font-size="12.5" font-weight="bold" fill="#2b5d85">W = p + q + 1</text>
  <text x="530" y="392" font-size="12" fill="#2b5d85">2p ≤ d − 2</text>
  <text x="530" y="418" font-size="11.5" fill="#888">（a 靠 x 端）</text>

  <!-- row 4: cycle - cycle -->
  <g filter="url(#sk)">
    <rect x="36" y="444" width="648" height="78" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <path d="M 54 490 L 188 490" stroke="#666" stroke-width="1.5" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="102" y="466" width="46" height="48" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <ellipse cx="112" cy="490" rx="5" ry="5" fill="#b85450"/>
    <ellipse cx="138" cy="490" rx="5" ry="5" fill="#b85450"/>
  </g>
  <text x="112" y="462" text-anchor="middle" font-size="10" fill="#a04a5a">a</text>
  <text x="138" y="462" text-anchor="middle" font-size="10" fill="#a04a5a">b</text>
  <text x="208" y="478" font-size="14" font-weight="bold" fill="#a06b1a">环内 — 环内</text>
  <text x="208" y="504" font-size="11.5" fill="#a06b1a">a, b ∈ [x, y]，间距 t = b − a</text>
  <text x="356" y="478" font-size="12.5" fill="#a06b1a">t = b − a</text>
  <text x="356" y="504" font-size="12.5" font-weight="bold" fill="#a06b1a">W = C − t（环上反向）</text>
  <text x="530" y="478" font-size="12" fill="#a06b1a">2t ≥ d + 2</text>
  <text x="530" y="504" font-size="11.5" fill="#888">（每个 t 有 d+1−t 对）</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="534" width="600" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="360" y="561" text-anchor="middle" font-size="13" fill="#8a6414">每类修正都是对 cnt 的「点加 / 区间加」→ 一个差分数组全接住，前缀和一遍还原，总时间 O(n)</text>
</svg>
