<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 720" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="720" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold" filter="url(#rough2)">一次埃氏筛 + 逐数分解：看形状，套公式</text>
  <path d="M 120 34 Q 310 44 500 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <rect x="70" y="44" width="250" height="44" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">M = max(nums)，n = len(nums)</text>

  <path d="M 195 88 L 195 104" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="108" width="290" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="131" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4258" filter="url(#rough2)">埃氏筛求 spf[1..M]</text>
  <text x="195" y="152" text-anchor="middle" font-size="11" fill="#2c4258" filter="url(#rough2)">spf[v] = v 的最小质因子（O(M log log M)）</text>

  <path d="M 195 166 L 195 182" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="186" width="290" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4258" filter="url(#rough2)">取下一个 x，剥离质因子</text>
  <text x="195" y="230" text-anchor="middle" font-size="11" fill="#2c4258" filter="url(#rough2)">t = x；p = spf[t]，连除记指数 e</text>

  <path d="M 195 244 L 195 260" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="195,266 330,316 195,366 60,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="310" text-anchor="middle" font-size="12" fill="#5a4a20" filter="url(#rough2)">指数向量 = (3)？</text>
  <text x="195" y="330" text-anchor="middle" font-size="10.5" fill="#5a4a20" filter="url(#rough2)">即 n = p³</text>

  <text x="358" y="306" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">是</text>
  <path d="M 330 316 L 390 316" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="394" y="292" width="198" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="493" y="321" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">σ = 1 + p + p² + p³</text>

  <text x="207" y="380" text-anchor="middle" font-size="11" fill="#3a6a2a" filter="url(#rough2)">否</text>
  <path d="M 195 366 L 195 384" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="195,390 335,440 195,490 55,440" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="434" text-anchor="middle" font-size="12" fill="#5a4a20" filter="url(#rough2)">指数向量 = (1,1)？</text>
  <text x="195" y="454" text-anchor="middle" font-size="10.5" fill="#5a4a20" filter="url(#rough2)">即 n = p·q（p ≠ q）</text>

  <text x="362" y="430" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">是</text>
  <path d="M 335 440 L 390 440" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="394" y="416" width="198" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="493" y="445" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">σ = (1 + p)(1 + q)</text>

  <text x="207" y="504" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">否</text>
  <path d="M 195 490 L 195 508" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="512" width="290" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="541" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">σ = 0，这个 x 不贡献</text>

  <path d="M 195 560 L 195 580" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="584" width="250" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="612" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4258" filter="url(#rough2)">ans += σ</text>

  <path d="M 592 316 L 604 316 L 604 607 L 324 607" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 592 440 L 604 440" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <path d="M 70 607 L 34 607 L 34 215 L 46 215" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="22" y="420" font-size="10" fill="#4a7a3a" transform="rotate(-90 22 420)" text-anchor="middle" filter="url(#rough2)">还有下一个 x</text>

  <path d="M 195 630 L 195 648" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="652" width="280" height="46" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="680" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">返回 ans</text>
</svg>
