<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/></marker>
  </defs>
  <rect width="560" height="336" fill="#fafafa"/>
  <text x="280.0" y="26.0" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">为什么同一 r 的点必须「同进同出」</text>
  <path d="M 58.0 160.0 L 258.0 160.0" stroke="#888888" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <path d="M 150.0 242.0 L 150.0 68.0" stroke="#888888" stroke-width="1.1" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <rect x="89.8" y="100.0" width="120.1" height="120.0" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" fill-opacity="0.4" filter="url(#rough2)"/>
  <text x="198.0" y="118.0" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">r=2</text>
  <circle cx="210.1" cy="100.0" r="5.0" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220.0" y="104.0" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">b</text>
  <circle cx="90.0" cy="99.8" r="5.0" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100.0" y="104.0" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">b</text>
  <text x="150.0" y="236.0" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">两个点都在边界上</text>
  <rect x="299.6" y="59.8" width="240.3" height="95.5" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="420.0" y="85.0" text-anchor="middle" font-size="10.5" fill="#7a3b38" filter="url(#rough2)">r 只能取一整条边界，</text>
  <text x="420.0" y="103.0" text-anchor="middle" font-size="10.5" fill="#7a3b38" filter="url(#rough2)">没法「只收一个」：</text>
  <text x="420.0" y="121.0" text-anchor="middle" font-size="10.5" fill="#7a3b38" filter="url(#rough2)">两个点 max(|x|,|y|) 相同，</text>
  <text x="420.0" y="139.0" text-anchor="middle" font-size="10.5" fill="#7a3b38" filter="url(#rough2)">任何半径要么都收、要么都不收。</text>
  <rect x="29.9" y="257.9" width="500.1" height="59.9" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280.0" y="283.0" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">所以同一 r 的整组点必须一起判定：组内重复，或与已收标签重复，整组就报废，答案停在上一组</text>
  <text x="280.0" y="301.0" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">这也解释了为什么排序后要「按组」而不是「逐个」滑动</text>
</svg>
