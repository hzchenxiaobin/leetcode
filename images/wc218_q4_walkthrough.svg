<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [1,2,1,4]，k = 2，m = 2</text>

  <!-- ===== 左：合法组表 ===== -->
  <text x="60" y="56" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">预处理：C(4,2)=6 个候选，1 个因重复被剔</text>

  <text x="66" y="80" font-size="9.5" fill="#888" filter="url(#rough2)">下标对</text>
  <text x="130" y="80" font-size="9.5" fill="#888" filter="url(#rough2)">值</text>
  <text x="182" y="80" font-size="9.5" fill="#888" filter="url(#rough2)">inc</text>
  <text x="228" y="80" font-size="9.5" fill="#888" filter="url(#rough2)">桶 b</text>

  <rect x="60" y="88" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="66" y="102" font-size="10" fill="#333" filter="url(#rough2)">{0,1}</text>
  <text x="130" y="102" font-size="10" fill="#333" filter="url(#rough2)">{1,2}</text>
  <text x="182" y="102" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="228" y="102" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <rect x="60" y="108" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="66" y="122" font-size="10" fill="#333" filter="url(#rough2)">{0,2}</text>
  <text x="130" y="122" font-size="10" fill="#333" filter="url(#rough2)">{1,1}</text>
  <text x="182" y="122" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">重复 ✗</text>
  <text x="232" y="122" font-size="10" fill="#999" filter="url(#rough2)">—</text>

  <rect x="60" y="128" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="66" y="142" font-size="10" fill="#333" filter="url(#rough2)">{0,3}</text>
  <text x="130" y="142" font-size="10" fill="#333" filter="url(#rough2)">{1,4}</text>
  <text x="182" y="142" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="228" y="142" font-size="10" fill="#333" filter="url(#rough2)">0</text>

  <rect x="60" y="148" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="66" y="162" font-size="10" fill="#333" filter="url(#rough2)">{1,2}</text>
  <text x="130" y="162" font-size="10" fill="#333" filter="url(#rough2)">{2,1}</text>
  <text x="182" y="162" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="228" y="162" font-size="10" fill="#333" filter="url(#rough2)">1</text>

  <rect x="60" y="168" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="66" y="182" font-size="10" fill="#333" filter="url(#rough2)">{1,3}</text>
  <text x="130" y="182" font-size="10" fill="#333" filter="url(#rough2)">{2,4}</text>
  <text x="182" y="182" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="228" y="182" font-size="10" fill="#333" filter="url(#rough2)">1</text>

  <rect x="60" y="188" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="66" y="202" font-size="10" fill="#333" filter="url(#rough2)">{2,3}</text>
  <text x="130" y="202" font-size="10" fill="#333" filter="url(#rough2)">{1,4}</text>
  <text x="182" y="202" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="228" y="202" font-size="10" fill="#333" filter="url(#rough2)">2</text>

  <text x="60" y="228" font-size="9.5" fill="#888" filter="url(#rough2)">groups[0] = [{0,1}→1, {0,3}→3]；groups[1] = [{1,2}→1, {1,3}→2]；groups[2] = [{2,3}→3]</text>

  <!-- ===== 右：DP 说明 ===== -->
  <rect x="300" y="60" width="220" height="168" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="314" y="82" font-size="11" fill="#7a5415" font-weight="bold" filter="url(#rough2)">DP 只走「可达」状态</text>
  <text x="314" y="104" font-size="10" fill="#666" filter="url(#rough2)">① mask=0000：dp=0，b=0</text>
  <text x="314" y="120" font-size="10" fill="#666" filter="url(#rough2)">   枚举桶 0 的两组</text>
  <text x="314" y="142" font-size="10" fill="#666" filter="url(#rough2)">② mask=0011：dp=1，b=2</text>
  <text x="314" y="158" font-size="10" fill="#666" filter="url(#rough2)">   桶 2 只有 {2,3}</text>
  <text x="314" y="180" font-size="10" fill="#666" filter="url(#rough2)">③ mask=1001：dp=3，b=1</text>
  <text x="314" y="196" font-size="10" fill="#666" filter="url(#rough2)">   桶 1 两组，其一撞车</text>
  <text x="314" y="218" font-size="9.5" fill="#999" filter="url(#rough2)">其余 12 个 mask 全程 dp=∞，直接跳过</text>

  <!-- ===== 下：转移链 ===== -->
  <text x="280" y="266" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">转移链（格子从左到右为下标 3,2,1,0）</text>

  <!-- state 0000 -->
  <text x="96" y="292" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[0000] = 0</text>
  <g filter="url(#rough2)">
    <rect x="60" y="300" width="18" height="18" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="78" y="300" width="18" height="18" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="96" y="300" width="18" height="18" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="114" y="300" width="18" height="18" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="69" y="313" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="87" y="313" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="105" y="313" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="123" y="313" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>

  <!-- arrow to 0011 -->
  <path d="M 140,310 Q 200,290 268,310" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="204" y="292" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">选组 {0,1}，inc=1</text>

  <!-- arrow to 1001 -->
  <path d="M 140,310 Q 200,352 268,394" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="190" y="366" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">选组 {0,3}，inc=3</text>

  <!-- state 0011 -->
  <text x="330" y="292" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[0011] = 1</text>
  <g filter="url(#rough2)">
    <rect x="294" y="300" width="18" height="18" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="312" y="300" width="18" height="18" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="330" y="300" width="18" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="348" y="300" width="18" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="303" y="313" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="321" y="313" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="339" y="313" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="357" y="313" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="330" y="334" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">b = ctz(1100) = 2 → 桶 2</text>

  <!-- state 1001 -->
  <text x="330" y="376" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[1001] = 3</text>
  <g filter="url(#rough2)">
    <rect x="294" y="384" width="18" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="312" y="384" width="18" height="18" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="330" y="384" width="18" height="18" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="348" y="384" width="18" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="303" y="397" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="321" y="397" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="339" y="397" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="357" y="397" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="330" y="418" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">b = ctz(0110) = 1 → 桶 1</text>

  <!-- 0011 -> 1111 -->
  <path d="M 374,309 Q 440,300 486,308" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="296" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">组 {2,3}，inc=3 → 1+3=4</text>

  <!-- 1001 -> 1111 ok -->
  <path d="M 374,393 Q 440,384 486,378" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="412" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">组 {1,2}，inc=1 → 3+1=4</text>

  <!-- 1001 -> 1111 rejected -->
  <path d="M 374,400 Q 448,444 490,392" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="452" y="452" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">组 {1,3}：g &amp; mask ≠ 0 ✗ 跳过</text>

  <!-- state 1111 -->
  <text x="520" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dp[1111]</text>
  <g filter="url(#rough2)">
    <rect x="486" y="300" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="504" y="300" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="522" y="300" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="540" y="300" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="495" y="313" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="513" y="313" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="531" y="313" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="549" y="313" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- ===== 结论框 ===== -->
  <rect x="60" y="472" width="500" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="496" text-anchor="middle" font-size="12" fill="#2e5e2e" font-weight="bold" filter="url(#rough2)">dp[1111] = min(1+3, 3+1) = 4 ✓</text>
  <text x="280" y="518" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">两条路恰好同价：划分 [1,2]+[1,4] 与 [1,4]+[1,2] 的顺序变体只被计一次</text>
</svg>
