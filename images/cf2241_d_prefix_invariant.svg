<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="452" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每次操作只把前缀和往上抬：ΔS = 0 或 +1，绝不为负</text>
  <path d="M 132 40 Q 380 47 630 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="46" width="350" height="200" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="70" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A. 样例 2 的一次操作：取 l = 2, r = 4</text>
  <text x="98" y="88" text-anchor="middle" font-size="10.5" fill="#6b7f92" filter="url(#rough2)">i=1</text>
  <text x="160" y="88" text-anchor="middle" font-size="10.5" fill="#6b7f92" filter="url(#rough2)">i=2</text>
  <text x="222" y="88" text-anchor="middle" font-size="10.5" fill="#6b7f92" filter="url(#rough2)">i=3</text>
  <text x="284" y="88" text-anchor="middle" font-size="10.5" fill="#6b7f92" filter="url(#rough2)">i=4</text>
  <text x="44" y="118" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a</text>
  <rect x="74" y="94" width="48" height="36" rx="5" fill="#ffffff" stroke="#8fa8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="98" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="136" y="94" width="48" height="36" rx="5" fill="#ffffff" stroke="#8fa8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="198" y="94" width="48" height="36" rx="5" fill="#ffffff" stroke="#8fa8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="222" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <rect x="260" y="94" width="48" height="36" rx="5" fill="#ffffff" stroke="#8fa8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="284" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="44" y="160" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">Δ</text>
  <rect x="74" y="136" width="48" height="36" rx="5" fill="#fff8e1" stroke="#8fa8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="98" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">·</text>
  <rect x="136" y="136" width="48" height="36" rx="5" fill="#fff8e1" stroke="#8fa8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">+1</text>
  <rect x="198" y="136" width="48" height="36" rx="5" fill="#fff8e1" stroke="#8fa8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="222" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">-1</text>
  <rect x="260" y="136" width="48" height="36" rx="5" fill="#fff8e1" stroke="#8fa8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="284" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">+1</text>
  <text x="44" y="202" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a′</text>
  <rect x="74" y="178" width="48" height="36" rx="5" fill="#e6f4ea" stroke="#8fa8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="98" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="136" y="178" width="48" height="36" rx="5" fill="#e6f4ea" stroke="#8fa8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <rect x="198" y="178" width="48" height="36" rx="5" fill="#e6f4ea" stroke="#8fa8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="222" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="260" y="178" width="48" height="36" rx="5" fill="#e6f4ea" stroke="#8fa8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="284" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="46" y="236" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">i−l = 0,1,2：偶数位置 +1，奇数位置 −1。</text>
  <path d="M 386 146 L 410 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="418" y="46" width="312" height="200" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="434" y="70" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">B. 对前缀和 S_k 的影响</text>
  <path d="M 448 92 L 448 186" stroke="#7f8c8d" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 448 186 L 706 186" stroke="#7f8c8d" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 448 186 L 706 186" stroke="#2f5223" stroke-width="1.6" fill="none" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="710" y="190" font-size="10.5" fill="#2f5223" filter="url(#rough2)">S=0</text>
  <path d="M 448 122 L 706 122" stroke="#c8d6c0" stroke-width="1" fill="none" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <text x="434" y="126" font-size="10.5" fill="#5c7a52" filter="url(#rough2)">+1</text>
  <rect x="448" y="186" width="258" height="15" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <text x="420" y="198" font-size="10.5" fill="#b85450" filter="url(#rough2)">S&lt;0</text>
  <path d="M 448 186 L 520 122 L 592 186 L 664 122" stroke="#2f5223" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <circle cx="448" cy="186" r="4.2" fill="#ffffff" stroke="#2f5223" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="175" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">+0</text>
  <text x="448" y="216" text-anchor="middle" font-size="10.5" fill="#6b7f92" filter="url(#rough2)">k=1</text>
  <circle cx="520" cy="122" r="4.2" fill="#ffffff" stroke="#2f5223" stroke-width="2" filter="url(#rough2)"/>
  <text x="520" y="111" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">+1</text>
  <text x="520" y="216" text-anchor="middle" font-size="10.5" fill="#6b7f92" filter="url(#rough2)">k=2</text>
  <circle cx="592" cy="186" r="4.2" fill="#ffffff" stroke="#2f5223" stroke-width="2" filter="url(#rough2)"/>
  <text x="592" y="175" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">+0</text>
  <text x="592" y="216" text-anchor="middle" font-size="10.5" fill="#6b7f92" filter="url(#rough2)">k=3</text>
  <circle cx="664" cy="122" r="4.2" fill="#ffffff" stroke="#2f5223" stroke-width="2" filter="url(#rough2)"/>
  <text x="664" y="111" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">+1</text>
  <text x="664" y="216" text-anchor="middle" font-size="10.5" fill="#6b7f92" filter="url(#rough2)">k=4</text>
  <text x="434" y="240" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">覆盖进前缀的偏移有 1,2,3 个 → 奇数个 +1、偶数个 0</text>
  <rect x="30" y="256" width="700" height="182" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="282" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">把「一次操作」翻译成对前缀和的贡献</text>
  <text x="46" y="310" font-size="12.5" fill="#7a5a1c" filter="url(#rough2)">区间 [l, r] 在位置 i 的增量是 (−1)^(i−l)。前缀和 S_k 只看得到 [l, min(k,r)] 这一截，</text>
  <text x="46" y="332" font-size="12.5" fill="#7a5a1c" filter="url(#rough2)">这一截的长度是 m = max(0, min(k,r) − l + 1)，于是</text>
  <text x="46" y="362" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">ΔS_k = 1（m 为奇数）　或　0（m 为偶数）　—— 永远 ≥ 0。</text>
  <text x="46" y="390" font-size="12.5" fill="#7a5a1c" filter="url(#rough2)">初始 S_k = 0，所以任何时刻都必有 S_k ≥ 0 —— 这是必要条件；反过来只要全部 S_k ≥ 0 就一定能做到（见图 2）。</text>
  <text x="46" y="412" font-size="12.5" fill="#7a5a1c" filter="url(#rough2)">于是判据只剩一行：<tspan font-weight="bold" fill="#2f5223">令 d = b − a，所有前缀和 Σ(i≤k) d_i ≥ 0 当且仅当 YES。</tspan></text>
</svg>
