<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：一次线性扫描填一张判定表</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">height = [1,2,3,4,5]，threshold = 2 → 答案 [3,4]</text>

  <rect x="60" y="62" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="95" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">下标 i</text>
  <rect x="136" y="62" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="179" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">height[i]</text>
  <rect x="228" y="62" width="106" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="281" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">左邻 height[i−1]</text>
  <rect x="340" y="62" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="383" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">左邻 &gt; 2 ?</text>
  <rect x="432" y="62" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="475" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">结论</text>

  <rect x="60" y="98" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="117" text-anchor="middle" font-size="11" fill="#666">0</text>
  <rect x="136" y="98" width="86" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="179" y="117" text-anchor="middle" font-size="11" fill="#666">1</text>
  <rect x="228" y="98" width="106" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="117" text-anchor="middle" font-size="10" fill="#999">无左邻</text>
  <rect x="340" y="98" width="86" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="383" y="117" text-anchor="middle" font-size="11" fill="#999">—</text>
  <rect x="432" y="98" width="86" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="117" text-anchor="middle" font-size="10.5" fill="#8a3a36">不稳定</text>

  <rect x="60" y="132" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="151" text-anchor="middle" font-size="11" fill="#666">1</text>
  <rect x="136" y="132" width="86" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="179" y="151" text-anchor="middle" font-size="11" fill="#666">2</text>
  <rect x="228" y="132" width="106" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="151" text-anchor="middle" font-size="11" fill="#666">1</text>
  <rect x="340" y="132" width="86" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="383" y="151" text-anchor="middle" font-size="11" fill="#666">否</text>
  <rect x="432" y="132" width="86" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="151" text-anchor="middle" font-size="10.5" fill="#8a3a36">不稳定</text>

  <rect x="60" y="166" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="185" text-anchor="middle" font-size="11" fill="#666">2</text>
  <rect x="136" y="166" width="86" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="179" y="185" text-anchor="middle" font-size="11" fill="#666">3</text>
  <rect x="228" y="166" width="106" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="185" text-anchor="middle" font-size="11" fill="#666">2</text>
  <rect x="340" y="166" width="86" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="383" y="185" text-anchor="middle" font-size="11" fill="#666">否</text>
  <rect x="432" y="166" width="86" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="185" text-anchor="middle" font-size="10.5" fill="#8a3a36">不稳定</text>

  <rect x="60" y="200" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="219" text-anchor="middle" font-size="11" fill="#666">3</text>
  <rect x="136" y="200" width="86" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="179" y="219" text-anchor="middle" font-size="11" fill="#666">4</text>
  <rect x="228" y="200" width="106" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="219" text-anchor="middle" font-size="11" fill="#666">3</text>
  <rect x="340" y="200" width="86" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="383" y="219" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>
  <rect x="432" y="200" width="86" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="475" y="219" text-anchor="middle" font-size="10.5" fill="#3a5a30">稳定 ✓</text>

  <rect x="60" y="234" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="253" text-anchor="middle" font-size="11" fill="#666">4</text>
  <rect x="136" y="234" width="86" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="179" y="253" text-anchor="middle" font-size="11" fill="#666">5</text>
  <rect x="228" y="234" width="106" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="281" y="253" text-anchor="middle" font-size="11" fill="#666">4</text>
  <rect x="340" y="234" width="86" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="383" y="253" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>
  <rect x="432" y="234" width="86" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="475" y="253" text-anchor="middle" font-size="10.5" fill="#3a5a30">稳定 ✓</text>

  <rect x="40" y="276" width="480" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#8a6a20">示例 2：[10,1,10,1,10]，threshold = 3 → 左邻 10 的两处胜出，答案 [1,3]</text>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#8a6a20">示例 3：threshold = 10 → 严格大于不成立，答案为空 []</text>
</svg>
