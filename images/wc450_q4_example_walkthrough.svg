<svg xmlns="http://www.w3.org/2000/svg" width="640" height="446" viewBox="0 0 640 446" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="530" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="446" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：同一棵树的两次查询</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="11.5" fill="#888">edges = [[0,1,2],[1,2,3],[1,3,5],[1,4,4],[2,5,6]]，以 0 为根：dist = [0,2,5,7,6,11]</text>

  <g filter="url(#sk)">
    <rect x="20" y="74" width="292" height="334" rx="10" fill="#fdf6f6" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
  <text x="166" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">查询 1：src1=2, src2=3, dest=4</text>

  <g stroke-width="1.3" fill="none" filter="url(#sk)">
    <line x1="66" y1="132" x2="166" y2="132" stroke="#bbb"/>
    <line x1="166" y1="132" x2="266" y2="132" stroke="#b85450" stroke-width="2.4"/>
    <line x1="166" y1="132" x2="236" y2="228" stroke="#b85450" stroke-width="2.4"/>
    <line x1="166" y1="132" x2="116" y2="228" stroke="#b85450" stroke-width="2.4"/>
    <line x1="116" y1="228" x2="66" y2="304" stroke="#bbb"/>
  </g>
  <g font-size="10.5" text-anchor="middle" font-family="monospace">
    <text x="116" y="124" fill="#999">2</text>
    <text x="216" y="124" fill="#b85450" font-weight="bold">4</text>
    <text x="214" y="174" fill="#b85450" font-weight="bold">5</text>
    <text x="128" y="172" fill="#b85450" font-weight="bold">3</text>
    <text x="84" y="264" fill="#999" text-anchor="end">6</text>
  </g>

  <g filter="url(#sk)">
    <circle cx="66" cy="132" r="16" fill="#f0f0f0" stroke="#888" stroke-width="1.6"/>
    <circle cx="166" cy="132" r="16" fill="#fff8ec" stroke="#c98a2b" stroke-width="2.2"/>
    <circle cx="266" cy="132" r="16" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <circle cx="236" cy="228" r="16" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/>
    <circle cx="116" cy="228" r="16" fill="#e8f0fe" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="66" cy="304" r="16" fill="#f0f0f0" stroke="#888" stroke-width="1.6"/>
    <circle cx="166" cy="132" r="22.5" fill="none" stroke="#c98a2b" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="66" y="137" fill="#666">0</text>
    <text x="166" y="137" fill="#7a5415">1</text>
    <text x="266" y="137" fill="#7a5415">4</text>
    <text x="236" y="233" fill="#2e6e2e">3</text>
    <text x="116" y="233" fill="#2b6e9e">2</text>
    <text x="66" y="309" fill="#666">5</text>
  </g>
  <text x="166" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">m = 1</text>
  <text x="166" y="338" text-anchor="middle" font-size="11" fill="#555">两两 LCA 全为 1（最深者即 m）</text>
  <text x="166" y="354" text-anchor="middle" font-size="11" fill="#555">d(2,3)=8　d(3,4)=9　d(4,2)=7</text>
  <g filter="url(#sk)">
    <rect x="61" y="362" width="210" height="30" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="166" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">(8 + 9 + 7) / 2 = 12</text>

  <g filter="url(#sk)">
    <rect x="328" y="74" width="292" height="334" rx="10" fill="#fdf6f6" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
  <text x="474" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">查询 2：src1=0, src2=2, dest=5</text>

  <g stroke-width="1.3" fill="none" filter="url(#sk)">
    <line x1="374" y1="132" x2="474" y2="132" stroke="#b85450" stroke-width="2.4"/>
    <line x1="474" y1="132" x2="574" y2="132" stroke="#bbb"/>
    <line x1="474" y1="132" x2="544" y2="228" stroke="#bbb"/>
    <line x1="474" y1="132" x2="424" y2="228" stroke="#b85450" stroke-width="2.4"/>
    <line x1="424" y1="228" x2="374" y2="304" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" font-family="monospace">
    <text x="424" y="124" fill="#b85450" font-weight="bold">2</text>
    <text x="524" y="124" fill="#999">4</text>
    <text x="522" y="174" fill="#999">5</text>
    <text x="462" y="174" fill="#b85450" font-weight="bold">3</text>
    <text x="392" y="264" fill="#b85450" font-weight="bold" text-anchor="end">6</text>
  </g>

  <g filter="url(#sk)">
    <circle cx="374" cy="132" r="16" fill="#e8f0fe" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="474" cy="132" r="16" fill="#f0f0f0" stroke="#888" stroke-width="1.6"/>
    <circle cx="574" cy="132" r="16" fill="#f0f0f0" stroke="#888" stroke-width="1.6"/>
    <circle cx="544" cy="228" r="16" fill="#f0f0f0" stroke="#888" stroke-width="1.6"/>
    <circle cx="424" cy="228" r="16" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/>
    <circle cx="374" cy="304" r="16" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <circle cx="424" cy="228" r="22.5" fill="none" stroke="#c98a2b" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold">
    <text x="374" y="137" fill="#2b6e9e">0</text>
    <text x="474" y="137" fill="#666">1</text>
    <text x="574" y="137" fill="#666">4</text>
    <text x="544" y="233" fill="#666">3</text>
    <text x="424" y="233" fill="#2e6e2e">2</text>
    <text x="374" y="309" fill="#7a5415">5</text>
  </g>
  <text x="455" y="233" text-anchor="start" font-size="11" font-weight="bold" fill="#7a5415">m = 2</text>
  <text x="474" y="338" text-anchor="middle" font-size="11" fill="#555">lca(0,2)=0　lca(2,5)=2　lca(0,5)=0</text>
  <text x="474" y="354" text-anchor="middle" font-size="11" fill="#555">d(0,2)=5　d(2,5)=6　d(0,5)=11</text>
  <g filter="url(#sk)">
    <rect x="369" y="362" width="210" height="30" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="474" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">(5 + 6 + 11) / 2 = 11</text>

  <text x="320" y="428" text-anchor="middle" font-size="11" fill="#888">红粗边 = 选中的子树（两条要求路径的并）　虚线双圈 = 中位点 m　蓝 = src1　绿 = src2　橙 = dest</text>
</svg>
