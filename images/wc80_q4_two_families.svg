<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：连续 A 的落点 = 2^k − 1，最优解只有两种范式</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">n 取最小的整数使 2^n − 1 ≥ t，于是 2^(n−1) − 1 &lt; t ≤ 2^n − 1</text>

  <circle cx="46" cy="108" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="113" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">①</text>

  <path d="M 80 108 L 462 108" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="100" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">n 个 A：位置 1 → 3 → … → 2^n − 1（冲过 t）</text>
  <rect x="480" y="96" width="28" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="494" y="112" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">R</text>

  <path d="M 466 152 L 350 152" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="7 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="408" y="144" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">反向补 2^n − 1 − t：代价 dp[2^n − 1 − t]</text>

  <path d="M 60 200 L 584 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <path d="M 80 192 L 80 208" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 235 192 L 235 208" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 340 192 L 340 208" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 470 192 L 470 208" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="222" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">0</text>
  <text x="235" y="222" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2^(n−1) − 1</text>
  <text x="340" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">t</text>
  <text x="470" y="222" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2^n − 1</text>

  <circle cx="46" cy="250" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="255" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">②</text>

  <path d="M 80 250 L 228 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="158" y="242" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">(n−1) 个 A：到 2^(n−1) − 1</text>

  <path d="M 232 292 L 158 292" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="7 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="200" y="284" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">R 后反向 j 个 A：退到 2^(n−1) − 2^j</text>

  <path d="M 150 334 L 332 334" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="248" y="326" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">再 R：剩 t − 2^(n−1) + 2^j，代价 dp[·]</text>

  <text x="310" y="376" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">两条路线都以一次 R 收尾，把「剩余位移」化为一个只与距离有关、且严格更小的子问题</text>
  <text x="310" y="396" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">j 的取值范围是 0 ≤ j ≤ n−2，即反向最多再冲 n−2 段，保证子问题下标 &lt; t</text>
</svg>
