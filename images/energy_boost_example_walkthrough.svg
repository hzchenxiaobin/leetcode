    <rect x="196" y="356" width="62" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="264" y="356" width="62" height="40" rx="5" fill="#d2eed8" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="332" y="356" width="62" height="40" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="400" y="356" width="62" height="40" rx="5" fill="#d2eed8" stroke="#4a8e4a" stroke-width="1.8"/>
