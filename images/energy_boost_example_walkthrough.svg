    <text x="227" y="381" fill="#b8860b">休0</text>
    <text x="295" y="381" fill="#2e6e2e">B·9</text>
    <text x="363" y="381" fill="#2e6e2e">B·9</text>
    <text x="431" y="381" fill="#2e6e2e">B·9</text>
    <text x="499" y="381" fill="#b8860b">休0</text>
  </g>
  <rect x="536" y="356" width="52" height="40" rx="5" fill="#d2e2f8" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <text x="562" y="381" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506b" filter="url(#sk)">A·5</text>
  <text x="612" y="382" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">＝ 37</text>
  <text x="60" y="436" font-size="11" fill="#444" filter="url(#sk)">两次切换各牺牲一小时仍最优（全程 B 只有 31）——转移天然支持任意次换道，无需特判</text>
