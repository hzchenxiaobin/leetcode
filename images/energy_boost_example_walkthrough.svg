  <g filter="url(#sk)"><path d="M 454 193 C 545 185 520 120 344 117" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)"/></g>
  <text x="552" y="155" font-size="10.5" fill="#b8860b" filter="url(#sk)">从 dpA[0]</text>
  <text x="552" y="171" font-size="10.5" fill="#b8860b" filter="url(#sk)">切换而来</text>

  <text x="60" y="252" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">最优方案（回溯 dpB[2]）：A(4) → 休整(0) → B(3)</text>
  <g filter="url(#sk)">
