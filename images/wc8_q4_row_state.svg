<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：一行的结果只由「行首单词下标」决定</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">cols 固定时，行首 i 确定 ⇒ 本行放几个词、下一行从哪开始全部确定</text>

  <g filter="url(#rough2)" font-size="10.5" fill="#666">
    <text x="86" y="78" text-anchor="middle" filter="url(#rough2)">行首 i</text>
    <text x="250" y="78" text-anchor="middle" filter="url(#rough2)">这一行能放下的内容</text>
    <text x="400" y="78" text-anchor="middle" filter="url(#rough2)">k</text>
    <text x="490" y="78" text-anchor="middle" filter="url(#rough2)">下一行 cur</text>
  </g>

  <g filter="url(#rough2)" font-size="11">
    <text x="86" y="113" text-anchor="middle" fill="#3a4a66" filter="url(#rough2)">i = 0</text>
    <rect x="150" y="94" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="250" y="114" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i had</text>
    <text x="400" y="113" text-anchor="middle" fill="#8a6a20" filter="url(#rough2)">2</text>
    <text x="490" y="113" text-anchor="middle" fill="#666" filter="url(#rough2)">(0+2) mod 4 = 2</text>

    <text x="86" y="153" text-anchor="middle" fill="#3a5a30" filter="url(#rough2)">i = 1</text>
    <rect x="150" y="134" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="250" y="154" text-anchor="middle" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">had</text>
    <text x="400" y="153" text-anchor="middle" fill="#8a6a20" filter="url(#rough2)">1</text>
    <text x="490" y="153" text-anchor="middle" fill="#666" filter="url(#rough2)">(1+1) mod 4 = 2</text>

    <text x="86" y="193" text-anchor="middle" fill="#3a4a66" filter="url(#rough2)">i = 2</text>
    <rect x="150" y="174" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="250" y="194" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">apple</text>
    <text x="400" y="193" text-anchor="middle" fill="#8a6a20" filter="url(#rough2)">1</text>
    <text x="490" y="193" text-anchor="middle" fill="#666" filter="url(#rough2)">(2+1) mod 4 = 3</text>

    <text x="86" y="233" text-anchor="middle" fill="#8a3a36" filter="url(#rough2)">i = 3</text>
    <rect x="150" y="214" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="250" y="234" text-anchor="middle" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">pie i</text>
    <text x="400" y="233" text-anchor="middle" fill="#8a6a20" filter="url(#rough2)">2</text>
    <text x="490" y="233" text-anchor="middle" fill="#666" filter="url(#rough2)">(3+2) mod 4 = 1</text>
  </g>

  <rect x="60" y="258" width="440" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="76" y="279" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">为什么状态只有 n 种</text>
    <text x="76" y="299" filter="url(#rough2)">行首下标 i ∈ [0, n)，每行至少放下 1 个词（前提是每个词都能放进一行），</text>
    <text x="76" y="317" filter="url(#rough2)">所以下一行行首 = (i + jump[i]) mod n，状态转移是一个出度为 1 的「函数图」。</text>
    <text x="76" y="335" filter="url(#rough2)">整块屏幕的铺排被压缩成 rows 次 O(1) 跳跃，T 就是这些 k 的累加。</text>
  </g>

  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">答案不是「每行放几个」的除法，而是 T 个词里包含多少遍完整句子：⌊T / n⌋</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例：n = 4，cols = 5，行首 0 时一行塞下 i、had，因此 k₀ = 2</text>
</svg>
