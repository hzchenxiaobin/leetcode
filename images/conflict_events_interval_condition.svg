<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">闭区间相交 ⟺ 两个端点不等式同时成立</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#666666" filter="url(#sk)">把「是否有公共时刻」翻译成端点比较，一次都不用遍历</text>

  <!-- 交集阴影区（先画，垫底） -->
  <g filter="url(#sk)">
    <rect x="185" y="86" width="80" height="112" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5,4"/>
  </g>

  <!-- 事件 1 横条 -->
  <g filter="url(#sk)">
    <rect x="140" y="90" width="125" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="202" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">事件 1</text>
  <text x="140" y="82" text-anchor="start" font-size="11" fill="#446688" filter="url(#sk)">01:00</text>
  <text x="265" y="82" text-anchor="end" font-size="11" fill="#446688" filter="url(#sk)">02:00</text>

  <!-- 时间轴 -->
  <path d="M 110 152 L 520 152" stroke="#777777" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <path d="M 140 147 L 140 157" stroke="#777777" stroke-width="1.2"/>
    <path d="M 185 147 L 185 157" stroke="#777777" stroke-width="1.2"/>
    <path d="M 265 147 L 265 157" stroke="#777777" stroke-width="1.2"/>
    <path d="M 430 147 L 430 157" stroke="#777777" stroke-width="1.2"/>
  </g>
  <text x="140" y="174" text-anchor="middle" font-size="11" fill="#666666" filter="url(#sk)">01:00</text>
  <text x="185" y="174" text-anchor="middle" font-size="11" fill="#666666" filter="url(#sk)">01:20</text>
  <text x="265" y="174" text-anchor="middle" font-size="11" fill="#666666" filter="url(#sk)">02:00</text>
  <text x="430" y="174" text-anchor="middle" font-size="11" fill="#666666" filter="url(#sk)">03:00</text>

  <!-- 事件 2 横条 -->
  <g filter="url(#sk)">
    <rect x="185" y="186" width="245" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="307" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22" filter="url(#sk)">事件 2</text>
  <text x="185" y="230" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#sk)">01:20</text>
  <text x="430" y="230" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#sk)">03:00</text>

  <!-- 交集说明 -->
  <path d="M 300 96 Q 340 88 372 84" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">交集 [01:20, 02:00]</text>
  <text x="225" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415" filter="url(#sk)">交集非空 ⟹ 冲突！</text>

  <!-- 公式框 -->
  <g filter="url(#sk)">
    <rect x="70" y="268" width="500" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415" filter="url(#sk)">冲突 ⟺ s₁ ≤ e₂ 且 s₂ ≤ e₁</text>
  <text x="320" y="314" text-anchor="middle" font-size="11" fill="#8a6415" filter="url(#sk)">等价于 max(s₁, s₂) ≤ min(e₁, e₂)，交区间就是 [max(起), min(末)]</text>

  <!-- 三个小情形 -->
  <g filter="url(#sk)">
    <rect x="55" y="340" width="170" height="104" rx="8" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="80" y="360" width="52" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="106" y="380" width="52" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="106" y="356" width="26" height="40" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1" stroke-dasharray="4,3"/>
  </g>
  <text x="140" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">① 部分重叠</text>
  <text x="140" y="436" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#sk)">→ true</text>

  <g filter="url(#sk)">
    <rect x="235" y="340" width="170" height="104" rx="8" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="260" y="360" width="52" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="312" y="380" width="52" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <path d="M 312 352 L 312 402" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3"/>
  </g>
  <text x="320" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">② 端点相接 e₁ = s₂</text>
  <text x="320" y="436" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">闭区间含端点 → true</text>

  <g filter="url(#sk)">
    <rect x="415" y="340" width="170" height="104" rx="8" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="440" y="360" width="40" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="520" y="380" width="40" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="500" y="371" text-anchor="middle" font-size="10" fill="#b85450">e₁&lt;s₂</text>
  </g>
  <text x="500" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">③ 完全相离</text>
  <text x="500" y="436" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">→ false</text>
</svg>
