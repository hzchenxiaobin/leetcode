<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [5, 0, 1, 4]，k = 3</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">sufMin 从右往左一次递推；preMax 从左往右边扫边维护</text>

  <g filter="url(#rough2)" font-size="12">
    <rect x="60" y="54" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="140" y="54" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="220" y="54" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="300" y="54" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <text x="95" y="73" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="175" y="73" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="255" y="73" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="335" y="73" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="410" y="72" font-size="10.5" fill="#999" filter="url(#rough2)">下标 0 1 2 3</text>

  <g filter="url(#rough2)">
    <rect x="60" y="100" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="100" y="100" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="100" width="75" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="235" y="100" width="75" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="310" y="100" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="390" y="100" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="80" y="118" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="130" y="118" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="197" y="118" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">preMax</text>
  <text x="272" y="118" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">sufMin</text>
  <text x="350" y="118" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">不稳定值</text>
  <text x="445" y="118" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">判定（k = 3）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="126" width="40" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="100" y="126" width="60" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="160" y="126" width="75" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="235" y="126" width="75" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="310" y="126" width="80" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="390" y="126" width="110" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>

    <rect x="60" y="152" width="40" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="100" y="152" width="60" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="160" y="152" width="75" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="235" y="152" width="75" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="310" y="152" width="80" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="390" y="152" width="110" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>

    <rect x="60" y="178" width="40" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="100" y="178" width="60" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="160" y="178" width="75" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="235" y="178" width="75" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="310" y="178" width="80" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <rect x="390" y="178" width="110" height="26" fill="#ffffff" stroke="#999" stroke-width="1"/>

    <rect x="60" y="204" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="100" y="204" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="160" y="204" width="75" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="235" y="204" width="75" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="310" y="204" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="390" y="204" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>

  <g font-size="11.5" filter="url(#rough2)">
    <text x="80" y="144" text-anchor="middle" fill="#333">0</text>
    <text x="130" y="144" text-anchor="middle" fill="#333">5</text>
    <text x="197" y="144" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <text x="272" y="144" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="350" y="144" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <text x="445" y="144" text-anchor="middle" fill="#b85450" font-weight="bold">✗ 5 &gt; 3</text>

    <text x="80" y="170" text-anchor="middle" fill="#333">1</text>
    <text x="130" y="170" text-anchor="middle" fill="#333">0</text>
    <text x="197" y="170" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <text x="272" y="170" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="350" y="170" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <text x="445" y="170" text-anchor="middle" fill="#b85450" font-weight="bold">✗ 5 &gt; 3</text>

    <text x="80" y="196" text-anchor="middle" fill="#333">2</text>
    <text x="130" y="196" text-anchor="middle" fill="#333">1</text>
    <text x="197" y="196" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <text x="272" y="196" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="350" y="196" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <text x="445" y="196" text-anchor="middle" fill="#b85450" font-weight="bold">✗ 4 &gt; 3</text>

    <text x="80" y="223" text-anchor="middle" fill="#2f5530" font-weight="bold">3</text>
    <text x="130" y="223" text-anchor="middle" fill="#2f5530" font-weight="bold">4</text>
    <text x="197" y="223" text-anchor="middle" fill="#2f5530" font-weight="bold">5</text>
    <text x="272" y="223" text-anchor="middle" fill="#2f5530" font-weight="bold">4</text>
    <text x="350" y="223" text-anchor="middle" fill="#2f5530" font-weight="bold">1</text>
    <text x="445" y="223" text-anchor="middle" fill="#2f5530" font-weight="bold">✓ 1 ≤ 3 ← 答案</text>
  </g>

  <text x="60" y="258" font-size="10.5" fill="#555" filter="url(#rough2)">sufMin 递推：sufMin[3]=4 → min(1,4)=1 → min(0,1)=0 → min(5,0)=0</text>

  <rect x="60" y="272" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#2f5530" font-weight="bold" filter="url(#rough2)">i = 3 首次满足 preMax − sufMin ≤ k → 返回 3</text>

  <text x="60" y="330" font-size="10.5" fill="#b85450" filter="url(#rough2)">示例 2：nums = [3,2,1], k = 1，三个下标不稳定值均为 3−1 = 2 &gt; 1 → 返回 −1</text>
</svg>
