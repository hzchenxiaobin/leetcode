<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">路径会爆炸，状态会合并</text>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">处理元素 2 时，三个不同状态经三种操作汇入同一状态</text>

  <rect x="30" y="84" width="120" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0,0,0) : 1</text>
  <rect x="30" y="148" width="120" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1,0,0) : 1</text>
  <rect x="30" y="212" width="120" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(−1,0,0) : 1</text>

  <path d="M154,102 L342,158" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="116" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">不变</text>
  <path d="M154,166 L342,166" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="158" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">÷2</text>
  <path d="M154,230 L342,174" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="224" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">×2</text>

  <rect x="350" y="144" width="130" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="415" y="164" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(0,0,0)</text>
  <text x="415" y="181" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">cnt = 1+1+1 = 3</text>
  <text x="415" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">三条路径汇入，计数相加</text>

  <rect x="30" y="258" width="210" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">逐条枚举操作序列</text>
  <text x="135" y="305" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">3¹⁹ ≈ 1.16×10⁹ 条</text>

  <text x="260" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#666" filter="url(#rough2)">VS</text>

  <rect x="280" y="258" width="210" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="385" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">只在指数状态上做 DP</text>
  <text x="385" y="305" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">≤ 77×39×39 ≈ 1.2×10⁵ 个</text>
</svg>
