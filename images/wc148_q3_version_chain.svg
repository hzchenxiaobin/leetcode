<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">快照数组：把「整份复制」换成「按下标记版本」</text>
  <text x="310" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个下标拥有一条按时间递增的版本链；snap 只负责给时间轴刻刻度</text>

  <rect x="30" y="72" width="272" height="200" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="96" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">暴力：每次 snap 复制整份数组</text>

  <text x="46" y="130" font-size="9" fill="#8a3a36" filter="url(#rough2)">snap 0</text>
  <rect x="100" y="112" width="44" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="122" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="148" y="112" width="44" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="170" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="196" y="112" width="44" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="218" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="244" y="112" width="44" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="266" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="46" y="162" font-size="9" fill="#8a3a36" filter="url(#rough2)">snap 1</text>
  <rect x="100" y="144" width="44" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="122" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="148" y="144" width="44" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="170" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="196" y="144" width="44" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="218" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="244" y="144" width="44" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="266" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="46" y="194" font-size="9" fill="#8a3a36" filter="url(#rough2)">snap 2</text>
  <rect x="100" y="176" width="44" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="122" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="148" y="176" width="44" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="170" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="196" y="176" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="218" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="244" y="176" width="44" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="266" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="46" y="222" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">每个快照都复制 length 个元素</text>
  <text x="46" y="240" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">总代价 O(length × snap 次数)</text>
  <text x="46" y="258" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">5·10^4 × 5·10^4 ≈ 2.5·10^9，必超时</text>

  <rect x="318" y="72" width="272" height="200" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="334" y="96" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">正解：每个下标一条版本链</text>

  <text x="334" y="126" font-size="9" fill="#3a5a30" filter="url(#rough2)">下标 0</text>
  <rect x="380" y="108" width="62" height="28" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="411" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(0, 5)</text>
  <rect x="450" y="108" width="62" height="28" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="481" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(1, 6)</text>
  <rect x="520" y="108" width="62" height="28" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="551" y="127" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(3, 9)</text>

  <text x="334" y="168" font-size="9" fill="#3a5a30" filter="url(#rough2)">下标 1</text>
  <rect x="380" y="150" width="62" height="28" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="411" y="169" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(2, 7)</text>
  <rect x="450" y="150" width="62" height="28" rx="5" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="481" y="169" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>

  <text x="334" y="210" font-size="9" fill="#3a5a30" filter="url(#rough2)">下标 2</text>
  <rect x="380" y="192" width="62" height="28" rx="5" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="411" y="211" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">空</text>
  <text x="452" y="211" font-size="9" fill="#666" filter="url(#rough2)">从未 set ⇒ 各快照恒为 0</text>

  <text x="334" y="246" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">set 只在链尾追加 O(1)，snap 只把编号 +1</text>

  <path d="M 300 178 L 316 178" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="290" width="560" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="312" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">get(index, snap_id) 怎么查</text>
  <text x="46" y="332" font-size="10" fill="#555" filter="url(#rough2)">在 his[index] 上二分，取 stamp ≤ snap_id 的最后一个版本</text>
  <text x="46" y="351" font-size="10" fill="#555" filter="url(#rough2)">找不到就说明该下标在那一刻还没被写过，返回初始值 0</text>
  <text x="46" y="370" font-size="10" fill="#555" filter="url(#rough2)">链上 stamp 严格递增 ⇒ 二分成立，代价 O(log 写入次数)</text>

  <text x="310" y="404" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">示例：set(0,5)、snap→0、set(0,6)、snap→1、set(0,9)、snap→2；get(0,1) = 6</text>
</svg>
