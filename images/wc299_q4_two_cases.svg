<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="470" fill="#fdfcf7"/>
  <text x="330" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">两条断点只有两种拓扑：平行（不相交）/ 嵌套（祖先）</text>
  <path d="M 150 34 Q 330 42 510 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 情形 A 面板 -->
  <g filter="url(#sk)"><rect x="30" y="56" width="295" height="334" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="177" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e">情形 A：断点平行（子树不相交）</text>

  <!-- 迷你树 -->
  <g filter="url(#sk)">
    <path d="M 150 132 L 95 195" stroke="#7a8ba0" stroke-width="1.6" fill="none"/>
    <path d="M 150 132 L 205 195" stroke="#7a8ba0" stroke-width="1.6" fill="none"/>
    <path d="M 95 195 L 70 255" stroke="#7a8ba0" stroke-width="1.6" fill="none"/>
    <path d="M 205 195 L 230 255" stroke="#7a8ba0" stroke-width="1.6" fill="none"/>
  </g>
  <g filter="url(#sk)"><rect x="45" y="170" width="66" height="108" rx="10" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4"/></g>
  <text x="78" y="296" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e">subtree(i)</text>
  <g filter="url(#sk)"><rect x="192" y="170" width="66" height="108" rx="10" fill="none" stroke="#4a8edb" stroke-width="2" stroke-dasharray="6 4"/></g>
  <text x="225" y="296" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">subtree(j)</text>

  <g filter="url(#sk)"><circle cx="150" cy="132" r="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="150" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">0</text>
  <g filter="url(#sk)"><circle cx="95" cy="195" r="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="95" y="199" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">i</text>
  <g filter="url(#sk)"><circle cx="205" cy="195" r="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="205" y="199" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">j</text>
  <g filter="url(#sk)"><circle cx="70" cy="255" r="11" fill="#fdfcf7" stroke="#7a8ba0" stroke-width="1.4"/></g>
  <text x="70" y="259" text-anchor="middle" font-size="10" fill="#555">•</text>
  <g filter="url(#sk)"><circle cx="230" cy="255" r="11" fill="#fdfcf7" stroke="#7a8ba0" stroke-width="1.4"/></g>
  <text x="230" y="259" text-anchor="middle" font-size="10" fill="#555">•</text>

  <g filter="url(#sk)"><rect x="45" y="306" width="265" height="52" rx="6" fill="#fdfcf7" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="177" y="326" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e2e">三分量 XOR =</text>
  <text x="177" y="346" text-anchor="middle" font-size="11" font-family="monospace" font-weight="bold" fill="#2e5e2e">( xor[i], xor[j], total⊕xor[i]⊕xor[j] )</text>
  <text x="177" y="374" text-anchor="middle" font-size="10.5" fill="#555">各摘一棵 ⇒ 第三段 = 全树去掉两棵</text>

  <!-- 情形 B 面板 -->
  <g filter="url(#sk)"><rect x="335" y="56" width="295" height="334" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="482" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">情形 B：断点嵌套（i 是 j 的祖先）</text>

  <!-- 迷你树 -->
  <g filter="url(#sk)">
    <path d="M 482 132 L 482 195" stroke="#7a8ba0" stroke-width="1.6" fill="none"/>
    <path d="M 482 195 L 440 255" stroke="#7a8ba0" stroke-width="1.6" fill="none"/>
    <path d="M 482 195 L 535 255" stroke="#7a8ba0" stroke-width="1.6" fill="none"/>
  </g>
  <g filter="url(#sk)"><rect x="410" y="170" width="150" height="110" rx="10" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4"/></g>
  <text x="553" y="186" text-anchor="end" font-size="10.5" font-weight="bold" fill="#b07818">subtree(i)</text>
  <g filter="url(#sk)"><rect x="418" y="232" width="44" height="46" rx="10" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4"/></g>
  <text x="440" y="298" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a04a48">subtree(j)</text>

  <g filter="url(#sk)"><circle cx="482" cy="132" r="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="482" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">0</text>
  <g filter="url(#sk)"><circle cx="482" cy="195" r="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="482" y="199" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">i</text>
  <g filter="url(#sk)"><circle cx="440" cy="255" r="13" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="440" y="259" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">j</text>
  <g filter="url(#sk)"><circle cx="535" cy="255" r="11" fill="#fdfcf7" stroke="#7a8ba0" stroke-width="1.4"/></g>
  <text x="535" y="259" text-anchor="middle" font-size="10" fill="#555">•</text>

  <g filter="url(#sk)"><rect x="350" y="306" width="265" height="52" rx="6" fill="#fdfcf7" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="482" y="326" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">三分量 XOR =</text>
  <text x="482" y="346" text-anchor="middle" font-size="11" font-family="monospace" font-weight="bold" fill="#7a5415">( xor[j], xor[i]⊕xor[j], total⊕xor[i] )</text>
  <text x="482" y="374" text-anchor="middle" font-size="10.5" fill="#555">摘 j 藏在 i 内 ⇒ 中段 = xor[i] 再抠掉 xor[j]</text>

  <!-- 底部结论条 -->
  <g filter="url(#sk)"><rect x="30" y="402" width="600" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="330" y="423" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04a48">引理：任意两棵子树要么不相交、要么一棵真包含另一棵 —— 祖先链是全序</text>
  <text x="330" y="443" text-anchor="middle" font-size="11.5" fill="#a04a48">不存在「部分重叠」；断点对的拓扑一锤定音三分量公式，每对 O(1)</text>
</svg>
