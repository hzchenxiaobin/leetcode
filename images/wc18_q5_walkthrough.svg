<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：score = [10, 3, 8, 9, 4]</text>
  <path d="M 130 40 Q 360 50 590 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="14" y="82" font-size="11" fill="#8a6415" font-weight="bold" filter="url(#sk)">降序</text>
  <text x="14" y="97" font-size="9.5" fill="#7a7a7a" filter="url(#sk)">排序结果</text>

  <g filter="url(#sk)">
    <rect x="86" y="56" width="100" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="198" y="56" width="100" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="310" y="56" width="100" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="422" y="56" width="100" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="534" y="56" width="100" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="136" y="76" text-anchor="middle" font-size="13" fill="#8a6415">10</text>
  <text x="248" y="76" text-anchor="middle" font-size="13" fill="#8a6415">9</text>
  <text x="360" y="76" text-anchor="middle" font-size="13" fill="#8a6415">8</text>
  <text x="472" y="76" text-anchor="middle" font-size="13" fill="#8a6415">4</text>
  <text x="584" y="76" text-anchor="middle" font-size="13" fill="#8a6415">3</text>
  <text x="136" y="93" text-anchor="middle" font-size="9.5" fill="#a8873c">i0 · rank1</text>
  <text x="248" y="93" text-anchor="middle" font-size="9.5" fill="#a8873c">i3 · rank2</text>
  <text x="360" y="93" text-anchor="middle" font-size="9.5" fill="#a8873c">i2 · rank3</text>
  <text x="472" y="93" text-anchor="middle" font-size="9.5" fill="#a8873c">i4 · rank4</text>
  <text x="584" y="93" text-anchor="middle" font-size="9.5" fill="#a8873c">i1 · rank5</text>

  <path d="M 360 102 L 360 122" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="372" y="118" font-size="10.5" fill="#446688" filter="url(#sk)">按原下标回填 → 得到 answer</text>

  <g filter="url(#sk)">
    <rect x="60" y="128" width="600" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="60" y="128" width="90" height="36" fill="none" stroke="#446688" stroke-width="1.3"/>
    <rect x="150" y="128" width="130" height="36" fill="none" stroke="#446688" stroke-width="1.3"/>
    <rect x="280" y="128" width="160" height="36" fill="none" stroke="#446688" stroke-width="1.3"/>
    <rect x="440" y="128" width="220" height="36" fill="none" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="105" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">下标 i</text>
  <text x="215" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">得分</text>
  <text x="360" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">名次（降序位置）</text>
  <text x="550" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">answer[i]</text>

  <g filter="url(#sk)">
    <rect x="60" y="164" width="600" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="60" y="204" width="600" height="40" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.1"/>
    <rect x="60" y="244" width="600" height="40" fill="#f7f7f7" stroke="#b0b0b0" stroke-width="1.1"/>
    <rect x="60" y="284" width="600" height="40" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.1"/>
    <rect x="60" y="324" width="600" height="40" fill="#f7f7f7" stroke="#b0b0b0" stroke-width="1.1"/>
    <path d="M 150 164 L 150 364" stroke="#b0b0b0" stroke-width="1.1"/>
    <path d="M 280 164 L 280 364" stroke="#b0b0b0" stroke-width="1.1"/>
    <path d="M 440 164 L 440 364" stroke="#b0b0b0" stroke-width="1.1"/>
  </g>

  <text x="105" y="189" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="215" y="189" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="360" y="189" text-anchor="middle" font-size="12" fill="#8a6415">1</text>
  <text x="550" y="189" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5a24">Gold Medal</text>

  <text x="105" y="229" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="215" y="229" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="360" y="229" text-anchor="middle" font-size="12" fill="#8a6415">5</text>
  <text x="550" y="229" text-anchor="middle" font-size="12" fill="#333">"5"</text>

  <text x="105" y="269" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="215" y="269" text-anchor="middle" font-size="12" fill="#333">8</text>
  <text x="360" y="269" text-anchor="middle" font-size="12" fill="#8a6415">3</text>
  <text x="550" y="269" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5a24">Bronze Medal</text>

  <text x="105" y="309" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="215" y="309" text-anchor="middle" font-size="12" fill="#333">9</text>
  <text x="360" y="309" text-anchor="middle" font-size="12" fill="#8a6415">2</text>
  <text x="550" y="309" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5a24">Silver Medal</text>

  <text x="105" y="349" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="215" y="349" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="360" y="349" text-anchor="middle" font-size="12" fill="#8a6415">4</text>
  <text x="550" y="349" text-anchor="middle" font-size="12" fill="#333">"4"</text>

  <g filter="url(#sk)">
    <rect x="60" y="378" width="600" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="360" y="403" text-anchor="middle" font-size="11.5" fill="#8a6415">答案顺序跟着原下标：只有第 4 名之后才写数字，名次 1~3 换成奖牌单词</text>
</svg>
