<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：小球在两侧「最近的正数」之间往复弹跳</text>
  <path d="M 190 38 Q 340 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- bounce arrows above cells -->
  <text x="245" y="52" text-anchor="end" font-size="10.5" fill="#b03a3a">② 撞 q：值−1，反向向右</text>
  <g filter="url(#sk)">
    <path d="M 432 68 Q 342 28 252 68" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 312 92 Q 372 58 432 92" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#aro)"/>
  </g>
  <text x="442" y="84" font-size="10.5" fill="#7a5415">① 撞 p：值−1，反向向左</text>

  <!-- array cells -->
  <g filter="url(#sk)">
    <rect x="163" y="100" width="58" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="223" y="100" width="58" height="44" rx="4" fill="#eaf6ee" stroke="#b85450" stroke-width="2.5"/>
    <rect x="283" y="100" width="58" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <rect x="343" y="100" width="58" height="44" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="403" y="100" width="58" height="44" rx="4" fill="#e8f0fa" stroke="#b85450" stroke-width="2.5"/>
    <rect x="463" y="100" width="58" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="192" y="128" text-anchor="middle" font-size="14" fill="#2e6e2e">3</text>
  <text x="252" y="128" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">1</text>
  <text x="312" y="128" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold">0</text>
  <text x="372" y="128" text-anchor="middle" font-size="14" fill="#888">0</text>
  <text x="432" y="128" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">2</text>
  <text x="492" y="128" text-anchor="middle" font-size="14" fill="#2b6e9e">4</text>

  <!-- indices + point labels -->
  <text x="192" y="160" text-anchor="middle" font-size="9.5" fill="#999">0</text>
  <text x="252" y="160" text-anchor="middle" font-size="9.5" fill="#999">1</text>
  <text x="312" y="160" text-anchor="middle" font-size="9.5" fill="#999">2</text>
  <text x="372" y="160" text-anchor="middle" font-size="9.5" fill="#999">3</text>
  <text x="432" y="160" text-anchor="middle" font-size="9.5" fill="#999">4</text>
  <text x="492" y="160" text-anchor="middle" font-size="9.5" fill="#999">5</text>
  <text x="252" y="176" text-anchor="middle" font-size="10.5" fill="#b03a3a">q（左侧最近正数）</text>
  <text x="312" y="176" text-anchor="middle" font-size="10.5" fill="#7a5415">起点</text>
  <text x="432" y="176" text-anchor="middle" font-size="10.5" fill="#b03a3a">p（右侧最近正数）</text>

  <!-- side brackets -->
  <g filter="url(#sk)">
    <path d="M 163 188 L 163 198 L 281 198 L 281 188" stroke="#4a8e4a" stroke-width="1.4" fill="none"/>
  </g>
  <text x="222" y="216" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">左侧和 SL = 3+1 = 4</text>
  <g filter="url(#sk)">
    <path d="M 403 188 L 403 198 L 521 198 L 521 188" stroke="#4a8edb" stroke-width="1.4" fill="none"/>
  </g>
  <text x="462" y="216" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">右侧和 SR = 2+4 = 6</text>

  <!-- alternating hit chain -->
  <text x="60" y="246" font-size="12.5" font-weight="bold" fill="#2b2b2b">碰撞序列（向右出发）：严格左右交替，每撞一次该侧剩余和 −1</text>
  <g filter="url(#sk)">
    <rect x="90" y="258" width="76" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="128" y="280" text-anchor="middle" font-size="11" fill="#2b6e9e">撞R：SR−1</text>
  <g filter="url(#sk)">
    <rect x="190" y="258" width="76" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="228" y="280" text-anchor="middle" font-size="11" fill="#2e6e2e">撞L：SL−1</text>
  <g filter="url(#sk)">
    <rect x="290" y="258" width="76" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="328" y="280" text-anchor="middle" font-size="11" fill="#2b6e9e">撞R：SR−1</text>
  <g filter="url(#sk)">
    <rect x="390" y="258" width="76" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="428" y="280" text-anchor="middle" font-size="11" fill="#2e6e2e">撞L：SL−1</text>
  <text x="486" y="280" font-size="16" fill="#666">⋯</text>
  <g filter="url(#sk)">
    <path d="M 168 275 L 186 275" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
    <path d="M 268 275 L 286 275" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
    <path d="M 368 275 L 386 275" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
    <path d="M 468 275 L 480 275" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- insight box -->
  <g filter="url(#sk)">
    <rect x="40" y="330" width="600" height="86" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="60" y="354" font-size="12.5" font-weight="bold" fill="#2b2b2b">关键不变量：</text>
  <text x="60" y="376" font-size="11" fill="#444">两个碰撞点（各自一侧「最近的未清零正数」）之间全是 0，因此每次碰撞后小球必然</text>
  <text x="60" y="394" font-size="11" fill="#444">穿过起点撞向另一侧。当某侧剩余和为 0 而小球正走向该侧时，小球越界，过程结束。</text>
  <text x="60" y="412" font-size="11" fill="#444">碰撞点被撞成 0 后，「外侧下一个正数」顶替成为新碰撞点，交替性保持不变。</text>
</svg>
