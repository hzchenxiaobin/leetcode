<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：只能「对半」拆 ⇒ 可达分段 = 一棵对半拆分树</text>

  <!-- Level 0: root -->
  <g filter="url(#rough2)">
    <rect x="200" y="44" width="160" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="280" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">整串 [0, n)</text>
    <text x="192" y="64" text-anchor="end" font-size="10.5" fill="#888">第 0 层 · 1 段</text>
  </g>

  <!-- edges level0 -> level1 -->
  <g filter="url(#rough2)">
    <path d="M 250 78 L 188 122" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
    <path d="M 310 78 L 372 122" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
  </g>

  <!-- Level 1 -->
  <g filter="url(#rough2)">
    <rect x="130" y="126" width="112" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="186" y="147" text-anchor="middle" font-size="12" fill="#333">[0, n/2)</text>
    <rect x="318" y="126" width="112" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="374" y="147" text-anchor="middle" font-size="12" fill="#333">[n/2, n)</text>
    <text x="122" y="146" text-anchor="end" font-size="10.5" fill="#888">第 1 层 · 2 段 · 段长 n/2</text>
  </g>

  <!-- edges level1 -> level2 -->
  <g filter="url(#rough2)">
    <path d="M 160 158 L 106 202" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)"/>
    <path d="M 214 158 L 166 202" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)"/>
    <path d="M 348 158 L 300 202" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)"/>
    <path d="M 402 158 L 358 202" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)"/>
  </g>

  <!-- Level 2 -->
  <g filter="url(#rough2)">
    <rect x="78" y="206" width="56" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="106" y="225" text-anchor="middle" font-size="9.5" fill="#333">[0, n/4)</text>
    <rect x="150" y="206" width="56" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="178" y="225" text-anchor="middle" font-size="9.5" fill="#333">[n/4, n/2)</text>
    <rect x="294" y="206" width="56" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="322" y="225" text-anchor="middle" font-size="9.5" fill="#333">[n/2, 3n/4)</text>
    <rect x="366" y="206" width="56" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="394" y="225" text-anchor="middle" font-size="9.5" fill="#333">[3n/4, n)</text>
    <text x="70" y="225" text-anchor="end" font-size="10.5" fill="#888">第 2 层 · 4 段 · 段长 n/4</text>
  </g>

  <!-- ellipsis -->
  <g filter="url(#rough2)">
    <text x="240" y="266" text-anchor="middle" font-size="11.5" fill="#888">⋯ 每层完美等分、恰好覆盖整串，直到段长变为奇数 ⋯</text>
  </g>

  <!-- side panel -->
  <g filter="url(#rough2)">
    <rect x="440" y="44" width="112" height="180" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="496" y="66" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold">段只有线性个！</text>
    <text x="496" y="88" text-anchor="middle" font-size="10" fill="#557">第 k 层：2^k 个段</text>
    <text x="496" y="106" text-anchor="middle" font-size="10" fill="#557">每段长 n / 2^k</text>
    <text x="496" y="124" text-anchor="middle" font-size="10" fill="#557">层存在 ⟺ 2^k | n</text>
    <text x="496" y="148" text-anchor="middle" font-size="10" fill="#557">总段数</text>
    <text x="496" y="166" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2^(ν₂(n)+1) − 1</text>
    <text x="496" y="184" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">≤ 2n − 1</text>
    <text x="496" y="208" text-anchor="middle" font-size="9.5" fill="#888">ν₂(n)：n 中因子 2 的个数</text>
  </g>

  <!-- bottom summary -->
  <g filter="url(#rough2)">
    <rect x="30" y="296" width="500" height="78" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="280" y="318" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">划分方案指数多（n = 1024 时约 10^181 种），但「不同的段」只有线性个</text>
    <text x="280" y="338" text-anchor="middle" font-size="11" fill="#444">n 为奇数 ⇒ 第一刀就切不了：答案 = 整段费用</text>
    <text x="280" y="358" text-anchor="middle" font-size="11" fill="#444">最坏 n = 65536 时也只有 131071 ≈ 2n 个段；n = 10^5 = 2^5·5^5 时仅 63 个段</text>
  </g>
</svg>
