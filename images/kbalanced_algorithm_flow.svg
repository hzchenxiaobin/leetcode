<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="530" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：一遍扫描 + 游程栈即时消解</text>

  <!-- 起点 -->
  <rect x="230" y="42" width="180" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="66" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">初始化：空游程栈 st</text>

  <path d="M320,80 L320,98" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 0：还有字符? -->
  <polygon points="320,102 424,132 320,162 216,132" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">还有字符 ?</text>

  <path d="M424,132 L486,132" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="455" y="124" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="490" y="110" width="134" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="557" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">拼接栈中游程</text>
  <text x="557" y="146" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">返回答案</text>

  <path d="M320,162 L320,184" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="178" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 判断 1：同字符? -->
  <polygon points="320,188 424,218 320,248 216,218" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="223" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">与栈顶游程同字符 ?</text>

  <path d="M424,218 L468,218 L468,266" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="210" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="396" y="270" width="228" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510" y="294" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">栈顶游程长度 +1（合并）</text>

  <path d="M320,248 L320,266" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="262" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="200" y="270" width="180" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="294" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">压入新游程 [c, 1]</text>

  <!-- 两支汇合 -->
  <path d="M320,308 L320,344" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M510,308 L510,326 L320,326" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- 判断 2：匹配? -->
  <polygon points="320,348 480,392 320,436 160,392" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">c = ')' 且栈顶 ')' 游程 = k</text>
  <text x="320" y="402" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">且下方 '(' 游程 ≥ k ?</text>

  <path d="M480,392 L494,392" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="487" y="384" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="498" y="354" width="136" height="96" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="566" y="376" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">消解！</text>
  <text x="566" y="396" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">')' 游程整段弹出</text>
  <text x="566" y="416" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">'(' 游程 − k</text>
  <text x="566" y="436" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">归零则一并移除</text>

  <!-- 否支与回环 -->
  <path d="M320,436 L320,492" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="332" y="452" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M566,450 L566,492 L70,492 L70,132 L212,132" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="484" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">处理下一字符</text>

  <text x="320" y="518" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">时间 O(n)：每字符 O(1) 判定，消解的总弹出量 ≤ 总压入量 · 空间 O(n)</text>
</svg>
