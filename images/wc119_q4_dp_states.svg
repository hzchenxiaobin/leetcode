<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 366" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="366" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">两个状态互相接力：奇 → 偶 → 奇 …</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">节点 (i, 奇) 与 (i, 偶) 各自只有一条出边，构成 DAG</text>
  <circle cx="60" cy="110" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/><text x="60" y="113.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">o0</text>
  <circle cx="60" cy="200" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/><text x="60" y="203.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">e0</text>
  <circle cx="156" cy="110" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/><text x="156" y="113.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">o1</text>
  <circle cx="156" cy="200" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/><text x="156" y="203.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">e1</text>
  <circle cx="252" cy="110" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/><text x="252" y="113.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">o2</text>
  <circle cx="252" cy="200" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/><text x="252" y="203.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">e2</text>
  <circle cx="348" cy="110" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/><text x="348" y="113.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">o3</text>
  <circle cx="348" cy="200" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/><text x="348" y="203.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">e3</text>
  <circle cx="444" cy="110" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/><text x="444" y="113.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">o4</text>
  <circle cx="444" cy="200" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/><text x="444" y="203.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">e4</text>
  <text x="60" y="84" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">奇</text>
  <text x="60" y="232" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">偶</text>
  <text x="156" y="84" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">奇</text>
  <text x="156" y="232" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">偶</text>
  <text x="252" y="84" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">奇</text>
  <text x="252" y="232" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">偶</text>
  <text x="348" y="84" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">奇</text>
  <text x="348" y="232" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">偶</text>
  <text x="444" y="84" font-size="10" fill="#446688" text-anchor="middle" filter="url(#rough2)">奇</text>
  <text x="444" y="232" font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">偶</text>
  <path d="M 80 110 L 136 110" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 80 200 L 136 200" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
