  <path d="M 272 200 L 328 200" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 368 110 L 424 110" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 368 200 L 424 200" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 90 130 L 130 180" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 150 180 L 190 130" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="120" y="168" font-size="9.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">落点</text>
  <rect x="30" y="254" width="500" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="275" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">canOdd[i] = nxtOdd[i] ≠ −1 且 canEven[nxtOdd[i]]</text>
  <rect x="30" y="294" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="315" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">canEven[i] = nxtEven[i] ≠ −1 且 canOdd[nxtEven[i]]</text>
  <text x="30" y="350" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">后继下标一定更大 ⇒ 从右往左递推，天然无环。</text>
