<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1,2,4,2,3,2]</text>
  <path d="M 170 42 Q 340 52 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Array on top -->
  <g filter="url(#sk)">
    <rect x="178" y="62" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="224" y="62" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="270" y="62" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="316" y="62" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="362" y="62" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="408" y="62" width="46" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g filter="url(#sk)">
    <text x="201" y="86" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="247" y="86" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">2</text>
    <text x="293" y="86" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">4</text>
    <text x="339" y="86" text-anchor="middle" font-size="14" fill="#b03a3a" font-weight="bold">2</text>
    <text x="385" y="86" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">3</text>
    <text x="431" y="86" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">2</text>
  </g>
  <g filter="url(#sk)">
    <text x="201" y="112" text-anchor="middle" font-size="10" fill="#888">i=0</text>
    <text x="247" y="112" text-anchor="middle" font-size="10" fill="#888">i=1</text>
    <text x="293" y="112" text-anchor="middle" font-size="10" fill="#888">i=2</text>
    <text x="339" y="112" text-anchor="middle" font-size="10" fill="#888">i=3</text>
    <text x="385" y="112" text-anchor="middle" font-size="10" fill="#888">i=4</text>
    <text x="431" y="112" text-anchor="middle" font-size="10" fill="#888">i=5</text>
  </g>
  <text x="170" y="86" text-anchor="end" font-size="11" fill="#666">绿=有效</text>
  <text x="170" y="104" text-anchor="end" font-size="11" fill="#666">红=无效</text>

  <!-- Walkthrough table -->
  <g filter="url(#sk)">
    <rect x="60" y="132" width="60" height="30" fill="#e8f0fa" stroke="#446688" stroke-width="1.3"/>
    <rect x="120" y="132" width="70" height="30" fill="#e8f0fa" stroke="#446688" stroke-width="1.3"/>
    <rect x="190" y="132" width="90" height="30" fill="#e8f0fa" stroke="#446688" stroke-width="1.3"/>
    <rect x="280" y="132" width="90" height="30" fill="#e8f0fa" stroke="#446688" stroke-width="1.3"/>
    <rect x="370" y="132" width="110" height="30" fill="#e8f0fa" stroke="#446688" stroke-width="1.3"/>
    <rect x="480" y="132" width="110" height="30" fill="#e8f0fa" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g filter="url(#sk)">
    <text x="90" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">i</text>
    <text x="155" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">nums[i]</text>
    <text x="235" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">leftMax</text>
    <text x="325" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">rightMax</text>
    <text x="425" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">判定</text>
    <text x="535" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">收入答案</text>
  </g>

  <!-- rows: y=162 step 34 -->
  <g filter="url(#sk)">
    <rect x="60" y="162" width="530" height="34" fill="#f4faf5" stroke="#bbb" stroke-width="1"/>
    <rect x="60" y="196" width="530" height="34" fill="#f4faf5" stroke="#bbb" stroke-width="1"/>
    <rect x="60" y="230" width="530" height="34" fill="#f4faf5" stroke="#bbb" stroke-width="1"/>
    <rect x="60" y="264" width="530" height="34" fill="#fdf1f3" stroke="#bbb" stroke-width="1"/>
    <rect x="60" y="298" width="530" height="34" fill="#f4faf5" stroke="#bbb" stroke-width="1"/>
    <rect x="60" y="332" width="530" height="34" fill="#f4faf5" stroke="#bbb" stroke-width="1"/>
  </g>
  <g filter="url(#sk)">
    <text x="90" y="184" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="155" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <text x="235" y="184" text-anchor="middle" font-size="12" fill="#7a5415">−∞</text>
    <text x="325" y="184" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="425" y="184" text-anchor="middle" font-size="12" fill="#2e6e2e">1 &gt; −∞ ✓ 白送</text>
    <text x="535" y="184" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  </g>
  <g filter="url(#sk)">
    <text x="90" y="218" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="155" y="218" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <text x="235" y="218" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="325" y="218" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="425" y="218" text-anchor="middle" font-size="12" fill="#2e6e2e">2 &gt; 1 ✓</text>
    <text x="535" y="218" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">2</text>
  </g>
  <g filter="url(#sk)">
    <text x="90" y="252" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="155" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
    <text x="235" y="252" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="325" y="252" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="425" y="252" text-anchor="middle" font-size="12" fill="#2e6e2e">4 &gt; 2 ✓（双记录）</text>
    <text x="535" y="252" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">4</text>
  </g>
  <g filter="url(#sk)">
    <text x="90" y="286" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="155" y="286" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <text x="235" y="286" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="325" y="286" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="425" y="286" text-anchor="middle" font-size="12" fill="#b03a3a">2&gt;4 ✗ 且 2&gt;3 ✗</text>
    <text x="535" y="286" text-anchor="middle" font-size="12" fill="#b03a3a">—</text>
  </g>
  <g filter="url(#sk)">
    <text x="90" y="320" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="155" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <text x="235" y="320" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="325" y="320" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="425" y="320" text-anchor="middle" font-size="12" fill="#2e6e2e">3 &gt; 2 ✓</text>
    <text x="535" y="320" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">3</text>
  </g>
  <g filter="url(#sk)">
    <text x="90" y="354" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="155" y="354" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <text x="235" y="354" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="325" y="354" text-anchor="middle" font-size="12" fill="#7a5415">−∞</text>
    <text x="425" y="354" text-anchor="middle" font-size="12" fill="#2e6e2e">2 &gt; −∞ ✓ 白送</text>
    <text x="535" y="354" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">2</text>
  </g>

  <!-- Result box -->
  <g filter="url(#sk)">
    <rect x="120" y="388" width="440" height="60" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="340" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">答案 = [1, 2, 4, 3, 2]</text>
  <text x="340" y="436" text-anchor="middle" font-size="11" fill="#555">i=3 两边皆败被剔除，其余下标收入，天然保持原顺序 ✓</text>
</svg>
