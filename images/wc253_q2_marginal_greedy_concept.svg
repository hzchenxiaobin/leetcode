<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="440" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：堆独立 + 边际收益递减 → 逐名额摘最大</text>
  <path d="M 140 38 Q 340 48 540 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Section 1: per-pile chains -->
  <text x="60" y="66" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">① 堆独立：单堆操作只是 p → ⌈p/2⌉ 的迭代，与操作顺序无关</text>

  <!-- pile 9 chain -->
  <text x="60" y="102" font-size="12" fill="#888" filter="url(#sk)">p = 9</text>
  <g filter="url(#sk)"><rect x="100" y="82" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="118" y="101" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">9</text>
  <path d="M 140 96 L 170 96" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="155" y="86" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#sk)">−4</text>
  <g filter="url(#sk)"><rect x="174" y="82" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="192" y="101" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">5</text>
  <path d="M 214 96 L 244 96" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="229" y="86" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#sk)">−2</text>
  <g filter="url(#sk)"><rect x="248" y="82" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="266" y="101" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">3</text>
  <path d="M 288 96 L 318 96" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="303" y="86" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#sk)">−1</text>
  <g filter="url(#sk)"><rect x="322" y="82" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="340" y="101" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">2</text>
  <path d="M 362 96 L 392 96" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="377" y="86" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#sk)">−1</text>
  <g filter="url(#sk)"><rect x="396" y="82" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="414" y="101" text-anchor="middle" font-size="13" fill="#2f5d25" filter="url(#sk)">1</text>

  <!-- pile 5 chain -->
  <text x="60" y="140" font-size="12" fill="#888" filter="url(#sk)">p = 5</text>
  <g filter="url(#sk)"><rect x="100" y="120" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="118" y="139" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">5</text>
  <path d="M 140 134 L 170 134" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="155" y="124" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#sk)">−2</text>
  <g filter="url(#sk)"><rect x="174" y="120" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="192" y="139" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">3</text>
  <path d="M 214 134 L 244 134" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="229" y="124" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#sk)">−1</text>
  <g filter="url(#sk)"><rect x="248" y="120" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="266" y="139" text-anchor="middle" font-size="13" fill="#2f5d25" filter="url(#sk)">1</text>

  <!-- pile 4 chain -->
  <text x="60" y="178" font-size="12" fill="#888" filter="url(#sk)">p = 4</text>
  <g filter="url(#sk)"><rect x="100" y="158" width="36" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="118" y="177" text-anchor="middle" font-size="13" fill="#333" filter="url(#sk)">4</text>
  <path d="M 140 172 L 170 172" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="155" y="162" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#sk)">−2</text>
  <g filter="url(#sk)"><rect x="174" y="158" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="192" y="177" text-anchor="middle" font-size="13" fill="#2f5d25" filter="url(#sk)">2</text>
  <path d="M 214 172 L 244 172" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="229" y="162" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#sk)">−1</text>
  <g filter="url(#sk)"><rect x="248" y="158" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="266" y="177" text-anchor="middle" font-size="13" fill="#2f5d25" filter="url(#sk)">1</text>

  <!-- info box right -->
  <g filter="url(#sk)"><rect x="440" y="60" width="216" height="130" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="548" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">k 次操作 = k 个名额</text>
  <text x="454" y="106" font-size="11" fill="#5c4512" filter="url(#sk)">· 策略 = 每堆分到 c_i 次，Σc_i = k</text>
  <text x="454" y="126" font-size="11" fill="#5c4512" filter="url(#sk)">· 剩余 = Σ f^(c_i)(p_i)（堆独立）</text>
  <text x="454" y="146" font-size="11" fill="#5c4512" filter="url(#sk)">· 橙色箭头即各刀移除量（边际）</text>
  <text x="454" y="166" font-size="11" fill="#5c4512" filter="url(#sk)">· 总移除 = 摘走的边际之和</text>
  <text x="454" y="182" font-size="10" fill="#8a6d2f" filter="url(#sk)">值到 1 后再操作移除 0（浪费名额）</text>

  <!-- Section 2: marginal bars -->
  <text x="60" y="222" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">② 边际递减：同一堆的第 c+1 刀移除量 ≤ 第 c 刀 → 每次摘走当前全局最大边际</text>

  <!-- baseline -->
  <path d="M 80 384 L 640 384" stroke="#b0b8c4" stroke-width="1.4" filter="url(#sk)"/>

  <!-- pile 9 bars: deltas 4,2,1,1 -->
  <g filter="url(#sk)"><rect x="104" y="296" width="30" height="88" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="119" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="144" y="340" width="30" height="44" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="159" y="334" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="184" y="362" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="199" y="356" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="224" y="362" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="239" y="356" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">1</text>
  <text x="179" y="402" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">堆 p=9 的边际 δ₀≥δ₁≥δ₂…</text>

  <!-- pile 5 bars: 2,1,1 -->
  <g filter="url(#sk)"><rect x="314" y="340" width="30" height="44" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="329" y="334" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="354" y="362" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="369" y="356" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="394" y="362" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="409" y="356" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">1</text>
  <text x="369" y="402" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">堆 p=5 的边际</text>

  <!-- pile 4 bars: 2,1 -->
  <g filter="url(#sk)"><rect x="494" y="340" width="30" height="44" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="509" y="334" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="534" y="362" width="30" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="549" y="356" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">1</text>
  <text x="529" y="402" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">堆 p=4 的边际</text>

  <!-- highlight greedy pick -->
  <g filter="url(#sk)"><ellipse cx="119" cy="340" rx="30" ry="52" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4"/></g>
  <text x="119" y="422" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">贪心先摘它（全局当前最大）</text>
  <text x="369" y="422" text-anchor="middle" font-size="10.5" fill="#8a8f98" filter="url(#sk)">同理：摘完 4 后轮到三个 2（任选）</text>

  <!-- bottom conclusion -->
  <g filter="url(#sk)"><rect x="70" y="255" width="216" height="0" rx="8" fill="none"/></g>
  <text x="340" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25" filter="url(#sk)">当前值最大 ⇔ 下一刀移除最多（⌊p/2⌋ 单调）→ 名额永远给堆顶 → 大根堆 O(log n) 维护</text>
</svg>
