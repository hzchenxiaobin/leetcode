<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：root = [5, 4, 5, 1, 1, null, 5] 自底向上</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">后序遍历决定顺序：先算完两个儿子，再算自己，最后读根节点的 ans</text>

  <g filter="url(#rough2)">
    <rect x="30" y="66" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="94" y="66" width="124" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="218" y="66" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="282" y="66" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="346" y="66" width="106" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="452" y="66" width="78" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>

    <text x="62" y="87" text-anchor="middle" font-size="10" fill="#334" font-weight="bold">顺序</text>
    <text x="156" y="87" text-anchor="middle" font-size="10" fill="#334" font-weight="bold">节点（值）</text>
    <text x="250" y="87" text-anchor="middle" font-size="10" fill="#334" font-weight="bold">左臂 l</text>
    <text x="314" y="87" text-anchor="middle" font-size="10" fill="#334" font-weight="bold">右臂 r</text>
    <text x="399" y="87" text-anchor="middle" font-size="10" fill="#334" font-weight="bold">返回 down(u)</text>
    <text x="491" y="87" text-anchor="middle" font-size="10" fill="#334" font-weight="bold">ans</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11">
    <rect x="30" y="102" width="64" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4"/>
    <rect x="94" y="102" width="124" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4"/>
    <rect x="218" y="102" width="64" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4"/>
    <rect x="282" y="102" width="64" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4"/>
    <rect x="346" y="102" width="106" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4"/>
    <rect x="452" y="102" width="78" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4"/>

    <text x="62" y="121" fill="#666">1</text>
    <text x="156" y="121" fill="#3a4a66">左叶子（1）</text>
    <text x="250" y="121" fill="#555">0</text>
    <text x="314" y="121" fill="#555">0</text>
    <text x="399" y="121" fill="#555">0</text>
    <text x="491" y="121" fill="#555">0</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11">
    <rect x="30" y="134" width="64" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4"/>
    <rect x="94" y="134" width="124" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4"/>
    <rect x="218" y="134" width="64" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4"/>
    <rect x="282" y="134" width="64" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4"/>
    <rect x="346" y="134" width="106" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4"/>
    <rect x="452" y="134" width="78" height="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="4"/>

    <text x="62" y="153" fill="#666">2</text>
    <text x="156" y="153" fill="#3a4a66">右叶子（1）</text>
    <text x="250" y="153" fill="#555">0</text>
    <text x="314" y="153" fill="#555">0</text>
    <text x="399" y="153" fill="#555">0</text>
    <text x="491" y="153" fill="#555">0</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11">
    <rect x="30" y="166" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="94" y="166" width="124" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="218" y="166" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="282" y="166" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="346" y="166" width="106" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="452" y="166" width="78" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>

    <text x="62" y="185" fill="#3a4a66">3</text>
    <text x="156" y="185" fill="#3a4a66">节点（4）</text>
    <text x="250" y="185" fill="#8a3a36" font-weight="bold">0</text>
    <text x="314" y="185" fill="#8a3a36" font-weight="bold">0</text>
    <text x="399" y="185" fill="#555">0</text>
    <text x="491" y="185" fill="#555">0</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11">
    <rect x="30" y="198" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="94" y="198" width="124" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="218" y="198" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="282" y="198" width="64" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="346" y="198" width="106" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="452" y="198" width="78" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>

    <text x="62" y="217" fill="#3a5a30">4</text>
    <text x="156" y="217" fill="#3a5a30">右子 5（5）</text>
    <text x="250" y="217" fill="#555">0</text>
    <text x="314" y="217" fill="#3a5a30" font-weight="bold">1</text>
    <text x="399" y="217" fill="#3a5a30" font-weight="bold">1</text>
    <text x="491" y="217" fill="#3a5a30" font-weight="bold">1</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="11">
    <rect x="30" y="230" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="94" y="230" width="124" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="218" y="230" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="282" y="230" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="346" y="230" width="106" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="452" y="230" width="78" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>

    <text x="62" y="249" fill="#8a3a36">5</text>
    <text x="156" y="249" fill="#8a3a36">根 5（5）</text>
    <text x="250" y="249" fill="#555">0</text>
    <text x="314" y="249" fill="#8a3a36" font-weight="bold">2</text>
    <text x="399" y="249" fill="#8a3a36" font-weight="bold">2</text>
    <text x="491" y="249" fill="#8a3a36" font-weight="bold">2</text>
  </g>

  <rect x="30" y="278" width="500" height="98" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="44" y="300" font-size="10" fill="#555" filter="url(#rough2)">· 节点 4：两个儿子值都是 1，但都 ≠ 4 → l = r = 0，这个块只剩一个点，直径 0</text>
  <text x="44" y="322" font-size="10" fill="#555" filter="url(#rough2)">· 「右子 5」：右儿子同值 → r = down(右子 5) + 1 = 1，ans 首次变成 1</text>
  <text x="44" y="344" font-size="10" fill="#555" filter="url(#rough2)">· 根 5：右儿子同值 → r = down(右子 5) + 1 = 2；左儿子 4 异值 → l = 0；ans = 2</text>
  <text x="44" y="366" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">· 答案 2，对应路径 5 → 5 → 5，长度按边数算，不是节点数 3</text>
</svg>
