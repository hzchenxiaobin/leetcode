<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个值只保留一次出现 p(v)：免费还是故障，只看它是不是前缀/后缀最小</text>
  <text x="390" y="53" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">样例 5：b = [1,3,2,5,4,3,1,2]，取 p(1)=7, p(2)=3, p(3)=2, p(4)=5, p(5)=4</text>

  <!-- 数组 b -->
  <text x="30" y="92" font-size="12" fill="#444" filter="url(#rough2)">b =</text>
  <rect x="72" y="72" width="66" height="32" rx="4" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="94" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="152" y="72" width="66" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="94" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">3</text>
  <rect x="232" y="72" width="66" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="94" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">2</text>
  <rect x="312" y="72" width="66" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="345" y="94" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">5</text>
  <rect x="392" y="72" width="66" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="425" y="94" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="472" y="72" width="66" height="32" rx="4" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="505" y="94" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">3</text>
  <rect x="552" y="72" width="66" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="585" y="94" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="632" y="72" width="66" height="32" rx="4" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="665" y="94" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">2</text>

  <text x="105" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="185" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="265" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="345" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="425" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="505" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="585" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>
  <text x="665" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">8</text>
  <text x="715" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">位置</text>

  <text x="30" y="150" font-size="11" fill="#666" filter="url(#rough2)">蓝色格子 = 被保留的那次出现</text>

  <!-- p(v) 的折线：按值 1..5 排列，纵轴是位置 -->
  <path d="M 130 168 L 260 256 L 390 278 L 520 212 L 650 234" stroke="#7a8fa6" stroke-width="1.6"
        fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <circle cx="130" cy="168" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="260" cy="256" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="390" cy="278" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="520" cy="212" r="7" fill="#eeeeee" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="650" cy="234" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <text x="142" y="164" font-size="11" fill="#2f4a66" filter="url(#rough2)">p(1)=7</text>
  <text x="272" y="252" font-size="11" fill="#2f4a66" filter="url(#rough2)">p(2)=3</text>
  <text x="402" y="300" font-size="11" fill="#b85450" filter="url(#rough2)">p(3)=2（W，全局最小）</text>
  <text x="532" y="208" font-size="11" fill="#7a7a7a" filter="url(#rough2)">p(4)=5</text>
  <text x="662" y="230" font-size="11" fill="#a07a20" filter="url(#rough2)">p(5)=4</text>

  <text x="52" y="172" font-size="10.5" fill="#888" filter="url(#rough2)">位置大</text>
  <text x="52" y="292" font-size="10.5" fill="#888" filter="url(#rough2)">位置小</text>

  <!-- 值 1..5 的说明框 -->
  <rect x="82" y="330" width="96" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="352" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">值 1：前缀最小</text>
  <rect x="212" y="330" width="96" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">值 2：前缀最小</text>
  <rect x="342" y="330" width="96" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="352" text-anchor="middle" font-size="12" fill="#8c3b38" filter="url(#rough2)">值 3：两者都是</text>
  <rect x="472" y="330" width="96" height="34" rx="8" fill="#eeeeee" stroke="#9a9a9a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="352" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">值 4：插入 ×1</text>
  <rect x="602" y="330" width="96" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="650" y="352" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">值 5：后缀最小</text>

  <path d="M 60 378 Q 390 386 720 378" stroke="#c8c8c8" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <text x="390" y="400" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">前缀最小 {1,2,3} ∪ 后缀最小 {3,5}，交集只有 W=3 ⇒ 免费 3+2−1 = 4，只剩值 4 需要故障一次</text>
  <text x="390" y="418" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">下降链 3→2→1（位置 2&lt;3&lt;7）给出左链；上升链 3→5（位置 2&lt;4）给出右链，答案 = 5 − 4 = 1</text>
</svg>
