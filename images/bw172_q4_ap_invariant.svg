<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">剩余序列永远是等差数列：只需 (h, s, r) 三个数</text>

  <!-- 初始 -->
  <text x="26" y="64" font-size="10" fill="#999" filter="url(#rough2)">初始</text>
  <rect x="66" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="86" y="69" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="112" y="48" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="69" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">2</text>
  <rect x="158" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="178" y="69" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="204" y="48" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="69" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">4</text>
  <rect x="250" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="69" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="296" y="48" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="69" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">6</text>
  <rect x="342" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="362" y="69" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="388" y="48" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="408" y="69" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">8</text>
  <text x="446" y="69" font-size="10" fill="#446688" filter="url(#rough2)">h=1,s=1,r=8</text>

  <!-- 删除标记 -->
  <text x="132" y="92" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="224" y="92" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="316" y="92" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="408" y="92" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="260" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">操作 1：从左侧隔一个删一个 → 保留第 1、3、5、7 个</text>

  <!-- 第一轮后 -->
  <text x="26" y="152" font-size="10" fill="#999" filter="url(#rough2)">第 1 轮</text>
  <rect x="66" y="136" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="158" y="136" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="250" y="136" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="342" y="136" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="446" y="157" font-size="10" fill="#4a7a3a" filter="url(#rough2)">h=1,s=2,r=4</text>

  <text x="260" y="186" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">操作 2：从右侧隔一个删一个 → 保留倒数第 1、3 个（7、3）</text>

  <!-- 第二轮后 -->
  <text x="26" y="222" font-size="10" fill="#999" filter="url(#rough2)">第 2 轮</text>
  <rect x="158" y="206" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="178" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="342" y="206" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="362" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="446" y="227" font-size="10" fill="#d6a040" filter="url(#rough2)">h=3,s=4,r=2</text>

  <rect x="80" y="256" width="360" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">公差翻倍、个数减半、首项按方向调整 —— 全程只跟踪这三个数</text>
</svg>
