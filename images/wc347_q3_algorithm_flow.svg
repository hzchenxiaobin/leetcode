<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#666666"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">算法流程：一次遍历，逐差异边界累加最小单价</text>

  <ellipse cx="210" cy="66" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a"
           stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="71" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">开始</text>

  <path d="M 210 82 L 210 96" stroke="#666666" stroke-width="1.8" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="110" y="100" width="200" height="36" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="122" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">n = len(s)，ans = 0，i = 0</text>

  <path d="M 210 136 L 210 152" stroke="#666666" stroke-width="1.8" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>

  <polygon points="210,154 292,192 210,230 128,192" fill="#fff8e1"
           stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="197" text-anchor="middle" font-size="13" fill="#333"
        filter="url(#rough2)">i ≤ n − 2 ?</text>

  <path d="M 292 192 L 349 192" stroke="#666666" stroke-width="1.8" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="312" y="184" text-anchor="middle" font-size="11" fill="#b85450"
        filter="url(#rough2)">否</text>

  <ellipse cx="405" cy="192" rx="52" ry="18" fill="#e6f4ea" stroke="#4a7a3a"
           stroke-width="2" filter="url(#rough2)"/>
  <text x="405" y="197" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">输出 ans</text>

  <path d="M 210 230 L 210 246" stroke="#666666" stroke-width="1.8" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="222" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">是</text>

  <polygon points="210,248 302,288 210,328 118,288" fill="#fff8e1"
           stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="293" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">s[i] ≠ s[i+1] ?</text>

  <path d="M 302 288 L 334 288" stroke="#666666" stroke-width="1.8" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="313" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">是</text>

  <rect x="336" y="268" width="166" height="40" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="419" y="292" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">ans += min(i+1, n−1−i)</text>

  <path d="M 419 308 L 419 365 L 264 365" stroke="#666666" stroke-width="1.8"
        fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <path d="M 210 328 L 210 346" stroke="#666666" stroke-width="1.8" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="222" y="342" text-anchor="middle" font-size="11" fill="#b85450"
        filter="url(#rough2)">否</text>

  <rect x="160" y="348" width="100" height="34" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="369" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">i = i + 1</text>

  <path d="M 160 365 L 96 365 L 96 192 L 124 192" stroke="#446688"
        stroke-width="1.8" fill="none" stroke-dasharray="6 4"
        marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="260" y="404" text-anchor="middle" font-size="12.5" fill="#4a7a3a"
        filter="url(#rough2)">每个差异边界独立付费：ans += min(i+1, n−1−i)，时间 O(n) · 空间 O(1)</text>
</svg>
