<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">官方调用序列：Graph → 3→2 → 0→3 → addEdge(1,3,4) → 0→3</text>

  <!-- 节点 -->
  <g filter="url(#rough2)">
    <ellipse cx="100" cy="120" rx="22" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="100" y="126" text-anchor="middle" font-size="13" fill="#333">0</text>
    <ellipse cx="240" cy="90" rx="22" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="240" y="96" text-anchor="middle" font-size="13" fill="#333">1</text>
    <ellipse cx="380" cy="120" rx="22" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="380" y="126" text-anchor="middle" font-size="13" fill="#333">2</text>
    <ellipse cx="150" cy="230" rx="22" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="150" y="236" text-anchor="middle" font-size="13" fill="#333">3</text>
  </g>

  <!-- 初始边 -->
  <g filter="url(#rough2)">
    <path d="M 122 112 C 200 90, 300 92, 358 114" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="240" y="78" text-anchor="middle" font-size="12" fill="#888">5</text>
    <path d="M 120 108 C 170 94, 210 88, 218 88" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="165" y="94" text-anchor="middle" font-size="12" fill="#888">2</text>
    <path d="M 262 92 C 310 98, 350 106, 358 112" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="312" y="106" text-anchor="middle" font-size="12" fill="#888">1</text>
    <path d="M 142 210 C 124 180, 110 155, 106 144" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="112" y="186" text-anchor="middle" font-size="12" fill="#888">3</text>
  </g>

  <!-- 查询 1 高亮：3→0→1→2 -->
  <g filter="url(#rough2)">
    <path d="M 172 214 C 130 172, 106 152, 100 144" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 118 102 C 168 88, 208 82, 216 84" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 262 94 C 310 100, 352 108, 360 112" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <rect x="330" y="196" width="200" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="219" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">① shortestPath(3,2) = 3+2+1 = 6</text>

  <!-- 查询 2：0 到 3 不可达 -->
  <rect x="330" y="240" width="200" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="263" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">② shortestPath(0,3) = −1（无出边指向 3）</text>

  <!-- 加边 1→3 -->
  <g filter="url(#rough2)">
    <path d="M 254 110 C 230 170, 200 210, 172 224" stroke="#d6a040" stroke-width="2.6" stroke-dasharray="7 6" fill="none" marker-end="url(#arr)"/>
    <text x="246" y="176" text-anchor="middle" font-size="12" fill="#d6a040">+4</text>
  </g>

  <!-- 查询 3 -->
  <rect x="60" y="282" width="470" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="295" y="305" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">③ addEdge(1→3, 4) 后：shortestPath(0,3) = 2 + 4 = 6</text>
</svg>
