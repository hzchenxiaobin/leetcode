<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">总伤害 = 每个敌人的"伤害 × 自己的死亡时刻"之和</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">按顺序逐个集火，第 i 个敌人死于时刻 T_i（前缀耗时之和）</text>

  <path d="M 76 92 L 484 92" stroke="#bbb" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="96" font-size="10" fill="#999" filter="url(#rough2)">秒</text>

  <g filter="url(#rough2)">
    <rect x="76" y="104" width="86" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="162" y="104" width="150" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="312" y="104" width="74" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="386" y="104" width="98" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="119" y="121" fill="#8a3a36" font-weight="bold">打敌人 3</text>
    <text x="119" y="137" fill="#666">t = 2 秒</text>
    <text x="237" y="121" fill="#8a6a20" font-weight="bold">打敌人 2</text>
    <text x="237" y="137" fill="#666">t = 2 秒</text>
    <text x="349" y="121" fill="#3a4a66" font-weight="bold">敌人 0</text>
    <text x="349" y="137" fill="#666">t = 1 秒</text>
    <text x="435" y="121" fill="#3a5a30" font-weight="bold">敌人 1</text>
    <text x="435" y="137" fill="#666">t = 2 秒</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#555">
    <text x="162" y="162">T = 2</text>
    <text x="312" y="162">T = 4</text>
    <text x="386" y="162">T = 5</text>
    <text x="484" y="162">T = 7</text>
  </g>
  <path d="M 162 96 L 162 174" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 312 96 L 312 174" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 386 96 L 386 174" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 484 96 L 484 174" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <rect x="52" y="186" width="456" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="68" y="208" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">贡献 = d_i × T_i（敌人在每个它活着的秒都会造成一次 d_i）</text>
  <text x="68" y="228" font-size="10.5" fill="#555" filter="url(#rough2)">总伤害 = Σ_i d_i × T_i，而 T_i 由击杀顺序唯一决定：T_i = t_1 + t_2 + … + t_i</text>
  <text x="68" y="245" font-size="10" fill="#888" filter="url(#rough2)">其中 t_i = ceil(health[i] / power) 是打死敌人 i 需要的秒数</text>

  <rect x="52" y="266" width="456" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="68" y="288" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">示例 1 的排序结果（power = 4）</text>
  <text x="68" y="308" font-size="10.5" fill="#555" filter="url(#rough2)">t = [1, 2, 2, 2]，d = [1, 2, 3, 4] → 按 d/t 降序：敌人 3、2、0、1</text>
  <text x="68" y="324" font-size="10.5" fill="#555" filter="url(#rough2)">伤害 = 4×2 + 3×4 + 1×5 + 2×7 = 8 + 12 + 5 + 14 = 39</text>

  <text x="280" y="356" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">所以问题变成：找一个击杀顺序，使 Σ d_i × T_i 最小</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意每秒钟"先挨打，再出手"，所以敌人死亡的那一秒也要计入伤害</text>
</svg>
