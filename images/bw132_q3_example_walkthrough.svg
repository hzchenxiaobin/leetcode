<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例填表：nums = [1, 2, 1, 1, 3]，k = 2</text>

  <!-- 表格线 -->
  <g filter="url(#rough2)" stroke="#bbb" stroke-width="1.2" fill="none">
    <rect x="70" y="60" width="380" height="204" rx="4"/>
    <path d="M 70 94 L 450 94"/>
    <path d="M 70 128 L 450 128"/>
    <path d="M 70 162 L 450 162"/>
    <path d="M 70 196 L 450 196"/>
    <path d="M 70 230 L 450 230"/>
    <path d="M 130 60 L 130 264"/>
    <path d="M 210 60 L 210 264"/>
    <path d="M 290 60 L 290 264"/>
    <path d="M 370 60 L 370 264"/>
  </g>

  <!-- 最优格高亮 -->
  <rect x="370" y="196" width="80" height="34" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="290" y="230" width="80" height="34" fill="#e6f4ea" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="100" y="84">i</text>
    <text x="170" y="84">nums[i]</text>
    <text x="250" y="84">j = 0</text>
    <text x="330" y="84">j = 1</text>
    <text x="410" y="84">j = 2</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="100" y="116">0</text>
    <text x="170" y="116">1</text>
    <text x="250" y="116">1</text>
    <text x="330" y="116">1</text>
    <text x="410" y="116">1</text>

    <text x="100" y="150">1</text>
    <text x="170" y="150">2</text>
    <text x="250" y="150">1</text>
    <text x="330" y="150">2</text>
    <text x="410" y="150">2</text>

    <text x="100" y="184">2</text>
    <text x="170" y="184">1</text>
    <text x="250" y="184">2</text>
    <text x="330" y="184">2</text>
    <text x="410" y="184">3</text>

    <text x="100" y="218">3</text>
    <text x="170" y="218">1</text>
    <text x="250" y="218">3</text>
    <text x="330" y="218">3</text>
    <text x="410" y="218" fill="#2d5a22" font-weight="bold">4</text>

    <text x="100" y="252">4</text>
    <text x="170" y="252">3</text>
    <text x="250" y="252">1</text>
    <text x="330" y="252" fill="#2d5a22" font-weight="bold">4</text>
    <text x="410" y="252">4</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#446688">
    <text x="466" y="150">i = 3 时：</text>
    <text x="466" y="170">接同值的 i = 2</text>
    <text x="466" y="190">（1 → 1 不花次数）</text>
    <text x="466" y="212">得 dp[3][2] = 4</text>
    <text x="466" y="242">i = 4 时接异值</text>
    <text x="466" y="262">dp[4][1] = 4</text>
  </g>

  <text x="310" y="298" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[i][j] = 1 + max（dp[p][j] 若同值，dp[p][j−1] 若异值），p &lt; i</text>
  <text x="310" y="330" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">最终答案 = 4，对应子序列 [1, 2, 1, 1]（相邻不等 2 次）</text>
  <text x="310" y="360" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">表格每格只依赖所有左侧格子，i 从小到大填即可</text>
  <text x="310" y="386" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">O(n²k) 时间、O(nk) 空间；本题 n ≤ 500 完全够用</text>
</svg>
