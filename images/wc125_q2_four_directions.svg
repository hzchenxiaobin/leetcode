<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="310" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">四个方向各扫一次，遇到第一个棋子就停</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">车不能穿过棋子：路径上第一个非空格决定了这次扫描的结局</text>

  <circle cx="280" cy="150" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="157" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">R</text>

  <path d="M 280 124 L 280 76" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 280 176 L 280 224" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 254 150 L 206 150" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 306 150 L 354 150" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="264" y="56" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="76" font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">p</text>
  <rect x="264" y="212" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="232" font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">B</text>
  <rect x="176" y="136" width="32" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="192" y="156" font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">p</text>
  <rect x="352" y="136" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="368" y="156" font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">B</text>

  <text x="300" y="70" font-size="10.5" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">第一个是 p → 吃掉，计数 +1</text>
  <text x="300" y="238" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">第一个是 B → 挡住，本次 0</text>
  <text x="40" y="130" font-size="10.5" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">第一个是 p</text>
  <text x="40" y="148" font-size="10.5" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">→ 吃掉</text>
  <text x="400" y="130" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">第一个是 B</text>
  <text x="400" y="148" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">→ 挡住</text>

  <rect x="30" y="258" width="500" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="277" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">每个方向最多走 7 格，四条射线共 28 格；棋盘固定 8×8，复杂度是常数 O(1)。</text>
  <text x="42" y="294" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">注意「遇到 p 就 break」——不能继续往后扫，否则会数到被它挡住的第二个兵。</text>
</svg>
