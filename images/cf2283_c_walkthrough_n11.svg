<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="486" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：n = 11 → B = 4，k = 15，2k = 30，X = 0</text>
  <path d="M 150 46 Q 380 52 610 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="110" y="86" text-anchor="middle" font-size="11" fill="#5a5a5a" filter="url(#rough2)">B = n 的位数</text>
  <text x="262" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">b = 0</text>
  <text x="372" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">b = 1</text>
  <text x="482" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">b = 2</text>
  <text x="592" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">b = 3</text>
  <text x="694" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">b = 4</text>

  <rect x="40" y="96" width="200" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="122" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">x_b（X 的第 b 位）</text>
  <rect x="244" y="96" width="496" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="262" y="122" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="372" y="122" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="482" y="122" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="592" y="122" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="694" y="122" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">0</text>

  <rect x="40" y="144" width="200" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="170" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">y_b（梯子推出）</text>
  <rect x="244" y="144" width="496" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="262" y="170" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">0</text>
  <text x="372" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="482" y="170" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">0</text>
  <text x="592" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="694" y="170" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">0</text>

  <rect x="40" y="192" width="200" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="218" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">m_b（必须为 1）</text>
  <rect x="244" y="192" width="496" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="262" y="218" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">随意</text>
  <text x="372" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="482" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="592" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="694" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>

  <text x="380" y="252" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">梯子：y₀ = 0，y₁ = 1⊕0⊕0 = 1，y₂ = 1⊕0⊕1 = 0，y₃ = 1⊕0⊕0 = 1，y₄ = 1⊕0⊕1 = 0</text>

  <rect x="40" y="268" width="680" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="300" text-anchor="middle" font-size="13.5" fill="#2f4a66" filter="url(#rough2)">y₄ = 0 ✓ 无需取反 ⇒ Y = 0b1010 = 10，翻倍元素 2¹ = 2 与 2³ = 8</text>

  <rect x="40" y="330" width="680" height="52" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="362" text-anchor="middle" font-size="13" fill="#a33b36" filter="url(#rough2)">翻倍后数组 = 1 4 3 4 5 6 7 16 9 10 11　（只动了第 2 个、第 8 个元素）</text>

  <rect x="40" y="392" width="680" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="424" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">m = X ⊕ Y ⊕ (Y ≪ 1) = 0 ⊕ 10 ⊕ 20 = 30 = 2k ✓</text>

  <text x="380" y="468" text-anchor="middle" font-size="11" fill="#5a5a5a" filter="url(#rough2)">梯子把 Y 钉死 ⇒ 每个 n 的 m 唯一：候选只有 30 与 31，本题正好落在 30</text>
</svg>
