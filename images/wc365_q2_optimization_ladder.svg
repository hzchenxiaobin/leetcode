<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">优化阶梯：n ≤ 10⁵ 把我们逼上 O(n)</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">复杂度每降一级，运算量少几个数量级；1~2 秒的时间预算只容得下第 3 级以上</text>

  <!-- pillars on common baseline 400 -->
  <g filter="url(#sk)">
    <rect x="40" y="330" width="140" height="70" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="200" y="268" width="140" height="132" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="360" y="206" width="140" height="194" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="520" y="144" width="140" height="256" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="110" y="360" font-size="17" font-weight="bold" fill="#8a3a3a">O(n³)</text>
    <text x="110" y="383" font-size="11" fill="#a04a48">必然超时 ✗</text>
    <text x="270" y="322" font-size="17" font-weight="bold" fill="#8a6520">O(n²)</text>
    <text x="270" y="346" font-size="11" fill="#8a6520">≈10¹⁰ 次运算</text>
    <text x="270" y="368" font-size="11" fill="#a04a48">仍超时 ✗</text>
    <text x="430" y="256" font-size="17" font-weight="bold" fill="#446688">O(n)</text>
    <text x="430" y="280" font-size="11" fill="#446688">两遍扫描</text>
    <text x="430" y="302" font-size="11" fill="#3a6a2a">O(n) 空间，过 ✓</text>
    <text x="590" y="192" font-size="17" font-weight="bold" fill="#3a6a2a">O(n)</text>
    <text x="590" y="216" font-size="11" fill="#4a7a3a">一遍扫描</text>
    <text x="590" y="238" font-size="11" fill="#3a6a2a" font-weight="bold">O(1) 空间，最优 ✓</text>
  </g>

  <!-- description cards above pillars -->
  <g filter="url(#sk)">
    <rect x="34" y="252" width="152" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="194" y="190" width="152" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="354" y="128" width="152" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="514" y="66" width="152" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="110" y="274" font-size="12" font-weight="bold" fill="#8a3a3a">① 暴力三重循环</text>
    <text x="110" y="292" font-size="10.5" fill="#a04a48">枚举全部 i&lt;j&lt;k，≈1.7×10¹⁴</text>
    <text x="110" y="309" font-size="10.5" fill="#a04a48">Q1 专属，本题无缘</text>
    <text x="270" y="212" font-size="12" font-weight="bold" fill="#8a6520">② 枚举 (i,j) + 后缀最大</text>
    <text x="270" y="230" font-size="10.5" fill="#8a6520">退掉 k 的自由度</text>
    <text x="270" y="247" font-size="10.5" fill="#8a6520">方向对，但还不够</text>
    <text x="430" y="150" font-size="12" font-weight="bold" fill="#446688">③ 固定 j 前后缀分解</text>
    <text x="430" y="168" font-size="10.5" fill="#446688">两侧独立取最值</text>
    <text x="430" y="185" font-size="10.5" fill="#446688">本题的及格线</text>
    <text x="590" y="88" font-size="12" font-weight="bold" fill="#3a6a2a">④ 一遍扫描滚动维护</text>
    <text x="590" y="106" font-size="10.5" fill="#4a7a3a">聚合值层层复用</text>
    <text x="590" y="123" font-size="10.5" fill="#4a7a3a">本文主推形态</text>
  </g>

  <!-- stairs arrows -->
  <g fill="none" stroke="#888" stroke-width="1.6" filter="url(#sk)">
    <path d="M 178 326 Q 190 296 200 272" marker-end="url(#arr)"/>
    <path d="M 338 264 Q 350 234 360 210" marker-end="url(#arr)"/>
    <path d="M 498 202 Q 510 172 520 148" marker-end="url(#arr)"/>
  </g>

  <!-- bottom notes -->
  <text x="340" y="432" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">C++ 每秒约 10⁸~10⁹ 次运算：O(n²) 在 n=10⁵ 下要跑约 10 秒，O(n) 只要约 0.01 秒</text>
  <text x="340" y="454" text-anchor="middle" font-size="12" fill="#3a6a2a" font-weight="bold" filter="url(#sk)">周赛每题只有 5~10 分钟：不仅要过，还要写得快、改得少 → 主推第 4 级</text>
</svg>
