<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：贪心双指针判定 + 全序比较键</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">子序列判定只需一次扫描；答案就是键 (−|w|, w) 最小的合法词</text>

  <text x="32" y="78" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 判定 w = apple 是否为 s = abpcplea 的子序列</text>

  <text x="36" y="121" font-size="12" fill="#666" filter="url(#rough2)">s =</text>

  <!-- s 的 8 个格子，命中列绿色高亮 -->
  <rect x="70" y="96" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="130" y="96" width="48" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="190" y="96" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="250" y="96" width="48" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="310" y="96" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="370" y="96" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="430" y="96" width="48" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="490" y="96" width="48" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="94" y="90" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="154" y="90" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="214" y="90" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="274" y="90" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="334" y="90" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="394" y="90" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="454" y="90" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="514" y="90" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>

  <text x="94" y="121" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">a</text>
  <text x="154" y="121" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">b</text>
  <text x="214" y="121" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">p</text>
  <text x="274" y="121" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">c</text>
  <text x="334" y="121" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">p</text>
  <text x="394" y="121" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">l</text>
  <text x="454" y="121" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">e</text>
  <text x="514" y="121" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">a</text>

  <path d="M 94 136 L 94 166" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 214 136 L 214 166" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 334 136 L 334 166" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 394 136 L 394 166" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 454 136 L 454 166" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <text x="36" y="182" font-size="12" fill="#666" filter="url(#rough2)">w =</text>
  <text x="94" y="182" text-anchor="middle" font-size="15" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="214" y="182" text-anchor="middle" font-size="15" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">p</text>
  <text x="334" y="182" text-anchor="middle" font-size="15" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">p</text>
  <text x="394" y="182" text-anchor="middle" font-size="15" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="454" y="182" text-anchor="middle" font-size="15" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">e</text>

  <text x="32" y="206" font-size="10.5" fill="#555" filter="url(#rough2)">命中下标 0 → 2 → 4 → 5 → 6；贪心「能配就配」，被跳过的 b、c、a 不参与匹配</text>

  <path d="M 30 222 L 590 222" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="32" y="244" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 按 key = (−|w|, w) 升序排序：第一个合法词就是答案</text>

  <rect x="60" y="256" width="126" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="196" y="256" width="126" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="332" y="256" width="126" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="468" y="256" width="126" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="123" y="274" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">monkey</text>
  <text x="259" y="274" text-anchor="middle" font-size="13" fill="#3a5a30" filter="url(#rough2)">apple</text>
  <text x="395" y="274" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">plea</text>
  <text x="531" y="274" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">ale</text>

  <text x="123" y="292" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">长度 6</text>
  <text x="259" y="292" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">长度 5</text>
  <text x="395" y="292" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">长度 4</text>
  <text x="531" y="292" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">长度 3</text>

  <text x="123" y="318" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">失败：s 中没有 m</text>
  <text x="259" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">命中 → 立即返回</text>
  <text x="395" y="318" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">不再检查</text>
  <text x="531" y="318" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">不再检查</text>

  <path d="M 186 278 L 194 278" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 322 278 L 330 278" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 458 278 L 466 278" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="332" width="540" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="354" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">键 (−|w|, w)：先比长度（长者在先），长度相同再比字典序（小者在先）。</text>
  <text x="56" y="372" font-size="10.5" fill="#555" filter="url(#rough2)">排序后从左往右第一个通过判定的词，必然最长且字典序最小，无需再比较 best。</text>
  <text x="56" y="390" font-size="10.5" fill="#555" filter="url(#rough2)">复杂度 O(k log k · L + k(n + L))，其中 k、n、L ≤ 1000。</text>
</svg>
