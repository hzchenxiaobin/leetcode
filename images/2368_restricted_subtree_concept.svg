<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：受限节点是"路障"，挡住背后整棵子树</text>
  <path d="M 170 40 Q 340 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="150" y="76" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#sk)">示例 1：n=7，restricted=[4,5]</text>

  <!-- edges -->
  <g filter="url(#sk)">
    <path d="M 300 108 L 200 190" stroke="#4a8e4a" stroke-width="2" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 300 108 L 300 190" stroke="#b85450" stroke-width="2" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 300 108 L 400 190" stroke="#b85450" stroke-width="2" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 200 190 L 140 268" stroke="#4a8e4a" stroke-width="2" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 200 190 L 240 268" stroke="#4a8e4a" stroke-width="2" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 400 190 L 400 268" stroke="#999" stroke-width="1.8" stroke-dasharray="5,4" fill="none"/>
  </g>

  <!-- node 0 (start) -->
  <g filter="url(#sk)">
    <ellipse cx="300" cy="108" rx="21" ry="21" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.6"/>
  </g>
  <text x="300" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">0</text>
  <text x="300" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">起点</text>

  <!-- node 1 -->
  <g filter="url(#sk)">
    <ellipse cx="200" cy="190" rx="21" ry="21" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="200" y="196" text-anchor="middle" font-size="16" fill="#2e6e2e" filter="url(#sk)">1</text>

  <!-- node 2 -->
  <g filter="url(#sk)">
    <ellipse cx="140" cy="268" rx="21" ry="21" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="140" y="274" text-anchor="middle" font-size="16" fill="#2e6e2e" filter="url(#sk)">2</text>

  <!-- node 3 -->
  <g filter="url(#sk)">
    <ellipse cx="240" cy="268" rx="21" ry="21" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="240" y="274" text-anchor="middle" font-size="16" fill="#2e6e2e" filter="url(#sk)">3</text>

  <!-- node 4 (restricted) -->
  <g filter="url(#sk)">
    <ellipse cx="300" cy="190" rx="21" ry="21" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="300" y="196" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#sk)">4</text>
  <g filter="url(#sk)">
    <path d="M 318 172 L 336 154 M 336 172 L 318 154" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="300" y="232" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">受限</text>

  <!-- node 5 (restricted) -->
  <g filter="url(#sk)">
    <ellipse cx="400" cy="190" rx="21" ry="21" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="400" y="196" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#sk)">5</text>
  <g filter="url(#sk)">
    <path d="M 418 172 L 436 154 M 436 172 L 418 154" stroke="#b85450" stroke-width="2.4"/>
  </g>
  <text x="400" y="232" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">受限</text>

  <!-- node 6 (cut off) -->
  <g filter="url(#sk)">
    <ellipse cx="400" cy="268" rx="21" ry="21" fill="#f2f2ee" stroke="#999" stroke-width="1.6" stroke-dasharray="4,3"/>
  </g>
  <text x="400" y="274" text-anchor="middle" font-size="16" fill="#888" filter="url(#sk)">6</text>
  <text x="400" y="310" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">被牵连：不可达</text>

  <!-- answer annotation -->
  <text x="180" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">可达 {0,1,2,3} → ans = 4</text>

  <!-- legend box -->
  <g filter="url(#sk)">
    <rect x="492" y="70" width="164" height="116" rx="10" fill="#fbfaf5" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <ellipse cx="514" cy="94" rx="10" ry="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="530" y="99" font-size="11" fill="#444" filter="url(#sk)">可达，计入 ans</text>
  <g filter="url(#sk)">
    <ellipse cx="514" cy="124" rx="10" ry="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="530" y="129" font-size="11" fill="#444" filter="url(#sk)">受限：路障 ✗</text>
  <g filter="url(#sk)">
    <ellipse cx="514" cy="154" rx="10" ry="10" fill="#f2f2ee" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <text x="530" y="159" font-size="11" fill="#444" filter="url(#sk)">被牵连，不可达</text>

  <!-- left box: why subtree is cut -->
  <g filter="url(#sk)">
    <rect x="40" y="330" width="296" height="108" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="188" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04040" filter="url(#sk)">路障为什么挡住整棵子树？</text>
  <text x="56" y="376" font-size="11.5" fill="#444" filter="url(#sk)">树中 0→v 的简单路径唯一</text>
  <text x="56" y="396" font-size="11.5" fill="#444" filter="url(#sk)">路径必经受限点 ⇒ v 不可达</text>
  <text x="56" y="418" font-size="11.5" fill="#a04040" filter="url(#sk)">6 的唯一路径 0→5→6 必经 5 ✗</text>

  <!-- right box: algorithm meaning -->
  <g filter="url(#sk)">
    <rect x="356" y="330" width="284" height="108" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="498" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">对算法的意义</text>
  <text x="372" y="376" font-size="11.5" fill="#444" filter="url(#sk)">BFS 遇受限点：不入队、不扩展</text>
  <text x="372" y="396" font-size="11.5" fill="#444" filter="url(#sk)">身后子树自动失联，无需显式删点</text>
  <text x="372" y="418" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">一次 O(n) 遍历收割整个可达块</text>
</svg>
