  <rect width="940" height="470" fill="#fdfcf7"/>
  <text x="470" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：两次剥叶——把「不必踏足」的部分全部剪掉</text>
  <text x="470" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">① 无币子树整枝剪掉（级联）　② 带币叶外两层免走（快照两轮）　③ 剩余核心每条边恰走 2 次</text>
  <path d="M 230 60 Q 470 68 710 60" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

