  <text x="102" y="170" font-size="10" fill="#7a5415" filter="url(#sk)">金币</text>
  <g filter="url(#sk)"><circle cx="526" cy="166" r="5" fill="#f4c542" stroke="#d6a040" stroke-width="1"/></g>
  <text x="534" y="170" font-size="10" fill="#7a5415" filter="url(#sk)">金币</text>
  <g filter="url(#sk)"><circle cx="850" cy="166" r="5" fill="#f4c542" stroke="#d6a040" stroke-width="1"/></g>
  <text x="858" y="170" font-size="10" fill="#7a5415" filter="url(#sk)">金币</text>

  <text x="448" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">③ 剩余核心：每条边恰走 2 次（去 + 回）</text>
  <text x="128" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">② 带币叶外两层免走</text>
  <text x="786" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">② 带币叶外两层免走</text>

  <text x="40" y="294" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">① 无金币子树</text>
  <text x="40" y="312" font-size="10.5" fill="#8a3a36" filter="url(#sk)">级联剪到叶子全带币</text>
  <g filter="url(#sk)"><path d="M 178 304 L 328 306" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)"/></g>

  <g filter="url(#sk)"><path d="M 272 162 Q 178 112 84 162" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arG)"/></g>
  <text x="178" y="100" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">距离 2：站 A 即可收 L0 的币</text>
  <g filter="url(#sk)"><path d="M 624 162 Q 718 112 812 162" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arG)"/></g>
  <text x="718" y="100" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">距离 2：站 D 即可收 L1 的币</text>

  <g filter="url(#sk)"><rect x="252" y="430" width="460" height="34" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="282" y="452" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">答案 = 2 × 核心边数（本例核心 A—B—C—D 有 3 条边 → 答案 6）</text>
</svg>
