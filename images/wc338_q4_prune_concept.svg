  <text x="826" y="183" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">叶</text>

  <g filter="url(#sk)"><circle cx="394" cy="258" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3"/></g>
  <g filter="url(#sk)"><path d="M 387 251 L 401 265 M 387 265 L 401 251" stroke="#b85450" stroke-width="1.8" fill="none"/></g>
