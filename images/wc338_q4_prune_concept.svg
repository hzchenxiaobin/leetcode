  <g filter="url(#sk)"><circle cx="502" cy="178" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="502" y="183" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">C</text>
  <g filter="url(#sk)"><circle cx="610" cy="178" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="610" y="183" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">D</text>
