  <g filter="url(#sk)"><rect x="696" y="142" width="180" height="72" rx="10" fill="#fff8e1" fill-opacity="0.5" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="7,5"/></g>
  <g filter="url(#sk)"><rect x="336" y="230" width="116" height="188" rx="10" fill="#fce4ec" fill-opacity="0.4" stroke="#b85450" stroke-width="1.5" stroke-dasharray="7,5"/></g>

