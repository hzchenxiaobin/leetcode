<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="32" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">答案范围：只可能是 q 或 q+1</text>
  <text x="310" y="54" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">m = |a|，L = |b|，q = ⌈L / m⌉；匹配窗口最多跨越 q+1 个 a 块</text>

  <!-- 5 个 a 块 -->
  <g filter="url(#rough2)">
    <rect x="60" y="96" width="100" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="160" y="96" width="100" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="260" y="96" width="100" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="360" y="96" width="100" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="460" y="96" width="100" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="20" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="110" y="130">a</text>
    <text x="210" y="130">a</text>
    <text x="310" y="130">a</text>
    <text x="410" y="130">a</text>
    <text x="510" y="130">a</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="110" y="166">第 0 块</text>
    <text x="210" y="166">第 1 块</text>
    <text x="310" y="166">第 2 块</text>
    <text x="410" y="166">第 3 块</text>
    <text x="510" y="166">第 4 块</text>
  </g>

  <!-- b 窗口：起点在块内偏移 52px 处，长度 200px（= 2m） -->
  <text x="212" y="190" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">窗口起点落在块内偏移 r 处</text>
  <rect x="112" y="198" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="212" y="226" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">b（|b| = L）</text>
  <path d="M 312 190 L 312 252" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="322" y="258" font-size="10" fill="#b85450" filter="url(#rough2)">尾部溢到下一块</text>

  <text x="310" y="292" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">窗口跨第 0~2 块共 3 = q+1 块，所以 a³ 一定够长</text>

  <rect x="70" y="312" width="480" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#3a5a30" filter="url(#rough2)">
    <text x="88" y="336">下界：k·m ≥ L ⇒ k ≥ q，块数更少时长度都不够，必然失败</text>
    <text x="88" y="358">上界：任意偏移 r ∈ [0, m−1]，ceil((r+L)/m) ≤ q+1，故 a 重复 q+1 次必然够</text>
  </g>
</svg>
