<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="880" height="420" fill="#fafafa"/>

  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">段表构造：从 a − 1 的段表推出 a 的段表</text>
  <text x="440" y="55" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">F(a, ·) 是 [a, n] 上的不增阶梯函数，断点恰好是 a 的平滑数</text>

  <!-- 左侧：a-1 的段表（小阶梯） -->
  <rect x="30" y="74" width="310" height="196" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="98" font-size="12.6" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a − 1 的段表（已知）</text>
  <path d="M 56 226 L 326 226" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 62 152 L 146 152 L 146 180 L 234 180 L 234 206 L 320 206"
        stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="101" y="146" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">v₁</text>
  <text x="190" y="174" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">v₂</text>
  <text x="278" y="200" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">v₃</text>
  <text x="188" y="248" text-anchor="middle" font-size="11.2" fill="#2f4a66" filter="url(#rough2)">随 b 增大，值单调不增</text>
  <text x="46" y="118" font-size="11.2" fill="#777" filter="url(#rough2)">覆盖 [a − 1, n]，每段是一个常数值</text>

  <!-- 中间箭头 -->
  <path d="M 346 172 L 388 172" stroke="#446688" stroke-width="1.9" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="367" y="162" text-anchor="middle" font-size="10.8" fill="#446688" filter="url(#rough2)">合成</text>

  <!-- 中间：bucket[a] -->
  <rect x="396" y="74" width="220" height="196" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="412" y="98" font-size="12.4" font-weight="bold" fill="#8a6015" filter="url(#rough2)">bucket[a]</text>
  <text x="412" y="120" font-size="11.2" fill="#8a6015" filter="url(#rough2)">升序存放所有 k：</text>
  <text x="412" y="140" font-size="11.2" fill="#8a6015" filter="url(#rough2)">k &gt; a 且 rad(k) | a</text>
  <rect x="412" y="154" width="188" height="30" rx="6" fill="#fafafa" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="506" y="174" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">s₁ &lt; s₂ &lt; s₃ &lt; ⋯</text>
  <text x="412" y="208" font-size="11.2" fill="#8a6015" filter="url(#rough2)">例 a = 6：8, 9, 12, 16, 18, 24, ⋯</text>
  <text x="412" y="230" font-size="11.2" fill="#8a6015" filter="url(#rough2)">（即 2^i·3^j 这些数）</text>
  <text x="412" y="254" font-size="11.2" fill="#8a6015" filter="url(#rough2)">总量 Σ_k ⌊(k−1)/rad(k)⌋</text>

  <!-- 右侧 -->
  <rect x="636" y="74" width="216" height="196" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="652" y="98" font-size="12.4" font-weight="bold" fill="#33582a" filter="url(#rough2)">a 的段表（新）</text>
  <text x="652" y="122" font-size="11.2" fill="#33582a" filter="url(#rough2)">首段 [a, s₁ − 1] → a</text>
  <text x="652" y="148" font-size="11.2" fill="#33582a" filter="url(#rough2)">之后对每个 i：</text>
  <text x="652" y="168" font-size="11.2" fill="#33582a" filter="url(#rough2)">  区间 [s(i), s(i+1) − 1]</text>
  <text x="652" y="188" font-size="11.2" fill="#33582a" filter="url(#rough2)">  取值 F(a − 1, s(i) − 1)</text>
  <text x="652" y="214" font-size="11.2" fill="#33582a" filter="url(#rough2)">（区间内最大的 a-平滑数是 s(i)，</text>
  <text x="652" y="234" font-size="11.2" fill="#33582a" filter="url(#rough2)">  于是递归落到 a − 1）</text>

  <!-- 底部：双指针 -->
  <rect x="30" y="306" width="822" height="100" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="48" y="330" font-size="12.6" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">双指针求值：s(i) − 1 随 i 递增 ⇒ 在 a − 1 的段表上只需右移一个指针</text>
  <text x="48" y="356" font-size="11.8" fill="#8c3a37" filter="url(#rough2)">指针 p 满足：段表第 p 段左端点 ≤ s(i) − 1 且第 p + 1 段左端点 &gt; s(i) − 1，则该段的值就是 F(a − 1, s(i) − 1)。</text>
  <text x="48" y="380" font-size="11.8" fill="#8c3a37" filter="url(#rough2)">每个 a 的处理量是 O(|bucket[a]| + |a − 1 的段数|)，两处总量都是 Σ_k ⌊(k−1)/rad(k)⌋，n = 3×10⁵ 时约 6×10⁶。</text>
  <text x="48" y="400" font-size="11.8" fill="#8c3a37" filter="url(#rough2)">答案在造段的同时累加：A(u) · 值 · (prefB[R] − prefB[L − 1])，无需保留任何历史段表。</text>
</svg>
