<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="171" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="940" height="500" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：s = "aaabc"，枚举到 c = 2</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== table ===== -->
  <g font-size="12" fill="#333">
    <g filter="url(#sk)" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4">
      <rect x="60" y="66" width="100" height="36" rx="4"/>
      <rect x="160" y="66" width="80" height="36" rx="4"/>
      <rect x="240" y="66" width="90" height="36" rx="4"/>
      <rect x="330" y="66" width="100" height="36" rx="4"/>
      <rect x="430" y="66" width="80" height="36" rx="4"/>
      <rect x="510" y="66" width="80" height="36" rx="4"/>
    </g>
    <g filter="url(#sk)">
      <rect x="60" y="102" width="100" height="42" rx="4" fill="#fffdf3" stroke="#8a8a8a" stroke-width="1.2"/>
      <rect x="160" y="102" width="80" height="42" rx="4" fill="#fffdf3" stroke="#8a8a8a" stroke-width="1.2"/>
      <rect x="240" y="102" width="90" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
      <rect x="330" y="102" width="100" height="42" rx="4" fill="#fffdf3" stroke="#8a8a8a" stroke-width="1.2"/>
      <rect x="430" y="102" width="80" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
      <rect x="510" y="102" width="80" height="42" rx="4" fill="#f0ede4" stroke="#aaa" stroke-width="1.2"/>
      <rect x="60" y="144" width="100" height="42" rx="4" fill="#fffdf3" stroke="#8a8a8a" stroke-width="1.2"/>
      <rect x="160" y="144" width="80" height="42" rx="4" fill="#fffdf3" stroke="#8a8a8a" stroke-width="1.2"/>
      <rect x="240" y="144" width="90" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
      <rect x="330" y="144" width="100" height="42" rx="4" fill="#fffdf3" stroke="#8a8a8a" stroke-width="1.2"/>
      <rect x="430" y="144" width="80" height="42" rx="4" fill="#f0ede4" stroke="#aaa" stroke-width="1.2"/>
      <rect x="510" y="144" width="80" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
      <rect x="60" y="186" width="100" height="42" rx="4" fill="#fffdf3" stroke="#8a8a8a" stroke-width="1.2"/>
      <rect x="160" y="186" width="80" height="42" rx="4" fill="#fffdf3" stroke="#8a8a8a" stroke-width="1.2"/>
      <rect x="240" y="186" width="90" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
      <rect x="330" y="186" width="100" height="42" rx="4" fill="#fffdf3" stroke="#8a8a8a" stroke-width="1.2"/>
      <rect x="430" y="186" width="80" height="42" rx="4" fill="#f0ede4" stroke="#aaa" stroke-width="1.2"/>
      <rect x="510" y="186" width="80" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    </g>
  </g>
  <g font-size="12" fill="#2b2b2b" font-weight="bold">
    <text x="110" y="88" text-anchor="middle">字母</text>
    <text x="200" y="88" text-anchor="middle">occ</text>
    <text x="285" y="88" text-anchor="middle">目标 t</text>
    <text x="380" y="88" text-anchor="middle">|occ − t|</text>
    <text x="470" y="88" text-anchor="middle">盈余</text>
    <text x="550" y="88" text-anchor="middle">缺口</text>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="110" y="128">a</text>
    <text x="200" y="128">3</text>
    <text x="285" y="128">2</text>
    <text x="380" y="128">1</text>
    <text x="470" y="128" fill="#b85450" font-weight="bold">1</text>
    <text x="550" y="128">0</text>
    <text x="110" y="170">b</text>
    <text x="200" y="170">1</text>
    <text x="285" y="170">2</text>
    <text x="380" y="170">1</text>
    <text x="470" y="170">0</text>
    <text x="550" y="170" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="110" y="212">c</text>
    <text x="200" y="212">1</text>
    <text x="285" y="212">2</text>
    <text x="380" y="212">1</text>
    <text x="470" y="212">0</text>
    <text x="550" y="212" fill="#2e6e2e" font-weight="bold">1</text>
  </g>

  <!-- bridge arrow: a's surplus cell -> b's gap cell -->
  <path d="M 462 138 Q 508 160 528 154" stroke="#c98a2b" stroke-width="2.2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="480" y="238" text-anchor="middle" font-size="10.5" fill="#7a5415">↘ 箭头：a 的盈余 1 右移一格，填 b 的缺口 1</text>

  <!-- ===== right panel: edge savings ===== -->
  <g filter="url(#sk)">
    <rect x="630" y="66" width="276" height="162" rx="10" fill="#fffdf3" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="768" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">相邻边的搭桥节省</text>
  <text x="768" y="118" text-anchor="middle" font-size="11.5" fill="#7a5415">边 (a, b)：min(盈余 1, 缺口 1) = 1</text>
  <text x="768" y="138" text-anchor="middle" font-size="11" fill="#555">→ 把一个 a 变成 b（官方解释第 1 步）</text>
  <text x="768" y="166" text-anchor="middle" font-size="11.5" fill="#888">边 (b, c)：min(盈余 0, 缺口 1) = 0</text>
  <text x="768" y="186" text-anchor="middle" font-size="11" fill="#555">→ b 无盈余，无法再搭桥</text>
  <text x="768" y="214" text-anchor="middle" font-size="11" fill="#555">→ c 的缺口 1 只能靠「插入」补上</text>

  <!-- ===== bottom result ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="262" width="846" height="88" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="90" y="294" font-size="15" font-weight="bold" fill="#2b2b2b">总代价 = 基础代价 − 搭桥节省 = (1+1+1) − (1+0) = 2 ✓</text>
  <text x="90" y="322" font-size="12" fill="#444">对应官方解释：将一个 'a' 变为 'b'（搭桥，省 1）＋ 往 s 中插入一个 'c'（补缺口）。</text>
  <text x="90" y="340" font-size="12" fill="#444">DP 同时枚举每个字母「目标 0 / 目标 c」的全部组合（26 个字母共 2²⁶ 种），t = [2,2,2] 恰为最优。</text>

  <!-- ===== bottom note ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="372" width="846" height="106" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="90" y="400" font-size="12.5" font-weight="bold" fill="#7a5415">换个 c 试试（多解并列，取 min 不受影响）：</text>
  <text x="90" y="426" font-size="12" fill="#444">c = 1：t = [1,1,1]，删两个 'a' 得 "abc"，代价 2；　c = 3：t = [3,0,0]，删 'b'、'c' 得 "aaa"，代价 2。</text>
  <text x="90" y="450" font-size="12" fill="#444">示例 1 "acab"（occ = [2,1,0,1]）：c = 1 时基础代价 1，a 的盈余右邻 b 无缺口、省 0 ⇒ 答案 1；</text>
  <text x="90" y="470" font-size="12" fill="#444">示例 2 "wddw"（occ_w = occ_d = 2）：c = 2 时全部达标，答案 0。</text>
</svg>
