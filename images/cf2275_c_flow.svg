<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="470" fill="#fafafa"/>
  <text x="350" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：总和减去重叠</text>

  <!-- 步骤 1 -->
  <rect x="240" y="40" width="220" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="67" text-anchor="middle" font-size="15" fill="#2b4a66" filter="url(#rough2)">读入 n 与 a[1..n]</text>
  <path d="M350,84 L350,112" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="90" y="114" width="520" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="138" text-anchor="middle" font-size="15" fill="#8a5c10" filter="url(#rough2)">① 求出 m = n − 4 把三和弦的数值</text>
  <text x="350" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">f[x] = a[x] + a[x+2] − a[x+4]，x = 1..m</text>
  <path d="M350,176 L350,204" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="90" y="206" width="520" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="230" text-anchor="middle" font-size="15" fill="#2f5d25" filter="url(#rough2)">② 按 f 值分组，同值者两两配对</text>
  <text x="350" y="252" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">total = Σ C(cnt, 2)　（暂不管是否撞键）</text>
  <path d="M350,268 L350,296" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 4 -->
  <rect x="90" y="298" width="520" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="322" text-anchor="middle" font-size="15" fill="#8f3a37" filter="url(#rough2)">③ 扣掉会共用琴键的组合</text>
  <text x="350" y="344" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">bad += [ f[x] = f[x+d] ]，d = 2, 4</text>
  <path d="M350,360 L350,388" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 输出 -->
  <rect x="240" y="390" width="220" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="350" y="419" text-anchor="middle" font-size="16" fill="#2b4a66" filter="url(#rough2)">输出 total − bad</text>

  <text x="628" y="120" font-size="12" fill="#777" filter="url(#rough2)">三者都是</text>
  <text x="628" y="138" font-size="12" fill="#777" filter="url(#rough2)">线性扫描</text>
</svg>
