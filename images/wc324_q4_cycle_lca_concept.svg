<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：树上加一条边恰好产生一个环 —— 环长 = 1 条新边 + a→b 的树上路径</text>
  <path d="M 200 42 Q 470 50 740 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="64" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">树上路径唯一且必过最近公共祖先：dist(a,b) = dep(a) + dep(b) − 2·dep(LCA)</text>

  <!-- left: the tree with query [4,7] -->
  <rect x="30" y="82" width="462" height="452" rx="12" fill="#f7fafc" stroke="#d8e0ea" stroke-width="1.2" filter="url(#sk)"/>
  <text x="261" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">n = 3 的完全二叉树（堆式编号），查询 [4, 7]</text>

  <!-- plain tree edges -->
  <path d="M 260 168 L 172 258" stroke="#9aa7b5" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 260 168 L 348 258" stroke="#9aa7b5" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 172 258 L 128 352" stroke="#9aa7b5" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 172 258 L 216 352" stroke="#9aa7b5" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 348 258 L 304 352" stroke="#9aa7b5" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 348 258 L 392 352" stroke="#9aa7b5" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- cycle tree-path overlay: 4-2-1-3-7 -->
  <path d="M 128 352 L 172 258" stroke="#c98a2b" stroke-width="3.2" fill="none" filter="url(#sk)"/>
  <path d="M 172 258 L 260 168" stroke="#c98a2b" stroke-width="3.2" fill="none" filter="url(#sk)"/>
  <path d="M 260 168 L 348 258" stroke="#c98a2b" stroke-width="3.2" fill="none" filter="url(#sk)"/>
  <path d="M 348 258 L 392 352" stroke="#c98a2b" stroke-width="3.2" fill="none" filter="url(#sk)"/>

  <!-- the added edge -->
  <path d="M 128 372 Q 260 448 392 372" stroke="#b85450" stroke-width="2.4" stroke-dasharray="8,6" fill="none" filter="url(#sk)"/>
  <text x="260" y="436" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">新加边 (4, 7)</text>

  <!-- LCA label above node 1 -->
  <text x="260" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">LCA(4,7) = 1</text>

  <!-- nodes -->
  <circle cx="260" cy="168" r="26" fill="none" stroke="#c98a2b" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#sk)"/>
  <circle cx="260" cy="168" r="21" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.6" filter="url(#sk)"/>
  <text x="260" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">1</text>

  <circle cx="172" cy="258" r="19" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" filter="url(#sk)"/>
  <text x="172" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">2</text>
  <circle cx="348" cy="258" r="19" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" filter="url(#sk)"/>
  <text x="348" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">3</text>

  <circle cx="128" cy="352" r="19" fill="#fdeaea" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="128" y="357" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#sk)">4</text>
  <circle cx="392" cy="352" r="19" fill="#fdeaea" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="392" y="357" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#sk)">7</text>

  <circle cx="216" cy="352" r="19" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="216" y="357" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#sk)">5</text>
  <circle cx="304" cy="352" r="19" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="304" y="357" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#sk)">6</text>

  <text x="261" y="472" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#444" filter="url(#sk)">环：4→2→1→3→7→4 = 4 条树边 + 1 条新边 = 5</text>
  <text x="261" y="496" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">红色端点 = 查询两端，橙色粗边 = 环上的树边</text>

  <!-- right top: formula box -->
  <rect x="510" y="82" width="400" height="196" rx="10" fill="#eef3f9" stroke="#7a94b8" stroke-width="1.5" filter="url(#sk)"/>
  <text x="530" y="110" font-size="14" font-weight="bold" fill="#2b4a66" filter="url(#sk)">环长公式（无需建树）</text>
  <text x="530" y="138" font-size="12.5" fill="#333" filter="url(#sk)">parent(v) = ⌊v/2⌋ = v ≫ 1　（父节点编号）</text>
  <text x="530" y="164" font-size="12.5" fill="#333" filter="url(#sk)">dep(v) = ⌊log₂ v⌋ = bit_length(v) − 1</text>
  <text x="530" y="190" font-size="12.5" fill="#333" filter="url(#sk)">第 d 层恰为编号区间 [2^d, 2^(d+1) − 1]</text>
  <text x="530" y="220" font-size="13.5" font-weight="bold" fill="#2b4a66" filter="url(#sk)">环长 = dep(a) + dep(b) − 2·dep(LCA) + 1</text>
  <text x="530" y="246" font-size="12.5" fill="#4a7a3a" filter="url(#sk)">本例：2 + 2 − 2×0 + 1 = 5 ✓</text>

  <!-- right bottom: binary insight box -->
  <rect x="510" y="298" width="400" height="236" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="530" y="326" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">编号即路径：二进制视角</text>
  <text x="530" y="354" font-size="12.5" fill="#333" filter="url(#sk)">v 的二进制去掉首位 1，就是根→v 的走法</text>
  <text x="530" y="378" font-size="12.5" fill="#333" filter="url(#sk)">（0 = 走左孩子，1 = 走右孩子）</text>
  <text x="530" y="408" font-size="12.5" fill="#333" filter="url(#sk)">4 = 100₂ → 左、左　　7 = 111₂ → 右、右</text>
  <text x="530" y="438" font-size="12.5" fill="#333" filter="url(#sk)">公共前缀「1」⟹ LCA = 1（最深公共祖先）</text>
  <text x="530" y="468" font-size="12.5" fill="#333" filter="url(#sk)">对齐长度后，a ⊕ b 的最高位即分叉处</text>
  <text x="530" y="496" font-size="12" fill="#666" filter="url(#sk)">—— 这就是 O(1) 位技巧的种子（见正文 §4）</text>
</svg>
