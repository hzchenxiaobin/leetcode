<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历求 U，再做一次比较</text>

  <rect x="120" y="48" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">输入 candyType，长度 n（n 为偶数）</text>

  <path d="M 260 88 L 260 112" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="116" width="320" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">把每个 candyType[i] 插入哈希集合</text>
  <text x="260" y="153" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">遍历结束 → 集合大小即种类数 U</text>

  <path d="M 260 162 L 260 186" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="190" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="215" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">可吃枚数 k = n / 2</text>

  <path d="M 260 230 L 260 254" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="258" width="240" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="12.5" fill="#2f5a26" font-weight="bold" filter="url(#rough2)">返回 min(U, k)</text>
  <text x="260" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">无需排序，无需枚举方案</text>

  <rect x="60" y="336" width="400" height="50" fill="#f7f7f4" stroke="#888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="76" y="356" font-size="10.5" fill="#555" filter="url(#rough2)">时间 O(n)：每个元素一次哈希插入，均摊 O(1)</text>
  <text x="76" y="374" font-size="10.5" fill="#555" filter="url(#rough2)">空间 O(U) ≤ O(n)：只存去重后的种类</text>
</svg>
