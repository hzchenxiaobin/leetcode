<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="880" height="500" fill="#fafafa"/>
  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：skill = [3,2,5,1,3,4]</text>
  <path d="M 270 40 Q 440 48 610 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Step 1 -->
  <rect x="50" y="54" width="380" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="76" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">Step 1：求目标和 T</text>
  <text x="64" y="98" font-size="12" fill="#333" filter="url(#rough2)">total = 3+2+5+1+3+4 = 18，n = 6</text>
  <text x="64" y="118" font-size="12" fill="#333" filter="url(#rough2)">n/2 = 3</text>
  <text x="64" y="138" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">18 % 3 = 0 ✓ → T = 6</text>

  <!-- Step 2 -->
  <rect x="450" y="54" width="380" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="464" y="76" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">Step 2：排序 + 双指针</text>
  <text x="464" y="98" font-size="12" fill="#333" filter="url(#rough2)">[3,2,5,1,3,4] → [1,2,3,3,4,5]</text>
  <text x="464" y="118" font-size="12" fill="#333" filter="url(#rough2)">i 从左端、j 从右端相向推进</text>
  <text x="464" y="138" font-size="11" fill="#777" filter="url(#rough2)">首尾配对，逐对验和</text>

  <path d="M 240 150 L 240 166" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M 640 150 L 640 166" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- 配对演算表 -->
  <rect x="80" y="170" width="720" height="134" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="80" y="170" width="720" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="115" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">轮次</text>
  <text x="205" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">i / j</text>
  <text x="325" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">配对 (a[i],a[j])</text>
  <text x="440" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">和</text>
  <text x="540" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">判定</text>
  <text x="635" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">乘积</text>
  <text x="740" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">ans 累计</text>

  <path d="M 80 202 L 800 202" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 80 236 L 800 236" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 80 270 L 800 270" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 150 170 L 150 304" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 260 170 L 260 304" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 390 170 L 390 304" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 490 170 L 490 304" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 590 170 L 590 304" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 680 170 L 680 304" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>

  <text x="115" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="205" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i=0, j=5</text>
  <text x="325" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 5)</text>
  <text x="440" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="540" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓</text>
  <text x="635" y="224" text-anchor="middle" font-size="12" fill="#b87a20" filter="url(#rough2)">1×5 = 5</text>
  <text x="740" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">5</text>

  <text x="115" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="205" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i=1, j=4</text>
  <text x="325" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2, 4)</text>
  <text x="440" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="540" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓</text>
  <text x="635" y="258" text-anchor="middle" font-size="12" fill="#b87a20" filter="url(#rough2)">2×4 = 8</text>
  <text x="740" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">5+8 = 13</text>

  <text x="115" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="205" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i=2, j=3</text>
  <text x="325" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(3, 3)</text>
  <text x="440" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="540" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">✓</text>
  <text x="635" y="292" text-anchor="middle" font-size="12" fill="#b87a20" filter="url(#rough2)">3×3 = 9</text>
  <text x="740" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">13+9 = 22</text>

  <!-- 结果 -->
  <rect x="80" y="316" width="720" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="341" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">三对验和全部通过 → 返回 ans = 22 ✓</text>

  <!-- 反例 -->
  <rect x="50" y="380" width="780" height="100" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <text x="70" y="406" font-size="13" font-weight="bold" fill="#8e3030" filter="url(#rough2)">反例：skill = [1,1,2,3]（示例 3）</text>
  <text x="70" y="428" font-size="12" fill="#555" filter="url(#rough2)">total = 1+1+2+3 = 7，n/2 = 2，但 7 % 2 = 1 ≠ 0</text>
  <text x="70" y="450" font-size="12" fill="#555" filter="url(#rough2)">目标和 T = 3.5 不是整数 → 第一道门直接返回 -1，无需排序配对</text>
  <text x="70" y="470" font-size="10.5" fill="#999" filter="url(#rough2)">整除性快门的价值：无解输入被 O(1) 判定提前拦截</text>
</svg>
