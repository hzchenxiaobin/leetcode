<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 524" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="680" height="524" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：n = 4，m = 6</text>
  <path d="M 250 42 Q 340 50 430 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 左：原图 -->
  <text x="190" y="58" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">原图（6 条边，3 种类型）</text>
  <g filter="url(#rough2)">
    <!-- 重复的类型 1 边 (1,2)：弧线 -->
    <path d="M 110 112 Q 190 64 270 112" stroke="#8aa8cc" stroke-width="1.8" stroke-dasharray="5 4" fill="none"/>
    <text x="190" y="76" text-anchor="middle" font-size="10" fill="#7a94b8">1 · (1,2) 重复</text>
    <circle cx="190" cy="100" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="190" y="104" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">✗</text>

    <!-- 冗余对角线 (1,3)：灰虚线 -->
    <path d="M 122 142 L 258 268" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4" fill="none"/>
    <text x="248" y="252" text-anchor="start" font-size="10" fill="#999">1 · (1,3)</text>
    <circle cx="228" cy="240" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="228" y="244" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">✗</text>

    <!-- 保留边 -->
    <path d="M 258 142 L 122 268" stroke="#446688" stroke-width="2.4"/>
    <text x="148" y="232" text-anchor="end" font-size="10" fill="#446688">1 · (2,4) ✓</text>
    <path d="M 127 130 L 253 130" stroke="#d6a040" stroke-width="4"/>
    <text x="190" y="118" text-anchor="middle" font-size="10" fill="#b07818">3 · (1,2) ✓</text>
    <path d="M 270 147 L 270 263" stroke="#d6a040" stroke-width="4"/>
    <text x="282" y="207" text-anchor="start" font-size="10" fill="#b07818">3 · (2,3) ✓</text>
    <path d="M 253 280 L 127 280" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="190" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a">2 · (3,4) ✓</text>

    <!-- 节点 -->
    <circle cx="110" cy="130" r="17" fill="#ffffff" stroke="#555" stroke-width="1.8"/>
    <circle cx="270" cy="130" r="17" fill="#ffffff" stroke="#555" stroke-width="1.8"/>
    <circle cx="270" cy="280" r="17" fill="#ffffff" stroke="#555" stroke-width="1.8"/>
    <circle cx="110" cy="280" r="17" fill="#ffffff" stroke="#555" stroke-width="1.8"/>
    <text x="110" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
    <text x="270" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
    <text x="270" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3</text>
    <text x="110" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">4</text>
  </g>
  <text x="190" y="330" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">实线 = 保留（4 条）· 虚线 = 删除（2 条）</text>

  <!-- 右：三遍处理 -->
  <g filter="url(#rough2)">
    <rect x="390" y="64" width="272" height="82" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="526" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a5a10">第一遍 · 只看类型 3</text>
    <text x="526" y="106" text-anchor="middle" font-size="11" fill="#333">(1,2) 合并 ✓ keep=1；(2,3) 合并 ✓ keep=2</text>
    <text x="526" y="124" text-anchor="middle" font-size="11" fill="#333">两套并查集同步 → 分量 {1,2,3}{4}</text>
    <text x="526" y="140" text-anchor="middle" font-size="10.5" fill="#888">剩余公共边：无</text>

    <rect x="390" y="156" width="272" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="526" y="178" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">第二遍 · 类型 1（Alice）</text>
    <text x="526" y="198" text-anchor="middle" font-size="11" fill="#333">(1,3)：1、3 已同分量 → ✗ 删</text>
    <text x="526" y="216" text-anchor="middle" font-size="11" fill="#333">(2,4)：合并 {123}+{4} → ✓ keep=3</text>
    <text x="526" y="234" text-anchor="middle" font-size="11" fill="#333">(1,2)：与公共边重复 → ✗ 删</text>
    <text x="526" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a66">Alice 全连通 ✓</text>

    <rect x="390" y="268" width="272" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="526" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a20">第二遍 · 类型 2（Bob）</text>
    <text x="526" y="310" text-anchor="middle" font-size="11" fill="#333">(3,4)：合并 {123}+{4} → ✓ keep=4</text>
    <text x="526" y="326" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a20">Bob 全连通 ✓</text>
  </g>

  <!-- 并查集分量演变 -->
  <text x="340" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">并查集分量演变（第一遍后两轨完全同步）</text>
  <g filter="url(#rough2)">
    <text x="95" y="372" text-anchor="middle" font-size="9.5" fill="#888">初始</text>
    <text x="243" y="372" text-anchor="middle" font-size="9.5" fill="#888">类型 3 后</text>
    <text x="421" y="372" text-anchor="middle" font-size="9.5" fill="#888">补完独占边</text>

    <rect x="40" y="378" width="110" height="24" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="95" y="394" text-anchor="middle" font-size="10.5" fill="#333">{1}{2}{3}{4}</text>
    <path d="M 154 390 L 182 390" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="188" y="378" width="110" height="24" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="243" y="394" text-anchor="middle" font-size="10.5" fill="#333">{1,2,3} {4}</text>
    <path d="M 302 390 L 330 390" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="336" y="378" width="170" height="24" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="421" y="394" text-anchor="middle" font-size="10.5" fill="#333">{1,2,3,4}（全连通）</text>
    <text x="525" y="394" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2b4a66">Alice</text>

    <rect x="40" y="410" width="110" height="24" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="95" y="426" text-anchor="middle" font-size="10.5" fill="#333">{1}{2}{3}{4}</text>
    <path d="M 154 422 L 182 422" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="188" y="410" width="110" height="24" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="243" y="426" text-anchor="middle" font-size="10.5" fill="#333">{1,2,3} {4}</text>
    <path d="M 302 422 L 330 422" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="336" y="410" width="170" height="24" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="421" y="426" text-anchor="middle" font-size="10.5" fill="#333">{1,2,3,4}（全连通）</text>
    <text x="525" y="426" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2b5a20">Bob</text>
  </g>

  <!-- 结果 -->
  <g filter="url(#rough2)">
    <rect x="60" y="444" width="560" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="340" y="469" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a20">答案 = m − keep = 6 − 4 = 2：删掉 (1,1,3) 与 (1,1,2)，两人仍各自连通</text>
  </g>

  <text x="340" y="508" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">edges = [[3,1,2],[3,2,3],[1,1,3],[1,2,4],[1,1,2],[2,3,4]]</text>
</svg>
