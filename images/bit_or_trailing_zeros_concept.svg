<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：OR 只置 1 不清 0</text>
  <path d="M 180 40 Q 320 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left: truth table of bit 0 -->
  <text x="170" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">第 0 位的 OR 真值表</text>
  <g filter="url(#sk)">
    <rect x="60" y="78" width="220" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="170" y="98" text-anchor="middle" font-size="13" fill="#2e5e2e" font-family="monospace">0 | 0 = 0  ✓ 0 保得住</text>
  <g filter="url(#sk)">
    <rect x="60" y="114" width="220" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="170" y="134" text-anchor="middle" font-size="13" fill="#8f3a36" font-family="monospace">0 | 1 = 1  ✗ 被 1 污染</text>
  <g filter="url(#sk)">
    <rect x="60" y="150" width="220" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="170" y="170" text-anchor="middle" font-size="13" fill="#8f3a36" font-family="monospace">1 | 0 = 1  ✗ 1 会传播</text>
  <g filter="url(#sk)">
    <rect x="60" y="186" width="220" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="170" y="206" text-anchor="middle" font-size="13" fill="#8f3a36" font-family="monospace">1 | 1 = 1  ✗ 1 不消失</text>
  <g filter="url(#sk)">
    <rect x="52" y="228" width="236" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="170" y="250" text-anchor="middle" font-size="12" fill="#7a5415">混进一个奇数 → 末位必为 1</text>

  <!-- Right: two examples -->
  <text x="475" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">两个小例子</text>
  <g filter="url(#sk)">
    <rect x="320" y="78" width="270" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="455" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">全偶：2 | 4 = 6</text>
  <g font-size="11.5" fill="#444" font-family="monospace">
    <text x="455" y="120" text-anchor="middle">0010 | 0100 = 0110</text>
    <text x="455" y="138" text-anchor="middle">末位 0 | 0 = 0 ✓</text>
    <text x="455" y="156" text-anchor="middle" fill="#2e5e2e" font-weight="bold">"110" 有一个尾随零</text>
  </g>
  <g filter="url(#sk)">
    <rect x="320" y="176" width="270" height="86" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="455" y="198" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3a36">混入奇数：2 | 3 = 3</text>
  <g font-size="11.5" fill="#444" font-family="monospace">
    <text x="455" y="218" text-anchor="middle">0010 | 0011 = 0011</text>
    <text x="455" y="236" text-anchor="middle">末位 0 | 1 = 1 ✗</text>
    <text x="455" y="254" text-anchor="middle" fill="#8f3a36" font-weight="bold">"11" 无尾随零</text>
  </g>

  <!-- Equivalence chain -->
  <g filter="url(#sk)">
    <rect x="40" y="280" width="560" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="303" text-anchor="middle" font-size="13" fill="#33557a" font-weight="bold">OR 有尾随零 ⟺ OR 结果是偶数 ⟺ 所选元素全为偶数</text>
  <path d="M 320 320 L 320 342" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Conclusion -->
  <g filter="url(#sk)">
    <rect x="90" y="348" width="460" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="320" y="374" text-anchor="middle" font-size="14.5" fill="#2e5e2e" font-weight="bold">答案 = 数组中偶数个数 ≥ 2 ？ true : false</text>
</svg>
