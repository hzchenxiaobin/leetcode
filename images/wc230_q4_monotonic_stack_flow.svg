<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="700" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：从右向左单调栈 —— 两条弹栈规则 + 停栈赋值（均摊 O(n)）</text>
  <path d="M 120 38 Q 320 46 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <ellipse cx="300" cy="62" rx="40" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="300" y="67" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">开始</text>
  <path d="M 300 77 L 300 88" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)">
    <rect x="175" y="92" width="250" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="300" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">初始化：res 全为 −1，空栈</text>

  <!-- 右上注释框 -->
  <g filter="url(#sk)">
    <rect x="448" y="84" width="178" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="537" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">细节：栈存下标 j</text>
  <text x="537" y="124" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace" filter="url(#sk)">p_j、s_j、res[j] 随查随用</text>

  <!-- 外层 for 框架 -->
  <path d="M 300 136 L 300 184" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="80" y="150" width="490" height="478" rx="14" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="390" y="172" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#sk)">对每辆车 i（从右向左 n−1 → 0）</text>

  <!-- A：栈空？ -->
  <g filter="url(#sk)">
    <polygon points="300,190 366,222 300,254 234,222" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="300" y="226" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">栈空？</text>
  <text x="222" y="214" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <path d="M 234 222 L 209 222" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="60" y="202" width="145" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="132" y="219" text-anchor="middle" font-size="11" font-family="monospace" fill="#7a5415" filter="url(#sk)">res[i] = −1</text>
  <text x="132" y="234" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk)">（保持哨兵）</text>
  <path d="M 132 242 L 132 542 L 211 542" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="308" y="262" font-size="11" font-weight="bold" fill="#8a4440" filter="url(#sk)">否</text>
  <path d="M 300 254 L 300 262" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 取栈顶并计算 t -->
  <g filter="url(#sk)">
    <rect x="215" y="266" width="170" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="300" y="284" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#33455e" filter="url(#sk)">j = 栈顶</text>
  <text x="300" y="300" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#33455e" filter="url(#sk)">t = (p_j−p_i)/(s_i−s_j)</text>
  <path d="M 300 310 L 300 318" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- B：追得上吗 -->
  <g filter="url(#sk)">
    <polygon points="300,322 372,352 300,382 228,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="300" y="356" text-anchor="middle" font-size="12" font-family="monospace" fill="#333" filter="url(#sk)">s_i ≤ s_j？</text>
  <text x="382" y="344" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <path d="M 372 352 L 398 352" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="402" y="332" width="150" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="477" y="349" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04a48" filter="url(#sk)">规则① 弹 j</text>
  <text x="477" y="364" text-anchor="middle" font-size="10.5" fill="#a04a48" filter="url(#sk)">i 追不上 j</text>
  <text x="308" y="390" font-size="11" font-weight="bold" fill="#8a4440" filter="url(#sk)">否</text>
  <path d="M 300 382 L 300 390" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- C：先被吸收吗 -->
  <g filter="url(#sk)">
    <polygon points="300,398 386,428 300,458 214,428" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="300" y="425" text-anchor="middle" font-size="11" font-family="monospace" fill="#333" filter="url(#sk)">res[j] ≠ −1 且</text>
  <text x="300" y="441" text-anchor="middle" font-size="11" font-family="monospace" fill="#333" filter="url(#sk)">t &gt; res[j]？</text>
  <text x="392" y="418" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <path d="M 386 428 L 398 428" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="402" y="408" width="150" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="477" y="425" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04a48" filter="url(#sk)">规则② 弹 j</text>
  <text x="477" y="440" text-anchor="middle" font-size="10.5" fill="#a04a48" filter="url(#sk)">j 先被前方吸收</text>
  <text x="308" y="472" font-size="11" font-weight="bold" fill="#8a4440" filter="url(#sk)">否</text>
  <path d="M 300 458 L 300 470" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 停栈赋值 -->
  <g filter="url(#sk)">
    <rect x="200" y="474" width="200" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="300" y="491" text-anchor="middle" font-size="11.5" font-weight="bold" font-family="monospace" fill="#2e6e2e" filter="url(#sk)">res[i] = t</text>
  <text x="300" y="507" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">停栈：i 将追上 j（或其车队）</text>
  <path d="M 300 514 L 300 520" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 入栈 -->
  <g filter="url(#sk)">
    <rect x="215" y="524" width="170" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="300" y="540" text-anchor="middle" font-size="11.5" font-weight="bold" font-family="monospace" fill="#2e6e2e" filter="url(#sk)">push(i)</text>
  <text x="300" y="554" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">i 成为新候选</text>
  <path d="M 300 560 L 300 568" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D：还有车吗 -->
  <g filter="url(#sk)">
    <polygon points="300,572 366,596 300,620 234,596" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="300" y="600" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#sk)">还有更左的车？</text>
  <text x="226" y="588" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <text x="308" y="632" font-size="11" font-weight="bold" fill="#8a4440" filter="url(#sk)">否</text>
  <path d="M 300 620 L 300 636" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 外层循环回路：i−− 回到「栈空？」 -->
  <path d="M 234 596 L 44 596 L 44 140 L 250 140 L 250 208" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="36" y="380" font-size="10" fill="#888" filter="url(#sk)" transform="rotate(-90 36 380)">i−−，处理下一辆车</text>

  <!-- 弹栈回路：回到「栈空？」重查新栈顶 -->
  <path d="M 552 352 L 556 352" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 552 428 L 556 428" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 556 428 L 556 222 L 374 222" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="462" y="210" text-anchor="start" font-size="9.5" fill="#888" filter="url(#sk)">弹掉后重查新栈顶</text>

  <!-- 返回 -->
  <g filter="url(#sk)">
    <ellipse cx="300" cy="658" rx="58" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="300" y="663" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 res</text>
</svg>
