<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="470" fill="#fdfcf7"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：一次「兑换 + 喝掉」净消耗 e − 1 个空瓶</text>
  <path d="M 130 42 Q 360 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left: exchange cycle ===== -->
  <!-- box A: enough empties -->
  <g filter="url(#sk)">
    <rect x="42" y="68" width="180" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="132" y="92" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">手里攒够 e 个空瓶</text>
  <text x="132" y="112" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#sk)">前提：空瓶数 ≥ e</text>

  <path d="M 132 130 L 132 162" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="222" y="151" text-anchor="middle" font-size="11" fill="#888888" filter="url(#sk)">兑换：空瓶 −e</text>

  <!-- box B: one full bottle -->
  <g filter="url(#sk)">
    <rect x="42" y="166" width="180" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="132" y="190" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">换回 1 瓶满水</text>
  <text x="132" y="210" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">满水 +1</text>

  <path d="M 132 228 L 132 260" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="224" y="249" text-anchor="middle" font-size="11" fill="#888888" filter="url(#sk)">喝掉：多喝 +1 瓶</text>

  <!-- box C: spit back one empty -->
  <g filter="url(#sk)">
    <rect x="42" y="264" width="180" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="132" y="288" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">又吐回 1 个空瓶</text>
  <text x="132" y="308" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#sk)">空瓶 +1</text>

  <!-- loop back arrow -->
  <path d="M 46 292 Q -4 200 40 100" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="16" y="196" text-anchor="middle" font-size="11" fill="#888888" filter="url(#sk)">循环</text>

  <!-- ===== middle: per-round ledger ===== -->
  <g filter="url(#sk)">
    <rect x="272" y="68" width="185" height="254" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  </g>
  <text x="364" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">每轮净变化（记账）</text>
  <g filter="url(#sk)">
    <rect x="288" y="110" width="153" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="364" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">空瓶 −(e − 1) 个</text>
  <text x="364" y="151" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">−e 换出去，+1 吐回来</text>
  <g filter="url(#sk)">
    <rect x="288" y="172" width="153" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="364" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">累计喝 +1 瓶</text>
  <text x="364" y="213" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">每消耗 e−1 个空瓶</text>
  <text x="364" y="248" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#sk)">初始：喝完 b 瓶</text>
  <text x="364" y="267" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#sk)">手里恰有 b 个空瓶</text>
  <text x="364" y="298" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#sk)">b = numBottles</text>
  <text x="364" y="314" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#sk)">e = numExchange</text>

  <!-- ===== right: formula ===== -->
  <g filter="url(#sk)">
    <rect x="487" y="68" width="190" height="254" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="582" y="96" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#sk)">额外多喝的瓶数</text>
  <text x="582" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">k = ⌊(b−1)/(e−1)⌋</text>
  <path d="M 512 140 Q 582 146 652 140" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" filter="url(#sk)"/>
  <text x="582" y="170" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#sk)">最终答案</text>
  <text x="582" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">ans = b + k</text>
  <text x="582" y="232" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">验算 b=9, e=3：</text>
  <text x="582" y="251" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">k = ⌊8/2⌋ = 4</text>
  <text x="582" y="270" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">ans = 9 + 4 = 13 ✓</text>
  <text x="582" y="304" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">一轮一算太慢？</text>
  <text x="582" y="320" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">数轮数，一步除法出答案</text>

  <!-- ===== bottom: why b-1 ===== -->
  <g filter="url(#sk)">
    <rect x="42" y="342" width="635" height="108" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
  </g>
  <text x="360" y="368" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">为什么分子是 b − 1 ？—— 最后必剩 1 个「保底」空瓶</text>
  <text x="360" y="394" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#sk)">手里的空瓶数（b = 9, e = 3，每轮 −2）→</text>
  <path d="M 100 404 L 620 404" stroke="#3a3a3a" stroke-width="1.6" filter="url(#sk)"/>
  <g filter="url(#sk)" stroke="#3a3a3a" stroke-width="1.2">
    <line x1="120" y1="398" x2="120" y2="410"/>
    <line x1="220" y1="398" x2="220" y2="410"/>
    <line x1="320" y1="398" x2="320" y2="410"/>
    <line x1="420" y1="398" x2="420" y2="410"/>
    <line x1="520" y1="398" x2="520" y2="410"/>
  </g>
  <g filter="url(#sk)" fill="#e8f0fe" stroke="#446688" stroke-width="1.6">
    <circle cx="120" cy="404" r="5.5"/>
    <circle cx="220" cy="404" r="5.5"/>
    <circle cx="320" cy="404" r="5.5"/>
    <circle cx="420" cy="404" r="5.5"/>
  </g>
  <g filter="url(#sk)" fill="#fce4ec" stroke="#b85450" stroke-width="2">
    <circle cx="520" cy="404" r="6.5"/>
  </g>
  <text x="120" y="428" text-anchor="middle" font-size="11" fill="#555555" filter="url(#sk)">b=9</text>
  <text x="220" y="428" text-anchor="middle" font-size="11" fill="#555555" filter="url(#sk)">7</text>
  <text x="320" y="428" text-anchor="middle" font-size="11" fill="#555555" filter="url(#sk)">5</text>
  <text x="420" y="428" text-anchor="middle" font-size="11" fill="#555555" filter="url(#sk)">3</text>
  <text x="520" y="428" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">1（保底）</text>
  <text x="360" y="446" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">空瓶数一路 −(e−1) 但永远 ≥ 1：能被净消耗的只有 b − 1 个 → k = ⌊(b−1)/(e−1)⌋</text>
</svg>
