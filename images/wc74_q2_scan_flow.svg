<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次扫描，边扫边推进</text>
  <text x="330" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个字符只处理一个桶，每条记录最多前进 |w| 次</text>

  <rect x="160" y="60" width="340" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="78" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">初始化：把 (i, 0) 放进 words[i][0] 的桶</text>
  <text x="330" y="92" text-anchor="middle" font-size="9.5" fill="#a08a55" filter="url(#rough2)">26 个桶均为空列表</text>

  <path d="M 330 98 L 330 116" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="330,118 460,152 330,186 200,152" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="330" y="157" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i &lt; |s| ?</text>
  <text x="330" y="172" text-anchor="middle" font-size="9.5" fill="#5a6a86" filter="url(#rough2)">还有字符未处理</text>

  <path d="M 330 186 L 330 212" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="203" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 200 152 L 108 152 L 108 320" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="143" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否（i = |s|）</text>

  <rect x="150" y="214" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="232" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">c = s[i]</text>
  <text x="330" y="247" text-anchor="middle" font-size="10" fill="#4f6b45" filter="url(#rough2)">cur = bucket[c]；bucket[c] = []（先取出再清空）</text>

  <path d="M 330 254 L 330 278" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="280" width="380" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="299" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">对 cur 中每条 (i, p)：p ← p + 1</text>
  <text x="330" y="318" text-anchor="middle" font-size="10" fill="#a08a55" filter="url(#rough2)">p = |w| ? ans++ : 入 words[i][p] 的桶</text>

  <path d="M 330 334 L 330 354" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="270" y="356" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="377" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">i ← i + 1</text>

  <path d="M 390 372 L 570 372 L 570 152 L 464 152" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="365" font-size="9.5" fill="#446688" filter="url(#rough2)">回到判断</text>

  <rect x="42" y="324" width="132" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="108" y="342" text-anchor="middle" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">return ans</text>
  <text x="108" y="357" text-anchor="middle" font-size="9" fill="#a0524e" filter="url(#rough2)">桶里剩下的都不匹配</text>

  <text x="330" y="405" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">一轮弹桶可能很长，但所有轮次加起来只推进“单词总长”那么多次</text>
</svg>
