<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">排序 + 双指针：sum 与 0 比较决定移动哪端</text>
  <path d="M 170 38 Q 340 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1: sort -->
  <g filter="url(#sk)">
    <rect x="40" y="62" width="150" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="115" y="88" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">① 排序（升序）</text>
  <g filter="url(#sk)">
    <path d="M 115 104 L 115 126" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <!-- step 2: init pointers -->
  <g filter="url(#sk)">
    <rect x="40" y="128" width="150" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="115" y="154" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">② l = 0，r = n−1</text>
  <g filter="url(#sk)">
    <path d="M 190 149 L 238 149" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>

  <!-- diamond: l < r ? -->
  <g filter="url(#sk)">
    <polygon points="246,149 320,105 394,149 320,193" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="320" y="154" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">③ l &lt; r ?</text>

  <!-- No branch -->
  <g filter="url(#sk)">
    <path d="M 394 149 L 460 149" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <text x="427" y="142" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="462" y="128" width="130" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="527" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#sk)">返回 −1</text>

  <!-- Yes branch -->
  <g filter="url(#sk)">
    <path d="M 320 193 L 320 218" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <text x="333" y="211" font-size="11" fill="#888" filter="url(#sk)">是</text>

  <!-- step 4: compute sum -->
  <g filter="url(#sk)">
    <rect x="230" y="222" width="180" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="241" text-anchor="middle" font-size="12" fill="#2b2b2b" font-family="monospace" filter="url(#sk)">④ sum = nums[l]+nums[r]</text>
  <text x="320" y="258" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">与 0 比较，三分支</text>

  <!-- left branch: sum < 0 -->
  <g filter="url(#sk)">
    <path d="M 230 244 L 156 244" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="40" y="224" width="114" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="97" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">l++</text>
  <text x="97" y="256" text-anchor="middle" font-size="10" fill="#555" filter="url(#sk)">sum &lt; 0</text>

  <!-- right branch: sum > 0 -->
  <g filter="url(#sk)">
    <path d="M 410 244 L 524 244" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="526" y="224" width="114" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="583" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10" filter="url(#sk)">r−−</text>
  <text x="583" y="256" text-anchor="middle" font-size="10" fill="#555" filter="url(#sk)">sum &gt; 0</text>

  <!-- down branch: sum == 0 -->
  <g filter="url(#sk)">
    <path d="M 320 266 L 320 294" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
  <text x="333" y="285" font-size="10" fill="#888" filter="url(#sk)">sum == 0</text>
  <g filter="url(#sk)">
    <rect x="230" y="296" width="180" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">配对成功</text>
  <text x="320" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 nums[r] ✓</text>

  <!-- loop hint -->
  <g filter="url(#sk)">
    <rect x="150" y="352" width="380" height="38" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="340" y="375" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">↻ l++ / r−− 后回到 ③④，直到 l ≥ r 或命中 sum==0</text>
  <g filter="url(#sk)">
    <path d="M 97 266 Q 97 322 175 358" stroke="#8a8a8a" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 583 266 Q 583 322 505 358" stroke="#8a8a8a" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  </g>
</svg>
