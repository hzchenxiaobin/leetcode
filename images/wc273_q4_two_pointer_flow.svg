<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：排序 → 枚举候选 2k → 双指针贪心匹配 → 配满即返回</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 1 排序 -->
  <g filter="url(#sk)">
    <rect x="200" y="46" width="240" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="69" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">1　排序 nums（升序）</text>

  <path d="M 320 82 L 320 98" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 2 枚举候选 -->
  <g filter="url(#sk)">
    <rect x="150" y="102" width="340" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="320" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">2　枚举候选 d = nums[j] − nums[0]（j = 1 … 2n−1）</text>
  <text x="320" y="144" text-anchor="middle" font-size="10" fill="#555" filter="url(#sk)">剪枝：d ≤ 0、d 为奇数、与前一个值重复（去重）</text>

  <path d="M 320 160 L 320 174" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形：候选未耗尽？ -->
  <g filter="url(#sk)">
    <polygon points="242,212 320,178 398,212 320,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">候选未耗尽？</text>

  <path d="M 398 212 L 450 212" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="418" y="204" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="452" y="192" width="164" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="534" y="208" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">返回空数组</text>
  <text x="534" y="224" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">（题目保证有解，不触发）</text>

  <path d="M 320 246 L 320 262" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">是</text>

  <!-- 3 双指针匹配 -->
  <g filter="url(#sk)">
    <rect x="86" y="266" width="468" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="288" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#sk)">3　双指针匹配（对当前候选 d = 2k）</text>
  <text x="320" y="308" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">i：依序取最小未用元素 → 作为 lower</text>
  <text x="320" y="326" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">p：单调推进到首个未用的 nums[i] + d → 作为 higher</text>
  <text x="320" y="344" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">标记 used[i] = used[p] = true，arr ← nums[i] + d/2</text>

  <path d="M 320 354 L 320 372" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形：配满 n 对？ -->
  <g filter="url(#sk)">
    <polygon points="242,410 320,376 398,410 320,444" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="414" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">配满 n 对？</text>

  <path d="M 398 410 L 450 410" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="418" y="402" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="452" y="390" width="164" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="534" y="406" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">返回 arr ✓</text>
  <text x="534" y="422" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">（任一合法解即可）</text>

  <!-- 失败回环 -->
  <path d="M 242 410 L 56 410 L 56 131 L 144 131" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="46" y="280" font-size="10" fill="#b85450" filter="url(#sk)" transform="rotate(-90 46 280)">否 · 换下一个候选</text>

  <text x="320" y="478" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">p 只进不退 → 单次验证 O(n)；候选至多 2n−1 个 → 总时间 O(n²)</text>
</svg>
