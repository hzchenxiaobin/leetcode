<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：合法分割两半的支配元素，必然是全局支配元素 x</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums = [2,1,3,1,1,1,7,1,2,1]，全局 x = 1（出现 6 次 &gt; 10/2）</text>

  <!-- 分割线 i=4 -->
  <path d="M296,66 L296,140" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="296" y="60" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">分割 i = 4</text>

  <!-- 左半 5 格 (green) -->
  <rect x="76"  y="76" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="120" y="76" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="164" y="76" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="208" y="76" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="252" y="76" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="98"  y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="142" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="186" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="230" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="274" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="186" y="132" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">左半长 5，x=1 出现 3 次：2×3 &gt; 5 ✓ 支配 = 1</text>

  <!-- 右半 5 格 (blue) -->
  <rect x="298" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="342" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="386" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="430" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="474" y="76" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="364" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="408" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="452" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="496" y="98" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="408" y="132" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">右半长 5，x=1 出现 3 次：2×3 &gt; 5 ✓ 支配 = 1</text>

  <!-- 加法论证 -->
  <rect x="46" y="158" width="468" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">加法论证（引理 2）：设两半支配元素同为 y</text>
  <text x="280" y="204" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">左半 2·c₁ &gt; i+1 ，右半 2·c₂ &gt; n−1−i</text>
  <text x="280" y="228" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">两式相加：2·(c₁+c₂) &gt; n，即 y 在全数组出现 &gt; n/2 次</text>
  <text x="280" y="251" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">→ y 是全局支配元素；全局支配元素唯一 → y = x</text>

  <!-- 反例提示 -->
  <rect x="46" y="278" width="468" height="60" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">⚠️ 若左半支配是 y=1 而右半支配是别的值 z —— 两半支配不相同，不合法</text>
  <text x="280" y="322" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">所以只需盯住全局 x 一个值：x 在左右两半都过半 ⟺ 分割合法</text>

  <!-- 结论框 -->
  <rect x="46" y="354" width="468" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">问题归一：① 找全局支配 x（Boyer-Moore 投票，O(n)/O(1)）</text>
  <text x="280" y="400" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">② 从左扫描维护前缀计数 cnt，右半频次 = f − cnt，逐点判定</text>
</svg>
