<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">双调数组：峰值是唯一的分界点</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">递增部分 nums[0..p]，递减部分 nums[p..n-1]，峰值被两段共享</text>
  <rect x="120" y="110" width="56" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148.0" y="139.76" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="148.0" y="174" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <rect x="182" y="110" width="56" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210.0" y="139.76" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">3</text>
  <text x="210.0" y="174" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <rect x="244" y="110" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="272.0" y="139.76" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">2</text>
  <text x="272.0" y="174" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <rect x="306" y="110" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="334.0" y="139.76" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">1</text>
  <text x="334.0" y="174" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <path d="M 120 96 L 182 96" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 120 96 L 120 108" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 182 96 L 182 108" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="151" y="90" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">递增 1+3=4</text>
  <path d="M 182 184 L 308 184" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 182 184 L 182 172" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 308 184 L 308 172" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="245" y="200" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">递减 3+2+1=6</text>
  <text x="148" y="104" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">p = 1</text>
  <rect x="96" y="218" width="368" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="239" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">inc = Σ nums[0..p]  ，  dec = Σ nums[p..n-1]</text>
  <rect x="40" y="274" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="115" y="293" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">inc &gt; dec</text>
  <text x="115" y="307" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→ 返回 0</text>
  <rect x="205" y="274" width="150" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="293" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dec &gt; inc</text>
  <text x="280" y="307" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">→ 返回 1</text>
  <rect x="370" y="274" width="150" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="445" y="293" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">inc == dec</text>
  <text x="445" y="307" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">→ 返回 -1</text>
  <text x="280.0" y="384" text-anchor="middle" font-size="10" fill="#999">峰值下标 p 用一次扫描得到；题目保证数组双调，因此 p 唯一</text>
</svg>
