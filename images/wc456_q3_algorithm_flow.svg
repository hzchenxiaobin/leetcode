<svg xmlns="http://www.w3.org/2000/svg" width="880" height="990" viewBox="0 0 880 990" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="990" fill="#fdfcf7"/>
  <text x="440" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：前缀异或 + 划分 DP 三重循环，答案 dp[k][n]</text>
  <path d="M 230 42 Q 440 52 650 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)"><rect x="320" y="58" width="240" height="40" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="440" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">读入 nums、k，n = |nums|</text>
  <path d="M 440 98 L 440 120" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 1 -->
  <g filter="url(#sk)"><rect x="140" y="120" width="600" height="58" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="160" y="144" font-size="12.5" font-weight="bold" fill="#2b6e9e">① 预处理前缀异或：pre[0] = 0，pre[t] = pre[t−1] ⊕ nums[t−1]</text>
  <text x="160" y="166" font-size="10.5" fill="#555">此后任意子段的 XOR 均 O(1) 可得</text>
  <path d="M 440 178 L 440 200" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2 -->
  <g filter="url(#sk)"><rect x="140" y="200" width="600" height="58" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="160" y="224" font-size="12.5" font-weight="bold" fill="#9a6d1a">② 初始化：dp[0][0] = 0（空切法，max 的单位元）</text>
  <text x="160" y="246" font-size="10.5" fill="#555">dp[j][i] 其余全部置 +∞（非法状态，转移时自动失效）</text>
  <path d="M 440 258 L 440 282" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop container -->
  <g filter="url(#sk)"><rect x="90" y="282" width="660" height="604" rx="10" fill="#faf8ef" stroke="#9e9e9e" stroke-width="1.4" stroke-dasharray="6 4"/></g>
  <text x="118" y="306" font-size="13" font-weight="bold" fill="#2b2b2b">③ 枚举段数 j = 1 … k</text>

  <!-- i loop -->
  <g filter="url(#sk)"><rect x="140" y="318" width="560" height="48" rx="6" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="440" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">枚举右端点 i = j … n</text>
  <text x="440" y="358" text-anchor="middle" font-size="10" fill="#555">i &lt; j 时切不出 j 个非空段，跳过（保持 +∞）</text>
  <path d="M 440 366 L 440 386" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- m loop -->
  <g filter="url(#sk)"><rect x="140" y="386" width="560" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="440" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a6d1a">枚举最后一刀 m = j−1 … i−1</text>
  <text x="440" y="426" text-anchor="middle" font-size="10" fill="#555">前 m 个元素至少要能切出 j−1 段（m ≥ j−1）</text>
  <path d="M 440 434 L 440 454" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- core transition -->
  <g filter="url(#sk)"><rect x="140" y="454" width="560" height="56" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="440" y="478" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">v ← max(dp[j−1][m], pre[m] ⊕ pre[i])</text>
  <text x="440" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">dp[j][i] ← min(dp[j][i], v)</text>
  <path d="M 440 510 L 440 530" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond m -->
  <g filter="url(#sk)"><polygon points="440,530 586,578 440,626 294,578" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="440" y="583" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">还有下一个 m ？</text>
  <path d="M586,578 L738,578 L738,410 L704,410" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="594" y="570" font-size="11" fill="#2e6e2e">是（m←m+1）</text>
  <path d="M 440 626 L 440 650" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="450" y="644" font-size="11" fill="#888">否</text>

  <!-- diamond i -->
  <g filter="url(#sk)"><polygon points="440,650 586,698 440,746 294,698" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="440" y="703" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">还有下一个 i ？</text>
  <path d="M294,698 L124,698 L124,342 L136,342" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="204" y="690" font-size="11" fill="#2e6e2e">是（i←i+1）</text>
  <path d="M 440 746 L 440 770" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="450" y="764" font-size="11" fill="#888">否</text>

  <!-- diamond j -->
  <g filter="url(#sk)"><polygon points="440,770 586,818 440,866 294,818" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="440" y="814" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">j &lt; k ？</text>
  <text x="440" y="832" text-anchor="middle" font-size="10.5" fill="#7a5415">（段数未满）</text>
  <path d="M294,818 L104,818 L104,330 L136,330" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="204" y="810" font-size="11" fill="#2e6e2e">是（j←j+1，i 重新扫）</text>
  <path d="M 440 866 L 440 894" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="450" y="886" font-size="11" fill="#888">否</text>

  <!-- end -->
  <g filter="url(#sk)"><rect x="240" y="898" width="400" height="58" rx="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="440" y="922" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">④ 返回 dp[k][n]</text>
  <text x="440" y="944" text-anchor="middle" font-size="10.5" fill="#555">时间 O(k·n²)（n=k=250 约 7.8×10⁶ 次转移），空间 O(k·n)</text>
</svg>
