<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：target = "abc" → 6 次按键 = 6 张快照</text>
  <path d="M 175 40 Q 320 48 465 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="62" y="66" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">次序</text>
  <text x="130" y="66" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">按键</text>
  <text x="278" y="66" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">屏幕快照（绿 = 已到位）</text>
  <text x="470" y="66" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">说明</text>
  <path d="M 40 74 L 610 74" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 行 1：按键 1 → "a" -->
  <circle cx="62" cy="99" r="11" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="103" text-anchor="middle" font-size="10.5" fill="#555">1</text>
  <rect x="96" y="87" width="68" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="103" text-anchor="middle" font-size="10.5" fill="#2f4a66">按键 1</text>
  <rect x="200" y="87" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="213" y="105" text-anchor="middle" font-size="12" fill="#333">a</text>
  <text x="390" y="104" font-size="10.5" fill="#444">第 1 个字符 'a'：追加即到位（转轮 0 次）</text>

  <!-- 行 2：按键 1 → "aa" -->
  <circle cx="62" cy="135" r="11" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="139" text-anchor="middle" font-size="10.5" fill="#555">2</text>
  <rect x="96" y="123" width="68" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="139" text-anchor="middle" font-size="10.5" fill="#2f4a66">按键 1</text>
  <rect x="200" y="123" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="213" y="141" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="230" y="123" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="243" y="141" text-anchor="middle" font-size="12" fill="#a06a15">a</text>
  <text x="390" y="140" font-size="10.5" fill="#444">第 2 个字符 'b'：先追加 'a'</text>

  <!-- 行 3：按键 2 → "ab" -->
  <circle cx="62" cy="171" r="11" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="175" text-anchor="middle" font-size="10.5" fill="#555">3</text>
  <rect x="96" y="159" width="68" height="24" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="175" text-anchor="middle" font-size="10.5" fill="#a06a15">按键 2</text>
  <rect x="200" y="159" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="213" y="177" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="230" y="159" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="243" y="177" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <text x="390" y="176" font-size="10.5" fill="#444">末位 a → b，'b' 到位</text>

  <!-- 行 4：按键 1 → "aba" -->
  <circle cx="62" cy="207" r="11" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="211" text-anchor="middle" font-size="10.5" fill="#555">4</text>
  <rect x="96" y="195" width="68" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="211" text-anchor="middle" font-size="10.5" fill="#2f4a66">按键 1</text>
  <rect x="200" y="195" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="213" y="213" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="230" y="195" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="243" y="213" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="260" y="195" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="273" y="213" text-anchor="middle" font-size="12" fill="#a06a15">a</text>
  <text x="390" y="212" font-size="10.5" fill="#444">第 3 个字符 'c'：先追加 'a'</text>

  <!-- 行 5：按键 2 → "abb" -->
  <circle cx="62" cy="243" r="11" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="247" text-anchor="middle" font-size="10.5" fill="#555">5</text>
  <rect x="96" y="231" width="68" height="24" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="247" text-anchor="middle" font-size="10.5" fill="#a06a15">按键 2</text>
  <rect x="200" y="231" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="213" y="249" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="230" y="231" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="243" y="249" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="260" y="231" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="273" y="249" text-anchor="middle" font-size="12" fill="#a06a15">b</text>
  <text x="390" y="248" font-size="10.5" fill="#444">末位 a → b（还差一步）</text>

  <!-- 行 6：按键 2 → "abc" -->
  <circle cx="62" cy="279" r="11" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="283" text-anchor="middle" font-size="10.5" fill="#555">6</text>
  <rect x="96" y="267" width="68" height="24" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="283" text-anchor="middle" font-size="10.5" fill="#a06a15">按键 2</text>
  <rect x="200" y="267" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="213" y="285" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="230" y="267" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="243" y="285" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="260" y="267" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="273" y="285" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c</text>
  <text x="390" y="284" font-size="10.5" fill="#444">末位 b → c，全部到位 ✓</text>

  <!-- 分组虚线 -->
  <path d="M 40 120 L 610 120" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 40 192 L 610 192" stroke="#c9c9c9" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="622" y="107" font-size="9.5" fill="#888" transform="rotate(90 622 107)" filter="url(#rough2)">字符 'a'：1 次</text>
  <text x="622" y="151" font-size="9.5" fill="#888" transform="rotate(90 622 151)" filter="url(#rough2)">字符 'b'：2 次</text>
  <text x="622" y="239" font-size="9.5" fill="#888" transform="rotate(90 622 239)" filter="url(#rough2)">字符 'c'：3 次</text>

  <!-- 底部结论 -->
  <rect x="40" y="310" width="570" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="325" y="337" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#rough2)">每个字符：1 次按键 1 + (ord(c) − 97) 次按键 2</text>
  <text x="325" y="363" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#rough2)">'a' 花 1 次，'b' 花 2 次，'c' 花 3 次 → 总计 6 次按键 = 6 个快照</text>
</svg>
