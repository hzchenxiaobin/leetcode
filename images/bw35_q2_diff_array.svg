<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">差分数组：两个请求 → 每个下标的覆盖次数 cnt</text>

  <!-- 左：请求条 -->
  <text x="120" y="62" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">requests 覆盖区间（n=5）</text>
  <!-- 下标 -->
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="60" y="86">0</text>
    <text x="105" y="86">1</text>
    <text x="150" y="86">2</text>
    <text x="195" y="86">3</text>
    <text x="240" y="86">4</text>
  </g>
  <!-- 请求 [1,3] -->
  <g filter="url(#rough2)">
    <rect x="85" y="98" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="40" y="132" width="132" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="175" y="116">[1,3] 覆盖 1..3</text>
    <text x="106" y="150">[0,1] 覆盖 0..1</text>
  </g>
  <text x="140" y="186" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">逐区间加一是 O(n·R)，改用差分：</text>

  <!-- 右：差分数组 -->
  <text x="412" y="62" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">diff（长度 n+1）与前缀和</text>
  <g filter="url(#rough2)">
    <rect x="318" y="74" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="356" y="74" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="394" y="74" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="432" y="74" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="470" y="74" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="508" y="74" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="337" y="94">+1</text>
    <text x="375" y="94">+1</text>
    <text x="413" y="94">−1</text>
    <text x="451" y="94">0</text>
    <text x="489" y="94">−1</text>
    <text x="527" y="94">0</text>
    <text x="337" y="120" font-size="10.5">d[0]</text>
    <text x="375" y="120" font-size="10.5">d[1]</text>
    <text x="413" y="120" font-size="10.5">d[2]</text>
    <text x="451" y="120" font-size="10.5">d[3]</text>
    <text x="489" y="120" font-size="10.5">d[4]</text>
    <text x="527" y="120" font-size="10.5">d[5]</text>
  </g>
  <text x="412" y="146" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">绿：diff[s]++；红：diff[e+1]−−</text>

  <!-- 中下：cnt 结果 -->
  <path d="M 300 170 C 320 186, 340 196, 372 200" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="212" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">前缀和还原</text>

  <text x="280" y="248" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt[i] = 下标 i 被查询覆盖的次数</text>
  <g filter="url(#rough2)">
    <rect x="58" y="262" width="82" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="140" y="262" width="82" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="222" y="262" width="82" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="304" y="262" width="82" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="386" y="262" width="82" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="99" y="284">1</text>
    <text x="181" y="284" fill="#b8860b" font-weight="bold">2</text>
    <text x="263" y="284">1</text>
    <text x="345" y="284">1</text>
    <text x="427" y="284">0</text>
  </g>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">下标 1 被两个请求各覆盖一次（cnt=2，最热）；下标 4 无人问津（cnt=0）</text>

  <g filter="url(#rough2)">
    <rect x="80" y="336" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
  </g>
  <text x="280" y="358" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">O(n + R) 得到 cnt，为排序贪心配对做准备</text>
</svg>
