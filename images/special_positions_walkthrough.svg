<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：三个 1 逐格判定</text>
  <path d="M 190 38 Q 320 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g font-size="12" fill="#888" text-anchor="middle" filter="url(#sk)">
    <text x="110" y="88">列 0</text>
    <text x="170" y="88">列 1</text>
    <text x="230" y="88">列 2</text>
  </g>
  <g font-size="12" fill="#888" text-anchor="end" filter="url(#sk)">
    <text x="76" y="119">行 0</text>
    <text x="76" y="159">行 1</text>
    <text x="76" y="199">行 2</text>
  </g>

  <g filter="url(#sk)">
    <rect x="84" y="96" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="144" y="96" width="52" height="36" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="204" y="96" width="52" height="36" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="84" y="136" width="52" height="36" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="144" y="136" width="52" height="36" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="204" y="136" width="52" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="84" y="176" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="144" y="176" width="52" height="36" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
    <rect x="204" y="176" width="52" height="36" rx="4" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2"/>
  </g>
  <g font-size="14" text-anchor="middle" filter="url(#sk)">
    <text x="110" y="118" fill="#33507a" font-weight="bold">1</text>
    <text x="170" y="118" fill="#999999">0</text>
    <text x="230" y="118" fill="#999999">0</text>
    <text x="110" y="158" fill="#999999">0</text>
    <text x="170" y="158" fill="#999999">0</text>
    <text x="230" y="158" fill="#b85450" font-weight="bold">1</text>
    <text x="110" y="198" fill="#33507a" font-weight="bold">1</text>
    <text x="170" y="198" fill="#999999">0</text>
    <text x="230" y="198" fill="#999999">0</text>
  </g>

  <g filter="url(#sk)">
    <circle cx="142" cy="106" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="262" cy="142" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="142" cy="186" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="11" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="142" y="110" fill="#33507a">1</text>
    <text x="262" y="146" fill="#b85450">2</text>
    <text x="142" y="190" fill="#33507a">3</text>
  </g>

  <text x="308" y="88" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">行和</text>
  <g filter="url(#sk)">
    <path d="M 258 114 L 268 114" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 258 154 L 268 154" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 258 194 L 268 194" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="272" y="96" width="72" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="272" y="136" width="72" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="272" y="176" width="72" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="13" fill="#3a5a3a" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="308" y="118">1</text>
    <text x="308" y="158">1</text>
    <text x="308" y="198">1</text>
  </g>

  <g filter="url(#sk)">
    <path d="M 110 214 L 110 221" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 170 214 L 170 221" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 230 214 L 230 221" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="84" y="224" width="52" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="144" y="224" width="52" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="204" y="224" width="52" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g font-size="13" fill="#b07818" text-anchor="middle" font-weight="bold" filter="url(#sk)">
    <text x="110" y="246">2</text>
    <text x="170" y="246">0</text>
    <text x="230" y="246">1</text>
  </g>
  <text x="76" y="246" text-anchor="end" font-size="12" fill="#b07818" font-weight="bold" filter="url(#sk)">列和</text>

  <g filter="url(#sk)">
    <rect x="390" y="92" width="226" height="80" rx="10" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="408" cy="108" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="408" y="112" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#sk)">1</text>
  <text x="424" y="113" font-size="13" fill="#333" font-weight="bold" filter="url(#sk)">(0, 0)：mat[0][0] = 1 ✓</text>
  <text x="503" y="136" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">行和[0] = 1 ✓   列和[0] = 2 ✗</text>
  <text x="503" y="158" text-anchor="middle" font-size="11.5" fill="#999999" filter="url(#sk)">第 0 列还有别的 1 → 非特殊</text>

  <g filter="url(#sk)">
    <rect x="390" y="180" width="226" height="80" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="408" cy="196" r="9" fill="#fffdf3" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="408" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#sk)">2</text>
  <text x="424" y="201" font-size="13" fill="#b85450" font-weight="bold" filter="url(#sk)">(1, 2)：mat[1][2] = 1 ✓</text>
  <text x="503" y="224" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">行和[1] = 1 ✓   列和[2] = 1 ✓</text>
  <text x="503" y="246" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#sk)">行、列均唯一 → 特殊 ★</text>

  <g filter="url(#sk)">
    <rect x="390" y="268" width="226" height="80" rx="10" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="408" cy="284" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="408" y="288" text-anchor="middle" font-size="11" fill="#33507a" font-weight="bold" filter="url(#sk)">3</text>
  <text x="424" y="289" font-size="13" fill="#333" font-weight="bold" filter="url(#sk)">(2, 0)：mat[2][0] = 1 ✓</text>
  <text x="503" y="312" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">行和[2] = 1 ✓   列和[0] = 2 ✗</text>
  <text x="503" y="334" text-anchor="middle" font-size="11.5" fill="#999999" filter="url(#sk)">与 (0,0) 同列 → 非特殊</text>

  <g filter="url(#sk)">
    <rect x="170" y="368" width="300" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="394" text-anchor="middle" font-size="14" fill="#b07818" font-weight="bold" filter="url(#sk)">ans = 1（仅 (1,2) 是特殊位置）</text>
</svg>
