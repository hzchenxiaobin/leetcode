<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 1 演算：edges = [[1,2],[1,3],[2,3]]</text>
  <text x="360" y="54" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">并查集只维护「谁和谁在一起」，用根是否相同判断连通性</text>

  <!-- 表格背景 -->
  <rect x="40" y="78" width="640" height="200" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="40" y="78" width="640" height="44" fill="#e8f0fe" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="40" y="226" width="640" height="52" fill="#fce4ec" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 竖线 -->
  <line x1="130" y1="78" x2="130" y2="278" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="250" y1="78" x2="250" y2="278" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="460" y1="78" x2="460" y2="278" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- 横线 -->
  <line x1="40" y1="122" x2="680" y2="122" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="40" y1="174" x2="680" y2="174" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="40" y1="226" x2="680" y2="226" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="52" y="106" font-size="12.5" fill="#2f4a63" filter="url(#rough2)">步骤</text>
  <text x="142" y="106" font-size="12.5" fill="#2f4a63" filter="url(#rough2)">边</text>
  <text x="262" y="106" font-size="12.5" fill="#2f4a63" filter="url(#rough2)">两端所在集合的根</text>
  <text x="472" y="106" font-size="12.5" fill="#2f4a63" filter="url(#rough2)">动作</text>

  <!-- 第 1 行 -->
  <text x="52" y="157" font-size="13" fill="#444" filter="url(#rough2)">①</text>
  <text x="142" y="157" font-size="12.5" fill="#444" filter="url(#rough2)">[1, 2]</text>
  <text x="262" y="157" font-size="12.5" fill="#444" filter="url(#rough2)">find(1)=1　find(2)=2</text>
  <text x="472" y="157" font-size="12.5" fill="#33502a" filter="url(#rough2)">根不同 → 合并 {{1,2}}</text>

  <!-- 第 2 行 -->
  <text x="52" y="209" font-size="13" fill="#444" filter="url(#rough2)">②</text>
  <text x="142" y="209" font-size="12.5" fill="#444" filter="url(#rough2)">[1, 3]</text>
  <text x="262" y="209" font-size="12.5" fill="#444" filter="url(#rough2)">find(1)=1　find(3)=3</text>
  <text x="472" y="209" font-size="12.5" fill="#33502a" filter="url(#rough2)">根不同 → 合并 {{1,2,3}}</text>

  <!-- 第 3 行 -->
  <text x="52" y="261" font-size="13" fill="#8c3b38" filter="url(#rough2)">③</text>
  <text x="142" y="261" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">[2, 3]</text>
  <text x="262" y="261" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">find(2)=1　find(3)=1</text>
  <text x="472" y="261" font-size="12.5" fill="#b85450" filter="url(#rough2)">根相同 → 返回 [2, 3]</text>

  <!-- 集合演化 -->
  <rect x="40" y="300" width="640" height="108" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="326" font-size="13" fill="#6b5316" filter="url(#rough2)">集合演化：</text>
  <text x="58" y="352" font-size="12.5" fill="#6b5316" filter="url(#rough2)">{{1}} {{2}} {{3}}　① 合并 →　{{1,2}} {{3}}　② 合并 →　{{1,2,3}}</text>
  <text x="58" y="378" font-size="12.5" fill="#b85450" filter="url(#rough2)">③ 的两端同根：再加边必成环 ⇒ 它就是环上最晚出现的那条 ⇒ 答案 [2, 3]</text>
</svg>
