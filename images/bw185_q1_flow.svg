<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="330" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：三行构造</text>
  <rect x="60" y="55" width="400" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="82.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 建 m×n 网格，全部填 '.'</text>
  <path d="M260,101 L260,129" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="129" width="400" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="156.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 对 i=1..m-1、j=0..n-2 置 '#'（封掉内层）</text>
  <path d="M260,175 L260,203" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="203" width="400" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260.0" y="230.55" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 返回网格（第一行与最后一列保持空）</text>
  <rect x="60" y="262" width="400" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="280" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">边界</text>
  <text x="72" y="296" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">n = 1 或 m = 1 时第 ② 步不执行任何格子 → 整行/整列全空，路径数仍为 1</text>
</svg>
