<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：n = 102</text>

  <!-- 表头 -->
  <rect x="70" y="58" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="80" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">幂次 10^k</text>
  <rect x="160" y="58" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="80" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">数位 d</text>
  <rect x="230" y="58" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="80" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">动作</text>
  <rect x="370" y="58" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="80" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">产生分量</text>

  <!-- 行 1：k=2 -->
  <rect x="70" y="96" width="90" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10²</text>
  <rect x="160" y="96" width="70" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="230" y="96" width="140" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">d &gt; 0，取 d×10²</text>
  <rect x="370" y="96" width="100" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="420" y="120" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">100</text>

  <!-- 行 2：k=1（跳过） -->
  <rect x="70" y="138" width="90" height="38" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="162" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">10¹</text>
  <rect x="160" y="138" width="70" height="38" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="162" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="230" y="138" width="140" height="38" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="162" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">d = 0，跳过 ✗</text>
  <rect x="370" y="138" width="100" height="38" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="162" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">—</text>

  <!-- 行 3：k=0 -->
  <rect x="70" y="180" width="90" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10⁰</text>
  <rect x="160" y="180" width="70" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="230" y="180" width="140" height="38" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">d &gt; 0，取 d×10⁰</text>
  <rect x="370" y="180" width="100" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="420" y="204" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- 结果 -->
  <rect x="100" y="244" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="14" fill="#7a6020" filter="url(#rough2)">输出（降序）：[100, 2]</text>

  <text x="260" y="314" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">从高位向低位扫描，结果天然降序，无需排序</text>
</svg>
