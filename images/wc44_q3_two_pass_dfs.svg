<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：两遍 DFS（先求高定尺寸，再中序区间二分填表）</text>
  <text x="310" y="44" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">fill 用 [lo, hi] 表示该层可用列区间，取中点即落格，子结点区间对半切</text>

  <rect x="140" y="58" width="340" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="79" text-anchor="middle" font-size="10.5" fill="#2b4a6b" filter="url(#rough2)">① 后序求高：h(null) = −1，h(u) = 1 + max(h(左), h(右))</text>
  <path d="M 310 92 L 310 112" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="140" y="116" width="340" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="137" text-anchor="middle" font-size="10.5" fill="#2b4a6b" filter="url(#rough2)">② m = h+1，n = 2^(h+1) − 1，res 全填空串</text>
  <path d="M 310 150 L 310 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="140" y="174" width="340" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="195" text-anchor="middle" font-size="10.5" fill="#2c5f2c" filter="url(#rough2)">③ fill(root, r = 0, lo = 0, hi = n−1)</text>
  <path d="M 310 208 L 310 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <polygon points="310,230 445,258 310,286 175,258" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="310" y="262" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">node 为空？</text>

  <path d="M 445 258 L 468 258" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="455" y="250" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="472" y="240" width="136" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="540" y="262" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">return（不填格）</text>

  <path d="M 310 286 L 310 306" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="324" y="300" text-anchor="start" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="120" y="310" width="380" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="331" text-anchor="middle" font-size="10.5" fill="#2b4a6b" filter="url(#rough2)">④ c = (lo + hi) / 2 ；res[r][c] = str(node.val)</text>
  <path d="M 310 344 L 310 362" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="76" y="366" width="228" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="388" text-anchor="middle" font-size="10" fill="#2c5f2c" filter="url(#rough2)">fill(左孩子, r+1, lo, c−1)</text>
  <rect x="316" y="366" width="228" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="388" text-anchor="middle" font-size="10" fill="#2c5f2c" filter="url(#rough2)">fill(右孩子, r+1, c+1, hi)</text>

  <path d="M 76 384 L 46 384 L 46 191 L 136 191" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="62" y="290" transform="rotate(-90 62 290)" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">回溯，回到上一层区间</text>

  <text x="310" y="426" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">区间对半切 ⇒ 第 d 层恰有 2^d 个互不相同的列，且列号与中序次序一致</text>
  <text x="310" y="448" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">总时间 O(m·n) = O(2^h)，已是输出本身的规模；递归深度 ≤ h ≤ 10</text>
</svg>
