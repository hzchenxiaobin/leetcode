<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">同一问题的两份增量账单：把开销花在哪一侧？</text>

  <!-- 方案一 -->
  <rect x="40" y="56" width="230" height="228" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="155" y="84" text-anchor="middle" font-size="14.5" fill="#446688" filter="url(#rough2)">方案一：邻接表 + Dijkstra</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="155" y="114" text-anchor="middle">建图：O(n + m)</text>
    <text x="155" y="142" text-anchor="middle">addEdge：O(1) ★ 轻松</text>
    <text x="155" y="170" text-anchor="middle">shortestPath：O((n+m)·log n) ★ 重</text>
    <text x="155" y="198" text-anchor="middle">空间：邻接表 O(n + m)</text>
  </g>
  <rect x="64" y="216" width="182" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="237" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">适合：加边多、查询少的场景</text>
  <text x="155" y="254" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（本题查询 ≤ 100，同样稳过）</text>

  <!-- 方案二 -->
  <rect x="290" y="56" width="230" height="228" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="405" y="84" text-anchor="middle" font-size="14.5" fill="#4a7a3a" filter="url(#rough2)">方案二：Floyd 矩阵 + 增量</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="405" y="114" text-anchor="middle">建图：O(n³)</text>
    <text x="405" y="142" text-anchor="middle">addEdge：O(n²) ★ 重</text>
    <text x="405" y="170" text-anchor="middle">shortestPath：O(1) ★ 查表即答</text>
    <text x="405" y="198" text-anchor="middle">空间：矩阵 O(n²)</text>
  </g>
  <rect x="314" y="216" width="182" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="405" y="237" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">加边更新式（每次全部对取 min）：</text>
  <text x="405" y="254" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">d'ᵢⱼ = min(dᵢⱼ, dᵢᵤ + w + dᵥⱼ)</text>

  <path d="M 270 170 L 290 170" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="308" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">n ≤ 100：两方案总量级都在 10⁶ 上下，任选其一都轻松通过</text>
</svg>
