<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：nums = [13, 23, 12]，单趟逐位现结</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">p=0 是个位（x%10 最先取出），p=1 是十位；ans 为每步结算后的累计值</text>

  <!-- 表头 -->
  <rect x="45" y="58" width="45" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#r)"/>
  <rect x="90" y="58" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#r)"/>
  <rect x="150" y="58" width="55" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#r)"/>
  <rect x="205" y="58" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#r)"/>
  <rect x="275" y="58" width="125" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#r)"/>
  <rect x="400" y="58" width="115" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#r)"/>
  <text x="67" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#r)">i</text>
  <text x="120" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#r)">到达的数</text>
  <text x="177" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#r)">位 p</text>
  <text x="240" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#r)">d = x%10</text>
  <text x="337" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#r)">i − cnt[p][d]</text>
  <text x="457" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#r)">ans 累计</text>

  <!-- 行 1：i=0, 13, p=0 -->
  <rect x="45" y="84" width="45" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="90" y="84" width="60" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="150" y="84" width="55" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="205" y="84" width="70" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="275" y="84" width="125" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="400" y="84" width="115" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <text x="67" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">0</text>
  <text x="120" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">13</text>
  <text x="177" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">0（个位）</text>
  <text x="240" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">3</text>
  <text x="337" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">0 − 0 = 0</text>
  <text x="457" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">0</text>

  <!-- 行 2：i=0, 13, p=1 -->
  <rect x="45" y="116" width="45" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="90" y="116" width="60" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="150" y="116" width="55" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="205" y="116" width="70" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="275" y="116" width="125" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="400" y="116" width="115" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <text x="67" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">0</text>
  <text x="120" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">13</text>
  <text x="177" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">1（十位）</text>
  <text x="240" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">1</text>
  <text x="337" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">0 − 0 = 0</text>
  <text x="457" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">0</text>

  <!-- 行 3：i=1, 23, p=0 -->
  <rect x="45" y="148" width="45" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="90" y="148" width="60" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="150" y="148" width="55" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="205" y="148" width="70" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="275" y="148" width="125" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="400" y="148" width="115" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <text x="67" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">1</text>
  <text x="120" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">23</text>
  <text x="177" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">0（个位）</text>
  <text x="240" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">3</text>
  <text x="337" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">1 − 1 = 0</text>
  <text x="457" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">0</text>

  <!-- 行 4：i=1, 23, p=1（非零结算） -->
  <rect x="45" y="180" width="45" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="90" y="180" width="60" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="150" y="180" width="55" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="205" y="180" width="70" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="275" y="180" width="125" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#r)"/>
  <rect x="400" y="180" width="115" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#r)"/>
  <text x="67" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">1</text>
  <text x="120" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">23</text>
  <text x="177" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">1（十位）</text>
  <text x="240" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">2</text>
  <text x="337" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">1 − 0 = 1</text>
  <text x="457" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">1</text>

  <!-- 行 5：i=2, 12, p=0（非零结算） -->
  <rect x="45" y="212" width="45" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="90" y="212" width="60" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="150" y="212" width="55" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="205" y="212" width="70" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="275" y="212" width="125" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#r)"/>
  <rect x="400" y="212" width="115" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#r)"/>
  <text x="67" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">2</text>
  <text x="120" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">12</text>
  <text x="177" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">0（个位）</text>
  <text x="240" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">2</text>
  <text x="337" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">2 − 0 = 2</text>
  <text x="457" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">3</text>

  <!-- 行 6：i=2, 12, p=1（非零结算） -->
  <rect x="45" y="244" width="45" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="90" y="244" width="60" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="150" y="244" width="55" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="205" y="244" width="70" height="32" fill="#fff" stroke="#bbb" stroke-width="0.8" filter="url(#r)"/>
  <rect x="275" y="244" width="125" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#r)"/>
  <rect x="400" y="244" width="115" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#r)"/>
  <text x="67" y="264" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">2</text>
  <text x="120" y="264" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">12</text>
  <text x="177" y="264" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">1（十位）</text>
  <text x="240" y="264" text-anchor="middle" font-size="12" fill="#333" filter="url(#r)">1</text>
  <text x="337" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">2 − 1 = 1</text>
  <text x="457" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">4</text>

  <!-- i 分组线 -->
  <path d="M 45 148 H 515" stroke="#446688" stroke-width="2.2" filter="url(#r)"/>
  <path d="M 45 212 H 515" stroke="#446688" stroke-width="2.2" filter="url(#r)"/>

  <!-- 说明 -->
  <text x="45" y="296" font-size="10.5" fill="#666" filter="url(#r)">第 3 行：23 的个位 3 与 13 的个位 3 相同 → 1 − 1 = 0，同数字被 cnt[p][d] 扣除</text>
  <text x="45" y="314" font-size="10.5" fill="#666" filter="url(#r)">第 5/6 行：12 的个位 2 与之前 (3,3) 全不同 → +2；十位 1 与 13 同、与 23 异 → +1</text>

  <!-- 结论框 -->
  <rect x="40" y="334" width="480" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r)"/>
  <text x="280" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#r)">最终 ans = 4（三处非零结算：+1、+2、+1）</text>
  <text x="280" y="374" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#r)">与逐对验证一致：(13,23)=1，(13,12)=1，(23,12)=2，合计 4</text>

  <text x="280" y="404" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#r)">每步只有取余、查桶、减法各一次；全部操作数 = n × 位数 ≤ 9n</text>
</svg>
