<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606e"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">答案只能是素数幂：f = 最小的「不整除 lcm」的素数幂</text>
  <path d="M 96 41 Q 380 48 664 41" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- ================= 左面板：素数幂体检表 ================= -->
  <rect x="18" y="54" width="368" height="252" rx="10" fill="#f7fbff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="202" y="78" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">区间 [1,6] 的 lcm = 60 的体检表</text>

  <g filter="url(#rough2)">
    <rect x="36" y="96" width="46" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="59" y="121" text-anchor="middle" font-size="14" fill="#3c5e2e">2</text>
    <rect x="88" y="96" width="46" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="111" y="121" text-anchor="middle" font-size="14" fill="#3c5e2e">3</text>
    <rect x="140" y="96" width="46" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="163" y="121" text-anchor="middle" font-size="14" fill="#3c5e2e">4</text>
    <rect x="192" y="96" width="46" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="215" y="121" text-anchor="middle" font-size="14" fill="#3c5e2e">5</text>
    <rect x="244" y="96" width="46" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <text x="267" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f3a36">7</text>
    <rect x="296" y="96" width="46" height="38" rx="5" fill="#f3f3f3" stroke="#9aa0a6" stroke-width="1.2"/>
    <text x="319" y="121" text-anchor="middle" font-size="14" fill="#7a8085">8</text>
    <text x="59" y="152" text-anchor="middle" font-size="13" fill="#4a7a3a">✓</text>
    <text x="111" y="152" text-anchor="middle" font-size="13" fill="#4a7a3a">✓</text>
    <text x="163" y="152" text-anchor="middle" font-size="13" fill="#4a7a3a">✓</text>
    <text x="215" y="152" text-anchor="middle" font-size="13" fill="#4a7a3a">✓</text>
    <text x="267" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">✗</text>
    <text x="319" y="152" text-anchor="middle" font-size="13" fill="#9aa0a6">?</text>
  </g>

  <g filter="url(#rough2)">
    <text x="202" y="186" text-anchor="middle" font-size="12.5" fill="#2f4a66">2,3,4,5 都整除 60；7 不整除</text>
    <text x="202" y="208" text-anchor="middle" font-size="12.5" fill="#2f4a66">⇒ f(1,6) = 7</text>
    <text x="202" y="238" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">第一个 ✗ 的素数幂就是 f</text>
    <text x="202" y="262" text-anchor="middle" font-size="12" fill="#55606e">合数不必检查：4 被 2 管、9 被 3 管</text>
    <text x="202" y="286" text-anchor="middle" font-size="12" fill="#55606e">lcm 有 10⁵ 位？只需知道「谁整除」</text>
  </g>

  <!-- ================= 右面板：最小非除数必为素数幂 ================= -->
  <rect x="398" y="54" width="344" height="252" rx="10" fill="#fffdf5" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="570" y="78" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6520" filter="url(#rough2)">若最小非除数 x 不是素数幂</text>

  <g filter="url(#rough2)">
    <text x="570" y="106" text-anchor="middle" font-size="13" fill="#5a4420">x = a · b，gcd(a,b) = 1，a,b &gt; 1</text>
    <rect x="440" y="122" width="80" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="480" y="144" text-anchor="middle" font-size="13" fill="#2f4a66">a &lt; x</text>
    <rect x="620" y="122" width="80" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="660" y="144" text-anchor="middle" font-size="13" fill="#2f4a66">b &lt; x</text>
    <rect x="530" y="122" width="80" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="570" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3a36">x</text>
    <path d="M 462 158 Q 500 176 528 168" stroke="#55606e" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <path d="M 678 158 Q 640 176 612 168" stroke="#55606e" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <text x="497" y="196" text-anchor="middle" font-size="12" fill="#3c5e2e">都整除 L</text>
    <text x="643" y="196" text-anchor="middle" font-size="12" fill="#3c5e2e">都整除 L</text>
    <text x="570" y="224" text-anchor="middle" font-size="13" fill="#8f3a36">⇒ x = a·b 也整除 L，矛盾</text>
    <text x="570" y="252" text-anchor="middle" font-size="12.5" fill="#5a4420">所以最小非除数必是某个 p^k</text>
    <text x="570" y="278" text-anchor="middle" font-size="12" fill="#55606e">候选只剩素数幂，数量 O(n/log n)</text>
  </g>

  <!-- ================= 底部：单调性 ================= -->
  <rect x="18" y="322" width="724" height="88" rx="10" fill="#eef7f0" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="380" y="348" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e">单调性：区间变长，lcm 只增 ⇒ f 不减</text>
    <text x="380" y="372" text-anchor="middle" font-size="12.5" fill="#3c5e2e">于是问「有没有区间做到 q」时，把区间撑到最大总是更有利</text>
    <text x="380" y="396" text-anchor="middle" font-size="12.5" fill="#3c5e2e">⇒ 对每个素数幂 q，只需检查「不含 q 的倍数」的极大空洞 —— 空洞总数 O(n log n)</text>
  </g>
</svg>
