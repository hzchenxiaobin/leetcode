<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">为什么答案是「连通分量数 c 减 1」</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只有落在环上的冗余边才拆得动，拆一条正好把两个分量缝起来</text>

  <path d="M 80 120 L 165 120" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <path d="M 80 120 L 122 190" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 165 120 L 122 190" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 215 120 L 300 120" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <path d="M 215 120 L 257 190" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 300 120 L 257 190" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <circle cx="80" cy="120" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="165" cy="120" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="122" cy="190" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="215" cy="120" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="300" cy="120" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="257" cy="190" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="160" cy="272" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="80" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="165" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="122" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="215" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="300" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="257" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="160" y="277" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">6</text>

  <text x="122" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">分量 A（3 点 3 边）</text>
  <text x="257" y="80" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">分量 B（3 点 3 边）</text>
  <text x="160" y="308" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">孤立点自成一个分量</text>
  <text x="122" y="232" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">虚线 = 冗余边</text>

  <text x="40" y="336" font-size="10.5" fill="#555" filter="url(#rough2)">n = 7，m = 6，c = 3 ⇒ 冗余边 r = m − (n − c) = 6 − 4 = 2</text>
  <text x="40" y="356" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">恰好 r = c − 1 = 2：拆 2 条冗余边，就把 3 个分量缝成 1 个</text>

  <rect x="352" y="72" width="240" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="364" y="92" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">下界：至少 c − 1 次</text>
  <text x="364" y="110" font-size="9.6" fill="#555" filter="url(#rough2)">一次操作只动一条边：拆 1 条、插 1 条，</text>
  <text x="364" y="126" font-size="9.6" fill="#555" filter="url(#rough2)">连通分量数 c 至多减少 1。</text>

  <rect x="352" y="152" width="240" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="364" y="172" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">上界：c − 1 次一定够</text>
  <text x="364" y="190" font-size="9.6" fill="#555" filter="url(#rough2)">m ≥ n − 1 ⇒ r = m − (n − c) ≥ c − 1</text>
  <text x="364" y="208" font-size="9.6" fill="#555" filter="url(#rough2)">冗余边在环上，拆掉不断连通性；</text>
  <text x="364" y="226" font-size="9.6" fill="#555" filter="url(#rough2)">把它插到两个不同分量之间，</text>
  <text x="364" y="244" font-size="9.6" fill="#555" filter="url(#rough2)">c 必然减 1，故 c − 1 次足够。</text>

  <rect x="352" y="278" width="240" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="364" y="298" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">结论</text>
  <text x="364" y="316" font-size="9.8" fill="#555" filter="url(#rough2)">m &lt; n − 1 → 返回 −1（边不够）</text>
  <text x="364" y="334" font-size="9.8" fill="#b85450" filter="url(#rough2)">否则答案 = c − 1</text>
</svg>
