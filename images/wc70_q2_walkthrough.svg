<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 476" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="476" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：root = [4,2,6,1,3,5,7]，target = 2</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">递归沿「该往哪边要答案」一路下钻到空树，再逐层把两侧接回</text>

  <!-- 表头 -->
  <rect x="30" y="62" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="38" y="79" font-size="10" fill="#2f4a66" filter="url(#rough2)">递归调用</text>
  <text x="150" y="79" font-size="10" fill="#2f4a66" filter="url(#rough2)">比较</text>
  <text x="218" y="79" font-size="10" fill="#2f4a66" filter="url(#rough2)">递归方向</text>
  <text x="290" y="79" font-size="10" fill="#2f4a66" filter="url(#rough2)">本层返回 (小, 大)</text>
  <text x="422" y="79" font-size="10" fill="#2f4a66" filter="url(#rough2)">回溯挂接</text>

  <!-- 表格网格 -->
  <rect x="30" y="62" width="500" height="202" fill="none" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <path d="M 30 88 L 530 88" stroke="#bbb" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 30 132 L 530 132" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 30 176 L 530 176" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 30 220 L 530 220" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 142 62 L 142 264" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 210 62 L 210 264" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 282 62 L 282 264" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 414 62 L 414 264" stroke="#e0e0e0" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- 行 1 -->
  <text x="38" y="112" font-size="10" fill="#333" filter="url(#rough2)">split(4)</text>
  <text x="150" y="112" font-size="10" fill="#b85450" filter="url(#rough2)">4 &gt; 2</text>
  <text x="218" y="112" font-size="10" fill="#333" filter="url(#rough2)">左子 2</text>
  <text x="290" y="112" font-size="10" fill="#333" filter="url(#rough2)">(2, 4)</text>
  <text x="422" y="112" font-size="10" fill="#d6a040" filter="url(#rough2)">4.left ← 3</text>

  <!-- 行 2 -->
  <text x="38" y="156" font-size="10" fill="#333" filter="url(#rough2)">split(2)</text>
  <text x="150" y="156" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2 ≤ 2</text>
  <text x="218" y="156" font-size="10" fill="#333" filter="url(#rough2)">右子 3</text>
  <text x="290" y="156" font-size="10" fill="#333" filter="url(#rough2)">(2, 3)</text>
  <text x="422" y="156" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2.right ← null</text>

  <!-- 行 3 -->
  <text x="38" y="200" font-size="10" fill="#333" filter="url(#rough2)">split(3)</text>
  <text x="150" y="200" font-size="10" fill="#b85450" filter="url(#rough2)">3 &gt; 2</text>
  <text x="218" y="200" font-size="10" fill="#333" filter="url(#rough2)">左子 null</text>
  <text x="290" y="200" font-size="10" fill="#333" filter="url(#rough2)">(null, 3)</text>
  <text x="422" y="200" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3.left ← null</text>

  <!-- 行 4 -->
  <text x="38" y="244" font-size="10" fill="#333" filter="url(#rough2)">split(null)</text>
  <text x="150" y="244" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="218" y="244" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="290" y="244" font-size="10" fill="#333" filter="url(#rough2)">(null, null)</text>
  <text x="422" y="244" font-size="10" fill="#999" filter="url(#rough2)">无改写</text>

  <text x="30" y="290" font-size="10.5" fill="#666" filter="url(#rough2)">回溯结束后得到两棵树（target = 2）：</text>

  <!-- 小树 -->
  <path d="M 105 326 L 76 368" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <circle cx="105" cy="326" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="331" text-anchor="middle" font-size="11" fill="#33552c" filter="url(#rough2)">2</text>
  <circle cx="76" cy="368" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="373" text-anchor="middle" font-size="11" fill="#33552c" filter="url(#rough2)">1</text>
  <text x="105" y="400" text-anchor="middle" font-size="10" fill="#46603c" filter="url(#rough2)">小树：root = 2</text>

  <!-- 大树 -->
  <path d="M 330 314 L 286 354" stroke="#d6a040" stroke-width="2.2" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 330 314 L 376 354" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 376 354 L 350 392" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 376 354 L 406 392" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <circle cx="330" cy="314" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="319" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">4</text>
  <circle cx="286" cy="354" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="286" y="359" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="376" cy="354" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="376" y="359" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">6</text>
  <circle cx="350" cy="392" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="397" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">5</text>
  <circle cx="406" cy="392" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="406" y="397" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">7</text>
  <text x="348" y="424" text-anchor="middle" font-size="10" fill="#3a5a78" filter="url(#rough2)">大树：root = 4</text>

  <text x="280" y="448" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">橙色虚线：切分后新挂接的边（4→3）；蓝色实线：原树边原样保留</text>
  <text x="280" y="466" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">小树只剩 2→1；大树丢掉 4→2、2→3，却接上了 4→3，节点数一分为 2 + 5</text>
</svg>
