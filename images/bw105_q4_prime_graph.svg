<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：gcd 图连通 ⟺ “数值–质因数”图连通</text>

  <!-- 左图：[2,3,6] -->
  <rect x="22" y="52" width="236" height="212" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="76" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">nums = [2, 3, 6] → true</text>
  <!-- 值节点（方框） -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="42" y="102" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="64" y="125" fill="#2f4a66">2</text>
    <rect x="108" y="102" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="130" y="125" fill="#2f4a66">3</text>
    <rect x="180" y="102" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="202" y="125" fill="#2f4a66">6</text>
  </g>
  <text x="140" y="98" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">数值节点</text>
  <!-- 质因数节点（圆） -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <ellipse cx="86" cy="212" rx="24" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="86" y="217" fill="#7a5a10">2</text>
    <ellipse cx="196" cy="212" rx="24" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="196" y="217" fill="#7a5a10">3</text>
  </g>
  <text x="140" y="182" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">质因数节点</text>
  <!-- 边 -->
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.6" fill="none">
    <path d="M64 138 L82 194"/>
    <path d="M130 138 L188 194"/>
    <path d="M202 138 L96 196"/>
    <path d="M214 130 L200 192"/>
  </g>
  <text x="140" y="252" text-anchor="middle" font-size="11.5" fill="#2f5527" filter="url(#rough2)">2—2、3—3、6—2、6—3，全部串成一团</text>

  <!-- 右图：[3,9,5] -->
  <rect x="272" y="52" width="236" height="212" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="76" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">nums = [3, 9, 5] → false</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="292" y="102" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="314" y="125" fill="#2f4a66">3</text>
    <rect x="358" y="102" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="380" y="125" fill="#2f4a66">9</text>
    <rect x="430" y="102" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="452" y="125" fill="#2f4a66">5</text>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <ellipse cx="336" cy="212" rx="24" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="336" y="217" fill="#7a5a10">3</text>
    <ellipse cx="452" cy="212" rx="24" ry="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="452" y="217" fill="#7a5a10">5</text>
  </g>
  <g filter="url(#rough2)" stroke="#8c3a36" stroke-width="1.6" fill="none">
    <path d="M314 138 L330 194"/>
    <path d="M380 138 L344 194"/>
    <path d="M452 138 L452 190"/>
  </g>
  <text x="342" y="252" text-anchor="middle" font-size="11.5" fill="#8c3a36" filter="url(#rough2)">{3, 9} 一团，{5} 独自一团 → 断开</text>

  <rect x="22" y="280" width="486" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a5a10">
    <text x="40" y="304">gcd(a, b) &gt; 1 ⟺ a 与 b 有公共质因数 p ⟺ a、b 都与 p 相连 ⟺ 同一连通块</text>
    <text x="40" y="330">每个数只需和“它的质因数”连边（不必两两建边），连通性不变 —— 边数从 O(n²) 降到 O(n log V)</text>
  </g>
</svg>
