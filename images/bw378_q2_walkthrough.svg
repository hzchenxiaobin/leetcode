<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：s = "aaabaaa"（n = 7）</text>
  <path d="M 280 42 Q 470 52 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- split -->
  <text x="80" y="78" font-size="13" fill="#2b2b2b">① 分段：</text>
  <g filter="url(#sk)">
    <rect x="150" y="90" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="192" y="90" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="234" y="90" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="276" y="90" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="318" y="90" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="360" y="90" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="402" y="90" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="170" y="114" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="212" y="114" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="254" y="114" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="296" y="114" text-anchor="middle" font-size="14" fill="#7a5415">b</text>
  <text x="338" y="114" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="380" y="114" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="422" y="114" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="480" y="112" font-size="13" fill="#2e6e2e" font-family="monospace" font-weight="bold">runs: a→[3,3], b→[1]</text>

  <!-- binary search table -->
  <text x="80" y="166" font-size="13" fill="#2b2b2b">② 二分过程（check(k) 只看 a：两段各贡献 max(0, 3−k+1)）：</text>
  <g filter="url(#sk)">
    <rect x="80" y="180" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="180" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="240" y="180" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="320" y="180" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="540" y="180" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="80" y="214" width="80" height="32" fill="#fffdf3" stroke="#999" stroke-width="1"/>
    <rect x="160" y="214" width="80" height="32" fill="#fffdf3" stroke="#999" stroke-width="1"/>
    <rect x="240" y="214" width="80" height="32" fill="#fffdf3" stroke="#999" stroke-width="1"/>
    <rect x="320" y="214" width="220" height="32" fill="#fffdf3" stroke="#999" stroke-width="1"/>
    <rect x="540" y="214" width="180" height="32" fill="#fffdf3" stroke="#999" stroke-width="1"/>
    <rect x="80" y="246" width="80" height="32" fill="#fffdf3" stroke="#999" stroke-width="1"/>
    <rect x="160" y="246" width="80" height="32" fill="#fffdf3" stroke="#999" stroke-width="1"/>
    <rect x="240" y="246" width="80" height="32" fill="#fffdf3" stroke="#999" stroke-width="1"/>
    <rect x="320" y="246" width="220" height="32" fill="#fffdf3" stroke="#999" stroke-width="1"/>
    <rect x="540" y="246" width="180" height="32" fill="#fffdf3" stroke="#999" stroke-width="1"/>
    <rect x="80" y="278" width="80" height="32" fill="#fffdf3" stroke="#999" stroke-width="1"/>
    <rect x="160" y="278" width="80" height="32" fill="#fffdf3" stroke="#999" stroke-width="1"/>
    <rect x="240" y="278" width="80" height="32" fill="#fffdf3" stroke="#999" stroke-width="1"/>
    <rect x="320" y="278" width="220" height="32" fill="#fffdf3" stroke="#999" stroke-width="1"/>
    <rect x="540" y="278" width="180" height="32" fill="#fffdf3" stroke="#999" stroke-width="1"/>
  </g>
  <text x="120" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a8e">lo</text>
  <text x="200" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a8e">hi</text>
  <text x="280" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a8e">mid</text>
  <text x="430" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a8e">a 的计数</text>
  <text x="630" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5a8e">动作</text>
  <text x="120" y="235" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="200" y="235" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="280" y="235" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="430" y="235" text-anchor="middle" font-size="12" fill="#333">0 + 0 = 0</text>
  <text x="630" y="235" text-anchor="middle" font-size="12" fill="#8e3a34">✗ → hi = 3</text>
  <text x="120" y="267" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="200" y="267" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="280" y="267" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="430" y="267" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">2 + 2 = 4 ≥ 3</text>
  <text x="630" y="267" text-anchor="middle" font-size="12" fill="#2e6e2e">✓ → ans=2, lo=3</text>
  <text x="120" y="299" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="200" y="299" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="280" y="299" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="430" y="299" text-anchor="middle" font-size="12" fill="#333">1 + 1 = 2</text>
  <text x="630" y="299" text-anchor="middle" font-size="12" fill="#8e3a34">✗ → hi = 2</text>
  <text x="80" y="334" font-size="12" fill="#555">lo = 3 &gt; hi = 2，二分结束 →</text>
  <text x="300" y="334" font-size="14" font-weight="bold" fill="#b85450">返回 2</text>

  <!-- verify k=2 -->
  <text x="80" y="378" font-size="13" fill="#2b2b2b">③ 验证 k = 2："aa" 的出现位置（重叠也算，共 4 次 ≥ 3）：</text>
  <g filter="url(#sk)">
    <rect x="150" y="392" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="192" y="392" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="234" y="392" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="276" y="392" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="318" y="392" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="360" y="392" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="402" y="392" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="150" y="396" width="80" height="28" rx="4" fill="none" stroke="#b85450" stroke-width="2.2"/>
    <rect x="192" y="396" width="80" height="28" rx="4" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 3"/>
    <rect x="318" y="396" width="80" height="28" rx="4" fill="none" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="360" y="396" width="80" height="28" rx="4" fill="none" stroke="#4a8e4a" stroke-width="1.6" stroke-dasharray="6 3"/>
  </g>
  <text x="470" y="416" font-size="12" fill="#444">左段 2 次 + 右段 2 次 = 4 ✓</text>

  <!-- verify k=3 fails -->
  <text x="80" y="466" font-size="13" fill="#2b2b2b">④ 验证 k = 3："aaa" 只有两段各 1 次 = 2 &lt; 3，不可行：</text>
  <g filter="url(#sk)">
    <rect x="150" y="480" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="192" y="480" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="234" y="480" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="276" y="480" width="40" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="318" y="480" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="360" y="480" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="402" y="480" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="150" y="484" width="120" height="28" rx="4" fill="none" stroke="#b85450" stroke-width="2"/>
    <rect x="318" y="484" width="120" height="28" rx="4" fill="none" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="470" y="504" font-size="12" fill="#8e3a34">1 + 1 = 2 ✗</text>

  <!-- Q2/Q3 note -->
  <g filter="url(#sk)">
    <rect x="80" y="546" width="780" height="70" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="6 3"/>
  </g>
  <text x="100" y="574" font-size="13" font-weight="bold" fill="#2b2b2b">周赛视角：本题（#2981，n ≤ 50）O(n²) 暴力即可过线；</text>
  <text x="100" y="596" font-size="12" fill="#444">孪生题 #2982（本场 Q3）把 n 放大到 10⁵——上面这套「分段 + 二分」代码原样复制即可通过，这正是本场 Q2→Q3 的设计意图。</text>
</svg>
