<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#8a7a4a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：s ＝ "aaabcccd"，k ＝ 2</text>
  <path d="M 175 40 Q 320 48 465 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="60" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="110" y="60" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="60" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="210" y="60" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="260" y="60" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="310" y="60" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="360" y="60" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="410" y="60" width="46" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>
  <text x="83" y="85" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="133" y="85" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="183" y="85" text-anchor="middle" font-size="14" fill="#333">a</text>
  <text x="233" y="85" text-anchor="middle" font-size="14" fill="#8f3830">b</text>
  <text x="283" y="85" text-anchor="middle" font-size="14" fill="#2e5a24">c</text>
  <text x="333" y="85" text-anchor="middle" font-size="14" fill="#2e5a24">c</text>
  <text x="383" y="85" text-anchor="middle" font-size="14" fill="#2e5a24">c</text>
  <text x="433" y="85" text-anchor="middle" font-size="14" fill="#8f3830">d</text>
  <path d="M 218 64 L 248 96 M 248 64 L 218 96" stroke="#b85450" stroke-width="2" stroke-linecap="round" filter="url(#sk)"/>
  <path d="M 418 64 L 448 96 M 448 64 L 418 96" stroke="#b85450" stroke-width="2" stroke-linecap="round" filter="url(#sk)"/>
  <text x="83" y="112" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="133" y="112" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="183" y="112" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="233" y="112" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="283" y="112" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="333" y="112" text-anchor="middle" font-size="10" fill="#999">5</text>
  <text x="383" y="112" text-anchor="middle" font-size="10" fill="#999">6</text>
  <text x="433" y="112" text-anchor="middle" font-size="10" fill="#999">7</text>

  <path d="M 62 124 Q 133 132 204 124" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="133" y="142" text-anchor="middle" font-size="11" fill="#34506e">前缀 "aaa"：dp[3][0] 全保留</text>
  <path d="M 212 124 Q 308 134 404 124" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="308" y="142" text-anchor="middle" font-size="11" fill="#2e5a24" font-weight="bold">决策 B 区间 [3, 6] ＝ "bccc"</text>

  <path d="M 430 100 Q 300 140 190 172" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 330 148 Q 400 162 456 172" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="36" y="176" width="276" height="108" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="328" y="176" width="276" height="108" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="174" y="200" text-anchor="middle" font-size="13.5" fill="#34506e" font-weight="bold">① 决策 A @ dp[8][2]</text>
  <text x="174" y="224" text-anchor="middle" font-size="11.5" fill="#34506e">删末尾孤立的 'd'（预算 j：2 → 1）</text>
  <text x="174" y="250" text-anchor="middle" font-size="12.5" fill="#34506e">dp[8][2] ← dp[7][1]</text>
  <text x="174" y="272" text-anchor="middle" font-size="11" fill="#6a82a0">'d' 是长度 1 的孤段，删掉直接省 1 位</text>
  <text x="466" y="200" text-anchor="middle" font-size="13.5" fill="#2e5a24" font-weight="bold">② 决策 B @ dp[7][1]</text>
  <text x="466" y="224" text-anchor="middle" font-size="11.5" fill="#2e5a24">区间 [3,6]：删 'b'（del＝1），留 "ccc"（kept＝3）</text>
  <text x="466" y="250" text-anchor="middle" font-size="12.5" fill="#2e5a24">dp[7][1] ← dp[3][0] ＋ encLen(3) ＝ 2 ＋ 2</text>
  <text x="466" y="272" text-anchor="middle" font-size="11" fill="#5a8a4a">删 'b' 消掉孤段，'c' 段与 'a' 前缀互不干扰</text>

  <path d="M 174 288 Q 220 296 250 302" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 466 288 Q 420 296 390 302" fill="none" stroke="#8a7a4a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="36" y="306" width="568" height="130" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="330" text-anchor="middle" font-size="12.5" fill="#8a6415">③ 汇总：dp[3][0] ＝ "aaa" 整段保留 → encLen(3) ＝ 2（"a3"）</text>
  <text x="320" y="354" text-anchor="middle" font-size="12.5" fill="#8a6415">dp[8][2] ＝ 2 ＋ 2 ＝ 4，删除集 {'b', 'd'}，剩余 "aaaccc"</text>
  <text x="320" y="388" text-anchor="middle" font-size="16" fill="#a05a10" font-weight="bold">最优编码 "a3c3"，长度 4</text>
  <text x="320" y="416" text-anchor="middle" font-size="11" fill="#a07820">对照：全保留 "a3bc3d" ＝ 6；只删 'b' → "a3c3d" ＝ 5；只删 'd' → "a3bc3" ＝ 5</text>
</svg>
