<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 452" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="452" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums = [1, 3, 8, 48, 10]（mask 为窗口内 OR）</text>

  <!-- index header -->
  <g filter="url(#rough2)" font-size="10.5" fill="#888">
    <text x="64" y="54" text-anchor="end">下标</text>
    <text x="100" y="54" text-anchor="middle">0</text>
    <text x="142" y="54" text-anchor="middle">1</text>
    <text x="184" y="54" text-anchor="middle">2</text>
    <text x="226" y="54" text-anchor="middle">3</text>
    <text x="268" y="54" text-anchor="middle">4</text>
  </g>

  <!-- r = 0 -->
  <g filter="url(#rough2)">
    <text x="64" y="79" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">r = 0</text>
    <rect x="80"  y="62" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="100" y="79" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="122" y="62" width="40" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="142" y="79" text-anchor="middle" font-size="13" fill="#999">3</text>
    <rect x="164" y="62" width="40" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="184" y="79" text-anchor="middle" font-size="13" fill="#999">8</text>
    <rect x="206" y="62" width="40" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="226" y="79" text-anchor="middle" font-size="13" fill="#999">48</text>
    <rect x="248" y="62" width="40" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="268" y="79" text-anchor="middle" font-size="13" fill="#999">10</text>
    <path d="M 100 108 L 100 90" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>
    <text x="300" y="73" font-size="11" fill="#333">x = 1：000000 &amp; 000001 = 0 → 直接纳入</text>
    <text x="300" y="89" font-size="11" fill="#666" font-weight="bold">mask = 000001　ans = 1</text>
  </g>

  <!-- r = 1 -->
  <g filter="url(#rough2)">
    <text x="64" y="141" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">r = 1</text>
    <rect x="80"  y="124" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/><text x="100" y="141" text-anchor="middle" font-size="13" fill="#b85450">1</text>
    <rect x="122" y="124" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="142" y="141" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="164" y="124" width="40" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="184" y="141" text-anchor="middle" font-size="13" fill="#999">8</text>
    <rect x="206" y="124" width="40" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="226" y="141" text-anchor="middle" font-size="13" fill="#999">48</text>
    <rect x="248" y="124" width="40" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="268" y="141" text-anchor="middle" font-size="13" fill="#999">10</text>
    <path d="M 142 170 L 142 152" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>
    <text x="300" y="135" font-size="11" fill="#333">x = 3：000001 &amp; 000011 ≠ 0 → 撤销下标 0</text>
    <text x="300" y="151" font-size="11" fill="#666" font-weight="bold">mask = 000011　ans = 1</text>
  </g>

  <!-- r = 2 -->
  <g filter="url(#rough2)">
    <text x="64" y="203" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">r = 2</text>
    <rect x="80"  y="186" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/><text x="100" y="203" text-anchor="middle" font-size="13" fill="#b85450">1</text>
    <rect x="122" y="186" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="142" y="203" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="164" y="186" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="184" y="203" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">8</text>
    <rect x="206" y="186" width="40" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="226" y="203" text-anchor="middle" font-size="13" fill="#999">48</text>
    <rect x="248" y="186" width="40" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="268" y="203" text-anchor="middle" font-size="13" fill="#999">10</text>
    <path d="M 184 232 L 184 214" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>
    <text x="300" y="197" font-size="11" fill="#333">x = 8：000011 &amp; 001000 = 0 → 纳入</text>
    <text x="300" y="213" font-size="11" fill="#666" font-weight="bold">mask = 001011　ans = 2</text>
  </g>

  <!-- r = 3 -->
  <g filter="url(#rough2)">
    <text x="64" y="265" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">r = 3</text>
    <rect x="80"  y="248" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/><text x="100" y="265" text-anchor="middle" font-size="13" fill="#b85450">1</text>
    <rect x="122" y="248" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="142" y="265" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="164" y="248" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="184" y="265" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">8</text>
    <rect x="206" y="248" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/><text x="226" y="265" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">48</text>
    <rect x="248" y="248" width="40" height="26" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.2" rx="4"/><text x="268" y="265" text-anchor="middle" font-size="13" fill="#999">10</text>
    <path d="M 226 294 L 226 276" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>
    <text x="300" y="259" font-size="11" fill="#333">x = 48：001011 &amp; 110000 = 0 → 纳入</text>
    <text x="300" y="275" font-size="11" fill="#4a7a3a" font-weight="bold">mask = 111011　ans = 3（答案）</text>
  </g>

  <!-- r = 4 -->
  <g filter="url(#rough2)">
    <text x="64" y="327" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">r = 4</text>
    <rect x="80"  y="310" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/><text x="100" y="327" text-anchor="middle" font-size="13" fill="#b85450">1</text>
    <rect x="122" y="310" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/><text x="142" y="327" text-anchor="middle" font-size="13" fill="#b85450">3</text>
    <rect x="164" y="310" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/><text x="184" y="327" text-anchor="middle" font-size="13" fill="#b85450">8</text>
    <rect x="206" y="310" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="226" y="327" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">48</text>
    <rect x="248" y="310" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/><text x="268" y="327" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">10</text>
    <path d="M 268 356 L 268 338" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>
    <text x="300" y="321" font-size="11" fill="#333">x = 10：111011 &amp; 001010 ≠ 0 → 连撤下标 1、2</text>
    <text x="300" y="337" font-size="11" fill="#666" font-weight="bold">mask = 111010　ans = 3</text>
  </g>

  <!-- legend -->
  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <rect x="40" y="388" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="60" y="399">窗口内</text>
    <rect x="130" y="388" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3"/>
    <text x="150" y="399">已撤销（出窗）</text>
    <rect x="270" y="388" width="14" height="14" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.5" rx="3"/>
    <text x="290" y="399">未考察</text>
    <path d="M 408 402 L 408 388" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)"/>
    <text x="424" y="399">当前 x = nums[right]</text>
  </g>

  <text x="280" y="432" text-anchor="middle" font-size="10.5" fill="#888">收缩时每步执行 mask ^= nums[left++]：由「比特独占」不变量保证 XOR 恰好撤销最左元素</text>
</svg>
