<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">锚点 (i₁, i₂)：s 正读 × t 倒读，逐对剥皮、逐深度结算</text>

  <!-- s 行（正读） -->
  <g filter="url(#rough2)">
    <text x="56" y="82" font-size="12" fill="#446688">s =</text>
    <rect x="90" y="62" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="140" y="62" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="190" y="62" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="240" y="62" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="112" y="82" text-anchor="middle" font-size="12" fill="#333">s[i₁]</text>
    <text x="162" y="82" text-anchor="middle" font-size="12" fill="#333">s[i₁+1]</text>
    <text x="212" y="82" text-anchor="middle" font-size="12" fill="#333">s[i₁+2]</text>
    <text x="262" y="82" text-anchor="middle" font-size="12" fill="#333">s[i₁+3]</text>
    <text x="112" y="52" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">i₁</text>
    <text x="162" y="52" text-anchor="middle" font-size="11" fill="#446688">i₁+1</text>
    <text x="212" y="52" text-anchor="middle" font-size="11" fill="#446688">i₁+2</text>
    <text x="262" y="52" text-anchor="middle" font-size="11" fill="#999">i₁+3</text>
    <text x="300" y="82" font-size="12" fill="#446688">正读 →</text>
  </g>

  <!-- midS 说明框 -->
  <g filter="url(#rough2)">
    <rect x="368" y="56" width="182" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8"/>
    <text x="459" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">midS[x]</text>
    <text x="459" y="94" text-anchor="middle" font-size="10" fill="#333">s 中以 x 为起点的最长回文</text>
  </g>

  <!-- 配对判定列 -->
  <g filter="url(#rough2)">
    <path d="M112,96 L112,104" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" fill="none"/>
    <path d="M162,96 L162,104" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" fill="none"/>
    <path d="M212,96 L212,104" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" fill="none"/>
    <path d="M262,96 L262,104" stroke="#bbb" stroke-width="1.3" stroke-dasharray="3,2" fill="none"/>
    <path d="M112,128 L112,136" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" fill="none"/>
    <path d="M162,128 L162,136" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" fill="none"/>
    <path d="M212,128 L212,136" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3,2" fill="none"/>
    <path d="M262,128 L262,136" stroke="#bbb" stroke-width="1.3" stroke-dasharray="3,2" fill="none"/>
    <circle cx="112" cy="116" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="162" cy="116" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="212" cy="116" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <circle cx="262" cy="116" r="11" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="112" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>
    <text x="162" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a">✓</text>
    <text x="212" y="120" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
    <text x="262" y="120" text-anchor="middle" font-size="11" fill="#999">?</text>
    <text x="459" y="120" text-anchor="middle" font-size="11" fill="#666">✓ 相等 → 剥 +2　✗ 链断</text>
  </g>

  <!-- t 行（倒读排列） -->
  <g filter="url(#rough2)">
    <text x="56" y="160" font-size="12" fill="#4a7a3a">t =</text>
    <rect x="90" y="140" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="140" y="140" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="190" y="140" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="240" y="140" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="112" y="160" text-anchor="middle" font-size="12" fill="#333">t[i₂]</text>
    <text x="162" y="160" text-anchor="middle" font-size="12" fill="#333">t[i₂−1]</text>
    <text x="212" y="160" text-anchor="middle" font-size="12" fill="#333">t[i₂−2]</text>
    <text x="262" y="160" text-anchor="middle" font-size="12" fill="#333">t[i₂−3]</text>
    <text x="300" y="160" font-size="12" fill="#4a7a3a">← 倒读</text>
    <text x="112" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">i₂</text>
    <text x="162" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a">i₂−1</text>
    <text x="212" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a">i₂−2</text>
    <text x="262" y="192" text-anchor="middle" font-size="11" fill="#999">i₂−3</text>
  </g>

  <!-- midT 说明框 -->
  <g filter="url(#rough2)">
    <rect x="368" y="148" width="182" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8"/>
    <text x="459" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">midT[y]</text>
    <text x="459" y="186" text-anchor="middle" font-size="10" fill="#333">t 中以 y 为终点的最长回文</text>
  </g>

  <!-- W 拼接条 -->
  <g filter="url(#rough2)">
    <path d="M90,232 L90,224 L234,224 L234,232" fill="none" stroke="#446688" stroke-width="1.5"/>
    <text x="162" y="220" text-anchor="middle" font-size="11" fill="#446688">A ⊆ s（含核）</text>
    <path d="M240,232 L240,224 L334,224 L334,232" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="287" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a">B ⊆ t</text>
    <text x="50" y="260" font-size="12" fill="#333">W =</text>
    <rect x="90" y="238" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="140" y="238" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="190" y="238" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="240" y="238" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="290" y="238" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="112" y="258" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="112" y="270" text-anchor="middle" font-size="8" fill="#888">s[i₁]</text>
    <text x="162" y="258" text-anchor="middle" font-size="13" fill="#333">b</text>
    <text x="162" y="270" text-anchor="middle" font-size="8" fill="#888">s[i₁+1]</text>
    <text x="212" y="258" text-anchor="middle" font-size="13" fill="#333">核</text>
    <text x="212" y="270" text-anchor="middle" font-size="8" fill="#888">midS / midT</text>
    <text x="262" y="258" text-anchor="middle" font-size="13" fill="#333">b</text>
    <text x="262" y="270" text-anchor="middle" font-size="8" fill="#888">t[i₂−1]</text>
    <text x="312" y="258" text-anchor="middle" font-size="13" fill="#333">a</text>
    <text x="312" y="270" text-anchor="middle" font-size="8" fill="#888">t[i₂]</text>
    <path d="M237,230 L237,282" stroke="#999" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
    <text x="445" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">|W| = 2k + 核长</text>
    <path d="M112,278 Q212,310 312,278" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4"/>
    <path d="M162,278 Q212,298 262,278" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="212" y="324" text-anchor="middle" font-size="12" fill="#b85450">镜像翼 2 对 → 2k = 4</text>
    <text x="212" y="342" text-anchor="middle" font-size="11" fill="#4a7a3a">核 = max(midS[i₁+k], midT[i₂−k])（单侧，可为空）</text>
  </g>

  <!-- 结算公式框 -->
  <g filter="url(#rough2)">
    <rect x="40" y="356" width="480" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
    <text x="280" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">每个深度 k 即时结算：ans ← max(ans, 2k + max(midS[i₁+k], midT[i₂−k]))</text>
    <text x="280" y="400" text-anchor="middle" font-size="10.5" fill="#666">k = 0, 1, ⋯, K(i₁, i₂)；i₁+k = m 或 i₂−k = −1 时核取 0（空核）</text>
  </g>
</svg>
