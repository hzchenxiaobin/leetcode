<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：预处理一次，每个 i 查表比较</text>
  <path d="M 150 40 Q 340 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- panel A: sample 1 -->
  <g filter="url(#sk)"><rect x="36" y="58" width="296" height="160" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="184" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">示例 1：nums = [1, 2, 3]</text>
  <g filter="url(#sk)"><rect x="76" y="92" width="44" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="98" y="114" text-anchor="middle" font-size="13" fill="#333">1</text>
  <g filter="url(#sk)"><rect x="128" y="92" width="44" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="150" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a">2</text>
  <g filter="url(#sk)"><rect x="180" y="92" width="44" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="202" y="114" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="98" y="142" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="150" y="142" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040">1</text>
  <text x="202" y="142" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="184" y="162" text-anchor="middle" font-size="11.5" fill="#444">i=1：left_max = 1，right_min = 3</text>
  <text x="184" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d25">1 &lt; 2 &lt; 3 ✓ → 美丽值 2</text>
  <g filter="url(#sk)"><rect x="139" y="188" width="90" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="184" y="205" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d25">总和 = 2</text>

  <!-- panel B: sample 3 -->
  <g filter="url(#sk)"><rect x="348" y="58" width="296" height="160" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="496" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">示例 3：nums = [3, 2, 1]</text>
  <g filter="url(#sk)"><rect x="388" y="92" width="44" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="410" y="114" text-anchor="middle" font-size="13" fill="#333">3</text>
  <g filter="url(#sk)"><rect x="440" y="92" width="44" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="462" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a">2</text>
  <g filter="url(#sk)"><rect x="492" y="92" width="44" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="514" y="114" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="410" y="142" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="462" y="142" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040">1</text>
  <text x="514" y="142" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="496" y="162" text-anchor="middle" font-size="11.5" fill="#444">i=1：left_max = 3，right_min = 1</text>
  <text x="496" y="180" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">3 &lt; 2 ✗ → 非 2 档；3 &lt; 2 ✗ → 0 档</text>
  <g filter="url(#sk)"><rect x="451" y="188" width="90" height="24" rx="6" fill="#f2f2ee" stroke="#999999" stroke-width="1.5"/></g>
  <text x="496" y="205" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#888">总和 = 0</text>

  <!-- panel C: sample 2 table -->
  <g filter="url(#sk)"><rect x="36" y="236" width="608" height="156" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="340" y="260" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36">示例 2：nums = [2, 4, 6, 4] —— 严格性陷阱在 i=1</text>

  <g filter="url(#sk)"><rect x="52" y="268" width="596" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="52" y="292" width="596" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="52" y="318" width="596" height="26" fill="#f6f6f2" stroke="#446688" stroke-width="1.2"/></g>
  <path d="M 86 268 L 86 344 M 148 268 L 148 344 M 236 268 L 236 344 M 328 268 L 328 344 M 486 268 L 486 344 M 604 268 L 604 344" stroke="#b9c6d8" stroke-width="1" fill="none" filter="url(#sk)"/>

  <text x="69" y="284" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">i</text>
  <text x="117" y="284" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">nums[i]</text>
  <text x="192" y="284" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">left_max</text>
  <text x="282" y="284" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">right_min</text>
  <text x="407" y="284" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">2 档：两次比较</text>
  <text x="545" y="284" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">1 档：相邻</text>
  <text x="626" y="284" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">得分</text>

  <text x="69" y="309" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="117" y="309" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="192" y="309" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="282" y="309" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="407" y="309" text-anchor="middle" font-size="10.5" fill="#333">2&lt;4 ✓ 但 4&lt;4 ✗</text>
  <text x="545" y="309" text-anchor="middle" font-size="10.5" fill="#2f5d25">2&lt;4&lt;6 ✓</text>
  <text x="626" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1a">1</text>

  <text x="69" y="335" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="117" y="335" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="192" y="335" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="282" y="335" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="407" y="335" text-anchor="middle" font-size="10.5" fill="#333">4&lt;6 ✓ 但 6&lt;4 ✗</text>
  <text x="545" y="335" text-anchor="middle" font-size="10.5" fill="#b85450">4&lt;6&lt;4 ✗</text>
  <text x="626" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#888">0</text>

  <g filter="url(#sk)"><rect x="290" y="352" width="100" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="340" y="370" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d25">总和 = 1</text>

  <text x="340" y="414" text-anchor="middle" font-size="11" fill="#888">一次预处理，全场查表——2 档两次比较、1 档两次比较，判定阶段整体 O(n)</text>
</svg>
