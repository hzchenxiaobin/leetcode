<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="32" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：mat = [[1,2,3],[4,5,6]]，r = 3，c = 2</text>
  <text x="320" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">n = 3、c = 2 都只是「除数」：k / n、k % n 得源坐标，k / c、k % c 得目标坐标</text>
  <text x="320" y="66" text-anchor="middle" font-size="10" fill="#666" filter="url(#sk)">k 从 0 递增 ⇒ 读的次序与写的次序都是行优先序，一一对齐</text>
  <text x="63" y="88" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">k</text>
  <text x="149" y="88" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">源 (k/3, k%3)</text>
  <text x="246" y="88" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">值</text>
  <text x="346" y="88" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">目标 (k/2, k%2)</text>
  <text x="491" y="88" text-anchor="middle" font-size="9" fill="#888" filter="url(#sk)">写入 ans</text>
  <path d="M 44 94 L 566 94" stroke="#bbb" stroke-width="1.1" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)" text-anchor="middle" font-size="10" fill="#33404f">
    <rect x="44" y="100" width="38" height="24" rx="4" fill="#eceff1" stroke="#aab2bd" stroke-width="1.1"/>
    <text x="63" y="116">0</text>
    <rect x="90" y="100" width="118" height="24" rx="4" fill="#f4f6f8" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="149" y="116">(0, 0)</text>
    <rect x="216" y="100" width="60" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="246" y="116" font-size="11" font-weight="bold">1</text>
    <rect x="284" y="100" width="124" height="24" rx="4" fill="#f4f6f8" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="346" y="116">(0, 0)</text>
    <rect x="416" y="100" width="150" height="24" rx="4" fill="#fff" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="491" y="116" fill="#446688">ans[0][0] = 1</text>
  </g>
  <g filter="url(#sk)" text-anchor="middle" font-size="10" fill="#33404f">
    <rect x="44" y="128" width="38" height="24" rx="4" fill="#eceff1" stroke="#aab2bd" stroke-width="1.1"/>
    <text x="63" y="144">1</text>
    <rect x="90" y="128" width="118" height="24" rx="4" fill="#f4f6f8" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="149" y="144">(0, 1)</text>
    <rect x="216" y="128" width="60" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="246" y="144" font-size="11" font-weight="bold">2</text>
    <rect x="284" y="128" width="124" height="24" rx="4" fill="#f4f6f8" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="346" y="144">(0, 1)</text>
    <rect x="416" y="128" width="150" height="24" rx="4" fill="#fff" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="491" y="144" fill="#446688">ans[0][1] = 2</text>
  </g>
  <g filter="url(#sk)" text-anchor="middle" font-size="10" fill="#33404f">
    <rect x="44" y="156" width="38" height="24" rx="4" fill="#eceff1" stroke="#aab2bd" stroke-width="1.1"/>
    <text x="63" y="172">2</text>
    <rect x="90" y="156" width="118" height="24" rx="4" fill="#f4f6f8" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="149" y="172">(0, 2)</text>
    <rect x="216" y="156" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="246" y="172" font-size="11" font-weight="bold">3</text>
    <rect x="284" y="156" width="124" height="24" rx="4" fill="#f4f6f8" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="346" y="172">(1, 0)</text>
    <rect x="416" y="156" width="150" height="24" rx="4" fill="#fff" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="491" y="172" fill="#4a7a3a">ans[1][0] = 3</text>
  </g>
  <g filter="url(#sk)" text-anchor="middle" font-size="10" fill="#33404f">
    <rect x="44" y="184" width="38" height="24" rx="4" fill="#eceff1" stroke="#aab2bd" stroke-width="1.1"/>
    <text x="63" y="200">3</text>
    <rect x="90" y="184" width="118" height="24" rx="4" fill="#f4f6f8" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="149" y="200">(1, 0)</text>
    <rect x="216" y="184" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="246" y="200" font-size="11" font-weight="bold">4</text>
    <rect x="284" y="184" width="124" height="24" rx="4" fill="#f4f6f8" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="346" y="200">(1, 1)</text>
    <rect x="416" y="184" width="150" height="24" rx="4" fill="#fff" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="491" y="200" fill="#4a7a3a">ans[1][1] = 4</text>
  </g>
  <g filter="url(#sk)" text-anchor="middle" font-size="10" fill="#33404f">
    <rect x="44" y="212" width="38" height="24" rx="4" fill="#eceff1" stroke="#aab2bd" stroke-width="1.1"/>
    <text x="63" y="228">4</text>
    <rect x="90" y="212" width="118" height="24" rx="4" fill="#f4f6f8" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="149" y="228">(1, 1)</text>
    <rect x="216" y="212" width="60" height="24" rx="4" fill="#fff8e1" stroke="#b8860b" stroke-width="1.4"/>
    <text x="246" y="228" font-size="11" font-weight="bold">5</text>
    <rect x="284" y="212" width="124" height="24" rx="4" fill="#f4f6f8" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="346" y="228">(2, 0)</text>
    <rect x="416" y="212" width="150" height="24" rx="4" fill="#fff" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="491" y="228" fill="#b8860b">ans[2][0] = 5</text>
  </g>
  <g filter="url(#sk)" text-anchor="middle" font-size="10" fill="#33404f">
    <rect x="44" y="240" width="38" height="24" rx="4" fill="#eceff1" stroke="#aab2bd" stroke-width="1.1"/>
    <text x="63" y="256">5</text>
    <rect x="90" y="240" width="118" height="24" rx="4" fill="#f4f6f8" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="149" y="256">(1, 2)</text>
    <rect x="216" y="240" width="60" height="24" rx="4" fill="#fff8e1" stroke="#b8860b" stroke-width="1.4"/>
    <text x="246" y="256" font-size="11" font-weight="bold">6</text>
    <rect x="284" y="240" width="124" height="24" rx="4" fill="#f4f6f8" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="346" y="256">(2, 1)</text>
    <rect x="416" y="240" width="150" height="24" rx="4" fill="#fff" stroke="#c5cad0" stroke-width="1.1"/>
    <text x="491" y="256" fill="#b8860b">ans[2][1] = 6</text>
  </g>

  <text x="320" y="290" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">注意 k = 2、3 这两个连续元素落到 ans 第 1 行：目标的一行由源第 0 行的末元素与第 1 行的首元素拼成</text>

  <text x="44" y="312" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">结果 ans（3 × 2）</text>
  <g filter="url(#sk)" text-anchor="middle" font-size="11.5" fill="#33404f">
    <rect x="44" y="320" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="66" y="339">1</text>
    <rect x="88" y="320" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="110" y="339">2</text>
    <rect x="44" y="348" width="44" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="66" y="367">3</text>
    <rect x="88" y="348" width="44" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="110" y="367">4</text>
    <rect x="44" y="376" width="44" height="28" rx="4" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
    <text x="66" y="395">5</text>
    <rect x="88" y="376" width="44" height="28" rx="4" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/>
    <text x="110" y="395">6</text>
  </g>

  <g filter="url(#sk)">
    <rect x="160" y="312" width="436" height="88" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="176" y="334" font-size="10.5" font-weight="bold" fill="#8a3a36">不可行分支（示例 2）：mat = [[1,2],[3,4]]，r = 2，c = 4</text>
    <text x="176" y="356" font-size="10" fill="#555">m·n = 2·2 = 4 ≠ 8 = 2·4 = r·c ⇒ 元素个数不守恒，reshape 无解</text>
    <text x="176" y="376" font-size="10" fill="#555">此时直接返回原矩阵 [[1,2],[3,4]]：不是空矩阵，也不补零到 2 × 4</text>
    <text x="176" y="394" font-size="9.5" fill="#8a3a36">判据只需一次乘法，必须在分配 ans 之前完成</text>
  </g>
</svg>
