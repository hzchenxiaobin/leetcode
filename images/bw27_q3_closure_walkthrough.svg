<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：链 0→1→2→3→4→5 的闭包逐步铺满</text>

  <!-- 阶段 0：只有直接边 -->
  <text x="60" y="62" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">初始（只标直接边）</text>
  <g filter="url(#rough2)">
    <circle cx="80"  cy="100" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="170" cy="100" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="260" cy="100" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="350" cy="100" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="440" cy="100" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <path d="M 99 100 L 147 100" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 189 100 L 237 100" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 279 100 L 327 100" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 369 100 L 417 100" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
  </g>
  <text y="105" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="80">0</tspan><tspan x="170">1</tspan><tspan x="260">2</tspan><tspan x="350">3</tspan><tspan x="440">4</tspan></text>
  <text x="510" y="105" font-size="11" fill="#888" filter="url(#rough2)">→5 略画同链</text>

  <!-- 阶段 1：k=1 中转 -->
  <text x="60" y="170" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">k=1 转完：新得 0→2</text>
  <path d="M 84 82 Q 170 36 266 84" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="175" y="48" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0→1→2</text>

  <!-- 阶段 2 -->
  <text x="60" y="225" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">k=2 转完：新得 0→3, 1→3</text>
  <path d="M 88 78 Q 215 20 342 80" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 178 80 Q 260 52 342 82" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 阶段 3 -->
  <text x="60" y="280" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">k=3,4,5 转完：上三角全 1</text>

  <!-- 结论 -->
  <rect x="55" y="292" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="72" y="312" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">查询 [0,5]：reach[0][5] = 1 → true；查询 [5,0]：reach[5][0] = 0 → false</text>
  <text x="72" y="330" font-size="11" fill="#555" filter="url(#rough2)">闭包把「间接先修」全部补齐，任何查询都只是一次数组读数</text>
</svg>
