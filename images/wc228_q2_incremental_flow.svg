<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="63" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="500" fill="#fdfcf7"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：一趟增量扫描（len 随同字符接续 +1，换字符重置 1）</text>
  <path d="M 180 40 Q 350 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <rect x="245" y="54" width="210" height="34" rx="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="350" y="76" text-anchor="middle" font-size="13" fill="#2e6e2e">初始化 ans = 0, len = 0</text>

  <path d="M 350 88 L 350 104" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 取字符 -->
  <g filter="url(#sk)">
    <rect x="235" y="106" width="230" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="350" y="129" text-anchor="middle" font-size="13" fill="#2b6e9e">取下一个字符 c = s[i]</text>

  <path d="M 350 142 L 350 158" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判定菱形 -->
  <g filter="url(#sk)">
    <polygon points="350,162 475,196 350,230 225,196" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="350" y="192" text-anchor="middle" font-size="12.5" fill="#a04348">i &gt; 0 且</text>
  <text x="350" y="210" text-anchor="middle" font-size="12.5" fill="#a04348">c == s[i−1] ?</text>

  <!-- 是 → 接续 -->
  <path d="M 475 196 L 513 196" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="494" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="516" y="178" width="150" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="591" y="201" text-anchor="middle" font-size="12.5" fill="#2e6e2e">len ← len + 1（接续）</text>

  <!-- 否 → 重置 -->
  <path d="M 225 196 L 187 196" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="206" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04348">否</text>
  <g filter="url(#sk)">
    <rect x="34" y="178" width="150" height="36" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="109" y="201" text-anchor="middle" font-size="12.5" fill="#7a5415">len ← 1（重置）</text>

  <!-- 汇合到累加 -->
  <path d="M 591 214 L 591 264 L 479 264" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 109 214 L 109 264 L 221 264" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="225" y="246" width="250" height="36" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="350" y="269" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">ans ← (ans + len) mod 1e9+7</text>

  <path d="M 350 282 L 350 300" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 是否扫完 -->
  <g filter="url(#sk)">
    <polygon points="350,304 455,336 350,368 245,336" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="350" y="341" text-anchor="middle" font-size="12" fill="#a04348">还有未处理的字符？</text>

  <!-- 循环回边 -->
  <path d="M 245 336 L 150 336 L 150 124 L 231 124" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="192" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- 否 → 返回 -->
  <path d="M 350 368 L 350 386" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="362" y="382" font-size="12" font-weight="bold" fill="#a04348">否</text>
  <g filter="url(#sk)">
    <rect x="290" y="388" width="120" height="34" rx="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="350" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 ans</text>

  <!-- 底部说明条 -->
  <g filter="url(#sk)">
    <rect x="30" y="436" width="640" height="54" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="350" y="458" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">len 的语义：以 s[i] 结尾的同质子串个数 = 当前游程已扫长度</text>
  <text x="350" y="478" text-anchor="middle" font-size="12" fill="#7a5415">游程内 len 依次取 1, 2, …, k，逐位累加恰为 k(k+1)/2 —— 与公式法等价，只是求和顺序不同</text>
</svg>
