<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">构造流程：定位第一个 0，数出总数 z</text>

  <!-- 输入串 -->
  <text x="280" y="60" font-size="14" fill="#888" text-anchor="middle" filter="url(#rough2)">binary = "1 1 0 0 0 1 1 0"（示例风格）</text>
  <g filter="url(#rough2)">
    <rect x="120" y="72" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="160" y="72" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="200" y="72" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="240" y="72" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="280" y="72" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="320" y="72" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="360" y="72" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="400" y="72" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <text x="140" y="98" fill="#2d5a22">1</text><text x="180" y="98" fill="#2d5a22">1</text>
    <text x="220" y="98" fill="#446688" font-weight="bold">0</text><text x="260" y="98" fill="#446688">0</text>
    <text x="300" y="98" fill="#446688">0</text><text x="340" y="98" fill="#2d5a22">1</text>
    <text x="380" y="98" fill="#2d5a22">1</text><text x="420" y="98" fill="#446688">0</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="220" y="126">p=2</text><text x="420" y="126">第 4 个 0</text>
  </g>
  <text x="280" y="146" font-size="13" fill="#446688" text-anchor="middle" filter="url(#rough2)">p = 2（第一个 0），z = 4（0 的总数）</text>

  <!-- 构造 -->
  <path d="M 280 156 L 280 178" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="60" y="182" width="440" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#7a5c1e" text-anchor="middle">
    <text x="280" y="202">答案 = '1' × (p+z−1) + '0' + '1' × (n−p−z)</text>
    <text x="280" y="222">= '1'×5 + '0' + '1'×2（0 放在下标 p+z−1 = 5）</text>
  </g>

  <!-- 输出串 -->
  <g filter="url(#rough2)">
    <rect x="120" y="244" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="160" y="244" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="200" y="244" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="240" y="244" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="280" y="244" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="320" y="244" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="360" y="244" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="400" y="244" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <text x="140" y="270" fill="#2d5a22">1</text><text x="180" y="270" fill="#2d5a22">1</text>
    <text x="220" y="270" fill="#2d5a22">1</text><text x="260" y="270" fill="#2d5a22">1</text>
    <text x="300" y="270" fill="#2d5a22">1</text><text x="340" y="270" fill="#b85450" font-weight="bold">0</text>
    <text x="380" y="270" fill="#2d5a22">1</text><text x="420" y="270" fill="#2d5a22">1</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="340" y="298">唯一的 0 尽量靠右</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="100" y="304" width="360" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="321" font-size="12" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">z ≤ 1 时直接返回原串：没有可合并的 0，操作只会变小</text>
</svg>
