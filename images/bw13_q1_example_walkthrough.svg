<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：23 与 107 的两次走查</text>

  <!-- 23 -->
  <text x="46" y="64" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">num = 23：m = 23 + 1 = 24</text>
  <g filter="url(#rough2)">
    <rect x="46"  y="78" width="66" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="112" y="78" width="66" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="178" y="78" width="66" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="244" y="78" width="66" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="310" y="78" width="66" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="79"  y="103">1</text><text x="145" y="103">1</text><text x="211" y="103">0</text>
    <text x="277" y="103">0</text><text x="343" y="103">0</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="79" y="132">最高位(丢弃)</text><text x="145" y="132">保留</text><text x="211" y="132">保留</text>
    <text x="277" y="132">保留</text><text x="343" y="132">保留</text>
  </g>
  <text x="400" y="103" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">→ "1000" ✓</text>

  <!-- 107 -->
  <text x="46" y="178" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">num = 107：m = 107 + 1 = 108</text>
  <g filter="url(#rough2)">
    <rect x="46"  y="192" width="54" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="100" y="192" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="154" y="192" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="208" y="192" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="262" y="192" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="316" y="192" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="370" y="192" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="73"  y="217">1</text><text x="127" y="217">1</text><text x="181" y="217">0</text>
    <text x="235" y="217">1</text><text x="289" y="217">1</text><text x="343" y="217">0</text>
    <text x="397" y="217">0</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="73" y="246">丢弃</text><text x="127" y="246">留</text><text x="181" y="246">留</text>
    <text x="235" y="246">留</text><text x="289" y="246">留</text><text x="343" y="246">留</text>
    <text x="397" y="246">留</text>
  </g>
  <text x="446" y="217" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">→ "101100" ✓</text>

  <!-- 边界提醒 -->
  <rect x="60" y="278" width="440" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">边界对照：num = 0 → m = 1，循环体不执行 → 空串 ""</text>
  <text x="280" y="330" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">num = 1 → m = 2 = (10)₂ → 去掉最高位 → "0"</text>
  <text x="280" y="356" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">注意低位先出：收集到的是 0,0,0,1，reverse 后才是 "1000"</text>
</svg>
