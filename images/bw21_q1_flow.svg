<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：双扫描循环，直到剩余计数归零</text>

  <!-- 流程节点 -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="150" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <text x="115" y="82" text-anchor="middle" font-size="13.5" fill="#2b4a6b" font-weight="bold" filter="url(#rough2)">统计 26 桶计数</text>
  <text x="115" y="99" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">remain = len(s)</text>

  <g filter="url(#rough2)">
    <rect x="40" y="150" width="150" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <text x="115" y="172" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">i = 0 … 25 升序取</text>
  <text x="115" y="189" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">cnt[i]&gt;0 则取走 1 个</text>

  <g filter="url(#rough2)">
    <rect x="40" y="240" width="150" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
  </g>
  <text x="115" y="262" text-anchor="middle" font-size="13.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">i = 25 … 0 降序取</text>
  <text x="115" y="279" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">cnt[i]&gt;0 则取走 1 个</text>

  <path d="M 115 108 L 115 146" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 115 198 L 115 236" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判菱形 -->
  <g filter="url(#rough2)">
    <polygon points="340,108 420,152 340,196 260,152" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <text x="340" y="147" text-anchor="middle" font-size="13.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">remain == 0 ?</text>
  <text x="340" y="164" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">（字符全部取完）</text>

  <path d="M 190 264 C 250 264, 270 210, 300 180" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="252" font-size="11.5" fill="#446688" filter="url(#rough2)">一轮结束</text>

  <path d="M 300 140 C 230 96, 210 84, 194 84" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="106" font-size="11.5" fill="#b85450" filter="url(#rough2)">否，回到升序</text>

  <!-- 输出 -->
  <g filter="url(#rough2)">
    <rect x="440" y="128" width="100" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="490" y="150" text-anchor="middle" font-size="13.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">返回结果</text>
  <text x="490" y="167" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">res</text>
  <path d="M 420 152 L 436 152" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="140" font-size="11.5" fill="#2d5a22" filter="url(#rough2)">是</text>

  <rect x="70" y="286" width="420" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="307" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">复杂度 O(26·|s|)：每个字符恰被取走一次，每轮扫描至多 52 步</text>
</svg>
