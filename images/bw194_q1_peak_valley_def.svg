<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">峰谷判定只看三元组（左, 中, 右）—— 示例 1</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums = [1,5,2,4,1,3,0]：峰 = 严格大于两侧 ▲，谷 = 严格小于两侧 ▼</text>

  <polyline points="90,262 152,110 214,224 276,148 338,262 400,186 462,300" fill="none" stroke="#aaaaaa" stroke-width="1.8" filter="url(#rough2)"/>

  <circle cx="90" cy="262" r="7" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <circle cx="152" cy="110" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="214" cy="224" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="276" cy="148" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="338" cy="262" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="400" cy="186" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="462" cy="300" r="7" fill="#eeeeee" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>

  <text x="152" y="90" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">▲</text>
  <text x="276" y="128" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">▲</text>
  <text x="400" y="166" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">▲</text>
  <text x="214" y="254" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">▼</text>
  <text x="338" y="292" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">▼</text>

  <text x="66" y="244" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">边界</text>
  <text x="486" y="288" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">边界</text>

  <text x="46" y="324" font-size="10.5" fill="#888" filter="url(#rough2)">下标</text>
  <text x="90" y="324" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="152" y="324" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="214" y="324" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="276" y="324" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="338" y="324" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="400" y="324" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="462" y="324" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6</text>

  <text x="46" y="342" font-size="10.5" fill="#888" filter="url(#rough2)">值</text>
  <text x="90" y="342" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="152" y="342" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="214" y="342" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="276" y="342" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="338" y="342" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="400" y="342" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="462" y="342" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">0</text>

  <rect x="40" y="352" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="370" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">峰：nums[i] &gt; 左 且 &gt; 右（严格）；谷：&lt; 左 且 &lt; 右；下标 0 与 n−1 永不判定</text>
  <text x="56" y="386" font-size="10.5" fill="#555" filter="url(#rough2)">本例峰值和 5+4+3=12，谷值和 2+1=3，答案 = 12 − 3 = 9</text>
</svg>
