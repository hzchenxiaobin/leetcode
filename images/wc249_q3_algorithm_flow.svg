<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：枚举 → 建图 → 逐列 DP → 求和</text>
  <path d="M 200 38 Q 320 46 440 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 步骤 1 ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="74" width="250" height="128" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)"><circle cx="72" cy="96" r="13" fill="#446688"/></g>
  <text x="72" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
  <text x="94" y="101" font-size="13" font-weight="bold" fill="#2b6e9e">DFS 枚举合法列</text>
  <text x="70" y="128" font-size="11" fill="#444">逐行选色，与上一行不同</text>
  <text x="70" y="150" font-size="11" fill="#444">收集全部「列内合法」的列状态</text>
  <text x="70" y="172" font-size="11" fill="#444">S = 3·2^(m−1) ≤ 48 个</text>
  <text x="70" y="194" font-size="10.5" font-weight="bold" fill="#7a5415">时间 O(S·m)</text>

  <!-- ===== 步骤 2 ===== -->
  <g filter="url(#sk)">
    <rect x="340" y="74" width="250" height="128" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)"><circle cx="362" cy="96" r="13" fill="#446688"/></g>
  <text x="362" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
  <text x="384" y="101" font-size="13" font-weight="bold" fill="#2b6e9e">建兼容邻接表</text>
  <text x="360" y="128" font-size="11" fill="#444">i 与 j 兼容 ⟺ m 行颜色全不同</text>
  <text x="360" y="150" font-size="11" fill="#444">adj[i] = i 的全部兼容邻居</text>
  <text x="360" y="172" font-size="11" fill="#444">无序边数 E = 3^m ≤ 243</text>
  <text x="360" y="194" font-size="10.5" font-weight="bold" fill="#7a5415">时间 O(S²·m)</text>

  <!-- ===== 步骤 3 ===== -->
  <g filter="url(#sk)">
    <rect x="50" y="272" width="250" height="128" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)"><circle cx="72" cy="294" r="13" fill="#4a7a3a"/></g>
  <text x="72" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
  <text x="94" y="299" font-size="13" font-weight="bold" fill="#2e6e2e">逐列 DP（滚动数组）</text>
  <text x="70" y="326" font-size="11" fill="#444">dp[j] ← Σ dp[i]（i ∈ adj[j]）</text>
  <text x="70" y="348" font-size="11" fill="#444">循环 n − 1 轮，逐项取模</text>
  <text x="70" y="370" font-size="11" fill="#444">只保留上一列，空间 O(S)</text>
  <text x="70" y="392" font-size="10.5" font-weight="bold" fill="#7a5415">时间 O(n·E)</text>

  <!-- ===== 步骤 4 ===== -->
  <g filter="url(#sk)">
    <rect x="340" y="272" width="250" height="128" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)"><circle cx="362" cy="294" r="13" fill="#4a7a3a"/></g>
  <text x="362" y="299" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
  <text x="384" y="299" font-size="13" font-weight="bold" fill="#2e6e2e">求和返回</text>
  <text x="360" y="326" font-size="11" fill="#444">ans = (Σ dp[j]) mod (10^9+7)</text>
  <text x="360" y="348" font-size="11" fill="#444">n = 1 时无转移，直接 Σ 1 = S</text>
  <text x="360" y="370" font-size="11" fill="#444">答案最大模值 &lt; 10^9 + 7</text>
  <text x="360" y="392" font-size="10.5" font-weight="bold" fill="#7a5415">时间 O(S)</text>

  <!-- 箭头 1→2 -->
  <path d="M 302 138 L 336 138" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <!-- 箭头 2→3（折线） -->
  <path d="M 465 204 L 465 238 L 175 238 L 175 268" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <!-- 箭头 3→4 -->
  <path d="M 302 336 L 336 336" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>

  <!-- 底部备注 -->
  <g filter="url(#sk)">
    <rect x="50" y="416" width="540" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="434" text-anchor="middle" font-size="11" fill="#444">总时间 O(S²·(m + n))：m = 5、n = 1000 时约 2.3 × 10⁶ 次运算，远低于时限</text>
  <text x="320" y="451" text-anchor="middle" font-size="11" fill="#444">C++ 用 long long，每轮取模；DP 实际只扫邻接边，约 n·2E ≈ 4.9 × 10⁵ 次加法</text>
</svg>
