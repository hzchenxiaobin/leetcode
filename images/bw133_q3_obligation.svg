<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">后缀翻转的覆盖范围是三角形</text>

  <rect x="106" y="52" width="52" height="248" fill="#fce4ec" opacity="0.55" filter="url(#rough2)"/>
  <text x="132" y="48" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">位置 0</text>

  <rect x="84" y="86" width="0" height="0" fill="none"/>
  <path d="M 132 62 L 132 286" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>

  <!-- 每条横条 = 一次「起点为 i」的操作所覆盖的区间 -->
  <rect x="110" y="104" width="252" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="116" y="117" font-size="10" fill="#2b4a66" filter="url(#rough2)">i = 0</text>

  <rect x="162" y="138" width="200" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="151" font-size="10" fill="#2b4a66" filter="url(#rough2)">i = 1</text>

  <rect x="214" y="172" width="148" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="185" font-size="10" fill="#2b4a66" filter="url(#rough2)">i = 2</text>

  <rect x="266" y="206" width="96" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272" y="219" font-size="10" fill="#2b4a66" filter="url(#rough2)">i = 3</text>

  <rect x="318" y="240" width="44" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="253" font-size="10" fill="#2b4a66" filter="url(#rough2)">i = 4</text>

  <text x="378" y="117" font-size="10" fill="#888" filter="url(#rough2)">覆盖 0..4</text>
  <text x="378" y="151" font-size="10" fill="#888" filter="url(#rough2)">覆盖 1..4</text>
  <text x="378" y="185" font-size="10" fill="#888" filter="url(#rough2)">覆盖 2..4</text>
  <text x="378" y="219" font-size="10" fill="#888" filter="url(#rough2)">覆盖 3..4</text>
  <text x="378" y="253" font-size="10" fill="#888" filter="url(#rough2)">覆盖 4..4</text>

  <text x="260" y="298" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">位置 i 只落在起点 0..i 的操作里，起点 &gt; i 的操作碰不到它</text>
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">⇒ 处理到 i 时，前面的位置已成定局，只需决定「i 这一刀翻不翻」</text>
</svg>
