<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fafafa"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">数据结构：26 个「字母桶栈」—— 字母入桶，星号弹最小非空桶</text>
  <path d="M 250 42 Q 470 50 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="60" y="64" width="390" height="78" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="255" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">遇到字母 x → 下标 i 压入 stack[x]</text>
  <text x="255" y="118" text-anchor="middle" font-size="10.5" fill="#888">O(1) 入桶；同一桶内下标严格递增</text>

  <g filter="url(#sk)"><rect x="490" y="64" width="390" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="685" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a8781e">遇到 '*' → 找最小的非空桶，弹栈顶并标记删除</text>
  <text x="685" y="118" text-anchor="middle" font-size="10.5" fill="#888">从 'a' 到 'z' 顺序探测，至多 26 步</text>

  <text x="470" y="176" text-anchor="middle" font-size="12.5" fill="#555">快照：扫描完前缀 "cbca"、即将处理第一个 * 时</text>

  <g filter="url(#sk)"><rect x="178" y="410" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="210" y="433" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">3</text>

  <g filter="url(#sk)"><rect x="358" y="410" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="390" y="433" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">1</text>

  <g filter="url(#sk)"><rect x="538" y="410" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="570" y="433" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">0</text>
  <g filter="url(#sk)"><rect x="538" y="372" width="64" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="570" y="395" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e">2</text>

  <text x="690" y="408" text-anchor="middle" font-size="26" fill="#999">⋮</text>
  <text x="690" y="436" text-anchor="middle" font-size="10.5" fill="#999">共 26 桶</text>

  <g filter="url(#sk)"><rect x="768" y="410" width="64" height="34" rx="4" fill="none" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/></g>
  <text x="800" y="433" text-anchor="middle" font-size="11" fill="#aaa">空</text>

  <g filter="url(#sk)"><path d="M 150 448 L 850 448" stroke="#8aa" stroke-width="2"/></g>

  <text x="210" y="478" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">stack[a]</text>
  <text x="390" y="478" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">stack[b]</text>
  <text x="570" y="478" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">stack[c]</text>
  <text x="800" y="478" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">stack[z]</text>

  <path d="M 668 352 L 578 378" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="676" y="344" font-size="12.5" font-weight="bold" fill="#b85450">栈顶 = 该字母当前最右存活出现</text>
  <text x="676" y="362" font-size="10.5" fill="#b85450">弹栈顶即「删最右出现」</text>

  <g filter="url(#sk)"><rect x="90" y="515" width="760" height="100" rx="10" fill="#eef4fb" stroke="#446688" stroke-width="1.5"/></g>
  <text x="470" y="550" text-anchor="middle" font-size="12.5" fill="#2b4a6e">① 栈里只有已扫过的下标（&lt; 当前位置）→ 天然满足「只删星号左侧的字符」</text>
  <text x="470" y="586" text-anchor="middle" font-size="12.5" fill="#2b4a6e">② 弹最小非空桶的栈顶 = 删最小字母的最右存活出现 → 恰是贪心策略本身</text>
</svg>
