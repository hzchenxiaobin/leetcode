<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="580" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：k=4 的成与败 —— 看配对是否被已有边占用</text>
  <path d="M 200 42 Q 470 50 740 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left panel: example 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="435" height="424" rx="10" fill="#f6f9fc" stroke="#8fa8c0" stroke-width="1.5"/>
  </g>
  <text x="258" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66" filter="url(#sk)">示例 2：n = 4，edges = [[1,2],[3,4]]</text>

  <path d="M 162 172 L 328 172" stroke="#555" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="245" y="160" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">已有</text>
  <path d="M 162 348 L 328 348" stroke="#555" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="245" y="336" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">已有</text>

  <path d="M 140 192 L 140 328" stroke="#4a8e4a" stroke-width="2.2" stroke-dasharray="7,5" fill="none" filter="url(#sk)"/>
  <text x="62" y="264" font-size="10" fill="#2e6e2e" filter="url(#sk)">新加 (1,3)</text>
  <path d="M 350 192 L 350 328" stroke="#4a8e4a" stroke-width="2.2" stroke-dasharray="7,5" fill="none" filter="url(#sk)"/>
  <text x="392" y="264" font-size="10" fill="#2e6e2e" filter="url(#sk)">新加 (2,4)</text>

  <g filter="url(#sk)">
    <circle cx="140" cy="172" r="20" fill="#fdeaea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="140" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#sk)">1</text>
  <text x="140" y="142" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">deg 1 · 奇</text>

  <g filter="url(#sk)">
    <circle cx="350" cy="172" r="20" fill="#fdeaea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="350" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#sk)">2</text>
  <text x="350" y="142" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">deg 1 · 奇</text>

  <g filter="url(#sk)">
    <circle cx="140" cy="348" r="20" fill="#fdeaea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="140" y="353" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#sk)">3</text>
  <text x="140" y="382" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">deg 1 · 奇</text>

  <g filter="url(#sk)">
    <circle cx="350" cy="348" r="20" fill="#fdeaea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="350" y="353" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#sk)">4</text>
  <text x="350" y="382" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">deg 1 · 奇</text>

  <text x="258" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">配对 (1,3)+(2,4)：两条均为非边 ✓</text>
  <text x="258" y="454" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">四点度数 1,1,1,1 → 2,2,2,2，全偶</text>
  <text x="258" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">→ true</text>

  <!-- right panel: example 3 -->
  <g filter="url(#sk)">
    <rect x="505" y="64" width="435" height="424" rx="10" fill="#f6f9fc" stroke="#8fa8c0" stroke-width="1.5"/>
  </g>
  <text x="722" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a66" filter="url(#sk)">示例 3：n = 4，edges = [[1,2],[1,3],[1,4]]（星形）</text>

  <path d="M 700 176 L 600 324" stroke="#555" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 715 182 L 715 318" stroke="#555" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 730 176 L 830 324" stroke="#555" stroke-width="1.8" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <circle cx="715" cy="160" r="20" fill="#fdeaea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="715" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#sk)">1</text>
  <text x="715" y="130" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">deg 3 · 奇（星心）</text>

  <g filter="url(#sk)">
    <circle cx="585" cy="340" r="20" fill="#fdeaea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="585" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#sk)">2</text>
  <text x="585" y="372" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">deg 1 · 奇</text>

  <g filter="url(#sk)">
    <circle cx="715" cy="340" r="20" fill="#fdeaea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="715" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#sk)">3</text>
  <text x="715" y="372" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">deg 1 · 奇</text>

  <g filter="url(#sk)">
    <circle cx="845" cy="340" r="20" fill="#fdeaea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="845" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#sk)">4</text>
  <text x="845" y="372" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">deg 1 · 奇</text>

  <text x="722" y="396" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">星心 1 与人人相邻，含 1 的配对必被占用</text>
  <text x="722" y="418" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">(1,2)+(3,4)：边 (1,2) 已存在 ✗</text>
  <text x="722" y="436" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">(1,3)+(2,4)：边 (1,3) 已存在 ✗</text>
  <text x="722" y="454" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">(1,4)+(2,3)：边 (1,4) 已存在 ✗</text>
  <text x="722" y="478" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">三种配对全被占用 → false</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="504" width="880" height="56" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="480" y="526" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">关键：k=4 时两条新边必须不重不漏地覆盖 4 个奇点（完美匹配），只有 3 种配对；</text>
  <text x="480" y="548" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">每种配对的两条边都必须是原图非边 —— 含已有边的配对直接淘汰，三种全查才不漏解</text>
</svg>
