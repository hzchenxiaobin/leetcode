<svg xmlns="http://www.w3.org/2000/svg" width="680" height="444" viewBox="0 0 680 444" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="444" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：除数配对 → 奇数个是完全平方 → 恰好 3 是质数平方</text>
  <path d="M 160 40 Q 340 50 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row 1: n = 12 -->
  <text x="112" y="88" text-anchor="end" font-size="13" fill="#333">n = 12</text>
  <path d="M 138 66 Q 258 36 378 66" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 186 66 Q 258 48 330 66" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 234 66 Q 258 58 282 66" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="120" y="68" width="36" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="138" y="88" text-anchor="middle" font-size="13" fill="#333">1</text>
  <g filter="url(#sk)"><rect x="168" y="68" width="36" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="186" y="88" text-anchor="middle" font-size="13" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="216" y="68" width="36" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="234" y="88" text-anchor="middle" font-size="13" fill="#333">3</text>
  <g filter="url(#sk)"><rect x="264" y="68" width="36" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="282" y="88" text-anchor="middle" font-size="13" fill="#333">4</text>
  <g filter="url(#sk)"><rect x="312" y="68" width="36" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="330" y="88" text-anchor="middle" font-size="13" fill="#333">6</text>
  <g filter="url(#sk)"><rect x="360" y="68" width="36" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="378" y="88" text-anchor="middle" font-size="13" fill="#333">12</text>
  <text x="258" y="116" text-anchor="middle" font-size="11" fill="#b85450">3 对 → 6 个（偶数）· 非完全平方 → false</text>

  <!-- Row 2: n = 16 -->
  <text x="112" y="188" text-anchor="end" font-size="13" fill="#333">n = 16</text>
  <path d="M 138 166 Q 258 122 378 166" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 186 166 Q 258 138 330 166" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 246 167 Q 258 150 270 167" stroke="#d6a040" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="120" y="168" width="36" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="138" y="188" text-anchor="middle" font-size="13" fill="#333">1</text>
  <g filter="url(#sk)"><rect x="168" y="168" width="36" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="186" y="188" text-anchor="middle" font-size="13" fill="#333">2</text>
  <g filter="url(#sk)"><rect x="240" y="168" width="36" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="258" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">4</text>
  <g filter="url(#sk)"><rect x="312" y="168" width="36" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="330" y="188" text-anchor="middle" font-size="13" fill="#333">8</text>
  <g filter="url(#sk)"><rect x="360" y="168" width="36" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="378" y="188" text-anchor="middle" font-size="13" fill="#333">16</text>
  <text x="258" y="216" text-anchor="middle" font-size="11" fill="#b85450">2 对 + 自配对 → 5 个（奇）· 但 √16 = 4 合数 → false</text>

  <!-- Row 3: n = 9 -->
  <text x="112" y="288" text-anchor="end" font-size="13" fill="#333">n = 9</text>
  <path d="M 138 266 Q 258 226 378 266" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 246 267 Q 258 250 270 267" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="120" y="268" width="36" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="138" y="288" text-anchor="middle" font-size="13" fill="#333">1</text>
  <g filter="url(#sk)"><rect x="240" y="268" width="36" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="258" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25">3</text>
  <g filter="url(#sk)"><rect x="360" y="268" width="36" height="30" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6"/></g>
  <text x="378" y="288" text-anchor="middle" font-size="13" fill="#333">9</text>
  <text x="258" y="316" text-anchor="middle" font-size="11" fill="#2f5d25">1 对 + 自配对 → 恰 3 个 · √9 = 3 是质数 → true</text>

  <!-- Card A -->
  <g filter="url(#sk)"><rect x="456" y="54" width="208" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="560" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">奇数个 ⟺ 完全平方</text>
  <text x="560" y="102" text-anchor="middle" font-size="11" fill="#5c4512">除数 d ↔ n/d 两两配对</text>
  <text x="560" y="122" text-anchor="middle" font-size="11" fill="#5c4512">仅 d = n/d 时合并（d² = n）</text>
  <text x="560" y="142" text-anchor="middle" font-size="11" fill="#5c4512">个数 = 2×对数 + (0 或 1)</text>
  <text x="560" y="162" text-anchor="middle" font-size="11" fill="#5c4512">奇 ⟺ 有自配对 √n</text>
  <text x="560" y="186" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">⟺ n 是完全平方数</text>

  <!-- Card B -->
  <g filter="url(#sk)"><rect x="456" y="216" width="208" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="560" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25">恰好 3 ⟺ 根是质数</text>
  <text x="560" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a">n = k² 已含 {1, k, k²}</text>
  <text x="560" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a">k 合数 ⟹ 多出第 4 个除数</text>
  <text x="560" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a">k 质数 ⟹ 恰好这三个</text>
  <text x="560" y="328" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5d25">⟹ n = p²（p 质数）</text>
  <text x="560" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a">如 4, 9, 25, 49, 121, …</text>

  <!-- Bottom banner -->
  <g filter="url(#sk)"><rect x="36" y="380" width="608" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="340" y="404" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2c4a6e">结论：d(n) = 3 ⟺ n = p²（p 为质数）</text>
  <text x="340" y="424" text-anchor="middle" font-size="11" fill="#446688">1…10⁴ 中只有 25 个这样的数：4, 9, 25, 49, …, 9409（p ≤ 97）</text>
</svg>
