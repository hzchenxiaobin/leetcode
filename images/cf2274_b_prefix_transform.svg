<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr1" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">关键一步：把「改写 a_i」翻译成「前缀和的三种走向」</text>
  <path d="M 128 42 Q 380 49 632 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 左侧：当前前缀和 -->
  <rect x="40" y="70" width="248" height="66" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="164" y="96" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">处理第 i 位之前</text>
  <text x="164" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">S = P_{i−1} = a_1 + … + a_{i−1}</text>

  <!-- 三条箭头 -->
  <path d="M 292 100 Q 320 96 344 94" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr1)" filter="url(#rough2)"/>
  <path d="M 292 103 Q 320 170 344 174" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr1)" filter="url(#rough2)"/>
  <path d="M 292 106 Q 320 246 344 254" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr1)" filter="url(#rough2)"/>

  <!-- 三个选择 -->
  <rect x="350" y="66" width="370" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="366" y="90" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">取 a_i − S   ⇒   新前缀 P_i = a_i</text>
  <text x="366" y="111" font-size="11.5" fill="#66788c" filter="url(#rough2)">把这一位「洗掉」，前缀被重置</text>

  <rect x="350" y="146" width="370" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="366" y="170" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">取 a_i       ⇒   新前缀 P_i = a_i + S</text>
  <text x="366" y="191" font-size="11.5" fill="#66788c" filter="url(#rough2)">这一位原地不动，前缀照常累加</text>

  <rect x="350" y="226" width="370" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="366" y="250" font-size="12.5" fill="#8e3b37" filter="url(#rough2)">取 a_i + S  ⇒   新前缀 P_i = a_i + 2·S</text>
  <text x="366" y="271" font-size="11.5" fill="#66788c" filter="url(#rough2)">前缀跟着 S 一起放大，绝对值越滚越大</text>

  <!-- 结论 -->
  <rect x="40" y="304" width="680" height="104" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="331" font-size="13" fill="#333" filter="url(#rough2)">第 i 位的最终值只能是 a_i − S、a_i、a_i + S 三者之一 ⇒ 给定 S 时最大为 a_i + |S|</text>
  <text x="56" y="358" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">三种新前缀都是 S 的一次函数（斜率 0 / 1 / 2，全都单调递增）</text>
  <text x="56" y="385" font-size="12" fill="#446688" filter="url(#rough2)">⇒ 可达集合的最大值只由「旧集合的最大值」决定，最小值同理，两个端点各自独立递推</text>

</svg>
