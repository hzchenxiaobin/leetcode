<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：单趟求最小值 → 数位求和 → 判奇偶</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只有最小元素决定答案，其余元素都只是"陪跑"</text>

  <g filter="url(#rough2)">
    <rect x="60" y="58" width="52" height="36" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="114" y="58" width="52" height="36" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="168" y="58" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="222" y="58" width="52" height="36" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="276" y="58" width="52" height="36" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="330" y="58" width="52" height="36" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="384" y="58" width="52" height="36" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="438" y="58" width="52" height="36" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="86" y="81" fill="#333">34</text>
    <text x="140" y="81" fill="#333">23</text>
    <text x="194" y="81" fill="#2a5a20">1</text>
    <text x="248" y="81" fill="#333">24</text>
    <text x="302" y="81" fill="#333">75</text>
    <text x="356" y="81" fill="#333">33</text>
    <text x="410" y="81" fill="#333">54</text>
    <text x="464" y="81" fill="#333">8</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#888">
    <text x="86" y="108">i=0</text>
    <text x="140" y="108">i=1</text>
    <text x="194" y="108">i=2</text>
    <text x="248" y="108">i=3</text>
    <text x="302" y="108">i=4</text>
    <text x="356" y="108">i=5</text>
    <text x="410" y="108">i=6</text>
    <text x="464" y="108">i=7</text>
  </g>

  <text x="280" y="126" text-anchor="middle" font-size="11" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">一趟扫描取最小元素 mn = 1（绿色格）</text>

  <rect x="50" y="156" width="150" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="125" y="178" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 单趟扫描求最小值</text>
  <text x="125" y="194" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">mn = min(nums)，O(n)</text>

  <path d="M 204 180 L 244 180" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="250" y="156" width="150" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="325" y="172" text-anchor="middle" font-size="11.5" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">② 对 mn 分解数位求和 S</text>
  <text x="325" y="188" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">while (mn &gt; 0) { S += mn % 10;</text>
  <text x="325" y="200" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">mn /= 10; }</text>

  <path d="M 404 180 L 438 180" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="510,150 556,180 510,210 464,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="510" y="184" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">S 为偶数?</text>

  <path d="M 496 212 L 452 252" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="238" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="396" y="256" width="108" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="280" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 0</text>

  <path d="M 524 212 L 528 252" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="540" y="238" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="516" y="256" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="535" y="280" text-anchor="middle" font-size="12" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="50" y="256" width="330" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="215" y="280" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">演算</text>
  <text x="215" y="300" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">示例 1：mn = 1 → S = 1（奇）→ 返回 0</text>
  <text x="215" y="318" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">示例 2：mn = 33 → S = 3 + 3 = 6（偶）→ 返回 1</text>
  <text x="215" y="342" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">⚠ 返回值语义：偶 → 1，奇 → 0，别写反！</text>
  <text x="215" y="366" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">数组里除最小值外的元素全都不用分解数位</text>
</svg>
