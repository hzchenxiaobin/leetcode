<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">位数与 N 相同时：按「第一个不同的前缀位」分类</text>
  <text x="60" y="62" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">N 的数码</text>
  <rect x="150" y="46" width="54" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177.0" y="72.0" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <rect x="212" y="46" width="54" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="239.0" y="72.0" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="274" y="46" width="54" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="301.0" y="72.0" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="336" y="46" width="54" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363.0" y="72.0" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="60" y="128" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">候选前缀</text>
  <rect x="150" y="112" width="54" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="177.0" y="138.0" text-anchor="middle" font-size="15" fill="#7a5a10" filter="url(#rough2)">3</text>
  <rect x="212" y="112" width="54" height="40" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="239.0" y="138.0" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">?</text>
  <rect x="274" y="112" width="54" height="40" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="301.0" y="138.0" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">?</text>
  <rect x="336" y="112" width="54" height="40" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="363.0" y="138.0" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">?</text>
  <path d="M177,112 L177,92" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="210" y="100" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">第 0 位就取更小的数字 → 后面 p−1 位全部自由</text>
  <rect x="60" y="168" width="440" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">贡献 = 该位可取的更小合法数字个数 × (limit+1)^(剩余自由位数)</text>
  <rect x="60" y="226" width="440" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="251" text-anchor="middle" font-size="11" fill="#1c3a1c" filter="url(#rough2)">累加后再检查「前缀与 N 完全相同」这一支：直接比字符串 s ≤ N 的后缀</text>
  <text x="280" y="288" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">若某位 N 的数码本身 > limit，说明这一支不可延续，立即返回已累计的答案</text>
  <text x="280" y="314" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">这正是数位 DP 的「tight 标记」在本题的闭式写法</text>
</svg>
