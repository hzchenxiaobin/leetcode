<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="450" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0..15 按 popcount 奇偶劈成两半：3 的倍数全在偶权一侧</text>
  <path d="M 110 46 Q 380 54 652 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380" y="66" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">每次操作异或的 3k 都是偶权 ⇒ popcount 奇偶性永远不变，元素只能在同侧蹦跶</text>

  <text x="34" y="94" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">偶权一侧 G（popcount 为偶数，8 个）</text>
  <rect x="40" y="104" width="72" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="126" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <text x="76" y="144" text-anchor="middle" font-size="9.5" fill="#5d6b58" filter="url(#rough2)">0000</text>
  <rect x="120" y="104" width="72" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="156" y="126" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="156" y="144" text-anchor="middle" font-size="9.5" fill="#5d6b58" filter="url(#rough2)">0011</text>
  <rect x="200" y="104" width="72" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="236" y="126" text-anchor="middle" font-size="15" fill="#8a6a1f" filter="url(#rough2)">5</text>
  <text x="236" y="144" text-anchor="middle" font-size="9.5" fill="#8a6a1f" filter="url(#rough2)">0101</text>
  <rect x="280" y="104" width="72" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="126" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">6</text>
  <text x="316" y="144" text-anchor="middle" font-size="9.5" fill="#5d6b58" filter="url(#rough2)">0110</text>
  <rect x="360" y="104" width="72" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396" y="126" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">9</text>
  <text x="396" y="144" text-anchor="middle" font-size="9.5" fill="#5d6b58" filter="url(#rough2)">1001</text>
  <rect x="440" y="104" width="72" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="476" y="126" text-anchor="middle" font-size="14" fill="#8a6a1f" filter="url(#rough2)">10</text>
  <text x="476" y="144" text-anchor="middle" font-size="9.5" fill="#8a6a1f" filter="url(#rough2)">1010</text>
  <rect x="520" y="104" width="72" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="556" y="126" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">12</text>
  <text x="556" y="144" text-anchor="middle" font-size="9.5" fill="#5d6b58" filter="url(#rough2)">1100</text>
  <rect x="600" y="104" width="72" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="636" y="126" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">15</text>
  <text x="636" y="144" text-anchor="middle" font-size="9.5" fill="#5d6b58" filter="url(#rough2)">1111</text>

  <text x="34" y="192" font-size="13" font-weight="bold" fill="#8d3a36" filter="url(#rough2)">奇权一侧（popcount 为奇数，8 个）—— 一个 3 的倍数都没有</text>
  <rect x="40" y="202" width="72" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="230" text-anchor="middle" font-size="15" fill="#8d3a36" filter="url(#rough2)">1</text>
  <rect x="120" y="202" width="72" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="156" y="230" text-anchor="middle" font-size="15" fill="#8d3a36" filter="url(#rough2)">2</text>
  <rect x="200" y="202" width="72" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="236" y="230" text-anchor="middle" font-size="15" fill="#8d3a36" filter="url(#rough2)">4</text>
  <rect x="280" y="202" width="72" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="230" text-anchor="middle" font-size="15" fill="#8d3a36" filter="url(#rough2)">7</text>
  <rect x="360" y="202" width="72" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396" y="230" text-anchor="middle" font-size="15" fill="#8d3a36" filter="url(#rough2)">8</text>
  <rect x="440" y="202" width="72" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="476" y="230" text-anchor="middle" font-size="14" fill="#8d3a36" filter="url(#rough2)">11</text>
  <rect x="520" y="202" width="72" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="556" y="230" text-anchor="middle" font-size="14" fill="#8d3a36" filter="url(#rough2)">13</text>
  <rect x="600" y="202" width="72" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="636" y="230" text-anchor="middle" font-size="14" fill="#8d3a36" filter="url(#rough2)">14</text>

  <text x="380" y="270" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">绿 = 3 的倍数（0,3,6,9,12,15 恰好全在偶权侧）；橙 = 偶权但不是 3 的倍数，只有 5 和 10</text>

  <rect x="30" y="288" width="700" height="146" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="314" font-size="13" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">三句话把题目拆干净</text>
  <text x="52" y="340" font-size="12.5" fill="#333" filter="url(#rough2)">a_i 奇权 ⇒ a′_i 永远奇权，而 0..15 的 3 的倍数全是偶权 ⇒ 该位置注定不是 All-Meat</text>
  <text x="52" y="366" font-size="12.5" fill="#333" filter="url(#rough2)">a_i 偶权 ⇒ a′_i = a_i ⊕ gap，gap 跑遍 G，好坏只取决于 gap 是否落在 {a_i⊕5, a_i⊕10}</text>
  <text x="52" y="392" font-size="12.5" fill="#333" filter="url(#rough2)">每个偶权位置只有 2 个坏 gap（8 选 2）⇒ 稍加贪心就能让它们同时变好</text>
  <text x="52" y="420" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ 答案 = #{i : popcount(a_i) 是偶数}，与 q 次询问无关，每次 O(1)</text>
</svg>
