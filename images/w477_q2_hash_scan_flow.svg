<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">一趟扫描：哈希表只记每个状态对的「首航」</text>

  <rect x="60" y="38" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="170" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">first[(0,0)] = −1；px = p = 0</text>
  <text x="316" y="56" font-size="10" fill="#b85450" filter="url(#rough2)">空前缀也占座</text>
  <text x="316" y="72" font-size="10" fill="#b85450" filter="url(#rough2)">漏了会砍掉前缀型答案</text>

  <path d="M170 76 L170 96" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="170,98 240,134 170,170 100,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="139" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有元素吗？</text>

  <path d="M240 134 L318 134 L318 92 L352 92" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="126" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="356" y="70" width="140" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="426" y="90" text-anchor="middle" font-size="12.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <text x="426" y="107" text-anchor="middle" font-size="10" fill="#8a6a30" filter="url(#rough2)">无命中则 ans = 0</text>

  <path d="M170 170 L170 190" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="182" y="184" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="60" y="192" width="220" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="170" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">px ← px ⊕ nums[i]</text>
  <text x="170" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">p ← p + (奇 ? +1 : −1)</text>

  <path d="M170 240 L170 260" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="170,262 252,300 170,338 88,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="296" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">状态 (px, p)</text>
  <text x="170" y="313" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">在表里吗？</text>

  <path d="M252 300 L316 300" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="284" y="292" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">见过</text>

  <rect x="320" y="278" width="176" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="408" y="297" text-anchor="middle" font-size="11.5" fill="#8a3a34" filter="url(#rough2)">ans ← max(ans, i − j)</text>
  <text x="408" y="314" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#rough2)">只查不写，首航位置不动</text>

  <path d="M170 338 L170 358" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="182" y="352" font-size="11" fill="#446688" filter="url(#rough2)">没见过</text>

  <rect x="60" y="360" width="220" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="170" y="386" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">first[(px, p)] ← i（记首航）</text>

  <path d="M408 322 L408 412 L34 412 L34 134 L96 134" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M280 381 L318 381 L318 412" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text transform="rotate(-90 26 280)" x="26" y="280" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">取下一个元素，继续扫</text>
</svg>
