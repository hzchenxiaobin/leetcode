<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">下标按核分桶：桶内两两相容，桶间互不相容（n = 12）</text>

  <text x="32" y="41" font-size="10" fill="#999" filter="url(#rough2)">下标 i →</text>

  <!-- index strip 1..12 -->
  <rect x="32" y="46" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="49" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="70" y="46" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="87" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <rect x="108" y="46" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <rect x="146" y="46" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <rect x="184" y="46" width="34" height="30" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <rect x="222" y="46" width="34" height="30" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="239" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <rect x="260" y="46" width="34" height="30" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="277" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <rect x="298" y="46" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>
  <rect x="336" y="46" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="353" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">9</text>
  <rect x="374" y="46" width="34" height="30" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="391" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">10</text>
  <rect x="412" y="46" width="34" height="30" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="429" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">11</text>
  <rect x="450" y="46" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">12</text>

  <!-- kernel labels -->
  <text x="49" y="92" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="87" y="92" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="125" y="92" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="163" y="92" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="201" y="92" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">5</text>
  <text x="239" y="92" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">6</text>
  <text x="277" y="92" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">7</text>
  <text x="315" y="92" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="353" y="92" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="391" y="92" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">10</text>
  <text x="429" y="92" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">11</text>
  <text x="467" y="92" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <text x="260" y="110" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">每个下标下方标出它的核 P(i)，同色 = 同核 = 同一个桶</text>

  <!-- bucket 1 -->
  <rect x="28" y="124" width="150" height="90" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="103" y="144" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">核 k = 1</text>
  <rect x="48" y="154" width="30" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="63" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="88" y="154" width="30" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <rect x="128" y="154" width="30" height="26" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">9</text>
  <text x="103" y="203" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">4 × 9 = 36 = 6² ✓</text>

  <!-- bucket 2 -->
  <rect x="192" y="124" width="140" height="90" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="262" y="144" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">核 k = 2</text>
  <rect x="212" y="154" width="30" height="26" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <rect x="252" y="154" width="30" height="26" rx="4" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="267" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>
  <text x="262" y="203" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">2 × 8 = 16 = 4² ✓</text>

  <!-- bucket 3 -->
  <rect x="346" y="124" width="146" height="90" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="419" y="144" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">核 k = 3</text>
  <rect x="366" y="154" width="30" height="26" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="381" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <rect x="406" y="154" width="34" height="26" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="423" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">12</text>
  <text x="419" y="203" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3 × 12 = 36 = 6² ✓</text>

  <!-- singleton bar -->
  <rect x="28" y="224" width="464" height="32" rx="8" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="245" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">核 5、6、7、10、11 各自成单元素桶 —— 任选单个下标也天然合法</text>

  <!-- insight box -->
  <rect x="28" y="272" width="464" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">核 k 的桶 = { k·1², k·2², k·3², … } = { k·m² ≤ n }</text>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">完全子集 ⟺ 某个桶的子集；nums[i] 全为正 ⇒ 最优解 = 整桶全拿</text>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">问题从 2ⁿ 个子集的搜索，坍缩成 ≤ n 个桶的求 max</text>

  <text x="260" y="368" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">异桶相乘：必有某质数只在一个核里出现，指数为奇 → 不是平方数</text>
</svg>
