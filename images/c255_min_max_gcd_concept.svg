<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="320" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察:答案只由最小值与最大值决定</text>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">其余元素全部与答案无关 —— 无需排序,一遍线性扫描就够</text>

  <!-- nums 数组 -->
  <rect x="202" y="90" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="224" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="250" y="90" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="298" y="90" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="346" y="90" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="394" y="90" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="416" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>

  <!-- min / max 指出箭头 -->
  <path d="M 224 128 L 224 150" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 416 128 L 416 150" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="224" y="166" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">min = 2</text>
  <text x="416" y="166" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6420" filter="url(#rough2)">max = 10</text>

  <!-- 汇聚到 gcd -->
  <path d="M 224 174 C 224 198, 248 200, 264 207" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 416 174 C 416 198, 392 200, 376 207" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="250" y="196" width="140" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">gcd(2, 10)</text>
  <path d="M 392 215 L 442 215" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="448" y="196" width="72" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="484" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- 底部说明 -->
  <rect x="60" y="252" width="520" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="274" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">求 mn / mx:一遍线性扫描 O(n) —— 排序再取首尾是 O(n log n),纯属浪费</text>
  <text x="320" y="294" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">求 gcd:辗转相除 O(log V) —— 从 min 往下枚举因数是 O(V),没必要</text>
</svg>
