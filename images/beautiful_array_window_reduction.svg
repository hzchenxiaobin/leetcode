<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">核心观察：长度 ≥ 3 的约束 ⟺ 只查长度恰为 3 的窗口</text>
  <text x="280" y="56" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">长子数组的前 3 个元素就是一个 3 窗口；每个位置只关心「是否 ≥ k」⟹ 问题二值化</text>

  <!-- row 1: window reduction -->
  <text x="160" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">前 3 个元素 = 长度 3 窗口</text>

  <rect x="80" y="88" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="113" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="136" y="88" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="113" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="192" y="88" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="113" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="248" y="88" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="113" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="304" y="88" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="113" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <rect x="76" y="84" width="168" height="48" fill="none" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <rect x="70" y="76" width="300" height="64" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5" rx="10" filter="url(#rough2)"/>

  <text x="220" y="156" text-anchor="middle" font-size="12" fill="#99741c" filter="url(#rough2)">长度 5 的子数组（约束对象：max ≥ k）</text>

  <path d="M 220 162 L 220 184" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 2: high / low binarization -->
  <text x="80" y="206" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">二值化：high（≥ k）与 low（&lt; k）</text>

  <rect x="80" y="214" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="239" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="136" y="214" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="162" y="239" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="192" y="214" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="239" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="248" y="214" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="239" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="304" y="214" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="330" y="239" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <rect x="89" y="262" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="106" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">L</text>
  <rect x="145" y="262" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="162" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">H</text>
  <rect x="201" y="262" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="218" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">L</text>
  <rect x="257" y="262" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="274" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">L</text>
  <rect x="313" y="262" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="330" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">H</text>

  <text x="218" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">连续 3 个中必有 high ⟺ 不存在 3 连续 low</text>

  <!-- right panels -->
  <rect x="386" y="72" width="162" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="467" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">抬升代价</text>
  <text x="467" y="116" text-anchor="middle" font-size="11.5" fill="#557" filter="url(#rough2)">cost = max(0, k−nums[i])</text>
  <text x="467" y="136" text-anchor="middle" font-size="11.5" fill="#557" filter="url(#rough2)">只需抬到「恰好 k」</text>
  <text x="467" y="155" text-anchor="middle" font-size="11.5" fill="#557" filter="url(#rough2)">多抬 / 少抬皆浪费</text>

  <rect x="386" y="176" width="162" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="467" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">已 ≥ k 的位置</text>
  <text x="467" y="220" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">免费 high（代价 0）</text>
  <text x="467" y="240" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">且禁止 low：</text>
  <text x="467" y="259" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">终值 ≥ 初值 ≥ k</text>

  <rect x="386" y="280" width="162" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="467" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">约束改写</text>
  <text x="467" y="322" text-anchor="middle" font-size="11.5" fill="#99741c" filter="url(#rough2)">每 3 窗口有 high</text>
  <text x="467" y="333" text-anchor="middle" font-size="11.5" fill="#99741c" filter="url(#rough2)">⟺ 无 3 连续 low</text>

  <!-- bottom strip -->
  <rect x="48" y="352" width="504" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="376" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">改写后的问题（状态机线性 DP）</text>
  <text x="300" y="397" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">每个位置选 high（付 k − nums[i]）或 low（付 0，需 nums[i] &lt; k）</text>
  <text x="300" y="416" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">使不存在 3 个连续 low，最小化总代价</text>
</svg>
