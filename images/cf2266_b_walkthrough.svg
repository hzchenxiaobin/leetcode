<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 412" width="780" height="412"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
  </defs>

  <rect width="780" height="412" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：一行 max(|d|, |d + c|) 命中全部数据</text>
  <path d="M 176 40 Q 390 47 604 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="62" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">组</text>
  <text x="196" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">(a, b, c)</text>
  <text x="344" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">d = a − b</text>
  <text x="440" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">|d|</text>
  <text x="530" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">|d + c|</text>
  <text x="636" y="76" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">答案</text>
  <path d="M 34 86 L 746 86" stroke="#446688" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 行 1 -->
  <text x="62" y="112" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="196" y="112" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">(3, 6, 3)</text>
  <text x="344" y="112" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">−3</text>
  <text x="440" y="112" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="530" y="112" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="636" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">3</text>

  <!-- 行 2 -->
  <text x="62" y="146" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="196" y="146" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">(3, 6, 10)</text>
  <text x="344" y="146" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">−3</text>
  <text x="440" y="146" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="530" y="146" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">7</text>
  <text x="636" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">7</text>

  <!-- 行 3 -->
  <text x="62" y="180" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="196" y="180" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">(5, 5, 4)</text>
  <text x="344" y="180" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="440" y="180" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="530" y="180" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="636" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">4</text>

  <!-- 行 4 -->
  <text x="62" y="214" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="196" y="214" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">(2, 5, 6)</text>
  <text x="344" y="214" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">−3</text>
  <text x="440" y="214" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="530" y="214" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="636" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">3</text>

  <!-- 行 5 -->
  <text x="62" y="248" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="196" y="248" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">(67676767, 41414141, 998244353)</text>
  <text x="344" y="248" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">26262626</text>
  <text x="440" y="248" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">26262626</text>
  <text x="530" y="248" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">1024506979</text>
  <text x="636" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">1024506979</text>

  <!-- 行 6：自造陷阱 -->
  <rect x="30" y="260" width="720" height="32" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="282" text-anchor="middle" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">自造</text>
  <text x="196" y="282" text-anchor="middle" font-size="11" fill="#8c3a37" filter="url(#rough2)">(0, 1000000000, 1000000000)</text>
  <text x="344" y="282" text-anchor="middle" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">−1000000000</text>
  <text x="440" y="282" text-anchor="middle" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">1000000000</text>
  <text x="530" y="282" text-anchor="middle" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">0</text>
  <text x="636" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">1000000000</text>

  <!-- 脚注 -->
  <rect x="40" y="306" width="700" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="60" y="330" font-size="12" fill="#8a6015" filter="url(#rough2)">前 5 行为官方数据；第 6 行（自造）是陷阱：Bob 领先 1e9、第三堆也只有 1e9，</text>
  <text x="60" y="352" font-size="12" fill="#8a6015" filter="url(#rough2)">此时「拿光」只能打平（0 分），正解是全程取 0，把 1e9 的差距原样保留下来。</text>
  <text x="60" y="376" font-size="11.5" fill="#a14340" filter="url(#rough2)">两列候选值始终有一列等于答案 —— 这正是 max 的含义。</text>
</svg>
