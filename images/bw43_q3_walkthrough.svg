<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">n = 5 演算：贪大 → 死路 → 回溯 → 得到 [5,3,1,4,3,5,2,4,2]</text>

  <!-- 行模板：标签在左，9 个 32px 格子在 x = 90 + 34i -->
  <!-- 行 1：pos0 放 5 -->
  <text x="82" y="66" text-anchor="end" font-size="12.5" fill="#8a6d3b" filter="url(#rough2)">pos0：放 5</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="90" y="46" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="106" y="64" fill="#8a6d3b">5</text>
    <rect x="124" y="46" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="140" y="64" fill="#aaa">_</text>
    <rect x="158" y="46" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="174" y="64" fill="#aaa">_</text>
    <rect x="192" y="46" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="208" y="64" fill="#aaa">_</text>
    <rect x="226" y="46" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="242" y="64" fill="#aaa">_</text>
    <rect x="260" y="46" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="276" y="64" fill="#8a6d3b">5</text>
    <rect x="294" y="46" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="310" y="64" fill="#aaa">_</text>
    <rect x="328" y="46" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="344" y="64" fill="#aaa">_</text>
    <rect x="362" y="46" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="378" y="64" fill="#aaa">_</text>
  </g>
  <text x="410" y="64" font-size="12" fill="#777" filter="url(#rough2)">← 5 放 0 和 5</text>

  <!-- 行 2：pos1 放 3 -->
  <text x="82" y="106" text-anchor="end" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">pos1：放 3</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="90" y="86" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="106" y="104" fill="#8a6d3b">5</text>
    <rect x="124" y="86" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/><text x="140" y="104" fill="#4a7a3a">3</text>
    <rect x="158" y="86" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="174" y="104" fill="#aaa">_</text>
    <rect x="192" y="86" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="208" y="104" fill="#aaa">_</text>
    <rect x="226" y="86" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/><text x="242" y="104" fill="#4a7a3a">3</text>
    <rect x="260" y="86" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="276" y="104" fill="#8a6d3b">5</text>
    <rect x="294" y="86" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="310" y="104" fill="#aaa">_</text>
    <rect x="328" y="86" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="344" y="104" fill="#aaa">_</text>
    <rect x="362" y="86" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="378" y="104" fill="#aaa">_</text>
  </g>
  <text x="410" y="104" font-size="12" fill="#777" filter="url(#rough2)">← 4 无处放</text>

  <!-- 行 3：失败分支 -->
  <text x="82" y="146" text-anchor="end" font-size="12.5" fill="#b85450" filter="url(#rough2)">pos2：先试 4 ✗</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="90" y="126" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="106" y="144" fill="#8a6d3b">5</text>
    <rect x="124" y="126" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/><text x="140" y="144" fill="#4a7a3a">3</text>
    <rect x="158" y="126" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="174" y="144" fill="#b85450">4</text>
    <rect x="192" y="126" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="208" y="144" fill="#aaa">_</text>
    <rect x="226" y="126" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/><text x="242" y="144" fill="#4a7a3a">3</text>
    <rect x="260" y="126" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="276" y="144" fill="#8a6d3b">5</text>
    <rect x="294" y="126" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="310" y="144" fill="#b85450">4</text>
    <rect x="328" y="126" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="344" y="144" fill="#aaa">_</text>
    <rect x="362" y="126" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="378" y="144" fill="#aaa">_</text>
  </g>
  <text x="410" y="140" font-size="12" fill="#b85450" filter="url(#rough2)">pos7 需放 2，</text>
  <text x="410" y="156" font-size="12" fill="#b85450" filter="url(#rough2)">但 2+7 越界</text>

  <path d="M140,158 Q140,172 140,172" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 行 4：回溯放 1 -->
  <text x="82" y="192" text-anchor="end" font-size="12.5" fill="#777" filter="url(#rough2)">回溯 → pos2 放 1</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="90" y="172" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="106" y="190" fill="#8a6d3b">5</text>
    <rect x="124" y="172" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/><text x="140" y="190" fill="#4a7a3a">3</text>
    <rect x="158" y="172" width="32" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="2"/><text x="174" y="190" fill="#777">1</text>
    <rect x="192" y="172" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="208" y="190" fill="#aaa">_</text>
    <rect x="226" y="172" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/><text x="242" y="190" fill="#4a7a3a">3</text>
    <rect x="260" y="172" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="276" y="190" fill="#8a6d3b">5</text>
    <rect x="294" y="172" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="310" y="190" fill="#aaa">_</text>
    <rect x="328" y="172" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="344" y="190" fill="#aaa">_</text>
    <rect x="362" y="172" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="378" y="190" fill="#aaa">_</text>
  </g>

  <!-- 行 5：pos3 放 4 -->
  <text x="82" y="232" text-anchor="end" font-size="12.5" fill="#446688" filter="url(#rough2)">pos3：放 4</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="90" y="212" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="106" y="230" fill="#8a6d3b">5</text>
    <rect x="124" y="212" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/><text x="140" y="230" fill="#4a7a3a">3</text>
    <rect x="158" y="212" width="32" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="2"/><text x="174" y="230" fill="#777">1</text>
    <rect x="192" y="212" width="32" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/><text x="208" y="230" fill="#446688">4</text>
    <rect x="226" y="212" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/><text x="242" y="230" fill="#4a7a3a">3</text>
    <rect x="260" y="212" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="276" y="230" fill="#8a6d3b">5</text>
    <rect x="294" y="212" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="310" y="230" fill="#aaa">_</text>
    <rect x="328" y="212" width="32" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/><text x="344" y="230" fill="#446688">4</text>
    <rect x="362" y="212" width="32" height="26" rx="4" fill="#f4f4f4" stroke="#bbb"/><text x="378" y="230" fill="#aaa">_</text>
  </g>

  <!-- 行 6：pos6 放 2 完成 -->
  <text x="82" y="272" text-anchor="end" font-size="12.5" fill="#b85450" filter="url(#rough2)">pos6：放 2 ✓</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="90" y="252" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="106" y="270" fill="#8a6d3b">5</text>
    <rect x="124" y="252" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/><text x="140" y="270" fill="#4a7a3a">3</text>
    <rect x="158" y="252" width="32" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="2"/><text x="174" y="270" fill="#777">1</text>
    <rect x="192" y="252" width="32" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/><text x="208" y="270" fill="#446688">4</text>
    <rect x="226" y="252" width="32" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/><text x="242" y="270" fill="#4a7a3a">3</text>
    <rect x="260" y="252" width="32" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/><text x="276" y="270" fill="#8a6d3b">5</text>
    <rect x="294" y="252" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="310" y="270" fill="#b85450">2</text>
    <rect x="328" y="252" width="32" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/><text x="344" y="270" fill="#446688">4</text>
    <rect x="362" y="252" width="32" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/><text x="378" y="270" fill="#b85450">2</text>
  </g>

  <rect x="90" y="300" width="304" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="242" y="327" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">完成：[5,3,1,4,3,5,2,4,2]</text>

  <text x="260" y="372" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">每个空位「先大后小」，失败才回退 —— 第一次填满的序列即字典序最大</text>
</svg>
