<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="392" fill="#fafafa"/>

  <text x="380" y="31" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四组样例走查：算 c → 去重 → 找最长连续段</text>
  <path d="M 140 41 Q 380 48 620 41" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="40" y="54" width="680" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例</text>
  <text x="230" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a（原始高度）</text>
  <text x="420" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">c = aᵢ − i</text>
  <text x="585" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">去重后的 c</text>
  <text x="690" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案</text>

  <!-- 第 1 行 -->
  <rect x="40" y="88" width="680" height="42" rx="6" fill="#fafafa" stroke="#cfcfcf" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="76" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="230" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5 5 5 9 8</text>
  <text x="420" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4 3 2 5 3</text>
  <text x="585" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{2,3,4,5}</text>
  <text x="585" y="123" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">段 2–5，长 4</text>
  <text x="690" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">4</text>

  <!-- 第 2 行 -->
  <rect x="40" y="132" width="680" height="42" rx="6" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="76" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="230" y="151" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9 7 12 10 12</text>
  <text x="420" y="151" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8 5 9 6 7</text>
  <text x="585" y="151" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{5,6,7,8,9}</text>
  <text x="585" y="167" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">段 5–9，长 5</text>
  <text x="690" y="156" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5</text>

  <!-- 第 3 行 -->
  <rect x="40" y="176" width="680" height="42" rx="6" fill="#fafafa" stroke="#cfcfcf" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="76" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="230" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">14 9 14 12 8 11 12</text>
  <text x="420" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">13 7 11 8 3 5 5</text>
  <text x="585" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{3,5,7,8,11,13}</text>
  <text x="585" y="211" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">段 7–8，长 2</text>
  <text x="690" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>

  <!-- 第 4 行 -->
  <rect x="40" y="220" width="680" height="42" rx="6" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="76" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">8</text>
  <text x="230" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8 8 12 8 14 10 15 13</text>
  <text x="420" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7 6 9 4 9 4 8 5</text>
  <text x="585" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{4,5,6,7,8,9}</text>
  <text x="585" y="255" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">段 4–9，长 6</text>
  <text x="690" y="244" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">6</text>

  <!-- 注释框 -->
  <rect x="40" y="278" width="680" height="102" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="302" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">样例 3（5 6 7 8 9，c 全是 4）：重复的 c 只能算 1 段，答案 1 —— 必须先排序去重。</text>
  <text x="58" y="326" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">样例 1 的 c 里有重复的 3，但集合 {2,3,4,5} 依然连续，所以答案 4（重复值只是被浪费）。</text>
  <text x="58" y="350" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">样例 6 在 8 与 11 之间断开（缺 9、10），最长只能取 7–8 → 2。</text>
  <text x="58" y="372" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">样例 8 的六个数正好覆盖 4 … 9，所以 8 段的路能压出 6 段等高。</text>
</svg>
