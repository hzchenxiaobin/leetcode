<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察一：相邻差 &gt; 2 处断开，完全子串不跨段</text>
  <path d="M 140 36 Q 320 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#666">示例：word = "acexca"（与 k 无关），红色 ✂ 处 |相邻差| &gt; 2</text>

  <text x="213" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">段 1</text>
  <text x="346" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">段 2</text>
  <text x="455" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">段 3</text>

  <g filter="url(#sk)"><rect x="128" y="94" width="170" height="64" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="314" y="94" width="64" height="64" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="396" y="94" width="118" height="64" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/></g>

  <g filter="url(#sk)"><rect x="138" y="104" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="160" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">a</text>
  <g filter="url(#sk)"><rect x="190" y="104" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="212" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">c</text>
  <g filter="url(#sk)"><rect x="242" y="104" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="264" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">e</text>
  <g filter="url(#sk)"><rect x="324" y="104" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="346" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">x</text>
  <g filter="url(#sk)"><rect x="406" y="104" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="428" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">c</text>
  <g filter="url(#sk)"><rect x="458" y="104" width="44" height="44" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/></g>
  <text x="480" y="132" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">a</text>

  <text x="301" y="131" font-size="20" font-weight="bold" fill="#b85450">✂</text>
  <text x="383" y="131" font-size="20" font-weight="bold" fill="#b85450">✂</text>

  <text x="186" y="178" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">差 2 ✓</text>
  <text x="238" y="178" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">差 2 ✓</text>
  <text x="305" y="178" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">差 19 ✗</text>
  <text x="387" y="178" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">差 21 ✗</text>
  <text x="454" y="178" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">差 2 ✓</text>

  <g filter="url(#sk)"><rect x="55" y="196" width="530" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="320" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">跨段 ✗</text>
  <text x="320" y="238" text-anchor="middle" font-size="12" fill="#444">任何横跨 ✂ 的子串（如 "exca"）内部必含一对差 &gt; 2 的相邻字符</text>
  <text x="320" y="254" text-anchor="middle" font-size="12" fill="#444">→ 违反条件②，直接出局（断点两侧字符在子串中仍然相邻）</text>

  <g filter="url(#sk)"><rect x="55" y="276" width="530" height="76" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">段内 ✓</text>
  <text x="320" y="318" text-anchor="middle" font-size="12" fill="#444">完全子串整段落入某一段；段内任意子串的相邻差 ≤ 2 自动成立</text>
  <text x="320" y="338" text-anchor="middle" font-size="12" fill="#444">→ 段内只需专注条件①「每个字符恰好 k 次」，各段独立计数后求和</text>

  <g filter="url(#sk)"><rect x="55" y="366" width="530" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">两个条件解耦：条件②定「切多宽」，条件①定「段内怎么数」</text>
  <text x="320" y="402" text-anchor="middle" font-size="11" fill="#555">段内计数交给「定长滑窗」—— 见核心观察二</text>
</svg>
