<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：45 桶逐位滚动迁移，末位非 0 时查询「余 0」桶</text>
  <path d="M 90 38 Q 340 46 590 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- left: bucket migration example (d=6, c=6) -->
  <text x="150" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#rough2)">桶迁移示意（d = 6，处理字符 c = 6）</text>

  <!-- old buckets -->
  <g filter="url(#rough2)">
    <rect x="30" y="80" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="70" y="80" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="110" y="80" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="80" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="190" y="80" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="230" y="80" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="47" y="99" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="87" y="99" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="127" y="99" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="167" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="207" y="99" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="247" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="47" y="122" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=0</text>
  <text x="87" y="122" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=1</text>
  <text x="127" y="122" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=2</text>
  <text x="167" y="122" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=3</text>
  <text x="207" y="122" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=4</text>
  <text x="247" y="122" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=5</text>

  <!-- migration arrows -->
  <g filter="url(#rough2)">
    <path d="M 167 126 Q 70 140 47 194" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 247 126 Q 175 152 127 194" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="80" y="146" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">×3</text>
  <text x="184" y="158" font-size="10" font-weight="bold" fill="#446688" filter="url(#rough2)">×1</text>

  <!-- new buckets -->
  <g filter="url(#rough2)">
    <rect x="30" y="200" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="70" y="200" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="110" y="200" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="150" y="200" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="190" y="200" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="230" y="200" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="47" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="87" y="219" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="127" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="167" y="219" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="207" y="219" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="247" y="219" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="47" y="242" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=0</text>
  <text x="87" y="242" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=1</text>
  <text x="127" y="242" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=2</text>
  <text x="167" y="242" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=3</text>
  <text x="207" y="242" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=4</text>
  <text x="247" y="242" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=5</text>

  <!-- new single char badge -->
  <g filter="url(#rough2)">
    <rect x="30" y="262" width="120" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <path d="M 60 262 Q 50 246 47 230" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="90" y="278" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">新开 "6" → 桶 0</text>

  <text x="150" y="316" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">桶 r 的计数搬到 (10r + 6) mod 6：r=3→0、r=5→2</text>
  <text x="150" y="336" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">9 组桶共 45 格 → 每字符 45 次搬运，总计 O(45n)</text>

  <!-- right: flow chart -->
  <g filter="url(#rough2)">
    <rect x="365" y="56" width="260" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <path d="M 495 90 L 495 108" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <rect x="365" y="110" width="260" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <path d="M 495 156 L 495 174" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <rect x="365" y="176" width="260" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <path d="M 495 210 L 495 226" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <polygon points="495,228 585,262 495,296 405,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <path d="M 585 262 Q 584 294 580 320" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 405 262 Q 404 294 403 320" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <rect x="500" y="322" width="160" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="318" y="322" width="170" height="58" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="495" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">读取字符 c = s[j]</text>
  <text x="495" y="129" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">对 d = 1..9：余数桶整体迁移</text>
  <text x="495" y="148" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">cnt[d][(10r+c) mod d] ← cnt[d][r]</text>
  <text x="495" y="198" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">cnt[d][c mod d] += 1（新开 "c"）</text>
  <text x="495" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">c ≠ 0 ?</text>
  <text x="596" y="294" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="384" y="294" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="580" y="345" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans += cnt[c][0]</text>
  <text x="580" y="366" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">查询「余 0」整桶计数</text>
  <text x="403" y="345" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">跳过查询（防除 0）</text>
  <text x="403" y="366" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">但桶已更新，继续向右传递</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="24" y="408" width="632" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="340" y="428" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">查询发生在「迁移 + 新开」之后</text>
  <text x="340" y="446" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">以 j 结尾的 j+1 个子串（含单字符 "c"）都已入桶，cnt[c][0] 恰为合法个数</text>
</svg>
