<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="460" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：格点 (i, j) 处有 |i|+|j| 个苹果，买半边长 n 的正方形 → 周长 8n</text>
  <path d="M 180 40 Q 360 50 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left panel: n = 1 -->
  <g filter="url(#sk)"><rect x="20" y="58" width="330" height="300" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="185" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25">n = 1：3×3 个格点，边长 2，周长 = 8</text>

  <!-- 3x3 grid, cell 50 -->
  <g filter="url(#sk)"><rect x="110" y="104" width="50" height="50" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/></g>
  <text x="135" y="134" text-anchor="middle" font-size="13" fill="#2c4a6e">2</text>
  <g filter="url(#sk)"><rect x="160" y="104" width="50" height="50" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/></g>
  <text x="185" y="134" text-anchor="middle" font-size="13" fill="#2c4a6e">1</text>
  <g filter="url(#sk)"><rect x="210" y="104" width="50" height="50" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/></g>
  <text x="235" y="134" text-anchor="middle" font-size="13" fill="#2c4a6e">2</text>
  <g filter="url(#sk)"><rect x="110" y="154" width="50" height="50" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/></g>
  <text x="135" y="184" text-anchor="middle" font-size="13" fill="#2c4a6e">1</text>
  <g filter="url(#sk)"><rect x="160" y="154" width="50" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="185" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">0</text>
  <g filter="url(#sk)"><rect x="210" y="154" width="50" height="50" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/></g>
  <text x="235" y="184" text-anchor="middle" font-size="13" fill="#2c4a6e">1</text>
  <g filter="url(#sk)"><rect x="110" y="204" width="50" height="50" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/></g>
  <text x="135" y="234" text-anchor="middle" font-size="13" fill="#2c4a6e">2</text>
  <g filter="url(#sk)"><rect x="160" y="204" width="50" height="50" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/></g>
  <text x="185" y="234" text-anchor="middle" font-size="13" fill="#2c4a6e">1</text>
  <g filter="url(#sk)"><rect x="210" y="204" width="50" height="50" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/></g>
  <text x="235" y="234" text-anchor="middle" font-size="13" fill="#2c4a6e">2</text>

  <!-- axis labels -->
  <text x="135" y="272" text-anchor="middle" font-size="10" fill="#888888">i=−1</text>
  <text x="185" y="272" text-anchor="middle" font-size="10" fill="#888888">0</text>
  <text x="235" y="272" text-anchor="middle" font-size="10" fill="#888888">+1</text>
  <text x="103" y="133" text-anchor="end" font-size="10" fill="#888888">j=+1</text>
  <text x="103" y="183" text-anchor="end" font-size="10" fill="#888888">0</text>
  <text x="103" y="233" text-anchor="end" font-size="10" fill="#888888">−1</text>

  <text x="185" y="296" text-anchor="middle" font-size="12" fill="#2f5d25">A(1) = 2+1+2+1+0+1+2+1+2 = 12</text>
  <text x="185" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d25">= 12·1² —— 第 1 环贡献 12 个</text>
  <text x="185" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a">示例1：neededApples = 1 → 12 ≥ 1 → 周长 8</text>

  <!-- Right panel: n = 2 -->
  <g filter="url(#sk)"><rect x="370" y="58" width="330" height="300" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="535" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e">n = 2：5×5 个格点，边长 4，周长 = 16</text>

  <!-- 5x5 grid, cell 34: outer ring orange, inner 3x3 blue, center green -->
  <g filter="url(#sk)"><rect x="450" y="96" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="467" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">4</text>
  <g filter="url(#sk)"><rect x="484" y="96" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="501" y="118" text-anchor="middle" font-size="11" fill="#7a5415">3</text>
  <g filter="url(#sk)"><rect x="518" y="96" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="535" y="118" text-anchor="middle" font-size="11" fill="#7a5415">2</text>
  <g filter="url(#sk)"><rect x="552" y="96" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="569" y="118" text-anchor="middle" font-size="11" fill="#7a5415">3</text>
  <g filter="url(#sk)"><rect x="586" y="96" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="603" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">4</text>

  <g filter="url(#sk)"><rect x="450" y="130" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="467" y="152" text-anchor="middle" font-size="11" fill="#7a5415">3</text>
  <g filter="url(#sk)"><rect x="484" y="130" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="501" y="152" text-anchor="middle" font-size="11" fill="#2c4a6e">2</text>
  <g filter="url(#sk)"><rect x="518" y="130" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="535" y="152" text-anchor="middle" font-size="11" fill="#2c4a6e">1</text>
  <g filter="url(#sk)"><rect x="552" y="130" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="569" y="152" text-anchor="middle" font-size="11" fill="#2c4a6e">2</text>
  <g filter="url(#sk)"><rect x="586" y="130" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="603" y="152" text-anchor="middle" font-size="11" fill="#7a5415">3</text>

  <g filter="url(#sk)"><rect x="450" y="164" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="467" y="186" text-anchor="middle" font-size="11" fill="#7a5415">2</text>
  <g filter="url(#sk)"><rect x="484" y="164" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="501" y="186" text-anchor="middle" font-size="11" fill="#2c4a6e">1</text>
  <g filter="url(#sk)"><rect x="518" y="164" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="535" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d25">0</text>
  <g filter="url(#sk)"><rect x="552" y="164" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="569" y="186" text-anchor="middle" font-size="11" fill="#2c4a6e">1</text>
  <g filter="url(#sk)"><rect x="586" y="164" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="603" y="186" text-anchor="middle" font-size="11" fill="#7a5415">2</text>

  <g filter="url(#sk)"><rect x="450" y="198" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="467" y="220" text-anchor="middle" font-size="11" fill="#7a5415">3</text>
  <g filter="url(#sk)"><rect x="484" y="198" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="501" y="220" text-anchor="middle" font-size="11" fill="#2c4a6e">2</text>
  <g filter="url(#sk)"><rect x="518" y="198" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="535" y="220" text-anchor="middle" font-size="11" fill="#2c4a6e">1</text>
  <g filter="url(#sk)"><rect x="552" y="198" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="569" y="220" text-anchor="middle" font-size="11" fill="#2c4a6e">2</text>
  <g filter="url(#sk)"><rect x="586" y="198" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="603" y="220" text-anchor="middle" font-size="11" fill="#7a5415">3</text>

  <g filter="url(#sk)"><rect x="450" y="232" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="467" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">4</text>
  <g filter="url(#sk)"><rect x="484" y="232" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="501" y="254" text-anchor="middle" font-size="11" fill="#7a5415">3</text>
  <g filter="url(#sk)"><rect x="518" y="232" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="535" y="254" text-anchor="middle" font-size="11" fill="#7a5415">2</text>
  <g filter="url(#sk)"><rect x="552" y="232" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="569" y="254" text-anchor="middle" font-size="11" fill="#7a5415">3</text>
  <g filter="url(#sk)"><rect x="586" y="232" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="603" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">4</text>

  <text x="535" y="284" text-anchor="middle" font-size="10.5" fill="#446688">橙色外圈 = 第 2 环（新增 12·2² = 48）· 蓝色内 3×3 = n = 1 的旧花园（12 个）</text>
  <text x="535" y="304" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4a6e">A(2) = 12 + 48 = 60 = 2·2·3·5 ✓</text>
  <text x="535" y="324" text-anchor="middle" font-size="11" fill="#446688">示例2：neededApples = 13 → 60 ≥ 13 → 周长 16</text>
  <text x="535" y="344" text-anchor="middle" font-size="11" fill="#446688">示例3：neededApples = 10⁹ → A(630) ≈ 1.0×10⁹ → 周长 5040</text>

  <!-- Bottom banner -->
  <g filter="url(#sk)"><rect x="20" y="372" width="680" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="360" y="396" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">半边长 n（整数）→ 周长 8n；苹果总数 A(n) = 2n(n+1)(2n+1)</text>
  <text x="360" y="418" text-anchor="middle" font-size="11.5" fill="#7a5415">两个等价视角：可分性求和 与 环增量 12k² —— A(n) = 12·(1²+2²+…+n²)</text>
  <text x="360" y="440" text-anchor="middle" font-size="11.5" fill="#7a5415">每环增量 12k² &gt; 0 → A 严格递增 → 最小 n 存在且唯一，可二分求解</text>
</svg>
