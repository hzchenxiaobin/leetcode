<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">掩码求法：OR-移位把最高位的 1 向右「抹平」</text>
  <text x="280" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">mask = num；依次 mask |= mask &gt;&gt; 1, 2, 4, 8, 16</text>

  <text x="222" y="72" font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">bit4</text>
  <text x="272" y="72" font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">bit3</text>
  <text x="322" y="72" font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">bit2</text>
  <text x="372" y="72" font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">bit1</text>
  <text x="422" y="72" font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">bit0</text>

  <text x="30" y="108" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">mask = num = 101</text>
  <rect x="200" y="86" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="107" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="250" y="86" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="107" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="300" y="86" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="107" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="350" y="86" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="107" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="400" y="86" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="107" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>

  <path d="M 160 102 L 190 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 322 118 L 322 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="30" y="150" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">mask &gt;&gt; 1 = 010</text>
  <rect x="200" y="128" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="149" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="250" y="128" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="149" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="300" y="128" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="149" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="350" y="128" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="149" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="400" y="128" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="149" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>

  <path d="M 322 160 L 322 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="30" y="192" font-size="10" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">mask |= (mask &gt;&gt; 1)</text>
  <rect x="200" y="170" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="222" y="191" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="250" y="170" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="272" y="191" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="300" y="170" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="322" y="191" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="350" y="170" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="372" y="191" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="400" y="170" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="422" y="191" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="456" y="191" font-size="9" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">低位已铺平</text>

  <path d="M 322 202 L 322 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="30" y="234" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">mask &gt;&gt; 2 = 001</text>
  <rect x="200" y="212" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="233" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="250" y="212" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="233" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="300" y="212" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="233" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="350" y="212" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="233" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="400" y="212" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="233" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 322 244 L 322 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="30" y="276" font-size="10" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">mask |= (mask &gt;&gt; 2)</text>
  <rect x="200" y="254" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="275" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="250" y="254" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="275" font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="300" y="254" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="275" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="350" y="254" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="275" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="400" y="254" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="422" y="275" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="456" y="275" font-size="9" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">= 7 = 2^3 − 1</text>

  <rect x="30" y="298" width="500" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="46" y="320" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">k ≤ 31，而 1 + 2 + 4 + 8 + 16 = 31，所以 5 次移位足以覆盖全部有效位</text>
  <text x="46" y="340" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">右移只会把 1 往低位搬，更高位始终保持 0 —— 掩码不会「长高」</text>

  <text x="30" y="362" font-size="10" fill="#b85450" text-anchor="start" filter="url(#rough2)">漏掉 &gt;&gt; 16 时 k ≥ 17 就会算错，例如 num = 65536。</text>
</svg>
