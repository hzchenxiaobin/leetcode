<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：两天的变迁与势能下降</text>

  <text x="60" y="62" font-size="12" fill="#333" font-weight="bold">第 0 天：[1, 6, 3, 4, 3, 5]　V₀ = 5+3+1+1+2 = 12</text>

  <g filter="url(#rough2)">
    <rect x="70" y="76" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="134" y="76" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="198" y="76" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="262" y="76" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="326" y="76" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="390" y="76" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle" font-weight="bold">
    <text x="100" y="94" fill="#3a4a66">1</text>
    <text x="164" y="94" fill="#8a3a36">6→5</text>
    <text x="228" y="94" fill="#3a5a30">3→4</text>
    <text x="292" y="94" fill="#8a3a36">4→3</text>
    <text x="356" y="94" fill="#3a5a30">3→4</text>
    <text x="420" y="94" fill="#3a4a66">5</text>
  </g>
  <text x="472" y="94" font-size="9.5" fill="#888" filter="url(#rough2)">全部同时</text>
  <text x="472" y="106" font-size="9.5" fill="#888" filter="url(#rough2)">基于昨天判定</text>

  <g filter="url(#rough2)">
    <path d="M 280 108 L 280 128" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
  </g>

  <text x="60" y="152" font-size="12" fill="#333" font-weight="bold">第 1 天：[1, 5, 4, 3, 4, 5]　V₁ = 4+1+1+1+1 = 8</text>

  <g filter="url(#rough2)">
    <rect x="70" y="164" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="134" y="164" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="198" y="164" width="60" height="28" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="262" y="164" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="326" y="164" width="60" height="28" fill="#fff" stroke="#666" stroke-width="1.2" rx="4"/>
    <rect x="390" y="164" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle" font-weight="bold">
    <text x="100" y="182" fill="#3a4a66">1</text>
    <text x="164" y="182" fill="#8a3a36">5→4</text>
    <text x="228" y="182" fill="#777">4 不变</text>
    <text x="292" y="182" fill="#3a5a30">3→4</text>
    <text x="356" y="182" fill="#777">4 不变</text>
    <text x="420" y="182" fill="#3a4a66">5</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 280 196 L 280 216" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none"/>
  </g>

  <text x="60" y="240" font-size="12" fill="#333" font-weight="bold">第 2 天：[1, 4, 4, 4, 4, 5]　V₂ = 3+0+0+0+1 = 4</text>

  <g filter="url(#rough2)">
    <rect x="70" y="252" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="134" y="252" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="198" y="252" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="262" y="252" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="326" y="252" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="390" y="252" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle" font-weight="bold">
    <text x="100" y="270" fill="#3a4a66">1</text>
    <text x="164" y="270" fill="#3a5a30">4</text>
    <text x="228" y="270" fill="#3a5a30">4</text>
    <text x="292" y="270" fill="#3a5a30">4</text>
    <text x="356" y="270" fill="#3a5a30">4</text>
    <text x="420" y="270" fill="#3a4a66">5</text>
  </g>

  <rect x="60" y="296" width="440" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="280" y="314" fill="#3a5a30" font-weight="bold">第 3 天：4 与左邻相等（非严格谷/峰）、其余居中 → 无变动</text>
    <text x="280" y="331" fill="#3a5a30">返回 [1,4,4,4,4,5] ✓　V：12 → 8 → 4（每个变动日严格下降）</text>
  </g>
</svg>
