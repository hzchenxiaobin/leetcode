<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 342" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="342" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">按 key 分桶，桶内记录天然按时间戳升序</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">set 的时间戳严格递增，所以追加即有序，不需要任何排序结构</text>
  <text x="30" y="76" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">TimeMap 的内部结构</text>
  <rect x="30" y="92" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="90.0" y="115.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">key = "foo"</text>
  <rect x="200" y="92" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="275.0" y="115.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(1, "bar")</text>
  <rect x="360" y="92" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="440.0" y="115.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(4, "bar2")</text>
  <path d="M 152 112 L 196 112" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="200" y="152" font-size="11" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">桶内按时间戳严格递增（set 的时间戳全局递增）</text>
  <text x="30" y="196" font-size="11.5" fill="#888" text-anchor="start" filter="url(#rough2)">key = "k2"</text>
  <rect x="30" y="206" width="120" height="36" fill="#eceff1" stroke="#78909c" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="90.0" y="227.78" font-size="10.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">（空 / 不存在）</text>
  <rect x="200" y="206" width="150" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="275.0" y="227.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(5, "v1")</text>
  <rect x="360" y="206" width="160" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="440.0" y="227.96" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">(10, "v2")</text>
  <rect x="30" y="266" width="500" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="287" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">get(key, t) 的语义</text><text x="40" y="302.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">在桶里找最后一个 timestamp ≤ t 的记录；没有则返回空串</text><text x="40" y="318.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">桶内有序 ⇒ 一次二分 O(log m) 解决</text>
</svg>
