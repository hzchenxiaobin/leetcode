<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="580" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">可整除性得分：各除数独立计分，暴力即正解</text>
  <path d="M 280 42 Q 470 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A: 每个除数独立计分 ===== -->
  <text x="60" y="78" font-size="13" font-weight="bold" fill="#2b6e9e">① 每个除数独立计分（示例 1）</text>

  <!-- nums header -->
  <text x="96" y="123" text-anchor="end" font-size="11" fill="#888" font-weight="bold">nums →</text>
  <g filter="url(#sk)"><rect x="100" y="98" width="44" height="36" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="122" y="121" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">2</text>
  <g filter="url(#sk)"><rect x="152" y="98" width="44" height="36" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="174" y="121" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">9</text>
  <g filter="url(#sk)"><rect x="204" y="98" width="44" height="36" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="226" y="121" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">15</text>
  <g filter="url(#sk)"><rect x="256" y="98" width="44" height="36" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="278" y="121" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">50</text>

  <!-- d = 5 -->
  <text x="96" y="173" text-anchor="end" font-size="11" fill="#2b6e9e" font-weight="bold">d=5:</text>
  <g filter="url(#sk)"><rect x="100" y="150" width="44" height="36" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="122" y="173" text-anchor="middle" font-size="12" fill="#bbb">✗</text>
  <g filter="url(#sk)"><rect x="152" y="150" width="44" height="36" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="174" y="173" text-anchor="middle" font-size="12" fill="#bbb">✗</text>
  <g filter="url(#sk)"><rect x="204" y="150" width="44" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="226" y="173" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓</text>
  <g filter="url(#sk)"><rect x="256" y="150" width="44" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="278" y="173" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓</text>
  <g filter="url(#sk)"><rect x="310" y="150" width="90" height="36" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="355" y="173" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">得分 2</text>

  <!-- d = 3 -->
  <text x="96" y="225" text-anchor="end" font-size="11" fill="#2b6e9e" font-weight="bold">d=3:</text>
  <g filter="url(#sk)"><rect x="100" y="202" width="44" height="36" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="122" y="225" text-anchor="middle" font-size="12" fill="#bbb">✗</text>
  <g filter="url(#sk)"><rect x="152" y="202" width="44" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="174" y="225" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓</text>
  <g filter="url(#sk)"><rect x="204" y="202" width="44" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="226" y="225" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓</text>
  <g filter="url(#sk)"><rect x="256" y="202" width="44" height="36" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="278" y="225" text-anchor="middle" font-size="12" fill="#bbb">✗</text>
  <g filter="url(#sk)"><rect x="310" y="202" width="90" height="36" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="355" y="225" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">得分 2</text>

  <!-- d = 7 -->
  <text x="96" y="277" text-anchor="end" font-size="11" fill="#2b6e9e" font-weight="bold">d=7:</text>
  <g filter="url(#sk)"><rect x="100" y="254" width="44" height="36" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="122" y="277" text-anchor="middle" font-size="12" fill="#bbb">✗</text>
  <g filter="url(#sk)"><rect x="152" y="254" width="44" height="36" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="174" y="277" text-anchor="middle" font-size="12" fill="#bbb">✗</text>
  <g filter="url(#sk)"><rect x="204" y="254" width="44" height="36" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="226" y="277" text-anchor="middle" font-size="12" fill="#bbb">✗</text>
  <g filter="url(#sk)"><rect x="256" y="254" width="44" height="36" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="278" y="277" text-anchor="middle" font-size="12" fill="#bbb">✗</text>
  <g filter="url(#sk)"><rect x="310" y="254" width="90" height="36" rx="6" fill="#f0ede4" stroke="#bbb" stroke-width="1.3"/></g>
  <text x="355" y="277" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">得分 0</text>

  <!-- d = 2 (winner) -->
  <text x="96" y="329" text-anchor="end" font-size="11" fill="#b03a3a" font-weight="bold">d=2:</text>
  <g filter="url(#sk)"><rect x="100" y="306" width="44" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="122" y="329" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓</text>
  <g filter="url(#sk)"><rect x="152" y="306" width="44" height="36" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="174" y="329" text-anchor="middle" font-size="12" fill="#bbb">✗</text>
  <g filter="url(#sk)"><rect x="204" y="306" width="44" height="36" fill="#f0ede4" stroke="#ccc" stroke-width="1.2"/></g>
  <text x="226" y="329" text-anchor="middle" font-size="12" fill="#bbb">✗</text>
  <g filter="url(#sk)"><rect x="256" y="306" width="44" height="36" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="278" y="329" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓</text>
  <g filter="url(#sk)"><rect x="310" y="306" width="90" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="355" y="329" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold">得分 2 ★</text>

  <text x="60" y="364" font-size="11" fill="#888">每个格子 = 一次取模判定 x % d，整张表恰好 n·m 次；</text>
  <text x="60" y="386" font-size="11" fill="#888">各行的得分互相独立 → 逐行计算即可，无需任何预处理。</text>

  <!-- ===== Panel B: 规模 × 值域 ===== -->
  <text x="520" y="78" font-size="13" font-weight="bold" fill="#2e6e2e">② 规模 × 值域：暴力即正解</text>
  <text x="520" y="106" font-size="11" fill="#444">数据规模：n = |nums| ≤ 1000，m = |divisors| ≤ 1000</text>
  <text x="520" y="130" font-size="11" fill="#444">两两取模 n·m ≤ 10⁶ 次 → 毫秒级通过</text>
  <text x="520" y="154" font-size="11" fill="#444">值域高达 10⁹：值域桶 / 倍数筛等预处理不可行</text>
  <text x="520" y="182" font-size="12" fill="#2e6e2e" font-weight="bold">结论：O(n·m) 逐对取模就是本题正解</text>
  <text x="520" y="206" font-size="11" fill="#888">不排序、不去重、不建表，也完全正确。</text>

  <!-- ===== Panel C: 纯值函数 ===== -->
  <text x="520" y="248" font-size="13" font-weight="bold" fill="#7a5415">③ 得分是纯「值」函数</text>
  <text x="520" y="276" font-size="11" fill="#444">得分只看除数的数值，与下标 / 出现顺序无关；</text>
  <text x="520" y="300" font-size="11" fill="#444">相同数值的除数得分必然相同（可安全去重）；</text>
  <text x="520" y="324" font-size="11" fill="#444">平局规则也基于值：并列时取数值最小的一个。</text>
  <text x="520" y="352" font-size="11" fill="#b03a3a" font-weight="bold">「按值裁决」≠「按位置裁决」→ 见下方对照 ↓</text>

  <!-- ===== Panel D: 与 Q1 对照 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="408" width="500" height="104" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="62" y="434" font-size="13" font-weight="bold" fill="#2b6e9e">④ 与同场 Q1「一最多的行」的唯一区别：平局规则</text>
  <text x="62" y="462" font-size="11" fill="#444">Q1：平局取<tspan fill="#2e6e2e" font-weight="bold">下标最小</tspan>，扫描顺序 = 下标顺序</text>
  <text x="62" y="484" font-size="11" fill="#2e6e2e">　　→ 单条件「严格大于才换擂」天然正确 ✓</text>
  <text x="62" y="506" font-size="11" fill="#444">本题：平局取<tspan fill="#b03a3a" font-weight="bold">数值最小</tspan>，与顺序无关 → 需双条件（见下图）</text>

  <!-- ===== Panel E: 结果与复杂度 ===== -->
  <g filter="url(#sk)">
    <rect x="560" y="408" width="340" height="104" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="582" y="434" font-size="13" font-weight="bold" fill="#2e6e2e">结果与复杂度</text>
  <text x="582" y="462" font-size="11" fill="#444">示例 1：5、3、2 同得最高分 2，返回最小的 <tspan fill="#b03a3a" font-weight="bold">2 ★</tspan></text>
  <text x="582" y="484" font-size="11" fill="#444">时间 O(n·m) ≤ 10⁶ 次取模</text>
  <text x="582" y="506" font-size="11" fill="#444">空间 O(1)：bestCnt、bestD、cnt 三个变量</text>

  <!-- ===== 易错警示 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="528" width="860" height="42" rx="8" fill="#fdf2f3" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="62" y="554" font-size="11.5" fill="#444"><tspan font-weight="bold" fill="#7a2828">易错警示：</tspan>divisors = [5,3] 同得 2 分时，单条件「严格大于」会错留先出现的 5 —— 正确答案是数值更小的 3。</text>
</svg>
