<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">双端匹配：短句 = 长句的「公共前缀 + 公共后缀」</text>

  <!-- 长句 w2 -->
  <text x="80" y="70" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">较长句 w2（单词序列）</text>
  <g filter="url(#rough2)">
    <rect x="80" y="84" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <rect x="174" y="84" width="180" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <rect x="358" y="84" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="125" y="110">My</text>
    <text x="264" y="110">name is</text>
    <text x="403" y="110">Haley</text>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="125" y="148" fill="#2d5a22" font-weight="bold">公共前缀 L 个</text>
    <text x="264" y="148" fill="#7a5c1e" font-weight="bold">被删去的连续块（插入内容）</text>
    <text x="403" y="148" fill="#2d5a22" font-weight="bold">公共后缀 R 个</text>
  </g>

  <!-- 短句 w1 -->
  <text x="80" y="192" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">较短句 w1</text>
  <g filter="url(#rough2)">
    <rect x="80" y="206" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <rect x="174" y="206" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="125" y="232">My</text>
    <text x="219" y="232">Haley</text>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="125" y="270" fill="#2d5a22">匹配 w2 的前 L 个</text>
    <text x="219" y="270" fill="#2d5a22">匹配 w2 的后 R 个</text>
  </g>

  <!-- 匹配箭头 -->
  <path d="M 125 128 C 125 160, 125 176, 125 200" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 403 128 C 403 168, 240 180, 226 202" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定框 -->
  <rect x="70" y="292" width="424" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="282" y="314" text-anchor="middle" font-size="14" fill="#2b4a66" font-weight="bold" filter="url(#rough2)">相似 ⟺ L + R ≥ |w1|（短句被两端完全覆盖）</text>
  <rect x="70" y="336" width="424" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="282" y="359" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">中间块长度 = |w2| − L − R ≥ 0 自动成立；空块对应两句完全相同</text>
</svg>
