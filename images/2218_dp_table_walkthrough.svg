<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="560" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：piles=[[1,100,3],[7,8,9]]，k = 2</text>
  <path d="M 140 42 Q 340 52 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="62" text-anchor="middle" font-size="12" fill="#888">dp[t] = 恰好 t 次操作的最大面值和；两轮演变 [0, −∞, −∞] → [0, 1, 101] → [0, 7, 101]</text>

  <!-- prefix panel -->
  <g filter="url(#sk)">
    <rect x="40" y="78" width="300" height="78" rx="10" fill="#f8fbff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="190" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475e" filter="url(#sk)">前缀和 prefix[j]（取 j 枚的价值）</text>
  <g font-size="10.5" fill="#999" text-anchor="middle">
    <text x="102" y="112">j=0</text><text x="147" y="112">j=1</text><text x="192" y="112">j=2</text><text x="237" y="112">j=3</text>
  </g>
  <g filter="url(#sk)">
    <rect x="84" y="116" width="36" height="17" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="129" y="116" width="36" height="17" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="174" y="116" width="36" height="17" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <rect x="219" y="116" width="36" height="17" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#33475e" text-anchor="middle">
    <text x="102" y="129">0</text><text x="147" y="129">1</text><text x="192" y="129">101</text><text x="237" y="129">104</text>
  </g>
  <text x="276" y="129" font-size="11" font-weight="bold" fill="#33475e" filter="url(#sk)">← 栈 1</text>
  <g filter="url(#sk)">
    <rect x="84" y="136" width="36" height="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1" rx="3"/>
    <rect x="129" y="136" width="36" height="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1" rx="3"/>
    <rect x="174" y="136" width="36" height="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1" rx="3"/>
    <rect x="219" y="136" width="36" height="17" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1" rx="3"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="102" y="149">0</text><text x="147" y="149">7</text><text x="192" y="149">15</text><text x="237" y="149">24</text>
  </g>
  <text x="276" y="149" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">← 栈 2</text>

  <!-- init note -->
  <g filter="url(#sk)">
    <rect x="360" y="78" width="280" height="78" rx="10" fill="#f4f4ee" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="500" y="100" text-anchor="middle" font-size="11.5" fill="#666">初始：dp[0] = 0（一枚不取），</text>
  <text x="500" y="118" text-anchor="middle" font-size="11.5" fill="#666">dp[1] = dp[2] = −∞（「恰好 t 次」暂不可达）</text>
  <text x="500" y="140" text-anchor="middle" font-size="11" fill="#999">−∞ 状态不参与转移，防止「至多」污染「恰好」</text>

  <!-- round 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="170" width="600" height="128" rx="10" fill="#fffdf5" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="72" y="192" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">第 1 轮 · 处理栈 1 [1,100,3]（t = 2 → 1 倒序）</text>
  <g filter="url(#sk)">
    <rect x="72" y="202" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="188" y="202" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="304" y="202" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
  </g>
  <text x="122" y="223" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33475e" filter="url(#sk)">dp[0] = 0</text>
  <text x="238" y="223" text-anchor="middle" font-size="12.5" font-weight="bold" filter="url(#sk)"><tspan fill="#999">−∞</tspan><tspan fill="#a04038"> → 1</tspan></text>
  <text x="359" y="223" text-anchor="middle" font-size="12.5" font-weight="bold" filter="url(#sk)"><tspan fill="#999">−∞</tspan><tspan fill="#a04038"> → 101</tspan></text>
  <g font-size="11.5" fill="#7a5415">
    <text x="72" y="256" filter="url(#sk)">t=2：j=1 ⇒ dp[1]+prefix[1] = −∞+1，<tspan font-weight="bold" fill="#a04038">不可达 ✗</tspan>；  j=2 ⇒ dp[0]+prefix[2] = 0+101 = <tspan font-weight="bold">101 ✓</tspan></text>
    <text x="72" y="278" filter="url(#sk)">t=1：j=1 ⇒ dp[0]+prefix[1] = 0+1 = <tspan font-weight="bold">1 ✓</tspan>（j 的上界 min(t, len)：t=1 时 j=2 被剪掉）</text>
  </g>

  <!-- round 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="312" width="600" height="128" rx="10" fill="#f4faf4" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="72" y="334" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">第 2 轮 · 处理栈 2 [7,8,9]（t = 2 → 1 倒序）</text>
  <g filter="url(#sk)">
    <rect x="72" y="344" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="188" y="344" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="304" y="344" width="110" height="32" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2" rx="4"/>
  </g>
  <text x="122" y="365" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33475e" filter="url(#sk)">dp[0] = 0</text>
  <text x="238" y="365" text-anchor="middle" font-size="12.5" font-weight="bold" filter="url(#sk)"><tspan fill="#999">1</tspan><tspan fill="#a04038"> → 7</tspan></text>
  <text x="359" y="365" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">101 → 101（沿用）</text>
  <g font-size="11.5" fill="#2e6e2e">
    <text x="72" y="398" filter="url(#sk)">t=2：j=0 ⇒ 沿用 101；j=1 ⇒ dp[1]+7 = 1+7 = 8；j=2 ⇒ dp[0]+15 = 15 → 最大仍 <tspan font-weight="bold">101 ✓</tspan></text>
    <text x="72" y="420" filter="url(#sk)">t=1：j=1 ⇒ dp[0]+prefix[1] = 0+7 = <tspan font-weight="bold">7 ✓</tspan></text>
  </g>
  <text x="452" y="398" font-size="10.5" fill="#999" filter="url(#sk)">（dp[1]=1 是第 1 轮的旧值：倒序保证）</text>

  <!-- answer -->
  <g filter="url(#sk)">
    <rect x="40" y="454" width="600" height="88" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="340" y="478" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">答案 dp[2] = 101 ✓ —— 栈 1 取 2 枚（1+100），栈 2 取 0 枚</text>
  <text x="340" y="500" text-anchor="middle" font-size="11.5" fill="#a04038" filter="url(#sk)">对照贪心「每次取可见最大栈顶」：7 + 8 = 15 —— 栈顶小 ≠ 栈不值钱，贪心必错</text>
  <text x="340" y="522" text-anchor="middle" font-size="11" fill="#999">正序的反例：栈 [100,1]、k=2 时 t=2 会读到本轮刚更新的 dp[1]=100，得 100+100=200 &gt; 真值 101</text>
</svg>
