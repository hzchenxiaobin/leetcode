<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">竖式加法：右对齐、逐位相加、进位向左</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">num1 = "456"，num2 = "77"，计算时视作 456 + 077</text>

  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="143" y="80">百位</text>
    <text x="201" y="80">十位</text>
    <text x="259" y="80">个位</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="120" y="88" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="178" y="88" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="236" y="88" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>

    <rect x="120" y="144" width="46" height="46" rx="4" fill="none" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5 4"/>
    <rect x="178" y="144" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="236" y="144" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>

    <rect x="120" y="208" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="178" y="208" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="236" y="208" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>

  <g filter="url(#rough2)" font-size="18" font-weight="bold" text-anchor="middle">
    <text x="143" y="119" fill="#3a4a66">4</text>
    <text x="201" y="119" fill="#3a4a66">5</text>
    <text x="259" y="119" fill="#3a4a66">6</text>
    <text x="201" y="175" fill="#3a4a66">7</text>
    <text x="259" y="175" fill="#3a4a66">7</text>
    <text x="143" y="239" fill="#3a5a30">5</text>
    <text x="201" y="239" fill="#3a5a30">3</text>
    <text x="259" y="239" fill="#3a5a30">3</text>
  </g>

  <text x="96" y="180" text-anchor="middle" font-size="22" fill="#b85450" filter="url(#rough2)">+</text>
  <path d="M 108 198 L 294 198" stroke="#666" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <rect x="330" y="86" width="210" height="168" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="344" y="110" font-size="11" fill="#8a6a20" font-weight="bold">单列的处理规则</text>
    <text x="344" y="134" font-size="10" fill="#555">sum = a + b + carry</text>
    <text x="344" y="156" font-size="10" fill="#555">digit = sum mod 10</text>
    <text x="344" y="178" font-size="10" fill="#555">carry = sum div 10</text>
    <text x="344" y="204" font-size="10" fill="#3a5a30">carry 只可能是 0 或 1</text>
    <text x="344" y="222" font-size="10" fill="#888">a + b + carry ≤ 9 + 9 + 1 = 19</text>
    <text x="344" y="242" font-size="10" fill="#888">越界的位按 0 参与求和</text>
  </g>

  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">从个位向高位逐列推进，carry 依次向左传递，最高位的进位最后单独补一位</text>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">短串只在计算时右侧对齐，前导 0 绝不写进输出，因此结果不会带多余零</text>
  <text x="280" y="344" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">虚线格：num2 只有两位，百位视为 0</text>
</svg>
