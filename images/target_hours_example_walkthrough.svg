<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="800" height="470" fill="#fdfcf7"/>
  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：hours = [0,1,2,3,4]，target = 2 → 答案 3</text>
  <path d="M 230 44 Q 400 52 570 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header -->
  <g filter="url(#sk)">
    <rect x="40" y="60" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="90" y="60" width="100" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="190" y="60" width="140" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="330" y="60" width="100" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="430" y="60" width="330" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">
    <text x="65" y="82" text-anchor="middle">i</text>
    <text x="140" y="82" text-anchor="middle">hours[i]</text>
    <text x="260" y="82" text-anchor="middle">h ≥ target ?</text>
    <text x="380" y="82" text-anchor="middle">cnt</text>
    <text x="595" y="82" text-anchor="middle">说明</text>
  </g>

  <!-- row 0 -->
  <g filter="url(#sk)">
    <rect x="40" y="94" width="50" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="90" y="94" width="100" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="190" y="94" width="140" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="330" y="94" width="100" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="430" y="94" width="330" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#444" filter="url(#sk)">
    <text x="65" y="119" text-anchor="middle">0</text>
    <text x="140" y="119" text-anchor="middle">0</text>
    <text x="260" y="119" text-anchor="middle" font-weight="bold" fill="#b85450">✗</text>
    <text x="380" y="119" text-anchor="middle">0</text>
    <text x="595" y="119" text-anchor="middle">0 &lt; 2，不达标</text>
  </g>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="40" y="136" width="50" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="90" y="136" width="100" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="190" y="136" width="140" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="330" y="136" width="100" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="430" y="136" width="330" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#444" filter="url(#sk)">
    <text x="65" y="161" text-anchor="middle">1</text>
    <text x="140" y="161" text-anchor="middle">1</text>
    <text x="260" y="161" text-anchor="middle" font-weight="bold" fill="#b85450">✗</text>
    <text x="380" y="161" text-anchor="middle">0</text>
    <text x="595" y="161" text-anchor="middle">1 &lt; 2，仍不达标</text>
  </g>

  <!-- row 2 : equality case, highlighted -->
  <g filter="url(#sk)">
    <rect x="40" y="178" width="50" height="42" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="90" y="178" width="100" height="42" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="190" y="178" width="140" height="42" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="330" y="178" width="100" height="42" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="430" y="178" width="330" height="42" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <g font-size="12.5" filter="url(#sk)">
    <text x="65" y="203" text-anchor="middle" fill="#7a5415" font-weight="bold">2</text>
    <text x="140" y="203" text-anchor="middle" fill="#7a5415" font-weight="bold">2</text>
    <text x="260" y="203" text-anchor="middle" font-weight="bold" fill="#a8781e">✓</text>
    <text x="380" y="203" text-anchor="middle" fill="#7a5415" font-weight="bold">1</text>
    <text x="595" y="203" text-anchor="middle" fill="#7a5415" font-weight="bold">恰好 = target 也算——「至少」含等号！</text>
  </g>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="220" width="50" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="90" y="220" width="100" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="190" y="220" width="140" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="330" y="220" width="100" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="430" y="220" width="330" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#444" filter="url(#sk)">
    <text x="65" y="245" text-anchor="middle">3</text>
    <text x="140" y="245" text-anchor="middle">3</text>
    <text x="260" y="245" text-anchor="middle" font-weight="bold" fill="#4a7a3a">✓</text>
    <text x="380" y="245" text-anchor="middle">2</text>
    <text x="595" y="245" text-anchor="middle">3 ≥ 2，达标</text>
  </g>

  <!-- row 4 -->
  <g filter="url(#sk)">
    <rect x="40" y="262" width="50" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="90" y="262" width="100" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="190" y="262" width="140" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="330" y="262" width="100" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="430" y="262" width="330" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#444" filter="url(#sk)">
    <text x="65" y="287" text-anchor="middle">4</text>
    <text x="140" y="287" text-anchor="middle">4</text>
    <text x="260" y="287" text-anchor="middle" font-weight="bold" fill="#4a7a3a">✓</text>
    <text x="380" y="287" text-anchor="middle" font-weight="bold" fill="#2e6e2e">3</text>
    <text x="595" y="287" text-anchor="middle">4 ≥ 2，达标</text>
  </g>

  <!-- answer -->
  <g filter="url(#sk)"><rect x="40" y="318" width="720" height="44" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="400" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">最终 cnt = 3——员工 2、3、4 达标 ✓</text>

  <!-- bottom notes -->
  <g filter="url(#sk)"><rect x="40" y="380" width="352" height="78" rx="9" fill="#fdfcf7" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="58" y="404" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2：hours = [5,1,4,2,2]，target = 6</text>
  <text x="58" y="424" font-size="10.5" fill="#444" filter="url(#sk)">max = 5 &lt; 6，五个比较全为否</text>
  <text x="58" y="444" font-size="10.5" fill="#444" filter="url(#sk)">cnt 全程 0 → 返回 0 ✓（初值即答案，无需特判）</text>

  <g filter="url(#sk)"><rect x="412" y="380" width="348" height="78" rx="9" fill="#fdfcf7" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="430" y="404" font-size="11.5" font-weight="bold" fill="#8f3a36" filter="url(#sk)">易错对照：若把 ≥ 误写成 &gt;</text>
  <text x="430" y="424" font-size="10.5" fill="#444" filter="url(#sk)">员工 2（恰好 2 小时）被漏掉</text>
  <text x="430" y="444" font-size="10.5" fill="#444" filter="url(#sk)">会错答 2 ✗——量词「至少」必须翻译成 ≥</text>
</svg>
