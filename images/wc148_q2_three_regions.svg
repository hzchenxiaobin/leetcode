<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">染红 x 之后，整棵树被切成三个互不相通的区域</text>
  <text x="360" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">任何跨区域的染色都必须经过 x，而 x 已被染红 → 三条通道同时锁死</text>
  <rect x="285" y="84" width="150" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="360" y="108" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">父方区域</text>
  <text x="360" y="130" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">p = n − 1 − l − r</text>
  <rect x="45" y="176" width="160" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="125" y="202" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">左子树</text>
  <text x="125" y="224" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">l 个节点</text>
  <rect x="515" y="176" width="160" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="595" y="202" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">右子树</text>
  <text x="595" y="224" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">r 个节点</text>
  <path d="M 360 170 L 360 150" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 326 200 L 209 200" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 394 200 L 511 200" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="360" cy="200" r="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="204" text-anchor="middle" font-size="17" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="360" y="246" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">红</text>
  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">二号的最优落子 y 必是 x 的邻节点：堵住哪条通道，就独吞哪一块</text>
  <text x="360" y="328" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">M = max(l, r, p) → 二号 M 个、一号 n − M 个 → 必胜 ⟺ M > n / 2</text>
  <text x="360" y="356" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">n 为奇数 ⇒ 不会平局，M > ⌊n/2⌋ 即严格过半</text>
</svg>
