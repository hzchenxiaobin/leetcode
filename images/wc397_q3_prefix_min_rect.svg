<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 404"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="404" fill="#fafafa"/>
  <text x="270" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">算法模型：可选起点区域 = 挖掉自身的左上矩形</text>
  <text x="270" y="46" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">以示例 1 的终点 (2,2) 为例——上块 ∪ 左块，无遗漏、重叠无害</text>

  <!-- region labels above grid -->
  <text x="188" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">上方块 [0..i−1] × [0..j]</text>
  <text x="296" y="82" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">不可达 ✗</text>

  <!-- grid 4 cols x 3 rows, origin (110,90), cell 52x44 -->
  <g filter="url(#rough2)">
    <rect x="110" y="90" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="162" y="90" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="214" y="90" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="266" y="90" width="52" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
    <rect x="110" y="134" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="162" y="134" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="214" y="134" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="266" y="134" width="52" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
    <rect x="110" y="178" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="162" y="178" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="214" y="178" width="52" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="266" y="178" width="52" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
  </g>
  <g filter="url(#rough2)">
    <text x="136" y="117" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">9</text>
    <text x="188" y="117" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">5</text>
    <text x="240" y="117" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">7</text>
    <text x="292" y="117" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#999">3</text>
    <text x="136" y="161" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">8</text>
    <text x="188" y="161" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">9</text>
    <text x="240" y="161" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">6</text>
    <text x="292" y="161" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#999">1</text>
    <text x="136" y="205" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">6</text>
    <text x="188" y="205" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#333">7</text>
    <text x="240" y="205" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">14</text>
    <text x="292" y="205" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#999">3</text>
  </g>

  <!-- region labels below grid with leader arrows -->
  <path d="M 150 240 L 150 226" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="150" y="256" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">左块 [i] × [0..j−1]</text>
  <path d="M 244 240 L 244 226" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="244" y="256" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">终点 (i,j)</text>

  <!-- right panel: three formula boxes -->
  <g filter="url(#rough2)">
    <rect x="350" y="90" width="184" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)">
    <text x="442" y="112" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">best = min(上块, 左块)</text>
    <text x="442" y="136" text-anchor="middle" font-size="10" fill="#d6a040">＝ 挖掉自身后的最小起点值</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="350" y="168" width="184" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)">
    <text x="442" y="190" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">ans = max(ans,</text>
    <text x="442" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">grid[i][j] − best)</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="350" y="244" width="184" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)">
    <text x="442" y="266" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">premin[i][j] =</text>
    <text x="442" y="286" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">min(grid[i][j], best)</text>
    <text x="442" y="302" text-anchor="middle" font-size="9.5" fill="#446688">（含自身，传给右下方复用）</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="40" y="330" width="460" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
  </g>
  <text x="270" y="354" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">任何 ≠ (i,j) 的区域内格子：行号 &lt; i（落入上块），或行号 = i 且列号 &lt; j（落入左块）</text>
  <text x="270" y="376" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">min 幂等：上块与左块的重叠部分被取两次也不影响结果，无需真的「挖洞」</text>
</svg>
