<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">先消去重叠：最优铺法总可不重叠、不悬空</text>

  <!-- 上：重叠示例 -->
  <g filter="url(#rough2)" font-size="13" fill="#b85450" font-weight="bold">
    <text x="52" y="72">允许出现的重叠：</text>
  </g>
  <!-- 砖块 -->
  <g filter="url(#rough2)">
    <rect x="200" y="56" width="44" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="244" y="56" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="288" y="56" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3"/>
    <rect x="332" y="56" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="376" y="56" width="44" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="3"/>
  </g>
  <!-- 两条毯子，第二条与第一条重叠 -->
  <g filter="url(#rough2)">
    <rect x="222" y="36" width="88" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="266" y="20" width="88" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#666">
    <text x="240" y="100">重叠区被盖了两次 → 浪费</text>
  </g>

  <!-- 中间箭头 -->
  <g filter="url(#rough2)">
    <path d="M 280 112 C 280 128, 280 134, 280 146" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)"/>
  </g>
  <text x="298" y="136" font-size="12.5" fill="#446688" filter="url(#rough2)">右边那条右移一格，覆盖不减</text>

  <!-- 下：不重叠示例 -->
  <g filter="url(#rough2)" font-size="13" fill="#4a7a3a" font-weight="bold">
    <text x="52" y="176">等价的不重叠铺法：</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="200" y="160" width="44" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="244" y="160" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="288" y="160" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3"/>
    <rect x="332" y="160" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <rect x="376" y="160" width="44" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="3"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="222" y="140" width="88" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="310" y="124" width="88" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#666">
    <text x="240" y="204">腾出的区段本就被左毯盖住，覆盖集合不减</text>
  </g>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="52" y="232" width="460" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" fill="#5a4a20">
    <text x="70" y="260">于是可以按「前 i 块砖」分阶段决策：</text>
    <text x="70" y="284">dp[i][j] = 前 i 块砖用 j 条毯（不重叠）的最少露出白砖</text>
    <text x="70" y="308">每条毯子贴着已处理前缀的右端铺，天然无重叠</text>
  </g>
</svg>
