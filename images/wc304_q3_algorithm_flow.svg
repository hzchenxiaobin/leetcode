<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 505"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#555" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="505" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两趟打标记 + 一趟枚举</text>

  <ellipse cx="280" cy="58" rx="44" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 280 75 L 280 88" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <rect x="155" y="92" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="113" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">dist₁、dist₂ ← 全部 −1</text>

  <path d="M 280 126 L 280 142" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <rect x="155" y="146" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="167" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">对 s = node1 与 node2 各一趟：u = s，d = 0</text>

  <path d="M 280 180 L 280 202" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <polygon points="280,206 358,246 280,286 202,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">u = −1 或</text>
  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">dist[u] ≠ −1 ？</text>

  <path d="M 358 246 L 396 246" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="374" y="238" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="400" y="226" width="134" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="467" y="242" text-anchor="middle" font-size="11" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">本趟结束</text>
  <text x="467" y="258" text-anchor="middle" font-size="10.5" fill="#2f5a24" filter="url(#rough2)">该起点的 dist 完成</text>

  <path d="M 280 286 L 280 304" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="296" y="300" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="175" y="308" width="210" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="325" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">标记 dist[u] = d；d ← d + 1</text>
  <text x="280" y="343" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">u ← edges[u]</text>

  <path d="M 175 330 L 105 330 L 105 246 L 196 246" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="105" y="222" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">循环打标记</text>

  <path d="M 467 266 L 467 356 L 409 356" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <rect x="155" y="338" width="250" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="355" text-anchor="middle" font-size="11" fill="#2f5a24" filter="url(#rough2)">枚举 i = 0 … n−1</text>
  <text x="280" y="371" text-anchor="middle" font-size="10.5" fill="#2f5a24" filter="url(#rough2)">跳过 dist₁[i] 或 dist₂[i] 为 −1 的 i</text>

  <path d="M 280 376 L 280 396" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <polygon points="280,400 352,432 280,464 208,432" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">max(dist₁[i], dist₂[i])</text>
  <text x="280" y="444" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">&lt; best ？</text>

  <path d="M 352 432 L 390 432" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="368" y="424" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="394" y="412" width="128" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="458" y="428" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">best ← max</text>
  <text x="458" y="444" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">ans ← i</text>

  <path d="M 208 432 L 138 432 L 138 357 L 151 357" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="184" y="424" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="138" y="390" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">下一 i</text>

  <path d="M 458 452 L 458 471 L 285 471" fill="none" stroke="#555" stroke-width="1.7" marker-end="url(#arrf)" filter="url(#rough2)"/>

  <ellipse cx="280" cy="487" rx="92" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="492" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">返回 ans（无公共可达节点则 −1）</text>
</svg>
