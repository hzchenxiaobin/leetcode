<svg xmlns="http://www.w3.org/2000/svg" width="620" height="420" viewBox="0 0 620 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="45" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="420" fill="#fafafa"/>
  <text x="310.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：n = 15 枚举段长 k</text>
  <path d="M 160.0 44 Q 310.0 54 460.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="60" y="88" width="520" height="27" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="85.0" y="106.36" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">k</text>
  <text x="165.0" y="106.36" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">k(k+1)/2</text>
  <text x="275.0" y="106.36" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">n−k(k−1)/2</text>
  <text x="375.0" y="106.36" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">mod k</text>
  <text x="450.0" y="106.36" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">a</text>
  <text x="530.0" y="106.36" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">拆法</text>
  <g filter="url(#rough2)"><rect x="60" y="115" width="520" height="27" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="85.0" y="133.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="165.0" y="133.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="275.0" y="133.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="375.0" y="133.9" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">0 ✓</text>
  <text x="450.0" y="133.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="530.0" y="133.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[15]</text>
  <g filter="url(#rough2)"><rect x="60" y="142" width="520" height="27" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="85.0" y="160.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="165.0" y="160.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="275.0" y="160.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">14</text>
  <text x="375.0" y="160.9" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">0 ✓</text>
  <text x="450.0" y="160.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="530.0" y="160.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[7,8]</text>
  <g filter="url(#rough2)"><rect x="60" y="169" width="520" height="27" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="85.0" y="187.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="165.0" y="187.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="275.0" y="187.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="375.0" y="187.9" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">0 ✓</text>
  <text x="450.0" y="187.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="530.0" y="187.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[4,5,6]</text>
  <g filter="url(#rough2)"><rect x="60" y="196" width="520" height="27" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="85.0" y="214.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="165.0" y="214.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="275.0" y="214.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="375.0" y="214.9" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">1 ✗</text>
  <text x="450.0" y="214.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="530.0" y="214.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">—</text>
  <g filter="url(#rough2)"><rect x="60" y="223" width="520" height="27" rx="3" fill="#ffffff" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="85.0" y="241.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="165.0" y="241.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="275.0" y="241.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="375.0" y="241.9" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">0 ✓</text>
  <text x="450.0" y="241.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="530.0" y="241.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1..5]</text>
  <g filter="url(#rough2)"><rect x="60" y="250" width="520" height="27" rx="3" fill="#f4f6fa" stroke="#b9c2cf" stroke-width="1"/></g>
  <text x="85.0" y="268.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="165.0" y="268.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">21</text>
  <text x="275.0" y="268.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="375.0" y="268.9" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">超界</text>
  <text x="450.0" y="268.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="530.0" y="268.9" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">停止</text>
  <text x="310" y="300" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">k = 6 时 k(k+1)/2 = 21 &gt; 15，枚举结束</text>
  <g filter="url(#rough2)"><rect x="80" y="318" width="460" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="310.0" y="340" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">合法 k 为 1、2、3、5，共 4 组：15、7+8、4+5+6、1+2+3+4+5</text>
  <text x="310.0" y="358" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">整除判定一次覆盖「能拆」与「a 为正整数」两个条件</text>
  </svg>