<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：字符三分——空格与数字在「是字母」门口就被拦下</text>

  <!-- 演示串 s = "ab 1o" -->
  <text x="204" y="64" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">s =</text>
  <rect x="214" y="44" width="36" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="258" y="44" width="36" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="302" y="44" width="36" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="64" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">␣</text>
  <rect x="346" y="44" width="36" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="364" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="390" y="44" width="36" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">o</text>

  <path d="M320,80 L320,98" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="94" text-anchor="start" font-size="9.5" fill="#666" filter="url(#rough2)">逐个字符</text>

  <!-- 门卫菱形：是字母？ -->
  <polygon points="320,100 430,130 320,160 210,130" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="134" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">是字母？（isalpha）</text>

  <!-- 否：丢弃 -->
  <text x="198" y="122" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M210,130 L184,130" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="108" width="148" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="126" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">空格 / 数字 → 丢弃</text>
  <text x="110" y="143" text-anchor="middle" font-size="9" fill="#a0433f" filter="url(#rough2)">既不算 v 也不算 c</text>

  <!-- 是：往下判元音 -->
  <text x="330" y="176" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M320,160 L320,178" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：是元音？ -->
  <polygon points="320,178 440,210 320,242 200,210" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="207" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">是元音？</text>
  <text x="320" y="224" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">{a, e, i, o, u}</text>

  <!-- 是：v 桶 -->
  <text x="187" y="202" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是（元音）</text>
  <path d="M200,210 L174,210" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="28" y="188" width="142" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="99" y="207" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">v ← v + 1</text>
  <text x="99" y="224" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">a、o 落入 → v = 2</text>

  <!-- 否：c 桶 -->
  <text x="455" y="202" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">否（辅音）</text>
  <path d="M440,210 L466,210" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="470" y="188" width="142" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="541" y="207" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">c ← c + 1</text>
  <text x="541" y="224" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">b 落入 → c = 1</text>

  <!-- 得分公式 -->
  <rect x="110" y="268" width="420" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="291" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">score = ⌊v / c⌋（若 c &gt; 0）</text>
  <text x="320" y="312" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">score = 0（若 c = 0，防除零）</text>

  <text x="320" y="346" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">演示串 "ab 1o"：v = 2，c = 1 → score = ⌊2 / 1⌋ = 2</text>

  <!-- 底部警示 -->
  <rect x="60" y="358" width="520" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="376" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">⚠️ 判定顺序不能反：「不是元音就当辅音」会把空格 / 数字误计入 c</text>
  <text x="320" y="392" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">反例 "ab 1"：正确 v=1、c=1 → 1；误算 v=1、c=3 → 0——官方三组示例都测不出</text>
</svg>
