<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">环 = 删掉环上任意一条边后的「绕行最短路」+ 1</text>

  <!-- 左图：四边形 3-4-5-6 -->
  <g filter="url(#rough2)">
    <ellipse cx="130" cy="120" rx="22" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="130" y="126" text-anchor="middle" font-size="14" fill="#333">u</text>
    <ellipse cx="250" cy="120" rx="22" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="250" y="126" text-anchor="middle" font-size="14" fill="#333">v</text>
    <ellipse cx="250" cy="240" rx="22" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="250" y="246" text-anchor="middle" font-size="14" fill="#333">c</text>
    <ellipse cx="130" cy="240" rx="22" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="130" y="246" text-anchor="middle" font-size="14" fill="#333">d</text>
    <!-- 被删的边 u-v：红色虚线叉掉 -->
    <path d="M 152 120 L 228 120" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 6" fill="none"/>
    <path d="M 180 108 L 200 132 M 200 108 L 180 132" stroke="#b85450" stroke-width="2.4" fill="none"/>
    <!-- 绕行路 u-d-c-v：绿色粗线 -->
    <path d="M 130 142 C 130 190, 130 190, 130 218" stroke="#4a7a3a" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 130 262 C 130 300, 250 300, 250 264" stroke="#4a7a3a" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 250 218 C 250 190, 250 190, 250 142" stroke="#4a7a3a" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="190" y="100" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">删边 e = (u, v)</text>
  <text x="190" y="286" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">绕行路 d = 3（三条边）</text>

  <!-- 中间箭头 -->
  <path d="M 300 180 L 340 180" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧公式 -->
  <rect x="352" y="86" width="180" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="442" y="113" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">环长 = d + 1 = 4</text>
  <rect x="352" y="146" width="180" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="442" y="172" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">反过来：任何环 C 被它</text>
  <text x="442" y="192" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">自己的每条边 e 枚举到：</text>
  <text x="442" y="212" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">dₑ + 1 ≤ |C|</text>

  <text x="280" y="316" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">BFS 保证绕行路是简单路径 → 路径 + 被删边 = 简单环</text>
</svg>
