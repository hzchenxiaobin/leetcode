<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：nums = [20, 1, 15]，x = 5，n = 3</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="30" y="56" width="580" height="80" rx="10" fill="#ffffff" stroke="#d5d5cc" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="44" y="76" width="58" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="73" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">k = 0</text>
  <text x="274" y="72" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">cost（窗口 = 位置 t 自身）</text>
  <g filter="url(#sk)">
    <rect x="170" y="78" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="224" y="78" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="278" y="78" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="192" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">20</text>
  <text x="246" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">1</text>
  <text x="300" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">15</text>
  <text x="390" y="99" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">Σ = 36</text>
  <text x="468" y="99" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">+ 0·5</text>
  <text x="560" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">36</text>

  <g filter="url(#sk)">
    <rect x="30" y="146" width="580" height="80" rx="10" fill="#ffffff" stroke="#d5d5cc" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="44" y="166" width="58" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="73" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">k = 1</text>
  <text x="274" y="162" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">cost（新增位置 (t−1) mod 3）</text>
  <g filter="url(#sk)">
    <rect x="170" y="168" width="44" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="224" y="168" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="278" y="168" width="44" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="192" y="189" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e24" filter="url(#sk)">15</text>
  <text x="246" y="189" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">1</text>
  <text x="300" y="189" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e24" filter="url(#sk)">1</text>
  <text x="390" y="189" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">Σ = 17</text>
  <text x="468" y="189" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">+ 1·5</text>
  <text x="560" y="189" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">22</text>
  <text x="320" y="216" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">T0 借位置 2（20 → 15）；T2 借位置 1（15 → 1）；T1 已是 1 不动</text>

  <g filter="url(#sk)">
    <rect x="30" y="236" width="580" height="80" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="44" y="256" width="58" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="73" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">k = 2</text>
  <text x="274" y="252" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">cost（新增位置 (t−2) mod 3）</text>
  <g filter="url(#sk)">
    <rect x="170" y="258" width="44" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="224" y="258" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="278" y="258" width="44" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="192" y="279" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e24" filter="url(#sk)">1</text>
  <text x="246" y="279" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">1</text>
  <text x="300" y="279" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">1</text>
  <text x="390" y="279" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">Σ = 3</text>
  <text x="468" y="279" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">+ 2·5</text>
  <text x="560" y="279" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">13 ✔</text>
  <text x="320" y="306" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#sk)">T0 借位置 1（15 → 1）：三个类型轮流蹭同一个最便宜的位置 1</text>

  <g filter="url(#sk)">
    <rect x="30" y="328" width="580" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="320" y="348" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">ans = min{ 36, 22, 13 } = 13（收集 3 + 操作 2 × 5）</text>
  <text x="320" y="366" text-anchor="middle" font-size="10" fill="#2e5e24" filter="url(#sk)">位置 1 的「1 元巧克力」在三个时刻被三种类型各买一次——便宜位置可复用</text>

  <g filter="url(#sk)">
    <rect x="30" y="388" width="580" height="56" rx="10" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3"/>
  </g>
  <text x="320" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">示例 2：nums = [1, 2, 3]，x = 4 → ans = 6（k = 0 直接最优）</text>
  <text x="320" y="428" text-anchor="middle" font-size="10" fill="#777" filter="url(#sk)">k = 1 时收集和虽降到 4，但 4 + 1×4 = 8 &gt; 6：x 太贵，省下的钱追不上操作费</text>
</svg>
