<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="450" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">一趟扫描：按右端点计数，每步 ans += run</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">run = 以 i 结尾的最长合法后缀长度 = 以 i 结尾的合法子数组个数（同一个量）</text>

  <!-- 数组格子 -->
  <rect x="105" y="66" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="225" y="66" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="345" y="66" width="70" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="380" y="88" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="465" y="66" width="70" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="88" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <text x="140" y="122" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i = 0</text>
  <text x="260" y="122" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i = 1</text>
  <text x="380" y="122" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i = 2</text>
  <text x="500" y="122" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i = 3</text>

  <!-- run 柱状图 -->
  <line x1="90" y1="330" x2="555" y2="330" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="115" y="275" width="50" height="55" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="266" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">run = 1</text>
  <rect x="235" y="220" width="50" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="211" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">run = 2</text>
  <rect x="355" y="322" width="50" height="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="380" y="312" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">run = 0</text>
  <rect x="475" y="275" width="50" height="55" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="266" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">run = 1</text>

  <!-- 各列以 i 结尾的合法子数组 -->
  <text x="140" y="352" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[4]</text>
  <text x="260" y="368" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1,4]</text>
  <text x="380" y="352" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">（无，墙清零）</text>
  <text x="500" y="352" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[3]</text>

  <!-- ans 累计条 -->
  <rect x="60" y="386" width="520" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="407" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">ans 依次累计：1 → 3 → 3 → 4，扫完即答案</text>

  <text x="320" y="440" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个合法子数组有唯一右端点，按右端点数恰好一次 —— 不重不漏</text>
</svg>
