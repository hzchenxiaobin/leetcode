<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">节点 u 处的聚合：top-2 异字链拼接</text>

  <!-- Return arrow above u -->
  <path d="M 235 72 L 235 46" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)" marker-end="url(#arrB)"/>
  <text x="248" y="58" font-size="10.5" fill="#446688" font-weight="bold">向父返回 chain(u) = 1 + max1</text>

  <!-- Node u -->
  <circle cx="235" cy="95" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="235" y="101" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">u</text>
  <text x="235" y="82" text-anchor="middle" font-size="8.5" fill="#888">s[u]</text>

  <!-- Edges u to children -->
  <path d="M 220 110 L 115 185" stroke="#4a7a3a" stroke-width="2.5" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M 250 110 L 405 185" stroke="#4a7a3a" stroke-width="2.5" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M 235 117 L 260 185" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <path d="M 241 142 L 256 156" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <path d="M 256 142 L 241 156" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <text x="285" y="150" font-size="9.5" fill="#b85450" font-weight="bold">s[c₂]==s[u] ✗</text>

  <!-- Child c1 with long chain -->
  <circle cx="115" cy="192" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="115" y="197" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c₁</text>
  <path d="M 115 207 L 115 238" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="115" cy="248" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 115 257 L 115 278" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="115" cy="288" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 115 297 L 115 318" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="115" cy="328" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="97" y="296" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold">max1 = 4</text>

  <!-- Child c2 same-char, its subtree still recursed -->
  <circle cx="260" cy="192" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="197" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c₂</text>
  <ellipse cx="260" cy="262" rx="52" ry="26" fill="#f3f3f3" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="10" fill="#777">c₂ 的子树</text>
  <text x="260" y="272" text-anchor="middle" font-size="9.5" fill="#777">（内部仍可能有答案）</text>

  <!-- Child c3 with short chain -->
  <circle cx="405" cy="192" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="405" y="197" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c₃</text>
  <path d="M 405 207 L 405 238" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <circle cx="405" cy="248" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="423" y="252" font-size="10.5" fill="#4a7a3a" font-weight="bold">max2 = 2</text>

  <!-- Formula boxes -->
  <rect x="40" y="318" width="440" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">穿过 u 的候选：path(u) = 1 + max1 + max2 → ans 打擂台</text>

  <rect x="40" y="360" width="440" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="382" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">向父返回 chain(u) = 1 + max1（max2 不带走，一条链只能伸一个方向）</text>

  <text x="260" y="406" text-anchor="middle" font-size="10" fill="#888">max1/max2 必须来自不同孩子 | 同字孩子：链丢弃，递归不丢弃</text>
</svg>
