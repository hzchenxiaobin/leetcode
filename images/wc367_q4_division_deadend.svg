<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="920" height="440" fill="#fafafa"/>

  <text x="460" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">「总积 ÷ 自身」的三重死路 → 前后缀生路</text>
  <path d="M 300 42 Q 460 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 顶部：赛时直觉 -->
  <rect x="245" y="58" width="430" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="85" text-anchor="middle" font-size="13" fill="#7a5415" filter="url(#rough2)">赛时第一直觉：先算总积 T，再 p[k] = T ÷ a[k] ？</text>

  <!-- 三条分叉箭头 -->
  <path d="M 460 102 C 380 122, 220 118, 158 130" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 460 102 L 460 130" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 460 102 C 540 122, 700 118, 762 130" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="172" y="128" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="474" y="128" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="776" y="128" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 死路 1 -->
  <rect x="15" y="134" width="280" height="118" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="155" y="160" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">① 数值爆炸</text>
  <text x="155" y="182" text-anchor="middle" font-size="11" fill="#7a3530" filter="url(#rough2)">N = 10⁵ 个 ≤ 10⁹ 的数相乘</text>
  <text x="155" y="200" text-anchor="middle" font-size="11" fill="#7a3530" filter="url(#rough2)">乘积多达百万位十进制数字</text>
  <text x="155" y="218" text-anchor="middle" font-size="11" fill="#7a3530" filter="url(#rough2)">C++ 存不下，Python 也太慢</text>

  <!-- 死路 2 -->
  <rect x="320" y="134" width="280" height="118" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="160" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">② 合数模，逆元缺失</text>
  <text x="460" y="182" text-anchor="middle" font-size="11" fill="#7a3530" filter="url(#rough2)">12345 = 3 × 5 × 823（合数）</text>
  <text x="460" y="200" text-anchor="middle" font-size="11" fill="#7a3530" filter="url(#rough2)">逆元存在 ⇔ gcd(x, 12345) = 1</text>
  <text x="460" y="218" text-anchor="middle" font-size="11" fill="#7a3530" filter="url(#rough2)">含因子 3 / 5 / 823 的元素都除不了</text>

  <!-- 死路 3 -->
  <rect x="625" y="134" width="280" height="118" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="765" y="160" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">③ 零因子，信息丢失</text>
  <text x="765" y="182" text-anchor="middle" font-size="11" fill="#7a3530" filter="url(#rough2)">T mod 12345 = 0 后无法还原</text>
  <text x="765" y="200" text-anchor="middle" font-size="11" fill="#7a3530" filter="url(#rough2)">零因子还会分散在各格</text>
  <text x="765" y="218" text-anchor="middle" font-size="11" fill="#7a3530" filter="url(#rough2)">3 × 5 × 823 ≡ 0，数零也没用</text>

  <!-- 汇合括线 -->
  <path d="M 15 262 L 15 272" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 905 262 L 905 272" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 15 268 L 905 268" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="460" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">三条「除法捷径」全部堵死</text>

  <!-- 转向箭头 -->
  <path d="M 460 296 L 460 320" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="478" y="312" font-size="11" fill="#4a7a3a" filter="url(#rough2)">换一条路</text>

  <!-- 生路 -->
  <rect x="160" y="322" width="600" height="100" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="460" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">生路：前缀积 × 后缀积（全程无除法）</text>
  <text x="460" y="378" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">p[k] = pre[k] × suf[k] mod 12345</text>
  <text x="460" y="402" text-anchor="middle" font-size="11.5" fill="#3a5a3a" filter="url(#rough2)">两个因子都不含 a[k]，天然跳过自身 —— 任意模数通用</text>
</svg>
