<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">状态转移：相等取左上，不等取 min(上, 左) + 1</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">dp[i][j] = 使 word1 前 i 个字符与 word2 前 j 个字符相同的最小删除步数</text>

  <polygon points="320,78 458,110 320,142 182,110" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="106" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">word1[i-1] ==</text>
  <text x="320" y="124" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">word2[j-1] ?</text>

  <path d="M 182 110 C 168 142 166 166 164 186" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 458 110 C 472 142 474 166 476 186" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="158" font-size="11" fill="#4a7a3a" filter="url(#rough2)">相等</text>
  <text x="492" y="158" font-size="11" fill="#b85450" filter="url(#rough2)">不等</text>

  <rect x="40" y="190" width="250" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="165" y="214" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">dp[i][j] = dp[i-1][j-1]</text>
  <text x="165" y="236" text-anchor="middle" font-size="10.5" fill="#5a7a50" filter="url(#rough2)">这一对字符都保留，不产生删除</text>

  <rect x="350" y="190" width="250" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="475" y="210" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">dp[i][j] = min(dp[i-1][j],</text>
  <text x="475" y="226" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">dp[i][j-1]) + 1</text>
  <text x="475" y="244" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">必删其中一个字符，多花 1 步</text>

  <rect x="220" y="300" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="328" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">答案 = dp[m][n]</text>

  <path d="M 165 254 C 185 278 224 294 248 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 475 254 C 455 278 416 294 392 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="352" width="300" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="320" y="373" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">边界：dp[0][j] = j ，dp[i][0] = i</text>
</svg>
