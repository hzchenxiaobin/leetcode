<svg xmlns="http://www.w3.org/2000/svg" width="660" height="412" viewBox="0 0 660 412" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="412" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#r)">按 d 归并容斥：(q, 2q) 配对，q &gt; n 时自动抵消</text>
  <text x="330" y="50" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">ans = −Σ μ(d)·|A_d|，d 取遍所有「质因子都 ≤ n」的无平方因子数；只需按 lcm 归并一次</text>

  <!-- three boxes -->
  <g filter="url(#r)">
    <rect x="42" y="72" width="176" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="242" y="72" width="176" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="442" y="72" width="176" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="130" y="96" fill="#33517a" font-weight="bold" filter="url(#r)">奇数 d = q</text>
    <text x="130" y="120" fill="#33517a" filter="url(#r)">μ(q) = (−1)^ω(q)</text>
    <text x="130" y="144" fill="#33517a" filter="url(#r)">项：−μ(q)·f(q)</text>
    <text x="330" y="96" fill="#2e6e2e" font-weight="bold" filter="url(#r)">偶数 d = 2q</text>
    <text x="330" y="120" fill="#2e6e2e" filter="url(#r)">μ(2q) = −μ(q)</text>
    <text x="330" y="144" fill="#2e6e2e" filter="url(#r)">项：+μ(q)·f(2q)</text>
    <text x="530" y="96" fill="#a87f2a" font-weight="bold" filter="url(#r)">若 q &gt; n</text>
    <text x="530" y="120" fill="#a87f2a" filter="url(#r)">f(q) = f(2q)</text>
    <text x="530" y="144" fill="#a87f2a" filter="url(#r)">两项相加 = 0</text>
  </g>
  <path d="M 222 124 L 238 124" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  <path d="M 422 124 L 438 124" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- merged -->
  <g filter="url(#r)">
    <rect x="118" y="206" width="424" height="76" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <path d="M 130 178 C 130 196 200 190 260 204" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <path d="M 330 178 L 330 202" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="330" y="232" text-anchor="middle" font-size="13.5" fill="#33517a" font-weight="bold" filter="url(#r)">合并后：−μ(q)·( f(q) − f(2q) )</text>
  <text x="330" y="258" text-anchor="middle" font-size="12" fill="#666" filter="url(#r)">于是只需枚举 3 ≤ q ≤ n 的奇数无平方因子数</text>

  <!-- final formula -->
  <g filter="url(#r)">
    <rect x="42" y="298" width="576" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="330" y="324" text-anchor="middle" font-size="14" fill="#8a3b38" font-weight="bold" filter="url(#r)">ans = f(2) − Σ_{3 ≤ q ≤ n, q 奇且无平方因子} μ(q)·( f(q) − f(2q) )</text>
  <text x="330" y="346" text-anchor="middle" font-size="11.5" fill="#8a3b38" filter="url(#r)">d = 2 单独成项：f(2) = n!/(n−⌊n/2⌋)!</text>

  <text x="330" y="386" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#r)">q &gt; n 时没有「d 的倍数」被删，也没有奇倍数中心，两个集合的局部断点完全相同 ⇒ f(q) = f(2q)</text>
</svg>
