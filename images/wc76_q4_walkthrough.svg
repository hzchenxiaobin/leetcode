  <text x="545.0" y="111.0" text-anchor="middle" font-size="12.5" fill="#aaaaaa" filter="url(#rough2)">0</text>
  <rect x="564" y="90" width="34" height="34" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="581.0" y="111.0" text-anchor="middle" font-size="12.5" fill="#aaaaaa" filter="url(#rough2)">0</text>
  <rect x="456" y="126" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="473.0" y="147.0" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">1</text>
  <rect x="492" y="126" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="509.0" y="147.0" text-anchor="middle" font-size="12.5" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <rect x="528" y="126" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="545.0" y="147.0" text-anchor="middle" font-size="12.5" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <rect x="564" y="126" width="34" height="34" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="581.0" y="147.0" text-anchor="middle" font-size="12.5" fill="#aaaaaa" filter="url(#rough2)">0</text>

  <path d="M 190 124 L 240 124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="215" y="116" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">预删</text>
  <path d="M 398 124 L 448 124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="423" y="116" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">逆序恢复</text>

  <text x="112" y="178" text-anchor="middle" font-size="9.8" fill="#8a3a36" filter="url(#rough2)">稳定 1 块（只剩 (0,0)）</text>
  <text x="320" y="178" text-anchor="middle" font-size="9.8" fill="#666" filter="url(#rough2)">稳定 1 块：(1,1)(1,2) 悬空不算</text>
  <text x="528" y="178" text-anchor="middle" font-size="9.8" fill="#3a5a30" filter="url(#rough2)">稳定 4 块：(0,0)(1,0)(1,1)(1,2)</text>

  <rect x="40" y="192" width="580" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="214" font-size="9.9" fill="#8a6a20" filter="url(#rough2)">逆序 i = 0：before = size(top) − 1 = 1；恢复 (1,0) 后 after = 4</text>
  <text x="60" y="234" font-size="9.9" fill="#8a6a20" filter="url(#rough2)">ans[0] = max(0, after − before − 1) = max(0, 4 − 1 − 1) = 2</text>
  <text x="60" y="252" font-size="9.6" fill="#555" filter="url(#rough2)">正序校验：消除 (1,0) 后 (1,1)、(1,2) 与顶部断开，一起掉落 → 答案 [2] ✓</text>

  <rect x="28" y="270" width="604" height="146" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="46" y="290" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">补充：为什么必须与 0 取 max —— grid = [[1],[1],[1]]，hits = [[1,0],[2,0]]</text>
  <text x="46" y="312" font-size="9.6" fill="#3a5a30" filter="url(#rough2)">逆序 i = 1：before = 1，恢复 (2,0) 后 after = 1 → max(0, −1) = 0</text>
  <text x="46" y="330" font-size="9.4" fill="#666" filter="url(#rough2)">　（(2,0) 在更早的消除里已经掉落，(1,0) 还空着，恢复它救不活任何砖）</text>
  <text x="46" y="352" font-size="9.6" fill="#3a5a30" filter="url(#rough2)">逆序 i = 0：before = 1，恢复 (1,0) 后 after = 3 → max(0, 1) = 1</text>
  <text x="46" y="374" font-size="9.4" fill="#8a6a20" filter="url(#rough2)">逆序得到 [1, 0]，即正序答案 ✓</text>

  <text x="566" y="290" text-anchor="middle" font-size="9.2" fill="#666" filter="url(#rough2)">预删后</text>
  <rect x="548" y="300" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="563" y="320" text-anchor="middle" font-size="11.5" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <rect x="548" y="330" width="30" height="30" rx="4" fill="#f4f4f4" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="548" y="360" width="30" height="30" rx="4" fill="#f4f4f4" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="584" y="300" font-size="9" fill="#999" filter="url(#rough2)">(0,0)</text>
  <text x="584" y="330" font-size="9" fill="#999" filter="url(#rough2)">(1,0)</text>
  <text x="584" y="360" font-size="9" fill="#999" filter="url(#rough2)">(2,0)</text>
</svg>
