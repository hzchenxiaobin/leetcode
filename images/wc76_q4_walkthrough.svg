  <text x="165.0" y="111.0" text-anchor="middle" font-size="12.5" fill="#aaaaaa" filter="url(#rough2)">0</text>
  <rect x="40" y="126" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="57.0" y="147.0" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">1</text>
