<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 434" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="434" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：grid = [[1,0,0,0],[1,1,1,0]]，hits = [[1,0]] → [2]</text>
  <text x="330" y="49" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">逆序只需两次读数：恢复前后的「与天花板连通的砖数」之差就是掉落数 + 1</text>

  <text x="112" y="82" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">初始 grid</text>
  <rect x="40" y="90" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="57.0" y="111.0" text-anchor="middle" font-size="12.5" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <rect x="76" y="90" width="34" height="34" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
