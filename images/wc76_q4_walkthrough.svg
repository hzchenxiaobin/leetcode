  <text x="93.0" y="147.0" text-anchor="middle" font-size="12.5" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <rect x="112" y="126" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="129.0" y="147.0" text-anchor="middle" font-size="12.5" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <rect x="148" y="126" width="34" height="34" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="165.0" y="147.0" text-anchor="middle" font-size="12.5" fill="#aaaaaa" filter="url(#rough2)">0</text>
  <text x="320" y="82" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">预删 (1,0)</text>
  <rect x="248" y="90" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="265.0" y="111.0" text-anchor="middle" font-size="12.5" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <rect x="284" y="90" width="34" height="34" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="301.0" y="111.0" text-anchor="middle" font-size="12.5" fill="#aaaaaa" filter="url(#rough2)">0</text>
  <rect x="320" y="90" width="34" height="34" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="337.0" y="111.0" text-anchor="middle" font-size="12.5" fill="#aaaaaa" filter="url(#rough2)">0</text>
  <rect x="356" y="90" width="34" height="34" rx="4" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="373.0" y="111.0" text-anchor="middle" font-size="12.5" fill="#aaaaaa" filter="url(#rough2)">0</text>
  <rect x="248" y="126" width="34" height="34" rx="4" fill="#f4f4f4" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="265.0" y="147.0" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">0</text>
  <rect x="284" y="126" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="301.0" y="147.0" text-anchor="middle" font-size="12.5" fill="#2f3f5c" filter="url(#rough2)">1</text>
  <rect x="320" y="126" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="337.0" y="147.0" text-anchor="middle" font-size="12.5" fill="#2f3f5c" filter="url(#rough2)">1</text>
