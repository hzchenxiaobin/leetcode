  <text x="373.0" y="147.0" text-anchor="middle" font-size="12.5" fill="#aaaaaa" filter="url(#rough2)">0</text>
  <text x="528" y="82" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">恢复 (1,0) 后</text>
  <rect x="456" y="90" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="473.0" y="111.0" text-anchor="middle" font-size="12.5" fill="#2f3f5c" filter="url(#rough2)">1</text>
