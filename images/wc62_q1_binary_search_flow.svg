<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：二分收缩，记录最左的「&gt; target」</text>
  <text x="310" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">循环不变式：ans 是已知最小的合法下标，初值 n 表示「暂时没找到」</text>

  <g filter="url(#rough2)">
    <rect x="200" y="62" width="220" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="200" y="112" width="220" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="200" y="162" width="220" height="32" rx="8" fill="#f7f9fc" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="310" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">lo = 0，hi = n − 1，ans = n</text>
  <text x="310" y="132" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">while lo ≤ hi</text>
  <text x="310" y="182" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">mid = lo + (hi − lo) / 2</text>

  <path d="M 310 94 L 310 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 144 L 310 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="157" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 310 194 L 310 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="310,212 440,244 310,276 180,244" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.7" filter="url(#rough2)"/>
  <text x="310" y="248" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">letters[mid] &gt; target ?</text>

  <path d="M 440 244 L 475 244 L 475 298" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="457" y="238" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 180 244 L 115 244 L 115 298" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="238" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)">
    <rect x="380" y="300" width="190" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="20" y="300" width="190" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/>
  </g>
  <text x="475" y="318" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">ans = mid</text>
  <text x="475" y="334" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">hi = mid − 1</text>
  <text x="115" y="318" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">lo = mid + 1</text>
  <text x="115" y="334" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">mid 及其左侧全部排除</text>

  <path d="M 475 344 L 475 358 L 8 358 L 8 128 L 196 128" stroke="#4a7a3a"
        stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 115 344 L 115 358" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text transform="translate(16,250) rotate(-90)" font-size="9" fill="#4a7a3a"
        text-anchor="middle" filter="url(#rough2)">更新后回到判定</text>

  <path d="M 420 128 L 592 128 L 592 396 L 434 396" stroke="#666" stroke-width="1.5"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="122" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">否（区间已空）</text>

  <rect x="190" y="362" width="240" height="68" rx="10" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="382" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">ans == n ?</text>
  <text x="310" y="400" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">是 → 返回 letters[0]（回绕）</text>
  <text x="310" y="418" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">否 → 返回 letters[ans]</text>
</svg>
