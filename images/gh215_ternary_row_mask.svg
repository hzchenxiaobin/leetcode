<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="390" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">一行的全部信息 → 一个三进制数</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#888" filter="url(#r)">每格 0 = 空、1 = 内向、2 = 外向；n ≤ 5 ⇒ 每行只有 3⁵ = 243 种状态</text>

  <!-- row cells -->
  <g filter="url(#r)">
    <rect x="130" y="78" width="76" height="58" rx="4" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.5"/>
    <rect x="206" y="78" width="76" height="58" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="282" y="78" width="76" height="58" rx="4" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.5"/>
    <rect x="358" y="78" width="76" height="58" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="434" y="78" width="76" height="58" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <path d="M 359 138 Q 396 152 433 138" stroke="#2e6e2e" stroke-width="2" fill="none"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold">
    <text x="168" y="103" fill="#999" filter="url(#r)">空</text>
    <text x="244" y="103" fill="#2e6e2e" filter="url(#r)">内</text>
    <text x="320" y="103" fill="#999" filter="url(#r)">空</text>
    <text x="396" y="103" fill="#a0761e" filter="url(#r)">外</text>
    <text x="472" y="103" fill="#a0761e" filter="url(#r)">外</text>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" fill="#666">
    <text x="168" y="126" filter="url(#r)">0</text>
    <text x="244" y="126" fill="#2e6e2e" filter="url(#r)">1</text>
    <text x="320" y="126" filter="url(#r)">0</text>
    <text x="396" y="126" fill="#a0761e" filter="url(#r)">2</text>
    <text x="472" y="126" fill="#a0761e" filter="url(#r)">2</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#999">
    <text x="168" y="158" filter="url(#r)">3⁴</text>
    <text x="244" y="158" filter="url(#r)">3³</text>
    <text x="320" y="158" filter="url(#r)">3²</text>
    <text x="396" y="158" filter="url(#r)">3¹</text>
    <text x="472" y="158" filter="url(#r)">3⁰</text>
  </g>
  <text x="396" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#r)">+40（水平边）</text>

  <!-- mask equation -->
  <text x="320" y="192" text-anchor="middle" font-size="14" fill="#444" filter="url(#r)">mask = 1×3³ + 2×3¹ + 2×3⁰ = 27 + 6 + 2 = <tspan font-weight="bold" fill="#33517a" font-size="16">35</tspan></text>

  <!-- derived cards -->
  <g filter="url(#r)">
    <rect x="70" y="215" width="180" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="160" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">人数</text>
  <text x="160" y="264" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#r)">cntI = 1，cntE = 2</text>

  <g filter="url(#r)">
    <rect x="290" y="215" width="280" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="430" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">rowScore = 本行点权 + 行内水平边</text>
  <text x="430" y="264" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#r)">= (120 + 40 + 40) + 40 = 240</text>

  <!-- bottom note -->
  <g filter="url(#r)">
    <rect x="56" y="308" width="528" height="64" rx="10" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.3"/>
  </g>
  <text x="320" y="333" text-anchor="middle" font-size="12" fill="#555" filter="url(#r)">rowScore 已含本行全部点权与水平边（本例只有「外-外」一条水平边 → +40）</text>
  <text x="320" y="357" text-anchor="middle" font-size="12" fill="#555" filter="url(#r)">跨行的垂直边不在 rowScore 里 —— 留给 cross[prev][cur] 在行间转移时结算</text>
</svg>
