<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：s[0]='1' ⇒ 合法串必形如 1*0*，禁式是相邻对 "01"</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">上排合法：唯一的 1 段 + 尾随 0；下排非法：在 "01" 相邻对处开出第二段</text>

  <!-- Row 1: valid "1100" -->
  <text x="44" y="92" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合法</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="84" y="70" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="108" y="92" fill="#333" font-weight="bold">1</text>
    <rect x="132" y="70" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="156" y="92" fill="#333" font-weight="bold">1</text>
    <rect x="180" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="204" y="92" fill="#333">0</text>
    <rect x="228" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="252" y="92" fill="#333">0</text>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="108" y="62">0</text>
    <text x="156" y="62">1</text>
    <text x="204" y="62">2</text>
    <text x="252" y="62">3</text>
  </g>
  <!-- segment brackets -->
  <path d="M 84 106 L 84 113 L 180 113 L 180 106" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 180 106 L 180 113 L 276 113 L 276 106" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="132" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">唯一的 1 字段</text>
  <text x="228" y="130" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">尾随 0（可选）</text>
  <!-- result -->
  <rect x="316" y="72" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="354" y="92" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ true</text>
  <text x="452" y="92" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">s ∈ 1*0*</text>

  <!-- Row 2: invalid "1001" -->
  <text x="44" y="192" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">非法</text>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="84" y="170" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="108" y="192" fill="#333" font-weight="bold">1</text>
    <rect x="132" y="170" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="156" y="192" fill="#333">0</text>
    <rect x="180" y="170" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="204" y="192" fill="#333">0</text>
    <rect x="228" y="170" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="252" y="192" fill="#333" font-weight="bold">1</text>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="108" y="162">0</text>
    <text x="156" y="162">1</text>
    <text x="204" y="162">2</text>
    <text x="252" y="162">3</text>
  </g>
  <!-- dashed highlight around the "01" pair -->
  <rect x="175" y="165" width="106" height="44" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" rx="9" filter="url(#rough2)"/>
  <text x="108" y="231" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第一段</text>
  <text x="252" y="231" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">第二段 ✗</text>
  <!-- arrow from highlight to result -->
  <path d="M 281 187 L 312 187" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="316" y="172" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="354" y="192" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ false</text>
  <text x="436" y="182" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">0 之后又见 1</text>
  <text x="436" y="198" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⇒ 开出第二段</text>

  <!-- core equivalence box -->
  <rect x="90" y="246" width="380" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">段数 ≤ 1 ⇔ 子串 "01" 不存在 ⇔ s ∈ 1*0*</text>

  <!-- key insight box -->
  <rect x="44" y="296" width="472" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① s[0]='1' ⇒ 至少已有一段 ⇒「零个或一个」退化为「恰好一个」</text>
  <text x="280" y="337" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">② 恰好一段 ⇔ 全部 1 连续挤在前缀、后缀全 0（形如 1*0*）</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">③ 「0 后又见 1」的最小局部表现是相邻对 "01"，一趟扫描即可判定</text>

  <!-- footer -->
  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">一行代码版：return "01" not in s —— 计数问题降维为存在性问题</text>
</svg>
