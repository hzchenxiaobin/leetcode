<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#556"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
<text x="260" y="26" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">每个状态只有两种选择</text>
<rect x="30" y="56" width="220" height="130" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="140" y="82" font-size="13" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">不反转 v</text>
<text x="140" y="112" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">值 = nums[v]·(−1)^p</text>
<text x="140" y="138" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">儿子状态 = (p, min(d+1, k))</text>
<text x="140" y="166" font-size="10" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">（任何 d 都允许）</text>
<rect x="270" y="56" width="220" height="130" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="380" y="82" font-size="13" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">反转 v（仅当 d = k）</text>
<text x="380" y="112" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">值 = −nums[v]·(−1)^p</text>
<text x="380" y="138" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">儿子状态 = (p⊕1, 1)</text>
<text x="380" y="166" font-size="10" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">整棵子树符号翻转</text>
<rect x="30" y="208" width="460" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="260" y="234" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">dp[v][p][d] = max(</text>
<text x="260" y="258" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">  nums[v]·(−1)^p + Σ_c dp[c][p][min(d+1,k)],</text>
<text x="260" y="276" font-size="11" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">  −nums[v]·(−1)^p + Σ_c dp[c][p⊕1][1] )</text>
<text x="260" y="316" font-size="11" fill="#446688" text-anchor="middle" font-weight="normal" filter="url(#rough2)">先算所有儿子的和（后序），再按 (p, d) 取 max</text>
<text x="260" y="344" font-size="11" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">每个 (p,d) 与每个儿子各算一次 → 总代价 O(nk)</text>
<text x="260" y="368" font-size="11" fill="#d6a040" text-anchor="middle" font-weight="normal" filter="url(#rough2)">根的状态固定为 (p, d) = (0, k)</text>
</svg>
