<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：正反两遍求游程，再逐接缝取 min</text>

  <!-- j = 4 列高亮（画在格子下层） -->
  <rect x="288" y="46" width="42" height="150" fill="#fff8e1" filter="url(#rough2)"/>

  <!-- 行标签 -->
  <g filter="url(#rough2)">
    <text x="104" y="65" text-anchor="end" font-size="12" font-weight="bold" fill="#888">j</text>
    <text x="104" y="95" text-anchor="end" font-size="12" font-weight="bold" fill="#555">nums</text>
    <text x="104" y="125" text-anchor="end" font-size="12" font-weight="bold" fill="#446688">inc[j]</text>
    <text x="104" y="155" text-anchor="end" font-size="12" font-weight="bold" fill="#4a7a3a">nxt[j]</text>
    <text x="104" y="185" text-anchor="end" font-size="12" font-weight="bold" fill="#b85450">k(j)</text>
  </g>

  <!-- 表头行：下标 -->
  <g filter="url(#rough2)">
    <rect x="112" y="46" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="156" y="46" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="200" y="46" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="244" y="46" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="288" y="46" width="42" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <rect x="332" y="46" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="376" y="46" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="420" y="46" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="464" y="46" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="508" y="46" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
  </g>

  <g filter="url(#rough2)" font-size="12" fill="#888" text-anchor="middle">
    <text x="133" y="66">0</text>
    <text x="177" y="66">1</text>
    <text x="221" y="66">2</text>
    <text x="265" y="66">3</text>
    <text x="309" y="66">4</text>
    <text x="353" y="66">5</text>
    <text x="397" y="66">6</text>
    <text x="441" y="66">7</text>
    <text x="485" y="66">8</text>
    <text x="529" y="66">9</text>
  </g>

  <!-- nums 行 -->
  <g filter="url(#rough2)">
    <rect x="112" y="76" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="156" y="76" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="200" y="76" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="244" y="76" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="288" y="76" width="42" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <rect x="332" y="76" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="376" y="76" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="420" y="76" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="464" y="76" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="508" y="76" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
  </g>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="133" y="96">2</text>
    <text x="177" y="96">5</text>
    <text x="221" y="96">7</text>
    <text x="265" y="96">8</text>
    <text x="309" y="96">9</text>
    <text x="353" y="96">2</text>
    <text x="397" y="96">3</text>
    <text x="441" y="96">4</text>
    <text x="485" y="96">3</text>
    <text x="529" y="96">1</text>
  </g>

  <!-- inc 行 -->
  <g filter="url(#rough2)">
    <rect x="112" y="106" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="156" y="106" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="200" y="106" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="244" y="106" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="288" y="106" width="42" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <rect x="332" y="106" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="376" y="106" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="420" y="106" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="464" y="106" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="508" y="106" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
  </g>

  <g filter="url(#rough2)" font-size="12.5" font-weight="bold" fill="#446688" text-anchor="middle">
    <text x="133" y="126">1</text>
    <text x="177" y="126">2</text>
    <text x="221" y="126">3</text>
    <text x="265" y="126">4</text>
    <text x="309" y="126">5</text>
    <text x="353" y="126">1</text>
    <text x="397" y="126">2</text>
    <text x="441" y="126">3</text>
    <text x="485" y="126">1</text>
    <text x="529" y="126">1</text>
  </g>

  <!-- nxt 行 -->
  <g filter="url(#rough2)">
    <rect x="112" y="136" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="156" y="136" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="200" y="136" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="244" y="136" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="288" y="136" width="42" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <rect x="332" y="136" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="376" y="136" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="420" y="136" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="464" y="136" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="508" y="136" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
  </g>

  <g filter="url(#rough2)" font-size="12.5" font-weight="bold" fill="#4a7a3a" text-anchor="middle">
    <text x="133" y="156">5</text>
    <text x="177" y="156">4</text>
    <text x="221" y="156">3</text>
    <text x="265" y="156">2</text>
    <text x="309" y="156">1</text>
    <text x="353" y="156">3</text>
    <text x="397" y="156">2</text>
    <text x="441" y="156">1</text>
    <text x="485" y="156">1</text>
    <text x="529" y="156">1</text>
  </g>

  <!-- k(j) 行：min(inc[j], nxt[j+1]) -->
  <g filter="url(#rough2)">
    <rect x="112" y="166" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="156" y="166" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="200" y="166" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="244" y="166" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="288" y="166" width="42" height="30" fill="#b85450" stroke="#b85450" stroke-width="2" rx="3"/>
    <rect x="332" y="166" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="376" y="166" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="420" y="166" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="464" y="166" width="42" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="3"/>
    <rect x="508" y="166" width="42" height="30" fill="#f0f0f0" stroke="#cccccc" stroke-width="1.2" rx="3"/>
  </g>

  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="133" y="186">1</text>
    <text x="177" y="186">2</text>
    <text x="221" y="186">2</text>
    <text x="265" y="186">1</text>
    <text x="309" y="186" font-weight="bold" fill="#ffffff">3</text>
    <text x="353" y="186">1</text>
    <text x="397" y="186">1</text>
    <text x="441" y="186">1</text>
    <text x="485" y="186">1</text>
    <text x="529" y="186" fill="#999">—</text>
  </g>

  <!-- 底部说明 -->
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">k(j) = min(inc[j], nxt[j+1])，j = 0 … n−2（j = 9 右侧无元素，不构成接缝）</text>
  <text x="280" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">最大候选 k(4) = min(inc[4], nxt[5]) = min(5, 3) = 3 → 答案 = 3</text>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">对应第一段 [7,8,9]（以 4 结尾）、第二段 [2,3,4]（从 5 开始），接缝处 9 &gt; 2</text>

  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">示例 2 同法：j = 1 与 j = 7 处均得 k = 2，答案 2</text>
</svg>
