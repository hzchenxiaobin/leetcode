<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="99"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">削平到水平 h：cost(h) = Σ max(0, d[i] − h) 单调不增</text>

  <!-- 差值条形图：削平前 -->
  <text x="150" y="62" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">差值 d（排序后）：[8, 7, 3, 1]</text>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="70" y="200" width="34" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="87" y="296">8</text>
    <rect x="112" y="210" width="34" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="129" y="296">7</text>
    <rect x="154" y="250" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="171" y="296">3</text>
    <rect x="196" y="270" width="34" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="213" y="296">1</text>
  </g>

  <!-- 中间箭头 -->
  <path d="M 250 140 C 280 140, 280 140, 310 140" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)" transform="translate(0,0)"/>
  <g filter="url(#rough2)">
    <rect x="230" y="104" width="100" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="280" y="128" text-anchor="middle" font-weight="bold" fill="#d6a040">用 k 次操作</text>
    <text x="280" y="148" text-anchor="middle">削掉所有</text>
    <text x="280" y="166" text-anchor="middle">高出 h 的部分</text>
  </g>

  <!-- 差值条形图：削平后 -->
  <text x="430" y="62" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">削到 h = 2 后：[2, 2, 2, 1]</text>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="340" y="260" width="34" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="357" y="296">2</text>
    <rect x="382" y="260" width="34" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="399" y="296">2</text>
    <rect x="424" y="260" width="34" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="441" y="296">2</text>
    <rect x="466" y="270" width="34" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <text x="483" y="296">1</text>
  </g>
  <!-- 削掉部分虚影 -->
  <g filter="url(#rough2)" font-size="12" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3">
    <rect x="340" y="200" width="34" height="60" rx="3"/>
    <rect x="382" y="210" width="34" height="50" rx="3"/>
    <rect x="424" y="250" width="34" height="10" rx="3"/>
  </g>
  <text x="404" y="196" font-size="12" fill="#b85450" filter="url(#rough2)" text-anchor="middle">虚线 = 已削掉的部分</text>

  <!-- h 水平线 -->
  <path d="M 330 260 L 510 260" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="516" y="264" font-size="12" fill="#4a7a3a" filter="url(#rough2)">h</text>

  <!-- cost 公式 -->
  <g filter="url(#rough2)">
    <rect x="36" y="320" width="488" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <text x="280" y="340" text-anchor="middle">此例 cost(2) = (8−2) + (7−2) + (3−2) = 6+5+1 = 12 次操作</text>
    <text x="280" y="360" text-anchor="middle" font-weight="bold" fill="#446688">h ↑ → cost ↓（单调）→ 二分找「cost(h) ≤ k 的最小 h」</text>
  </g>
</svg>
