<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">BST 中序遍历 &#8660; 非降序，相同值必然相邻</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">众数 = 序列中最长等值连续段里的那个值</text>

  <!-- 左：BST 示例 1,null,2,2 -->
  <line x1="74" y1="122" x2="112" y2="168" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="139" y1="192" x2="176" y2="238" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="98" y="143" font-size="9.5" fill="#8a8a8a" filter="url(#rough2)">右</text>
  <text x="164" y="213" font-size="9.5" fill="#8a8a8a" filter="url(#rough2)">右</text>

  <circle cx="60" cy="108" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="113" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">1</text>
  <circle cx="126" cy="180" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="126" y="185" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">2</text>
  <circle cx="192" cy="252" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="192" y="257" text-anchor="middle" font-size="12" fill="#2f5228" filter="url(#rough2)">2</text>
  <text x="60" y="286" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">root = [1,null,2,2]</text>

  <!-- 箭头：树 → 中序序列 -->
  <path d="M 214 118 L 292 120" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="110" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">中序</text>

  <!-- 右：中序序列 -->
  <text x="415" y="88" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">中序遍历序列（非降序）</text>
  <rect x="305" y="100" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="333" y="122" text-anchor="middle" font-size="12" fill="#5a4a20" filter="url(#rough2)">1</text>
  <rect x="369" y="100" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="397" y="122" text-anchor="middle" font-size="12" fill="#2f5228" filter="url(#rough2)">2</text>
  <rect x="433" y="100" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="461" y="122" text-anchor="middle" font-size="12" fill="#2f5228" filter="url(#rough2)">2</text>

  <!-- 连续段 -->
  <rect x="305" y="152" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="333" y="171" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">1 次</text>
  <rect x="369" y="152" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="429" y="171" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">2 出现 2 次（连续段）</text>

  <path d="M 333 136 L 333 149" stroke="#999" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 429 136 L 429 149" stroke="#999" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="415" y="205" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">最长段 = 2 次 &#8658; 众数集合 {2}</text>

  <!-- 底部结论 -->
  <rect x="40" y="310" width="480" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="332" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">为什么能一遍扫描</text>
  <text x="56" y="352" font-size="10" fill="#444" filter="url(#rough2)">由 BST 性质，左 &#8804; 根 &#8804; 右，中序输出必非降序；于是同一个值的所有出现挤在一起。</text>
  <text x="56" y="370" font-size="10" fill="#444" filter="url(#rough2)">只需记录「当前值连续出现次数 cnt」与「历史最大频次 best」，不需要哈希表计数。</text>
  <text x="56" y="388" font-size="10" fill="#444" filter="url(#rough2)">空间进一步压到 O(1)：用 Morris 线索化把递归/栈也省掉（见下一张图）。</text>
</svg>
