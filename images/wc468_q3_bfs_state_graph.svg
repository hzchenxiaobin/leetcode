<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">BFS 状态图：最少操作次数 = 起点到目标的最短路边数</text>
  <text x="320" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（n = 6、元素互异时，从任一排列出发到全部 720 个排列的层分布）</text>

  <!-- 第 0 层 -->
  <rect x="440" y="60" width="120" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="85" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">第 0 层 · 起点</text>
  <path d="M500,100 L500,114" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="486" y="110" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">边 = 一次拆分合并</text>

  <!-- 第 1 层 -->
  <rect x="280" y="118" width="280" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="143" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">第 1 层 · 35 个状态</text>
  <circle cx="542" cy="138" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M500,158 L500,172" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 2 层 -->
  <rect x="130" y="176" width="430" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345" y="201" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">第 2 层 · 259 个状态</text>
  <path d="M500,216 L500,230" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 3 层 -->
  <rect x="90" y="234" width="470" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="325" y="259" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">第 3 层 · 380 个状态</text>
  <circle cx="542" cy="254" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M500,274 L500,288" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 4 层 -->
  <rect x="310" y="292" width="250" height="40" rx="8" fill="#eeeeee" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="317" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">第 4 层 · 45 个（最远）</text>

  <!-- 命中示例 -->
  <circle cx="76" cy="348" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="88" y="352" font-size="11" fill="#666" filter="url(#rough2)">示例 1：目标 (1,2,3) 在第 1 层命中 → ans = 1</text>
  <circle cx="76" cy="370" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="88" y="374" font-size="11" fill="#666" filter="url(#rough2)">示例 2：目标 [5,4,3,2,1,1] 在第 3 层命中 → ans = 3</text>

  <!-- 信息框 -->
  <rect x="60" y="390" width="520" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="412" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">状态按「整个数组的值」哈希去重，重复元素自动合并，总数 ≤ 6! = 720</text>
  <text x="320" y="432" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">每个状态非平凡后继 ≤ C(7,3) = 35 个；总枚举量 ≈ 720 × 91 ≈ 6.6 万 → 毫秒级</text>
</svg>
