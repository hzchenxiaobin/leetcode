<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="352" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟扫描定前缀，再加一趟试缺失</text>
  <rect x="70" y="50" width="420" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">从 i = 1 起，只要 nums[i] == nums[i−1]+1 就继续</text>
  <text x="280" y="94" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">sum 累加前缀元素，i 停在第一个断点</text>
  <path d="M280,106 L280,126" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <rect x="70" y="128" width="420" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="155" text-anchor="middle" font-size="12" fill="#1c3a1c" filter="url(#rough2)">此时 sum = 最长顺序前缀之和（前缀长度为 i）</text>
  <path d="M280,170 L280,190" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <rect x="70" y="192" width="420" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="219" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">把整个 nums 放进哈希集合 seen</text>
  <path d="M280,234 L280,254" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <rect x="90" y="256" width="380" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="283" text-anchor="middle" font-size="12" fill="#7a3030" filter="url(#rough2)">while sum ∈ seen: sum += 1   ← 最多迭代 n+1 次</text>
  <path d="M280,298 L280,316" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">返回 sum</text>
</svg>
