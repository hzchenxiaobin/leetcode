<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察一：一次操作 = 在两数之间「搬运」二进制位</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: before -->
  <text x="160" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">操作前</text>
  <g filter="url(#sk)">
    <text x="80" y="101" text-anchor="end" font-size="15" fill="#333">x =</text>
    <rect x="90" y="80" width="32" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="106" y="99" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">1</text>
    <rect x="126" y="80" width="32" height="28" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="142" y="99" text-anchor="middle" font-size="13.5" fill="#8899aa">0</text>
    <rect x="162" y="80" width="32" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="178" y="99" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">1</text>
    <rect x="198" y="80" width="32" height="28" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="214" y="99" text-anchor="middle" font-size="13.5" fill="#8899aa">0</text>
    <text x="106" y="121" text-anchor="middle" font-size="10" fill="#999">8</text>
    <text x="142" y="121" text-anchor="middle" font-size="10" fill="#999">4</text>
    <text x="178" y="121" text-anchor="middle" font-size="10" fill="#999">2</text>
    <text x="214" y="121" text-anchor="middle" font-size="10" fill="#999">1</text>
    <text x="80" y="149" text-anchor="end" font-size="15" fill="#333">y =</text>
    <rect x="90" y="128" width="32" height="28" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="106" y="147" text-anchor="middle" font-size="13.5" fill="#8899aa">0</text>
    <rect x="126" y="128" width="32" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="142" y="147" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">1</text>
    <rect x="162" y="128" width="32" height="28" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="178" y="147" text-anchor="middle" font-size="13.5" fill="#8899aa">0</text>
    <rect x="198" y="128" width="32" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="214" y="147" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">1</text>
    <text x="244" y="100" font-size="13" fill="#666">(10)</text>
    <text x="244" y="148" font-size="13" fill="#666">(5)</text>
  </g>

  <!-- op arrow -->
  <path d="M 292 118 L 346 118" stroke="#446688" stroke-width="2.2" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="320" y="98" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#sk)">同时更新（用旧值）</text>
  <text x="320" y="140" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">AND 侧交出 · OR 侧吸收</text>

  <!-- Panel B: after -->
  <text x="470" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">操作后</text>
  <g filter="url(#sk)">
    <text x="392" y="101" text-anchor="end" font-size="15" fill="#333">x′ =</text>
    <rect x="398" y="80" width="32" height="28" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="414" y="99" text-anchor="middle" font-size="13.5" fill="#8899aa">0</text>
    <rect x="434" y="80" width="32" height="28" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="450" y="99" text-anchor="middle" font-size="13.5" fill="#8899aa">0</text>
    <rect x="470" y="80" width="32" height="28" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="486" y="99" text-anchor="middle" font-size="13.5" fill="#8899aa">0</text>
    <rect x="506" y="80" width="32" height="28" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="522" y="99" text-anchor="middle" font-size="13.5" fill="#8899aa">0</text>
    <text x="468" y="123" text-anchor="middle" font-size="10" fill="#b85450">两个 1 被搬走了</text>
    <text x="392" y="149" text-anchor="end" font-size="15" fill="#333">y′ =</text>
    <rect x="398" y="128" width="32" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="414" y="147" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">1</text>
    <rect x="434" y="128" width="32" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="450" y="147" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">1</text>
    <rect x="470" y="128" width="32" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="486" y="147" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">1</text>
    <rect x="506" y="128" width="32" height="28" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="522" y="147" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e22">1</text>
    <text x="552" y="100" font-size="13" fill="#666">(0)</text>
    <text x="552" y="148" font-size="13" fill="#666">(15)</text>
    <text x="414" y="170" text-anchor="middle" font-size="9.5" fill="#4a7a3a">←搬来</text>
    <text x="450" y="170" text-anchor="middle" font-size="9.5" fill="#4a7a3a">原有</text>
    <text x="486" y="170" text-anchor="middle" font-size="9.5" fill="#4a7a3a">←搬来</text>
    <text x="522" y="170" text-anchor="middle" font-size="9.5" fill="#4a7a3a">原有</text>
  </g>

  <!-- 4-case table -->
  <text x="320" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">逐位检查：该位上 1 的个数永远不变</text>
  <g filter="url(#sk)">
    <rect x="70" y="212" width="540" height="122" rx="6" fill="none" stroke="#446688" stroke-width="1.5"/>
    <rect x="73" y="241" width="534" height="25" fill="#e6f4ea" opacity="0.45"/>
    <path d="M 72 238 Q 320 240 568 238" stroke="#446688" stroke-width="1" fill="none"/>
    <path d="M 72 266 Q 320 268 568 266" stroke="#c9d4e0" stroke-width="0.8" fill="none"/>
    <path d="M 72 291 Q 320 293 568 291" stroke="#c9d4e0" stroke-width="0.8" fill="none"/>
    <path d="M 72 316 Q 320 318 568 316" stroke="#c9d4e0" stroke-width="0.8" fill="none"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">
    <text x="105" y="229" text-anchor="middle">x 的 b 位</text>
    <text x="180" y="229" text-anchor="middle">y 的 b 位</text>
    <text x="275" y="229" text-anchor="middle">新 x（AND）</text>
    <text x="375" y="229" text-anchor="middle">新 y（OR）</text>
    <text x="460" y="229" text-anchor="middle">1 的个数</text>
    <text x="545" y="229" text-anchor="middle">说明</text>
  </g>
  <g font-size="12" fill="#333" filter="url(#sk)">
    <text x="105" y="258" text-anchor="middle">1</text>
    <text x="180" y="258" text-anchor="middle">1</text>
    <text x="275" y="258" text-anchor="middle">1</text>
    <text x="375" y="258" text-anchor="middle">1</text>
    <text x="460" y="258" text-anchor="middle">2 → 2</text>
    <text x="545" y="258" text-anchor="middle" font-size="10.5" fill="#556">两位都保留</text>
  </g>
  <g font-size="12" filter="url(#sk)">
    <text x="105" y="283" text-anchor="middle" fill="#2e5e22" font-weight="bold">1</text>
    <text x="180" y="283" text-anchor="middle" fill="#8899aa">0</text>
    <text x="275" y="283" text-anchor="middle" fill="#8899aa">0</text>
    <text x="375" y="283" text-anchor="middle" fill="#2e5e22" font-weight="bold">1</text>
    <text x="460" y="283" text-anchor="middle" fill="#2e5e22" font-weight="bold">1 → 1</text>
    <text x="545" y="283" text-anchor="middle" font-size="10.5" fill="#2e5e22" font-weight="bold">搬给 OR 侧！</text>
  </g>
  <g font-size="12" fill="#333" filter="url(#sk)">
    <text x="105" y="308" text-anchor="middle">0</text>
    <text x="180" y="308" text-anchor="middle">1</text>
    <text x="275" y="308" text-anchor="middle">0</text>
    <text x="375" y="308" text-anchor="middle">1</text>
    <text x="460" y="308" text-anchor="middle">1 → 1</text>
    <text x="545" y="308" text-anchor="middle" font-size="10.5" fill="#556">留在 OR 侧</text>
  </g>
  <g font-size="12" fill="#333" filter="url(#sk)">
    <text x="105" y="333" text-anchor="middle">0</text>
    <text x="180" y="333" text-anchor="middle">0</text>
    <text x="275" y="333" text-anchor="middle">0</text>
    <text x="375" y="333" text-anchor="middle">0</text>
    <text x="460" y="333" text-anchor="middle">0 → 0</text>
    <text x="545" y="333" text-anchor="middle" font-size="10.5" fill="#556">无为</text>
  </g>

  <!-- conclusion box -->
  <g filter="url(#sk)">
    <rect x="40" y="352" width="560" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="378" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">守恒量：cnt[b] = 全数组第 b 位上 1 的总数，任何操作序列都无法改变它</text>
  <text x="320" y="402" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">∴ 数值多大、位落在谁身上都无关紧要，有意义的只有位库存 cnt[0..29]</text>
  <text x="320" y="428" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">问题从「怎么操作」降维成「怎么把库存分给 k 个数」</text>
</svg>
