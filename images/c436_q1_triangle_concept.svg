<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#a06a1a"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：d = i − j 是 ↘ 对角线的「身份证」，符号划分两个三角形</text>
  <path d="M 60 40 Q 340 48 620 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- diagonal tags -->
  <text x="50" y="119" text-anchor="end" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">d=0</text>
  <text x="50" y="173" text-anchor="end" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">d=1</text>
  <text x="50" y="227" text-anchor="end" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">d=2</text>
  <text x="141" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">d=−1</text>
  <text x="195" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">d=−2</text>

  <!-- 3x3 grid, origin (60,88), cell 54 -->
  <g filter="url(#rough2)">
    <rect x="60" y="88" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="114" y="88" width="54" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="168" y="88" width="54" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="60" y="142" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="114" y="142" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="168" y="142" width="54" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="60" y="196" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="114" y="196" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="168" y="196" width="54" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="87" y="119" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="141" y="119" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="195" y="119" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="87" y="173" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>
  <text x="141" y="173" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="195" y="173" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="87" y="227" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="141" y="227" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="195" y="227" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <!-- diagonal arrows -->
  <g filter="url(#rough2)">
    <path d="M 95 123 L 187 215" stroke="#3a3a3a" stroke-width="2.4" fill="none" marker-end="url(#arr)"/>
    <path d="M 93 175 L 135 217" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 149 123 L 187 161" stroke="#a06a1a" stroke-width="2" fill="none" marker-end="url(#arro)"/>
  </g>

  <!-- legend -->
  <g filter="url(#rough2)">
    <path d="M 62 268 L 84 268" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <path d="M 62 290 L 84 290" stroke="#a06a1a" stroke-width="2" fill="none" marker-end="url(#arro)"/>
  </g>
  <text x="92" y="272" font-size="11.5" fill="#333" filter="url(#rough2)">黑箭头：左下三角（非递增）</text>
  <text x="92" y="294" font-size="11.5" fill="#a06a1a" filter="url(#rough2)">橙箭头：右上三角（非递减）</text>

  <!-- box A -->
  <g filter="url(#rough2)">
    <rect x="300" y="84" width="350" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="475" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a" filter="url(#rough2)">① 左下三角（含主对角线）</text>
  <text x="475" y="130" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">d = i − j ≥ 0，共 n 条</text>
  <text x="475" y="150" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">每条按非递增排序：[1,8,6] → [8,6,1]</text>
  <text x="475" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">⚠ 主对角线 d = 0 归左下三角</text>

  <!-- box B -->
  <g filter="url(#rough2)">
    <rect x="300" y="192" width="350" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="475" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">② 右上三角</text>
  <text x="475" y="236" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">d = i − j &lt; 0，共 n − 1 条</text>
  <text x="475" y="256" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">每条按非递减排序：[7,2] → [2,7]</text>

  <!-- box C -->
  <g filter="url(#rough2)">
    <rect x="300" y="284" width="350" height="112" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="475" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">③ 为什么能逐条独立处理？</text>
  <text x="475" y="326" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">2n−1 条 ↘ 对角线恰好划分 n² 个格子</text>
  <text x="475" y="344" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">每格只属于一条 → 对角线之间互不干扰</text>
  <text x="475" y="364" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">逐条「取出 → 排序 → 写回」即可</text>

  <!-- key box -->
  <g filter="url(#rough2)">
    <rect x="40" y="424" width="600" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="340" y="448" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Q1 快速切入：d = i − j 定线，d 的符号定方向</text>
  <text x="340" y="470" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">取出与写回都沿 ↘（i 递增）：第 k 个值放第 k 格，天然不错位</text>
</svg>
