<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="300" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333">演算：["bat","dog","dog","doggy","bat"]，k = 3</text>

  <text x="40" y="62" font-size="11" fill="#666">下标</text>
  <text x="110" y="62" font-size="11" fill="#666">单词</text>
  <text x="230" y="62" font-size="11" fill="#666">len ≥ 3</text>
  <text x="330" y="62" font-size="11" fill="#666">前缀</text>
  <text x="440" y="62" font-size="11" fill="#666">该前缀计数</text>

  <g font-size="12" fill="#333">
    <text x="40" y="92">0</text><text x="110" y="92">bat</text><text x="230" y="92">✓</text>
    <text x="330" y="92">bat</text><text x="440" y="92">1</text>
    <text x="40" y="120">1</text><text x="110" y="120">dog</text><text x="230" y="120">✓</text>
    <text x="330" y="120">dog</text><text x="440" y="120">1</text>
    <text x="40" y="148">2</text><text x="110" y="148">dog</text><text x="230" y="148">✓</text>
    <text x="330" y="148">dog</text><text x="440" y="148" fill="#4a7a3a">2</text>
    <text x="40" y="176">3</text><text x="110" y="176">doggy</text><text x="230" y="176">✓</text>
    <text x="330" y="176">dog</text><text x="440" y="176" fill="#4a7a3a">3</text>
    <text x="40" y="204">4</text><text x="110" y="204">bat</text><text x="230" y="204">✓</text>
    <text x="330" y="204">bat</text><text x="440" y="204" fill="#4a7a3a">2</text>
  </g>

  <rect x="40" y="222" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="54" y="242" font-size="11" fill="#333">两个桶的计数都 ≥ 2：答案 = 2（两个 "bat" 是不同单词，都算成员）</text>

  <rect x="40" y="262" width="480" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="54" y="280" font-size="10" fill="#333">对比：若用 set 去重，桶计数会变成 1，答案错为 0</text>
</svg>
