<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">指数前缀和：把区间查询压到 O(1)</text>

  <text x="90" y="66" font-size="12.5" fill="#446688" filter="url(#rough2)">指数 e：</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <g><rect x="150" y="50" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/></g>
    <text x="185" y="70">e₀=0</text>
    <g><rect x="230" y="50" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/></g>
    <text x="265" y="70">e₁=1</text>
    <g><rect x="310" y="50" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/></g>
    <text x="345" y="70">e₂=2</text>
    <g><rect x="390" y="50" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/></g>
    <text x="425" y="70">e₃=3</text>
  </g>

  <path d="M 280 86 L 280 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="298" y="104" font-size="11.5" fill="#446688" filter="url(#rough2)">累加成前缀和</text>

  <g filter="url(#rough2)" font-size="13" fill="#1d3a17" text-anchor="middle">
    <g><rect x="118" y="118" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/></g>
    <text x="144" y="138">0</text>
    <g><rect x="178" y="118" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/></g>
    <text x="204" y="138">0</text>
    <g><rect x="238" y="118" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/></g>
    <text x="264" y="138">1</text>
    <g><rect x="298" y="118" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/></g>
    <text x="324" y="138">3</text>
    <g><rect x="358" y="118" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/></g>
    <text x="384" y="138">6</text>
  </g>
  <text x="80" y="138" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">pre：</text>
  <text x="460" y="138" font-size="11" fill="#4a7a3a" filter="url(#rough2)">pre[0..4]</text>

  <g filter="url(#rough2)">
    <path d="M 144 156 L 144 176 L 204 176 L 204 156" stroke="#b85450" stroke-width="2" fill="none"/>
  </g>
  <g filter="url(#rough2)">
    <path d="M 204 156 L 204 190 L 384 190 L 384 156" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
  </g>
  <text x="150" y="212" font-size="12" fill="#b85450" filter="url(#rough2)">查询 [0,1]：t = pre[2] − pre[0] = 1</text>
  <text x="300" y="232" font-size="12" fill="#a3721d" filter="url(#rough2)">查询 [2,3]：t = pre[4] − pre[2] = 5</text>

  <g filter="url(#rough2)">
    <rect x="100" y="248" width="380" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="290" y="272">区间乘积 = 2^(pre[r+1] − pre[l])</text>
    <text x="290" y="296">差分一次拿指数 → 快速幂 2^t mod (10⁹+7)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="100" y="330" width="380" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
  </g>
  <text x="290" y="352" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">备选：预处理 2⁰..2⁹⁰⁰ 的模值表，查询也是 O(1)</text>
  <text x="290" y="372" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">指数和 &lt; 30 × 30 = 900，线性递推一遍即可</text>
</svg>
