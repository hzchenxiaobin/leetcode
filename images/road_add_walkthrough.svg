<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：n = 5，queries = [[2,4],[0,2],[0,4]]</text>

  <!-- city index header -->
  <text x="128" y="56" text-anchor="end" font-size="10.5" fill="#aaaaaa" filter="url(#rough2)">i =</text>
  <g font-size="10.5" fill="#aaaaaa" text-anchor="middle" filter="url(#rough2)">
    <text x="173" y="56">0</text>
    <text x="223" y="56">1</text>
    <text x="273" y="56">2</text>
    <text x="323" y="56">3</text>
    <text x="373" y="56">4</text>
  </g>

  <!-- row 1: query (2,4) -->
  <rect x="18" y="64" width="118" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="77" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">① 新增 (2,4)</text>
  <g filter="url(#rough2)">
    <rect x="150" y="64" width="46" height="34" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="200" y="64" width="46" height="34" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="250" y="64" width="46" height="34" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="300" y="64" width="46" height="34" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="350" y="64" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="13" fill="#666666" text-anchor="middle" filter="url(#rough2)">
    <text x="173" y="85">0</text>
    <text x="223" y="85">1</text>
    <text x="273" y="85">2</text>
    <text x="323" y="85">3</text>
  </g>
  <text x="373" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <line x1="402" y1="81" x2="420" y2="81" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="424" y="64" width="84" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="466" y="85" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 3</text>
  <text x="150" y="114" font-size="11" fill="#4a7a3a" filter="url(#rough2)">初始 [0,1,2,3,4]，仅 dist[4] 变化：4 → 3</text>

  <line x1="273" y1="120" x2="273" y2="132" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- row 2: query (0,2) -->
  <rect x="18" y="136" width="118" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="77" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">② 新增 (0,2)</text>
  <g filter="url(#rough2)">
    <rect x="150" y="136" width="46" height="34" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="200" y="136" width="46" height="34" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="250" y="136" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="300" y="136" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="350" y="136" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="13" fill="#666666" text-anchor="middle" filter="url(#rough2)">
    <text x="173" y="157">0</text>
    <text x="223" y="157">1</text>
  </g>
  <g font-size="13" font-weight="bold" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">
    <text x="273" y="157">1</text>
    <text x="323" y="157">2</text>
    <text x="373" y="157">2</text>
  </g>
  <line x1="402" y1="153" x2="420" y2="153" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="424" y="136" width="84" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="466" y="157" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 2</text>
  <text x="150" y="186" font-size="11" fill="#4a7a3a" filter="url(#rough2)">dist[2] 缩短 → 右侧连锁更新 dist[3]、dist[4]</text>

  <line x1="273" y1="192" x2="273" y2="204" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- row 3: query (0,4) -->
  <rect x="18" y="208" width="118" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="77" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">③ 新增 (0,4)</text>
  <g filter="url(#rough2)">
    <rect x="150" y="208" width="46" height="34" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="200" y="208" width="46" height="34" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="250" y="208" width="46" height="34" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="300" y="208" width="46" height="34" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1.2"/>
    <rect x="350" y="208" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="13" fill="#666666" text-anchor="middle" filter="url(#rough2)">
    <text x="173" y="229">0</text>
    <text x="223" y="229">1</text>
    <text x="273" y="229">1</text>
    <text x="323" y="229">2</text>
  </g>
  <text x="373" y="229" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <line x1="402" y1="225" x2="420" y2="225" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="424" y="208" width="84" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="466" y="229" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 1</text>
  <text x="150" y="258" font-size="11" fill="#4a7a3a" filter="url(#rough2)">dist[4] = min(dist[3]+1, dist[2]+1, dist[0]+1) = 1</text>

  <!-- insight box -->
  <g filter="url(#rough2)">
    <rect x="24" y="288" width="472" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">新边拉低某个 dist[v] 后，右侧依赖它的位置会连锁变小，</text>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#a07820" filter="url(#rough2)">影响范围难以局部圈定 —— 每条查询后完整重算一趟最稳妥</text>
</svg>
