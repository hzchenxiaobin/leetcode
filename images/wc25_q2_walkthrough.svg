<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：两条样例的逐项计算</text>
  <path d="M 160 38 Q 340 48 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <g filter="url(#sk)"><rect x="40" y="54" width="620" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="130" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">项目</text>
  <text x="340" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66">示例 1：(1 + i) · (1 + i)</text>
  <text x="560" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66">示例 2：(1 − i) · (1 − i)</text>

  <!-- 行 1 -->
  <g filter="url(#sk)"><rect x="40" y="88" width="620" height="26" fill="#ffffff" stroke="#c8d4e0" stroke-width="0.9"/></g>
  <text x="70" y="105" font-size="11.5" fill="#555">输入 a, b, c, d</text>
  <text x="340" y="105" text-anchor="middle" font-size="12" fill="#333">1, 1, 1, 1</text>
  <text x="560" y="105" text-anchor="middle" font-size="12" fill="#333">1, −1, 1, −1</text>

  <!-- 行 2 -->
  <g filter="url(#sk)"><rect x="40" y="114" width="620" height="26" fill="#f4f7fa" stroke="#c8d4e0" stroke-width="0.9"/></g>
  <text x="70" y="131" font-size="11.5" fill="#555">a · c</text>
  <text x="340" y="131" text-anchor="middle" font-size="12" fill="#2f5d25">1</text>
  <text x="560" y="131" text-anchor="middle" font-size="12" fill="#2f5d25">1</text>

  <!-- 行 3 -->
  <g filter="url(#sk)"><rect x="40" y="140" width="620" height="26" fill="#ffffff" stroke="#c8d4e0" stroke-width="0.9"/></g>
  <text x="70" y="157" font-size="11.5" fill="#555">b · d</text>
  <text x="340" y="157" text-anchor="middle" font-size="12" fill="#8a3a36">1</text>
  <text x="560" y="157" text-anchor="middle" font-size="12" fill="#8a3a36">1（负负得正）</text>

  <!-- 行 4：实部 -->
  <g filter="url(#sk)"><rect x="40" y="166" width="620" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="70" y="185" font-size="12" font-weight="bold" fill="#2f5d25">实部 = a·c − b·d</text>
  <text x="340" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25">1 − 1 = 0</text>
  <text x="560" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25">1 − 1 = 0</text>

  <!-- 行 5 -->
  <g filter="url(#sk)"><rect x="40" y="194" width="620" height="26" fill="#ffffff" stroke="#c8d4e0" stroke-width="0.9"/></g>
  <text x="70" y="211" font-size="11.5" fill="#555">a · d</text>
  <text x="340" y="211" text-anchor="middle" font-size="12" fill="#2f4a66">1</text>
  <text x="560" y="211" text-anchor="middle" font-size="12" fill="#2f4a66">−1</text>

  <!-- 行 6 -->
  <g filter="url(#sk)"><rect x="40" y="220" width="620" height="26" fill="#f4f7fa" stroke="#c8d4e0" stroke-width="0.9"/></g>
  <text x="70" y="237" font-size="11.5" fill="#555">b · c</text>
  <text x="340" y="237" text-anchor="middle" font-size="12" fill="#2f4a66">1</text>
  <text x="560" y="237" text-anchor="middle" font-size="12" fill="#2f4a66">−1</text>

  <!-- 行 7：虚部 -->
  <g filter="url(#sk)"><rect x="40" y="246" width="620" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="70" y="265" font-size="12" font-weight="bold" fill="#2f4a66">虚部 = a·d + b·c</text>
  <text x="340" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">1 + 1 = 2</text>
  <text x="560" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">−1 − 1 = −2</text>

  <!-- 行 8：输出 -->
  <g filter="url(#sk)"><rect x="40" y="274" width="620" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="70" y="294" font-size="12" font-weight="bold" fill="#7a5415">输出字符串</text>
  <text x="340" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25">"0+2i"</text>
  <text x="560" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a36">"0+-2i"</text>

  <!-- 注解 -->
  <g filter="url(#sk)"><rect x="40" y="318" width="620" height="66" rx="8" fill="#ffffff" stroke="#8fa3b8" stroke-width="1.4"/></g>
  <text x="62" y="338" font-size="11.5" fill="#333">· 两条样例的实部都恰好为 0，是因为 b·d 与 a·c 相等，不是特例的巧合。</text>
  <text x="62" y="358" font-size="11.5" fill="#333">· 示例 2 的 b、d 同为 −1，b·d = +1；虚部两项各为 −1，相加得 −2。</text>
  <text x="62" y="378" font-size="11.5" fill="#8a3a36">· 输出必须保留 "0+-2i" 的形态：'+' 是固定分隔符，不能化简成 "0-2i"。</text>
</svg>
