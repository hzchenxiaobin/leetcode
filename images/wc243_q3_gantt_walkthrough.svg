<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：甘特图（servers = [3,3,2]，tasks = [1,2,3,2,1,2]）</text>
  <text x="330" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">任务 j 在第 j 秒到达（j = 0…5）；占用区间为半开 [t, t+dur)</text>

  <!-- 时间刻度 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#888" text-anchor="middle">
    <text x="142" y="68">t=0</text><text x="206" y="68">t=1</text><text x="270" y="68">t=2</text>
    <text x="334" y="68">t=3</text><text x="398" y="68">t=4</text><text x="462" y="68">t=5</text>
    <text x="526" y="68">t=6</text><text x="590" y="68">t=7</text>
  </g>
  <g filter="url(#rough2)" stroke="#e0e0e0" stroke-width="1">
    <line x1="174" y1="74" x2="174" y2="232"/><line x1="238" y1="74" x2="238" y2="232"/>
    <line x1="302" y1="74" x2="302" y2="232"/><line x1="366" y1="74" x2="366" y2="232"/>
    <line x1="430" y1="74" x2="430" y2="232"/><line x1="494" y1="74" x2="494" y2="232"/>
    <line x1="558" y1="74" x2="558" y2="232"/>
  </g>

  <!-- t=5 竖直强调线 -->
  <line x1="430" y1="74" x2="430" y2="232" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="452" y="86" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">t=5：三台同刻完成</text>

  <!-- 行标签 -->
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <text x="40" y="112">#0 · w=3</text>
    <text x="40" y="162">#1 · w=3</text>
    <text x="40" y="212">#2 · w=2</text>
  </g>

  <!-- #0 行：T2 [2,5) -->
  <rect x="238" y="92" width="192" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="334" y="115" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">T2（3 秒）[2,5)</text>

  <!-- #1 行：T4 [4,5) -->
  <rect x="366" y="142" width="64" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="398" y="165" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T4</text>

  <!-- #2 行：T0 [0,1), T1 [1,3), T3 [3,5), T5 [5,7) -->
  <rect x="110" y="192" width="64" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="142" y="215" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">T0</text>
  <rect x="174" y="192" width="128" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="238" y="215" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">T1（2 秒）[1,3)</text>
  <rect x="302" y="192" width="128" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="366" y="215" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">T3（2 秒）[3,5)</text>
  <rect x="430" y="192" width="128" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="494" y="215" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">T5（2 秒）[5,7)</text>

  <!-- 快进箭头：处理 j=4 后 free 空 -->
  <path d="M 400 236 C 408 258, 448 258, 452 232" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4"
        fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="330" y="262" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">处理 j=4 后 free = ∅ → 处理 j=5 时 now 快进到 5</text>

  <!-- ans 条 -->
  <text x="40" y="292" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">ans</text>
  <g filter="url(#rough2)">
    <rect x="110" y="280" width="78" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="149" y="295" text-anchor="middle" font-size="10" fill="#333">T0→#2</text>
    <rect x="194" y="280" width="78" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="233" y="295" text-anchor="middle" font-size="10" fill="#333">T1→#2</text>
    <rect x="278" y="280" width="78" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="317" y="295" text-anchor="middle" font-size="10" fill="#333">T2→#0</text>
    <rect x="362" y="280" width="78" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="401" y="295" text-anchor="middle" font-size="10" fill="#333">T3→#2</text>
    <rect x="446" y="280" width="78" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="485" y="295" text-anchor="middle" font-size="10" fill="#333">T4→#1</text>
    <rect x="530" y="280" width="78" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="569" y="295" text-anchor="middle" font-size="10" fill="#333">T5→#2</text>
  </g>

  <!-- 两个要点 -->
  <rect x="40" y="322" width="292" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="186" y="342" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">t=2：busy 堆顶完成 = 3 &gt; 2 → 不释放；</text>
  <text x="186" y="358" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">free = {(3,#0),(3,#1)} 权重并列取下标小</text>
  <text x="186" y="374" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">→ T2 由 #0 处理</text>

  <rect x="352" y="322" width="268" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="486" y="342" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">t=5：#0、#1、#2 同刻完成</text>
  <text x="486" y="358" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">while 全释放后 free = 三台全在，</text>
  <text x="486" y="374" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">按 (权重, 下标) 选 (2, #2) → T5 归 #2</text>
</svg>
