<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">名额约束：每个入选者在后缀 [τ, x] 里占 2 秒</text>
  <text x="260" y="46" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">设在秒 τ 时刻回望：清零秒 = first[v] ≥ τ、标记秒 &gt; first[v] ≥ τ，都被锁进后缀</text>

  <!-- 时间轴：秒 τ..x，共 8 格 -->
  <rect x="58" y="120" width="52" height="40" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="114" y="120" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="170" y="120" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="226" y="120" width="52" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="282" y="120" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="338" y="120" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="394" y="120" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="450" y="120" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <text x="84" y="145" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">τ</text>
  <text x="140" y="145" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">清①</text>
  <text x="196" y="145" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">清②</text>
  <text x="252" y="145" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">清③</text>
  <text x="308" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">标①</text>
  <text x="364" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">标②</text>
  <text x="420" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">标③</text>
  <text x="476" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">x</text>

  <text x="84" y="174" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒τ</text>
  <text x="140" y="174" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">τ+1</text>
  <text x="196" y="174" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">τ+2</text>
  <text x="252" y="174" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">τ+3</text>
  <text x="308" y="174" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">τ+4</text>
  <text x="364" y="174" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">τ+5</text>
  <text x="420" y="174" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">τ+6</text>
  <text x="476" y="174" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">秒x</text>

  <!-- 清零→标记 的配对箭头 -->
  <path d="M140,116 C140,96 308,96 308,116" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M196,116 C196,80 364,80 364,116" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M252,116 C252,64 420,64 420,116" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="224" y="92" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">标记必须严格晚于自己的清零</text>

  <!-- 后缀大括号 -->
  <path d="M84,186 C84,196 80,200 74,202 L74,210 C150,216 400,216 476,210 L476,202 C470,200 466,196 466,186"
        fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">后缀 [τ, x]：共 x − τ + 1 秒</text>

  <!-- 容量公式框 -->
  <rect x="58" y="248" width="444" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2 × |{ 入选者 v : first[v] ≥ τ }| ≤ x − τ + 1　（对一切 τ）</text>

  <!-- 解释框 -->
  <rect x="58" y="302" width="444" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="322" font-size="11.5" fill="#333" filter="url(#rough2)">k 个清零秒 + k 个标记秒，全部互异且都落在后缀里（k = first ≥ τ 的入选数）</text>
  <text x="74" y="340" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ 这正是「带截止期的单位任务调度」的 Hall 容量条件</text>
</svg>
