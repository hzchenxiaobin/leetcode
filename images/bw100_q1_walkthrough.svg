<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：money=20，children=3</text>

  <!-- 步骤 1 -->
  <rect x="50" y="56" width="420" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">① 先每人垫 1 美元：剩 extra = 20 − 3 = 17 美元</text>
  <text x="260" y="94" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">（children ≤ money，存在可行分配）</text>

  <path d="M 260 106 L 260 128" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="50" y="132" width="420" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">② 每个恰好 8 美元档再花 7 元：q = min(⌊17/7⌋, 3) = 2</text>
  <text x="260" y="170" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">两人各再拿 7 元变成 8，剩余 leftover = 17 − 14 = 3 元</text>

  <path d="M 260 182 L 260 204" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="50" y="208" width="420" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">③ 剩下 1 个儿童要吸收 3 元：1 + 3 = 4 美元 ✗</text>
  <text x="260" y="250" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">（children − q = 1 且 leftover = 3，踩中陷阱）</text>

  <!-- 三个孩子 -->
  <g filter="url(#rough2)">
    <circle cx="160" cy="288" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="160" y="293" text-anchor="middle" font-size="15" fill="#2f5527">8</text>
    <circle cx="260" cy="288" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="260" y="293" text-anchor="middle" font-size="15" fill="#2f5527">8</text>
    <circle cx="368" cy="288" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <text x="368" y="293" text-anchor="middle" font-size="15" fill="#8c3a36">4</text>
  </g>

  <!-- 结论 -->
  <rect x="330" y="322" width="170" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="340" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">退一档：q−1 = 1 ✓</text>
  <path d="M 368 314 L 380 322" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="120" y="340" font-size="12" fill="#666" filter="url(#rough2)">改为 (8, 9, 3)：1 人拿 8，无 4 → 答案 1</text>
</svg>
