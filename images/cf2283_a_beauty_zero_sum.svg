<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">美丽数 ⟺ 其余数字之和为 0</text>
  <text x="280" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">例子：板上数字 −4, −1, 2, 3, 5，全部之和 S = 5，所以 5 是美丽数</text>

  <rect x="116" y="76" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="184" y="76" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="252" y="76" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="320" y="76" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="388" y="76" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="144" y="102" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">−4</text>
  <text x="212" y="102" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">−1</text>
  <text x="280" y="102" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="348" y="102" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="416" y="102" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">5</text>

  <text x="416" y="66" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">x = 5（美丽数）</text>
  <text x="112" y="140" font-size="9.5" fill="#999" filter="url(#rough2)">板上的数字，每个恰好出现一次</text>

  <path d="M 416 122 L 416 146" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="152" width="440" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">x 是美丽数 ⟺ x + Σ(其余) = x ⟺ Σ(其余) = 0</text>
  <text x="280" y="196" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">本例：(−4) + (−1) + 2 + 3 = 0，所以 5 等于全体之和</text>

  <rect x="60" y="226" width="440" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="246" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">重要推论</text>
  <text x="76" y="264" font-size="10" fill="#555" filter="url(#rough2)">留下 x 之后，只需要让「其余留下的数」凑出和为 0 的集合，x 就美丽；</text>
  <text x="76" y="281" font-size="10" fill="#555" filter="url(#rough2)">换句话说：被删除的数与 x 打包在一起，其总和恰好等于全部数字之和 T。</text>

  <text x="280" y="316" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">T 表示黑板上所有数字之和（包括 x 自己）</text>
</svg>
