<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">两条求和路径：整体相加 vs 拆位相加</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array row -->
  <text x="58" y="94" font-size="13" fill="#666">nums =</text>
  <g filter="url(#sk)">
    <rect x="108" y="66" width="62" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="139" y="95" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)">
    <rect x="184" y="66" width="62" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="215" y="95" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b6e9e">15</text>
  <g filter="url(#sk)">
    <rect x="260" y="66" width="62" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="291" y="95" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b6e9e">6</text>
  <g filter="url(#sk)">
    <rect x="336" y="66" width="62" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="367" y="95" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b6e9e">3</text>

  <!-- element sum path (upper right) -->
  <g filter="url(#sk)">
    <path d="M 404 80 Q 428 74 444 74" stroke="#4a8edb" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="424" y="62" text-anchor="middle" font-size="10" fill="#2b6e9e">整体相加</text>
  <g filter="url(#sk)">
    <rect x="450" y="52" width="200" height="58" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="550" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">元素和</text>
  <text x="550" y="98" text-anchor="middle" font-size="14" fill="#444" font-family="monospace">1+15+6+3 = 25</text>

  <!-- splitting arrows down to digits -->
  <g filter="url(#sk)">
    <path d="M 139 116 Q 139 140 139 158" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="139" y="140" text-anchor="start" font-size="9" fill="#999" transform="rotate(90 139 140)"> </text>
  <g filter="url(#sk)">
    <path d="M 205 116 Q 196 140 189 158" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 225 116 Q 234 140 241 158" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 291 116 Q 291 140 291 158" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 367 116 Q 367 140 367 158" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="410" y="140" font-size="10" fill="#999">拆位</text>

  <!-- digit boxes -->
  <g filter="url(#sk)">
    <rect x="114" y="162" width="44" height="38" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="136" y="187" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">1</text>
  <g filter="url(#sk)">
    <rect x="170" y="162" width="44" height="38" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="192" y="187" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">1</text>
  <g filter="url(#sk)">
    <rect x="224" y="162" width="44" height="38" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="246" y="187" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">5</text>
  <g filter="url(#sk)">
    <rect x="278" y="162" width="44" height="38" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="300" y="187" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">6</text>
  <g filter="url(#sk)">
    <rect x="332" y="162" width="44" height="38" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="354" y="187" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">3</text>

  <!-- digit sum path (lower right) -->
  <g filter="url(#sk)">
    <path d="M 384 182 Q 418 182 444 182" stroke="#4a8e4a" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="450" y="152" width="200" height="58" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="550" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">数字和</text>
  <text x="550" y="198" text-anchor="middle" font-size="14" fill="#444" font-family="monospace">1+1+5+6+3 = 16</text>

  <!-- result box -->
  <g filter="url(#sk)">
    <path d="M 550 216 Q 550 240 500 252" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 550 216 Q 550 244 520 254" stroke="#c98a2b" stroke-width="0" fill="none"/>
  </g>
  <g filter="url(#sk)">
    <rect x="230" y="248" width="230" height="50" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="345" y="270" text-anchor="middle" font-size="12" fill="#7a5415">答案 = |25 − 16|</text>
  <text x="345" y="290" text-anchor="middle" font-size="17" font-weight="bold" fill="#7a5415" font-family="monospace">= 9</text>
  <g filter="url(#sk)">
    <rect x="472" y="256" width="86" height="26" rx="8" fill="#fdecec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="515" y="274" text-anchor="middle" font-size="11" fill="#a03030">9 的倍数 ✓</text>

  <!-- per-element difference annotation -->
  <g filter="url(#sk)">
    <path d="M 345 302 Q 345 312 345 320" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="70" y="322" width="540" height="60" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="90" y="344" font-size="12" font-weight="bold" fill="#2b2b2b">关键观察：</text>
  <text x="90" y="364" font-size="11" fill="#444" font-family="monospace">x − s(x) = d₁·9 + d₂·99 + …，个位贡献 0 → 元素和 ≥ 数字和，且答案必为 9 的倍数</text>
</svg>
