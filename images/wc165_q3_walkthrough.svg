<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="340" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：逐格填 dp 并累加</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每格的 dp 值就是该格贡献的正方形个数，三行相加即答案</text>

  <text x="146" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">matrix</text>
  <text x="376" y="70" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">dp</text>
  <text x="500" y="70" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">行和</text>

  <!-- matrix 网格 -->
  <g filter="url(#rough2)">
    <rect x="70" y="80" width="38" height="38" fill="#eeeeee" stroke="#999" stroke-width="1.2"/>
    <rect x="108" y="80" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="146" y="80" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="184" y="80" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>

    <rect x="70" y="118" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="108" y="118" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="146" y="118" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="184" y="118" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>

    <rect x="70" y="156" width="38" height="38" fill="#eeeeee" stroke="#999" stroke-width="1.2"/>
    <rect x="108" y="156" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="146" y="156" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="184" y="156" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle" fill="#555">
    <text x="89" y="104">0</text><text x="127" y="104">1</text>
    <text x="165" y="104">1</text><text x="203" y="104">1</text>
    <text x="89" y="142">1</text><text x="127" y="142">1</text>
    <text x="165" y="142">1</text><text x="203" y="142">1</text>
    <text x="89" y="180">0</text><text x="127" y="180">1</text>
    <text x="165" y="180">1</text><text x="203" y="180">1</text>
  </g>

  <path d="M 228 137 L 292 137" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">递推</text>

  <!-- dp 网格 -->
  <g filter="url(#rough2)">
    <rect x="300" y="80" width="38" height="38" fill="#eeeeee" stroke="#999" stroke-width="1.2"/>
    <rect x="338" y="80" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="376" y="80" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="414" y="80" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>

    <rect x="300" y="118" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="338" y="118" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="376" y="118" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="414" y="118" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>

    <rect x="300" y="156" width="38" height="38" fill="#eeeeee" stroke="#999" stroke-width="1.2"/>
    <rect x="338" y="156" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="376" y="156" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="414" y="156" width="38" height="38" fill="#fff3cd" stroke="#d6a040" stroke-width="2.4"/>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle" fill="#8a6a20">
    <text x="319" y="104">0</text><text x="357" y="104">1</text>
    <text x="395" y="104">1</text><text x="433" y="104">1</text>
    <text x="319" y="142">1</text><text x="357" y="142">1</text>
    <text x="395" y="142">2</text><text x="433" y="142">2</text>
    <text x="319" y="180">0</text><text x="357" y="180">1</text>
    <text x="395" y="180">2</text><text x="433" y="180">3</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle" fill="#3a4a66">
    <text x="500" y="104">3</text>
    <text x="500" y="142">6</text>
    <text x="500" y="180">6</text>
  </g>

  <rect x="170" y="222" width="320" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="330" y="252" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">总数 = 3 + 6 + 6 = 15</text>

  <text x="330" y="294" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">dp[2][3] = 3：以 (2,3) 为右下角有边长 1、2、3 三个全 1 方块</text>
  <text x="330" y="314" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">其中边长 3 的那个，正是示例里唯一一个 3 × 3 全 1 方块</text>
</svg>
