<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 572" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arry" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="572" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：k = 3，行、列各排一次拓扑序，坐标拼装出矩阵</text>

  <!-- ===== 左：行 DAG ===== -->
  <g filter="url(#rough2)">
    <text x="145" y="52" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">行 DAG：1→2，3→2</text>
    <circle cx="90" cy="105" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="90" y="110" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
    <circle cx="200" cy="105" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="200" y="110" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
    <circle cx="145" cy="180" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="145" y="185" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
    <path d="M 100 118 L 136 167" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)"/>
    <path d="M 190 118 L 155 167" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)"/>
    <rect x="40" y="212" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="150" y="233" text-anchor="middle" font-size="10.5" fill="#333">拓扑序 1,3,2 → row[1]=0, row[3]=1, row[2]=2</text>
  </g>

  <!-- ===== 右：列 DAG ===== -->
  <g filter="url(#rough2)">
    <text x="415" y="52" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">列 DAG：3→2→1</text>
    <circle cx="345" cy="105" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="345" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
    <circle cx="415" cy="105" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="415" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
    <circle cx="485" cy="105" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="485" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
    <path d="M 361 105 L 399 105" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)"/>
    <path d="M 431 105 L 469 105" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)"/>
    <rect x="300" y="212" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="410" y="233" text-anchor="middle" font-size="10.5" fill="#333">拓扑序 3,2,1 → col[3]=0, col[2]=1, col[1]=2</text>
  </g>

  <!-- ===== 坐标表 ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="262" width="80" height="33" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="80" y="283" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">数字 v</text>
    <rect x="120" y="262" width="60" height="33" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="150" y="283" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <rect x="180" y="262" width="60" height="33" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="210" y="283" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="240" y="262" width="60" height="33" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="270" y="283" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>

    <rect x="40" y="295" width="80" height="31" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="80" y="315" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">row[v]（行）</text>
    <rect x="120" y="295" width="60" height="31" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="150" y="315" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
    <rect x="180" y="295" width="60" height="31" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="210" y="315" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="240" y="295" width="60" height="31" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="270" y="315" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>

    <rect x="40" y="326" width="80" height="31" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="80" y="346" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">col[v]（列）</text>
    <rect x="120" y="326" width="60" height="31" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="150" y="346" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
    <rect x="180" y="326" width="60" height="31" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="210" y="346" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="240" y="326" width="60" height="31" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="270" y="346" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  </g>

  <!-- ===== 落点拼装 ===== -->
  <g filter="url(#rough2)">
    <path d="M 300 310 L 336 310" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arry)"/>
    <rect x="336" y="262" width="204" height="95" fill="#f5f5f5" stroke="#999" stroke-width="1.6" rx="8"/>
    <text x="438" y="284" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">落点拼装 (row, col)</text>
    <text x="438" y="306" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1 → (0, 2)</text>
    <text x="438" y="326" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2 → (2, 1)</text>
    <text x="438" y="346" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3 → (1, 0)</text>
  </g>

  <!-- ===== 结果矩阵 ===== -->
  <g filter="url(#rough2)">
    <text x="96" y="384" text-anchor="middle" font-size="10.5" fill="#888">列 0</text>
    <text x="148" y="384" text-anchor="middle" font-size="10.5" fill="#888">列 1</text>
    <text x="200" y="384" text-anchor="middle" font-size="10.5" fill="#888">列 2</text>
    <text x="62" y="421" text-anchor="end" font-size="10.5" fill="#888">行 0</text>
    <text x="62" y="473" text-anchor="end" font-size="10.5" fill="#888">行 1</text>
    <text x="62" y="525" text-anchor="end" font-size="10.5" fill="#888">行 2</text>

    <rect x="71" y="391" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="96" y="421" text-anchor="middle" font-size="14" fill="#999">0</text>
    <rect x="123" y="391" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="148" y="421" text-anchor="middle" font-size="14" fill="#999">0</text>
    <rect x="175" y="391" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <text x="200" y="421" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">1</text>

    <rect x="71" y="443" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="96" y="473" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">3</text>
    <rect x="123" y="443" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="148" y="473" text-anchor="middle" font-size="14" fill="#999">0</text>
    <rect x="175" y="443" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="200" y="473" text-anchor="middle" font-size="14" fill="#999">0</text>

    <rect x="71" y="495" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="96" y="525" text-anchor="middle" font-size="14" fill="#999">0</text>
    <rect x="123" y="495" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="148" y="525" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="175" y="495" width="50" height="50" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="200" y="525" text-anchor="middle" font-size="14" fill="#999">0</text>
  </g>

  <!-- ===== 检查框 ===== -->
  <g filter="url(#rough2)">
    <rect x="300" y="405" width="245" height="122" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="422" y="430" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">行检查（谁在谁上面）</text>
    <text x="422" y="452" text-anchor="middle" font-size="11.5" fill="#333">1 在第 0 行，2 在第 2 行 → 1 在 2 上方 ✓</text>
    <text x="422" y="472" text-anchor="middle" font-size="11.5" fill="#333">3 在第 1 行，2 在第 2 行 → 3 在 2 上方 ✓</text>
    <text x="422" y="492" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">列检查（谁在谁左边）</text>
    <text x="422" y="512" text-anchor="middle" font-size="11.5" fill="#333">2 在第 1 列，1 在第 2 列 ✓    3 在第 0 列 ✓</text>
  </g>

  <text x="280" y="558" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">与官方示例输出 [[3,0,0],[0,0,1],[0,2,0]] 不同，但同为合法答案（Special Judge 判题）</text>
</svg>
