<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">cnt → 要写的字符：只有 cnt ≥ 2 才写数字</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">数字按十进制逐位拆开，10 及以上要占多个格子（对应示例 "ab12"）</text>

  <text x="48" y="106" font-size="12" fill="#3a4a66" filter="url(#rough2)">"b" × 12 →</text>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="132" y="84" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="151" y="110" fill="#8a6a20">b</text>
    <rect x="176" y="84" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="195" y="110" fill="#3a5a30">1</text>
    <rect x="220" y="84" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="239" y="110" fill="#3a5a30">2</text>
  </g>

  <text x="272" y="100" font-size="10" fill="#555" filter="url(#rough2)">字符本身先写，再把 cnt 写成十进制字符串</text>
  <text x="272" y="118" font-size="10" fill="#555" filter="url(#rough2)">C++ to_string(cnt) / Python str(cnt) 天然按位给出</text>

  <g filter="url(#rough2)">
    <rect x="56" y="150" width="454" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="66" y="168" font-size="10.5" fill="#3a4a66" font-weight="bold">组长度 cnt</text>
    <text x="162" y="168" font-size="10.5" fill="#3a4a66" font-weight="bold">写入内容</text>
    <text x="308" y="168" font-size="10.5" fill="#3a4a66" font-weight="bold">占用格数</text>
    <text x="392" y="168" font-size="10.5" fill="#3a4a66" font-weight="bold">与 cnt 的关系</text>
  </g>

  <g filter="url(#rough2)" font-size="10">
    <rect x="56" y="176" width="454" height="26" fill="#fafafa" stroke="#cfcfcf" stroke-width="1" rx="4"/>
    <text x="66" y="194" fill="#555">1</text>
    <text x="162" y="194" fill="#555">只写字符本身</text>
    <text x="308" y="194" fill="#555">1</text>
    <text x="392" y="194" fill="#3a5a30">1 = 1，刚好</text>

    <rect x="56" y="204" width="454" height="26" fill="#fafafa" stroke="#cfcfcf" stroke-width="1" rx="4"/>
    <text x="66" y="222" fill="#555">2 ~ 9</text>
    <text x="162" y="222" fill="#555">字符 + 1 位数字</text>
    <text x="308" y="222" fill="#555">2</text>
    <text x="392" y="222" fill="#3a5a30">2 ≤ cnt</text>

    <rect x="56" y="232" width="454" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="66" y="250" fill="#555">10 ~ 99</text>
    <text x="162" y="250" fill="#555">字符 + 2 位数字</text>
    <text x="308" y="250" fill="#555">3</text>
    <text x="392" y="250" fill="#8a6a20">3 ≤ cnt</text>

    <rect x="56" y="260" width="454" height="26" fill="#fafafa" stroke="#cfcfcf" stroke-width="1" rx="4"/>
    <text x="66" y="278" fill="#555">100 ~ 999</text>
    <text x="162" y="278" fill="#555">字符 + 3 位数字</text>
    <text x="308" y="278" fill="#555">4</text>
    <text x="392" y="278" fill="#3a5a30">4 ≤ cnt</text>

    <rect x="56" y="288" width="454" height="26" fill="#fafafa" stroke="#cfcfcf" stroke-width="1" rx="4"/>
    <text x="66" y="306" fill="#555">1000 ~ 2000</text>
    <text x="162" y="306" fill="#555">字符 + 4 位数字</text>
    <text x="308" y="306" fill="#555">5</text>
    <text x="392" y="306" fill="#3a5a30">5 ≤ cnt</text>
  </g>

  <text x="280" y="338" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">题面保证 1 ≤ n ≤ 2000，所以 cnt 最多 4 位；不需要任何特判，交给 to_string / str 即可</text>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">这张表就是「压缩后长度必不大于原长度」的直接依据，也是 write ≤ read 不变量成立的原因</text>
</svg>
