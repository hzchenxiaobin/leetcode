<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>
  <text x="330" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">五种位置关系统一成"左段 + 右段"两个公式</text>

  <!-- 每行：数轴 + 区间条 + 红色挖除带 + 结论 -->
  <!-- Case 1 不相交 -->
  <text x="42" y="74" font-size="14" fill="#333" filter="url(#rough2)">① 不相交</text>
  <line x1="150" y1="70" x2="480" y2="70" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="150" y="62" width="100" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="58" width="120" height="24" rx="3" fill="#fce4ec" fill-opacity="0.8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">toBeRemoved</text>
  <text x="500" y="74" font-size="13" fill="#4a7a3a" filter="url(#rough2)">保留整段 [s,e)</text>

  <!-- Case 2 左端相交（挖右段） -->
  <text x="42" y="158" font-size="14" fill="#333" filter="url(#rough2)">② 挖掉右段</text>
  <line x1="150" y1="154" x2="480" y2="154" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="150" y="146" width="180" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="142" width="160" height="24" rx="3" fill="#fce4ec" fill-opacity="0.8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="158" font-size="13" fill="#4a7a3a" filter="url(#rough2)">剩 [s, rs)</text>

  <!-- Case 3 右端相交（挖左段） -->
  <text x="42" y="242" font-size="14" fill="#333" filter="url(#rough2)">③ 挖掉左段</text>
  <line x1="150" y1="238" x2="480" y2="238" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="230" width="200" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="150" y="226" width="130" height="24" rx="3" fill="#fce4ec" fill-opacity="0.8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="242" font-size="13" fill="#4a7a3a" filter="url(#rough2)">剩 [re, e)</text>

  <!-- Case 4 完全包含 -->
  <text x="42" y="326" font-size="14" fill="#333" filter="url(#rough2)">④ 完全包含</text>
  <line x1="150" y1="322" x2="480" y2="322" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="230" y="314" width="90" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="180" y="310" width="200" height="24" rx="3" fill="#fce4ec" fill-opacity="0.8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="326" font-size="13" fill="#b85450" filter="url(#rough2)">整段消失</text>

  <!-- Case 5 严格内部 -->
  <text x="42" y="410" font-size="14" fill="#333" filter="url(#rough2)">⑤ 严格内部</text>
  <line x1="150" y1="406" x2="480" y2="406" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="150" y="398" width="300" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="250" y="394" width="110" height="24" rx="3" fill="#fce4ec" fill-opacity="0.8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="406" font-size="13" fill="#4a7a3a" filter="url(#rough2)">一分为二</text>

  <!-- 图例 -->
  <rect x="150" y="434" width="60" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="444" font-size="12" fill="#666" filter="url(#rough2)">原区间 [s,e)</text>
  <rect x="330" y="432" width="60" height="16" rx="3" fill="#fce4ec" fill-opacity="0.8" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="400" y="444" font-size="12" fill="#666" filter="url(#rough2)">toBeRemoved [rs,re)</text>
  <text x="150" y="462" font-size="12" fill="#666" filter="url(#rough2)">五种情形全部被两个公式覆盖：左段 [s, min(e,rs))，右段 [max(s,re), e)（非空才保留）</text>
</svg>
