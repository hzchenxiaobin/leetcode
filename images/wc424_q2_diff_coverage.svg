<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：每个下标只关心「被多少个区间覆盖」</text>
  <path d="M 150 38 Q 340 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="340" y="64" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">示例 2：nums = [4,3,2,1]，queries = [[1,3],[0,2]]</text>

  <!-- nums row -->
  <text x="188" y="112" text-anchor="end" font-size="13" fill="#2b2b2b" font-weight="bold">nums</text>
  <g filter="url(#sk)">
    <rect x="216" y="88" width="62" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="278" y="88" width="62" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="340" y="88" width="62" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="402" y="88" width="62" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="247" y="115" text-anchor="middle" font-size="14.5" fill="#b03a3a" font-weight="bold">4</text>
  <text x="309" y="115" text-anchor="middle" font-size="14.5" fill="#b03a3a">3</text>
  <text x="371" y="115" text-anchor="middle" font-size="14.5" fill="#2b6e9e">2</text>
  <text x="433" y="115" text-anchor="middle" font-size="14.5" fill="#2b6e9e">1</text>
  <text x="247" y="146" text-anchor="middle" font-size="10.5" fill="#888">j = 0</text>
  <text x="309" y="146" text-anchor="middle" font-size="10.5" fill="#888">j = 1</text>
  <text x="371" y="146" text-anchor="middle" font-size="10.5" fill="#888">j = 2</text>
  <text x="433" y="146" text-anchor="middle" font-size="10.5" fill="#888">j = 3</text>

  <!-- coverage bars -->
  <g filter="url(#sk)">
    <rect x="278" y="158" width="186" height="24" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="371" y="175" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">query [1,3]：每个下标至多减 1</text>
  <g filter="url(#sk)">
    <rect x="216" y="188" width="186" height="24" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="309" y="205" text-anchor="middle" font-size="11.5" fill="#2b6e9e" font-weight="bold">query [0,2]：每个下标至多减 1</text>

  <!-- arrow to cover -->
  <path d="M 340 222 L 340 240" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="352" y="236" font-size="10.5" fill="#888">叠起来数一数</text>

  <!-- cover row -->
  <text x="188" y="282" text-anchor="end" font-size="13" fill="#2b2b2b" font-weight="bold">cover</text>
  <g filter="url(#sk)">
    <rect x="216" y="258" width="62" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="278" y="258" width="62" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="340" y="258" width="62" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="402" y="258" width="62" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="247" y="283" text-anchor="middle" font-size="14.5" fill="#8a6414" font-weight="bold">1</text>
  <text x="309" y="283" text-anchor="middle" font-size="14.5" fill="#8a6414" font-weight="bold">2</text>
  <text x="371" y="283" text-anchor="middle" font-size="14.5" fill="#8a6414" font-weight="bold">2</text>
  <text x="433" y="283" text-anchor="middle" font-size="14.5" fill="#8a6414" font-weight="bold">1</text>

  <!-- per-index verdicts -->
  <text x="247" y="316" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">4 &gt; 1 ✗</text>
  <text x="309" y="316" text-anchor="middle" font-size="11.5" fill="#b03a3a" font-weight="bold">3 &gt; 2 ✗</text>
  <text x="371" y="316" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">2 ≤ 2 ✓</text>
  <text x="433" y="316" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">1 ≤ 1 ✓</text>

  <!-- conclusion box -->
  <g filter="url(#sk)">
    <rect x="40" y="338" width="600" height="116" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="340" y="364" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b">判定：nums 能变成零数组 ⟺ 对每个 j 都有 nums[j] ≤ cover(j)</text>
  <text x="340" y="388" text-anchor="middle" font-size="11.5" fill="#444">「选子集」= 每个查询对每个下标独立地「减 1 / 不减」→ 单查询对单点至多贡献 1</text>
  <text x="340" y="410" text-anchor="middle" font-size="11.5" fill="#444">顺序与子集方案都是幌子：cover(j) 就是下标 j 可用减量的全部信息</text>
  <text x="340" y="438" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">下标 0 只被覆盖 1 次，最多减 1，却需要减 4 → false（统计覆盖 → 差分数组）</text>
</svg>
