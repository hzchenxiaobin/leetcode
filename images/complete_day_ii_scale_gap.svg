<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="38" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">Q1 → Q2：n 放大 5000 倍，暴力宣判死刑</text>

  <!-- Q1 box -->
  <rect x="28" y="70" width="205" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="130" y="96" text-anchor="middle" font-size="14" fill="#2c4a24" filter="url(#rough2)">Q1（#3184）</text>
  <text x="130" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n ≤ 100</text>
  <text x="130" y="140" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">暴力至多 4950 对</text>
  <text x="130" y="166" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">✓ 暴力秒过</text>

  <!-- arrow -->
  <path d="M238,129 L282,129" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Q2 box -->
  <rect x="287" y="70" width="205" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="390" y="96" text-anchor="middle" font-size="14" fill="#7c2b28" filter="url(#rough2)">Q2（#3185）</text>
  <text x="390" y="118" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n ≤ 5×10⁵</text>
  <text x="390" y="140" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">暴力 ≈ 1.25×10¹¹ 对</text>
  <text x="390" y="166" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">✗ 超时约百秒级</text>

  <!-- arrows down -->
  <path d="M130,188 Q135,212 195,224" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M390,188 Q385,212 325,224" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- solution box -->
  <rect x="80" y="228" width="360" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="253" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">正解：单趟扫描 + 24 桶余数计数</text>
  <text x="260" y="277" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">O(n)：5×10⁵ 次 O(1) 查表，✓ 几毫秒</text>

  <text x="260" y="326" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">本质：不枚举配对，枚举右端点 j，用桶计数取代整层内循环</text>
</svg>
