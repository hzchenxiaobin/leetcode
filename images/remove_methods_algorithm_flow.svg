<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：建图 → 一遍 BFS 标记 → 一趟扫边判定</text>

  <!-- 开始 -->
  <rect x="172" y="44" width="56" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="60" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">开始</text>
  <path d="M 200 68 L 200 82" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 建邻接表 -->
  <rect x="100" y="82" width="200" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="101" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">① 建邻接表：g[a] 追加 b</text>
  <text x="310" y="101" font-size="9" fill="#999" filter="url(#rough2)">O(m)</text>
  <path d="M 200 112 L 200 126" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② BFS -->
  <rect x="78" y="126" width="244" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="145" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">② 从 k 开始 BFS，标记 susp[ ]</text>
  <text x="332" y="145" font-size="9" fill="#999" filter="url(#rough2)">O(n+m)</text>
  <path d="M 200 156 L 200 170" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 判定菱形 -->
  <polygon points="200,170 320,216 200,262 80,216" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="207" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">③ 任意调用边 (a,b)：</text>
  <text x="200" y="225" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">susp[a]=0 且 susp[b]=1 ？</text>

  <!-- 是 → 右分支 -->
  <path d="M 320 216 L 344 216" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="332" y="208" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="344" y="192" width="164" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="426" y="212" text-anchor="middle" font-size="10.5" fill="#7a3530" font-weight="bold" filter="url(#rough2)">返回 [0,1,…,n−1]</text>
  <text x="426" y="230" text-anchor="middle" font-size="10" fill="#7a3530" filter="url(#rough2)">一条入侵边即全盘放弃</text>

  <!-- 否 → 下分支 -->
  <path d="M 200 262 L 200 278" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="212" y="275" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="96" y="278" width="208" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="297" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">④ 收集所有 susp[i]=0 的方法返回</text>

  <!-- 汇合到结束 -->
  <rect x="352" y="330" width="56" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="346" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">结束</text>
  <path d="M 426 240 L 426 342 L 412 342" stroke="#a07830" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 304 293 L 380 293 L 380 326" stroke="#a07830" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 侧注 -->
  <text x="426" y="120" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">② 用迭代队列：</text>
  <text x="426" y="134" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">n=10⁵ 长链会爆递归栈</text>
  <text x="60" y="130" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">入队即标记</text>
  <text x="60" y="144" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">环自动终止</text>
</svg>
