<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#446688"/></marker>
    <marker id="rr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#r)">算法流程：t 轮计数转移</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- step 1 -->
  <rect x="52" y="62" width="150" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="127" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34507a" filter="url(#r)">① 统计频率</text>
  <text x="127" y="104" text-anchor="middle" font-size="11" fill="#555" font-family="monospace" filter="url(#r)">cnt[c-'a']++，O(n)</text>
  <path d="M 204 91 Q 228 91 246 91" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>

  <!-- step 2: loop box -->
  <rect x="250" y="56" width="250" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#r)"/>
  <text x="375" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07520" filter="url(#r)">② 重复 t 次（每轮 O(26)）</text>
  <rect x="264" y="88" width="222" height="24" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="1.4" filter="url(#r)"/>
  <text x="375" y="104" text-anchor="middle" font-size="11.5" fill="#b85450" font-family="monospace" filter="url(#r)">z = cnt[25]   ← 先暂存！</text>
  <rect x="264" y="116" width="222" height="24" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" filter="url(#r)"/>
  <text x="375" y="132" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-family="monospace" filter="url(#r)">i=25..1 倒序：cnt[i]=cnt[i-1]</text>
  <rect x="264" y="144" width="222" height="24" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#r)"/>
  <text x="375" y="160" text-anchor="middle" font-size="11.5" fill="#34507a" font-family="monospace" filter="url(#r)">cnt[0]=z； cnt[1]=(cnt[1]+z)%MOD</text>
  <path d="M 500 112 Q 540 112 540 96 Q 540 66 506 66" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#rr)" filter="url(#r)"/>
  <text x="556" y="92" text-anchor="middle" font-size="11" fill="#a07520" filter="url(#r)">×t</text>

  <!-- step 3 -->
  <path d="M 375 172 Q 375 196 375 212" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <rect x="300" y="216" width="150" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r)"/>
  <text x="375" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">③ 求和取模</text>
  <text x="375" y="258" text-anchor="middle" font-size="11" fill="#555" font-family="monospace" filter="url(#r)">ans = Σcnt mod 10⁹+7</text>

  <!-- in-place note -->
  <rect x="42" y="296" width="556" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#r)"/>
  <text x="320" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34507a" filter="url(#r)">为什么「倒序搬移」能原地完成？</text>
  <text x="70" y="344" font-size="11.5" fill="#333" filter="url(#r)">写 cnt[i]、读 cnt[i-1]：每个被覆盖的位置，本轮之后不再被读；</text>
  <text x="70" y="364" font-size="11.5" fill="#333" filter="url(#r)">而 cnt[25]（旧 z）必须在搬移前暂存，否则会被 cnt[24] 覆盖丢失。</text>
  <text x="70" y="390" font-size="11.5" fill="#b85450" filter="url(#r)">两个高危点：暂存顺序写反 ×cnt[1] 是「搬移+分裂」叠加位（要 +=）</text>
</svg>
