<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="720" height="560" fill="#fdfcf7"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：双重循环，命中即返回</text>
  <path d="M 170 42 Q 360 50 550 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <ellipse cx="240" cy="74" rx="44" ry="20" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="79" text-anchor="middle" font-size="13" fill="#2b2b2b">开始</text>
  <path d="M 240 94 L 240 106" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- outer loop -->
  <rect x="150" y="110" width="180" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="134" text-anchor="middle" font-size="12" fill="#2b2b2b">外层循环 i = 0 … n−1</text>
  <path d="M 240 148 L 240 160" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- inner loop -->
  <rect x="150" y="164" width="180" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="240" y="188" text-anchor="middle" font-size="12" fill="#2b2b2b">内层循环 j = i+D … n−1</text>
  <text x="340" y="180" font-size="10.5" fill="#888">D = 0 时 j 从 i 起步，</text>
  <text x="340" y="196" font-size="10.5" fill="#888">天然覆盖 i = j（题面允许）</text>
  <path d="M 240 202 L 240 222" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1: value check -->
  <polygon points="135,262 240,228 345,262 240,296" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <text x="240" y="258" text-anchor="middle" font-size="11.5" fill="#2b2b2b">|nums[i] − nums[j]|</text>
  <text x="240" y="274" text-anchor="middle" font-size="11.5" fill="#2b2b2b">≥ V ?</text>
  <text x="408" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 345 262 L 474 262" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="250" y="312" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <text x="278" y="312" font-size="10" fill="#888">（≥ 含等于，压线达标）</text>
  <path d="M 240 296 L 240 316" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- green terminal -->
  <g filter="url(#sk)">
    <rect x="480" y="238" width="190" height="48" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="575" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 [i, j] ✓</text>
  <text x="575" y="276" text-anchor="middle" font-size="10.5" fill="#4a7a3a">（任意一组合法解即可）</text>

  <!-- diamond 2: inner loop done? -->
  <polygon points="155,352 240,322 325,352 240,382" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <text x="240" y="357" text-anchor="middle" font-size="11.5" fill="#2b2b2b">内层结束？</text>
  <text x="126" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <path d="M 155 352 L 98 352 L 98 183 L 144 183" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="126" y="370" text-anchor="middle" font-size="10.5" fill="#666">j++</text>
  <text x="250" y="398" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 240 382 L 240 402" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 3: outer loop done? -->
  <polygon points="155,436 240,406 325,436 240,466" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8" filter="url(#sk)"/>
  <text x="240" y="441" text-anchor="middle" font-size="11.5" fill="#2b2b2b">外层结束？</text>
  <text x="126" y="428" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <path d="M 155 436 L 60 436 L 60 129 L 144 129" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="100" y="454" text-anchor="middle" font-size="10.5" fill="#666">i++</text>
  <text x="250" y="484" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 240 466 L 240 486" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- pink terminal -->
  <g filter="url(#sk)">
    <rect x="155" y="490" width="170" height="48" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="240" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 [−1, −1]</text>
  <text x="240" y="528" text-anchor="middle" font-size="10.5" fill="#a05050">（不存在满足条件的数对）</text>

  <!-- upgrade dashed box -->
  <g filter="url(#sk)">
    <rect x="470" y="348" width="236" height="190" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="482" y="372" font-size="12" font-weight="bold" fill="#2b2b2b">进阶：按 O(n) 写，通吃 Q3</text>
  <text x="482" y="396" font-size="10.8" fill="#444">对每个 j，合法 i 组成前缀 [0, j−D]，</text>
  <text x="482" y="416" font-size="10.8" fill="#444">只增不减 → 维护前缀 minIdx / maxIdx</text>
  <text x="482" y="436" font-size="10.8" fill="#444">两个代表，每轮 O(1) 判定值差条件。</text>
  <text x="482" y="466" font-size="10.8" fill="#444">同一份 O(n) 代码提交本题与</text>
  <text x="482" y="486" font-size="10.8" fill="#444">Q3（#2905，n ≤ 10⁵）均 AC。</text>
  <text x="482" y="516" font-size="10.8" font-weight="bold" fill="#8e5db8">算法细节与证明 → 见 Q3 题解</text>
</svg>
