<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">无解证明：失效组把数轴切成低、高两半</text>
  <path d="M 170 34 Q 320 42 470 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="60" y="104" width="170" height="11" rx="5" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="310" y="104" width="270" height="11" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <path d="M 55 109 L 590 109" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="268" cy="109" r="4" fill="#f2f2f0" stroke="#888" stroke-width="1.3"/></g>

  <text x="100" y="98" text-anchor="middle" font-size="11" fill="#777">a[0]</text>
  <text x="230" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">a[3i]</text>
  <text x="268" y="132" text-anchor="middle" font-size="11" fill="#888">a[3i+1]</text>
  <text x="310" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">a[3i+2]</text>
  <text x="560" y="98" text-anchor="middle" font-size="11" fill="#777">a[n−1]</text>

  <text x="145" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">低元素 ≥ 3i+1 个（值 ≤ a[3i]）</text>
  <text x="445" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">高元素 ≥ n−3i−2 个（值 ≥ a[3i+2]）</text>

  <path d="M 150 122 Q 320 195 478 122" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="6,4" filter="url(#sk)"/>
  <text x="320" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">✗</text>
  <text x="320" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">两半之差 ≥ a[3i+2] − a[3i] &gt; k ⇒ 低、高元素不能同组</text>

  <g filter="url(#sk)"><rect x="55" y="214" width="250" height="66" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="180" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">含低元素的组</text>
  <text x="180" y="256" text-anchor="middle" font-size="11" fill="#444">每组至多装 3 个低元素</text>
  <text x="180" y="272" text-anchor="middle" font-size="12" fill="#444">⇒ 至少 ⌈(3i+1)/3⌉ = i+1 组</text>

  <text x="318" y="254" text-anchor="middle" font-size="20" font-weight="bold" fill="#555">+</text>

  <g filter="url(#sk)"><rect x="335" y="214" width="250" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="460" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">含高元素的组</text>
  <text x="460" y="256" text-anchor="middle" font-size="11" fill="#444">每组至多装 3 个高元素</text>
  <text x="460" y="272" text-anchor="middle" font-size="12" fill="#444">⇒ 至少 ⌈(n−3i−2)/3⌉ = m−i 组</text>

  <g filter="url(#sk)"><rect x="80" y="298" width="480" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="320" y="316" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36">两类组互不重合 ⟹ 总组数 ≥ (i+1) + (m−i) = m+1</text>
  <text x="320" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36">但划分总共只有 m = n/3 组 —— m ≥ m+1，矛盾！</text>

  <g filter="url(#sk)"><rect x="70" y="358" width="500" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="320" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">顺序三分组任一组失败 ⇒ 不存在合法划分 ⇒ 返回 [] 是对的</text>

  <text x="320" y="424" text-anchor="middle" font-size="11" fill="#999">其中 n = 3m，m 为组数；⌈·⌉ 为上取整</text>
</svg>
