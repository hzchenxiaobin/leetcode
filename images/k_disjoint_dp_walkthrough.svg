<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="620" height="470" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例 1 演算：nums = [1,2,3,−1,2]，k = 3（系数 +3 / −2 / +1）</text>
  <path d="M 170 36 Q 310 43 450 36" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- table header -->
  <g filter="url(#r)">
    <rect x="40" y="60" width="135" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="175" y="60" width="135" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="310" y="60" width="135" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="445" y="60" width="135" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#r)">
    <text x="107" y="82">已处理元素</text>
    <text x="242" y="82">j = 1（×3）</text>
    <text x="377" y="82">j = 2（×−2）</text>
    <text x="512" y="82">j = 3（×1）</text>
  </g>

  <!-- row: init -->
  <g filter="url(#r)">
    <rect x="40" y="94" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
    <rect x="175" y="94" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
    <rect x="310" y="94" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
    <rect x="445" y="94" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="12" filter="url(#r)">
    <text x="107" y="120" font-weight="bold" fill="#446688">初值 f0[0]=0</text>
    <text x="242" y="120" fill="#333">(—, —)</text>
    <text x="377" y="120" fill="#333">(—, —)</text>
    <text x="512" y="120" fill="#333">(—, —)</text>
  </g>

  <!-- row: x=1 -->
  <g filter="url(#r)">
    <rect x="40" y="136" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
    <rect x="175" y="136" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
    <rect x="310" y="136" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
    <rect x="445" y="136" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="12" filter="url(#r)">
    <text x="107" y="162" font-weight="bold" fill="#446688">x = 1</text>
    <text x="242" y="162" fill="#333">(—, 3)</text>
    <text x="377" y="162" fill="#333">(—, —)</text>
    <text x="512" y="162" fill="#333">(—, —)</text>
  </g>

  <!-- row: x=2 -->
  <g filter="url(#r)">
    <rect x="40" y="178" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
    <rect x="175" y="178" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
    <rect x="310" y="178" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
    <rect x="445" y="178" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="12" filter="url(#r)">
    <text x="107" y="204" font-weight="bold" fill="#446688">x = 2</text>
    <text x="242" y="204" fill="#333">(3, 9)</text>
    <text x="377" y="204" fill="#333">(—, −1)</text>
    <text x="512" y="204" fill="#333">(—, —)</text>
  </g>

  <!-- row: x=3 -->
  <g filter="url(#r)">
    <rect x="40" y="220" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
    <rect x="175" y="220" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
    <rect x="310" y="220" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
    <rect x="445" y="220" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="12" filter="url(#r)">
    <text x="107" y="246" font-weight="bold" fill="#446688">x = 3</text>
    <text x="242" y="246" fill="#333">(9, <tspan font-weight="bold" fill="#b85450">18</tspan>)</text>
    <text x="377" y="246" fill="#333">(−1, 3)</text>
    <text x="512" y="246" fill="#333">(—, 2)</text>
  </g>
  <ellipse cx="266" cy="242" rx="22" ry="14" fill="none" stroke="#b85450" stroke-width="2" filter="url(#r)"/>

  <!-- row: x=-1 -->
  <g filter="url(#r)">
    <rect x="40" y="262" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
    <rect x="175" y="262" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
    <rect x="310" y="262" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
    <rect x="445" y="262" width="135" height="42" rx="4" fill="#fdfcf7" stroke="#9db2c8" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="12" filter="url(#r)">
    <text x="107" y="288" font-weight="bold" fill="#446688">x = −1</text>
    <text x="242" y="288" fill="#333">(18, 15)</text>
    <text x="377" y="288" fill="#333">(3, <tspan font-weight="bold" fill="#b85450">20</tspan>)</text>
    <text x="512" y="288" fill="#333">(2, 2)</text>
  </g>
  <ellipse cx="401" cy="284" rx="22" ry="14" fill="none" stroke="#b85450" stroke-width="2" filter="url(#r)"/>

  <!-- row: x=2 (final, highlighted) -->
  <g filter="url(#r)">
    <rect x="40" y="304" width="135" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="175" y="304" width="135" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="310" y="304" width="135" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="445" y="304" width="135" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <g text-anchor="middle" font-size="12" filter="url(#r)">
    <text x="107" y="330" font-weight="bold" fill="#8a6210">x = 2（末行）</text>
    <text x="242" y="330" fill="#333">(18, 21)</text>
    <text x="377" y="330" fill="#333">(20, 16)</text>
    <text x="512" y="330" fill="#333">(2, <tspan font-weight="bold" fill="#b85450">22</tspan>)</text>
  </g>
  <ellipse cx="536" cy="326" rx="22" ry="14" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#r)"/>

  <!-- legend -->
  <text x="310" y="368" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#r)">每格为 (f0[j], f1[j])，"—" 表示 −∞；红圈标出最优路径上的值</text>

  <!-- lineage box -->
  <g filter="url(#r)">
    <rect x="40" y="382" width="540" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="62" y="404" font-size="12" fill="#333" filter="url(#r)">最优路径：f1[1] = 18（第①段 = [1,2,3]，逐元素累加 1×3 + 2×3 + 3×3）</text>
  <text x="62" y="424" font-size="12" fill="#333" filter="url(#r)">→ f1[2] = 20（新开第②段 [−1]：18 + (−1)×(−2)）</text>
  <text x="62" y="444" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">→ f1[3] = 22（新开第③段 [2]：20 + 2×1）⇒ 答案 = 22 ✓</text>
</svg>
