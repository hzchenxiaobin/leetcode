<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">示例 2 演算：n = 3，k = 2，time = [[1,5,1,8],[10,10,10,10]]，答案 37</text>

  <!-- time axis -->
  <g filter="url(#sk)">
    <path d="M 56 64 L 616 64" stroke="#3a3a3a" stroke-width="1.4" fill="none"/>
    <path d="M 60 60 L 60 68 M 130 60 L 130 68 M 199 60 L 199 68 M 269 60 L 269 68 M 338 60 L 338 68 M 408 60 L 408 68 M 477 60 L 477 68 M 547 60 L 547 68 M 616 60 L 616 68" stroke="#3a3a3a" stroke-width="1.2" fill="none"/>
  </g>
  <text x="60" y="56" text-anchor="middle" font-size="10" fill="#555555">0</text>
  <text x="130" y="56" text-anchor="middle" font-size="10" fill="#555555">5</text>
  <text x="199" y="56" text-anchor="middle" font-size="10" fill="#555555">10</text>
  <text x="269" y="56" text-anchor="middle" font-size="10" fill="#555555">15</text>
  <text x="338" y="56" text-anchor="middle" font-size="10" fill="#555555">20</text>
  <text x="408" y="56" text-anchor="middle" font-size="10" fill="#555555">25</text>
  <text x="477" y="56" text-anchor="middle" font-size="10" fill="#555555">30</text>
  <text x="547" y="56" text-anchor="middle" font-size="10" fill="#555555">35</text>
  <text x="616" y="56" text-anchor="middle" font-size="10" fill="#555555">40</text>

  <!-- lanes -->
  <g filter="url(#sk)">
    <rect x="56" y="96" width="560" height="30" fill="#faf9f2" stroke="#d8d4c8" stroke-width="1"/>
    <rect x="56" y="176" width="560" height="30" fill="#faf9f2" stroke="#d8d4c8" stroke-width="1"/>
    <rect x="56" y="256" width="560" height="30" fill="#faf9f2" stroke="#d8d4c8" stroke-width="1"/>
  </g>
  <text x="52" y="115" text-anchor="end" font-size="11.5" font-weight="bold" fill="#555555">左岸·放箱</text>
  <text x="52" y="195" text-anchor="end" font-size="11.5" font-weight="bold" fill="#555555">桥（串行）</text>
  <text x="52" y="275" text-anchor="end" font-size="11.5" font-weight="bold" fill="#555555">右岸·搬箱</text>

  <!-- left lane bars -->
  <g filter="url(#sk)">
    <rect x="296" y="96" width="112" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="477" y="96" width="139" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="352" y="115" text-anchor="middle" font-size="10.5" fill="#2e6e2e">w0 放箱（put 8）</text>
  <text x="546" y="115" text-anchor="middle" font-size="10.5" fill="#2e6e2e">w1 放箱（put 10）</text>
  <text x="546" y="140" text-anchor="middle" font-size="9.5" fill="#b85450">put 不计入 ans ✗</text>

  <!-- box arrival markers -->
  <g filter="url(#sk)">
    <polygon points="290,80 302,80 296,90" fill="#b85450"/>
    <polygon points="471,80 483,80 477,90" fill="#b85450"/>
    <polygon points="568,80 580,80 574,90" fill="#b85450"/>
  </g>
  <text x="296" y="76" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450">箱1</text>
  <text x="477" y="76" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450">箱2</text>
  <text x="574" y="76" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450">箱3</text>

  <!-- bridge lane bars -->
  <g filter="url(#sk)">
    <rect x="60" y="176" width="139" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="199" y="176" width="14" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="282" y="176" width="14" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="338" y="176" width="139" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="477" y="176" width="14" height="30" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="560" y="176" width="14" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="129" y="195" text-anchor="middle" font-size="11" fill="#2b6e9e">w1 →（right 10）</text>
  <text x="206" y="170" text-anchor="middle" font-size="9.5" fill="#2b6e9e">w0→</text>
  <text x="289" y="170" text-anchor="middle" font-size="9.5" fill="#8a6415">w0←</text>
  <text x="407" y="195" text-anchor="middle" font-size="11" fill="#8a6415">w1 ←（left 10）</text>
  <text x="484" y="170" text-anchor="middle" font-size="9.5" fill="#2b6e9e">w0→</text>
  <text x="567" y="170" text-anchor="middle" font-size="9.5" fill="#b85450">w0←</text>

  <!-- idle gaps -->
  <g filter="url(#sk)">
    <path d="M 213 232 L 282 232" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3"/>
  </g>
  <text x="247" y="226" text-anchor="middle" font-size="9.5" fill="#b85450">桥空 · 快进 → 16</text>
  <text x="317" y="226" text-anchor="middle" font-size="9.5" fill="#b85450">快进 → 20</text>
  <text x="525" y="226" text-anchor="middle" font-size="9.5" fill="#b85450">快进 → 36</text>

  <!-- right lane bars -->
  <g filter="url(#sk)">
    <rect x="199" y="256" width="139" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="213" y="256" width="69" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="491" y="256" width="69" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="268" y="275" text-anchor="middle" font-size="10.5" fill="#2e6e2e">w1 搬箱（pick 10）</text>
  <text x="247" y="275" text-anchor="middle" font-size="10.5" fill="#2e6e2e">w0</text>
  <text x="247" y="300" text-anchor="middle" font-size="9.5" fill="#888888">pick 5</text>
  <text x="525" y="275" text-anchor="middle" font-size="10.5" fill="#2e6e2e">w0</text>
  <text x="525" y="300" text-anchor="middle" font-size="9.5" fill="#888888">pick 5</text>

  <!-- ans marker -->
  <g filter="url(#sk)">
    <path d="M 574 92 L 574 308" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,4"/>
  </g>
  <text x="566" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">ans = 37</text>

  <!-- summary -->
  <g filter="url(#sk)">
    <rect x="56" y="326" width="560" height="126" rx="8" fill="#f7f3e8" stroke="#a09060" stroke-width="1.4"/>
  </g>
  <text x="336" y="348" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a6a3a">关键事件回放</text>
  <text x="76" y="370" font-size="11" fill="#444444">t=0 / t=10：w1（sum 20）先于 w0（sum 2）被派出 —— 效率低者先行</text>
  <text x="76" y="390" font-size="11" fill="#444444">t=16：w0 搬完就绪即过桥，t=17 第 1 箱到左（ans=17）；t=20 w1 就绪过桥，t=30 第 2 箱到左（ans=30）</text>
  <text x="76" y="410" font-size="11" fill="#444444">t=30：右侧无人，w0（25 起就在左岸等待）且 picked=2 &lt; 3 → 再次派出 w0</text>
  <text x="76" y="430" font-size="11" fill="#444444">t=36：w0 搬完（31+5）即过桥，t=37 第 3 箱到左岸，ans = 37 —— 最后的放箱时间不计入</text>
</svg>
