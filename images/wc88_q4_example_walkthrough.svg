<svg xmlns="http://www.w3.org/2000/svg" width="660" height="450" viewBox="0 0 660 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="450" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：三个矩形并集面积 = 2 + 3 + 1 = 6</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="45" y="84" width="78" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="84.0" y="100.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">x 条带</text>
  <g filter="url(#sk2)"><rect x="123" y="84" width="56" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="151.0" y="100.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">宽度</text>
  <g filter="url(#sk2)"><rect x="179" y="84" width="126" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="242.0" y="100.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">覆盖的矩形</text>
  <g filter="url(#sk2)"><rect x="305" y="84" width="114" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="362.0" y="100.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">y 区间并</text>
  <g filter="url(#sk2)"><rect x="419" y="84" width="78" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="458.0" y="100.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">并长度</text>
  <g filter="url(#sk2)"><rect x="497" y="84" width="64" height="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="529.0" y="100.5" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">面积</text>
  <g filter="url(#sk2)"><rect x="45" y="109" width="78" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="84.0" y="125.5" text-anchor="middle" font-size="11.5" fill="#333">[0,1)</text>
  <g filter="url(#sk2)"><rect x="123" y="109" width="56" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="151.0" y="125.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="179" y="109" width="126" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="242.0" y="125.5" text-anchor="middle" font-size="11.5" fill="#333">A</text>
  <g filter="url(#sk2)"><rect x="305" y="109" width="114" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="362.0" y="125.5" text-anchor="middle" font-size="11.5" fill="#333">[0,2]</text>
  <g filter="url(#sk2)"><rect x="419" y="109" width="78" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="458.0" y="125.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="497" y="109" width="64" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="529.0" y="125.5" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <g filter="url(#sk2)"><rect x="45" y="134" width="78" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="84.0" y="150.5" text-anchor="middle" font-size="11.5" fill="#333">[1,2)</text>
  <g filter="url(#sk2)"><rect x="123" y="134" width="56" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="151.0" y="150.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="179" y="134" width="126" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="242.0" y="150.5" text-anchor="middle" font-size="11.5" fill="#333">A, B, C</text>
  <g filter="url(#sk2)"><rect x="305" y="134" width="114" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="362.0" y="150.5" text-anchor="middle" font-size="11.5" fill="#333">[0,3]</text>
  <g filter="url(#sk2)"><rect x="419" y="134" width="78" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="458.0" y="150.5" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <g filter="url(#sk2)"><rect x="497" y="134" width="64" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="529.0" y="150.5" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <g filter="url(#sk2)"><rect x="45" y="159" width="78" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="84.0" y="175.5" text-anchor="middle" font-size="11.5" fill="#333">[2,3)</text>
  <g filter="url(#sk2)"><rect x="123" y="159" width="56" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="151.0" y="175.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="179" y="159" width="126" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="242.0" y="175.5" text-anchor="middle" font-size="11.5" fill="#333">C</text>
  <g filter="url(#sk2)"><rect x="305" y="159" width="114" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="362.0" y="175.5" text-anchor="middle" font-size="11.5" fill="#333">[0,1]</text>
  <g filter="url(#sk2)"><rect x="419" y="159" width="78" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="458.0" y="175.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="497" y="159" width="64" height="25" fill="#ffffff" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="529.0" y="175.5" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <g filter="url(#sk2)"><rect x="45" y="184" width="78" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="84.0" y="200.5" text-anchor="middle" font-size="11.5" fill="#333">合计</text>
  <g filter="url(#sk2)"><rect x="123" y="184" width="56" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="151.0" y="200.5" text-anchor="middle" font-size="11.5" fill="#333"></text>
  <g filter="url(#sk2)"><rect x="179" y="184" width="126" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="242.0" y="200.5" text-anchor="middle" font-size="11.5" fill="#333"></text>
  <g filter="url(#sk2)"><rect x="305" y="184" width="114" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="362.0" y="200.5" text-anchor="middle" font-size="11.5" fill="#333"></text>
  <g filter="url(#sk2)"><rect x="419" y="184" width="78" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="458.0" y="200.5" text-anchor="middle" font-size="11.5" fill="#333"></text>
  <g filter="url(#sk2)"><rect x="497" y="184" width="64" height="25" fill="#e6f4ea" stroke="#c9cfd6" stroke-width="1"/></g>
  <text x="529.0" y="200.5" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <g filter="url(#sk2)"><rect x="45.0" y="222.0" width="570" height="56" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="330" y="246.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e22">示例 2：rectangles = [[0,0,10⁹,10⁹]]</text>
  <text x="330" y="261.5" text-anchor="middle" font-size="11" fill="#2e5e22">面积 10⁹ × 10⁹ = 10¹⁸，mod (10⁹+7) = 49</text>
  <g filter="url(#sk2)"><rect x="45.0" y="312.0" width="570" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="330" y="338.8" text-anchor="middle" font-size="10.5" fill="#2b4a6e">10¹⁸ 远超 int 范围：必须用 64 位整数，并在相乘前取模</text>
  <g filter="url(#sk2)"><rect x="45.0" y="382.0" width="570" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="330" y="408.8" text-anchor="middle" font-size="10.5" fill="#2b4a6e">合并区间时若 next.l &gt; cur.r 就结算 cur；否则 cur.r = max(cur.r, next.r)</text>
</svg>
