<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">演算：5×5，行切在 2、3，列切在 2、3（a = b = [2,1,2]）</text>

  <!-- highlight thin column block -->
  <rect x="140" y="60" width="40" height="200" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <!-- 1x1 cell -->
  <rect x="140" y="140" width="40" height="40" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>

  <!-- grid -->
  <g stroke="#9aa7b8" stroke-width="1" fill="none" filter="url(#rough2)">
    <rect x="60" y="60" width="200" height="200" rx="2"/>
    <path d="M100,60 V260 M140,60 V260 M180,60 V260 M220,60 V260"/>
    <path d="M60,100 H260 M60,140 H260 M60,180 H260 M60,220 H260"/>
  </g>
  <g stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)">
    <path d="M100,54 V266 M140,54 V266"/>
    <path d="M54,100 H266 M54,140 H266"/>
  </g>

  <!-- numbers -->
  <g font-size="17" fill="#1f2d3d" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="86">1</text><text x="120" y="86">2</text><text x="160" y="86">1</text><text x="200" y="86">2</text><text x="240" y="86">1</text>
    <text x="80" y="126">3</text><text x="120" y="126">4</text><text x="160" y="126">2</text><text x="200" y="126">3</text><text x="240" y="126">4</text>
    <text x="80" y="166">1</text><text x="120" y="166">2</text><text x="160" y="166">1</text><text x="200" y="166">2</text><text x="240" y="166">1</text>
    <text x="80" y="206">2</text><text x="120" y="206">1</text><text x="160" y="206">2</text><text x="200" y="206">1</text><text x="240" y="206">2</text>
    <text x="80" y="246">3</text><text x="120" y="246">4</text><text x="160" y="246">1</text><text x="200" y="246">3</text><text x="240" y="246">4</text>
  </g>

  <!-- block size labels -->
  <g font-size="12" fill="#446688" filter="url(#rough2)">
    <text x="80" y="50" text-anchor="middle">b=2</text>
    <text x="160" y="50" text-anchor="middle">b=1</text>
    <text x="220" y="50" text-anchor="middle">b=2</text>
  </g>
  <g font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    <text x="42" y="86" text-anchor="middle">a=2</text>
    <text x="42" y="166" text-anchor="middle">a=1</text>
    <text x="42" y="246" text-anchor="middle">a=2</text>
  </g>

  <!-- callouts -->
  <path d="M186,120 C240,110 268,96 300,92" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="88" font-size="12" fill="#b85450" filter="url(#rough2)">① 先填 b=1 的列块</text>
  <text x="306" y="106" font-size="12" fill="#666" filter="url(#rough2)">上 (1,2) → 中 (1) → 下 (2,1)，链约束满足</text>

  <path d="M268,182 C300,196 316,212 330,224" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="234" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② 再填宽 2 的列块：第 x 行放值块 x 的排列</text>
  <text x="336" y="252" font-size="12" fill="#666" filter="url(#rough2)">左端避开左邻居右端；底行是块 a-1，与下方块 0 不交</text>

  <rect x="300" y="270" width="330" height="106" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="12" fill="#2c4a26" filter="url(#rough2)">
    <text x="316" y="296">③ 自检：每个块恰好是 1 … x 各一次</text>
    <text x="316" y="318">   （如左上 2×2 = {1,2,3,4}，中间 1×1 = {1}）</text>
    <text x="316" y="340">   上下左右相邻格全部不同，包括跨切线的那些</text>
    <text x="316" y="362">   a = b = [2,1,2] 两条链都合法 ⇒ 有解</text>
  </g>
</svg>
