<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="#fafafa" filter="url(#rough2)"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">样例 4：a = 1, b = 7, c = 10 的逐步走查</text>

  <!-- 表头 -->
  <rect x="30" y="48" width="580" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="73" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">轮次</text>
  <text x="200" y="73" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">排序后的 (x, y, z)</text>
  <text x="345" y="73" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">d₁ = y − x</text>
  <text x="450" y="73" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">d₂ = z − y</text>
  <text x="546" y="73" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">本轮动作</text>

  <!-- r = 0 -->
  <rect x="30" y="88" width="580" height="44" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="72" y="115" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="200" y="115" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(1, 7, 10)</text>
  <text x="345" y="115" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">6</text>
  <text x="450" y="115" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="546" y="115" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">10 → 1</text>

  <!-- r = 1 -->
  <rect x="30" y="132" width="580" height="44" rx="4" fill="#f7f7f7" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="72" y="159" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="200" y="159" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(2, 7, 9)</text>
  <text x="345" y="159" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">5</text>
  <text x="450" y="159" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="546" y="159" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">9 → 2</text>

  <!-- r = 2 -->
  <rect x="30" y="176" width="580" height="44" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="72" y="203" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="200" y="203" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(3, 7, 8)</text>
  <text x="345" y="203" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">4</text>
  <text x="450" y="203" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="546" y="203" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">8 → 3</text>

  <!-- r = 3：结束 -->
  <rect x="30" y="220" width="580" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="72" y="247" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="200" y="247" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(4, 7, 7)</text>
  <text x="345" y="247" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">—</text>
  <text x="450" y="247" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">—</text>
  <text x="546" y="247" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">7 = 7，结束</text>

  <text x="320" y="296" text-anchor="middle" font-size="14" fill="#444" filter="url(#rough2)">第 3 轮结束后 y 与 z 相等，游戏结束，故共进行 3 轮</text>
  <text x="320" y="326" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">校验：min(d₁, d₂) = min(6, 3) = 3 ✔</text>
  <text x="320" y="350" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">两个间隙同时递减，谁先归零谁决定轮数</text>
</svg>
