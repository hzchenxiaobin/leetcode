<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">两例对账：同一张图、同一组最短路，只差在消失时刻</text>

  <text x="40" y="52" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 1：disappear = [1, 1, 5]</text>
  <g filter="url(#rough2)" font-size="11" fill="#446688">
    <rect x="40" y="60" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="100" y="60" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="190" y="60" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="300" y="60" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="420" y="60" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="77">节点</text><text x="145" y="77">disappear</text>
    <text x="245" y="77">最短候选</text><text x="360" y="77">候选 &lt; disappear</text><text x="460" y="77">答案</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="90" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="100" y="90" width="90" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="190" y="90" width="110" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="300" y="90" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="420" y="90" width="80" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="40" y="120" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="100" y="120" width="90" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="190" y="120" width="110" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="300" y="120" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="420" y="120" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="40" y="150" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="100" y="150" width="90" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="190" y="150" width="110" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="300" y="150" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="420" y="150" width="80" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="107">0</text><text x="145" y="107">1</text><text x="245" y="107">0</text><text x="360" y="107">0 &lt; 1 ✓</text><text x="460" y="107">0</text>
    <text x="70" y="137">1</text><text x="145" y="137">1</text><text x="245" y="137">2</text><text x="360" y="137">2 ≥ 1 ✗</text><text x="460" y="137">−1</text>
    <text x="70" y="167">2</text><text x="145" y="167">5</text><text x="245" y="167">4（直达）</text><text x="360" y="167">4 &lt; 5 ✓</text><text x="460" y="167">4</text>
  </g>

  <text x="40" y="204" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 2：disappear = [1, 3, 5]</text>
  <g filter="url(#rough2)" font-size="11" fill="#446688">
    <rect x="40" y="212" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="100" y="212" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="190" y="212" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="300" y="212" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="420" y="212" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="229">节点</text><text x="145" y="229">disappear</text>
    <text x="245" y="229">最短候选</text><text x="360" y="229">候选 &lt; disappear</text><text x="460" y="229">答案</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="242" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="100" y="242" width="90" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="190" y="242" width="110" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="300" y="242" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="420" y="242" width="80" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="40" y="272" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="100" y="272" width="90" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="190" y="272" width="110" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="300" y="272" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="420" y="272" width="80" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="40" y="302" width="60" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="100" y="302" width="90" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="190" y="302" width="110" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="300" y="302" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="420" y="302" width="80" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="259">0</text><text x="145" y="259">1</text><text x="245" y="259">0</text><text x="360" y="259">0 &lt; 1 ✓</text><text x="460" y="259">0</text>
    <text x="70" y="289">1</text><text x="145" y="289">3</text><text x="245" y="289">2</text><text x="360" y="289">2 &lt; 3 ✓</text><text x="460" y="289">2</text>
    <text x="70" y="319">2</text><text x="145" y="319">5</text><text x="245" y="319">3（经 1）</text><text x="360" y="319">3 &lt; 5 ✓</text><text x="460" y="319">3</text>
  </g>

  <rect x="40" y="340" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">注意「恰好到达」也算失败：示例 3 中 1 = disappear[1] ⇒ 返回 −1</text>
</svg>
