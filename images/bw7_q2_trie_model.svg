<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="149"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：路径树与「只查直接父」</text>

  <!-- 根节点（虚拟） -->
  <ellipse cx="280" cy="80" rx="30" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="13" fill="#2a4a68" filter="url(#rough2)">根 /</text>

  <!-- leet 节点 -->
  <path d="M 280 102 L 160 148" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="110" y="150" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="168" text-anchor="middle" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">/leet</text>
  <text x="160" y="183" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">value = 1</text>

  <!-- leet/code 节点 -->
  <path d="M 160 190 L 160 232" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="100" y="234" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="252" text-anchor="middle" font-size="12" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">/leet/code</text>
  <text x="160" y="267" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">value = 2</text>

  <!-- a 节点 -->
  <path d="M 280 102 L 400 148" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="350" y="150" width="100" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="168" text-anchor="middle" font-size="12.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">/a</text>
  <text x="400" y="183" text-anchor="middle" font-size="10.5" fill="#a08040" filter="url(#rough2)">value = 1</text>

  <!-- 失败的 c/d -->
  <path d="M 400 190 L 460 232" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="410" y="234" width="110" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="465" y="252" text-anchor="middle" font-size="12" fill="#8c3a34" font-weight="bold" filter="url(#rough2)">/c/d ✗</text>
  <text x="465" y="267" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">父 /c 不存在</text>
  <!-- 缺失的 /c 用虚框 -->
  <rect x="350" y="192" width="56" height="30" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="378" y="211" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">/c?</text>

  <!-- 右侧说明框 -->
  <rect x="360" y="290" width="180" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="450" y="310" text-anchor="middle" font-size="11.5" fill="#2a4a68" filter="url(#rough2)">哈希表键 = 整条路径字符串</text>
  <text x="450" y="328" text-anchor="middle" font-size="11.5" fill="#2a4a68" filter="url(#rough2)">查父 = 截掉最后一段后 count</text>

  <!-- 左下说明 -->
  <rect x="30" y="290" width="310" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="185" y="310" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">不变量：表中任何路径的父亲也在表中</text>
  <text x="185" y="328" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">（插入时验证过父 → 归纳成立）</text>
</svg>
