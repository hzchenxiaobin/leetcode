<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">幻方三条件：1..9 各一次、中心为 5、八条线均为 15</text>

  <!-- 3x3 幻方 -->
  <g filter="url(#rough2)">
    <rect x="50" y="52" width="180" height="180" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <path d="M110,52 L110,232 M170,52 L170,232 M50,112 L230,112 M50,172 L230,172" stroke="#d6a040" stroke-width="1.4"/>
    <text x="80" y="92" text-anchor="middle" font-size="16" fill="#7a5a10">8</text>
    <text x="140" y="92" text-anchor="middle" font-size="16" fill="#7a5a10">1</text>
    <text x="200" y="92" text-anchor="middle" font-size="16" fill="#7a5a10">6</text>
    <text x="80" y="152" text-anchor="middle" font-size="16" fill="#7a5a10">3</text>
    <text x="140" y="152" text-anchor="middle" font-size="16" fill="#b85450">5</text>
    <text x="200" y="152" text-anchor="middle" font-size="16" fill="#7a5a10">7</text>
    <text x="80" y="212" text-anchor="middle" font-size="16" fill="#7a5a10">4</text>
    <text x="140" y="212" text-anchor="middle" font-size="16" fill="#7a5a10">9</text>
    <text x="200" y="212" text-anchor="middle" font-size="16" fill="#7a5a10">2</text>
    <text x="140" y="256" text-anchor="middle" font-size="12" fill="#7a5a10">经典 3×3 幻方</text>
  </g>

  <!-- 8 条线 -->
  <g filter="url(#rough2)">
    <text x="300" y="66" font-size="12" fill="#333">8 条线（3 行 + 3 列 + 2 对角）</text>
    <rect x="282" y="76" width="196" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="380" y="94" text-anchor="middle" font-size="11" fill="#2f4a66">行：8+1+6 = 3+5+7 = 4+9+2 = 15</text>
    <rect x="282" y="108" width="196" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="380" y="126" text-anchor="middle" font-size="11" fill="#2f5527">列：8+3+4 = 1+5+9 = 6+7+2 = 15</text>
    <rect x="282" y="140" width="196" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="380" y="158" text-anchor="middle" font-size="11" fill="#8a3020">对角：8+5+2 = 6+5+4 = 15</text>
    <rect x="282" y="172" width="196" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="380" y="190" text-anchor="middle" font-size="11" fill="#7a5a10">且恰为 1..9 的排列（和为 45）</text>
    <rect x="282" y="204" width="196" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="380" y="222" text-anchor="middle" font-size="11" fill="#2f5527">→ 三条结论互相蕴含</text>
  </g>

  <!-- 中心为 5 的推导 -->
  <g filter="url(#rough2)">
    <rect x="50" y="276" width="430" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="265" y="300" text-anchor="middle" font-size="12" fill="#2f4a66">为什么中心必是 5：过中心的 4 条线（中行、中列、两条对角）之和 = 4×15 = 60</text>
    <text x="265" y="322" text-anchor="middle" font-size="12" fill="#2f4a66">它们覆盖全部 9 个数，且中心被算了 4 次、其余 8 个数各 1 次</text>
    <text x="265" y="344" text-anchor="middle" font-size="12" fill="#8a3020">45 + 3·center = 60 → center = 5（据此可做 O(1) 剪枝）</text>
  </g>
</svg>
