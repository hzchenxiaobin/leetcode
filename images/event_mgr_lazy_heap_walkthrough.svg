<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="139" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="500" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：events = [[5,7],[2,7],[9,4]]，追加一次 poll 观察 −1</text>
  <path d="M 170 42 Q 340 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
  <text x="115" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">操作</text>
  <text x="255" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">cur（真相）</text>
  <text x="460" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">堆（堆顶在左）</text>
  <text x="635" y="66" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">输出</text>

  <!-- 隔行底色 -->
  <rect x="40" y="74" width="625" height="64" fill="#f4f8f1" opacity="0.7"/>
  <rect x="40" y="202" width="625" height="64" fill="#f4f8f1" opacity="0.7"/>
  <rect x="40" y="330" width="625" height="64" fill="#f4f8f1" opacity="0.7"/>

  <!-- 分隔线 -->
  <g filter="url(#sk)">
    <path d="M 40 138 L 665 136" stroke="#c8c8c2" stroke-width="1" stroke-dasharray="5,4" fill="none"/>
    <path d="M 40 202 L 665 200" stroke="#c8c8c2" stroke-width="1" stroke-dasharray="5,4" fill="none"/>
    <path d="M 40 266 L 665 264" stroke="#c8c8c2" stroke-width="1" stroke-dasharray="5,4" fill="none"/>
    <path d="M 40 330 L 665 328" stroke="#c8c8c2" stroke-width="1" stroke-dasharray="5,4" fill="none"/>
    <path d="M 40 394 L 665 392" stroke="#c8c8c2" stroke-width="1" stroke-dasharray="5,4" fill="none"/>
  </g>

  <!-- 行 0：初始化 -->
  <text x="115" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">初始化</text>
  <text x="115" y="118" text-anchor="middle" font-size="10" fill="#888">3 个事件入堆</text>
  <text x="255" y="110" text-anchor="middle" font-size="12" fill="#333">5:7　2:7　9:4</text>
  <g filter="url(#sk)">
    <rect x="332" y="92" width="56" height="26" rx="4" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="396" y="92" width="56" height="26" rx="4" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="460" y="92" width="56" height="26" rx="4" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="360" y="110" text-anchor="middle" font-size="11.5" fill="#2e6e2e">7,2</text>
  <text x="424" y="110" text-anchor="middle" font-size="11.5" fill="#2e6e2e">7,5</text>
  <text x="488" y="110" text-anchor="middle" font-size="11.5" fill="#2e6e2e">4,9</text>
  <text x="635" y="110" text-anchor="middle" font-size="12" fill="#888">—</text>

  <!-- 行 1：poll① -->
  <text x="115" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">pollHighest</text>
  <text x="115" y="182" text-anchor="middle" font-size="10" fill="#2e6e2e">弹出 (7,2)，cur[2]=7 ✓</text>
  <text x="255" y="174" text-anchor="middle" font-size="12" fill="#333">5:7　9:4</text>
  <g filter="url(#sk)">
    <rect x="332" y="156" width="56" height="26" rx="4" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="396" y="156" width="56" height="26" rx="4" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="360" y="174" text-anchor="middle" font-size="11.5" fill="#2e6e2e">7,5</text>
  <text x="424" y="174" text-anchor="middle" font-size="11.5" fill="#2e6e2e">4,9</text>
  <text x="635" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">2</text>

  <!-- 行 2：update -->
  <text x="115" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">updatePriority(9,7)</text>
  <text x="115" y="246" text-anchor="middle" font-size="10" fill="#444">cur[9]=7，压入 (7,9)</text>
  <text x="255" y="238" text-anchor="middle" font-size="12" fill="#333">5:7　</text>
  <text x="283" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#c98a2b">9:7</text>
  <text x="255" y="256" text-anchor="middle" font-size="9.5" fill="#c98a2b">9 的优先级已改</text>
  <g filter="url(#sk)">
    <rect x="332" y="220" width="56" height="26" rx="4" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="396" y="220" width="56" height="26" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="460" y="220" width="56" height="26" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <text x="360" y="238" text-anchor="middle" font-size="11.5" fill="#2e6e2e">7,5</text>
  <text x="424" y="238" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">7,9</text>
  <text x="488" y="238" text-anchor="middle" font-size="11.5" fill="#b03a3a">4,9 ✗</text>
  <text x="332" y="256" font-size="9.5" fill="#b03a3a">旧 (4,9) 变尸体：cur[9]=7 ≠ 4</text>
  <text x="635" y="238" text-anchor="middle" font-size="12" fill="#888">—</text>

  <!-- 行 3：poll② -->
  <text x="115" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">pollHighest</text>
  <text x="115" y="310" text-anchor="middle" font-size="10" fill="#2e6e2e">弹出 (7,5)，✓</text>
  <text x="255" y="302" text-anchor="middle" font-size="12" fill="#333">9:7</text>
  <g filter="url(#sk)">
    <rect x="332" y="284" width="56" height="26" rx="4" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="396" y="284" width="56" height="26" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <text x="360" y="302" text-anchor="middle" font-size="11.5" fill="#2e6e2e">7,9</text>
  <text x="424" y="302" text-anchor="middle" font-size="11.5" fill="#b03a3a">4,9 ✗</text>
  <text x="635" y="304" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">5</text>

  <!-- 行 4：poll③ -->
  <text x="115" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">pollHighest</text>
  <text x="115" y="374" text-anchor="middle" font-size="10" fill="#2e6e2e">弹出 (7,9)，✓</text>
  <text x="255" y="366" text-anchor="middle" font-size="12" fill="#888">（空）</text>
  <g filter="url(#sk)">
    <rect x="332" y="348" width="56" height="26" rx="4" fill="#f5e0e0" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <text x="360" y="366" text-anchor="middle" font-size="11.5" fill="#b03a3a">4,9 ✗</text>
  <text x="635" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">9</text>

  <!-- 行 5：poll④ 追加 -->
  <text x="115" y="420" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">pollHighest（追加）</text>
  <text x="115" y="438" text-anchor="middle" font-size="10" fill="#b03a3a">弹出 (4,9)：9 ∉ cur ✗</text>
  <text x="115" y="452" text-anchor="middle" font-size="10" fill="#b03a3a">丢弃后堆空</text>
  <text x="255" y="428" text-anchor="middle" font-size="12" fill="#888">（空）</text>
  <text x="368" y="428" text-anchor="middle" font-size="12" fill="#888">（空）</text>
  <text x="635" y="430" text-anchor="middle" font-size="15" font-weight="bold" fill="#b03a3a">−1</text>

  <!-- 图例 -->
  <g filter="url(#sk)">
    <rect x="40" y="470" width="26" height="16" rx="3" fill="#fffdf3" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="130" y="470" width="26" height="16" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="230" y="470" width="26" height="16" rx="3" fill="#f5e0e0" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3"/>
  </g>
  <text x="74" y="482" font-size="10.5" fill="#444">有效条目</text>
  <text x="164" y="482" font-size="10.5" fill="#444">刚压入</text>
  <text x="264" y="482" font-size="10.5" fill="#444">尸体（过期 / 已 poll）</text>
  <text x="470" y="482" font-size="10.5" fill="#666">条目记 (p, id)；排序 = p 降、id 升</text>
</svg>
