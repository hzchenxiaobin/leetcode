<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="352" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">每条边要运多少，由子树的「收支」唯一决定</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">子树内部的平衡先做完，剩下的差额整块流经父边</text>
  <circle cx="280" cy="92" r="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/><text x="280" y="97.04" font-size="14" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="200" cy="186" r="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/><text x="200" y="190.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="360" cy="186" r="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/><text x="360" y="190.68" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <path d="M 280 118 L 208 162" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 118 L 352 162" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="280" y="72" font-size="11" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">根：3 枚</text>
  <text x="190" y="232" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">左：0 枚（缺 1）</text>
  <text x="372" y="232" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">右：0 枚（缺 1）</text>
  <path d="M 258 132 L 216 166" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 302 132 L 344 166" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="232" y="148" font-size="13" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="330" y="148" font-size="13" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="30" y="258" width="500" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="279" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">子树盈余 = 子树硬币数 − 子树节点数</text><text x="40" y="294.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">左子树盈余 = 0 − 1 = −1 → 需要运进 1 枚</text><text x="40" y="310.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">根盈余 = 3 − 3 = 0，总运量 |−1| + |−1| = 2</text>
</svg>
