<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：逐个维护绝对值 top-2</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="50" y="58" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="106" y="58" width="78" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="184" y="58" width="96" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="280" y="58" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="336" y="58" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="392" y="58" width="198" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="12.5" fill="#2b4a6e" text-anchor="middle" font-weight="bold">
    <text x="78" y="78">步骤</text>
    <text x="145" y="78">nums[i]</text>
    <text x="232" y="78">|nums[i]|</text>
    <text x="308" y="78">A</text>
    <text x="364" y="78">B</text>
    <text x="491" y="78">动作</text>
  </g>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="50" y="90" width="56" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="106" y="90" width="78" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="184" y="90" width="96" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="280" y="90" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="336" y="90" width="56" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="392" y="90" width="198" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="78" y="113">0</text>
    <text x="145" y="113">−4</text>
    <text x="232" y="113">4</text>
    <text x="308" y="113" fill="#2e5e22" font-weight="bold">4</text>
    <text x="364" y="113">0</text>
  </g>
  <text x="491" y="113" text-anchor="middle" font-size="12" fill="#2e5e22">4 &gt; 0 ⇒ A ← 4</text>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="50" y="126" width="56" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="106" y="126" width="78" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="184" y="126" width="96" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="280" y="126" width="56" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="336" y="126" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="392" y="126" width="198" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="78" y="149">1</text>
    <text x="145" y="149">−2</text>
    <text x="232" y="149">2</text>
    <text x="308" y="149">4</text>
    <text x="364" y="149" fill="#7a5415" font-weight="bold">2</text>
  </g>
  <text x="491" y="149" text-anchor="middle" font-size="12" fill="#7a5415">2 ≤ 4，2 &gt; 0 ⇒ B ← 2</text>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="50" y="162" width="56" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="106" y="162" width="78" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="184" y="162" width="96" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="280" y="162" width="56" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="336" y="162" width="56" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="392" y="162" width="198" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="78" y="185">2</text>
    <text x="145" y="185">−1</text>
    <text x="232" y="185">1</text>
    <text x="308" y="185">4</text>
    <text x="364" y="185">2</text>
  </g>
  <text x="491" y="185" text-anchor="middle" font-size="12" fill="#888">1 ≤ 4，1 ≤ 2 ⇒ 不变</text>

  <!-- row 4 -->
  <g filter="url(#sk)">
    <rect x="50" y="198" width="56" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="106" y="198" width="78" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="184" y="198" width="96" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="280" y="198" width="56" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <rect x="336" y="198" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="392" y="198" width="198" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="78" y="221">3</text>
    <text x="145" y="221">−3</text>
    <text x="232" y="221">3</text>
    <text x="308" y="221">4</text>
    <text x="364" y="221" fill="#7a5415" font-weight="bold">3</text>
  </g>
  <text x="491" y="221" text-anchor="middle" font-size="12" fill="#7a5415">3 ≤ 4，3 &gt; 2 ⇒ B ← 3</text>

  <!-- final row -->
  <g filter="url(#sk)">
    <rect x="50" y="238" width="540" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="264" text-anchor="middle" font-size="13.5" fill="#8e3a34" font-weight="bold">A = 4，B = 3 ⇒ ans = 4 × 3 × 10⁵ = 1 200 000</text>

  <!-- construction check -->
  <path d="M 320 282 L 320 298" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="70" y="302" width="500" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="323" text-anchor="middle" font-size="13" fill="#2e5e22" font-weight="bold">构造验证：把 −2 替换成 +10⁵（第三个下标任选）</text>
  <text x="320" y="344" text-anchor="middle" font-size="13" fill="#2e5e22">修改后选 (−4) × (+10⁵) × (−3) = 1 200 000 ✓</text>

  <text x="320" y="382" text-anchor="middle" font-size="10.5" fill="#888">与示例 2 的期望输出 1200000 一致</text>
</svg>
