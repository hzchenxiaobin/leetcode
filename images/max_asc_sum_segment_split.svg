<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：下降断点把数组切分为若干极大升序段</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">以 nums = [12,17,15,13,10,11,12] 为例：四个段各自求和，取最大</text>

  <!-- nums row label -->
  <text x="44" y="90" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">nums</text>

  <!-- Array cells, 7 cells width 56, gap 12 between runs -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <!-- run 1: green [12,17] -->
    <rect x="60" y="70" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="88" y="92" fill="#333" font-weight="bold">12</text>
    <rect x="116" y="70" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="144" y="92" fill="#333" font-weight="bold">17</text>
    <!-- run 2: blue [15] -->
    <rect x="184" y="70" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="212" y="92" fill="#333" font-weight="bold">15</text>
    <!-- run 3: orange [13] -->
    <rect x="252" y="70" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="280" y="92" fill="#333" font-weight="bold">13</text>
    <!-- run 4: red emphasized [10,11,12] -->
    <rect x="320" y="70" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="348" y="92" fill="#333" font-weight="bold">10</text>
    <rect x="376" y="70" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="404" y="92" fill="#333" font-weight="bold">11</text>
    <rect x="432" y="70" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="460" y="92" fill="#333" font-weight="bold">12</text>
  </g>

  <!-- index labels -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="88" y="62">0</text>
    <text x="144" y="62">1</text>
    <text x="212" y="62">2</text>
    <text x="280" y="62">3</text>
    <text x="348" y="62">4</text>
    <text x="404" y="62">5</text>
    <text x="460" y="62">6</text>
  </g>

  <!-- break scissors at gaps: 172-184, 240-252, 308-320 -->
  <g stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)">
    <path d="M 178 60 L 174 70 L 182 74 L 176 84"/>
    <path d="M 246 60 L 242 70 L 250 74 L 244 84"/>
    <path d="M 314 60 L 310 70 L 318 74 L 312 84"/>
  </g>
  <text x="178" y="120" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">断</text>
  <text x="246" y="120" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">断</text>
  <text x="314" y="120" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">断</text>

  <!-- run brackets -->
  <path d="M 60 110 L 60 118 L 172 118 L 172 110" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 184 110 L 184 118 L 240 118 L 240 110" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 252 110 L 252 118 L 308 118 L 308 110" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 320 110 L 320 118 L 488 118 L 488 110" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- run sum labels -->
  <text x="116" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 和=29</text>
  <text x="212" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 15</text>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 13</text>
  <text x="404" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 和=33 ★</text>

  <!-- arrows down to max -->
  <path d="M 116 144 L 250 172" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 212 144 L 258 172" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 144 L 268 172" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 404 144 L 286 172" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- max box -->
  <rect x="110" y="176" width="300" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="199" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = max(29, 15, 13, 33) = 33</text>

  <!-- key insight box -->
  <rect x="44" y="232" width="472" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">① 全为正整数 → 升序段越长和越大 → 最优解必是某个极大升序段</text>
  <text x="280" y="274" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">② 递增只看相邻一格：nums[i] &gt; nums[i-1] 续接，否则断点重启</text>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">③ 无需记录段边界：状态全在滚动变量 cur 里，一趟扫描 O(n)</text>
  <text x="280" y="314" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">极大升序段 = 无法再向两侧扩展的连续严格递增段</text>

  <!-- footer -->
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">长度为 1 的子数组也算升序：单元素段 ② ③ 同样参与 max 竞争</text>
</svg>
