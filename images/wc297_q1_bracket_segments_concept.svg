<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：升序上限把收入轴分段 —— min 封顶 + prev 游标</text>
  <path d="M 120 38 Q 320 46 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 收入轴刻度映射：0→90, 3→162, 7→258, 10→330, 12→378, 20→570 -->

  <!-- income 竖线 -->
  <path d="M 330 52 V 258" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="330" y="46" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">income = 10</text>

  <!-- 段1: [0,3] 50% -->
  <g filter="url(#sk)"><rect x="90" y="60" width="72" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="126" y="84" text-anchor="middle" font-size="14" fill="#33455e">50%</text>
  <text x="168" y="84" font-size="11" fill="#666">3 元</text>

  <!-- 段2: [3,7] 10% -->
  <g filter="url(#sk)"><rect x="162" y="104" width="96" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="210" y="128" text-anchor="middle" font-size="14" fill="#2e5e2e">10%</text>
  <text x="264" y="128" font-size="11" fill="#666">4 元</text>

  <!-- 段3: [7,12] 25%，收入在第 3 段中途截止 -->
  <g filter="url(#sk)"><rect x="258" y="148" width="72" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="294" y="172" text-anchor="middle" font-size="14" fill="#7a5415">25%</text>
  <g filter="url(#sk)"><rect x="330" y="148" width="48" height="38" rx="4" fill="#f2f2f2" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="354" y="172" text-anchor="middle" font-size="9.5" fill="#999">不计税</text>
  <text x="386" y="172" font-size="10.5" fill="#b85450">5 元只算 3 元</text>

  <!-- 段4: [12,20] 30%，计满后的段 -->
  <g filter="url(#sk)"><rect x="378" y="192" width="192" height="38" rx="4" fill="#f4f4f4" stroke="#bdbdbd" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="474" y="209" text-anchor="middle" font-size="11" fill="#999">30%</text>
  <text x="474" y="224" text-anchor="middle" font-size="9.5" fill="#999">收入已计满 → break 拦下</text>

  <!-- 收入轴 -->
  <path d="M 80 266 L 588 266" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><path d="M 90 262 V 272" stroke="#3a3a3a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><path d="M 162 262 V 272" stroke="#3a3a3a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><path d="M 258 262 V 272" stroke="#3a3a3a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><path d="M 330 260 V 274" stroke="#b85450" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><path d="M 378 262 V 272" stroke="#3a3a3a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><path d="M 570 262 V 272" stroke="#3a3a3a" stroke-width="1.2"/></g>
  <text x="584" y="256" text-anchor="end" font-size="10" fill="#888">收入轴（元）</text>
  <text x="90" y="288" text-anchor="middle" font-size="11.5" fill="#444">0</text>
  <text x="162" y="288" text-anchor="middle" font-size="11.5" fill="#444">3</text>
  <text x="258" y="288" text-anchor="middle" font-size="11.5" fill="#444">7</text>
  <text x="330" y="288" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">10</text>
  <text x="378" y="288" text-anchor="middle" font-size="11.5" fill="#444">12</text>
  <text x="570" y="288" text-anchor="middle" font-size="11.5" fill="#444">20</text>

  <!-- prev 游标右移 -->
  <path d="M 92 302 Q 120 314 158 306" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 164 302 Q 210 314 254 306" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 260 302 Q 316 314 374 306" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="126" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a">prev ← 3</text>
  <text x="210" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a">prev ← 7</text>
  <text x="320" y="324" text-anchor="middle" font-size="10" fill="#b85450">prev ← 12 ＞ income → break</text>
  <text x="90" y="346" font-size="10.5" fill="#555">prev 游标 = 上一段上限：算完第 i 段后 prev ← upper_i，右移即「扣前」</text>

  <!-- 公式框 -->
  <g filter="url(#sk)"><rect x="70" y="354" width="500" height="48" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="320" y="376" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">taxable_i = min(income, upper_i) − prev</text>
  <text x="320" y="394" text-anchor="middle" font-size="11" fill="#555">min 把本段封顶在收入处；− prev 扣掉已计税的前段 —— 一段一次乘法</text>

  <text x="320" y="428" text-anchor="middle" font-size="11" fill="#888">升序分段把逐元 O(income·n) 压成单趟 O(n)；负值段由「income ≤ prev 即 break」守卫拦下</text>
</svg>
