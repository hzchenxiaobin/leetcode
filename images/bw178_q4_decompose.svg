<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="372" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">集合拆分：奇妙数 = 数位和好 ∪ 本身好</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两个集合有交集，直接相加会重复计数，必须按「不重不漏」拆开</text>
  <rect x="70" y="76" width="300" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="122" y="104" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">数位和是好数</text>
  <rect x="240" y="96" width="240" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="392" y="124" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">本身是好数</text>
  <text x="300" y="168" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">交集</text>
  <text x="180" y="200" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">数位 DP 统计</text>
  <text x="430" y="186" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">枚举好数</text>
  <rect x="36" y="246" width="488" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="266" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">答案的两项</text>
  <text x="48" y="284" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">① 数位和好数的个数（数位 DP，[1, N] 上前缀和相减）</text>
  <text x="48" y="302" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">② 本身是好数、但数位和不是好数的个数（枚举好数，逐个查表）</text>
  <text x="280" y="334" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">两项相加 = 奇妙数总数，交集只被 ① 计一次 ✓</text>
  <text x="280" y="358" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">两个计数都用「≤ N 的答案相减」得到区间 [l, r] 的结果：ans = f(r) − f(l−1)</text>
</svg>
