<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="38" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">核心观察：b_x 只由 pos(x) 决定</text>

  <!-- 左侧：计数来源 -->
  <rect x="26" y="62" width="340" height="204" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="92" font-size="14" fill="#2c4a6b"
        filter="url(#rough2)">数对 (x &lt; y)，且 x 在 y 左边</text>
  <text x="46" y="120" font-size="13" fill="#333"
        filter="url(#rough2)">此时 b_x −= 1，b_y += 1</text>
  <text x="46" y="148" font-size="13" fill="#333"
        filter="url(#rough2)">只盯住值 x：</text>
  <text x="46" y="176" font-size="13" fill="#333"
        filter="url(#rough2)">C_x = 左边比 x 小的个数</text>
  <text x="46" y="204" font-size="13" fill="#333"
        filter="url(#rough2)">A_x = 右边比 x 大的个数</text>
  <text x="46" y="240" font-size="15" fill="#b85450"
        filter="url(#rough2)">b_x = C_x − A_x</text>

  <!-- 右侧：消去 C_x -->
  <rect x="396" y="62" width="338" height="204" rx="10" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="416" y="92" font-size="14" fill="#2f5a24"
        filter="url(#rough2)">改用可数的量表示 A_x</text>
  <text x="416" y="120" font-size="13" fill="#333"
        filter="url(#rough2)">x 左边共 pos(x) − 1 个元素</text>
  <text x="416" y="148" font-size="13" fill="#333"
        filter="url(#rough2)">其中比 x 大的：pos(x) − 1 − C_x</text>
  <text x="416" y="176" font-size="13" fill="#333"
        filter="url(#rough2)">A_x = (n − x) − (pos(x) − 1 − C_x)</text>
  <text x="416" y="204" font-size="13" fill="#333"
        filter="url(#rough2)">b_x = C_x − A_x</text>
  <text x="416" y="236" font-size="14" fill="#b85450"
        filter="url(#rough2)">= pos(x) + x − n − 1</text>

  <!-- 结论高亮 -->
  <rect x="146" y="288" width="470" height="52" rx="10" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="381" y="321" text-anchor="middle" font-size="19" fill="#8a5a00"
        filter="url(#rough2)">pos(x) = b_x + n + 1 − x</text>

  <path d="M381,266 L381,286" stroke="#d6a040" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="374" text-anchor="middle" font-size="13" fill="#446688"
        filter="url(#rough2)">每个值的下标被唯一确定 → 不必枚举排列，O(n) 直接构造</text>
</svg>
