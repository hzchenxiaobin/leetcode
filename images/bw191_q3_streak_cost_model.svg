<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：连胜段 + 跳过日 → 代价模型</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">示例 n = 9：段 (3, 2)，总天数 = (3+1) + (2+1) − 1 = 6</text>

  <rect x="46" y="60" width="64" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <rect x="116" y="60" width="64" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <rect x="186" y="60" width="64" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <rect x="256" y="60" width="64" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <rect x="326" y="60" width="64" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <rect x="396" y="60" width="64" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>

  <text x="78" y="76" text-anchor="middle" font-size="9.5" fill="#888">天1</text>
  <text x="148" y="76" text-anchor="middle" font-size="9.5" fill="#888">天2</text>
  <text x="218" y="76" text-anchor="middle" font-size="9.5" fill="#888">天3</text>
  <text x="288" y="76" text-anchor="middle" font-size="9.5" fill="#888">天4</text>
  <text x="358" y="76" text-anchor="middle" font-size="9.5" fill="#888">天5</text>
  <text x="428" y="76" text-anchor="middle" font-size="9.5" fill="#888">天6</text>

  <text x="78" y="99" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold">+1</text>
  <text x="148" y="99" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold">+2</text>
  <text x="218" y="99" text-anchor="middle" font-size="14" fill="#3a4a66" font-weight="bold">+3</text>
  <text x="288" y="99" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold">跳过</text>
  <text x="358" y="99" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold">+1</text>
  <text x="428" y="99" text-anchor="middle" font-size="14" fill="#3a5a30" font-weight="bold">+2</text>

  <text x="288" y="113" text-anchor="middle" font-size="8.5" fill="#b85450">重置连胜</text>

  <text x="78" y="136" text-anchor="middle" font-size="9.5" fill="#666">1</text>
  <text x="148" y="136" text-anchor="middle" font-size="9.5" fill="#666">3</text>
  <text x="218" y="136" text-anchor="middle" font-size="9.5" fill="#666">6</text>
  <text x="288" y="136" text-anchor="middle" font-size="9.5" fill="#666">6</text>
  <text x="358" y="136" text-anchor="middle" font-size="9.5" fill="#666">7</text>
  <text x="428" y="136" text-anchor="middle" font-size="9.5" fill="#666">9</text>
  <text x="470" y="136" font-size="9" fill="#999">← 累计分</text>

  <path d="M 46 154 L 46 166 L 320 166 L 320 154" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="183" y="186" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">段①：长度 3，得 1+2+3 = 6 分</text>
  <text x="183" y="202" text-anchor="middle" font-size="10" fill="#555">连同跳过日共占 4 天</text>

  <path d="M 326 154 L 326 166 L 460 166 L 460 154" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="393" y="186" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">段②：长度 2，得 3 分</text>
  <text x="393" y="202" text-anchor="middle" font-size="10" fill="#555">末段免跳过，只占 2 天</text>

  <rect x="60" y="224" width="440" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold">总天数 = (k₁+1) + (k₂+1) + ⋯ + (kₘ+1) − 1</text>
  <text x="280" y="276" text-anchor="middle" font-size="11" fill="#555">本例 = 4 + 3 − 1 = 6 ✓　（−1：最后一段的跳过日省掉）</text>

  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#999">连胜一旦中断，后续怎么走与历史无关 → 只需决定「每段多长」</text>
</svg>
