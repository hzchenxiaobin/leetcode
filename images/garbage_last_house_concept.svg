<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arry" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：每辆车只开到「自己垃圾」最后出现的房子</text>

  <text x="40" y="50" font-size="11.5" fill="#666" filter="url(#rough2)">街道（示例 1）：garbage = ["G","P","GP","GG"]，travel = [2,4,3]</text>

  <!-- ===== 房子 ===== -->
  <g filter="url(#rough2)">
    <text x="95" y="72" text-anchor="middle" font-size="11" fill="#666">房 0</text>
    <rect x="61" y="78" width="68" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="95" y="109" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">G</text>

    <text x="215" y="72" text-anchor="middle" font-size="11" fill="#666">房 1</text>
    <rect x="181" y="78" width="68" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="215" y="109" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">P</text>

    <text x="335" y="72" text-anchor="middle" font-size="11" fill="#666">房 2</text>
    <rect x="301" y="78" width="68" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="335" y="109" text-anchor="middle" font-size="16" font-weight="bold"><tspan fill="#446688">G</tspan><tspan fill="#4a7a3a">P</tspan></text>

    <text x="455" y="72" text-anchor="middle" font-size="11" fill="#666">房 3</text>
    <rect x="421" y="78" width="68" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5"/>
    <text x="455" y="109" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">GG</text>
  </g>

  <!-- travel 边 -->
  <g filter="url(#rough2)">
    <text x="155" y="96" text-anchor="middle" font-size="11" fill="#666">2</text>
    <path d="M 133 105 L 174 105" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>
    <text x="275" y="96" text-anchor="middle" font-size="11" fill="#666">4</text>
    <path d="M 253 105 L 294 105" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>
    <text x="395" y="96" text-anchor="middle" font-size="11" fill="#666">3</text>
    <path d="M 373 105 L 414 105" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/>
  </g>

  <!-- ===== 竖直参考线 ===== -->
  <g filter="url(#rough2)">
    <path d="M 95 134 L 95 300" stroke="#999" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
    <text x="101" y="150" font-size="10" fill="#888">都从房 0 出发</text>
    <path d="M 335 134 L 335 229" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
    <text x="341" y="150" font-size="10" fill="#4a7a3a" font-weight="bold">P 最远</text>
    <path d="M 455 134 L 455 289" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,4" fill="none"/>
    <text x="461" y="150" font-size="10" fill="#446688" font-weight="bold">G 最远</text>
  </g>

  <!-- ===== M 车道 ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="161" width="52" height="28" fill="#f5f5f5" stroke="#999" stroke-width="1.6" rx="6"/>
    <text x="46" y="180" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">M 车</text>
    <path d="M 95 175 L 137 175" stroke="#999" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#arry)"/>
    <text x="150" y="181" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">×</text>
    <text x="168" y="180" font-size="11.5" fill="#888">全街无金属 → 行驶 0</text>
  </g>

  <!-- ===== P 车道 ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="221" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="46" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">P 车</text>
    <circle cx="95" cy="235" r="3.5" fill="#4a7a3a"/>
    <path d="M 95 235 L 329 235" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrg)"/>
    <text x="212" y="227" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">行驶 2+4 = 6</text>
    <text x="347" y="240" font-size="12" fill="#4a7a3a" font-weight="bold">停！房 2</text>
  </g>

  <!-- ===== G 车道 ===== -->
  <g filter="url(#rough2)">
    <rect x="20" y="281" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="46" y="300" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">G 车</text>
    <circle cx="95" cy="295" r="3.5" fill="#446688"/>
    <path d="M 95 295 L 449 295" stroke="#446688" stroke-width="2.5" fill="none" marker-end="url(#arrb)"/>
    <text x="272" y="287" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">行驶 2+4+3 = 9</text>
    <text x="467" y="300" font-size="12" fill="#446688" font-weight="bold">停！房 3</text>
  </g>

  <!-- ===== 两笔账 ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="345" width="245" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="152" y="366" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">收集账：固定不变</text>
    <text x="152" y="386" text-anchor="middle" font-size="12" fill="#333">每件 1 分钟 × 共 6 件 = 6</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="285" y="345" width="245" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="407" y="366" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">行驶账：各车到最远垃圾房</text>
    <text x="407" y="386" text-anchor="middle" font-size="12" fill="#333">M:0 + P:6 + G:9 = 15</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="30" y="409" width="500" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="280" y="425" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">总时间 = 收集 6 + 行驶 15 = 21 分钟</text>
    <text x="280" y="441" text-anchor="middle" font-size="10.5" fill="#666">独占约束 ⇒ 三辆车串行，谁先谁后，总时间都是各自时长之和</text>
  </g>
</svg>
