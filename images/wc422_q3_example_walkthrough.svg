<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="960" height="650" fill="#fafafa"/>
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：等门 + 交替代价</text>
  <path d="M 330 44 Q 480 52 630 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: example 1 ===== -->
  <text x="80" y="76" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">示例 1：moveTime = [[0,4],[4,4]]，答案 7</text>

  <!-- 2x2 grid, cell 96x64, origin (80,92) -->
  <g filter="url(#sk)"><rect x="80" y="92" width="96" height="64" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="86" y="106" font-size="8.5" fill="#666" filter="url(#sk)">(0,0) 偶</text>
  <text x="128" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">0</text>
  <text x="128" y="148" text-anchor="middle" font-size="9" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">起点</text>
  <g filter="url(#sk)"><rect x="176" y="92" width="96" height="64" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="182" y="106" font-size="8.5" fill="#666" filter="url(#sk)">(0,1) 奇</text>
  <text x="224" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#a87820" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="80" y="156" width="96" height="64" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="86" y="170" font-size="8.5" fill="#666" filter="url(#sk)">(1,0) 奇</text>
  <text x="128" y="192" text-anchor="middle" font-size="20" font-weight="bold" fill="#a87820" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="176" y="156" width="96" height="64" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
  <text x="182" y="170" font-size="8.5" fill="#666" filter="url(#sk)">(1,1) 偶</text>
  <text x="224" y="192" text-anchor="middle" font-size="20" font-weight="bold" fill="#446688" filter="url(#sk)">4</text>
  <text x="224" y="212" text-anchor="middle" font-size="9" font-weight="bold" fill="#b03a3a" filter="url(#sk)">终点</text>
  <text x="80" y="236" font-size="9.5" fill="#888" filter="url(#sk)">格中数字 = moveTime（门开时刻）</text>

  <!-- path arrows -->
  <path d="M 128 132 Q 133 158 128 179" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 136 188 Q 176 193 214 188" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="153" cy="156" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="153" y="160" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#sk)">1s</text>
  <g filter="url(#sk)"><circle cx="176" cy="216" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="176" y="220" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#a87820" filter="url(#sk)">2s</text>

  <!-- timeline: 1s = 64px -->
  <path d="M 80 290 L 566 290" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <g stroke="#999" stroke-width="1.2" filter="url(#sk)">
    <path d="M 80 284 L 80 296"/><path d="M 144 284 L 144 296"/><path d="M 208 284 L 208 296"/>
    <path d="M 272 284 L 272 296"/><path d="M 336 284 L 336 296"/><path d="M 400 284 L 400 296"/>
    <path d="M 464 284 L 464 296"/><path d="M 528 284 L 528 296"/>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#sk)">
    <text x="80" y="310">0</text><text x="144" y="310">1</text><text x="208" y="310">2</text>
    <text x="272" y="310">3</text><text x="336" y="310">4</text><text x="400" y="310">5</text>
    <text x="464" y="310">6</text><text x="528" y="310">7</text>
  </g>
  <text x="330" y="332" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">时刻 t（秒）</text>

  <text x="208" y="252" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">原地等门（不占步数）</text>
  <path d="M 80 268 L 334 268" stroke="#999" stroke-width="2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <text x="368" y="236" text-anchor="middle" font-size="9" fill="#666" filter="url(#sk)">偶格 (0,0) 出发</text>
  <text x="368" y="252" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#sk)">第1步·1s</text>
  <path d="M 336 268 L 398 268" stroke="#446688" stroke-width="6" fill="none" filter="url(#sk)"/>
  <text x="464" y="236" text-anchor="middle" font-size="9" fill="#666" filter="url(#sk)">奇格 (1,0) 出发</text>
  <text x="464" y="252" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a87820" filter="url(#sk)">第2步·2s</text>
  <path d="M 400 268 L 526 268" stroke="#d6a040" stroke-width="6" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="528" cy="268" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="542" y="272" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">t=7 到达</text>

  <!-- dijkstra pop table -->
  <g filter="url(#sk)">
    <rect x="620" y="92" width="290" height="216" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="640" y="116" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">Dijkstra 弹堆过程</text>
  <text x="640" y="140" font-size="10" font-weight="bold" fill="#446688" filter="url(#sk)">① 弹 (0, (0,0))</text>
  <text x="640" y="156" font-size="10" fill="#444" filter="url(#sk)">cost=1（偶格）；两邻居门=4</text>
  <text x="640" y="170" font-size="10" font-family="monospace" fill="#444" filter="url(#sk)">nd = max(0,4)+1 = 5 → 入堆×2</text>
  <text x="640" y="192" font-size="10" font-weight="bold" fill="#446688" filter="url(#sk)">② 弹 (5, (0,1))</text>
  <text x="640" y="208" font-size="10" fill="#444" filter="url(#sk)">cost=2（奇格）</text>
  <text x="640" y="222" font-size="10" font-family="monospace" fill="#444" filter="url(#sk)">nd = max(5,4)+2 = 7 → dist[1][1]=7</text>
  <text x="640" y="244" font-size="10" font-weight="bold" fill="#446688" filter="url(#sk)">③ 弹 (5, (1,0))</text>
  <text x="640" y="260" font-size="10" fill="#444" filter="url(#sk)">同样得 7，不更优 → 跳过</text>
  <text x="640" y="282" font-size="10" font-weight="bold" fill="#446688" filter="url(#sk)">④ 弹 (7, (1,1))</text>
  <text x="640" y="298" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是终点 → 返回 7 ✓</text>

  <path d="M 60 348 L 900 348" stroke="#e0e0e0" stroke-width="1.2" filter="url(#sk)"/>

  <!-- ===== Panel 2: example 2 ===== -->
  <text x="80" y="380" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">示例 2：moveTime 全 0（2×4），答案 6 —— 无等待，纯交替代价</text>

  <!-- 2x4 grid, cell 60x44, origin (80,400) -->
  <text x="80" y="396" font-size="9.5" fill="#888" filter="url(#sk)">moveTime 全 0</text>
  <g filter="url(#sk)"><rect x="80" y="400" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="86" y="436" font-size="8" fill="#666" filter="url(#sk)">(0,0)</text>
  <g filter="url(#sk)"><rect x="140" y="400" width="60" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="200" y="400" width="60" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="260" y="400" width="60" height="44" rx="4" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="80" y="444" width="60" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="86" y="482" font-size="8" fill="#666" filter="url(#sk)">(1,0)</text>
  <g filter="url(#sk)"><rect x="140" y="444" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="146" y="482" font-size="8" fill="#666" filter="url(#sk)">(1,1)</text>
  <g filter="url(#sk)"><rect x="200" y="444" width="60" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="206" y="482" font-size="8" fill="#666" filter="url(#sk)">(1,2)</text>
  <g filter="url(#sk)"><rect x="260" y="444" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="266" y="482" font-size="8" fill="#666" filter="url(#sk)">(1,3)</text>
  <g filter="url(#sk)"><circle cx="131" cy="411" r="8.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="131" y="415" text-anchor="middle" font-size="9" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">起</text>
  <g filter="url(#sk)"><circle cx="309" cy="455" r="8.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="309" y="459" text-anchor="middle" font-size="9" font-weight="bold" fill="#b03a3a" filter="url(#sk)">终</text>

  <!-- path arrows -->
  <path d="M 110 430 Q 114 446 110 458" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 116 466 L 158 466" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 176 466 L 218 466" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 236 466 L 278 466" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="134" cy="446" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="134" y="450" text-anchor="middle" font-size="9" font-weight="bold" fill="#446688" filter="url(#sk)">1s</text>
  <g filter="url(#sk)"><circle cx="168" cy="452" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="168" y="456" text-anchor="middle" font-size="9" font-weight="bold" fill="#a87820" filter="url(#sk)">2s</text>
  <g filter="url(#sk)"><circle cx="228" cy="452" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="228" y="456" text-anchor="middle" font-size="9" font-weight="bold" fill="#446688" filter="url(#sk)">1s</text>
  <g filter="url(#sk)"><circle cx="288" cy="452" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="288" y="456" text-anchor="middle" font-size="9" font-weight="bold" fill="#a87820" filter="url(#sk)">2s</text>

  <!-- timeline: 1s = 50px -->
  <path d="M 80 576 L 406 576" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <g stroke="#999" stroke-width="1.2" filter="url(#sk)">
    <path d="M 80 570 L 80 582"/><path d="M 130 570 L 130 582"/><path d="M 180 570 L 180 582"/>
    <path d="M 230 570 L 230 582"/><path d="M 280 570 L 280 582"/><path d="M 330 570 L 330 582"/>
    <path d="M 380 570 L 380 582"/>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#sk)">
    <text x="80" y="596">0</text><text x="130" y="596">1</text><text x="180" y="596">2</text>
    <text x="230" y="596">3</text><text x="280" y="596">4</text><text x="330" y="596">5</text>
    <text x="380" y="596">6</text>
  </g>
  <text x="230" y="616" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">时刻 t（秒）</text>

  <path d="M 80 554 L 128 554" stroke="#446688" stroke-width="5" fill="none" filter="url(#sk)"/>
  <text x="105" y="538" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#sk)">1s</text>
  <path d="M 130 554 L 228 554" stroke="#d6a040" stroke-width="5" fill="none" filter="url(#sk)"/>
  <text x="180" y="538" text-anchor="middle" font-size="10" font-weight="bold" fill="#a87820" filter="url(#sk)">2s</text>
  <path d="M 230 554 L 278 554" stroke="#446688" stroke-width="5" fill="none" filter="url(#sk)"/>
  <text x="255" y="538" text-anchor="middle" font-size="10" font-weight="bold" fill="#446688" filter="url(#sk)">1s</text>
  <path d="M 280 554 L 378 554" stroke="#d6a040" stroke-width="5" fill="none" filter="url(#sk)"/>
  <text x="330" y="538" text-anchor="middle" font-size="10" font-weight="bold" fill="#a87820" filter="url(#sk)">2s</text>
  <g filter="url(#sk)"><circle cx="380" cy="554" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="380" y="532" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">t=6 到达</text>
  <text x="230" y="638" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">出发格奇偶：偶→奇→偶→奇，代价 1→2→1→2，全程无等待</text>

  <!-- right note box -->
  <g filter="url(#sk)">
    <rect x="560" y="400" width="360" height="180" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="578" y="424" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">对照要点</text>
  <text x="578" y="448" font-size="10.5" font-family="monospace" fill="#444" filter="url(#sk)">时间线：0 → 1 → 3 → 4 → 6</text>
  <text x="578" y="472" font-size="10.5" fill="#444" filter="url(#sk)">每步代价只看出发格：</text>
  <text x="578" y="494" font-size="10.5" fill="#444" filter="url(#sk)">(0,0) 偶 → 1s；(1,0) 奇 → 2s</text>
  <text x="578" y="516" font-size="10.5" fill="#444" filter="url(#sk)">(1,1) 偶 → 1s；(1,2) 奇 → 2s</text>
  <text x="578" y="542" font-size="10.5" fill="#444" filter="url(#sk)">无门禁时直奔终点即最优，</text>
  <text x="578" y="564" font-size="10.5" fill="#444" filter="url(#sk)">步数奇偶被 (i+j) 唯一锁定。</text>
</svg>
