<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="77"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 双指针走查：排序后 [−7,−6,−2,−1,2,3,5]，target = −2</text>

  <!-- 走查表 -->
  <g filter="url(#rough2)" font-size="12.5">
    <rect x="60" y="54" width="120" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="120" y="74" text-anchor="middle" fill="#333">步骤 (left,right)</text>
    <rect x="180" y="54" width="130" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="245" y="74" text-anchor="middle" fill="#333">和（left+right）</text>
    <rect x="310" y="54" width="110" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="365" y="74" text-anchor="middle" fill="#333">判断 &lt; −2 ?</text>
    <rect x="420" y="54" width="160" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="500" y="74" text-anchor="middle" fill="#333">动作 / ans</text>

    <rect x="60" y="88" width="120" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="120" y="107" text-anchor="middle" fill="#333">① (−7, 5)</text>
    <rect x="180" y="88" width="130" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="245" y="107" text-anchor="middle" fill="#333">−2</text>
    <rect x="310" y="88" width="110" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="365" y="107" text-anchor="middle" fill="#b85450">✗（不严格）</text>
    <rect x="420" y="88" width="160" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="500" y="107" text-anchor="middle" fill="#333">right−−，ans=0</text>

    <rect x="60" y="120" width="120" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="120" y="139" text-anchor="middle" fill="#333">② (−7, 3)</text>
    <rect x="180" y="120" width="130" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="245" y="139" text-anchor="middle" fill="#333">−4</text>
    <rect x="310" y="120" width="110" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="365" y="139" text-anchor="middle" fill="#4a7a3a">✓</text>
    <rect x="420" y="120" width="160" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="500" y="139" text-anchor="middle" fill="#333">+5，left++，ans=5</text>

    <rect x="60" y="152" width="120" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="120" y="171" text-anchor="middle" fill="#333">③ (−6, 3)</text>
    <rect x="180" y="152" width="130" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="245" y="171" text-anchor="middle" fill="#333">−3</text>
    <rect x="310" y="152" width="110" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="365" y="171" text-anchor="middle" fill="#4a7a3a">✓</text>
    <rect x="420" y="152" width="160" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="500" y="171" text-anchor="middle" fill="#333">+4，left++，ans=9</text>

    <rect x="60" y="184" width="120" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="120" y="203" text-anchor="middle" fill="#333">④ (−2, 3)</text>
    <rect x="180" y="184" width="130" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="245" y="203" text-anchor="middle" fill="#333">1</text>
    <rect x="310" y="184" width="110" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="365" y="203" text-anchor="middle" fill="#b85450">✗</text>
    <rect x="420" y="184" width="160" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="500" y="203" text-anchor="middle" fill="#333">right−−，ans=9</text>

    <rect x="60" y="216" width="120" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="120" y="235" text-anchor="middle" fill="#333">⑤ (−2, 2)</text>
    <rect x="180" y="216" width="130" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="245" y="235" text-anchor="middle" fill="#333">0</text>
    <rect x="310" y="216" width="110" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="365" y="235" text-anchor="middle" fill="#b85450">✗</text>
    <rect x="420" y="216" width="160" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="500" y="235" text-anchor="middle" fill="#333">right−−，ans=9</text>

    <rect x="60" y="248" width="120" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="120" y="267" text-anchor="middle" fill="#333">⑥ (−2, −1)</text>
    <rect x="180" y="248" width="130" height="28" rx="4" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="245" y="267" text-anchor="middle" fill="#333">−3</text>
    <rect x="310" y="248" width="110" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="365" y="267" text-anchor="middle" fill="#4a7a3a">✓</text>
    <rect x="420" y="248" width="160" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="500" y="267" text-anchor="middle" fill="#333">+1，left++，ans=10</text>
  </g>

  <!-- 数轴示意 -->
  <g filter="url(#rough2)">
    <text x="320" y="304" text-anchor="middle" font-size="12.5" fill="#555">指针轨迹：left 一路右移、right 逐步左移，相遇即止</text>
    <path d="M 100 330 L 540 330" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <ellipse cx="140" cy="330" rx="6" ry="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="140" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a">left</text>
    <ellipse cx="500" cy="330" rx="6" ry="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="500" y="316" text-anchor="middle" font-size="11" fill="#b85450">right</text>
    <text x="320" y="352" text-anchor="middle" font-size="12" fill="#4a7a3a">最终 ans = 10 ✓</text>
  </g>
</svg>
