<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="157"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">中心数视角：三个连续数关于 x 对称</text>

  <!-- number line -->
  <path d="M 70 190 L 490 190" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="200" cy="190" r="6" fill="#446688"/>
    <circle cx="280" cy="190" r="8" fill="#b85450"/>
    <circle cx="360" cy="190" r="6" fill="#446688"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="200" y="168">x−1</text>
    <text x="280" y="162" fill="#b85450" font-size="17">x</text>
    <text x="360" y="168">x+1</text>
  </g>
  <!-- balance arcs -->
  <path d="M 200 214 C 220 234, 260 234, 280 214" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 280 214 C 300 234, 340 234, 360 214" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="252" font-size="12" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">−1 与 +1 抵消</text>
  <text x="320" y="252" font-size="12" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">对称</text>

  <!-- equation -->
  <g filter="url(#rough2)">
    <rect x="120" y="76" width="320" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
  </g>
  <text x="280" y="100" font-size="15" fill="#333" filter="url(#rough2)" text-anchor="middle" font-weight="bold">(x−1) + x + (x+1) = 3x = num</text>
  <text x="280" y="122" font-size="13" fill="#8a6d1f" filter="url(#rough2)" text-anchor="middle">⇒ x = num / 3 必须整除</text>
  <path d="M 280 136 C 280 150, 280 158, 280 166" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- examples -->
  <g filter="url(#rough2)">
    <rect x="60" y="286" width="210" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
    <rect x="290" y="286" width="210" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="165" y="310" font-weight="bold" fill="#2d5a22">num = 33</text>
    <text x="165" y="330">x = 11 → [10, 11, 12]</text>
    <text x="395" y="310" font-weight="bold" fill="#8c3a36">num = 4</text>
    <text x="395" y="330">4 % 3 = 1 → 无解 []</text>
  </g>
</svg>
