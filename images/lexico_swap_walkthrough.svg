<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">走查："45320"（有命中）与 "001"（无命中）</text>
  <path d="M 170 38 Q 320 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Part A: 45320 -->
  <g filter="url(#sk)">
    <rect x="40" y="52" width="560" height="196" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="62" y="76" font-size="13" font-weight="bold" fill="#2b6e9e">s = "45320"</text>
  <g filter="url(#sk)">
    <rect x="90" y="88" width="40" height="40" rx="4" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.2"/>
    <rect x="134" y="88" width="40" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="178" y="88" width="40" height="40" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="222" y="88" width="40" height="40" rx="4" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.2"/>
    <rect x="266" y="88" width="40" height="40" rx="4" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.2"/>
  </g>
  <text x="110" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a4a4a">4</text>
  <text x="154" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415">5</text>
  <text x="198" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6415">3</text>
  <text x="242" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a4a4a">2</text>
  <text x="286" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a4a4a">0</text>
  <g filter="url(#sk)">
    <path d="M 152 84 Q 176 70 200 84" stroke="#2e6e2e" stroke-width="1.8" fill="none" marker-end="url(#ar3)"/>
    <path d="M 200 90 Q 176 104 152 90" stroke="#2e6e2e" stroke-width="1.8" fill="none" marker-end="url(#ar3)"/>
  </g>
  <text x="112" y="146" text-anchor="middle" font-size="11" fill="#b85450">i=0: (4,5)</text>
  <text x="112" y="162" text-anchor="middle" font-size="11" fill="#b85450">奇偶不同 ✗</text>
  <text x="176" y="146" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">i=1: (5,3)</text>
  <text x="176" y="162" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">同奇 ✓ 5&gt;3 ✓ 命中！</text>
  <text x="240" y="146" text-anchor="middle" font-size="11" fill="#8a8a80">i=2: (3,2)</text>
  <text x="240" y="162" text-anchor="middle" font-size="11" fill="#8a8a80">奇偶不同 ✗</text>
  <text x="286" y="146" text-anchor="middle" font-size="11" fill="#8a8a80">i=3: (2,0)</text>
  <text x="286" y="162" text-anchor="middle" font-size="11" fill="#8a8a80">也命中，但更右</text>
  <g filter="url(#sk)">
    <rect x="330" y="88" width="34" height="34" rx="4" fill="#4a8e4a" stroke="#357035" stroke-width="1.4"/>
    <rect x="368" y="88" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="347" y="110" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">3</text>
  <text x="385" y="110" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">5</text>
  <text x="416" y="110" font-size="13" fill="#2b6e9e" font-weight="bold">← 交换后</text>
  <text x="416" y="128" font-size="12" fill="#2b6e9e">"43520"，break</text>
  <text x="62" y="200" font-size="12" fill="#8a6415">注意：i=3 的 (2,0) 若换只得 "45302" &gt; "43520"——最左命中完胜（引理 2 的现场演示）。</text>
  <text x="62" y="222" font-size="12" fill="#2e6e2e" font-weight="bold">答案："43520"</text>

  <!-- Part B: 001 -->
  <g filter="url(#sk)">
    <rect x="40" y="266" width="560" height="154" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="62" y="290" font-size="13" font-weight="bold" fill="#8a6415">s = "001"</text>
  <g filter="url(#sk)">
    <rect x="90" y="302" width="40" height="40" rx="4" fill="#ffffff" stroke="#c9a86b" stroke-width="1.2"/>
    <rect x="134" y="302" width="40" height="40" rx="4" fill="#ffffff" stroke="#c9a86b" stroke-width="1.2"/>
    <rect x="178" y="302" width="40" height="40" rx="4" fill="#ffffff" stroke="#c9a86b" stroke-width="1.2"/>
  </g>
  <text x="110" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a4a4a">0</text>
  <text x="154" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a4a4a">0</text>
  <text x="198" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a4a4a">1</text>
  <text x="112" y="360" text-anchor="middle" font-size="11" fill="#b85450">i=0: (0,0)</text>
  <text x="112" y="376" text-anchor="middle" font-size="11" fill="#b85450">同偶但相等 ✗</text>
  <text x="176" y="360" text-anchor="middle" font-size="11" fill="#b85450">i=1: (0,1)</text>
  <text x="176" y="376" text-anchor="middle" font-size="11" fill="#b85450">奇偶不同 ✗</text>
  <text x="330" y="328" font-size="13" fill="#8a6415" font-weight="bold">整趟扫描无命中</text>
  <text x="330" y="348" font-size="12" fill="#8a6415">任何合法交换只会白费或变大</text>
  <text x="330" y="368" font-size="12" fill="#8a6415">→ 一次都不换，原样返回</text>
  <text x="62" y="404" font-size="12" fill="#2e6e2e" font-weight="bold">答案："001"</text>
</svg>
