<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：排序后按「相邻差 &gt; limit」切成可重排的组</text>
  <path d="M 140 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 原数组 -->
  <text x="92" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">原数组</text>
  <g filter="url(#sk)"><rect x="170" y="58" width="46" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/></g>
  <text x="193" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">1</text>
  <g filter="url(#sk)"><rect x="228" y="58" width="46" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/></g>
  <text x="251" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">5</text>
  <g filter="url(#sk)"><rect x="286" y="58" width="46" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/></g>
  <text x="309" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">3</text>
  <g filter="url(#sk)"><rect x="344" y="58" width="46" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/></g>
  <text x="367" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">9</text>
  <g filter="url(#sk)"><rect x="402" y="58" width="46" height="36" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3"/></g>
  <text x="425" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">8</text>
  <text x="193" y="110" text-anchor="middle" font-size="10.5" fill="#999">0</text>
  <text x="251" y="110" text-anchor="middle" font-size="10.5" fill="#999">1</text>
  <text x="309" y="110" text-anchor="middle" font-size="10.5" fill="#999">2</text>
  <text x="367" y="110" text-anchor="middle" font-size="10.5" fill="#999">3</text>
  <text x="425" y="110" text-anchor="middle" font-size="10.5" fill="#999">4</text>
  <g filter="url(#sk)"><rect x="508" y="62" width="88" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="552" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10">limit = 2</text>

  <!-- 排序箭头 -->
  <path d="M 320 120 L 320 140" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="334" y="134" font-size="11.5" fill="#666">按值排序（携带原下标）</text>

  <!-- 排序后 + 分组 -->
  <g filter="url(#sk)"><rect x="170" y="150" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="193" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="228" y="150" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="251" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><rect x="286" y="150" width="46" height="36" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="309" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">5</text>
  <g filter="url(#sk)"><rect x="344" y="150" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="367" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a10">8</text>
  <g filter="url(#sk)"><rect x="402" y="150" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="425" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a10">9</text>
  <text x="193" y="202" text-anchor="middle" font-size="10.5" fill="#999">0</text>
  <text x="251" y="202" text-anchor="middle" font-size="10.5" fill="#999">2</text>
  <text x="309" y="202" text-anchor="middle" font-size="10.5" fill="#999">1</text>
  <text x="367" y="202" text-anchor="middle" font-size="10.5" fill="#999">4</text>
  <text x="425" y="202" text-anchor="middle" font-size="10.5" fill="#999">3</text>

  <text x="222" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">2 ✓</text>
  <text x="280" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">2 ✓</text>
  <text x="338" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">3 &gt; 2 ✂</text>
  <text x="396" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">1 ✓</text>
  <path d="M 338 144 L 338 230" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>

  <text x="251" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">组 A：值 {1,3,5}，占下标 {0,2,1}</text>
  <text x="398" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10">组 B：值 {8,9}，占下标 {4,3}</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="48" y="268" width="264" height="94" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="180" y="290" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">组内：可任意重排</text>
  <text x="180" y="312" text-anchor="middle" font-size="11" fill="#333">排序相邻的两值差 ≤ limit，可直换</text>
  <text x="180" y="330" text-anchor="middle" font-size="11" fill="#333">「相邻对换」生成一切排列（冒泡原理）</text>
  <text x="180" y="350" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">→ 小值配小下标即可</text>

  <g filter="url(#sk)"><rect x="328" y="268" width="264" height="94" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="460" y="290" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8c3a36">组间：永远隔离</text>
  <text x="460" y="312" text-anchor="middle" font-size="11" fill="#333">跨组任意两值之差 &gt; limit</text>
  <text x="460" y="330" text-anchor="middle" font-size="11" fill="#333">任何合法交换都不跨组</text>
  <text x="460" y="350" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8c3a36">→ 各组的值集、下标集永不改变</text>

  <g filter="url(#sk)"><rect x="90" y="380" width="460" height="40" rx="8" fill="#f4f9f4" stroke="#9db89d" stroke-width="1"/></g>
  <text x="320" y="405" text-anchor="middle" font-size="12.5" fill="#444">问题分解：每组独立做「第 t 小的值 → 第 t 小的原下标」</text>
</svg>
