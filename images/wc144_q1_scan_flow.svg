<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="600" height="500" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">一次扫描 + 追加：每个字符只做一次判断</text>

  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <rect x="200" y="52" width="200" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="77" fill="#2f4460">i = 0，ans = “”</text>
  </g>

  <path d="M 300 94 L 300 108" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" text-anchor="middle">
    <polygon points="300,110 392,150 300,190 208,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="300" y="155" font-size="12" fill="#8a6a20">i &lt; n ?</text>
  </g>

  <path d="M 392 150 L 478 150 L 478 178" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="141" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <rect x="420" y="182" width="130" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="485" y="208" fill="#8a3a36">返回 ans</text>
  </g>

  <path d="M 300 190 L 300 208" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="204" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <rect x="200" y="212" width="200" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="300" y="237" fill="#2f4460">c = address[i]</text>
  </g>

  <path d="M 300 254 L 300 268" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" text-anchor="middle">
    <polygon points="300,270 392,310 300,350 208,310" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="300" y="315" font-size="12" fill="#8a6a20">c == ‘.’ ?</text>
  </g>

  <path d="M 208 310 L 192 310" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="297" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <path d="M 392 310 L 408 310" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="297" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <rect x="40" y="290" width="150" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="115" y="317" fill="#2f4460">ans += c</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <rect x="410" y="290" width="150" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="485" y="317" fill="#3a5a30">ans += “[.]”</text>
  </g>

  <g filter="url(#rough2)" stroke="#777" stroke-width="1.4" fill="none">
    <path d="M 115 334 L 115 419 L 198 419" marker-end="url(#arr)"/>
    <path d="M 485 334 L 485 419 L 402 419" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <rect x="200" y="400" width="200" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="300" y="424" fill="#8a6a20">i += 1</text>
  </g>

  <path d="M 300 438 L 300 465 L 30 465 L 30 150 L 200 150" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="315" y="482" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">回到循环条件；循环体 O(1)，总计 O(n)</text>
</svg>
