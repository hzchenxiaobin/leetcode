<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="300" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次排序 + 一次哈希</text>
  <rect x="50" y="58" width="180" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140.0" y="87.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sorted = sorted(set(arr))</text>
  <path d="M230,83 L286,83" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="286" y="58" width="184" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="378.0" y="87.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">rank[v] = 下标 + 1</text>
  <path d="M378,108 L378,142" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="286" y="142" width="184" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="378.0" y="171.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">逐元素查表回填</text>
  <path d="M286,167 L230,167" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="50" y="142" width="180" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140.0" y="171.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">O(n log n) / O(n)</text>
  <text x="260" y="236" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">序号 = 比它小的不同值个数 + 1，与「排序后下标」等价。</text>
</svg>
