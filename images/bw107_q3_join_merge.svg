<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">join(x, y)：边界字符相等就删掉一个（删哪个都一样）</text>

  <!-- 面板一：追加 -->
  <g filter="url(#rough2)">
    <rect x="36" y="56" width="262" height="180" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="167" y="80" text-anchor="middle" font-size="13.5" fill="#446688">追加：join(str, w)</text>
    <!-- str -->
    <rect x="60" y="98" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="78" y="120" text-anchor="middle" font-size="14" fill="#333">a</text>
    <rect x="96" y="98" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="114" y="120" text-anchor="middle" font-size="14" fill="#b85450">a</text>
    <text x="152" y="120" text-anchor="middle" font-size="12" fill="#555">= str</text>
    <!-- w -->
    <rect x="96" y="152" width="36" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="114" y="174" text-anchor="middle" font-size="14" fill="#b85450">a</text>
    <rect x="132" y="152" width="36" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="150" y="174" text-anchor="middle" font-size="14" fill="#333">b</text>
    <text x="196" y="174" text-anchor="middle" font-size="12" fill="#555">= w</text>
    <!-- 相等标记 -->
    <ellipse cx="114" cy="140" rx="14" ry="9" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3 2"/>
    <text x="232" y="145" text-anchor="middle" font-size="11.5" fill="#b85450">末 = 首 ✓</text>
    <!-- 结果 -->
    <path d="M 200 100 C 240 96, 250 108, 258 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <rect x="84" y="206" width="36" height="34" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <text x="102" y="228" text-anchor="middle" font-size="14" fill="#333">a</text>
    <rect x="120" y="206" width="36" height="34" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <text x="138" y="228" text-anchor="middle" font-size="14" fill="#333">a</text>
    <rect x="156" y="206" width="36" height="34" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <text x="174" y="228" text-anchor="middle" font-size="14" fill="#333">b</text>
    <text x="120" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a">= "aab"（2+2−1）</text>
  </g>

  <!-- 面板二：前插 -->
  <g filter="url(#rough2)">
    <rect x="322" y="56" width="262" height="180" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="453" y="80" text-anchor="middle" font-size="13.5" fill="#4a7a3a">前插：join(w, str)</text>
    <!-- w -->
    <rect x="350" y="98" width="36" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="368" y="120" text-anchor="middle" font-size="14" fill="#333">a</text>
    <rect x="386" y="98" width="36" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="404" y="120" text-anchor="middle" font-size="14" fill="#b85450">b</text>
    <text x="448" y="120" text-anchor="middle" font-size="12" fill="#555">= w</text>
    <!-- str -->
    <rect x="386" y="152" width="36" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="404" y="174" text-anchor="middle" font-size="14" fill="#b85450">b</text>
    <rect x="422" y="152" width="36" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="440" y="174" text-anchor="middle" font-size="14" fill="#333">c</text>
    <text x="486" y="174" text-anchor="middle" font-size="12" fill="#555">= str</text>
    <!-- 相等标记 -->
    <ellipse cx="404" cy="140" rx="14" ry="9" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3 2"/>
    <text x="530" y="145" text-anchor="middle" font-size="11.5" fill="#b85450">末 = 首 ✓</text>
    <!-- 结果 -->
    <path d="M 500 100 C 528 98, 536 110, 536 130" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <rect x="374" y="206" width="36" height="34" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <text x="392" y="228" text-anchor="middle" font-size="14" fill="#333">a</text>
    <rect x="410" y="206" width="36" height="34" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <text x="428" y="228" text-anchor="middle" font-size="14" fill="#333">b</text>
    <rect x="446" y="206" width="36" height="34" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <text x="464" y="228" text-anchor="middle" font-size="14" fill="#333">c</text>
    <text x="440" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a">= "abc"（2+2−1）</text>
  </g>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="80" y="262" width="460" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="310" y="286" text-anchor="middle" font-size="13.5" fill="#333">|join(x,y)| = |x| + |y| − [ x 末字符 = y 首字符 ]</text>
    <text x="310" y="308" text-anchor="middle" font-size="12" fill="#d6a040">串的内部内容从不参与 → 未来只看（首字符, 尾字符）</text>
  </g>
</svg>
