<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：一次建表，逐块查位</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">外层只扫一遍 jewels，内层只扫一遍 stones，没有嵌套比较</text>

  <rect x="56" y="74" width="236" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="174" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">mask = 0</text>
  <text x="174" y="113" text-anchor="middle" font-size="9.5" fill="#6b7a8f" filter="url(#rough2)">空的类型表</text>

  <path d="M 174 124 L 174 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="148" width="236" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="174" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">for c in jewels</text>
  <text x="174" y="188" text-anchor="middle" font-size="10" fill="#4a5a72" filter="url(#rough2)">mask |= 1 &lt;&lt; bit(c)</text>

  <path d="M 174 198 L 174 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="222" width="236" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="174" y="244" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">for c in stones</text>
  <text x="174" y="262" text-anchor="middle" font-size="9.5" fill="#7a6220" filter="url(#rough2)">if (mask &gt;&gt; bit(c)) &amp; 1 → ans++</text>

  <path d="M 292 240 C 328 234 328 266 296 260" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="286" text-anchor="end" font-size="8.5" fill="#b85450" filter="url(#rough2)">循环 |stones| 次</text>

  <path d="M 174 278 L 174 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="300" width="236" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="174" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#33552a" filter="url(#rough2)">return ans</text>
  <text x="174" y="338" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">石头中宝石的个数</text>

  <rect x="340" y="74" width="232" height="272" fill="#f5f7fb" stroke="#9aa7bb" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="456" y="96" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3f4f66" filter="url(#rough2)">内层一步：查一块石头</text>

  <rect x="352" y="106" width="208" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="456" y="126" text-anchor="middle" font-size="10.5" fill="#2f3f5c" filter="url(#rough2)">idx = bit(c)</text>
  <text x="456" y="142" text-anchor="middle" font-size="8.5" fill="#6b7a8f" filter="url(#rough2)">小写 0..25 · 大写 26..51</text>

  <path d="M 456 154 L 456 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="352" y="174" width="208" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="456" y="194" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">(mask &gt;&gt; idx) &amp; 1</text>
  <text x="456" y="210" text-anchor="middle" font-size="8.5" fill="#7a6220" filter="url(#rough2)">移位 + 按位与，不查哈希</text>

  <path d="M 456 220 L 456 232 L 402 232 L 402 236" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 456 220 L 456 232 L 510 232 L 510 236" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="352" y="238" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="402" y="257" text-anchor="middle" font-size="11" font-weight="bold" fill="#33552a" filter="url(#rough2)">= 1</text>
  <text x="402" y="273" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">ans += 1</text>

  <rect x="460" y="238" width="100" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="510" y="257" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">= 0</text>
  <text x="510" y="273" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">跳过</text>

  <text x="456" y="304" text-anchor="middle" font-size="9.5" fill="#5a6a80" filter="url(#rough2)">整张表常驻一个寄存器</text>
  <text x="456" y="324" text-anchor="middle" font-size="9.5" fill="#5a6a80" filter="url(#rough2)">单块石头 O(1)，无任何分配</text>

  <path d="M 60 360 L 560 360" stroke="#ddd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="310" y="382" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">暴力 O(|jewels| × |stones|) 在 50 × 50 下也能过；掩码法把「找类型」压成单条指令，才是可复用的模板</text>
</svg>
