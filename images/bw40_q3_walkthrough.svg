<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">官方示例回放：每次操作后的队列形态</text>
  <text x="340" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">pushFront(1) → pushBack(2) → pushMiddle(3) → pushMiddle(4) → 依次弹出</text>

  <!-- steps -->
  <g font-size="13" fill="#555" filter="url(#r)">
    <text x="70" y="96">① pushFront(1)</text>
    <text x="70" y="156">② pushBack(2)</text>
    <text x="70" y="216">③ pushMiddle(3)</text>
    <text x="70" y="276">④ pushMiddle(4)</text>
  </g>
  <!-- step cells -->
  <g filter="url(#r)">
    <rect x="240" y="76" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="240" y="136" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="296" y="136" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="240" y="196" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="296" y="196" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="240" y="256" width="52" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="296" y="256" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="352" y="256" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="408" y="256" width="52" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="266" y="101" fill="#33517a">1</text>
    <text x="266" y="161" fill="#33517a">1</text>
    <text x="322" y="161" fill="#3a5c2c">2</text>
    <text x="266" y="221" fill="#33517a">1</text>
    <text x="322" y="221" fill="#3a5c2c">3</text>
    <text x="322" y="221" font-size="0"> </text>
    <text x="266" y="281" fill="#33517a">1</text>
    <text x="322" y="281" fill="#3a5c2c">4</text>
    <text x="378" y="281" fill="#3a5c2c">3</text>
    <text x="434" y="281" fill="#3a5c2c">2</text>
  </g>
  <g font-size="12.5" fill="#888" filter="url(#r)">
    <text x="480" y="101">→ [1]</text>
    <text x="480" y="161">→ [1, 2]（3 插在下标 2/2=1 前）</text>
    <text x="480" y="221">→ [1, 3, 2]（4 插在下标 3/2=1 前）</text>
    <text x="480" y="281">→ [1, 4, 3, 2]</text>
  </g>
  <!-- middle highlight in step 3,4 -->
  <circle cx="322" cy="236" r="0" fill="none"/>
  <path d="M 296 250 L 296 244" stroke="none"/>

  <!-- pops -->
  <g filter="url(#r)">
    <rect x="60" y="326" width="560" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="13" fill="#7a5b1e" filter="url(#r)">
    <text x="80" y="350">popFront→1（剩 [4,3,2]）popMiddle→3（剩 [4,2]，偶数取靠前）</text>
    <text x="80" y="372">popMiddle→4（剩 [2]）popBack→2（剩 []）popFront→−1（空队列约定）</text>
  </g>
</svg>
