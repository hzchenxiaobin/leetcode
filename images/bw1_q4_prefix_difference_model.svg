<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">观察一：区间计数 → 前缀作差</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">定义 f(n) = [1, n] 中数字 d 的出现次数，则 [low, high] = [1, high] 减去 [1, low−1]</text>

  <!-- 数轴 -->
  <path d="M 50 130 L 510 130" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <path d="M 90 124 L 90 136" stroke="#666" stroke-width="1.6"/>
    <path d="M 230 124 L 230 136" stroke="#666" stroke-width="1.6"/>
    <path d="M 470 124 L 470 136" stroke="#666" stroke-width="1.6"/>
  </g>
  <text x="90" y="152" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="230" y="152" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">low−1</text>
  <text x="470" y="152" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">high</text>

  <rect x="90" y="116" width="140" height="14" fill="#fce4ec" stroke="none" rx="7" filter="url(#rough2)"/>
  <rect x="230" y="116" width="240" height="14" fill="#e6f4ea" stroke="none" rx="7" filter="url(#rough2)"/>
  <text x="160" y="108" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">被减掉：f(low−1)</text>
  <text x="350" y="108" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">要求的：[low, high] 里的出现次数</text>

  <!-- 公式 -->
  <rect x="80" y="180" width="400" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold">答案 = f(high) − f(low−1)</text>
  <text x="280" y="224" text-anchor="middle" font-size="11" fill="#555">只需实现 f(n)：一次 O(log n) 的按位统计</text>

  <!-- 例：d=1, [1,13] -->
  <rect x="80" y="252" width="400" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">示例 1：d = 1，low = 1，high = 13</text>
  <text x="280" y="294" text-anchor="middle" font-size="10.5" fill="#555">f(13) = 6（1、10、11(两个 1)、12、13）；low−1 = 0，f(0) = 0</text>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">答案 = 6 − 0 = 6 ✓</text>

  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#999">约束 low ≥ 1 保证 low−1 ≥ 0；f 的定义域是 [1, n]，数字 0 本身那一个 0 永远不被计入</text>
</svg>
