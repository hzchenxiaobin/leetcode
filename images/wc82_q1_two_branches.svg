<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">一条流水线：先取核心 core，再补 “ma”，最后补 i 个 “a”</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两条分支只在「怎么得到 core」上不同，后两步完全一样</text>

  <text x="36" y="82" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">① 元音开头：w[0] ∈ {a, e, i, o, u}（大小写都算）</text>

  <rect x="36" y="92" width="112" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="92" y="118" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">apple</text>

  <path d="M 152 112 L 200 112" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="100" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">核心 = 原词</text>

  <rect x="206" y="92" width="112" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="262" y="118" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">apple</text>

  <path d="M 322 112 L 366 112" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="100" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">＋ ma</text>

  <rect x="372" y="92" width="210" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="477" y="118" text-anchor="middle" font-size="15" fill="#8a6a20" filter="url(#rough2)">applema ＋ a…a</text>

  <text x="36" y="152" font-size="10.5" fill="#777" filter="url(#rough2)">第 1 个词：applema ＋ 1 个 a ＝ applemaa</text>

  <text x="36" y="180" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">② 辅音开头：先把首字母搬到末尾，得到 core</text>

  <rect x="36" y="190" width="112" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="92" y="216" text-anchor="middle" font-size="15" fill="#3a4a66" filter="url(#rough2)">Goat</text>

  <path d="M 152 210 L 200 210" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="198" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">左移一位</text>

  <rect x="206" y="190" width="112" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="262" y="216" text-anchor="middle" font-size="15" fill="#3a5a30" filter="url(#rough2)">oatG</text>

  <path d="M 322 210 L 366 210" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="198" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">＋ ma</text>

  <rect x="372" y="190" width="210" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="477" y="216" text-anchor="middle" font-size="15" fill="#8a6a20" filter="url(#rough2)">oatGma ＋ a…a</text>

  <text x="36" y="250" font-size="10.5" fill="#777" filter="url(#rough2)">第 3 个词：oatGma ＋ 3 个 a ＝ oatGmaaaa</text>

  <text x="36" y="282" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">③ 尾部 a 的个数恰好等于词的下标 i（从 1 开始，不是 0）</text>

  <rect x="36" y="292" width="58" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="65" y="315" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">a</text>
  <text x="65" y="342" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">i = 1</text>

  <rect x="110" y="292" width="66" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="143" y="315" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">aa</text>
  <text x="143" y="342" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">i = 2</text>

  <rect x="192" y="292" width="74" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="229" y="315" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">aaa</text>
  <text x="229" y="342" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">i = 3</text>

  <rect x="282" y="292" width="86" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="325" y="315" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">a…a</text>
  <text x="325" y="342" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">i 个</text>

  <text x="392" y="315" font-size="10.5" fill="#777" filter="url(#rough2)">累计追加的 a 总数为 1+2+…+W，量级 O(W²)</text>

  <rect x="36" y="358" width="548" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="52" y="380" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">大小写原样保留：只判首字母是不是元音，绝不改写其余字母</text>
  <text x="52" y="400" font-size="10.5" fill="#555" filter="url(#rough2)">“The” → “heTmaa”（大写的 T 跟着搬走），而不是 “hetmaa”</text>

  <text x="310" y="430" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例 2 的 9 个词就是这条流水线的 9 次执行</text>
</svg>
