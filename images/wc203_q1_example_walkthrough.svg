<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：整圈 + 残弧分解</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="230" y="56" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">示例 1 路径：1 → 2 → 3 → 4 → 1 → 2，总步数 T = 5，n = 4</text>

  <!-- 展开路径格子 -->
  <rect x="120" y="64" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <rect x="160" y="64" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <rect x="200" y="64" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="217" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <rect x="240" y="64" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="257" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <rect x="280" y="64" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="297" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="320" y="64" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="337" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- 括号标注 -->
  <path d="M 120 106 L 120 112 L 274 112 L 274 106" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="197" y="128" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">整圈：全扇区 +1</text>
  <path d="M 280 106 L 280 112 L 354 112 L 354 106" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="320" y="128" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">残弧：1、2 再 +1</text>

  <!-- 计数结果 -->
  <rect x="416" y="58" width="190" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="511" y="80" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">1 → 2 次　2 → 2 次</text>
  <text x="511" y="100" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">3 → 1 次　4 → 1 次</text>
  <text x="511" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">答案 [1, 2]</text>

  <!-- 三示例表格 -->
  <rect x="50" y="152" width="540" height="158" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="50" y="152" width="540" height="30" fill="#e8f0fe" filter="url(#rough2)"/>
  <rect x="416" y="182" width="174" height="128" fill="#e6f4ea" filter="url(#rough2)"/>

  <path d="M 112 152 L 112 310" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 156 152 L 156 310" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 200 152 L 200 310" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 244 152 L 244 310" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 416 152 L 416 310" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 50 182 L 590 182" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 50 224 L 590 224" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 50 266 L 590 266" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="81" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">示例</text>
  <text x="134" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">n</text>
  <text x="178" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">s</text>
  <text x="222" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">e</text>
  <text x="330" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">T 的分解与判定</text>
  <text x="503" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">答案</text>

  <text x="81" y="207" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">示例 1</text>
  <text x="134" y="207" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="178" y="207" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="222" y="207" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="330" y="207" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">T=5：1 圈 + 1 步，s ≤ e</text>
  <text x="503" y="207" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">[1, 2]</text>

  <text x="81" y="249" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">示例 2</text>
  <text x="134" y="249" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="178" y="249" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="222" y="249" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="330" y="249" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">T=8：4 圈 + 0 步，s = e</text>
  <text x="503" y="249" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">[2]</text>

  <text x="81" y="291" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">示例 3</text>
  <text x="134" y="291" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="178" y="291" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="222" y="291" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="330" y="291" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">T=6：0 圈 + 6 步，s &lt; e</text>
  <text x="503" y="291" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">[1, 2, …, 7]</text>

  <!-- 结论 -->
  <rect x="50" y="330" width="540" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="350" text-anchor="middle" font-size="12" fill="#8a6415" filter="url(#rough2)">整圈对所有扇区均匀 +1，不改变「谁最多」</text>
  <text x="320" y="370" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#rough2)">答案 = 从 s 到 e 的顺时针弧（含两端）</text>
</svg>
