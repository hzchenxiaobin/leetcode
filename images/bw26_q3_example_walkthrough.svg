<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    示例 1 走查：root = [3,1,4,3,null,1,5]
  </text>

  <!-- 树 -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.8" fill="none">
    <path d="M 150 78 C 105 100, 80 108, 62 130"/>
    <path d="M 150 78 C 195 100, 220 108, 238 130"/>
    <path d="M 62 158 C 40 178, 30 182, 24 200"/>
    <path d="M 238 158 C 210 182, 200 186, 192 204"/>
    <path d="M 238 158 C 266 182, 276 186, 284 204"/>
  </g>

  <circle cx="150" cy="60" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="150" y="66" text-anchor="middle" font-size="16" fill="#2f5a24" filter="url(#rough2)">3</text>
  <circle cx="62" cy="142" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="62" y="148" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">1</text>
  <circle cx="24" cy="216" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="24" y="222" text-anchor="middle" font-size="16" fill="#2f5a24" filter="url(#rough2)">3</text>
  <circle cx="238" cy="142" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="148" text-anchor="middle" font-size="16" fill="#2f5a24" filter="url(#rough2)">4</text>
  <circle cx="192" cy="220" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="192" y="226" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">1</text>
  <circle cx="284" cy="220" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="284" y="226" text-anchor="middle" font-size="16" fill="#2f5a24" filter="url(#rough2)">5</text>

  <!-- 路径标注 -->
  <g filter="url(#rough2)" font-size="11" fill="#666">
    <text x="176" y="52">路径 (3)，max=3 ✓</text>
    <text x="92" y="128">路径 (3,1)，max=3 ✗</text>
    <text x="40" y="262">路径 (3,1,3)，</text>
    <text x="40" y="276">max=3，3≥3 ✓</text>
    <text x="262" y="128">路径 (3,4)，max=3，</text>
    <text x="262" y="142">4≥3 ✓</text>
    <text x="152" y="252">路径 (3,4,1)，max=4 ✗</text>
    <text x="316" y="252">路径 (3,4,5)，</text>
    <text x="316" y="266">max=4，5≥4 ✓</text>
  </g>

  <!-- 汇总表 -->
  <g filter="url(#rough2)" font-size="13" fill="#666">
    <rect x="350" y="60" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="425" y="78" text-anchor="middle">判定汇总</text>
  </g>
  <g filter="url(#rough2)" font-size="13">
    <rect x="350" y="88" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="425" y="105" text-anchor="middle" fill="#2f5a24">根 3 ✓</text>
    <rect x="350" y="114" width="150" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="425" y="131" text-anchor="middle" fill="#b85450">1 &lt; 3 ✗</text>
    <rect x="350" y="140" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="425" y="157" text-anchor="middle" fill="#2f5a24">叶 3 ≥ 3 ✓</text>
    <rect x="350" y="166" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="425" y="183" text-anchor="middle" fill="#2f5a24">4 ≥ 3 ✓</text>
    <rect x="350" y="192" width="150" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <text x="425" y="209" text-anchor="middle" fill="#b85450">1 &lt; 4 ✗</text>
    <rect x="350" y="218" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="425" y="235" text-anchor="middle" fill="#2f5a24">5 ≥ 4 ✓</text>
  </g>

  <!-- 结论 -->
  <rect x="110" y="306" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"
        filter="url(#rough2)"/>
  <text x="260" y="331" text-anchor="middle" font-size="15" fill="#2f5a24" filter="url(#rough2)">
    好节点 = {根3, 叶3, 4, 5}，共 4 个 ✓
  </text>

  <text x="260" y="366" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">
    注意两个 3 都是好节点：判定用 ≥，等于路径最大值也算好
  </text>
</svg>
