<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="560" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：nums = [4,2,5,1]，k = 3 —— 弹一个、补一个</text>

  <!-- nums 行 -->
  <text x="64" y="65" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">nums</text>
  <rect x="90" y="44" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="164" y="44" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="66" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="238" y="44" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <rect x="312" y="44" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="334" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="112" y="90" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="186" y="90" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="260" y="90" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="334" y="90" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="380" y="56" font-size="10.5" fill="#888" filter="url(#rough2)">值 = max − min；</text>
  <text x="380" y="72" font-size="10.5" fill="#888" filter="url(#rough2)">圈住 5 和 1 的子数组值都是 4</text>

  <!-- 初始堆 -->
  <text x="60" y="121" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">初始堆</text>
  <text x="240" y="121" font-size="10.5" fill="#888" filter="url(#rough2)">各列队首 f(l, n−1)：</text>
  <rect x="330" y="100" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(4,0,3)</text>
  <rect x="408" y="100" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="441" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(4,1,3)</text>
  <rect x="486" y="100" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="519" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(4,2,3)</text>
  <rect x="564" y="100" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="597" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,3,3)</text>

  <!-- 第 1 弹 -->
  <text x="60" y="173" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">第 1 弹</text>
  <rect x="110" y="152" width="104" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="162" y="173" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">弹出(4,0,3)</text>
  <path d="M216,169 L236,169" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="152" width="76" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="278" y="173" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">ans=4</text>
  <rect x="330" y="152" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(4,1,3)</text>
  <rect x="408" y="152" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="441" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(4,2,3)</text>
  <rect x="486" y="152" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="519" y="173" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,3,3)</text>
  <rect x="564" y="152" width="66" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="597" y="173" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(3,0,2)</text>
  <text x="597" y="147" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">压入</text>
  <path d="M162,190 C 260,206 480,206 588,192" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="375" y="204" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">同列后继 f(0,2) = 3</text>

  <!-- 第 2 弹 -->
  <text x="60" y="253" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">第 2 弹</text>
  <rect x="110" y="232" width="104" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="162" y="253" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">弹出(4,1,3)</text>
  <path d="M216,249 L236,249" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="232" width="76" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="278" y="253" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">ans=8</text>
  <rect x="330" y="232" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(4,2,3)</text>
  <rect x="408" y="232" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="441" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(3,0,2)</text>
  <rect x="486" y="232" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="519" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,3,3)</text>
  <rect x="564" y="232" width="66" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="597" y="253" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(3,1,2)</text>
  <text x="597" y="227" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">压入</text>
  <path d="M162,270 C 260,286 480,286 588,272" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="375" y="284" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">同列后继 f(1,2) = 3</text>

  <!-- 第 3 弹 -->
  <text x="60" y="333" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">第 3 弹</text>
  <rect x="110" y="312" width="104" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="162" y="333" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">弹出(4,2,3)</text>
  <path d="M216,329 L236,329" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="312" width="76" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="278" y="333" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">ans=12</text>
  <rect x="330" y="312" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="333" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(3,0,2)</text>
  <rect x="408" y="312" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="441" y="333" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(3,1,2)</text>
  <rect x="486" y="312" width="66" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="519" y="333" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,3,3)</text>
  <rect x="564" y="312" width="66" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="597" y="333" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(0,2,2)</text>
  <text x="597" y="307" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">压入</text>
  <path d="M162,350 C 260,366 480,366 588,352" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="375" y="364" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">同列后继 f(2,2) = 0</text>

  <!-- 结果框 -->
  <rect x="140" y="386" width="360" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">k = 3 次弹满 → 返回 12</text>
  <text x="320" y="422" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">弹出的三个值 4 + 4 + 4 = 12</text>

  <!-- 注释框 -->
  <rect x="70" y="446" width="500" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="466" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">三次弹出的子数组 [0..3]、[1..3]、[2..3] 都同时圈住 5 与 1，</text>
  <text x="320" y="484" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">与官方解释的选法一致；若 k 更大，堆会自动取出 (3,·,2) 等次优条目</text>

  <!-- 图例 -->
  <rect x="120" y="522" width="12" height="12" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="138" y="532" font-size="11" fill="#666" filter="url(#rough2)">弹出堆顶</text>
  <rect x="240" y="522" width="12" height="12" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="258" y="532" font-size="11" fill="#666" filter="url(#rough2)">堆中条目 (v, l, r)</text>
  <rect x="410" y="522" width="12" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="428" y="532" font-size="11" fill="#666" filter="url(#rough2)">新压入的同列后继</text>
</svg>
