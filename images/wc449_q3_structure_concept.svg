<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察：连通 + 度 ≤ 2 ⟹ 只能是路径或环</text>
  <path d="M 120 40 Q 280 48 440 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- 握手定理框 -->
  <g filter="url(#rough2)"><rect x="70" y="58" width="420" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="78" text-anchor="middle" font-size="13" fill="#3a5a7a">握手定理：2m = Σdeg ≤ 2n ⟹ m ≤ n</text>
  <text x="280" y="98" text-anchor="middle" font-size="13" fill="#3a5a7a">连通：m ≥ n − 1　⟹　m ∈ { n−1, n }</text>

  <!-- 左：路径 -->
  <text x="145" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a5a7a">m = n − 1：路径</text>
  <g filter="url(#rough2)">
    <line x1="76" y1="195" x2="224" y2="195" stroke="#4a7a3a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g filter="url(#rough2)"><circle cx="60" cy="195" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <g filter="url(#rough2)"><circle cx="115" cy="195" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#rough2)"><circle cx="170" cy="195" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#rough2)"><circle cx="225" cy="195" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="60" y="234" text-anchor="middle" font-size="12" fill="#a03a36" font-weight="bold">度 1</text>
  <text x="142" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a">度 2</text>
  <text x="225" y="234" text-anchor="middle" font-size="12" fill="#a03a36" font-weight="bold">度 1</text>
  <text x="145" y="262" text-anchor="middle" font-size="12" fill="#555">恰有两个度 1 端点，其余度 2</text>

  <!-- 右：环 -->
  <text x="420" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#3a5a7a">m = n：环</text>
  <g filter="url(#rough2)">
    <polygon points="420,165 472.3,203 452.3,264.5 387.7,264.5 367.7,203"
             fill="none" stroke="#446688" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g filter="url(#rough2)"><circle cx="420" cy="165" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <g filter="url(#rough2)"><circle cx="472.3" cy="203" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <g filter="url(#rough2)"><circle cx="452.3" cy="264.5" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <g filter="url(#rough2)"><circle cx="387.7" cy="264.5" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <g filter="url(#rough2)"><circle cx="367.7" cy="203" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="420" y="296" text-anchor="middle" font-size="12" fill="#555">所有点度数 = 2</text>

  <!-- 底部：坍缩结论 -->
  <g filter="url(#rough2)"><rect x="70" y="316" width="420" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="280" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e2e">沿链遍历 → 一列节点 → 得分 = 相邻值乘积之和</text>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#2e5e2e">（环再额外多一条首尾乘积）</text>
</svg>
