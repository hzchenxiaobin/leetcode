<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="450" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次预处理 + 每个单词一次线性扫描</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">判定只依赖「首字母所在行」这一个基准</text>

  <rect x="150" y="58" width="320" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="79" text-anchor="middle" font-size="11.5" fill="#2f4f6f" font-weight="bold" filter="url(#rough2)">① 预处理 rowOf[26]：字母 → 行号</text>
  <text x="310" y="97" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">三行串各扫一遍，共 26 次赋值，与输入无关</text>

  <path d="M 310 106 L 310 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="130" width="320" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="157" text-anchor="middle" font-size="11.5" fill="#2f4f6f" filter="url(#rough2)">② 依次取出每个单词 w（原样保留大小写）</text>

  <path d="M 310 174 L 310 196" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="198" width="320" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="225" text-anchor="middle" font-size="11.5" fill="#2f4f6f" filter="url(#rough2)">③ r = rowOf[ lower(w[0]) ]　取基准行</text>

  <path d="M 310 242 L 310 260" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="310,262 482,308 310,354 138,308" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="302" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">④ 其余字符都满足</text>
  <text x="310" y="322" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">rowOf[ch] == r ?</text>

  <path d="M 138 308 L 138 342 L 190 342 L 190 362" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="336" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 482 308 L 482 342 L 430 342 L 430 362" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="336" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="90" y="364" width="200" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="385" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">⑤ 追加到 ans</text>
  <text x="190" y="403" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">按输入顺序，不去重不排序</text>

  <rect x="330" y="364" width="200" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="385" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">✗ 丢弃该单词</text>
  <text x="430" y="403" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">一旦出现跨行字符立即 break</text>

  <text x="310" y="436" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">⑥ 所有单词处理完 → 返回 ans（可能为空数组）</text>
</svg>
