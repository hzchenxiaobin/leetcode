<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 412" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="8"/><feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#446688"/></marker>
  </defs>
  <rect width="660" height="412" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#r)">示例演算：nums = [10, 20, 30]（示例 2）</text>
  <text x="330" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">行 = g₁（seq1 的 GCD），列 = g₂（seq2 的 GCD）；橙色对角线 = 答案区，只标非零状态</text>

  <!-- grid 1: after x=10 -->
  <text x="120" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#34507a" filter="url(#r)">处理 x=10 后：3 个状态</text>
  <g filter="url(#r)" font-size="9.5">
    <text x="75" y="124" text-anchor="middle" fill="#888">0</text><text x="105" y="124" text-anchor="middle" fill="#888">10</text><text x="135" y="124" text-anchor="middle" fill="#888">20</text><text x="165" y="124" text-anchor="middle" fill="#888">30</text>
    <text x="56" y="150" text-anchor="end" fill="#888">0</text><text x="56" y="180" text-anchor="end" fill="#888">10</text><text x="56" y="210" text-anchor="end" fill="#888">20</text><text x="56" y="240" text-anchor="end" fill="#888">30</text>
    <rect x="60" y="130" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="75" y="150" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="90" y="130" width="30" height="30" fill="#fff" stroke="#ccc"/><rect x="120" y="130" width="30" height="30" fill="#fff" stroke="#ccc"/><rect x="150" y="130" width="30" height="30" fill="#fff" stroke="#ccc"/>
    <rect x="60" y="160" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="75" y="180" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="90" y="160" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/><rect x="120" y="160" width="30" height="30" fill="#fff" stroke="#ccc"/><rect x="150" y="160" width="30" height="30" fill="#fff" stroke="#ccc"/>
    <rect x="60" y="190" width="30" height="30" fill="#fff" stroke="#ccc"/><rect x="90" y="190" width="30" height="30" fill="#fff" stroke="#ccc"/><rect x="120" y="190" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/><rect x="150" y="190" width="30" height="30" fill="#fff" stroke="#ccc"/>
    <rect x="60" y="220" width="30" height="30" fill="#fff" stroke="#ccc"/><rect x="90" y="220" width="30" height="30" fill="#fff" stroke="#ccc"/><rect x="120" y="220" width="30" height="30" fill="#fff" stroke="#ccc"/><rect x="150" y="220" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>

  <path d="M 190 190 L 240 190" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <text x="215" y="178" text-anchor="middle" font-size="10" fill="#446688" filter="url(#r)">装入 x=20</text>

  <!-- grid 2: after x=20 -->
  <text x="330" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#34507a" filter="url(#r)">处理 x=20 后：7 个状态</text>
  <g filter="url(#r)" font-size="9.5">
    <text x="285" y="124" text-anchor="middle" fill="#888">0</text><text x="315" y="124" text-anchor="middle" fill="#888">10</text><text x="345" y="124" text-anchor="middle" fill="#888">20</text><text x="375" y="124" text-anchor="middle" fill="#888">30</text>
    <text x="266" y="150" text-anchor="end" fill="#888">0</text><text x="266" y="180" text-anchor="end" fill="#888">10</text><text x="266" y="210" text-anchor="end" fill="#888">20</text><text x="266" y="240" text-anchor="end" fill="#888">30</text>
    <rect x="270" y="130" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="285" y="150" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="300" y="130" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="315" y="150" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="330" y="130" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="345" y="150" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="360" y="130" width="30" height="30" fill="#fff" stroke="#ccc"/>
    <rect x="270" y="160" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="285" y="180" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="300" y="160" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="330" y="160" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="345" y="180" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="360" y="160" width="30" height="30" fill="#fff" stroke="#ccc"/>
    <rect x="270" y="190" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="285" y="210" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="300" y="190" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="315" y="210" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="330" y="190" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="360" y="190" width="30" height="30" fill="#fff" stroke="#ccc"/>
    <rect x="270" y="220" width="30" height="30" fill="#fff" stroke="#ccc"/><rect x="300" y="220" width="30" height="30" fill="#fff" stroke="#ccc"/><rect x="330" y="220" width="30" height="30" fill="#fff" stroke="#ccc"/><rect x="360" y="220" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>

  <path d="M 400 190 L 450 190" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ab)" filter="url(#r)"/>
  <text x="425" y="178" text-anchor="middle" font-size="10" fill="#446688" filter="url(#r)">装入 x=30</text>

  <!-- grid 3: after x=30 -->
  <text x="540" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#34507a" filter="url(#r)">处理 x=30 后：14 个状态</text>
  <g filter="url(#r)" font-size="9.5">
    <text x="495" y="124" text-anchor="middle" fill="#888">0</text><text x="525" y="124" text-anchor="middle" fill="#888">10</text><text x="555" y="124" text-anchor="middle" fill="#888">20</text><text x="585" y="124" text-anchor="middle" fill="#888">30</text>
    <text x="476" y="150" text-anchor="end" fill="#888">0</text><text x="476" y="180" text-anchor="end" fill="#888">10</text><text x="476" y="210" text-anchor="end" fill="#888">20</text><text x="476" y="240" text-anchor="end" fill="#888">30</text>
    <rect x="480" y="130" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="495" y="150" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="510" y="130" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="525" y="150" text-anchor="middle" font-size="11" fill="#333">5</text>
    <rect x="540" y="130" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="555" y="150" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="570" y="130" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="585" y="150" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="480" y="160" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="495" y="180" text-anchor="middle" font-size="11" fill="#333">5</text>
    <rect x="510" y="160" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/><text x="525" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">2★</text>
    <rect x="540" y="160" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="555" y="180" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="570" y="160" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="585" y="180" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="480" y="190" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="495" y="210" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="510" y="190" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="525" y="210" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="540" y="190" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="570" y="190" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="585" y="210" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="480" y="220" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="495" y="240" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="510" y="220" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="525" y="240" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="540" y="220" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/><text x="555" y="240" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="570" y="220" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>

  <!-- key step box -->
  <rect x="30" y="266" width="600" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#r)"/>
  <text x="330" y="290" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a07520" filter="url(#r)">关键一步：装入 x=30 时，(10,20) → (gcd(10,30), gcd(20,30)) = (10,10) ★，(20,10) 同样裂变出 (10,10) ★</text>
  <text x="330" y="312" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#r)">两个方案 = 「seq1 取 {10,20}、seq2 取 {30}」及其镜像分法 ⇒ ans = dp[10][10] = 2 ✓</text>

  <!-- sparsity box -->
  <rect x="30" y="346" width="600" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#r)"/>
  <text x="330" y="366" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#r)">状态数 1 → 3 → 7 → 14 ≪ (V+1)² = 961：DP 表高度稀疏，</text>
  <text x="330" y="384" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#r)">跳过零状态既是剪枝，也是 Python 提速的免费午餐</text>
</svg>
