<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="131" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：同步双指针塌缩为单索引 k</text>
  <path d="M 180 42 Q 320 50 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 上框：双指针写法（冗余） -->
  <g filter="url(#sk)">
    <rect x="50" y="58" width="540" height="118" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="320" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#a04348">双指针写法：i、j 每轮各 +1 —— 两个指针永远同步</text>

  <!-- word1 格子 -->
  <g filter="url(#sk)" font-size="14">
    <rect x="150" y="96" width="42" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
    <rect x="192" y="96" width="42" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
    <rect x="234" y="96" width="42" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
    <text x="171" y="118" text-anchor="middle" fill="#333">a</text>
    <text x="213" y="118" text-anchor="middle" fill="#333">b</text>
    <text x="255" y="118" text-anchor="middle" fill="#333">c</text>
  </g>
  <text x="140" y="118" text-anchor="end" font-size="13" fill="#7a5415" font-weight="bold">word1</text>

  <!-- word2 格子 -->
  <g filter="url(#sk)" font-size="14">
    <rect x="360" y="96" width="42" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
    <rect x="402" y="96" width="42" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
    <rect x="444" y="96" width="42" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/>
    <text x="381" y="118" text-anchor="middle" fill="#333">p</text>
    <text x="423" y="118" text-anchor="middle" fill="#333">q</text>
    <text x="465" y="118" text-anchor="middle" fill="#333">r</text>
  </g>
  <text x="350" y="118" text-anchor="end" font-size="13" fill="#7a5415" font-weight="bold">word2</text>

  <!-- i, j 指针 -->
  <path d="M 171 162 L 171 138" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="171" y="176" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">i</text>
  <path d="M 381 162 L 381 138" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="381" y="176" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">j</text>
  <text x="530" y="146" text-anchor="middle" font-size="12" fill="#a04348">i = j 恒成立</text>
  <text x="530" y="163" text-anchor="middle" font-size="12" fill="#a04348">维护两个是冗余</text>

  <!-- 塌缩箭头 -->
  <path d="M 290 180 L 290 212" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="302" y="202" font-size="13" fill="#3a3a3a" font-weight="bold">只留一个 k：i = j = k</text>

  <!-- 下框：单索引写法 -->
  <g filter="url(#sk)">
    <rect x="50" y="218" width="540" height="122" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="320" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">单索引写法：k = 0 … max(n1, n2) − 1，每轮两次条件追加</text>
  <g font-family="monospace" font-size="13" fill="#2b4b2b" filter="url(#sk)">
    <text x="320" y="270" text-anchor="middle">if k &lt; n1:  res += word1[k]</text>
    <text x="320" y="294" text-anchor="middle">if k &lt; n2:  res += word2[k]</text>
  </g>
  <text x="320" y="324" text-anchor="middle" font-size="12" fill="#4a7a3a">用下标判界守卫代替独立的尾段处理，两阶段并入同一循环</text>

  <!-- 底部橙条 -->
  <g filter="url(#sk)">
    <rect x="50" y="354" width="540" height="34" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="375" text-anchor="middle" font-size="12" fill="#7a5415">交叠段（k &lt; min(n1, n2)）两 if 都触发，每轮 +2 字符；剩余段只触发一个，+1 字符 —— 无需特判尾段</text>
</svg>
