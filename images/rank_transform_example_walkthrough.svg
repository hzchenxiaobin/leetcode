<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect width="940" height="700" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 3 演算：逐值定秩，下界来自行/列的「历史」</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== left: input / answer grids ===== -->
  <text x="60" y="82" font-size="12.5" font-weight="bold" fill="#2b6e9e">输入 matrix</text>

  <g filter="url(#sk)"><rect x="60" y="92" width="76" height="52" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="136" y="92" width="76" height="52" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="212" y="92" width="76" height="52" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="60" y="144" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="136" y="144" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="212" y="144" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="60" y="196" width="76" height="52" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="136" y="196" width="76" height="52" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="212" y="196" width="76" height="52" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="60" y="248" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="136" y="248" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="212" y="248" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>

  <text x="98" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">20</text>
  <text x="174" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">−21</text>
  <text x="250" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">14</text>
  <text x="98" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">−19</text>
  <text x="174" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">4</text>
  <text x="250" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">19</text>
  <text x="98" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">22</text>
  <text x="174" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">−47</text>
  <text x="250" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">24</text>
  <text x="98" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">−19</text>
  <text x="174" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">4</text>
  <text x="250" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">19</text>

  <path d="M 174,306 L 174,338" fill="none" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#arK)" filter="url(#sk)"/>
  <text x="190" y="326" font-size="11" font-weight="bold" fill="#444">按值升序逐组赋秩</text>

  <text x="60" y="372" font-size="12.5" font-weight="bold" fill="#2b6e9e">输出 answer</text>

  <g filter="url(#sk)"><rect x="60" y="382" width="76" height="52" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="136" y="382" width="76" height="52" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="212" y="382" width="76" height="52" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="60" y="434" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="136" y="434" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="212" y="434" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="60" y="486" width="76" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <g filter="url(#sk)"><rect x="136" y="486" width="76" height="52" rx="4" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="212" y="486" width="76" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <g filter="url(#sk)"><rect x="60" y="538" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="136" y="538" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="212" y="538" width="76" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>

  <text x="98" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">4</text>
  <text x="174" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
  <text x="250" y="414" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3</text>
  <text x="98" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  <text x="174" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3</text>
  <text x="250" y="466" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">4</text>
  <text x="98" y="518" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">5</text>
  <text x="174" y="518" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  <text x="250" y="518" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">6</text>
  <text x="98" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  <text x="174" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3</text>
  <text x="250" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">4</text>

  <text x="40" y="618" font-size="11" fill="#444">校验：每行每列的秩与值的相对大小完全一致；</text>
  <text x="40" y="636" font-size="11" fill="#444">每格的秩都恰好是「下界 + 1」，无一浪费。</text>
  <rect x="40" y="656" width="10" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="56" y="666" font-size="10.5" fill="#444">同列等值 → 同分量同秩</text>
  <rect x="210" y="656" width="10" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="226" y="666" font-size="10.5" fill="#444">行传导出的最大秩 5 与 6</text>

  <!-- ===== right: group table ===== -->
  <g filter="url(#sk)"><rect x="330" y="78" width="540" height="446" rx="6" fill="#fcfbf8" stroke="#b8b3a8" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="330" y="78" width="540" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="363" y="99" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">值 v</text>
  <text x="476" y="99" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">格子</text>
  <text x="691" y="99" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">分量与下界来源</text>
  <text x="848" y="99" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">秩</text>

  <g filter="url(#sk)"><rect x="331" y="156" width="538" height="46" fill="#fff8e1"/></g>
  <g filter="url(#sk)"><rect x="331" y="248" width="538" height="46" fill="#fff8e1"/></g>
  <g filter="url(#sk)"><rect x="331" y="340" width="538" height="46" fill="#fff8e1"/></g>
  <g filter="url(#sk)"><rect x="331" y="432" width="538" height="46" fill="#fff8e1"/></g>

  <g filter="url(#sk)"><path d="M 396,110 L 396,523" stroke="#c8c3b8" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 556,110 L 556,523" stroke="#c8c3b8" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 826,110 L 826,523" stroke="#c8c3b8" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 331,156 L 869,156" stroke="#c8c3b8" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 331,202 L 869,202" stroke="#c8c3b8" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 331,248 L 869,248" stroke="#c8c3b8" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 331,294 L 869,294" stroke="#c8c3b8" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 331,340 L 869,340" stroke="#c8c3b8" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 331,386 L 869,386" stroke="#c8c3b8" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 331,432 L 869,432" stroke="#c8c3b8" stroke-width="1"/></g>
  <g filter="url(#sk)"><path d="M 331,478 L 869,478" stroke="#c8c3b8" stroke-width="1"/></g>

  <text x="363" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">−47</text>
  <text x="476" y="138" text-anchor="middle" font-size="11.5" fill="#333">(2,1)</text>
  <text x="566" y="138" font-size="11" fill="#444">最小值，无历史下界</text>
  <text x="848" y="138" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">1</text>

  <text x="363" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">−21</text>
  <text x="476" y="184" text-anchor="middle" font-size="11.5" fill="#333">(0,1)</text>
  <text x="566" y="184" font-size="11" fill="#444">列 1 已有秩 1（−47）</text>
  <text x="848" y="184" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">2</text>

  <text x="363" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">−19</text>
  <text x="476" y="230" text-anchor="middle" font-size="11.5" fill="#333">(1,0) (3,0)</text>
  <text x="566" y="230" font-size="11" fill="#444">同列 0 绑成一分量；无历史</text>
  <text x="848" y="230" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">1</text>

  <text x="363" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">4</text>
  <text x="476" y="276" text-anchor="middle" font-size="11.5" fill="#333">(1,1) (3,1)</text>
  <text x="566" y="276" font-size="11" fill="#444">同列 1 绑定；列 1 已有秩 2（−21）</text>
  <text x="848" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">3</text>

  <text x="363" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">14</text>
  <text x="476" y="322" text-anchor="middle" font-size="11.5" fill="#333">(0,2)</text>
  <text x="566" y="322" font-size="11" fill="#444">行 0 已有秩 2（−21）</text>
  <text x="848" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">3</text>

  <text x="363" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">19</text>
  <text x="476" y="368" text-anchor="middle" font-size="11.5" fill="#333">(1,2) (3,2)</text>
  <text x="566" y="368" font-size="11" fill="#444">同列 2 绑定；行/列已有秩 3（4 与 14）</text>
  <text x="848" y="368" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">4</text>

  <text x="363" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">20</text>
  <text x="476" y="414" text-anchor="middle" font-size="11.5" fill="#333">(0,0)</text>
  <text x="566" y="414" font-size="11" fill="#444">行 0 已有秩 3（14）</text>
  <text x="848" y="414" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">4</text>

  <text x="363" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">22</text>
  <text x="476" y="460" text-anchor="middle" font-size="11.5" fill="#333">(2,0)</text>
  <text x="566" y="460" font-size="11" fill="#444">列 0 已有秩 4（20）</text>
  <text x="848" y="460" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">5</text>

  <text x="363" y="506" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">24</text>
  <text x="476" y="506" text-anchor="middle" font-size="11.5" fill="#333">(2,2)</text>
  <text x="566" y="506" font-size="11" fill="#444">行 2 已有秩 5（22）</text>
  <text x="848" y="506" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450">6</text>

  <!-- ===== bottom notes ===== -->
  <text x="330" y="556" font-size="11" fill="#444">「下界」= 分量触达的所有行/列的 rowMax / colMax 之最大值，秩 = 下界 + 1。</text>
  <text x="330" y="576" font-size="11" fill="#444">−21 的下界来自列（−47）；19 的下界是行、列取 max（4 与 14 分别把行、列抬到 3）；</text>
  <text x="330" y="596" font-size="11" fill="#444">24 的秩 6 由 22 经同行传导。</text>
  <text x="330" y="622" font-size="11" font-weight="bold" fill="#7a2828">−19（秩 1）与 14（秩 3）不同行不同列、互不约束——</text>
  <text x="330" y="640" font-size="11" font-weight="bold" fill="#7a2828">同行/同列的历史才决定下界，这正是「排名」的局部性。</text>
</svg>
