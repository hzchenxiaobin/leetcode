<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="500" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">一个坏值只有两种修法 ⇒ 候选交换是 O(1) 个</text>

  <text x="44" y="56" font-size="14" fill="#446688" filter="url(#rough2)">① 空隙只有 1 格：把外侧端点往内推</text>
  <rect x="76" y="76" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94" y="99" text-anchor="middle" font-size="16" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="116" y="76" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="99" text-anchor="middle" font-size="16" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="156" y="76" width="36" height="34" rx="4" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="174" y="99" text-anchor="middle" font-size="16" fill="#3c6130" filter="url(#rough2)">2</text>
  <rect x="196" y="76" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="214" y="99" text-anchor="middle" font-size="16" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="236" y="76" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="254" y="99" text-anchor="middle" font-size="16" fill="#33506b" filter="url(#rough2)">1</text>

  <path d="M94,114 C94,146 156,146 156,118" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="330" y="130" font-size="13" fill="#8f3b38" filter="url(#rough2)">out = l1，in = 唯一的空隙位置</text>
  <text x="330" y="152" font-size="12" fill="#666" filter="url(#rough2)">移动后 1 恰好连成一段</text>
  <text x="76" y="180" font-size="13" fill="#333" filter="url(#rough2)">结果：2 1 1 1 1 ✓（1 只占一段）</text>

  <text x="44" y="216" font-size="14" fill="#446688" filter="url(#rough2)">② 首块是单点：整块搬到另一块旁边</text>
  <rect x="76" y="236" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="94" y="259" text-anchor="middle" font-size="16" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="116" y="236" width="36" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="259" text-anchor="middle" font-size="16" fill="#3c6130" filter="url(#rough2)">2</text>
  <rect x="156" y="236" width="36" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="174" y="259" text-anchor="middle" font-size="16" fill="#3c6130" filter="url(#rough2)">2</text>
  <rect x="196" y="236" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="214" y="259" text-anchor="middle" font-size="16" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="236" y="236" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="254" y="259" text-anchor="middle" font-size="16" fill="#33506b" filter="url(#rough2)">1</text>

  <path d="M94,274 C94,306 156,306 156,278" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="330" y="290" font-size="13" fill="#8f3b38" filter="url(#rough2)">in = l2 − 1（或 r2 + 1，贴着另一块）</text>
  <text x="330" y="312" font-size="12" fill="#666" filter="url(#rough2)">单点块整段挪走后，空隙多大都行</text>
  <text x="76" y="340" font-size="13" fill="#333" filter="url(#rough2)">结果：2 2 1 1 1 ✓</text>

  <rect x="40" y="360" width="620" height="126" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="386" font-size="13" fill="#2f5228" filter="url(#rough2)">每个坏值只生成 ≤ 4 个候选 (out, in)：</text>
  <text x="60" y="410" font-size="12" fill="#444" filter="url(#rough2)">r = 2、空隙 = 1：非单点块 → (l1, r1+1) 或 (r2, l2−1)</text>
  <text x="60" y="434" font-size="12" fill="#444" filter="url(#rough2)">r = 2、首/尾块单点 → (l1, l2−1) / (l1, r2+1) / (l2, r1+1) / (l2, l1−1)</text>
  <text x="60" y="458" font-size="12" fill="#444" filter="url(#rough2)">r = 3：只能搬走极端单点块，且另两块空隙恰为 1；r ≥ 4 一定无解</text>
  <text x="60" y="478" font-size="12" fill="#8f3b38" filter="url(#rough2)">两个坏值 u、v：要求 u 的 (out, in) 与 v 的 (in, out) 互相配对</text>
</svg>
