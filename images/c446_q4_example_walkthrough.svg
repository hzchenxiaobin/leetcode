<svg xmlns="http://www.w3.org/2000/svg" width="700" height="540" viewBox="0 0 700 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="700" height="540" fill="#fdfcf7"/>
  <text x="350" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1, 2, 2, 3, 5]，k = 3 时的线段树</text>
  <path d="M 170 35 Q 350 42 530 35" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 边 -->
  <g stroke="#b0b0b0" stroke-width="1.3" fill="none" filter="url(#sk)">
    <path d="M126,280 L91,318"/>
    <path d="M126,280 L196,400"/>
    <path d="M91,362 L56,400"/>
    <path d="M91,362 L126,400"/>
    <path d="M301,362 L266,400"/>
    <path d="M301,362 L336,400"/>
  </g>
  <path d="M214,198 L126,236" stroke="#b0b0b0" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M214,198 L301,318" stroke="#4a8edb" stroke-width="2.5" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>

  <!-- 根 -->
  <text x="214" y="148" text-anchor="middle" font-size="9.5" fill="#888">[0, 4] 根</text>
  <g filter="url(#sk)">
    <rect x="168" y="154" width="92" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <text x="214" y="174" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a1a">p = 0</text>
  <text x="214" y="192" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6a1a">c = [2, 2, 1]</text>

  <!-- [0,2] -->
  <text x="126" y="230" text-anchor="middle" font-size="9.5" fill="#888">[0, 2]</text>
  <g filter="url(#sk)">
    <rect x="82" y="236" width="88" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="126" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">p = 1</text>
  <text x="126" y="274" text-anchor="middle" font-size="9.5" fill="#2e6e2e">c = [0, 2, 1]</text>

  <!-- [0,1] -->
  <text x="91" y="312" text-anchor="middle" font-size="9.5" fill="#888">[0, 1]</text>
  <g filter="url(#sk)">
    <rect x="47" y="318" width="88" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="91" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">p = 2</text>
  <text x="91" y="356" text-anchor="middle" font-size="9.5" fill="#2e6e2e">c = [0, 1, 1]</text>

  <!-- [3,4] -->
  <text x="301" y="312" text-anchor="middle" font-size="9.5" fill="#888">[3, 4]</text>
  <g filter="url(#sk)">
    <rect x="257" y="318" width="88" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="3"/>
  </g>
  <text x="301" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a8edb">p = 0</text>
  <text x="301" y="356" text-anchor="middle" font-size="9.5" fill="#4a8edb">c = [2, 0, 0]</text>

  <!-- 叶子 -->
  <g filter="url(#sk)">
    <rect x="26" y="400" width="60" height="52" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="96" y="400" width="60" height="52" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="166" y="400" width="60" height="52" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="236" y="400" width="60" height="52" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="306" y="400" width="60" height="52" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b2b2b">
    <text x="56" y="418">v=1</text><text x="126" y="418">v=2</text><text x="196" y="418">v=2</text>
    <text x="266" y="418">v=3</text><text x="336" y="418">v=5</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#444">
    <text x="56" y="435">p=1</text><text x="126" y="435">p=2</text><text x="196" y="435">p=2</text>
    <text x="266" y="435">p=0</text><text x="336" y="435">p=2</text>
  </g>
  <g text-anchor="middle" font-size="9.5" fill="#4a8edb">
    <text x="56" y="450">c=[0,1,0]</text><text x="126" y="450">c=[0,0,1]</text><text x="196" y="450">c=[0,0,1]</text>
    <text x="266" y="450">c=[1,0,0]</text><text x="336" y="450">c=[0,0,1]</text>
  </g>
  <g text-anchor="middle" font-size="9" fill="#888">
    <text x="56" y="472">0</text><text x="126" y="472">1</text><text x="196" y="472">2</text>
    <text x="266" y="472">3</text><text x="336" y="472">4</text>
  </g>

  <text x="196" y="494" text-anchor="middle" font-size="10.5" fill="#4a8edb">查询 1 路线：s=3 &gt; m=2 右拐，[3,4] 整段拿下（s ≤ l）</text>
  <text x="196" y="511" text-anchor="middle" font-size="10.5" fill="#8a6a1a">查询 2：s=0 ≤ l=0，根整段拿下</text>

  <!-- 面板 A：查询 1 -->
  <g filter="url(#sk)">
    <rect x="430" y="64" width="260" height="120" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="560" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">查询 1：s=3, x=0 → 答案 2</text>
  <g text-anchor="middle" font-size="10.5" fill="#333">
    <text x="560" y="108">① s=3 &gt; m=2 → 进右子树 [3,4]</text>
    <text x="560" y="126">② s ≤ l=3 → 整段拿下</text>
    <text x="560" y="144">③ res = c = [2, 0, 0]</text>
  </g>
  <text x="560" y="166" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">答案 res[0] = 2 ✓（Σ = 2 = n−s）</text>

  <!-- 面板 B：变体 -->
  <g filter="url(#sk)">
    <rect x="430" y="196" width="260" height="168" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="560" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">变体：s=1, x=2（练 ⊗ 合成）</text>
  <g text-anchor="middle" font-size="10.5" fill="#333">
    <text x="560" y="240">① 左半 [0,2] 整拿 (p,c)=(1,[0,2,1])</text>
    <text x="560" y="258">② 右半 [3,4] 整拿 (0, [2,0,0])</text>
    <text x="560" y="276">③ ⊗：c 先取 [0,2,1]；y=0 的 2 个</text>
    <text x="560" y="294">   左乘 p₁=1 落桶 0 → c[0] += 2</text>
    <text x="560" y="312">④ res = [2, 2, 1]</text>
  </g>
  <text x="560" y="331" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">答案 res[2] = 1 ✓</text>
  <text x="560" y="350" text-anchor="middle" font-size="10" fill="#666">手算：前缀积 2, 4≡1, 12≡0, 60≡0</text>

  <!-- 面板 C：查询 2 -->
  <g filter="url(#sk)">
    <rect x="430" y="378" width="260" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="560" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">查询 2：s=0, x=1 → 答案 2</text>
  <g text-anchor="middle" font-size="10.5" fill="#8a6a1a">
    <text x="560" y="422">① s=0 ≤ l=0 → 根整段拿下</text>
    <text x="560" y="440">② res = c_root = [2, 2, 1]</text>
  </g>
  <text x="560" y="466" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">答案 res[1] = 2 ✓（Σ = 5 = n）</text>

  <text x="350" y="532" text-anchor="middle" font-size="11" fill="#888">对账：前缀积 mod 3 = 1, 2, 1, 0, 0 → 根 c = [2,2,1]，任意查询终态满足 Σ res = n − s ✓</text>
</svg>
