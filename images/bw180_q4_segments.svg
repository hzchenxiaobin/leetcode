<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="384" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">每个片段是 1^a 0^b，重排顺序决定最终二进制数</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums1 = [1,2], nums0 = [1,0] → 片段 "10" 与 "11"，最优顺序 11|10 = 1110₂ = 14</text>
  <rect x="70" y="64" width="110" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125.0" y="85.0" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">"10"</text>
  <text x="125.0" y="103" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">a=1, b=1</text>
  <rect x="210" y="64" width="110" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265.0" y="85.0" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">"11"</text>
  <text x="265.0" y="103" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">a=2, b=0</text>
  <text x="400" y="82" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">两个片段</text>
  <text x="400" y="102" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">（长度分别为 2、2）</text>
  <path d="M 280 118 L 280 146" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="292" y="136" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">重排</text>
  <rect x="60" y="152" width="200" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="172" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">片段 "11"</text>
  <text x="160" y="188" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">1×2 + 0 个 0</text>
  <rect x="272" y="152" width="200" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="372" y="172" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">片段 "10"</text>
  <text x="372" y="188" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">1×1 + 1 个 0</text>
  <text x="268" y="218" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">接起来 → "1110"</text>
  <rect x="36" y="234" width="488" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="254" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么把 1 多的放前面</text>
  <text x="48" y="272" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">二进制里越靠左的位权越大；把「开头 1 更多」的片段排在前面，能让高位尽量是 1</text>
  <rect x="36" y="300" width="488" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="320" text-anchor="start" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">值的算法</text>
  <text x="48" y="337" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">每种排列的字符串总长固定（= Σ(a+b)），所以比较大小等价于比较字典序</text>
  <text x="48" y="354" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">最终答案对 10^9+7 取模，拼接时用 res = res·2^(a+b) + block(a,b)</text>
</svg>
