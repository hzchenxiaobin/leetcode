<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">两段可规范化为不重叠：枚举下标分界</text>

  <!-- 数轴与奖品 -->
  <line x1="60" y1="120" x2="500" y2="120" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="60" y="140">1</text><text x="140" y="140">2</text><text x="220" y="140">3</text>
    <text x="300" y="140">4</text><text x="380" y="140">5</text><text x="460" y="140">6</text>
  </g>
  <!-- 奖品：位置 1,1,2,2,3,3,5 -->
  <g filter="url(#rough2)">
    <circle cx="60" cy="106" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="60" cy="92" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="140" cy="106" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="140" cy="92" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="220" cy="106" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="220" cy="92" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="460" cy="106" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="280" y="72" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">prizePositions = [1,1,2,2,3,3,5]，k = 2</text>

  <!-- 两条线段 -->
  <rect x="40" y="150" width="204" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)" opacity="0.85"/>
  <text x="142" y="170" text-anchor="middle" font-size="13" fill="#2d4a66" font-weight="bold" filter="url(#rough2)">第一段 [1,3]：拿 5 件</text>
  <rect x="220" y="188" width="244" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)" opacity="0.85"/>
  <text x="342" y="208" text-anchor="middle" font-size="13" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">第二段 [3,5]：拿 3 件（新）</text>

  <!-- 分界标记 -->
  <path d="M 220 86 L 220 226" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="238" y="243" font-size="12" fill="#7a5c1e" filter="url(#rough2)">下标分界 t：第一段只碰 [0, t−1]，第二段只碰 [t, n−1]</text>

  <!-- 规范化示意 -->
  <text x="280" y="278" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">重叠的两段总能重排成不重叠的两段（奖品并集不变）</text>
  <g filter="url(#rough2)">
    <rect x="90" y="292" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="200" y="292" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5"/>
  </g>
  <text x="145" y="310" text-anchor="middle" font-size="11.5" fill="#2d4a66" filter="url(#rough2)">段一（左）</text>
  <text x="255" y="310" text-anchor="middle" font-size="11.5" fill="#8a3a34" filter="url(#rough2)">段二（右）</text>
  <path d="M 330 305 C 360 305, 366 305, 390 305" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="299" text-anchor="middle" font-size="11.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">无缝衔接</text>
  <text x="452" y="316" text-anchor="middle" font-size="11.5" fill="#2d5a22" filter="url(#rough2)">不重不漏</text>

  <!-- 底部结论 -->
  <rect x="60" y="336" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">答案 7 = 5（第一段）+ 2（第二段新增的下标 6）</text>
</svg>
