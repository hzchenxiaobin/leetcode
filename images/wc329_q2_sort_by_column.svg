<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：两行的先后，只由第 k 列的一个标量决定</text>
  <path d="M 190 44 Q 340 52 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- k badge above column 2 -->
  <g filter="url(#sk)">
    <rect x="252" y="54" width="66" height="22" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="285" y="69" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">k = 2</text>
  <g filter="url(#sk)">
    <path d="M 285 78 Q 285 84 285 91" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- row labels -->
  <text x="122" y="122" text-anchor="end" font-size="13" fill="#666">行 a · 原#0</text>
  <text x="122" y="176" text-anchor="end" font-size="13" fill="#666">行 b · 原#1</text>

  <!-- row a cells -->
  <g filter="url(#sk)">
    <rect x="130" y="96" width="62" height="40" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.2"/>
    <rect x="192" y="96" width="62" height="40" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.2"/>
    <rect x="254" y="96" width="62" height="40" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="2.5"/>
    <rect x="316" y="96" width="62" height="40" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.2"/>
  </g>
  <text x="161" y="121" text-anchor="middle" font-size="17" fill="#9aa4ae" font-family="monospace">10</text>
  <text x="223" y="121" text-anchor="middle" font-size="17" fill="#9aa4ae" font-family="monospace">6</text>
  <text x="285" y="121" text-anchor="middle" font-size="18" font-weight="bold" fill="#b07a15" font-family="monospace">9</text>
  <text x="347" y="121" text-anchor="middle" font-size="17" fill="#9aa4ae" font-family="monospace">1</text>

  <!-- row b cells -->
  <g filter="url(#sk)">
    <rect x="130" y="150" width="62" height="40" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.2"/>
    <rect x="192" y="150" width="62" height="40" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.2"/>
    <rect x="254" y="150" width="62" height="40" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="2.5"/>
    <rect x="316" y="150" width="62" height="40" rx="4" fill="#f2f5f9" stroke="#b6c2cf" stroke-width="1.2"/>
  </g>
  <text x="161" y="175" text-anchor="middle" font-size="17" fill="#9aa4ae" font-family="monospace">7</text>
  <text x="223" y="175" text-anchor="middle" font-size="17" fill="#9aa4ae" font-family="monospace">5</text>
  <text x="285" y="175" text-anchor="middle" font-size="18" font-weight="bold" fill="#b07a15" font-family="monospace">11</text>
  <text x="347" y="175" text-anchor="middle" font-size="17" fill="#9aa4ae" font-family="monospace">2</text>

  <text x="254" y="208" text-anchor="middle" font-size="11" fill="#888">灰格：这些列的分数不参与两行之间的比较</text>

  <!-- arrows from k cells to comparator box -->
  <g filter="url(#sk)">
    <path d="M 320 116 Q 368 102 414 104" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 320 170 Q 368 152 414 128" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- comparator box -->
  <g filter="url(#sk)">
    <rect x="420" y="86" width="192" height="54" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="516" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">比较器只看两个标量</text>
  <text x="516" y="128" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">a[k]=9  vs  b[k]=11</text>

  <g filter="url(#sk)">
    <path d="M 516 142 L 516 154" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- conclusion box -->
  <g filter="url(#sk)">
    <rect x="420" y="156" width="192" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="516" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">11 &gt; 9 ⇒ 行 b 排前面</text>
  <text x="516" y="198" text-anchor="middle" font-size="11" fill="#666">行 a 整行跟在后面</text>

  <text x="516" y="232" text-anchor="middle" font-size="11" fill="#888">两行之间只比这一格</text>

  <!-- total order chain -->
  <g filter="url(#sk)">
    <rect x="80" y="248" width="520" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="340" y="272" text-anchor="middle" font-size="13" fill="#2b6e9e">第 k 列构成的全序链（示例 1）：11 &gt; 9 &gt; 3  ⇒  行序 #1 → #0 → #2</text>

  <!-- insight box -->
  <g filter="url(#sk)">
    <rect x="40" y="310" width="600" height="68" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="60" y="334" font-size="12" font-weight="bold" fill="#2b2b2b">关键观察：</text>
  <text x="60" y="354" font-size="11" fill="#444">矩阵所有整数互不相同 ⇒ 第 k 列的 m 个值两两不同，构成行的严格全序；</text>
  <text x="60" y="372" font-size="11" fill="#444">比较两行只需一个分支 a[k] &gt; b[k]，行序唯一确定，也不存在稳定性问题。</text>
</svg>
