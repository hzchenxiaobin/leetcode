<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>

  <text x="22" y="32" font-size="16" fill="#333" filter="url(#rough2)">nums1 升序排好，按 nums2 从大到小逐个「派牌」</text>

  <!-- nums1 sorted row -->
  <text x="24" y="78" font-size="13" fill="#446688" filter="url(#rough2)">nums1 升序</text>
  <rect x="120" y="58" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="146" y="84" text-anchor="middle" font-size="14" fill="#2c4a63" filter="url(#rough2)">8</text>
  <rect x="178" y="58" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="204" y="84" text-anchor="middle" font-size="14" fill="#2c4a63" filter="url(#rough2)">12</text>
  <rect x="236" y="58" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="262" y="84" text-anchor="middle" font-size="14" fill="#2c4a63" filter="url(#rough2)">24</text>
  <rect x="294" y="58" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="14" fill="#33562a" filter="url(#rough2)">32</text>
  <text x="212" y="118" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">lo ↑ 最小</text>
  <text x="320" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">hi ↑ 最大</text>

  <!-- nums2 desc row -->
  <text x="24" y="188" font-size="13" fill="#b07d20" filter="url(#rough2)">nums2 降序</text>
  <rect x="120" y="168" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="146" y="194" text-anchor="middle" font-size="14" fill="#8a6410" filter="url(#rough2)">32</text>
  <rect x="178" y="168" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="204" y="194" text-anchor="middle" font-size="14" fill="#8a6410" filter="url(#rough2)">25</text>
  <rect x="236" y="168" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="262" y="194" text-anchor="middle" font-size="14" fill="#8a6410" filter="url(#rough2)">13</text>
  <rect x="294" y="168" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="320" y="194" text-anchor="middle" font-size="14" fill="#8a6410" filter="url(#rough2)">11</text>

  <!-- 两个分支 -->
  <path d="M342 78 L406 78 L406 132" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arrG)"/>
  <rect x="352" y="134" width="252" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="478" y="158" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">a[hi] &gt; 当前最大对手？</text>
  <text x="478" y="182" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">能赢 → 就用 a[hi] 硬碰，hi−−</text>

  <path d="M146 208 L146 240 L406 240" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <rect x="352" y="252" width="252" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="478" y="276" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">最大的都赢不了它</text>
  <text x="478" y="300" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">→ 派最小的 a[lo] 去「送」，lo++</text>

  <text x="24" y="340" font-size="12" fill="#666" filter="url(#rough2)">犧牲最小的牌，保住大牌去打更弱的对手 —— 这就是优势洗牌的贪心核心</text>
</svg>
