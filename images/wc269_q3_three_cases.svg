<svg xmlns="http://www.w3.org/2000/svg" width="700" height="490" viewBox="0 0 700 490" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="700" height="490" fill="#fafafa"/>
  <text x="350" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：只能两端删 ⇒ 非劣方案只有 3 种形态</text>
  <path d="M 170 38 Q 350 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="350" y="58" text-anchor="middle" font-size="11.5" fill="#666">任何方案 = 从左删长 p 的前缀 ＋ 从右删长 q 的后缀；覆盖两个极值下标 i、j（i ≤ j）</text>

  <!-- top array -->
  <text x="75" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">原数组</text>
  <text x="75" y="111" text-anchor="middle" font-size="10.5" fill="#888">n = 10</text>
  <g filter="url(#sk)">
    <rect x="150" y="78" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="194" y="78" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="238" y="78" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="282" y="78" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="326" y="78" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="370" y="78" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="414" y="78" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="458" y="78" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="502" y="78" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="546" y="78" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
  </g>
  <text x="170" y="99" text-anchor="middle" font-size="11.5" fill="#555" font-family="monospace">4</text>
  <text x="214" y="99" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a36" font-family="monospace">−3</text>
  <text x="258" y="99" text-anchor="middle" font-size="11.5" fill="#555" font-family="monospace">5</text>
  <text x="302" y="99" text-anchor="middle" font-size="11.5" fill="#555" font-family="monospace">3</text>
  <text x="346" y="99" text-anchor="middle" font-size="11.5" fill="#555" font-family="monospace">8</text>
  <text x="390" y="99" text-anchor="middle" font-size="11.5" fill="#555" font-family="monospace">2</text>
  <text x="434" y="99" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a36" font-family="monospace">9</text>
  <text x="478" y="99" text-anchor="middle" font-size="11.5" fill="#555" font-family="monospace">7</text>
  <text x="522" y="99" text-anchor="middle" font-size="11.5" fill="#555" font-family="monospace">6</text>
  <text x="566" y="99" text-anchor="middle" font-size="11.5" fill="#555" font-family="monospace">0</text>
  <text x="170" y="124" text-anchor="middle" font-size="9.5" fill="#999" font-family="monospace">0</text>
  <text x="214" y="124" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" font-family="monospace">1</text>
  <text x="258" y="124" text-anchor="middle" font-size="9.5" fill="#999" font-family="monospace">2</text>
  <text x="302" y="124" text-anchor="middle" font-size="9.5" fill="#999" font-family="monospace">3</text>
  <text x="346" y="124" text-anchor="middle" font-size="9.5" fill="#999" font-family="monospace">4</text>
  <text x="390" y="124" text-anchor="middle" font-size="9.5" fill="#999" font-family="monospace">5</text>
  <text x="434" y="124" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" font-family="monospace">6</text>
  <text x="478" y="124" text-anchor="middle" font-size="9.5" fill="#999" font-family="monospace">7</text>
  <text x="522" y="124" text-anchor="middle" font-size="9.5" fill="#999" font-family="monospace">8</text>
  <text x="566" y="124" text-anchor="middle" font-size="9.5" fill="#999" font-family="monospace">9</text>
  <text x="214" y="62" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">min → i = 1</text>
  <path d="M 214 64 L 214 74" stroke="#b85450" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="434" y="62" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">max → j = 6</text>
  <path d="M 434 64 L 434 74" stroke="#b85450" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <path d="M 350 130 L 350 158" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="360" y="150" text-anchor="start" font-size="11" fill="#666">怎么选 (p, q)？按「谁由哪侧覆盖」分类</text>

  <!-- pattern 1: both from left -->
  <text x="75" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">形态① 全从左删</text>
  <text x="75" y="181" text-anchor="middle" font-size="10.5" fill="#888">前缀删 [0..j]</text>
  <g filter="url(#sk)">
    <rect x="150" y="170" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="194" y="170" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="238" y="170" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="282" y="170" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="326" y="170" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="370" y="170" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="414" y="170" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="458" y="170" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="502" y="170" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="546" y="170" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
  </g>
  <text x="170" y="191" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-family="monospace">4</text>
  <text x="214" y="191" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a36" font-family="monospace">−3</text>
  <text x="258" y="191" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-family="monospace">5</text>
  <text x="302" y="191" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-family="monospace">3</text>
  <text x="346" y="191" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-family="monospace">8</text>
  <text x="390" y="191" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-family="monospace">2</text>
  <text x="434" y="191" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a36" font-family="monospace">9</text>
  <text x="478" y="191" text-anchor="middle" font-size="11.5" fill="#999" font-family="monospace">7</text>
  <text x="522" y="191" text-anchor="middle" font-size="11.5" fill="#999" font-family="monospace">6</text>
  <text x="566" y="191" text-anchor="middle" font-size="11.5" fill="#999" font-family="monospace">0</text>
  <text x="600" y="182" text-anchor="start" font-size="12" font-weight="bold" fill="#2b4a6e">j + 1 = 7</text>
  <text x="600" y="198" text-anchor="start" font-size="10.5" fill="#888">共 7 次</text>

  <!-- pattern 2: both from right -->
  <text x="75" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e22">形态② 全从右删</text>
  <text x="75" y="263" text-anchor="middle" font-size="10.5" fill="#888">后缀删 [i..n−1]</text>
  <g filter="url(#sk)">
    <rect x="150" y="252" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="194" y="252" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="238" y="252" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="282" y="252" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="326" y="252" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="370" y="252" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="414" y="252" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="458" y="252" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="502" y="252" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="546" y="252" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="170" y="273" text-anchor="middle" font-size="11.5" fill="#999" font-family="monospace">4</text>
  <text x="214" y="273" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a36" font-family="monospace">−3</text>
  <text x="258" y="273" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-family="monospace">5</text>
  <text x="302" y="273" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-family="monospace">3</text>
  <text x="346" y="273" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-family="monospace">8</text>
  <text x="390" y="273" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-family="monospace">2</text>
  <text x="434" y="273" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a36" font-family="monospace">9</text>
  <text x="478" y="273" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-family="monospace">7</text>
  <text x="522" y="273" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-family="monospace">6</text>
  <text x="566" y="273" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-family="monospace">0</text>
  <text x="600" y="264" text-anchor="start" font-size="12" font-weight="bold" fill="#2e5e22">n − i = 9</text>
  <text x="600" y="280" text-anchor="start" font-size="10.5" fill="#888">共 9 次</text>

  <!-- pattern 3: split -->
  <text x="75" y="329" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">形态③ 两侧分删</text>
  <text x="75" y="345" text-anchor="middle" font-size="10.5" fill="#888">左删 [0..i]</text>
  <text x="75" y="359" text-anchor="middle" font-size="10.5" fill="#888">＋右删 [j..n−1]</text>
  <g filter="url(#sk)">
    <rect x="150" y="334" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="194" y="334" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="238" y="334" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="282" y="334" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="326" y="334" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="370" y="334" width="40" height="34" rx="4" fill="#f2f2f2" stroke="#9aa5b1" stroke-width="1.2"/>
    <rect x="414" y="334" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="458" y="334" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="502" y="334" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="546" y="334" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="170" y="355" text-anchor="middle" font-size="11.5" fill="#2b4a6e" font-family="monospace">4</text>
  <text x="214" y="355" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a36" font-family="monospace">−3</text>
  <text x="258" y="355" text-anchor="middle" font-size="11.5" fill="#999" font-family="monospace">5</text>
  <text x="302" y="355" text-anchor="middle" font-size="11.5" fill="#999" font-family="monospace">3</text>
  <text x="346" y="355" text-anchor="middle" font-size="11.5" fill="#999" font-family="monospace">8</text>
  <text x="390" y="355" text-anchor="middle" font-size="11.5" fill="#999" font-family="monospace">2</text>
  <text x="434" y="355" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a03a36" font-family="monospace">9</text>
  <text x="478" y="355" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-family="monospace">7</text>
  <text x="522" y="355" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-family="monospace">6</text>
  <text x="566" y="355" text-anchor="middle" font-size="11.5" fill="#2e5e22" font-family="monospace">0</text>
  <g filter="url(#sk)"><rect x="592" y="336" width="104" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="644" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">(i+1)+(n−j)</text>
  <text x="644" y="368" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">= 2+4 = 6 ✓</text>

  <!-- bottom note -->
  <g filter="url(#sk)"><rect x="30" y="412" width="640" height="62" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="350" y="437" text-anchor="middle" font-size="12" fill="#7a5415">第 4 种组合「j 由前缀删、i 由后缀删」要求删 ≥ (j+1)+(n−i) = n+1+(j−i) 个元素，超出总数 n，</text>
  <text x="350" y="458" text-anchor="middle" font-size="12" fill="#7a5415">根本不可行——前缀删到 j 时 i 已被顺带删掉，后缀那一段纯属浪费。故答案 = min(①, ②, ③)。</text>
</svg>
