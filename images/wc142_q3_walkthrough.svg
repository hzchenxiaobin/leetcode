<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr_blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arr_green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr_orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arr_red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr_gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#78909c"/>
    </marker>
    <marker id="arr_purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="660" height="360" fill="#fafafa"/>

  <text x="330.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 的 get 调用序列（arr=[1,2,3,4,5,3,1], target=3）</text>
  <text x="330.0" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">一共只调用 5 次 get，答案 2 是 3 出现的最小下标</text>

  <rect x="30" y="96" width="630" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70.0" y="114.0" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">阶段</text>
  <text x="170.0" y="114.0" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">区间 [lo, hi]</text>
  <text x="260.0" y="114.0" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">mid</text>
  <text x="475.0" y="114.0" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">比较 → 动作</text>
  <text x="70.0" y="142.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">找峰 1</text>
  <text x="170.0" y="142.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[0, 6]</text>
  <text x="260.0" y="142.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="475.0" y="142.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">get(3)=4 &lt; get(4)=5 → lo = 4</text>
  <path d="M 30 152 L 660 152" stroke="#78909c" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
  <text x="70.0" y="170.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">找峰 2</text>
  <text x="170.0" y="170.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[4, 6]</text>
  <text x="260.0" y="170.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <text x="475.0" y="170.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">get(5)=3 &gt; get(6)=1 → hi = 5</text>
  <path d="M 30 180 L 660 180" stroke="#78909c" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
  <text x="70.0" y="198.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">找峰 3</text>
  <text x="170.0" y="198.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[4, 5]</text>
  <text x="260.0" y="198.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="475.0" y="198.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">get(4)=5 &gt; get(5)=3 → hi = 4</text>
  <path d="M 30 208 L 660 208" stroke="#78909c" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
  <text x="70.0" y="226.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">峰值</text>
  <text x="170.0" y="226.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">peak = 4</text>
  <text x="260.0" y="226.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">—</text>
  <text x="475.0" y="226.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">峰顶值 5（不在端点）</text>
  <path d="M 30 236 L 660 236" stroke="#78909c" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
  <text x="70.0" y="254.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">左段 1</text>
  <text x="170.0" y="254.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[0, 4]</text>
  <text x="260.0" y="254.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="475.0" y="254.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">get(2)=3 == target → 返回 2</text>
  <path d="M 30 264 L 660 264" stroke="#78909c" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="96" width="630" height="168" fill="none" stroke="#78909c" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="30" y="270" width="600" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="42" y="290" text-anchor="start" font-size="10" fill="#333" filter="url(#rough2)">左段命中即返回，绝不进入右段 —— 保证返回的是最小下标。</text>
  <text x="24" y="344" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">若 target 只在右段（如 1），左段二分失败后再做一次约 14 步的反向二分。</text>
</svg>
