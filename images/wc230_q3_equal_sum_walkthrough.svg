<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：diff = 11，三个「+5 档」一举凑够</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="30" y="56" width="280" height="80" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="170" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">nums2（小和）Σ = 10</text>
  <g filter="url(#sk)">
    <rect x="44" y="84" width="30" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
    <rect x="88" y="84" width="30" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
    <rect x="132" y="84" width="30" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
    <rect x="176" y="84" width="30" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
    <rect x="220" y="84" width="30" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
    <rect x="264" y="84" width="30" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
  </g>
  <text x="59" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">1</text>
  <text x="103" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">1</text>
  <text x="147" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">2</text>
  <text x="191" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">2</text>
  <text x="235" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">2</text>
  <text x="279" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">2</text>
  <text x="59" y="126" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#sk)">封顶5</text>
  <text x="103" y="126" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#sk)">封顶5</text>
  <text x="147" y="126" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#sk)">封顶4</text>
  <text x="191" y="126" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#sk)">封顶4</text>
  <text x="235" y="126" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#sk)">封顶4</text>
  <text x="279" y="126" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#sk)">封顶4</text>

  <g filter="url(#sk)">
    <rect x="330" y="56" width="280" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="470" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">nums1（大和）Σ = 21</text>
  <g filter="url(#sk)">
    <rect x="344" y="84" width="30" height="26" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="388" y="84" width="30" height="26" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="432" y="84" width="30" height="26" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="476" y="84" width="30" height="26" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="520" y="84" width="30" height="26" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
    <rect x="564" y="84" width="30" height="26" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.1"/>
  </g>
  <text x="359" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">1</text>
  <text x="403" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">2</text>
  <text x="447" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">3</text>
  <text x="491" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">4</text>
  <text x="535" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">5</text>
  <text x="579" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">6</text>
  <text x="359" y="126" text-anchor="middle" font-size="9" fill="#999" filter="url(#sk)">封顶0</text>
  <text x="403" y="126" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#sk)">封顶1</text>
  <text x="447" y="126" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#sk)">封顶2</text>
  <text x="491" y="126" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#sk)">封顶3</text>
  <text x="535" y="126" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#sk)">封顶4</text>
  <text x="579" y="126" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#sk)">封顶5</text>

  <text x="320" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">diff = 21 − 10 = 11</text>

  <g filter="url(#sk)">
    <rect x="30" y="172" width="360" height="130" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="210" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">封顶改动力计数桶</text>
  <g filter="url(#sk)">
    <rect x="58" y="234" width="36" height="42" rx="3" fill="#b85450" fill-opacity="0.25" stroke="#b85450" stroke-width="1.6"/>
    <rect x="106" y="206" width="36" height="70" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="154" y="262" width="36" height="14" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="202" y="262" width="36" height="14" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="250" y="262" width="36" height="14" rx="3" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="76" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a4440" filter="url(#sk)">3</text>
  <text x="124" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">5</text>
  <text x="172" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">1</text>
  <text x="220" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">1</text>
  <text x="268" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">1</text>
  <text x="76" y="292" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">g=5</text>
  <text x="124" y="292" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">g=4</text>
  <text x="172" y="292" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">g=3</text>
  <text x="220" y="292" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">g=2</text>
  <text x="268" y="292" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">g=1</text>
  <text x="340" y="224" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#sk)">cnt[5] = 3 的来源：</text>
  <text x="340" y="242" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">小和的两个 1</text>
  <text x="340" y="258" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#sk)">＋ 大和的 6</text>
  <text x="340" y="278" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#sk)">（g=0 的桶无用来）</text>

  <g filter="url(#sk)">
    <rect x="410" y="172" width="200" height="130" rx="10" fill="#fdf2f4" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="510" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a4440" filter="url(#sk)">贪心榨取</text>
  <text x="510" y="214" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">g=5：⌈11/5⌉ = 3 ≤ cnt[5] = 3</text>
  <text x="510" y="234" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">→ 取 3 个，ans = 3</text>
  <text x="510" y="254" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">diff：11 − 3×5 = −4 ≤ 0 ✓</text>
  <text x="510" y="282" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a4440" filter="url(#sk)">只用最高档就凑够，答案 3</text>

  <g filter="url(#sk)">
    <rect x="30" y="316" width="580" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="320" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">一种具体的三步方案（最后一步增益不必用满）</text>
  <g filter="url(#sk)">
    <rect x="60" y="348" width="150" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="135" y="366" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">① nums2：1 → 6</text>
  <text x="135" y="384" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#sk)">增益 +5</text>
  <g filter="url(#sk)">
    <rect x="245" y="348" width="150" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="320" y="366" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">② nums2：1 → 6</text>
  <text x="320" y="384" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#sk)">增益 +5</text>
  <g filter="url(#sk)">
    <rect x="430" y="348" width="150" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="505" y="366" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">③ nums1：6 → 5</text>
  <text x="505" y="384" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#sk)">增益 +1（没用满 5）</text>
  <text x="320" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">两边都变成 20，3 次操作达成相等 ✓</text>
</svg>
