<svg xmlns="http://www.w3.org/2000/svg" width="660" height="448" viewBox="0 0 660 448" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="448" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">把 richer 看成 DAG：answer 沿「反图」向上合并</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 330.0 116.0 L 330.0 156.0" stroke="#3a3a3a" stroke-width="1.7" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 264.6 110.1 L 314.7 162.2" stroke="#3a3a3a" stroke-width="1.7" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 395.4 110.1 L 345.3 162.2" stroke="#3a3a3a" stroke-width="1.7" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320.6 196.8 L 299.8 238.3" stroke="#3a3a3a" stroke-width="1.7" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 171.0 258.0 L 268.0 258.0" stroke="#3a3a3a" stroke-width="1.7" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 290.0 279.0 L 290.0 313.0" stroke="#3a3a3a" stroke-width="1.7" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 346.4 191.1 L 412.8 244.3" stroke="#3a3a3a" stroke-width="1.7" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><circle cx="250" cy="95" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2.1"/></g>
  <text x="250" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">4</text>
  <text x="250" y="107" text-anchor="middle" font-size="8.5" fill="#555">q=6</text>
  <g filter="url(#sk2)"><circle cx="330" cy="95" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.1"/></g>
  <text x="330" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">5</text>
  <text x="330" y="107" text-anchor="middle" font-size="8.5" fill="#555">q=1</text>
  <g filter="url(#sk2)"><circle cx="410" cy="95" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2.1"/></g>
  <text x="410" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">6</text>
  <text x="410" y="107" text-anchor="middle" font-size="8.5" fill="#555">q=7</text>
  <g filter="url(#sk2)"><circle cx="330" cy="178" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.1"/></g>
  <text x="330" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="330" y="190" text-anchor="middle" font-size="8.5" fill="#555">q=4</text>
  <g filter="url(#sk2)"><circle cx="150" cy="258" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2.1"/></g>
  <text x="150" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">2</text>
  <text x="150" y="270" text-anchor="middle" font-size="8.5" fill="#555">q=5</text>
  <g filter="url(#sk2)"><circle cx="290" cy="258" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2.1"/></g>
  <text x="290" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">1</text>
  <text x="290" y="270" text-anchor="middle" font-size="8.5" fill="#555">q=2</text>
  <g filter="url(#sk2)"><circle cx="430" cy="258" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.1"/></g>
  <text x="430" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">7</text>
  <text x="430" y="270" text-anchor="middle" font-size="8.5" fill="#555">q=0</text>
  <g filter="url(#sk2)"><circle cx="290" cy="335" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.1"/></g>
  <text x="290" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">0</text>
  <text x="290" y="347" text-anchor="middle" font-size="8.5" fill="#555">q=3</text>
  <g filter="url(#sk2)"><rect x="475.0" y="85.0" width="160" height="66" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="555" y="107.3" text-anchor="middle" font-size="10.5" fill="#2b4a6e">「钱不少于 x」</text>
  <text x="555" y="121.8" text-anchor="middle" font-size="10.5" fill="#2b4a6e">= 能走到 x 的</text>
  <text x="555" y="136.3" text-anchor="middle" font-size="10.5" fill="#2b4a6e">所有祖先（含 x）</text>
  <g filter="url(#sk2)"><rect x="475.0" y="181.0" width="160" height="58" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="555" y="206.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e5e22">answer[x] = 其中</text>
  <text x="555" y="221.0" text-anchor="middle" font-size="10.5" fill="#2e5e22">quiet 最小的人</text>
  <g filter="url(#sk2)"><rect x="475.0" y="263.0" width="160" height="78" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="555" y="284.6" text-anchor="middle" font-size="10" fill="#2b4a6e">沿反图记忆化 DFS：</text>
  <text x="555" y="298.6" text-anchor="middle" font-size="10" fill="#2b4a6e">dfs(u) = argmin</text>
  <text x="555" y="312.6" text-anchor="middle" font-size="10" fill="#2b4a6e">quiet[u] 与</text>
  <text x="555" y="326.6" text-anchor="middle" font-size="10" fill="#2b4a6e">dfs(a), a∈rich[u]</text>
  <g filter="url(#sk2)"><rect x="45.0" y="380.0" width="570" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="330" y="405.8" text-anchor="middle" font-size="10.5" fill="#2b4a6e">边 a → b 表示 a 比 b 有钱：钱沿箭头方向递减，答案沿反方向合并</text>
</svg>
