<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：7 月查表，2 月才要判闰年</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">1900 与 2000 一念之差，是本题唯一的坑</text>

  <g filter="url(#rough2)">
    <rect x="36" y="62" width="488" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
    <text x="56" y="88" font-size="12" fill="#3a4a66" font-weight="bold">示例 1：Y = 1992，M = 7</text>
    <text x="56" y="110" font-size="10.5" fill="#555">1992 % 4 == 0 且 1992 % 100 != 0 → 闰年；但 7 月的天数与闰平年无关</text>
    <text x="56" y="132" font-size="10.5" fill="#3a4a66">直接查表 days[7] = 31（大月）</text>
    <rect x="452" y="84" width="56" height="44" fill="#fff" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="480" y="113" text-anchor="middle" font-size="20" fill="#446688" font-weight="bold">31</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="160" width="488" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <text x="56" y="186" font-size="12" fill="#3a5a30" font-weight="bold">示例 2：Y = 2000，M = 2</text>
    <text x="56" y="208" font-size="10.5" fill="#555">2000 % 4 == 0，但 % 100 == 0；又 % 400 == 0 → 闰年（四百年再闰）</text>
    <text x="56" y="230" font-size="10.5" fill="#3a5a30">二月特判生效：days[2] = 29</text>
    <rect x="452" y="182" width="56" height="44" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="480" y="211" text-anchor="middle" font-size="20" fill="#4a7a3a" font-weight="bold">29</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="258" width="488" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"/>
    <text x="56" y="284" font-size="12" fill="#8a3a36" font-weight="bold">示例 3：Y = 1900，M = 2　⚠ 百年不闰</text>
    <text x="56" y="306" font-size="10.5" fill="#555">1900 % 4 == 0，但 % 100 == 0 且 % 400 != 0 → 平年（整除 100 不够，还要整除 400）</text>
    <text x="56" y="328" font-size="10.5" fill="#8a3a36">二月不特判：days[2] = 28</text>
    <rect x="452" y="280" width="56" height="44" fill="#fff" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="480" y="309" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">28</text>
  </g>

  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">三个示例分别覆盖：大月查表 / 400 倍数是闰年 / 100 倍数但非 400 倍数是平年</text>
</svg>
