<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="460" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b">示例演算：s = "abbac" 一趟扫描走查</text>
  <path d="M 160 36 Q 340 44 520 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header band + highlight band -->
  <g filter="url(#sk)">
    <rect x="20" y="52" width="640" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="20" y="260" width="640" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="0"/>
  </g>

  <!-- grid lines -->
  <g stroke="#9aa7b5" stroke-width="1" filter="url(#sk)">
    <line x1="56" y1="52" x2="56" y2="348"/>
    <line x1="100" y1="52" x2="100" y2="348"/>
    <line x1="176" y1="52" x2="176" y2="348"/>
    <line x1="264" y1="52" x2="264" y2="348"/>
    <line x1="352" y1="52" x2="352" y2="348"/>
    <line x1="440" y1="52" x2="440" y2="348"/>
    <line x1="532" y1="52" x2="532" y2="348"/>
    <line x1="20" y1="84" x2="660" y2="84"/>
    <line x1="20" y1="128" x2="660" y2="128"/>
    <line x1="20" y1="172" x2="660" y2="172"/>
    <line x1="20" y1="216" x2="660" y2="216"/>
    <line x1="20" y1="304" x2="660" y2="304"/>
    <line x1="20" y1="348" x2="660" y2="348"/>
  </g>
  <rect x="20" y="52" width="640" height="296" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#sk)"/>
  <rect x="20" y="260" width="640" height="44" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>

  <!-- header -->
  <g font-size="11.5" font-weight="bold" fill="#33506b" text-anchor="middle">
    <text x="38" y="72">i</text>
    <text x="78" y="72">读入</text>
    <text x="138" y="72">(a,b,c)</text>
    <text x="220" y="72">sig_ab</text>
    <text x="308" y="72">sig_ac</text>
    <text x="396" y="72">sig_bc</text>
    <text x="486" y="72">sig_abc</text>
    <text x="596" y="72">命中结算</text>
  </g>

  <!-- row i=0 -->
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="38" y="106">0</text>
    <text x="78" y="106">—</text>
    <text x="138" y="106">(0,0,0)</text>
    <text x="220" y="106">(0,0)</text>
    <text x="308" y="106">(0,0)</text>
    <text x="396" y="106">(0,0)</text>
    <text x="486" y="106">(0,0)</text>
    <text x="596" y="106">空前缀入表</text>
  </g>

  <!-- row i=1 -->
  <g font-size="11" fill="#444" text-anchor="middle">
    <text x="38" y="150">1</text>
    <text x="78" y="150" fill="#b85450" font-weight="bold">a</text>
    <text x="138" y="150">(1,0,0)</text>
    <text x="220" y="150">(1,0)</text>
    <text x="308" y="150">(1,0)</text>
    <text x="396" y="150">(0,1)</text>
    <text x="486" y="150">(−1,−1)</text>
    <text x="596" y="150">run = 1</text>
  </g>

  <!-- row i=2 -->
  <g font-size="11" fill="#444" text-anchor="middle">
    <text x="38" y="194">2</text>
    <text x="78" y="194" fill="#b85450" font-weight="bold">b</text>
    <text x="138" y="194">(1,1,0)</text>
    <text x="220" y="194" fill="#446688" font-weight="bold">(0,0)→0</text>
    <text x="308" y="194">(1,1)</text>
    <text x="396" y="194">(1,1)</text>
    <text x="486" y="194">(0,−1)</text>
    <text x="596" y="194" fill="#446688" font-weight="bold">"ab" len 2</text>
  </g>

  <!-- row i=3 -->
  <g font-size="11" fill="#444" text-anchor="middle">
    <text x="38" y="238">3</text>
    <text x="78" y="238" fill="#b85450" font-weight="bold">b</text>
    <text x="138" y="238">(1,2,0)</text>
    <text x="220" y="238">(−1,0)</text>
    <text x="308" y="238">(1,2)</text>
    <text x="396" y="238">(2,1)</text>
    <text x="486" y="238">(1,−1)</text>
    <text x="596" y="238">run = 2 "bb"</text>
  </g>

  <!-- row i=4 (highlight) -->
  <g font-size="11" fill="#444" text-anchor="middle">
    <text x="38" y="286">4</text>
    <text x="78" y="286" fill="#b85450" font-weight="bold">a</text>
    <text x="138" y="286">(2,2,0)</text>
    <text x="220" y="286" fill="#d6a040" font-weight="bold">(0,0)→0</text>
    <text x="308" y="286">(2,2)</text>
    <text x="396" y="286">(2,2)</text>
    <text x="486" y="286">(0,−2)</text>
    <text x="596" y="286" fill="#b85450" font-weight="bold">"abba" len 4 ★</text>
  </g>

  <!-- row i=5 -->
  <g font-size="11" fill="#444" text-anchor="middle">
    <text x="38" y="330">5</text>
    <text x="78" y="330" fill="#b85450" font-weight="bold">c</text>
    <text x="138" y="330">(2,2,1)</text>
    <text x="220" y="330">(0,1)</text>
    <text x="308" y="330" fill="#446688" font-weight="bold">(1,2)→3</text>
    <text x="396" y="330">(1,2)</text>
    <text x="486" y="330" fill="#446688" font-weight="bold">(0,−1)→2</text>
    <text x="596" y="330">"ac" 2 / "bac" 3</text>
  </g>

  <!-- bottom summary -->
  <g filter="url(#sk)">
    <rect x="20" y="368" width="640" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="340" y="390" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">图例：纯值 = 首现记录；值→k = 命中首现 k，结算长度 i − k</text>
  <text x="340" y="412" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#sk)">游程并行维护："bb" = 2；所有结算取 max(2, 2, 4, 2, 3) = 4 ✓</text>
  <text x="340" y="434" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#sk)">i=5：同一前缀在 sig_ac 与 sig_abc 两张表分别结算，互不干扰</text>
</svg>
