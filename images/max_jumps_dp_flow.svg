<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="560" fill="#fdfcf7"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：O(n²) 双重循环线性 DP</text>
  <path d="M 190 42 Q 350 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start box -->
  <g filter="url(#sk)">
    <rect x="190" y="58" width="300" height="42" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="340" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">初始化：dp[0] = 0，其余 dp[i] = −1</text>

  <g filter="url(#sk)">
    <path d="M 340 100 L 340 124" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- outer loop -->
  <g filter="url(#sk)">
    <rect x="190" y="128" width="300" height="38" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="340" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">外层循环：i = 1 … n−1</text>

  <g filter="url(#sk)">
    <path d="M 340 166 L 340 190" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- inner loop -->
  <g filter="url(#sk)">
    <rect x="190" y="194" width="300" height="38" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="340" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">内层循环：j = 0 … i−1</text>

  <g filter="url(#sk)">
    <path d="M 340 232 L 340 272" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="340,276 500,336 340,396 180,336" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="340" y="328" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">dp[j] ≠ −1 且</text>
  <text x="340" y="348" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">|nums[i] − nums[j]| ≤ target ?</text>

  <!-- yes branch -->
  <g filter="url(#sk)">
    <path d="M 500 336 L 513 336" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="505" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>

  <!-- action box -->
  <g filter="url(#sk)">
    <rect x="520" y="308" width="145" height="56" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="592" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">dp[i] =</text>
  <text x="592" y="350" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">max(dp[i], dp[j]+1)</text>

  <!-- action return to inner loop -->
  <g filter="url(#sk)">
    <path d="M 592 308 L 592 213 L 496 213" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="600" y="264" font-size="10" fill="#666">j+1</text>

  <!-- no branch -->
  <g filter="url(#sk)">
    <path d="M 340 396 L 340 428 L 96 428 L 96 213 L 182 213" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="352" y="418" font-size="11" font-weight="bold" fill="#b03a3a">否（跳过）</text>

  <!-- outer loop exit -->
  <g filter="url(#sk)">
    <path d="M 490 147 L 684 147 L 684 504 L 496 504" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="676" y="468" text-anchor="end" font-size="10" fill="#666">i 循环结束</text>

  <!-- output box -->
  <g filter="url(#sk)">
    <rect x="190" y="482" width="300" height="44" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="340" y="509" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">返回 dp[n − 1]（不可达则 −1）</text>
</svg>
