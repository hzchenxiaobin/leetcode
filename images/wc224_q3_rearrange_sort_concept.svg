<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="410" fill="#fafafa"/>
  <text x="350" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：按底行做直方图，列可重排时降序排序即最优并排</text>

  <!-- ===== Panel 1: matrix + heights ===== -->
  <text x="125" y="56" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">① 以行 2 为底求列高</text>

  <!-- row labels -->
  <text x="78" y="94" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">行0</text>
  <text x="78" y="130" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">行1</text>
  <text x="78" y="166" text-anchor="end" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">行2(底)</text>

  <!-- grid cells: row0 -->
  <rect x="86" y="70" width="34" height="34" rx="3" fill="#f0ede4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="103" y="92" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="120" y="70" width="34" height="34" rx="3" fill="#f0ede4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="137" y="92" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="154" y="70" width="34" height="34" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">1</text>
  <!-- row1 -->
  <rect x="86" y="104" width="34" height="34" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">1</text>
  <rect x="120" y="104" width="34" height="34" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">1</text>
  <rect x="154" y="104" width="34" height="34" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">1</text>
  <!-- row2 (base, emphasized) -->
  <rect x="86" y="138" width="34" height="34" rx="3" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="103" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">1</text>
  <rect x="120" y="138" width="34" height="34" rx="3" fill="#f0ede4" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="137" y="160" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="154" y="138" width="34" height="34" rx="3" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="171" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">1</text>

  <!-- heights boxes -->
  <text x="60" y="192" font-size="10.5" fill="#555" filter="url(#rough2)">heights（底行处的列高）</text>
  <rect x="86" y="198" width="34" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">2</text>
  <rect x="120" y="198" width="34" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">0</text>
  <rect x="154" y="198" width="34" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="171" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">3</text>

  <text x="125" y="246" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">第 1 列被行 2 的 0 切断 → 高度归零</text>
  <text x="125" y="264" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">高 2 列与高 3 列原本不相邻</text>

  <!-- ===== Panel 2: rearrange arrow ===== -->
  <path d="M206,118 L264,118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="235" y="104" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">整列重排</text>
  <text x="235" y="140" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">任意列子集</text>
  <text x="235" y="155" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">都能并排相邻</text>

  <!-- ===== Panel 3: sorted histogram ===== -->
  <text x="475" y="56" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">② 降序排序 = 最优并排</text>

  <line x1="320" y1="210" x2="510" y2="210" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- pos0 h=3 -->
  <rect x="330" y="102" width="44" height="108" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <!-- pos1 h=2 -->
  <rect x="386" y="138" width="44" height="72" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="132" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <!-- pos2 h=0 -->
  <text x="464" y="204" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <!-- position labels -->
  <text x="352" y="230" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">j=0</text>
  <text x="408" y="230" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">j=1</text>
  <text x="464" y="230" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">j=2</text>

  <!-- highlight 2x2 rectangle -->
  <rect x="326" y="135" width="110" height="79" rx="3" fill="#b85450" fill-opacity="0.14" stroke="#b85450" stroke-width="2" stroke-dasharray="4 2" filter="url(#rough2)"/>
  <text x="381" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">高 2 × 宽 2 = 4 ✓</text>

  <text x="415" y="254" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">sorted = [3, 2, 0]</text>
  <text x="415" y="272" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">位置 j：前 j+1 列高度都 ≥ h_j</text>
  <text x="415" y="288" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">候选面积 = h_j × (j+1)，遍历 j 取最大</text>

  <!-- ===== Bottom formula box ===== -->
  <rect x="36" y="302" width="628" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4a1a" filter="url(#rough2)">位置 j 的候选面积 = h_j × (j+1)：前 j+1 列高度都 ≥ h_j，并排即成全 1 矩形</text>
  <text x="350" y="352" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">85 题（列固定）用单调栈维护左右边界；本题列可重排，位置约束消失，一次排序取而代之</text>
  <text x="350" y="376" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">h_j = 0 → 后面全 0，提前 break；每行独立取最大即全局最优（证明见题解 §5）</text>
</svg>
