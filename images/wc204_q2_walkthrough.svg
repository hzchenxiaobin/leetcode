<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 428" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="428" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：nums = [0, 1, −2, −3, −4]（示例 2）</text>
  <path d="M 140 34 Q 280 40 420 34" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- table rows (tint) -->
  <rect x="30" y="76" width="500" height="36" fill="#fdf0f0" filter="url(#rough2)"/>
  <rect x="30" y="112" width="500" height="36" fill="#f4f9f4" filter="url(#rough2)"/>
  <rect x="30" y="148" width="500" height="36" fill="#fffaf0" filter="url(#rough2)"/>
  <rect x="30" y="184" width="500" height="36" fill="#fffaf0" filter="url(#rough2)"/>
  <rect x="30" y="220" width="500" height="36" fill="#fffaf0" filter="url(#rough2)"/>

  <!-- header -->
  <rect x="30" y="48" width="500" height="28" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="47" y="67" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334" filter="url(#rough2)">i</text>
  <text x="93" y="67" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334" filter="url(#rough2)">nums[i]</text>
  <text x="149" y="67" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334" filter="url(#rough2)">pos</text>
  <text x="203" y="67" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334" filter="url(#rough2)">neg</text>
  <text x="257" y="67" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334" filter="url(#rough2)">ans</text>
  <text x="407" y="67" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#334" filter="url(#rough2)">说明</text>

  <!-- grid lines -->
  <path d="M 30 76 L 530 76" stroke="#cfcfca" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 112 L 530 112" stroke="#cfcfca" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 148 L 530 148" stroke="#cfcfca" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 184 L 530 184" stroke="#cfcfca" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 30 220 L 530 220" stroke="#cfcfca" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 64 48 L 64 256" stroke="#cfcfca" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 122 48 L 122 256" stroke="#cfcfca" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 176 48 L 176 256" stroke="#cfcfca" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 230 48 L 230 256" stroke="#cfcfca" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 284 48 L 284 256" stroke="#cfcfca" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="48" width="500" height="208" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- row 0 -->
  <text x="47" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="93" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="149" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="203" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="257" y="98" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="292" y="98" font-size="10.5" fill="#555" filter="url(#rough2)">遇 0：两状态同时清零</text>

  <!-- row 1 -->
  <text x="47" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="93" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="149" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <text x="203" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="257" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#334" filter="url(#rough2)">1</text>
  <text x="292" y="134" font-size="10.5" fill="#555" filter="url(#rough2)">正数：pos 延伸（单元素 [1]）</text>

  <!-- row 2 -->
  <text x="47" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="93" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−2</text>
  <text x="149" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="203" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a7020" filter="url(#rough2)">2</text>
  <text x="257" y="170" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">1</text>
  <text x="292" y="170" font-size="10.5" fill="#555" filter="url(#rough2)">互换：pos←neg(=0)，neg←pos+1</text>

  <!-- row 3 -->
  <text x="47" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="93" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−3</text>
  <text x="149" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>
  <text x="203" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a7020" filter="url(#rough2)">1</text>
  <text x="257" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>
  <text x="292" y="206" font-size="10.5" fill="#555" filter="url(#rough2)">互换：pos←neg+1=3，ans 更新</text>

  <!-- row 4 -->
  <text x="47" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="93" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−4</text>
  <text x="149" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">2</text>
  <text x="203" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a7020" filter="url(#rough2)">4</text>
  <text x="257" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#334" filter="url(#rough2)">3</text>
  <text x="292" y="242" font-size="10.5" fill="#555" filter="url(#rough2)">互换：pos 回落，ans 保持峰值 3</text>

  <!-- array strip -->
  <text x="136" y="290" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">遇 0 断开</text>
  <rect x="104" y="296" width="64" height="40" rx="4" fill="#f3f3f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="322" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <rect x="176" y="296" width="64" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="208" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <rect x="248" y="296" width="64" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">−2</text>
  <rect x="320" y="296" width="64" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="352" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">−3</text>
  <rect x="392" y="296" width="64" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="322" text-anchor="middle" font-size="13" fill="#9a7020" filter="url(#rough2)">−4</text>

  <path d="M 176 344 L 176 353 Q 280 360 384 353 L 384 344" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">最长正乘积子数组 [1, −2, −3]，乘积 +6，长度 3</text>

  <text x="280" y="408" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">连续负数使 pos / neg 逐步互换，pos 依次 1 → 0 → 3 → 2：局部状态起落，ans 记录峰值</text>
</svg>
