<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="410" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold"
        filter="url(#rough2)">命令 2 的两种分支：文档 i 自己会不会被打印？</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">本题唯一的坑——命令 2 永远不把文档 i 放进内存，i 的“命运”由当时内存是否为空决定</text>

  <rect x="25" y="66" width="285" height="215" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="167" y="90" text-anchor="middle" font-size="12" fill="#8a3a3a"
        font-weight="bold" filter="url(#rough2)">内存非空：打印的是栈顶 j</text>

  <rect x="55" y="150" width="120" height="32" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="171" text-anchor="middle" font-size="12" fill="#8a6a20"
        filter="url(#rough2)">j（栈顶）</text>
  <rect x="55" y="182" width="120" height="32" fill="#ffffff" stroke="#8899bb"
        stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="115" y="203" text-anchor="middle" font-size="12" fill="#555"
        filter="url(#rough2)">…更早的文档</text>

  <path d="M 180 166 L 220 166" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="170" font-size="11" fill="#446688" filter="url(#rough2)">打印 j</text>

  <text x="45" y="240" font-size="10.5" fill="#8a3a3a" filter="url(#rough2)">j 出栈并被打印；文档 i 从未进内存，</text>
  <text x="45" y="260" font-size="10.5" fill="#8a3a3a" filter="url(#rough2)">也从未被打印 ⇒ i 属于答案集合。</text>

  <rect x="330" y="66" width="285" height="215" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="472" y="90" text-anchor="middle" font-size="12" fill="#3a5a30"
        font-weight="bold" filter="url(#rough2)">内存为空：才轮到文档 i 自己</text>

  <rect x="360" y="150" width="120" height="64" fill="#ffffff" stroke="#4a7a3a"
        stroke-width="1.4" stroke-dasharray="6 4" rx="4" filter="url(#rough2)"/>
  <text x="420" y="186" text-anchor="middle" font-size="12" fill="#7a9a6a"
        filter="url(#rough2)">（空栈）</text>

  <path d="M 485 182 L 525 182" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="537" y="186" font-size="11" fill="#446688" filter="url(#rough2)">打印 i</text>

  <text x="350" y="240" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">此刻文档 i 被打印，它不进内存、</text>
  <text x="350" y="260" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">也不进答案集合。</text>

  <rect x="25" y="296" width="590" height="92" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="40" y="316" font-size="11" fill="#8a6a20" font-weight="bold"
        filter="url(#rough2)">用样例第 5 组 s = "112" 走一遍：</text>
  <text x="40" y="338" font-size="10.5" fill="#555" filter="url(#rough2)">i=1 “1”：压栈，内存 [1]　　　i=2 “1”：压栈，内存 [1,2]</text>
  <text x="40" y="358" font-size="10.5" fill="#555" filter="url(#rough2)">i=3 “2”：内存非空 → 弹出并打印 2，而文档 3 自己没被打印</text>
  <text x="40" y="379" font-size="10.5" fill="#8a3a3a" filter="url(#rough2)">未打印 = {1, 3}，输出 2 / 1 3 —— 与官方样例完全一致</text>
</svg>
