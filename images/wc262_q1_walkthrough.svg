<svg xmlns="http://www.w3.org/2000/svg" width="900" height="485" viewBox="0 0 900 485"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="900" height="485" fill="#fafafa"/>
  <text x="450" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：三趟登记 → 值域扫描</text>
  <path d="M 260 40 Q 450 48 640 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="450" y="64" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">输入：nums1 = [1,1,3,2]，nums2 = [2,3]，nums3 = [3] —— 期望输出 [3,2]</text>

  <!-- step 1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="82" width="400" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="56" y="104" font-size="12.5" font-weight="bold" fill="#2b4666" filter="url(#rough2)">① 遍历 nums1（bit0 · |= 001）</text>
  <text x="56" y="126" font-size="11" fill="#333" filter="url(#rough2)">mask[1] |= 001 → 001　　mask[2] |= 001 → 001</text>
  <text x="56" y="144" font-size="11" fill="#333" filter="url(#rough2)">mask[3] |= 001 → 001</text>
  <text x="56" y="164" font-size="10" fill="#b85450" filter="url(#rough2)">第二个 1：001 | 001 = 001，幂等无变化</text>
  <path d="M 240 174 L 240 186" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <g filter="url(#rough2)">
    <rect x="40" y="190" width="400" height="74" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="56" y="212" font-size="12.5" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">② 遍历 nums2（bit1 · |= 010）</text>
  <text x="56" y="236" font-size="11" fill="#333" filter="url(#rough2)">mask[2] = 001 | 010 = 011　　mask[3] = 001 | 010 = 011</text>
  <path d="M 240 264 L 240 276" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <g filter="url(#rough2)">
    <rect x="40" y="280" width="400" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="56" y="302" font-size="12.5" font-weight="bold" fill="#7a5c14" filter="url(#rough2)">③ 遍历 nums3（bit2 · |= 100）</text>
  <text x="56" y="324" font-size="11" fill="#333" filter="url(#rough2)">mask[3] = 011 | 100 = 111</text>

  <!-- right: final mask table -->
  <text x="653" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#666" filter="url(#rough2)">登记完成 → 扫描值域筛选</text>

  <g filter="url(#rough2)">
    <rect x="480" y="108" width="54" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="534" y="108" width="120" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="654" y="108" width="86" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="740" y="108" width="110" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="507" y="124" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">值 v</text>
  <text x="594" y="124" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">掩码 b₂b₁b₀</text>
  <text x="697" y="124" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">popcount</text>
  <text x="795" y="124" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">判定</text>

  <g filter="url(#rough2)">
    <rect x="480" y="132" width="54" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="534" y="132" width="120" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="654" y="132" width="86" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="740" y="132" width="110" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="507" y="150" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="594" y="150" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">001</text>
  <text x="697" y="150" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="795" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 落选</text>

  <g filter="url(#rough2)">
    <rect x="480" y="158" width="54" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="534" y="158" width="120" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="654" y="158" width="86" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="740" y="158" width="110" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="507" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="594" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">011</text>
  <text x="697" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="795" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 入选</text>

  <g filter="url(#rough2)">
    <rect x="480" y="184" width="54" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="534" y="184" width="120" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="654" y="184" width="86" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="740" y="184" width="110" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="507" y="202" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="594" y="202" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">111</text>
  <text x="697" y="202" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="795" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 入选</text>

  <!-- scan box -->
  <g filter="url(#rough2)">
    <rect x="480" y="240" width="370" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="665" y="260" text-anchor="middle" font-size="12" fill="#2b4666" filter="url(#rough2)">扫描 v = 1 … 100：v = 1 落选，v = 2、v = 3 入选</text>
  <text x="665" y="278" text-anchor="middle" font-size="10" fill="#567" filter="url(#rough2)">popcount(001)=1 &lt; 2；popcount(011)=2，popcount(111)=3 ≥ 2</text>

  <!-- ans box -->
  <g filter="url(#rough2)">
    <rect x="480" y="306" width="370" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="665" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">输出 ans = [2, 3]</text>
  <text x="665" y="346" text-anchor="middle" font-size="10" fill="#567" filter="url(#rough2)">与示例输出 [3,2] 仅顺序不同（题目允许任意顺序）</text>

  <!-- trap card -->
  <g filter="url(#rough2)">
    <rect x="40" y="366" width="820" height="74" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="58" y="390" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">⚠️ 陷阱对照：若按「总出现次数 ≥ 2」统计</text>
  <text x="58" y="412" font-size="11" fill="#333" filter="url(#rough2)">1 在 nums1 里出现两次 → 被误收，输出 [1,2,3]（错）。正确维度是归属数 popcount，不是出现次数 —— 示例 1 本身就是内置反例。</text>

  <text x="450" y="466" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">三趟登记 O(n₁+n₂+n₃) + 一趟值域扫描 O(100)，总运算量几百次</text>
</svg>
