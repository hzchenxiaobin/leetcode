<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 434" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="434" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：先按 arr2 的名次，再按值升序补尾</text>
  <text x="310" y="45" text-anchor="middle" font-size="10.5" fill="#888">arr1 = [2,3,1,3,2,4,6,7,9,2,19]　arr2 = [2,1,4,3,9,6]</text>

  <text x="70" y="68" font-size="11" fill="#3a4a66" font-weight="bold">计数结果 cnt：1→1，2→3，3→2，4→1，6→1，7→1，9→1，19→1</text>

  <g filter="url(#rough2)">
    <rect x="66" y="78" width="76" height="26" fill="#dfe8f6" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="142" y="78" width="76" height="26" fill="#dfe8f6" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="218" y="78" width="86" height="26" fill="#dfe8f6" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="304" y="78" width="286" height="26" fill="#dfe8f6" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="104" y="96" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">当前值 x</text>
    <text x="180" y="96" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">cnt[x]</text>
    <text x="261" y="96" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">阶段</text>
    <text x="318" y="96" font-size="10.5" fill="#3a4a66" font-weight="bold">已生成结果 res</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="66" y="108" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="104" y="126" text-anchor="middle" font-size="11" fill="#3a5a30">2</text>
    <rect x="142" y="108" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="180" y="126" text-anchor="middle" font-size="11" fill="#3a5a30">3</text>
    <rect x="218" y="108" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="261" y="126" text-anchor="middle" font-size="10" fill="#3a5a30">② rank 0</text>
    <text x="318" y="126" font-size="10.5" fill="#555">[2, 2, 2]</text>

    <rect x="66" y="136" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="104" y="154" text-anchor="middle" font-size="11" fill="#3a5a30">1</text>
    <rect x="142" y="136" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="180" y="154" text-anchor="middle" font-size="11" fill="#3a5a30">1</text>
    <rect x="218" y="136" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="261" y="154" text-anchor="middle" font-size="10" fill="#3a5a30">② rank 1</text>
    <text x="318" y="154" font-size="10.5" fill="#555">[2, 2, 2, 1]</text>

    <rect x="66" y="164" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="104" y="182" text-anchor="middle" font-size="11" fill="#3a5a30">4</text>
    <rect x="142" y="164" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="180" y="182" text-anchor="middle" font-size="11" fill="#3a5a30">1</text>
    <rect x="218" y="164" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="261" y="182" text-anchor="middle" font-size="10" fill="#3a5a30">② rank 2</text>
    <text x="318" y="182" font-size="10.5" fill="#555">[2, 2, 2, 1, 4]</text>

    <rect x="66" y="192" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="104" y="210" text-anchor="middle" font-size="11" fill="#3a5a30">3</text>
    <rect x="142" y="192" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="180" y="210" text-anchor="middle" font-size="11" fill="#3a5a30">2</text>
    <rect x="218" y="192" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="261" y="210" text-anchor="middle" font-size="10" fill="#3a5a30">② rank 3</text>
    <text x="318" y="210" font-size="10.5" fill="#555">[2, 2, 2, 1, 4, 3, 3]</text>

    <rect x="66" y="220" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="104" y="238" text-anchor="middle" font-size="11" fill="#3a5a30">9</text>
    <rect x="142" y="220" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="180" y="238" text-anchor="middle" font-size="11" fill="#3a5a30">1</text>
    <rect x="218" y="220" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="261" y="238" text-anchor="middle" font-size="10" fill="#3a5a30">② rank 4</text>
    <text x="318" y="238" font-size="10.5" fill="#555">[2, 2, 2, 1, 4, 3, 3, 9]</text>

    <rect x="66" y="248" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="104" y="266" text-anchor="middle" font-size="11" fill="#3a5a30">6</text>
    <rect x="142" y="248" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="180" y="266" text-anchor="middle" font-size="11" fill="#3a5a30">1</text>
    <rect x="218" y="248" width="86" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5"/>
    <text x="261" y="266" text-anchor="middle" font-size="10" fill="#3a5a30">② rank 5</text>
    <text x="318" y="266" font-size="10.5" fill="#555">[2, 2, 2, 1, 4, 3, 3, 9, 6]</text>

    <rect x="66" y="276" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5"/>
    <text x="104" y="294" text-anchor="middle" font-size="11" fill="#8a6a20">7</text>
    <rect x="142" y="276" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5"/>
    <text x="180" y="294" text-anchor="middle" font-size="11" fill="#8a6a20">1</text>
    <rect x="218" y="276" width="86" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5"/>
    <text x="261" y="294" text-anchor="middle" font-size="10" fill="#8a6a20">③ v = 7</text>
    <text x="318" y="294" font-size="10.5" fill="#555">[2, 2, 2, 1, 4, 3, 3, 9, 6, 7]</text>

    <rect x="66" y="304" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5"/>
    <text x="104" y="322" text-anchor="middle" font-size="11" fill="#8a6a20">19</text>
    <rect x="142" y="304" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5"/>
    <text x="180" y="322" text-anchor="middle" font-size="11" fill="#8a6a20">1</text>
    <rect x="218" y="304" width="86" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5"/>
    <text x="261" y="322" text-anchor="middle" font-size="10" fill="#8a6a20">③ v = 19</text>
    <text x="318" y="322" font-size="10.5" fill="#555">[2, 2, 2, 1, 4, 3, 3, 9, 6, 7, 19]</text>
  </g>

  <path d="M 40 340 L 596 340" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <rect x="66" y="354" width="524" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="10" filter="url(#rough2)"/>
  <text x="80" y="374" font-size="11" fill="#8a3a36" font-weight="bold">输出 = [2,2,2,1,4,3,3,9,6,7,19]</text>
  <text x="80" y="392" font-size="10" fill="#7a4a48">前 9 个由 arr2 的名次决定（2 出现 3 次仍聚成一段），后 2 个 7、19 由升序决定</text>

  <text x="310" y="422" text-anchor="middle" font-size="10" fill="#999">注意第 ② 步用完 cnt[2] 后要清零，否则第 ③ 步会再吐出三个 2</text>
</svg>
