<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b">示例 2 走查：H = 10，workerTimes = [3, 2, 2, 4]</text>
  <path d="M 150 41 Q 320 50 490 41" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- panel 1: check(12) -->
  <rect x="30" y="58" width="288" height="286" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="174" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">check(12)：12 秒够不够？</text>

  <text x="76" y="106" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">工人</text>
  <text x="178" y="106" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">前缀耗时序列（秒）</text>
  <text x="278" y="106" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">最大 x</text>
  <path d="M 45 112 L 303 112" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="76" y="136" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">w=3</text>
  <text x="178" y="136" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">3, 9, <tspan fill="#bbb" text-decoration="line-through">18</tspan></text>
  <text x="278" y="136" text-anchor="middle" font-size="11.5" font-weight="bold" font-family="monospace" fill="#4a7a3a">2</text>

  <text x="76" y="164" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">w=2</text>
  <text x="178" y="164" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">2, 6, <tspan font-weight="bold" fill="#b85450">12</tspan></text>
  <text x="278" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" font-family="monospace" fill="#4a7a3a">3</text>

  <text x="76" y="192" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">w=2</text>
  <text x="178" y="192" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">2, 6, <tspan font-weight="bold" fill="#b85450">12</tspan></text>
  <text x="278" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" font-family="monospace" fill="#4a7a3a">3</text>

  <text x="76" y="220" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">w=4</text>
  <text x="178" y="220" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">4, <tspan font-weight="bold" fill="#b85450">12</tspan></text>
  <text x="278" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" font-family="monospace" fill="#4a7a3a">2</text>

  <path d="M 45 232 L 303 232" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="174" y="254" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333">Σx = 2+3+3+2 = 10 ≥ H</text>
  <rect x="60" y="268" width="228" height="58" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="174" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">✓ 可行 → 12 秒足够</text>
  <text x="174" y="310" text-anchor="middle" font-size="10.5" fill="#6a8a5a">每人都在 12 秒内做到了极致</text>

  <!-- panel 2: check(11) -->
  <rect x="322" y="58" width="288" height="286" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="466" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">check(11)：11 秒够不够？</text>

  <text x="368" y="106" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">工人</text>
  <text x="470" y="106" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">前缀耗时序列（秒）</text>
  <text x="570" y="106" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555">最大 x</text>
  <path d="M 337 112 L 595 112" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="368" y="136" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">w=3</text>
  <text x="470" y="136" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">3, 9, <tspan fill="#bbb" text-decoration="line-through">18</tspan></text>
  <text x="570" y="136" text-anchor="middle" font-size="11.5" font-weight="bold" font-family="monospace" fill="#b85450">2</text>

  <text x="368" y="164" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">w=2</text>
  <text x="470" y="164" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">2, 6, <tspan fill="#bbb" text-decoration="line-through">12</tspan></text>
  <text x="570" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" font-family="monospace" fill="#b85450">2</text>

  <text x="368" y="192" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">w=2</text>
  <text x="470" y="192" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">2, 6, <tspan fill="#bbb" text-decoration="line-through">12</tspan></text>
  <text x="570" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" font-family="monospace" fill="#b85450">2</text>

  <text x="368" y="220" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">w=4</text>
  <text x="470" y="220" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">4, <tspan fill="#bbb" text-decoration="line-through">12</tspan></text>
  <text x="570" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" font-family="monospace" fill="#b85450">1</text>

  <path d="M 337 232 L 595 232" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="466" y="254" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#333">Σx = 2+2+2+1 = 7 &lt; H</text>
  <rect x="352" y="268" width="228" height="58" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="466" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">✗ 不可行 → 11 秒不够</text>
  <text x="466" y="310" text-anchor="middle" font-size="10.5" fill="#a06a66">还差 3 单位没着落</text>

  <!-- bottom note -->
  <rect x="60" y="368" width="520" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="320" y="392" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">可行性恰在 T = 12 翻转 → 答案 = 12</text>
  <text x="320" y="414" text-anchor="middle" font-size="10.5" fill="#7a5415">答案必是某个「前缀完成时刻」w·k(k+1)/2：</text>
  <text x="320" y="434" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">12 = 2·(1+2+3) = 4·(1+2)</text>
  <text x="320" y="450" text-anchor="middle" font-size="10" fill="#a08040">（对应示例 2 官方解释：9, 12, 12, 12 → max = 12）</text>
</svg>
