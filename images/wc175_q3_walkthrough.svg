<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：三次记录、三次查询</text>
  <text x="330" y="47" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">记录后数组始终有序；查询只改「块划分」与「两个下标」</text>

  <rect x="24" y="58" width="612" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="78" text-anchor="middle" font-size="10" fill="#2f4560" font-weight="bold" filter="url(#rough2)">操作</text>
  <text x="324" y="78" text-anchor="middle" font-size="10" fill="#2f4560" font-weight="bold" filter="url(#rough2)">有序数组 a</text>
  <text x="484" y="78" text-anchor="middle" font-size="10" fill="#2f4560" font-weight="bold" filter="url(#rough2)">块划分</text>
  <text x="596" y="78" text-anchor="middle" font-size="10" fill="#2f4560" font-weight="bold" filter="url(#rough2)">输出</text>

  <rect x="24" y="88" width="612" height="36" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="111" font-size="9.5" fill="#444" filter="url(#rough2)">recordTweet("tweet3", 0)</text>
  <text x="324" y="111" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">[0]</text>
  <text x="484" y="111" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">—</text>
  <text x="596" y="111" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">—</text>

  <rect x="24" y="124" width="612" height="36" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="147" font-size="9.5" fill="#444" filter="url(#rough2)">recordTweet("tweet3", 60)</text>
  <text x="324" y="147" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">[0, 60]</text>
  <text x="484" y="147" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">—</text>
  <text x="596" y="147" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">—</text>

  <rect x="24" y="160" width="612" height="36" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="183" font-size="9.5" fill="#444" filter="url(#rough2)">recordTweet("tweet3", 10)</text>
  <text x="324" y="183" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">[0, 10, 60]</text>
  <text x="484" y="183" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">—</text>
  <text x="596" y="183" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">—</text>

  <rect x="24" y="196" width="612" height="36" fill="#f3faf4" stroke="#cfe3d2" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="219" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">minute, [0, 59]</text>
  <text x="324" y="219" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">[0, 10, 60]</text>
  <text x="484" y="219" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">[0,59] 共 1 块</text>
  <text x="596" y="219" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">[2]</text>

  <rect x="24" y="232" width="612" height="36" fill="#f3faf4" stroke="#cfe3d2" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="255" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">minute, [0, 60]</text>
  <text x="324" y="255" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">[0, 10, 60]</text>
  <text x="484" y="255" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">[0,59]｜[60,60]</text>
  <text x="596" y="255" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">[2,1]</text>

  <rect x="24" y="268" width="612" height="36" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="291" font-size="9.5" fill="#444" filter="url(#rough2)">recordTweet("tweet3", 120)</text>
  <text x="324" y="291" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">[0, 10, 60, 120]</text>
  <text x="484" y="291" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">—</text>
  <text x="596" y="291" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">—</text>

  <rect x="24" y="304" width="612" height="36" fill="#f3faf4" stroke="#cfe3d2" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="327" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">hour, [0, 210]</text>
  <text x="324" y="327" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">[0, 10, 60, 120]</text>
  <text x="484" y="327" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">[0,210] 共 1 块</text>
  <text x="596" y="327" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">[4]</text>

  <text x="330" y="364" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">注意 [0,60]：区间长度等于块长，块数是 2 而不是 1，末块只剩一个时间点</text>
  <text x="330" y="382" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">hour 的 chunk = 3600 &gt; 210，整个区间装不满一块，四条推文全部落在同一块</text>
</svg>
