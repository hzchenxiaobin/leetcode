<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    删一个元素 ⇔ 最多含一个 0 的最长窗口
  </text>

  <!-- 数组 -->
  <g filter="url(#rough2)" font-size="15">
    <rect x="60" y="80" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="104" y="80" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="148" y="80" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6"/>
    <rect x="192" y="80" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="236" y="80" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="280" y="80" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="324" y="80" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6"/>
    <rect x="368" y="80" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="412" y="80" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="82" y="108" text-anchor="middle" fill="#446688">1</text>
    <text x="126" y="108" text-anchor="middle" fill="#446688">1</text>
    <text x="170" y="108" text-anchor="middle" fill="#b85450">0</text>
    <text x="214" y="108" text-anchor="middle" fill="#446688">1</text>
    <text x="258" y="108" text-anchor="middle" fill="#446688">1</text>
    <text x="302" y="108" text-anchor="middle" fill="#446688">1</text>
    <text x="346" y="108" text-anchor="middle" fill="#b85450">0</text>
    <text x="390" y="108" text-anchor="middle" fill="#446688">1</text>
    <text x="434" y="108" text-anchor="middle" fill="#446688">1</text>
  </g>
  <text x="258" y="66" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">nums（窗口合法性：内部 0 的个数 ≤ 1）</text>

  <!-- 窗口括线 -->
  <g filter="url(#rough2)">
    <path d="M 104 140 L 104 152 L 368 152 L 368 140" stroke="#4a7a3a" stroke-width="2.4" fill="none"/>
    <path d="M 262 158 L 262 170" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)"/>
  </g>
  <text x="238" y="186" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">窗口长度 7（含一个 0）</text>

  <!-- 删除动作 -->
  <g filter="url(#rough2)">
    <path d="M 346 76 C 346 52, 322 46, 312 44" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="286" y="38" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">删掉窗口里的这个 0</text>

  <!-- 剩余段 -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="104" y="212" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="148" y="212" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="192" y="212" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="236" y="212" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="280" y="212" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="324" y="212" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="126" y="236" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="170" y="236" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="214" y="236" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="258" y="236" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="302" y="236" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="346" y="236" text-anchor="middle" fill="#2f5a24">1</text>
  </g>
  <text x="236" y="272" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">删后全 1 段长度 = 7 − 1 = 6</text>

  <!-- 结论框 -->
  <rect x="86" y="288" width="348" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">
    答案 = (最多含一个 0 的最长窗口) − 1
  </text>
  <text x="260" y="334" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    「必须删一个」统一折算为减一：含 0 删 0，全 1 删 1
  </text>
</svg>
