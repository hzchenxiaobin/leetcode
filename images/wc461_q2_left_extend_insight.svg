<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：平衡装运向左扩展，依然平衡</text>

  <!-- 步骤①：并入元素 -->
  <text x="320" y="56" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">① 已有平衡装运 [5, 1]，把左边的 2 也并进来</text>

  <!-- 数组格子 -->
  <rect x="185" y="78" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="209" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="262" y="78" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="286" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="322" y="78" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="346" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 原装运虚线框 -->
  <rect x="254" y="70" width="124" height="56" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="316" y="146" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">原装运：末尾 1 &lt; max 5 ✓</text>

  <!-- 并入箭头 -->
  <path d="M233,98 L252,98" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="242" y="88" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">并入</text>

  <text x="320" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">合并后 [2,5,1]：max = 5 不变，末尾 1 仍 &lt; 5，<tspan font-weight="bold" fill="#4a7a3a">依然平衡 ✓</tspan></text>

  <!-- 公式说明框 -->
  <rect x="60" y="196" width="520" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">对任意 a′ &lt; a：max(w[a′..b]) ≥ max(w[a..b]) &gt; w[b]</text>
  <text x="320" y="246" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">末尾 w[b] 不动、段最大值只增不减 ⟹ 左扩展永远保持平衡</text>

  <!-- 推论框 -->
  <rect x="60" y="284" width="520" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">推论：「结束最早的平衡装运」不必枚举起点</text>
  <text x="320" y="328" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">从当前断点向右扫描，维护段内前缀最大值 curMax，</text>
  <text x="320" y="348" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">第一次遇到 w &lt; curMax 的位置，就是全局最早的闭合点</text>
</svg>
