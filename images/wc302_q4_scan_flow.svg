<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次 gcd 折叠 + 升序扫描</text>

  <!-- step 1 -->
  <rect x="170" y="40" width="230" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="58" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 折叠 g = gcd(numsDivide)</text>
  <text x="285" y="76" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">O(m log V)，起点 g = 0</text>
  <path d="M 285 88 L 285 106" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="170" y="110" width="230" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="134" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② nums 升序排序 O(n log n)</text>
  <path d="M 285 154 L 285 172" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="230" y="176" width="110" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="196" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i = 0</text>
  <path d="M 285 212 L 285 230" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1: end? -->
  <polygon points="285,232 400,270 285,308 170,270" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="268" text-anchor="middle" font-size="12" fill="#a08030" font-weight="bold" filter="url(#rough2)">扫到末尾？</text>
  <text x="285" y="286" text-anchor="middle" font-size="10" fill="#a08030" filter="url(#rough2)">i = n ?</text>

  <path d="M 402 270 L 436 270" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="417" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">是</text>
  <rect x="440" y="248" width="196" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="538" y="266" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">return −1</text>
  <text x="538" y="284" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">没有元素整除 g</text>

  <path d="M 285 310 L 285 328" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="324" font-size="10" fill="#888" filter="url(#rough2)">否</text>

  <!-- diamond 2: divides g? -->
  <polygon points="285,332 425,372 285,412 145,372" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="377" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">g % nums[i] == 0 ?</text>

  <path d="M 427 372 L 458 372" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="441" y="364" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">是</text>
  <rect x="462" y="350" width="178" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="551" y="368" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return i</text>
  <text x="551" y="386" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">答案 = 已跳过的更小元素数</text>

  <path d="M 143 372 L 118 372" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="364" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否</text>
  <rect x="38" y="356" width="78" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="77" y="376" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">i++</text>
  <path d="M 77 354 L 77 270 L 166 270" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- side notes -->
  <rect x="444" y="56" width="204" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="546" y="78" text-anchor="middle" font-size="11" fill="#a08030" font-weight="bold" filter="url(#rough2)">💡 两个偷懒点</text>
  <text x="546" y="100" text-anchor="middle" font-size="10.5" fill="#a08030" filter="url(#rough2)">· 不必模拟删除：</text>
  <text x="546" y="117" text-anchor="middle" font-size="10.5" fill="#a08030" filter="url(#rough2)">答案 = 严格小于 x* 的</text>
  <text x="546" y="134" text-anchor="middle" font-size="10.5" fill="#a08030" filter="url(#rough2)">元素个数 = 命中下标</text>
  <text x="546" y="156" text-anchor="middle" font-size="10.5" fill="#a08030" filter="url(#rough2)">· 升序扫描一旦</text>
  <text x="546" y="173" text-anchor="middle" font-size="10.5" fill="#a08030" filter="url(#rough2)">nums[i] &gt; g，其后更大</text>
  <text x="546" y="190" text-anchor="middle" font-size="10.5" fill="#a08030" filter="url(#rough2)">⟹ 可直接 return −1</text>
</svg>
