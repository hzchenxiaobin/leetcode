<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, 2, 3, 3, 3]，target = 3</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">命中 3 次，最终三个合法下标各得 1/3</text>

  <g filter="url(#rough2)">
    <rect x="40" y="70" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="85" y="92" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">扫描位置 i</text>
    <text x="172" y="92" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">是否命中</text>
    <text x="250" y="92" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">cnt</text>
    <text x="402" y="92" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">ans 的概率分布</text>

    <rect x="40" y="104" width="480" height="62" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <text x="85" y="140" text-anchor="middle" font-size="11" fill="#444">i = 2</text>
    <text x="172" y="140" text-anchor="middle" font-size="10.5" fill="#3a5a30">命中 #1</text>
    <text x="250" y="140" text-anchor="middle" font-size="11" fill="#444">1</text>
    <text x="402" y="140" text-anchor="middle" font-size="10.5" fill="#8a3a36">P(ans=2) = 1</text>

    <rect x="40" y="166" width="480" height="62" fill="#e6f4ea" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <text x="85" y="202" text-anchor="middle" font-size="11" fill="#444">i = 3</text>
    <text x="172" y="202" text-anchor="middle" font-size="10.5" fill="#3a5a30">命中 #2</text>
    <text x="250" y="202" text-anchor="middle" font-size="11" fill="#444">2</text>
    <text x="402" y="202" text-anchor="middle" font-size="10.5" fill="#8a3a36">P(2)=1/2，P(3)=1/2</text>

    <rect x="40" y="228" width="480" height="62" fill="#fff8e1" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <text x="85" y="264" text-anchor="middle" font-size="11" fill="#444">i = 4</text>
    <text x="172" y="264" text-anchor="middle" font-size="10.5" fill="#8a6a20">命中 #3</text>
    <text x="250" y="264" text-anchor="middle" font-size="11" fill="#444">3</text>
    <text x="402" y="264" text-anchor="middle" font-size="10.5" fill="#8a6a20">P(2)=P(3)=P(4)=1/3</text>

    <rect x="40" y="290" width="480" height="62" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3"/>
    <text x="85" y="326" text-anchor="middle" font-size="11" fill="#444">扫完</text>
    <text x="172" y="326" text-anchor="middle" font-size="10.5" fill="#888">—</text>
    <text x="250" y="326" text-anchor="middle" font-size="11" fill="#444">3</text>
    <text x="402" y="326" text-anchor="middle" font-size="10.5" fill="#3a5a30">返回 ans，三者各 1/3 ✓</text>
  </g>

  <path d="M 130 70 L 130 352" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 215 70 L 215 352" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 285 70 L 285 352" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">第 j 个命中以 1/j 替换，前面每个下标被保留的概率就是 (1/m) × ∏(k−1)/k</text>
  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">算出来同样是 1/3：越晚的命中越难替换，乘积正好把偏差抵消掉</text>
</svg>
