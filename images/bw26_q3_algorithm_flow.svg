<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    dfs(node, pathMax)：判定 → 更新 → 下传
  </text>

  <!-- 入口 -->
  <rect x="150" y="56" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="260" y="80" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">
    dfs(root, pathMax = −∞)
  </text>

  <path d="M 260 94 L 260 118" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 空节点判断 -->
  <polygon points="260,120 340,150 260,180 180,150" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="155" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    node 为空？
  </text>

  <path d="M 180 150 L 120 150" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="140" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="40" y="134" width="78" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="79" y="155" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">return 0</text>

  <path d="M 260 180 L 260 202" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="194" font-size="13" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 判定 -->
  <polygon points="260,204 346,240 260,276 174,240" fill="#fff8e1" stroke="#d6a040"
           stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    val ≥ pathMax ?
  </text>

  <path d="M 174 240 L 112 240" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="230" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="30" y="226" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"
        filter="url(#rough2)"/>
  <text x="70" y="245" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">cnt = 0</text>

  <path d="M 346 240 L 408 240" stroke="#4a7a3a" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="230" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="410" y="226" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"
        filter="url(#rough2)"/>
  <text x="450" y="245" text-anchor="middle" font-size="12" fill="#2f5a24" filter="url(#rough2)">cnt = 1</text>

  <!-- 更新与下传 -->
  <path d="M 70 254 C 70 288, 150 296, 224 298" stroke="#b85450" stroke-width="1.6" fill="none"
        filter="url(#rough2)"/>
  <path d="M 450 254 C 450 288, 370 296, 296 298" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        filter="url(#rough2)"/>

  <rect x="100" y="300" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"
        filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">
    nxt = max(pathMax, val)，递归左右子树
  </text>

  <path d="M 420 317 C 460 317, 470 240, 348 238" stroke="#446688" stroke-width="1.4" fill="none"
        stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- 底部 -->
  <rect x="100" y="336" width="0" height="0" fill="none" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">
    返回 cnt + dfs(left, nxt) + dfs(right, nxt)，O(n) 一次遍历
  </text>
</svg>
