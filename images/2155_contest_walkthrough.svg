<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：nums = [0,0,1,0] 的五个切点</text>
  <path d="M 150 40 Q 340 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="45" y="62" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="85" y="62" width="95" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="180" y="62" width="95" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="275" y="62" width="75" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="350" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="430" y="62" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="485" y="62" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="65" y="81">切点 i</text>
    <text x="132" y="81">numsleft</text>
    <text x="227" y="81">numsright</text>
    <text x="312" y="81">leftZeros</text>
    <text x="390" y="81">rightOnes</text>
    <text x="457" y="81">score</text>
    <text x="560" y="81">更新（为下一格）</text>
  </g>

  <!-- table rows -->
  <g filter="url(#sk)">
    <rect x="45" y="92" width="40" height="30" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="85" y="92" width="95" height="30" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="180" y="92" width="95" height="30" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="275" y="92" width="75" height="30" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="350" y="92" width="80" height="30" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="430" y="92" width="55" height="30" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="485" y="92" width="150" height="30" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>

    <rect x="45" y="122" width="40" height="30" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="85" y="122" width="95" height="30" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="180" y="122" width="95" height="30" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="275" y="122" width="75" height="30" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="350" y="122" width="80" height="30" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="430" y="122" width="55" height="30" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="485" y="122" width="150" height="30" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1"/>

    <rect x="45" y="152" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="85" y="152" width="95" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="180" y="152" width="95" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="275" y="152" width="75" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="350" y="152" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="430" y="152" width="55" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="485" y="152" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>

    <rect x="45" y="182" width="40" height="30" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="85" y="182" width="95" height="30" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="180" y="182" width="95" height="30" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="275" y="182" width="75" height="30" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="350" y="182" width="80" height="30" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="430" y="182" width="55" height="30" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>
    <rect x="485" y="182" width="150" height="30" fill="#fff" stroke="#9a9a9a" stroke-width="1"/>

    <rect x="45" y="212" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="85" y="212" width="95" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="180" y="212" width="95" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="275" y="212" width="75" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="350" y="212" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="430" y="212" width="55" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="485" y="212" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>

  <!-- row 0 -->
  <g font-size="12" text-anchor="middle">
    <text x="65" y="112" font-weight="bold" fill="#333">0</text>
    <text x="132" y="112" fill="#333" font-family="monospace">[]</text>
    <text x="227" y="112" fill="#333" font-family="monospace">[0,0,1,0]</text>
    <text x="312" y="112" fill="#333" font-family="monospace">0</text>
    <text x="390" y="112" fill="#333" font-family="monospace">1</text>
    <text x="457" y="112" font-weight="bold" fill="#333" font-family="monospace">1</text>
    <text x="560" y="112" font-size="11" fill="#555">吃 0 → leftZeros＋1</text>
  </g>
  <!-- row 1 -->
  <g font-size="12" text-anchor="middle">
    <text x="65" y="142" font-weight="bold" fill="#333">1</text>
    <text x="132" y="142" fill="#333" font-family="monospace">[0]</text>
    <text x="227" y="142" fill="#333" font-family="monospace">[0,1,0]</text>
    <text x="312" y="142" fill="#333" font-family="monospace">1</text>
    <text x="390" y="142" fill="#333" font-family="monospace">1</text>
    <text x="457" y="142" font-weight="bold" fill="#333" font-family="monospace">2</text>
    <text x="560" y="142" font-size="11" fill="#555">吃 0 → leftZeros＋1</text>
  </g>
  <!-- row 2 (max) -->
  <g font-size="12" text-anchor="middle">
    <text x="65" y="172" font-weight="bold" fill="#1e5e1e">2</text>
    <text x="132" y="172" fill="#333" font-family="monospace">[0,0]</text>
    <text x="227" y="172" fill="#333" font-family="monospace">[1,0]</text>
    <text x="312" y="172" fill="#333" font-family="monospace">2</text>
    <text x="390" y="172" fill="#333" font-family="monospace">1</text>
    <text x="457" y="172" font-weight="bold" fill="#b85450" font-family="monospace" font-size="13">3 ★</text>
    <text x="560" y="172" font-size="11" fill="#555">吃 1 → rightOnes−1</text>
  </g>
  <!-- row 3 -->
  <g font-size="12" text-anchor="middle">
    <text x="65" y="202" font-weight="bold" fill="#333">3</text>
    <text x="132" y="202" fill="#333" font-family="monospace">[0,0,1]</text>
    <text x="227" y="202" fill="#333" font-family="monospace">[0]</text>
    <text x="312" y="202" fill="#333" font-family="monospace">2</text>
    <text x="390" y="202" fill="#333" font-family="monospace">0</text>
    <text x="457" y="202" font-weight="bold" fill="#333" font-family="monospace">2</text>
    <text x="560" y="202" font-size="11" fill="#555">吃 0 → leftZeros＋1</text>
  </g>
  <!-- row 4 (max) -->
  <g font-size="12" text-anchor="middle">
    <text x="65" y="232" font-weight="bold" fill="#1e5e1e">4</text>
    <text x="132" y="232" fill="#333" font-family="monospace">[0,0,1,0]</text>
    <text x="227" y="232" fill="#333" font-family="monospace">[]</text>
    <text x="312" y="232" fill="#333" font-family="monospace">3</text>
    <text x="390" y="232" fill="#333" font-family="monospace">0</text>
    <text x="457" y="232" font-weight="bold" fill="#b85450" font-family="monospace" font-size="13">3 ★</text>
    <text x="560" y="232" font-size="11" fill="#555">—（i = n 收尾）</text>
  </g>

  <!-- walk section -->
  <text x="45" y="276" font-size="13" font-weight="bold" fill="#2b2b2b">得分游走：0 上坡、1 下坡，峰值平台即答案</text>
  <g filter="url(#sk)">
    <path d="M 110 312 L 640 312" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="5,4"/>
    <path d="M 110 347 L 640 347" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="5,4"/>
    <path d="M 110 382 L 640 382" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="5,4"/>
    <path d="M 140 382 L 260 347 L 380 312 L 500 347 L 620 312" stroke="#446688" stroke-width="2.2" fill="none"/>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="102" y="316">3</text>
    <text x="102" y="351">2</text>
    <text x="102" y="386">1</text>
  </g>
  <g filter="url(#sk)">
    <circle cx="140" cy="382" r="5" fill="#8a8a8a"/>
    <circle cx="260" cy="347" r="5" fill="#8a8a8a"/>
    <circle cx="380" cy="312" r="5.5" fill="#b85450" stroke="#fff" stroke-width="1.5"/>
    <circle cx="500" cy="347" r="5" fill="#8a8a8a"/>
    <circle cx="620" cy="312" r="5.5" fill="#b85450" stroke="#fff" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle">
    <text x="140" y="368" font-size="11.5" fill="#666">1</text>
    <text x="260" y="333" font-size="11.5" fill="#666">2</text>
    <text x="380" y="298" font-size="13" font-weight="bold" fill="#b85450">3</text>
    <text x="500" y="333" font-size="11.5" fill="#666">2</text>
    <text x="620" y="298" font-size="13" font-weight="bold" fill="#b85450">3</text>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="bold">
    <text x="200" y="357" fill="#2e6e2e">＋1</text>
    <text x="320" y="330" fill="#2e6e2e">＋1（吃 0）</text>
    <text x="440" y="330" fill="#a04038">−1（吃 1）</text>
    <text x="560" y="330" fill="#2e6e2e">＋1</text>
  </g>
  <g text-anchor="middle">
    <text x="140" y="404" font-size="11.5" fill="#777">i=0</text>
    <text x="260" y="404" font-size="11.5" fill="#777">i=1</text>
    <text x="380" y="404" font-size="12" font-weight="bold" fill="#b85450">i=2</text>
    <text x="500" y="404" font-size="11.5" fill="#777">i=3</text>
    <text x="620" y="404" font-size="12" font-weight="bold" fill="#b85450">i=4</text>
  </g>

  <!-- callout -->
  <g filter="url(#sk)">
    <rect x="45" y="422" width="590" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="442" text-anchor="middle" font-size="12" fill="#444">i=2 与 i=4 并列最高（3 分）：i=2 右侧 1 尚在，i=4 左侧 0 吃满</text>
  <text x="340" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">两条不同来路凑出同一峰值 ⟹ 答案 [2, 4]</text>
</svg>
