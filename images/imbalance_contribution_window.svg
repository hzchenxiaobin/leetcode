<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="430" fill="#fdfcf7"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">贡献法：每个下标 j 独占一个 (l, r) 矩形</text>
  <path d="M 180 42 Q 350 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Array cells -->
  <text x="350" y="76" text-anchor="middle" font-size="12" fill="#555">nums = [2, 3, 1, 4]，取 j = 1（v = 3，需数「v−1 = 2 缺席」的子数组）：</text>

  <!-- index labels -->
  <text x="170" y="122" text-anchor="middle" font-size="11" fill="#999">下标 0</text>
  <text x="310" y="122" text-anchor="middle" font-size="11" fill="#999">下标 1 (j)</text>
  <text x="450" y="122" text-anchor="middle" font-size="11" fill="#999">下标 2</text>
  <text x="590" y="122" text-anchor="middle" font-size="11" fill="#999">下标 3</text>

  <!-- cells: 2 (blue, contains v-1), 3 (red, j), 1 (green), 4 (green) -->
  <g filter="url(#sk)">
    <rect x="130" y="130" width="80" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="270" y="130" width="80" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="410" y="130" width="80" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="550" y="130" width="80" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="170" y="158" text-anchor="middle" font-size="15" fill="#33507a">2</text>
  <text x="310" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">3</text>
  <text x="450" y="158" text-anchor="middle" font-size="15" fill="#2e6e2e">1</text>
  <text x="590" y="158" text-anchor="middle" font-size="15" fill="#2e6e2e">4</text>
  <text x="170" y="190" text-anchor="middle" font-size="11" fill="#446688">v−1 = 2 在场</text>
  <text x="310" y="190" text-anchor="middle" font-size="11" fill="#b85450">j = 1</text>

  <!-- L and q barriers -->
  <line x1="266" y1="206" x2="266" y2="238" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" filter="url(#sk)"/>
  <text x="266" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">L = 0（j 左边最近的阻碍：同值 p 或 v−1）</text>
  <line x1="634" y1="206" x2="634" y2="238" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6,4" filter="url(#sk)"/>
  <text x="634" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">q = 4（j 右边第一个 v−1）</text>

  <!-- l range -->
  <path d="M 268 226 Q 300 220 308 226" stroke="#b85450" stroke-width="1.6" fill="none" marker-start="url(#ar)" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="288" y="216" text-anchor="middle" font-size="11.5" fill="#b85450">l 只能取 1</text>
  <!-- r range -->
  <path d="M 312 226 Q 470 218 630 226" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-start="url(#ar)" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="216" text-anchor="middle" font-size="11.5" fill="#4a7a3a">r ∈ [1, 3] 共 3 种</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="90" y="272" width="520" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="350" y="297" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33507a">f(j) = (j − L) × (q − j) = 1 × 3 = 3</text>

  <!-- check -->
  <g filter="url(#sk)">
    <rect x="90" y="326" width="520" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="350" y="349" text-anchor="middle" font-size="12" fill="#7a5415">验证：以 j = 1 为「3 的首次出现」且不含 2 的子数组：</text>
  <text x="350" y="370" text-anchor="middle" font-size="12" fill="#7a5415">[3]、[3,1]、[3,1,4] —— 恰好 3 个 ✓</text>

  <text x="350" y="412" text-anchor="middle" font-size="11.5" fill="#888">Σf(j) 再减去每个子数组多算的 1（即 D − 1 中的 1）：ans = Σf(j) − n(n+1)/2</text>
</svg>
