<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="500" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一个循环 + 一次库 insert，无分支、无特判</text>
  <path d="M 120 36 Q 310 46 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- 开始 -->
  <rect x="272" y="50" width="76" height="28" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="69" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">开始</text>
  <path d="M 310 80 V 96" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- target = [] -->
  <rect x="248" y="100" width="124" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="120" text-anchor="middle" font-size="12.5" fill="#333">target = [ ]</text>
  <path d="M 310 132 V 148" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- i = 0 -->
  <rect x="272" y="152" width="76" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="171" text-anchor="middle" font-size="12.5" fill="#333">i = 0</text>
  <path d="M 310 182 V 200" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- 判定 -->
  <polygon points="310,204 388,244 310,284 232,244" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="249" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a4a20">i &lt; n ?</text>
  <text x="322" y="300" font-size="11" fill="#666">是</text>
  <path d="M 310 284 V 302" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- 否 → 返回 -->
  <text x="214" y="238" font-size="11" fill="#666">否</text>
  <path d="M 232 244 H 140 V 258" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <rect x="68" y="262" width="144" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="282" text-anchor="middle" font-size="12.5" fill="#333">返回 target</text>
  <path d="M 140 294 V 312" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <rect x="104" y="316" width="72" height="28" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">结束</text>

  <!-- 读取 -->
  <rect x="222" y="306" width="176" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="327" text-anchor="middle" font-size="12.5" fill="#333">读取 nums[i] 与 index[i]</text>
  <path d="M 310 340 V 358" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- insert（核心一步） -->
  <rect x="182" y="362" width="256" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="310" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">target.insert(index[i], nums[i])</text>
  <path d="M 310 402 V 420" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- i++ -->
  <rect x="272" y="424" width="76" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="443" text-anchor="middle" font-size="12.5" fill="#333">i = i + 1</text>

  <!-- 循环回边 -->
  <path d="M 348 438 H 468 V 244 H 396" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="476" y="348" font-size="11" fill="#888">下一轮</text>

  <!-- 底部注记 -->
  <rect x="28" y="430" width="230" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="143" y="451" text-anchor="middle" font-size="10.5" fill="#b85450">n ≤ 100 ⟹ 总搬移 n(n−1)/2 ≈ 5×10³</text>
  <text x="143" y="471" text-anchor="middle" font-size="10.5" fill="#b85450">O(n²) 毫秒级 —— 签到题放心模拟</text>
</svg>
