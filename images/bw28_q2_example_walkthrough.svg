<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="269"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：两次 update 后矩阵的两副面孔</text>

  <!-- 初始矩阵 -->
  <text x="80" y="62" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">初始矩形</text>
  <g filter="url(#rough2)">
    <rect x="50" y="72" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="96" y="72" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="142" y="72" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="50" y="104" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="96" y="104" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="142" y="104" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="50" y="136" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="96" y="136" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="142" y="136" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="50" y="168" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="96" y="168" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="142" y="168" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <text y="93" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="73">1</tspan><tspan x="119">2</tspan><tspan x="165">1</tspan></text>
  <text y="125" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="73">4</tspan><tspan x="119">3</tspan><tspan x="165">4</tspan></text>
  <text y="157" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="73">3</tspan><tspan x="119">2</tspan><tspan x="165">1</tspan></text>
  <text y="189" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="73">1</tspan><tspan x="119">1</tspan><tspan x="165">1</tspan></text>

  <path d="M 200 130 L 232 130" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="118" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">update ①</text>
  <text x="216" y="150" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">(0,0,3,2,5)</text>

  <!-- 中间态 -->
  <text x="300" y="62" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 之后：整张变 5</text>
  <g filter="url(#rough2)">
    <rect x="270" y="72" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="316" y="72" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="362" y="72" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="270" y="104" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="316" y="104" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="362" y="104" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="270" y="136" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="316" y="136" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="362" y="136" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="270" y="168" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="316" y="168" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="362" y="168" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
  </g>
  <text y="189" font-size="11.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)"><tspan x="293">5</tspan><tspan x="339">5</tspan><tspan x="385">5</tspan></text>

  <path d="M 420 130 L 452 130" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="436" y="118" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">update ②</text>
  <text x="436" y="150" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">(3,0,3,2,10)</text>

  <!-- 终态 -->
  <text x="500" y="62" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② 后</text>
  <g filter="url(#rough2)">
    <rect x="462" y="72" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="508" y="72" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="462" y="104" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="508" y="104" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="462" y="136" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="508" y="136" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <rect x="462" y="168" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="508" y="168" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>

  <!-- 关键说明 -->
  <rect x="55" y="232" width="460" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="72" y="252" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后写入的矩形「盖在」先写入的之上——这正是逆序回放优先翻最新记录的原因</text>
  <text x="72" y="272" font-size="11" fill="#555" filter="url(#rough2)">update ② 只覆盖第 3 行，前 3 行仍是 ① 的 5；两副面孔对 getValue 的回答各不相同</text>

  <text x="60" y="312" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">对应官方示例：getValue(0,2)=1 → ① 后 5 → ② 后仍 5；getValue(3,1)=5 → ② 后 10</text>
</svg>
