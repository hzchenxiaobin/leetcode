<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>
  <text x="24" y="32" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">反例：三角形（奇环）一定冲突</text>
  <line x1="250" y1="72" x2="170" y2="226" stroke="#9aa7b4" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="250" y1="72" x2="330" y2="226" stroke="#9aa7b4" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="170" y1="226" x2="330" y2="226" stroke="#9aa7b4" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="250" cy="72" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="78" text-anchor="middle" font-size="15" fill="#2c4a63" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="170" cy="226" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="232" text-anchor="middle" font-size="15" fill="#8a6410" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="330" cy="226" r="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="232" text-anchor="middle" font-size="15" fill="#8d3b37" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="376" y="220" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">必须与 1、2 都异色</text>
  <text x="376" y="240" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">⇒ 需要第 3 种颜色</text>
  <rect x="40" y="290" width="500" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290.0" y="312.2" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">1 → A，2 → B，则 3 既不能是 A 也不能是 B</text>
  <text x="290.0" y="332.2" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">两人一组只有两种颜色 ⇒ 无解，返回 false</text>
  <text x="250" y="60" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">两两都不喜欢</text>
</svg>
