<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">合法形态只有 010 与 101：枚举中间那个字符</text>

  <!-- 字符串 -->
  <text x="280" y="66" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">s = "0 0 1 1 0 1"，选中 s[j]（j = 2，字符 1）作为「中间」</text>
  <g filter="url(#rough2)">
    <rect x="128" y="80" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="180" y="80" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="232" y="80" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="284" y="80" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="336" y="80" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="388" y="80" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle">
    <text x="152" y="106">0</text><text x="204" y="106">0</text>
    <text x="256" y="106" font-weight="bold" fill="#b85450">1</text>
    <text x="308" y="106">1</text><text x="360" y="106">0</text><text x="412" y="106">1</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="152" y="134">i=0</text><text x="204" y="134">i=1</text><text x="256" y="134">j=2</text><text x="308" y="134">i=3</text><text x="360" y="134">i=4</text><text x="412" y="134">i=5</text>
  </g>

  <!-- 左半：前缀里的 0 -->
  <path d="M 200 128 C 180 150, 160 158, 140 166" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="60" y="172" width="150" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="135" y="193" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">左边选 '0'</text>
  <text x="135" y="212" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">= 前缀里 0 的个数</text>

  <!-- 右半：后缀里的 0 -->
  <path d="M 368 128 C 388 150, 408 158, 428 166" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="356" y="172" width="150" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="431" y="193" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">右边选 '0'</text>
  <text x="431" y="212" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">= 后缀里 0 的个数</text>

  <!-- 中间结论 -->
  <rect x="216" y="172" width="134" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="283" y="193" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">以 j 为中心的</text>
  <text x="283" y="212" text-anchor="middle" font-size="13" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">010 方案数 = 左×右</text>

  <!-- 总公式 -->
  <rect x="70" y="248" width="420" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="14" fill="#33507a" font-weight="bold" filter="url(#rough2)">答案 = Σⱼ (左侧 1 数 × 右侧 1 数 + 左侧 0 数 × 右侧 0 数)</text>

  <rect x="100" y="306" width="360" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="331" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">一遍扫描即可同时维护：六个计数器按「先长后短」更新</text>
</svg>
