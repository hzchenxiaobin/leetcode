<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">示例 1 演算：nums = [6,2,8,4]，三种首步走法</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">首步只能在前三个 6、2、8 里删两个，代价为两者最大值</text>
  <rect x="150" y="72" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176.0" y="97.76" text-anchor="middle" font-size="16" fill="#333333" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="210" y="72" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236.0" y="97.76" text-anchor="middle" font-size="16" fill="#333333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="270" y="72" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="296.0" y="97.76" text-anchor="middle" font-size="16" fill="#333333" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="330" y="72" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356.0" y="97.76" text-anchor="middle" font-size="16" fill="#333333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="396" y="98" text-anchor="start" font-size="9.5" fill="#888888" filter="url(#rough2)">剩余前缀</text>
  <rect x="50" y="150" width="460" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="66" y="172" text-anchor="start" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">删 6 与 2</text>
  <text x="196" y="172" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">代价 max(6,2) = 6</text>
  <text x="66" y="194" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">剩 [8,4] → 一并删，代价 8</text>
  <text x="430" y="188" text-anchor="middle" font-size="12" fill="#666666" font-weight="bold" filter="url(#rough2)">合计 14</text>
  <rect x="50" y="228" width="460" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="10" filter="url(#rough2)"/>
  <text x="66" y="250" text-anchor="start" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">删 6 与 8</text>
  <text x="196" y="250" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">代价 max(6,8) = 8</text>
  <text x="66" y="272" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">剩 [2,4] → 一并删，代价 4</text>
  <text x="430" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 12</text>
  <rect x="50" y="306" width="460" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="66" y="328" text-anchor="start" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">删 2 与 8</text>
  <text x="196" y="328" text-anchor="start" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">代价 max(2,8) = 8</text>
  <text x="66" y="350" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">剩 [6,4] → 一并删，代价 6</text>
  <text x="430" y="344" text-anchor="middle" font-size="12" fill="#666666" font-weight="bold" filter="url(#rough2)">合计 14</text>
  <text x="280" y="396" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">最优首步删 6 与 8，总代价 8 + 4 = 12</text>
</svg>
