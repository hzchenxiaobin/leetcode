<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">状态转移：在「祖先已选 j 次②」时，节点 u 的两种收法</text>
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">记 c = coins[u] &gt;&gt; j 为 u 的实际金币</text>

  <!-- node u -->
  <rect x="200" y="72" width="160" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">节点 u（状态 j）</text>
  <text x="280" y="112" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">实际金币 c = coins[u] &gt;&gt; j</text>

  <!-- arrows to two choices -->
  <path d="M 245 122 C 200 135, 175 140, 155 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 315 122 C 360 135, 385 140, 405 146" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- choice 1 -->
  <rect x="60" y="150" width="190" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="155" y="174" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">方法① 全收</text>
  <text x="155" y="196" text-anchor="middle" font-size="12" fill="#557" filter="url(#rough2)">自己得 c − k（可为负）</text>
  <text x="155" y="216" text-anchor="middle" font-size="12" fill="#557" filter="url(#rough2)">子树金币不变</text>
  <text x="155" y="236" text-anchor="middle" font-size="12" fill="#557" filter="url(#rough2)">孩子 v 继承状态 j</text>

  <!-- choice 2 -->
  <rect x="310" y="150" width="190" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="405" y="174" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">方法② 半收</text>
  <text x="405" y="196" text-anchor="middle" font-size="12" fill="#99741c" filter="url(#rough2)">自己得 ⌊c/2⌋ = coins[u] &gt;&gt; (j+1)</text>
  <text x="405" y="216" text-anchor="middle" font-size="12" fill="#99741c" filter="url(#rough2)">子树金币整体再减半</text>
  <text x="405" y="236" text-anchor="middle" font-size="12" fill="#99741c" filter="url(#rough2)">孩子 v 继承状态 j+1</text>

  <!-- child sums -->
  <path d="M 155 252 L 155 266" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 405 252 L 405 266" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="85" y="270" width="140" height="34" fill="#f2f2f2" stroke="#888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="155" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">Σ dp[v][j]</text>

  <rect x="335" y="270" width="140" height="34" fill="#f2f2f2" stroke="#888" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#99741c" filter="url(#rough2)">Σ dp[v][j+1]</text>

  <!-- merge into max -->
  <path d="M 155 306 C 175 320, 200 328, 225 334" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 405 306 C 385 320, 360 328, 335 334" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="115" y="336" width="330" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">dp[u][j] = max( ① , ② )</text>
  <text x="280" y="382" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">= max( c − k + Σ dp[v][j] ,  ⌊c/2⌋ + Σ dp[v][j+1] )</text>

  <text x="280" y="418" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">孩子先于 u 计算（逆 BFS 序自底向上），两种选择取较大者；j = 14 时用 min(j+1, 14) 封顶</text>
</svg>
