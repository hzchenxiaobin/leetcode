<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">示例 2 演算：tires = [[1,10],[2,2],[3,4]]，changeTime = 6，numLaps = 5</text>
  <text x="320" y="42" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">CAP = min(5, 18) = 5；「—」表示该轮胎在更短长度处已被截断（lap &gt; changeTime + f）</text>

  <!-- best 表 -->
  <rect x="60" y="54" width="110" height="24" fill="#f5f5f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="170" y="54" width="46" height="24" fill="#f5f5f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="216" y="54" width="46" height="24" fill="#f5f5f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="262" y="54" width="46" height="24" fill="#f5f5f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="308" y="54" width="46" height="24" fill="#f5f5f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="354" y="54" width="46" height="24" fill="#f5f5f0" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="115" y="70" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#555" filter="url(#rough2)">轮胎 (f, r)</text>
  <text x="193" y="70" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">x=1</text>
  <text x="239" y="70" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">x=2</text>
  <text x="285" y="70" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">x=3</text>
  <text x="331" y="70" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">x=4</text>
  <text x="377" y="70" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">x=5</text>

  <rect x="60" y="78" width="110" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="170" y="78" width="46" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="216" y="78" width="46" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="262" y="78" width="46" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="308" y="78" width="46" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="354" y="78" width="46" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="115" y="95" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(1,10)</text>
  <text x="193" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="239" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">11</text>
  <text x="285" y="95" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="331" y="95" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="377" y="95" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>

  <rect x="60" y="104" width="110" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="170" y="104" width="46" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="216" y="104" width="46" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="262" y="104" width="46" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="308" y="104" width="46" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="354" y="104" width="46" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="115" y="121" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(2,2)</text>
  <text x="193" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="239" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="285" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">14</text>
  <text x="331" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">30</text>
  <text x="377" y="121" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>

  <rect x="60" y="130" width="110" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="170" y="130" width="46" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="216" y="130" width="46" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="262" y="130" width="46" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="308" y="130" width="46" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="354" y="130" width="46" height="26" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="115" y="147" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(3,4)</text>
  <text x="193" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="239" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">15</text>
  <text x="285" y="147" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="331" y="147" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="377" y="147" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>

  <rect x="60" y="156" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="170" y="156" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="216" y="156" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="262" y="156" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="308" y="156" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="354" y="156" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="173" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">best[x]</text>
  <text x="193" y="173" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">1</text>
  <text x="239" y="173" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">6</text>
  <text x="285" y="173" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">14</text>
  <text x="331" y="173" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">30</text>
  <text x="377" y="173" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">∞</text>

  <text x="412" y="92" font-size="8.5" fill="#555" filter="url(#rough2)">(1,10)：第 2 圈后截断（lap 10 &gt; 6+1）</text>
  <text x="412" y="120" font-size="8.5" fill="#555" filter="url(#rough2)">(2,2)：第 4 圈后截断（lap 16 &gt; 6+2）</text>
  <text x="412" y="148" font-size="8.5" fill="#555" filter="url(#rough2)">(3,4)：第 2 圈后截断（lap 12 &gt; 6+3）</text>
  <text x="412" y="172" font-size="8.5" fill="#2e5b2e" filter="url(#rough2)">best[5] = ∞：没有轮胎能撑到 5 圈</text>

  <!-- dp 表 -->
  <text x="60" y="208" font-size="11" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">dp[i]：跑完前 i 圈的最少时间（j = 转移用的段长）</text>
  <text x="102" y="218" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="194" y="218" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">i=1</text>
  <text x="286" y="218" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">i=2</text>
  <text x="378" y="218" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">i=3</text>
  <text x="470" y="218" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">i=4</text>
  <text x="562" y="218" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">i=5</text>
  <rect x="60" y="222" width="84" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="152" y="222" width="84" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="244" y="222" width="84" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="336" y="222" width="84" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="428" y="222" width="84" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="520" y="222" width="84" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="102" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="194" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="286" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506b" filter="url(#rough2)">6</text>
  <text x="378" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506b" filter="url(#rough2)">13</text>
  <text x="470" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506b" filter="url(#rough2)">18</text>
  <text x="562" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">25</text>
  <text x="102" y="268" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">起点</text>
  <text x="194" y="268" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">j=1（best[1]）</text>
  <text x="286" y="268" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">j=2（best[2]）</text>
  <text x="378" y="268" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">j=1：6+6+1</text>
  <text x="470" y="268" text-anchor="middle" font-size="8" fill="#666" filter="url(#rough2)">j=2：6+6+6</text>
  <text x="562" y="268" text-anchor="middle" font-size="8" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">j=1：18+6+1</text>

  <!-- 最优方案 -->
  <text x="60" y="296" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">最优方案（由 dp[5] 回溯）：3 段 + 2 次换胎</text>
  <rect x="60" y="308" width="130" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="326" text-anchor="middle" font-size="9" font-weight="bold" fill="#33506b" filter="url(#rough2)">轮胎 (2,2) ×2 圈</text>
  <text x="125" y="342" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">2 + 4 = 6</text>
  <rect x="198" y="308" width="56" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="226" y="326" text-anchor="middle" font-size="9" font-weight="bold" fill="#8a3a30" filter="url(#rough2)">换胎</text>
  <text x="226" y="342" text-anchor="middle" font-size="9" fill="#8a3a30" filter="url(#rough2)">+6</text>
  <rect x="262" y="308" width="130" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="327" y="326" text-anchor="middle" font-size="9" font-weight="bold" fill="#33506b" filter="url(#rough2)">轮胎 (2,2) ×2 圈</text>
  <text x="327" y="342" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">2 + 4 = 6</text>
  <rect x="400" y="308" width="56" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="326" text-anchor="middle" font-size="9" font-weight="bold" fill="#8a3a30" filter="url(#rough2)">换胎</text>
  <text x="428" y="342" text-anchor="middle" font-size="9" fill="#8a3a30" filter="url(#rough2)">+6</text>
  <rect x="464" y="308" width="116" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="522" y="326" text-anchor="middle" font-size="9" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">轮胎 (1,10) ×1 圈</text>
  <text x="522" y="342" text-anchor="middle" font-size="9" fill="#2e5b2e" filter="url(#rough2)">1</text>
  <text x="320" y="374" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">总时间 = 6 + 6 + 6 + 6 + 1 = 25</text>

  <rect x="60" y="388" width="540" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="406" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">dp[5] = dp[4] + changeTime + best[1] = 18 + 6 + 1 = 25 ✓</text>
  <text x="330" y="422" text-anchor="middle" font-size="9" fill="#2e5b2e" filter="url(#rough2)">其中 dp[4] = dp[2] + 6 + best[2]，dp[2] = best[2] = 6（首段免换胎）</text>

  <text x="320" y="454" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">与官方解释一致：轮胎 1 跑第 1–2 圈，换胎后再跑 2 圈，最后换轮胎 0 跑第 5 圈</text>
</svg>
