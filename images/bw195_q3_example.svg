<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：s = "abac"，答案 9</text>
  <text x="70" y="62" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">r</text>
  <text x="146" y="62" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">s[r]</text>
  <text x="222" y="62" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">lastA</text>
  <text x="298" y="62" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">bestAB</text>
  <text x="374" y="62" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">p</text>
  <text x="450" y="62" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">新增</text>
  <line x1="50" y1="72" x2="470" y2="72" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="146" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="222" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="298" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <text x="374" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <text x="450" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="70" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="146" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <text x="222" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="298" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="374" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <text x="450" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="70" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="146" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <text x="222" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="298" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="374" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <text x="450" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="70" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="146" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <text x="222" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="298" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="374" y="174" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="450" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="50" y="230" width="420" height="140" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="248" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">逐位走查</text>
  <text x="62" y="264" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">· r=2 出现 'a'，lastA 变 2；</text>
  <text x="62" y="279" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">· r=3 出现 'c'，p 更新为 bestAB = 0；</text>
  <text x="62" y="294" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">  （"abc" 子序列 s[0],s[1],s[3] = a,b,c，起点 0）</text>
  <text x="62" y="309" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">· 累计新增 1+2+3+3 = 9；</text>
  <text x="62" y="324" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">  对比子串版（Q1）同例答案是 10，差在 s[0..3]="abac"：</text>
  <text x="62" y="339" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">  它含 "abc" 子序列，故不计入。</text>
</svg>
