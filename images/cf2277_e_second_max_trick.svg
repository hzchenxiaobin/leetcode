<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察 1：一次询问读出子树大小</text>
  <text x="300" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">取根 1 的权值为 n−1、目标点 x 的权值为 n，其余点随便填</text>

  <circle cx="150" cy="100" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="105" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">1</text>
  <text x="185" y="96" font-size="10" fill="#33506e" filter="url(#rough2)">p = n−1</text>

  <circle cx="90" cy="190" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="195" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">x</text>
  <text x="112" y="186" font-size="10" fill="#3a5a30" filter="url(#rough2)">p = n</text>

  <circle cx="225" cy="190" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="195" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">3</text>

  <circle cx="40" cy="272" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="40" y="277" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">4</text>
  <circle cx="140" cy="272" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="277" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">5</text>
  <circle cx="225" cy="272" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="277" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">6</text>

  <path d="M 140 114 L 100 176" stroke="#8a9bb0" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 163 110 L 214 177" stroke="#8a9bb0" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 78 204 L 50 259" stroke="#8a9bb0" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 102 205 L 132 259" stroke="#8a9bb0" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 225 205 L 225 257" stroke="#8a9bb0" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <ellipse cx="90" cy="222" rx="72" ry="66" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="30" y="316" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">绿色 = x 的子树，共 siz = 3 个点</text>

  <rect x="300" y="70" width="272" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="316" y="92" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">子树内的 siz 个点</text>
  <text x="316" y="112" font-size="10" fill="#555" filter="url(#rough2)">路径必经 x，最大值一律被刷成 n</text>

  <rect x="300" y="146" width="272" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="316" y="168" font-size="11" fill="#33506e" font-weight="bold" filter="url(#rough2)">子树外的 n − siz 个点</text>
  <text x="316" y="188" font-size="10" fill="#555" filter="url(#rough2)">路径必经根 1（值 n−1），最大值恒为 n−1</text>

  <path d="M 436 216 L 436 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="246" width="272" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="9" filter="url(#rough2)"/>
  <text x="316" y="268" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">S = n·siz + (n−1)(n − siz) = n(n−1) + siz</text>
  <text x="316" y="288" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">⇒ siz = S − n(n−1)</text>

  <rect x="300" y="316" width="272" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="316" y="338" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">一次询问 = 一个子树大小</text>
  <text x="316" y="357" font-size="10" fill="#555" filter="url(#rough2)">对 x = 2..n 各问一次，n−1 次拿到</text>
  <text x="316" y="375" font-size="10" fill="#555" filter="url(#rough2)">整棵树的 siz（siz[1] = n 不必问）</text>

  <text x="300" y="408" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">关键：n 与 n−1 是最大的两个权值，谁在路径上，最大值就是谁</text>
</svg>
