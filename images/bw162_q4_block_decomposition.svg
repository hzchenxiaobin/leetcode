<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">分块：查询区间 = 左边界 + 一整个「中间块段」 + 右边界</text>
  <rect x="60" y="110" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="75.0" y="156" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">0</text>
  <rect x="92" y="110" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="107.0" y="156" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">1</text>
  <rect x="124" y="110" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="139.0" y="156" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">2</text>
  <rect x="156" y="110" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="171.0" y="156" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">3</text>
  <rect x="188" y="110" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="203.0" y="156" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">4</text>
  <rect x="220" y="110" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="235.0" y="156" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">5</text>
  <rect x="252" y="110" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="267.0" y="156" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">6</text>
  <rect x="284" y="110" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="299.0" y="156" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">7</text>
  <rect x="316" y="110" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="331.0" y="156" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">8</text>
  <rect x="348" y="110" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="363.0" y="156" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">9</text>
  <rect x="380" y="110" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395.0" y="156" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">10</text>
  <rect x="412" y="110" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="427.0" y="156" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">11</text>
  <rect x="444" y="110" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="459.0" y="156" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">12</text>
  <rect x="476" y="110" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="491.0" y="156" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">13</text>
  <rect x="508" y="110" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="523.0" y="156" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">14</text>
  <rect x="540" y="110" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="555.0" y="156" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">15</text>
  <line x1="124" y1="98" x2="506" y2="98" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="252" y="90" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">查询 [l, r]</text>
  <text x="96" y="180" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">左边界 ≤ B 个</text>
  <text x="156" y="198" text-anchor="start" font-size="11" fill="#d6a040" filter="url(#rough2)">中间整块段：预存众数</text>
  <text x="446" y="180" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">右边界 ≤ B 个</text>
  <rect x="46" y="210" width="300" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="196" y="236" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">中间块段的众数</text>
  <text x="196" y="262" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">所有不在边界出现的值里，它就是最优</text>
  <rect x="360" y="210" width="300" height="80" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="236" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">边界最多 2B 个位置</text>
  <text x="510" y="262" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">去重后逐个当候选，二分数频次</text>
  <rect x="46" y="306" width="614" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="353" y="332" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">候选集 = {中间众数} ∪ {两边界上的值}，每个候选 O(log n) 数出现次数</text>
  <text x="353" y="356" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">取频次 ≥ threshold 者中「频次最大、值最小」的那个</text>
</svg>
