<svg xmlns="http://www.w3.org/2000/svg" width="740" height="560" viewBox="0 0 740 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="740" height="560" fill="#fdfcf7"/>
  <text x="370" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：闭包求取 + 贪心选择全流程</text>
  <path d="M 160 38 Q 370 46 580 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== panel 1 ===== -->
  <text x="40" y="60" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1：s = "adefaddaccc"</text>

  <g filter="url(#sk)">
    <rect x="40" y="72" width="46" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="86" y="72" width="76" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="162" y="72" width="266" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="428" y="72" width="272" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="10.5" font-weight="bold" fill="#2b4a6e" text-anchor="middle" filter="url(#sk)">
    <text x="63" y="87">字符</text>
    <text x="124" y="87">初始跨度</text>
    <text x="295" y="87">闭包（扩张过程）</text>
    <text x="564" y="87">贪心（按右端点排序后扫描）</text>
  </g>

  <g filter="url(#sk)">
    <rect x="40" y="94" width="46" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="86" y="94" width="76" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="162" y="94" width="266" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="428" y="94" width="272" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>

    <rect x="40" y="124" width="46" height="30" fill="#f4f7fb" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="86" y="124" width="76" height="30" fill="#f4f7fb" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="162" y="124" width="266" height="30" fill="#f4f7fb" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="428" y="124" width="272" height="30" fill="#f4f7fb" stroke="#b8c4d4" stroke-width="1"/>

    <rect x="40" y="154" width="46" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="86" y="154" width="76" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="162" y="154" width="266" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="428" y="154" width="272" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>

    <rect x="40" y="184" width="46" height="30" fill="#f4f7fb" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="86" y="184" width="76" height="30" fill="#f4f7fb" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="162" y="184" width="266" height="30" fill="#f4f7fb" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="428" y="184" width="272" height="30" fill="#f4f7fb" stroke="#b8c4d4" stroke-width="1"/>

    <rect x="40" y="214" width="46" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="86" y="214" width="76" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="162" y="214" width="266" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="428" y="214" width="272" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
  </g>
  <g font-size="10.5" text-anchor="middle" filter="url(#sk)">
    <text x="63" y="113" fill="#333">a</text>
    <text x="124" y="113" fill="#333">[0,7]</text>
    <text x="295" y="113" fill="#333">[0,7]（d、e、f 跨度均在内，不动）</text>
    <text x="564" y="113" fill="#b85450">③ 跳过：st=0 ≤ lastEnd=3</text>

    <text x="63" y="143" fill="#333">d</text>
    <text x="124" y="143" fill="#333">[1,6]</text>
    <text x="295" y="143" fill="#333">[0,7]（k=4 遇 a → 吞并 I_a）</text>
    <text x="564" y="143" fill="#888">与 a 重复，去重移除</text>

    <text x="63" y="173" fill="#333">e</text>
    <text x="124" y="173" fill="#333">[2,2]</text>
    <text x="295" y="173" fill="#333">[2,2]（区间内只有 e）</text>
    <text x="564" y="173" fill="#4a7a3a" font-weight="bold">① ✓ 选 "e"</text>

    <text x="63" y="203" fill="#333">f</text>
    <text x="124" y="203" fill="#333">[3,3]</text>
    <text x="295" y="203" fill="#333">[3,3]（区间内只有 f）</text>
    <text x="564" y="203" fill="#4a7a3a" font-weight="bold">② ✓ 选 "f"</text>

    <text x="63" y="233" fill="#333">c</text>
    <text x="124" y="233" fill="#333">[8,10]</text>
    <text x="295" y="233" fill="#333">[8,10]（区间内只有 c）</text>
    <text x="564" y="233" fill="#4a7a3a" font-weight="bold">④ ✓ 选 "ccc"</text>
  </g>

  <g filter="url(#sk)">
    <rect x="40" y="252" width="660" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="370" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">结果 ["e","f","ccc"]：3 段，总长 1+1+3 = 5</text>

  <!-- ===== panel 2 ===== -->
  <text x="40" y="312" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2：s = "abbaccd"</text>

  <g filter="url(#sk)">
    <rect x="40" y="324" width="46" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="86" y="324" width="76" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="162" y="324" width="266" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="428" y="324" width="272" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="10.5" font-weight="bold" fill="#2b4a6e" text-anchor="middle" filter="url(#sk)">
    <text x="63" y="339">字符</text>
    <text x="124" y="339">初始跨度</text>
    <text x="295" y="339">闭包（扩张过程）</text>
    <text x="564" y="339">贪心（按右端点排序后扫描）</text>
  </g>

  <g filter="url(#sk)">
    <rect x="40" y="346" width="46" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="86" y="346" width="76" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="162" y="346" width="266" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="428" y="346" width="272" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>

    <rect x="40" y="376" width="46" height="30" fill="#f4f7fb" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="86" y="376" width="76" height="30" fill="#f4f7fb" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="162" y="376" width="266" height="30" fill="#f4f7fb" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="428" y="376" width="272" height="30" fill="#f4f7fb" stroke="#b8c4d4" stroke-width="1"/>

    <rect x="40" y="406" width="46" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="86" y="406" width="76" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="162" y="406" width="266" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="428" y="406" width="272" height="30" fill="#ffffff" stroke="#b8c4d4" stroke-width="1"/>

    <rect x="40" y="436" width="46" height="30" fill="#f4f7fb" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="86" y="436" width="76" height="30" fill="#f4f7fb" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="162" y="436" width="266" height="30" fill="#f4f7fb" stroke="#b8c4d4" stroke-width="1"/>
    <rect x="428" y="436" width="272" height="30" fill="#f4f7fb" stroke="#b8c4d4" stroke-width="1"/>
  </g>
  <g font-size="10.5" text-anchor="middle" filter="url(#sk)">
    <text x="63" y="365" fill="#333">a</text>
    <text x="124" y="365" fill="#333">[0,3]</text>
    <text x="295" y="365" fill="#333">[0,3]（b 跨度 [1,2] 在内，不动）</text>
    <text x="564" y="365" fill="#b85450">跳过：st=0 ≤ lastEnd=2</text>

    <text x="63" y="395" fill="#333">b</text>
    <text x="124" y="395" fill="#333">[1,2]</text>
    <text x="295" y="395" fill="#333">[1,2]（区间内只有 b）</text>
    <text x="564" y="395" fill="#4a7a3a" font-weight="bold">① ✓ 选 "bb"</text>

    <text x="63" y="425" fill="#333">c</text>
    <text x="124" y="425" fill="#333">[4,5]</text>
    <text x="295" y="425" fill="#333">[4,5]（区间内只有 c）</text>
    <text x="564" y="425" fill="#4a7a3a" font-weight="bold">② ✓ 选 "cc"</text>

    <text x="63" y="455" fill="#333">d</text>
    <text x="124" y="455" fill="#333">[6,6]</text>
    <text x="295" y="455" fill="#333">[6,6]（区间内只有 d）</text>
    <text x="564" y="455" fill="#4a7a3a" font-weight="bold">③ ✓ 选 "d"</text>
  </g>

  <g filter="url(#sk)">
    <rect x="40" y="476" width="320" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="200" y="496" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5e24" filter="url(#sk)">结果 ["bb","cc","d"]：3 段，总长 2+2+1 = 5</text>

  <g filter="url(#sk)">
    <rect x="380" y="476" width="320" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="396" y="496" font-size="10" font-weight="bold" fill="#a87f2a" filter="url(#sk)">同为 3 段的 ["d","abba","cc"] 总长 7 &gt; 5，非最优：</text>
  <text x="396" y="514" font-size="10" fill="#7a6a4a" filter="url(#sk)">"abba"（右端 3）输给 "bb"（右端 2）——更早结束</text>
  <text x="396" y="530" font-size="10" fill="#7a6a4a" filter="url(#sk)">且更短，数目不变、长度更省，也不堵后面。</text>

  <text x="40" y="552" font-size="9" fill="#999999" filter="url(#sk)">注：贪心列的 ①②③… 为按右端点排序后的扫描顺序；两例输出顺序任意，与题目要求一致。</text>
</svg>
