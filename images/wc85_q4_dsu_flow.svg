<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="520" height="420" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">并查集：两两判相似，是就合并，答案 = 合并后集合数</text>

  <g filter="url(#rough2)">
    <rect x="120" y="42" width="280" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="63" text-anchor="middle" font-size="12" fill="#2f4a66">去重（重复串必同组）+ 初始化 parent[i]=i</text>
    <path d="M260,74 L260,92" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="120" y="92" width="280" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="113" text-anchor="middle" font-size="12" fill="#2f4a66">groups = n（每组一个）</text>
    <path d="M260,124 L260,142" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="120" y="142" width="280" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="260" y="163" text-anchor="middle" font-size="12" fill="#7a5a10">枚举所有 i &lt; j</text>
    <path d="M260,174 L260,192" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

    <polygon points="260,192 350,228 260,264 170,228" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="260" y="224" text-anchor="middle" font-size="11" fill="#2f5527">find(i) ≠ find(j)</text>
    <text x="260" y="240" text-anchor="middle" font-size="11" fill="#2f5527">且 similar(i, j)？</text>
    <path d="M260,264 L260,282" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="120" y="282" width="280" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="260" y="303" text-anchor="middle" font-size="12" fill="#2f5527">union：parent[ri]=rj，groups -= 1</text>
    <path d="M260,314 L260,332" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="120" y="332" width="280" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="260" y="353" text-anchor="middle" font-size="12" fill="#8a3020">若 groups == 1 提前返回 1</text>
    <path d="M260,364 L260,382" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="150" y="382" width="220" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="402" text-anchor="middle" font-size="12" fill="#7a5a10">返回 groups</text>
  </g>
</svg>
