<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">演算：nums = [1, 2, 3, 4, 3]</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888">n = 5，扫描 i = 0 … 8；前 5 步入栈建立单调性，后 4 步只负责跨边界回填</text>

  <g filter="url(#rough2)">
    <rect x="36" y="64" width="548" height="26" fill="#eef3fb" stroke="#446688" stroke-width="1.4" rx="5"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#3a4a66">
    <text x="66" y="81" text-anchor="middle">i</text>
    <text x="128" y="81" text-anchor="middle">j = i mod 5</text>
    <text x="196" y="81" text-anchor="middle">nums[j]</text>
    <text x="252" y="81">结算：弹栈并回填 ans</text>
    <text x="462" y="81">栈（底 → 顶）</text>
  </g>

  <!-- 第一圈 -->
  <g filter="url(#rough2)">
    <rect x="36" y="90" width="548" height="28" fill="#e8f0fe" stroke="#9db3cc" stroke-width="1" rx="4"/>
    <rect x="36" y="118" width="548" height="28" fill="#f4f8fd" stroke="#c2d2e4" stroke-width="1" rx="4"/>
    <rect x="36" y="146" width="548" height="28" fill="#e8f0fe" stroke="#9db3cc" stroke-width="1" rx="4"/>
    <rect x="36" y="174" width="548" height="28" fill="#f4f8fd" stroke="#c2d2e4" stroke-width="1" rx="4"/>
    <rect x="36" y="202" width="548" height="28" fill="#e8f0fe" stroke="#9db3cc" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#3a4a66">
    <text x="66" y="109" text-anchor="middle">0</text><text x="128" y="109" text-anchor="middle">0</text>
    <text x="196" y="109" text-anchor="middle">1</text>
    <text x="252" y="109">栈空 → 无结算</text><text x="462" y="109">[0]</text>

    <text x="66" y="137" text-anchor="middle">1</text><text x="128" y="137" text-anchor="middle">1</text>
    <text x="196" y="137" text-anchor="middle">2</text>
    <text x="252" y="137">ans[0] = 2，弹出 0</text><text x="462" y="137">[1]</text>

    <text x="66" y="165" text-anchor="middle">2</text><text x="128" y="165" text-anchor="middle">2</text>
    <text x="196" y="165" text-anchor="middle">3</text>
    <text x="252" y="165">ans[1] = 3，弹出 1</text><text x="462" y="165">[2]</text>

    <text x="66" y="193" text-anchor="middle">3</text><text x="128" y="193" text-anchor="middle">3</text>
    <text x="196" y="193" text-anchor="middle">4</text>
    <text x="252" y="193">ans[2] = 4，弹出 2</text><text x="462" y="193">[3]</text>

    <text x="66" y="221" text-anchor="middle">4</text><text x="128" y="221" text-anchor="middle">4</text>
    <text x="196" y="221" text-anchor="middle">3</text>
    <text x="252" y="221">4 ≥ 3，不弹，压入 4</text><text x="462" y="221">[3, 4]</text>
  </g>

  <!-- 第二圈 -->
  <g filter="url(#rough2)">
    <rect x="36" y="230" width="548" height="28" fill="#fff8e1" stroke="#e0bd70" stroke-width="1" rx="4"/>
    <rect x="36" y="258" width="548" height="28" fill="#fffdf3" stroke="#ecd9a8" stroke-width="1" rx="4"/>
    <rect x="36" y="286" width="548" height="28" fill="#fff8e1" stroke="#e0bd70" stroke-width="1" rx="4"/>
    <rect x="36" y="314" width="548" height="28" fill="#fffdf3" stroke="#ecd9a8" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#8a6a20">
    <text x="66" y="249" text-anchor="middle">5</text><text x="128" y="249" text-anchor="middle">0</text>
    <text x="196" y="249" text-anchor="middle">1</text>
    <text x="252" y="249">3 ≥ 1，不弹，不入栈</text><text x="462" y="249">[3, 4]</text>

    <text x="66" y="277" text-anchor="middle">6</text><text x="128" y="277" text-anchor="middle">1</text>
    <text x="196" y="277" text-anchor="middle">2</text>
    <text x="252" y="277">3 ≥ 2，不弹，不入栈</text><text x="462" y="277">[3, 4]</text>

    <text x="66" y="305" text-anchor="middle">7</text><text x="128" y="305" text-anchor="middle">2</text>
    <text x="196" y="305" text-anchor="middle">3</text>
    <text x="252" y="305">3 ≥ 3（相等不算更大）</text><text x="462" y="305">[3, 4]</text>

    <text x="66" y="333" text-anchor="middle">8</text><text x="128" y="333" text-anchor="middle">3</text>
    <text x="196" y="333" text-anchor="middle">4</text>
    <text x="252" y="333">ans[4] = 4，弹出 4</text><text x="462" y="333">[3]</text>
  </g>

  <path d="M 310 346 L 310 360" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="364" width="380" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="136" y="386" font-size="10.5" fill="#3a5a30">ans = [2, 3, 4, −1, 4]</text>
  <text x="136" y="406" font-size="10" fill="#4a6a40">下标 3（值 4）是全局最大值，扫描结束后仍留在栈底 → 输出 −1</text>
</svg>
