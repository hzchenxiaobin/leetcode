<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：质量只增不减 → 先吞小的永不亏</text>

  <!-- 上半面板：升序吞噬成功 -->
  <rect x="15" y="44" width="490" height="132" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">从小到大：一路吞噬 ✓</text>

  <!-- 被吞的小行星（橙色小圆）与 +标签 -->
  <circle cx="110" cy="122" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="190" cy="122" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="270" cy="122" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="350" cy="122" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="430" cy="122" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="103" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">+3</text>
  <text x="190" y="103" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">+5</text>
  <text x="270" y="103" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">+9</text>
  <text x="350" y="103" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">+19</text>
  <text x="430" y="103" text-anchor="middle" font-size="11" fill="#a07820" filter="url(#rough2)">+21</text>

  <!-- 行星（蓝色，逐渐变大） -->
  <circle cx="70" cy="122" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <circle cx="150" cy="122" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13</text>
  <circle cx="230" cy="122" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">18</text>
  <circle cx="310" cy="122" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">27</text>
  <circle cx="390" cy="122" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">46</text>
  <circle cx="470" cy="122" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">67</text>

  <path d="M 42 158 L 493 158" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 下半面板：先撞大的失败 -->
  <rect x="15" y="192" width="490" height="110" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="214" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">先撞大的：当场暴毙 ✗</text>

  <circle cx="90" cy="262" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="266" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>

  <path d="M 112 262 L 163 262" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <circle cx="215" cy="262" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="215" y="267" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">21</text>

  <text x="302" y="248" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">10 &lt; 21</text>
  <path d="M 244 262 L 355 262" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <polygon points="424,258 409,254 418,240 404,249 400,232 396,249 382,240 391,254 376,258 391,262 382,276 396,267 400,284 404,267 418,276 409,262"
           fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="264" text-anchor="middle" font-size="20" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="400" y="298" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">行星被摧毁</text>

  <!-- 结论框 -->
  <rect x="15" y="314" width="490" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">升序可行 ⇒ 全部可行；升序失败 ⇒ 任何顺序都失败（交换论证见 §5）</text>
</svg>
