<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：dist[2][3] = 7</text>

  <!-- ===== 网格：cell 96x54, pitch (108,66), origin (50,76) ===== -->
  <!-- 普通格 -->
  <g filter="url(#rough2)">
    <rect x="266" y="76" width="96" height="54" rx="4" fill="#fdfdfd" stroke="#aaa" stroke-width="1.2"/>
    <rect x="374" y="76" width="96" height="54" rx="4" fill="#fdfdfd" stroke="#aaa" stroke-width="1.2"/>
    <rect x="50" y="142" width="96" height="54" rx="4" fill="#fdfdfd" stroke="#aaa" stroke-width="1.2"/>
    <rect x="50" y="208" width="96" height="54" rx="4" fill="#fdfdfd" stroke="#aaa" stroke-width="1.2"/>
    <rect x="158" y="208" width="96" height="54" rx="4" fill="#fdfdfd" stroke="#aaa" stroke-width="1.2"/>
    <rect x="266" y="208" width="96" height="54" rx="4" fill="#fdfdfd" stroke="#aaa" stroke-width="1.2"/>
  </g>
  <!-- 路径格 -->
  <g filter="url(#rough2)">
    <rect x="50" y="76" width="96" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="158" y="76" width="96" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="158" y="142" width="96" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="266" y="142" width="96" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="374" y="142" width="96" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="374" y="208" width="96" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
  </g>

  <!-- grid 值（大字）与 h（小字） -->
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="104" y="105">0</text>
    <text x="212" y="105">1</text>
    <text x="320" y="105">3</text>
    <text x="428" y="105">2</text>
    <text x="104" y="171">5</text>
    <text x="212" y="171">1</text>
    <text x="320" y="171">2</text>
    <text x="428" y="171">5</text>
    <text x="104" y="237">4</text>
    <text x="212" y="237">3</text>
    <text x="320" y="237">8</text>
    <text x="428" y="237">6</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#888" filter="url(#rough2)">
    <text x="104" y="121">h=0</text>
    <text x="212" y="121">h=1</text>
    <text x="320" y="121">h=4</text>
    <text x="428" y="121">h=3</text>
    <text x="104" y="187">h=5</text>
    <text x="212" y="187">h=2</text>
    <text x="320" y="187">h=3</text>
    <text x="428" y="187">h=6</text>
    <text x="104" y="253">h=4</text>
    <text x="212" y="253">h=3</text>
    <text x="320" y="253">h=8</text>
    <text x="428" y="253">h=7</text>
  </g>

  <!-- dist 徽章（路径格） -->
  <g filter="url(#rough2)">
    <circle cx="136" cy="88" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="244" cy="88" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="244" cy="154" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="352" cy="154" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="460" cy="154" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="460" cy="220" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="10" font-weight="bold" text-anchor="middle" fill="#2e5a24" filter="url(#rough2)">
    <text x="136" y="92">0</text>
    <text x="244" y="92">1</text>
    <text x="244" y="158">2</text>
    <text x="352" y="158">3</text>
    <text x="460" y="158">6</text>
    <text x="460" y="224">7</text>
  </g>

  <!-- 路径箭头 -->
  <path d="M 112 103 L 200 103" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="156" y="95" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">t=1</text>
  <path d="M 212 112 L 212 160" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="226" y="140" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">t=2</text>
  <path d="M 224 160 L 306 160" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="264" y="152" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">t=3</text>
  <path d="M 308 144 C 288 118 236 118 218 144" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="264" y="116" text-anchor="middle" font-size="10.5" fill="#8a6210" filter="url(#rough2)">t=4 折返</text>
  <path d="M 224 178 L 306 178" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="264" y="194" text-anchor="middle" font-size="10.5" fill="#8a6210" filter="url(#rough2)">t=5</text>
  <path d="M 330 169 L 396 169" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="362" y="161" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">t=6</text>
  <path d="M 428 178 L 428 220" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="442" y="202" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">t=7</text>

  <text x="104" y="66" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">起点</text>
  <text x="478" y="241" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">终点</text>

  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">大字 = grid 值；h = 奇偶上取整后的门禁；绿圈 = dist</text>

  <!-- ===== 右侧弹出顺序 ===== -->
  <text x="602" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4d70" filter="url(#rough2)">弹出顺序（t → 格子）</text>
  <g filter="url(#rough2)">
    <rect x="498" y="100" width="208" height="206" rx="8" fill="#fdfdfd" stroke="#bbb" stroke-width="1.5"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="602" y="126">t=0：(0,0)</text>
    <text x="602" y="149">t=1：(0,1)</text>
    <text x="602" y="172">t=2：(1,1)</text>
    <text x="602" y="195">t=3：(1,2)，(2,1)</text>
    <text x="602" y="218">t=4：(0,2)，(2,0)</text>
    <text x="602" y="241">t=5：(0,3)，(1,0)</text>
    <text x="602" y="264">t=6：(1,3)</text>
    <text x="602" y="287" font-weight="bold" fill="#2e5a24">t=7：(2,3) ✓ 返回</text>
  </g>

  <!-- ===== 底部解释 ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="316" width="640" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="360" y="342" text-anchor="middle" font-size="12" fill="#8a6210" filter="url(#rough2)">t=3 已到 (1,2)：t=4 &lt; 5 进不了 (1,3)，t=5 又奇偶不符（(1,3) 只能偶时刻进）</text>
  <text x="360" y="366" text-anchor="middle" font-size="12" fill="#8a6210" filter="url(#rough2)">⇒ 在 (1,1)↔(1,2) 间折返一次：t=4 回 (1,1)、t=5 再进 (1,2)</text>
  <text x="360" y="390" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6210" filter="url(#rough2)">t=6 门开进 (1,3)，t=7 到达终点，返回 7</text>
</svg>
