<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>
  <text x="24" y="32" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">前序/后序的切分：左子树大小由后序决定</text>
  <text x="30" y="80" text-anchor="start" font-size="12" fill="#2c4a63" filter="url(#rough2)">preorder</text>
  <rect x="110" y="60" width="54" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137.0" y="92.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="172" y="60" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199.0" y="92.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="234" y="60" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261.0" y="92.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="296" y="60" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="323.0" y="92.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <rect x="358" y="60" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385.0" y="92.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="420" y="60" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="447.0" y="92.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <rect x="482" y="60" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="509.0" y="92.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>
  <text x="30" y="166" text-anchor="start" font-size="12" fill="#8a6410" filter="url(#rough2)">postorder</text>
  <rect x="110" y="146" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137.0" y="178.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="172" y="146" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199.0" y="178.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <rect x="234" y="146" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261.0" y="178.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="296" y="146" width="54" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="323.0" y="178.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <rect x="358" y="146" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385.0" y="178.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>
  <rect x="420" y="146" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="447.0" y="178.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="482" y="146" width="54" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="509.0" y="178.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="30" y="240" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">根 = pre[0] = 1；左子树的根 = pre[1] = 2</text>
  <text x="30" y="264" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">在后序里 2 的下标是 2 ⇒ 左子树含 4,5,2 共 3 个节点</text>
  <rect x="110" y="286" width="500" height="66" fill="#f7f9fc" stroke="#9aa7b4" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360.0" y="313.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">左子树：preorder[1..3] ↔ postorder[0..2]</text>
  <text x="360.0" y="333.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">右子树：preorder[4..6] ↔ postorder[3..5]</text>
  <text x="30" y="380" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">后序最后一个元素必是根，可与 pre[0] 互相印证</text>
</svg>
