  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">平移 = 给每个 1 加上同一个向量 d</text>
