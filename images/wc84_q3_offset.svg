  <path d="M 230 176 Q 325.0 166.0 400 176" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <text x="315" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#rough2)">平移 d</text>
  <g filter="url(#rough2)"><rect x="90" y="258" width="460" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="280" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415" filter="url(#rough2)">重叠(d) = # { p ∈ 1(A) : p + d ∈ 1(B) }</text>
  <text x="320" y="301" text-anchor="middle" font-size="10.5" fill="#7a5415" filter="url(#rough2)">即让 A 的某颗 1 正好压到 B 的某颗 1 上</text>
  <text x="320" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">本题取 d = (1, 1)：A 向右 1 格、向下 1 格 ⇒ 重叠 3</text>
  <g filter="url(#rough2)"><rect x="90" y="356" width="460" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320.0" y="378" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#rough2)">只有「1 对 1」的重合才有意义，0 与 0 重合不计入重叠</text>
  </svg>