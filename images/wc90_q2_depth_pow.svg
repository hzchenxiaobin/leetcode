<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" width="620" height="372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="620" height="372" fill="#fafafa"/>
  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">等价的更简视角：每个 "()" 贡献 2 的「外层括号对数」次方</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">S = "(()(()))" 拆成两个叶子对，外层各裹了 1 层和 2 层 → 2 + 4 = 6</text>
  <rect x="70" y="150" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="177.8" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">(</text>
  <text x="97" y="140" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">d=1</text>
  <text x="97" y="212" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">0</text>
  <rect x="124" y="150" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="177.8" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">(</text>
  <text x="151" y="140" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">d=2</text>
  <text x="151" y="212" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">1</text>
  <rect x="178" y="150" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="177.8" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">)</text>
  <text x="205" y="140" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">d=2</text>
  <text x="205" y="212" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">2</text>
  <rect x="232" y="150" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="177.8" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">(</text>
  <text x="259" y="140" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">d=2</text>
  <text x="259" y="212" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">3</text>
  <rect x="286" y="150" width="54" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="177.8" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">(</text>
  <text x="313" y="140" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">d=3</text>
  <text x="313" y="212" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">4</text>
  <rect x="340" y="150" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="367" y="177.8" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">)</text>
  <text x="367" y="140" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">d=3</text>
  <text x="367" y="212" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">5</text>
  <rect x="394" y="150" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="421" y="177.8" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">)</text>
  <text x="421" y="140" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">d=2</text>
  <text x="421" y="212" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">6</text>
  <rect x="448" y="150" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="177.8" text-anchor="middle" font-size="16" fill="#4a7a3a" filter="url(#rough2)">)</text>
  <text x="475" y="140" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">d=1</text>
  <text x="475" y="212" text-anchor="middle" font-size="9.5" fill="#bbb" filter="url(#rough2)">7</text>
  <path d="M 135 202 L 135 224 L 221 224 L 221 202" stroke="#b85450" stroke-width="1.6" fill="none" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="178" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">贡献 2^1 = 2</text>
  <path d="M 297 202 L 297 224 L 383 224 L 383 202" stroke="#b85450" stroke-width="1.6" fill="none" stroke-linejoin="round" filter="url(#rough2)"/>
  <text x="340" y="244" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">贡献 2^2 = 4</text>
  <text x="40" y="322" text-anchor="start" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">外层括号对数 d = 该叶子对左侧未闭合的 "(" 个数；整串分数 = Σ 2^d。</text>
  <text x="40" y="346" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">两者等价：每多裹一层 (A) 就翻一倍，正是规则 (A) → 2A 的累计效果。</text>
</svg>
