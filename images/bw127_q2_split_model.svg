<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/></marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">一个分界点 m 把关卡切成「Alice 前缀」与「Bob 后缀」</text>

  <g filter="url(#rough2)">
    <rect x="100" y="72" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
    <rect x="164" y="72" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="228" y="72" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="292" y="72" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="132" y="101">+1</text><text x="196" y="101">−1</text><text x="260" y="101">+1</text><text x="324" y="101">−1</text>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="132" y="134">0</text><text x="196" y="134">1</text><text x="260" y="134">2</text><text x="324" y="134">3</text>
  </g>
  <path d="M 164 60 L 164 146" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="52" font-size="12" fill="#4a7a3a" font-weight="bold" text-anchor="middle" filter="url(#rough2)">Alice 完成前 m 关</text>
  <text x="270" y="52" font-size="12" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">Bob 完成剩下的 n − m 关</text>

  <rect x="60" y="160" width="440" height="36" fill="#fff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0 记 −1 分，1 记 +1 分；总分 total = 所有关卡得分之和</text>

  <rect x="60" y="208" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">Alice 赢 ⇔ pre(m) &gt; total − pre(m) ⇔ 2 × pre(m) &gt; total</text>

  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">m 取 1 … n−1（两人都必须至少完成 1 关）</text>

  <rect x="60" y="290" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">从左到右累加 pre(m)，第一个满足不等式的 m 就是最少关数</text>

  <rect x="60" y="336" width="440" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="359" text-anchor="middle" font-size="12" fill="#8a2b26" filter="url(#rough2)">全部 m 都不满足 ⇒ 返回 −1（如 [0,0]：−1 与 −1 打平）</text>
</svg>
