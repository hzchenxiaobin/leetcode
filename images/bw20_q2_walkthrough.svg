<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="133"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">官方示例走查：n = 3，discount = 50%</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="13" fill="#446688" font-weight="bold" text-anchor="middle">
    <rect x="30" y="50" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="70" y="70">顾客 cnt</text>
    <rect x="110" y="50" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="210" y="70">购买</text>
    <rect x="310" y="50" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="355" y="70">原价</text>
    <rect x="400" y="50" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="430" y="70">打折?</text>
    <rect x="460" y="50" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="495" y="70">实付</text>
  </g>

  <!-- 七行 -->
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="30" y="84" width="80" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="70" y="104">1</text>
    <rect x="110" y="84" width="200" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="210" y="104">1×100 + 2×200</text>
    <rect x="310" y="84" width="90" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="355" y="104">500</text>
    <rect x="400" y="84" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="430" y="104" fill="#b85450">✗</text>
    <rect x="460" y="84" width="70" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="495" y="104">500.0</text>

    <rect x="30" y="116" width="80" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="70" y="136">2</text>
    <rect x="110" y="116" width="200" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="210" y="136">10×300 + 10×100</text>
    <rect x="310" y="116" width="90" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="355" y="136">4000</text>
    <rect x="400" y="116" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="430" y="136" fill="#b85450">✗</text>
    <rect x="460" y="116" width="70" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="495" y="136">4000.0</text>

    <rect x="30" y="148" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="70" y="168" font-weight="bold">3 ★</text>
    <rect x="110" y="148" width="200" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="210" y="168">每样 1 件（7 种）</text>
    <rect x="310" y="148" width="90" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="355" y="168">1600</text>
    <rect x="400" y="148" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="430" y="168" fill="#2d5a22" font-weight="bold">✓</text>
    <rect x="460" y="148" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="495" y="168" fill="#2d5a22" font-weight="bold">800.0</text>

    <rect x="30" y="180" width="80" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="70" y="200">4</text>
    <rect x="110" y="180" width="200" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="210" y="200">10×400</text>
    <rect x="310" y="180" width="90" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="355" y="200">4000</text>
    <rect x="400" y="180" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="430" y="200" fill="#b85450">✗</text>
    <rect x="460" y="180" width="70" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="495" y="200">4000.0</text>

    <rect x="30" y="212" width="80" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="70" y="232">5</text>
    <rect x="110" y="212" width="200" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="210" y="232">10×100 + 10×300</text>
    <rect x="310" y="212" width="90" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="355" y="232">4000</text>
    <rect x="400" y="212" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="430" y="232" fill="#b85450">✗</text>
    <rect x="460" y="212" width="70" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="495" y="232">4000.0</text>

    <rect x="30" y="244" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="70" y="264" font-weight="bold">6 ★</text>
    <rect x="110" y="244" width="200" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="210" y="264">7 种商品各若干</text>
    <rect x="310" y="244" width="90" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="355" y="264">14700</text>
    <rect x="400" y="244" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="430" y="264" fill="#2d5a22" font-weight="bold">✓</text>
    <rect x="460" y="244" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="495" y="264" fill="#2d5a22" font-weight="bold">7350.0</text>

    <rect x="30" y="276" width="80" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="70" y="296">7</text>
    <rect x="110" y="276" width="200" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="210" y="296">5×200 + 3×300 + 2×300</text>
    <rect x="310" y="276" width="90" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="355" y="296">2500</text>
    <rect x="400" y="276" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4"/>
    <text x="430" y="296" fill="#b85450">✗</text>
    <rect x="460" y="276" width="70" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="495" y="296">2500.0</text>
  </g>

  <!-- 结论 -->
  <rect x="60" y="322" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="341" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">★ 处 cnt = 3、6 均被 3 整除：1600×0.5 = 800，14700×0.5 = 7350</text>
  <text x="280" y="359" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">输出序列 [500, 4000, 800, 4000, 4000, 7350, 2500] ✓</text>
</svg>
