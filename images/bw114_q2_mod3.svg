<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">按频次模 3 分类：只和自己值分组</text>

  <!-- 余 0 -->
  <rect x="36" y="52" width="448" height="74" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="78" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">c mod 3 = 0（如 c=6）</text>
  <ellipse cx="230" cy="72" rx="16" ry="13" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="266" cy="72" rx="16" ry="13" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="302" cy="72" rx="16" ry="13" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="360" cy="72" rx="16" ry="13" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="396" cy="72" rx="16" ry="13" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="432" cy="72" rx="16" ry="13" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="266" y="77" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">三元组</text>
  <text x="396" y="77" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">三元组</text>
  <text x="230" y="110" font-size="13" fill="#333" filter="url(#rough2)">全拆成 3 个一组：操作 c/3 次 ✓</text>

  <!-- 余 2 -->
  <rect x="36" y="136" width="448" height="74" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="162" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">c mod 3 = 2（如 c=5）</text>
  <ellipse cx="230" cy="156" rx="16" ry="13" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="266" cy="156" rx="16" ry="13" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="302" cy="156" rx="16" ry="13" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="372" cy="156" rx="20" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="414" cy="156" rx="20" ry="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="266" y="161" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">三元组</text>
  <text x="393" y="161" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">二元组</text>
  <text x="230" y="194" font-size="13" fill="#333" filter="url(#rough2)">拆成 ⌊c/3⌋ 组三元 + 1 组二元：共 c/3 + 1 次 ✓</text>

  <!-- 余 1 -->
  <rect x="36" y="220" width="448" height="74" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="246" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">c mod 3 = 1</text>
  <ellipse cx="200" cy="240" rx="16" ry="13" fill="#fafafa" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="236" cy="240" rx="16" ry="13" fill="#fafafa" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <ellipse cx="272" cy="240" rx="16" ry="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="312" cy="240" rx="16" ry="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="368" cy="240" rx="13" ry="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="252" y="245" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">两组二元（4 个）</text>
  <text x="368" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">c=1</text>
  <text x="156" y="278" font-size="13" fill="#333" filter="url(#rough2)">c ≥ 4：拆 3+3…+2+2，共 c/3 + 1 次 ✓；c = 1：删不掉 → 整体返回 −1</text>

  <text x="260" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">不同值之间互不影响：答案 = 各值分组操作数之和</text>
</svg>
