<svg xmlns="http://www.w3.org/2000/svg" width="640" height="464" viewBox="0 0 640 464" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="464" fill="#fdfcf7"/>
  <text x="320" y="22" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">算法流程：二分 [1, max(quantities)] 找最小可行 x</text>
  <text x="320" y="40" text-anchor="middle" font-size="11" fill="#666666">不变量：hi 始终可行，lo−1 始终不可行 → 循环结束时 lo == hi 即为答案</text>

  <g filter="url(#sk)">
    <rect x="210" y="70" width="220" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">lo = 1</text>
  <text x="320" y="104" text-anchor="middle" font-size="11.5" fill="#2b6e9e">hi = max(quantities)</text>

  <path d="M320,112 L320,124" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="320,128 410,164 320,200 230,164" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="168" text-anchor="middle" font-size="11.5" fill="#8a6415">lo &lt; hi ?</text>

  <path d="M230,164 L184,164" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="198" y="157" font-size="10" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <rect x="28" y="142" width="152" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="104" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">return lo</text>
  <text x="104" y="178" text-anchor="middle" font-size="9.5" fill="#2e6e2e">= 最小可行 x</text>

  <path d="M320,200 L320,216" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="328" y="212" font-size="10" fill="#2e6e2e">是</text>

  <g filter="url(#sk)">
    <rect x="225" y="220" width="190" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">mid = (lo + hi) / 2</text>

  <path d="M320,258 L320,270" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="320,274 430,314 320,354 210,314" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="310" text-anchor="middle" font-size="11.5" fill="#8a6415">check(mid) ?</text>
  <text x="320" y="326" text-anchor="middle" font-size="10.5" fill="#8a6415">Σ⌈qᵢ/mid⌉ ≤ n ?</text>

  <path d="M430,314 L456,314" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="438" y="306" font-size="10" fill="#2e6e2e">是</text>

  <g filter="url(#sk)">
    <rect x="460" y="294" width="120" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="520" y="311" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">hi = mid</text>
  <text x="520" y="327" text-anchor="middle" font-size="9.5" fill="#2e6e2e">可行，保留 mid</text>

  <path d="M210,314 L168,314" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="182" y="306" font-size="10" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <rect x="28" y="294" width="136" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="96" y="311" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">lo = mid + 1</text>
  <text x="96" y="327" text-anchor="middle" font-size="9.5" fill="#b85450">不可行，排除 mid</text>

  <path d="M580,314 L600,314" stroke="#8899aa" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M96,334 L96,424 L600,424 L600,164 L414,164" stroke="#8899aa" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="507" y="157" font-size="9" fill="#888888">更新后回到条件判断</text>
  <text x="348" y="417" font-size="9.5" fill="#888888">区间 [lo, hi] 每轮至少缩小一半</text>

  <text x="320" y="448" text-anchor="middle" font-size="10.5" fill="#555555">至多 log₂(max q) ≈ 17 轮，每轮 check 为 O(m) → 总时间 O(m·log max q)</text>
</svg>
