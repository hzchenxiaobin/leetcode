<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="77"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606e"/>
    </marker>
  </defs>
  <rect width="860" height="470" fill="#fafafa"/>

  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：两列黑格 → 「块 + 窗口」的链</text>
  <path d="M 120 40 Q 430 48 740 40" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- ============ 上：官方样例 3 的网格（列1 = [1,4],[7,10]；列2 = [3,7],[9,12]） ============ -->
  <text x="60" y="72" text-anchor="start" font-size="12" fill="#8a8a8a" filter="url(#rough2)">行号</text>
  <g filter="url(#rough2)">
    <text x="118" y="72" text-anchor="middle" font-size="9.5" fill="#8a8a8a">1</text>
    <text x="142" y="72" text-anchor="middle" font-size="9.5" fill="#8a8a8a">2</text>
    <text x="166" y="72" text-anchor="middle" font-size="9.5" fill="#8a8a8a">3</text>
    <text x="190" y="72" text-anchor="middle" font-size="9.5" fill="#8a8a8a">4</text>
    <text x="214" y="72" text-anchor="middle" font-size="9.5" fill="#8a8a8a">5</text>
    <text x="238" y="72" text-anchor="middle" font-size="9.5" fill="#8a8a8a">6</text>
    <text x="262" y="72" text-anchor="middle" font-size="9.5" fill="#8a8a8a">7</text>
    <text x="286" y="72" text-anchor="middle" font-size="9.5" fill="#8a8a8a">8</text>
    <text x="310" y="72" text-anchor="middle" font-size="9.5" fill="#8a8a8a">9</text>
    <text x="334" y="72" text-anchor="middle" font-size="9.5" fill="#8a8a8a">10</text>
    <text x="358" y="72" text-anchor="middle" font-size="9.5" fill="#8a8a8a">11</text>
    <text x="382" y="72" text-anchor="middle" font-size="9.5" fill="#8a8a8a">12</text>
  </g>
  <text x="70" y="98" text-anchor="end" font-size="13" fill="#2f4a66" filter="url(#rough2)">列 1</text>
  <text x="70" y="122" text-anchor="end" font-size="13" fill="#3c5e2e" filter="url(#rough2)">列 2</text>

  <!-- 列1 第1..12 行：黑 1,2,3,4 / 7,8,9,10 -->
  <g filter="url(#rough2)">
    <rect x="106" y="78" width="24" height="22" fill="#cfe0f5" stroke="#446688" stroke-width="1.2"/>
    <rect x="130" y="78" width="24" height="22" fill="#cfe0f5" stroke="#446688" stroke-width="1.2"/>
    <rect x="154" y="78" width="24" height="22" fill="#cfe0f5" stroke="#446688" stroke-width="1.2"/>
    <rect x="178" y="78" width="24" height="22" fill="#cfe0f5" stroke="#446688" stroke-width="1.2"/>
    <rect x="202" y="78" width="24" height="22" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="226" y="78" width="24" height="22" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="250" y="78" width="24" height="22" fill="#cfe0f5" stroke="#446688" stroke-width="1.2"/>
    <rect x="274" y="78" width="24" height="22" fill="#cfe0f5" stroke="#446688" stroke-width="1.2"/>
    <rect x="298" y="78" width="24" height="22" fill="#cfe0f5" stroke="#446688" stroke-width="1.2"/>
    <rect x="322" y="78" width="24" height="22" fill="#cfe0f5" stroke="#446688" stroke-width="1.2"/>
    <rect x="346" y="78" width="24" height="22" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="370" y="78" width="24" height="22" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- 列2：行 3..7, 9..12 -->
    <rect x="106" y="102" width="24" height="22" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="130" y="102" width="24" height="22" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="154" y="102" width="24" height="22" fill="#d7ecd7" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="178" y="102" width="24" height="22" fill="#d7ecd7" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="202" y="102" width="24" height="22" fill="#d7ecd7" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="226" y="102" width="24" height="22" fill="#d7ecd7" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="250" y="102" width="24" height="22" fill="#d7ecd7" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="274" y="102" width="24" height="22" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" stroke-dasharray="3 2"/>
    <rect x="298" y="102" width="24" height="22" fill="#d7ecd7" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="322" y="102" width="24" height="22" fill="#d7ecd7" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="346" y="102" width="24" height="22" fill="#d7ecd7" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="370" y="102" width="24" height="22" fill="#d7ecd7" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <rect x="430" y="66" width="360" height="60" rx="8" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.1"/>
    <rect x="442" y="76" width="16" height="12" fill="#cfe0f5" stroke="#446688" stroke-width="1.1"/>
    <text x="464" y="87" font-size="11.5" fill="#2f4a66">只有列 1 黑 → 强制色 1</text>
    <rect x="442" y="94" width="16" height="12" fill="#d7ecd7" stroke="#4a7a3a" stroke-width="1.1"/>
    <text x="464" y="105" font-size="11.5" fill="#3c5e2e">只有列 2 黑 → 强制色 2</text>
    <rect x="620" y="76" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <rect x="620" y="74" width="16" height="12" fill="#d7ecd7" stroke="#4a7a3a" stroke-width="1.1" opacity="0.6"/>
    <text x="644" y="87" font-size="11.5" fill="#8a6520">两列都黑 → 自由</text>
    <text x="644" y="105" font-size="11.5" fill="#8a6520">（颜色可任选）</text>
  </g>

  <!-- ============ 中：初等段带 ============ -->
  <text x="70" y="147" text-anchor="end" font-size="12.5" fill="#55606e" filter="url(#rough2)">初等段</text>
  <g filter="url(#rough2)">
    <rect x="106" y="132" width="48" height="22" fill="#cfe0f5" stroke="#446688" stroke-width="1.3"/>
    <text x="130" y="147" text-anchor="middle" font-size="9.5" fill="#2f4a66">仅1 ×2</text>
    <rect x="154" y="132" width="48" height="22" fill="#ffe9c7" stroke="#d6a040" stroke-width="1.4"/>
    <text x="178" y="147" text-anchor="middle" font-size="9.5" fill="#8a6520">自由 ×2</text>
    <rect x="202" y="132" width="48" height="22" fill="#d7ecd7" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="226" y="147" text-anchor="middle" font-size="9.5" fill="#3c5e2e">仅2 ×2</text>
    <rect x="250" y="132" width="24" height="22" fill="#ffe9c7" stroke="#d6a040" stroke-width="1.4"/>
    <text x="262" y="147" text-anchor="middle" font-size="9.5" fill="#8a6520">×1</text>
    <rect x="274" y="132" width="24" height="22" fill="#cfe0f5" stroke="#446688" stroke-width="1.3"/>
    <text x="286" y="147" text-anchor="middle" font-size="9.5" fill="#2f4a66">×1</text>
    <rect x="298" y="132" width="48" height="22" fill="#ffe9c7" stroke="#d6a040" stroke-width="1.4"/>
    <text x="322" y="147" text-anchor="middle" font-size="9.5" fill="#8a6520">自由 ×2</text>
    <rect x="346" y="132" width="48" height="22" fill="#d7ecd7" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="370" y="147" text-anchor="middle" font-size="9.5" fill="#3c5e2e">仅2 ×2</text>
  </g>

  <!-- 说明框 -->
  <g filter="url(#rough2)">
    <rect x="430" y="128" width="360" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="442" y="148" font-size="11.5" fill="#8a6520">自由段最多切一刀；最优解里它整块归左或整块归右</text>
  </g>

  <!-- ============ 下：链 ============ -->
  <path d="M 130 175 Q 430 183 730 175" stroke="#b9b9b9" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="430" y="200" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">抽出来就是「块 a1..a4」与「窗口 w1..w3」交替的一条链</text>

  <!-- 块 / 窗口：比例 2,2,2,1,2,2,2（单位 40px，从 x=170 起） -->
  <g filter="url(#rough2)">
    <rect x="170" y="222" width="80" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="210" y="243" text-anchor="middle" font-size="12" fill="#2f4a66">a1（列1）</text>
    <text x="210" y="261" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66">2</text>

    <rect x="250" y="234" width="80" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="290" y="250" text-anchor="middle" font-size="11.5" fill="#8a6520">w1 = 2</text>

    <rect x="330" y="222" width="80" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="370" y="243" text-anchor="middle" font-size="12" fill="#3c5e2e">a2（列2）</text>
    <text x="370" y="261" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c5e2e">2</text>

    <rect x="410" y="234" width="40" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="430" y="250" text-anchor="middle" font-size="11.5" fill="#8a6520">w2=1</text>

    <rect x="450" y="222" width="40" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="470" y="243" text-anchor="middle" font-size="12" fill="#2f4a66">a3</text>
    <text x="470" y="261" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66">1</text>

    <rect x="490" y="234" width="80" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="530" y="250" text-anchor="middle" font-size="11.5" fill="#8a6520">w3 = 2</text>

    <rect x="570" y="222" width="80" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="610" y="243" text-anchor="middle" font-size="12" fill="#3c5e2e">a4（列2）</text>
    <text x="610" y="261" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c5e2e">2</text>
  </g>

  <!-- 结果行 -->
  <g filter="url(#rough2)">
    <rect x="120" y="292" width="620" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="134" y="314" font-size="12.5" fill="#3c5e2e">本样例的最优分配：w1 归 a2、w2 归 a2、w3 归 a4 ⇒ 长度 (2, 5, 1, 4) ⇒ 排序后 5 4 2 1</text>
  </g>

  <!-- 两条根据 -->
  <g filter="url(#rough2)">
    <rect x="120" y="340" width="300" height="66" rx="8" fill="#f7fbff" stroke="#446688" stroke-width="1.3"/>
    <text x="132" y="360" font-size="12" font-weight="bold" fill="#2f4a66">① 所有黑格都要选</text>
    <text x="132" y="378" font-size="11.5" fill="#2f4a66">多选一格只会让某段变长（或新增长度 1）</text>
    <text x="132" y="395" font-size="11.5" fill="#2f4a66">字典序不可能变差 ⇒ 答案的总长度固定</text>

    <rect x="440" y="340" width="300" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <text x="452" y="360" font-size="12" font-weight="bold" fill="#a03a36">② 自由段里切两刀是亏的</text>
    <text x="452" y="378" font-size="11.5" fill="#a03a36">中间那一段两侧同色 ⇒ 三段可并成一段</text>
    <text x="452" y="395" font-size="11.5" fill="#a03a36">sum 更大 ⇒ 字典序更优，故最多切一刀</text>
  </g>
</svg>
