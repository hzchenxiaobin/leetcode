<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444">每块石头最终带着 + 或 − 号：答案 = |Σ ±aᵢ|</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">粉碎过程保持「带符号和」不变，且每种符号分配都能实现</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="120" y="86" fill="#4a7a3a">＋</text>
    <text x="230" y="86" fill="#b85450">−</text>
    <rect x="150" y="100" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="202" y="100" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="254" y="100" width="52" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="306" y="100" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <rect x="358" y="100" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <text x="176" y="126" fill="#3a5a30">2</text>
    <text x="228" y="126" fill="#3a5a30">7</text>
    <text x="280" y="126" fill="#3a5a30">4</text>
    <text x="332" y="126" fill="#8a3a36">1</text>
    <text x="384" y="126" fill="#8a3a36">8</text>
  </g>

  <text x="176" y="92" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">+</text>
  <text x="228" y="92" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">+</text>
  <text x="280" y="92" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">+</text>
  <text x="332" y="92" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">−</text>
  <text x="384" y="92" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">−</text>
  <text x="436" y="92" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">−</text>
  <text x="436" y="126" text-anchor="middle" font-size="13" fill="#8a3a36">1</text>
  <rect x="410" y="100" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>

  <rect x="90" y="166" width="380" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="106" y="186" font-size="11" fill="#3a4a66" font-weight="bold">粉碎 = 带符号求和的化简</text>
  <text x="106" y="206" font-size="10" fill="#555">两块同号合并：符号不变、重量相加（如 +a 与 +b → +(a+b)）</text>

  <path d="M 280 222 L 280 244" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="246" width="380" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="106" y="266" font-size="11" fill="#3a5a30" font-weight="bold">两块异号合并：抵消，净重 = |a − b|，符号取较重者</text>
  <text x="106" y="286" font-size="10" fill="#555">所有 + 号内部先合并、− 号内部先合并，最后做一次减法</text>

  <text x="280" y="326" text-anchor="middle" font-size="10" fill="#999">示例：+2+7+4 −1−8−1 = 13 − 10 = 3？ 但最优是 1：把 8 从减号挪到加号侧即可</text>
  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#999">于是问题变成：把石头分成两堆，使两堆总和之差最小 —— 即 0/1 背包</text>
  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#999">答案 = 总和 − 2 ×（不超过总和一半的最大可凑子集和）</text>
</svg>
