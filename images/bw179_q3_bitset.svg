<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="372" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">实现：把「集合」写成 0/1 数组（或 bitset）</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">值域 0…1023 → 每格一个长度 1024 的布尔数组，转移是一次线性扫描</text>
  <text x="36" y="84" text-anchor="start" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">dp[i][j]：</text>
  <rect x="130" y="66" width="34" height="34" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147.0" y="86.96" text-anchor="middle" font-size="11" fill="#666666" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="147" y="116" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <rect x="170" y="66" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187.0" y="86.96" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="187" y="116" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <rect x="210" y="66" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227.0" y="86.96" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="227" y="116" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <rect x="250" y="66" width="34" height="34" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="267.0" y="86.96" text-anchor="middle" font-size="11" fill="#666666" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="267" y="116" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>
  <rect x="290" y="66" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307.0" y="86.96" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="307" y="116" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">4</text>
  <rect x="330" y="66" width="34" height="34" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347.0" y="86.96" text-anchor="middle" font-size="11" fill="#666666" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="347" y="116" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">5</text>
  <rect x="370" y="66" width="34" height="34" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="387.0" y="86.96" text-anchor="middle" font-size="11" fill="#666666" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="387" y="116" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">6</text>
  <rect x="410" y="66" width="34" height="34" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="427.0" y="86.96" text-anchor="middle" font-size="11" fill="#666666" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="427" y="116" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">7</text>
  <rect x="450" y="66" width="34" height="34" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="467.0" y="86.96" text-anchor="middle" font-size="11" fill="#666666" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="467" y="116" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">8</text>
  <rect x="490" y="66" width="34" height="34" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="507.0" y="86.96" text-anchor="middle" font-size="11" fill="#666666" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="507" y="116" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">9</text>
  <text x="536" y="88" text-anchor="start" font-size="12" fill="#888" filter="url(#rough2)">…</text>
  <text x="130" y="140" text-anchor="start" font-size="9.5" fill="#666" filter="url(#rough2)">第 i 行第 j 列：值 x 可达则置 1</text>
  <rect x="36" y="158" width="488" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="178" text-anchor="start" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">转移（对每个可达的 x 扫一遍）</text>
  <text x="48" y="196" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">for x in 0..N-1:  if (up[x] or left[x])  cur[x ^ v] = 1</text>
  <text x="48" y="214" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">N = 大于 max(grid) 的最小 2 的幂（本题 1024），保证 x ^ v &lt; N</text>
  <rect x="36" y="236" width="488" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="256" text-anchor="start" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="48" y="274" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">时间 O(m·n·N)，m·n ≤ 1000、N ≤ 1024 → 约 10^6 次操作</text>
  <text x="48" y="292" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">空间 O(m·n·N) 的 char 数组（约 1 MB），也可只保留两行做滚动</text>
  <rect x="36" y="310" width="488" height="44" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="330" text-anchor="start" font-size="11.5" fill="#666666" font-weight="bold" filter="url(#rough2)">为什么值域上界是 1024</text>
  <text x="48" y="347" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">异或只会把 10 位内的比特翻来翻去，结果始终 &lt; 1024；</text>
  <text x="48" y="364" text-anchor="start" font-size="9.5" fill="#555" filter="url(#rough2)">所有 grid 值 ≤ 1023，所以 1024 个槽位足够</text>
</svg>
