<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：两条路径的并集 = 5 颗樱桃</text>
  <text x="290" y="46" text-anchor="middle" font-size="11" fill="#888">grid = [[0,1,−1],[1,0,−1],[1,1,1]]，绿色是路径 A，橙色虚线是路径 B</text>

  <g filter="url(#rough2)">
    <rect x="46" y="86" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="100" y="86" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="154" y="86" width="54" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="46" y="140" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="100" y="140" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="154" y="140" width="54" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="46" y="194" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="100" y="194" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="154" y="194" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="14" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="73" y="118">0</text>
    <text x="127" y="118">1</text>
    <text x="181" y="118">−1</text>
    <text x="73" y="172">1</text>
    <text x="127" y="172">0</text>
    <text x="181" y="172">−1</text>
    <text x="73" y="226">1</text>
    <text x="127" y="226">1</text>
    <text x="181" y="226">1</text>
  </g>

  <path d="M 69 106 L 69 216 L 176 216" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 79 118 L 130 118 L 130 224 L 184 224" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="7 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="120" y="264" text-anchor="middle" font-size="10.5" fill="#3a5a30">A：↓ ↓ → →</text>
  <text x="120" y="282" text-anchor="middle" font-size="10.5" fill="#8a6a20">B：→ ↓ ↓ →</text>
  <text x="120" y="302" text-anchor="middle" font-size="10" fill="#999">荆棘格 (0,2)、(1,2) 永不可入</text>

  <text x="400" y="86" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">按步数 k 分层求最优</text>
  <g font-size="10" fill="#888" filter="url(#rough2)">
    <text x="268" y="108" text-anchor="middle">k</text>
    <text x="336" y="108" text-anchor="middle">最优 dp</text>
    <text x="398" y="108">说明</text>
  </g>
  <path d="M 244 114 L 556 114" stroke="#ccc" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#555" filter="url(#rough2)">
    <text x="268" y="134" text-anchor="middle">0</text>
    <text x="336" y="134" text-anchor="middle">0</text>
    <text x="398" y="134" font-size="10">(0,0) 值为 0</text>
    <text x="268" y="158" text-anchor="middle">1</text>
    <text x="336" y="158" text-anchor="middle">2</text>
    <text x="398" y="158" font-size="10">(0,1)+(1,0)</text>
    <text x="268" y="182" text-anchor="middle">2</text>
    <text x="336" y="182" text-anchor="middle">3</text>
    <text x="398" y="182" font-size="10">分开走更划算</text>
    <text x="268" y="206" text-anchor="middle">3</text>
    <text x="336" y="206" text-anchor="middle">4</text>
    <text x="398" y="206" font-size="10">只剩 (2,2) 可行</text>
    <text x="268" y="230" text-anchor="middle">4</text>
    <text x="336" y="230" text-anchor="middle" font-weight="bold" fill="#8a3a36">5</text>
    <text x="398" y="230" font-size="10">终点合并，答案 5</text>
  </g>
  <path d="M 244 240 L 556 240" stroke="#ccc" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="244" y="252" width="312" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="258" y="270" font-size="10" fill="#3a4a66">k = 2 时 (r₁,r₂) = (1,2) 已到 3 颗；</text>
  <text x="258" y="288" font-size="10" fill="#3a4a66">k = 4 只剩 (2,2) 一个状态，故 dp = 5。</text>

  <rect x="30" y="316" width="520" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="46" y="336" font-size="10.5" fill="#8a6a20">A ∪ B 共覆盖 7 个格子，其中 5 个装有樱桃：(0,1) (1,0) (2,0) (2,1) (2,2)</text>
  <text x="46" y="356" font-size="10.5" fill="#666">等价说法：去程摘 4 颗，回程再把 (0,1) 这颗收下，合计 5 颗 —— 就是示例解释里的路线。</text>

  <text x="290" y="392" text-anchor="middle" font-size="10" fill="#999">并集里 (0,0)、(2,1)、(2,2) 被两条路径共享，只计一次</text>
</svg>
