<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 415" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="415" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">数位 DP：逐位扫描 16 位补零串，维护 (i, tight, prev)</text>

  <!-- 16-box strip, DDRRDR: constrained {0,4,8,9,10,14,15} -->
  <text x="42" y="54" font-size="11.5" fill="#666" filter="url(#rough2)">上界 X 的 16 位补零串（以 "DDRRDR" 为例，受限下标标蓝）：</text>
  <g filter="url(#rough2)">
    <rect x="42" y="62" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="72" y="62" width="26" height="28" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="102" y="62" width="26" height="28" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="132" y="62" width="26" height="28" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="162" y="62" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="192" y="62" width="26" height="28" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="222" y="62" width="26" height="28" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="252" y="62" width="26" height="28" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="282" y="62" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="312" y="62" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="342" y="62" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="372" y="62" width="26" height="28" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="402" y="62" width="26" height="28" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="432" y="62" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="462" y="62" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="492" y="62" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <text x="55" y="81" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="85" y="81" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="115" y="81" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="145" y="81" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="175" y="81" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="205" y="81" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="235" y="81" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="265" y="81" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>
  <text x="295" y="81" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="325" y="81" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="355" y="81" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="385" y="81" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">11</text>
  <text x="415" y="81" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">12</text>
  <text x="445" y="81" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">13</text>
  <text x="475" y="81" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">14</text>
  <text x="505" y="81" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">15</text>

  <!-- legend -->
  <rect x="42" y="100" width="14" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="62" y="110" font-size="11" fill="#555" filter="url(#rough2)">受限位：填 d ≥ prev，随后 prev ← d</text>
  <rect x="296" y="100" width="14" height="12" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="316" y="110" font-size="11" fill="#555" filter="url(#rough2)">自由位：d ∈ [0, 9] 随意</text>
  <text x="42" y="132" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">上界：hi = tight ? X[i] : 9　（贴界时只能填到 X[i]，一旦填更小就永久自由）</text>

  <!-- flowchart -->
  <g filter="url(#rough2)">
    <rect x="36" y="156" width="150" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10"/>
    <polygon points="262,146 330,177 262,208 194,177" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="372" y="159" width="106" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <polygon points="262,236 344,267 262,298 180,267" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="18" y="242" width="142" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
    <rect x="372" y="242" width="170" height="52" fill="#f0f0f0" stroke="#888888" stroke-width="1.6" rx="8"/>
    <rect x="150" y="330" width="270" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"/>
  </g>
  <text x="111" y="182" text-anchor="middle" font-size="13" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">dfs(i, tight, prev)</text>
  <text x="262" y="182" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">i = 16 ?</text>
  <text x="425" y="182" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">返回 1</text>
  <text x="262" y="272" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">i 是受限位 ?</text>
  <text x="89" y="262" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">d ∈ [max(prev,0), hi]</text>
  <text x="89" y="281" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">prev ← d</text>
  <text x="457" y="262" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">d ∈ [0, hi]</text>
  <text x="457" y="281" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">prev 不变</text>
  <text x="285" y="350" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">tight' = tight 且 (d = hi)，否则脱离上界</text>
  <text x="285" y="369" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">递归 dfs(i+1, tight', prev')</text>

  <g filter="url(#rough2)">
    <path d="M 186 177 L 216 177" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
    <path d="M 330 177 L 368 177" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
    <path d="M 262 208 L 262 232" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
    <path d="M 180 267 L 164 267" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
    <path d="M 344 267 L 368 267" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
    <path d="M 89 294 L 89 355 L 146 355" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)"/>
    <path d="M 457 294 L 457 355 L 424 355" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)"/>
  </g>
  <text x="345" y="169" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="272" y="226" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="170" y="259" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="354" y="259" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <text x="280" y="402" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">f(X) 从 dfs(0, true, −1) 出发；答案 = f(r) − f(l−1)</text>
</svg>
