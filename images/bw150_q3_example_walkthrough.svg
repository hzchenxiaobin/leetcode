<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：[[0,0,1],[2,2,1]] → 并集面积 2，一半为 1，答案 y = 1</text>
  <text x="320" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两个 1×1 正方形不重叠，事件把 y 轴切成三段</text>

  <g filter="url(#rough2)">
    <rect x="40" y="64" width="560" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <rect x="40" y="92" width="560" height="120" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66" font-weight="bold">
    <text x="58" y="83" filter="url(#rough2)">层（两个相邻事件之间）</text>
    <text x="250" y="83" filter="url(#rough2)">该层截面 L(t)</text>
    <text x="390" y="83" filter="url(#rough2)">该层面积 = L × 层高</text>
    <text x="548" y="83" filter="url(#rough2)">累计</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5">
    <rect x="44" y="96" width="552" height="24" fill="#e6f4ea" rx="4" filter="url(#rough2)"/>
    <text x="58" y="113" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">[0, 1]</text>
    <text x="250" y="113" fill="#3a5a30" filter="url(#rough2)">1（正方形 A 的宽度）</text>
    <text x="390" y="113" fill="#3a5a30" filter="url(#rough2)">1 × 1 = 1</text>
    <text x="548" y="113" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1 ≥ half ✓</text>
    <line x1="44" y1="122" x2="596" y2="122" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
    <text x="58" y="141" fill="#666" filter="url(#rough2)">[1, 2]</text>
    <text x="250" y="141" fill="#666" filter="url(#rough2)">0（A 已到顶，B 还没开始）</text>
    <text x="390" y="141" fill="#666" filter="url(#rough2)">0</text>
    <text x="548" y="141" fill="#666" filter="url(#rough2)">1</text>
    <line x1="44" y1="150" x2="596" y2="150" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
    <text x="58" y="169" fill="#666" filter="url(#rough2)">[2, 3]</text>
    <text x="250" y="169" fill="#666" filter="url(#rough2)">1（正方形 B）</text>
    <text x="390" y="169" fill="#666" filter="url(#rough2)">1 × 1 = 1</text>
    <text x="548" y="169" fill="#666" filter="url(#rough2)">2 = 总面积</text>
    <line x1="44" y1="178" x2="596" y2="178" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
    <text x="58" y="197" fill="#666" filter="url(#rough2)">[3, ∞)</text>
    <text x="250" y="197" fill="#666" filter="url(#rough2)">0</text>
    <text x="390" y="197" fill="#666" filter="url(#rough2)">0</text>
    <text x="548" y="197" fill="#666" filter="url(#rough2)">2</text>
  </g>

  <path d="M 320 212 L 320 230" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="40" y="234" width="270" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="54" y="254" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">在第一个就跨过一半的层里解</text>
  <text x="54" y="274" font-size="10" fill="#555" filter="url(#rough2)">y = 层底 0 + (half − 0) / L</text>
  <text x="54" y="292" font-size="10" fill="#555" filter="url(#rough2)">= 1 / 1 = 1.0</text>

  <rect x="330" y="234" width="270" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="344" y="254" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">精确性</text>
  <text x="344" y="274" font-size="10" fill="#555" filter="url(#rough2)">L 与层高都是整数，累计面积是整数；</text>
  <text x="344" y="292" font-size="10" fill="#555" filter="url(#rough2)">只在最后一步做一次除法 → 无累计误差。</text>

  <rect x="40" y="318" width="560" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="54" y="338" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">对照示例 2：squares = [[0,0,2],[1,1,1]]</text>
  <text x="54" y="356" font-size="10" fill="#555" filter="url(#rough2)">小正方形完全落在大的内部 ⇒ 并集面积 = 4（不是 5），half = 2；每层 L(t) = 2，故 y = 2/2 = 1.0。</text>
  <text x="54" y="374" font-size="10" fill="#555" filter="url(#rough2)">而 Q2 的"重复计数"版本在同样输入下答案是 7/6 ≈ 1.16667 —— 两个版本只差"重叠算不算两次"。</text>
</svg>
