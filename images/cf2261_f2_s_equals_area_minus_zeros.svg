  <rect x="94" y="176" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="117.0" y="205.0" font-size="17" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="186" y="222" width="46" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="209.0" y="251.0" font-size="17" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="48" y="340" font-size="14" fill="#444" text-anchor="start" font-weight="normal" filter="url(#rough2)">窗口 H=3, W=4，含 z=2 个 0 ⇒ S = 12 − 2 = 10</text>
  <text x="48" y="362" font-size="13" fill="#777" text-anchor="start" font-weight="normal" filter="url(#rough2)">机器人只看到 S=10，看不到 H、W、z</text>
  <rect x="336" y="64" width="410" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="352" y="90" font-size="15" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">行阶段：W = n，H ≥ 4</text>
  <text x="352" y="114" font-size="14" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">S = H·n − z ∈ {H·n−3, H·n−2}</text>
  <text x="352" y="138" font-size="14" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">z = 3 → U（删上边）    z = 2 → D（删下边）</text>
  <rect x="336" y="172" width="410" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="352" y="198" font-size="15" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">列阶段：H = 3，W ≥ 2</text>
  <text x="352" y="222" font-size="14" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">S = 3W − z，且 S mod 3 = (−z) mod 3</text>
  <text x="352" y="246" font-size="14" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">z = 2 → L（删左边）    其他 z → R（删右边）</text>
  <rect x="336" y="284" width="410" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="352" y="310" font-size="15" fill="#d6a040" text-anchor="start" font-weight="bold" filter="url(#rough2)">收尾：面积 ≤ 3</text>
  <text x="352" y="334" font-size="13" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">S ∈ {0,1,2}：S ≤ 1 → U（删上边），S = 2 → D（删下边）</text>
  <text x="36" y="408" font-size="14" fill="#555" text-anchor="start" font-weight="normal" filter="url(#rough2)">三段下标互不重叠：[0,2] 收尾 · [3,3n−1] 列阶段 · [4n−3, n²−2] 行阶段</text>
</svg>
