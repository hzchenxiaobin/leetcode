<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 424" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect x="-20" y="-20" width="820" height="464" fill="#fafafa" filter="url(#rough2)"/>
  <text x="36" y="40" font-size="19" fill="#222" text-anchor="start" font-weight="normal" filter="url(#rough2)">核心观察：S = 面积 − 窗口内 0 的个数，一张表服务三个阶段</text>
  <rect x="48" y="84" width="230" height="230" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="48" y="84" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
