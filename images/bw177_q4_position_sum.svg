<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 408" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="408" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按位拆解：固定一位，其余 k−1 位任意</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">l = 1, r = 2, k = 2：四位数字 11 / 12 / 21 / 22</text>
  <rect x="80" y="66" width="80" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120.0" y="89.68" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">11</text>
  <rect x="176" y="66" width="80" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216.0" y="89.68" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">12</text>
  <rect x="272" y="66" width="80" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312.0" y="89.68" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">21</text>
  <rect x="368" y="66" width="80" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408.0" y="89.68" text-anchor="middle" font-size="13" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">22</text>
  <text x="80" y="128" text-anchor="start" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">十位（权 10）</text>
  <text x="176" y="128" text-anchor="start" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">个位（权 1）</text>
  <text x="80" y="148" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">取值：1,1,2,2 各 2 次</text>
  <text x="80" y="166" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">求和 = 2×(1+2) = 6</text>
  <text x="300" y="148" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">取值：1,2,1,2 各 2 次</text>
  <text x="300" y="166" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">求和 = 2×(1+2) = 6</text>
  <rect x="36" y="186" width="488" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="206" text-anchor="start" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">第 p 位（权 10^p）的总贡献</text>
  <text x="48" y="224" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">该位固定为 d 时，其余 k−1 位可任取 → 共有 C^(k−1) 种（C = r − l + 1）</text>
  <text x="48" y="242" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">d 遍历 [l, r] → 该位贡献 = (l + (l+1) + … + r) · C^(k−1) · 10^p</text>
  <path d="M 280 252 L 280 276" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="280" width="488" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="300" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">把 p 从 0 加到 k−1</text>
  <text x="48" y="318" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">总答案 = Σd · C^(k−1) · (10^0 + 10^1 + … + 10^(k−1)) = Σd · C^(k−1) · (10^k − 1)/9</text>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">代入示例：3 · 2 · 11 = 66 ✓</text>
  <text x="280" y="390" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">Σd = (l + r)(r − l + 1)/2；k 可达 10^9，所以幂次一律用快速幂 + 逆元</text>
</svg>
