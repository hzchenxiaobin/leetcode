<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d1f"/>
    </marker>
  </defs>

  <rect width="640" height="490" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：区间扩张时值不减 —— 按左端点切成 n 列有序表</text>

  <!-- 顶部：扩张示意 -->
  <text x="118" y="70" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">nums</text>
  <rect x="160" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="234" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="308" y="48" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="330" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <rect x="382" y="48" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="404" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- 括号 A：[2,5] -->
  <path d="M240,96 L240,90 L350,90 L350,96" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="293" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">值 = 5 − 2 = 3</text>
  <!-- 括号 B：[2,5,1] -->
  <path d="M240,128 L240,122 L422,122 L422,128" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="330" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">值 = 5 − 1 = 4</text>
  <!-- 扩张箭头 -->
  <path d="M356,98 Q400,98 416,116" stroke="#8a6d1f" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="400" y="92" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">右端扩一格</text>

  <!-- 右侧：单调性说明框 -->
  <rect x="470" y="48" width="155" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="547" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">扩张单调性</text>
  <text x="547" y="90" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">区间变大：</text>
  <text x="547" y="106" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">max 只增不减</text>
  <text x="547" y="122" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">min 只减不增</text>
  <text x="547" y="140" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⟹ 值单调不减</text>

  <!-- 中部：f 值矩阵 -->
  <text x="320" y="168" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">f(l, r) 值矩阵（行 = 左端点 l，列 = 右端点 r）—— 每行从左到右非降</text>
  <path d="M192,185 L425,185" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="189" font-size="10" fill="#888" filter="url(#rough2)">r 增大</text>

  <text x="211" y="204" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">r=0</text>
  <text x="283" y="204" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">r=1</text>
  <text x="355" y="204" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">r=2</text>
  <text x="427" y="204" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">r=3</text>

  <!-- 行 l=0 -->
  <text x="168" y="231" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">l=0</text>
  <rect x="180" y="210" width="62" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="211" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="252" y="210" width="62" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="324" y="210" width="62" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="396" y="210" width="62" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="427" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>

  <!-- 行 l=1 -->
  <text x="168" y="273" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">l=1</text>
  <rect x="180" y="252" width="62" height="34" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="211" y="274" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="252" y="252" width="62" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="274" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="324" y="252" width="62" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="274" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="396" y="252" width="62" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="427" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>

  <!-- 行 l=2 -->
  <text x="168" y="315" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">l=2</text>
  <rect x="180" y="294" width="62" height="34" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="211" y="316" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="252" y="294" width="62" height="34" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="283" y="316" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="324" y="294" width="62" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="316" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="396" y="294" width="62" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="427" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>

  <!-- 行 l=3 -->
  <text x="168" y="357" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">l=3</text>
  <rect x="180" y="336" width="62" height="34" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="211" y="358" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="252" y="336" width="62" height="34" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="283" y="358" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="324" y="336" width="62" height="34" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="355" y="358" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="396" y="336" width="62" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="358" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- 右侧：分列说明框 -->
  <rect x="470" y="212" width="158" height="158" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="549" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">按左端点分列</text>
  <text x="549" y="254" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">第 l 列元素：</text>
  <text x="549" y="272" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">f(l,l) ≤ f(l,l+1)</text>
  <text x="549" y="288" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">≤ … ≤ f(l,n−1)</text>
  <text x="549" y="306" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">天然有序（引理 2）</text>
  <text x="549" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">n 列有序表</text>
  <text x="549" y="348" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">top-k = 大根堆</text>
  <text x="549" y="364" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">k 路归并</text>

  <!-- 底部结论框 -->
  <rect x="70" y="388" width="500" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="410" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">全体子数组值的前 k 大 = n 列有序表的堆归并</text>
  <text x="320" y="430" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">无需生成 O(n²) 个值：每列只在被弹出后才露出下一个候选</text>

  <!-- 图例 -->
  <rect x="100" y="458" width="12" height="12" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="118" y="468" font-size="11" fill="#666" filter="url(#rough2)">值 = D 的三个区间（k = 3 时全取）</text>
  <rect x="380" y="458" width="12" height="12" rx="3" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="398" y="468" font-size="11" fill="#666" filter="url(#rough2)">l &gt; r 无效格</text>
</svg>
