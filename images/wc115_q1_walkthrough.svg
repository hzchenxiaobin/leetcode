<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">示例 1：cells = [0,1,0,1,1,0,0,1]，逐日状态</text>
  <rect x="60" y="48" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="66.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">天</text>
  <rect x="120" y="48" width="170" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="66.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">状态（8 位）</text>
  <rect x="290" y="48" width="210" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395" y="66.14" text-anchor="middle" font-size="11.5" fill="#333333" font-weight="bold" filter="url(#rough2)">说明</text>
  <rect x="60" y="76" width="60" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="94.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">0</text>
  <rect x="120" y="76" width="170" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="94.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">0101 1001</text>
  <rect x="290" y="76" width="210" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395" y="94.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">初始</text>
  <rect x="60" y="104" width="60" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="122.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">1</text>
  <rect x="120" y="104" width="170" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="122.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">0110 0000</text>
  <rect x="290" y="104" width="210" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395" y="122.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">两端归零</text>
  <rect x="60" y="132" width="60" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="150.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">2</text>
  <rect x="120" y="132" width="170" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="150.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">0000 1110</text>
  <rect x="290" y="132" width="210" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395" y="150.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">第 4、5、6 位点亮</text>
  <rect x="60" y="160" width="60" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="178.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">3</text>
  <rect x="120" y="160" width="170" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="178.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">0110 0100</text>
  <rect x="290" y="160" width="210" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395" y="178.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)"></text>
  <rect x="60" y="188" width="60" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="206.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">4</text>
  <rect x="120" y="188" width="170" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="206.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">0000 0100</text>
  <rect x="290" y="188" width="210" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395" y="206.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)"></text>
  <rect x="60" y="216" width="60" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="234.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">5</text>
  <rect x="120" y="216" width="170" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="234.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">0111 0100</text>
  <rect x="290" y="216" width="210" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395" y="234.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)"></text>
  <rect x="60" y="244" width="60" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="262.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">6</text>
  <rect x="120" y="244" width="170" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="262.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">0010 1100</text>
  <rect x="290" y="244" width="210" height="28" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395" y="262.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)"></text>
  <rect x="60" y="272" width="60" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="290.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">7</text>
  <rect x="120" y="272" width="170" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="290.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">0011 0000</text>
  <rect x="290" y="272" width="210" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395" y="290.14" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">与输出一致</text>
  <text x="280" y="344" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">n = 7 很小，直接模拟即可；n = 10⁹ 时才需要取模跳周期</text>
</svg>
