<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>
  <text x="24" y="32" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">算法流程：按步长绕圈，集满就停</text>
  <rect x="60" y="56" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="82.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">ans = [起点]；step = 1；d = 东</text>
  <path d="M280 100 L280 128" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="60" y="130" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="156.55" text-anchor="middle" font-size="13" fill="#8a6410" filter="url(#rough2)">循环条件：len(ans) &lt; rows × cols</text>
  <path d="M280 174 L280 202" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="60" y="204" width="440" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="231.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">沿 d 走 step 步：越界跳过</text>
  <text x="280.0" y="251.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">落进网格就加入 ans（集满立即返回）</text>
  <path d="M280 270 L280 298" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="60" y="300" width="440" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="327.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">d 右转；每走完 2 个方向 step += 1</text>
  <text x="280.0" y="347.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">步长序列 1,1,2,2,3,3,…</text>
  <path d="M60 333 L26 333 L26 152 L54 152" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="18" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">继续</text>
  <path d="M500 152 L546 152 L546 436 L504 436" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="552" y="300" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">集满</text>
  <rect x="60" y="410" width="440" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="437.55" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">返回 ans（按访问顺序）</text>
</svg>
