<svg xmlns="http://www.w3.org/2000/svg" width="760" height="446" viewBox="0 0 760 446"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="446" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例演算：a = [7, 6, 2, 2] → 32</text>
  <path d="M 200 44 Q 380 50 560 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="120" y="84" text-anchor="middle" font-size="12" fill="#5a5a5a" filter="url(#rough2)">动到第几个 t</text>
  <text x="400" y="84" text-anchor="middle" font-size="12" fill="#5a5a5a" filter="url(#rough2)">可达数组（位置 3、4 的 2 恒不变）</text>
  <text x="680" y="84" text-anchor="middle" font-size="12" fill="#5a5a5a" filter="url(#rough2)">方案数</text>

  <rect x="60" y="94" width="640" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">t = 0</text>
  <text x="400" y="124" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">(7, 6, 2, 2)　一次都不操作</text>
  <text x="680" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>

  <rect x="60" y="152" width="640" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">t = 1</text>
  <text x="400" y="176" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">(c₁, 6, 2, 2)，c₁ ∈ [1, 6]</text>
  <text x="400" y="193" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">c₁ = 6 时与 6 并列，当场卡死</text>
  <text x="680" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5223" filter="url(#rough2)">6</text>

  <rect x="60" y="210" width="640" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">t = 2</text>
  <text x="400" y="234" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">(c₁, c₂, 2, 2)，c₁, c₂ ∈ [1, 5]</text>
  <text x="400" y="251" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">两个值都必须 &lt; b₂ = 6，各有 5 种</text>
  <text x="680" y="240" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5223" filter="url(#rough2)">25</text>

  <rect x="60" y="272" width="640" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">合计</text>
  <text x="400" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1 + (b₁−1)¹ + (b₂−1)² = 1 + 6 + 25</text>
  <text x="680" y="304" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450" filter="url(#rough2)">32</text>

  <!-- 为什么 c₁ 也要小于 b₂ -->
  <rect x="60" y="342" width="640" height="86" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a33b36" filter="url(#rough2)">关键约束：c₁ 必须 &lt; b₂，而不是只满足 c₁ &lt; b₁</text>
  <text x="380" y="388" text-anchor="middle" font-size="11.5" fill="#7a2f2b" filter="url(#rough2)">要把 6 压下去，6 得先成为「唯一最大值」；只要 7 还停在 6 或更高，6 就被压住</text>
  <text x="380" y="410" text-anchor="middle" font-size="11.5" fill="#7a2f2b" filter="url(#rough2)">所以 t ≥ 2 时前 t−1 个数的上界统一收紧到 b_t − 1，这正是 (b_t − 1)^t 的来源</text>
</svg>
