<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="390" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：节点去留只取决于「它的子树里有没有 1」</text>

  <!-- 树边 -->
  <path d="M 170 84 L 100 158" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 170 84 L 240 158" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 100 158 L 62 238" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 100 158 L 140 238" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 240 158 L 206 238" fill="none" stroke="#ccc" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 240 158 L 280 238" fill="none" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 62 238 L 40 318" fill="none" stroke="#ccc" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 保留节点：绿 -->
  <circle cx="170" cy="84" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="89" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="100" cy="158" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="163" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="240" cy="158" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="163" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="62" cy="238" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="62" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="140" cy="238" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="280" cy="238" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>

  <!-- 剪掉节点：红虚线 -->
  <circle cx="206" cy="238" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="206" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <circle cx="40" cy="318" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="40" y="323" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>

  <!-- 旁注 -->
  <text x="86" y="300" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">子树全 0 → 剪</text>
  <path d="M 86 292 L 48 316" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="330" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">自己是 0，但右孩子有 1 → 保留</text>
  <path d="M 306 190 L 258 168" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 公式框 -->
  <rect x="316" y="230" width="208" height="98" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="254" font-size="12" fill="#2b4a6f" filter="url(#rough2)">hasOne(u) =</text>
  <text x="330" y="276" font-size="12" fill="#2b4a6f" filter="url(#rough2)">(u.val==1) ∨</text>
  <text x="330" y="298" font-size="12" fill="#2b4a6f" filter="url(#rough2)">hasOne(u.left) ∨</text>
  <text x="330" y="320" font-size="12" fill="#2b4a6f" filter="url(#rough2)">hasOne(u.right)</text>

  <!-- 规则框 -->
  <rect x="316" y="86" width="208" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="110" font-size="12" fill="#a9761f" filter="url(#rough2)">hasOne = true ⇒ 保留</text>
  <text x="330" y="134" font-size="12" fill="#a9761f" filter="url(#rough2)">hasOne = false ⇒ 剪掉</text>
  <text x="330" y="158" font-size="11.5" fill="#666" filter="url(#rough2)">空节点的 hasOne 记为 false，</text>
  <text x="330" y="180" font-size="11.5" fill="#666" filter="url(#rough2)">于是「无 1 的叶子」自然被剪掉。</text>

  <text x="270" y="372" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">绿 = 保留（子树含 1）；红 = 删除（子树全是 0）</text>
</svg>
