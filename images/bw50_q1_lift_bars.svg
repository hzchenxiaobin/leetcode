<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">贪心抬柱：每根柱子只抬到 prev + 1</text>

  <!-- 坐标基线 -->
  <line x1="40" y1="300" x2="530" y2="300" stroke="#666" stroke-width="2" filter="url(#rough2)"/>

  <!-- 原始柱（蓝）与抬升部分（橙虚线） -->
  <g filter="url(#rough2)">
    <!-- 柱 0：1 → 1 -->
    <rect x="70"  y="280" width="52" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <!-- 柱 1：5 → 5 -->
    <rect x="160" y="200" width="52" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <!-- 柱 2：2 → 6 -->
    <rect x="250" y="260" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="250" y="180" width="52" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4" rx="3"/>
    <!-- 柱 3：4 → 7 -->
    <rect x="340" y="220" width="52" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="340" y="160" width="52" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4" rx="3"/>
    <!-- 柱 4：1 → 8 -->
    <rect x="430" y="280" width="52" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="430" y="140" width="52" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5,4" rx="3"/>
  </g>

  <!-- 数值标签 -->
  <g filter="url(#rough2)" font-size="14" fill="#2b4a66" text-anchor="middle" font-weight="bold">
    <text x="96"  y="272">1</text>
    <text x="186" y="192">5</text>
    <text x="276" y="172">6</text>
    <text x="366" y="152">7</text>
    <text x="456" y="132">8</text>
  </g>
  <!-- 抬升代价 -->
  <g filter="url(#rough2)" font-size="13" fill="#b85450" text-anchor="middle" font-weight="bold">
    <text x="322" y="224">+4</text>
    <text x="412" y="204">+3</text>
    <text x="500" y="184">+7</text>
  </g>
  <!-- 原值虚线提示 -->
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="96" y="322">原 1</text>
    <text x="186" y="322">原 5</text>
    <text x="276" y="322">原 2</text>
    <text x="366" y="322">原 4</text>
    <text x="456" y="322">原 1</text>
  </g>

  <!-- 递增标注线 -->
  <path d="M 96 262 C 130 240, 156 218, 178 200" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- 结论 -->
  <rect x="60" y="336" width="460" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="359" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">最终 [1,5,6,7,8]，总操作 = 0+0+4+3+7 = 14</text>
</svg>
