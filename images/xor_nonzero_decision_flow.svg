<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：一遍扫描 + 三分支判断</text>

  <!-- 起点 -->
  <rect x="200" y="46" width="240" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="70" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">一遍扫描：x = x ⊕ nums[i]</text>
  <text x="320" y="90" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">顺便记录 hasNonZero</text>

  <path d="M320,104 L320,128" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 1 -->
  <polygon points="320,132 452,186 320,240 188,186" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="192" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">x ≠ 0 ?</text>

  <path d="M452,186 L506,186" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="510" y="164" width="116" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="568" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 n</text>
  <text x="568" y="200" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">全部保留</text>

  <path d="M320,240 L320,264" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="258" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 判断 2 -->
  <polygon points="320,268 452,322 320,376 188,322" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="328" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">存在非零元素 ?</text>

  <path d="M452,322 L506,322" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="312" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="510" y="300" width="116" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="568" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">返回 n − 1</text>
  <text x="568" y="336" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">删一个非零</text>

  <path d="M320,376 L320,400" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="394" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="240" y="404" width="160" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 0</text>
  <text x="320" y="440" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">全是 0，无解</text>

  <text x="320" y="464" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">时间 O(n) · 空间 O(1)，无需排序与额外数据结构</text>
</svg>
