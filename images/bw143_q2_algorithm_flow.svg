<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：开桶 → 前缀和 → 枚举目标值 O(1) 取窗口</text>

  <rect x="26" y="60" width="132" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="88" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">桶计数</text>
  <text x="92" y="110" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">cnt[v]</text>
  <text x="92" y="128" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">O(n)</text>

  <path d="M 160 98 L 188 98" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="192" y="60" width="132" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="258" y="88" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">前缀和</text>
  <text x="258" y="110" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">pre[v] = Σ cnt[1..v]</text>
  <text x="258" y="128" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">O(V)</text>

  <path d="M 326 98 L 354 98" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="358" y="60" width="176" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="446" y="86" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">枚举 x = 1 .. max+k</text>
  <text x="446" y="108" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">min(c, cnt[x]+m) 取最大</text>
  <text x="446" y="126" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">O(V)</text>

  <rect x="66" y="168" width="428" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">c(x) = pre[min(x+k, V)] − pre[max(x−k, 1) − 1]</text>
  <text x="280" y="209" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">窗口两端裁剪到合法值域，一次减法即得元素个数</text>

  <path d="M 280 142 L 280 164" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="66" y="238" width="428" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">ans = max over x of min(c(x), cnt[x] + numOperations)</text>

  <text x="280" y="312" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">V = max(nums) + k ≤ 2×10^5，总时间 O(n + V)</text>
</svg>
