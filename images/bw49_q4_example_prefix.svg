<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 走查：排列 [6,2,4,5,1,3] 的前缀余数时间线</text>

  <!-- 行标签 -->
  <g filter="url(#rough2)" font-size="12" fill="#666" text-anchor="end">
    <text x="68" y="70">之前累计</text>
    <text x="68" y="130">mod 3</text>
  </g>

  <!-- 前缀累计 -->
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="103" y="66">0</text>
    <text x="178" y="66">6</text>
    <text x="253" y="66">8</text>
    <text x="328" y="66">12</text>
    <text x="403" y="66">17</text>
    <text x="478" y="66">18</text>
  </g>

  <!-- mod 3 圆圈 -->
  <g filter="url(#rough2)">
    <circle cx="103" cy="126" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="178" cy="126" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="253" cy="126" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="328" cy="126" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="403" cy="126" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="478" cy="126" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="103" y="131">0</text>
    <text x="178" y="131">0</text>
    <text x="253" y="131">2</text>
    <text x="328" y="131">0</text>
    <text x="403" y="131">2</text>
    <text x="478" y="131">0</text>
  </g>

  <!-- 组盒子 -->
  <g filter="url(#rough2)">
    <rect x="75" y="160" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="150" y="160" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="225" y="160" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="300" y="160" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="375" y="160" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="450" y="160" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="103" y="188">6</text>
    <text x="178" y="188">2</text>
    <text x="253" y="188">4</text>
    <text x="328" y="188">5</text>
    <text x="403" y="188">1</text>
    <text x="478" y="188">3</text>
  </g>

  <!-- 开心标记 -->
  <g filter="url(#rough2)" font-size="15" text-anchor="middle" font-weight="bold">
    <text x="103" y="238" fill="#4a7a3a">✓</text>
    <text x="178" y="238" fill="#4a7a3a">✓</text>
    <text x="253" y="238" fill="#b85450">✗</text>
    <text x="328" y="238" fill="#4a7a3a">✓</text>
    <text x="403" y="238" fill="#b85450">✗</text>
    <text x="478" y="238" fill="#4a7a3a">✓</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#666" text-anchor="middle">
    <text x="103" y="258">余0组</text>
    <text x="178" y="258">开局0</text>
    <text x="253" y="258">剩2个</text>
    <text x="328" y="258">开局0</text>
    <text x="403" y="258">剩2个</text>
    <text x="478" y="258">余0组</text>
  </g>

  <!-- 结论 -->
  <rect x="60" y="290" width="460" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="314" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">开局余数为 0 的 4 个位置（1、2、4、6）开心 → 答案 4 ✓</text>
  <rect x="60" y="340" width="460" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="361" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">「买完后恰好清空」≠「开心」：开心的是开局余数为 0 的那组</text>
</svg>
