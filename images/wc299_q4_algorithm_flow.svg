<svg xmlns="http://www.w3.org/2000/svg" width="660" height="530" viewBox="0 0 660 530" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="660" height="530" fill="#fdfcf7"/>
  <text x="330" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：迭代 DFS 预处理 + 枚举点对，每对 O(1)</text>
  <path d="M 150 34 Q 330 42 510 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① 预处理 -->
  <g filter="url(#sk)"><rect x="45" y="56" width="250" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="170" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">① 建邻接表，以 0 为根迭代 DFS</text>
  <text x="170" y="98" text-anchor="middle" font-size="10.5" fill="#555">得到 xor[] / tin[] / tout[]，total = xor[0]</text>
  <path d="M 170 112 L 170 124" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ② 枚举 -->
  <g filter="url(#sk)"><rect x="45" y="128" width="250" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="170" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">② 枚举非根点对 1 ≤ i &lt; j ≤ n−1</text>
  <path d="M 170 162 L 170 178" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形 1 -->
  <g filter="url(#sk)"><polygon points="170,182 262,236 170,290 78,236" fill="#fdfcf7" stroke="#b07818" stroke-width="1.8"/></g>
  <text x="170" y="231" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#7a5415">tin[i] &lt; tin[j] &lt; tout[i] ?</text>
  <text x="170" y="249" text-anchor="middle" font-size="10.5" fill="#7a5415">i 是 j 的祖先？</text>
  <text x="300" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>
  <path d="M 262 236 L 361 236" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="182" y="305" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <path d="M 170 290 L 170 304" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 情形 A 框 -->
  <g filter="url(#sk)"><rect x="365" y="212" width="250" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="490" y="231" text-anchor="middle" font-size="10" fill="#7a5415">i 是 j 的祖先</text>
  <text x="490" y="249" text-anchor="middle" font-size="10.5" font-family="monospace" font-weight="bold" fill="#7a5415">( xor[j], xor[i]⊕xor[j], total⊕xor[i] )</text>

  <!-- 菱形 2 -->
  <g filter="url(#sk)"><polygon points="170,308 262,362 170,416 78,362" fill="#fdfcf7" stroke="#b07818" stroke-width="1.8"/></g>
  <text x="170" y="357" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#7a5415">tin[j] &lt; tin[i] &lt; tout[j] ?</text>
  <text x="170" y="375" text-anchor="middle" font-size="10.5" fill="#7a5415">j 是 i 的祖先？</text>
  <text x="300" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>
  <path d="M 262 362 L 361 362" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="182" y="431" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <path d="M 170 416 L 170 432" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 情形 B 框 -->
  <g filter="url(#sk)"><rect x="365" y="338" width="250" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="490" y="357" text-anchor="middle" font-size="10" fill="#7a5415">j 是 i 的祖先</text>
  <text x="490" y="375" text-anchor="middle" font-size="10.5" font-family="monospace" font-weight="bold" fill="#7a5415">( xor[i], xor[j]⊕xor[i], total⊕xor[j] )</text>

  <!-- 情形 C 框 -->
  <g filter="url(#sk)"><rect x="45" y="436" width="250" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="170" y="455" text-anchor="middle" font-size="10" fill="#2e5e2e">子树不相交（平行）</text>
  <text x="170" y="473" text-anchor="middle" font-size="10.5" font-family="monospace" font-weight="bold" fill="#2e5e2e">( xor[i], xor[j], total⊕xor[i]⊕xor[j] )</text>

  <!-- ③ 汇合 -->
  <g filter="url(#sk)"><rect x="365" y="444" width="250" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="490" y="468" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">③ score = max − min</text>
  <text x="490" y="490" text-anchor="middle" font-size="11.5" font-family="monospace" font-weight="bold" fill="#2e5e2e">ans = min(ans, score)</text>

  <!-- 汇合箭头 -->
  <path d="M 615 236 L 644 236" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 615 362 L 644 362" stroke="#3a3a3a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 644 236 L 644 476 L 621 476" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 295 460 Q 332 460 360 470" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
</svg>
