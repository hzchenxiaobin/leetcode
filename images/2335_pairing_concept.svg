<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="680" height="480" fill="#fafafa"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：每秒「2 杯不同类型」= 一次配对，两条下界夹出答案</text>
  <path d="M 130 44 Q 340 52 550 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="42" y="64" width="290" height="100" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="187" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a68" filter="url(#sk)">操作 A：装 1 杯任意类型</text>
  <g filter="url(#sk)"><rect x="174" y="102" width="26" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="187" y="124" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#sk)">冷</text>
  <text x="187" y="156" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">这一秒只消耗 1 杯</text>

  <g filter="url(#sk)"><rect x="348" y="64" width="290" height="100" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="493" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">操作 B：装 2 杯不同类型</text>
  <g filter="url(#sk)"><rect x="415" y="102" width="26" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="428" y="124" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">温</text>
  <g filter="url(#sk)"><rect x="525" y="102" width="26" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="538" y="124" text-anchor="middle" font-size="12" fill="#a03a3a" filter="url(#sk)">热</text>
  <text x="483" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">≠</text>
  <text x="493" y="156" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">这一秒成对消耗 2 杯</text>

  <g filter="url(#sk)"><path d="M 187 168 L 187 190" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><path d="M 493 168 L 493 190" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="42" y="196" width="290" height="122" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="187" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">下界 ①：总量限制</text>
  <text x="187" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">设 S = a + b + c（总杯数）</text>
  <text x="187" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">每秒至多 2 杯 ⟹ 2n ≥ S</text>
  <text x="187" y="302" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">⟹ ans ≥ ⌈S / 2⌉</text>

  <g filter="url(#sk)"><rect x="348" y="196" width="290" height="122" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="493" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">下界 ②：单类限制</text>
  <text x="493" y="248" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">同一类型每秒至多 1 杯</text>
  <text x="493" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">（两杯必须不同类型）</text>
  <text x="493" y="302" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">⟹ ans ≥ max(a,b,c) = c</text>

  <g filter="url(#sk)"><path d="M 187 322 L 260 352" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>
  <g filter="url(#sk)"><path d="M 493 322 L 420 352" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="150" y="358" width="380" height="102" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/></g>
  <text x="340" y="392" text-anchor="middle" font-size="18" font-weight="bold" fill="#a03a3a" filter="url(#sk)">ans = max( c , ⌈S / 2⌉ )</text>
  <text x="340" y="420" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">两条下界可以同时取到</text>
  <text x="340" y="446" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03a3a" filter="url(#sk)">⟹ 这就是最优解（构造与证明见正文 §5）</text>
</svg>
