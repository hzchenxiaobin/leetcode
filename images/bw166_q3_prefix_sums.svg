<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="580" height="380" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">位移可加：删掉一段 = 从全程位移里减去那一段的位移</text>
  <text x="40" y="78" text-anchor="start" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">s = "LUL"，k = 1</text>
  <rect x="50" y="100" width="112" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="106" y="128" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">P[0]=(0,0)</text>
  <path d="M 162 123 L 178 123" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="178" y="100" width="112" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="234" y="128" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">P[1]=(-1,0)</text>
  <path d="M 290 123 L 306 123" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="306" y="100" width="112" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="362" y="128" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">P[2]=(-1,1)</text>
  <path d="M 418 123 L 434 123" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="434" y="100" width="112" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="490" y="128" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">P[3]=(-2,1)</text>
  <rect x="50" y="176" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="201" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">T = P[3] = (-2, 1)</text>
  <text x="290" y="242" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">终点(l) = T - ( P[l+k] - P[l] )</text>
  <rect x="50" y="262" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="283" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">l=0 删 "L"</text>
  <rect x="206" y="262" width="210" height="32" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="311" y="283" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">P[1]-P[0] = (-1,0)</text>
  <rect x="422" y="262" width="108" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="476" y="283" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">(-1,1)</text>
  <rect x="50" y="298" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="319" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">l=1 删 "U"</text>
  <rect x="206" y="298" width="210" height="32" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="311" y="319" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">P[2]-P[1] = (0,1)</text>
  <rect x="422" y="298" width="108" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="476" y="319" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">(-2,0)</text>
  <rect x="50" y="334" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="355" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">l=2 删 "L"</text>
  <rect x="206" y="334" width="210" height="32" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="311" y="355" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">P[3]-P[2] = (-1,0)</text>
  <rect x="422" y="334" width="108" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="476" y="355" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">(-1,1)</text>
</svg>
