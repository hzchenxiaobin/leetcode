  <!-- 交叉验证说明 -->
  <g filter="url(#sk)"><rect x="40" y="282" width="560" height="40" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="298" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">「数组实况」是暴力模拟的交叉验证：设备 2 判定前数组为 [1,0,1,0,2]，</text>
  <text x="320" y="314" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">下标 2 处的 1 恰好等于 max(0, 2 − 1)——计数视角与模拟视角完全吻合</text>

  <!-- 结果 -->
  <g filter="url(#sk)"><rect x="40" y="330" width="560" height="26" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="320" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 tested = 3 ✓ —— 5 台正电设备只测出 3 台：门槛 tested 只升不降</text>
