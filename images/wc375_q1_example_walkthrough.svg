  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：b = [1,1,2,1,3] → 答案 3</text>
  <path d="M 185 34 Q 320 42 455 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 表头 -->
