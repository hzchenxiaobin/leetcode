<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：非递减数组被 target 切成两段</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">letters = ['c','c','f','j']，target = 'c' —— 答案藏在右段的最左端</text>

  <text x="207" y="78" text-anchor="middle" font-size="10.5" fill="#8a5a20" filter="url(#rough2)">≤ target：整段排除</text>
  <text x="349" y="78" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">&gt; target：候选区，取最左</text>

  <rect x="134" y="90" width="142" height="60" fill="none" stroke="#d6a040"
        stroke-width="1.6" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <rect x="278" y="90" width="142" height="60" fill="none" stroke="#4a7a3a"
        stroke-width="1.6" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="140" y="98" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="210" y="98" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="280" y="98" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="350" y="98" width="64" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>

  <g font-size="22" text-anchor="middle" filter="url(#rough2)">
    <text x="172" y="128" fill="#8a6a20">c</text>
    <text x="242" y="128" fill="#8a6a20">c</text>
    <text x="312" y="128" fill="#2f4f28" font-weight="bold">f</text>
    <text x="382" y="128" fill="#2f4f28">j</text>
  </g>

  <g font-size="10" text-anchor="middle" fill="#999" filter="url(#rough2)">
    <text x="172" y="164">0</text>
    <text x="242" y="164">1</text>
    <text x="312" y="164">2</text>
    <text x="382" y="164">3</text>
  </g>

  <path d="M 312 214 L 312 174" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="192" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">第一个 &gt; target 的位置</text>
  <text x="328" y="208" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">ans = 2 → letters[2] = 'f'</text>

  <rect x="56" y="234" width="448" height="88" rx="10" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="256" font-size="10.5" fill="#333" filter="url(#rough2)">答案 = 最小的 i 使 letters[i] &gt; target（严格大于！）</text>
  <text x="72" y="280" font-size="10.5" fill="#333" filter="url(#rough2)">判定 P(i) = [letters[i] &gt; target] 随 i 单调：一旦为真，后面全真</text>
  <text x="72" y="304" font-size="10.5" fill="#333" filter="url(#rough2)">若不存在这样的 i（整个数组 ≤ target）→ 回绕返回 letters[0]</text>

  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">与 target 相等的重复字母不算答案：这正是 upper_bound 与 lower_bound 的分界</text>
</svg>
