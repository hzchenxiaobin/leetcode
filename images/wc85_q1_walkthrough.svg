<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>
  <rect width="520" height="330" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">三个示例：交集区间长度为正是唯一标准</text>

  <g filter="url(#rough2)">
    <rect x="30" y="54" width="460" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="44" y="74" font-size="12" fill="#2f4a66">示例 1  rec1=[0,0,2,2]  rec2=[1,1,3,3]</text>
    <text x="44" y="94" font-size="12" fill="#2f4a66">x 交集 (1,2) 长 1，y 交集 (1,2) 长 1 → 面积 1 &gt; 0</text>
    <text x="404" y="84" font-size="14" fill="#4a7a3a">true</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="116" width="460" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="44" y="136" font-size="12" fill="#8a3020">示例 2  rec1=[0,0,1,1]  rec2=[1,0,2,1]</text>
    <text x="44" y="156" font-size="12" fill="#8a3020">x 交集 (1,1) 长度为 0（仅共边） → 面积 0</text>
    <text x="396" y="146" font-size="14" fill="#b85450">false</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="178" width="460" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="44" y="198" font-size="12" fill="#8a3020">示例 3  rec1=[0,0,1,1]  rec2=[2,2,3,3]</text>
    <text x="44" y="218" font-size="12" fill="#8a3020">x 交集 (2,1) 为空（左端已越过右端） → 面积 0</text>
    <text x="396" y="208" font-size="14" fill="#b85450">false</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="90" y="246" width="340" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="270" text-anchor="middle" font-size="12" fill="#7a5a10">l &lt; r 已同时覆盖「共边」与「分离」两类失败</text>
    <text x="260" y="292" text-anchor="middle" font-size="12" fill="#7a5a10">因此 4 个不等式可合并为 2 个 max/min 比较</text>
  </g>
</svg>
