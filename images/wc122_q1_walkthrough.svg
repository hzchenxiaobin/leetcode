<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例走查：A = [1,2,3,4]，四条查询</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">初始 S = 2 + 4 = 6（1 和 3 是奇数，不计入）</text>

  <rect x="18" y="62" width="104" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="70" y="84" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">查询</text>
  <rect x="126" y="62" width="118" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="185" y="84" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">A 变为</text>
  <rect x="248" y="62" width="196" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="346" y="84" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">S 的更新</text>
  <rect x="448" y="62" width="94" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="495" y="84" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">answer</text>

  <rect x="18" y="100" width="104" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="70" y="124" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">(+1, 0)</text>
  <rect x="126" y="100" width="118" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="185" y="124" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[2,2,3,4]</text>
  <rect x="248" y="100" width="196" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="346" y="124" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1 是奇数不减，+2 → 8</text>
  <rect x="448" y="100" width="94" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="495" y="124" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>

  <rect x="18" y="142" width="104" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="70" y="166" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">(−3, 1)</text>
  <rect x="126" y="142" width="118" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="185" y="166" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[2,−1,3,4]</text>
  <rect x="248" y="142" width="196" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="346" y="166" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2 是偶数减 2，−1 不计 → 6</text>
  <rect x="448" y="142" width="94" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="495" y="166" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="18" y="184" width="104" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="70" y="208" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">(−4, 0)</text>
  <rect x="126" y="184" width="118" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="185" y="208" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[−2,−1,3,4]</text>
  <rect x="248" y="184" width="196" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="346" y="208" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">减 2 再加 −2，净减 4 → 2</text>
  <rect x="448" y="184" width="94" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="495" y="208" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="18" y="226" width="104" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="70" y="250" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">(+2, 3)</text>
  <rect x="126" y="226" width="118" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="185" y="250" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">[−2,−1,3,6]</text>
  <rect x="248" y="226" width="196" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="346" y="250" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">4 是偶数减 4，6 加 6 → 4</text>
  <rect x="448" y="226" width="94" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="495" y="250" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="18" y="292" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">最终答案 [8,6,2,4]；每一步 S 都与「重新遍历数组求和」的结果一致。</text>
  <text x="18" y="310" font-size="11" fill="#b85450" text-anchor="start" filter="url(#rough2)">第 3 行走的是「减旧值 + 加新值」两步，正是增量公式的两个分支。</text>
</svg>
