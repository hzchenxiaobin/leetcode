<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">update 递归骨架：覆盖即翻，分界下传</text>

  <!-- update 伪代码流程 -->
  <polygon points="280,48 380,86 280,124 180,86" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="12.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">[l,r] 与 [ql,qr]</text>
  <text x="280" y="99" text-anchor="middle" font-size="12.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">相交？</text>

  <!-- 不相交 -->
  <path d="M 180 86 C 130 86, 110 96, 76 108" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="76" font-size="11.5" fill="#b85450" filter="url(#rough2)" text-anchor="middle">不相交</text>
  <rect x="16" y="112" width="96" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="64" y="132" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">return</text>

  <!-- 完全覆盖 -->
  <path d="M 280 124 C 280 142, 280 146, 280 158" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="146" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)" text-anchor="middle">完全覆盖</text>

  <rect x="150" y="162" width="260" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">apply(o, len)：</text>
  <text x="280" y="204" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">ones[o] = len − ones[o]</text>
  <text x="280" y="221" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">flip[o] ^= 1（记下孩子欠翻）</text>

  <!-- 部分覆盖 -->
  <path d="M 380 86 C 440 86, 460 96, 490 108" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="76" font-size="11.5" fill="#446688" filter="url(#rough2)" text-anchor="middle">部分覆盖</text>

  <rect x="380" y="112" width="160" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="460" y="134" text-anchor="middle" font-size="12.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">push_down(o)：</text>
  <text x="460" y="152" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">孩子各 apply 一次</text>
  <text x="460" y="168" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">（长度 mid−l+1 与 r−mid）</text>
  <text x="460" y="180" text-anchor="middle" font-size="11.5" fill="#7a5c1e" filter="url(#rough2)">flip[o] 清零</text>

  <path d="M 460 182 C 460 250, 400 256, 350 262" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 递归两个孩子 -->
  <rect x="200" y="266" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="290" text-anchor="middle" font-size="12" fill="#2d4a66" filter="url(#rough2)">update(左孩子)</text>
  <rect x="360" y="266" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="430" y="290" text-anchor="middle" font-size="12" fill="#2d4a66" filter="url(#rough2)">update(右孩子)</text>

  <path d="M 270 306 C 270 322, 320 326, 348 332" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 306 C 430 322, 400 326, 376 332" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="240" y="336" width="250" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="365" y="360" text-anchor="middle" font-size="12.5" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">pull：ones[o] = 左 + 右</text>

  <!-- 语义框 -->
  <rect x="30" y="240" width="150" height="132" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="105" y="262" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">标记语义约定</text>
  <text x="105" y="282" text-anchor="middle" font-size="11" fill="#8a3a34" filter="url(#rough2)">ones[o] 已是真实值</text>
  <text x="105" y="298" text-anchor="middle" font-size="11" fill="#8a3a34" filter="url(#rough2)">标记作用于孩子</text>
  <text x="105" y="318" text-anchor="middle" font-size="11" fill="#8a3a34" filter="url(#rough2)">叶子无孩子</text>
  <text x="105" y="334" text-anchor="middle" font-size="11" fill="#8a3a34" filter="url(#rough2)">标记压住无妨</text>
  <text x="105" y="356" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">两套约定别混用!</text>

  <rect x="240" y="382" width="290" height="14" fill="none"/>
  <text x="390" y="392" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">类型 2/3 是 O(1)：ones[根] 即全局 1 总数</text>
</svg>
