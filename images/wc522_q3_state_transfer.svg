<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">四状态 Kadane：转移一览（均以 i 结尾）</text>
  <text x="280" y="46" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">上排未删除，下排已删一个（夹在中间）；橙色虚线 = 跨删点跳一步</text>

  <!-- 新起小圆 -->
  <circle cx="52" cy="115" r="20" fill="#ffffff" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="52" y="112" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">新起</text>
  <text x="52" y="126" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">∅</text>
  <path d="M 73,115 L 88,115" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="52" y="152" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">max(·, 0)</text>

  <!-- f0 -->
  <rect x="90" y="90" width="140" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="110" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">f₀：未删除</text>
  <text x="160" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">偶角色，贡献 +aᵢ</text>

  <!-- f1 -->
  <rect x="330" y="90" width="140" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="110" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">f₁：未删除</text>
  <text x="400" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">奇角色，贡献 −aᵢ</text>

  <!-- g0 -->
  <rect x="90" y="250" width="140" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="270" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">g₀：已删除</text>
  <text x="160" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">偶角色，贡献 +aᵢ</text>

  <!-- g1 -->
  <rect x="330" y="250" width="140" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="270" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">g₁：已删除</text>
  <text x="400" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">奇角色，贡献 −aᵢ</text>

  <!-- f1 -> f0 上弧 -->
  <path d="M 330,100 C 295,72 265,72 232,100" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="281" y="76" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">+aᵢ（接上）</text>

  <!-- f0 -> f1 下弧 -->
  <path d="M 232,130 C 265,158 295,158 330,130" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="281" y="162" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">−aᵢ</text>

  <!-- g1 -> g0 上弧 -->
  <path d="M 330,260 C 295,232 265,232 232,260" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="281" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+aᵢ</text>

  <!-- g0 -> g1 下弧 -->
  <path d="M 232,290 C 265,318 295,318 330,290" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="281" y="322" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−aᵢ</text>

  <!-- 跳步：f1 -> g0 -->
  <path d="M 400,140 C 388,186 278,192 216,248" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="336" y="186" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">跳过 aᵢ₋₁：+aᵢ</text>

  <!-- 跳步：f0 -> g1 -->
  <path d="M 160,140 C 172,218 282,224 344,248" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="224" y="226" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">跳过 aᵢ₋₁：−aᵢ</text>

  <!-- 图例 -->
  <rect x="70" y="346" width="18" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="358" font-size="12" fill="#333" filter="url(#rough2)">未删除</text>
  <rect x="170" y="346" width="18" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="358" font-size="12" fill="#333" filter="url(#rough2)">已删一个（夹在中间）</text>
  <path d="M 360,353 L 400,353" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="410" y="358" font-size="12" fill="#333" filter="url(#rough2)">跨删点（删 aᵢ₋₁）</text>

  <text x="280" y="386" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">答案 = 所有 i 上四个状态的最大值（最优可能以奇角色结尾）</text>
</svg>
