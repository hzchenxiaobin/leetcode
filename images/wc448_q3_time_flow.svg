<svg xmlns="http://www.w3.org/2000/svg" width="940" height="652" viewBox="0 0 940 652" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="652" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：合并 =「删左加右」，时间整体向右流动</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: one merge operation ===== -->
  <text x="60" y="76" font-size="13" font-weight="bold" fill="#2b6e9e">① 一次合并的操作（time = [2,3,5,4,1,2]，合并相邻路标 2、3）</text>

  <text x="92" y="127" text-anchor="end" font-size="11" fill="#555" font-weight="bold">time =</text>
  <g font-size="13" font-weight="bold" fill="#2b4a6e" text-anchor="middle">
    <rect x="100" y="104" width="64" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4" filter="url(#sk)"/>
    <text x="132" y="127">2</text>
    <rect x="192" y="104" width="64" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4" filter="url(#sk)"/>
    <text x="224" y="127">3</text>
    <rect x="284" y="104" width="64" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4" filter="url(#sk)"/>
    <text x="316" y="127">5</text>
    <rect x="376" y="104" width="64" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4" filter="url(#sk)"/>
    <text x="408" y="127">4</text>
    <rect x="468" y="104" width="64" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4" filter="url(#sk)"/>
    <text x="500" y="127">1</text>
    <rect x="560" y="104" width="64" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4" filter="url(#sk)"/>
    <text x="592" y="127">2</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="132" y="152">下标 0</text>
    <text x="224" y="152">下标 1</text>
    <text x="316" y="152">下标 2</text>
    <text x="408" y="152">下标 3</text>
    <text x="500" y="152">下标 4</text>
    <text x="592" y="152">下标 5</text>
  </g>
  <rect x="270" y="94" width="184" height="56" rx="6" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="362" y="90" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">合并 (i=2, i+1=3)</text>
  <path d="M 302 110 L 330 134 M 330 110 L 302 134" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <path d="M 352 122 Q 362 114 372 122" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="362" y="106" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450">+5</text>

  <path d="M 386 158 Q 375 178 332 192" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="92" y="219" text-anchor="end" font-size="11" fill="#555" font-weight="bold">合并后</text>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="100" y="196" width="64" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4" filter="url(#sk)"/>
    <text x="132" y="219" fill="#2b4a6e">2</text>
    <rect x="192" y="196" width="64" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4" filter="url(#sk)"/>
    <text x="224" y="219" fill="#2b4a6e">3</text>
    <rect x="284" y="196" width="64" height="36" fill="#fef6e6" stroke="#c98a2b" stroke-width="2" rx="4" filter="url(#sk)"/>
    <text x="316" y="219" fill="#7a5415">9</text>
    <rect x="376" y="196" width="64" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4" filter="url(#sk)"/>
    <text x="408" y="219" fill="#2b4a6e">1</text>
    <rect x="468" y="196" width="64" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4" rx="4" filter="url(#sk)"/>
    <text x="500" y="219" fill="#2b4a6e">2</text>
  </g>
  <text x="316" y="190" text-anchor="middle" font-size="10" fill="#7a5415">5 + 4 = 9</text>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="132" y="250">下标 0</text>
    <text x="224" y="250">下标 1</text>
    <text x="316" y="250">下标 2</text>
    <text x="408" y="250">下标 3</text>
    <text x="500" y="250">下标 4</text>
  </g>
  <text x="620" y="250" font-size="9.5" fill="#999">← 下标重新编号，数组少一个路标</text>

  <g filter="url(#sk)">
    <rect x="680" y="96" width="232" height="140" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="700" y="120" font-size="12" font-weight="bold" fill="#7a5415">合并规则（删左加右）</text>
  <text x="700" y="144" font-size="10.5" fill="#444">① time[i+1] ← time[i] + time[i+1]</text>
  <text x="700" y="164" font-size="10.5" fill="#444">② 删除路标 i（要求 i &gt; 0，且有右邻）</text>
  <text x="700" y="188" font-size="11" font-weight="bold" fill="#b03a3a">⟹ 首、尾路标永不被删</text>
  <text x="700" y="210" font-size="9.5" fill="#888">每次合并恰好删除一个路标</text>

  <!-- ===== Panel 2: gap absorption ===== -->
  <text x="60" y="292" font-size="13" font-weight="bold" fill="#5a3a7a">② 合并序列的净效果：缺口吸收（k = 2，删路标 2、3，保留 {0,1,4,5}）</text>

  <path d="M 316 310 Q 408 264 500 310" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 408 312 Q 448 288 488 308" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="380" y="262" font-size="10.5" font-weight="bold" fill="#b85450">被删的 time 向右流动，</text>
  <text x="380" y="277" font-size="10.5" font-weight="bold" fill="#b85450">汇入右边第一个保留路标</text>

  <g font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="100" y="316" width="64" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" rx="4" filter="url(#sk)"/>
    <text x="132" y="339" fill="#2b4a6e">2</text>
    <rect x="192" y="316" width="64" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" rx="4" filter="url(#sk)"/>
    <text x="224" y="339" fill="#2b4a6e">3</text>
    <rect x="284" y="316" width="64" height="36" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="316" y="339" fill="#bbb">5</text>
    <rect x="376" y="316" width="64" height="36" fill="#f0ede4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#sk)"/>
    <text x="408" y="339" fill="#bbb">4</text>
    <rect x="468" y="316" width="64" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" rx="4" filter="url(#sk)"/>
    <text x="500" y="339" fill="#2b4a6e">1</text>
    <rect x="560" y="316" width="64" height="36" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6" rx="4" filter="url(#sk)"/>
    <text x="592" y="339" fill="#2b4a6e">2</text>
  </g>
  <path d="M 302 322 L 330 346 M 330 322 L 302 346" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <path d="M 394 322 L 422 346 M 422 322 L 394 346" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="132" y="364">下标 0</text>
    <text x="224" y="364">下标 1</text>
    <text x="316" y="364" fill="#b85450">删</text>
    <text x="408" y="364" fill="#b85450">删</text>
    <text x="500" y="364">下标 4</text>
    <text x="592" y="364">下标 5</text>
  </g>
  <g text-anchor="middle">
    <text x="132" y="390" font-size="10.5" font-weight="bold" fill="#2b4a6e">speed = 2</text>
    <text x="224" y="390" font-size="10.5" font-weight="bold" fill="#2b4a6e">speed = 3</text>
    <text x="500" y="390" font-size="11.5" font-weight="bold" fill="#b03a3a">speed = 5+4+1 = 10</text>
    <text x="500" y="406" font-size="9.5" fill="#7a5415">= time[2]+time[3]+time[4]</text>
    <text x="592" y="390" font-size="10" fill="#999">speed = 2（不使用）</text>
  </g>

  <g filter="url(#sk)">
    <rect x="680" y="316" width="232" height="140" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="700" y="340" font-size="12" font-weight="bold" fill="#2e6e2e">「保留集合」决定一切</text>
  <text x="700" y="364" font-size="10.5" fill="#444">恰 k 次合并 ⟺ 恰删 k 个路标</text>
  <text x="700" y="384" font-size="10.5" fill="#444">⟺ 保留 n−k 个（必含 0 与 n−1）</text>
  <text x="700" y="408" font-size="10.5" fill="#444">任何合法保留集合都能实现：</text>
  <text x="700" y="426" font-size="10.5" fill="#444">每个缺口内从左到右依次合并</text>
  <text x="700" y="448" font-size="10.5" font-weight="bold" fill="#2e6e2e">合并顺序不影响 speed（交换律）</text>

  <!-- ===== Panel 3: speed formula ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="486" width="848" height="86" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="80" y="510" font-size="13" font-weight="bold" fill="#2b6e9e">③ 速度公式（前缀和 O(1) 求出）</text>
  <text x="80" y="536" font-size="12.5" fill="#444" font-family="monospace">speed(b) = time[a+1] + … + time[b] = pre[b] − pre[a]　（a：b 左侧最近的保留路标；pre[i] = time[0]+…+time[i]）</text>
  <text x="80" y="560" font-size="12.5" font-weight="bold" fill="#b03a3a" font-family="monospace">speed(0) = time[0]　（首路标左侧没有缺口）</text>

  <!-- ===== bottom insight ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="596" width="848" height="44" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="616" font-size="12" font-weight="bold" fill="#2b2b2b">关键洞察</text>
  <text x="80" y="634" font-size="11.5" fill="#444">「k 步操作序列」坍缩为「选保留集合」；路段 [a, b] 耗时 = (pos[b]−pos[a]) × speed(a)，而 speed(a) 由 a 左边的缺口决定 ⟹ 代价跨两层</text>
</svg>
