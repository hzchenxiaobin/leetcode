<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="38" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">一次遍历：同时追踪最大两个 / 最小两个</text>
  <path d="M 190 46 Q 320 54 450 46" stroke="#333" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="74" text-anchor="middle" font-size="12" fill="#888">橙色格子 = 本行新写入的值（示例 1：[5,6,2,7,4]）</text>

  <!-- table: header + 6 rows, origin (110, 92), col widths 90/100/100/100/100, row height 38 -->
  <!-- header -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <g filter="url(#sk)"><rect x="110" y="92" width="90" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="155" y="116" fill="#446688">元素 x</text>
    <g filter="url(#sk)"><rect x="200" y="92" width="100" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="250" y="116" fill="#446688">max1</text>
    <g filter="url(#sk)"><rect x="300" y="92" width="100" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="350" y="116" fill="#446688">max2</text>
    <g filter="url(#sk)"><rect x="400" y="92" width="100" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="450" y="116" fill="#446688">min1</text>
    <g filter="url(#sk)"><rect x="500" y="92" width="100" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="550" y="116" fill="#446688">min2</text>
  </g>

  <!-- row: init -->
  <g font-size="13" text-anchor="middle">
    <g filter="url(#sk)"><rect x="110" y="130" width="90" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.1"/></g>
    <text x="155" y="154" fill="#888">初始</text>
    <g filter="url(#sk)"><rect x="200" y="130" width="100" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.1"/></g>
    <text x="250" y="154" fill="#888">−∞</text>
    <g filter="url(#sk)"><rect x="300" y="130" width="100" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.1"/></g>
    <text x="350" y="154" fill="#888">−∞</text>
    <g filter="url(#sk)"><rect x="400" y="130" width="100" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.1"/></g>
    <text x="450" y="154" fill="#888">+∞</text>
    <g filter="url(#sk)"><rect x="500" y="130" width="100" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.1"/></g>
    <text x="550" y="154" fill="#888">+∞</text>
  </g>

  <!-- row: x = 5 -->
  <g font-size="13" text-anchor="middle">
    <g filter="url(#sk)"><rect x="110" y="168" width="90" height="38" fill="#ffffff" stroke="#999" stroke-width="1.1"/></g>
    <text x="155" y="192" fill="#333" font-weight="bold">5</text>
    <g filter="url(#sk)"><rect x="200" y="168" width="100" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="250" y="192" fill="#8a6a1a" font-weight="bold">5</text>
    <g filter="url(#sk)"><rect x="300" y="168" width="100" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.1"/></g>
    <text x="350" y="192" fill="#888">−∞</text>
    <g filter="url(#sk)"><rect x="400" y="168" width="100" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="450" y="192" fill="#8a6a1a" font-weight="bold">5</text>
    <g filter="url(#sk)"><rect x="500" y="168" width="100" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.1"/></g>
    <text x="550" y="192" fill="#888">+∞</text>
  </g>

  <!-- row: x = 6 -->
  <g font-size="13" text-anchor="middle">
    <g filter="url(#sk)"><rect x="110" y="206" width="90" height="38" fill="#ffffff" stroke="#999" stroke-width="1.1"/></g>
    <text x="155" y="230" fill="#333" font-weight="bold">6</text>
    <g filter="url(#sk)"><rect x="200" y="206" width="100" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="250" y="230" fill="#8a6a1a" font-weight="bold">6</text>
    <g filter="url(#sk)"><rect x="300" y="206" width="100" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="350" y="230" fill="#8a6a1a" font-weight="bold">5</text>
    <g filter="url(#sk)"><rect x="400" y="206" width="100" height="38" fill="#ffffff" stroke="#999" stroke-width="1.1"/></g>
    <text x="450" y="230" fill="#333">5</text>
    <g filter="url(#sk)"><rect x="500" y="206" width="100" height="38" fill="#f0f0f0" stroke="#999" stroke-width="1.1"/></g>
    <text x="550" y="230" fill="#888">+∞</text>
  </g>

  <!-- row: x = 2 -->
  <g font-size="13" text-anchor="middle">
    <g filter="url(#sk)"><rect x="110" y="244" width="90" height="38" fill="#ffffff" stroke="#999" stroke-width="1.1"/></g>
    <text x="155" y="268" fill="#333" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="200" y="244" width="100" height="38" fill="#ffffff" stroke="#999" stroke-width="1.1"/></g>
    <text x="250" y="268" fill="#333">6</text>
    <g filter="url(#sk)"><rect x="300" y="244" width="100" height="38" fill="#ffffff" stroke="#999" stroke-width="1.1"/></g>
    <text x="350" y="268" fill="#333">5</text>
    <g filter="url(#sk)"><rect x="400" y="244" width="100" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="450" y="268" fill="#8a6a1a" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="500" y="244" width="100" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="550" y="268" fill="#8a6a1a" font-weight="bold">5</text>
  </g>

  <!-- row: x = 7 -->
  <g font-size="13" text-anchor="middle">
    <g filter="url(#sk)"><rect x="110" y="282" width="90" height="38" fill="#ffffff" stroke="#999" stroke-width="1.1"/></g>
    <text x="155" y="306" fill="#333" font-weight="bold">7</text>
    <g filter="url(#sk)"><rect x="200" y="282" width="100" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="250" y="306" fill="#8a6a1a" font-weight="bold">7</text>
    <g filter="url(#sk)"><rect x="300" y="282" width="100" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="350" y="306" fill="#8a6a1a" font-weight="bold">6</text>
    <g filter="url(#sk)"><rect x="400" y="282" width="100" height="38" fill="#ffffff" stroke="#999" stroke-width="1.1"/></g>
    <text x="450" y="306" fill="#333">2</text>
    <g filter="url(#sk)"><rect x="500" y="282" width="100" height="38" fill="#ffffff" stroke="#999" stroke-width="1.1"/></g>
    <text x="550" y="306" fill="#333">5</text>
  </g>

  <!-- row: x = 4 -->
  <g font-size="13" text-anchor="middle">
    <g filter="url(#sk)"><rect x="110" y="320" width="90" height="38" fill="#ffffff" stroke="#999" stroke-width="1.1"/></g>
    <text x="155" y="344" fill="#333" font-weight="bold">4</text>
    <g filter="url(#sk)"><rect x="200" y="320" width="100" height="38" fill="#ffffff" stroke="#999" stroke-width="1.1"/></g>
    <text x="250" y="344" fill="#333">7</text>
    <g filter="url(#sk)"><rect x="300" y="320" width="100" height="38" fill="#ffffff" stroke="#999" stroke-width="1.1"/></g>
    <text x="350" y="344" fill="#333">6</text>
    <g filter="url(#sk)"><rect x="400" y="320" width="100" height="38" fill="#ffffff" stroke="#999" stroke-width="1.1"/></g>
    <text x="450" y="344" fill="#333">2</text>
    <g filter="url(#sk)"><rect x="500" y="320" width="100" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
    <text x="550" y="344" fill="#8a6a1a" font-weight="bold">4</text>
  </g>

  <!-- final formula -->
  <g filter="url(#sk)">
    <rect x="110" y="384" width="490" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="355" y="414" text-anchor="middle" font-size="15" fill="#2e5e2e" font-weight="bold">ans = 7 × 6 − 2 × 4 = 42 − 8 = 34 ✓</text>
</svg>
