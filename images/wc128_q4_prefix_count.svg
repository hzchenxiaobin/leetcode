<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">把「≤ n 且各位互不相同」拆成两段计数</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">答案 = n − cnt(n)，cnt 是不含重复数字的个数</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="30" y="72" width="240" height="96" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150.0" y="124.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="150.0" y="94.0" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">位数 &lt; L</text>
  <text x="150.0" y="120.0" font-size="12" fill="#446688" text-anchor="middle" filter="url(#rough2)">9 · P(9, ℓ−1)</text>
  <text x="150.0" y="144.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">首位 9 选，其余排列</text>
  <rect x="300" y="72" width="250" height="96" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="425.0" y="124.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"></text>
  <text x="425.0" y="94.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">位数 = L（贴紧 n）</text>
  <text x="425.0" y="120.0" font-size="12" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">P(9−i, L−1−i)</text>
  <text x="425.0" y="144.0" font-size="9" fill="#888" text-anchor="middle" filter="url(#rough2)">首次分叉位置 i 的方案数</text>
  <text x="30.0" y="196.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">n 的各位：d[0] d[1] … d[L−1]，逐位比较</text>
  <text x="30.0" y="222.0" font-size="10" fill="#a06" text-anchor="start" filter="url(#rough2)">i 位之前与 n 相同；第 i 位取 x &lt; d[i] 且 x 未用过</text>
  <text x="30.0" y="246.0" font-size="10" fill="#333" text-anchor="start" filter="url(#rough2)">此时已用 i+1 个数字 → 剩 9−i 个可用，剩 L−1−i 个位置</text>
  <rect x="30" y="266" width="250" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="155.0" y="290.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cnt = 短位数 + 同位数分叉 + [n 合法]</text>
  <rect x="300" y="266" width="250" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="425.0" y="291.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">answer = n − cnt</text>
  <rect x="30" y="322" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="343.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">若某一步 d[i] 已经用过，说明 n 的前缀自己就重复 → 立刻停止</text>
</svg>
