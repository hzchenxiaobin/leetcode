<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="920" height="640" fill="#fafafa"/>
  <text x="460" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">核心观察：幸存字符是「墙」，删除配对永不跨越</text>
  <path d="M 250 44 Q 460 52 670 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <rect x="36" y="62" width="180" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="126" y="82" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#sk)">① 原理：配对被墙隔断</text>

  <rect x="140" y="122" width="46" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="163" y="150" text-anchor="middle" font-size="18" fill="#333" filter="url(#sk)">b</text>
  <rect x="192" y="122" width="46" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="215" y="150" text-anchor="middle" font-size="18" fill="#333" filter="url(#sk)">a</text>

  <rect x="292" y="104" width="56" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#sk)"/>
  <text x="320" y="140" text-anchor="middle" font-size="18" fill="#2f5d24" font-weight="bold" filter="url(#sk)">q</text>
  <text x="320" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#sk)">幸存</text>

  <rect x="394" y="122" width="46" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="417" y="150" text-anchor="middle" font-size="18" fill="#333" filter="url(#sk)">c</text>
  <rect x="446" y="122" width="46" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="469" y="150" text-anchor="middle" font-size="18" fill="#333" filter="url(#sk)">d</text>

  <path d="M 163 116 Q 201 86 215 116" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 417 116 Q 455 86 469 116" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="189" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">✓ 相邻可删</text>
  <text x="443" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">✓ 相邻可删</text>

  <path d="M 215 108 Q 344 54 417 108" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="344" y="52" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#sk)">✗</text>

  <text x="530" y="128" font-size="12.5" fill="#3d5a30" filter="url(#sk)">q 被保留 ⇒ 永远立在串中，</text>
  <text x="530" y="148" font-size="12.5" fill="#3d5a30" filter="url(#sk)">a 与 c 之间隔着 q，永远无法</text>
  <text x="530" y="168" font-size="12.5" fill="#3d5a30" filter="url(#sk)">变成相邻 ⇒ 这一对删不掉！</text>
  <text x="530" y="192" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#sk)">被删除的对 (i, j) 之间不能有幸存字符</text>

  <rect x="36" y="214" width="216" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="144" y="234" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#sk)">② 实例：s = "zdce" 的两种选择</text>

  <rect x="100" y="262" width="46" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="123" y="290" text-anchor="middle" font-size="18" fill="#2f5d24" font-weight="bold" filter="url(#sk)">z</text>
  <rect x="152" y="262" width="46" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="175" y="290" text-anchor="middle" font-size="18" fill="#333" filter="url(#sk)">d</text>
  <rect x="204" y="262" width="46" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="227" y="290" text-anchor="middle" font-size="18" fill="#333" filter="url(#sk)">c</text>
  <rect x="256" y="262" width="46" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="279" y="290" text-anchor="middle" font-size="18" fill="#2f5d24" font-weight="bold" filter="url(#sk)">e</text>
  <path d="M 175 256 Q 203 230 227 256" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="201" y="234" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#sk)">删 (d,c)</text>

  <path d="M 322 284 L 372 284" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <rect x="386" y="262" width="46" height="44" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.6" filter="url(#sk)"/>
  <text x="409" y="290" text-anchor="middle" font-size="18" fill="#333" filter="url(#sk)">z</text>
  <rect x="438" y="262" width="46" height="44" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.6" filter="url(#sk)"/>
  <text x="461" y="290" text-anchor="middle" font-size="18" fill="#333" filter="url(#sk)">e</text>
  <text x="423" y="326" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">删掉 dc 得 "ze"</text>

  <text x="540" y="270" font-size="12.5" fill="#3d5a30" filter="url(#sk)">"ze" 与 "zdce" 比较：z 相同，</text>
  <text x="540" y="290" font-size="12.5" fill="#3d5a30" filter="url(#sk)">第二位 e 与 d —— d 更小！</text>
  <text x="540" y="314" font-size="13" fill="#b85450" font-weight="bold" filter="url(#sk)">删除不一定更优，本题答案恰是 "zdce"</text>

  <rect x="36" y="352" width="216" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="144" y="372" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">③ 一般结构：幸存者切出「全删段」</text>

  <rect x="60" y="400" width="96" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="108" y="428" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#sk)">R₀ 全删</text>
  <rect x="156" y="400" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="180" y="428" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#sk)">p₁</text>
  <rect x="204" y="400" width="120" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="264" y="428" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#sk)">R₁ 全删</text>
  <rect x="324" y="400" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="348" y="428" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#sk)">p₂</text>
  <rect x="372" y="400" width="96" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="420" y="428" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#sk)">R₂ 全删</text>
  <rect x="468" y="400" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="492" y="428" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#sk)">p₃</text>
  <rect x="516" y="400" width="76" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#sk)"/>
  <text x="554" y="428" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#sk)">R₃ 全删</text>

  <text x="316" y="470" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">绿色 = 幸存字符（结果串的组成），橙色 = 被整段删掉的间隙</text>
  <text x="316" y="492" text-anchor="middle" font-size="12.5" fill="#3d5a30" filter="url(#sk)">任意操作方案 ⟺ 选定幸存位置 p₁ &lt; ⋯ &lt; p_m，每个橙色段独立地「完全可删」</text>
  <text x="316" y="514" text-anchor="middle" font-size="12.5" fill="#3d5a30" filter="url(#sk)">结果 = s[p₁] s[p₂] ⋯ s[p_m]</text>

  <rect x="120" y="544" width="320" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="280" y="570" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#sk)">canDel[l][r]：区间 [l..r] 能否完全删除</text>
  <text x="280" y="592" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">只看结构，与「删完后剩什么」无关</text>
  <path d="M 448 576 L 492 576" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <rect x="500" y="544" width="320" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="660" y="570" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#sk)">dp[l][r]：区间 [l..r] 能得到的最小串</text>
  <text x="660" y="592" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">依赖 canDel 提供的「全删」判定</text>
</svg>
