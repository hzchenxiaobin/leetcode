<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="35" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="64" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b">示例演算：arr = [12,33,4,56,22,2,34,33,22,12,34,56]</text>
  <path d="M 150 40 Q 320 50 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- array row -->
  <g filter="url(#sk2)">
    <rect x="68" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="110" y="56" width="40" height="36" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="152" y="56" width="40" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="194" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="236" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="278" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="320" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="362" y="56" width="40" height="36" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="404" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="446" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="488" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="530" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="88" y="78">12</text>
    <text x="130" y="78" font-weight="bold" fill="#8a6414">33</text>
    <text x="172" y="78" font-weight="bold" fill="#2e5e2e">4</text>
    <text x="214" y="78">56</text>
    <text x="256" y="78">22</text>
    <text x="298" y="78">2</text>
    <text x="340" y="78">34</text>
    <text x="382" y="78" font-weight="bold" fill="#8a6414">33</text>
    <text x="424" y="78">22</text>
    <text x="466" y="78">12</text>
    <text x="508" y="78">34</text>
    <text x="550" y="78">56</text>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="88" y="102">i=0</text>
    <text x="130" y="102">i=1</text>
    <text x="172" y="102">i=2</text>
    <text x="214" y="102">i=3</text>
    <text x="256" y="102">i=4</text>
    <text x="298" y="102">i=5</text>
    <text x="340" y="102">i=6</text>
    <text x="382" y="102">i=7</text>
    <text x="424" y="102">i=8</text>
    <text x="466" y="102">i=9</text>
    <text x="508" y="102">i=10</text>
    <text x="550" y="102">i=11</text>
  </g>

  <!-- query range bars -->
  <rect x="110" y="120" width="82" height="16" rx="7" fill="#cfe8d4" stroke="#4a7a3a" stroke-width="1.2" filter="url(#sk2)"/>
  <text x="200" y="132" text-anchor="start" font-size="10.5" fill="#2e6e2e">query(1, 2, 4)</text>
  <rect x="68" y="146" width="502" height="16" rx="7" fill="#dbe7f6" stroke="#4a8edb" stroke-width="1.2" filter="url(#sk2)"/>
  <text x="320" y="158" text-anchor="middle" font-size="10.5" fill="#2b4a6e">query(0, 11, 33)：整个数组</text>
  <rect x="152" y="172" width="208" height="16" rx="7" fill="#f9d9d5" stroke="#b85450" stroke-width="1.2" filter="url(#sk2)"/>
  <text x="368" y="184" text-anchor="start" font-size="10.5" fill="#b85450">query(2, 6, 33)：区间内无 33</text>

  <!-- table -->
  <rect x="75" y="212" width="490" height="30" rx="4" fill="#f3efe3" stroke="#b8a880" stroke-width="1.2" filter="url(#sk2)"/>
  <g font-size="11.5" font-weight="bold" fill="#6b5d3f" text-anchor="middle">
    <text x="150" y="231">查询</text>
    <text x="290" y="231">下标列表 idx</text>
    <text x="384" y="231">lo</text>
    <text x="442" y="231">hi</text>
    <text x="518" y="231">频数 = hi − lo</text>
  </g>
  <rect x="75" y="242" width="490" height="40" fill="#fdfdfd" stroke="#999" stroke-width="1.2" filter="url(#sk2)"/>
  <rect x="75" y="282" width="490" height="40" fill="#fdfdfd" stroke="#999" stroke-width="1.2" filter="url(#sk2)"/>
  <rect x="75" y="322" width="490" height="40" rx="3" fill="#fdeeed" stroke="#b85450" stroke-width="1.5" filter="url(#sk2)"/>
  <g stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" filter="url(#sk)">
    <path d="M 225 242 V 362"/>
    <path d="M 355 242 V 362"/>
    <path d="M 413 242 V 362"/>
    <path d="M 471 242 V 362"/>
  </g>
  <g text-anchor="middle">
    <text x="150" y="266" font-size="12" font-weight="bold" fill="#2e6e2e">query(1, 2, 4)</text>
    <text x="290" y="266" font-size="12" fill="#333">[2]</text>
    <text x="384" y="266" font-size="12" fill="#333">0</text>
    <text x="442" y="266" font-size="12" fill="#333">1</text>
    <text x="518" y="266" font-size="13" font-weight="bold" fill="#2e5e2e">1</text>

    <text x="150" y="306" font-size="12" font-weight="bold" fill="#2b4a6e">query(0, 11, 33)</text>
    <text x="290" y="306" font-size="12" fill="#333">[1, 7]</text>
    <text x="384" y="306" font-size="12" fill="#333">0</text>
    <text x="442" y="306" font-size="12" fill="#333">2</text>
    <text x="518" y="306" font-size="13" font-weight="bold" fill="#2b4a6e">2</text>

    <text x="150" y="346" font-size="12" font-weight="bold" fill="#b85450">query(2, 6, 33)</text>
    <text x="290" y="346" font-size="12" fill="#333">[1, 7]</text>
    <text x="384" y="346" font-size="12" fill="#333">1</text>
    <text x="442" y="346" font-size="12" fill="#333">1</text>
    <text x="518" y="346" font-size="13" font-weight="bold" fill="#b85450">0</text>
  </g>

  <g filter="url(#sk)">
    <rect x="95" y="386" width="450" height="40" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="403" text-anchor="middle" font-size="11.5" fill="#7a5415">第三行：lo = hi = 1，两次二分夹出空段 → 频数 0</text>
  <text x="320" y="419" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">值出现过但不在区间内，也自然返回 0，无需特判 ✓</text>
</svg>
