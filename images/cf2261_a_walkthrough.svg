<svg xmlns="http://www.w3.org/2000/svg" width="760" height="456" viewBox="0 0 760 456"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="456" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：k ≥ 3 保得住两端，k = 2 保不住</text>
  <path d="M 196 40 Q 380 47 564 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- ===== 面板 A：k = 3 ===== -->
  <rect x="34" y="58" width="692" height="182" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="84" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">s = 1 0 1 0 1 0（n = 6，k = 3，L = 1，R = 5 ⇒ 预期答案 4）</text>

  <text x="72" y="112" font-size="11.5" fill="#446688" filter="url(#rough2)">手数</text>
  <text x="182" y="112" font-size="11.5" fill="#446688" filter="url(#rough2)">动作</text>
  <text x="352" y="112" font-size="11.5" fill="#446688" filter="url(#rough2)">S 手里的集合</text>
  <text x="628" y="112" font-size="11.5" fill="#446688" filter="url(#rough2)">范围</text>
  <path d="M 52 122 L 708 122" stroke="#446688" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <text x="72" y="144" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">初始</text>
  <text x="182" y="144" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">—</text>
  <text x="352" y="144" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">{1, 3, 5}</text>
  <text x="634" y="144" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">4</text>

  <text x="72" y="168" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">第 1 手</text>
  <text x="182" y="168" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">S 送出 3（中间的）</text>
  <text x="352" y="168" font-size="11.5" fill="#a14340" filter="url(#rough2)">{1, 5}</text>
  <text x="634" y="168" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">4</text>

  <text x="72" y="192" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">第 2 手</text>
  <text x="182" y="192" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">K 送 2（落在区间内）</text>
  <text x="352" y="192" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">{1, 2, 5}</text>
  <text x="634" y="192" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">4</text>

  <text x="72" y="216" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">第 3 手</text>
  <text x="182" y="216" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">S 送出 2（刚收到的）</text>
  <text x="352" y="216" font-size="11.5" fill="#a14340" filter="url(#rough2)">{1, 5}</text>
  <text x="634" y="216" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">4</text>

  <text x="380" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1 和 5 永远不动，K 送进来的元素总能当「炮灰」再送出去 ⇒ 终局范围仍为 4</text>

  <!-- ===== 面板 B：k = 2 ===== -->
  <rect x="34" y="250" width="692" height="158" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="276" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">s = 1 0 0 1（n = 4，k = 2，L = 1，R = 4 ⇒ 初始范围 3，答案却只有 1）</text>

  <rect x="120" y="292" width="112" height="34" rx="7" fill="#fafafa" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="176" y="314" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">S = {1, 4}</text>

  <path d="M 238 309 L 272 309" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="278" y="292" width="140" height="34" rx="7" fill="#fafafa" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="314" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">送出 1 → {4}</text>

  <path d="M 424 309 L 458 309" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="464" y="292" width="152" height="34" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540" y="314" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">K 送 3 → {3, 4}</text>

  <text x="380" y="352" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">1 落到 K 手里就再也换不回来（K 绝不会把 1 还给你）；此后 S 只能「守一个、换一个」。</text>
  <text x="380" y="374" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">K 每回合都喂「贴着当前元素」的邻居：{4} → {3, 4} → {4} → {2, 4} → … 两数始终相邻。</text>
  <text x="380" y="396" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">范围 ≥ 1（两数必不相同），K 又能做到 1 ⇒ 答案恰为 1</text>

  <!-- 结论条 -->
  <rect x="34" y="418" width="692" height="30" rx="9" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="438" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">k = 2 时两个元素都是端点，送走谁就永远失去那一端 ⇒ 只能保住一端，答案为 1</text>
</svg>
