<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="180" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，边查表边累加</text>
  <text x="180" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">先累加「旧计数」，再把自己加进桶</text>

  <rect x="30" y="58" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="80" text-anchor="middle" font-size="11" fill="#7a5c18" filter="url(#rough2)">ans ← 0，cnt[0..99] 全部清零</text>
  <path d="M 180 92 L 180 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="106" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="128" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">for 每张骨牌 [a, b]（按输入顺序）</text>
  <path d="M 180 140 L 180 152" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="154" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="176" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">若 a &gt; b 则交换 → 保证 a ≤ b</text>
  <path d="M 180 188 L 180 200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="202" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="224" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">key ← a × 10 + b   （11 ≤ key ≤ 99）</text>
  <path d="M 180 236 L 180 248" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="250" width="300" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="180" y="272" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">ans ← ans + cnt[key]</text>
  <path d="M 180 284 L 180 296" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="298" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="320" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">cnt[key] ← cnt[key] + 1</text>

  <path d="M 30 315 H 14 V 123 H 26" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="14" y="232" text-anchor="middle" font-size="9.5" fill="#8a6d1f" transform="rotate(-90 14 232)" filter="url(#rough2)">还有骨牌未处理</text>

  <path d="M 180 332 L 180 348" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="366" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">遍历结束 → 返回 ans</text>

  <rect x="352" y="58" width="190" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="366" y="78" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">循环不变式</text>
  <text x="366" y="100" font-size="10" fill="#444" filter="url(#rough2)">处理第 i 张之前：</text>
  <text x="366" y="118" font-size="10" fill="#444" filter="url(#rough2)">cnt[k] = 前 i 张中</text>
  <text x="366" y="136" font-size="10" fill="#444" filter="url(#rough2)">规范化键为 k 的张数</text>
  <text x="366" y="162" font-size="10" fill="#444" filter="url(#rough2)">所以 ans 的增量恰是</text>
  <text x="366" y="180" font-size="10" fill="#444" filter="url(#rough2)">与当前骨牌等价的</text>
  <text x="366" y="198" font-size="10" fill="#444" filter="url(#rough2)">「先前」骨牌个数</text>
  <text x="366" y="224" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">⇒ ans = Σ C(c_k, 2)</text>

  <rect x="352" y="252" width="190" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="366" y="272" font-size="11" fill="#7a5c18" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="366" y="292" font-size="10" fill="#444" filter="url(#rough2)">时间 O(n)：只扫一趟</text>
  <text x="366" y="310" font-size="10" fill="#444" filter="url(#rough2)">空间 O(1)：45 个桶</text>
  <text x="366" y="330" font-size="10" fill="#8a6d1f" filter="url(#rough2)">n = 4×10⁴ 也只有 4 万步</text>
</svg>
