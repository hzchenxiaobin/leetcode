<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：一趟找极值 → 归一化 → 三候选取 min</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="245" y="52" width="150" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="73" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22">开始：一趟遍历 nums</text>

  <g filter="url(#sk)"><rect x="205" y="114" width="230" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="320" y="135" text-anchor="middle" font-size="12" fill="#2b4a6e">同时维护最小值下标 a、最大值下标 b</text>

  <g filter="url(#sk)"><rect x="205" y="170" width="230" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="320" y="191" text-anchor="middle" font-size="12" fill="#2b4a6e">归一化：i = min(a,b)，j = max(a,b)</text>

  <g filter="url(#sk)"><rect x="24" y="238" width="176" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="112" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">c₁ = j + 1</text>
  <text x="112" y="275" text-anchor="middle" font-size="10.5" fill="#8a6a2a">全从左删，删到 j 为止</text>

  <g filter="url(#sk)"><rect x="232" y="238" width="176" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">c₂ = n − i</text>
  <text x="320" y="275" text-anchor="middle" font-size="10.5" fill="#8a6a2a">全从右删，删到 i 为止</text>

  <g filter="url(#sk)"><rect x="440" y="238" width="176" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="528" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">c₃ = (i+1)+(n−j)</text>
  <text x="528" y="275" text-anchor="middle" font-size="10.5" fill="#8a6a2a">左删到 i ＋ 右删到 j</text>

  <g filter="url(#sk)"><rect x="225" y="320" width="190" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="320" y="341" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03a36">ans = min(c₁, c₂, c₃)</text>

  <g filter="url(#sk)"><rect x="265" y="382" width="110" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="402" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e22">返回 ans</text>

  <path d="M 320 86 L 320 112" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 148 L 320 168" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 204 C 320 222 112 216 112 236" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 204 L 320 236" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 204 C 320 222 528 216 528 236" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 112 284 C 112 306 320 298 320 318" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 284 L 320 318" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 528 284 C 528 306 320 298 320 318" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 354 L 320 380" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="530" y="222" text-anchor="middle" font-size="10.5" fill="#888">三个候选均 O(1)</text>
</svg>
