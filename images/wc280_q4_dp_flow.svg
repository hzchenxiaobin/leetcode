<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">算法流程：预处理 → 升序枚举状态 → 数位和定待放数 → 松弛后继 → 终态取 max</text>
  <path d="M 90 38 Q 320 46 550 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="140" y="52" width="360" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="320" y="78" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">① 预处理 pow3[i] = 3ⁱ；dp[0] = 0，其余 −1（不可达哨兵）</text>
  <path d="M 320 94 L 320 110" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="140" y="112" width="360" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="320" y="138" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">② 升序枚举 s = 0 … 3^S − 1（dp[s] = −1 直接跳过）</text>
  <path d="M 320 154 L 320 170" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="140" y="172" width="360" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="320" y="198" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold" filter="url(#rough2)">③ cnt ← s 的三进制数位和 = 已放数个数</text>
  <path d="M 320 214 L 320 228" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4: diamond -->
  <polygon points="320,228 458,264 320,300 182,264" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="269" text-anchor="middle" font-size="13" fill="#a67c00" font-weight="bold" filter="url(#rough2)">cnt ≥ n ？</text>

  <!-- yes branch -->
  <path d="M 458 264 L 474 264" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="466" y="256" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="478" y="238" width="156" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="556" y="259" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">ans = max(ans, dp[s])</text>
  <text x="556" y="278" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">终态：数已放完，篮子可空</text>

  <!-- no branch -->
  <path d="M 320 300 L 320 316" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="312" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <!-- step 5 -->
  <rect x="140" y="318" width="360" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="320" y="344" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">⑤ x = nums[cnt]；枚举篮子 i = 0 … S − 1</text>
  <path d="M 320 360 L 320 374" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 6 -->
  <rect x="140" y="376" width="360" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="398" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">⑥ 若 dᵢ = (s / pow3[i]) % 3 &lt; 2（有空位）</text>
  <text x="320" y="420" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">dp[s + 3ⁱ] = max(dp[s + 3ⁱ], dp[s] + (x &amp; (i+1)))</text>

  <!-- loop back -->
  <path d="M 140 404 Q 84 404 84 250 Q 84 133 136 133" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="56" y="270" font-size="10.5" fill="#4a7a3a" transform="rotate(-90 56 270)" text-anchor="middle" filter="url(#rough2)">处理下一个 s</text>

  <!-- bottom note -->
  <rect x="30" y="444" width="580" height="30" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="464" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">s′ = s + 3ⁱ &gt; s ⇒ 升序枚举天然满足拓扑序；全部状态扫完，ans 即最大与和</text>
</svg>
