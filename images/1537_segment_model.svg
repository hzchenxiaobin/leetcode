<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="430" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：公共值把两条路切成独立段，逐段取 max</text>
  <path d="M 150 36 Q 340 44 530 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="54" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">橙色 = 公共值（只计一次）；绿色 = 该段胜出一侧；蓝灰 = 落选一侧</text>

  <!-- 段分界与段标签 -->
  <g filter="url(#sk)" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="3,4">
    <path d="M 192 76 L 192 204"/>
    <path d="M 232 76 L 232 204"/>
    <path d="M 360 76 L 360 204"/>
    <path d="M 400 76 L 400 204"/>
  </g>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="145" y="72" font-size="11.5" font-weight="bold" fill="#446688">段①</text>
    <text x="212" y="72" font-size="11.5" font-weight="bold" fill="#b07818">公共值</text>
    <text x="296" y="72" font-size="11.5" font-weight="bold" fill="#446688">段②</text>
    <text x="380" y="72" font-size="11.5" font-weight="bold" fill="#b07818">公共值</text>
    <text x="443" y="72" font-size="11.5" font-weight="bold" fill="#446688">段③</text>
  </g>

  <!-- nums1 行 -->
  <text x="48" y="113" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#sk)">nums1</text>
  <g filter="url(#sk)">
    <rect x="110" y="92" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="194" y="92" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="236" y="92" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="362" y="92" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="446" y="92" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" filter="url(#sk)">
    <text x="128" y="113" fill="#3a5a3a">2</text>
    <text x="212" y="113" fill="#b07818">4</text>
    <text x="254" y="113" fill="#8899aa">5</text>
    <text x="380" y="113" fill="#b07818">8</text>
    <text x="464" y="113" fill="#3a5a3a">10</text>
  </g>

  <!-- 公共值切换虚线 -->
  <g filter="url(#sk)" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3">
    <path d="M 212 128 L 212 164"/>
    <path d="M 380 128 L 380 164"/>
  </g>
  <text x="296" y="150" text-anchor="middle" font-size="10.5" fill="#b07818" filter="url(#sk)">相等 ⇒ 可切换</text>

  <!-- nums2 行 -->
  <text x="48" y="189" font-size="12" font-weight="bold" fill="#2b4a66" filter="url(#sk)">nums2</text>
  <g filter="url(#sk)">
    <rect x="194" y="168" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="278" y="168" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="362" y="168" width="36" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="404" y="168" width="36" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" filter="url(#sk)">
    <text x="212" y="189" fill="#b07818">4</text>
    <text x="296" y="189" fill="#3a5a3a">6</text>
    <text x="380" y="189" fill="#b07818">8</text>
    <text x="422" y="189" fill="#8899aa">9</text>
  </g>

  <!-- 段结算 chips -->
  <g filter="url(#sk)">
    <rect x="70" y="224" width="150" height="24" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="221" y="224" width="150" height="24" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="372" y="224" width="150" height="24" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#2b4a66" filter="url(#sk)">
    <text x="145" y="240">段①：max(2, ∅) = 2</text>
    <text x="296" y="240">段②：max(5, 6) = 6</text>
    <text x="447" y="240">段③：max(10, 9) = 10</text>
  </g>

  <!-- 结果公式 -->
  <g filter="url(#sk)">
    <rect x="60" y="262" width="560" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="340" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818" filter="url(#sk)">ans = 2 + 4 + 6 + 8 + 10 = 30</text>
  <text x="340" y="299" text-anchor="middle" font-size="10.5" fill="#b07818" filter="url(#sk)">每段独立选「和更大」的一侧；公共值 4、8 各只计一次</text>

  <!-- 为什么独立 -->
  <g filter="url(#sk)">
    <rect x="60" y="322" width="560" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#2b4a66" filter="url(#sk)">
    <text x="340" y="344">为什么段间独立？段内出现的值不是公共值，路径无处可切，只能整段留在一条数组上；</text>
    <text x="340" y="362">而到达公共值 c 时，无论来自哪一侧，后续的选择集合完全相同（无后效性）。</text>
    <text x="340" y="380">于是「选路径」坍缩为「每段二选一」——贪心即最优，O(n+m) 双指针逐段结算。</text>
  </g>
</svg>
