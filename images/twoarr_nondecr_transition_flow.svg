<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="560" fill="#fdfcf7"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：O(n) 一遍扫 + O(1) 滚动变量</text>
  <path d="M 190 40 Q 350 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- notation note -->
  <g filter="url(#sk)">
    <rect x="140" y="52" width="420" height="34" rx="8" fill="#f5f5f5" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="350" y="74" text-anchor="middle" font-size="11" fill="#555">记 a = nums1[i]，b = nums2[i]，pa = nums1[i−1]，pb = nums2[i−1]</text>

  <!-- init box -->
  <g filter="url(#sk)">
    <path d="M 350 86 L 350 106" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="190" y="110" width="320" height="42" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="350" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">初始化：dp0 = dp1 = 1，ans = 1</text>

  <g filter="url(#sk)">
    <path d="M 350 152 L 350 172" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- loop box -->
  <g filter="url(#sk)">
    <rect x="190" y="176" width="320" height="38" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="350" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">循环：i = 1 … n−1</text>

  <g filter="url(#sk)">
    <path d="M 350 214 L 350 234" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- compute cur0 -->
  <g filter="url(#sk)">
    <rect x="190" y="238" width="320" height="64" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="350" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">本位选 nums1[i]：</text>
  <text x="350" y="287" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">cur0 = 1 + max( (a≥pa)·dp0 , (a≥pb)·dp1 )</text>

  <g filter="url(#sk)">
    <path d="M 350 302 L 350 322" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- compute cur1 -->
  <g filter="url(#sk)">
    <rect x="190" y="326" width="320" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="350" y="351" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">本位选 nums2[i]：</text>
  <text x="350" y="375" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">cur1 = 1 + max( (b≥pa)·dp0 , (b≥pb)·dp1 )</text>

  <g filter="url(#sk)">
    <path d="M 350 390 L 350 410" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- rolling update -->
  <g filter="url(#sk)">
    <rect x="190" y="414" width="320" height="46" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="350" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">滚动更新：dp0 ← cur0，dp1 ← cur1；ans ← max(ans, cur0, cur1)</text>

  <!-- loop back -->
  <g filter="url(#sk)">
    <path d="M 512 437 L 644 437 L 644 195 L 514 195" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="652" y="318" font-size="10" fill="#666">i+1</text>

  <!-- loop exit -->
  <g filter="url(#sk)">
    <path d="M 188 195 L 58 195 L 58 522 L 206 522" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="66" y="350" font-size="10" fill="#666">循</text>
  <text x="66" y="366" font-size="10" fill="#666">环</text>
  <text x="66" y="382" font-size="10" fill="#666">结</text>
  <text x="66" y="398" font-size="10" fill="#666">束</text>

  <!-- output box -->
  <g filter="url(#sk)">
    <rect x="210" y="500" width="300" height="44" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="360" y="527" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">返回 ans（全局最大，非 dp 尾值）</text>
</svg>
