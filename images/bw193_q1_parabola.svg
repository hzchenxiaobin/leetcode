<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">定和抛物线：和固定为 T 时，两数越接近，乘积越大</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">P(x) = x(T−x) = −(x − T/2)² + T²/4，开口向下，对称轴 x = T/2</text>

  <rect x="304" y="56" width="214" height="252" fill="#e6f4ea" opacity="0.45" filter="url(#rough2)"/>
  <text x="351" y="278" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">有效域 x &gt; T/2</text>
  <text x="351" y="294" text-anchor="middle" font-size="9.5" fill="#4a7a3a">（由 x &gt; y 推出）</text>

  <line x1="60" y1="310" x2="530" y2="310" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="80" y1="332" x2="80" y2="52" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="534" y="326" font-size="11" fill="#666">x</text>
  <text x="64" y="50" font-size="11" fill="#666">P</text>

  <line x1="300" y1="96" x2="300" y2="318" stroke="#b85450" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="300" y="72" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">x = T/2</text>
  <text x="300" y="88" text-anchor="middle" font-size="10" fill="#446688">顶点 (T/2, T²/4)</text>

  <path d="M 100 300 Q 300 -100 500 300" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="300" cy="100" r="4" fill="#446688" filter="url(#rough2)"/>

  <circle cx="340" cy="108" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="400" cy="150" r="4" fill="#d6a040" filter="url(#rough2)"/>

  <circle cx="444" cy="112" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="452" y="116" font-size="10.5" fill="#b85450" font-weight="bold">(3,2)→6 ★</text>
  <circle cx="444" cy="132" r="3.5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="452" y="136" font-size="10.5" fill="#a07830">(4,1)→4</text>

  <text x="462" y="180" font-size="10.5" fill="#4a7a3a">越靠近对称轴</text>
  <text x="462" y="196" font-size="10.5" fill="#4a7a3a">乘积越大</text>
  <path d="M 452 172 Q 418 156 388 140" fill="none" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="140" y="254" font-size="10" fill="#888">镜像：P(x) = P(T−x)</text>

  <rect x="40" y="345" width="480" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="363" font-size="10.5" fill="#333">以 T=5 为例：3+2=5，|3−2.5|=0.5 → 积 6；4+1=5，|4−2.5|=1.5 → 积 4</text>
  <text x="56" y="380" font-size="10.5" fill="#555">x 须严格大于 y，只能逼近对称轴，取不到顶点值 T²/4</text>
</svg>
