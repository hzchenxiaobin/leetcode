<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：判定看次数，贡献 = 值 × 次数</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums array -->
  <text x="320" y="71" text-anchor="middle" font-size="12.5" fill="#666">nums = [1, 2, 2, 3, 3, 3, 3, 4]（值域 1~100）</text>
  <g filter="url(#sk)">
    <rect x="158" y="82" width="36" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="199" y="82" width="36" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="240" y="82" width="36" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="281" y="82" width="36" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="322" y="82" width="36" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="363" y="82" width="36" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="404" y="82" width="36" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="445" y="82" width="36" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="16" text-anchor="middle" font-weight="bold">
    <text x="176" y="105" fill="#2b4a6e">1</text>
    <text x="217" y="105" fill="#2e5e22">2</text>
    <text x="258" y="105" fill="#2e5e22">2</text>
    <text x="299" y="105" fill="#7a5415">3</text>
    <text x="340" y="105" fill="#7a5415">3</text>
    <text x="381" y="105" fill="#7a5415">3</text>
    <text x="422" y="105" fill="#7a5415">3</text>
    <text x="463" y="105" fill="#8e3a34">4</text>
  </g>

  <!-- arrows into buckets -->
  <g stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)">
    <path d="M 176 124 Q 178 162 141 190"/>
    <path d="M 237 124 Q 243 162 257 190"/>
    <path d="M 360 124 Q 368 162 379 190"/>
    <path d="M 463 124 Q 478 162 499 190"/>
  </g>

  <!-- row labels -->
  <g font-size="11" fill="#888" text-anchor="end">
    <text x="84" y="226">入桶计数</text>
    <text x="84" y="291">k=2 判定</text>
    <text x="84" y="334">加权贡献</text>
  </g>

  <!-- buckets -->
  <g filter="url(#sk)">
    <rect x="91" y="194" width="92" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="213" y="194" width="92" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="335" y="194" width="92" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="457" y="194" width="92" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="12" fill="#666" text-anchor="middle">
    <text x="137" y="216">cnt[1]</text>
    <text x="259" y="216">cnt[2]</text>
    <text x="381" y="216">cnt[3]</text>
    <text x="503" y="216">cnt[4]</text>
  </g>
  <g font-size="19" font-weight="bold" text-anchor="middle">
    <text x="137" y="240" fill="#2b4a6e">1</text>
    <text x="259" y="240" fill="#2e5e22">2</text>
    <text x="381" y="240" fill="#7a5415">4</text>
    <text x="503" y="240" fill="#8e3a34">1</text>
  </g>

  <!-- short arrows to badges -->
  <g stroke="#8a8a8a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)">
    <path d="M 137 250 L 137 264"/>
    <path d="M 259 250 L 259 264"/>
    <path d="M 381 250 L 381 264"/>
    <path d="M 503 250 L 503 264"/>
  </g>

  <!-- badges -->
  <g filter="url(#sk)">
    <rect x="91" y="270" width="92" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="213" y="270" width="92" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="335" y="270" width="92" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="457" y="270" width="92" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#555">
    <text x="121" y="291">1 % 2 = 1</text>
    <text x="243" y="291">2 % 2 = 0</text>
    <text x="365" y="291">4 % 2 = 0</text>
    <text x="487" y="291">1 % 2 = 1</text>
  </g>
  <g fill="none" stroke-width="2.4" filter="url(#sk)">
    <path d="M 159 285 L 170 297 M 170 285 L 159 297" stroke="#b85450"/>
    <path d="M 275 289 L 280 294 L 289 283" stroke="#4a7a3a"/>
    <path d="M 397 289 L 402 294 L 411 283" stroke="#4a7a3a"/>
    <path d="M 525 285 L 536 297 M 536 285 L 525 297" stroke="#b85450"/>
  </g>

  <!-- contributions -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="137" y="336" fill="#999">0</text>
    <text x="259" y="336" fill="#2e5e22">2 × 2 = 4</text>
    <text x="381" y="336" fill="#2e5e22">3 × 4 = 12</text>
    <text x="503" y="336" fill="#999">0</text>
  </g>

  <!-- answer -->
  <g filter="url(#sk)">
    <rect x="170" y="356" width="300" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="381" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e22">ans = 2×2 + 3×4 = 4 + 12 = 16</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="40" y="414" width="560" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="439" text-anchor="middle" font-size="11.5" fill="#7a5415">扫描 1~100 时空桶 cnt = 0 也满足 0 % k = 0，但贡献 x × 0 = 0 —— 求和题中无害</text>
</svg>
