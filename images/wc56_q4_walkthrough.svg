<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：二分答案在两个官方样例上的逐步走查</text>
  <text x="290" y="46" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">每轮只做两件事：取 mid，数出 F(mid) 后与 k 比较</text>

  <!-- ================= 示例 1 ================= -->
  <text x="60" y="78" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：nums = [1,3,1]，k = 1</text>

  <rect x="60" y="92" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="112" y="92" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="164" y="92" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="83" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="135" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="187" y="116" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="224" y="116" font-size="9.5" fill="#666" filter="url(#rough2)">排序后的数组</text>

  <rect x="60" y="140" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="112" y="140" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="164" y="140" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="83" y="164" text-anchor="middle" font-size="13" fill="#a5761c" filter="url(#rough2)">0</text>
  <text x="135" y="164" text-anchor="middle" font-size="13" fill="#a5761c" filter="url(#rough2)">2</text>
  <text x="187" y="164" text-anchor="middle" font-size="13" fill="#a5761c" filter="url(#rough2)">2</text>
  <text x="224" y="164" font-size="9.5" fill="#666" filter="url(#rough2)">两两距离（升序）</text>
  <text x="60" y="194" font-size="9.5" fill="#b85450" filter="url(#rough2)">第 1 小 ⇒ 0，二分区间 lo = 0，hi = 2</text>

  <rect x="330" y="92" width="232" height="38" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="116" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">① mid = 1，F(1) = 1 ≥ 1 → hi = 1</text>
  <rect x="330" y="140" width="232" height="38" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="164" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">② mid = 0，F(0) = 1 ≥ 1 → hi = 0</text>
  <rect x="330" y="188" width="232" height="38" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="212" font-size="9.5" fill="#8e3b38" font-weight="bold" filter="url(#rough2)">③ lo = hi = 0 ⇒ 答案 0</text>

  <!-- 分隔 -->
  <g filter="url(#rough2)">
    <line x1="56" y1="244" x2="524" y2="244" stroke="#e0e0e0" stroke-width="1.4" stroke-dasharray="8 6"/>
  </g>

  <!-- ================= 示例 3 ================= -->
  <text x="60" y="272" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 3：nums = [1,6,1]，k = 3</text>

  <rect x="60" y="286" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="112" y="286" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="164" y="286" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="83" y="310" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="135" y="310" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="187" y="310" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="224" y="310" font-size="9.5" fill="#666" filter="url(#rough2)">排序后的数组</text>

  <rect x="60" y="334" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="112" y="334" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="164" y="334" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="83" y="358" text-anchor="middle" font-size="13" fill="#a5761c" filter="url(#rough2)">0</text>
  <text x="135" y="358" text-anchor="middle" font-size="13" fill="#a5761c" filter="url(#rough2)">5</text>
  <text x="187" y="358" text-anchor="middle" font-size="13" fill="#a5761c" filter="url(#rough2)">5</text>
  <text x="224" y="358" font-size="9.5" fill="#666" filter="url(#rough2)">两两距离（升序）</text>
  <text x="60" y="388" font-size="9.5" fill="#b85450" filter="url(#rough2)">第 3 小 ⇒ 5，二分区间 lo = 0，hi = 5</text>

  <rect x="330" y="286" width="232" height="38" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="310" font-size="9.5" fill="#a5761c" filter="url(#rough2)">① mid = 2，F(2) = 1 &lt; 3 → lo = 3</text>
  <rect x="330" y="334" width="232" height="38" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="358" font-size="9.5" fill="#a5761c" filter="url(#rough2)">② mid = 4，F(4) = 1 &lt; 3 → lo = 5</text>
  <rect x="330" y="382" width="232" height="38" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="406" font-size="9.5" fill="#8e3b38" font-weight="bold" filter="url(#rough2)">③ lo = hi = 5 ⇒ 答案 5</text>

  <text x="290" y="434" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">F(d) 单调不减 ⇒ 二分最多 O(log(max − min)) 轮，每轮 O(n) 计数</text>
</svg>
