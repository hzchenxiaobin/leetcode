<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="44"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：负号个数 3（奇数）→ 留一个给最小绝对值</text>

  <!-- 原矩阵 -->
  <text x="130" y="62" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">原矩阵（3 个负数）</text>
  <g filter="url(#rough2)">
    <rect x="58" y="76" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="108" y="76" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="158" y="76" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="58" y="118" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="108" y="118" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="158" y="118" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="58" y="160" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="108" y="160" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="158" y="160" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="82" y="101">1</text><text x="132" y="101">2</text><text x="182" y="101">3</text>
    <text x="82" y="143">−1</text><text x="132" y="143">−2</text><text x="182" y="143">−3</text>
    <text x="82" y="185">1</text><text x="132" y="185">2</text><text x="182" y="185">3</text>
  </g>

  <path d="M 216 130 C 246 130, 252 130, 276 130" fill="none" stroke="#446688" stroke-width="2.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="246" y="118" font-size="11.5" fill="#446688" filter="url(#rough2)" text-anchor="middle">负号搬运</text>

  <!-- 终态矩阵 -->
  <text x="392" y="62" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">最优终态（只剩 1 个负号）</text>
  <g filter="url(#rough2)">
    <rect x="320" y="76" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="370" y="76" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="420" y="76" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="320" y="118" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="370" y="118" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="420" y="118" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="320" y="160" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="370" y="160" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="420" y="160" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="344" y="101">1</text><text x="394" y="101">2</text><text x="444" y="101">3</text>
    <text x="344" y="143">1</text><text x="394" y="143">−1</text><text x="444" y="143">3</text>
    <text x="344" y="185">1</text><text x="394" y="185">2</text><text x="444" y="185">3</text>
  </g>
  <text x="392" y="222" font-size="12.5" fill="#8a3a34" filter="url(#rough2)" text-anchor="middle">负号放到绝对值最小的 1 上</text>

  <!-- 计算过程 -->
  <rect x="50" y="248" width="460" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13.5" fill="#7a5c1e">
    <text x="280" y="272" text-anchor="middle" font-weight="bold">Σ|x| = 1+2+3+1+2+3+1+2+3 = 18，min|x| = 1</text>
    <text x="280" y="298" text-anchor="middle">奇数个负号 → 18 − 2×1 = 16（与官方答案一致）</text>
  </g>

  <rect x="50" y="330" width="460" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">若把负号放到 3 上只能得 18−2×3=12 —— 留给谁一目了然</text>
</svg>
