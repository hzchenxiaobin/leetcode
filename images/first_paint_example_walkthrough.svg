<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 412" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="412" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">示例演算：第二列在 i = 3 率先涂满（示例 2）</text>
  <path d="M 100 32 Q 280 40 460 32" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <text x="280" y="52" text-anchor="middle" font-size="10.5" fill="#999">idx：2→0, 8→1, 7→2, 4→3, 1→4, 3→5, 5→6, 6→7, 9→8（值 → 涂色时刻）</text>

  <!-- column headers -->
  <text x="173" y="74" text-anchor="middle" font-size="11" fill="#999">列0</text>
  <text x="245" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">列1 ★</text>
  <text x="317" y="74" text-anchor="middle" font-size="11" fill="#999">列2</text>

  <!-- grid -->
  <g filter="url(#rough2)">
    <rect x="140" y="80" width="66" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="212" y="80" width="66" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="284" y="80" width="66" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="140" y="138" width="66" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="212" y="138" width="66" height="52" rx="4" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.4"/>
    <rect x="284" y="138" width="66" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="140" y="196" width="66" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="212" y="196" width="66" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="284" y="196" width="66" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="130" y="111" text-anchor="end" font-size="11" fill="#999">行0</text>
  <text x="130" y="169" text-anchor="end" font-size="11" fill="#999">行1</text>
  <text x="130" y="227" text-anchor="end" font-size="11" fill="#999">行2</text>

  <text x="173" y="102" text-anchor="middle" font-size="15" fill="#333">3</text>
  <text x="173" y="123" text-anchor="middle" font-size="10" fill="#999">t = 5</text>
  <text x="245" y="102" text-anchor="middle" font-size="15" fill="#333">2</text>
  <text x="245" y="123" text-anchor="middle" font-size="10" fill="#999">t = 0</text>
  <text x="317" y="102" text-anchor="middle" font-size="15" fill="#333">5</text>
  <text x="317" y="123" text-anchor="middle" font-size="10" fill="#999">t = 6</text>

  <text x="173" y="160" text-anchor="middle" font-size="15" fill="#333">1</text>
  <text x="173" y="181" text-anchor="middle" font-size="10" fill="#999">t = 4</text>
  <text x="245" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">4</text>
  <text x="245" y="181" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">t = 3 瓶颈</text>
  <text x="317" y="160" text-anchor="middle" font-size="15" fill="#333">6</text>
  <text x="317" y="181" text-anchor="middle" font-size="10" fill="#999">t = 7</text>

  <text x="173" y="218" text-anchor="middle" font-size="15" fill="#333">8</text>
  <text x="173" y="239" text-anchor="middle" font-size="10" fill="#999">t = 1</text>
  <text x="245" y="218" text-anchor="middle" font-size="15" fill="#333">7</text>
  <text x="245" y="239" text-anchor="middle" font-size="10" fill="#999">t = 2</text>
  <text x="317" y="218" text-anchor="middle" font-size="15" fill="#333">9</text>
  <text x="317" y="239" text-anchor="middle" font-size="10" fill="#999">t = 8</text>

  <!-- arrows to row boxes -->
  <path d="M 352 106 L 376 106" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <path d="M 352 164 L 376 164" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <path d="M 352 222 L 376 222" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

  <!-- row completion boxes -->
  <g filter="url(#rough2)">
    <rect x="382" y="80" width="148" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="382" y="138" width="148" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="382" y="196" width="148" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="456" y="101" text-anchor="middle" font-size="11" fill="#2b2b2b">行0：max{5,0,6}</text>
  <text x="456" y="121" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">= 6</text>
  <text x="456" y="159" text-anchor="middle" font-size="11" fill="#2b2b2b">行1：max{4,3,7}</text>
  <text x="456" y="179" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">= 7</text>
  <text x="456" y="217" text-anchor="middle" font-size="11" fill="#2b2b2b">行2：max{1,2,8}</text>
  <text x="456" y="237" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">= 8</text>

  <!-- column completion boxes -->
  <g filter="url(#rough2)">
    <rect x="140" y="258" width="66" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="212" y="258" width="66" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="284" y="258" width="66" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="173" y="277" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b2b2b">列0</text>
  <text x="173" y="295" text-anchor="middle" font-size="10.5" fill="#2b2b2b">max = 5</text>
  <text x="245" y="277" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">列1 ★</text>
  <text x="245" y="295" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">max = 3</text>
  <text x="317" y="277" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b2b2b">列2</text>
  <text x="317" y="295" text-anchor="middle" font-size="10.5" fill="#2b2b2b">max = 8</text>

  <text x="245" y="322" text-anchor="middle" font-size="10" fill="#999">列0 = max{5,4,1}，列1 = max{0,3,2}，列2 = max{6,7,8}</text>

  <!-- answer box -->
  <rect x="80" y="336" width="400" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">答案 = min{6, 7, 8, 5, 3, 8} = 3</text>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#2b2b2b">时刻 3 涂上 4，第二列 {2,7,4} 率先涂满 → 返回 3</text>
</svg>
