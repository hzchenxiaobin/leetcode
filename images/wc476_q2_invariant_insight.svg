<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="131" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：D = a 数 − b 数，是怎么删都删不掉的</text>
  <path d="M 150 44 Q 320 52 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">以 s = aabbab 为例，随便删一个平衡子串试试</text>

  <!-- row 1: original string -->
  <g filter="url(#sk)">
    <rect x="132" y="72" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="196" y="72" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="260" y="72" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="324" y="72" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="388" y="72" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="452" y="72" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="160" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="224" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="288" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#33517a" filter="url(#sk)">b</text>
  <text x="352" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#33517a" filter="url(#sk)">b</text>
  <text x="416" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="480" y="98" text-anchor="middle" font-size="18" font-weight="bold" fill="#33517a" filter="url(#sk)">b</text>

  <!-- balanced substring to remove -->
  <rect x="190" y="66" width="260" height="52" rx="6" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7,5" filter="url(#sk)"/>
  <text x="462" y="90" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">平衡子串 "abba"</text>
  <text x="462" y="106" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#sk)">2 个 a = 2 个 b ✓</text>

  <path d="M 320 124 L 320 152" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="334" y="142" text-anchor="start" font-size="11" fill="#b85450" filter="url(#sk)">删除后无缝拼接</text>

  <!-- row 2: remaining -->
  <text x="244" y="184" text-anchor="end" font-size="12" fill="#888" filter="url(#sk)">剩下</text>
  <g filter="url(#sk)">
    <rect x="260" y="158" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="324" y="158" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="288" y="184" text-anchor="middle" font-size="18" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">a</text>
  <text x="352" y="184" text-anchor="middle" font-size="18" font-weight="bold" fill="#33517a" filter="url(#sk)">b</text>

  <!-- ledger panel -->
  <rect x="70" y="218" width="500" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#sk)"/>
  <text x="320" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#sk)">D 的账本（D = a 的个数 − b 的个数）</text>
  <text x="320" y="266" text-anchor="middle" font-size="12" fill="#6a5530" filter="url(#sk)">删除前 D = 3 − 3 = 0　删掉的 D = 2 − 2 = 0　删除后 D = 1 − 1 = 0</text>
  <text x="320" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6520" filter="url(#sk)">⇒ 无论怎么删，D 纹丝不动（不变量）</text>

  <!-- lower bound box -->
  <rect x="80" y="318" width="480" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#sk)"/>
  <text x="320" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">任意时刻：长度 = a 数 + b 数 ≥ |a 数 − b 数| = |D|</text>
  <text x="320" y="366" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">⇒ 最终长度 ≥ |D|，下界到手</text>
</svg>
