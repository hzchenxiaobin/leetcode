<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333">操作 x = 7 同时命中所有值为 7 的极大段</text>

  <text x="40" y="76" font-size="12" fill="#666">nums</text>
  <rect x="100" y="56" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="56" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="224" y="56" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="286" y="56" width="56" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="79" text-anchor="middle" font-size="14" fill="#b85450">7</text>
  <text x="190" y="79" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="252" y="79" text-anchor="middle" font-size="14" fill="#b85450">7</text>
  <text x="314" y="79" text-anchor="middle" font-size="14" fill="#333">…</text>
  <text x="128" y="108" text-anchor="middle" font-size="10" fill="#b85450">段1</text>
  <text x="252" y="108" text-anchor="middle" font-size="10" fill="#b85450">段2</text>

  <text x="40" y="156" font-size="12" fill="#666">target</text>
  <rect x="100" y="136" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="136" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="224" y="136" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="286" y="136" width="56" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="159" text-anchor="middle" font-size="14" fill="#4a7a3a">5</text>
  <text x="190" y="159" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="252" y="159" text-anchor="middle" font-size="14" fill="#4a7a3a">9</text>
  <text x="314" y="159" text-anchor="middle" font-size="14" fill="#333">…</text>

  <path d="M128,96 L128,130" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M252,96 L252,130" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="120" font-size="11" fill="#b85450">一次操作写入各自的 target</text>

  <rect x="60" y="196" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="223" font-size="12" fill="#333">错位值集合 S = {7, 3}：两处 7 只算一个值</text>

  <rect x="60" y="252" width="440" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="274" font-size="12" fill="#4a7a3a">下界：每个错位值都必须被选中一次</text>
  <text x="76" y="292" font-size="12" fill="#4a7a3a">上界：每个错位值选一次即可（写入即永久正确）</text>
</svg>
