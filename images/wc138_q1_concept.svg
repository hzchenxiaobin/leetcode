<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">高度检查器：把 heights 排序成 expected 后逐位比对</text>
  <text x="280" y="48" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">数值相同的位置「恰好」是正确的，不比交换次数</text>
  <text x="30" y="92" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">heights</text>
  <text x="30" y="162" font-size="11" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">expected</text>
  <rect x="90" y="72" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="112" y="96.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="134" y="72" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="156" y="96.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="178" y="72" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="200" y="96.7" font-size="13" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="222" y="72" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="244" y="96.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="266" y="72" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="288" y="96.7" font-size="13" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="310" y="72" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="332" y="96.7" font-size="13" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="90" y="142" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="112" y="166.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="134" y="142" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="156" y="166.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="178" y="142" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="200" y="166.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="222" y="142" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="244" y="166.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="266" y="142" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="288" y="166.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="310" y="142" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="332" y="166.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">4</text>
  <text x="112" y="200" font-size="10.5" fill="#999" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="156" y="200" font-size="10.5" fill="#999" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="200" y="200" font-size="10.5" fill="#999" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="244" y="200" font-size="10.5" fill="#999" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="288" y="200" font-size="10.5" fill="#999" text-anchor="middle" filter="url(#rough2)">4</text>
  <text x="332" y="200" font-size="10.5" fill="#999" text-anchor="middle" filter="url(#rough2)">5</text>
  <text x="237" y="218" font-size="10.5" fill="#999" text-anchor="middle" filter="url(#rough2)">下标</text>
  <rect x="392" y="66" width="152" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="404" y="83.6" font-size="10" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">同一个下标上一旦相等，</text>
  <text x="404" y="99.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">就说明它「本来就在</text>
  <text x="404" y="115.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">正确的位置」</text>
  <rect x="392" y="140" width="152" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="404" y="169.6" font-size="10" fill="#8a3a36" text-anchor="start" filter="url(#rough2)">红色 3 格（下标 2、4、5）</text>
  <text x="404" y="185.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">heights[i] ≠ expected[i]</text>
  <text x="404" y="201.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">答案 = 3</text>
  <text x="90" y="258" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">只需比较「值」，不需要真的去交换：排序后的第 i 名身高就是 expected[i]。</text>
  <rect x="90" y="274" width="380" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="102" y="297.6" font-size="10" fill="#8a6a10" text-anchor="start" filter="url(#rough2)">计数排序：值域 ≤ 100，用桶统计再展开，O(n + C) 且无比较排序开销</text>
</svg>
