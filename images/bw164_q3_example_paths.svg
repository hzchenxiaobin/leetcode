<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="380" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">示例 1：5 条有效路径（[M] 表示撞镜子后被反射）</text>
  <text x="60" y="76" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">#</text>
  <text x="100" y="76" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">路径</text>
  <line x1="56" y1="84" x2="566" y2="84" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="114" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="100" y="114" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">(0,0) → (0,1)[M] → (1,1) → (1,2)[M] → (2,2)</text>
  <text x="60" y="152" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="100" y="152" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">(0,0) → (0,1)[M] → (1,1) → (2,1) → (2,2)</text>
  <text x="60" y="190" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="100" y="190" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">(0,0) → (1,0) → (1,1) → (1,2)[M] → (2,2)</text>
  <text x="60" y="228" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="100" y="228" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">(0,0) → (1,0) → (1,1) → (2,1) → (2,2)</text>
  <text x="60" y="266" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="100" y="266" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">(0,0) → (1,0) → (2,0)[M] → (2,1) → (2,2)</text>
  <rect x="56" y="316" width="588" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="346" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">反射只是「换方向落地」，路径仍然只增不减 ⇒ 可以按格子计数</text>
</svg>
