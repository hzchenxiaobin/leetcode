<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：popcount 链极速坍缩，深度只有 0~4 五类</text>

  <!-- 左侧：值域坍缩瀑布 -->
  <rect x="55" y="52" width="200" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="72" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x ≤ 10^15</text>
  <text x="155" y="90" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">二进制至多 50 位</text>

  <path d="M155,98 L155,120" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="113" font-size="10.5" fill="#b85450" filter="url(#rough2)">popcount（第 1 步）</text>

  <rect x="55" y="126" width="200" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="152" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">p1 = popcount(x) ≤ 50</text>

  <path d="M155,168 L155,190" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="183" font-size="10.5" fill="#b85450" filter="url(#rough2)">popcount（第 2 步）</text>

  <rect x="55" y="196" width="200" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="222" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">p2 = popcount(p1) ≤ 5</text>

  <path d="M155,238 L155,260" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="253" font-size="10.5" fill="#b85450" filter="url(#rough2)">popcount（第 3 步）</text>

  <rect x="55" y="266" width="200" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="292" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">p3 = popcount(p2) ≤ 2</text>

  <path d="M155,308 L155,330" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="323" font-size="10.5" fill="#b85450" filter="url(#rough2)">popcount（第 4 步）</text>

  <rect x="55" y="336" width="200" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="155" y="356" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p4 = 1（必到 1）</text>
  <text x="155" y="374" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">链长至多 4 ⇒ depth ≤ 4</text>

  <!-- 右侧：深度分类速查 -->
  <text x="451" y="66" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">深度分类速查（x ≤ 10^15）</text>

  <rect x="295" y="80" width="66" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="328" y="98" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">depth 0</text>
  <text x="375" y="98" font-size="12" fill="#333" filter="url(#rough2)">x = 1（本来就是 1，0 步）</text>

  <rect x="295" y="116" width="66" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="328" y="134" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">depth 1</text>
  <text x="375" y="134" font-size="12" fill="#333" filter="url(#rough2)">2 → 1（x 是 2 的幂）</text>

  <rect x="295" y="152" width="66" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="328" y="170" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">depth 2</text>
  <text x="375" y="170" font-size="12" fill="#333" filter="url(#rough2)">3 → 2 → 1</text>

  <rect x="295" y="188" width="66" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="328" y="206" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">depth 3</text>
  <text x="375" y="206" font-size="12" fill="#333" filter="url(#rough2)">7 → 3 → 2 → 1</text>

  <rect x="295" y="224" width="66" height="26" rx="5" fill="#f0e6f6" stroke="#8a4fa8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="328" y="242" text-anchor="middle" font-size="11.5" fill="#8a4fa8" font-weight="bold" filter="url(#rough2)">depth 4</text>
  <text x="375" y="242" font-size="12" fill="#333" filter="url(#rough2)">127 → 7 → 3 → 2 → 1（最小例子）</text>

  <rect x="295" y="268" width="316" height="50" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="453" y="288" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">k = 5 的询问永远数不到任何数（depth ≤ 4），</text>
  <text x="453" y="306" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">恒答 0 —— 出题人留的冗余上界</text>

  <text x="451" y="348" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">上界为什么逐层收紧：</text>
  <text x="451" y="366" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">50 个 1 以内的数再数 1 至多 5 个（如 31）</text>

  <!-- 底部结论 -->
  <rect x="30" y="396" width="580" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="420" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">10^15 的值域坍缩成 5 个类别 ⇒ 单点改色 + 区间数颜色</text>
  <text x="320" y="442" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每个下标属于且仅属于一个类 —— 6 棵 0/1 树状数组正好接管（第 6 棵兜住 k=5）</text>
</svg>
