<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="300" fill="#fafafa"/>
  <text x="330" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">核心观察：长于 n/4 的连续块必跨过某个四分点（n = 12）</text>

  <!-- 12 个格子 -->
  <g>
    <rect x="60" y="90" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="100" y="90" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="140" y="90" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="180" y="90" width="40" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="220" y="90" width="40" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="260" y="90" width="40" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="300" y="90" width="40" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="340" y="90" width="40" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="380" y="90" width="40" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="420" y="90" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="460" y="90" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <rect x="500" y="90" width="40" height="40" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  </g>
  <text x="330" y="150" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">目标元素 x 的出现块：长度 m = 6 &gt; 12/4 = 3</text>

  <!-- 下标标签 -->
  <g font-size="11" fill="#666">
    <text x="80" y="170" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="120" y="170" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="160" y="170" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="200" y="170" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="240" y="170" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="280" y="170" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="320" y="170" text-anchor="middle" filter="url(#rough2)">6</text>
    <text x="360" y="170" text-anchor="middle" filter="url(#rough2)">7</text>
    <text x="400" y="170" text-anchor="middle" filter="url(#rough2)">8</text>
    <text x="440" y="170" text-anchor="middle" filter="url(#rough2)">9</text>
    <text x="480" y="170" text-anchor="middle" filter="url(#rough2)">10</text>
    <text x="520" y="170" text-anchor="middle" filter="url(#rough2)">11</text>
  </g>

  <!-- 三个四分点切线 -->
  <line x1="180" y1="72" x2="180" y2="182" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="180" y="64" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">q1 = ⌊n/4⌋ = 2</text>
  <line x1="300" y1="72" x2="300" y2="182" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="300" y="64" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">q2 = ⌊n/2⌋ = 5（被块跨过 ✓）</text>
  <line x1="420" y1="72" x2="420" y2="182" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="420" y="200" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">q3 = ⌊3n/4⌋ = 8</text>

  <!-- 间隙标注 -->
  <text x="80" y="196" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">间隙 ≤ 3 格</text>
  <text x="240" y="196" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">间隙 ≤ 3 格</text>
  <text x="360" y="196" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">≤ 3 格</text>
  <text x="480" y="196" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">间隙 ≤ 3 格</text>

  <text x="60" y="240" font-size="13" fill="#666" filter="url(#rough2)">三个四分点把下标轴切成 4 段间隙，每段都 ≤ ⌊n/4⌋ 格；</text>
  <text x="60" y="262" font-size="13" fill="#666" filter="url(#rough2)">而出现块长度 m ≥ ⌊n/4⌋ + 1，比任何间隙都长，必然跨过某个切点，</text>
  <text x="60" y="284" font-size="13" fill="#4a7a3a" filter="url(#rough2)">所以 x ∈ {arr[q1], arr[q2], arr[q3]}——只需检查 3 个候选。</text>
</svg>
