<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="700" height="470" fill="#fdfcf7"/>
  <text x="350" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：最优解可规约为「三段式」规范形态</text>
  <path d="M 180 40 Q 350 50 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="350" y="60" text-anchor="middle" font-size="12" fill="#888">左端弹连续前缀 ＋ 中段直删 '1' ＋ 右端弹连续后缀 —— 任何方案都不比它更省（见 §5 引理 1–3）</text>

  <!-- original string -->
  <text x="160" y="120" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">原串 s：</text>
  <g filter="url(#sk)">
    <rect x="198" y="96" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="242" y="96" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="286" y="96" width="40" height="36" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="330" y="96" width="40" height="36" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="374" y="96" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="418" y="96" width="40" height="36" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="462" y="96" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="218" y="119">1</text>
    <text x="262" y="119">1</text>
    <text x="306" y="119">0</text>
    <text x="350" y="119">0</text>
    <text x="394" y="119">1</text>
    <text x="438" y="119">0</text>
    <text x="482" y="119">1</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="218" y="148">0</text>
    <text x="262" y="148">1</text>
    <text x="306" y="148">2</text>
    <text x="350" y="148">3</text>
    <text x="394" y="148">4</text>
    <text x="438" y="148">5</text>
    <text x="482" y="148">6</text>
  </g>

  <!-- arrows down to panels -->
  <path d="M 240 162 Q 165 192 127 218" stroke="#4a8e4a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 372 162 Q 372 195 350 218" stroke="#c98a2b" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 482 162 Q 545 192 573 218" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- panel 1: left pops -->
  <g filter="url(#sk)">
    <rect x="22" y="225" width="210" height="155" rx="10" fill="#f4f9f4" stroke="#4a8e4a" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="127" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">① 左端弹出 ℓ 辆</text>
  <text x="127" y="264" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">从左往右逐辆弹，每辆 1</text>
  <g filter="url(#sk)">
    <rect x="85" y="276" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="129" y="276" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="105" y="298">1</text>
    <text x="149" y="298">1</text>
  </g>
  <path d="M 75 293 L 40 293" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="127" y="332" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">沿途的 '0' 也照付 1 / 辆</text>
  <text x="127" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">示例 ℓ = 2：弹出 s[0..1]，代价 2</text>
  <text x="127" y="370" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">（要够到后面的 '1' 就必须连带弹掉）</text>

  <!-- panel 2: middle direct removals -->
  <g filter="url(#sk)">
    <rect x="246" y="225" width="208" height="155" rx="10" fill="#fffaf0" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="350" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415" filter="url(#sk)">② 中段 [ℓ, r)</text>
  <text x="350" y="264" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">'1' 直删，'0' 原地留守</text>
  <g filter="url(#sk)">
    <rect x="264" y="276" width="40" height="34" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="308" y="276" width="40" height="34" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <rect x="352" y="276" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="396" y="276" width="40" height="34" fill="#fff" stroke="#8a8a8a" stroke-width="1.3" rx="4"/>
    <path d="M 354 278 L 390 308" stroke="#b85450" stroke-width="1.4" fill="none"/>
    <path d="M 390 278 L 354 308" stroke="#b85450" stroke-width="1.4" fill="none"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="284" y="298">0</text>
    <text x="328" y="298">0</text>
    <text x="372" y="298">1</text>
    <text x="416" y="298">0</text>
  </g>
  <g font-size="10.5" text-anchor="middle">
    <text x="284" y="324" fill="#999">+0</text>
    <text x="328" y="324" fill="#999">+0</text>
    <text x="372" y="324" fill="#b85450" font-weight="bold">+2</text>
    <text x="416" y="324" fill="#999">+0</text>
  </g>
  <text x="350" y="348" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">直删只花在 '1' 上，共 ones(s[ℓ..r−1]) 个</text>
  <text x="350" y="368" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">示例：直删 s[4]，代价 2</text>

  <!-- panel 3: right pops -->
  <g filter="url(#sk)">
    <rect x="468" y="225" width="210" height="155" rx="10" fill="#f2f6fb" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="573" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#33475e" filter="url(#sk)">③ 右端弹出 n−r 辆</text>
  <text x="573" y="264" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">从右往左逐辆弹，每辆 1</text>
  <g filter="url(#sk)">
    <rect x="553" y="276" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
  </g>
  <text x="573" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  <path d="M 599 293 L 634 293" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="573" y="332" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">'0' 同样照付 1 / 辆</text>
  <text x="573" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475e" filter="url(#sk)">示例 r = 6：弹出 s[6]，代价 1</text>
  <text x="573" y="370" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">（与左端互不越界：ℓ ≤ r）</text>

  <!-- bottom banner -->
  <g filter="url(#sk)">
    <rect x="40" y="398" width="620" height="58" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="350" y="421" text-anchor="middle" font-size="12.5" fill="#7a5415" filter="url(#sk)">总代价 cost(ℓ, r) = ℓ + (n−r) + 2 × ones(s[ℓ..r−1])，本例 = 2 + 1 + 2×1 = 5</text>
  <text x="350" y="444" text-anchor="middle" font-size="11" fill="#999" filter="url(#sk)">任何操作序列都能规约成这三段，于是只需在 0 ≤ ℓ ≤ r ≤ n 内最小化上式</text>
</svg>
