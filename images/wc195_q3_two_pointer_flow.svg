<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 442" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="442" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：排序 + 预处理 2 的幂 + 双指针</text>
  <text x="320" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">j 随 i 单调不增 → 每轮 i++ 或 j−− → 指针总移动次数 ≤ 2n，均摊 O(n)</text>

  <g filter="url(#rough2)">
    <rect x="190" y="54" width="260" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="320" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a5a3a">排序 nums；预处理 pow2[0..n−1]（mod 10⁹+7）</text>

    <line x1="320" y1="88" x2="320" y2="104" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="210" y="106" width="220" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="320" y="126" text-anchor="middle" font-size="12" fill="#2b4a66">i = 0，j = n − 1，ans = 0</text>

    <line x1="320" y1="136" x2="320" y2="152" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arr)"/>

    <polygon points="320,154 424,190 320,226 216,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="320" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">i ≤ j ?</text>
    <text x="320" y="202" text-anchor="middle" font-size="10" fill="#8a6a20">(还有未分类的最小值吗)</text>

    <line x1="424" y1="190" x2="512" y2="190" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="466" y="182" text-anchor="middle" font-size="10.5" fill="#888">否</text>
    <rect x="514" y="172" width="108" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="568" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a3a">返回 ans</text>
    <text x="568" y="202" text-anchor="middle" font-size="9" fill="#4a7a3a">已对 10⁹+7 取模</text>

    <line x1="320" y1="226" x2="320" y2="244" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="332" y="238" font-size="10.5" fill="#888">是</text>

    <polygon points="320,246 452,288 320,330 188,288" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="320" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">nums[i] + nums[j]</text>
    <text x="320" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#b07818">≤ target ?</text>
    <text x="320" y="314" text-anchor="middle" font-size="10" fill="#8a6a20">(i 可作最小值, j 作上界?)</text>

    <line x1="188" y1="288" x2="120" y2="288" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="158" y="280" text-anchor="middle" font-size="10.5" fill="#4a7a3a">是</text>
    <rect x="16" y="262" width="104" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="68" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a3a">ans += pow2[j−i]</text>
    <text x="68" y="298" text-anchor="middle" font-size="11" fill="#3a5a3a">i++</text>

    <line x1="452" y1="288" x2="520" y2="288" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="486" y="280" text-anchor="middle" font-size="10.5" fill="#b85450">否 (j 太大)</text>
    <rect x="522" y="262" width="100" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="572" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36">j−−</text>
    <text x="572" y="298" text-anchor="middle" font-size="10" fill="#8a3a36">(右端缩一步)</text>

    <path d="M68,314 C 68,352 200,380 300,398" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <path d="M572,314 C 572,356 460,388 346,400" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <text x="410" y="392" text-anchor="middle" font-size="10.5" fill="#888">回到「i ≤ j ?」继续循环</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="16" y="406" width="608" height="26" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="320" y="423" text-anchor="middle" font-size="11" fill="#3a4a66">正确性不变式：每次 j−− 前都有 nums[i]+nums[j] &gt; target，且 nums[i] 只增不减 → j 永不会越过真正的 j(i)</text>
  </g>
</svg>
