<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">二进制手表 = 一个 10 位二进制数</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">高 4 位是小时（0-11），低 6 位是分钟（0-59）；亮灯数 = popcount(h) + popcount(m)</text>

  <g filter="url(#rough2)" font-size="12" fill="#3a4a66">
    <text x="26" y="100" font-size="13" font-weight="bold">小时</text>
    <text x="26" y="121" font-size="11" fill="#777">4 位</text>
    <text x="26" y="206" font-size="13" font-weight="bold">分钟</text>
    <text x="26" y="227" font-size="11" fill="#777">6 位</text>
  </g>

  <!-- 小时 4 位：8 4 2 1，示例 4 = 0100 -->
  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="150" y="84" width="48" height="40" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.4"/>
    <text x="174" y="110" font-size="14" fill="#888">0</text>
    <rect x="204" y="84" width="48" height="40" rx="5" fill="#fff3cd" stroke="#d6a040" stroke-width="2"/>
    <text x="228" y="110" font-size="14" fill="#8a6a20" font-weight="bold">1</text>
    <rect x="258" y="84" width="48" height="40" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.4"/>
    <text x="282" y="110" font-size="14" fill="#888">0</text>
    <rect x="312" y="84" width="48" height="40" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.4"/>
    <text x="336" y="110" font-size="14" fill="#888">0</text>
    <text x="174" y="142" font-size="10.5" fill="#777">8</text>
    <text x="228" y="142" font-size="10.5" fill="#777">4</text>
    <text x="282" y="142" font-size="10.5" fill="#777">2</text>
    <text x="336" y="142" font-size="10.5" fill="#777">1</text>
    <text x="150" y="164" text-anchor="start" font-size="11" fill="#4a7a3a">0b0100 = 4（亮 1 盏）</text>
  </g>

  <!-- 分钟 6 位：32 16 8 4 2 1，示例 51 = 110011 -->
  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="150" y="188" width="48" height="40" rx="5" fill="#fff3cd" stroke="#d6a040" stroke-width="2"/>
    <text x="174" y="214" font-size="14" fill="#8a6a20" font-weight="bold">1</text>
    <rect x="204" y="188" width="48" height="40" rx="5" fill="#fff3cd" stroke="#d6a040" stroke-width="2"/>
    <text x="228" y="214" font-size="14" fill="#8a6a20" font-weight="bold">1</text>
    <rect x="258" y="188" width="48" height="40" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.4"/>
    <text x="282" y="214" font-size="14" fill="#888">0</text>
    <rect x="312" y="188" width="48" height="40" rx="5" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.4"/>
    <text x="336" y="214" font-size="14" fill="#888">0</text>
    <rect x="366" y="188" width="48" height="40" rx="5" fill="#fff3cd" stroke="#d6a040" stroke-width="2"/>
    <text x="390" y="214" font-size="14" fill="#8a6a20" font-weight="bold">1</text>
    <rect x="420" y="188" width="48" height="40" rx="5" fill="#fff3cd" stroke="#d6a040" stroke-width="2"/>
    <text x="444" y="214" font-size="14" fill="#8a6a20" font-weight="bold">1</text>
    <text x="174" y="246" font-size="10.5" fill="#777">32</text>
    <text x="228" y="246" font-size="10.5" fill="#777">16</text>
    <text x="282" y="246" font-size="10.5" fill="#777">8</text>
    <text x="336" y="246" font-size="10.5" fill="#777">4</text>
    <text x="390" y="246" font-size="10.5" fill="#777">2</text>
    <text x="444" y="246" font-size="10.5" fill="#777">1</text>
    <text x="150" y="268" text-anchor="start" font-size="11" fill="#4a7a3a">0b110011 = 51（亮 4 盏）</text>
  </g>

  <rect x="60" y="286" width="500" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="312" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">popcount(4) + popcount(51) = 1 + 4 = 5 盏  →  4:51</text>

  <text x="310" y="356" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">小时字段最多 3 盏（11 = 1011），分钟字段最多 5 盏（59 = 111011）</text>
  <text x="310" y="376" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">所以亮灯数永远不超过 8：turnedOn ≥ 9 时答案必为空</text>
</svg>
