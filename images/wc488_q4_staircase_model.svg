<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：k 对下标 = 一条两端同时严格递增的「非交叉桥」</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- left panel: non-crossing bridges -->
  <rect x="36" y="48" width="276" height="258" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="174" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 非交叉桥视角（示例 2）</text>

  <text x="58" y="122" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">nums1</text>
  <path d="M 66 118 L 296 118" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="90" cy="118" r="4.5" fill="#b85450" stroke="#8a3a36" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="150" cy="118" r="4.5" fill="#446688" stroke="#334d68" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="210" cy="118" r="4.5" fill="#b85450" stroke="#8a3a36" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−2</text>
  <text x="150" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="210" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="90" y="134" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="150" y="134" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="210" y="134" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>

  <path d="M 90 118 Q 76 185 78 252" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 210 118 Q 162 185 124 252" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <text x="58" y="256" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">nums2</text>
  <path d="M 66 252 L 296 252" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="78" cy="252" r="4.5" fill="#b85450" stroke="#8a3a36" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="124" cy="252" r="4.5" fill="#b85450" stroke="#8a3a36" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="170" cy="252" r="4.5" fill="#446688" stroke="#334d68" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="216" cy="252" r="4.5" fill="#446688" stroke="#334d68" stroke-width="1" filter="url(#rough2)"/>
  <text x="78" y="240" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="124" y="240" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="170" y="240" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="216" y="240" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="78" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−3</text>
  <text x="124" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="170" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <text x="216" y="272" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <text x="98" y="168" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(0,0) 得 6</text>
  <text x="220" y="182" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(2,1) 得 20</text>
  <text x="174" y="296" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">上端点递增 ⇒ 下端点必递增 ⇒ 桥两两不交叉</text>

  <!-- right panel: grid staircase -->
  <rect x="328" y="48" width="276" height="258" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="466" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">② 网格阶梯视角（行 = i，列 = j）</text>

  <text x="426" y="98" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="466" y="98" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="506" y="98" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="546" y="98" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="398" y="125" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="398" y="159" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="398" y="193" text-anchor="end" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>

  <rect x="406" y="104" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="426" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">6</text>
  <rect x="446" y="104" width="40" height="34" fill="#fafafa" stroke="#88a890" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="486" y="104" width="40" height="34" fill="#fafafa" stroke="#88a890" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="526" y="104" width="40" height="34" fill="#fafafa" stroke="#88a890" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="406" y="138" width="40" height="34" fill="#fafafa" stroke="#88a890" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="446" y="138" width="40" height="34" fill="#fafafa" stroke="#88a890" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="486" y="138" width="40" height="34" fill="#fafafa" stroke="#88a890" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="526" y="138" width="40" height="34" fill="#fafafa" stroke="#88a890" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="406" y="172" width="40" height="34" fill="#fafafa" stroke="#88a890" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="446" y="172" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="466" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">20</text>
  <rect x="486" y="172" width="40" height="34" fill="#fafafa" stroke="#88a890" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <rect x="526" y="172" width="40" height="34" fill="#fafafa" stroke="#88a890" stroke-width="1.1" rx="4" filter="url(#rough2)"/>

  <path d="M 426 121 Q 446 158 462 186" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="466" y="228" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">链上每一步：行 i、列 j 同时严格增大</text>
  <text x="466" y="247" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">格子 (i, j) 的得分 = nums1[i] × nums2[j]</text>
  <text x="466" y="266" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">示例 2 的链：(0,0) → (2,1)，共 6 + 20</text>

  <!-- conclusion -->
  <rect x="36" y="318" width="568" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="342" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">恰好选 k 对 ⟺ 在 n×m 网格里挑 k 个格子，串成双向严格递增的「阶梯链」</text>
  <text x="320" y="364" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">总得分 = 链上 Σ nums1[i]·nums2[j]；要处理「恰好 k」与负值 → 把对数写进状态</text>
  <text x="320" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">f[i][j][p] = 只用前 i 行、前 j 列、恰好 p 对的最大得分</text>
</svg>
