<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="680" height="420" fill="#fafafa"/>
  <text x="24" y="32" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">排序后按元素计贡献：它当最大值 / 当最小值的次数</text>
  <rect x="120" y="70" width="54" height="54" fill="#f1f3f4" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147.0" y="102.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="182" y="70" width="54" height="54" fill="#f1f3f4" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209.0" y="102.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="244" y="70" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="271.0" y="102.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="306" y="70" width="54" height="54" fill="#f1f3f4" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="333.0" y="102.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="368" y="70" width="54" height="54" fill="#f1f3f4" stroke="#8a8a8a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395.0" y="102.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="271" y="148" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">a[i] = 3</text>
  <path d="M271 156 L271 190" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="60" y="192" width="250" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="185.0" y="228.2" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">当最大值：左侧 i 个元素任选</text>
  <text x="185.0" y="248.2" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">次数 = 2^i = 4</text>
  <path d="M420 156 L420 190" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="370" y="192" width="250" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="495.0" y="228.2" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">当最小值：右侧 n−1−i 个任选</text>
  <text x="495.0" y="248.2" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">次数 = 2^(n−1−i) = 4</text>
  <rect x="60" y="306" width="560" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="340.0" y="330.2" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">贡献 = a[i] × (2^i − 2^(n−1−i))</text>
  <text x="340.0" y="350.2" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">i = 2、n = 5 时系数 = 4 − 4 = 0，正好抵消</text>
  <text x="340" y="396" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">排序不改变子序列集合的宽度之和：宽度只取决于最大值与最小值</text>
</svg>
