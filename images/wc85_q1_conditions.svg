<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">关键在严格不等号：共边共角不算重叠</text>

  <!-- 情形一：共边 -->
  <g filter="url(#rough2)">
    <text x="130" y="62" text-anchor="middle" font-size="14" fill="#333">共边（示例 2）</text>
    <rect x="60" y="90" width="70" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="130" y="90" width="70" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <path d="M130,84 L130,166" stroke="#b85450" stroke-width="3"/>
    <text x="130" y="186" text-anchor="middle" font-size="12" fill="#b85450">x = 1 处贴合</text>
    <text x="130" y="206" text-anchor="middle" font-size="12" fill="#8a3020">min(x2)=max(x1) → 面积 0</text>
    <text x="130" y="226" text-anchor="middle" font-size="13" fill="#b85450">返回 false</text>
  </g>

  <!-- 情形二：交叉 -->
  <g filter="url(#rough2)">
    <text x="380" y="62" text-anchor="middle" font-size="14" fill="#333">交叉（示例 1）</text>
    <rect x="300" y="90" width="80" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="350" y="120" width="80" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="350" y="120" width="30" height="50" fill="#fff8e1" stroke="#b85450" stroke-width="2.2"/>
    <text x="380" y="256" text-anchor="middle" font-size="12" fill="#2f5527">max(x1) &lt; min(x2) 且 max(y1) &lt; min(y2)</text>
    <text x="380" y="278" text-anchor="middle" font-size="13" fill="#4a7a3a">返回 true</text>
  </g>

  <!-- 公式框 -->
  <g filter="url(#rough2)">
    <rect x="60" y="244" width="200" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="160" y="268" text-anchor="middle" font-size="12" fill="#7a5a10">l = max(x1), r = min(x2)</text>
    <text x="160" y="288" text-anchor="middle" font-size="12" fill="#7a5a10">b = max(y1), t = min(y2)</text>
    <text x="160" y="308" text-anchor="middle" font-size="12" fill="#8a3020">overlap ⇔ l &lt; r 且 b &lt; t</text>
  </g>
</svg>
