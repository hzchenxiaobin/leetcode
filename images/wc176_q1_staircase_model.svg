<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">行列都非增 ⇒ 负数区是右下角的一块阶梯</text>
  <text x="340" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">行内越往右越小，列内越往下越小，所以「非负 → 负」的分界线只能是一条向右下走的阶梯</text>

  <!-- 4x4 矩阵：列 3 行 0..1 起负，列 2 行 2 起负，列 0..3 行 3 全负 -->
  <g filter="url(#rough2)">
    <rect x="90" y="84" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="121" y="112" text-anchor="middle" font-size="15" fill="#2f4a6a">4</text>
    <rect x="152" y="84" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="183" y="112" text-anchor="middle" font-size="15" fill="#2f4a6a">3</text>
    <rect x="214" y="84" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="245" y="112" text-anchor="middle" font-size="15" fill="#2f4a6a">2</text>
    <rect x="276" y="84" width="62" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="307" y="112" text-anchor="middle" font-size="15" fill="#b85450">−1</text>

    <rect x="90" y="130" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="121" y="158" text-anchor="middle" font-size="15" fill="#2f4a6a">3</text>
    <rect x="152" y="130" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="183" y="158" text-anchor="middle" font-size="15" fill="#2f4a6a">2</text>
    <rect x="214" y="130" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="245" y="158" text-anchor="middle" font-size="15" fill="#2f4a6a">1</text>
    <rect x="276" y="130" width="62" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="307" y="158" text-anchor="middle" font-size="15" fill="#b85450">−1</text>

    <rect x="90" y="176" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="121" y="204" text-anchor="middle" font-size="15" fill="#2f4a6a">1</text>
    <rect x="152" y="176" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="183" y="204" text-anchor="middle" font-size="15" fill="#2f4a6a">1</text>
    <rect x="214" y="176" width="62" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="245" y="204" text-anchor="middle" font-size="15" fill="#b85450">−1</text>
    <rect x="276" y="176" width="62" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="307" y="204" text-anchor="middle" font-size="15" fill="#b85450">−2</text>

    <rect x="90" y="222" width="62" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="121" y="250" text-anchor="middle" font-size="15" fill="#b85450">−1</text>
    <rect x="152" y="222" width="62" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="183" y="250" text-anchor="middle" font-size="15" fill="#b85450">−1</text>
    <rect x="214" y="222" width="62" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="245" y="250" text-anchor="middle" font-size="15" fill="#b85450">−2</text>
    <rect x="276" y="222" width="62" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="307" y="250" text-anchor="middle" font-size="15" fill="#b85450">−3</text>
  </g>

  <!-- 左侧每行首个负数的列号 p_i -->
  <text x="84" y="112" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">p0 = 3</text>
  <text x="84" y="158" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">p1 = 3</text>
  <text x="84" y="204" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">p2 = 2</text>
  <text x="84" y="250" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">p3 = 0</text>

  <!-- 阶梯边界：红色虚线 -->
  <path d="M 276 84 L 276 176 L 214 176 L 214 222 L 90 222 L 90 268" stroke="#b85450" stroke-width="2.4"
        fill="none" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <!-- 起点标记与指针方向 -->
  <circle cx="121" cy="245" r="5" fill="#b85450" filter="url(#rough2)"/>
  <path d="M 121 258 L 121 276" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="121" y="292" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">起点 (m−1, 0)</text>
  <path d="M 160 300 L 206 300" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="304" font-size="10" fill="#446688" filter="url(#rough2)">j++：整列上方非负，跳过</text>
  <path d="M 160 330 L 206 330" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="334" font-size="10" fill="#4a7a3a" filter="url(#rough2)">i−−：本行右侧全为负，整段结算</text>

  <!-- 右侧说明 -->
  <g filter="url(#rough2)">
    <rect x="360" y="84" width="296" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <text x="376" y="108" font-size="11.5" fill="#2f4a6a" font-weight="bold">每行首个负数的列号 p_i</text>
    <text x="376" y="132" font-size="11" fill="#2f4a6a">行 0 → p0 = 3     行 1 → p1 = 3</text>
    <text x="376" y="154" font-size="11" fill="#2f4a6a">行 2 → p2 = 2     行 3 → p3 = 0</text>
    <text x="376" y="180" font-size="10.5" fill="#666">列也非增 ⇒ p0 ≥ p1 ≥ … ≥ p(m−1)</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="360" y="212" width="296" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="376" y="236" font-size="11.5" fill="#31592a" font-weight="bold">指针只朝两个方向单向走</text>
    <text x="376" y="260" font-size="10.5" fill="#31592a">grid[i][j] &lt; 0 → 本行后缀全负，i−−</text>
    <text x="376" y="282" font-size="10.5" fill="#31592a">grid[i][j] ≥ 0 → 本列上方非负，j++</text>
    <text x="376" y="302" font-size="10" fill="#4a7a3a">两个方向都不回退 ⇒ 总步数 ≤ m + n</text>
  </g>

  <text x="214" y="364" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">ans 就是各行负数个数之和：ans = (n−p0) + (n−p1) + …</text>
  <text x="508" y="364" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m = 4, n = 4，本例 ans = 1+1+2+4 = 8</text>
</svg>
