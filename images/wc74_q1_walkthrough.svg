<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" font-size="14" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：五个局面的判定走查</text>
  <text x="320" y="48" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">· 表示空格；结论为 false 的行（红框）都卡在某条不变量上</text>
  <rect x="30" y="66" width="580" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="136.0" y="87" font-size="10.5" fill="#2f3f5c" text-anchor="middle" font-weight="bold" filter="url(#rough2)">局面（3 行）</text>
  <text x="271.0" y="87" font-size="10.5" fill="#2f3f5c" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cX / cO</text>
  <text x="348.0" y="87" font-size="10.5" fill="#2f3f5c" text-anchor="middle" font-weight="bold" filter="url(#rough2)">计数合法</text>
  <text x="449.0" y="87" font-size="10.5" fill="#2f3f5c" text-anchor="middle" font-weight="bold" filter="url(#rough2)">成线情况</text>
  <text x="556.0" y="87" font-size="10.5" fill="#2f3f5c" text-anchor="middle" font-weight="bold" filter="url(#rough2)">结论</text>
  <rect x="30" y="98" width="580" height="44" fill="#fce4ec" stroke="#c7ced9" stroke-width="1.0" rx="4" filter="url(#rough2)"/>
  <rect x="30" y="98" width="580" height="44" fill="none" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="125" font-size="10.5" fill="#2f3f5c" text-anchor="middle" filter="url(#rough2)">O··  ···  ···</text>
  <text x="271" y="125" font-size="11" fill="#2f3f5c" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0 / 1</text>
  <text x="348" y="125" font-size="10" fill="#4a5a72" text-anchor="middle" filter="url(#rough2)">否（O 先手）</text>
  <text x="449" y="125" font-size="10" fill="#4a5a72" text-anchor="middle" filter="url(#rough2)">无</text>
  <text x="556" y="125" font-size="11" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">false</text>
  <rect x="30" y="142" width="580" height="44" fill="#f7f9fb" stroke="#c7ced9" stroke-width="1.0" rx="4" filter="url(#rough2)"/>
  <rect x="30" y="142" width="580" height="44" fill="none" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="169" font-size="10.5" fill="#2f3f5c" text-anchor="middle" filter="url(#rough2)">XOX  ·X·  ···</text>
  <text x="271" y="169" font-size="11" fill="#2f3f5c" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3 / 1</text>
  <text x="348" y="169" font-size="10" fill="#4a5a72" text-anchor="middle" filter="url(#rough2)">否（差 2）</text>
  <text x="449" y="169" font-size="10" fill="#4a5a72" text-anchor="middle" filter="url(#rough2)">无</text>
  <text x="556" y="169" font-size="11" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">false</text>
  <rect x="30" y="186" width="580" height="44" fill="#e6f4ea" stroke="#c7ced9" stroke-width="1.0" rx="4" filter="url(#rough2)"/>
  <rect x="30" y="186" width="580" height="44" fill="none" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="213" font-size="10.5" fill="#2f3f5c" text-anchor="middle" filter="url(#rough2)">XOX  O·O  XOX</text>
  <text x="271" y="213" font-size="11" fill="#2f3f5c" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4 / 4</text>
  <text x="348" y="213" font-size="10" fill="#4a5a72" text-anchor="middle" filter="url(#rough2)">是</text>
  <text x="449" y="213" font-size="10" fill="#4a5a72" text-anchor="middle" filter="url(#rough2)">无</text>
  <text x="556" y="213" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">true</text>
  <rect x="30" y="230" width="580" height="44" fill="#f7f9fb" stroke="#c7ced9" stroke-width="1.0" rx="4" filter="url(#rough2)"/>
  <rect x="30" y="230" width="580" height="44" fill="none" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="257" font-size="10.5" fill="#2f3f5c" text-anchor="middle" filter="url(#rough2)">XXX  OOO  ···</text>
  <text x="271" y="257" font-size="11" fill="#2f3f5c" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3 / 3</text>
  <text x="348" y="257" font-size="10" fill="#4a5a72" text-anchor="middle" filter="url(#rough2)">是</text>
  <text x="449" y="257" font-size="10" fill="#4a5a72" text-anchor="middle" filter="url(#rough2)">X、O 双线</text>
  <text x="556" y="257" font-size="11" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">false</text>
  <rect x="30" y="274" width="580" height="44" fill="#e6f4ea" stroke="#c7ced9" stroke-width="1.0" rx="4" filter="url(#rough2)"/>
  <rect x="30" y="274" width="580" height="44" fill="none" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="301" font-size="10.5" fill="#2f3f5c" text-anchor="middle" filter="url(#rough2)">XXX  XOO  XOO</text>
  <text x="271" y="301" font-size="11" fill="#2f3f5c" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5 / 4</text>
  <text x="348" y="301" font-size="10" fill="#4a5a72" text-anchor="middle" filter="url(#rough2)">是</text>
  <text x="449" y="301" font-size="10" fill="#4a5a72" text-anchor="middle" filter="url(#rough2)">仅 X（2 条）</text>
  <text x="556" y="301" font-size="11" fill="#4a7a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">true</text>
  <path d="M 236 66 L 236 318 M 306 66 L 306 318 M 390 66 L 390 318 M 508 66 L 508 318" stroke="#bbb" stroke-width="1.0" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough2)"/>
  <rect x="30" y="336" width="580" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="358" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">① 第 1 行：O 抢在 X 前面落子，计数方向反了 → false</text>
  <text x="48" y="376" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">② 第 4 行：两人同时成线，最后一手不可能同时满足双方 → false</text>
  <text x="48" y="394" font-size="10" fill="#b85450" text-anchor="start" filter="url(#rough2)">③ 第 5 行：X 占两条线是合法的（共享的角点留到最后一手即可）→ true</text>
  <text x="320" y="424" font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">三步走：数子 → 查 8 条线 → 核对终局归属</text>
</svg>
