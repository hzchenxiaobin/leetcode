<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：先手策略 ⇔ 一个转下列 c，剩余格子切成两块互斥区域</text>
  <path d="M 150 40 Q 340 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 后手选项 B：蓝虚线（沿上行吃右上块） -->
  <path d="M 91 92 Q 215 52 339 92" stroke="#446688" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="215" y="58" text-anchor="middle" font-size="11" fill="#446688">后手 B：留在上行，吃右上块</text>

  <!-- 列下标（c=2 标红） -->
  <text x="91" y="102" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="153" y="102" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="215" y="102" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450">2=c</text>
  <text x="277" y="102" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="339" y="102" text-anchor="middle" font-size="9.5" fill="#888">4</text>

  <!-- 网格：2 x 5，row0=[2,5,4,7,3]，row1=[1,5,1,6,2]，先手 c=2 -->
  <!-- 先手清零格（红） row0[0..2] -->
  <g filter="url(#sk)">
    <rect x="60" y="104" width="62" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="91" y="120" text-anchor="middle" font-size="10.5" fill="#b08080">2→0</text>
  <g filter="url(#sk)">
    <rect x="122" y="104" width="62" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="153" y="120" text-anchor="middle" font-size="10.5" fill="#b08080">5→0</text>
  <g filter="url(#sk)">
    <rect x="184" y="104" width="62" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="215" y="120" text-anchor="middle" font-size="10.5" fill="#b08080">4→0</text>

  <!-- 右上块（蓝） row0[3..4] -->
  <g filter="url(#sk)">
    <rect x="246" y="104" width="62" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
  </g>
  <text x="277" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">7</text>
  <g filter="url(#sk)">
    <rect x="308" y="104" width="62" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
  </g>
  <text x="339" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">3</text>

  <!-- 左下块（绿） row1[0..1] -->
  <g filter="url(#sk)">
    <rect x="60" y="154" width="62" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="91" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d25">1</text>
  <g filter="url(#sk)">
    <rect x="122" y="154" width="62" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="153" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d25">5</text>

  <!-- 先手清零格（红） row1[2..4] -->
  <g filter="url(#sk)">
    <rect x="184" y="154" width="62" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="215" y="170" text-anchor="middle" font-size="10.5" fill="#b08080">1→0</text>
  <g filter="url(#sk)">
    <rect x="246" y="154" width="62" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="277" y="170" text-anchor="middle" font-size="10.5" fill="#b08080">6→0</text>
  <g filter="url(#sk)">
    <rect x="308" y="154" width="62" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="339" y="170" text-anchor="middle" font-size="10.5" fill="#b08080">2→0</text>

  <!-- 先手红路径：右行 → c=2 转下 → 右行 -->
  <circle cx="91" cy="127" r="3.5" fill="#b85450"/>
  <path d="M 91 127 L 203 127 Q 215 127 215 139 L 215 165 Q 215 177 227 177 L 339 177" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="215" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">转下列 c = 2</text>

  <!-- 两块的和标注 -->
  <path d="M 372 127 L 390 127" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="394" y="124" font-size="12" font-weight="bold" fill="#446688">S(c)</text>
  <text x="394" y="141" font-size="10.5" fill="#446688">= 7+3 = 10</text>
  <path d="M 58 177 L 40 177" stroke="#4a7a3a" stroke-width="1.5" filter="url(#sk)"/>
  <text x="36" y="173" text-anchor="end" font-size="12" font-weight="bold" fill="#2f5d25">P(c)</text>
  <text x="36" y="190" text-anchor="end" font-size="10.5" fill="#2f5d25">= 1+5 = 6</text>

  <!-- 后手选项 A：绿虚线（开局转下沿下行吃左下块） -->
  <path d="M 91 206 Q 215 262 339 206" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="215" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a">后手 A：开局即转下，沿下行吃左下块</text>

  <!-- min-max 公式框 -->
  <g filter="url(#sk)">
    <rect x="430" y="88" width="230" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="545" y="112" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">给定 c，后手二选一</text>
  <text x="545" y="136" text-anchor="middle" font-size="12" fill="#5c4512">score(c) = max( P(c), S(c) )</text>
  <text x="545" y="158" text-anchor="middle" font-size="12" fill="#5c4512">先手：ans = min score(c)</text>
  <text x="545" y="178" text-anchor="middle" font-size="10.5" fill="#a08040">两块互斥，无法兼得</text>

  <text x="340" y="282" text-anchor="middle" font-size="10.5" fill="#666">红实线 = 先手路径（途经格清零）；蓝/绿虚线 = 后手仅有的两种整块取法</text>

  <!-- 互斥根源说明框 -->
  <g filter="url(#sk)">
    <rect x="60" y="300" width="596" height="68" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="358" y="324" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25">互斥的根源：后手同样只有一次向下转弯</text>
  <text x="358" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a">转下列 ≤ c → 全程在下行，只能吃左下块；转下列 &gt; c → 全程在上行，只能吃右上块</text>
  <text x="358" y="362" text-anchor="middle" font-size="10.5" fill="#6b8f60">开局即转下吃满 P(c)；走到最后一列才转下吃满 S(c)</text>

  <text x="340" y="398" text-anchor="middle" font-size="10.5" fill="#888">把「后手的最优回应」从枚举 n 条路径压缩为两个候选 → 一次扫描 O(n)</text>
</svg>
