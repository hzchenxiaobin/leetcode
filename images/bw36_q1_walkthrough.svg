<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：ParkingSystem(1, 1, 0)</text>

  <!-- 初始状态 -->
  <text x="70" y="66" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">初始</text>
  <g filter="url(#rough2)">
    <rect x="180" y="48" width="70" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
    <rect x="250" y="48" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="320" y="48" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="390" y="48" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="215" y="69" fill="#999">—</text>
    <text x="285" y="69">1</text>
    <text x="355" y="69">1</text>
    <text x="425" y="69">0</text>
  </g>
  <text x="500" y="69" font-size="11.5" fill="#888" text-anchor="middle" filter="url(#rough2)">slot</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="104" width="480" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#446688" text-anchor="middle" font-weight="bold">
    <text x="120" y="125">调用</text>
    <text x="280" y="125">判定（slot[carType]）</text>
    <text x="440" y="125">返回</text>
  </g>

  <!-- 行 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="40" y="138" width="480" height="32" fill="none" stroke="#999" stroke-width="1" rx="3"/>
    <text x="120" y="159">addCar(1)</text>
    <text x="280" y="159">slot[1]=1 &gt; 0 → 减为 0</text>
    <text x="440" y="159" fill="#4a7a3a" font-weight="bold">true ✓</text>

    <rect x="40" y="170" width="480" height="32" fill="none" stroke="#999" stroke-width="1" rx="3"/>
    <text x="120" y="191">addCar(2)</text>
    <text x="280" y="191">slot[2]=1 &gt; 0 → 减为 0</text>
    <text x="440" y="191" fill="#4a7a3a" font-weight="bold">true ✓</text>

    <rect x="40" y="202" width="480" height="32" fill="none" stroke="#999" stroke-width="1" rx="3"/>
    <text x="120" y="223">addCar(3)</text>
    <text x="280" y="223">slot[3]=0</text>
    <text x="440" y="223" fill="#b85450" font-weight="bold">false ×</text>

    <rect x="40" y="234" width="480" height="32" fill="none" stroke="#999" stroke-width="1" rx="3"/>
    <text x="120" y="255">addCar(1)</text>
    <text x="280" y="255">slot[1]=0（唯一大位已占）</text>
    <text x="440" y="255" fill="#b85450" font-weight="bold">false ×</text>
  </g>

  <!-- 终态 -->
  <text x="70" y="298" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">终态</text>
  <g filter="url(#rough2)">
    <rect x="180" y="280" width="70" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="4"/>
    <rect x="250" y="280" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="320" y="280" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="390" y="280" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="215" y="301" fill="#999">—</text>
    <text x="285" y="301">0</text>
    <text x="355" y="301">0</text>
    <text x="425" y="301">0</text>
  </g>
  <text x="500" y="301" font-size="11.5" fill="#888" text-anchor="middle" filter="url(#rough2)">全 0</text>
  <text x="280" y="330" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">输出序列 [null, true, true, false, false] ✓</text>
</svg>
