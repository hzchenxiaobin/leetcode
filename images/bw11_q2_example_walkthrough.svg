<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：duration = 8 的指针轨迹</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">slots1 = [10,50] [60,120] [140,210]　slots2 = [0,15] [60,70]</text>

  <g filter="url(#rough2)">
    <rect x="26" y="58" width="508" height="52" fill="#fff" stroke="#666" stroke-width="1.3" rx="8"/>
    <rect x="26" y="110" width="508" height="52" fill="#fff" stroke="#666" stroke-width="1.3" rx="8"/>
    <rect x="26" y="162" width="508" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5">
    <text x="40" y="78" fill="#3a4a66" font-weight="bold">步骤 (i,j)</text>
    <text x="150" y="78" fill="#333">时段对</text>
    <text x="280" y="78" fill="#333">交集 [lo, hi]</text>
    <text x="410" y="78" fill="#333">长度 vs 8</text>
    <text x="500" y="78" fill="#333">动作</text>

    <text x="40" y="98" fill="#3a4a66" font-weight="bold">(0,0)</text>
    <text x="150" y="98" fill="#333">[10,50]×[0,15]</text>
    <text x="280" y="98" fill="#333">[10,15]</text>
    <text x="410" y="98" fill="#b85450">5 &lt; 8</text>
    <text x="494" y="98" fill="#666">j++</text>

    <text x="40" y="130" fill="#3a4a66" font-weight="bold">(0,1)</text>
    <text x="150" y="130" fill="#333">[10,50]×[60,70]</text>
    <text x="280" y="130" fill="#333">空（60&gt;50）</text>
    <text x="410" y="130" fill="#b85450">0 &lt; 8</text>
    <text x="494" y="130" fill="#666">i++</text>

    <text x="40" y="182" fill="#3a5a30" font-weight="bold">(1,1)</text>
    <text x="150" y="182" fill="#333">[60,120]×[60,70]</text>
    <text x="280" y="182" fill="#3a5a30" font-weight="bold">[60,70]</text>
    <text x="410" y="182" fill="#3a5a30" font-weight="bold">10 ≥ 8 ✓</text>
    <text x="480" y="182" fill="#3a5a30" font-weight="bold">返回!</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="130" y="232" width="300" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
  </g>
  <text x="280" y="250" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">答案：[60, 60+8] = [60, 68]</text>
  <text x="280" y="268" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">从交集左端点起算恰为 duration 的一段</text>

  <rect x="46" y="292" width="468" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="10.5" fill="#8a6a20" font-weight="bold">duration = 12 时：第 3 步交集 [60,70] 长 10 &lt; 12，j 越界 → 返回 []</text>
  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#8a6a20">候选起点 max(s₁,s₂) 随指针推进单调不减 → 首个命中即最早</text>
</svg>
