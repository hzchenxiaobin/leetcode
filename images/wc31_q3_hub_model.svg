<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGS" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M 8 0 L 0 4 L 8 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：树是中转站，只有第一颗坚果特殊</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">松鼠每送完一颗就回到树下，所以「其余坚果」一律是 树→坚果→树 的往返</text>

  <rect x="30" y="62" width="240" height="208" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="44" y="84" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 第一颗：单程 + 送货，不往返</text>

  <ellipse cx="66" cy="228" rx="11" ry="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="232" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">S</text>
  <text x="66" y="252" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">松鼠</text>

  <ellipse cx="112" cy="146" rx="10" ry="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="149" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">N</text>
  <text x="112" y="128" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">第一颗坚果</text>

  <path d="M 76 218 L 102 162" stroke="#d6a040" stroke-width="1.9" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="58" y="186" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">d(S,N)</text>

  <polygon points="196,214 210,238 182,238" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="191" y="238" width="10" height="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="196" y="262" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">树 T</text>

  <path d="M 124 154 L 190 220" stroke="#4a7a3a" stroke-width="1.9" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="160" y="182" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">d(N,T)</text>


  <rect x="290" y="62" width="240" height="208" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="304" y="84" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 其余坚果：往返，每颗都付两次</text>

  <polygon points="410,206 424,230 396,230" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="405" y="230" width="10" height="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="437" y="228" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">树 T</text>

  <ellipse cx="356" cy="132" rx="10" ry="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="356" y="135" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">N</text>
  <ellipse cx="466" cy="132" rx="10" ry="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="466" y="135" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">N</text>

  <path d="M 404 206 L 364 143" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-start="url(#arrGS)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="186" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">2·d</text>

  <path d="M 418 206 L 458 143" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-start="url(#arrGS)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="452" y="186" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">2·d</text>

  <text x="304" y="254" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">顺序随便排，长度都是 2·d(N,T)</text>

  <rect x="40" y="288" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="314" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">answer = 2 · Σ d(N_i, T) + min_j ( d(S, N_j) − d(N_j, T) )</text>
  <text x="60" y="338" font-size="9.5" fill="#555" filter="url(#rough2)">前一项与顺序无关，是「每颗坚果都必须付」的固定成本；后一项只由「第一颗挑谁」决定。</text>
  <text x="60" y="358" font-size="9.5" fill="#555" filter="url(#rough2)">直觉：从全部往返里扣掉第一颗坚果的回程，再补上松鼠从当前位置跑过去的单程。</text>
</svg>
