<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 412" width="780" height="412"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="412" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">固定切点 a：左边的 1 用 AND 清零，右边的 0 用 OR 补 1</text>
  <path d="M 152 40 Q 390 47 628 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="390" y="62" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 s = 0 1 0 0 1 1 0 1，取 a = 4（j = 1，Z = 4），代价应为 2</text>

  <!-- 下标 -->
  <text x="229" y="86" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="275" y="86" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="321" y="86" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="367" y="86" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="413" y="86" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="459" y="86" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="505" y="86" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="551" y="86" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">8</text>

  <!-- 左侧四格（位置 1..4） -->
  <rect x="209" y="92" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="255" y="92" width="40" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="301" y="92" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="347" y="92" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="229" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="275" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">1</text>
  <text x="321" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="367" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>

  <!-- 右侧四格（位置 5..8） -->
  <rect x="399" y="92" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="445" y="92" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="491" y="92" width="40" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="537" y="92" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="419" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="465" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="511" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">0</text>
  <text x="557" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>

  <!-- 切点虚线 -->
  <path d="M 391 82 L 391 172" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>

  <!-- 区域括号与说明 -->
  <path d="M 209 140 L 209 148 L 387 148 L 387 140" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="298" y="166" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">前缀 a = 4：必须全 0</text>
  <path d="M 395 140 L 395 148 L 577 148 L 577 140" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="486" y="166" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">后缀：必须全 1</text>

  <!-- 左注解：AND -->
  <rect x="40" y="188" width="316" height="56" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="58" y="209" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">位置 2 的 1 → 一次 AND 变成 0</text>
  <text x="58" y="230" font-size="11" fill="#a14340" filter="url(#rough2)">前缀含 s₁ = 0 ⇒ 前缀 AND 恒为 0，随处可用</text>
  <path d="M 258 134 Q 198 150 150 186" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 右注解：OR -->
  <rect x="424" y="188" width="316" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="442" y="209" font-size="11.5" fill="#8a6015" filter="url(#rough2)">位置 7 的 0 → 一次 OR 变成 1</text>
  <text x="442" y="230" font-size="11" fill="#a06a12" filter="url(#rough2)">前缀里位置 2 的 1 还活着（OR 阶段先做）</text>
  <path d="M 508 134 Q 582 150 640 186" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 公式框 -->
  <rect x="60" y="258" width="660" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">f(a) =（前缀 a 中 1 的个数）+（后缀中 0 的个数）= Z + bal(a)</text>
  <text x="390" y="303" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">答案 = Z + min{ bal(a) : a ≥ j }，其中 bal 把 1 记 +1、0 记 −1 逐位累加</text>
  <text x="390" y="325" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">顺序：先把后缀的 0 全部 OR 成 1，再回头 AND 前缀的 1</text>

  <!-- 流程 -->
  <rect x="60" y="348" width="200" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="366" text-anchor="middle" font-size="11" fill="#33582a" filter="url(#rough2)">① 求 Z（0 的总数）</text>
  <text x="160" y="384" text-anchor="middle" font-size="11" fill="#33582a" filter="url(#rough2)">与 j（前导 0 个数）</text>

  <rect x="292" y="348" width="200" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="392" y="366" text-anchor="middle" font-size="11" fill="#33582a" filter="url(#rough2)">② 一次扫描累积 bal</text>
  <text x="392" y="384" text-anchor="middle" font-size="11" fill="#33582a" filter="url(#rough2)">只需 a ≥ j 的那些前缀</text>

  <rect x="524" y="348" width="200" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="624" y="366" text-anchor="middle" font-size="11" fill="#33582a" filter="url(#rough2)">③ 输出 Z + min bal</text>
  <text x="624" y="384" text-anchor="middle" font-size="11" fill="#33582a" filter="url(#rough2)">O(n) 收工</text>

  <path d="M 262 371 L 288 371" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 494 371 L 520 371" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
