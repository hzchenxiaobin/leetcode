<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">峰与谷：只有内部数位（既非首位也非末位）参与</text>

  <!-- 峰示例 198 -->
  <text x="60" y="66" font-size="12" fill="#4a7a3a" filter="url(#rough2)">198：峰</text>
  <rect x="52" y="76" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="75" y="104" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="102" y="70" width="46" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="104" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">9</text>
  <rect x="152" y="76" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="175" y="104" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">8</text>
  <text x="110" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">首</text>
  <text x="144" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">峰 +1</text>
  <text x="192" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">尾</text>

  <!-- 谷示例 201 -->
  <text x="300" y="66" font-size="12" fill="#d6a040" filter="url(#rough2)">201：谷</text>
  <rect x="292" y="76" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="315" y="104" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="342" y="84" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="107" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <rect x="392" y="76" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="415" y="104" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <text x="350" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">首</text>
  <text x="386" y="146" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">谷 +1</text>
  <text x="432" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">尾</text>

  <!-- 判定规则 -->
  <rect x="60" y="168" width="400" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">峰：d[i] &gt; d[i−1] 且 d[i] &gt; d[i+1]</text>
  <text x="260" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">谷：d[i] &lt; d[i−1] 且 d[i] &lt; d[i+1]</text>

  <!-- 反例 -->
  <rect x="60" y="228" width="400" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">反例 199：9 的右邻也是 9，不满足「严格大于」→ 不是峰</text>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">少于 3 位的数字（如 7、42）波动值为 0</text>
</svg>
