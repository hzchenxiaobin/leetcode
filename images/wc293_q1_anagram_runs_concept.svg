<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">核心观察：极大异位词段，每段只留第一个</text>

  <text x="96" y="82" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">留 ✓</text>
  <text x="178" y="82" text-anchor="middle" font-size="12"
        fill="#b85450" filter="url(#rough2)">删 ✗</text>
  <text x="260" y="82" text-anchor="middle" font-size="12"
        fill="#b85450" filter="url(#rough2)">删 ✗</text>
  <text x="342" y="82" text-anchor="middle" font-size="12" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">留 ✓</text>
  <text x="424" y="82" text-anchor="middle" font-size="12"
        fill="#b85450" filter="url(#rough2)">删 ✗</text>

  <rect x="60" y="90" width="72" height="42" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="142" y="90" width="72" height="42" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="224" y="90" width="72" height="42" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="306" y="90" width="72" height="42" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="388" y="90" width="72" height="42" rx="4" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="96" y="117" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">abba</text>
  <text x="178" y="117" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">baba</text>
  <text x="260" y="117" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">bbaa</text>
  <text x="342" y="117" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">cd</text>
  <text x="424" y="117" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">cd</text>

  <path d="M 62 140 Q 178 152 294 140" stroke="#446688" stroke-width="2"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="178" y="168" text-anchor="middle" font-size="12"
        fill="#446688" filter="url(#rough2)">段 1：两两互为异位词（签名都是 aabb）</text>

  <path d="M 308 140 Q 383 152 458 140" stroke="#d6a040" stroke-width="2"
        fill="none" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="383" y="168" text-anchor="middle" font-size="12"
        fill="#d6a040" filter="url(#rough2)">段 2：签名 cd</text>

  <path d="M 260 180 C 258 196, 262 204, 260 212" stroke="#4a7a3a" stroke-width="2.5"
        fill="none" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="202" text-anchor="start" font-size="12"
        fill="#4a7a3a" filter="url(#rough2)">每段只留段首</text>

  <text x="152" y="248" text-anchor="end" font-size="13" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">结果 →</text>
  <rect x="168" y="222" width="72" height="42" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="250" y="222" width="72" height="42" rx="4" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="204" y="249" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">abba</text>
  <text x="286" y="249" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">cd</text>

  <text x="260" y="302" text-anchor="middle" font-size="13"
        fill="#4a7a3a" filter="url(#rough2)">段首的左邻要么不存在，要么来自前面的段（互不为异位词）⇒ 删不掉</text>
  <text x="260" y="330" text-anchor="middle" font-size="12"
        fill="#888" filter="url(#rough2)">段内非首迟早被删 ⇒ 每段坍缩成段首，结果与删除顺序无关</text>
</svg>
