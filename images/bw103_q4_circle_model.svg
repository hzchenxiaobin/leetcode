<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="370" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：环 + 队首指针，nums = [3, 4, −1]</text>

  <!-- 圆环 -->
  <circle cx="200" cy="195" r="115" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="6 6" filter="url(#rough2)"/>

  <!-- 位置 1（上）: 3 -->
  <g filter="url(#rough2)">
    <circle cx="200" cy="80" r="30" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="200" y="80" text-anchor="middle" font-size="15" fill="#2f4a66" dy="5">3</text>
    <text x="200" y="36" text-anchor="middle" font-size="11" fill="#666">位置 1</text>
  </g>
  <!-- 位置 2（左下）: 4 -->
  <g filter="url(#rough2)">
    <circle cx="100" cy="252" r="30" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="100" y="252" text-anchor="middle" font-size="15" fill="#2f4a66" dy="5">4</text>
    <text x="66" y="300" font-size="11" fill="#666">位置 2</text>
  </g>
  <!-- 位置 3（右下）: -1 -->
  <g filter="url(#rough2)">
    <circle cx="300" cy="252" r="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="300" y="252" text-anchor="middle" font-size="15" fill="#7a5a10" dy="5">−1</text>
    <text x="300" y="300" text-anchor="middle" font-size="11" fill="#666">位置 3</text>
  </g>

  <!-- 队首指针 -->
  <g filter="url(#rough2)">
    <path d="M 200 132 L 200 114" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrO)"/>
    <text x="212" y="126" font-size="12" fill="#b85450">队首指针（初始位置 1）</text>
  </g>

  <!-- 顺时针箭头 -->
  <path d="M 150 175 A 82 82 0 0 1 245 155" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="118" y="152" font-size="11" fill="#446688" filter="url(#rough2)">顺时针推进</text>

  <!-- 右侧要点 -->
  <g filter="url(#rough2)" font-size="12.5">
    <rect x="360" y="60" width="150" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="435" y="82" text-anchor="middle" fill="#2f5527">“移到末尾” = 指针顺时针</text>
    <text x="435" y="98" text-anchor="middle" fill="#2f5527">推进一格，环形相对序</text>
    <text x="435" y="114" text-anchor="middle" fill="#2f5527">永不改变</text>

    <rect x="360" y="146" width="150" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="435" y="168" text-anchor="middle" fill="#7a5a10">删除顺序 = 值升序：</text>
    <text x="435" y="184" text-anchor="middle" fill="#7a5a10">−1（位置3）→ 3（位置1）</text>
    <text x="435" y="200" text-anchor="middle" fill="#7a5a10">→ 4（位置2）</text>

    <rect x="360" y="232" width="150" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="435" y="254" text-anchor="middle" fill="#8c3a36">已删的格子成“洞”，</text>
    <text x="435" y="270" text-anchor="middle" fill="#8c3a36">指针推进时直接跳过；</text>
    <text x="435" y="286" text-anchor="middle" fill="#8c3a36">操作数 = 删除 n 次 + 移动数</text>
  </g>

  <text x="60" y="336" font-size="12" fill="#555" filter="url(#rough2)">本例：指针从位置 1 顺时针走 2 格到位置 3（移动 2 次），删 −1；</text>
  <text x="60" y="356" font-size="12" fill="#555" filter="url(#rough2)">随后队首恰是 3、再是 4，各 0 次移动 → 总操作 3 + 2 = 5。</text>
</svg>
