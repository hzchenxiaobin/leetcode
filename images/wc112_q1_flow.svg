<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">minIncrementForUnique：一次排序 + 一次扫描</text>
  <rect x="56" y="52" width="408" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">① 排序 nums（相同值相邻，便于连续处理）</text>
  <text x="260" y="90" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">O(n log n)</text>
  <path d="M 260 100 L 260 120" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="56" y="120" width="408" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">② 从左到右扫：若 a[i] ≤ a[i-1]</text>
  <text x="260" y="158" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">则 ans += a[i-1]+1 − a[i]，并令 a[i] = a[i-1]+1</text>
  <path d="M 260 168 L 260 188" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="56" y="188" width="408" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">③ 处理完的 a 保持严格递增（不变式）</text>
  <text x="260" y="226" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">后续元素只需与新的 a[i-1] 比较</text>
  <path d="M 260 236 L 260 256" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="56" y="256" width="408" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ return ans</text>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">时间 O(n log n)：排序是瓶颈；扫描 O(n)、空间 O(1)（原地改数组）</text>
</svg>
