<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="600" height="380" fill="#fafafa"/>

  <text x="22" y="32" font-size="16" fill="#333" filter="url(#rough2)">先序遍历（左子树先入栈）⇒ 叶子自然按「从左到右」收集</text>

  <rect x="40" y="54" width="250" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="165" y="80" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">递归写法（最直观）</text>
  <text x="58" y="106" font-size="11" fill="#2c4a63" filter="url(#rough2)">dfs(node):</text>
  <text x="58" y="130" font-size="11" fill="#2c4a63" filter="url(#rough2)">  if node 为叶子：收集 node.val，返回</text>
  <text x="58" y="154" font-size="11" fill="#2c4a63" filter="url(#rough2)">  dfs(node.left)</text>
  <text x="58" y="178" font-size="11" fill="#2c4a63" filter="url(#rough2)">  dfs(node.right)</text>

  <rect x="310" y="54" width="250" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="435" y="80" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">迭代写法（显式栈）</text>
  <text x="328" y="106" font-size="11" fill="#8a6410" filter="url(#rough2)">stack = [root]</text>
  <text x="328" y="130" font-size="11" fill="#8a6410" filter="url(#rough2)">pop 时若是叶子 → 收集</text>
  <text x="328" y="154" font-size="11" fill="#8a6410" filter="url(#rough2)">否则先 push right，再 push left</text>
  <text x="328" y="178" font-size="11" fill="#8a6410" filter="url(#rough2)">（栈后进先出 ⇒ 左子树先被访问）</text>

  <!-- 关键顺序示意 -->
  <text x="40" y="238" font-size="12" fill="#333" filter="url(#rough2)">顺序示意：8 号叶子必须在 9 号之前被收集</text>

  <circle cx="120" cy="272" r="16" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="277" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">3</text>
  <path d="M112 286 L86 312 M128 286 L154 312" stroke="#9aa4b0" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <circle cx="82" cy="326" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="82" y="331" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">8</text>
  <circle cx="158" cy="326" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="158" y="331" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">9</text>

  <path d="M86 300 C120 270 190 300 240 316" stroke="#4a7a3a" stroke-width="1.5" fill="none"
        stroke-dasharray="5 4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="300" y="300" font-size="12" fill="#33562a" filter="url(#rough2)">收集顺序 [8, 9]</text>
  <text x="300" y="322" font-size="11" fill="#666" filter="url(#rough2)">若先 push left 再 push right，</text>
  <text x="300" y="342" font-size="11" fill="#666" filter="url(#rough2)">会变成 [9, 8]，判等直接失败</text>
</svg>
