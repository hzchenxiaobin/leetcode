<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 475"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="475" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：17 轮逐位贪心（b 从 16 到 0）</text>

  <!-- start -->
  <rect x="235" y="34" width="170" height="34" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="56" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 0，b = 16</text>
  <path d="M320,68 L320,88" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- mask box -->
  <rect x="215" y="90" width="210" height="38" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">mask = ans | ((1&lt;&lt;b) − 1)</text>
  <path d="M320,128 L320,148" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 1 -->
  <polygon points="200,200 320,156 440,200 320,244" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="194" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">每一行都存在</text>
  <text x="320" y="212" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">x | mask == mask ？</text>

  <!-- yes branch -->
  <path d="M440,200 L466,200" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="453" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是 ✓</text>
  <rect x="470" y="180" width="150" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="545" y="197" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">bit b 保持 0</text>
  <text x="545" y="213" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">ans 不变</text>

  <!-- no branch -->
  <path d="M200,200 L174,200" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="187" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否 ✗</text>
  <rect x="30" y="180" width="140" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="197" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans |= 1 &lt;&lt; b</text>
  <text x="100" y="213" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">bit b 被迫置 1</text>

  <!-- merge to b-- -->
  <path d="M100,220 L100,290 L239,290" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M545,220 L545,290 L401,290" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="243" y="272" width="154" height="36" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="295" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b = b − 1</text>
  <path d="M320,308 L320,328" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 2 -->
  <polygon points="225,368 320,334 415,368 320,402" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="373" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">b &lt; 0 ？</text>

  <!-- return -->
  <path d="M415,368 L435,368" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="358" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="439" y="348" width="180" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="529" y="365" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <text x="529" y="381" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（＝ 最小可行掩码）</text>

  <!-- loop back -->
  <path d="M225,368 L20,368 L20,109 L211,109" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="358" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否（b ≥ 0，继续下一轮）</text>

  <!-- bottom note -->
  <rect x="60" y="425" width="520" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="440" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">每轮检查 O(m·n)：any(x | mask == mask)，行内命中即停、整行断供即停</text>
  <text x="320" y="456" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">共 17 轮 · 总操作 ≤ 1.7×10⁶</text>
</svg>
