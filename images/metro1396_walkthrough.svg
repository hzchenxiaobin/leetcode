<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 484"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
    <marker id="arrDown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="484" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：两张表随操作序列逐步演化</text>
  <text x="260" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">L = Leyton，W = Waterloo，P = Paradise，C = Cambridge</text>

  <!-- 表头 -->
  <text x="88" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#a07420" filter="url(#rough2)">操作</text>
  <text x="250" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a4660" filter="url(#rough2)">checkIns（在途）</text>
  <text x="422" y="66" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5424" filter="url(#rough2)">travelTimes（累计）</text>

  <!-- 行 1 -->
  <rect x="14" y="76" width="148" height="46" fill="#fdf6ec" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="88" y="95" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">① checkIn ×3</text>
  <text x="88" y="112" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">45 / 32 / 27 号进站</text>
  <rect x="172" y="76" width="156" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">45:(L,3)　32:(P,8)</text>
  <text x="250" y="112" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">27:(L,10)</text>
  <rect x="338" y="76" width="168" height="46" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="422" y="95" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">空 —— 还没有</text>
  <text x="422" y="112" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">任何行程闭合</text>

  <path d="M 88 124 L 88 132" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrDown)" filter="url(#rough2)"/>

  <!-- 行 2 -->
  <rect x="14" y="134" width="148" height="46" fill="#fdf6ec" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="88" y="153" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">② checkOut(45,W,15)</text>
  <text x="88" y="170" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">checkOut(27,W,20)</text>
  <rect x="172" y="134" width="156" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="153" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">删 45、删 27</text>
  <text x="250" y="170" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">剩 32:(P,8)</text>
  <rect x="338" y="134" width="168" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="422" y="153" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(L,W) = (22, 2)</text>
  <text x="422" y="170" text-anchor="middle" font-size="10" fill="#6a9a5a" filter="url(#rough2)">dt = 12 与 10，累加两次</text>
  <path d="M 162 157 L 170 157" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <path d="M 88 182 L 88 190" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrDown)" filter="url(#rough2)"/>

  <!-- 行 3 -->
  <rect x="14" y="192" width="148" height="46" fill="#fdf6ec" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="88" y="211" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">③ checkOut(32,C,22)</text>
  <text x="88" y="228" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">dt = 22 − 8 = 14</text>
  <rect x="172" y="192" width="156" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="211" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">删 32 → 空</text>
  <text x="250" y="228" text-anchor="middle" font-size="10" fill="#5a7a9a" filter="url(#rough2)">在途表清空</text>
  <rect x="338" y="192" width="168" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="422" y="211" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">+(P,C) = (14, 1)</text>
  <text x="422" y="228" text-anchor="middle" font-size="10" fill="#6a9a5a" filter="url(#rough2)">(L,W)=(22,2) 保留</text>
  <path d="M 162 215 L 170 215" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <path d="M 88 240 L 88 248" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrDown)" filter="url(#rough2)"/>

  <!-- 行 4：查询 -->
  <rect x="14" y="250" width="148" height="46" fill="#fdf6ec" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="88" y="269" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">④ getAvg(P,C) = 14.0</text>
  <text x="88" y="286" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">getAvg(L,W) = 22/2</text>
  <rect x="172" y="250" width="156" height="46" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="269" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—</text>
  <text x="250" y="286" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">查询不碰在途表</text>
  <rect x="338" y="250" width="168" height="46" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="422" y="269" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">读 (14,1) 与 (22,2)</text>
  <text x="422" y="286" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">一次除法 → 11.0</text>
  <path d="M 162 273 L 170 273" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <path d="M 88 298 L 88 306" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrDown)" filter="url(#rough2)"/>

  <!-- 行 5：在途查询 -->
  <rect x="14" y="308" width="148" height="46" fill="#fdf6ec" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="88" y="327" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">⑤ checkIn(10,L,24)</text>
  <text x="88" y="344" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">getAvg(L,W) 仍 11.0</text>
  <rect x="172" y="308" width="156" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="327" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">+10:(L,24)</text>
  <text x="250" y="344" text-anchor="middle" font-size="10" fill="#5a7a9a" filter="url(#rough2)">10 号在途中</text>
  <rect x="338" y="308" width="168" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="422" y="327" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">不变 —— 行程未闭合</text>
  <text x="422" y="344" text-anchor="middle" font-size="10" fill="#6a9a5a" filter="url(#rough2)">不入账</text>

  <path d="M 88 356 L 88 364" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrDown)" filter="url(#rough2)"/>

  <!-- 行 6：收尾 -->
  <rect x="14" y="366" width="148" height="46" fill="#fdf6ec" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="88" y="385" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">⑥ checkOut(10,W,38)</text>
  <text x="88" y="402" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">dt = 14 → 再查询</text>
  <rect x="172" y="366" width="156" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="385" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">删 10 → 空</text>
  <text x="250" y="402" text-anchor="middle" font-size="10" fill="#5a7a9a" filter="url(#rough2)">随时可清空</text>
  <rect x="338" y="366" width="168" height="46" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="422" y="385" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(L,W) = (36, 3)</text>
  <text x="422" y="403" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">36 ÷ 3 = 12.0 ✓</text>
  <path d="M 162 389 L 170 389" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 底部总结 -->
  <rect x="14" y="428" width="492" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="446" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">三次查询 14.0、11.0、12.0 全部来自「读累计表 + 一次除法」</text>
  <text x="260" y="464" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">在途表出站即清，累计表只长不缩——两表分工，互不干扰</text>
</svg>
