<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">按值分组：每个值 v 变成「物品体积 v、件数 c 次」的一组，0 是纯乘数</text>

  <!-- 左：数组到分组 -->
  <g filter="url(#rough2)">
    <text x="86" y="56" font-size="12.5" fill="#446688">nums（多重集合视角）</text>
    <rect x="46" y="66" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="63" y="85" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="80" y="66" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="97" y="85" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="114" y="66" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="131" y="85" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="148" y="66" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="165" y="85" text-anchor="middle" font-size="12" fill="#333">3</text>

    <path d="M 105 104 C 105 124, 105 130, 105 140" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="40" y="144" width="86" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="83" y="166" text-anchor="middle" font-size="12" fill="#333">v=1, c=1</text>
    <rect x="40" y="186" width="86" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="83" y="208" text-anchor="middle" font-size="12" fill="#333">v=2, c=2</text>
    <rect x="40" y="228" width="86" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="83" y="250" text-anchor="middle" font-size="12" fill="#333">v=3, c=1</text>

    <text x="83" y="290" text-anchor="middle" font-size="12" fill="#555">组内可取 0..c 个 v</text>
    <text x="83" y="310" text-anchor="middle" font-size="12" fill="#555">→ 经典多重背包</text>
  </g>

  <!-- 右：滑窗 -->
  <g filter="url(#rough2)">
    <text x="330" y="56" font-size="12.5" fill="#446688">余数类 m 的滑窗（以 v=2, c=2 为例）</text>
    <text x="332" y="80" font-size="11.5" fill="#888">old = dp[m], dp[m+v], dp[m+2v], …</text>

    <rect x="262" y="94" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="284" y="114" text-anchor="middle" font-size="11.5" fill="#333">old₀</text>
    <rect x="306" y="94" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="328" y="114" text-anchor="middle" font-size="11.5" fill="#333">old₁</text>
    <rect x="350" y="94" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="372" y="114" text-anchor="middle" font-size="11.5" fill="#333">old₂</text>
    <rect x="394" y="94" width="44" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="416" y="114" text-anchor="middle" font-size="11.5" fill="#888">old₃</text>
    <rect x="438" y="94" width="44" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
    <text x="460" y="114" text-anchor="middle" font-size="11.5" fill="#888">old₄</text>

    <!-- 滑窗框 -->
    <rect x="258" y="88" width="140" height="42" rx="6" fill="none" stroke="#b85450" stroke-width="2"/>
    <text x="328" y="150" text-anchor="middle" font-size="11.5" fill="#b85450">窗口宽 c+1 = 3</text>
    <path d="M 328 140 L 328 134" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>

    <text x="268" y="184" font-size="12.5" fill="#555">new_t = old_{t−2} + old_{t−1} + old_t</text>
    <text x="268" y="208" font-size="12.5" fill="#555">（0 个 / 1 个 / 2 个 v 的方案合流）</text>
    <text x="268" y="238" font-size="12" fill="#888">old₃ 离开窗口时：new₃ = old₁+old₂+old₃</text>
    <text x="268" y="260" font-size="12" fill="#888">前缀和进出即滑窗，省掉逐件枚举</text>

    <rect x="258" y="278" width="224" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" fill-opacity="0.4"/>
    <text x="370" y="302" text-anchor="middle" font-size="12.5" fill="#b85450">值 0 特判：v=0 不进背包</text>
    <text x="370" y="324" text-anchor="middle" font-size="12.5" fill="#555">答案整体乘 (cnt[0] + 1)</text>
  </g>
</svg>
