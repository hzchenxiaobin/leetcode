<svg xmlns="http://www.w3.org/2000/svg" width="680" height="456" viewBox="0 0 680 456" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="456" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">「依次执行」的两条规则：零吸收 &amp; 无连锁</text>
  <path d="M 170 42 Q 340 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left panel: rule 1 zero absorption ===== -->
  <g filter="url(#sk)"><rect x="24" y="62" width="290" height="304" rx="10" fill="#fdfdff" stroke="#446688" stroke-width="1.5"/></g>
  <text x="169" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">规则一：零吸收</text>

  <!-- case A: 0 vs x -->
  <g filter="url(#sk)"><rect x="56" y="106" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="78" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">0</text>
  <g filter="url(#sk)"><rect x="108" y="106" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="130" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">x</text>
  <path d="M 162 123 L 184 123" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="192" y="128" font-size="11" fill="#666">0 ≠ x → 跳过</text>

  <!-- case B: 0 vs 0 -->
  <g filter="url(#sk)"><rect x="56" y="154" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="78" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">0</text>
  <g filter="url(#sk)"><rect x="108" y="154" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="130" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">0</text>
  <path d="M 162 171 L 184 171" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="192" y="176" font-size="11" fill="#666">0==0 → 仍是 0</text>

  <!-- callout -->
  <g filter="url(#sk)"><rect x="44" y="204" width="252" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="170" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">被置零的位置对后续步骤「透明」</text>
  <text x="170" y="250" text-anchor="middle" font-size="10.5" fill="#446688">顺序扫一遍 = 「依次执行」的忠实模拟</text>

  <!-- lemma box -->
  <g filter="url(#sk)"><rect x="44" y="284" width="252" height="70" rx="8" fill="#fdfdff" stroke="#999" stroke-width="1.2"/></g>
  <text x="58" y="306" font-size="11" font-weight="bold" fill="#555">引理 1（零吸收）</text>
  <text x="58" y="324" font-size="10.5" fill="#666">第 i 步执行前 nums[i] = 0</text>
  <text x="58" y="342" font-size="10.5" fill="#666">⇒ 该步不改变数组（no-op）</text>

  <!-- ===== Right panel: rule 2 no chaining ===== -->
  <g filter="url(#sk)"><rect x="330" y="62" width="326" height="304" rx="10" fill="#fdfdff" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="493" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">规则二：无连锁（以 [2,2,2,2] 为例）</text>

  <!-- row 0: original -->
  <text x="382" y="124" text-anchor="end" font-size="10.5" font-weight="bold" fill="#555">原始</text>
  <g filter="url(#sk)">
    <rect x="392" y="102" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="440" y="102" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="488" y="102" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="536" y="102" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="413" y="124" filter="url(#sk)">2</text><text x="461" y="124" filter="url(#sk)">2</text>
    <text x="509" y="124" filter="url(#sk)">2</text><text x="557" y="124" filter="url(#sk)">2</text>
  </g>

  <!-- row 1: after i=0 -->
  <text x="382" y="172" text-anchor="end" font-size="10.5" font-weight="bold" fill="#555">i=0 后</text>
  <g filter="url(#sk)">
    <rect x="392" y="150" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="440" y="150" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="488" y="150" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="536" y="150" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="413" y="172" fill="#4a7a3a" filter="url(#sk)">4</text>
    <text x="461" y="172" fill="#b85450" filter="url(#sk)">0</text>
    <text x="509" y="172" fill="#333" filter="url(#sk)">2</text>
    <text x="557" y="172" fill="#333" filter="url(#sk)">2</text>
  </g>
  <text x="588" y="170" font-size="9.5" fill="#4a7a3a">2==2</text>
  <text x="588" y="182" font-size="9.5" fill="#4a7a3a">→ 4,0</text>

  <!-- row 2: after i=2 -->
  <text x="382" y="224" text-anchor="end" font-size="10.5" font-weight="bold" fill="#555">i=2 后</text>
  <g filter="url(#sk)">
    <rect x="392" y="202" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="440" y="202" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="488" y="202" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="536" y="202" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="14" text-anchor="middle" font-weight="bold">
    <text x="413" y="224" fill="#4a7a3a" filter="url(#sk)">4</text>
    <text x="461" y="224" fill="#b85450" filter="url(#sk)">0</text>
    <text x="509" y="224" fill="#4a7a3a" filter="url(#sk)">4</text>
    <text x="557" y="224" fill="#b85450" filter="url(#sk)">0</text>
  </g>

  <!-- no-remerge annotation -->
  <path d="M 413 246 Q 461 266 509 246" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <text x="461" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">×</text>
  <text x="524" y="262" font-size="10" fill="#b85450" font-weight="bold">两个 4 相等也不再合并</text>

  <!-- callout -->
  <g filter="url(#sk)"><rect x="348" y="284" width="292" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="494" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">翻倍值只落在位置 i，后续步骤只读 i+1 之后</text>
  <text x="494" y="330" text-anchor="middle" font-size="10.5" fill="#2e6e2e">⇒ 合并永不连锁（第 0 步早已执行完）</text>

  <!-- ===== bottom banner ===== -->
  <g filter="url(#sk)"><rect x="28" y="384" width="624" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="340" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5f14">推论：合并 = 一趟顺序扫描（零吸收 ⇒ 读到 0 无需特判）；搬零 = 283 读写双指针</text>
  <text x="340" y="428" text-anchor="middle" font-size="11" fill="#a5844a">两阶段解耦，各 O(n)，整体 O(n) 时间 / O(1) 空间</text>
</svg>
