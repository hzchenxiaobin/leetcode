<svg xmlns="http://www.w3.org/2000/svg" width="660" height="372" viewBox="0 0 660 372" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="372" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：第 i 步的增量其实是一个「权重」w = n − i + 1</text>
  <text x="330" y="52" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">第 i 步把 a 或 b 加 1，此后每一步跳跃都带着它 → 等效于给位置 i 记权重 n−i+1</text>

  <g filter="url(#rough2)">
    <rect x="174" y="78" width="56" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="238" y="78" width="56" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="302" y="78" width="56" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="366" y="78" width="56" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="430" y="78" width="56" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g font-size="19" font-weight="bold" text-anchor="middle">
    <text x="202" y="107" fill="#b85450" filter="url(#rough2)">X</text>
    <text x="266" y="107" fill="#33517a" filter="url(#rough2)">Y</text>
    <text x="330" y="107" fill="#b85450" filter="url(#rough2)">X</text>
    <text x="394" y="107" fill="#33517a" filter="url(#rough2)">Y</text>
    <text x="458" y="107" fill="#b85450" filter="url(#rough2)">X</text>
  </g>
  <text x="150" y="150" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">权重 w</text>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#8a6d3b">
    <text x="202" y="152" filter="url(#rough2)">5</text>
    <text x="266" y="152" filter="url(#rough2)">4</text>
    <text x="330" y="152" filter="url(#rough2)">3</text>
    <text x="394" y="152" filter="url(#rough2)">2</text>
    <text x="458" y="152" filter="url(#rough2)">1</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 202 124 L 214 172" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 330 124 L 330 172" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 458 124 L 446 172" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="120" y="176" width="420" height="54" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="330" y="198" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">p = 5 + 3 + 1 = 9（3 个 X 的权重和）</text>
  <text x="330" y="218" text-anchor="middle" font-size="12.5" fill="#33517a" filter="url(#rough2)">q = 4 + 2 = 6（2 个 Y 的权重和），p + q = 15 = T(5)</text>

  <g filter="url(#rough2)">
    <rect x="100" y="246" width="460" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="330" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">p + q = 1 + 2 + … + n = T(n) 恒成立，只由步数 n 决定</text>

  <g filter="url(#rough2)">
    <rect x="80" y="308" width="500" height="50" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="330" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d3b" filter="url(#rough2)">k 个互不相同的权重取自 [1, n] ⇒ p 恰好取遍 [T(k), k(2n−k+1)/2] 内所有整数</text>
  <text x="330" y="349" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">所以「让 p 尽量靠近 x」= 在区间里挑最接近目标的整数</text>
</svg>
