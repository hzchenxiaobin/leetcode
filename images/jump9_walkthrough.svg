<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：nums = [3,1,4,2,5] → ans = [4,4,4,4,5]</text>

  <!-- ===== i = 0 的行走 ===== -->
  <rect x="100" y="64" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="93" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="180" y="64" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="93" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="260" y="64" width="64" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="292" y="93" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <rect x="340" y="64" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="93" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="420" y="64" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="452" y="93" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <g font-size="8.5" fill="#999" filter="url(#rough2)">
    <text x="156" y="104">0</text><text x="236" y="104">1</text><text x="316" y="104">2</text>
    <text x="396" y="104">3</text><text x="476" y="104">4</text>
  </g>

  <path d="M138,60 Q252,24 360,60" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M300,60 Q374,26 444,60" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M364,114 Q328,142 300,114" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="492" y="40" font-size="10" fill="#b85450" filter="url(#rough2)">③ 再飞？5 &lt; 4 ✗ 停</text>
  <text x="492" y="64" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">① 起飞 V = pm[0] = 3</text>
  <text x="492" y="82" font-size="9.5" fill="#555" filter="url(#rough2)">落到最远 &lt;3 的下标 3</text>
  <text x="330" y="158" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">② 充电：V = pm[0..3] = 4</text>

  <text x="340" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">R(0) = 3 → ans[0] = pm[3] = 4</text>

  <!-- ===== T / R / ans 表 ===== -->
  <g filter="url(#rough2)">
    <rect x="90" y="210" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="190" y="210" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="290" y="210" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="390" y="210" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="490" y="210" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="90" y="240" width="100" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="190" y="240" width="100" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="290" y="240" width="100" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="390" y="240" width="100" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="490" y="240" width="100" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="90" y="272" width="100" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="190" y="272" width="100" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="290" y="272" width="100" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="390" y="272" width="100" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="490" y="272" width="100" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="90" y="304" width="100" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="190" y="304" width="100" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="290" y="304" width="100" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="390" y="304" width="100" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="490" y="304" width="100" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="90" y="336" width="100" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="190" y="336" width="100" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="290" y="336" width="100" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="390" y="336" width="100" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="490" y="336" width="100" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="90" y="368" width="100" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="190" y="368" width="100" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="290" y="368" width="100" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <rect x="390" y="368" width="100" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="490" y="368" width="100" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">
    <text x="140" y="230">i</text><text x="240" y="230">pm[i]</text><text x="340" y="230">T[i]</text>
    <text x="440" y="230">R[i]</text><text x="540" y="230">ans[i]</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="140" y="261">4</text><text x="240" y="261">5</text><text x="340" y="261">4</text>
    <text x="440" y="261">4</text><text x="540" y="261">5</text>
    <text x="140" y="293">3</text><text x="240" y="293">4</text><text x="340" y="293">3</text>
    <text x="440" y="293">3</text><text x="540" y="293">4</text>
    <text x="140" y="325">2</text><text x="240" y="325">4</text><text x="340" y="325">3</text>
    <text x="440" y="325" fill="#9a7218">= R[3]</text><text x="540" y="325">4</text>
    <text x="140" y="357">1</text><text x="240" y="357">3</text><text x="340" y="357">3</text>
    <text x="440" y="357" fill="#9a7218">= R[3]</text><text x="540" y="357">4</text>
    <text x="140" y="389">0</text><text x="240" y="389">3</text><text x="340" y="389">3</text>
    <text x="440" y="389" fill="#9a7218">= R[3]</text><text x="540" y="389">4</text>
  </g>
  <path d="M78,392 L78,246" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="316" font-size="10.5" fill="#446688" transform="rotate(-90 60 316)" text-anchor="middle" filter="url(#rough2)">从右往左处理</text>

  <text x="340" y="428" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">T[i] &gt; i 时 R[i] = R[T[i]]：右边早已算好，O(1) 回填</text>
  <text x="340" y="448" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans[i] = pm[R[i]]：答案 = 最远可达窗口内的前缀最大值</text>
</svg>
