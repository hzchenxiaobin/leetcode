<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例 1 演算：先建极值表，再逐栋判定（n = 3 十字）</text>
  <path d="M 190 38 Q 320 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="11" fill="#666">第一遍扫描建表（左）→ 第二遍扫描逐栋判定（右）</text>

  <!-- ===== 左表：极值表 ===== -->
  <g filter="url(#sk)"><rect x="40" y="126" width="234" height="26" fill="#fff8e1"/></g>
  <g filter="url(#sk)"><rect x="40" y="204" width="234" height="26" fill="#fff8e1"/></g>
  <g filter="url(#sk)"><rect x="40" y="74" width="234" height="182" fill="none" stroke="#8a8a8a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><path d="M 40 100 H 274 M 40 126 H 274 M 40 152 H 274 M 40 178 H 274 M 40 204 H 274 M 40 230 H 274 M 100 74 V 256 M 186 74 V 256 M 230 74 V 256" stroke="#8a8a8a" stroke-width="1" fill="none"/></g>

  <text x="70" y="91" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">分组</text>
  <text x="143" y="91" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">组内取值</text>
  <text x="208" y="91" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">min</text>
  <text x="252" y="91" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555">max</text>

  <text x="70" y="117" text-anchor="middle" font-size="11" fill="#333">x = 1</text>
  <text x="143" y="117" text-anchor="middle" font-size="11" fill="#333">{2}</text>
  <text x="208" y="117" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="252" y="117" text-anchor="middle" font-size="11" fill="#333">2</text>

  <text x="70" y="143" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">x = 2</text>
  <text x="143" y="143" text-anchor="middle" font-size="11" fill="#333">{1, 2, 3}</text>
  <text x="208" y="143" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07818">1</text>
  <text x="252" y="143" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07818">3</text>

  <text x="70" y="169" text-anchor="middle" font-size="11" fill="#333">x = 3</text>
  <text x="143" y="169" text-anchor="middle" font-size="11" fill="#333">{2}</text>
  <text x="208" y="169" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="252" y="169" text-anchor="middle" font-size="11" fill="#333">2</text>

  <text x="70" y="195" text-anchor="middle" font-size="11" fill="#333">y = 1</text>
  <text x="143" y="195" text-anchor="middle" font-size="11" fill="#333">{2}</text>
  <text x="208" y="195" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="252" y="195" text-anchor="middle" font-size="11" fill="#333">2</text>

  <text x="70" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">y = 2</text>
  <text x="143" y="221" text-anchor="middle" font-size="11" fill="#333">{1, 2, 3}</text>
  <text x="208" y="221" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07818">1</text>
  <text x="252" y="221" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b07818">3</text>

  <text x="70" y="247" text-anchor="middle" font-size="11" fill="#333">y = 3</text>
  <text x="143" y="247" text-anchor="middle" font-size="11" fill="#333">{2}</text>
  <text x="208" y="247" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="252" y="247" text-anchor="middle" font-size="11" fill="#333">2</text>

  <text x="40" y="274" font-size="10.5" fill="#2e6e2e">同 x 组记录 y 的 min / max → 管左右</text>
  <text x="40" y="290" font-size="10.5" fill="#2b6e9e">同 y 组记录 x 的 min / max → 管上下</text>

  <g filter="url(#sk)"><path d="M 278 167 L 296 167" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)"/></g>

  <!-- ===== 右表：逐栋判定 ===== -->
  <g filter="url(#sk)"><rect x="300" y="126" width="320" height="26" fill="#e6f4ea"/></g>
  <g filter="url(#sk)"><rect x="300" y="74" width="320" height="156" fill="none" stroke="#8a8a8a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><path d="M 300 100 H 620 M 300 126 H 620 M 300 152 H 620 M 300 178 H 620 M 300 204 H 620 M 360 74 V 230 M 472 74 V 230 M 584 74 V 230" stroke="#8a8a8a" stroke-width="1" fill="none"/></g>

  <text x="330" y="91" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">建筑</text>
  <text x="416" y="91" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">左右夹逼</text>
  <text x="528" y="91" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">上下夹逼</text>
  <text x="602" y="91" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">覆盖</text>

  <text x="330" y="117" text-anchor="middle" font-size="11" fill="#333">(1,2)</text>
  <text x="416" y="117" text-anchor="middle" font-size="10.5" fill="#b03a3a">2 &lt; 2 ✗</text>
  <text x="528" y="117" text-anchor="middle" font-size="10.5" fill="#b03a3a">1 &lt; 1 ✗</text>
  <text x="602" y="117" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">✗</text>

  <text x="330" y="143" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">(2,2)</text>
  <text x="416" y="143" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">1 &lt; 2 &lt; 3 ✓</text>
  <text x="528" y="143" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">1 &lt; 2 &lt; 3 ✓</text>
  <text x="602" y="143" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">✓</text>

  <text x="330" y="169" text-anchor="middle" font-size="11" fill="#333">(3,2)</text>
  <text x="416" y="169" text-anchor="middle" font-size="10.5" fill="#b03a3a">2 &lt; 2 ✗</text>
  <text x="528" y="169" text-anchor="middle" font-size="10.5" fill="#b03a3a">3 &lt; 3 ✗</text>
  <text x="602" y="169" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">✗</text>

  <text x="330" y="195" text-anchor="middle" font-size="11" fill="#333">(2,1)</text>
  <text x="416" y="195" text-anchor="middle" font-size="10.5" fill="#b03a3a">1 &lt; 1 ✗</text>
  <text x="528" y="195" text-anchor="middle" font-size="10.5" fill="#b03a3a">2 &lt; 2 ✗</text>
  <text x="602" y="195" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">✗</text>

  <text x="330" y="221" text-anchor="middle" font-size="11" fill="#333">(2,3)</text>
  <text x="416" y="221" text-anchor="middle" font-size="10.5" fill="#b03a3a">3 &lt; 3 ✗</text>
  <text x="528" y="221" text-anchor="middle" font-size="10.5" fill="#b03a3a">2 &lt; 2 ✗</text>
  <text x="602" y="221" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">✗</text>

  <text x="300" y="250" font-size="10.5" fill="#444">端点建筑必败：取到组内 min 或 max 的那一侧没有任何建筑</text>
  <text x="300" y="268" font-size="10.5" fill="#444">(2,2) 是唯一同时远离四张极值表的建筑</text>

  <!-- ===== 底部结论 ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="312" width="580" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="330" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">走查结论：十字五栋中只有中心 (2,2) 通过双重严格夹逼 → 答案 1</text>
  <text x="330" y="360" text-anchor="middle" font-size="10.5" fill="#444">四个端点各是所在水平线 / 竖直线的极值端点，至少缺一个方向；十字形 = 用最少建筑（5 栋）凑出 1 栋覆盖</text>
</svg>
