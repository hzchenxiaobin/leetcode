<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：查询点为角，同列点定边长</text>
  <path d="M 160 38 Q 340 48 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: coordinate plane -->
  <path d="M 40 320 L 336 320" stroke="#555" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 44 324 L 44 58" stroke="#555" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="342" y="326" font-size="12" fill="#555">x</text>
  <text x="34" y="52" font-size="12" fill="#555">y</text>
  <text x="36" y="336" font-size="10" fill="#888">0</text>
  <text x="96" y="334" font-size="10" fill="#888">3</text>
  <text x="272" y="334" font-size="10" fill="#888">11</text>
  <text x="38" y="118" font-size="10" fill="#888" text-anchor="end">10</text>
  <text x="38" y="294" font-size="10" fill="#888" text-anchor="end">2</text>

  <g filter="url(#sk)"><rect x="96" y="114" width="176" height="176" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="7,5"/></g>
  <path d="M 272 114 L 272 290" stroke="#b85450" stroke-width="3" filter="url(#sk)"/>

  <g filter="url(#sk)"><circle cx="96" cy="114" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="108" y="136" font-size="12" fill="#446688">A(3,10)</text>
  <g filter="url(#sk)"><circle cx="272" cy="114" r="6.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="284" y="104" font-size="12.5" font-weight="bold" fill="#b85450">P(11,10)</text>
  <text x="284" y="120" font-size="10" fill="#b85450">查询点</text>
  <g filter="url(#sk)"><circle cx="96" cy="290" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="108" y="286" font-size="12" fill="#4a7a3a">C(3,2)</text>
  <g filter="url(#sk)"><circle cx="272" cy="290" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="284" y="288" font-size="12" font-weight="bold" fill="#4a7a3a">Q(11,2)</text>
  <text x="284" y="304" font-size="10" fill="#4a7a3a">同列点</text>

  <text x="184" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040">边长 d = 8</text>
  <text x="286" y="204" font-size="10.5" fill="#b85450">同列垂直边</text>
  <text x="286" y="220" font-size="10.5" fill="#b85450">d = |2−10|</text>

  <!-- right: four orientations -->
  <text x="505" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">四种朝向，一次枚举覆盖</text>
  <g filter="url(#sk)"><rect x="500" y="132" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,4"/></g>
  <g filter="url(#sk)"><rect x="442" y="132" width="58" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5,4"/></g>
  <g filter="url(#sk)"><rect x="500" y="190" width="58" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5,4"/></g>
  <g filter="url(#sk)"><rect x="442" y="190" width="58" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,4"/></g>
  <g filter="url(#sk)"><circle cx="500" cy="190" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="514" y="184" font-size="13" font-weight="bold" fill="#b85450">P</text>
  <g filter="url(#sk)"><circle cx="500" cy="132" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="510" y="128" font-size="10.5" font-weight="bold" fill="#4a7a3a">Q 上</text>
  <g filter="url(#sk)"><circle cx="500" cy="248" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="510" y="262" font-size="10.5" font-weight="bold" fill="#4a7a3a">Q 下</text>
  <text x="529" y="122" text-anchor="middle" font-size="10" fill="#446688">朝右</text>
  <text x="471" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a">朝左</text>
  <text x="529" y="264" text-anchor="middle" font-size="10" fill="#d6a040">朝右</text>
  <text x="471" y="264" text-anchor="middle" font-size="10" fill="#b85450">朝左</text>
  <text x="505" y="288" text-anchor="middle" font-size="11.5" fill="#2b2b2b">Q 上 / 下 定边长 d，朝左 / 右各查一次</text>
  <text x="505" y="306" text-anchor="middle" font-size="11" fill="#888">P 的 4 种角身份全覆盖，且不重复</text>
  <text x="505" y="326" text-anchor="middle" font-size="10.5" fill="#888">（图为示意，d 相同仅为排版）</text>

  <!-- bottom formula band -->
  <g filter="url(#sk)"><rect x="26" y="348" width="628" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="340" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">count(px,py) = Σ (y≠py)  cnt(px,y) · [ cnt(px+d,py)·cnt(px+d,y) + cnt(px−d,py)·cnt(px−d,y) ]</text>
  <text x="340" y="400" text-anchor="middle" font-size="12" fill="#2f5d25">其中 d = |y − py| &gt; 0 —— 跳过 y = py，保证面积为正</text>
  <text x="340" y="424" text-anchor="middle" font-size="12" fill="#446688">三个 cnt = 三个角各自的副本数，重复点按次数相乘计入</text>
  <text x="340" y="444" text-anchor="middle" font-size="11" fill="#888">每个正方形恰有一个与 P 同列的角 → 按「同列角」分类，不重不漏</text>
</svg>
