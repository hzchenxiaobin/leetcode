<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">反向推：从 N 的末尾 1 反推候选 t</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">以 N = 11 = 1011₂ 为例，T = 2（N 末尾连续 1 的个数）</text>

  <rect x="36" y="62" width="488" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">若 x OR (x+1) = N，则 N = x + 2^t ⇒ N 的低 t+1 位必须全为 1</text>
  <text x="280" y="100" text-anchor="middle" font-size="10.5" fill="#555">所以 t 只能取 0, 1, …, T-1（T 为 N 末尾连续 1 的个数）</text>

  <rect x="36" y="120" width="150" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="111" y="140" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">候选 t</text>
  <rect x="190" y="120" width="150" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="265" y="140" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">x = N - 2^t</text>
  <rect x="344" y="120" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="434" y="140" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">检验 x OR (x+1)</text>

  <rect x="36" y="154" width="150" height="30" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="111" y="174" text-anchor="middle" font-size="11" fill="#555">t = 0（x 偶）</text>
  <rect x="190" y="154" width="150" height="30" fill="#fafafa" stroke="#c8c8c8" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="265" y="174" text-anchor="middle" font-size="11" fill="#555">11 - 1 = 10</text>
  <rect x="344" y="154" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="434" y="174" text-anchor="middle" font-size="11" fill="#3a5a30">10 | 11 = 11 ✔</text>

  <rect x="36" y="188" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="111" y="208" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">t = 1（最大）</text>
  <rect x="190" y="188" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="265" y="208" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">11 - 2 = 9</text>
  <rect x="344" y="188" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="434" y="208" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">9 | 10 = 11 ✔（最小）</text>

  <rect x="36" y="222" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="111" y="242" text-anchor="middle" font-size="11" fill="#8a3a36">t = 2（越界）</text>
  <rect x="190" y="222" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="265" y="242" text-anchor="middle" font-size="11" fill="#8a3a36">11 - 4 = 7</text>
  <rect x="344" y="222" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="434" y="242" text-anchor="middle" font-size="11" fill="#8a3a36">7 | 8 = 15 ✘</text>

  <path d="M 280 256 L 280 274" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="280" width="488" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="301" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">t 越大 x 越小 ⇒ 取 t = T - 1，得 ans = N - 2^(T-1)</text>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#555">T - 1 正好是「N+1 末尾 0 的个数减一」，等价于 ans = N - lowbit(N+1) / 2</text>

  <rect x="36" y="338" width="488" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="357" text-anchor="middle" font-size="10.5" fill="#8a3a36">N 为偶数时 T = 0，无候选人，直接返回 -1（与 Q1 的奇偶性结论一致）</text>
</svg>
