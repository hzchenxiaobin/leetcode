<svg xmlns="http://www.w3.org/2000/svg" width="940" height="596" viewBox="0 0 940 596"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arry" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b0b0b0"/>
    </marker>
  </defs>

  <rect width="940" height="596" fill="#fafafa"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：成功链与两处失败短路点</text>
  <path d="M 260 42 Q 470 50 680 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Part 1: example 1 chain -->
  <text x="70" y="70" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1</text>
  <text x="130" y="70" font-size="11.5" font-family="monospace" fill="#555" filter="url(#rough2)">s = "1 box has 3 blue 4 red 6 green and 12 yellow marbles"</text>

  <text x="80" y="88" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">哨兵</text>
  <g filter="url(#rough2)">
    <rect x="55" y="92" width="50" height="40" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.5" stroke-dasharray="5 3"/>
    <rect x="185" y="92" width="50" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="315" y="92" width="50" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="445" y="92" width="50" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="575" y="92" width="50" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="705" y="92" width="180" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="80" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#777" filter="url(#rough2)">−1</text>
  <text x="210" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="340" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="470" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="600" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>
  <text x="795" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5c2e" filter="url(#rough2)">return true</text>
  <text x="795" y="126" text-anchor="middle" font-size="9.5" fill="#567" filter="url(#rough2)">数字 [1,3,4,6,12] 严格递增</text>

  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="1.8" fill="none">
    <path d="M 105 112 L 181 112" marker-end="url(#arrg)"/>
    <path d="M 235 112 L 311 112" marker-end="url(#arrg)"/>
    <path d="M 365 112 L 441 112" marker-end="url(#arrg)"/>
    <path d="M 495 112 L 571 112" marker-end="url(#arrg)"/>
    <path d="M 625 112 L 701 112" marker-end="url(#arrg)"/>
  </g>
  <text x="145" y="103" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1 &gt; −1 ✓</text>
  <text x="275" y="103" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3 &gt; 1 ✓</text>
  <text x="405" y="103" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4 &gt; 3 ✓</text>
  <text x="535" y="103" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">6 &gt; 4 ✓</text>
  <text x="665" y="103" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">12 &gt; 6 ✓</text>

  <text x="470" y="160" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">方框 = prev 的演化（哨兵 −1 → 1 → 3 → 4 → 6 → 12）：每通过一次比较，prev 滚动成 cur；单词 token 全程被跳过</text>

  <path d="M 50 178 L 890 178" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>

  <!-- Panel A: example 2 -->
  <g filter="url(#rough2)">
    <rect x="50" y="192" width="400" height="256" rx="10" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="50" y="192" width="400" height="32" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="250" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4666" filter="url(#rough2)">示例 2："hello world 5 x 5"</text>
  <text x="75" y="250" font-size="11" font-family="monospace" fill="#777" filter="url(#rough2)">数字：5, 5（单词全部被跳过）</text>
  <g filter="url(#rough2)">
    <rect x="140" y="268" width="46" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="310" y="268" width="46" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="163" y="297" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <text x="333" y="297" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <path d="M 188 291 L 306 291" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="247" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">5 ≤ 5</text>
  <text x="247" y="334" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">相等也违规 ✗</text>
  <g filter="url(#rough2)">
    <rect x="115" y="360" width="270" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="250" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">return false</text>
  <text x="250" y="404" text-anchor="middle" font-size="10.5" fill="#a66" filter="url(#rough2)">「严格」递增：不允许相等</text>

  <!-- Panel B: example 3 -->
  <g filter="url(#rough2)">
    <rect x="490" y="192" width="400" height="256" rx="10" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.2"/>
    <rect x="490" y="192" width="400" height="32" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="690" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4666" filter="url(#rough2)">示例 3："sunset is at 7 51 pm … 60 s"</text>
  <text x="515" y="250" font-size="11" font-family="monospace" fill="#777" filter="url(#rough2)">数字：7, 51, 50, 60</text>
  <g filter="url(#rough2)">
    <rect x="525" y="268" width="42" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="610" y="268" width="42" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="695" y="268" width="42" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="780" y="268" width="42" height="46" rx="6" fill="#f0f0f0" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="546" y="297" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <text x="631" y="297" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">51</text>
  <text x="716" y="297" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">50</text>
  <text x="801" y="297" text-anchor="middle" font-size="15" font-weight="bold" fill="#aaa" filter="url(#rough2)">60</text>
  <path d="M 567 291 L 606 291" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="586" y="262" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">7 &lt; 51 ✓</text>
  <path d="M 652 291 L 691 291" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="671" y="262" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">50 ≤ 51 ✗</text>
  <path d="M 737 291 L 776 291" stroke="#b0b0b0" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arry)" filter="url(#rough2)"/>
  <text x="756" y="262" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">未检查</text>
  <g filter="url(#rough2)">
    <rect x="530" y="360" width="320" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="690" y="384" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">return false</text>
  <text x="690" y="404" text-anchor="middle" font-size="10.5" fill="#a66" filter="url(#rough2)">首个下降对即短路——60 从未被解析</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="50" y="474" width="840" height="96" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="72" y="498" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">短路语义：cur ≤ prev 的第一处立即返回 false，其后所有 token 不再读取——示例 3 的 60 根本不被解析。</text>
  <text x="72" y="522" font-size="11" fill="#444" filter="url(#rough2)">哨兵 −1 只参与第一次比较（1 &gt; −1 恒真）；真正生效的约束从第二对相邻数字开始。</text>
  <text x="72" y="546" font-size="11" fill="#888" filter="url(#rough2)">单词 token 只被首字符「瞄一眼」即跳过，O(1) 判型后不再看第二个字符。</text>
</svg>
