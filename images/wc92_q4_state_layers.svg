<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path filter="url(#rough2)" d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path filter="url(#rough2)" d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="28" font-size="16" fill="#333" filter="url(#rough2)">状态空间：位置 × 钥匙集合，把「记忆」压进 mask</text>

  <rect x="60" y="46" width="300" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="68" font-size="12" fill="#446688" filter="url(#rough2)">第 0 层：mask = 00（一把钥匙都没有）</text>
  <circle cx="100" cy="96" r="8" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="130" cy="96" r="8" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="160" cy="96" r="8" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="190" cy="96" r="8" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="220" cy="96" r="8" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="100" font-size="11" fill="#666" filter="url(#rough2)">…… 网格 (r, c)</text>

  <path d="M210,130 L210,158" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="222" y="150" font-size="11" fill="#4a7a3a" filter="url(#rough2)">踩到钥匙 a：mask |= 01</text>

  <rect x="60" y="162" width="300" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="184" font-size="12" fill="#4a7a3a" filter="url(#rough2)">第 1 层：mask = 01（已有 a）</text>
  <circle cx="100" cy="212" r="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="130" cy="212" r="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="160" cy="212" r="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="190" cy="212" r="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="220" cy="212" r="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="216" font-size="11" fill="#666" filter="url(#rough2)">此时可穿过门 A</text>

  <path d="M210,246 L210,274" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="222" y="266" font-size="11" fill="#4a7a3a" filter="url(#rough2)">再踩到钥匙 b：mask |= 10</text>

  <rect x="60" y="278" width="300" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="76" y="300" font-size="12" fill="#d6a040" filter="url(#rough2)">第 3 层：mask = 11 = 全部钥匙，到达即结束</text>
  <circle cx="100" cy="326" r="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="130" cy="326" r="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="160" cy="326" r="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="190" cy="326" r="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="220" cy="326" r="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="330" font-size="11" fill="#666" filter="url(#rough2)">答案层</text>

  <rect x="392" y="60" width="222" height="290" rx="9" fill="#ffffff" stroke="#c8d0da" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="408" y="84" font-size="12" fill="#446688" filter="url(#rough2)">状态 = (r, c, mask)</text>
  <text x="408" y="108" font-size="11" fill="#333" filter="url(#rough2)">同一层内：上下左右移动</text>
  <text x="408" y="128" font-size="11" fill="#333" filter="url(#rough2)">（遇到锁先查 mask 对应位）</text>
  <text x="408" y="152" font-size="11" fill="#4a7a3a" filter="url(#rough2)">跨层：踩到钥匙 ⇒ mask 变大</text>
  <text x="408" y="176" font-size="11" fill="#333" filter="url(#rough2)">状态总数 = m × n × 2^k</text>
  <text x="408" y="196" font-size="11" fill="#666" filter="url(#rough2)">≤ 30 × 30 × 64 = 57600</text>
  <text x="408" y="224" font-size="11" fill="#333" filter="url(#rough2)">边权全为 1 ⇒ 直接 BFS，</text>
  <text x="408" y="244" font-size="11" fill="#333" filter="url(#rough2)">第一次到达任一终态即最短。</text>
  <text x="408" y="272" font-size="11" fill="#b85450" filter="url(#rough2)">注意：同一个 (r, c) 在不同 mask</text>
  <text x="408" y="292" font-size="11" fill="#b85450" filter="url(#rough2)">下是不同的状态，必须分开记距。</text>
  <text x="408" y="320" font-size="11" fill="#666" filter="url(#rough2)">只用一个 visited[r][c] 会把</text>
  <text x="408" y="338" font-size="11" fill="#666" filter="url(#rough2)">「回头拿钥匙」的路堵死。</text>
</svg>
