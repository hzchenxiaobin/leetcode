<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：示例 1 与示例 2</text>

  <!-- ================= 示例 1 ================= -->
  <text x="40" y="54" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1：n = 5, query = [[0,3],[3,4]]</text>

  <!-- edges of graph 1 -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.6">
    <line x1="96" y1="125" x2="164" y2="125"/>
    <line x1="196" y1="125" x2="264" y2="125"/>
    <line x1="180" y1="141" x2="180" y2="196"/>
  </g>
  <text x="120" y="115" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">7</text>
  <text x="240" y="115" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">7</text>
  <text x="194" y="173" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <!-- walk arrows of graph 1 -->
  <g filter="url(#rough2)" fill="none" stroke="#b85450" stroke-width="2">
    <path d="M 84,102 Q 118,76 152,100" marker-end="url(#arr)"/>
    <path d="M 203,139 Q 234,167 203,197" marker-end="url(#arr)"/>
    <path d="M 157,197 Q 126,167 157,139" marker-end="url(#arr)"/>
    <path d="M 204,102 Q 238,76 272,100" marker-end="url(#arr)"/>
  </g>
  <text x="96" y="86" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">①</text>
  <text x="238" y="162" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">②</text>
  <text x="116" y="162" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">③</text>
  <text x="254" y="86" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">④</text>

  <!-- nodes of graph 1 -->
  <g filter="url(#rough2)">
    <circle cx="80" cy="125" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="80" y="130" text-anchor="middle" font-size="12" fill="#333">0</text>
    <circle cx="180" cy="125" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="180" y="130" text-anchor="middle" font-size="12" fill="#333">1</text>
    <circle cx="280" cy="125" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="130" text-anchor="middle" font-size="12" fill="#333">3</text>
    <circle cx="180" cy="212" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="180" y="217" text-anchor="middle" font-size="12" fill="#333">2</text>
    <circle cx="515" cy="80" r="16" fill="#f0f0f0" stroke="#999" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="515" y="85" text-anchor="middle" font-size="12" fill="#777">4</text>
  </g>
  <text x="515" y="112" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">孤立点（无边）</text>

  <!-- query result boxes of example 1 -->
  <g filter="url(#rough2)">
    <rect x="360" y="146" width="228" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="474" y="164" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5e24">[0,3] 同分量 → AND = 7 &amp; 7 &amp; 1 = 1</text>
    <rect x="360" y="182" width="228" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="474" y="200" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a04040">[3,4] 4 为孤立点 → -1</text>
  </g>

  <!-- AND chain of example 1 -->
  <text x="40" y="250" font-size="10.5" fill="#333" filter="url(#rough2)">旅途：0 →1(7) →2(1) →1(1) →3(7)</text>
  <text x="40" y="268" font-size="10.5" fill="#333" filter="url(#rough2)">代价 = 7 &amp; 1 &amp; 1 &amp; 7 = <tspan font-weight="bold" fill="#b85450">1</tspan> = 分量全边 AND（7 &amp; 7 &amp; 1）✓</text>

  <line x1="40" y1="286" x2="580" y2="286" stroke="#ddd" stroke-width="1" stroke-dasharray="5 5" filter="url(#rough2)"/>

  <!-- ================= 示例 2 ================= -->
  <text x="40" y="308" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">示例 2：n = 3, query = [[1,2]]（1–2 间有重边）</text>

  <!-- edges of graph 2 -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.6" fill="none">
    <line x1="116" y1="352" x2="279" y2="352"/>
    <line x1="112" y1="363" x2="183" y2="426"/>
    <path d="M 283,362 Q 252,408 210,428"/>
    <path d="M 278,366 Q 246,438 206,452"/>
  </g>
  <text x="197" y="342" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">15</text>
  <text x="128" y="392" font-size="11" fill="#446688" filter="url(#rough2)">7</text>
  <text x="262" y="392" font-size="11" fill="#446688" filter="url(#rough2)">6</text>
  <text x="238" y="447" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <!-- walk arrows of graph 2 -->
  <g filter="url(#rough2)" fill="none" stroke="#b85450" stroke-width="2">
    <path d="M 275,372 Q 245,437 213,449" marker-end="url(#arr)"/>
    <path d="M 213,425 Q 252,402 280,364" marker-end="url(#arr)"/>
  </g>
  <text x="272" y="417" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">①③</text>
  <text x="222" y="401" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">②</text>

  <!-- nodes of graph 2 -->
  <g filter="url(#rough2)">
    <circle cx="100" cy="352" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="100" y="357" text-anchor="middle" font-size="12" fill="#333">0</text>
    <circle cx="295" cy="352" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="295" y="357" text-anchor="middle" font-size="12" fill="#333">1</text>
    <circle cx="195" cy="438" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="195" y="443" text-anchor="middle" font-size="12" fill="#333">2</text>
  </g>

  <!-- right panel of example 2 -->
  <g filter="url(#rough2)">
    <rect x="400" y="336" width="195" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="497" y="354" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5e24">分量全边 AND</text>
    <text x="497" y="372" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5e24">= 7 &amp; 15 &amp; 6 &amp; 1 = 0</text>
    <rect x="400" y="392" width="195" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="497" y="411" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688">[1,2] → 0 ✓ 已是非负下界</text>
  </g>

  <text x="40" y="472" font-size="10.5" fill="#333" filter="url(#rough2)">旅途：1 →2(1) →1(6) →2(1)，代价 = 1 &amp; 6 &amp; 1 = 0（重复走边也不吃亏）</text>
</svg>
