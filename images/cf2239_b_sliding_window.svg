<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="340" fill="#fafafa"/>

  <text x="350" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">视野滑窗：换到下一个人只要 4 次加减（以 d = 2 为例）</text>

  <text x="54" y="106" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">win(i)</text>
  <rect x="60" y="78" width="84" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="160" y="78" width="84" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="260" y="78" width="84" height="46" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="360" y="78" width="84" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="460" y="78" width="84" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="560" y="78" width="84" height="46" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="102" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a[i−2]</text>
  <text x="202" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a[i−1]</text>
  <text x="302" y="107" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">a[i]</text>
  <text x="402" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a[i+1]</text>
  <text x="502" y="107" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a[i+2]</text>
  <text x="602" y="107" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">a[i+3]</text>

  <text x="102" y="148" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">移出 −a[i−2]</text>
  <text x="402" y="148" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">移出 −a[i+1]</text>

  <text x="54" y="214" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">win(i+1)</text>
  <rect x="60" y="186" width="84" height="46" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="160" y="186" width="84" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="260" y="186" width="84" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="360" y="186" width="84" height="46" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="460" y="186" width="84" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="560" y="186" width="84" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="102" y="215" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">a[i−2]</text>
  <text x="202" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a[i−1]</text>
  <text x="302" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a[i]</text>
  <text x="402" y="215" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">a[i+1]</text>
  <text x="502" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a[i+2]</text>
  <text x="602" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a[i+3]</text>

  <text x="302" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">移入 +a[i]</text>
  <text x="602" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">移入 +a[i+3]</text>

  <text x="350" y="296" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">win(i+1) = win(i) − a[i−2] − a[i+1] + a[i] + a[i+3]</text>
  <text x="350" y="322" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">下标一律对 n 取模，先算 win(1) 再推 n−1 步</text>
</svg>
