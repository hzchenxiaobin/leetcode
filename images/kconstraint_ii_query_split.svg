<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="500" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">查询 [l, r]：每个右端点 b 贡献 b − max(l, L[b]) + 1</text>
  <path d="M 140 42 Q 340 50 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="60" y="70" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">以 s = "010101"、k = 1、查询 [l, r] = [1, 4] 为例（分界 m = 3）</text>

  <g filter="url(#sk)" fill="#ffffff" stroke="#446688" stroke-width="1.2">
    <rect x="120" y="88" width="44" height="36" rx="4"/>
    <rect x="164" y="88" width="44" height="36" rx="4"/>
    <rect x="208" y="88" width="44" height="36" rx="4"/>
    <rect x="252" y="88" width="44" height="36" rx="4"/>
    <rect x="296" y="88" width="44" height="36" rx="4"/>
    <rect x="340" y="88" width="44" height="36" rx="4"/>
  </g>
  <g filter="url(#sk)" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="142" y="111">0</text>
    <text x="186" y="111">1</text>
    <text x="230" y="111">0</text>
    <text x="274" y="111">1</text>
    <text x="318" y="111">0</text>
    <text x="362" y="111">1</text>
  </g>
  <g filter="url(#sk)" font-size="10" fill="#777" text-anchor="middle">
    <text x="142" y="140">b=0</text>
    <text x="186" y="140">b=1</text>
    <text x="230" y="140">b=2</text>
    <text x="274" y="140">b=3</text>
    <text x="318" y="140">b=4</text>
    <text x="362" y="140">b=5</text>
  </g>
  <g filter="url(#sk)"><rect x="162" y="82" width="182" height="48" rx="7" fill="none" stroke="#c98a2b" stroke-width="2.4"/></g>
  <text x="352" y="102" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">[l, r] = [1, 4]</text>
  <text x="352" y="120" font-size="10.5" fill="#7a5415" filter="url(#sk)">l 在格 1，r 在格 4</text>

  <text x="208" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a" filter="url(#sk)">左区：b ∈ [l, m)，L[b] &lt; l</text>
  <text x="298" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">右区：b ∈ [m, r]，L[b] ≥ l</text>
  <g filter="url(#sk)"><path d="M 252 168 L 252 290" stroke="#8a97a5" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/></g>

  <g filter="url(#sk)"><path d="M 120 203 L 120 195 L 208 195 L 208 203" stroke="#b85450" stroke-width="2" fill="none" stroke-linecap="round"/></g>
  <text x="214" y="199" font-size="10.5" fill="#b03a3a" filter="url(#sk)">b=1：窗口 [0,1]，L=0 &lt; l ✗</text>
  <g filter="url(#sk)"><path d="M 120 230 L 120 222 L 252 222 L 252 230" stroke="#b85450" stroke-width="2" fill="none" stroke-linecap="round"/></g>
  <text x="260" y="226" font-size="10.5" fill="#b03a3a" filter="url(#sk)">b=2：窗口 [0,2]，L=0 &lt; l ✗</text>
  <g filter="url(#sk)"><path d="M 164 257 L 164 249 L 296 249 L 296 257" stroke="#4a8e4a" stroke-width="2" fill="none" stroke-linecap="round"/></g>
  <text x="304" y="253" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">b=3：窗口 [1,3]，L=1 ≥ l ✓</text>
  <g filter="url(#sk)"><path d="M 208 284 L 208 276 L 340 276 L 340 284" stroke="#4a8e4a" stroke-width="2" fill="none" stroke-linecap="round"/></g>
  <text x="348" y="280" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">b=4：窗口 [2,4]，L=2 ≥ l ✓</text>
  <text x="252" y="302" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">分界 m = 3（二分定位）</text>

  <g filter="url(#sk)"><rect x="40" y="316" width="300" height="100" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="190" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">左区合计：等差数列求和</text>
  <text x="190" y="362" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">合法窗口完全盖住 [l, b]，贡献 b − l + 1</text>
  <text x="190" y="382" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">T(m−l) = (m−l)(m−l+1) / 2</text>
  <text x="190" y="402" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">本例 T(2) = 3</text>

  <g filter="url(#sk)"><rect x="356" y="316" width="284" height="100" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="498" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">右区合计：前缀和作差</text>
  <text x="498" y="362" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">左端下限是 L[b] 不是 l，贡献 p[b]</text>
  <text x="498" y="382" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">S[r] − S[m−1]</text>
  <text x="498" y="402" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">本例 S[4] − S[2] = 12 − 6 = 6</text>

  <g filter="url(#sk)"><rect x="40" y="432" width="600" height="54" rx="8" fill="#f4f6f8" stroke="#8a97a5" stroke-width="1.3"/></g>
  <text x="340" y="454" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#sk)">L 单调不降 ⟹ 「L[b] ≥ l」随 b 单调 ⟹ 二分定位 m，单次查询 O(log n)</text>
  <text x="340" y="474" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">ans = T(m−l) + S[r] − S[m−1]，本例 3 + 6 = 9 ✓</text>
</svg>
