<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：BFS + 双奇偶类并查集「下一个未访问」</text>

  <!-- left note -->
  <rect x="10" y="44" width="96" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="58" y="64" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">n ≤ 1e5</text>
  <text x="58" y="80" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">朴素 BFS O(n²)</text>
  <text x="58" y="96" text-anchor="middle" font-size="11" fill="#7a5c1e" filter="url(#rough2)">必超时</text>
  <path d="M 106 72 L 118 66" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="118" y="44" width="330" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="61" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 初始化：把 banned 与 p 移出所在奇偶类的候选集</text>
  <text x="283" y="79" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans[p] = 0，队列 = [p]</text>

  <path d="M 283 88 L 283 108" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="118" y="110" width="330" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 出队 i（d = ans[i] + 1）</text>
  <text x="283" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">s_lo = max(0, i−k+1)，s_hi = min(i, n−k)</text>
  <text x="283" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⇒ 落点区间 [t_min, t_max] 与目标奇偶类 c</text>

  <path d="M 283 168 L 283 188" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="118" y="190" width="330" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="207" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ j = find(c, t_min &gt;&gt; 1)：类 c 中 ≥ t_min 的</text>
  <text x="283" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">首个未访问落点（路径减半压缩）</text>

  <path d="M 283 234 L 283 254" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="118" y="256" width="330" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="283" y="273" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ 循环：只要 j ≤ (t_max &gt;&gt; 1)：</text>
  <text x="283" y="289" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans[2j+c] = d，入队，remove(c, j)</text>
  <text x="283" y="305" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">再 j = find(c, j+1) 向右续扫</text>

  <path d="M 283 314 L 283 334" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 5 -->
  <rect x="118" y="336" width="330" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="283" y="353" text-anchor="middle" font-size="11.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">⑤ 队列空 → 返回 ans（未达位置保持 −1）</text>
  <text x="283" y="371" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">每个 i 的邻居 = 等差区间 ∩ 候选集</text>

  <!-- loop back arrow -->
  <path d="M 112 285 C 62 285, 62 139, 112 139" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="204" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">落点</text>
  <text x="70" y="218" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">扫完</text>

  <!-- right note 1: amortization -->
  <rect x="458" y="110" width="94" height="76" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="505" y="128" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">摊还关键</text>
  <text x="505" y="144" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">每个位置至多</text>
  <text x="505" y="158" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">被 remove 一次</text>
  <text x="505" y="172" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">总代价 O(n·α)</text>
  <path d="M 458 148 L 448 145" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <!-- right note 2: find -->
  <rect x="458" y="198" width="94" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="505" y="218" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">find 路径减半</text>
  <text x="505" y="234" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">单次近 O(1)</text>
  <path d="M 458 222 L 448 218" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <!-- right note 3: ordered set alternative -->
  <rect x="458" y="316" width="94" height="72" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="505" y="334" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">替身写法</text>
  <text x="505" y="350" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">有序集合</text>
  <text x="505" y="364" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">lower_bound 删点</text>
  <text x="505" y="378" text-anchor="middle" font-size="10.5" fill="#7a5c1e" filter="url(#rough2)">O(n log n)</text>
  <path d="M 458 336 L 448 320" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
</svg>
