<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">官方示例走查：100 元账户的扣款演算</text>

  <g filter="url(#rough2)">
    <!-- 用例 1 -->
    <rect x="36" y="52" width="448" height="84" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="60" y="80" font-size="13" fill="#446688">用例 1：purchaseAmount = 9</text>
    <text x="60" y="104" font-size="12.5" fill="#555">(9 + 5) / 10 = 1 → rounded = 10；余额 = 100 − 10 =</text>
    <text x="424" y="106" font-size="16" fill="#1d5c1a">90</text>
    <text x="60" y="126" font-size="11.5" fill="#888">最近的倍数：|10−9| = 1 &lt; |0−9| = 9</text>

    <!-- 用例 2 -->
    <rect x="36" y="150" width="448" height="84" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" fill-opacity="0.4"/>
    <text x="60" y="178" font-size="13" fill="#b85450">用例 2：purchaseAmount = 15（平局！）</text>
    <text x="60" y="202" font-size="12.5" fill="#555">(15 + 5) / 10 = 2 → rounded = 20；余额 = 100 − 20 =</text>
    <text x="424" y="204" font-size="16" fill="#b85450">80</text>
    <text x="60" y="224" font-size="11.5" fill="#888">10 和 20 距离都是 5 → 题目规定取较大者 20</text>

    <!-- 用例 3 -->
    <rect x="36" y="248" width="448" height="84" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="60" y="276" font-size="13" fill="#4a7a3a">用例 3（官方隐藏用例）：purchaseAmount = 10</text>
    <text x="60" y="300" font-size="12.5" fill="#555">(10 + 5) / 10 = 1 → rounded = 10；余额 = 100 − 10 =</text>
    <text x="424" y="302" font-size="16" fill="#1d5c1a">90</text>
    <text x="60" y="324" font-size="11.5" fill="#888">10 本身就是 10 的倍数，距离为 0，原样支付</text>
  </g>
</svg>
