<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">示例 1：0→1 花 3，再用节点 1 的开关反走 3→1（成本 2）到 3</text>
  <path d="M 80 150 L 250 120" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="171.0" y="129.0" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <path d="M 430 170 L 250 120" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346.0" y="139.0" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <path d="M 250 220 L 430 170" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346.0" y="189.0" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <path d="M 80 150 L 250 220" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="171.0" y="179.0" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <path d="M 254 142 L 410 164" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="340" y="128" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">反走 2·1 = 2</text>
  <rect x="60" y="130" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80.0" y="155.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="230" y="100" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250.0" y="125.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="230" y="200" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250.0" y="225.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="410" y="150" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430.0" y="175.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="80" y="106" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <rect x="50" y="258" width="600" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="284" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">路径 0 → 1 → 3：3 + 2·1 = 5（另一条 0→2→3 成本 2+4 = 6）</text>
  <text x="350" y="306" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">答案 5</text>
  <rect x="50" y="330" width="600" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="356" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">示例 2 不用反转：0→2→1→3 = 1+1+1 = 3</text>
  <text x="350" y="376" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">Dijkstra 会自己在「正常弧 / 反向弧」中挑最便宜的走法</text>
</svg>
