<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">遇 0 清空：只维护最近一次 0 之后的前缀积</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">流 [3, 0, 2, 5, 4, 8]，0 之前的数字再也不可能出现在任何非零答案里</text>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold">
    <rect x="99" y="70" width="52" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="161" y="70" width="52" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="223" y="70" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="285" y="70" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="347" y="70" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="409" y="70" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="125" y="100" fill="#8a3a36">3</text>
    <text x="187" y="100" fill="#8a3a36">0</text>
    <text x="249" y="100" fill="#3a5a30">2</text>
    <text x="311" y="100" fill="#3a5a30">5</text>
    <text x="373" y="100" fill="#3a5a30">4</text>
    <text x="435" y="100" fill="#3a5a30">8</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#999">
    <text x="125" y="130">丢弃</text>
    <text x="187" y="130">0</text>
    <text x="249" y="130">0</text>
    <text x="311" y="130">1</text>
    <text x="373" y="130">2</text>
    <text x="435" y="130">3</text>
  </g>

  <path d="M 219 58 L 219 136" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="224" y="60" font-size="10" fill="#b85450" filter="url(#rough2)">从这里重新开始</text>

  <text x="280" y="162" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">红色段被整体丢弃，绿色段（长度 L = 4）才是有效数据</text>

  <path d="M 280 170 L 280 188" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="130" y="196" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="192" y="196" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="254" y="196" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="316" y="196" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="378" y="196" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="156" y="224" fill="#3a4a66">1</text>
    <text x="218" y="224" fill="#3a4a66">2</text>
    <text x="280" y="224" fill="#3a4a66">10</text>
    <text x="342" y="224" fill="#3a4a66">40</text>
    <text x="404" y="224" fill="#3a4a66">320</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#888">
    <text x="156" y="254">P[0]</text>
    <text x="218" y="254">P[1]</text>
    <text x="280" y="254">P[2]</text>
    <text x="342" y="254">P[3]</text>
    <text x="404" y="254">P[4]</text>
  </g>

  <rect x="34" y="276" width="240" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="46" y="296" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">k ≤ L 时：落在绿色段内</text>
  <text x="46" y="316" font-size="11" fill="#555" filter="url(#rough2)">答案 = P[L] / P[L − k]</text>
  <text x="46" y="332" font-size="10" fill="#888" filter="url(#rough2)">除法是精确的，因为 P[L] = P[L−k] × 末 k 项之积</text>

  <rect x="290" y="276" width="236" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="302" y="296" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">k &gt; L 时：窗口一定跨过那个 0</text>
  <text x="302" y="316" font-size="11" fill="#555" filter="url(#rough2)">答案恒为 0，无需再算</text>
  <text x="302" y="332" font-size="10" fill="#888" filter="url(#rough2)">因此「段长 L」必须和前缀积一起维护</text>

  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">核心：把 0 当成「断点」，每个断点之后重新累积前缀积，查询就退化成一次除法</text>
</svg>
