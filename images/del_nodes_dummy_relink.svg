<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">删除 = 让 prev「绕过」cur：哨兵 + 双指针一遍扫</text>
  <path d="M 130 38 Q 320 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums chip -->
  <g filter="url(#sk)">
    <rect x="46" y="54" width="176" height="28" rx="14" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="134" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">S = {1,2,3}（要删的值）</text>

  <!-- bypass arc -->
  <g filter="url(#sk)">
    <path d="M 88 102 Q 96 56 260 52 Q 424 58 432 102" stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrr)"/>
  </g>
  <text x="260" y="44" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">prev-&gt;next = cur-&gt;next：绕过被删节点</text>

  <!-- linked list -->
  <g filter="url(#sk)">
    <rect x="56" y="104" width="64" height="40" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="88" y="129" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">dummy</text>
  <g filter="url(#sk)">
    <rect x="168" y="104" width="48" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="248" y="104" width="48" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="328" y="104" width="48" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="408" y="104" width="48" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="488" y="104" width="48" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="192" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">1</text>
  <text x="272" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">2</text>
  <text x="352" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">3</text>
  <text x="432" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="512" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">5</text>
  <text x="556" y="132" text-anchor="middle" font-size="15" fill="#888888">∅</text>
  <g filter="url(#sk)">
    <path d="M 120 124 L 164 124" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 216 124 L 244 124" stroke="#9a9a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 296 124 L 324 124" stroke="#9a9a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 376 124 L 404 124" stroke="#9a9a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 456 124 L 484 124" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 536 124 L 550 124" stroke="#9a9a8a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="192" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">删</text>
  <text x="272" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">删</text>
  <text x="352" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">删</text>
  <text x="432" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">留</text>
  <text x="512" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">留</text>

  <!-- prev / cur pointers -->
  <g filter="url(#sk)">
    <path d="M 90 174 L 90 150" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="66" y="176" width="48" height="24" rx="12" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="90" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">prev</text>
  <g filter="url(#sk)">
    <path d="M 192 174 L 192 150" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="172" y="176" width="40" height="24" rx="12" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="192" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">cur</text>
  <text x="252" y="192" font-size="12" fill="#666666">cur 连续命中时 prev 纹丝不动；cur=4 转正后 prev 才前进</text>

  <!-- three panels -->
  <g filter="url(#sk)">
    <rect x="40" y="216" width="178" height="140" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="58" y="246" font-size="13" font-weight="bold" fill="#2b6e9e">① 哨兵 dummy</text>
  <text x="58" y="274" font-size="11.5" fill="#445566">头节点要删？不用特判</text>
  <text x="58" y="296" font-size="11.5" fill="#445566">结果链头挂在哨兵后</text>
  <text x="58" y="318" font-size="11.5" fill="#445566">统一返回 dummy-&gt;next</text>

  <g filter="url(#sk)">
    <rect x="231" y="216" width="178" height="140" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="249" y="246" font-size="13" font-weight="bold" fill="#8a6415">② 命中：绕过去</text>
  <text x="249" y="274" font-size="11.5" fill="#7a5a20">prev-&gt;next = cur-&gt;next</text>
  <text x="249" y="296" font-size="11.5" fill="#7a5a20">被删节点出局</text>
  <text x="249" y="318" font-size="11.5" fill="#7a5a20">prev 原地不动</text>

  <g filter="url(#sk)">
    <rect x="422" y="216" width="178" height="140" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="440" y="246" font-size="13" font-weight="bold" fill="#2e6e2e">③ 未命中：转正</text>
  <text x="440" y="274" font-size="11.5" fill="#3a5a34">prev = cur</text>
  <text x="440" y="296" font-size="11.5" fill="#3a5a34">cur 接入结果链</text>
  <text x="440" y="318" font-size="11.5" fill="#3a5a34">随后 cur 前进一步</text>
</svg>
