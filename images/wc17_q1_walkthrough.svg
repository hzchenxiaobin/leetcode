<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：root = [1, null, 2, 2]</text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">中序访问顺序 1 &#8594; 2 &#8594; 2，只需一次扫描</text>

  <!-- 访问顺序 -->
  <text x="56" y="80" font-size="10" fill="#666" filter="url(#rough2)">访问</text>
  <rect x="96" y="66" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="119" y="84" text-anchor="middle" font-size="11" fill="#5a4a20" filter="url(#rough2)">1</text>
  <path d="M 146 79 L 160 79" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="166" y="66" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="189" y="84" text-anchor="middle" font-size="11" fill="#2f5228" filter="url(#rough2)">2</text>
  <path d="M 216 79 L 230 79" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="236" y="66" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="259" y="84" text-anchor="middle" font-size="11" fill="#2f5228" filter="url(#rough2)">2</text>

  <!-- 表头 -->
  <rect x="56" y="112" width="464" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="132" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">访问值</text>
  <text x="160" y="132" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">cnt</text>
  <text x="230" y="132" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">best</text>
  <text x="330" y="132" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">res</text>
  <text x="450" y="132" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">本次动作</text>

  <!-- 第 1 行 -->
  <rect x="56" y="142" width="464" height="38" fill="#fffef7" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="160" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="330" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="450" y="166" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">新值，cnt = 1 &gt; best</text>

  <!-- 第 2 行 -->
  <rect x="56" y="182" width="464" height="38" fill="#fffef7" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="85" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="330" y="206" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1, 2]</text>
  <text x="450" y="206" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">cnt == best &#8594; 追加</text>

  <!-- 第 3 行 -->
  <rect x="56" y="222" width="464" height="38" fill="#f3f8ef" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="85" y="246" text-anchor="middle" font-size="11" fill="#2f5228" filter="url(#rough2)">2</text>
  <text x="160" y="246" text-anchor="middle" font-size="11" fill="#2f5228" filter="url(#rough2)">2</text>
  <text x="230" y="246" text-anchor="middle" font-size="11" fill="#2f5228" filter="url(#rough2)">2</text>
  <text x="330" y="246" text-anchor="middle" font-size="11" fill="#2f5228" font-weight="bold" filter="url(#rough2)">[2]</text>
  <text x="450" y="246" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">cnt &gt; best &#8594; 清空重来</text>

  <text x="56" y="278" font-size="9.5" fill="#888" filter="url(#rough2)">注：res 中的领跑者被「追平」才追加，「超越」时整批作废后重新收集。</text>

  <!-- 底部规则 -->
  <rect x="40" y="292" width="480" height="94" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="312" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">三支状态的转移规则</text>
  <text x="56" y="331" font-size="10" fill="#444" filter="url(#rough2)">cnt &gt; best：出现更强的候选 &#8594; best = cnt，res 清空后放入当前值；</text>
  <text x="56" y="349" font-size="10" fill="#444" filter="url(#rough2)">cnt == best：并列众数 &#8594; 把当前值追加进 res（顺序任意，无需去重）；</text>
  <text x="56" y="367" font-size="10" fill="#444" filter="url(#rough2)">cnt &lt; best：不可能成为众数 &#8594; 什么都不做。</text>
</svg>
