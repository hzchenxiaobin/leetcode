<svg xmlns="http://www.w3.org/2000/svg" width="660" height="450" viewBox="0 0 660 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="450" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：rev(k) ≥ 0 ⟹ 解只藏在 [0, num] 里</text>
  <path d="M 150 38 Q 330 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- equation k + rev(k) = num -->
  <g filter="url(#sk)"><rect x="100" y="64" width="100" height="46" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/></g>
  <text x="150" y="93" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">k</text>
  <text x="223" y="94" text-anchor="middle" font-size="20" fill="#2b2b2b" filter="url(#sk)">+</text>
  <g filter="url(#sk)"><rect x="252" y="64" width="124" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="314" y="93" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">rev(k)</text>
  <text x="400" y="94" text-anchor="middle" font-size="20" fill="#2b2b2b" filter="url(#sk)">=</text>
  <g filter="url(#sk)"><rect x="428" y="64" width="100" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="478" y="93" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">num</text>

  <!-- deduction box -->
  <g filter="url(#sk)"><rect x="100" y="134" width="428" height="58" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="116" y="157" font-size="12.5" fill="#555" filter="url(#sk)">两个加数都非负：k = num − rev(k) ≤ num</text>
  <text x="116" y="179" font-size="12.5" fill="#555" filter="url(#sk)">解若存在必落在 [0, num] —— 扫完整个区间即可判定存在性</text>

  <!-- number line -->
  <text x="100" y="232" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">把候选 k 钉在数轴上：</text>
  <g filter="url(#sk)"><rect x="100" y="250" width="400" height="28" rx="4" fill="#e8f0fa" opacity="0.6"/></g>
  <g filter="url(#sk)"><path d="M 100 264 L 556 264" stroke="#3a3a3a" stroke-width="2" marker-end="url(#ar)"/></g>
  <g filter="url(#sk)"><path d="M 100 257 L 100 271" stroke="#3a3a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><path d="M 500 257 L 500 271" stroke="#3a3a3a" stroke-width="1.6"/></g>
  <text x="100" y="292" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">0</text>
  <text x="500" y="292" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">num</text>
  <text x="300" y="292" text-anchor="middle" font-size="11.5" fill="#4a8edb" filter="url(#sk)">枚举范围（含两端）</text>
  <text x="531" y="256" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>
  <text x="534" y="310" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">k &gt; num 无解</text>

  <!-- panel A: leading zeros -->
  <g filter="url(#sk)"><rect x="48" y="326" width="282" height="110" rx="10" fill="#f0f7f1" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="64" y="350" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">前导零：天然丢弃 ✓</text>
  <text x="64" y="372" font-size="11.5" fill="#444" filter="url(#sk)">rev(140) = 041 = 41</text>
  <text x="64" y="392" font-size="11.5" fill="#444" filter="url(#sk)">数值反转遇末尾 0 原地踏步</text>
  <text x="64" y="412" font-size="11.5" fill="#444" filter="url(#sk)">int("041") 同样自动得 41</text>

  <!-- panel B: symmetry broken by trailing zeros -->
  <g filter="url(#sk)"><rect x="352" y="326" width="272" height="110" rx="10" fill="#fdf1f0" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="368" y="350" font-size="13" font-weight="bold" fill="#a33a35" filter="url(#sk)">末尾零打破对称：不能砍半 ✗</text>
  <text x="368" y="372" font-size="11.5" fill="#444" filter="url(#sk)">140 + 041 = 181 ✓（k=140 命中）</text>
  <text x="368" y="392" font-size="11.5" fill="#444" filter="url(#sk)">41 + 14 = 55 ✗（对称伙伴不命中）</text>
  <text x="368" y="412" font-size="11.5" fill="#444" filter="url(#sk)">rev(rev(140)) = 14 ≠ 140</text>
</svg>
