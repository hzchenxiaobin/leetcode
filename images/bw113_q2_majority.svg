<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">多数抵消：只看最大频次 f</text>

  <!-- 频次条形图：nums = [2,3,4,4,4] -->
  <text x="60" y="66" font-size="13" fill="#666" filter="url(#rough2)">示例 [2,3,4,4,4]，n = 5：</text>
  <rect x="90"  y="140" width="44" height="80" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="190" y="140" width="44" height="80" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="290" y="60"  width="44" height="160" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="112" y="236" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2（1 个）</text>
  <text x="212" y="236" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3（1 个）</text>
  <text x="312" y="236" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4（3 个）</text>
  <text x="112" y="70" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">f=1</text>
  <text x="212" y="70" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">f=1</text>
  <text x="312" y="50" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">众数 f=3</text>

  <!-- 右侧两个结论框 -->
  <rect x="380" y="52" width="118" height="96" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="439" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">2f &gt; n</text>
  <text x="439" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">剩 2f − n</text>
  <text x="439" y="126" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">众数删不完</text>

  <rect x="380" y="168" width="118" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="439" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2f ≤ n</text>
  <text x="439" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">剩 n mod 2</text>
  <text x="439" y="242" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">可全部配对</text>

  <!-- 底部解释 -->
  <rect x="36" y="272" width="448" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">每次删除的数对值必须严格不同 → 每次至多带走 1 个众数</text>
  <text x="260" y="314" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2×3 &gt; 5：剩余 6 − 5 = 1 个 4 删不掉 → 答案 1</text>
</svg>
