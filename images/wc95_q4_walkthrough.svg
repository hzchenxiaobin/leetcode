<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">示例 2：n = 10，minProfit = 5，group = [2,3,5]，profit = [6,7,8]</text>

  <rect x="24" y="46" width="632" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="44" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">处理</text>
  <text x="150" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">来源格 → 目标格</text>
  <text x="430" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">新增方案</text>
  <text x="560" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">含义</text>

  <rect x="24" y="74" width="632" height="28" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="93" font-size="11" fill="#444" filter="url(#rough2)">工作 0</text>
  <text x="146" y="93" font-size="11" fill="#444" filter="url(#rough2)">dp[0][0] → dp[2][5]</text>
  <text x="436" y="93" font-size="11" fill="#444" filter="url(#rough2)">+1</text>
  <text x="548" y="93" font-size="11" fill="#444" filter="url(#rough2)">{0}</text>

  <rect x="24" y="102" width="632" height="28" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="121" font-size="11" fill="#444" filter="url(#rough2)">工作 1</text>
  <text x="146" y="121" font-size="11" fill="#444" filter="url(#rough2)">dp[0][0] → dp[3][5]</text>
  <text x="436" y="121" font-size="11" fill="#444" filter="url(#rough2)">+1</text>
  <text x="548" y="121" font-size="11" fill="#444" filter="url(#rough2)">{1}</text>

  <rect x="24" y="130" width="632" height="28" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="149" font-size="11" fill="#444" filter="url(#rough2)">工作 1</text>
  <text x="146" y="149" font-size="11" fill="#444" filter="url(#rough2)">dp[2][5] → dp[5][5]</text>
  <text x="436" y="149" font-size="11" fill="#444" filter="url(#rough2)">+1</text>
  <text x="548" y="149" font-size="11" fill="#444" filter="url(#rough2)">{0,1}</text>

  <rect x="24" y="158" width="632" height="28" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="177" font-size="11" fill="#444" filter="url(#rough2)">工作 2</text>
  <text x="146" y="177" font-size="11" fill="#444" filter="url(#rough2)">dp[0][0] → dp[5][5]</text>
  <text x="436" y="177" font-size="11" fill="#444" filter="url(#rough2)">+1</text>
  <text x="548" y="177" font-size="11" fill="#444" filter="url(#rough2)">{2}</text>

  <rect x="24" y="186" width="632" height="28" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="205" font-size="11" fill="#444" filter="url(#rough2)">工作 2</text>
  <text x="146" y="205" font-size="11" fill="#444" filter="url(#rough2)">dp[2][5] → dp[7][5]</text>
  <text x="436" y="205" font-size="11" fill="#444" filter="url(#rough2)">+1</text>
  <text x="548" y="205" font-size="11" fill="#444" filter="url(#rough2)">{0,2}</text>

  <rect x="24" y="214" width="632" height="28" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="233" font-size="11" fill="#444" filter="url(#rough2)">工作 2</text>
  <text x="146" y="233" font-size="11" fill="#444" filter="url(#rough2)">dp[3][5] → dp[8][5]</text>
  <text x="436" y="233" font-size="11" fill="#444" filter="url(#rough2)">+1</text>
  <text x="548" y="233" font-size="11" fill="#444" filter="url(#rough2)">{1,2}</text>

  <rect x="24" y="242" width="632" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="40" y="261" font-size="11" fill="#8a6410" filter="url(#rough2)">工作 2</text>
  <text x="146" y="261" font-size="11" fill="#8a6410" filter="url(#rough2)">dp[5][5] → dp[10][5]</text>
  <text x="436" y="261" font-size="11" fill="#8a6410" filter="url(#rough2)">+1</text>
  <text x="548" y="261" font-size="11" fill="#8a6410" filter="url(#rough2)">{0,1,2}</text>

  <text x="24" y="300" font-size="12" fill="#333" filter="url(#rough2)">答案 = dp[2][5] + dp[3][5] + dp[5][5] + dp[7][5] + dp[8][5] + dp[10][5] = 7</text>

  <rect x="24" y="316" width="300" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="174" y="340" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">注意 dp[5][5] 最终为 2（{0,1} 与 {2}），</text>
  <text x="174" y="362" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">但它在 j = 5 时只被读到 1 次（值为 1）</text>
  <text x="174" y="382" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">——这就是「倒序更新」的意义</text>

  <rect x="340" y="316" width="316" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="498" y="340" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">列求和而非取单格：员工数可以少于 n，</text>
  <text x="498" y="362" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">题目只要求「最多 n 名员工」</text>
  <text x="498" y="382" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">另：minProfit = 0 时「空计划」也算一种</text>
</svg>
