<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 474" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="474" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：两遍扫描 + 集合去重</text>
  <rect x="36" y="52" width="232" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="152" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 洪水填充</text>
  <text x="152" y="89" text-anchor="middle" font-size="9.3" fill="#444" filter="url(#rough2)">遍历每个格子 (i, j)</text>
  <text x="152" y="101" text-anchor="middle" font-size="9.3" fill="#444" filter="url(#rough2)">若 grid=1 且未标号：BFS 扩散</text>
  <text x="152" y="113" text-anchor="middle" font-size="9.3" fill="#444" filter="url(#rough2)">整座岛标同一个 id，计数 = 面积</text>
  <path d="M 152 118 L 152 142" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="144" width="232" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="152" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 枚举每个 0</text>
  <text x="152" y="181" text-anchor="middle" font-size="9.3" fill="#444" filter="url(#rough2)">看上下左右四个邻居</text>
  <text x="152" y="193" text-anchor="middle" font-size="9.3" fill="#444" filter="url(#rough2)">收集它们已标好的岛屿 id</text>
  <text x="152" y="205" text-anchor="middle" font-size="9.3" fill="#444" filter="url(#rough2)">越界 / 邻居为 0 直接跳过</text>
  <path d="M 152 210 L 152 234" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="236" width="232" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="152" y="256" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">③ 去重后求和</text>
  <text x="152" y="273" text-anchor="middle" font-size="9.3" fill="#444" filter="url(#rough2)">把 id 扔进 set，重复只留一个</text>
  <text x="152" y="285" text-anchor="middle" font-size="9.3" fill="#444" filter="url(#rough2)">候选面积 = 1 + Σ area[id]</text>
  <text x="152" y="297" text-anchor="middle" font-size="9.3" fill="#444" filter="url(#rough2)">加 1 是把 0 本身变成 1</text>
  <path d="M 152 302 L 152 326" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="328" width="232" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="152" y="348" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">④ 更新答案</text>
  <text x="152" y="365" text-anchor="middle" font-size="9.3" fill="#444" filter="url(#rough2)">best = max(best, 候选面积)</text>
  <text x="152" y="377" text-anchor="middle" font-size="9.3" fill="#444" filter="url(#rough2)">没有 0 时 best = 最大岛面积</text>
  <text x="152" y="389" text-anchor="middle" font-size="9.3" fill="#444" filter="url(#rough2)">全程只需 O(n²)</text>
  <text x="414" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">反例：U 形海湾</text>
  <text x="414" y="78" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">同一座岛被数 3 次</text>
  <rect x="356" y="92" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="374.0" y="114.6" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">A</text>
  <rect x="396" y="92" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="414.0" y="114.6" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">A</text>
  <rect x="436" y="92" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="454.0" y="114.6" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">A</text>
  <rect x="356" y="132" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="374.0" y="154.6" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">A</text>
  <rect x="396" y="132" width="36" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="414.0" y="154.6" text-anchor="middle" font-size="12" fill="#c0c0c0" filter="url(#rough2)">0</text>
  <rect x="436" y="132" width="36" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="356" y="172" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="374.0" y="194.6" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">A</text>
  <rect x="396" y="172" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="414.0" y="194.6" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">A</text>
  <rect x="436" y="172" width="36" height="36" fill="#ffffff" stroke="#dddddd" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="393" y="129" width="42" height="42" fill="none" stroke="#d6a040" stroke-width="2.2" rx="6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="414" y="236" text-anchor="middle" font-size="9.6" fill="#444" filter="url(#rough2)">翻转中心的 0：上 / 左 / 下</text>
  <text x="414" y="252" text-anchor="middle" font-size="9.6" fill="#444" filter="url(#rough2)">全都是同一座岛 A（面积 6）</text>
  <text x="414" y="274" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">正确：1 + 6 = 7</text>
  <text x="414" y="290" text-anchor="middle" font-size="9.6" fill="#b85450" filter="url(#rough2)">重复计数：1 + 6×3 = 19（错）</text>
  <rect x="36" y="408" width="488" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="9.8" fill="#8a6a20" filter="url(#rough2)">每个 0 只被算一次，靠 set 保证；顺序与翻转位置无关</text>
  <text x="280" y="444" text-anchor="middle" font-size="9.8" fill="#8a6a20" filter="url(#rough2)">若整个矩阵全为 1：没有 0 可翻，答案就是 n × n</text>
</svg>
