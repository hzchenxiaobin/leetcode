<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 1 演算</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">P = [0, 1, 5, 6, 9]，k = 3，maxChanges = 1，L = k − maxChanges = 2</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="60" y="66" width="70"  height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="130" y="66" width="70"  height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="200" y="66" width="90"  height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="290" y="66" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="400" y="66" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="95"  y="86">站位 z</text>
    <text x="165" y="86">j1（≤1）</text>
    <text x="245" y="86">拿几个 j</text>
    <text x="345" y="86">距离和 S</text>
    <text x="455" y="86">代价 = S + 2(k−j)</text>
  </g>

  <!-- 行 1：z=0 -->
  <g filter="url(#rough2)">
    <rect x="60" y="100" width="70"  height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="130" y="100" width="70"  height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="200" y="100" width="90"  height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="290" y="100" width="110" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="100" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="95"  y="120">0</text>
    <text x="165" y="120">2</text>
    <text x="245" y="120">2</text>
    <text x="345" y="120">0 + 1 = 1</text>
    <text x="455" y="120" fill="#4a7a3a">1 + 2 = 3 ✓</text>
  </g>

  <!-- 行 2：z=1 -->
  <g filter="url(#rough2)">
    <rect x="60" y="134" width="70"  height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="130" y="134" width="70"  height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="200" y="134" width="90"  height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="290" y="134" width="110" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="134" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="95"  y="154">1</text>
    <text x="165" y="154">2</text>
    <text x="245" y="154">2</text>
    <text x="345" y="154">0 + 1 = 1</text>
    <text x="455" y="154" fill="#4a7a3a">1 + 2 = 3 ✓</text>
  </g>

  <!-- 行 3：z=5 -->
  <g filter="url(#rough2)">
    <rect x="60" y="168" width="70"  height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="130" y="168" width="70"  height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="200" y="168" width="90"  height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="290" y="168" width="110" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="168" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="95"  y="188">5</text>
    <text x="165" y="188">2</text>
    <text x="245" y="188">2</text>
    <text x="345" y="188">0 + 1 = 1</text>
    <text x="455" y="188" fill="#4a7a3a">1 + 2 = 3 ✓</text>
  </g>

  <!-- 行 4：z=6 -->
  <g filter="url(#rough2)">
    <rect x="60" y="202" width="70"  height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="130" y="202" width="70"  height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="200" y="202" width="90"  height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="290" y="202" width="110" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="202" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="95"  y="222">6</text>
    <text x="165" y="222">2</text>
    <text x="245" y="222">2</text>
    <text x="345" y="222">0 + 1 = 1</text>
    <text x="455" y="222" fill="#4a7a3a">1 + 2 = 3 ✓</text>
  </g>

  <!-- 行 5：z=9 -->
  <g filter="url(#rough2)">
    <rect x="60" y="236" width="70"  height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="130" y="236" width="70"  height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="200" y="236" width="90"  height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="290" y="236" width="110" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="400" y="236" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="95"  y="256">9</text>
    <text x="165" y="256" fill="#d6a040">1</text>
    <text x="245" y="256" fill="#d6a040">L = 2</text>
    <text x="345" y="256">0 + 3 = 3</text>
    <text x="455" y="256" fill="#b85450">3 + 2 = 5</text>
  </g>

  <!-- 注释 -->
  <g filter="url(#rough2)">
    <rect x="46" y="286" width="468" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#555">
    <text x="62" y="308">z = 9 时 j1 = 1 &lt; L = 2：改写名额（1 个）不够补齐 k = 3，</text>
    <text x="62" y="328">被迫再移动最近的 6（距离 3），代价 3 + 2×1 = 5，劣于最优。</text>
    <text x="62" y="352" fill="#4a7a3a">答案 = 3：站 z ∈ {0, 1, 5, 6}，白拿 1 个 + 邻居移入 1 个（1 次）+ 改写 1 个（2 次）。</text>
  </g>
</svg>
