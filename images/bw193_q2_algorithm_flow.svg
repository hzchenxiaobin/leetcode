<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="540" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：一趟扫描同余段，逐段用 gcd 定长</text>

  <!-- 开始 -->
  <rect x="170" y="50" width="300" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="74" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">① 求 r[i] = nums[i] mod k，逐个扫描</text>
  <path d="M320,90 L320,116" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 1 -->
  <polygon points="320,132 420,172 320,212 220,172" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="168" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">r[i] 与当前段</text>
  <text x="320" y="186" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">余数 cur 相同？</text>

  <!-- 是：段延长 -->
  <path d="M320,212 L320,238" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="230" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="245" y="240" width="150" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">L = L + 1（段延长）</text>

  <!-- 判定菱形 2 -->
  <path d="M320,276 L320,300" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="320,304 400,338 320,372 240,338" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="343" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">元素耗尽？</text>

  <!-- 否：回到菱形 1 -->
  <path d="M240,338 L110,338 L110,172 L212,172" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="326" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">否，取下一个元素</text>

  <!-- 是：结算末段 -->
  <path d="M320,372 L320,398" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="390" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="170" y="400" width="300" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="420" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">④ 结算最后一个同余段</text>
  <text x="320" y="438" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">ans = max(ans, best)</text>

  <!-- 返回 -->
  <path d="M320,444 L320,468" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="215" y="470" width="210" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="494" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ 返回 ans（初始为 1）</text>

  <!-- 否：结算旧段（右侧） -->
  <path d="M420,172 L452,172" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="434" y="162" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="455" y="120" width="175" height="130" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="542" y="140" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">③ 结算旧段</text>
  <text x="542" y="158" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">d = k / gcd(cur, k)</text>
  <text x="542" y="176" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">best = 1 + (L−1)/d·d</text>
  <text x="542" y="194" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">ans = max(ans, best)</text>
  <text x="542" y="212" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">开新段：</text>
  <text x="542" y="230" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">cur = r[i]，L = 1</text>

  <!-- 回到开头取下一个元素 -->
  <path d="M542,118 L542,70 L474,70" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="556" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">取下</text>
  <text x="556" y="110" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">一个</text>
</svg>
