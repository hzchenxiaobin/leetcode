<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606e"/>
    </marker>
  </defs>
  <rect width="760" height="480" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3 演算：a = [4, 3, 1, 3, 4]，逐个素数幂切空洞</text>
  <path d="M 96 41 Q 380 48 664 41" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 数组 -->
  <g filter="url(#rough2)">
    <rect x="92" y="56" width="46" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="115" y="79" text-anchor="middle" font-size="14" fill="#2f4a66">4</text>
    <rect x="144" y="56" width="46" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="167" y="79" text-anchor="middle" font-size="14" fill="#2f4a66">3</text>
    <rect x="196" y="56" width="46" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="219" y="79" text-anchor="middle" font-size="14" fill="#2f4a66">1</text>
    <rect x="248" y="56" width="46" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="271" y="79" text-anchor="middle" font-size="14" fill="#2f4a66">3</text>
    <rect x="300" y="56" width="46" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="323" y="79" text-anchor="middle" font-size="14" fill="#2f4a66">4</text>
    <text x="115" y="104" text-anchor="middle" font-size="11" fill="#7a8085">1</text>
    <text x="167" y="104" text-anchor="middle" font-size="11" fill="#7a8085">2</text>
    <text x="219" y="104" text-anchor="middle" font-size="11" fill="#7a8085">3</text>
    <text x="271" y="104" text-anchor="middle" font-size="11" fill="#7a8085">4</text>
    <text x="323" y="104" text-anchor="middle" font-size="11" fill="#7a8085">5</text>
    <text x="628" y="73" text-anchor="middle" font-size="12" fill="#55606e">lcm(1..5) = 12</text>
    <text x="628" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6520">f(1,5) = 5</text>
  </g>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="34" y="126" width="692" height="30" rx="6" fill="#f1f1f6" stroke="#9aa0a6" stroke-width="1.2"/>
    <text x="66" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3b3b3b">q</text>
    <text x="172" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3b3b3b">墙（q 的倍数位置）</text>
    <text x="352" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3b3b3b">极大空洞 [L,R]</text>
    <text x="512" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3b3b3b">空洞的 lcm / 已覆盖</text>
    <text x="614" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3b3b3b">f(空洞)</text>
    <text x="694" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3b3b3b">判定</text>
  </g>

  <!-- q = 2 -->
  <g filter="url(#rough2)">
    <rect x="34" y="162" width="692" height="42" rx="6" fill="#f7fbff" stroke="#c9d8e8" stroke-width="1"/>
    <text x="66" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">2</text>
    <text x="172" y="188" text-anchor="middle" font-size="12" fill="#2f4a66">{1, 5}</text>
    <text x="352" y="188" text-anchor="middle" font-size="12" fill="#2f4a66">[2,4] = (3,1,3)</text>
    <text x="512" y="188" text-anchor="middle" font-size="12" fill="#2f4a66">只有 3；2 缺席</text>
    <text x="614" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66">2</text>
    <text x="694" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">2 ≥ 2 ✓</text>
  </g>

  <!-- q = 3 -->
  <g filter="url(#rough2)">
    <rect x="34" y="210" width="692" height="42" rx="6" fill="#eef7f0" stroke="#c9e0cd" stroke-width="1"/>
    <text x="66" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e">3</text>
    <text x="172" y="236" text-anchor="middle" font-size="12" fill="#3c5e2e">{2, 4}</text>
    <text x="352" y="236" text-anchor="middle" font-size="12" fill="#3c5e2e">[1,1] = (4)</text>
    <text x="512" y="236" text-anchor="middle" font-size="12" fill="#3c5e2e">lcm = 4；2 在、3 缺席</text>
    <text x="614" y="236" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e">3</text>
    <text x="694" y="236" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">3 ≥ 3 ✓</text>
  </g>

  <!-- q = 4 -->
  <g filter="url(#rough2)">
    <rect x="34" y="258" width="692" height="42" rx="6" fill="#fdf3f5" stroke="#eccdd1" stroke-width="1"/>
    <text x="66" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3a36">4</text>
    <text x="172" y="284" text-anchor="middle" font-size="12" fill="#8f3a36">{1, 5}</text>
    <text x="352" y="284" text-anchor="middle" font-size="12" fill="#8f3a36">[2,4] = (3,1,3)</text>
    <text x="512" y="284" text-anchor="middle" font-size="12" fill="#8f3a36">只有 3；2 缺席</text>
    <text x="614" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3a36">2</text>
    <text x="694" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">2 &lt; 4 ✗</text>
  </g>

  <!-- q = 5 -->
  <g filter="url(#rough2)">
    <rect x="34" y="306" width="692" height="42" rx="6" fill="#fffdf5" stroke="#ecdfbe" stroke-width="1"/>
    <text x="66" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520">5</text>
    <text x="172" y="332" text-anchor="middle" font-size="12" fill="#8a6520">无（没有 5 的倍数）</text>
    <text x="352" y="332" text-anchor="middle" font-size="12" fill="#8a6520">[1,5] = 整段</text>
    <text x="512" y="332" text-anchor="middle" font-size="12" fill="#8a6520">lcm = 12；4,3 在、5 缺席</text>
    <text x="614" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6520">5</text>
    <text x="694" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">5 ≥ 5 ✓</text>
  </g>

  <!-- 结论 -->
  <rect x="34" y="362" width="692" height="98" rx="10" fill="#fdf7ee" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="380" y="388" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6520">答案 = {2, 3, 5}，与官方输出一致（4 不可达）</text>
    <text x="380" y="412" text-anchor="middle" font-size="12.5" fill="#5a4420">注意 q = 2 与 q = 4 的墙完全相同（都是位置 1 和 5），空洞也一样 ——</text>
    <text x="380" y="434" text-anchor="middle" font-size="12.5" fill="#5a4420">但同一个空洞的 f 值只有一个：对 2 够用，对 4 不够。所以必须对每个 q 单独比对 f(空洞) 与 q。</text>
    <text x="380" y="454" text-anchor="middle" font-size="12" fill="#7a8085">（q = 4 时，真正能覆盖 2 的元素 4 本身就是 4 的倍数，被墙挡掉了）</text>
  </g>
</svg>
