<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：K1:L2 → 列 K..L × 行 1..2</text>
  <path d="M 165 40 Q 280 48 395 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- column headers -->
  <g filter="url(#sk)" font-size="13" text-anchor="middle">
    <text x="106" y="78" fill="#aaa">J</text>
    <text x="158" y="78" fill="#446688" font-weight="bold">K</text>
    <text x="210" y="78" fill="#446688" font-weight="bold">L</text>
    <text x="262" y="78" fill="#aaa">M</text>
  </g>
  <!-- row headers -->
  <g filter="url(#sk)" font-size="13" text-anchor="end">
    <text x="72" y="108" fill="#446688" font-weight="bold">1</text>
    <text x="72" y="148" fill="#446688" font-weight="bold">2</text>
    <text x="72" y="188" fill="#aaa">3</text>
  </g>

  <!-- grey cells (outside range) -->
  <g filter="url(#sk)" stroke="#c8c8c8" stroke-width="1.2" fill="#ffffff">
    <rect x="80" y="84" width="52" height="40" rx="4"/>
    <rect x="236" y="84" width="52" height="40" rx="4"/>
    <rect x="80" y="124" width="52" height="40" rx="4"/>
    <rect x="236" y="124" width="52" height="40" rx="4"/>
    <rect x="80" y="164" width="52" height="40" rx="4"/>
    <rect x="132" y="164" width="52" height="40" rx="4"/>
    <rect x="184" y="164" width="52" height="40" rx="4"/>
    <rect x="236" y="164" width="52" height="40" rx="4"/>
  </g>

  <!-- highlighted cells in range -->
  <g filter="url(#sk)" stroke="#446688" stroke-width="2" fill="#e8f0fe">
    <rect x="132" y="84" width="52" height="40" rx="4"/>
    <rect x="184" y="84" width="52" height="40" rx="4"/>
    <rect x="132" y="124" width="52" height="40" rx="4"/>
    <rect x="184" y="124" width="52" height="40" rx="4"/>
  </g>
  <g filter="url(#sk)" font-size="14" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="162" y="110">K1</text>
    <text x="214" y="110">L1</text>
    <text x="162" y="150">K2</text>
    <text x="214" y="150">L2</text>
  </g>

  <!-- order badges -->
  <g filter="url(#sk)">
    <circle cx="136" cy="90" r="10" fill="#b85450"/>
    <circle cx="188" cy="90" r="10" fill="#b85450"/>
    <circle cx="136" cy="130" r="10" fill="#b85450"/>
    <circle cx="188" cy="130" r="10" fill="#b85450"/>
  </g>
  <g filter="url(#sk)" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="136" y="94">1</text>
    <text x="188" y="94">3</text>
    <text x="136" y="134">2</text>
    <text x="188" y="134">4</text>
  </g>

  <!-- arrows: K1->K2, L1->L2, K2->L1 wrap -->
  <g filter="url(#sk)" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 3">
    <path d="M 158 116 V 130" marker-end="url(#ar)"/>
    <path d="M 210 116 V 130" marker-end="url(#ar)"/>
    <path d="M 186 146 C 238 158 262 122 240 106" marker-end="url(#ar)"/>
  </g>
  <text x="262" y="180" font-size="10.5" fill="#b03a3a" text-anchor="middle" filter="url(#sk)">换列，回到首行</text>

  <!-- arrow grid -> output panel -->
  <g filter="url(#sk)">
    <path d="M 292 110 H 326" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ag)"/>
  </g>

  <!-- output panel -->
  <g filter="url(#sk)">
    <rect x="330" y="88" width="186" height="140" rx="10" fill="#ffffff" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="423" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">输出 ans（按序）</text>
  <g filter="url(#sk)">
    <rect x="348" y="118" width="150" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="348" y="144" width="150" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="348" y="170" width="150" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="348" y="196" width="150" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="362" cy="129" r="8" fill="#b85450"/>
    <circle cx="362" cy="155" r="8" fill="#b85450"/>
    <circle cx="362" cy="181" r="8" fill="#b85450"/>
    <circle cx="362" cy="207" r="8" fill="#b85450"/>
  </g>
  <g filter="url(#sk)" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="362" y="133">1</text>
    <text x="362" y="159">2</text>
    <text x="362" y="185">3</text>
    <text x="362" y="211">4</text>
  </g>
  <g filter="url(#sk)" font-size="13" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="415" y="133">K1</text>
    <text x="415" y="159">K2</text>
    <text x="415" y="185">L1</text>
    <text x="415" y="211">L2</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="80" y="250" width="440" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="300" y="274" text-anchor="middle" font-size="13" fill="#2b4a1e" filter="url(#sk)">列数 = c2−c1+1 = 2，行数 = r2−r1+1 = 2</text>
  <text x="300" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a1e" filter="url(#sk)">总数 = 2 × 2 = 4 个单元格，先列后行，不重不漏</text>

  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">外层循环 col: K → L；内层循环 row: 1 → 2</text>
</svg>
