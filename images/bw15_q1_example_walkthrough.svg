<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="340" fill="#fafafa"/>
  <text x="330" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">示例演算：arr = [1,2,2,6,6,6,6,7,10]，n = 9</text>

  <!-- 9 个格子 -->
  <g font-size="15" text-anchor="middle">
    <rect x="80" y="80" width="56" height="48" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="108" y="110" fill="#333" filter="url(#rough2)">1</text>
    <rect x="136" y="80" width="56" height="48" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="164" y="110" fill="#333" filter="url(#rough2)">2</text>
    <rect x="192" y="80" width="56" height="48" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="220" y="110" fill="#8a6a20" filter="url(#rough2)">2</text>
    <rect x="248" y="80" width="56" height="48" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="276" y="110" fill="#333" filter="url(#rough2)">6</text>
    <rect x="304" y="80" width="56" height="48" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="332" y="110" fill="#333" filter="url(#rough2)">6</text>
    <rect x="360" y="80" width="56" height="48" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="388" y="110" fill="#333" filter="url(#rough2)">6</text>
    <rect x="416" y="80" width="56" height="48" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="444" y="110" fill="#333" filter="url(#rough2)">6</text>
    <rect x="472" y="80" width="56" height="48" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="500" y="110" fill="#333" filter="url(#rough2)">7</text>
    <rect x="528" y="80" width="56" height="48" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="556" y="110" fill="#333" filter="url(#rough2)">10</text>
  </g>

  <!-- 下标 -->
  <g font-size="11" fill="#666" text-anchor="middle">
    <text x="108" y="142" filter="url(#rough2)">0</text>
    <text x="164" y="142" filter="url(#rough2)">1</text>
    <text x="220" y="142" filter="url(#rough2)">2</text>
    <text x="276" y="142" filter="url(#rough2)">3</text>
    <text x="332" y="142" filter="url(#rough2)">4</text>
    <text x="388" y="142" filter="url(#rough2)">5</text>
    <text x="444" y="142" filter="url(#rough2)">6</text>
    <text x="500" y="142" filter="url(#rough2)">7</text>
    <text x="556" y="142" filter="url(#rough2)">8</text>
  </g>

  <!-- 四分点箭头标注 -->
  <line x1="220" y1="58" x2="220" y2="76" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="50" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">q1 = 2 → 候选 2</text>
  <line x1="332" y1="58" x2="332" y2="76" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="50" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">q2 = 4 → 候选 6</text>
  <line x1="444" y1="58" x2="444" y2="76" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="444" y="50" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">q3 = 6 → 候选 6</text>

  <!-- 验证面板 -->
  <rect x="60" y="182" width="280" height="88" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">验证候选 2：</text>
  <text x="200" y="230" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">出现区间 [1,2]，次数 m = 2</text>
  <text x="200" y="252" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">4m = 8 ≤ 9，未超过 25% ✗</text>

  <rect x="360" y="182" width="280" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">验证候选 6：</text>
  <text x="500" y="230" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">出现区间 [3,6]，次数 m = 4</text>
  <text x="500" y="252" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">4m = 16 &gt; 9 ✓ 返回 6</text>

  <text x="330" y="306" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">两次二分各 O(log n)；候选 6 出现在两个四分点上，重复验证无害</text>
  <text x="330" y="326" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">n &lt; 4 时三个四分点可能重合，候选集合缩小但结论不变</text>
</svg>
