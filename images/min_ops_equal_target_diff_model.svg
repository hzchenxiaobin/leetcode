<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="880" height="520" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">一次操作 = 扩展差分数组上的一对 (+1, −1)</text>
  <path d="M 240 46 Q 440 55 640 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A: d array with +1 op on [l, r] ===== -->
  <text x="440" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 设 d = target − nums，对子数组 [l, r] = [1, 3] 整体 +1</text>
  <text x="335" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040">+1</text>

  <g font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
    <g filter="url(#sk)"><rect x="190" y="100" width="58" height="34" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.8"/></g><text x="219" y="122">2</text>
    <g filter="url(#sk)"><rect x="248" y="100" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g><text x="277" y="122">3</text>
    <g filter="url(#sk)"><rect x="306" y="100" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g><text x="335" y="122">3</text>
    <g filter="url(#sk)"><rect x="364" y="100" width="58" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g><text x="393" y="122">1</text>
    <g filter="url(#sk)"><rect x="422" y="100" width="58" height="34" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.8"/></g><text x="451" y="122">4</text>
    <g filter="url(#sk)"><rect x="480" y="100" width="58" height="34" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.8"/></g><text x="509" y="122">4</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="219" y="152">0</text><text x="277" y="152">1</text><text x="335" y="152">2</text>
    <text x="393" y="152">3</text><text x="451" y="152">4</text><text x="509" y="152">5</text>
  </g>

  <!-- ===== Panel B: extended diff g ===== -->
  <text x="440" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② 扩展差分 g：只在两个位置各留一个 +1 和一个 −1（位置 n 是虚拟的）</text>

  <g font-size="13" fill="#333" text-anchor="middle">
    <g filter="url(#sk)"><rect x="161" y="216" width="58" height="34" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.8"/></g><text x="190" y="238">0</text>
    <g filter="url(#sk)"><rect x="219" y="216" width="58" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g><text x="248" y="238" font-weight="bold" fill="#2e6e2e">+1</text>
    <g filter="url(#sk)"><rect x="277" y="216" width="58" height="34" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.8"/></g><text x="306" y="238">0</text>
    <g filter="url(#sk)"><rect x="335" y="216" width="58" height="34" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.8"/></g><text x="364" y="238">0</text>
    <g filter="url(#sk)"><rect x="393" y="216" width="58" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g><text x="422" y="238" font-weight="bold" fill="#b85450">−1</text>
    <g filter="url(#sk)"><rect x="451" y="216" width="58" height="34" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.8"/></g><text x="480" y="238">0</text>
    <g filter="url(#sk)"><rect x="509" y="216" width="58" height="34" fill="#f0ede4" stroke="#999" stroke-width="1.2" stroke-dasharray="5,3"/></g><text x="538" y="238">0</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="190" y="268">0</text><text x="248" y="268">1</text><text x="306" y="268">2</text>
    <text x="364" y="268">3</text><text x="422" y="268">4</text><text x="480" y="268">5</text>
    <text x="538" y="268" fill="#b85450">虚拟</text>
  </g>

  <!-- arrows between rows -->
  <path d="M 248 160 C 248 176 248 190 248 210" stroke="#4a8e4a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="260" y="186" font-size="11" fill="#2e6e2e">起点 l = 1 → 差分 +1</text>
  <path d="M 422 160 C 422 176 422 190 422 210" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="434" y="186" font-size="11" fill="#b85450">终点之后 r+1 = 4 → 差分 −1</text>

  <!-- ===== Panel C: symmetric note ===== -->
  <g filter="url(#sk)">
    <rect x="70" y="300" width="740" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="440" y="328" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a87716">③ −1 操作恰好对称：红绿互换</text>
  <text x="440" y="354" text-anchor="middle" font-size="12" fill="#555">+1 操作：起点处 +1、终点后 −1　　｜　　−1 操作：起点处 −1、终点后 +1</text>
  <text x="440" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">无论哪种操作，每次都恰好提供一个 +1 和一个 −1 ⇒ 操作次数 ≥ g 的正数和</text>

  <text x="440" y="440" text-anchor="middle" font-size="12" fill="#2e6e2e">把每个 +1 需求与一个 −1 需求配成一对，每一对恰好能执行一次操作</text>
  <text x="440" y="466" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">⇒ 最少操作数 = Σ max(0, g_i)，即扩展差分的正数和</text>
</svg>
