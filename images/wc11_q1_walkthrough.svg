<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="410" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "Hello, my name is John"（只列关键位置）</text>
  <text x="320" y="49" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">「左邻」即 s[i−1]；只有「非空格 且 左邻是空格/串首」才让 cnt 加一</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="52" y="68" width="536" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="87" y="88" fill="#3a4a66" font-weight="bold">i</text>
    <text x="182" y="88" fill="#3a4a66" font-weight="bold">s[i]</text>
    <text x="307" y="88" fill="#3a4a66" font-weight="bold">左邻 s[i−1]</text>
    <text x="437" y="88" fill="#3a4a66" font-weight="bold">左边界？</text>
    <text x="545" y="88" fill="#3a4a66" font-weight="bold">cnt</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="52" y="98" width="70" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="122" y="98" width="120" height="30" fill="#e8f0fe" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="242" y="98" width="130" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="372" y="98" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="502" y="98" width="86" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.1"/>
    <text x="87" y="118" fill="#555">0</text>
    <text x="182" y="118" fill="#3a4a66">'H'</text>
    <text x="307" y="118" fill="#888">—（串首）</text>
    <text x="437" y="118" fill="#3a7a3a" font-weight="bold">是</text>
    <text x="545" y="118" fill="#3a7a3a" font-weight="bold">1</text>

    <rect x="52" y="128" width="70" height="30" fill="#f7f9fc" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="122" y="128" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="242" y="128" width="130" height="30" fill="#f7f9fc" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="372" y="128" width="130" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="502" y="128" width="86" height="30" fill="#f7f9fc" stroke="#9aa8bb" stroke-width="1.1"/>
    <text x="87" y="148" fill="#555">6</text>
    <text x="182" y="148" fill="#b08a30">空格</text>
    <text x="307" y="148" fill="#555">','</text>
    <text x="437" y="148" fill="#999">否</text>
    <text x="545" y="148" fill="#999">1</text>

    <rect x="52" y="158" width="70" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="122" y="158" width="120" height="30" fill="#e8f0fe" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="242" y="158" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="372" y="158" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="502" y="158" width="86" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.1"/>
    <text x="87" y="178" fill="#555">7</text>
    <text x="182" y="178" fill="#3a4a66">'m'</text>
    <text x="307" y="178" fill="#b08a30">空格</text>
    <text x="437" y="178" fill="#3a7a3a" font-weight="bold">是</text>
    <text x="545" y="178" fill="#3a7a3a" font-weight="bold">2</text>

    <rect x="52" y="188" width="70" height="30" fill="#f7f9fc" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="122" y="188" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="242" y="188" width="130" height="30" fill="#f7f9fc" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="372" y="188" width="130" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="502" y="188" width="86" height="30" fill="#f7f9fc" stroke="#9aa8bb" stroke-width="1.1"/>
    <text x="87" y="208" fill="#555">9</text>
    <text x="182" y="208" fill="#b08a30">空格</text>
    <text x="307" y="208" fill="#555">'y'</text>
    <text x="437" y="208" fill="#999">否</text>
    <text x="545" y="208" fill="#999">2</text>

    <rect x="52" y="218" width="70" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="122" y="218" width="120" height="30" fill="#e8f0fe" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="242" y="218" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="372" y="218" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="502" y="218" width="86" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.1"/>
    <text x="87" y="238" fill="#555">10</text>
    <text x="182" y="238" fill="#3a4a66">'n'</text>
    <text x="307" y="238" fill="#b08a30">空格</text>
    <text x="437" y="238" fill="#3a7a3a" font-weight="bold">是</text>
    <text x="545" y="238" fill="#3a7a3a" font-weight="bold">3</text>

    <rect x="52" y="248" width="70" height="30" fill="#f7f9fc" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="122" y="248" width="120" height="30" fill="#e8f0fe" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="242" y="248" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="372" y="248" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="502" y="248" width="86" height="30" fill="#f7f9fc" stroke="#9aa8bb" stroke-width="1.1"/>
    <text x="87" y="268" fill="#555">15</text>
    <text x="182" y="268" fill="#3a4a66">'i'</text>
    <text x="307" y="268" fill="#b08a30">空格</text>
    <text x="437" y="268" fill="#3a7a3a" font-weight="bold">是</text>
    <text x="545" y="268" fill="#3a7a3a" font-weight="bold">4</text>

    <rect x="52" y="278" width="70" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="122" y="278" width="120" height="30" fill="#e8f0fe" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="242" y="278" width="130" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="372" y="278" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="502" y="278" width="86" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.1"/>
    <text x="87" y="298" fill="#555">18</text>
    <text x="182" y="298" fill="#3a4a66">'J'</text>
    <text x="307" y="298" fill="#b08a30">空格</text>
    <text x="437" y="298" fill="#3a7a3a" font-weight="bold">是</text>
    <text x="545" y="298" fill="#3a7a3a" font-weight="bold">5</text>

    <rect x="52" y="308" width="70" height="30" fill="#f7f9fc" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="122" y="308" width="120" height="30" fill="#e8f0fe" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="242" y="308" width="130" height="30" fill="#f7f9fc" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="372" y="308" width="130" height="30" fill="#ffffff" stroke="#9aa8bb" stroke-width="1.1"/>
    <rect x="502" y="308" width="86" height="30" fill="#f7f9fc" stroke="#9aa8bb" stroke-width="1.1"/>
    <text x="87" y="328" fill="#555">21</text>
    <text x="182" y="328" fill="#3a4a66">'n'</text>
    <text x="307" y="328" fill="#555">'h'</text>
    <text x="437" y="328" fill="#999">否</text>
    <text x="545" y="328" fill="#999">5</text>
  </g>

  <text x="320" y="362" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">末尾的 'n' 左邻是 'h'，属于同一个单词；空格行的 cnt 不变，说明分隔符本身不贡献计数</text>
  <text x="320" y="386" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">答案 cnt = 5，与官方输出一致（"Hello," 因不含空格而整体算一个单词）</text>
  <text x="320" y="404" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">中间被省略的位置（1–5、8、11–14、16–17、19–20）都是「否」，cnt 保持上一行的值</text>
</svg>
