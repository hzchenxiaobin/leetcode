<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：low=2, high=3, zero=1, one=2</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">dp[2] + dp[3] = 2 + 3 = 5，对应 "00","11","000","110","011"</text>

  <g filter="url(#rough2)">
    <rect x="40" y="66" width="480" height="150" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8"/>
  </g>

  <text x="70" y="92" font-size="11" fill="#666" font-weight="bold">i</text>
  <text x="130" y="92" font-size="11" fill="#666" font-weight="bold">dp[i−zero]=dp[i−1]</text>
  <text x="290" y="92" font-size="11" fill="#666" font-weight="bold">dp[i−one]=dp[i−2]</text>
  <text x="440" y="92" font-size="11" fill="#666" font-weight="bold">dp[i]</text>

  <text x="70" y="120" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <text x="130" y="120" font-size="12" fill="#999">—</text>
  <text x="290" y="120" font-size="12" fill="#999">—</text>
  <text x="440" y="120" font-size="12" fill="#d6a040" font-weight="bold">1</text>

  <line x1="56" y1="130" x2="504" y2="130" stroke="#eee" stroke-width="1"/>

  <text x="70" y="152" font-size="12" fill="#555">1</text>
  <text x="130" y="152" font-size="12" fill="#446688">dp[0]=1</text>
  <text x="290" y="152" font-size="12" fill="#999">i&lt;one 跳过</text>
  <text x="440" y="152" font-size="12" fill="#555" font-weight="bold">1</text>

  <line x1="56" y1="162" x2="504" y2="162" stroke="#eee" stroke-width="1"/>

  <text x="70" y="184" font-size="12" fill="#555">2</text>
  <text x="130" y="184" font-size="12" fill="#446688">dp[1]=1</text>
  <text x="290" y="184" font-size="12" fill="#4a7a3a">dp[0]=1</text>
  <text x="440" y="184" font-size="12" fill="#555" font-weight="bold">2</text>

  <line x1="56" y1="194" x2="504" y2="194" stroke="#eee" stroke-width="1"/>

  <text x="70" y="212" font-size="12" fill="#555">3</text>
  <text x="130" y="212" font-size="12" fill="#446688">dp[2]=2</text>
  <text x="290" y="212" font-size="12" fill="#4a7a3a">dp[1]=1</text>
  <text x="440" y="212" font-size="12" fill="#555" font-weight="bold">3</text>

  <rect x="40" y="232" width="230" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="155" y="254" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">长度 2 的好字符串（2 个）</text>
  <text x="155" y="274" text-anchor="middle" font-size="11" fill="#555">"00"（末尾追加 1 个 '0' 两次）</text>
  <text x="155" y="290" text-anchor="middle" font-size="11" fill="#555">"11"（末尾追加 2 个 '1' 一次）</text>

  <rect x="290" y="232" width="230" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="405" y="254" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">长度 3 的好字符串（3 个）</text>
  <text x="405" y="274" text-anchor="middle" font-size="11" fill="#555">"000" = "00" + '0'</text>
  <text x="405" y="290" text-anchor="middle" font-size="11" fill="#555">"011" = "0" + '11'，"110" = "1" + '10'</text>

  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">答案 = 2 + 3 = 5 ✓（与官方示例一致）</text>
  <text x="280" y="354" text-anchor="middle" font-size="10" fill="#999">对照示例 1：zero=one=1 时 dp[i]=dp[i−1]+dp[i−1]=2^{i−1}，Σ dp[3..3] = 2² = 8 ✓</text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#999">注意 "011" 的构造唯一（"0"+"11"），"01"+"1" 不合法——'1' 必须一次加 one 个</text>
</svg>
