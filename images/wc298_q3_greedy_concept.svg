<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="22" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="660" height="440" fill="#fdfcf7"/>
  <text x="330" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：0 全免费，1 的代价 = 2^(它右边选中的字符数)</text>
  <path d="M 150 36 Q 330 44 510 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- s = 1001010 字符条：从右往左决策 -->
  <text x="330" y="58" text-anchor="middle" font-size="13" fill="#666">s = "1001010"，k = 5（示例 1）</text>

  <!-- 格子 i=0 -->
  <g filter="url(#sk)"><rect x="134" y="72" width="50" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="159" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#a04a48">1</text>
  <text x="159" y="130" text-anchor="middle" font-size="11" fill="#888">i=0</text>
  <text x="159" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04a48">丢 ✗</text>

  <!-- 格子 i=1 -->
  <g filter="url(#sk)"><rect x="190" y="72" width="50" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="215" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e2e">0</text>
  <text x="215" y="130" text-anchor="middle" font-size="11" fill="#888">i=1</text>
  <text x="215" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">留 ✓</text>

  <!-- 格子 i=2 -->
  <g filter="url(#sk)"><rect x="246" y="72" width="50" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="271" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e2e">0</text>
  <text x="271" y="130" text-anchor="middle" font-size="11" fill="#888">i=2</text>
  <text x="271" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">留 ✓</text>

  <!-- 格子 i=3 -->
  <g filter="url(#sk)"><rect x="302" y="72" width="50" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="327" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#a04a48">1</text>
  <text x="327" y="130" text-anchor="middle" font-size="11" fill="#888">i=3</text>
  <text x="327" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04a48">丢 ✗</text>
  <text x="327" y="146" text-anchor="middle" font-size="10.5" fill="#a06a20">位权 2³ = 8 太贵</text>

  <!-- 格子 i=4 -->
  <g filter="url(#sk)"><rect x="358" y="72" width="50" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="383" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e2e">0</text>
  <text x="383" y="130" text-anchor="middle" font-size="11" fill="#888">i=4</text>
  <text x="383" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">留 ✓</text>

  <!-- 格子 i=5 -->
  <g filter="url(#sk)"><rect x="414" y="72" width="50" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.5"/></g>
  <text x="439" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="439" y="130" text-anchor="middle" font-size="11" fill="#888">i=5</text>
  <text x="439" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">留 ✓</text>
  <text x="439" y="146" text-anchor="middle" font-size="10.5" fill="#2b6e9e">位权 2¹ = 2，装得下</text>

  <!-- 格子 i=6 -->
  <g filter="url(#sk)"><rect x="470" y="72" width="50" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="495" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e5e2e">0</text>
  <text x="495" y="130" text-anchor="middle" font-size="11" fill="#888">i=6</text>
  <text x="495" y="64" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">留 ✓</text>

  <!-- 扫描方向箭头 -->
  <path d="M 520 52 H 556" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="582" y="50" text-anchor="middle" font-size="10.5" fill="#888">扫描方向</text>
  <text x="582" y="62" text-anchor="middle" font-size="10.5" fill="#888">自右向左</text>

  <!-- 三条要点 -->
  <g filter="url(#sk)"><rect x="40" y="168" width="580" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="58" y="194" font-size="12.5" fill="#2e5e2e"><tspan font-weight="bold">① 前导 0 不增值：</tspan>0 不进入任何 1 的右侧计数，也不贡献数值 —— 全部白拿的长度</text>

  <g filter="url(#sk)"><rect x="40" y="220" width="580" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="58" y="246" font-size="12.5" fill="#2b6e9e"><tspan font-weight="bold">② 1 的位权 = 2^(右侧选中 0 数 + 右侧选中 1 数)：</tspan>越靠右越便宜 → 从最低位挑起</text>

  <g filter="url(#sk)"><rect x="40" y="272" width="580" height="42" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="58" y="298" font-size="12.5" fill="#7a5415"><tspan font-weight="bold">③ k &lt; 2³⁰：</tspan>位权 ≥ 2³⁰ 的 1 必然超预算，只有最低约 30 位内的 1 有机会入选</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="40" y="330" width="580" height="58" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.4"/></g>
  <text x="330" y="354" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b6e9e">贪心解 = 全部 0（4 个）+ 装得下的最低位 1（i=5，花费 2）</text>
  <text x="330" y="374" text-anchor="middle" font-size="12.5" fill="#4a6a8a">→ 子序列 "00010" = 2 ≤ 5，长度 5 —— 即答案 z + m*</text>

  <text x="330" y="422" text-anchor="middle" font-size="11.5" fill="#888">z = 0 的个数（全选），m* = 在预算 k 内能装下的最右几个 1</text>
</svg>
