<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：吃糖顺序固定，第 t 类糖占据一段「可达天区间」</text>
  <path d="M 100 42 Q 320 50 540 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① candy sequence -->
  <text x="320" y="62" text-anchor="middle" font-size="10.5" fill="#888">① 按类型排成总队列，吃糖顺序固定，第 k 颗糖有唯一全局序号（例：candiesCount = [7,4,5,3,8]）</text>
  <text x="130" y="80" text-anchor="middle" font-size="10" fill="#888">7</text>
  <text x="176" y="80" text-anchor="middle" font-size="10" fill="#888">11</text>
  <text x="232" y="80" text-anchor="middle" font-size="10" fill="#888">16</text>
  <text x="268" y="80" text-anchor="middle" font-size="10" fill="#888">19</text>
  <text x="354" y="80" text-anchor="middle" font-size="10" fill="#888">27</text>
  <text x="372" y="80" text-anchor="start" font-size="10" fill="#888">← 前缀和 s 的取值</text>

  <g filter="url(#sk)"><rect x="60" y="86" width="70" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="95" y="106" text-anchor="middle" font-size="11" fill="#2b6e9e">类型 0</text>
  <g filter="url(#sk)"><rect x="136" y="86" width="40" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="156" y="106" text-anchor="middle" font-size="11" fill="#2b6e9e">类型 1</text>
  <g filter="url(#sk)"><rect x="182" y="86" width="50" height="32" rx="5" fill="#fff4e6" stroke="#c98a2b" stroke-width="2.2"/></g>
  <text x="207" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06b1a">类型 t</text>
  <g filter="url(#sk)"><rect x="238" y="86" width="30" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="253" y="106" text-anchor="middle" font-size="11" fill="#2b6e9e">类型 3</text>
  <g filter="url(#sk)"><rect x="274" y="86" width="80" height="32" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="314" y="106" text-anchor="middle" font-size="11" fill="#2b6e9e">类型 4</text>

  <path d="M 190 124 Q 207 131 224 124" stroke="#c98a2b" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="207" y="141" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06b1a">第 t 类 = 第 s[t]+1 ~ s[t+1] 颗</text>
  <text x="470" y="106" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">s = [0,7,11,16,19,27]</text>

  <!-- ② fastest pace -->
  <g filter="url(#sk)"><rect x="45" y="152" width="270" height="64" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="180" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">② 最快：每天吃满 cap 颗</text>
  <text x="180" y="191" text-anchor="middle" font-size="10.5" fill="#2e6e2e">类型 t 第一颗（第 s[t]+1 颗）入口</text>
  <text x="180" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">最早天 = ⌊s[t] / cap⌋</text>

  <!-- ③ slowest pace -->
  <g filter="url(#sk)"><rect x="325" y="152" width="270" height="64" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="460" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06b1a">③ 最慢：每天只吃 1 颗</text>
  <text x="460" y="191" text-anchor="middle" font-size="10.5" fill="#a06b1a">类型 t 最后一颗（第 s[t+1] 颗）入口</text>
  <text x="460" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06b1a">最晚天 = s[t+1] − 1</text>

  <path d="M 160 216 Q 130 230 106 242" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 480 216 Q 512 230 534 242" stroke="#c98a2b" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- day interval bar -->
  <g filter="url(#sk)"><rect x="80" y="246" width="480" height="20" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><circle cx="80" cy="256" r="4" fill="#4a8e4a"/></g>
  <g filter="url(#sk)"><circle cx="560" cy="256" r="4" fill="#c98a2b"/></g>
  <text x="320" y="260" text-anchor="middle" font-size="10.5" fill="#2e6e2e">第 t 类糖的可达天区间：其中每一天都有方案吃到类型 t</text>
  <text x="80" y="284" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2e6e2e">⌊s[t]/cap⌋（最早）</text>
  <text x="560" y="284" text-anchor="end" font-size="11.5" font-weight="bold" fill="#a06b1a">s[t+1]−1（最晚）</text>

  <!-- verdicts -->
  <text x="70" y="306" text-anchor="start" font-size="11" fill="#b03a3a">d 太早 ✗ 还没吃到</text>
  <text x="320" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">最早 ≤ d ≤ 最晚 → true ✓</text>
  <text x="570" y="306" text-anchor="end" font-size="11" fill="#b03a3a">d 太晚 ✗ 早吃完了</text>

  <!-- summary -->
  <g filter="url(#sk)"><rect x="45" y="316" width="550" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="320" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">answer = ⌊s[t]/cap⌋ ≤ d ≤ s[t+1] − 1</text>
  <text x="320" y="348" text-anchor="middle" font-size="11" fill="#b03a3a">⟺ (d+1)·cap &gt; s[t] 且 d+1 ≤ s[t+1]（乘法形式，免整除）</text>
</svg>
