<svg xmlns="http://www.w3.org/2000/svg" width="720" height="436" viewBox="0 0 720 436"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="720" height="436" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：一次取模定结论</text>
  <path d="M 234 40 Q 360 47 486 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="46" y="56" width="628" height="34" rx="6" fill="#eef1f5" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="82" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">组</text>
  <text x="166" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">x</text>
  <text x="250" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">y</text>
  <text x="360" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">x mod y</text>
  <text x="520" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">一步到位的 z = x / y</text>
  <text x="634" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">答案</text>

  <!-- 行 1 -->
  <rect x="46" y="90" width="628" height="38" rx="4" fill="#e6f4ea" stroke="#9fc4a8" stroke-width="1" filter="url(#rough2)"/>
  <text x="82" y="114" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="166" y="114" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">12</text>
  <text x="250" y="114" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="360" y="114" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">0</text>
  <text x="520" y="114" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">6（或 ÷2 再 ÷3 分两步）</text>
  <text x="634" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 行 2 -->
  <rect x="46" y="128" width="628" height="38" rx="4" fill="#fce4ec" stroke="#d9a7a5" stroke-width="1" filter="url(#rough2)"/>
  <text x="82" y="152" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="166" y="152" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">6</text>
  <text x="250" y="152" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">7</text>
  <text x="360" y="152" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">6</text>
  <text x="520" y="152" text-anchor="middle" font-size="11.5" fill="#8a3a37" filter="url(#rough2)">不存在（6 / 7 非整数）</text>
  <text x="634" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>

  <!-- 行 3 -->
  <rect x="46" y="166" width="628" height="38" rx="4" fill="#fce4ec" stroke="#d9a7a5" stroke-width="1" filter="url(#rough2)"/>
  <text x="82" y="190" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">3</text>
  <text x="166" y="190" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">99</text>
  <text x="250" y="190" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">79</text>
  <text x="360" y="190" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">20</text>
  <text x="520" y="190" text-anchor="middle" font-size="11.5" fill="#8a3a37" filter="url(#rough2)">不存在（99 / 79 非整数）</text>
  <text x="634" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>

  <!-- 行 4 -->
  <rect x="46" y="204" width="628" height="38" rx="4" fill="#e6f4ea" stroke="#9fc4a8" stroke-width="1" filter="url(#rough2)"/>
  <text x="82" y="228" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">4</text>
  <text x="166" y="228" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">7</text>
  <text x="250" y="228" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">7</text>
  <text x="360" y="228" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">0</text>
  <text x="520" y="228" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">1（其实 0 次操作就够）</text>
  <text x="634" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 行 5 -->
  <rect x="46" y="242" width="628" height="38" rx="4" fill="#e6f4ea" stroke="#9fc4a8" stroke-width="1" filter="url(#rough2)"/>
  <text x="82" y="266" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">5</text>
  <text x="166" y="266" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">100</text>
  <text x="250" y="266" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="360" y="266" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">0</text>
  <text x="520" y="266" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">100（直接除到 1）</text>
  <text x="634" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 行 6 -->
  <rect x="46" y="280" width="628" height="38" rx="4" fill="#fce4ec" stroke="#d9a7a5" stroke-width="1" filter="url(#rough2)"/>
  <text x="82" y="304" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">6</text>
  <text x="166" y="304" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">6</text>
  <text x="250" y="304" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">4</text>
  <text x="360" y="304" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="520" y="304" text-anchor="middle" font-size="11.5" fill="#8a3a37" filter="url(#rough2)">不存在（y 比 x 小也不行）</text>
  <text x="634" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>

  <!-- 行 7 -->
  <rect x="46" y="318" width="628" height="38" rx="4" fill="#e6f4ea" stroke="#9fc4a8" stroke-width="1" filter="url(#rough2)"/>
  <text x="82" y="342" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">7</text>
  <text x="166" y="342" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="250" y="342" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="360" y="342" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">0</text>
  <text x="520" y="342" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">1（z 可取 1，空操作）</text>
  <text x="634" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <rect x="46" y="56" width="628" height="300" rx="6" fill="none" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="360" y="382" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">第 1 组官方答案的分步走法（÷2 再 ÷3）与一步走法（÷6）落在同一个值，说明拆步不增加能力</text>
  <text x="360" y="404" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">第 2、3、6 组的 x mod y 一列都不为 0 ⇒ 无论多少步都只能停在 x 的因子集合里，永远到不了 y</text>
  <text x="360" y="426" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">第 4、7 组提醒：y = x 与 y = 1 都是送分情形，取模判定天然正确，不要写多余特判</text>
</svg>
