<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 3 演算：n = 9 一步步拼出 3×3</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">度 2 ×4 = {1,3,5,8}（4 个角）· 度 3 ×4 ⇒ R+C = 6，R·C = 9 ⇒ 3×3</text>

  <!-- 步骤标题 -->
  <text x="107" y="60" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 取角铺出 2×2</text>
  <text x="260" y="60" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 前两行铺满</text>
  <text x="413" y="60" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">③ 剥落第 3 行</text>

  <!-- 网格 1：x=52..166 -->
  <rect x="52" y="68" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="90" y="68" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="128" y="68" width="38" height="38" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <rect x="52" y="106" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="90" y="106" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="128" y="106" width="38" height="38" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <rect x="52" y="144" width="38" height="38" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <rect x="90" y="144" width="38" height="38" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <rect x="128" y="144" width="38" height="38" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="71" y="92" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="109" y="92" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="147" y="92" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">?</text>
  <text x="71" y="130" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="109" y="130" text-anchor="middle" font-size="13" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="147" y="130" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">?</text>

  <!-- 网格 2：x=205..319 -->
  <rect x="205" y="68" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="243" y="68" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="281" y="68" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="205" y="106" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="243" y="106" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="281" y="106" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="205" y="144" width="38" height="38" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <rect x="243" y="144" width="38" height="38" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <rect x="281" y="144" width="38" height="38" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="224" y="92" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="262" y="92" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="300" y="92" text-anchor="middle" font-size="13" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="224" y="130" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="262" y="130" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="300" y="130" text-anchor="middle" font-size="13" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 网格 3：x=358..472 -->
  <rect x="358" y="68" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="68" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="434" y="68" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="358" y="106" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="106" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="434" y="106" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="358" y="144" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="144" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="434" y="144" width="38" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="377" y="92" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="415" y="92" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="453" y="92" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="377" y="130" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="415" y="130" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="453" y="130" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="377" y="168" text-anchor="middle" font-size="13" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="415" y="168" text-anchor="middle" font-size="13" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="453" y="168" text-anchor="middle" font-size="13" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 网格间箭头 -->
  <path d="M 172 123 L 198 123" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 325 123 L 351 123" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 步骤说明 -->
  <text x="109" y="200" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">角 a=1（度 2），邻居 0、7</text>
  <text x="109" y="214" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">试朝向：0 沿行、7 沿列</text>
  <text x="109" y="228" text-anchor="middle" font-size="9.5" fill="#8a6a1a" filter="url(#rough2)">(1,1)=公共邻居(0,7)=4</text>

  <text x="262" y="200" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">(0,2)=0 的唯一未放置邻居=5</text>
  <text x="262" y="214" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">(1,2)=公共邻居(5,4)=2</text>
  <text x="262" y="228" text-anchor="middle" font-size="9.5" fill="#8a6a1a" filter="url(#rough2)">朝向若错，这步会「无候选」</text>

  <text x="415" y="200" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">8、6、3 依次是 7、4、2 的</text>
  <text x="415" y="214" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">唯一未放置邻居（整行剥落）</text>
  <text x="415" y="228" text-anchor="middle" font-size="9.5" fill="#8a6a1a" filter="url(#rough2)">12 条格邻接 = 12 条边 ✓</text>

  <!-- 底部结论 -->
  <rect x="20" y="252" width="480" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">输出 [[1,0,5],[7,4,2],[8,6,3]]，与官方 [[8,6,3],[7,4,2],[1,0,5]] 互为上下翻转</text>
  <text x="260" y="298" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">本题答案不唯一：旋转、翻转、（R=C 时）转置都是合法解</text>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">自测时用「格邻接集合 = 边集合」判定，别拿输出直接 diff 官方答案</text>
</svg>
