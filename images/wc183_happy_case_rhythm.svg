<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">贪心的两种节奏：看 M 与 2(R+1) 谁大</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#888" filter="url(#r)">M ≤ 2(R+1)：交错混排、全部放完；M &gt; 2(R+1)：最大字符严格主导，进入固定的 "XX·Y" 节奏</text>

  <!-- 左：情形 A -->
  <g filter="url(#r)">
    <rect x="24" y="72" width="288" height="312" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="168" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">情形 A：M ≤ 2(R+1)</text>
  <text x="168" y="118" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#r)">例 a=5, b=4：M=5，R=4，2(R+1)=10</text>
  <g filter="url(#r)">
    <rect x="46" y="132" width="26" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="74" y="132" width="26" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="102" y="132" width="26" height="32" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="130" y="132" width="26" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="158" y="132" width="26" height="32" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="186" y="132" width="26" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="214" y="132" width="26" height="32" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="242" y="132" width="26" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="270" y="132" width="26" height="32" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="59" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">a</text>
  <text x="87" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">a</text>
  <text x="115" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">b</text>
  <text x="143" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">a</text>
  <text x="171" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">b</text>
  <text x="199" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">a</text>
  <text x="227" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">b</text>
  <text x="255" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">a</text>
  <text x="283" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">b</text>
  <text x="168" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#r)">贪心输出 "aabababab"</text>
  <text x="168" y="212" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#r)">最多的 a 不断被 b 打断、交错消耗</text>
  <text x="168" y="236" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#r)">不变量：任意时刻剩余最大 m ≤ 2(其余+1)</text>
  <text x="168" y="260" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#r)">→ 永远存在可放的字符，绝不搁浅</text>
  <text x="168" y="284" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#r)">终止形态：配额全部清零</text>
  <text x="168" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#r)">L = S = 9 ✓（上界也 = 9）</text>
  <text x="168" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#r)">9 个字符一个不剩，全部用完</text>

  <!-- 右：情形 B -->
  <g filter="url(#r)">
    <rect x="328" y="72" width="288" height="312" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="472" y="98" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a0761e" filter="url(#r)">情形 B：M &gt; 2(R+1)</text>
  <text x="472" y="118" text-anchor="middle" font-size="11.5" fill="#a0761e" filter="url(#r)">例 a=7, b=2：M=7，R=2，2(R+1)=6</text>
  <g filter="url(#r)">
    <rect x="360" y="132" width="26" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="388" y="132" width="26" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="416" y="132" width="26" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="444" y="132" width="26" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="472" y="132" width="26" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="500" y="132" width="26" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="528" y="132" width="26" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="556" y="132" width="26" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="373" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">a</text>
  <text x="401" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">a</text>
  <text x="429" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4a44" filter="url(#r)">b</text>
  <text x="457" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">a</text>
  <text x="485" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">a</text>
  <text x="513" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4a44" filter="url(#r)">b</text>
  <text x="541" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">a</text>
  <text x="569" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">a</text>
  <text x="472" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#r)">贪心输出 "aabaabaa"</text>
  <text x="472" y="212" text-anchor="middle" font-size="11.5" fill="#a0761e" filter="url(#r)">a 严格主导（剩 7−2k &gt; 2−k）→ 节奏固定</text>
  <text x="472" y="236" text-anchor="middle" font-size="11.5" fill="#a0761e" filter="url(#r)">每轮：放 2 个 a（随即阻塞）+ 1 个 b（解除）</text>
  <text x="472" y="260" text-anchor="middle" font-size="11.5" fill="#a0761e" filter="url(#r)">R=2 轮后 b 耗尽，a 还剩 3 → 补 "aa"</text>
  <text x="472" y="284" text-anchor="middle" font-size="11.5" fill="#a0761e" filter="url(#r)">终止形态：尾部 "aa" 且再无分隔符</text>
  <text x="472" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#r)">L = 3R+2 = 8 ✓（a 恰用 6 = 2(R+1) 个）</text>
  <text x="472" y="346" text-anchor="middle" font-size="11" fill="#8a4a44" filter="url(#r)">剩 1 个 a 永远放不下——任何策略都一样</text>

  <!-- 底部总结 -->
  <g filter="url(#r)">
    <rect x="24" y="400" width="592" height="62" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="424" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#r)">两种节奏殊途同归：长度都钉在上界 min(S, 3R+2) 上</text>
  <text x="320" y="448" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#r)">情形 A 时 3R+2 ≥ S，min 取 S；情形 B 时 S &gt; 3R+2，min 取 3R+2</text>
</svg>
