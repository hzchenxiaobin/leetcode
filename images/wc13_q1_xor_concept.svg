<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">异或 = 「哪些位不同」的指示器</text>
  <text x="280" y="48" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">每一位独立运算：相同得 0，不同得 1；于是答案就是 1 的个数</text>

  <text x="155" y="80" font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">bit 3</text>
  <text x="215" y="80" font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">bit 2</text>
  <text x="275" y="80" font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">bit 1</text>
  <text x="335" y="80" font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">bit 0</text>

  <text x="120" y="116.7" font-size="12" fill="#3a4a66" text-anchor="end" filter="url(#rough2)">x = 1</text>
  <rect x="130" y="92" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="116.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="190" y="92" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="215" y="116.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="250" y="92" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="275" y="116.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="310" y="92" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="335" y="116.7" font-size="13" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>

  <text x="120" y="172.7" font-size="12" fill="#3a5a30" text-anchor="end" filter="url(#rough2)">y = 4</text>
  <rect x="130" y="148" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="172.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="190" y="148" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="215" y="172.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="250" y="148" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="275" y="172.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="310" y="148" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="335" y="172.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">0</text>

  <path d="M 215 190 L 215 212" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="3 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 335 190 L 335 212" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="3 3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="120" y="238.7" font-size="12" fill="#8a6a10" text-anchor="end" filter="url(#rough2)">x ^ y = 5</text>
  <rect x="130" y="214" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155" y="238.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="190" y="214" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="238.7" font-size="13" fill="#8a6a10" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="250" y="214" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="275" y="238.7" font-size="13" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="310" y="214" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="238.7" font-size="13" fill="#8a6a10" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="388" y="92" width="146" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="400" y="112.6" font-size="10" fill="#8a6a10" text-anchor="start" filter="url(#rough2)">橙色格：bit 2 / bit 0</text>
  <text x="400" y="129.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">正是 x、y 不同的位置</text>
  <text x="400" y="146.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">共 2 位 → 答案 2</text>

  <rect x="388" y="180" width="146" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="400" y="200.6" font-size="10" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">popcount(0101) = 2</text>
  <text x="400" y="217.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">32 位里只有 4 位参与</text>
  <text x="400" y="234.6" font-size="10" fill="#555" text-anchor="start" filter="url(#rough2)">高位全 0，异或后仍是 0</text>

  <text x="30" y="288" font-size="10.5" fill="#555" text-anchor="start" filter="url(#rough2)">朴素做法逐位取 (x &gt;&gt; i) &amp; 1 再比较；异或把「逐位比较」压成一次运算，把「计数」独立出来。</text>
  <rect x="30" y="298" width="500" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="319.8" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">关键恒等式：hamming(x, y) = popcount(x XOR y)，两种视角一一对应</text>
</svg>
