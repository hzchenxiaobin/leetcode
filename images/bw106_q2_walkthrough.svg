<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：s = "52233"，ans = 4</text>

  <!-- 表格 -->
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <rect x="36" y="44" width="66" height="26" fill="#eef0f2" stroke="#999" stroke-width="1.2"/>
    <rect x="102" y="44" width="86" height="26" fill="#eef0f2" stroke="#999" stroke-width="1.2"/>
    <rect x="188" y="44" width="60" height="26" fill="#eef0f2" stroke="#999" stroke-width="1.2"/>
    <rect x="248" y="44" width="118" height="26" fill="#eef0f2" stroke="#999" stroke-width="1.2"/>
    <rect x="366" y="44" width="52" height="26" fill="#eef0f2" stroke="#999" stroke-width="1.2"/>
    <rect x="418" y="44" width="66" height="26" fill="#eef0f2" stroke="#999" stroke-width="1.2"/>
    <text x="69" y="61" fill="#444">right</text>
    <text x="145" y="61" fill="#444">新字符判定</text>
    <text x="218" y="61" fill="#444">pairs</text>
    <text x="307" y="61" fill="#444">窗口</text>
    <text x="392" y="61" fill="#444">left</text>
    <text x="451" y="61" fill="#444">ans</text>

    <rect x="36" y="70" width="66" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="102" y="70" width="86" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="188" y="70" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="248" y="70" width="118" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="366" y="70" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="418" y="70" width="66" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="69" y="89" fill="#333">1</text>
    <text x="145" y="89" fill="#333">2 ≠ 5</text>
    <text x="218" y="89" fill="#333">0</text>
    <text x="307" y="89" fill="#333">"52"</text>
    <text x="392" y="89" fill="#333">0</text>
    <text x="451" y="89" fill="#333">2</text>

    <rect x="36" y="100" width="66" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="102" y="100" width="86" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="188" y="100" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="248" y="100" width="118" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="366" y="100" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="418" y="100" width="66" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="69" y="119" fill="#333">2</text>
    <text x="145" y="119" fill="#7a5a10">2 == 2 ✓</text>
    <text x="218" y="119" fill="#7a5a10">1</text>
    <text x="307" y="119" fill="#333">"522"</text>
    <text x="392" y="119" fill="#333">0</text>
    <text x="451" y="119" fill="#333">3</text>

    <rect x="36" y="130" width="66" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="102" y="130" width="86" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="188" y="130" width="60" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="248" y="130" width="118" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="366" y="130" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="418" y="130" width="66" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="69" y="149" fill="#333">3</text>
    <text x="145" y="149" fill="#333">3 ≠ 2</text>
    <text x="218" y="149" fill="#333">1</text>
    <text x="307" y="149" fill="#2f5527">"5223"</text>
    <text x="392" y="149" fill="#333">0</text>
    <text x="451" y="149" fill="#2f5527" font-size="13">4</text>

    <rect x="36" y="160" width="66" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="102" y="160" width="86" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="188" y="160" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="248" y="160" width="118" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <rect x="366" y="160" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="418" y="160" width="66" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
    <text x="69" y="179" fill="#333">4</text>
    <text x="145" y="179" fill="#7a5a10">3 == 3 ✓</text>
    <text x="218" y="179" fill="#8c3a36">2 → 1</text>
    <text x="307" y="179" fill="#333">"233"</text>
    <text x="392" y="179" fill="#7a5a10">0 → 2</text>
    <text x="451" y="179" fill="#333">4</text>
  </g>

  <rect x="36" y="206" width="448" height="128" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#7a5a10">
    <text x="56" y="230">right = 4 时窗口 "52233" 内出现两对相等，触发收缩：</text>
    <text x="76" y="252">① s[0]==s[1]？5 ≠ 2，left=1，pairs 仍为 2</text>
    <text x="76" y="274">② s[1]==s[2]？2 == 2，这对 “22” 移出窗口，pairs=1，left=2</text>
    <text x="56" y="296">窗口变成下标 [2..4] 的 "233"，长度 3 &lt; 4，ans 保持 4。</text>
    <text x="56" y="320" font-size="11" fill="#a08030">对照 "1111111"：每一步都恰好 pairs=1 后又被顶破，窗口宽度稳定在 2</text>
  </g>
</svg>
