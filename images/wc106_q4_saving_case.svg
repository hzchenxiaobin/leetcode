<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 336"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="336" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">收益与并列规则：先比收益，再比下标</text>
  <rect x="60" y="60" width="260" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190.0" y="86.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">块内仅 1 个感染源</text>
  <rect x="350" y="60" width="240" height="44" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470.0" y="86.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">收益 = 块大小</text>
  <rect x="60" y="114" width="260" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190.0" y="140.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">块内 ≥ 2 个感染源</text>
  <rect x="350" y="114" width="240" height="44" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470.0" y="140.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">收益 = 0</text>
  <text x="60" y="190" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">并列处理：收益相同 → 取下标最小者（升序遍历 + 严格大于才更新）</text>
  <rect x="60" y="208" width="180" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="231.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">best = min(initial)</text>
  <rect x="260" y="208" width="180" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350.0" y="231.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">bestSave = -1</text>
  <rect x="460" y="208" width="170" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="545.0" y="231.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">for u in sorted(initial)</text>
  <text x="330" y="288" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">若所有块都含 ≥ 2 个感染源，全部收益为 0 → 返回 initial 中最小下标</text>
  <text x="330" y="316" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">这正是示例 2 [0,2]（三块各 1 个源，收益都为 1）取 0 的原因</text>
</svg>
