<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="540" fill="#fdfcf7"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：埃氏筛建表 —— 升序扫描 —— 严格小于更新</text>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <ellipse cx="120" cy="70" rx="66" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="120" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">开始：left, right</text>

  <g filter="url(#sk)">
    <path d="M 186 70 H 216" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- 埃氏筛 -->
  <g filter="url(#sk)">
    <rect x="220" y="46" width="212" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="326" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">埃氏筛建 is_prime[0..right]</text>
  <text x="326" y="84" text-anchor="middle" font-size="10" fill="#555">0/1 置合数；i² ≤ right 时标记 i², i²+i, …</text>

  <g filter="url(#sk)">
    <path d="M 432 70 H 462" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- 初始化 -->
  <g filter="url(#sk)">
    <rect x="466" y="46" width="196" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="564" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a1a">prev = -1, best = +∞</text>
  <text x="564" y="84" text-anchor="middle" font-size="10" fill="#555">ans = [-1, -1]</text>

  <!-- 竖直下落 -->
  <g filter="url(#sk)">
    <path d="M 564 94 V 118 H 190 V 138" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- 循环：x -->
  <g filter="url(#sk)">
    <rect x="96" y="140" width="188" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="190" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">for x in [left, right] 升序</text>

  <!-- 菱形1 -->
  <g filter="url(#sk)">
    <path d="M 190 178 L 262 206 L 190 234 L 118 206 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="190" y="211" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">is_prime[x] ?</text>

  <text x="290" y="200" font-size="11.5" font-weight="bold" fill="#a06a1a">否</text>
  <g filter="url(#sk)">
    <path d="M 262 206 H 330" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="392" y="211" text-anchor="middle" font-size="11" fill="#777">跳过，看下一个 x</text>

  <text x="200" y="250" font-size="11.5" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <path d="M 190 234 V 260" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- 菱形2 -->
  <g filter="url(#sk)">
    <path d="M 190 264 L 290 300 L 190 336 L 90 300 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="190" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">prev ≥ 0 且</text>
  <text x="190" y="313" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">x − prev &lt; best ?</text>

  <text x="205" y="352" font-size="11.5" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <path d="M 190 336 V 366" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="96" y="368" width="188" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="190" y="386" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">best ← x − prev</text>
  <text x="190" y="404" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">ans ← [prev, x]</text>

  <text x="320" y="292" font-size="11.5" font-weight="bold" fill="#a06a1a">否（含并列）</text>
  <g filter="url(#sk)">
    <path d="M 290 300 H 388" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="392" y="280" width="250" height="40" rx="8" fill="#f0f0f0" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="517" y="297" text-anchor="middle" font-size="10.8" fill="#555">不更新：gap ≥ best，</text>
  <text x="517" y="312" text-anchor="middle" font-size="10.8" fill="#555">并列时保住先出现的（num1 更小）</text>

  <g filter="url(#sk)">
    <path d="M 517 320 V 390 H 284" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <path d="M 190 412 V 432" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- prev ← x -->
  <g filter="url(#sk)">
    <rect x="120" y="434" width="164" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="202" y="459" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a1a">prev ← x</text>

  <!-- 菱形3 -->
  <g filter="url(#sk)">
    <path d="M 202 474 L 272 500 L 202 526 L 132 500 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="202" y="505" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e">x &lt; right ?</text>

  <text x="292" y="490" font-size="11.5" font-weight="bold" fill="#3a3a3a">是</text>
  <g filter="url(#sk)">
    <path d="M 272 500 H 448 V 159 H 288" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="340" y="522" font-size="11" fill="#777">取下一个 x</text>

  <text x="120" y="522" font-size="11.5" font-weight="bold" fill="#3a3a3a">否</text>
  <g filter="url(#sk)">
    <path d="M 132 500 H 60 V 348" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- 返回 -->
  <g filter="url(#sk)">
    <rect x="14" y="306" width="92" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="46" y="326" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">返回 ans</text>
  <text x="46" y="342" text-anchor="middle" font-size="9.5" fill="#555">质数 &lt; 2 个则 [-1,-1]</text>

  <!-- 不变式注释框 -->
  <g filter="url(#sk)">
    <rect x="420" y="360" width="242" height="132" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="541" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">为什么这样是对的</text>
  <text x="541" y="406" text-anchor="middle" font-size="10.3" fill="#555">① 最小 gap 只在相邻质数对出现</text>
  <text x="541" y="426" text-anchor="middle" font-size="10.3" fill="#555">② 升序扫描恰遍历全部相邻对</text>
  <text x="541" y="446" text-anchor="middle" font-size="10.3" fill="#555">③ 严格 &lt; 更新 ⇒ 并列时留 num1 最小</text>
  <text x="541" y="466" text-anchor="middle" font-size="10.3" fill="#555">④ prev ≥ 0 挡掉首个质数，防自配对</text>
  <text x="541" y="486" text-anchor="middle" font-size="10.3" fill="#555">⑤ 扫描天然升序 ⇒ 后见对 num1 必更大</text>
</svg>
