<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：map 取每组最大 -&gt; 判个数 -&gt; 取前三</text>
  <text x="260" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">O(n) 建表 + O(D log D) 排序</text>
  <rect x="110" y="56" width="300" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260.0" y="78.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">遍历 i：best[x[i]] = max(best[x[i]], y[i])</text>
  <path d="M 260.0 92 L 260.0 106" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="110" width="300" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260.0" y="132.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">|best| &lt; 3 ?</text>
  <path d="M 260.0 146 L 260.0 160" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="164" width="300" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260.0" y="186.0" font-size="10.5" fill="#b85450" text-anchor="middle" filter="url(#rough2)">是：返回 -1</text>
  <path d="M 260.0 200 L 260.0 214" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="218" width="300" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260.0" y="240.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">否：降序排序，返回前 3 项之和</text>
  <text x="40" y="300" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">只有「同一 x 的次大 y」被丢弃，它们永远不会出现在最优解里</text>
  <text x="40" y="322" font-size="10.5" fill="#999" text-anchor="start" filter="url(#rough2)">因为同一个 x 只能出一个下标，选次大的没有任何收益</text>
</svg>
