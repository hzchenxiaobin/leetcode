<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "AABABBA"，k = 1 → 答案 4</text>
  <text x="300" y="45" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每行是「纳入一个字符」后的状态；橙色行表示触发了左指针收缩</text>

  <!-- 表头 -->
  <rect x="20" y="57" width="560" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="48" y="77" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">r</text>
  <text x="96" y="77" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">s[r]</text>
  <text x="212" y="77" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">窗口 [l, r]</text>
  <text x="330" y="77" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">len</text>
  <text x="374" y="77" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">maxf</text>
  <text x="424" y="77" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">len−maxf</text>
  <text x="482" y="77" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="562" y="77" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- 收缩行底色 -->
  <rect x="20" y="201" width="560" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <rect x="20" y="257" width="560" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行分隔线 -->
  <path d="M 20 117 L 580 117 M 20 145 L 580 145 M 20 173 L 580 173 M 20 201 L 580 201 M 20 229 L 580 229 M 20 257 L 580 257 M 20 285 L 580 285" stroke="#d8d8d8" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
  <rect x="20" y="57" width="560" height="228" rx="5" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- r = 0 -->
  <text x="48" y="108" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">0</text>
  <text x="96" y="108" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">A</text>
  <text x="212" y="108" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">[0, 0]  A</text>
  <text x="330" y="108" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">1</text>
  <text x="374" y="108" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">1</text>
  <text x="424" y="108" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">0</text>
  <text x="482" y="108" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">可行</text>
  <text x="562" y="108" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- r = 1 -->
  <text x="48" y="136" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">1</text>
  <text x="96" y="136" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">A</text>
  <text x="212" y="136" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">[0, 1]  AA</text>
  <text x="330" y="136" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">2</text>
  <text x="374" y="136" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">2</text>
  <text x="424" y="136" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">0</text>
  <text x="482" y="136" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">可行</text>
  <text x="562" y="136" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- r = 2 -->
  <text x="48" y="164" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">2</text>
  <text x="96" y="164" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">B</text>
  <text x="212" y="164" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">[0, 2]  AAB</text>
  <text x="330" y="164" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>
  <text x="374" y="164" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">2</text>
  <text x="424" y="164" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">1</text>
  <text x="482" y="164" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">可行</text>
  <text x="562" y="164" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- r = 3 -->
  <text x="48" y="192" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>
  <text x="96" y="192" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">A</text>
  <text x="212" y="192" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">[0, 3]  AABA</text>
  <text x="330" y="192" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">4</text>
  <text x="374" y="192" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>
  <text x="424" y="192" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">1</text>
  <text x="482" y="192" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">可行</text>
  <text x="562" y="192" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- r = 4 -->
  <text x="48" y="220" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">4</text>
  <text x="96" y="220" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">B</text>
  <text x="212" y="220" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">[0, 4]  AABAB</text>
  <text x="330" y="220" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">5</text>
  <text x="374" y="220" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>
  <text x="424" y="220" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="482" y="220" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">2&gt;k，l→2</text>
  <text x="562" y="220" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- r = 5 -->
  <text x="48" y="248" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">5</text>
  <text x="96" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">B</text>
  <text x="212" y="248" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">[2, 5]  BABB</text>
  <text x="330" y="248" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">4</text>
  <text x="374" y="248" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>
  <text x="424" y="248" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">1</text>
  <text x="482" y="248" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">可行</text>
  <text x="562" y="248" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- r = 6 -->
  <text x="48" y="276" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">6</text>
  <text x="96" y="276" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">A</text>
  <text x="212" y="276" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">[2, 6]  BABBA</text>
  <text x="330" y="276" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">5</text>
  <text x="374" y="276" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">3</text>
  <text x="424" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="482" y="276" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">2&gt;k，l→4</text>
  <text x="562" y="276" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="24" y="314" font-size="9.5" fill="#555" filter="url(#rough2)">r = 4：len − maxf = 5 − 3 = 2 &gt; k，连续弹出 s[0]、s[1] 后 l = 2，窗口变 [2,4] = "BAB"（len 3，maxf 2）；</text>
  <text x="24" y="331" font-size="9.5" fill="#555" filter="url(#rough2)">r = 6：弹出 s[2]、s[3] 后 l = 4，窗口变 [4,6] = "BBA"（len 3，maxf 2），ans 不再增长。</text>
  <text x="24" y="351" font-size="9.5" fill="#555" filter="url(#rough2)">收缩时长度不增加，所以「历史上出现过的最大窗口长度」就是答案，不需要额外检查窗口本身。</text>
  <text x="24" y="371" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">最优来自 r = 5 的窗口 [2,5] = "BABB"：3 个 B 加 1 个 A，把 A 换成 B 得到 "BBBB"。</text>
</svg>
