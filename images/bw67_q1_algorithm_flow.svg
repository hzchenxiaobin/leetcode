<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">算法流程：排序 → 取前 k → 升序还原</text>

  <rect x="120" y="52" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="75" text-anchor="middle" font-size="13" fill="#2b3d52" filter="url(#rough2)">生成下标数组 idx = [0, 1, …, n−1]</text>
  <path d="M 260 90 L 260 108" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="112" width="280" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="135" text-anchor="middle" font-size="13" fill="#6b5215" filter="url(#rough2)">按值 nums[i] 从大到小排序 idx</text>
  <path d="M 260 150 L 260 168" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="172" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="195" text-anchor="middle" font-size="13" fill="#2e4d24" filter="url(#rough2)">截取前 k 个下标（resize(k)）</text>
  <path d="M 260 210 L 260 228" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="232" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="255" text-anchor="middle" font-size="13" fill="#2b3d52" filter="url(#rough2)">这 k 个下标升序排序</text>
  <path d="M 260 270 L 260 288" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="292" width="280" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="315" text-anchor="middle" font-size="13" fill="#7a3b37" filter="url(#rough2)">输出 nums[idx]，即最长和子序列</text>

  <text x="425" y="135" font-size="12" fill="#888" filter="url(#rough2)" transform="rotate(90 425 135)">O(n log n)</text>
  <text x="45" y="255" font-size="12" fill="#888" filter="url(#rough2)" transform="rotate(-90 45 255)">nth_element 可 O(n)</text>
</svg>
