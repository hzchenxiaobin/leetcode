<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,3,2,4,5]，唯一逆序对 (j,k)=(1,2) 贡献 1 × 2 = 2</text>

  <!-- ====== role labels ====== -->
  <text x="172" y="44" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i</text>
  <text x="226" y="44" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">j</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k</text>
  <text x="334" y="44" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">l</text>
  <text x="388" y="44" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">l′</text>

  <!-- ====== array cells ====== -->
  <rect x="148" y="50" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="72" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="202" y="50" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="226" y="72" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="256" y="50" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="310" y="50" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="72" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="364" y="50" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="388" y="72" text-anchor="middle" font-size="13" fill="#333">5</text>

  <!-- ====== indices ====== -->
  <text x="172" y="96" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="226" y="96" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="280" y="96" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="334" y="96" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="388" y="96" text-anchor="middle" font-size="9" fill="#999">4</text>

  <text x="253" y="112" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">(j,k) = (1,2)：nums[j] = 3 &gt; nums[k] = 2，链的中段成立</text>

  <!-- ====== value chain ladder ====== -->
  <text x="280" y="132" text-anchor="middle" font-size="9.5" fill="#555">值链阶梯（值递增，位置交错）：</text>
  <rect x="136" y="140" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="163" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="163" y="167" text-anchor="middle" font-size="7.5" fill="#446688">位置 0（i）</text>
  <text x="212" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">&lt;</text>
  <rect x="228" y="140" width="54" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="255" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="255" y="167" text-anchor="middle" font-size="7.5" fill="#4a7a3a">位置 2（k）</text>
  <text x="304" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">&lt;</text>
  <rect x="320" y="140" width="54" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="347" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="347" y="167" text-anchor="middle" font-size="7.5" fill="#d6a040">位置 1（j）</text>
  <text x="396" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">&lt;</text>
  <rect x="412" y="140" width="54" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="439" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="439" y="167" text-anchor="middle" font-size="7.5" fill="#446688">位置 3（l）</text>

  <!-- ====== left A box ====== -->
  <rect x="30" y="186" width="240" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="204" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">左侧候选 i：i &lt; 1 且 nums[i] &lt; nums[k] = 2</text>
  <text x="150" y="222" text-anchor="middle" font-size="10" fill="#333">i = 0：nums[0] = 1 &lt; 2　✓</text>
  <text x="150" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">A = 1</text>

  <!-- ====== multiply ====== -->
  <text x="280" y="228" text-anchor="middle" font-size="20" fill="#b85450" font-weight="bold">×</text>

  <!-- ====== right B box ====== -->
  <rect x="290" y="186" width="240" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="204" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">右侧候选 l：l &gt; 2 且 nums[l] &gt; nums[j] = 3</text>
  <text x="410" y="222" text-anchor="middle" font-size="10" fill="#333">l = 3：4 &gt; 3　✓　　l = 4：5 &gt; 3　✓</text>
  <text x="410" y="246" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">B = 2</text>

  <!-- ====== contribution box ====== -->
  <rect x="30" y="272" width="500" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">贡献 = A × B = 1 × 2 = 2</text>
  <text x="280" y="307" text-anchor="middle" font-size="10" fill="#333">四元组 (0,1,2,3)：1 &lt; 2 &lt; 3 &lt; 4　与　(0,1,2,4)：1 &lt; 2 &lt; 3 &lt; 5</text>

  <!-- ====== bottom note ====== -->
  <rect x="30" y="326" width="500" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="343" text-anchor="middle" font-size="9.5" fill="#555">其余 (j,k)（如 (0,1)、(0,2)、(1,3)…）均满足 nums[j] &lt; nums[k]，链在中段断裂，贡献 0</text>
  <text x="280" y="359" text-anchor="middle" font-size="9.5" fill="#555">示例 2 [1,2,3,4] 没有任何逆序对 ⇒ 答案 0</text>
</svg>
