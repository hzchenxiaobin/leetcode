<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="360" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">每个下标只关心「是否使用奇数次」</text>
  <text x="150" y="76" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">第一个子序列</text>
  <text x="450" y="76" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">第二个子序列</text>
  <rect x="70" y="92" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="95" y="118" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">i=0</text>
  <rect x="132" y="92" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="157" y="118" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">i=2</text>
  <rect x="194" y="92" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="219" y="118" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">i=3</text>
  <rect x="410" y="92" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="118" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">i=1</text>
  <rect x="472" y="92" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="497" y="118" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">i=2</text>
  <path d="M 268 112 L 396 112" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="100" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">对称差</text>
  <rect x="220" y="168" width="160" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="190" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">只出现一次：i = 0, 1, 3</text>
  <text x="300" y="206" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">下标 2 出现两次被抵消</text>
  <rect x="60" y="244" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="78" y="270" text-anchor="start" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">X⊕Y = ⊕_{a_i=1} nums[i] ⊕ ⊕_{b_i=1} nums[i] = ⊕_{a_i⊕b_i=1} nums[i]</text>
  <text x="78" y="294" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">反之：任取集合 S，让第一个子序列恰为 S、第二个为空，即可得到 ⊕_{i∈S} nums[i]</text>
  <text x="78" y="316" text-anchor="start" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">结论：本题 = 求所有子集异或的最大值（含空集 0）</text>
</svg>
