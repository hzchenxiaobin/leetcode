<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：调转视角——「组找因数」翻转为「值盖倍数」</text>
  <path d="M 110 38 Q 340 46 570 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- top contrast -->
  <g filter="url(#rough2)">
    <rect x="36" y="54" width="246" height="74" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="159" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">「组找因数」视角</text>
  <text x="159" y="95" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">每组顺序扫 elements 找因数</text>
  <text x="159" y="113" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">O(n·m) ≈ 10¹⁰ ✗</text>

  <g filter="url(#rough2)">
    <path d="M 292 91 L 384 91" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="338" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a1a" filter="url(#rough2)">调转视角</text>

  <g filter="url(#rough2)">
    <rect x="398" y="54" width="246" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="521" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">「值盖倍数」视角</text>
  <text x="521" y="95" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">每个出现值 v 标记 v, 2v, 3v, …</text>
  <text x="521" y="113" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">O(M log M) ≈ 1.2×10⁶ ✓</text>

