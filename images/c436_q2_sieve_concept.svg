  <text x="340" y="426" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">调和级数直观：v 越大戳越稀（v=2 盖 8 个、v=4 盖 4 个、v&gt;8 各盖 1 个）</text>
  <text x="340" y="446" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">Σ⌊M/v⌋ ≈ M·ln M ≈ 1.2×10⁶（M = 10⁵），与 n、m 无关</text>
</svg>
