<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">前缀判定模型：s = "abc" 的前缀只有 3 个</text>

  <!-- s 的字符条 -->
  <g filter="url(#rough2)">
    <rect x="120" y="58" width="72" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="196" y="58" width="72" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="272" y="58" width="72" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="19" fill="#333" text-anchor="middle">
    <text x="156" y="87">a</text><text x="232" y="87">b</text><text x="308" y="87">c</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888" text-anchor="middle">
    <text x="156" y="120">下标 0</text><text x="232" y="120">下标 1</text><text x="308" y="120">下标 2</text>
  </g>
  <text x="108" y="87" font-size="13" fill="#666" text-anchor="end" filter="url(#rough2)">s =</text>

  <!-- 前缀括线 -->
  <g filter="url(#rough2)" stroke="#4a7a3a" fill="none" stroke-width="1.8">
    <path d="M 120 138 Q 156 152 192 138"/>
    <path d="M 120 162 Q 232 178 344 162"/>
    <path d="M 120 186 Q 232 202 344 186"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#2d5a22" text-anchor="middle">
    <text x="156" y="158">"a"</text>
    <text x="232" y="184">"ab"</text>
    <text x="232" y="208">"abc"</text>
  </g>
  <path d="M 400 178 L 442 178" stroke="#bbb" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="448" y="156" width="86" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="491" y="176" text-anchor="middle" font-size="12.5" fill="#2d5a22" filter="url(#rough2)">前缀集合</text>
  <text x="491" y="192" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">{a, ab, abc}</text>

  <!-- 判定规则框 -->
  <rect x="60" y="228" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="247" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">w 是 s 的前缀  ⟺  len(w) ≤ len(s) 且 s[0..len(w)−1] = w</text>
  <text x="280" y="264" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">（长度合法 + 开头逐字符相等，两条缺一不可）</text>

  <!-- 反例提示 -->
  <rect x="60" y="284" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">反例："bc" 出现在 s 中却不是前缀；"abcd" 长于 s 也不是前缀</text>
</svg>
