<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="420" fill="#fafafa"/>

  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：queryTime = 4 时逐个学生判定</text>
  <text x="350" y="50" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">startTime = [1,2,3]，endTime = [3,2,7]，逐个检查两个端点不等式</text>

  <rect x="60" y="72" width="580" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="60" y="112" width="580" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="60" y="152" width="580" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="60" y="192" width="580" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <path d="M 140 72 L 140 232" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 250 72 L 250 232" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 360 72 L 360 232" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 460 72 L 460 232" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 560 72 L 560 232" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="100" y="97" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">学生 i</text>
  <text x="195" y="97" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">startTime[i]</text>
  <text x="305" y="97" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">endTime[i]</text>
  <text x="410" y="97" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">start ≤ 4 ?</text>
  <text x="510" y="97" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">4 ≤ end ?</text>
  <text x="600" y="97" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">是否命中</text>

  <text x="100" y="138" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="195" y="138" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="305" y="138" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="410" y="138" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">是</text>
  <text x="510" y="138" text-anchor="middle" font-size="12.5" fill="#8f3830" filter="url(#rough2)">否</text>
  <text x="600" y="138" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830" filter="url(#rough2)">✗</text>

  <text x="100" y="178" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="195" y="178" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="305" y="178" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="410" y="178" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">是</text>
  <text x="510" y="178" text-anchor="middle" font-size="12.5" fill="#8f3830" filter="url(#rough2)">否</text>
  <text x="600" y="178" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830" filter="url(#rough2)">✗</text>

  <text x="100" y="218" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="195" y="218" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="305" y="218" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="410" y="218" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">是</text>
  <text x="510" y="218" text-anchor="middle" font-size="12.5" fill="#2e5a24" filter="url(#rough2)">是</text>
  <text x="600" y="218" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">✓</text>

  <rect x="60" y="248" width="580" height="40" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="273" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">ans = 0（学生 0）+ 0（学生 1）+ 1（学生 2）= 1</text>

  <rect x="60" y="306" width="580" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">计数分解：ans = #{startTime[i] ≤ q} − #{endTime[i] &lt; q}</text>
  <text x="350" y="354" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">= 3（1, 2, 3 都 ≤ 4）− 2（3, 2 &lt; 4）= 1</text>
  <text x="350" y="382" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">两个量各自只依赖一个端点 → 可排序 + 二分，也可差分前缀和</text>
</svg>
