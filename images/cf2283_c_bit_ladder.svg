<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="452" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">位梯子：从低位到高位，逐位钉死 y</text>
  <path d="M 190 46 Q 380 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="46" y="62" width="226" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="159" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">先令 y₀ = 0</text>
  <text x="159" y="108" text-anchor="middle" font-size="10.5" fill="#3c5a78" filter="url(#rough2)">另一种选法 = 全体取反</text>

  <path d="M 276 91 L 296 91" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="302" y="62" width="412" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="508" y="88" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a33b36" filter="url(#rough2)">对 b = 1..B：y_b = 1 ⊕ x_b ⊕ y_(b−1)</text>
  <text x="508" y="108" text-anchor="middle" font-size="10.5" fill="#8a3b36" filter="url(#rough2)">来源：m_b = x_b ⊕ y_b ⊕ y_(b−1) 必须等于 1</text>

  <path d="M 477 124 L 477 148" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 477 152 L 597 196 L 477 240 L 357 196 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="477" y="202" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">推出的 y_B = 1 ？</text>

  <path d="M 357 196 L 300 196 L 300 246" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="188" font-size="12" fill="#a33b36" filter="url(#rough2)">是</text>

  <path d="M 597 196 L 648 196 L 648 246" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="616" y="188" font-size="12" fill="#2f5223" filter="url(#rough2)">否</text>

  <rect x="40" y="252" width="340" height="80" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a33b36" filter="url(#rough2)">全体取反（等价于改令 y₀ = 1）</text>
  <text x="210" y="300" text-anchor="middle" font-size="11" fill="#8a3b36" filter="url(#rough2)">第 B 位随即变 0，只保留低 B 位</text>
  <text x="210" y="320" text-anchor="middle" font-size="10.5" fill="#8a3b36" filter="url(#rough2)">b &lt; B 的等式不受影响：y_b ⊕ y_(b−1) 不变</text>

  <rect x="400" y="252" width="322" height="80" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="561" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">y_B = 0 已经合法</text>
  <text x="561" y="300" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">Y = Σ y_b · 2^b 就是答案</text>
  <text x="561" y="320" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">两种 y₀ 只有一种能让 y_B = 0</text>

  <path d="M 210 332 L 210 358 L 320 358" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 561 332 L 561 358 L 440 358" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="366" width="484" height="64" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="382" y="392" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输出：对每个 y_b = 1 的位，翻倍元素 2^b</text>
  <text x="382" y="414" text-anchor="middle" font-size="10.5" fill="#3c5a78" filter="url(#rough2)">元素 2^b 的位置就是下标 2^b，不是下标 b</text>
</svg>
