<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path filter="url(#rough2)" d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="30" font-size="16" fill="#333" filter="url(#rough2)">示例走查：先按行把首列翻成全 1，再按列把 1 多的方向留下</text>

  <text x="80" y="60" font-size="13" fill="#666" filter="url(#rough2)">原始 grid</text>
  <rect x="60" y="72" width="40" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="100" y="72" width="40" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="140" y="72" width="40" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="180" y="72" width="40" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <rect x="60" y="104" width="40" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="100" y="104" width="40" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="140" y="104" width="40" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="180" y="104" width="40" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <rect x="60" y="136" width="40" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="100" y="136" width="40" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="140" y="136" width="40" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="180" y="136" width="40" height="32" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <path d="M232,120 L322,120" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="277" y="108" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第 0 行首列为 0</text>
  <text x="277" y="140" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">翻转第 0 行</text>

  <text x="390" y="60" font-size="13" fill="#666" filter="url(#rough2)">行翻转后</text>
  <rect x="340" y="72" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="380" y="72" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="400" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="420" y="72" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="440" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="460" y="72" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="94" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <rect x="340" y="104" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="380" y="104" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="400" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="420" y="104" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="440" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="460" y="104" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="126" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <rect x="340" y="136" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="380" y="136" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="400" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="420" y="136" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="440" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="460" y="136" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <text x="60" y="196" font-size="12" fill="#333" filter="url(#rough2)">各列 1 的个数：</text>
  <text x="200" y="196" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="260" y="196" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="320" y="196" font-size="12" fill="#b85450" filter="url(#rough2)">1 → 翻成 2</text>
  <text x="440" y="196" font-size="12" fill="#b85450" filter="url(#rough2)">0 → 翻成 3</text>

  <text x="340" y="196" font-size="12" fill="#666" filter="url(#rough2)">列翻转后（第 2、3 列 1 偏少，各翻一次）</text>

  <rect x="340" y="212" width="160" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="234" font-size="14" fill="#333" filter="url(#rough2)">1 1 1 1</text>
  <text x="520" y="234" font-size="13" fill="#d6a040" filter="url(#rough2)">= 15</text>
  <rect x="340" y="244" width="160" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="266" font-size="14" fill="#333" filter="url(#rough2)">1 0 0 1</text>
  <text x="520" y="266" font-size="13" fill="#d6a040" filter="url(#rough2)">= 9</text>
  <rect x="340" y="276" width="160" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="298" font-size="14" fill="#333" filter="url(#rough2)">1 1 1 1</text>
  <text x="520" y="298" font-size="13" fill="#d6a040" filter="url(#rough2)">= 15</text>

  <text x="60" y="300" font-size="14" fill="#4a7a3a" filter="url(#rough2)">总分 = 15 + 9 + 15 = 39</text>
  <text x="60" y="330" font-size="11" fill="#666" filter="url(#rough2)">每列的 1 越多越好，因为同一列的所有 1 共享同一个权重。</text>
</svg>
