<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="410" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">合法重新排列数对：数对 = 有向边，重排 = 欧拉路径</text>

  <!-- ============ 左：输入数对 ============ -->
  <text x="95" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">pairs（输入数对）</text>

  <g filter="url(#rough2)">
    <rect x="30" y="70" width="130" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="95" y="92" text-anchor="middle" font-size="11" fill="#333">pairs[0] = [5,1]</text>
    <rect x="30" y="112" width="130" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="95" y="134" text-anchor="middle" font-size="11" fill="#333">pairs[1] = [4,5]</text>
    <rect x="30" y="154" width="130" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="95" y="176" text-anchor="middle" font-size="11" fill="#333">pairs[2] = [11,9]</text>
    <rect x="30" y="196" width="130" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="95" y="218" text-anchor="middle" font-size="11" fill="#333">pairs[3] = [9,4]</text>
  </g>

  <!-- ============ 中：转换说明 ============ -->
  <text x="222" y="118" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">每个数对 [u,v]</text>
  <text x="222" y="134" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">即有向边 u → v</text>
  <path d="M 160 152 Q 222 178 282 152" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ============ 右：有向图 ============ -->
  <text x="455" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">有向图 G（一条链）</text>

  <!-- edges -->
  <g stroke="#446688" stroke-width="1.7">
    <line x1="337" y1="105" x2="386" y2="90" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="421" y1="92" x2="473" y2="105" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="478" y1="126" x2="446" y2="177" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="419" y1="203" x2="349" y2="222" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>

  <!-- edge labels -->
  <g font-size="8.5" fill="#8a6a1a" text-anchor="middle" filter="url(#rough2)">
    <text x="362" y="114">[11,9]</text>
    <text x="447" y="88">[9,4]</text>
    <text x="472" y="148">[4,5]</text>
    <text x="376" y="200">[5,1]</text>
  </g>

  <!-- nodes -->
  <g filter="url(#rough2)">
    <circle cx="320" cy="110" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="320" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5e24">11</text>
    <circle cx="405" cy="85" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="405" y="90" text-anchor="middle" font-size="12" fill="#333">9</text>
    <circle cx="490" cy="110" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="490" y="115" text-anchor="middle" font-size="12" fill="#333">4</text>
    <circle cx="435" cy="195" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="435" y="200" text-anchor="middle" font-size="12" fill="#333">5</text>
    <circle cx="330" cy="230" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="330" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1a">1</text>
  </g>
  <text x="320" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">起点：out−in = +1</text>
  <text x="330" y="262" text-anchor="middle" font-size="9" fill="#8a6a1a" filter="url(#rough2)">终点：in−out = +1</text>
  <text x="480" y="266" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">11 → 9 → 4 → 5 → 1 恰是一条欧拉路径</text>

  <!-- ============ 底部：核心观察 ============ -->
  <g filter="url(#rough2)">
    <rect x="25" y="300" width="570" height="74" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="310" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5e24">合法排列 = 全部 n 条边排成一串、每条边用且只用一次 —— 欧拉路径</text>
    <text x="310" y="345" text-anchor="middle" font-size="10" fill="#2f5e24">start ≠ end ⇒ 无自环；数对互不相同 ⇒ 无重边</text>
    <text x="310" y="363" text-anchor="middle" font-size="10" fill="#2f5e24">题目保证有解 ⇒ G 必存在欧拉路径，Hierholzer 线性构造即可</text>
  </g>
</svg>
