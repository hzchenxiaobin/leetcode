<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">num = 11891：换第一个非 9 得最大，换最高位得最小</text>

  <!-- 原数 -->
  <text x="280" y="62" font-size="13" fill="#666" filter="url(#rough2)" text-anchor="middle">原数</text>
  <g filter="url(#rough2)" font-size="22" font-weight="bold" text-anchor="middle">
    <rect x="140" y="72" width="46" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="186" y="72" width="46" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="232" y="72" width="46" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="278" y="72" width="46" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="324" y="72" width="46" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="163" y="105" fill="#2d4a66">1</text><text x="209" y="105" fill="#2d4a66">1</text>
    <text x="255" y="105" fill="#2d4a66">8</text><text x="301" y="105" fill="#2d4a66">9</text>
    <text x="347" y="105" fill="#2d4a66">1</text>
  </g>

  <!-- 最大值分支 -->
  <path d="M 200 128 C 180 156, 160 160, 140 178" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="128" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最大：第一个非 9 是 '1' → 全换 9</text>
  <g filter="url(#rough2)" font-size="22" font-weight="bold" text-anchor="middle">
    <rect x="60" y="186" width="46" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
    <rect x="106" y="186" width="46" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
    <rect x="152" y="186" width="46" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <rect x="198" y="186" width="46" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
    <rect x="244" y="186" width="46" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
    <text x="83" y="219" fill="#2d5a22">9</text><text x="129" y="219" fill="#2d5a22">9</text>
    <text x="175" y="219" fill="#7a5c1e">8</text><text x="221" y="219" fill="#2d5a22">9</text>
    <text x="267" y="219" fill="#2d5a22">9</text>
  </g>
  <text x="175" y="252" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)" text-anchor="middle">mx = 99899</text>

  <!-- 最小值分支 -->
  <path d="M 360 128 C 380 156, 400 160, 420 178" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="150" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)" text-anchor="middle">最小：最高位 '1' → 全换 0</text>
  <g filter="url(#rough2)" font-size="22" font-weight="bold" text-anchor="middle">
    <rect x="330" y="186" width="46" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6"/>
    <rect x="376" y="186" width="46" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6"/>
    <rect x="422" y="186" width="46" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <rect x="468" y="186" width="46" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="353" y="219" fill="#8a3a34">0</text><text x="399" y="219" fill="#8a3a34">0</text>
    <text x="445" y="219" fill="#7a5c1e">8</text><text x="491" y="219" fill="#2d5a22">9</text>
    <rect x="330" y="240" width="0" height="0" fill="none"/>
  </g>
  <text x="422" y="252" font-size="14" fill="#8a3a34" font-weight="bold" filter="url(#rough2)" text-anchor="middle">"00890" → mn = 890</text>

  <!-- 差值 -->
  <rect x="120" y="278" width="320" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="15" fill="#2d4a66" font-weight="bold" filter="url(#rough2)">99899 − 890 = 99009</text>

  <!-- 底部要点 -->
  <rect x="60" y="330" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">位数权重左高右低：改进越靠左收益越大；</text>
  <text x="280" y="364" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">最高位归零直接砍掉一个数量级，降幅最大</text>
</svg>
