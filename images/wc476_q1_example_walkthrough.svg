<svg xmlns="http://www.w3.org/2000/svg" width="640" height="465" viewBox="0 0 640 465" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="465" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 2 演算：nums = [−2, 0, 5, −2, 4]</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1: original array -->
  <text x="320" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">① 原数组</text>
  <g filter="url(#sk)">
    <rect x="152" y="78" width="56" height="38" rx="4" fill="#fffdf3" stroke="#a8a494" stroke-width="1.2"/>
    <rect x="222" y="78" width="56" height="38" rx="4" fill="#fffdf3" stroke="#a8a494" stroke-width="1.2"/>
    <rect x="292" y="78" width="56" height="38" rx="4" fill="#fffdf3" stroke="#a8a494" stroke-width="1.2"/>
    <rect x="362" y="78" width="56" height="38" rx="4" fill="#fffdf3" stroke="#a8a494" stroke-width="1.2"/>
    <rect x="432" y="78" width="56" height="38" rx="4" fill="#fffdf3" stroke="#a8a494" stroke-width="1.2"/>
  </g>
  <g font-size="15" fill="#555" text-anchor="middle" font-weight="bold">
    <text x="180" y="102">−2</text>
    <text x="250" y="102">0</text>
    <text x="320" y="102">5</text>
    <text x="390" y="102">−2</text>
    <text x="460" y="102">4</text>
  </g>

  <path d="M 320 124 L 320 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 2: sorted -->
  <text x="320" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">② 排序（从大到小）</text>
  <g filter="url(#sk)">
    <rect x="152" y="182" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="222" y="182" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="292" y="182" width="56" height="38" rx="4" fill="#fffdf3" stroke="#a8a494" stroke-width="1.2"/>
    <rect x="362" y="182" width="56" height="38" rx="4" fill="#fffdf3" stroke="#a8a494" stroke-width="1.2"/>
    <rect x="432" y="182" width="56" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <text x="180" y="206" fill="#3a6a2a">5</text>
    <text x="250" y="206" fill="#3a6a2a">4</text>
    <text x="320" y="206" fill="#777">0</text>
    <text x="390" y="206" fill="#777">−2</text>
    <text x="460" y="206" fill="#a04a48">−2</text>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="bold">
    <text x="180" y="242" fill="#4a7a3a">a</text>
    <text x="250" y="242" fill="#4a7a3a">b</text>
    <text x="320" y="242" fill="#999">不选</text>
    <text x="460" y="242" fill="#b85450">c</text>
  </g>
  <text x="320" y="262" text-anchor="middle" font-size="11" fill="#888">两个 −2 任选其一作 c（下标不同即可）</text>

  <path d="M 320 272 L 320 298" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- step 3: formula -->
  <text x="320" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">③ 代入表达式</text>
  <g filter="url(#sk)">
    <rect x="100" y="324" width="440" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="347" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" font-family="monospace">a + b − c = 5 + 4 − (−2)</text>
  <text x="320" y="371" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415" font-family="monospace">= 9 + 2 = 11 ✓</text>

  <!-- negative number note -->
  <g filter="url(#sk)">
    <rect x="100" y="396" width="440" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="418" text-anchor="middle" font-size="12" fill="#446688">负数不吓人：减去 −2 相当于加上 2，c 越小（越负）贡献越大</text>
  <text x="320" y="438" text-anchor="middle" font-size="12" fill="#446688">全负同理：[−5, −1, −3] → (−1) + (−3) − (−5) = 1</text>
</svg>
