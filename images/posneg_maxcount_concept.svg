<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">升序数组：负 / 零 / 正三段连续，两次二分定段长</text>
  <g filter="url(#sk)"><path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none"/></g>

  <!-- segment braces -->
  <g filter="url(#sk)"><path d="M 80 96 Q 164 84 248 96" stroke="#446688" stroke-width="1.6" fill="none"/></g>
  <text x="164" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688">负数段 neg = 3</text>
  <g filter="url(#sk)"><path d="M 248 96 Q 304 84 360 96" stroke="#999" stroke-width="1.6" fill="none"/></g>
  <text x="304" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#888">零段 = 2</text>
  <g filter="url(#sk)"><path d="M 360 96 Q 416 84 472 96" stroke="#4a7a3a" stroke-width="1.6" fill="none"/></g>
  <text x="416" y="76" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">正数段 pos = 2</text>

  <!-- array cells: [-3,-2,-1,0,0,1,2] -->
  <g filter="url(#sk)">
    <rect x="80" y="108" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="136" y="108" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="192" y="108" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="248" y="108" width="56" height="38" rx="4" fill="#f2f2ee" stroke="#999" stroke-width="1.5"/>
    <rect x="304" y="108" width="56" height="38" rx="4" fill="#f2f2ee" stroke="#999" stroke-width="1.5"/>
    <rect x="360" y="108" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="416" y="108" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="108" y="131" text-anchor="middle" font-size="12" fill="#333">−3</text>
  <text x="164" y="131" text-anchor="middle" font-size="12" fill="#333">−2</text>
  <text x="220" y="131" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <text x="276" y="131" text-anchor="middle" font-size="12" fill="#777">0</text>
  <text x="332" y="131" text-anchor="middle" font-size="12" fill="#777">0</text>
  <text x="388" y="131" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="444" y="131" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="108" y="163" text-anchor="middle" font-size="9.5" fill="#999">0</text>
  <text x="164" y="163" text-anchor="middle" font-size="9.5" fill="#999">1</text>
  <text x="220" y="163" text-anchor="middle" font-size="9.5" fill="#999">2</text>
  <text x="276" y="163" text-anchor="middle" font-size="9.5" fill="#999">3</text>
  <text x="332" y="163" text-anchor="middle" font-size="9.5" fill="#999">4</text>
  <text x="388" y="163" text-anchor="middle" font-size="9.5" fill="#999">5</text>
  <text x="444" y="163" text-anchor="middle" font-size="9.5" fill="#999">6</text>

  <!-- boundary cut lines + arrows -->
  <g filter="url(#sk)">
    <path d="M 248 102 L 248 150" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
    <path d="M 248 240 L 248 154" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="248" y="262" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">lower_bound(0) = 3</text>
  <text x="248" y="279" text-anchor="middle" font-size="11" fill="#b03a3a">⇒ neg = 3</text>
  <g filter="url(#sk)">
    <path d="M 360 102 L 360 150" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
    <path d="M 360 302 L 360 154" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="360" y="322" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">upper_bound(0) = 5</text>
  <text x="360" y="339" text-anchor="middle" font-size="11" fill="#b03a3a">⇒ pos = 7 − 5 = 2</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="496" y="100" width="166" height="130" rx="10" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="579" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">公式</text>
  <text x="579" y="148" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">ans = max(</text>
  <text x="579" y="166" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">  lower_bound(0),</text>
  <text x="579" y="184" text-anchor="middle" font-size="11" fill="#444" font-family="monospace">  n − upper_bound(0))</text>
  <text x="579" y="210" text-anchor="middle" font-size="10" fill="#888">两次二分 O(log n)</text>

  <!-- why zero is skipped -->
  <g filter="url(#sk)">
    <rect x="496" y="248" width="166" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="579" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">为什么 0 不计入？</text>
  <text x="579" y="291" text-anchor="middle" font-size="10.5" fill="#555">0 ≥ 0 → 在 lower 右侧</text>
  <text x="579" y="309" text-anchor="middle" font-size="10.5" fill="#555">0 ≯ 0 → 在 upper 左侧</text>
  <text x="579" y="331" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">⇒ 零段被夹住，跳过 ✓</text>

  <!-- key insight -->
  <g filter="url(#sk)">
    <rect x="40" y="356" width="600" height="52" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="60" y="378" font-size="12" font-weight="bold" fill="#2b2b2b">关键观察：非递减 ⇒ 负 / 零 / 正三类各成连续段；两侧个数 = 段长 = 边界下标之差，</text>
  <text x="60" y="396" font-size="11.5" fill="#444">而边界可二分定位 ⇒ O(log n)。「有序数组 + 按值计数」是直接触发二分反射的标准信号。</text>
</svg>
