<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 570" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="570" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：枚举点对 → 解圆心 → 计数取最大</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">总复杂度 O(n³)，n ≤ 100 时约 10⁶ 次距离计算</text>

  <rect x="145" y="68" width="270" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="90" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">ans = 1（至少覆盖 1 枚飞镖）</text>

  <path d="M 280 104 L 280 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="145" y="126" width="270" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="148" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">枚举点对 (i, j)，i &lt; j</text>

  <path d="M 280 162 L 280 175" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,177 390,205 280,233 170,205" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="209" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">d = |AB| ≤ 2r ?</text>

  <path d="M 390 205 L 424 205" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="399" y="198" font-size="10" fill="#8a3a36" filter="url(#rough2)">否</text>
  <rect x="428" y="186" width="112" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="484" y="202" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">该点对无候选圆心</text>
  <text x="484" y="216" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">继续下一对</text>

  <path d="M 280 233 L 280 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="251" font-size="10" fill="#3a5a30" filter="url(#rough2)">是</text>

  <rect x="140" y="260" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">M = (A+B)/2，u = (−Δy, Δx) / d</text>

  <path d="M 280 296 L 280 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="318" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">h = √(r² − (d/2)²)，C± = M ± h·u</text>

  <path d="M 280 354 L 280 376" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="378" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">对 C₁、C₂ 各数一遍：满足 dist(P, C) ≤ r + ε</text>
  <text x="280" y="412" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">的飞镖枚数 cnt</text>

  <path d="M 280 422 L 280 446" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="448" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="470" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">ans = max(ans, cnt)</text>

  <path d="M 280 484 L 280 506" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="145" y="508" width="270" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="529" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">点对枚举完 → 返回 ans</text>
</svg>
