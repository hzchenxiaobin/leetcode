<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 走查：s = "cdbcbbaaabab", x = 4, y = 5（y 更大，先删 ba）</text>

  <!-- 第一遍：删 ba -->
  <text x="30" y="58" font-size="13" fill="#b85450" filter="url(#rough2)">第一遍删 ba：+5/对</text>
  <!-- 12 个格子：x = 44 + 36i -->
  <g filter="url(#rough2)">
    <rect x="44" y="64" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="61" y="85" text-anchor="middle" font-size="14" fill="#446688">c</text>
    <rect x="80" y="64" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="97" y="85" text-anchor="middle" font-size="14" fill="#446688">d</text>
    <rect x="116" y="64" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="133" y="85" text-anchor="middle" font-size="14" fill="#446688">b</text>
    <rect x="152" y="64" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="169" y="85" text-anchor="middle" font-size="14" fill="#446688">c</text>
    <rect x="188" y="64" width="34" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="205" y="85" text-anchor="middle" font-size="14" fill="#b85450">b</text>
    <rect x="224" y="64" width="34" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="241" y="85" text-anchor="middle" font-size="14" fill="#b85450">b</text>
    <rect x="260" y="64" width="34" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="277" y="85" text-anchor="middle" font-size="14" fill="#b85450">a</text>
    <rect x="296" y="64" width="34" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="313" y="85" text-anchor="middle" font-size="14" fill="#b85450">a</text>
    <rect x="332" y="64" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="349" y="85" text-anchor="middle" font-size="14" fill="#446688">a</text>
    <rect x="368" y="64" width="34" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="385" y="85" text-anchor="middle" font-size="14" fill="#b85450">b</text>
    <rect x="404" y="64" width="34" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="421" y="85" text-anchor="middle" font-size="14" fill="#b85450">a</text>
    <rect x="440" y="64" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="457" y="85" text-anchor="middle" font-size="14" fill="#446688">b</text>
  </g>
  <!-- 配对弧线 -->
  <path d="M224,100 Q232,118 242,100" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M188,102 Q232,132 296,102" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M368,100 Q384,118 420,100" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="494" y="85" font-size="13" fill="#b85450" filter="url(#rough2)">+15</text>

  <text x="30" y="150" font-size="12" fill="#777" filter="url(#rough2)">剩余串：</text>
  <g filter="url(#rough2)">
    <rect x="152" y="136" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="169" y="156" text-anchor="middle" font-size="14" fill="#4a7a3a">c</text>
    <rect x="188" y="136" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="205" y="156" text-anchor="middle" font-size="14" fill="#4a7a3a">d</text>
    <rect x="224" y="136" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="241" y="156" text-anchor="middle" font-size="14" fill="#4a7a3a">b</text>
    <rect x="260" y="136" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="277" y="156" text-anchor="middle" font-size="14" fill="#4a7a3a">c</text>
    <rect x="296" y="136" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="313" y="156" text-anchor="middle" font-size="14" fill="#8a6d3b">a</text>
    <rect x="332" y="136" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="349" y="156" text-anchor="middle" font-size="14" fill="#8a6d3b">b</text>
  </g>

  <!-- 第二遍：删 ab -->
  <text x="30" y="212" font-size="13" fill="#b85450" filter="url(#rough2)">第二遍删 ab：+4/对</text>
  <path d="M313,172 Q313,192 313,200" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="152" y="204" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="169" y="225" text-anchor="middle" font-size="14" fill="#446688">c</text>
    <rect x="188" y="204" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="205" y="225" text-anchor="middle" font-size="14" fill="#446688">d</text>
    <rect x="224" y="204" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="241" y="225" text-anchor="middle" font-size="14" fill="#446688">b</text>
    <rect x="260" y="204" width="34" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="277" y="225" text-anchor="middle" font-size="14" fill="#446688">c</text>
    <rect x="296" y="204" width="34" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="313" y="225" text-anchor="middle" font-size="14" fill="#b85450">a</text>
    <rect x="332" y="204" width="34" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="349" y="225" text-anchor="middle" font-size="14" fill="#b85450">b</text>
  </g>
  <path d="M296,240 Q313,258 348,240" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="392" y="225" font-size="13" fill="#b85450" filter="url(#rough2)">+4</text>

  <text x="30" y="282" font-size="12" fill="#777" filter="url(#rough2)">最终剩余：</text>
  <g filter="url(#rough2)">
    <rect x="188" y="268" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="205" y="288" text-anchor="middle" font-size="14" fill="#4a7a3a">c</text>
    <rect x="224" y="268" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="241" y="288" text-anchor="middle" font-size="14" fill="#4a7a3a">d</text>
    <rect x="260" y="268" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="277" y="288" text-anchor="middle" font-size="14" fill="#4a7a3a">b</text>
    <rect x="296" y="268" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="313" y="288" text-anchor="middle" font-size="14" fill="#4a7a3a">c</text>
  </g>

  <rect x="330" y="266" width="160" height="36" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="290" text-anchor="middle" font-size="15" fill="#8a6d3b" filter="url(#rough2)">总分 15 + 4 = 19 ✓</text>
  <text x="260" y="336" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">惰性字符 c、d 不参与删除，天然把串切成若干 a/b 段</text>
</svg>
