<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="720" height="460" fill="#fafafa"/>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">0-1 Trie 逐位贪心：查询 x = 4，集合 S = {2, 3, 4}（3 位示意，实际 20 位）</text>
  <path d="M 190 34 Q 360 42 530 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 结果框 -->
  <g filter="url(#sk)"><rect x="90" y="44" width="540" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="360" y="65" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">贪心路径 root →(0)→ (1)→ (1)→ 命中 3：res = 111₂ = 7 = 4 ⊕ 3 ✓</text>

  <!-- Trie 边 -->
  <g filter="url(#sk)">
    <path d="M 348 128 L 242 176" stroke="#b85450" stroke-width="3" fill="none"/>
    <path d="M 372 128 L 508 176" stroke="#8a8a8a" stroke-width="1.5" fill="none"/>
    <path d="M 230 209 L 230 245" stroke="#b85450" stroke-width="3" fill="none"/>
    <path d="M 216 202 L 156 244" stroke="#8a8a8a" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
    <path d="M 520 209 L 520 245" stroke="#8a8a8a" stroke-width="1.5" fill="none"/>
    <path d="M 534 202 L 600 244" stroke="#8a8a8a" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
    <path d="M 240 275 L 202 317" stroke="#8a8a8a" stroke-width="1.5" fill="none"/>
    <path d="M 262 275 L 320 317" stroke="#b85450" stroke-width="3" fill="none"/>
    <path d="M 520 279 L 520 317" stroke="#8a8a8a" stroke-width="1.5" fill="none"/>
  </g>
  <!-- 边标签 -->
  <text x="282" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">0</text>
  <text x="452" y="146" text-anchor="middle" font-size="13" fill="#666" filter="url(#sk)">1</text>
  <text x="243" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">1</text>
  <text x="172" y="232" text-anchor="middle" font-size="12" fill="#999" filter="url(#sk)">0</text>
  <text x="533" y="232" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">0</text>
  <text x="578" y="232" text-anchor="middle" font-size="12" fill="#999" filter="url(#sk)">1</text>
  <text x="208" y="298" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">0</text>
  <text x="300" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">1</text>
  <text x="533" y="302" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">0</text>

  <!-- 节点 -->
  <g filter="url(#sk)"><circle cx="360" cy="114" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="360" y="119" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">root</text>
  <g filter="url(#sk)"><circle cx="230" cy="192" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="230" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#sk)">0</text>
  <text x="256" y="190" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">cnt=2</text>
  <g filter="url(#sk)"><circle cx="520" cy="192" r="17" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/></g>
  <text x="520" y="197" text-anchor="middle" font-size="13" fill="#777" filter="url(#sk)">1</text>
  <text x="546" y="190" text-anchor="start" font-size="10.5" fill="#999" filter="url(#sk)">cnt=1</text>
  <g filter="url(#sk)"><circle cx="140" cy="258" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="140" y="263" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#sk)">∅</text>
  <g filter="url(#sk)"><circle cx="230" cy="262" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="230" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24" filter="url(#sk)">01</text>
  <text x="200" y="258" text-anchor="end" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">cnt=2</text>
  <g filter="url(#sk)"><circle cx="520" cy="262" r="17" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/></g>
  <text x="520" y="267" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">10</text>
  <text x="546" y="260" text-anchor="start" font-size="10.5" fill="#999" filter="url(#sk)">cnt=1</text>
  <g filter="url(#sk)"><circle cx="612" cy="258" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="612" y="263" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#sk)">∅</text>

  <!-- 叶子 -->
  <g filter="url(#sk)"><rect x="148" y="319" width="66" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="181" y="337" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">010 = 2</text>
  <g filter="url(#sk)"><rect x="296" y="319" width="66" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="329" y="337" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">011 = 3</text>
  <text x="329" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f3a36" filter="url(#sk)">✓ 命中</text>
  <g filter="url(#sk)"><rect x="486" y="319" width="66" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="519" y="337" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">100 = 4</text>

  <!-- 位次标签 -->
  <text x="70" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" filter="url(#sk)">第2位</text>
  <text x="70" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" filter="url(#sk)">第1位</text>
  <text x="70" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" filter="url(#sk)">第0位</text>
  <text x="70" y="120" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#sk)">高位在前</text>

  <!-- 逐位注解 -->
  <g filter="url(#sk)"><rect x="40" y="378" width="206" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="143" y="395" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#sk)">第2位：x=1 → 优先走 0</text>
  <text x="143" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">cnt=2 &gt; 0 ✓ 该位异或 1</text>
  <g filter="url(#sk)"><rect x="257" y="378" width="206" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="360" y="395" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#sk)">第1位：x=0 → 优先走 1</text>
  <text x="360" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">cnt=2 &gt; 0 ✓ 该位异或 1</text>
  <g filter="url(#sk)"><rect x="474" y="378" width="206" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="577" y="395" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#sk)">第0位：x=0 → 优先走 1</text>
  <text x="577" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">cnt=1 &gt; 0 ✓ 命中元素 3</text>

  <text x="360" y="444" text-anchor="middle" font-size="11.5" fill="#8f3a36" filter="url(#sk)">删除 = 路径计数 −1（惰性）；查询只认 cnt &gt; 0 的子节点 —— cnt = 0 的「幽灵子树」必须绕开</text>
</svg>
