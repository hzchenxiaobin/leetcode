<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：hit 出现 3 次但被禁用 ⇒ 答案是 ball</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">先归一化再计数：Bob → bob，BALL → ball，ball, → ball</text>

  <text x="40" y="82" font-size="11" fill="#888" filter="url(#rough2)">单词</text>
  <text x="130" y="82" font-size="11" fill="#888" filter="url(#rough2)">出现次数（每格 1 次）</text>
  <text x="340" y="82" font-size="11" fill="#888" filter="url(#rough2)">单词</text>
  <text x="430" y="82" font-size="11" fill="#888" filter="url(#rough2)">出现次数（每格 1 次）</text>

  <g filter="url(#rough2)" font-size="12.5">
    <text x="40" y="116" fill="#333" filter="url(#rough2)">bob</text>
    <rect x="112" y="102" width="32" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="152" y="116" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>

    <text x="40" y="156" fill="#8a3a36" filter="url(#rough2)">hit</text>
    <rect x="112" y="142" width="96" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="216" y="156" font-size="11.5" fill="#b85450" filter="url(#rough2)">3</text>
    <rect x="240" y="139" width="46" height="20" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="263" y="153" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">禁用</text>

    <text x="40" y="196" fill="#333" filter="url(#rough2)">a</text>
    <rect x="112" y="182" width="32" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="152" y="196" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>

    <text x="40" y="236" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">ball</text>
    <rect x="112" y="222" width="64" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="184" y="236" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2</text>
    <rect x="208" y="219" width="46" height="20" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="231" y="233" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">答案</text>

    <text x="40" y="276" fill="#333" filter="url(#rough2)">the</text>
    <rect x="112" y="262" width="32" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="152" y="276" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>

    <text x="340" y="116" fill="#333" filter="url(#rough2)">flew</text>
    <rect x="412" y="102" width="32" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="452" y="116" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>

    <text x="340" y="156" fill="#333" filter="url(#rough2)">far</text>
    <rect x="412" y="142" width="32" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="452" y="156" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>

    <text x="340" y="196" fill="#333" filter="url(#rough2)">after</text>
    <rect x="412" y="182" width="32" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="452" y="196" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>

    <text x="340" y="236" fill="#333" filter="url(#rough2)">it</text>
    <rect x="412" y="222" width="32" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="452" y="236" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>

    <text x="340" y="276" fill="#333" filter="url(#rough2)">was</text>
    <rect x="412" y="262" width="32" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="452" y="276" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>
  </g>

  <text x="320" y="306" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">共 13 个词，小写归一后 10 个互不相同；banned = [“hit”]</text>

  <rect x="46" y="322" width="548" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="344" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">三段归一化，一次哈希计数</text>
  <text x="62" y="364" font-size="10.5" fill="#555" filter="url(#rough2)">① 字母段切出来（Bob、ball、BALL、hit）② 统一小写 ③ banned 命中就跳过</text>
  <text x="62" y="382" font-size="10.5" fill="#555" filter="url(#rough2)">非禁用词共 9 个：8 个各 1 次，ball 2 次 ⇒ 返回 “ball”</text>

  <rect x="46" y="402" width="548" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="424" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">注意 “BALL” 与 “ball” 必须合并：小写化发生在计数之前，而不是比较之时</text>
  <text x="62" y="442" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">段落末尾的 “.” 与 “ball,” 的逗号都被 j 挡在词外，不会造出 “ball.” 这种脏词</text>
</svg>
