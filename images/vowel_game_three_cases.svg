<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：胜负只看元音总数 cnt</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Case 1: cnt = 0 -->
  <g filter="url(#sk)">
    <rect x="40" y="56" width="560" height="86" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="70" y="100" font-size="13" font-weight="bold" fill="#b85450">情形 1</text>
  <g filter="url(#sk)">
    <rect x="140" y="74" width="32" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="192" y="74" width="32" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="244" y="74" width="32" height="32" rx="4" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
  </g>
  <text x="156" y="96" text-anchor="middle" font-size="13" fill="#333">b</text>
  <text x="208" y="96" text-anchor="middle" font-size="13" fill="#333">c</text>
  <text x="260" y="96" text-anchor="middle" font-size="13" fill="#333">d</text>
  <text x="208" y="126" text-anchor="middle" font-size="10" fill="#b85450">全部子串：0 个元音（偶）</text>
  <path d="M 296 90 Q 316 90 336 90" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="348" y="88" font-size="12.5" font-weight="bold" fill="#b85450">全是辅音：每个子串都含 0 个元音</text>
  <text x="348" y="108" font-size="12" fill="#b85450">0 是偶数，小红没有合法操作 → 落败</text>
  <text x="556" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">false</text>

  <!-- Case 2: cnt odd -->
  <g filter="url(#sk)">
    <rect x="40" y="156" width="560" height="86" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="70" y="200" font-size="13" font-weight="bold" fill="#2e6e2e">情形 2</text>
  <g filter="url(#sk)">
    <rect x="140" y="174" width="32" height="32" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="192" y="174" width="32" height="32" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.2"/>
    <rect x="244" y="174" width="32" height="32" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="156" y="196" text-anchor="middle" font-size="13" fill="#333">c</text>
  <text x="208" y="196" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">a</text>
  <text x="260" y="196" text-anchor="middle" font-size="13" fill="#333">t</text>
  <text x="208" y="226" text-anchor="middle" font-size="10" fill="#2e6e2e">整串：1 个元音（奇）</text>
  <path d="M 296 190 Q 316 190 336 190" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="348" y="188" font-size="12.5" font-weight="bold" fill="#2e6e2e">cnt 为奇数：整串就是合法子串</text>
  <text x="348" y="208" font-size="12" fill="#2e6e2e">一把全删，小明面对空串卡死</text>
  <text x="556" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">true</text>

  <!-- Case 3: cnt even >= 2 -->
  <g filter="url(#sk)">
    <rect x="40" y="256" width="560" height="86" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="70" y="300" font-size="13" font-weight="bold" fill="#2b6e9e">情形 3</text>
  <g filter="url(#sk)">
    <rect x="140" y="274" width="32" height="32" rx="4" fill="#fef6e6" stroke="#b85450" stroke-width="2"/>
    <rect x="192" y="274" width="32" height="32" rx="4" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="244" y="274" width="32" height="32" rx="4" fill="#fef6e6" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="156" y="296" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">a</text>
  <text x="208" y="296" text-anchor="middle" font-size="13" fill="#333">b</text>
  <text x="260" y="296" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">a</text>
  <text x="126" y="270" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">删这个</text>
  <text x="208" y="326" text-anchor="middle" font-size="10" fill="#2b6e9e">删 1 个 → 剩 1 个（奇）</text>
  <path d="M 296 290 Q 316 290 336 290" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="348" y="288" font-size="12.5" font-weight="bold" fill="#2b6e9e">cnt 为偶数：整串是偶数个元音，全删非法</text>
  <text x="348" y="308" font-size="12" fill="#2b6e9e">先只删一个元音 → 剩奇数个，小明清不了场</text>
  <text x="556" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">true</text>

  <!-- Bottom conclusion -->
  <g filter="url(#sk)">
    <rect x="40" y="356" width="560" height="40" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="320" y="381" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">结论：s 含至少一个元音 → 小红必胜（true）；全是辅音 → false</text>
</svg>
