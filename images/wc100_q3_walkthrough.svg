<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="700" height="350" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" font-style="" filter="url(#rough2)">示例演算：arr = [1,2,4]</text>
  <rect x="40" y="66" width="130" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="86.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">步骤</text>
  <rect x="175" y="66" width="195" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272.5" y="86.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">cur（以 i 结尾）</text>
  <rect x="380" y="66" width="195" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="477.5" y="86.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">all（累计）</text>
  <rect x="585" y="66" width="95" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="632.5" y="86.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">|all|</text>
  <rect x="40" y="116" width="130" height="44" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="143.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">i=0, x=1</text>
  <rect x="175" y="116" width="195" height="44" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272.5" y="141.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">{1}</text>
  <rect x="380" y="116" width="195" height="44" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="477.5" y="141.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">{1}</text>
  <rect x="585" y="116" width="95" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="632.5" y="143.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">1</text>
  <rect x="40" y="178" width="130" height="44" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="205.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">i=1, x=2</text>
  <rect x="175" y="178" width="195" height="44" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272.5" y="203.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">{2, 1|2=3}</text>
  <rect x="380" y="178" width="195" height="44" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="477.5" y="203.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">{1,2,3}</text>
  <rect x="585" y="178" width="95" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="632.5" y="205.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">3</text>
  <rect x="40" y="240" width="130" height="44" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="267.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">i=2, x=4</text>
  <rect x="175" y="240" width="195" height="44" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272.5" y="265.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">{4, 2|4=6, 3|4=7}</text>
  <rect x="380" y="240" width="195" height="44" rx="6" fill="#fafafa" stroke="#aaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="477.5" y="265.85" text-anchor="middle" font-size="11" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">{1,2,3,4,6,7}</text>
  <rect x="585" y="240" width="95" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="632.5" y="267.25" text-anchor="middle" font-size="15" fill="#333" font-weight="normal" font-style="" filter="url(#rough2)">6</text>
  <text x="350" y="322" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" font-style="" filter="url(#rough2)">六个不同的 OR 值：1,2,3,4,6,7 ⇒ 答案 6  ✓</text>
</svg>
