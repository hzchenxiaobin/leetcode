<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：n = 3，四名用户，四对好友</text>

  <!-- 用户与语言 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="40" y="44" width="100" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="90" y="63" fill="#8a6d3b">用户1 {2}</text>
    <text x="90" y="81" fill="#b85450" font-size="11">缺 1、3</text>
    <rect x="160" y="44" width="100" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="210" y="63" fill="#8a6d3b">用户2 {1,3}</text>
    <text x="210" y="81" fill="#b85450" font-size="11">缺 2</text>
    <rect x="280" y="44" width="100" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="330" y="63" fill="#8a6d3b">用户3 {1,2}</text>
    <text x="330" y="81" fill="#b85450" font-size="11">缺 3</text>
    <rect x="400" y="44" width="100" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="450" y="63" fill="#8a6d3b">用户4 {3}</text>
    <text x="450" y="81" fill="#b85450" font-size="11">缺 1、2</text>
  </g>

  <!-- 好友对判定 -->
  <g filter="url(#rough2)" font-size="12.5">
    <rect x="40" y="112" width="200" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="140" y="132" text-anchor="middle" fill="#b85450">(1,4)：{2}∩{3}=∅ → 坏</text>
    <rect x="280" y="112" width="200" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="380" y="132" text-anchor="middle" fill="#b85450">(1,2)：{2}∩{1,3}=∅ → 坏</text>
    <rect x="40" y="148" width="200" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="140" y="168" text-anchor="middle" fill="#b85450">(3,4)：{1,2}∩{3}=∅ → 坏</text>
    <rect x="280" y="148" width="200" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="380" y="168" text-anchor="middle" fill="#4a7a3a">(2,3)：共 1 → 好</text>
  </g>
  <text x="260" y="204" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">坏对端点并集 involved = {1, 2, 3, 4}，四人都可能要教</text>

  <!-- 每门语言代价 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="60" y="222" width="120" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="120" y="243" fill="#446688">l = 1</text>
    <text x="120" y="263" fill="#446688">缺 1：用户1、4</text>
    <rect x="200" y="222" width="120" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="243" fill="#446688">l = 2</text>
    <text x="260" y="263" fill="#446688">缺 2：用户2、4</text>
    <rect x="340" y="222" width="120" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="400" y="243" fill="#446688">l = 3</text>
    <text x="400" y="263" fill="#446688">缺 3：用户1、3</text>
  </g>
  <text x="260" y="298" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">cost(1) = cost(2) = cost(3) = 2</text>

  <rect x="160" y="312" width="200" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">答案 = 2 ✓（教 1、4 学语言 3）</text>
</svg>
