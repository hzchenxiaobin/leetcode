<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：排序后，每个 lo 的最优搭档是「最大的 hi 使和 &lt; k」</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">k = 60；排序后 nums = [1, 8, 23, 24, 33, 34, 54, 75]</text>

  <g filter="url(#rough2)">
    <rect x="82" y="60" width="46" height="38" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="130" y="60" width="46" height="38" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="178" y="60" width="46" height="38" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="226" y="60" width="46" height="38" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="274" y="60" width="46" height="38" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="322" y="60" width="46" height="38" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="370" y="60" width="46" height="38" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
    <rect x="418" y="60" width="46" height="38" fill="#fff" stroke="#666" stroke-width="1.5" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <text x="105" y="84" fill="#333">1</text>
    <text x="153" y="84" fill="#333">8</text>
    <text x="201" y="84" fill="#333">23</text>
    <text x="249" y="84" fill="#333">24</text>
    <text x="297" y="84" fill="#333">33</text>
    <text x="345" y="84" fill="#333">34</text>
    <text x="393" y="84" fill="#333">54</text>
    <text x="441" y="84" fill="#333">75</text>
  </g>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="105" y="108">0</text>
    <text x="153" y="108">1</text>
    <text x="201" y="108">2</text>
    <text x="249" y="108">3</text>
    <text x="297" y="108">4</text>
    <text x="345" y="108">5</text>
    <text x="393" y="108">6</text>
    <text x="441" y="108">7</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 105 146 L 105 118" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
    <path d="M 441 146 L 441 118" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)"/>
  </g>
  <text x="105" y="162" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">lo</text>
  <text x="441" y="162" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">hi</text>
  <text x="273" y="150" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每轮比较 s = nums[lo] + nums[hi] 与 k</text>

  <rect x="36" y="182" width="244" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="158" y="206" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">s &lt; k：当前 hi 就是 lo 的最优搭档</text>
  <text x="158" y="228" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans = max(ans, s)，记下这个和</text>
  <text x="158" y="248" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">lo++ → 去尝试更大的和</text>

  <rect x="300" y="182" width="244" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="422" y="206" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">s ≥ k：这个 hi 太大了</text>
  <text x="422" y="228" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">对一切 lo' ≥ lo 依然超限</text>
  <text x="422" y="248" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">hi-- → 安全丢弃</text>

  <rect x="64" y="286" width="452" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="290" y="310" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">双指针的单调性：排序后固定一端，另一端越远，和越大</text>
  <text x="290" y="330" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每次判定恰有一个指针移动一格 → 最多 n 步收敛，绝不回头</text>
  <text x="290" y="350" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">时间 O(n log n)（排序为主），额外空间 O(1)</text>

  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">⚠ 无序数组直接双指针不成立——「和」毫无单调性，必须先排序</text>
</svg>
