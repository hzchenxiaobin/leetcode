<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 404" width="780" height="404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="404" fill="#fafafa"/>

  <text x="390" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：每组数据只需一次线性扫描</text>
  <path d="M 210 44 Q 390 51 570 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 框 1 -->
  <rect x="250" y="58" width="280" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="86" text-anchor="middle" font-size="13.5" fill="#2f4a66" filter="url(#rough2)">读入 n 与 a[1..n]</text>

  <path d="M 390 102 L 390 116" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 框 2 -->
  <rect x="250" y="118" width="280" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="146" text-anchor="middle" font-size="13.5" fill="#2f4a66" filter="url(#rough2)">M = max，m = min，S = OR(a)</text>

  <path d="M 390 162 L 390 176" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 框 3 -->
  <rect x="250" y="178" width="280" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="207" text-anchor="middle" font-size="13.5" fill="#8a6015" filter="url(#rough2)">d = M xor m，h = bit_length(d)</text>

  <path d="M 390 224 L 390 238" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 框 4 -->
  <rect x="250" y="240" width="280" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="390" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#33582a" filter="url(#rough2)">ans = S | ((1 &lt;&lt; h) - 1)</text>

  <path d="M 390 286 L 390 300" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 框 5 -->
  <rect x="250" y="302" width="280" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="330" text-anchor="middle" font-size="13.5" fill="#2f4a66" filter="url(#rough2)">输出 ans，继续下一组</text>

  <!-- 左侧注：d = 0 的情形 -->
  <rect x="34" y="150" width="188" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="176" font-size="12.2" font-weight="bold" fill="#33582a" filter="url(#rough2)">退化情形</text>
  <text x="52" y="200" font-size="11.8" fill="#33582a" filter="url(#rough2)">M == m（含 n = 1）</text>
  <text x="52" y="222" font-size="11.8" fill="#33582a" filter="url(#rough2)">⇒ d = 0，h = 0</text>
  <text x="52" y="244" font-size="11.8" fill="#33582a" filter="url(#rough2)">⇒ 掩码为 0，ans = S</text>
  <path d="M 224 232 C 236 240 240 258 246 264" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧注：为什么是 h -->
  <rect x="558" y="150" width="196" height="118" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="576" y="176" font-size="12.2" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">为什么补低 h 位</text>
  <text x="576" y="200" font-size="11.8" fill="#8c3a37" filter="url(#rough2)">M 与 m 在 k 位以上相同</text>
  <text x="576" y="222" font-size="11.8" fill="#8c3a37" filter="url(#rough2)">这些位无法新增，只能来自 S</text>
  <text x="576" y="244" font-size="11.8" fill="#8c3a37" filter="url(#rough2)">0..k-1 位则可以全点亮</text>
  <path d="M 554 232 C 542 240 538 252 534 258" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="390" y="378" text-anchor="middle" font-size="11.8" fill="#66788c" filter="url(#rough2)">h ≤ 30，long long 不会溢出；总复杂度 O(sum n)，可以放心每组重扫</text>
</svg>
