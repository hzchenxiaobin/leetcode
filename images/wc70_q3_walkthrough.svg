<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：RXXLRXRXL → XRLXXRRLX，5 次配对全部通过</text>
  <text x="280" y="39" text-anchor="middle" font-size="9.8" fill="#888" filter="url(#rough2)">两串去掉 X 后都是 R L R R L；每个字母的下标都必须朝它的合法方向变化</text>

  <text x="142" y="81" text-anchor="end" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">start</text>
  <rect x="150" y="64" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="163" y="82" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">R</text>
  <rect x="179" y="64" width="26" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="82" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">X</text>
  <rect x="208" y="64" width="26" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="82" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">X</text>
  <rect x="237" y="64" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="82" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">L</text>
  <rect x="266" y="64" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="279" y="82" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">R</text>
  <rect x="295" y="64" width="26" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="82" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">X</text>
  <rect x="324" y="64" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="337" y="82" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">R</text>
  <rect x="353" y="64" width="26" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="82" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">X</text>
  <rect x="382" y="64" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="82" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">L</text>

  <text x="163" y="103" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="192" y="103" text-anchor="middle" font-size="8.5" fill="#bbb" filter="url(#rough2)">1</text>
  <text x="221" y="103" text-anchor="middle" font-size="8.5" fill="#bbb" filter="url(#rough2)">2</text>
  <text x="250" y="103" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="279" y="103" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="308" y="103" text-anchor="middle" font-size="8.5" fill="#bbb" filter="url(#rough2)">5</text>
  <text x="337" y="103" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="366" y="103" text-anchor="middle" font-size="8.5" fill="#bbb" filter="url(#rough2)">7</text>
  <text x="395" y="103" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">8</text>

  <text x="142" y="145" text-anchor="end" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">result</text>
  <rect x="150" y="128" width="26" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="163" y="146" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">X</text>
  <rect x="179" y="128" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="146" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">R</text>
  <rect x="208" y="128" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="146" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">L</text>
  <rect x="237" y="128" width="26" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="146" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">X</text>
  <rect x="266" y="128" width="26" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="279" y="146" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">X</text>
  <rect x="295" y="128" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="146" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">R</text>
  <rect x="324" y="128" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="337" y="146" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">R</text>
  <rect x="353" y="128" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="146" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">L</text>
  <rect x="382" y="128" width="26" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="146" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">X</text>

  <text x="163" y="167" text-anchor="middle" font-size="8.5" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="192" y="167" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="221" y="167" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="250" y="167" text-anchor="middle" font-size="8.5" fill="#bbb" filter="url(#rough2)">3</text>
  <text x="279" y="167" text-anchor="middle" font-size="8.5" fill="#bbb" filter="url(#rough2)">4</text>
  <text x="308" y="167" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="337" y="167" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="366" y="167" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="395" y="167" text-anchor="middle" font-size="8.5" fill="#bbb" filter="url(#rough2)">8</text>

  <text x="163" y="57" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">①</text>
  <text x="250" y="57" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">②</text>
  <text x="279" y="57" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">③</text>
  <text x="337" y="57" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">④</text>
  <text x="395" y="57" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">⑤</text>

  <text x="192" y="182" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">①</text>
  <text x="221" y="182" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">②</text>
  <text x="308" y="182" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">③</text>
  <text x="337" y="182" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">④</text>
  <text x="366" y="182" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">⑤</text>

  <rect x="40" y="196" width="480" height="144" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <path d="M 40 220 L 520 220 M 40 244 L 520 244 M 40 268 L 520 268 M 40 292 L 520 292 M 40 316 L 520 316"
        stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 116 196 L 116 340 M 244 196 L 244 340 M 372 196 L 372 340"
        stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="196" width="480" height="24" fill="#eef2f8" rx="8" filter="url(#rough2)"/>

  <text x="78" y="212" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">配对</text>
  <text x="180" y="212" text-anchor="middle" font-size="9.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">start: i / 字符</text>
  <text x="308" y="212" text-anchor="middle" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">result: j / 字符</text>
  <text x="446" y="212" text-anchor="middle" font-size="9.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">方向校验</text>

  <text x="78" y="236" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">①</text>
  <text x="180" y="236" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">i = 0，R</text>
  <text x="308" y="236" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">j = 1，R</text>
  <text x="446" y="236" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">R 右移 0 → 1 ✓</text>

  <text x="78" y="260" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">②</text>
  <text x="180" y="260" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">i = 3，L</text>
  <text x="308" y="260" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">j = 2，L</text>
  <text x="446" y="260" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">L 左移 3 → 2 ✓</text>

  <text x="78" y="284" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">③</text>
  <text x="180" y="284" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">i = 4，R</text>
  <text x="308" y="284" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">j = 5，R</text>
  <text x="446" y="284" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">R 右移 4 → 5 ✓</text>

  <text x="78" y="308" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">④</text>
  <text x="180" y="308" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">i = 6，R</text>
  <text x="308" y="308" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">j = 6，R</text>
  <text x="446" y="308" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">原地不动也算合法 ✓</text>

  <text x="78" y="332" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">⑤</text>
  <text x="180" y="332" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">i = 8，L</text>
  <text x="308" y="332" text-anchor="middle" font-size="10" fill="#444" filter="url(#rough2)">j = 7，L</text>
  <text x="446" y="332" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">L 左移 8 → 7 ✓</text>

  <rect x="40" y="352" width="480" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="372" font-size="9.8" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">反例（顺序被破坏）：start = "LR"，result = "RL"</text>
  <text x="56" y="390" font-size="9.5" fill="#555" filter="url(#rough2)">去 X 后分别是 L R 与 R L，第 1 对就 L ≠ R → 立即 false</text>
  <text x="56" y="406" font-size="9.5" fill="#555" filter="url(#rough2)">反例（方向反了）：start = "LXX"，result = "XXL"：L 在 i = 0 已最左，j = 2 &gt; i → false</text>

  <text x="280" y="438" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">两指针同时扫完且全部通过 ⇒ 返回 true</text>
</svg>
