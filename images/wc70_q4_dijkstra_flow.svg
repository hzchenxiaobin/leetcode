<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：Dijkstra 的加法换成取最大值</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">best[v] = 从起点到 v 的所有路径中「最大高度」的最小值（瓶颈距离）</text>

  <rect x="40" y="76" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="96" font-size="11" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">① 初始化</text>
  <text x="56" y="112" font-size="10" fill="#4a5a74" filter="url(#rough2)">best[S] = h(S)，其余为 ∞；小根堆放 (h(S), S)</text>

  <path d="M 190 120 L 190 130" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="132" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="152" font-size="11" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">② 弹出堆顶 (d, u)</text>
  <text x="56" y="168" font-size="10" fill="#4a5a74" filter="url(#rough2)">若 d &gt; best[u]，说明是过期堆项，直接丢弃</text>

  <path d="M 190 176 L 190 186" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="188" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="208" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">③ 若 u 是终点 → 返回 d</text>
  <text x="56" y="224" font-size="10" fill="#7a6220" filter="url(#rough2)">首次出堆的 d 已经最优，不必等堆空</text>

  <path d="M 190 232 L 190 242" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="244" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="264" font-size="11" font-weight="bold" fill="#33552a" filter="url(#rough2)">④ 松弛四个邻居 v</text>
  <text x="56" y="280" font-size="10" fill="#3a5a30" filter="url(#rough2)">nd = max(d, h(v))；若 nd &lt; best[v] 则更新并入堆</text>

  <path d="M 190 288 L 190 298" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="300" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="320" font-size="11" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">⑤ 所有可达格子处理完</text>
  <text x="56" y="336" font-size="10" fill="#4a5a74" filter="url(#rough2)">返回 best[T]；网格四连通，T 一定可达</text>

  <rect x="356" y="76" width="232" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="368" y="96" font-size="11" font-weight="bold" fill="#33552a" filter="url(#rough2)">普通最短路（边权求和）</text>
  <text x="368" y="116" font-size="10" fill="#3a5a30" filter="url(#rough2)">d[v] = min_u ( d[u] + w(u,v) )</text>
  <text x="368" y="136" font-size="10" fill="#3a5a30" filter="url(#rough2)">代价 = 路径上所有边权之和</text>
  <text x="368" y="156" font-size="10" fill="#3a5a30" filter="url(#rough2)">更新时用「+」，前缀越走越大</text>
  <text x="368" y="172" font-size="9.5" fill="#6b8a60" filter="url(#rough2)">（负数边会让贪心失效，本题无此问题）</text>

  <rect x="356" y="192" width="232" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="368" y="212" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">瓶颈路（边权取最大）</text>
  <text x="368" y="232" font-size="10" fill="#7a6220" filter="url(#rough2)">b[v] = min_u max( b[u], h(v) )</text>
  <text x="368" y="252" font-size="10" fill="#7a6220" filter="url(#rough2)">代价 = 路径上最高的那个格子</text>
  <text x="368" y="272" font-size="10" fill="#7a6220" filter="url(#rough2)">更新时用「max」，前缀只增不减</text>
  <text x="368" y="288" font-size="9.5" fill="#a08340" filter="url(#rough2)">max 对顺序不敏感 → 可交换、可结合</text>

  <text x="356" y="318" font-size="10" fill="#555" filter="url(#rough2)">min 与 max 构成一个半环，</text>
  <text x="356" y="334" font-size="10" fill="#555" filter="url(#rough2)">所以 Dijkstra 的贪心顺序依旧成立</text>

  <rect x="40" y="356" width="548" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="56" y="376" font-size="10" font-weight="bold" fill="#7a2f2c" filter="url(#rough2)">为什么「出堆即终值」：设 u 为当前堆顶，任何从起点到 u 且经过未访问点 w 的路径，</text>
  <text x="56" y="394" font-size="10" fill="#7a2f2c" filter="url(#rough2)">其瓶颈 ≥ max(best[w], h(u)) ≥ best[u]，不可能更优 → best[u] 已是最终答案。</text>
  <text x="56" y="412" font-size="10" fill="#7a2f2c" filter="url(#rough2)">时间 O(n² log n)、空间 O(n²)：n ≤ 50 时共 2500 个格子，堆操作 4n² 次，常数很小。</text>
</svg>
