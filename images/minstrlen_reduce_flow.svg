<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">单字符缩减流程：出现 k 次 → 恰好剩 1 个</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start box -->
  <g filter="url(#sk)">
    <rect x="60" y="66" width="150" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="135" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">字符 c 出现 k 次</text>

  <path d="M 214 88 L 244 88" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision 1 -->
  <polygon points="250,88 330,64 410,88 330,112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="330" y="93" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">k = 1 ？</text>

  <path d="M 410 88 L 444 88" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="424" y="80" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">是</text>

  <!-- terminal box -->
  <g filter="url(#sk)">
    <rect x="450" y="66" width="160" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="530" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">终止：恰剩 1 个 ✓</text>

  <path d="M 330 112 L 330 138" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="340" y="130" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#sk)">否</text>

  <!-- decision 2 -->
  <polygon points="250,164 330,140 410,164 330,188" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="330" y="169" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">k = 2 ？</text>

  <path d="M 410 164 L 444 164" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="424" y="156" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">是</text>

  <!-- k = 2 box -->
  <g filter="url(#sk)">
    <rect x="450" y="142" width="170" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="535" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">选其一为中心</text>
  <text x="535" y="178" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">删另一侧唯一的同类</text>

  <path d="M 535 138 L 535 116" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="572" y="130" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">k → 1</text>

  <path d="M 330 188 L 330 216" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="340" y="206" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#sk)">否</text>

  <!-- k >= 3 box -->
  <g filter="url(#sk)">
    <rect x="210" y="220" width="240" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="330" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">k ≥ 3：选非端点为中心</text>
  <text x="330" y="263" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#sk)">一次删左右各一个 c（删 2 个）</text>

  <!-- loop back -->
  <path d="M 210 248 L 60 248 L 60 88 L 242 88" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="68" y="240" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#sk)">k → k − 2（重复）</text>

  <!-- bottom banner -->
  <g filter="url(#sk)">
    <rect x="50" y="312" width="540" height="106" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">不同字符互不干扰 ⇒ 每种字符独立缩减到恰好 1 个</text>
  <text x="320" y="372" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">最小长度 = 不同字符种数</text>
  <text x="320" y="400" text-anchor="middle" font-size="13" fill="#2e5e24" font-family="monospace" filter="url(#sk)">answer = len(set(s))</text>
</svg>
