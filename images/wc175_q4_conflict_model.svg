<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">视野模型：只看得到 左 / 右 / 左上 / 右上</text>
  <text x="310" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">同一列上下相邻的两位学生互相看不见 —— 冲突只发生在同一行或相邻两行</text>

  <g filter="url(#rough2)">
    <rect x="44" y="72" width="248" height="276" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" rx="10"/>
    <text x="168" y="92" text-anchor="middle" font-size="10.5" fill="#666">第 r−1 行</text>
    <text x="168" y="268" text-anchor="middle" font-size="10.5" fill="#666">第 r+1 行</text>
  </g>

  <!-- 网格 3 行 x 5 列，格子 48 -->
  <g filter="url(#rough2)" stroke-width="1.4">
    <rect x="60" y="102" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="108" y="102" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="156" y="102" width="48" height="48" fill="#f1f1f1" stroke="#bbb"/>
    <rect x="204" y="102" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="252" y="102" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>

    <rect x="60" y="150" width="48" height="48" fill="#eeeeee" stroke="#bbb"/>
    <rect x="108" y="150" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="156" y="150" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="204" y="150" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="252" y="150" width="48" height="48" fill="#eeeeee" stroke="#bbb"/>

    <rect x="60" y="198" width="48" height="48" fill="#f1f1f1" stroke="#bbb"/>
    <rect x="108" y="198" width="48" height="48" fill="#f1f1f1" stroke="#bbb"/>
    <rect x="156" y="198" width="48" height="48" fill="#eeeeee" stroke="#bbb"/>
    <rect x="204" y="198" width="48" height="48" fill="#f1f1f1" stroke="#bbb"/>
    <rect x="252" y="198" width="48" height="48" fill="#f1f1f1" stroke="#bbb"/>
  </g>

  <!-- 箭头：学生 -> 左右 / 左上 / 右上 -->
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="1.6" fill="none">
    <path d="M 152 176 L 124 176" marker-end="url(#arr)"/>
    <path d="M 208 176 L 236 176" marker-end="url(#arr)"/>
    <path d="M 154 158 L 132 134" marker-end="url(#arr)"/>
    <path d="M 206 158 L 228 134" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <text x="180" y="180" text-anchor="middle" font-size="13" fill="#2f5a2f" font-weight="bold">学 生</text>
    <text x="180" y="132" text-anchor="middle" font-size="13" fill="#999">✕</text>
    <text x="180" y="228" text-anchor="middle" font-size="13" fill="#999">✕</text>
    <text x="84" y="228" text-anchor="middle" font-size="10.5" fill="#aaa">无关</text>
    <text x="276" y="228" text-anchor="middle" font-size="10.5" fill="#aaa">无关</text>
  </g>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <rect x="60" y="268" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="84" y="280" font-size="10.5" fill="#555">学生所在座位</text>
    <rect x="60" y="294" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="84" y="306" font-size="10.5" fill="#555">该生能看到 → 冲突</text>
    <rect x="60" y="320" width="16" height="16" fill="#eeeeee" stroke="#bbb" stroke-width="1.4" rx="3"/>
    <text x="84" y="332" font-size="10.5" fill="#555">正对上下：看不见</text>
  </g>

  <!-- 右侧说明面板 -->
  <g filter="url(#rough2)">
    <rect x="312" y="80" width="284" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
    <text x="328" y="104" font-size="11.5" fill="#2f4a6a" font-weight="bold">冲突对（不能同时坐人）</text>
    <text x="328" y="128" font-size="11" fill="#33475e">同行：(r,c) 与 (r,c−1)、(r,c+1)</text>
    <text x="328" y="152" font-size="11" fill="#33475e">邻行：(r,c) 与 (r−1,c−1)、(r−1,c+1)</text>
    <text x="328" y="176" font-size="11" fill="#33475e">正对：(r−1,c)、(r+1,c) 不算冲突</text>
    <text x="328" y="202" font-size="11" fill="#b85450">⇒ 第 r 行只与第 r−1 行相关</text>
    <text x="328" y="226" font-size="11" fill="#33475e">⇒ 状态只需记住上一行坐了谁</text>
    <text x="328" y="248" font-size="10" fill="#6a7f95">第 r−2 行永远看不到，可直接丢弃</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="312" y="272" width="284" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <text x="328" y="294" font-size="11" fill="#2f5a2f" font-weight="bold">一行的坐法 → 一个比特掩码</text>
    <text x="328" y="316" font-size="11" fill="#33475e">bit j = 1 表示第 j 列坐人</text>
    <text x="328" y="338" font-size="11" fill="#33475e">n 列一行最多 2^n 种掩码，</text>
    <text x="328" y="360" font-size="11" fill="#33475e">去掉左右相邻后只剩 Fib(n+2) 种</text>
    <text x="328" y="378" font-size="10" fill="#5d7a52">n = 8 时：256 → 55 种</text>
  </g>
</svg>
