<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
  </defs>
  <rect width="940" height="700" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">好子序列判定：缩候选 → 除以 p → 看整体 GCD</text>
  <path d="M 250 42 Q 470 52 690 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: only multiples of p ===== -->
  <text x="470" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① gcd(T) = p 意味着 p 整除 T 的每个元素 → 只能从 p 的倍数里选（例：p = 2）</text>

  <g font-size="14">
    <text x="120" y="122" font-size="11" fill="#888" font-weight="bold">nums:</text>
    <!-- green cells -->
    <g filter="url(#sk)"><rect x="160" y="100" width="56" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="188" y="123" text-anchor="middle" fill="#2e6e2e" font-weight="bold">4</text>
    <g filter="url(#sk)"><rect x="224" y="100" width="56" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="252" y="123" text-anchor="middle" fill="#2e6e2e" font-weight="bold">8</text>
    <!-- non-multiple crossed -->
    <g filter="url(#sk)"><rect x="288" y="100" width="56" height="34" fill="#f7ecec" stroke="#b03a3a" stroke-width="1.4"/></g>
    <text x="316" y="123" text-anchor="middle" fill="#b03a3a">3</text>
    <path d="M 292 132 L 340 102" stroke="#b03a3a" stroke-width="1.6" filter="url(#sk)"/>
    <g filter="url(#sk)"><rect x="352" y="100" width="56" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="380" y="123" text-anchor="middle" fill="#2e6e2e" font-weight="bold">12</text>
    <g filter="url(#sk)"><rect x="416" y="100" width="56" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="444" y="123" text-anchor="middle" fill="#2e6e2e" font-weight="bold">10</text>
  </g>
  <text x="316" y="158" text-anchor="middle" font-size="10.5" fill="#2e6e2e">绿色 = 2 的倍数（候选 S）；红色叉 = 永远进不了好子序列</text>

  <!-- right note -->
  <g filter="url(#sk)">
    <rect x="540" y="92" width="370" height="74" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="558" y="116" font-size="11" font-weight="bold" fill="#7a5415">子集 GCD 的「齐次性」</text>
  <text x="558" y="138" font-size="12" fill="#b03a3a" font-family="monospace">gcd(p·b₁, …, p·b_t) = p · gcd(b₁, …, b_t)</text>
  <text x="558" y="156" font-size="10.5" fill="#888">所以「gcd(T) = p」等价于「除以 p 后 gcd = 1」</text>

  <!-- ===== Panel 2: divide by p ===== -->
  <text x="470" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">② 每个候选元素除以 p，条件改写成「b 的子集 gcd = 1」</text>

  <path d="M 300 214 Q 300 236 300 252" stroke="#7a5a9a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="328" y="216" width="64" height="26" rx="10" fill="#f3eef9" stroke="#7a5a9a" stroke-width="1.3"/>
  </g>
  <text x="360" y="234" text-anchor="middle" font-size="12" fill="#5a3a7a" font-weight="bold">÷ p</text>

  <g font-size="14">
    <text x="120" y="282" font-size="11" fill="#888" font-weight="bold">b:</text>
    <g filter="url(#sk)"><rect x="160" y="260" width="56" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="188" y="283" text-anchor="middle" fill="#2e6e2e" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="224" y="260" width="56" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="252" y="283" text-anchor="middle" fill="#2e6e2e" font-weight="bold">4</text>
    <g filter="url(#sk)"><rect x="288" y="260" width="56" height="34" fill="#f0ede4" stroke="#ccc" stroke-width="1" opacity="0.6"/></g>
    <text x="316" y="283" text-anchor="middle" fill="#aaa" font-size="12">—</text>
    <g filter="url(#sk)"><rect x="352" y="260" width="56" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="380" y="283" text-anchor="middle" fill="#2e6e2e" font-weight="bold">6</text>
    <g filter="url(#sk)"><rect x="416" y="260" width="56" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="444" y="283" text-anchor="middle" fill="#2e6e2e" font-weight="bold">5</text>
  </g>
  <text x="316" y="318" text-anchor="middle" font-size="10.5" fill="#5a3a7a">线段树叶子：非倍数位置放 gcd 幺元 0（gcd(x, 0) = x），树形态固定</text>

  <!-- ===== Panel 3: decision flow ===== -->
  <text x="470" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">③ 判定流程：先看根节点 g = gcd(b_S)</text>

  <!-- top box -->
  <g filter="url(#sk)">
    <rect x="360" y="368" width="220" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="470" y="393" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">g = gcd(b_S)（线段树根）</text>

  <!-- left branch: g != 1 -->
  <path d="M 360 388 Q 250 388 200 410" stroke="#b03a3a" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="268" y="380" font-size="11" fill="#b03a3a" font-weight="bold">g ≠ 1（含 0）</text>
  <g filter="url(#sk)">
    <rect x="60" y="412" width="280" height="88" rx="8" fill="#fdeaea" stroke="#b03a3a" stroke-width="1.5"/>
  </g>
  <text x="200" y="438" text-anchor="middle" font-size="12.5" fill="#b03a3a" font-weight="bold">✗ 无好子序列</text>
  <text x="200" y="460" text-anchor="middle" font-size="10.5" fill="#7a4040">任何子集的 gcd 都是 g 的倍数</text>
  <text x="200" y="478" text-anchor="middle" font-size="10.5" fill="#7a4040">（元素越少，gcd 只会不变或变大）</text>
  <text x="200" y="494" text-anchor="middle" font-size="10" fill="#999">g = 0 即 S 为空，同样判否</text>

  <!-- right branch: g == 1 -->
  <path d="M 580 388 Q 690 388 740 410" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="640" y="380" font-size="11" fill="#2e6e2e" font-weight="bold">g = 1</text>

  <!-- sub-branch A: |S| < n -->
  <path d="M 740 410 Q 740 428 700 440" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="430" y="442" width="270" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="565" y="466" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">|S| &lt; n → ✓ 有解</text>
  <text x="565" y="487" text-anchor="middle" font-size="10.5" fill="#557a55">直接取 T = S：长度 |S| &lt; n，gcd = p·1 = p</text>

  <!-- sub-branch B: |S| = n -->
  <path d="M 740 410 Q 740 500 700 516" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="400" y="518" width="300" height="40" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="550" y="543" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">|S| = n（全员都是 p 的倍数）→ 删一判定</text>
  <text x="550" y="576" text-anchor="middle" font-size="11" fill="#7a5415">∃ j 使 gcd( b 除 j 外 ) = 1 吗？</text>

  <!-- two leaves of sub-branch B -->
  <path d="M 550 588 Q 400 604 340 616" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="90" y="618" width="250 " height="66" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="5 3"/>
  </g>
  <text x="215" y="642" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">n ≤ 16：枚举每个 j</text>
  <text x="215" y="662" text-anchor="middle" font-size="10.5" fill="#8a6a3a">gcd(query(0,j), query(j+1,n)) == 1 ?</text>
  <text x="215" y="678" text-anchor="middle" font-size="10" fill="#999">线段树两次区间查询即可</text>

  <path d="M 550 588 Q 700 604 760 616" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="610" y="618" width="280" height="66" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="750" y="642" text-anchor="middle" font-size="11.5" fill="#2e6e2e" font-weight="bold">n ≥ 17：恒 ✓（不用检查！）</text>
  <text x="750" y="662" text-anchor="middle" font-size="10.5" fill="#557a55">值域 5×10⁴ &lt; 2¹⁶ = 65536</text>
  <text x="750" y="678" text-anchor="middle" font-size="10" fill="#999">详见「临界质数」定理一图</text>
</svg>
