<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8d3a36"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="16.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1 走查：a = [1, 7, 3, 7, 2]，前缀异或 P = [0,1,6,5,2,0]</text>
  <text x="390" y="52" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">从高位往低位试，cur 记录已经能拿到的位；orall = 1|7|3|7|2 = 111 只有低 3 位</text>
  <text x="74" y="86" text-anchor="middle" font-size="12" fill="#44515e" font-weight="bold" filter="url(#rough2)">测试位</text>
  <text x="130" y="86" text-anchor="middle" font-size="12" fill="#44515e" font-weight="bold" filter="url(#rough2)">S</text>
  <text x="250" y="86" text-anchor="middle" font-size="12" fill="#44515e" font-weight="bold" filter="url(#rough2)">见证 (i, j)</text>
  <text x="420" y="86" text-anchor="middle" font-size="12" fill="#44515e" font-weight="bold" filter="url(#rough2)">区间 / 最大值</text>
  <text x="566" y="86" text-anchor="middle" font-size="12" fill="#44515e" font-weight="bold" filter="url(#rough2)">P_i ⊕ P_j</text>
  <text x="690" y="86" text-anchor="middle" font-size="12" fill="#44515e" font-weight="bold" filter="url(#rough2)">判定</text>
  <path d="M 30 96 L 748 96" stroke="#66788c" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="74" y="131" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b = 2</text>
  <text x="130" y="131" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">S = 100</text>
  <text x="250" y="131" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(0, 2)</text>
  <text x="420" y="131" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">[1, 7]，m = 7</text>
  <text x="566" y="131" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">6 = 110</text>
  <rect x="600" y="112" width="176" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="688.0" y="135.3" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">可行 → cur = 100</text>
  <text x="74" y="183" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b = 1</text>
  <text x="130" y="183" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">S = 110</text>
  <text x="250" y="183" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(0, 2)</text>
  <text x="420" y="183" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">[1, 7]，m = 7</text>
  <text x="566" y="183" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">6 = 110</text>
  <rect x="600" y="164" width="176" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="688.0" y="187.3" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">可行 → cur = 110</text>
  <text x="74" y="235" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b = 0</text>
  <text x="130" y="235" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">S = 111</text>
  <text x="250" y="235" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">无</text>
  <text x="420" y="235" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">含 7 的区间异或 ≤ 6</text>
  <text x="566" y="235" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">无一 ⊇ 111</text>
  <rect x="600" y="216" width="176" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="688.0" y="239.3" text-anchor="middle" font-size="12" fill="#8d3a36" filter="url(#rough2)">不可行，跳过</text>
  <rect x="40" y="284" width="700" height="94" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="308" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">位 2、位 1 都被同一个区间 [1,7] 见证：6 ⊇ 100 且 6 ⊇ 110，最大值 7 也含这两位。</text>
  <text x="60" y="330" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">位 0 要求最大值低三位全为 1，本数组里只有 7 = 111 合格；但所有含 7 的区间异或都落在 0..6，</text>
  <text x="60" y="352" text-anchor="start" font-size="12.5" fill="#8d3a36" font-weight="bold" filter="url(#rough2)">没有一个能同时含 111 三位，所以位 0 必须放弃 —— 答案 = 110₂ = 6，与官方输出一致。</text>
</svg>
