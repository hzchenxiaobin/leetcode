<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    示例 1：'a' 外环（长 8）与 'b' 内环（长 4）
  </text>

  <!-- 4x4 网格：字母 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="17">
    <rect x="60" y="58" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="112" y="58" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="164" y="58" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="216" y="58" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="60" y="110" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="112" y="110" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="164" y="110" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="216" y="110" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="60" y="162" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="112" y="162" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="164" y="162" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="216" y="162" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="60" y="214" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="112" y="214" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="164" y="214" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="216" y="214" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="86" y="91" fill="#446688">a</text>
    <text x="138" y="91" fill="#446688">a</text>
    <text x="190" y="91" fill="#446688">a</text>
    <text x="242" y="91" fill="#446688">a</text>
    <text x="86" y="143" fill="#446688">a</text>
    <text x="138" y="143" fill="#2f5a24">b</text>
    <text x="190" y="143" fill="#2f5a24">b</text>
    <text x="242" y="143" fill="#446688">a</text>
    <text x="86" y="195" fill="#446688">a</text>
    <text x="138" y="195" fill="#2f5a24">b</text>
    <text x="190" y="195" fill="#2f5a24">b</text>
    <text x="242" y="195" fill="#446688">a</text>
    <text x="86" y="247" fill="#446688">a</text>
    <text x="138" y="247" fill="#446688">a</text>
    <text x="190" y="247" fill="#446688">a</text>
    <text x="242" y="247" fill="#446688">a</text>
  </g>

  <!-- b 内环箭头 -->
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)">
    <path d="M 152 118 C 158 116, 160 114, 168 114"/>
    <path d="M 172 152 L 172 166"/>
    <path d="M 168 184 C 160 184, 158 182, 152 180"/>
    <path d="M 144 166 L 144 152"/>
  </g>

  <!-- a 外环箭头 -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M 96 66 C 140 60, 200 60, 236 66" stroke-dasharray="6 4"/>
    <path d="M 246 104 C 250 150, 250 170, 246 222" stroke-dasharray="6 4"/>
    <path d="M 236 260 C 190 266, 130 266, 96 260" stroke-dasharray="6 4"/>
    <path d="M 86 222 C 82 170, 82 150, 86 104" stroke-dasharray="6 4"/>
  </g>

  <!-- 说明 -->
  <g filter="url(#rough2)">
    <rect x="316" y="66" width="182" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="407" y="92" text-anchor="middle" font-size="13" fill="#446688">'a' 外环：长度 8</text>
    <text x="407" y="116" text-anchor="middle" font-size="12" fill="#446688">12 个 'a' 全在同一连通块</text>
    <rect x="316" y="152" width="182" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="407" y="178" text-anchor="middle" font-size="13" fill="#2f5a24">'b' 内环：长度恰 4</text>
    <text x="407" y="202" text-anchor="middle" font-size="12" fill="#2f5a24">网格二分 → 环长是偶数</text>
  </g>

  <rect x="70" y="296" width="380" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    同字符连通块一旦有环，DFS 必撞「非父已访问」
  </text>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    示例 3 的每个连通块都是「树」形 → false
  </text>
</svg>
