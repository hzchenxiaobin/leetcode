<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ax" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">核心观察：单次持续时间 = 相邻松开时刻之差（差分）</text>
  <path d="M 150 36 Q 330 44 510 36" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- input -->
  <text x="40" y="66" font-size="12" font-family="monospace" fill="#333" filter="url(#r)">releaseTimes = [9, 29, 49, 50]    keysPressed = "cbcd"</text>
  <text x="620" y="66" text-anchor="end" font-size="9.5" fill="#999" filter="url(#r)">（时间轴未按真实比例）</text>

  <!-- press = previous release annotations -->
  <g filter="url(#r)" font-size="8.5" fill="#888" text-anchor="middle">
    <text x="220" y="101">松开 c ＝ 按下 b</text>
    <text x="350" y="101">松开 b ＝ 按下 c</text>
    <text x="480" y="101">松开 c ＝ 按下 d</text>
  </g>

  <!-- timeline segments -->
  <g filter="url(#r)">
    <rect x="90" y="108" width="130" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="220" y="108" width="130" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="350" y="108" width="130" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="480" y="108" width="100" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g filter="url(#r)" font-size="15" text-anchor="middle">
    <text x="155" y="131" font-weight="bold" fill="#2b4a6e">c</text>
    <text x="285" y="131" font-size="16" font-weight="bold" fill="#8a6a1a">b</text>
    <text x="415" y="131" font-size="16" font-weight="bold" fill="#8a6a1a">c</text>
    <text x="530" y="131" fill="#2e6e2e">d</text>
  </g>
  <g filter="url(#r)" font-size="10" text-anchor="middle">
    <text x="155" y="149" fill="#446688">持续 9</text>
    <text x="285" y="149" font-weight="bold" fill="#8a6a1a">持续 20</text>
    <text x="415" y="149" font-weight="bold" fill="#8a6a1a">持续 20</text>
    <text x="530" y="149" fill="#4a7a3a">持续 1</text>
  </g>

  <!-- time axis -->
  <path d="M 78 156 L 600 156" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ax)" fill="none" filter="url(#r)"/>
  <g filter="url(#r)" stroke="#3a3a3a" stroke-width="1.2">
    <line x1="90" y1="156" x2="90" y2="168"/>
    <line x1="220" y1="156" x2="220" y2="168"/>
    <line x1="350" y1="156" x2="350" y2="168"/>
    <line x1="480" y1="156" x2="480" y2="168"/>
    <line x1="580" y1="156" x2="580" y2="168"/>
  </g>
  <g filter="url(#r)" font-size="10.5" fill="#555" text-anchor="middle">
    <text x="90" y="182">t=0</text><text x="220" y="182">t=9</text><text x="350" y="182">t=29</text>
    <text x="480" y="182">t=49</text><text x="580" y="182">t=50</text>
  </g>

  <!-- tie brace -->
  <path d="M 220 192 L 220 204 M 220 198 L 480 198 M 480 192 L 480 204" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#r)"/>
  <text x="330" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1a" filter="url(#r)">并列最长 20：'b' 与 'c' → 取字母序更大的 <tspan fill="#b85450">'c' ✓</tspan></text>

  <!-- formula box -->
  <g filter="url(#r)">
    <rect x="40" y="240" width="580" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="60" y="262" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#r)">持续时间公式（差分）</text>
  <text x="60" y="282" font-size="11.5" fill="#333" filter="url(#r)">duration[0] = releaseTimes[0] − 0 = releaseTimes[0]</text>
  <text x="60" y="297" font-size="11.5" fill="#333" filter="url(#r)">duration[i] = releaseTimes[i] − releaseTimes[i−1]（i ≥ 1；严格升序 ⇒ duration ≥ 1 恒正）</text>

  <!-- bottom note -->
  <g filter="url(#r)">
    <rect x="40" y="320" width="580" height="94" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="344" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#r)">签到题最短路径</text>
  <text x="60" y="366" font-size="11" fill="#444" filter="url(#r)">① 差分：按键区间首尾相接，持续时间 = 相邻松开时刻之差，边算边比、无需存表；</text>
  <text x="60" y="384" font-size="11" fill="#444" filter="url(#r)">② 复合最值：维护 (bestDur, bestKey)，仅当「更长」或「并列且字母更大」时更新；</text>
  <text x="60" y="402" font-size="11" fill="#444" filter="url(#r)">③ 求一个最值不需要排序 —— O(n) 时间、O(1) 空间，一趟定答案。</text>
</svg>
