<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">Boyer–Moore 抵消：候选留到最后</text>
  <text x="280" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每步维护 (候选 cand, 计数 k)：与 cand 相同则加一，不同则减一</text>

  <text x="30" y="82" font-size="11" fill="#555" filter="url(#rough2)">元素</text>
  <text x="30" y="122" font-size="11" fill="#555" filter="url(#rough2)">状态</text>
  <text x="30" y="150" font-size="10" fill="#999" filter="url(#rough2)">(cand,k)</text>

  <g>
    <rect x="100" y="64" width="66" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <rect x="170" y="64" width="66" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <rect x="240" y="64" width="66" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <rect x="310" y="64" width="66" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <rect x="380" y="64" width="66" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <rect x="450" y="64" width="66" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="133" y="83" filter="url(#rough2)">1</text><text x="203" y="83" filter="url(#rough2)">1</text>
    <text x="273" y="83" filter="url(#rough2)">2</text><text x="343" y="83" filter="url(#rough2)">2</text>
    <text x="413" y="83" filter="url(#rough2)">1</text><text x="483" y="83" filter="url(#rough2)">1</text>
  </g>

  <g>
    <rect x="100" y="102" width="66" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <rect x="170" y="102" width="66" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <rect x="240" y="102" width="66" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <rect x="310" y="102" width="66" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <rect x="380" y="102" width="66" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
    <rect x="450" y="102" width="66" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="133" y="121" filter="url(#rough2)">(1,1)</text><text x="203" y="121" filter="url(#rough2)">(1,2)</text>
    <text x="273" y="121" filter="url(#rough2)">(1,1)</text><text x="343" y="121" filter="url(#rough2)">(0,0)</text>
    <text x="413" y="121" filter="url(#rough2)">(1,1)</text><text x="483" y="121" filter="url(#rough2)">(1,2)</text>
  </g>

  <path d="M 133 132 L 133 146" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 273 132 L 273 146" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 343 132 L 343 146" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 483 132 L 483 146" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="133" y="160" font-size="9.5" fill="#7a8ba6" text-anchor="middle" filter="url(#rough2)">压入 1</text>
  <text x="203" y="160" font-size="9.5" fill="#7a8ba6" text-anchor="middle" filter="url(#rough2)">再压入 1</text>
  <text x="273" y="160" font-size="9.5" fill="#7a8ba6" text-anchor="middle" filter="url(#rough2)">1 与 2 抵消</text>
  <text x="343" y="160" font-size="9.5" fill="#a4574f" text-anchor="middle" filter="url(#rough2)">清空（假象）</text>
  <text x="413" y="160" font-size="9.5" fill="#7a8ba6" text-anchor="middle" filter="url(#rough2)">重新开始</text>
  <text x="483" y="160" font-size="9.5" fill="#7a8ba6" text-anchor="middle" filter="url(#rough2)">1 重新领先</text>

  <rect x="40" y="186" width="480" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="206" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">不变量</text>
  <text x="56" y="226" font-size="10" fill="#555" filter="url(#rough2)">(cand, k) 表示「本段两两抵消后，还剩 k 个 cand 无法配对」；</text>
  <text x="56" y="242" font-size="10" fill="#555" filter="url(#rough2)">k = 0 时整段可完全抵消，不存在压倒性多数。</text>
  <text x="56" y="258" font-size="10" fill="#555" filter="url(#rough2)">一个区间可能有很多种抵消顺序，得到的 (cand,k) 也不同。</text>

  <rect x="40" y="282" width="480" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="302" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">关键引理：严格多数永远抵消不完</text>
  <text x="56" y="322" font-size="10" fill="#3a5a30" filter="url(#rough2)">若 cnt(x) &gt; len/2，每次抵消最多带走一个 x 和一个非 x，</text>
  <text x="56" y="338" font-size="10" fill="#3a5a30" filter="url(#rough2)">剩余 x 的个数 ≥ cnt(x) − (len − cnt(x)) = 2·cnt(x) − len &gt; 0，</text>
  <text x="56" y="352" font-size="10" fill="#3a5a30" filter="url(#rough2)">所以无论按什么顺序合并，最终候选一定等于 x。</text>

  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">上例 arr = [1,1,2,2,1,1] 中 1 出现 4 次 &gt; 6/2，最终候选必为 1</text>
</svg>
