<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心模型：乘客、司机各一条 FIFO，匹配 = 同时弹队首</text>

  <text x="130" y="68" font-size="13" fill="#4a7a3a" filter="url(#rough2)">乘客队列 riderQ</text>
  <rect x="130" y="80" width="58" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="194" y="80" width="58" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="258" y="80" width="58" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="287" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="322" y="80" width="58" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="351" y="103" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="100" y="103" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">队首</text>
  <path d="M104 97 L126 97" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="62" font-size="12" fill="#4a7a3a" filter="url(#rough2)">addRider(5)</text>
  <path d="M464 68 C 444 78, 414 88, 390 95" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="130" y="198" font-size="13" fill="#446688" filter="url(#rough2)">司机队列 driverQ</text>
  <rect x="130" y="210" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="159" y="233" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="194" y="210" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="223" y="233" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="258" y="210" width="58" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="287" y="233" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <text x="100" y="233" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">队首</text>
  <path d="M104 227 L126 227" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="192" font-size="12" fill="#446688" filter="url(#rough2)">addDriver(4)</text>
  <path d="M464 198 C 446 206, 380 216, 322 227" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="28" y="128" width="92" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="74" y="152" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">[2, 3]</text>
  <text x="74" y="172" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">match 返回</text>
  <path d="M138 121 C 116 124, 98 124, 88 127" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M138 205 C 116 202, 98 196, 88 187" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="160" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">matchDriverWithRider()</text>
  <text x="330" y="178" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两侧都非空才配对，否则 [-1, -1]</text>

  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">乘客可能被取消 / 已匹配 → 队列只管顺序，「谁还有效」交给哈希集合（见下图）</text>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">司机没有取消操作，司机队列永远是「干净」的</text>
</svg>
