<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="700" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">长度越大越容易「唯一」—— 可以二分的单调性</text>
  <path d="M 300 42 Q 470 50 640 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: L = 1 all duplicated ===== -->
  <text x="60" y="72" font-size="13" font-weight="bold" fill="#b03a3a">① 长度 L=1：所有子数组都重复出现</text>

  <g font-size="13">
    <g filter="url(#sk)"><rect x="120" y="88" width="62" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="151" y="113" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="188" y="88" width="62" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="219" y="113" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="256" y="88" width="62" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="287" y="113" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="324" y="88" width="62" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="355" y="113" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="392" y="88" width="62" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="423" y="113" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
  </g>
  <g font-size="11" fill="#b85450" font-weight="bold">
    <text x="151" y="146" text-anchor="middle">×3</text>
    <text x="219" y="146" text-anchor="middle">×3</text>
    <text x="287" y="146" text-anchor="middle">×2</text>
    <text x="355" y="146" text-anchor="middle">×2</text>
    <text x="423" y="146" text-anchor="middle">×3</text>
  </g>
  <text x="287" y="172" text-anchor="middle" font-size="10.5" fill="#888">值 1 出现 3 次、值 2 出现 2 次 —— 没有出现次数为 1 的子数组</text>

  <path d="M 460 107 L 532 107" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="540" y="84" width="330" height="92" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="560" y="110" font-size="11.5" font-weight="bold" fill="#7a2828">长度 L=1 的判定</text>
  <text x="560" y="136" font-size="13" fill="#b03a3a" font-weight="bold">不存在唯一子数组 ✗</text>
  <text x="560" y="160" font-size="11" fill="#888" font-family="monospace">P(1) = false</text>

  <!-- ===== Panel 2: L = 2 all unique ===== -->
  <text x="60" y="212" font-size="13" font-weight="bold" fill="#2e6e2e">② 长度 L=2：四个子数组恰好各出现 1 次</text>

  <g font-size="13">
    <g filter="url(#sk)"><rect x="120" y="230" width="62" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="151" y="255" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="188" y="230" width="62" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="219" y="255" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="256" y="230" width="62" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="287" y="255" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="324" y="230" width="62" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="355" y="255" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="392" y="230" width="62" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="423" y="255" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
  </g>
  <!-- sliding windows -->
  <g filter="url(#sk)">
    <rect x="116" y="226" width="130" height="46" fill="none" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="184" y="226" width="130" height="46" fill="none" stroke="#d6a040" stroke-width="1.2" opacity="0.55"/>
    <rect x="252" y="226" width="130" height="46" fill="none" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="320" y="226" width="130" height="46" fill="none" stroke="#d6a040" stroke-width="1.2" opacity="0.55"/>
  </g>
  <g font-size="11">
    <text x="181" y="292" text-anchor="middle" font-weight="bold" fill="#444">[1,1]</text>
    <text x="249" y="292" text-anchor="middle" font-weight="bold" fill="#444">[1,2]</text>
    <text x="317" y="292" text-anchor="middle" font-weight="bold" fill="#444">[2,2]</text>
    <text x="385" y="292" text-anchor="middle" font-weight="bold" fill="#444">[2,1]</text>
    <text x="181" y="310" text-anchor="middle" font-weight="bold" fill="#4a7a3a">×1 ✓</text>
    <text x="249" y="310" text-anchor="middle" font-weight="bold" fill="#4a7a3a">×1 ✓</text>
    <text x="317" y="310" text-anchor="middle" font-weight="bold" fill="#4a7a3a">×1 ✓</text>
    <text x="385" y="310" text-anchor="middle" font-weight="bold" fill="#4a7a3a">×1 ✓</text>
  </g>
  <text x="287" y="336" text-anchor="middle" font-size="10.5" fill="#888">四个长度为 2 的子数组互不相同，各自只出现 1 次</text>

  <path d="M 460 249 L 532 249" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="540" y="226" width="330" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="560" y="252" font-size="11.5" font-weight="bold" fill="#2e6e2e">长度 L=2 的判定</text>
  <text x="560" y="278" font-size="13" fill="#2e6e2e" font-weight="bold">存在唯一子数组 ✓（如 [1,1]）</text>
  <text x="560" y="302" font-size="11" fill="#888" font-family="monospace">P(2) = true → 答案 2</text>

  <!-- ===== Panel 3: extension lemma ===== -->
  <text x="60" y="378" font-size="13" font-weight="bold" fill="#5a3a7a">③ 关键引理：唯一的段，向左或向右延长一位，仍然唯一</text>

  <g font-size="12">
    <g filter="url(#sk)"><rect x="90" y="400" width="54" height="36" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
    <text x="117" y="424" text-anchor="middle" fill="#999">3</text>
    <g filter="url(#sk)"><rect x="150" y="400" width="54" height="36" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
    <text x="177" y="424" text-anchor="middle" fill="#999">5</text>
    <g filter="url(#sk)"><rect x="210" y="400" width="54" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="237" y="424" text-anchor="middle" fill="#2e6e2e" font-weight="bold">7</text>
    <g filter="url(#sk)"><rect x="270" y="400" width="54" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="297" y="424" text-anchor="middle" fill="#2e6e2e" font-weight="bold">9</text>
    <g filter="url(#sk)"><rect x="330" y="400" width="54" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
    <text x="357" y="424" text-anchor="middle" fill="#2e6e2e" font-weight="bold">4</text>
    <g filter="url(#sk)"><rect x="390" y="400" width="54" height="36" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
    <text x="417" y="424" text-anchor="middle" fill="#999">8</text>
    <g filter="url(#sk)"><rect x="450" y="400" width="54" height="36" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
    <text x="477" y="424" text-anchor="middle" fill="#999">2</text>
    <g filter="url(#sk)"><rect x="510" y="400" width="54" height="36" fill="#f0ede4" stroke="#ccc" stroke-width="1"/></g>
    <text x="537" y="424" text-anchor="middle" fill="#999">6</text>
  </g>
  <!-- green box around A -->
  <g filter="url(#sk)">
    <rect x="206" y="394" width="176" height="48" fill="none" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <!-- blue dashed box around B = A + one more -->
  <g filter="url(#sk)">
    <rect x="202" y="386" width="238" height="64" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <text x="321" y="380" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">B = A 向右延长 1 位</text>
  <path d="M 294 446 L 294 462" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="294" y="480" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">A：唯一子数组（仅出现 1 次）</text>

  <g filter="url(#sk)">
    <rect x="600" y="390" width="290" height="112" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="618" y="414" font-size="11.5" font-weight="bold" fill="#7a5415">为什么 B 仍然唯一？</text>
  <text x="618" y="437" font-size="10.5" fill="#444">若别处还有一段等于 B，</text>
  <text x="618" y="457" font-size="10.5" fill="#444">它的内部必然含有一段等于 A</text>
  <text x="618" y="479" font-size="10.5" fill="#b03a3a" font-weight="bold">→ A 至少出现 2 次，矛盾 ∎</text>
  <text x="618" y="496" font-size="9.5" fill="#999">（向左延长同理）</text>

  <!-- ===== Panel 4: monotonicity summary ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="524" width="840" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="84" y="552" font-size="13" font-weight="bold" fill="#2b6e9e">单调性：P(L) =「存在长度为 L 的唯一子数组」</text>
  <text x="84" y="574" font-size="10.5" fill="#666">整个数组（长度 n）永远唯一；唯一段可延长 → P 随 L 增大只能从 false 翻转为 true，之后恒 true</text>

  <!-- number axis -->
  <path d="M 90 632 L 580 632" stroke="#3a3a3a" stroke-width="1.6" filter="url(#sk)"/>
  <g font-size="11">
    <text x="110" y="652" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
    <text x="168" y="652" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
    <text x="226" y="616" text-anchor="middle" fill="#d6a040" font-weight="bold">L*</text>
    <text x="226" y="652" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="284" y="652" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="342" y="652" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="400" y="652" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="458" y="652" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="516" y="652" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="574" y="652" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>
  <text x="140" y="674" text-anchor="middle" font-size="10" fill="#b85450">P = false</text>
  <text x="440" y="674" text-anchor="middle" font-size="10" fill="#4a7a3a">P = true（一直到 L = n）</text>
  <text x="610" y="592" font-size="12" fill="#2b6e9e" font-weight="bold">二分最小的 true</text>
  <text x="610" y="622" font-size="17" fill="#2e6e2e" font-weight="bold">答案 = L*</text>
  <text x="610" y="646" font-size="10" fill="#888">判定 check(L) 用滚动哈希</text>
  <text x="610" y="662" font-size="10" fill="#888">O(n) 完成 → 总 O(n log n)</text>
</svg>
