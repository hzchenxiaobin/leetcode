<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次操作在链上做了什么：每条边的贡献取遍 G</text>
  <path d="M 116 46 Q 380 54 648 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380" y="66" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">异或可交换、可结合 ⇒ 操作顺序无关，每条边只看「所用 3k 的总异或」</text>

  <rect x="40" y="96" width="84" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="82" y="125" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">a_1</text>
  <rect x="186" y="96" width="84" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="228" y="125" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">a_2</text>
  <rect x="332" y="96" width="84" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="374" y="126" text-anchor="middle" font-size="16" fill="#2f4a66" filter="url(#rough2)">⋯</text>
  <rect x="478" y="96" width="84" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="125" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">a_(n−1)</text>
  <rect x="624" y="96" width="84" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="666" y="125" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">a_n</text>

  <path d="M 128 119 L 182 119" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 274 119 L 328 119" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 119 L 474 119" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 566 119 L 620 119" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="155" y="89" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">s_1</text>
  <text x="301" y="89" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">⋯</text>
  <text x="447" y="89" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">s_(n−2)</text>
  <text x="593" y="89" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">s_(n−1)</text>

  <rect x="30" y="172" width="700" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="199" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">a′_i = a_i ⊕ s_(i−1) ⊕ s_i ， s_0 = s_n = 0 ， s_i ∈ G</text>
  <text x="380" y="222" text-anchor="middle" font-size="11.5" fill="#5c5140" filter="url(#rough2)">s_i = 第 i 条边上所有操作所用 3k 的异或和；各条边互不影响</text>

  <rect x="30" y="248" width="700" height="158" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="274" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">G = span{3,6,9,12,15} = {0,3,5,6,9,10,12,15} = 0..15 中 popcount 为偶数的 8 个数</text>
  <text x="52" y="302" font-size="12.5" fill="#333" filter="url(#rough2)">3 = 0011、6 = 0110、12 = 1100 在 GF(2)⁴ 中线性无关 ⇒ 张成 2³ = 8 个偶权数</text>
  <text x="52" y="326" font-size="12.5" fill="#333" filter="url(#rough2)">9 = 3⊕6⊕12、15 = 3⊕12 是多给的；而 5 = 3⊕6、10 = 6⊕12 也能凑出来</text>
  <text x="52" y="350" font-size="12.5" fill="#333" filter="url(#rough2)">反向：每个 g ∈ G 都能用至多 3 次操作在一条边上实现 ⇒ 边贡献恰好跑遍 G</text>
  <text x="52" y="378" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">注意 3k 全都是偶权 ⇒ 每个位置的 popcount 奇偶性是不变量！</text>
</svg>
