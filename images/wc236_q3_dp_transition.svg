<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">单个点的转移流程：封锁 → 取最小 → 松弛 → 重封</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="56" text-anchor="middle" font-size="11.5" fill="#666">对每个点 i = 1 … n 执行一轮，dp 始终只有 3 个格子</text>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <rect x="220" y="66" width="200" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="88" text-anchor="middle" font-size="12" fill="#33517a">o ← obstacles[i]（点 i 的障碍道）</text>
  <path d="M 320 100 L 320 118" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrN)" filter="url(#sk)"/>

  <!-- 菱形 1 -->
  <g filter="url(#sk)">
    <polygon points="320,118 396,152 320,186 244,152" fill="#fff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="157" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a">o &gt; 0 ?</text>
  <text x="330" y="204" font-size="10.5" fill="#888">否</text>
  <path d="M 320 186 L 320 216" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- 是分支 1 -->
  <text x="410" y="144" font-size="10.5" fill="#8f3830">是</text>
  <path d="M 396 152 L 434 152" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrN)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="438" y="134" width="168" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="522" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3830">dp[o−1] ← ∞</text>
  <text x="522" y="164" text-anchor="middle" font-size="9.5" fill="#8f3830">障碍道禁足</text>
  <path d="M 522 170 L 522 208 Q 522 216 512 216 L 326 216" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <circle cx="320" cy="216" r="3.5" fill="#446688" filter="url(#sk)"/>
  <path d="M 320 216 L 320 230" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrN)" filter="url(#sk)"/>

  <!-- mn 框 -->
  <g filter="url(#sk)">
    <rect x="210" y="234" width="220" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="250" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a">mn ← min(dp[0], dp[1], dp[2])</text>
  <text x="320" y="264" text-anchor="middle" font-size="9.5" fill="#33517a">最便宜的空闲道（障碍道已封）</text>
  <path d="M 320 270 L 320 288" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrN)" filter="url(#sk)"/>

  <!-- 松弛框 -->
  <g filter="url(#sk)">
    <rect x="170" y="292" width="300" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5a24">对 j = 0,1,2：dp[j] ← min(dp[j], mn+1)</text>
  <text x="320" y="330" text-anchor="middle" font-size="9.5" fill="#2e5a24">一次侧跳可从 mn 道到任意空闲道</text>
  <path d="M 320 340 L 320 356" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrN)" filter="url(#sk)"/>

  <!-- 菱形 2 -->
  <g filter="url(#sk)">
    <polygon points="320,356 396,390 320,424 244,390" fill="#fff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="395" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a">o &gt; 0 ?</text>
  <text x="330" y="442" font-size="10.5" fill="#888">否</text>
  <path d="M 320 424 L 320 450" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- 是分支 2 -->
  <text x="230" y="382" font-size="10.5" fill="#8f3830">是</text>
  <path d="M 244 390 L 208 390" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrN)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="38" y="372" width="168" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="122" y="388" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3830">dp[o−1] ← ∞</text>
  <text x="122" y="402" text-anchor="middle" font-size="9.5" fill="#8f3830">松弛建议丢弃后重新封住</text>
  <path d="M 122 408 L 122 442 Q 122 450 132 450 L 312 450" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <circle cx="320" cy="450" r="3.5" fill="#446688" filter="url(#sk)"/>
  <path d="M 320 450 L 320 464" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrN)" filter="url(#sk)"/>

  <!-- 结束 -->
  <g filter="url(#sk)">
    <rect x="220" y="468" width="200" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="482" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415">i ← i + 1</text>
  <text x="320" y="496" text-anchor="middle" font-size="9.5" fill="#8a6415">重复到 i = n，答案 = min(dp)</text>

  <!-- 警示框 -->
  <g filter="url(#sk)">
    <rect x="60" y="516" width="520" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="537" text-anchor="middle" font-size="11" fill="#8f3830">⚠ 松弛会把 mn+1 写进障碍道——必须重封，否则下一点会误判能沿该道直行</text>
</svg>
