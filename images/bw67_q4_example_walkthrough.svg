<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">官方示例：游标的六次右移</text>

  <!-- 最终序列 -->
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="82" y="56">第1名</text><text x="152" y="56">第2名</text><text x="222" y="56">第3名</text>
    <text x="292" y="56">第4名</text><text x="362" y="56">第5名</text><text x="432" y="56">第6名</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="50" y="66" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="120" y="66" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="190" y="66" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="260" y="66" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="330" y="66" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <rect x="400" y="66" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
  </g>
  <g font-size="9.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="82" y="87">branford</text><text x="152" y="87">orlando</text><text x="222" y="87">alpine</text>
    <text x="292" y="87">alps</text><text x="362" y="87">bradford</text><text x="432" y="87">orland</text>
  </g>

  <!-- 游标时间线：6 次返回 -->
  <g filter="url(#rough2)">
    <path d="M 82 116 C 82 132, 82 140, 82 148" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 152 116 C 160 140, 205 148, 292 150" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" opacity="0.55"/>
    <path d="M 362 116 C 362 134, 362 142, 362 150" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 362 166 C 362 178, 362 184, 362 192" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" opacity="0.7"/>
    <path d="M 362 208 C 362 220, 362 226, 362 234" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" opacity="0.85"/>
    <path d="M 432 236 C 432 244, 432 248, 432 256" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <g font-size="12" fill="#7a3b37" text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="152">get#1 → branford</text>
    <text x="290" y="168">get#2 → alps</text>
    <text x="240" y="192">get#3 → bradford</text>
    <text x="210" y="214">get#4 → bradford</text>
    <text x="200" y="234">get#5 → bradford</text>
    <text x="290" y="258">get#6 → orland</text>
  </g>

  <rect x="50" y="282" width="420" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">get 单调右移（先读后 ++）；add 可能触发 --cur 补位</text>
  <text x="260" y="324" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">bradford 被三个「同分更小名字」的新景点反复向前挤，</text>
  <text x="260" y="340" text-anchor="middle" font-size="12.5" fill="#2e4d24" filter="url(#rough2)">名次却靠游标左移一直稳在第 k+1 名</text>
</svg>
