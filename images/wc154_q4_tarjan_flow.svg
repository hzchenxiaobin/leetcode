<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa" filter="url(#rough2)"/>

  <ellipse cx="170" cy="46" rx="96" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="52" text-anchor="middle" font-size="14" fill="#2b3f55" filter="url(#rough2)">DFS 进入节点 u</text>

  <rect x="65" y="84" width="210" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="110" text-anchor="middle" font-size="13" fill="#6b5316" filter="url(#rough2)">dfn[u] = low[u] = ++timer</text>

  <rect x="65" y="144" width="210" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="170" text-anchor="middle" font-size="13" fill="#6b5316" filter="url(#rough2)">枚举 u 的每条邻边 (u,v)</text>

  <polygon points="170,204 282,246 170,288 58,246" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="252" text-anchor="middle" font-size="13" fill="#2b3f55" filter="url(#rough2)">dfn[v] 未访问？</text>

  <rect x="45" y="320" width="250" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="342" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">树边：递归 DFS(v)</text>
  <text x="170" y="364" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">low[u] = min(low[u], low[v])</text>

  <rect x="350" y="214" width="226" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="463" y="238" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">回边（v 不等于父节点）</text>
  <text x="463" y="262" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">low[u] = min(low[u], dfn[v])</text>

  <rect x="320" y="332" width="266" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="453" y="356" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">若 low[v] &gt; dfn[u]</text>
  <text x="453" y="380" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">⇒ (u,v) 是桥，记录答案</text>

  <line x1="170" y1="70" x2="170" y2="82" stroke="#666" stroke-width="1.4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <line x1="170" y1="124" x2="170" y2="142" stroke="#666" stroke-width="1.4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <line x1="170" y1="184" x2="170" y2="202" stroke="#666" stroke-width="1.4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <line x1="170" y1="288" x2="170" y2="318" stroke="#666" stroke-width="1.4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <line x1="282" y1="246" x2="346" y2="246" stroke="#666" stroke-width="1.4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <line x1="295" y1="349" x2="318" y2="356" stroke="#666" stroke-width="1.4" filter="url(#rough2)" marker-end="url(#arr)"/>

  <text x="186" y="308" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="304" y="238" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="300" y="424" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">dfn：首次访问时间戳；low：子树经至多一条回边能触到的最小 dfn</text>
</svg>
