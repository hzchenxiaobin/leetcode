<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：反向视角——key 下标照亮 [j−k, j+k]</text>
  <path d="M 150 46 Q 320 54 490 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 行1：原数组格子 -->
  <text x="90" y="90" font-size="13" font-weight="bold" fill="#2b2b2b">nums =</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <g filter="url(#sk)"><rect x="150" y="70" width="52" height="34" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/></g>
    <text x="176" y="92">3</text>
    <g filter="url(#sk)"><rect x="206" y="70" width="52" height="34" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/></g>
    <text x="232" y="92">4</text>
    <g filter="url(#sk)"><rect x="262" y="70" width="52" height="34" rx="6" fill="#ffe8cc" stroke="#d6a040" stroke-width="2.2"/></g>
    <text x="288" y="92" fill="#a06514" font-weight="bold">9</text>
    <g filter="url(#sk)"><rect x="318" y="70" width="52" height="34" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/></g>
    <text x="344" y="92">1</text>
    <g filter="url(#sk)"><rect x="374" y="70" width="52" height="34" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/></g>
    <text x="400" y="92">3</text>
    <g filter="url(#sk)"><rect x="430" y="70" width="52" height="34" rx="6" fill="#ffe8cc" stroke="#d6a040" stroke-width="2.2"/></g>
    <text x="456" y="92" fill="#a06514" font-weight="bold">9</text>
    <g filter="url(#sk)"><rect x="486" y="70" width="52" height="34" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/></g>
    <text x="512" y="92">5</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="176" y="116">0</text><text x="232" y="116">1</text><text x="288" y="116">2</text>
    <text x="344" y="116">3</text><text x="400" y="116">4</text><text x="456" y="116">5</text><text x="512" y="116">6</text>
  </g>
  <text x="320" y="140" text-anchor="middle" font-size="12" fill="#a06514">key = 9 出现在 j = 2 和 j = 5</text>

  <!-- 箭头：key 格子指向覆盖条 -->
  <path d="M 288 152 L 288 172" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 456 152 L 456 172" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 行2：两条覆盖条 -->
  <text x="90" y="192" font-size="13" font-weight="bold" fill="#2b2b2b">照亮:</text>
  <g filter="url(#sk)">
    <rect x="206" y="176" width="164" height="26" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="288" y="194" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">j=2 → [2−1, 2+1] = [1,3]</text>
  <g filter="url(#sk)">
    <rect x="374" y="176" width="164" height="26" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="456" y="194" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">j=5 → [4,6]</text>

  <!-- 行3：并集结果 -->
  <text x="90" y="252" font-size="13" font-weight="bold" fill="#2b2b2b">并集:</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <g filter="url(#sk)"><rect x="150" y="230" width="52" height="34" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3"/></g>
    <text x="176" y="252" fill="#999">✗</text>
    <g filter="url(#sk)"><rect x="206" y="230" width="52" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="232" y="252" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="262" y="230" width="52" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="288" y="252" fill="#2e6e2e" font-weight="bold">2</text>
    <g filter="url(#sk)"><rect x="318" y="230" width="52" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="344" y="252" fill="#2e6e2e" font-weight="bold">3</text>
    <g filter="url(#sk)"><rect x="374" y="230" width="52" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="400" y="252" fill="#2e6e2e" font-weight="bold">4</text>
    <g filter="url(#sk)"><rect x="430" y="230" width="52" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="456" y="252" fill="#2e6e2e" font-weight="bold">5</text>
    <g filter="url(#sk)"><rect x="486" y="230" width="52" height="34" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="512" y="252" fill="#2e6e2e" font-weight="bold">6</text>
  </g>
  <text x="320" y="292" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">答案 = [1,2,3,4,5,6]（下标 0 没被任何区间照亮）</text>

  <!-- 底注 -->
  <g filter="url(#sk)">
    <rect x="60" y="312" width="520" height="48" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="320" y="332" text-anchor="middle" font-size="12" fill="#7a5415">正着做：每个 i 找有没有 j（O(n·k)）。</text>
  <text x="320" y="350" text-anchor="middle" font-size="12" fill="#7a5415">反着做：每个 key 下标 j 直接照亮一段区间 [j−k, j+k]，答案 = 所有照亮区间的并集。</text>
</svg>
