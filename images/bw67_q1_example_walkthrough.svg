<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：nums = [−1, −2, 3, 4]，k = 3</text>

  <!-- 第一步：原数组 -->
  <text x="38" y="66" font-size="12" fill="#666" filter="url(#rough2)">原数组</text>
  <rect x="100" y="46" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="67" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="155" y="46" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="181" y="67" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="210" y="46" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="67" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="265" y="46" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="291" y="67" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="126" y="92" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="181" y="92" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="236" y="92" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="291" y="92" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="340" y="67" font-size="12" fill="#8a6d1a" filter="url(#rough2)">橙色 = 前 3 大值</text>

  <path d="M 260 100 C 260 118, 260 124, 260 138" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第二步：按值降序 -->
  <rect x="60" y="142" width="400" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="13" fill="#2e4d24" filter="url(#rough2)">按值降序排下标：[3, 2, 0, 1]，取前 3 个 → {3, 2, 0}</text>

  <path d="M 260 178 C 260 194, 260 200, 260 214" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第三步：下标升序 -->
  <rect x="60" y="218" width="400" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="239" text-anchor="middle" font-size="13" fill="#2b3d52" filter="url(#rough2)">选中下标升序：[0, 2, 3] → 按原顺序取元素</text>

  <path d="M 260 254 C 260 270, 260 276, 260 290" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 输出 -->
  <text x="120" y="322" font-size="13" fill="#666" filter="url(#rough2)">输出：</text>
  <rect x="175" y="302" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="324" text-anchor="middle" font-size="14" fill="#2e4d24" filter="url(#rough2)">−1</text>
  <rect x="230" y="302" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="324" text-anchor="middle" font-size="14" fill="#2e4d24" filter="url(#rough2)">3</text>
  <rect x="285" y="302" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="311" y="324" text-anchor="middle" font-size="14" fill="#2e4d24" filter="url(#rough2)">4</text>
  <text x="360" y="324" font-size="12" fill="#888" filter="url(#rough2)">和 = 6 ✓</text>
</svg>
