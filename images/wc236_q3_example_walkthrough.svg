<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="500" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 逐点演算：dp 从 [1, 0, 1] 演化到 [2, 3, 3]</text>
  <path d="M 130 38 Q 320 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="11.5" fill="#666">obstacles = [0, 1, 2, 3, 0]，每行是处理完该点后的 dp（∞ = 该道被障碍封死）</text>

  <!-- 表格 -->
  <g filter="url(#sk)">
    <!-- 表头 -->
    <rect x="70" y="66" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="120" y="66" width="70" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="190" y="66" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="270" y="66" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="350" y="66" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="430" y="66" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <!-- 行框（白底） -->
    <rect x="70" y="102" width="420" height="44" fill="#fff" stroke="#999" stroke-width="1"/>
    <rect x="70" y="146" width="420" height="44" fill="#fff" stroke="#999" stroke-width="1"/>
    <rect x="70" y="190" width="420" height="44" fill="#fff" stroke="#999" stroke-width="1"/>
    <rect x="70" y="234" width="420" height="44" fill="#fff" stroke="#999" stroke-width="1"/>
    <rect x="70" y="278" width="420" height="44" fill="#fff" stroke="#999" stroke-width="1"/>
    <!-- 高亮：mn 所在格（绿）、障碍格（红） -->
    <rect x="270" y="102" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="270" y="146" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="190" y="190" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="270" y="190" width="80" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="190" y="234" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="350" y="234" width="80" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="190" y="278" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="190" y="146" width="80" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <!-- 列分隔线 -->
    <path d="M 120 102 L 120 322 M 190 102 L 190 322 M 270 102 L 270 322 M 350 102 L 350 322 M 430 102 L 430 322" stroke="#bbb" stroke-width="1" fill="none"/>
  </g>

  <!-- 表头文字 -->
  <text x="95" y="88" text-anchor="middle" font-size="11.5" fill="#33517a">点</text>
  <text x="155" y="88" text-anchor="middle" font-size="11.5" fill="#33517a">障碍</text>
  <text x="230" y="88" text-anchor="middle" font-size="11.5" fill="#33517a">dp[1]</text>
  <text x="310" y="88" text-anchor="middle" font-size="11.5" fill="#33517a">dp[2]</text>
  <text x="390" y="88" text-anchor="middle" font-size="11.5" fill="#33517a">dp[3]</text>
  <text x="460" y="88" text-anchor="middle" font-size="11.5" fill="#33517a">mn</text>

  <!-- 行 0：点 0 -->
  <text x="95" y="129" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="155" y="129" text-anchor="middle" font-size="11" fill="#888">—（初始）</text>
  <text x="230" y="129" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="310" y="129" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24">0</text>
  <text x="390" y="129" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="460" y="129" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- 行 1：点 1 封 1 道 -->
  <text x="95" y="173" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="155" y="173" text-anchor="middle" font-size="11" fill="#8f3830">1 道</text>
  <text x="230" y="173" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830">∞</text>
  <text x="310" y="173" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24">0</text>
  <text x="390" y="173" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="460" y="173" text-anchor="middle" font-size="12" fill="#333">0</text>

  <!-- 行 2：点 2 封 2 道 -->
  <text x="95" y="217" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="155" y="217" text-anchor="middle" font-size="11" fill="#8f3830">2 道</text>
  <text x="230" y="217" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24">2</text>
  <text x="310" y="217" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830">∞</text>
  <text x="390" y="217" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="460" y="217" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- 行 3：点 3 封 3 道 -->
  <text x="95" y="261" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="155" y="261" text-anchor="middle" font-size="11" fill="#8f3830">3 道</text>
  <text x="230" y="261" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24">2</text>
  <text x="310" y="261" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="390" y="261" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830">∞</text>
  <text x="460" y="261" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- 行 4：点 4 无障碍 -->
  <text x="95" y="305" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="155" y="305" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="230" y="305" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24">2</text>
  <text x="310" y="305" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="390" y="305" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="460" y="305" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- 点 2 关键步标注 -->
  <path d="M 230 234 C 230 348 200 352 190 360" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrN)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="70" y="364" width="500" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">点 2 关键步：封 2 道后 mn = 1（在 3 道），1 道 ← mn+1 = 2</text>
  <text x="320" y="406" text-anchor="middle" font-size="11" fill="#8a6415">从 3 道一次越障侧跳跨过被封的 2 道到 1 道——1 与 3 不相邻也算 1 次</text>

  <!-- 答案框 -->
  <g filter="url(#sk)">
    <rect x="70" y="432" width="500" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="452" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a">答案 = min(dp) = min(2, 3, 3) = 2 ✓</text>
  <text x="320" y="472" text-anchor="middle" font-size="11" fill="#33517a">终点任一车道都算到达，取三条道的最小值（不是 dp[2]）</text>
</svg>
