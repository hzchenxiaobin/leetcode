<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "CONTEST IS COMING"</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">最长单词长度 7 → 共 7 行；灰格是补出来的空格占位</text>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" font-weight="bold" fill="#3a4a66">
    <text x="164" y="86">CONTEST</text>
    <text x="220" y="86">IS</text>
    <text x="276" y="86">COMING</text>
  </g>
  <text x="330" y="86" font-size="10" fill="#888" filter="url(#rough2)">拼出的答案行</text>

  <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="end">
    <text x="128" y="115">r=0</text>
    <text x="128" y="147">r=1</text>
    <text x="128" y="179">r=2</text>
    <text x="128" y="211">r=3</text>
    <text x="128" y="243">r=4</text>
    <text x="128" y="275">r=5</text>
    <text x="128" y="307">r=6</text>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="140" y="96" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="196" y="96" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="252" y="96" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="164" y="115" fill="#3a4a66">C</text>
    <text x="220" y="115" fill="#3a4a66">I</text>
    <text x="276" y="115" fill="#3a4a66">C</text>

    <rect x="140" y="128" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="196" y="128" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="252" y="128" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="164" y="147" fill="#3a5a30">O</text>
    <text x="220" y="147" fill="#3a5a30">S</text>
    <text x="276" y="147" fill="#3a5a30">O</text>

    <rect x="140" y="160" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="196" y="160" width="48" height="28" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="252" y="160" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="164" y="179" fill="#8a6a20">N</text>
    <text x="276" y="179" fill="#8a6a20">M</text>

    <rect x="140" y="192" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="196" y="192" width="48" height="28" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="252" y="192" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="164" y="211" fill="#8a6a20">T</text>
    <text x="276" y="211" fill="#8a6a20">I</text>

    <rect x="140" y="224" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="196" y="224" width="48" height="28" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="252" y="224" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="164" y="243" fill="#8a6a20">E</text>
    <text x="276" y="243" fill="#8a6a20">N</text>

    <rect x="140" y="256" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="196" y="256" width="48" height="28" fill="#f2f2f2" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="252" y="256" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="164" y="275" fill="#8a6a20">S</text>
    <text x="276" y="275" fill="#8a6a20">G</text>

    <rect x="140" y="288" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="4"/>
    <rect x="196" y="288" width="48" height="28" fill="#f2f2f2" stroke="#b85450" stroke-width="1.3" rx="4" stroke-dasharray="4 3"/>
    <rect x="252" y="288" width="48" height="28" fill="#f2f2f2" stroke="#b85450" stroke-width="1.3" rx="4" stroke-dasharray="4 3"/>
    <text x="164" y="307" fill="#b85450">T</text>
  </g>

  <text x="220" y="181" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">·</text>
  <text x="220" y="213" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">·</text>
  <text x="220" y="245" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">·</text>
  <text x="220" y="277" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">·</text>

  <path d="M 308 110 L 322 110" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 308 142 L 322 142" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 308 174 L 322 174" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 308 206 L 322 206" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 308 238 L 322 238" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 308 270 L 322 270" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 308 302 L 322 302" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12" fill="#333" font-weight="bold">
    <text x="328" y="115">"CIC"</text>
    <text x="328" y="147">"OSO"</text>
    <text x="328" y="179">"N M"</text>
    <text x="328" y="211">"T I"</text>
    <text x="328" y="243">"E N"</text>
    <text x="328" y="275">"S G"</text>
    <text x="328" y="307" fill="#b85450">"T"</text>
  </g>

  <text x="328" y="326" font-size="9" fill="#b85450" filter="url(#rough2)">两个尾空格已删除</text>

  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">r=2 的行 "N M" 中间的空格是「列对齐」必需的，必须保留；只有行尾的空格才删</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">r=6 只有第一列有字符，拼出 "T  " 后去掉两个尾空格，得到 "T"</text>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">七行依次为 CIC / OSO / "N M" / "T I" / "E N" / "S G" / T</text>
</svg>
