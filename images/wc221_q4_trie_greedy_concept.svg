<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="720" height="470" fill="#fafafa"/>
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">0-1 Trie 逐位贪心：候选 S = {0, 1}，查询 x = 3（2 位示意，实际 31 位）</text>
  <path d="M 180 34 Q 360 42 540 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 结果框 -->
  <g filter="url(#sk)"><rect x="90" y="44" width="540" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="360" y="65" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">贪心路径 root →(0)→ (0)→ 命中 0：res = 11₂ = 3 = 3 ⊕ 0 ✓</text>

  <!-- Trie 边 -->
  <g filter="url(#sk)">
    <path d="M 348 128 L 242 176" stroke="#b85450" stroke-width="3" fill="none"/>
    <path d="M 372 128 L 500 172" stroke="#8a8a8a" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/>
    <path d="M 240 209 L 172 248" stroke="#b85450" stroke-width="3" fill="none"/>
    <path d="M 262 209 L 330 248" stroke="#8a8a8a" stroke-width="1.5" fill="none"/>
  </g>
  <!-- 边标签 -->
  <text x="280" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">0</text>
  <text x="452" y="146" text-anchor="middle" font-size="12" fill="#999" filter="url(#sk)">1（∅）</text>
  <text x="188" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">0</text>
  <text x="308" y="232" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">1</text>

  <!-- 节点 -->
  <g filter="url(#sk)"><circle cx="360" cy="114" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="360" y="119" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">root</text>
  <g filter="url(#sk)"><circle cx="230" cy="192" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="230" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#sk)">0</text>
  <text x="256" y="188" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#sk)">前缀 0</text>
  <g filter="url(#sk)"><circle cx="552" cy="166" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="552" y="171" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#sk)">∅</text>

  <!-- 叶子 -->
  <g filter="url(#sk)"><rect x="130" y="262" width="72" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/></g>
  <text x="166" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">00 = 0 ✓</text>
  <g filter="url(#sk)"><rect x="300" y="262" width="72" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="336" y="280" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">01 = 1</text>

  <!-- 位次标签 -->
  <text x="70" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" filter="url(#sk)">第1位</text>
  <text x="70" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#888" filter="url(#sk)">第0位</text>
  <text x="70" y="120" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#sk)">高位在前</text>

  <!-- 逐位注解 -->
  <g filter="url(#sk)"><rect x="60" y="330" width="290" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="205" y="348" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#sk)">第1位：x 的该位是 1 → 优先走 0 边</text>
  <text x="205" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">0 子树存在 ✓ res 该位记 1</text>
  <g filter="url(#sk)"><rect x="370" y="330" width="290" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="515" y="348" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#sk)">第0位：x 的该位是 1 → 优先走 0 边</text>
  <text x="515" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#sk)">命中元素 0，res = 11₂ = 3</text>

  <!-- 高位占优注解 -->
  <g filter="url(#sk)"><rect x="60" y="398" width="600" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="360" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#33507a" filter="url(#sk)">为什么高位优先？2^b &gt; 2^(b-1) + … + 2^0</text>
  <text x="360" y="438" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#sk)">让第 b 位异或出 1，胜过把所有低位全凑成 1 —— 逐位贪心不会错过最优</text>
</svg>
