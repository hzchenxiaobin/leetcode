<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa" filter="url(#rough2)"/>

  <text x="310" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：root = [4,2,null,3,1]，val = 1，depth = 3</text>
  <text x="310" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">depth−1 = 2，只有节点 2 在这一层，于是它的左右各插入一个值为 1 的节点</text>

  <!-- 插入前 -->
  <rect x="18" y="60" width="272" height="252" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="154" y="84" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">插入前</text>

  <text x="36" y="125" text-anchor="middle" font-size="8.5" fill="#aaaaaa" filter="url(#rough2)">d=1</text>
  <text x="36" y="201" text-anchor="middle" font-size="8.5" fill="#aaaaaa" filter="url(#rough2)">d=2</text>
  <text x="36" y="277" text-anchor="middle" font-size="8.5" fill="#aaaaaa" filter="url(#rough2)">d=3</text>

  <path d="M 154 135 L 118 178" stroke="#777" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 98 211 L 78 254" stroke="#777" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 130 211 L 144 254" stroke="#777" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="154" cy="120" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="154" y="125" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">4</text>

  <circle cx="114" cy="196" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="114" y="201" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>

  <circle cx="74" cy="272" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="277" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">3</text>

  <circle cx="146" cy="272" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="146" y="277" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">1</text>

  <!-- 中间箭头 -->
  <path d="M 298 186 L 336 186" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="317" y="176" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">插一行</text>

  <!-- 插入后 -->
  <rect x="332" y="60" width="272" height="252" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="468" y="84" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">插入后</text>

  <text x="350" y="117" text-anchor="middle" font-size="8.5" fill="#aaaaaa" filter="url(#rough2)">d=1</text>
  <text x="350" y="183" text-anchor="middle" font-size="8.5" fill="#aaaaaa" filter="url(#rough2)">d=2</text>
  <text x="350" y="245" text-anchor="middle" font-size="8.5" fill="#aaaaaa" filter="url(#rough2)">d=3</text>
  <text x="350" y="301" text-anchor="middle" font-size="8.5" fill="#aaaaaa" filter="url(#rough2)">d=4</text>

  <path d="M 464 126 L 434 161" stroke="#777" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 418 192 L 396 223" stroke="#777" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 442 192 L 470 223" stroke="#777" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 386 254 L 370 279" stroke="#777" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 478 254 L 510 279" stroke="#777" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="468" cy="112" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="468" y="117" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">4</text>

  <circle cx="430" cy="178" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="430" y="183" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">2</text>

  <circle cx="392" cy="240" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="392" y="245" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">1</text>

  <circle cx="474" cy="240" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="474" y="245" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">1</text>

  <circle cx="366" cy="296" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="366" y="301" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">3</text>

  <circle cx="516" cy="296" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="516" y="301" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">1</text>

  <!-- 底部说明 -->
  <text x="310" y="342" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">新行填满 depth = 3：2 的左右各得一个 1（橙色）</text>
  <text x="310" y="362" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">原 depth = 3 的 3 与 1（绿色）被原封不动推到 depth = 4</text>
  <text x="310" y="394" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">输出：[4,2,null,1,1,3,null,null,1]</text>
</svg>
