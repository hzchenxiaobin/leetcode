<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 432" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="432" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">递归流程：三条出口，一次自顶向下</text>
  <text x="290" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">空指针判定的顺序决定「能否少写 if、能否直接复用子树」</text>

  <rect x="212" y="60" width="156" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="80" text-anchor="middle" font-size="11" fill="#2f3f5c" filter="url(#rough2)">merge(root1, root2)</text>

  <path d="M 290 90 L 290 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="290,106 388,138 290,170 192,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="142" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">root1 为空？</text>

  <path d="M 192 138 L 158 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="131" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="30" y="118" width="126" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="93" y="135" text-anchor="middle" font-size="10.5" fill="#33502a" filter="url(#rough2)">返回 root2</text>
  <text x="93" y="150" text-anchor="middle" font-size="9" fill="#6d8a62" filter="url(#rough2)">（整棵挂上）</text>

  <path d="M 290 170 L 290 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="301" y="182" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="290,188 386,220 290,252 194,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="224" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">root2 为空？</text>

  <path d="M 386 220 L 420 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="403" y="213" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="424" y="200" width="126" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="487" y="217" text-anchor="middle" font-size="10.5" fill="#33502a" filter="url(#rough2)">返回 root1</text>
  <text x="487" y="232" text-anchor="middle" font-size="9" fill="#6d8a62" filter="url(#rough2)">（整棵挂上）</text>

  <path d="M 290 252 L 290 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="301" y="264" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="120" y="270" width="340" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="136" y="290" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">两侧都不空：以 root1 为合并载体</text>
  <text x="136" y="308" font-size="10" fill="#555" filter="url(#rough2)">root1.val += root2.val</text>
  <text x="136" y="324" font-size="10" fill="#555" filter="url(#rough2)">root1.left = merge(root1.left, root2.left)；右子树同理</text>

  <path d="M 290 336 L 290 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="212" y="354" width="156" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="374" text-anchor="middle" font-size="10.5" fill="#2f3f5c" filter="url(#rough2)">return root1</text>

  <text x="290" y="404" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">两棵空树同时为空时，第一条判定即返回 root2 = null，无需额外特判</text>
  <text x="290" y="422" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">每个重叠节点只被访问一次：时间 O(min(m,n))，栈深 O(min(h1,h2))</text>
</svg>
