<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：约数对以 √area 为轴镜像对称</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">W ≤ L 等价于 W ≤ √area；W 越大则 L = area / W 越小，差值 L − W 越窄</text>

  <path d="M 48 208 L 512 208" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 100 L 280 252" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">√area</text>

  <path d="M 76 208 Q 280 132 484 208" stroke="#446688" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 132 208 Q 280 158 428 208" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 214 208 Q 280 184 346 208" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <circle cx="76" cy="208" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="484" cy="208" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="132" cy="208" r="4.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="428" cy="208" r="4.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="214" cy="208" r="4.5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="346" cy="208" r="4.5" fill="#d6a040" filter="url(#rough2)"/>

  <text x="76" y="200" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">W</text>
  <text x="484" y="200" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">L</text>
  <text x="272" y="122" text-anchor="end" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">越向内越窄：L − W → 0</text>

  <rect x="56" y="214" width="216" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="164" y="233" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">候选 W：1 … floor(√area)</text>

  <rect x="288" y="214" width="216" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="396" y="233" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">配对 L = area / W ≥ √area</text>

  <rect x="48" y="258" width="464" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="64" y="277" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">在 W ≤ √area 的约数中取最大的那个 W*</text>
  <text x="64" y="295" font-size="10" fill="#555" filter="url(#rough2)">W 变大 ⇒ L 变小 ⇒ 差值严格收窄，所以最靠近中线的约数对就是最优解</text>

  <rect x="48" y="314" width="464" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="64" y="333" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">算法骨架：从 floor(√area) 开始向下枚举</text>
  <text x="64" y="352" font-size="10" fill="#555" filter="url(#rough2)">第一个满足 area mod w == 0 的 w 即 W*，立即返回 [area / w, w]</text>
</svg>
