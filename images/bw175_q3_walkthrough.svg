<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="580" height="310" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#333">演算：nums = [5,4,7]（101、100、111）</text>

  <text x="36" y="60" font-size="12" fill="#446688">b = 2（bit2）</text>
  <text x="36" y="84" font-size="11" fill="#666">过滤：5, 4, 7 全部保留</text>
  <rect x="230" y="62" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="256" y="80" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="292" y="62" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="318" y="80" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="354" y="62" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="380" y="80" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="430" y="80" font-size="11" fill="#4a7a3a">tails: [5]→[4]→[4,7]，LIS = 2</text>

  <text x="36" y="130" font-size="12" fill="#d6a040">b = 0（bit0）</text>
  <text x="36" y="154" font-size="11" fill="#666">过滤：4 被剔除</text>
  <rect x="230" y="132" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="256" y="150" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="292" y="132" width="52" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="318" y="150" text-anchor="middle" font-size="12" fill="#999">4</text>
  <rect x="354" y="132" width="52" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="380" y="150" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="430" y="150" font-size="11" fill="#4a7a3a">tails: [5]→[5,7]，LIS = 2</text>

  <text x="36" y="200" font-size="12" fill="#b85450">b = 1（bit1）</text>
  <text x="36" y="224" font-size="11" fill="#666">过滤：三个元素都没有 bit1</text>
  <text x="230" y="222" font-size="11" fill="#b85450">空序列 → LIS = 0</text>

  <rect x="40" y="248" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="54" y="272" font-size="11" fill="#333">取三者的最大值：2（[5,7] 的与为 5；[4,7] 的与为 4，都非零）</text>
  <text x="54" y="288" font-size="10" fill="#666">注意 [4,7] 不是原数组的连续段也能取——子序列只要求相对顺序</text>
</svg>
