<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="720" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="360" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：(let x 2 (mult x (let x 3 y 4 (add x y))))</text>

  <rect x="24" y="52" width="90" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="69" y="74" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#rough2)">步骤</text>
  <rect x="114" y="52" width="290" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="259" y="74" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#rough2)">当前求值的表达式</text>
  <rect x="404" y="52" width="196" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="502" y="74" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#rough2)">作用域（内 → 外）</text>
  <rect x="600" y="52" width="96" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="648" y="74" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#rough2)">结果</text>

  <rect x="24" y="86" width="90" height="44" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="69" y="114" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="114" y="86" width="290" height="44" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="114" font-size="12" fill="#333" filter="url(#rough2)">(let x 2 (mult x ...))</text>
  <rect x="404" y="86" width="196" height="44" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416" y="114" font-size="12" fill="#333" filter="url(#rough2)">{ x = 2 }</text>
  <rect x="600" y="86" width="96" height="44" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="648" y="114" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">push</text>

  <rect x="24" y="130" width="90" height="44" rx="6" fill="#f4f7fb" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="69" y="158" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <rect x="114" y="130" width="290" height="44" rx="6" fill="#f4f7fb" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="158" font-size="12" fill="#333" filter="url(#rough2)">(let x 3 y 4 (add x y))</text>
  <rect x="404" y="130" width="196" height="44" rx="6" fill="#f4f7fb" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416" y="158" font-size="12" fill="#333" filter="url(#rough2)">{ x=3, y=4 } 套在外层上</text>
  <rect x="600" y="130" width="96" height="44" rx="6" fill="#f4f7fb" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="648" y="158" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">push</text>

  <rect x="24" y="174" width="90" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="69" y="202" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <rect x="114" y="174" width="290" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="126" y="202" font-size="12" fill="#333" filter="url(#rough2)">(add x y)</text>
  <rect x="404" y="174" width="196" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="416" y="202" font-size="12" fill="#333" filter="url(#rough2)">命中内层：x=3, y=4</text>
  <rect x="600" y="174" width="96" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="648" y="202" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">7</text>

  <rect x="24" y="218" width="90" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="69" y="246" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">4</text>
  <rect x="114" y="218" width="290" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="126" y="246" font-size="12" fill="#333" filter="url(#rough2)">(mult x 7)</text>
  <rect x="404" y="218" width="196" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="416" y="246" font-size="12" fill="#333" filter="url(#rough2)">内层已 pop，命中外层 x=2</text>
  <rect x="600" y="218" width="96" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="648" y="246" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">14</text>

  <rect x="24" y="262" width="90" height="44" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="69" y="290" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">5</text>
  <rect x="114" y="262" width="290" height="44" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="126" y="290" font-size="12" fill="#333" filter="url(#rough2)">整串求值结束</text>
  <rect x="404" y="262" width="196" height="44" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416" y="290" font-size="12" fill="#333" filter="url(#rough2)">全部 pop，栈空</text>
  <rect x="600" y="262" width="96" height="44" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="648" y="290" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 14</text>

  <text x="360" y="340" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">关键在步骤 3 与 4：同一个 x，先读到 3，出了内层又读回 2</text>
  <text x="360" y="362" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">所以变量必须按「作用域链」查找，不能全局覆盖成一个值</text>
</svg>
