<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="680" height="380" fill="#fafafa" filter="url(#rough2)"/>

  <text x="340" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    n = 20：把 ⌊20/b⌋ 相同的 b 合成一块，共 8 块（而非 20 项）
  </text>
  <text x="340" y="54" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">
    块宽 = 该块包含的 b 的个数，块内 ⌊20/b⌋ 恒为 q，整块贡献 (r − l + 1)·q²
  </text>

  <path d="M 230 82 L 314 82" fill="none" stroke="#b85450" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="74" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">l 跳到 r，跳 4 格</text>

  <path d="M 328 82 L 552 82" fill="none" stroke="#b85450" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="74" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">l 跳到 r，跳 10 格</text>

  <rect x="80" y="104" width="24" height="48" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>

  <rect x="104" y="104" width="24" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>

  <rect x="128" y="104" width="24" height="48" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>

  <rect x="152" y="104" width="24" height="48" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <rect x="176" y="104" width="24" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <rect x="200" y="104" width="24" height="48" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <rect x="224" y="104" width="96" height="48" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="272" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">q = 2</text>

  <rect x="320" y="104" width="240" height="48" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">q = 1</text>

  <text x="92" y="176" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">1</text>
  <text x="116" y="176" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">2</text>
  <text x="140" y="176" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">3</text>
  <text x="164" y="176" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">4</text>
  <text x="188" y="176" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">5</text>
  <text x="212" y="176" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">6</text>
  <text x="272" y="176" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">7 … 10</text>
  <text x="440" y="176" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">11 … 20</text>

  <path d="M 80 196 L 560 196" fill="none" stroke="#888" stroke-width="1.3"
        marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="340" y="214" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">
    横轴 b = 1 … 20；块内 q 恒定，所以一次整块结算
  </text>

  <rect x="50" y="238" width="580" height="112" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="72" y="268" font-size="11.5" fill="#333" filter="url(#rough2)">
    取值只有 O(√n) 种：b ≤ √n 时 ⌊n/b⌋ 互不相同；b &gt; √n 时 ⌊n/b⌋ &lt; √n 只剩少数值
  </text>
  <text x="72" y="294" font-size="11.5" fill="#333" filter="url(#rough2)">
    所以块数 ≤ 2√n（n = 2·10⁵ 时约 894 块），单组 O(√n) 就能算完
  </text>
  <text x="72" y="322" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">
    顺序扫 b 也够（Σn ≤ 2·10⁵），但分块更快也更稳
  </text>
  <text x="72" y="344" font-size="11.5" fill="#b85450" filter="url(#rough2)">
    递推式：r = ⌊n / q⌋，下一轮 l = r + 1
  </text>
</svg>
