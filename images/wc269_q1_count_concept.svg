<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">升序排序 = 按值分块，target 块的起点只由 less 决定</text>
  <path d="M 150 40 Q 320 50 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- legend panel -->
  <g filter="url(#sk)"><rect x="470" y="64" width="156" height="136" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="548" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">三色分块</text>
  <g filter="url(#sk)"><rect x="486" y="100" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="506" y="112" font-size="11" fill="#2b4a6e">＜ target · less 个</text>
  <g filter="url(#sk)"><rect x="486" y="130" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="506" y="142" font-size="11" font-weight="bold" fill="#a06a1a">== target · equal 个</text>
  <g filter="url(#sk)"><rect x="486" y="160" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="506" y="172" font-size="11" fill="#2e5e22">＞ target · 不管它</text>

  <!-- original array -->
  <text x="320" y="66" text-anchor="middle" font-size="12" fill="#666">原数组 nums = [1, 2, 5, 2, 3]（target = 2）</text>
  <g filter="url(#sk)">
    <rect x="200" y="76" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="252" y="76" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="304" y="76" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="356" y="76" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="408" y="76" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="224" y="97" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">1</text>
  <text x="276" y="97" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">2</text>
  <text x="328" y="97" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">5</text>
  <text x="380" y="97" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">2</text>
  <text x="432" y="97" text-anchor="middle" font-size="13" fill="#2b4a6e" font-family="monospace">3</text>

  <!-- sort arrow -->
  <path d="M 320 112 L 320 140" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="334" y="130" font-size="11.5" fill="#888">非递减排序 = 按值分块</text>

  <!-- sorted blocks -->
  <g filter="url(#sk)">
    <rect x="200" y="150" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="252" y="150" width="48" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="304" y="150" width="48" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="356" y="150" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="408" y="150" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="224" y="173" text-anchor="middle" font-size="14" fill="#2b4a6e" font-family="monospace">1</text>
  <text x="276" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" font-family="monospace">2</text>
  <text x="328" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" font-family="monospace">2</text>
  <text x="380" y="173" text-anchor="middle" font-size="14" fill="#2e5e22" font-family="monospace">3</text>
  <text x="432" y="173" text-anchor="middle" font-size="14" fill="#2e5e22" font-family="monospace">5</text>

  <!-- indices -->
  <text x="224" y="206" text-anchor="middle" font-size="11" fill="#666" font-family="monospace">0</text>
  <text x="276" y="206" text-anchor="middle" font-size="11" fill="#666" font-family="monospace">1</text>
  <text x="328" y="206" text-anchor="middle" font-size="11" fill="#666" font-family="monospace">2</text>
  <text x="380" y="206" text-anchor="middle" font-size="11" fill="#666" font-family="monospace">3</text>
  <text x="432" y="206" text-anchor="middle" font-size="11" fill="#666" font-family="monospace">4</text>

  <!-- red frame around target block -->
  <g filter="url(#sk)"><rect x="244" y="142" width="116" height="70" rx="8" fill="none" stroke="#b85450" stroke-width="2"/></g>

  <!-- brace labels -->
  <text x="214" y="232" text-anchor="middle" font-size="11.5" fill="#2b4a6e">less = 1（＜2 的都排前面）</text>
  <text x="412" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">equal = 2 → 占下标 [1, 2]</text>

  <!-- answer box -->
  <g filter="url(#sk)"><rect x="170" y="254" width="300" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">答案 = [less, less+equal−1] = [1, 2]</text>

  <!-- bottom note -->
  <g filter="url(#sk)"><rect x="40" y="316" width="560" height="76" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="320" y="344" text-anchor="middle" font-size="12" fill="#7a5415">洞察：小于 / 大于 target 的元素内部怎么排，对答案零影响。</text>
  <text x="320" y="366" text-anchor="middle" font-size="12" fill="#7a5415">target 块的起点 = less、长度 = equal —— 两个计数变量即可定位，无需真的排序。</text>
</svg>
