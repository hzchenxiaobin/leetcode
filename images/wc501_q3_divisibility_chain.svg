<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：值只在集合内流动，沿整除关系下滑</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#888">nums = [4, 2, 8, 3]（示例 2），S = {2, 3, 4, 8}，d(x) = min{ y ∈ S : y | x }</text>

  <!-- 原始数组行 -->
  <text x="60" y="112" text-anchor="start" font-size="11" font-weight="bold" fill="#555">原始数组</text>
  <g filter="url(#sk)"><rect x="122" y="84" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="150" y="110" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b6e9e">4</text>
  <text x="150" y="124" text-anchor="middle" font-size="8" fill="#999">i=0</text>
  <g filter="url(#sk)"><rect x="257" y="84" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="285" y="110" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="285" y="124" text-anchor="middle" font-size="8" fill="#999">i=1</text>
  <g filter="url(#sk)"><rect x="392" y="84" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="420" y="110" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b6e9e">8</text>
  <text x="420" y="124" text-anchor="middle" font-size="8" fill="#999">i=2</text>
  <g filter="url(#sk)"><rect x="527" y="84" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="555" y="110" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="555" y="124" text-anchor="middle" font-size="8" fill="#999">i=3</text>

  <!-- 列 1：4 -> 2 -->
  <path d="M 150 134 L 150 246" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="162" y="176" text-anchor="start" font-size="10.5" fill="#666">2 | 4 ✓</text>
  <text x="162" y="194" text-anchor="start" font-size="12" font-weight="bold" fill="#2b6e9e">d(4) = 2</text>

  <!-- 列 2：2 不动 -->
  <path d="M 285 134 L 285 246" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 5" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <text x="297" y="176" text-anchor="start" font-size="10.5" fill="#666">没有更小的因数</text>
  <text x="297" y="194" text-anchor="start" font-size="12" font-weight="bold" fill="#2e6e2e">d(2) = 2 不动点</text>

  <!-- 列 3：8 -> 2 直达 + 绕路对比 -->
  <path d="M 420 134 L 420 246" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ab)"/>
  <text x="408" y="176" text-anchor="end" font-size="10.5" fill="#666">2 | 8 ✓ 一步直达</text>
  <text x="408" y="194" text-anchor="end" font-size="12" font-weight="bold" fill="#2b6e9e">d(8) = 2</text>
  <!-- 灰色绕路：8 -> 4 -> 2 -->
  <path d="M 434 148 Q 462 162 470 178" stroke="#999999" stroke-width="1.3" stroke-dasharray="4 4" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <g filter="url(#sk)"><rect x="456" y="182" width="34" height="28" rx="5" fill="#f0f0ec" stroke="#aaa" stroke-width="1.2"/></g>
  <text x="473" y="201" text-anchor="middle" font-size="14" font-weight="bold" fill="#999">4</text>
  <path d="M 473 210 Q 460 232 432 244" stroke="#999999" stroke-width="1.3" stroke-dasharray="4 4" fill="none" filter="url(#sk)" marker-end="url(#ar)"/>
  <text x="513" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">✗</text>
  <text x="516" y="216" text-anchor="middle" font-size="9" fill="#888">中转不必</text>
  <text x="516" y="228" text-anchor="middle" font-size="9" fill="#888">要（传递）</text>

  <!-- 列 4：3 不动 -->
  <path d="M 555 134 L 555 246" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 5" fill="none" filter="url(#sk)" marker-end="url(#ag)"/>
  <text x="567" y="176" text-anchor="start" font-size="10.5" fill="#666">S 中无</text>
  <text x="567" y="194" text-anchor="start" font-size="12" font-weight="bold" fill="#2e6e2e">d(3) = 3</text>

  <!-- 终态行 -->
  <text x="60" y="272" text-anchor="start" font-size="11" font-weight="bold" fill="#555">终态</text>
  <g filter="url(#sk)"><rect x="122" y="248" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="150" y="274" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="150" y="288" text-anchor="middle" font-size="8" fill="#999">i=0</text>
  <g filter="url(#sk)"><rect x="257" y="248" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="285" y="274" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="285" y="288" text-anchor="middle" font-size="8" fill="#999">i=1</text>
  <g filter="url(#sk)"><rect x="392" y="248" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="420" y="274" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="420" y="288" text-anchor="middle" font-size="8" fill="#999">i=2</text>
  <g filter="url(#sk)"><rect x="527" y="248" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="555" y="274" text-anchor="middle" font-size="19" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="555" y="288" text-anchor="middle" font-size="8" fill="#999">i=3</text>

  <!-- 中部结论 -->
  <text x="320" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">每个元素独立滑到 d(x)，互不干扰：ans = Σ d(x) = 2+2+2+3 = 9</text>

  <!-- 底部要点框 -->
  <g filter="url(#sk)">
    <rect x="58" y="334" width="524" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">不变量：任意时刻 nums[i] ∈ S 且 nums[i] | 原始值</text>
  <text x="320" y="378" text-anchor="middle" font-size="11" fill="#444">值域封闭（操作只复制不造新值）+ 整除传递（z|y 且 y|x ⇒ z|x）</text>

  <!-- 底部两行补充 -->
  <text x="320" y="418" text-anchor="middle" font-size="11" fill="#666">观察三：操作不动源位置 nums[b] —— 目标值的持有者自己是不动点，永远可作「源」</text>
  <text x="320" y="440" text-anchor="middle" font-size="10.5" fill="#888">所以不必关心操作顺序：想替换谁，直接换成 d(x) 即可，一趟扫描出全部答案</text>
</svg>
