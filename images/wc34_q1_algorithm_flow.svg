<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一遍扫描，只保留两个最小值</text>
  <text x="320" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">时间 O(|ops|)，额外空间 O(1)，全程不碰矩阵</text>
  <rect x="200" y="62" width="240" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="11" fill="#2f4a63" filter="url(#rough2)">输入 m、n、ops</text>
  <path d="M 320 96 L 320 114" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="118" width="240" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="140" text-anchor="middle" font-size="11" fill="#2f5a24" filter="url(#rough2)">ra ← m，rb ← n</text>
  <path d="M 320 152 L 320 162" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="320,164 460,200 320,236 180,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="320" y="205" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">还有下一个 op = [a,b] ？</text>
  <path d="M 320 236 L 320 250" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="248" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="200" y="254" width="240" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="273" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">ra ← min(ra, a)</text>
  <text x="320" y="290" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">rb ← min(rb, b)</text>
  <path d="M 440 276 L 540 276 L 540 200 L 466 200" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="242" font-size="10" fill="#666" filter="url(#rough2)">取下一个</text>
  <path d="M 180 200 L 110 200 L 110 352 L 162 352" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="192" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="170" y="332" width="300" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="320" y="357" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">返回 ra × rb</text>
  <text x="320" y="402" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">ops 为空时循环体一次都不执行 → 直接返回 m × n</text>
</svg>
