<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.25"/>
    </filter>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：s = 01001101，Z = 4，j = 1，最优切点 a = 4</text>
  <path d="M 148 40 Q 390 47 632 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="390" y="62" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">bal(a) = 前缀中（1 的个数 − 0 的个数），代价 f(a) = Z + bal(a) = 4 + bal(a)</text>

  <!-- 表头 -->
  <text x="110" y="92" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">切点 a</text>
  <text x="290" y="92" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">前缀 s[1..a]</text>
  <text x="455" y="92" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">bal(a)</text>
  <text x="560" y="92" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">f(a)</text>
  <text x="660" y="92" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">说明</text>
  <path d="M 62 102 L 718 102" stroke="#446688" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- a = 1 -->
  <text x="110" y="128" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="290" y="128" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="455" y="128" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">−1</text>
  <text x="560" y="128" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="660" y="128" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">右段留 3 个 0</text>

  <!-- a = 2 -->
  <text x="110" y="156" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="290" y="156" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">01</text>
  <text x="455" y="156" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="560" y="156" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="660" y="156" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">左段多清一个 1</text>

  <!-- a = 3 -->
  <text x="110" y="184" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="290" y="184" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">010</text>
  <text x="455" y="184" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">−1</text>
  <text x="560" y="184" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="660" y="184" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">3 个 0 待补</text>

  <!-- a = 4 -->
  <rect x="70" y="196" width="648" height="30" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#33582a" filter="url(#rough2)">4</text>
  <text x="290" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#33582a" filter="url(#rough2)">0100</text>
  <text x="455" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#33582a" filter="url(#rough2)">−2</text>
  <text x="560" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">2</text>
  <text x="660" y="216" text-anchor="middle" font-size="10.5" fill="#33582a" filter="url(#rough2)">★ 最优切点</text>

  <!-- a = 5 -->
  <text x="110" y="244" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="290" y="244" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">01001</text>
  <text x="455" y="244" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">−1</text>
  <text x="560" y="244" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="660" y="244" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">右边只剩 1 个 0</text>

  <!-- a = 6 -->
  <text x="110" y="272" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">6</text>
  <text x="290" y="272" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">010011</text>
  <text x="455" y="272" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="560" y="272" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="660" y="272" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">清两个 1</text>

  <!-- a = 7 -->
  <text x="110" y="300" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">7</text>
  <text x="290" y="300" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">0100110</text>
  <text x="455" y="300" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">−1</text>
  <text x="560" y="300" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="660" y="300" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">清三个 1</text>

  <!-- a = 8 -->
  <text x="110" y="328" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">8</text>
  <text x="290" y="328" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">01001101</text>
  <text x="455" y="328" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="560" y="328" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="660" y="328" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">全变 0，清四个 1</text>

  <!-- 脚注 -->
  <rect x="40" y="346" width="700" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="60" y="368" font-size="11.5" fill="#8a6015" filter="url(#rough2)">a = 4 的做法：AND 位置 2 得 00001101，再 OR 位置 7 得 00001111，共 2 步。</text>
  <text x="60" y="390" font-size="11.5" fill="#8a6015" filter="url(#rough2)">a = 2 与 a = 8 都是 4 步 —— 切点偏左要清 1，偏右要补 0，两头都不划算。</text>
  <text x="60" y="412" font-size="11.5" fill="#a14340" filter="url(#rough2)">若串以 1 开头（如 1000），首字符锁死 ⇒ 只能全 1，答案是 0 的个数 3。</text>
</svg>
