<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 386"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="386" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">递归构建：n = 5 → [1,5,3,2,4]</text>
  <rect x="270" y="52" width="120" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="76.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">B(5)</text>
  <rect x="120" y="130" width="120" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180.0" y="153.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">B(3) → 奇数</text>
  <rect x="400" y="130" width="120" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460.0" y="153.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">B(2) → 偶数</text>
  <path d="M 310 94 L 200 128" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 360 94 L 440 128" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="208" width="110" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="230.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">B(2) → [1,2]</text>
  <rect x="190" y="208" width="110" height="38" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245.0" y="230.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">B(1) → [1]</text>
  <path d="M 160 172 L 120 206" fill="none" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 200 172 L 240 206" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="120" y="272" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">×2−1 → [1,3]</text>
  <text x="245" y="272" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">×2−1 → [2]</text>
  <text x="460" y="172" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">×2 → [2,4]</text>
  <rect x="60" y="292" width="540" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="315.9" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">拼接：[1,3] + [2] → [1,3,2]（B(3)），再拼 [2,4] → [1,5,3,2,4]</text>
  <text x="330" y="366" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">B(3)=[1,3,2] 的奇数部分是 [1,3]，偶数部分是 [2]，映射后拼成 [1,5,3,2,4]</text>
</svg>
