<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666666"/>
    </marker>
  </defs>

  <rect x="-10" y="-10" width="660" height="350" fill="#fafafa" filter="url(#rough2)"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">核心观察：字符差异 = 逐位代价，子串可转 = 区间和 ≤ 预算</text>
  <text x="320" y="50" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">cost[i] = |s[i] − t[i]|，题目求最长的「代价和不超过 maxCost」的连续区间</text>

  <!-- 下标 -->
  <text x="124" y="80" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">i = 0</text>
  <text x="188" y="80" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">i = 1</text>
  <text x="252" y="80" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">i = 2</text>
  <text x="316" y="80" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">i = 3</text>

  <!-- s 行 -->
  <text x="74" y="112" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="100" y="90" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="112" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">a</text>
  <rect x="164" y="90" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="112" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">b</text>
  <rect x="228" y="90" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="112" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">c</text>
  <rect x="292" y="90" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="112" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">d</text>

  <!-- t 行 -->
  <text x="74" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">t</text>
  <rect x="100" y="136" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="158" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">b</text>
  <rect x="164" y="136" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="158" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">c</text>
  <rect x="228" y="136" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="158" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">d</text>
  <rect x="292" y="136" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="158" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">f</text>

  <!-- t → cost 的箭头 -->
  <path d="M 124 172 L 124 192" stroke="#666666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 188 172 L 188 192" stroke="#666666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 252 172 L 252 192" stroke="#666666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 316 172 L 316 192" stroke="#666666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- cost 行 -->
  <text x="70" y="218" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">cost</text>
  <rect x="100" y="196" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="219" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">1</text>
  <rect x="164" y="196" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="219" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">1</text>
  <rect x="228" y="196" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="219" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">1</text>
  <rect x="292" y="196" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="316" y="219" text-anchor="middle" font-size="14" fill="#8a3a36" filter="url(#rough2)">2</text>

  <!-- 窗口框 -->
  <rect x="94" y="190" width="188" height="46" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <text x="188" y="254" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">窗口代价 1 + 1 + 1 = 3 ≤ maxCost = 3 → 长度 3</text>

  <!-- 右侧要点 -->
  <rect x="360" y="70" width="250" height="204" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="376" y="94" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">① 把字符差异摊平成代价</text>
  <text x="376" y="112" font-size="10" fill="#555555" filter="url(#rough2)">cost[i] = |s[i] − t[i]|（ASCII 差）</text>
  <text x="376" y="138" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 子串整体可转 ⇔ 区间和</text>
  <text x="376" y="156" font-size="10" fill="#555555" filter="url(#rough2)">cost[l..r] 之和 ≤ maxCost</text>
  <text x="376" y="182" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">③ cost ≥ 0 ⇒ 区间和单调</text>
  <text x="376" y="200" font-size="10" fill="#555555" filter="url(#rough2)">左端右移只会让和变小</text>
  <text x="376" y="226" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">于是「右端扩张、超预算收缩左端」</text>
  <text x="376" y="246" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">的双指针滑窗成立，均摊 O(1)</text>

  <text x="320" y="310" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">示例：s = "abcd"、t = "bcdf"、maxCost = 3，前 3 个位置代价 1+1+1 恰好用满预算 → 答案 3</text>
</svg>
