<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 一次扫描演算：ans 峰加谷减</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">i 从 1 扫到 n−2，每个内部下标只和左右邻居做严格比较</text>

  <rect x="40" y="64" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">下标 i</text>
  <text x="185" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">（左, 中, 右）</text>
  <text x="335" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">判定（严格不等号）</text>
  <text x="478" y="82" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">ans 累计</text>

  <rect x="40" y="92" width="480" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="185" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1, 5, 2)</text>
  <text x="335" y="112" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">峰：5&gt;1 且 5&gt;2 → +5</text>
  <text x="478" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="40" y="122" width="480" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="185" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(5, 2, 4)</text>
  <text x="335" y="142" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">谷：2&lt;5 且 2&lt;4 → −2</text>
  <text x="478" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="40" y="152" width="480" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="185" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2, 4, 1)</text>
  <text x="335" y="172" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">峰：4&gt;2 且 4&gt;1 → +4</text>
  <text x="478" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">7</text>

  <rect x="40" y="182" width="480" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="85" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="185" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(4, 1, 3)</text>
  <text x="335" y="202" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">谷：1&lt;4 且 1&lt;3 → −1</text>
  <text x="478" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="40" y="212" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="185" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1, 3, 0)</text>
  <text x="335" y="232" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">峰：3&gt;1 且 3&gt;0 → +3</text>
  <text x="478" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9 ★</text>

  <g stroke="#dddddd" stroke-width="1">
    <line x1="130" y1="64" x2="130" y2="242" filter="url(#rough2)"/>
    <line x1="240" y1="64" x2="240" y2="242" filter="url(#rough2)"/>
    <line x1="435" y1="64" x2="435" y2="242" filter="url(#rough2)"/>
  </g>

  <rect x="40" y="258" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="280" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">峰值和 (5+4+3)=12，谷值和 (2+1)=3，差 = 12 − 3 = 9，扫完即答案</text>

  <rect x="40" y="304" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="56" y="326" font-size="10.5" fill="#333" filter="url(#rough2)">两类都不是的内部点不动 ans —— 判谷必须用两个独立的严格小于，不能 else 兜底</text>

  <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个下标至多 4 次比较：时间 O(n)，不存峰谷列表：空间 O(1)</text>
</svg>
