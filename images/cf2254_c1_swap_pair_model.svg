<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="680" height="430" fill="#fafafa" filter="url(#rough2)"/>

  <text x="340" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">一次操作 = 交换距离 2 的两个不同位</text>
  <text x="340" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">枚举长度 3 的窗口：只有两端不同才能操作，而操作结果恰好是交换两端</text>

  <!-- 第一组：001 -> 100 -->
  <rect x="100" y="76" width="48" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="124" y="105" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">0</text>
  <rect x="154" y="76" width="48" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="178" y="105" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">0</text>
  <rect x="208" y="76" width="48" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="232" y="105" text-anchor="middle" font-size="20" fill="#b85450" filter="url(#rough2)">1</text>

  <path d="M 264 98 C 282 84, 300 84, 318 98" fill="none" stroke="#b85450" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="291" y="76" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">交换两端</text>

  <rect x="330" y="76" width="48" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="354" y="105" text-anchor="middle" font-size="20" fill="#b85450" filter="url(#rough2)">1</text>
  <rect x="384" y="76" width="48" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="408" y="105" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">0</text>
  <rect x="438" y="76" width="48" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="462" y="105" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">0</text>
  <text x="512" y="105" font-size="13" fill="#888" filter="url(#rough2)">001 ⇄ 100</text>

  <!-- 第二组：011 -> 110 -->
  <rect x="100" y="150" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="124" y="179" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">0</text>
  <rect x="154" y="150" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="178" y="179" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">1</text>
  <rect x="208" y="150" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="232" y="179" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 264 172 C 282 158, 300 158, 318 172" fill="none" stroke="#4a7a3a" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="330" y="150" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="354" y="179" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">1</text>
  <rect x="384" y="150" width="48" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="408" y="179" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">1</text>
  <rect x="438" y="150" width="48" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="462" y="179" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">0</text>
  <text x="512" y="179" font-size="13" fill="#888" filter="url(#rough2)">011 ⇄ 110</text>

  <rect x="70" y="222" width="540" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="247" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">⇒ 操作 = 交换 a[i] 与 a[i+2]（仅当这两位不同）</text>

  <!-- 双轨 -->
  <text x="340" y="292" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">于是每个 1 只能在自己的「奇偶类」里走，相邻两格相距 2</text>

  <text x="22" y="322" font-size="12" fill="#446688" filter="url(#rough2)">偶数类 c₀</text>
  <line x1="100" y1="318" x2="562" y2="318" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <circle cx="120" cy="318" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="323" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="230" cy="318" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="323" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="340" cy="318" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="323" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="450" cy="318" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="323" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="480" y="323" font-size="16" fill="#aaa" filter="url(#rough2)">⋯</text>
  <path d="M 138 318 L 208 318" fill="none" stroke="#446688" stroke-width="1.6"
        marker-start="url(#arrb)" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 248 318 L 318 318" fill="none" stroke="#446688" stroke-width="1.6"
        marker-start="url(#arrb)" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 358 318 L 428 318" fill="none" stroke="#446688" stroke-width="1.6"
        marker-start="url(#arrb)" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <text x="22" y="386" font-size="12" fill="#4a7a3a" filter="url(#rough2)">奇数类 c₁</text>
  <line x1="100" y1="382" x2="562" y2="382" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <circle cx="175" cy="382" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="387" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="285" cy="382" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="387" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="395" cy="382" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="395" y="387" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <circle cx="505" cy="382" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="505" y="387" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="530" y="387" font-size="16" fill="#aaa" filter="url(#rough2)">⋯</text>
  <path d="M 193 382 L 263 382" fill="none" stroke="#4a7a3a" stroke-width="1.6"
        marker-start="url(#arrb)" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 303 382 L 373 382" fill="none" stroke="#4a7a3a" stroke-width="1.6"
        marker-start="url(#arrb)" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 413 382 L 483 382" fill="none" stroke="#4a7a3a" stroke-width="1.6"
        marker-start="url(#arrb)" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <text x="340" y="418" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">不变量：c₀ = 偶数位中 1 的个数，c₁ = 奇数位中 1 的个数</text>
</svg>
