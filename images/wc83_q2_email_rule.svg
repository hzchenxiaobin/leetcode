<svg xmlns="http://www.w3.org/2000/svg" width="620" height="380" viewBox="0 0 620 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="25" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="380" fill="#fafafa"/>
  <text x="310.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">邮箱遮蔽：名字留首尾，域名只转小写</text>
  <path d="M 160.0 44 Q 310.0 54 460.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="120" y="84" width="380" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="310" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">LeetCode@LeetCode.com</text>
  <path d="M 230 118 Q 208.5 137.0 195 148" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <path d="M 390 118 Q 411.5 129.0 425 148" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="80" y="150" width="220" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="190" y="175" text-anchor="middle" font-size="12" fill="#2b4a6e" filter="url(#rough2)">name = "LeetCode"</text>
  <g filter="url(#rough2)"><rect x="330" y="150" width="220" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="440" y="175" text-anchor="middle" font-size="12" fill="#2e5e22" filter="url(#rough2)">domain = "LeetCode.com"</text>
  <path d="M 190 190 Q 190.0 204.0 190 218" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <path d="M 440 190 Q 440.0 204.0 440 218" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="80" y="220" width="220" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="190" y="240" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">首 l + 5 个 * + 尾 e</text>
  <text x="190" y="257" text-anchor="middle" font-size="10.5" fill="#2b4a6e" filter="url(#rough2)">不论名字多短，中间恒为 *****</text>
  <g filter="url(#rough2)"><rect x="330" y="220" width="220" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="440" y="240" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e22" filter="url(#rough2)">整体转小写</text>
  <text x="440" y="257" text-anchor="middle" font-size="11" fill="#2e5e22" filter="url(#rough2)">leetcode.com</text>
  <path d="M 300 266 Q 316.0 273.0 320 292" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough)"/>
  <g filter="url(#rough2)"><rect x="150" y="296" width="320" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="310" y="322" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#rough2)">l*****e@leetcode.com</text>
  <text x="490" y="300" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">← 结果</text>
  </svg>