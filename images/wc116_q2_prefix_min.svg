<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 284"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="284" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">只有「刷新前缀最小值」的位置才值得当左端点</text>
  <rect x="40" y="76" width="70" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="75" y="105" text-anchor="middle" font-size="16" fill="#33475b" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="75" y="138" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">下标 0</text>
  <text x="75" y="62" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">候选</text>
  <rect x="124" y="76" width="70" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="159" y="105" text-anchor="middle" font-size="16" fill="#33475b" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="159" y="138" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">下标 1</text>
  <text x="159" y="62" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">候选</text>
  <rect x="208" y="76" width="70" height="46" rx="5" fill="#f2f2f2" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="243" y="105" text-anchor="middle" font-size="16" fill="#999999" filter="url(#rough2)">8</text>
  <text x="243" y="138" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">下标 2</text>
  <text x="243" y="62" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">淘汰</text>
  <rect x="292" y="76" width="70" height="46" rx="5" fill="#f2f2f2" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="327" y="105" text-anchor="middle" font-size="16" fill="#999999" filter="url(#rough2)">2</text>
  <text x="327" y="138" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">下标 3</text>
  <text x="327" y="62" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">淘汰</text>
  <rect x="376" y="76" width="70" height="46" rx="5" fill="#f2f2f2" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="411" y="105" text-anchor="middle" font-size="16" fill="#999999" filter="url(#rough2)">1</text>
  <text x="411" y="138" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">下标 4</text>
  <text x="411" y="62" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">淘汰</text>
  <rect x="460" y="76" width="70" height="46" rx="5" fill="#f2f2f2" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="495" y="105" text-anchor="middle" font-size="16" fill="#999999" filter="url(#rough2)">5</text>
  <text x="495" y="138" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">下标 5</text>
  <text x="495" y="62" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">淘汰</text>
  <rect x="40" y="160" width="500" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="181" text-anchor="middle" font-size="11.5" fill="#33475b" filter="url(#rough2)">存在 j &lt; i 且 A[j] ≤ A[i] 时，(i,k) 不如 (j,k) 宽</text>
  <text x="290" y="200" text-anchor="middle" font-size="11.5" fill="#33475b" filter="url(#rough2)">⇒ 左端点只需取严格前缀最小值（单调递减栈）</text>
  <rect x="40" y="224" width="500" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="251" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">示例：[6,0,8,2,1,5] 的候选下标只有 {0,1}</text>
</svg>
