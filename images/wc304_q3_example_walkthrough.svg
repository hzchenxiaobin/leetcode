<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：edges = [1,2,0,1]，node1 = 1，node2 = 3（含环）</text>

  <g filter="url(#rough2)">
    <ellipse cx="150" cy="110" rx="23" ry="21" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <ellipse cx="55" cy="155" rx="21" ry="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <ellipse cx="235" cy="170" rx="21" ry="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <ellipse cx="150" cy="230" rx="21" ry="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="150" y="115" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="55" y="160" text-anchor="middle" font-size="13" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="235" y="175" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="150" y="235" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="150" y="72" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">node1 起点 · 合流点（答案）</text>
  <text x="55" y="192" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">node2 起点</text>
  <text x="245" y="212" text-anchor="middle" font-size="10.5" fill="#a07818" font-weight="bold" filter="url(#rough2)">共享尾巴（环 1→2→0→1）</text>

  <path d="M 74 145 L 126 122" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 170 122 L 217 153" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 220 184 L 172 213" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 142 212 L 139 135" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="315" y="70" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="355" y="70" width="65" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="420" y="70" width="65" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="485" y="70" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>

    <rect x="315" y="102" width="40" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <rect x="355" y="102" width="65" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <rect x="420" y="102" width="65" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <rect x="485" y="102" width="50" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>

    <rect x="315" y="134" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="355" y="134" width="65" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="420" y="134" width="65" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>
    <rect x="485" y="134" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4"/>

    <rect x="315" y="168" width="40" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <rect x="355" y="168" width="65" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <rect x="420" y="168" width="65" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <rect x="485" y="168" width="50" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>

    <rect x="315" y="200" width="40" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <rect x="355" y="200" width="65" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <rect x="420" y="200" width="65" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
    <rect x="485" y="200" width="50" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" rx="4"/>
  </g>
  <text x="335" y="90" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="387" y="90" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dist₁</text>
  <text x="452" y="90" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dist₂</text>
  <text x="510" y="90" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">max</text>

  <text x="335" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="387" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="452" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="510" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <text x="335" y="156" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="387" y="156" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="452" y="156" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="510" y="156" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 ←</text>

  <text x="335" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="387" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="452" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="510" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <text x="335" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="387" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <text x="452" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="510" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>

  <text x="425" y="254" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">max 沿共享尾巴 1→2→0 依次为 1、2、3，严格递增</text>

  <rect x="40" y="288" width="480" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="11.5" fill="#2f5a24" font-weight="bold" filter="url(#rough2)">两趟扫描自动处理环：走回已标记节点即停，首次步数就是最短距离</text>

  <rect x="40" y="338" width="480" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">答案 = 合流点 1（max = 1）；候选链上无平局，最小编号规则自动满足</text>
</svg>
