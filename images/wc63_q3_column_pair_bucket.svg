  <text x="110" y="274" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">r0、r2、r4 ⇒ m = 3</text>
  <rect x="204" y="68" width="296" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="352" y="90" text-anchor="middle" font-size="13" fill="#2a4660" filter="url(#rough2)">固定一对列 (j, k)</text>
