<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="396" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：排序子串 = 一连串「相邻逆序对交换」</text>

  <text x="26" y="56" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 一次排序 = 若干步「冒泡」</text>

  <rect x="26" y="64" width="90" height="40" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <rect x="31" y="72" width="24" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="43" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="59" y="72" width="24" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="87" y="72" width="24" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="71" y="118" text-anchor="middle" font-size="10.5" fill="#b07818" filter="url(#rough2)">排序 [531]</text>

  <path d="M 120 85 L 144 85" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="133" y="104" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">换(5,3)</text>

  <rect x="151" y="72" width="24" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="179" y="72" width="24" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="207" y="72" width="24" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 235 85 L 263 85" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="251" y="104" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">换(5,1)</text>

  <rect x="271" y="72" width="24" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="299" y="72" width="24" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="311" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="327" y="72" width="24" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="339" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <path d="M 355 85 L 383 85" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="371" y="104" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">换(3,1)</text>

  <rect x="386" y="67" width="90" height="36" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <rect x="391" y="72" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="403" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="419" y="72" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="431" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="447" y="72" width="24" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="459" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="431" y="118" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">结果已有序</text>

  <text x="260" y="140" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">任意子串的排序，都能拆成子串内若干次「左大右小」的相邻交换</text>

  <text x="26" y="168" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 谁能穿过谁</text>

  <rect x="30" y="180" width="225" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="142" y="202" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">小的可以向左穿大的（3 穿过 8）</text>
  <rect x="58" y="214" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="92" y="214" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <path d="M 105 210 C 116 186, 60 186, 71 208" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 126 227 L 146 227" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="152" y="214" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="186" y="214" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="142" y="270" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 允许：(8,3) 是逆序对，3 &lt; 8</text>

  <rect x="265" y="180" width="225" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="377" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">大的不能向左穿小的（8 被挡）</text>
  <rect x="293" y="214" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="327" y="214" width="26" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="232" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <path d="M 340 210 C 351 186, 295 186, 306 208" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="323" y="182" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="377" y="270" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 禁止：8 永远留在 3 的右边</text>

  <rect x="36" y="312" width="448" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">不变量：数字 d 只能向左穿过 &gt; d 的数字</text>
  <text x="260" y="356" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">一旦 ≤ d 的数字出现在 d 左边，d 永远无法越过它</text>
  <text x="260" y="374" text-anchor="middle" font-size="11" fill="#b07818" filter="url(#rough2)">→ 判定 t 的每个字符：最左未用 d 的左边，有没有未用的更小数字？</text>
</svg>
