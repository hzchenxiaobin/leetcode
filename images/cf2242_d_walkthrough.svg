<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="500" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三组样例走查：先判末位残量，再数点链</text>
  <path d="M 164 46 Q 360 52 556 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="34" y="62" width="652" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="81"  y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例</text>
  <text x="215" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">Pa[0..n]</text>
  <text x="387" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">Pb[0..m]</text>
  <text x="549" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">点链 p₁..p_k</text>
  <text x="663" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案</text>

  <!-- 样例 1 -->
  <rect x="34" y="96" width="652" height="82" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="122" font-size="12.5" fill="#333" filter="url(#rough2)">a = 5147</text>
  <text x="52" y="144" font-size="12.5" fill="#333" filter="url(#rough2)">b = 44441</text>
  <text x="140" y="134" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0 5 6 0 7</text>
  <text x="316" y="134" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0 4 8 2 6 7</text>
  <text x="478" y="122" font-size="12" fill="#8a6015" filter="url(#rough2)">(2,4) (4,5)</text>
  <text x="478" y="144" font-size="12" fill="#8a6015" filter="url(#rough2)">= 2 个点 ⇒ 2 块</text>
  <text x="663" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#a14340" filter="url(#rough2)">2</text>

  <!-- 样例 2 -->
  <rect x="34" y="178" width="652" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="204" font-size="12.5" fill="#333" filter="url(#rough2)">a = 2194</text>
  <text x="52" y="226" font-size="12.5" fill="#333" filter="url(#rough2)">b = 5602</text>
  <text x="140" y="214" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0 2 3 2 6</text>
  <text x="316" y="214" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0 5 1 1 3</text>
  <text x="478" y="204" font-size="12" fill="#a14340" filter="url(#rough2)">末位 6 ≠ 3，无链</text>
  <text x="478" y="226" font-size="12" fill="#a14340" filter="url(#rough2)">怎么合并都不同</text>
  <text x="663" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#a14340" filter="url(#rough2)">−1</text>

  <!-- 样例 3 -->
  <rect x="34" y="252" width="652" height="94" fill="#ffffff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="278" font-size="12.5" fill="#333" filter="url(#rough2)">a = 123450</text>
  <text x="52" y="300" font-size="12.5" fill="#333" filter="url(#rough2)">b = 012345</text>
  <text x="140" y="288" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0 1 3 6 0 5 5</text>
  <text x="316" y="288" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0 0 1 3 6 0 5</text>
  <text x="478" y="278" font-size="12" fill="#8a6015" filter="url(#rough2)">(1,2) (2,3) (3,4)</text>
  <text x="478" y="298" font-size="12" fill="#8a6015" filter="url(#rough2)">(4,5) (6,6)</text>
  <text x="478" y="320" font-size="12" fill="#8a6015" filter="url(#rough2)">= 5 个点 ⇒ 5 块</text>
  <text x="663" y="304" text-anchor="middle" font-size="18" font-weight="bold" fill="#a14340" filter="url(#rough2)">5</text>

  <!-- 注释 -->
  <rect x="34" y="362" width="652" height="122" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="388" font-size="12.5" fill="#8a6015" filter="url(#rough2)">样例 1：α = [5,6,0]，β = [4,8,2,6]，LCS = 1（只剩公共残量 6）⇒ 1 + 1 = 2</text>
  <text x="52" y="414" font-size="12.5" fill="#8a6015" filter="url(#rough2)">样例 3：α = [1,3,6,0,5]，β = [0,1,3,6,0]，LCS = 4 ⇒ 1 + 4 = 5</text>
  <text x="52" y="440" font-size="12.5" fill="#8a6015" filter="url(#rough2)">样例 1 的划分：a：51 | 47 → 6 | 1；b：4444 | 1 → 6 | 1</text>
  <text x="52" y="466" font-size="12.5" fill="#8a6015" filter="url(#rough2)">样例 3 的划分：a：1|2|3|4|50 → 1 2 3 4 5；b：01|2|3|4|5 → 1 2 3 4 5</text>
</svg>
