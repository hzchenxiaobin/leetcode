<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">BFS：在 ≤512 个状态上求无权最短路</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个状态是一次异或的结果，边走一步 = 反转一个格子，答案 = 起点到全零状态的距离</text>

  <rect x="120" y="56" width="320" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">编码 start；dist[0 .. 2^N−1] 全部置 −1，dist[start] = 0</text>

  <path d="M 280 94 L 280 106" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="110" width="320" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">弹出队首 s（dist[s] 已是该状态的最短距离）</text>

  <path d="M 280 148 L 280 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,164 390,197 280,230 170,197" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">s == 0 ?</text>

  <path d="M 390 197 L 424 197" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="190" font-size="9" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="428" y="175" width="114" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="485" y="194" text-anchor="middle" font-size="10.5" fill="#2f6b4f" font-weight="bold" filter="url(#rough2)">return dist[s]</text>
  <text x="485" y="210" text-anchor="middle" font-size="8.5" fill="#6b8f5e" filter="url(#rough2)">即最少反转次数</text>

  <path d="M 280 230 L 280 242" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="240" font-size="9" fill="#8a6a20" filter="url(#rough2)">否</text>

  <rect x="90" y="246" width="380" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="264" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">for k in 0..N−1：t = s XOR mask[k]（共 N 条出边）</text>
  <text x="280" y="282" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">若 dist[t] == −1：dist[t] = dist[s] + 1，把 t 入队</text>

  <path d="M 280 292 L 280 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,306 390,338 280,370 170,338" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="343" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">队列空 ?</text>

  <path d="M 390 338 L 424 338" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="331" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="428" y="316" width="114" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="485" y="335" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">return −1</text>
  <text x="485" y="351" text-anchor="middle" font-size="8.5" fill="#a8605c" filter="url(#rough2)">0 不在连通分量</text>

  <path d="M 170 338 L 56 338 L 56 129 L 116 129" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="330" font-size="9" fill="#8a6a20" filter="url(#rough2)">否，继续</text>

  <text x="280" y="398" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">状态数 ≤ 512、每状态 ≤ 9 条出边 ⇒ 至多 4608 次转移，轻松通过</text>
</svg>
