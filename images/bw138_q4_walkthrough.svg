<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：power = 4，d = [1,2,3,4]，h = [4,5,6,8]</text>

  <g filter="url(#rough2)" font-size="11" fill="#555">
    <text x="40" y="66" font-weight="bold" fill="#444">敌人</text>
    <text x="110" y="66" font-weight="bold" fill="#444">damage</text>
    <text x="196" y="66" font-weight="bold" fill="#444">health</text>
    <text x="282" y="66" font-weight="bold" fill="#444">t = ceil(h/p)</text>
    <text x="394" y="66" font-weight="bold" fill="#444">d / t</text>
  </g>
  <path d="M 34 76 L 526 76" stroke="#bbb" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11">
    <text x="40" y="102" fill="#555">0</text>
    <text x="110" y="102" fill="#3a4a66">1</text>
    <text x="196" y="102" fill="#3a4a66">4</text>
    <text x="282" y="102" fill="#3a4a66">1</text>
    <text x="394" y="102" fill="#8a6a20">1.0</text>

    <text x="40" y="128" fill="#555">1</text>
    <text x="110" y="128" fill="#3a4a66">2</text>
    <text x="196" y="128" fill="#3a4a66">5</text>
    <text x="282" y="128" fill="#3a4a66">2</text>
    <text x="394" y="128" fill="#8a6a20">1.0</text>

    <text x="40" y="154" fill="#555">2</text>
    <text x="110" y="154" fill="#3a4a66">3</text>
    <text x="196" y="154" fill="#3a4a66">6</text>
    <text x="282" y="154" fill="#3a4a66">2</text>
    <text x="394" y="154" fill="#8a6a20">1.5</text>

    <text x="40" y="180" fill="#555">3</text>
    <text x="110" y="180" fill="#3a4a66">4</text>
    <text x="196" y="180" fill="#3a4a66">8</text>
    <text x="282" y="180" fill="#3a4a66">2</text>
    <text x="394" y="180" fill="#8a6a20">2.0</text>
  </g>

  <path d="M 40 190 L 526 190" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="40" y="212" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">按 d / t 降序排列后的击杀顺序</text>

  <g filter="url(#rough2)" font-size="11" fill="#555">
    <text x="40" y="242" font-weight="bold" fill="#444">顺序</text>
    <text x="130" y="242" font-weight="bold" fill="#444">敌人</text>
    <text x="210" y="242" font-weight="bold" fill="#444">耗时</text>
    <text x="290" y="242" font-weight="bold" fill="#444">累计 T</text>
    <text x="392" y="242" font-weight="bold" fill="#444">本段伤害</text>
  </g>

  <g filter="url(#rough2)" font-size="11">
    <text x="40" y="268" fill="#555">1</text>
    <text x="130" y="268" fill="#3a5a30">敌人 3（d=4）</text>
    <text x="210" y="268" fill="#555">2 秒</text>
    <text x="290" y="268" fill="#555">2</text>
    <text x="392" y="268" fill="#4a7a3a">4 × 2 = 8</text>

    <text x="40" y="294" fill="#555">2</text>
    <text x="130" y="294" fill="#3a5a30">敌人 2（d=3）</text>
    <text x="210" y="294" fill="#555">2 秒</text>
    <text x="290" y="294" fill="#555">4</text>
    <text x="392" y="294" fill="#4a7a3a">3 × 4 = 12</text>

    <text x="40" y="320" fill="#555">3</text>
    <text x="130" y="320" fill="#3a5a30">敌人 0（d=1）</text>
    <text x="210" y="320" fill="#555">1 秒</text>
    <text x="290" y="320" fill="#555">5</text>
    <text x="392" y="320" fill="#4a7a3a">1 × 5 = 5</text>

    <text x="40" y="346" fill="#555">4</text>
    <text x="130" y="346" fill="#3a5a30">敌人 1（d=2）</text>
    <text x="210" y="346" fill="#555">2 秒</text>
    <text x="290" y="346" fill="#555">7</text>
    <text x="392" y="346" fill="#4a7a3a">2 × 7 = 14</text>
  </g>

  <rect x="34" y="360" width="492" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="381" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">总伤害 = 8 + 12 + 5 + 14 = 39</text>
</svg>
