<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 342"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="342" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">建模：三角形为点，可穿过的共享边为边</text>
  <rect x="50" y="70" width="170" height="170" rx="2" fill="#ffffff" stroke="#666666" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="50" y1="70" x2="220" y2="240" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="50" y1="240" x2="220" y2="70" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="135" y="104" text-anchor="middle" font-size="10.5" fill="#33475b" filter="url(#rough2)">上</text>
  <text x="196" y="158" text-anchor="middle" font-size="10.5" fill="#33475b" filter="url(#rough2)">右</text>
  <text x="135" y="216" text-anchor="middle" font-size="10.5" fill="#33475b" filter="url(#rough2)">下</text>
  <text x="74" y="158" text-anchor="middle" font-size="10.5" fill="#33475b" filter="url(#rough2)">左</text>
  <rect x="260" y="70" width="170" height="170" rx="2" fill="#ffffff" stroke="#666666" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="260" y1="70" x2="430" y2="240" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="260" y1="240" x2="430" y2="70" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="345" y="104" text-anchor="middle" font-size="10.5" fill="#33475b" filter="url(#rough2)">上</text>
  <text x="406" y="158" text-anchor="middle" font-size="10.5" fill="#33475b" filter="url(#rough2)">右</text>
  <text x="345" y="216" text-anchor="middle" font-size="10.5" fill="#33475b" filter="url(#rough2)">下</text>
  <text x="284" y="158" text-anchor="middle" font-size="10.5" fill="#33475b" filter="url(#rough2)">左</text>
  <path d="M 160 155 L 200 155" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">右-左</text>
  <text x="280" y="268" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">相邻方块共享整条边 ⇒ 边两侧三角形属于同一区域</text>
  <rect x="40" y="282" width="480" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">区域个数 = 并查集连通分量个数（4n² 个节点）</text>
</svg>
