<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：外层枚举 i，内层「试探移动 + 越界即停」</text>
  <path d="M 170 34 Q 320 42 470 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 侧注：统一出口公式 -->
  <g filter="url(#sk)">
    <rect x="452" y="46" width="168" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="536" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#c09028">两个出口，同一个公式</text>
  <text x="536" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">answer[i] = k − i</text>
  <text x="536" y="100" text-anchor="middle" font-size="9.5" fill="#666">k = m（走完）或首个出界下标</text>

  <!-- 外层循环 -->
  <g filter="url(#sk)">
    <rect x="250" y="50" width="140" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">i = 0 … m−1（外层）</text>
  <path d="M 320 82 L 320 96" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="235" y="100" width="170" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">r, c ← startPos；k ← i</text>
  <path d="M 320 136 L 320 152" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判定 1：k < m ? -->
  <g filter="url(#sk)">
    <polygon points="320,156 420,196 320,236 220,196" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="201" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">k &lt; m ?</text>
  <text x="442" y="189" font-size="11" fill="#666">否</text>
  <path d="M 420 196 L 468 196" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="472" y="176" width="144" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="544" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">answer[i] ← k − i</text>
  <text x="544" y="208" text-anchor="middle" font-size="10" fill="#4a7a3a">（此处 k = m，即 m − i）</text>
  <text x="330" y="250" font-size="11" fill="#666">是</text>
  <path d="M 320 236 L 320 250" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 试探移动 -->
  <g filter="url(#sk)">
    <rect x="220" y="254" width="200" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">按 s[k] 试探移动 (r, c)</text>
  <text x="320" y="288" text-anchor="middle" font-size="10" fill="#666">L:(0,−1)　R:(0,+1)　U:(−1,0)　D:(+1,0)</text>
  <path d="M 320 296 L 320 310" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判定 2：是否在网格内 -->
  <g filter="url(#sk)">
    <polygon points="320,314 430,354 320,394 210,354" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#c09028">0 ≤ r &lt; n 且</text>
  <text x="320" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#c09028">0 ≤ c &lt; n ?</text>

  <!-- 是：k+1 回到判定 1 -->
  <text x="196" y="346" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>
  <path d="M 210 354 L 136 354 L 136 296" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="80" y="258" width="112" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="136" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">k ← k + 1</text>
  <path d="M 136 258 L 136 196 L 212 196" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 否：出界，未执行 -->
  <text x="444" y="346" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <path d="M 430 354 L 468 354" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="472" y="334" width="144" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="544" y="351" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">answer[i] ← k − i</text>
  <text x="544" y="366" text-anchor="middle" font-size="10" fill="#b85450">（s[k] 出界，未执行）</text>

  <!-- 两个出口汇合 → i 自增 → 回到外层 -->
  <path d="M 616 196 L 628 196" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 616 354 L 628 354" stroke="#3a3a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <path d="M 628 196 L 628 435 L 390 435" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="258" y="418" width="124" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="439" text-anchor="middle" font-size="12" font-weight="bold" fill="#c09028">i ← i + 1</text>
  <path d="M 258 435 L 70 435 L 70 66 L 242 66" stroke="#999999" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
</svg>
