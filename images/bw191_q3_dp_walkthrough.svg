<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n = 12 的 dp 表与方案对照</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">dp[v] = 恰好 v 分的最小 Σ(k+1)，答案 = dp[v] − 1</text>

  <text x="69" y="70" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="107" y="70" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="145" y="70" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="183" y="70" text-anchor="middle" font-size="9.5" fill="#888">4</text>
  <text x="221" y="70" text-anchor="middle" font-size="9.5" fill="#888">5</text>
  <text x="258" y="70" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="296" y="70" text-anchor="middle" font-size="9.5" fill="#888">7</text>
  <text x="334" y="70" text-anchor="middle" font-size="9.5" fill="#888">8</text>
  <text x="372" y="70" text-anchor="middle" font-size="9.5" fill="#888">9</text>
  <text x="410" y="70" text-anchor="middle" font-size="9.5" fill="#888">10</text>
  <text x="448" y="70" text-anchor="middle" font-size="9.5" fill="#888">11</text>
  <text x="486" y="70" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">12</text>

  <rect x="50" y="76" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="88" y="76" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="126" y="76" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="164" y="76" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="202" y="76" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="76" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="278" y="76" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="76" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="354" y="76" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="392" y="76" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="430" y="76" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="468" y="76" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>

  <text x="68" y="93" text-anchor="middle" font-size="11" fill="#3a4a66">2</text>
  <text x="106" y="93" text-anchor="middle" font-size="11" fill="#3a4a66">4</text>
  <text x="144" y="93" text-anchor="middle" font-size="11" fill="#3a4a66">3</text>
  <text x="182" y="93" text-anchor="middle" font-size="11" fill="#3a4a66">5</text>
  <text x="220" y="93" text-anchor="middle" font-size="11" fill="#3a4a66">7</text>
  <text x="258" y="93" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">4</text>
  <text x="296" y="93" text-anchor="middle" font-size="11" fill="#3a4a66">6</text>
  <text x="334" y="93" text-anchor="middle" font-size="11" fill="#3a4a66">8</text>
  <text x="372" y="93" text-anchor="middle" font-size="11" fill="#3a4a66">7</text>
  <text x="410" y="93" text-anchor="middle" font-size="11" fill="#3a4a66">5</text>
  <text x="448" y="93" text-anchor="middle" font-size="11" fill="#3a4a66">7</text>
  <text x="486" y="93" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">8</text>

  <path d="M 258 106 C 258 138, 486 138, 486 104" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a">取 c = 3：dp[12] ← dp[6] + 4 = 8</text>

  <rect x="60" y="150" width="250" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="185" y="170" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">dp[12] 的四个候选转移</text>
  <text x="185" y="190" text-anchor="middle" font-size="10.5" fill="#555">c=1：dp[11] + 2 = 9</text>
  <text x="185" y="208" text-anchor="middle" font-size="10.5" fill="#555">c=2：dp[9] + 3 = 10</text>
  <text x="185" y="226" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">c=3：dp[6] + 4 = 8 ✓ 最优</text>
  <text x="185" y="244" text-anchor="middle" font-size="10.5" fill="#555">c=4：dp[2] + 5 = 9</text>

  <rect x="326" y="150" width="214" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="433" y="170" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">方案对照（分数都恰好 12）</text>
  <text x="433" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">(3,3)：6+6，Σ=8，7 天 ✓</text>
  <text x="433" y="208" text-anchor="middle" font-size="10" fill="#555">(4,1,1)：10+1+1，Σ=9，8 天</text>
  <text x="433" y="226" text-anchor="middle" font-size="10" fill="#555">(2,2,2,2)：3×4，Σ=12，11 天</text>
  <text x="433" y="244" text-anchor="middle" font-size="10" fill="#555">12 段 (1)：1×12，Σ=24，23 天</text>

  <rect x="120" y="286" width="320" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12.5" fill="#3a5a30" font-weight="bold">答案 = dp[12] − 1 = 8 − 1 = 7</text>

  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#999">dp[6] = 4 同样来自 c = 3（T(3) = 6）→ 最优方案即两段 (3,3)</text>
</svg>
