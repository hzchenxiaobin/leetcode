<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程:canSplit 的回溯递归树(i = 36,s = 「1296」)</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- root -->
  <rect x="252" y="56" width="140" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <text x="322" y="77" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33517a" filter="url(#sk)">(pos=0, t=36)</text>

  <!-- root -> A -->
  <path d="M 275 88 Q 205 108 165 130" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <text x="196" y="102" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#sk)">吃「1」 val=1</text>

  <!-- root -> skipped branches (dashed) -->
  <path d="M 392 72 L 448 72" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <path d="M 392 82 Q 425 95 448 103" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <path d="M 362 90 Q 430 122 478 148" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <text x="449" y="134" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">吃「12」 val=12</text>

  <rect x="452" y="60" width="182" height="26" rx="6" fill="#fdf6ec" stroke="#b0a090" stroke-width="1.4" stroke-dasharray="5,3" filter="url(#sk)"/>
  <text x="543" y="77" text-anchor="middle" font-size="10.5" fill="#a87818" filter="url(#sk)">吃「129」 129 > 36 ✂(未探索)</text>
  <rect x="452" y="94" width="182" height="26" rx="6" fill="#fdf6ec" stroke="#b0a090" stroke-width="1.4" stroke-dasharray="5,3" filter="url(#sk)"/>
  <text x="543" y="111" text-anchor="middle" font-size="10.5" fill="#a87818" filter="url(#sk)">吃「1296」 1296 > 36 ✂(未探索)</text>
  <rect x="420" y="150" width="196" height="32" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="5,3" filter="url(#sk)"/>
  <text x="518" y="170" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#sk)">(pos=2, t=24)</text>
  <text x="518" y="196" text-anchor="middle" font-size="10" fill="#777" filter="url(#sk)">「1」 支已命中,整支被短路跳过</text>

  <!-- A -->
  <rect x="84" y="132" width="132" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <text x="150" y="153" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">(pos=1, t=35)</text>

  <!-- A -> A1 -->
  <path d="M 120 164 Q 108 186 104 208" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <text x="88" y="194" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#sk)">吃「2」 val=2</text>
  <!-- A -> A2 -->
  <path d="M 185 164 Q 235 186 275 208" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <text x="243" y="188" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#sk)">吃「29」 val=29</text>
  <!-- A -> pruned-296 (dashed, never reached) -->
  <path d="M 216 148 L 236 148" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <rect x="240" y="136" width="196" height="26" rx="6" fill="#fdf6ec" stroke="#b0a090" stroke-width="1.4" stroke-dasharray="5,3" filter="url(#sk)"/>
  <text x="338" y="153" text-anchor="middle" font-size="10.5" fill="#a87818" filter="url(#sk)">吃「296」 296 > 35 ✂(未探索)</text>

  <!-- A1 -->
  <rect x="40" y="212" width="124" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <text x="102" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">(pos=2, t=33)</text>

  <!-- A1 -> A1a -->
  <path d="M 92 244 Q 84 266 80 288" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <text x="66" y="274" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#sk)">吃「9」 val=9</text>
  <!-- A1 -> pruned-96 (executed) -->
  <path d="M 135 244 Q 170 264 195 278" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrY)" filter="url(#sk)"/>
  <rect x="170" y="280" width="158" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="249" y="297" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a87818" filter="url(#sk)">吃「96」 96 > 33 ✂ break</text>

  <!-- A1a -->
  <rect x="16" y="292" width="124" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#sk)"/>
  <text x="78" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">(pos=3, t=24)</text>

  <!-- A1a -> dead leaf -->
  <path d="M 76 324 Q 80 348 85 368" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#sk)"/>
  <text x="108" y="352" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">吃「6」 val=6</text>
  <rect x="12" y="372" width="158" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#sk)"/>
  <text x="91" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a3a" filter="url(#sk)">t = 24 − 6 = 18 ≠ 0 ✗</text>
  <text x="91" y="416" text-anchor="middle" font-size="10" fill="#8a3a3a" filter="url(#sk)">死路 → 回溯,for 推进 j 换段</text>

  <!-- A2 (hit path) -->
  <rect x="236" y="212" width="124" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="298" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">(pos=3, t=6)</text>

  <!-- A2 -> hit leaf -->
  <path d="M 300 244 Q 315 310 318 368" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="356" y="344" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">吃「6」 val=6</text>
  <rect x="232" y="372" width="186" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#sk)"/>
  <text x="325" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">t = 6 − 6 = 0 ✓ 命中!</text>
  <text x="325" y="416" text-anchor="middle" font-size="10" fill="#3a6a2a" filter="url(#sk)">逐层 return true 短路返回</text>

  <text x="320" y="438" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#sk)">回退藏在 for 循环里:递归返回 false → 推进 j,换一种首段长度再试</text>

  <rect x="66" y="448" width="16" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="90" y="461" font-size="10.5" fill="#3a6a2a" filter="url(#sk)">命中路径</text>
  <rect x="156" y="448" width="16" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#sk)"/>
  <text x="180" y="461" font-size="10.5" fill="#8a3a3a" filter="url(#sk)">死路回溯</text>
  <rect x="252" y="448" width="16" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#sk)"/>
  <text x="276" y="461" font-size="10.5" fill="#a87818" filter="url(#sk)">剪枝 break</text>
  <rect x="346" y="448" width="16" height="16" rx="3" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#sk)"/>
  <text x="370" y="461" font-size="10.5" fill="#777" filter="url(#sk)">未探索(命中即短路跳过)</text>
</svg>
