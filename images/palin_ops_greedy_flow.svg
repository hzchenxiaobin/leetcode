<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="34" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：计数 → 求预算 → 造价升序贪心扣减</text>

  <!-- 步骤框 -->
  <rect x="140" y="54" width="280" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="79" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">① 遍历全部字符，统计频率 freq[26]</text>
  <path d="M 280 94 L 280 120" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="124" width="280" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="149" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">② 预算 Q = Σ ⌊freq[c] / 2⌋</text>
  <path d="M 280 164 L 280 190" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="194" width="280" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="219" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">③ 词长升序排序（造价 ⌊L/2⌋ 单调不减）</text>
  <path d="M 280 234 L 280 258" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,262 412,308 280,354 148,308" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">pairs ≥ ⌊L/2⌋ ？</text>

  <!-- 是：扣预算 -->
  <text x="292" y="378" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 280 354 L 280 392" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="396" width="260" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="423" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">pairs −= ⌊L/2⌋；ans++</text>

  <!-- 循环回箭头 -->
  <path d="M 410 418 L 486 418 L 486 308 L 418 308" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">取下一词</text>

  <!-- 否：break -->
  <text x="136" y="300" text-anchor="end" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 148 308 L 108 308 L 108 418 L 164 418" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="396" width="130" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="414" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">break</text>
  <text x="105" y="432" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">后面造价更高</text>

  <!-- 汇合：返回 -->
  <path d="M 280 440 L 280 456" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 170 418 L 192 418 L 192 477 L 210 477" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="214" y="460" width="132" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="481" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">④ 返回 ans</text>
</svg>
