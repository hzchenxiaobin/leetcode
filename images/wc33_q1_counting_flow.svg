<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">一次计数 + 一次查表：O(n) 求最大相邻值对</text>

  <!-- 步骤 1 -->
  <rect x="180" y="46" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="73" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 遍历 nums：cnt[v] += 1</text>

  <path d="M 290 90 V 110" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="180" y="114" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="141" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② 遍历 cnt 的每个键 x（不扫值域）</text>

  <path d="M 290 158 V 192" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,196 420,238 280,280 140,238" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="11.5" fill="#8a6d1a" filter="url(#rough2)">cnt 中存在 x+1 ？</text>

  <!-- 是 -->
  <path d="M 140 238 H 118 V 296" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="34" y="302" width="172" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="322" text-anchor="middle" font-size="11" fill="#2f5a26" filter="url(#rough2)">ans = max(ans,</text>
  <text x="120" y="341" text-anchor="middle" font-size="11" fill="#2f5a26" filter="url(#rough2)">cnt[x] + cnt[x+1])</text>

  <!-- 否 -->
  <path d="M 420 238 H 450 V 296" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="226" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="370" y="302" width="160" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="332" text-anchor="middle" font-size="11" fill="#8a2f2a" filter="url(#rough2)">跳过（差不为 1）</text>

  <!-- 侧注 -->
  <rect x="408" y="46" width="134" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="475" y="68" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">值域 ±10⁹</text>
  <text x="475" y="86" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">开不了桶数组</text>
  <text x="475" y="104" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">→ 哈希表计数</text>

  <!-- 底部说明 -->
  <rect x="34" y="362" width="496" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="282" y="382" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">两值都必须出现，否则子序列只有一个值、差为 0；答案为 0 时说明不存在和谐子序列</text>
</svg>
