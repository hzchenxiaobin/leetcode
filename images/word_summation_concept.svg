<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">字母值 → 顺次连接 → 数值</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Letter-value mapping -->
  <text x="320" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">字母值：按字母表位置从 0 开始</text>
  <g filter="url(#sk)">
    <rect x="55" y="80" width="530" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#2b6e9e" font-family="monospace" font-weight="bold">
    <text x="70" y="102">a→0</text>
    <text x="118" y="102">b→1</text>
    <text x="166" y="102">c→2</text>
    <text x="214" y="102">d→3</text>
    <text x="262" y="102">…</text>
    <text x="306" y="102">g→6</text>
    <text x="354" y="102">h→7</text>
    <text x="402" y="102">i→8</text>
    <text x="456" y="102">j→9</text>
    <text x="512" y="102">(仅 a~j)</text>
  </g>

  <!-- Word to value pipeline -->
  <text x="320" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">单词 → 数值（示例："acb"）</text>

  <!-- letter boxes -->
  <g filter="url(#sk)">
    <rect x="150" y="160" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.5"/>
    <rect x="200" y="160" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.5"/>
    <rect x="250" y="160" width="44" height="34" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="172" y="182">a</text>
    <text x="222" y="182">c</text>
    <text x="272" y="182">b</text>
  </g>

  <path d="M 300 177 Q 330 177 355 177" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- digit boxes -->
  <g filter="url(#sk)">
    <rect x="365" y="160" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="415" y="160" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
    <rect x="465" y="160" width="44" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <g font-size="15" fill="#2e6e2e" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="387" y="182">0</text>
    <text x="437" y="182">2</text>
    <text x="487" y="182">1</text>
  </g>

  <path d="M 520 177 Q 550 177 575 177" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- integer box -->
  <g filter="url(#sk)">
    <rect x="505" y="205" width="80" height="38" rx="8" fill="#fef6e6" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="545" y="230" text-anchor="middle" font-size="19" fill="#7a5415" font-family="monospace" font-weight="bold">21</text>
  <path d="M 470 212 Q 495 220 500 222" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Horner formula -->
  <text x="320" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">逐位累乘（秦九韶 / Horner）</text>
  <g filter="url(#sk)">
    <rect x="140" y="282" width="360" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="308" text-anchor="middle" font-size="14" fill="#2b6e9e" font-family="monospace" font-weight="bold">value = value × 10 + (c − 'a')</text>

  <!-- Note -->
  <g filter="url(#sk)">
    <rect x="40" y="332" width="560" height="22" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="320" y="347" text-anchor="middle" font-size="11" fill="#888">前导零天然处理："aaa" → "000" → 0，无需转字符串再 stoi。</text>
</svg>
