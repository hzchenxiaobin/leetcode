<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="860" height="450" fill="#fafafa"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：只能尾部追加 ⇒ 答案 = m − k*（t 能吃进 s 的最长前缀）</text>
  <path d="M 230 42 Q 430 50 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 顶部说明框 -->
  <rect x="50" y="56" width="760" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">k* = t 的最长前缀长度，使得该前缀是 s 的子序列（贪心双指针一趟求出）</text>
  <text x="430" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">追加段只能接在末尾：恰好补上 t 剩下的 m − k* 个字符 —— 多则浪费，少则不够</text>

  <!-- s 行标签 -->
  <text x="110" y="134" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">s = "coaching"（不可改动）＋ 追加段（唯一自由度）</text>

  <!-- s 行格子：coaching -->
  <rect x="110" y="142" width="46" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="160" y="142" width="46" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="210" y="142" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="142" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="310" y="142" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="360" y="142" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="410" y="142" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="460" y="142" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">c</text>
  <text x="183" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">o</text>
  <text x="233" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">a</text>
  <text x="283" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">c</text>
  <text x="333" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">h</text>
  <text x="383" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">i</text>
  <text x="433" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">n</text>
  <text x="483" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">g</text>

  <!-- 加号 -->
  <text x="533" y="172" text-anchor="middle" font-size="20" font-weight="bold" fill="#d6a040" filter="url(#rough2)">＋</text>

  <!-- 追加段格子（虚线橙） -->
  <rect x="560" y="142" width="46" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <rect x="610" y="142" width="46" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <rect x="660" y="142" width="46" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <rect x="710" y="142" width="46" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="583" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#a07830" filter="url(#rough2)">d</text>
  <text x="633" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#a07830" filter="url(#rough2)">i</text>
  <text x="683" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#a07830" filter="url(#rough2)">n</text>
  <text x="733" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#a07830" filter="url(#rough2)">g</text>
  <text x="633" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#a07830" filter="url(#rough2)">追加 m − k* = 4 个字符（答案）</text>

  <!-- k* 分界虚线 -->
  <path d="M 208 248 L 208 308" stroke="#8e5db8" stroke-width="1.6" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>
  <text x="214" y="240" font-size="11.5" font-weight="bold" fill="#8e5db8" filter="url(#rough2)">k* = 2</text>

  <!-- t 行格子：coding -->
  <rect x="110" y="256" width="46" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="160" y="256" width="46" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="210" y="256" width="46" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="260" y="256" width="46" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="310" y="256" width="46" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="360" y="256" width="46" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="133" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">c</text>
  <text x="183" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">o</text>
  <text x="233" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e3030" filter="url(#rough2)">d</text>
  <text x="283" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e3030" filter="url(#rough2)">i</text>
  <text x="333" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e3030" filter="url(#rough2)">n</text>
  <text x="383" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e3030" filter="url(#rough2)">g</text>

  <!-- t 行标签（右侧） -->
  <text x="430" y="284" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">t = "coding"</text>

  <!-- 匹配箭头（绿） -->
  <path d="M 133 252 L 133 194" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 183 252 L 183 194" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 失配箭头（红虚线，指向追加段） -->
  <path d="M 233 252 Q 400 224 574 192" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 匹配 / 失配标注 -->
  <text x="180" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 前 k* 个已由 s 匹配</text>
  <text x="620" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 后 4 个 s 给不了，只能追加</text>

  <!-- 公式框 -->
  <rect x="50" y="344" width="760" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="368" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">充分性：t[k*..m) 原样接在 s 末尾，t 即成子序列 —— 追加 m − k* 个必够</text>
  <text x="430" y="392" text-anchor="middle" font-size="12" fill="#2e5e28" filter="url(#rough2)">必要性：若追加 q &lt; m − k* 个也够，则 t 的前 m − q &gt; k* 个已是 s 的子序列，与 k* 最大性矛盾</text>

  <!-- 底部一句话 -->
  <text x="430" y="436" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">一句话：贪心把 k* 推到最大，m − k* 自动最小</text>
</svg>
