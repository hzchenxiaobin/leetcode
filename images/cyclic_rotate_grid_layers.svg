<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">矩阵 = 同心环：各层独立轮转，环长逐层 −8</text>
  <path d="M 205 44 Q 470 54 735 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Left: 4x4 grid with two layers ===== -->
  <text x="185" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">4×4 示例：两层同心环</text>
  <g filter="url(#sk)">
    <!-- outer layer cells -->
    <rect x="70"  y="90" width="56" height="56" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="126" y="90" width="56" height="56" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="182" y="90" width="56" height="56" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="238" y="90" width="56" height="56" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="70"  y="146" width="56" height="56" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="238" y="146" width="56" height="56" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="70"  y="202" width="56" height="56" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="238" y="202" width="56" height="56" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="70"  y="258" width="56" height="56" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="126" y="258" width="56" height="56" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="182" y="258" width="56" height="56" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="238" y="258" width="56" height="56" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <!-- inner layer cells -->
    <rect x="126" y="146" width="56" height="56" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="182" y="146" width="56" height="56" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="126" y="202" width="56" height="56" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="182" y="202" width="56" height="56" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="98"  y="124">1</text>
    <text x="154" y="124">2</text>
    <text x="210" y="124">3</text>
    <text x="266" y="124">4</text>
    <text x="98"  y="180">5</text>
    <text x="154" y="180">6</text>
    <text x="210" y="180">7</text>
    <text x="266" y="180">8</text>
    <text x="98"  y="236">9</text>
    <text x="154" y="236">10</text>
    <text x="210" y="236">11</text>
    <text x="266" y="236">12</text>
    <text x="98"  y="292">13</text>
    <text x="154" y="292">14</text>
    <text x="210" y="292">15</text>
    <text x="266" y="292">16</text>
  </g>
  <g filter="url(#sk)">
    <rect x="118" y="138" width="132" height="132" rx="10" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <text x="300" y="88" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">第 0 层（L₀ = 12）</text>
  <text x="258" y="210" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">第 1 层</text>
  <text x="258" y="228" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">（L₁ = 4）</text>

  <text x="185" y="352" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">m、n 均为偶数 ⟹ 每层至少 2 行 2 列</text>
  <text x="185" y="374" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">层数 = min(m, n) / 2</text>
  <text x="185" y="396" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">元素只在同层内移动，层间互不影响</text>

  <!-- ===== Right: layer info cards ===== -->
  <g filter="url(#sk)">
    <rect x="360" y="70" width="552" height="108" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="380" y="98" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">层边界（l 从 0 起，向内逐层 +1）</text>
  <text x="380" y="126" font-size="13" fill="#444" font-family="monospace" filter="url(#sk)">top = l&#160;&#160;&#160;bottom = m−1−l&#160;&#160;&#160;left = l&#160;&#160;&#160;right = n−1−l</text>
  <text x="380" y="152" font-size="11" fill="#666" filter="url(#sk)">例（4×4，第 0 层）：top=0, bottom=3, left=0, right=3</text>
  <text x="380" y="170" font-size="11" fill="#666" filter="url(#sk)">每向内一层，四条边界各向内收缩 1</text>

  <g filter="url(#sk)">
    <rect x="360" y="196" width="552" height="108" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="380" y="224" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">环长（随层数递减）</text>
  <text x="380" y="252" font-size="13" fill="#444" font-family="monospace" filter="url(#sk)">L&#8342; = 2·(bottom−top) + 2·(right−left) = 2(m+n) − 4 − 8l</text>
  <text x="380" y="278" font-size="11" fill="#666" filter="url(#sk)">最外层最长：2(m+n)−4；每层四边各缩 1，环长比外一层少 8</text>
  <text x="380" y="296" font-size="11" fill="#666" filter="url(#sk)">4×4：L₀ = 12，L₁ = 4</text>

  <g filter="url(#sk)">
    <rect x="360" y="322" width="552" height="126" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="380" y="350" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">每层独立取模（高频错误！）</text>
  <text x="380" y="378" font-size="13" fill="#444" font-family="monospace" filter="url(#sk)">shift&#8342; = k mod L&#8342;   —— 必须放在层循环内部</text>
  <text x="380" y="404" font-size="11" fill="#666" filter="url(#sk)">4×4、k = 2：外层 2 mod 12 = 2，内层 2 mod 4 = 2（碰巧相同）</text>
  <text x="380" y="422" font-size="11" fill="#666" filter="url(#sk)">4×4、k = 5：外层 5 mod 12 = 5，内层 5 mod 4 = 1（不同！）</text>
  <text x="380" y="440" font-size="11" fill="#b85450" filter="url(#sk)">只算一次 k mod（外层环长）再套用到所有层 → 内层必错</text>

  <g filter="url(#sk)">
    <rect x="360" y="466" width="552" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="636" y="488" text-anchor="middle" font-size="12" fill="#8c3b36" filter="url(#sk)">2×4、2×2 等矩形矩阵同样适用：min(m,n)/2 = 1，只有一层</text>
  <text x="636" y="508" text-anchor="middle" font-size="12" fill="#8c3b36" filter="url(#sk)">2×2 是最小的层，环长恰为 4</text>
</svg>
