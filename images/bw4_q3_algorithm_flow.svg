<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：dfs(node) 的递归骨架</text>

  <g filter="url(#rough2)">
    <rect x="200" y="44" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="280" y="66" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">dfs(node) 进入</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 280 78 L 280 94" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <polygon points="280,96 352,126 280,156 208,126" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="131" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">node 为空 ?</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 352 126 L 420 126" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="382" y="118" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
    <rect x="422" y="110" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="482" y="130" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">返回 (0, 0)</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 280 156 L 280 172" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="291" y="168" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="174" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="160" y="191" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">(ls, lc) = dfs(node.left)</text>
    <text x="160" y="207" text-anchor="middle" font-size="9.5" fill="#888">左子树汇报</text>
    <rect x="300" y="174" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="400" y="191" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">(rs, rc) = dfs(node.right)</text>
    <text x="400" y="207" text-anchor="middle" font-size="9.5" fill="#888">右子树汇报</text>
    <path d="M 240 126 L 160 126 L 160 172" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 320 126 L 400 126 L 400 172" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <path d="M 160 214 L 160 236 L 280 236 L 280 252" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 400 214 L 400 236 L 280 236 L 280 252" stroke="#666" stroke-width="1.6" fill="none"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="170" y="254" width="220" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="280" y="274" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">sum = ls + rs + node.val</text>
    <text x="280" y="292" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">cnt = lc + rc + 1</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 280 302 L 280 318" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <rect x="150" y="320" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="280" y="338" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">best = max(best, sum / cnt)</text>
    <text x="280" y="356" text-anchor="middle" font-size="9.5" fill="#888">以 node 为根的子树平均值登场</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 280 364 L 280 380" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <rect x="190" y="382" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="280" y="404" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">返回 (sum, cnt)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="254" width="120" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10"/>
    <text x="84" y="276" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold">⚠ 只算平均值</text>
    <text x="84" y="294" text-anchor="middle" font-size="9.5" fill="#555">不把 best 传下去：</text>
    <text x="84" y="308" text-anchor="middle" font-size="9.5" fill="#555">best 是全局量</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="416" y="254" width="128" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <text x="480" y="276" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">整数和防溢出</text>
    <text x="480" y="294" text-anchor="middle" font-size="9.5" fill="#555">5000 × 100000</text>
    <text x="480" y="308" text-anchor="middle" font-size="9.5" fill="#555">= 5×10^8 &lt; 2^31−1</text>
  </g>
</svg>
