<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 486" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="486" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold">接通 = 两端核对：A 与邻格 B 的开口必须互相指向对方</text>
  <path d="M 130 36 Q 330 46 530 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- ===== 上块：单向开口，断 ===== -->
  <rect x="48" y="54" width="564" height="200" rx="12" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="80" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">✗ 单向开口：A 朝 B 开口，B 却不朝 A 开口（示例 2）</text>

  <rect x="80" y="96" width="110" height="110" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 80 151 L 190 151" stroke="#446688" stroke-width="4" fill="none" filter="url(#rough2)"/>
  <rect x="88" y="104" width="28" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="135" y="228" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">A = 1（左右）</text>

  <text x="247" y="139" text-anchor="middle" font-size="10.5" fill="#a07828" filter="url(#rough2)">A 朝 B 开口 →</text>
  <path d="M 194 151 L 300 151" stroke="#d6a040" stroke-width="2.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <circle cx="365" cy="151" r="17" fill="#ffffff" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 355 141 L 375 161 M 375 141 L 355 161" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <rect x="480" y="96" width="110" height="110" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 535 96 L 535 206" stroke="#446688" stroke-width="4" fill="none" filter="url(#rough2)"/>
  <rect x="488" y="104" width="28" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="502" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <path d="M 464 145 L 478 159 M 478 145 L 464 159" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="535" y="228" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">B = 2（上下）：没有左开口</text>

  <text x="330" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">边不存在 —— BFS 停在 (0,0)，队列空 → return false</text>

  <!-- ===== 下块：双向开口，通 ===== -->
  <rect x="48" y="268" width="564" height="204" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="294" font-size="12.5" font-weight="bold" fill="#3a6a2a" filter="url(#rough2)">✓ 双向开口：A 朝 B 开口 且 B 朝 A 开口（示例 1）</text>

  <rect x="80" y="310" width="110" height="110" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 135 310 Q 190 310 190 365" stroke="#4a7a3a" stroke-width="4" fill="none" filter="url(#rough2)"/>
  <rect x="88" y="318" width="28" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="135" y="442" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">A = 6（右上）</text>

  <text x="247" y="353" text-anchor="middle" font-size="10.5" fill="#a07828" filter="url(#rough2)">A 出口 (dr,dc) →</text>
  <path d="M 194 365 L 300 365" stroke="#d6a040" stroke-width="2.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <circle cx="330" cy="365" r="17" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 320 365 L 327 372 L 341 357" stroke="#4a7a3a" stroke-width="3" fill="none" filter="url(#rough2)"/>

  <text x="418" y="353" text-anchor="middle" font-size="10.5" fill="#3a6a2a" filter="url(#rough2)">← B 反向开口 (−dr,−dc)</text>
  <path d="M 476 365 L 360 365" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="480" y="310" width="110" height="110" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 535 310 Q 480 310 480 365" stroke="#4a7a3a" stroke-width="4" fill="none" filter="url(#rough2)"/>
  <rect x="488" y="318" width="28" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="502" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="535" y="442" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">B = 5（左上）</text>

  <text x="330" y="462" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a6a2a" filter="url(#rough2)">街道无缝拼接，双向可走 —— 接通！</text>
</svg>
