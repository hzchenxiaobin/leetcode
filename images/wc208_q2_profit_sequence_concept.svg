<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：登舱被规则锁死，唯一自由度是「何时停」</text>
  <path d="M 130 40 Q 320 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="165" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">① 每一轮都身不由己</text>

  <g filter="url(#sk)"><circle cx="160" cy="170" r="52" fill="none" stroke="#446688" stroke-width="2"/></g>
  <g filter="url(#sk)"><path d="M 132 193 Q 160 208 188 193" stroke="#446688" stroke-width="1.2" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 135 148 Q 160 133 185 148" stroke="#446688" stroke-width="1.2" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 196 148 Q 209 170 196 192" stroke="#446688" stroke-width="1.2" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 124 148 Q 111 170 124 192" stroke="#446688" stroke-width="1.2" fill="none"/></g>

  <g filter="url(#sk)"><rect x="145" y="105" width="30" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="160" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">4人</text>
  <g filter="url(#sk)"><rect x="198" y="159" width="30" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="213" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">4人</text>
  <g filter="url(#sk)"><rect x="92" y="159" width="30" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="107" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#sk)">4人</text>

  <g filter="url(#sk)"><rect x="143" y="216" width="34" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="160" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a2a" filter="url(#sk)">登舱</text>

  <g filter="url(#sk)"><path d="M 236 152 Q 258 122 244 96" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#ao)"/></g>
  <text x="262" y="122" text-anchor="start" font-size="10.5" fill="#b57a20" font-weight="bold" filter="url(#sk)">逆时针</text>
  <text x="262" y="136" text-anchor="start" font-size="10.5" fill="#b57a20" font-weight="bold" filter="url(#sk)">轮转</text>

  <g filter="url(#sk)"><path d="M 70 246 L 250 246" stroke="#888" stroke-width="2" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 70 246 l 10 -6 l 0 12 z" fill="#888"/></g>
  <g filter="url(#sk)"><path d="M 250 246 l -10 -6 l 0 12 z" fill="#888"/></g>
  <text x="160" y="262" text-anchor="middle" font-size="10" fill="#777" filter="url(#sk)">地面</text>

  <g filter="url(#sk)"><rect x="42" y="158" width="34" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="59" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#b57a20" filter="url(#sk)">等待</text>
  <path d="M 78 170 L 138 170" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="36" y="288" width="262" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="167" y="310" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b57a20" filter="url(#sk)">「有空舱就不能让游客等待」</text>
  <text x="167" y="330" text-anchor="middle" font-size="11" fill="#7a5a1a" filter="url(#sk)">每轮恰上 min(等待, 4) 人，没有选择</text>
  <text x="167" y="350" text-anchor="middle" font-size="10.5" fill="#8a6a2a" filter="url(#sk)">→ 全过程唯一确定，利润数列 P(k) 是定值</text>

  <path d="M 316 56 L 316 384" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5 5" fill="none" filter="url(#sk)"/>

  <text x="480" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">② 利润数列 P(k)：先降后升很正常</text>

  <g filter="url(#sk)"><path d="M 352 236 L 606 236" stroke="#999" stroke-width="1.5" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 352 88 L 352 330" stroke="#999" stroke-width="1.5" fill="none"/></g>
  <g filter="url(#sk)"><path d="M 352 236 L 606 236" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/></g>
  <text x="600" y="252" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#sk)">P = 0</text>
  <text x="347" y="94" text-anchor="end" font-size="10.5" fill="#777" filter="url(#sk)">利润</text>
  <text x="600" y="344" text-anchor="end" font-size="10.5" fill="#777" filter="url(#sk)">轮转次数 k →</text>

  <g filter="url(#sk)"><path d="M 360 236 L 386 262 L 412 274 L 438 238 L 464 206 L 490 174 L 516 142 L 542 112" stroke="#4a7a3a" stroke-width="2.2" fill="none" stroke-linejoin="round"/></g>
  <g filter="url(#sk)"><circle cx="360" cy="236" r="3.5" fill="#4a7a3a"/></g>
  <g filter="url(#sk)"><circle cx="386" cy="262" r="3.5" fill="#4a7a3a"/></g>
  <g filter="url(#sk)"><circle cx="412" cy="274" r="4.5" fill="#b85450" stroke="#8a3a36" stroke-width="1"/></g>
  <g filter="url(#sk)"><circle cx="438" cy="238" r="3.5" fill="#4a7a3a"/></g>
  <g filter="url(#sk)"><circle cx="464" cy="206" r="3.5" fill="#4a7a3a"/></g>
  <g filter="url(#sk)"><circle cx="490" cy="174" r="3.5" fill="#4a7a3a"/></g>
  <g filter="url(#sk)"><circle cx="516" cy="142" r="3.5" fill="#4a7a3a"/></g>
  <g filter="url(#sk)"><path d="M 542 112 l 3 -9 l 3 9 l 9 1.5 l -7 6 l 2 9 l -7 -5 l -7 5 l 2 -9 l -7 -6 z" fill="#d6a040" stroke="#a87820" stroke-width="1"/></g>

  <g filter="url(#sk)"><path d="M 412 274 Q 448 300 486 296" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3 3"/></g>
  <text x="492" y="294" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#sk)">空转轮：只付 rc 没人上车</text>
  <text x="492" y="309" text-anchor="start" font-size="10" fill="#a06a66" filter="url(#sk)">（customers = [0,0,50] 示意）</text>

  <g filter="url(#sk)"><path d="M 545 101 Q 560 84 585 82" stroke="#a87820" stroke-width="1.6" fill="none" stroke-dasharray="3 3"/></g>
  <text x="588" y="80" text-anchor="end" font-size="10.5" fill="#a87820" font-weight="bold" filter="url(#sk)">最大正利润 → 答案 = 该 k</text>

  <g filter="url(#sk)"><rect x="336" y="356" width="282" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="477" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5a2a" filter="url(#sk)">停下后所有轮转免费 → 停在 k 的最终利润就是 P(k)</text>
  <text x="477" y="386" text-anchor="middle" font-size="10" fill="#5a7a4a" filter="url(#sk)">P(k) = bc·B(k) − rc·k，B(k) 为前 k 轮登舱总数</text>
</svg>
