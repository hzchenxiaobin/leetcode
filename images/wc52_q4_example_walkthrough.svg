<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：中间窗口只有 3 种选法</text>
  <text x="310" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">nums = [1,2,1,2,6,7,5,1]，k = 2 → w = [3,3,3,8,13,12,6]，m = 7，j ∈ [2, 4]</text>

  <g filter="url(#rough2)">
    <rect x="40" y="96" width="540" height="34" fill="#eef1f6" stroke="#8899aa" stroke-width="1.4" rx="4"/>
    <text x="75" y="118" text-anchor="middle" font-size="10" fill="#445566">j</text>
    <text x="142" y="118" text-anchor="middle" font-size="10" fill="#445566">i = left[j−k]</text>
    <text x="207" y="118" text-anchor="middle" font-size="10" fill="#445566">l = right[j+k]</text>
    <text x="320" y="118" text-anchor="middle" font-size="10" fill="#445566">w[i] + w[j] + w[l]</text>
    <text x="435" y="118" text-anchor="middle" font-size="10" fill="#445566">合计</text>
    <text x="525" y="118" text-anchor="middle" font-size="10" fill="#445566">三元组</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="130" width="540" height="42" fill="#ffffff" stroke="#c8cdd6" stroke-width="1.2"/>
    <text x="75" y="156" text-anchor="middle" font-size="11" fill="#445566">2</text>
    <text x="142" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>
    <text x="207" y="156" text-anchor="middle" font-size="11" fill="#b85450">4</text>
    <text x="320" y="156" text-anchor="middle" font-size="11" fill="#445566">3 + 3 + 13</text>
    <text x="435" y="156" text-anchor="middle" font-size="11" fill="#445566">19</text>
    <text x="525" y="156" text-anchor="middle" font-size="11" fill="#445566">0, 2, 4</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="172" width="540" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="75" y="198" text-anchor="middle" font-size="11.5" fill="#2f5a24" font-weight="bold">3</text>
    <text x="142" y="198" text-anchor="middle" font-size="11.5" fill="#2f5a24" font-weight="bold">0</text>
    <text x="207" y="198" text-anchor="middle" font-size="11.5" fill="#2f5a24" font-weight="bold">5</text>
    <text x="320" y="198" text-anchor="middle" font-size="11.5" fill="#2f5a24" font-weight="bold">3 + 8 + 12</text>
    <text x="435" y="198" text-anchor="middle" font-size="11.5" fill="#2f5a24" font-weight="bold">23</text>
    <text x="525" y="198" text-anchor="middle" font-size="11.5" fill="#2f5a24" font-weight="bold">0, 3, 5</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="214" width="540" height="42" fill="#ffffff" stroke="#c8cdd6" stroke-width="1.2"/>
    <text x="75" y="240" text-anchor="middle" font-size="11" fill="#445566">4</text>
    <text x="142" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>
    <text x="207" y="240" text-anchor="middle" font-size="11" fill="#b85450">6</text>
    <text x="320" y="240" text-anchor="middle" font-size="11" fill="#445566">3 + 13 + 6</text>
    <text x="435" y="240" text-anchor="middle" font-size="11" fill="#445566">22</text>
    <text x="525" y="240" text-anchor="middle" font-size="11" fill="#445566">0, 4, 6</text>
  </g>

  <text x="310" y="274" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">j = 3 合计最大（23），其余两种都更小，直接输出 [0, 3, 5]</text>

  <rect x="52" y="288" width="516" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="70" y="310" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">并列时怎么取？nums = [4,5,10,6,11,17,4,4,4,4]，k = 2</text>
  <text x="70" y="330" font-size="10.5" fill="#555" filter="url(#rough2)">j = 2 → 9 + 16 + 28 = 53（[0,2,4]）；j = 3 → 15 + 17 + 21 = 53（[1,3,5]）</text>
  <text x="70" y="348" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">两组同和，必须按整组下标比字典序：取 [0,2,4]</text>

  <text x="310" y="382" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间 O(n)：滑动窗口 + 两次扫描 + 一次枚举 j</text>
</svg>
