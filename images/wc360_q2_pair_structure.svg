<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">冲突的配对结构（以 target = 12 为例）</text>
  <text x="258" y="58" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">同一弧两端的数之和 = 12，不能同时入选</text>

  <path d="M 68,144 Q 258,66 448,144" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <path d="M 106,144 Q 258,78 410,144" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <path d="M 144,144 Q 258,90 372,144" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <path d="M 182,144 Q 258,102 334,144" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <path d="M 220,144 Q 258,114 296,144" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <rect x="50" y="148" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="88" y="148" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="126" y="148" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="164" y="148" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="202" y="148" width="36" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="240" y="148" width="36" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="278" y="148" width="36" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="316" y="148" width="36" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="354" y="148" width="36" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="392" y="148" width="36" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="430" y="148" width="36" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="68" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="106" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="144" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="182" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="220" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="258" y="170" text-anchor="middle" font-size="14" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="296" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="334" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="372" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>
  <text x="410" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>
  <text x="448" y="170" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">11</text>

  <path d="M 50,190 L 276,190" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 50,186 L 50,194" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 276,186 L 276,194" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="212" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">1..⌊target/2⌋：内部无冲突 → 全选</text>

  <path d="M 278,190 L 466,190" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 278,186 L 278,194" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 466,186 L 466,194" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="212" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">伙伴已被选 → 逐个跳过</text>

  <text x="258" y="234" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">6 = 12/2：“自己配自己”要占两个下标，互异保证只出现一次 → 也可选</text>

  <rect x="50" y="256" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="92" y="256" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="134" y="256" width="36" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="277" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">12</text>
  <text x="110" y="277" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">13</text>
  <text x="152" y="277" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">14</text>
  <text x="188" y="277" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">…</text>
  <text x="212" y="277" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">从 target 起的后备池：任意两数之和 &gt; target</text>

  <rect x="60" y="304" width="400" height="38" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="13.5" fill="#8a6d1f" filter="url(#rough2)">最优选法 = {1..half} ∪ {target, target+1, …}</text>
</svg>
