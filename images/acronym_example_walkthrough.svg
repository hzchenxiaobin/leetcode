<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：单趟逐位比对 vs 长度短路</text>
  <path d="M 150 40 Q 320 46 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Left panel: example 3 -->
  <g filter="url(#sk)">
    <rect x="28" y="58" width="360" height="300" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="208" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">示例 3：n = 6, s = "ngguoy" → true</text>

  <g font-size="11" font-weight="bold" fill="#555">
    <text x="50" y="99" text-anchor="middle">i</text>
    <text x="125" y="99" text-anchor="middle">words[i]</text>
    <text x="218" y="99" text-anchor="middle">首字符</text>
    <text x="268" y="99" text-anchor="middle">s[i]</text>
    <text x="310" y="99" text-anchor="middle">匹配</text>
  </g>
  <path d="M 38 106 L 378 106" stroke="#c5d8ec" stroke-width="1" filter="url(#sk)"/>

  <g font-size="11" fill="#444" font-family="monospace">
    <text x="50" y="123" text-anchor="middle">0</text>
    <text x="125" y="123" text-anchor="middle">"never"</text>
    <text x="218" y="123" text-anchor="middle" fill="#b85450" font-weight="bold">n</text>
    <text x="268" y="123" text-anchor="middle" fill="#2e6e2e">n</text>
    <text x="310" y="123" text-anchor="middle" fill="#4a7a3a">✓</text>

    <text x="50" y="148" text-anchor="middle">1</text>
    <text x="125" y="148" text-anchor="middle">"gonna"</text>
    <text x="218" y="148" text-anchor="middle" fill="#b85450" font-weight="bold">g</text>
    <text x="268" y="148" text-anchor="middle" fill="#2e6e2e">g</text>
    <text x="310" y="148" text-anchor="middle" fill="#4a7a3a">✓</text>

    <text x="50" y="173" text-anchor="middle">2</text>
    <text x="125" y="173" text-anchor="middle">"give"</text>
    <text x="218" y="173" text-anchor="middle" fill="#b85450" font-weight="bold">g</text>
    <text x="268" y="173" text-anchor="middle" fill="#2e6e2e">g</text>
    <text x="310" y="173" text-anchor="middle" fill="#4a7a3a">✓</text>

    <text x="50" y="198" text-anchor="middle">3</text>
    <text x="125" y="198" text-anchor="middle">"up"</text>
    <text x="218" y="198" text-anchor="middle" fill="#b85450" font-weight="bold">u</text>
    <text x="268" y="198" text-anchor="middle" fill="#2e6e2e">u</text>
    <text x="310" y="198" text-anchor="middle" fill="#4a7a3a">✓</text>

    <text x="50" y="223" text-anchor="middle">4</text>
    <text x="125" y="223" text-anchor="middle">"on"</text>
    <text x="218" y="223" text-anchor="middle" fill="#b85450" font-weight="bold">o</text>
    <text x="268" y="223" text-anchor="middle" fill="#2e6e2e">o</text>
    <text x="310" y="223" text-anchor="middle" fill="#4a7a3a">✓</text>

    <text x="50" y="248" text-anchor="middle">5</text>
    <text x="125" y="248" text-anchor="middle">"you"</text>
    <text x="218" y="248" text-anchor="middle" fill="#b85450" font-weight="bold">y</text>
    <text x="268" y="248" text-anchor="middle" fill="#2e6e2e">y</text>
    <text x="310" y="248" text-anchor="middle" fill="#4a7a3a">✓</text>
  </g>
  <path d="M 38 258 L 378 258" stroke="#c5d8ec" stroke-width="1" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="58" y="272" width="300" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="208" y="293" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">6 位全部通过 → 返回 true</text>
  <text x="208" y="332" text-anchor="middle" font-size="10.5" fill="#888">单趟循环，每位只取首字符 O(1)</text>

  <!-- Right panel: example 2 -->
  <g filter="url(#sk)">
    <rect x="416" y="58" width="196" height="300" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="514" y="80" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">示例 2：长度短路</text>

  <text x="514" y="108" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">words = ["an","apple"]</text>
  <text x="514" y="128" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">s = "a"</text>

  <text x="514" y="163" text-anchor="middle" font-size="13" fill="#555">|words| = 2</text>
  <text x="514" y="188" text-anchor="middle" font-size="13" fill="#555">|s| = 1</text>
  <text x="514" y="226" text-anchor="middle" font-size="22" font-weight="bold" fill="#b85450">2 ≠ 1</text>
  <text x="514" y="258" text-anchor="middle" font-size="11" fill="#7a3b44">长度不等，一位都不用比</text>

  <g filter="url(#sk)">
    <rect x="436" y="272" width="156" height="34" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="514" y="293" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">返回 false</text>
  <text x="514" y="332" text-anchor="middle" font-size="10.5" fill="#888">O(1) 整体短路</text>

  <!-- Bottom note -->
  <g filter="url(#sk)">
    <rect x="28" y="372" width="584" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="320" y="388" text-anchor="middle" font-size="11" fill="#7a5415">短路思想：先检查最便宜的必要条件（长度），再做主体逐位判定</text>
</svg>
