<svg xmlns="http://www.w3.org/2000/svg" width="680" height="390" viewBox="0 0 680 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="390" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：切点 i 的得分 = 左侧 0 的个数 + 右侧 1 的个数</text>
  <path d="M 150 40 Q 340 47 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- nums array with cut point i=2 -->
  <text x="58" y="96" font-size="13" font-weight="bold" fill="#2b2b2b">nums =</text>
  <g filter="url(#sk)">
    <rect x="130" y="70" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="192" y="70" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="254" y="70" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="316" y="70" width="52" height="36" rx="4" fill="#fff" stroke="#9a9a9a" stroke-width="1.4"/>
  </g>
  <g font-size="16" text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="156" y="94" fill="#2e6e2e">0</text>
    <text x="218" y="94" fill="#2e6e2e">0</text>
    <text x="280" y="94" fill="#a06a20">1</text>
    <text x="342" y="94" fill="#777">0</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 249 60 L 249 116" stroke="#b85450" stroke-width="2" stroke-dasharray="7,5"/>
  </g>
  <text x="249" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">切点 i = 2</text>
  <g font-size="11" text-anchor="middle" fill="#888">
    <text x="156" y="121">0</text>
    <text x="218" y="121">1</text>
    <text x="280" y="121">2</text>
    <text x="342" y="121">3</text>
  </g>

  <!-- brackets -->
  <g filter="url(#sk)">
    <path d="M 130 128 L 130 137 L 244 137 L 244 128" stroke="#4a7a3a" stroke-width="1.4" fill="none"/>
    <path d="M 254 128 L 254 137 L 368 137 L 368 128" stroke="#d6a040" stroke-width="1.4" fill="none"/>
  </g>
  <text x="187" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">numsleft（数 0）</text>
  <text x="311" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a20">numsright（数 1）</text>
  <text x="187" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">0 的个数 = 2</text>
  <text x="311" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a20">1 的个数 = 1</text>

  <!-- score pill -->
  <g filter="url(#sk)">
    <rect x="150" y="190" width="200" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="250" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" font-family="monospace">score(2) = 2 + 1 = 3</text>

  <!-- formula panel -->
  <g filter="url(#sk)">
    <rect x="400" y="64" width="262" height="84" rx="10" fill="#fff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="531" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" font-family="monospace">score(i) = z(i) + T₁ − o(i)</text>
  <text x="531" y="110" text-anchor="middle" font-size="10.5" fill="#555">z(i) / o(i)：前 i 个元素中 0 / 1 的个数</text>
  <text x="531" y="128" text-anchor="middle" font-size="10.5" fill="#555">T₁ − o(i)：后缀 nums[i..n−1] 中 1 的个数</text>

  <!-- crossing element -->
  <text x="60" y="246" font-size="13.5" font-weight="bold" fill="#2b2b2b">切点 i → i+1：只有 nums[i] 一个元素跨过切线</text>
  <g filter="url(#sk)">
    <rect x="70" y="258" width="250" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="360" y="258" width="250" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="195" y="279" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">nums[i] = 0：跨入左侧</text>
  <text x="195" y="298" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">leftZeros＋1 ⟹ 得分＋1</text>
  <text x="485" y="279" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a04038">nums[i] = 1：离开右侧</text>
  <text x="485" y="298" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">rightOnes−1 ⟹ 得分−1</text>

  <!-- closed form -->
  <g filter="url(#sk)">
    <rect x="70" y="320" width="540" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">闭式：score(i) = i + T₁ − 2·o(i)（由 z(i) = i − o(i) 代入）</text>
  <text x="340" y="360" text-anchor="middle" font-size="11.5" fill="#444">游走视角：0 记 +1、1 记 −1 ⟹ score(i) = T₁ + 前 i 项和，求最大前缀和</text>
</svg>
