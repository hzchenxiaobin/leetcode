<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察②:提取最小元素 x = M[1],配对 (v, v+x) 减半</text>

  <!-- 顶部:排序后的 M -->
  <text x="52" y="58" font-size="10" fill="#888" filter="url(#rough2)">升序 M:</text>
  <rect x="106" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="123" y="61" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="123" y="84" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">空集,必有</text>
  <rect x="144" y="44" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="161" y="61" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6420" filter="url(#rough2)">x</text>
  <text x="161" y="84" text-anchor="middle" font-size="8.5" fill="#8a6420" filter="url(#rough2)">最小元素!</text>
  <text x="188" y="61" font-size="12" fill="#999" filter="url(#rough2)">… 其余更大 …</text>
  <rect x="330" y="44" width="216" height="42" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="438" y="60" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">最小的非空子集和 = 最小元素</text>
  <text x="438" y="76" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">(每项 ≥ min,单元素子集取等)</text>

  <!-- 中部示例:配对 -->
  <text x="52" y="120" font-size="10" fill="#888" filter="url(#rough2)">例: M =</text>
  <rect x="106" y="106" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="139" y="106" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="172" y="106" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="205" y="106" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="238" y="106" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="271" y="106" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="304" y="106" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="337" y="106" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="404" y="104" width="88" height="28" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6420" filter="url(#rough2)">x = M[1] = 1</text>

  <!-- 配对弧线 -->
  <path d="M 121 102 C 122 88, 150 88, 152 102" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 187 102 C 188 88, 216 88, 218 102" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 253 102 C 254 88, 282 88, 284 102" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 319 102 C 320 88, 348 88, 350 102" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="270" y="90" text-anchor="middle" font-size="9" fill="#8a6420" filter="url(#rough2)">配对 (v, v+x):两者必成对出现!</text>

  <!-- 下方:B 与 B+x -->
  <path d="M 154 134 C 150 146, 150 152, 152 158" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="52" y="176" font-size="10" fill="#4a7a3a" filter="url(#rough2)">不含 x: B =</text>
  <rect x="122" y="162" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="137" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="155" y="162" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="170" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="188" y="162" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="203" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="221" y="162" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="236" y="178" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="272" y="178" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">← 留作新的 M</text>

  <text x="52" y="210" font-size="10" fill="#999" filter="url(#rough2)">含 x: B+x =</text>
  <rect x="128" y="196" width="30" height="24" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="143" y="212" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <rect x="161" y="196" width="30" height="24" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="212" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">3</text>
  <rect x="194" y="196" width="30" height="24" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="212" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">4</text>
  <rect x="227" y="196" width="30" height="24" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="212" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">6</text>
  <text x="278" y="212" font-size="9.5" fill="#999" filter="url(#rough2)">← 消耗掉</text>

  <!-- 右侧流程 -->
  <rect x="376" y="136" width="172" height="118" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="462" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6420" filter="url(#rough2)">升序计数贪心</text>
  <text x="462" y="174" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">① 建哈希计数 cnt[v]</text>
  <text x="462" y="192" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">② 升序扫到 v 且 cnt[v]&gt;0</text>
  <text x="462" y="210" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">③ v 必属「不含 x」侧,</text>
  <text x="462" y="226" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">  消耗一个 v 和一个 v+x</text>
  <text x="462" y="244" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">④ B 当新 M,记下 x,循环 n 次</text>

  <!-- 底部说明 -->
  <rect x="16" y="264" width="344" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="188" y="284" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">为什么最小未消耗值一定在「不含 x」侧?</text>
  <text x="188" y="302" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">若它是某个基 + x,那么那个基更小、早就扫描过,</text>
  <text x="188" y="318" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">并顺手消耗了它——矛盾。所以它只能是基本身,</text>
  <text x="188" y="334" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">且配对副本 v+x 必然还剩足够份数。</text>

  <rect x="376" y="264" width="172" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="462" y="284" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">规模每轮减半</text>
  <text x="462" y="304" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2^n → 2^(n−1) → … → 1</text>
  <text x="462" y="322" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">n 轮后拿到全部 |a_i|</text>
  <text x="462" y="340" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">x=0 时退化为 (v,v) 自配对</text>
</svg>
