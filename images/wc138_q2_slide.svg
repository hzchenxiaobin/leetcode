<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="620" height="300" fill="#fafafa"/>
  <text x="310" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">滑动窗口：每格只进出一次的增量更新</text>
  <text x="40" y="88" font-size="10.5" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">窗口 [2,4]</text>
  <rect x="140" y="68" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="165" y="89.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="190" y="68" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="215" y="89.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="240" y="68" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="265" y="89.3" font-size="12" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="40" y="158" font-size="10.5" fill="#3a5a30" text-anchor="start" filter="url(#rough2)">窗口 [3,5]</text>
  <rect x="190" y="138" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="215" y="159.3" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="240" y="138" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="265" y="159.3" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="290" y="138" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="315" y="159.3" font-size="12" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">1</text>
  <path d="M 160 112 L 160 168" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="172" y="142" font-size="10" fill="#b85450" text-anchor="start" filter="url(#rough2)">移出 arr[2] = 1（grumpy[2]=0，不产生加成）</text>
  <path d="M 340 112 L 400 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="352" y="104" font-size="10" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">移入 arr[5] = 1（grumpy[5]=1，加成 +1）</text>
  <rect x="60" y="196" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="72" y="213.5" font-size="11" fill="#3a4a66" text-anchor="start" filter="url(#rough2)">cur += customers[i] · grumpy[i]</text>
  <text x="72" y="230.5" font-size="11" fill="#555" text-anchor="start" filter="url(#rough2)">cur -= customers[i - minutes] · grumpy[i - minutes]</text>
  <text x="310" y="268" font-size="10.5" fill="#555" text-anchor="middle" filter="url(#rough2)">窗口右移一格只需 O(1)，滑动 n 次共 O(n)</text>
</svg>
