<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="560" height="540" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：排下标，不排数据</text>
  <path d="M 120 42 Q 280 50 440 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="170" y="56" width="220" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="79" text-anchor="middle" font-size="13" fill="#2b4a68" filter="url(#sk)">读入 names, heights（长度 n）</text>

  <g filter="url(#sk)"><path d="M 280 92 L 280 108" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="120" y="112" width="320" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="132" text-anchor="middle" font-size="13.5" fill="#2b4a68" filter="url(#sk)">① 构造下标数组 idx = [0, 1, …, n−1]</text>
  <text x="280" y="150" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">（iota 填充；原数组不动）</text>

  <g filter="url(#sk)"><path d="M 280 160 L 280 176" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="110" y="180" width="340" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="280" y="201" text-anchor="middle" font-size="13.5" fill="#2e5c24" filter="url(#sk)">② 以 heights[idx[i]] 为键，把 idx 降序排序</text>
  <text x="280" y="221" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold" filter="url(#sk)">比较器：heights[a] &gt; heights[b]（键是身高！）</text>

  <g filter="url(#sk)"><path d="M 280 232 L 280 248" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><polygon points="280,252 392,296 280,340 168,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="280" y="301" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">i &lt; n ?</text>

  <text x="292" y="358" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)"><path d="M 280 340 L 280 360" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="150" y="364" width="260" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="385" text-anchor="middle" font-size="13.5" fill="#2b4a68" filter="url(#sk)">③ ans[i] = names[idx[i]]</text>
  <text x="280" y="405" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">（i++ 后回到判断）</text>

  <g filter="url(#sk)"><path d="M 410 390 L 486 390 L 486 296 L 396 296" stroke="#999" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)"/></g>
  <text x="492" y="348" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">循环</text>

  <text x="150" y="286" text-anchor="end" font-size="12" font-weight="bold" fill="#a03a3a" filter="url(#sk)">否</text>
  <g filter="url(#sk)"><path d="M 168 296 L 96 296 L 96 458 L 200 458" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)"/></g>

  <g filter="url(#sk)"><rect x="205" y="436" width="150" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="280" y="463" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 ans ✓</text>

  <text x="280" y="516" text-anchor="middle" font-size="12" fill="#4a4a4a" filter="url(#sk)">names 全程只读：排序只搬动整数下标，字符串零拷贝</text>
</svg>
