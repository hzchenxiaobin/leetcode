<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">候选插入只有两类：贴同色球、拆开同色对子</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">稳定盘面每段长度 ≤ 2：要么是单球，要么是对子</text>

  <!-- 盘面：WW RR BB WW -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="80" y="62" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="6"/><text x="102" y="88" fill="#555">W</text>
    <rect x="130" y="62" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="6"/><text x="152" y="88" fill="#555">W</text>
    <rect x="180" y="62" width="44" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/><text x="202" y="88" fill="#8a3a36">R</text>
    <rect x="230" y="62" width="44" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/><text x="252" y="88" fill="#8a3a36">R</text>
    <rect x="280" y="62" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/><text x="302" y="88" fill="#3a4a66">B</text>
    <rect x="330" y="62" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/><text x="352" y="88" fill="#3a4a66">B</text>
    <rect x="380" y="62" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="6"/><text x="402" y="88" fill="#555">W</text>
    <rect x="430" y="62" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="6"/><text x="452" y="88" fill="#555">W</text>
  </g>
  <!-- 段边界（橙）与对子缝隙（蓝） -->
  <g filter="url(#rough2)">
    <path d="M 77 56 L 77 104" stroke="#d6a040" stroke-width="1.8"/>
    <path d="M 177 56 L 177 104" stroke="#d6a040" stroke-width="1.8"/>
    <path d="M 277 56 L 277 104" stroke="#d6a040" stroke-width="1.8"/>
    <path d="M 377 56 L 377 104" stroke="#d6a040" stroke-width="1.8"/>
    <path d="M 477 56 L 477 104" stroke="#d6a040" stroke-width="1.8"/>
    <path d="M 127 58 L 127 102" stroke="#446688" stroke-width="2" stroke-dasharray="3 2"/>
    <path d="M 227 58 L 227 102" stroke="#446688" stroke-width="2" stroke-dasharray="3 2"/>
    <path d="M 327 58 L 327 102" stroke="#446688" stroke-width="2" stroke-dasharray="3 2"/>
    <path d="M 427 58 L 427 102" stroke="#446688" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="78" y="118" font-size="10" fill="#8a6a20">橙：段边界</text>
    <text x="200" y="118" font-size="10" fill="#3a4a66">蓝虚线：对子中间的缝</text>
  </g>

  <!-- 三类插入 -->
  <rect x="22" y="132" width="170" height="94" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="34" y="152" font-size="10.5" fill="#3a5a30" font-weight="bold">✓ 贴同色球</text>
  <text x="34" y="172" font-size="10" fill="#444">RR 旁插 R → RRR</text>
  <text x="34" y="190" font-size="10" fill="#444">立刻消除一段</text>
  <text x="34" y="208" font-size="10" fill="#444">局面真正前进</text>

  <rect x="196" y="132" width="170" height="94" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="208" y="152" font-size="10.5" fill="#3a4a66" font-weight="bold">✓ 拆开对子</text>
  <text x="208" y="172" font-size="10" fill="#444">RR 中间插 Y → R Y R</text>
  <text x="208" y="190" font-size="10" fill="#444">一对球被拆成两个单球</text>
  <text x="208" y="208" font-size="10" fill="#444">后续合并算术全变了</text>

  <rect x="370" y="132" width="170" height="94" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="382" y="152" font-size="10.5" fill="#8a3a36" font-weight="bold">✗ 异色停异色边界</text>
  <text x="382" y="172" font-size="10" fill="#444">RR | Y | BB</text>
  <text x="382" y="190" font-size="10" fill="#444">两段本就不同色</text>
  <text x="382" y="208" font-size="10" fill="#444">Y 消不掉，白占一球</text>

  <path d="M 280 226 L 280 246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="22" y="252" width="518" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="36" y="272" font-size="10.8" fill="#8a6a20" font-weight="bold">反例：只保留第一类（网上常见的「必须贴同色」剪枝）会漏解</text>
  <text x="36" y="294" font-size="10.2" fill="#555">board = "RRYRRYYRR"，hand = "YYYBB"，答案是 3；而第一步必须把 Y 插进 RR 中间：</text>
  <text x="36" y="314" font-size="10.2" fill="#555">RRYRRYYRR →(插 Y) RYRYRRYYRR →(插 Y) RYRYYRRYYRR →(插 Y) 连续消除 → 空</text>
  <text x="36" y="334" font-size="10.2" fill="#555">前两步的 Y 左右都不同色，正好落在「拆对子」这一类；漏掉它就只剩「贴同色」一条路。</text>
  <text x="36" y="354" font-size="10.2" fill="#555">候选集合 = 段边界上贴同色的位置 ∪ 每个对子中间的缝，约 2n 个。</text>
</svg>
