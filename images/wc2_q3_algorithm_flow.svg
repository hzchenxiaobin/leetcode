<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">O(n) 一遍扫描 + 两次判定</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">外接矩形、面积和、角点异或集合，全部在一次循环里完成</text>

  <g filter="url(#rough2)">
    <ellipse cx="280" cy="78" rx="112" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="82" text-anchor="middle" font-size="10.5" fill="#3a4a66">输入 rectangles（n 个矩形）</text>
  </g>

  <path d="M 280 98 L 280 112" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="120" y="114" width="320" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
    <text x="280" y="134" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">一次遍历，同时做三件事</text>
    <text x="280" y="154" text-anchor="middle" font-size="10" fill="#555">① 求外接矩形 (x, y) − (X, Y)</text>
    <text x="280" y="172" text-anchor="middle" font-size="10" fill="#555">② 累加面积 S　③ 把 4 个角点异或进集合</text>
  </g>

  <path d="M 280 186 L 280 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="280,196 412,232 280,268 148,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="236" text-anchor="middle" font-size="10.5" fill="#8a6a20">S == (X − x)(Y − y) ?</text>
  </g>

  <path d="M 280 268 L 280 292" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="284" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <polygon points="280,292 430,328 280,364 130,328" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="332" text-anchor="middle" font-size="10.5" fill="#8a6a20">角点集 == 4 个外接角 ?</text>
  </g>

  <path d="M 280 364 L 280 386" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="380" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="190" y="388" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="280" y="408" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">return true</text>
    <text x="280" y="424" text-anchor="middle" font-size="9" fill="#666">精确覆盖</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="34" y="388" width="118" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
    <text x="93" y="407" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">return false</text>
    <text x="93" y="423" text-anchor="middle" font-size="9" fill="#666">有漏 / 有重</text>
  </g>

  <path d="M 148 232 L 93 232 L 93 386" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="226" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 130 328 L 93 328" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="112" y="322" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <text x="280" y="450" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">两个条件都是「必要」的，合起来才是「充分」的（见第 5 节证明）</text>
</svg>
