<svg xmlns="http://www.w3.org/2000/svg" width="660" height="668" viewBox="0 0 660 668" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="668" fill="#fdfcf7"/>
  <text x="330" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：计数 → 判总量 → 逐位跳排名 → 镜像拼接</text>
  <path d="M 150 38 Q 330 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="205" y="52" width="250" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="330" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">① 半串 s[:m] 计数 cnt[26]，m = n/2</text>
  <path d="M 330 94 L 330 108" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="205" y="112" width="250" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="330" y="138" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">② total = m! / ∏ cnt[c]!（排列总数）</text>
  <path d="M 330 154 L 330 166" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="330,172 408,204 330,236 252,204" fill="#fdf3f5" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="330" y="209" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">total ＜ k ?</text>
  <path d="M 408 204 L 488 204" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="432" y="196" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="492" y="184" width="130" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="557" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">返回 ""</text>
  <path d="M 330 236 L 330 250" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="344" y="248" font-size="11" fill="#666" filter="url(#sk)">否</text>

  <g filter="url(#sk)">
    <rect x="205" y="256" width="250" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="330" y="282" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">③ for i = 0 .. m−1 逐位确定</text>
  <path d="M 330 298 L 330 312" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="185" y="316" width="290" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="330" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">rem = m − i；按 a→z 枚举候选 c（cnt[c]＞0）</text>
  <path d="M 330 358 L 330 372" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="165" y="378" width="330" height="56" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <g text-anchor="middle" fill="#7a5415" filter="url(#sk)">
    <text x="330" y="400" font-size="12.5" font-weight="bold">核心：f = P(rem, cnt) · cnt[c] / rem</text>
    <text x="330" y="422" font-size="11.5">= 第 i 位放 c 后剩余的排列数（O(1) 增量）</text>
  </g>
  <path d="M 330 434 L 330 448" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="330,454 412,492 330,530 248,492" fill="#fdf3f5" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="330" y="497" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">f ≥ k ?</text>

  <path d="M 412 492 L 496 492" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="436" y="484" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="500" y="472" width="140" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="570" y="497" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">k −= f（整段跳过）</text>
  <path d="M 570 472 L 570 337 L 479 337" stroke="#4a8e4a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="578" y="400" font-size="11" fill="#2e6e2e" filter="url(#sk)">下一个候选 c</text>

  <path d="M 330 530 L 330 546" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="344" y="544" font-size="11" fill="#666" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="185" y="550" width="290" height="48" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="330" y="571" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">落位：half += c，cnt[c]−−，P ← f</text>
  <text x="330" y="590" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">k 不动——名次在段内保持</text>

  <path d="M 185 574 L 62 574 L 62 277 L 199 277" stroke="#4a8edb" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="56" y="430" font-size="11" fill="#2b6e9e" filter="url(#sk)">下一位 i+1</text>

  <path d="M 475 574 L 560 574 L 560 616 L 480 616" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="524" y="606" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">所有位落定</text>
  <g filter="url(#sk)">
    <rect x="205" y="594" width="275" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="342" y="621" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">④ half + mid + rev(half) → 返回</text>
</svg>
