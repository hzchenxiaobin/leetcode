<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：root = [1,2,3,null,4] → 3 行 × 7 列</text>
  <text x="310" y="45" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">树高 h = 2（最长链 1→2→4 两条边）⇒ m = 3，n = 2^(h+1) − 1 = 7</text>

  <!-- 列标 -->
  <text x="129" y="72" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="195" y="72" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="261" y="72" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="327" y="72" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="393" y="72" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="459" y="72" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="525" y="72" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">6</text>
  <text x="80" y="62" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">列</text>

  <!-- 第 0 行 -->
  <rect x="96" y="78" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="162" y="78" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="228" y="78" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="294" y="78" width="66" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="360" y="78" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="426" y="78" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="492" y="78" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="327" y="106" text-anchor="middle" font-size="14" fill="#2b4a6b" filter="url(#rough2)">1</text>
  <text x="70" y="104" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">r=0</text>

  <!-- 第 1 行 -->
  <rect x="96" y="122" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="162" y="122" width="66" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="228" y="122" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="294" y="122" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="360" y="122" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="426" y="122" width="66" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="492" y="122" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="195" y="150" text-anchor="middle" font-size="14" fill="#2c5f2c" filter="url(#rough2)">2</text>
  <text x="459" y="150" text-anchor="middle" font-size="14" fill="#2c5f2c" filter="url(#rough2)">3</text>
  <text x="70" y="148" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">r=1</text>

  <!-- 第 2 行 -->
  <rect x="96" y="166" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="162" y="166" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="228" y="166" width="66" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="294" y="166" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="360" y="166" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="426" y="166" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="492" y="166" width="66" height="42" rx="4" fill="#ffffff" stroke="#d5d9df" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="261" y="194" text-anchor="middle" font-size="14" fill="#8a6a20" filter="url(#rough2)">4</text>
  <text x="70" y="192" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">r=2</text>

  <!-- 走查说明 -->
  <rect x="56" y="230" width="508" height="104" rx="9" fill="#f4f7fb" stroke="#8899aa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="252" text-anchor="middle" font-size="10.5" fill="#2b4a6b" filter="url(#rough2)">根：(0, (n−1)/2) = (0, 3) —— 顶行正中，填 1</text>
  <text x="310" y="278" text-anchor="middle" font-size="10.5" fill="#2c5f2c" filter="url(#rough2)">2 是左孩子：(1, 3 − 2^(h−0−1)) = (1, 1)；3 是右孩子：(1, 3 + 2) = (1, 5)</text>
  <text x="310" y="304" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">4 是 2 的右孩子：(2, 1 + 2^(h−1−1)) = (2, 2) —— 偏移缩小到 1</text>
  <text x="310" y="326" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">其余 17 格全部保留空串 ""（白格）</text>

  <text x="310" y="358" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">对照官方输出：第 2 行的 "4" 在下标 2 而非 0 —— 因为它是右孩子</text>
  <text x="310" y="380" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">同一层内相邻落格间距恒为 2^(h−r)，本层 r=2 时间距为 1，故叶子落在偶数列</text>
  <text x="310" y="402" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i 层落格 ⇒ 下移一层偏移必减半，这正是「完美二叉树高度压缩」的几何体现</text>
</svg>
