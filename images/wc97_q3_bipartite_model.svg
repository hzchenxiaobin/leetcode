<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>
  <text x="24" y="32" text-anchor="start" font-size="17" fill="#2c3e50" font-weight="bold" filter="url(#rough2)">「不喜欢」= 必须异色 ⇒ 本质是二分图判定</text>
  <line x1="130" y1="90" x2="250" y2="56" stroke="#9aa7b4" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="130" y1="90" x2="250" y2="166" stroke="#9aa7b4" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="250" y1="56" x2="370" y2="110" stroke="#9aa7b4" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="130" cy="90" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="96" text-anchor="middle" font-size="15" fill="#2c4a63" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="250" cy="56" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="62" text-anchor="middle" font-size="15" fill="#8a6410" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="250" cy="166" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="172" text-anchor="middle" font-size="15" fill="#8a6410" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="370" cy="110" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="116" text-anchor="middle" font-size="15" fill="#2c4a63" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="150" y="60" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">2</text>
  <text x="316" y="76" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">4</text>
  <text x="60" y="350" text-anchor="start" font-size="12" fill="#666" filter="url(#rough2)">边 = dislikes 里的禁同组关系（无向）</text>
  <rect x="430" y="60" width="160" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="510.0" y="92.55" text-anchor="middle" font-size="13" fill="#2c4a63" filter="url(#rough2)">组 A：{1, 4}</text>
  <rect x="430" y="144" width="160" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="510.0" y="176.55" text-anchor="middle" font-size="13" fill="#8a6410" filter="url(#rough2)">组 B：{2, 3}</text>
  <text x="510" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">两个集合内部无边</text>
  <rect x="60" y="250" width="300" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="210.0" y="274.2" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">同一条边两端必须不同色</text>
  <text x="210.0" y="294.2" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">4 与 2 异色 ⇒ 4 回到 A 组</text>
</svg>
