<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：nums=[1,2,3,4,5]，requests=[[1,3],[0,1]]</text>

  <!-- 步骤 1：数组与请求 -->
  <text x="70" y="64" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 求覆盖次数</text>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="150" y="50" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="194" y="50" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="238" y="50" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="282" y="50" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="326" y="50" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="172" y="70">下标0</text>
    <text x="216" y="70">1</text>
    <text x="260" y="70">2</text>
    <text x="304" y="70">3</text>
    <text x="348" y="70">4</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <rect x="150" y="88" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="194" y="88" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="238" y="88" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="282" y="88" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="326" y="88" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="172" y="106">1</text>
    <text x="216" y="106" fill="#b8860b" font-weight="bold">2</text>
    <text x="260" y="106">1</text>
    <text x="304" y="106">1</text>
    <text x="348" y="106">0</text>
    <text x="410" y="106" text-anchor="start">cnt</text>
  </g>
  <path d="M 470 100 C 500 100, 500 140, 470 142" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2：排序配对 -->
  <text x="70" y="168" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">② 同向排序配对</text>
  <g filter="url(#rough2)">
    <rect x="150" y="152" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="344" y="152" width="180" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="240" y="173">cnt↑ = [0, 1, 1, 1, 2]</text>
    <text x="434" y="173">nums↑ = [1, 2, 3, 4, 5]</text>
  </g>
  <path d="M 330 168 L 344 168" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3：求和 -->
  <text x="70" y="228" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 逐项乘积求和</text>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="150" y="212" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="214" y="212" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="278" y="212" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="342" y="212" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="406" y="212" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="178" y="232">0×1</text>
    <text x="242" y="232">1×2</text>
    <text x="306" y="232">1×3</text>
    <text x="370" y="232">1×4</text>
    <text x="434" y="232" fill="#b85450" font-weight="bold">2×5</text>
  </g>

  <!-- 结果 -->
  <g filter="url(#rough2)">
    <rect x="150" y="264" width="312" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"/>
  </g>
  <text x="306" y="291" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 0+2+3+4+10 = 19 ✓</text>

  <!-- 底注 -->
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">对照官方解释：排列 [3,5,4,2,1] 正把最大值 5 放到了 cnt 最高的下标 1</text>
</svg>
