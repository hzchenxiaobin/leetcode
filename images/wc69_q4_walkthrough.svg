<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：stations = [1..10]，K = 9</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">9 个间隔长度都是 1，need(D) = 9·(⌈1/D⌉ − 1) 是阶梯函数，K = 9 恰好卡在 D = 0.5</text>

  <text x="92" y="72" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">need(D) 的阶梯形状</text>

  <path d="M 70 250 L 330 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 70 250 L 70 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="254" font-size="10" fill="#555" filter="url(#rough2)">D</text>
  <text x="56" y="80" font-size="9.5" fill="#555" filter="url(#rough2)">need</text>

  <text x="100" y="98" font-size="9" fill="#888" filter="url(#rough2)">D ≤ 0.25 时 need ≥ 36（图中截断）</text>

  <path d="M 96 105 L 128 105 L 128 150 L 157 150 L 157 195 L 243 195 L 243 250 L 320 250"
        stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <path d="M 70 195 L 320 195" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="322" y="192" text-anchor="end" font-size="9.5" fill="#b85450" filter="url(#rough2)">K = 9 这条线</text>

  <path d="M 157 250 L 157 195" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <circle cx="157" cy="195" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="163" y="242" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">D* = 0.5</text>

  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="115" y="266" filter="url(#rough2)">0.25</text>
    <text x="130" y="280" filter="url(#rough2)">1/3</text>
    <text x="163" y="266" filter="url(#rough2)">0.5</text>
    <text x="248" y="266" filter="url(#rough2)">1</text>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="end">
    <text x="64" y="248" filter="url(#rough2)">0</text>
    <text x="64" y="199" filter="url(#rough2)">9</text>
    <text x="64" y="154" filter="url(#rough2)">18</text>
    <text x="64" y="109" filter="url(#rough2)">27</text>
  </g>

  <rect x="346" y="86" width="188" height="164" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="360" y="106" font-size="10" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">为什么二分有效</text>
  <text x="360" y="128" font-size="9.5" fill="#555" filter="url(#rough2)">D ≥ 0.5 时 need ≤ 9（可行）</text>
  <text x="360" y="148" font-size="9.5" fill="#555" filter="url(#rough2)">D &lt; 0.5 时 need ≥ 18（不可行）</text>
  <text x="360" y="168" font-size="9.5" fill="#555" filter="url(#rough2)">need 只在 D = 1/p 处跳变，</text>
  <text x="360" y="186" font-size="9.5" fill="#555" filter="url(#rough2)">阶梯的每级都是一个区间，</text>
  <text x="360" y="204" font-size="9.5" fill="#555" filter="url(#rough2)">二分从不做「离散枚举」。</text>
  <text x="360" y="228" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">猜一个 D → 精确算出 need</text>
  <text x="360" y="244" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">→ 只比较 need 与 K</text>

  <rect x="60" y="292" width="464" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <path d="M 60 316 L 524 316" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <g font-size="9" fill="#3a4a66" text-anchor="middle" font-weight="bold">
    <text x="86" y="310" filter="url(#rough2)">轮次</text>
    <text x="158" y="310" filter="url(#rough2)">lo</text>
    <text x="226" y="310" filter="url(#rough2)">hi</text>
    <text x="298" y="310" filter="url(#rough2)">mid</text>
    <text x="372" y="310" filter="url(#rough2)">need(mid)</text>
    <text x="478" y="310" filter="url(#rough2)">判定</text>
  </g>
  <g font-size="9" fill="#555" text-anchor="middle">
    <text x="86" y="332" filter="url(#rough2)">1</text>
    <text x="158" y="332" filter="url(#rough2)">0</text>
    <text x="226" y="332" filter="url(#rough2)">1</text>
    <text x="298" y="332" filter="url(#rough2)">0.5</text>
    <text x="372" y="332" filter="url(#rough2)">9</text>
    <text x="478" y="332" fill="#4a7a3a" filter="url(#rough2)">可行 → hi = 0.5</text>
    <text x="86" y="350" filter="url(#rough2)">2</text>
    <text x="158" y="350" filter="url(#rough2)">0</text>
    <text x="226" y="350" filter="url(#rough2)">0.5</text>
    <text x="298" y="350" filter="url(#rough2)">0.25</text>
    <text x="372" y="350" filter="url(#rough2)">27</text>
    <text x="478" y="350" fill="#b85450" filter="url(#rough2)">不可行 → lo = 0.25</text>
    <text x="86" y="368" filter="url(#rough2)">3</text>
    <text x="158" y="368" filter="url(#rough2)">0.25</text>
    <text x="226" y="368" filter="url(#rough2)">0.5</text>
    <text x="298" y="368" filter="url(#rough2)">0.375</text>
    <text x="372" y="368" filter="url(#rough2)">18</text>
    <text x="478" y="368" fill="#b85450" filter="url(#rough2)">不可行 → lo = 0.375</text>
    <text x="86" y="383" filter="url(#rough2)">4</text>
    <text x="158" y="383" filter="url(#rough2)">0.375</text>
    <text x="226" y="383" filter="url(#rough2)">0.5</text>
    <text x="298" y="383" filter="url(#rough2)">0.4375</text>
    <text x="372" y="383" filter="url(#rough2)">18</text>
    <text x="478" y="383" fill="#b85450" filter="url(#rough2)">不可行 → lo 继续右移</text>
  </g>

  <text x="280" y="408" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">hi 始终停在 0.5，lo 无限逼近 0.5；最终每个间隔切成 2 段（0.5 + 0.5），新增 9 个站</text>
</svg>
