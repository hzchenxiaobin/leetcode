<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="560" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：朴素一趟直取 · 原地两趟编码</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 朴素版横幅 -->
  <g filter="url(#sk)">
    <rect x="60" y="56" width="520" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">朴素版（赛场最短路径）：新建 ans，一趟循环 ans[i] = nums[nums[i]]，直接 AC</text>
  <text x="320" y="94" text-anchor="middle" font-size="11" fill="#444">时间 O(n) · 额外空间 O(n) —— 签到先交这版锁分，进阶回头再优化</text>
  <path d="M 320 104 L 320 124" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#af)"/>
  <text x="338" y="119" text-anchor="start" font-size="10.5" font-weight="bold" fill="#4a7a3a">进阶：O(1) 空间</text>

  <!-- 主流程 -->
  <g filter="url(#sk)"><rect x="170" y="128" width="300" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="152" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">n = nums.size()（值域恰为 [0, n−1]）</text>
  <path d="M 320 166 L 320 186" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#af)"/>

  <g filter="url(#sk)"><rect x="170" y="190" width="300" height="76" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="320" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">第一趟 · 编码（i = 0 → n−1）</text>
  <text x="320" y="234" text-anchor="middle" font-size="12" fill="#2b6e9e">nums[i] += n × (nums[nums[i]] % n)</text>
  <text x="320" y="254" text-anchor="middle" font-size="10.5" fill="#666">低位存原值 a，高位藏答案 b</text>
  <path d="M 320 266 L 320 286" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#af)"/>

  <g filter="url(#sk)"><rect x="170" y="290" width="300" height="62" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="320" y="312" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">第二趟 · 解码（i = 0 → n−1）</text>
  <text x="320" y="334" text-anchor="middle" font-size="12" fill="#2b6e9e">nums[i] /= n（整除取出高位）</text>
  <path d="M 320 352 L 320 372" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#af)"/>

  <g filter="url(#sk)"><rect x="170" y="376" width="300" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">返回 nums —— 原地即答案，O(1) 额外空间</text>

  <!-- 侧注一：为什么 % n -->
  <g filter="url(#sk)">
    <rect x="40" y="440" width="280" height="88" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="180" y="462" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">⚠ 为什么必须 % n？</text>
  <text x="180" y="480" text-anchor="middle" font-size="10.5" fill="#444">读 nums[nums[i]] 时，该格可能已被</text>
  <text x="180" y="496" text-anchor="middle" font-size="10.5" fill="#444">编码成 a + n·b（值 ≥ n），直接当</text>
  <text x="180" y="512" text-anchor="middle" font-size="10.5" fill="#444">下标会越界 / 取错 —— % n 还原原值</text>

  <!-- 侧注二：两趟不能合并 -->
  <g filter="url(#sk)">
    <rect x="330" y="440" width="270" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="465" y="462" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">⚠ 两趟为何不能合并？</text>
  <text x="465" y="480" text-anchor="middle" font-size="10.5" fill="#444">一旦执行 // n，该格原值即丢失，</text>
  <text x="465" y="496" text-anchor="middle" font-size="10.5" fill="#444">后续以它为下标的读取全错 ——</text>
  <text x="465" y="512" text-anchor="middle" font-size="10.5" fill="#444">先全部编码完毕，再统一解码</text>

  <!-- 底部溢出脚注 -->
  <text x="320" y="548" text-anchor="middle" font-size="10.5" fill="#888">编码值 ≤ (n−1) + n(n−1) = n² − 1 ≤ 10⁶ − 1，int 无溢出（n ≤ 1000）</text>
</svg>
