<svg xmlns="http://www.w3.org/2000/svg" width="660" height="560" viewBox="0 0 660 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="89" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1.5 L 7.5 4.5 L 1 7.5" fill="none" stroke="#446688" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#b85450" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1.5 L 7.5 4.5 L 1 7.5" fill="none" stroke="#999" stroke-width="1.3" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="660" height="560" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">方法二 AC 自动机：fail 链 + last 只跳单词节点（示例 1，读到 i=6）</text>
  <path d="M 100 40 Q 330 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- trie edges -->
  <g filter="url(#sk)" stroke="#446688" stroke-width="1.6" fill="none">
    <path d="M 283 93 L 170 149" marker-end="url(#arrB)"/>
    <path d="M 300 102 L 300 138" marker-end="url(#arrB)"/>
    <path d="M 317 93 L 434 149" marker-end="url(#arrB)"/>
    <path d="M 139 174 L 106 224" marker-end="url(#arrB)"/>
    <path d="M 300 182 L 300 218" marker-end="url(#arrB)"/>
    <path d="M 452 182 L 452 218" marker-end="url(#arrB)"/>
    <path d="M 87 258 L 79 298" marker-end="url(#arrB)"/>
    <path d="M 112 255 L 158 304" marker-end="url(#arrB)"/>
    <path d="M 300 262 L 300 296" marker-end="url(#arrB)"/>
    <path d="M 175 342 L 175 373" marker-end="url(#arrB)"/>
    <path d="M 175 417 L 175 445" marker-end="url(#arrB)"/>
  </g>
  <text x="222" y="114" font-size="11" fill="#446688">a</text>
  <text x="310" y="124" font-size="11" fill="#446688">d</text>
  <text x="378" y="114" font-size="11" fill="#446688">e</text>
  <text x="112" y="200" font-size="11" fill="#446688">b</text>
  <text x="310" y="204" font-size="11" fill="#446688">e</text>
  <text x="462" y="204" font-size="11" fill="#446688">f</text>
  <text x="66" y="282" font-size="11" fill="#446688">c</text>
  <text x="146" y="274" font-size="11" fill="#446688">d</text>
  <text x="310" y="284" font-size="11" fill="#446688">f</text>
  <text x="183" y="364" font-size="11" fill="#446688">e</text>
  <text x="183" y="436" font-size="11" fill="#446688">f</text>

  <!-- fail arrows: grey secondary -->
  <g filter="url(#sk)" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" fill="none">
    <path d="M 205 316 Q 248 252 272 190" marker-end="url(#arrG)"/>
    <path d="M 206 390 Q 256 328 276 268" marker-end="url(#arrG)"/>
  </g>
  <text x="258" y="248" font-size="10" fill="#999">fail</text>
  <text x="262" y="330" font-size="10" fill="#999">fail</text>

  <!-- fail/last chain at i=6: abdef -> def -> ef -> root -->
  <g filter="url(#sk)" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7 5" fill="none">
    <path d="M 214 460 Q 288 414 296 346" marker-end="url(#arrR)"/>
    <path d="M 338 312 Q 386 292 412 264" marker-end="url(#arrR)"/>
    <path d="M 470 230 Q 486 148 334 94" marker-end="url(#arrR)"/>
  </g>

  <!-- nodes -->
  <g filter="url(#sk)">
    <ellipse cx="300" cy="80" rx="34" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="150" cy="160" rx="34" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="452" cy="160" rx="34" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="95" cy="240" rx="34" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="300" cy="240" rx="34" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="175" cy="320" rx="34" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <ellipse cx="175" cy="395" rx="34" ry="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <!-- word nodes: double ring orange -->
    <ellipse cx="300" cy="160" rx="40" ry="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <ellipse cx="300" cy="160" rx="33" ry="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <ellipse cx="75" cy="320" rx="40" ry="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <ellipse cx="75" cy="320" rx="33" ry="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <ellipse cx="300" cy="320" rx="40" ry="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <ellipse cx="300" cy="320" rx="33" ry="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <ellipse cx="452" cy="240" rx="40" ry="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <ellipse cx="452" cy="240" rx="33" ry="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <ellipse cx="175" cy="468" rx="42" ry="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <ellipse cx="175" cy="468" rx="34" ry="19" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="300" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a88">∅ 根</text>
  <text x="150" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a88">a</text>
  <text x="452" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a88">e</text>
  <text x="95" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a88">ab</text>
  <text x="300" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a88">de</text>
  <text x="175" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a88">abd</text>
  <text x="175" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b5a88">abde</text>
  <text x="300" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06a10">d</text>
  <text x="300" y="172" text-anchor="middle" font-size="10" fill="#b06a10">ℓ=1 · 1</text>
  <text x="75" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06a10">abc</text>
  <text x="75" y="332" text-anchor="middle" font-size="10" fill="#b06a10">ℓ=3 · 1</text>
  <text x="300" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06a10">def</text>
  <text x="300" y="332" text-anchor="middle" font-size="10" fill="#b06a10">ℓ=3 · 10</text>
  <text x="452" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06a10">ef</text>
  <text x="452" y="252" text-anchor="middle" font-size="10" fill="#b06a10">ℓ=2 · 5</text>
  <text x="175" y="464" text-anchor="middle" font-size="13" font-weight="bold" fill="#b06a10">abdef</text>
  <text x="175" y="480" text-anchor="middle" font-size="10" fill="#b06a10">ℓ=5 · 100</text>

  <!-- step badges -->
  <g filter="url(#sk)">
    <circle cx="136" cy="446" r="11" fill="#b85450"/>
    <circle cx="259" cy="298" r="11" fill="#b85450"/>
    <circle cx="414" cy="219" r="11" fill="#b85450"/>
  </g>
  <text x="136" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>
  <text x="259" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text>
  <text x="414" y="223" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>

  <!-- right panel -->
  <g filter="url(#sk)">
    <rect x="508" y="64" width="142" height="182" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="579" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04038">读入 abcdef 后</text>
  <text x="579" y="102" text-anchor="middle" font-size="11" fill="#a04038">停在 abdef 节点，沿 last 链：</text>
  <text x="516" y="126" font-size="11" font-weight="bold" fill="#a04038">① abdef：f[1]+100 = ∞</text>
  <text x="516" y="148" font-size="11" font-weight="bold" fill="#a04038">② def：f[3]+10 = 11</text>
  <text x="516" y="170" font-size="11" font-weight="bold" fill="#a04038">③ ef：f[4]+5 = 7 ✓</text>
  <text x="579" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">f[6] = 7</text>
  <text x="579" y="218" text-anchor="middle" font-size="10" fill="#8a5050">last 链 = 是当前后缀的</text>
  <text x="579" y="233" text-anchor="middle" font-size="10" fill="#8a5050">全部单词，只经单词节点</text>

  <!-- complexity note -->
  <g filter="url(#sk)">
    <rect x="508" y="262" width="142" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="579" y="284" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5a88">为什么快？</text>
  <text x="579" y="304" text-anchor="middle" font-size="10.5" fill="#446688">裸跳 fail 链会路过大量</text>
  <text x="579" y="320" text-anchor="middle" font-size="10.5" fill="#446688">非单词节点：单长词卡到</text>
  <text x="579" y="336" text-anchor="middle" font-size="10.5" fill="#446688">Θ(n²)；last 一跳一个准，</text>
  <text x="579" y="352" text-anchor="middle" font-size="10.5" fill="#446688">总数 ≤ 匹配数 ≤ n√L</text>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="60" y="512" width="440" height="36" rx="8" fill="#f4f2ec" stroke="#c9c4b8" stroke-width="1"/>
  </g>
  <line x1="76" y1="530" x2="106" y2="530" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="112" y="534" font-size="11" fill="#333">Trie 边</text>
  <line x1="168" y1="530" x2="198" y2="530" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7 5" filter="url(#sk)"/>
  <text x="204" y="534" font-size="11" fill="#333">i=6 的 last/fail 链</text>
  <line x1="316" y1="530" x2="346" y2="530" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="352" y="534" font-size="11" fill="#333">其余 fail（未画的均指向根）</text>
</svg>
