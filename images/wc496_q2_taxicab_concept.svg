<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">好整数：同一个数的两副立方面孔（Taxicab 数）</text>

  <!-- 左半：1729 两组分解 -->
  <text x="165" y="58" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">最小的两当面：1729</text>

  <rect x="55" y="72" width="86" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="98" y="94" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">(1, 12)</text>
  <text x="98" y="122" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1³ + 12³</text>

  <rect x="188" y="72" width="86" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="231" y="94" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">(9, 10)</text>
  <text x="231" y="122" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">9³ + 10³</text>

  <path d="M105,130 Q120,160 145,172" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M224,130 Q210,160 188,172" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="105" y="176" width="118" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="164" y="205" text-anchor="middle" font-size="18" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1729</text>

  <text x="164" y="244" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">两组不同对 ⇒ 好整数</text>
  <text x="164" y="263" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">1917 年拉马努金对哈代一语道破</text>

  <!-- 右半：87539319 三组分解 -->
  <text x="425" y="58" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">n ≤ 10⁹ 内的三当面：87539319</text>

  <rect x="310" y="70" width="100" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="90" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">(167, 436)</text>
  <rect x="310" y="110" width="100" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="130" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">(228, 423)</text>
  <rect x="310" y="150" width="100" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="170" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">(255, 414)</text>

  <path d="M415,85 Q460,105 465,128" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M415,125 Q448,132 465,140" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M415,165 Q450,160 465,150" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="468" y="112" width="72" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="504" y="133" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">8753</text>
  <text x="504" y="150" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">9319</text>

  <text x="425" y="200" text-anchor="middle" font-size="11" fill="#a04340" filter="url(#rough2)">三组表示也只算一个</text>
  <text x="425" y="218" text-anchor="middle" font-size="11" fill="#a04340" filter="url(#rough2)">答案中只输出一次！</text>

  <!-- 分隔虚线 -->
  <line x1="290" y1="70" x2="290" y2="230" stroke="#ddd" stroke-width="1.2" stroke-dasharray="5,5" filter="url(#rough2)"/>

  <!-- 底部说明框 -->
  <rect x="48" y="282" width="464" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">定义：x 是好整数 ⇔ 至少两组不同 (a, b)</text>
  <text x="280" y="336" text-anchor="middle" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">正整数、a ≤ b、x = a³ + b³</text>
  <text x="280" y="362" text-anchor="middle" font-size="11.5" fill="#2d5a2d" filter="url(#rough2)">这类数即数论中的 Taxicab 数（OEIS A011541）</text>
  <text x="280" y="386" text-anchor="middle" font-size="11" fill="#5a7a5a" filter="url(#rough2)">1729 = Ta(2)，87539319 = Ta(3) —— 后者就在本题值域内</text>
</svg>
