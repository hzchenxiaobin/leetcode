<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">三个量：最近的 a、最优的 ab、最优的 abc</text>
  <rect x="100" y="54" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126.0" y="79.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <text x="126.0" y="110" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <rect x="156" y="54" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182.0" y="79.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
  <text x="182.0" y="110" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <rect x="212" y="54" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238.0" y="79.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <text x="238.0" y="110" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <rect x="268" y="54" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294.0" y="79.25" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>
  <text x="294.0" y="110" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <path d="M238,150 L238,104" fill="none" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="238" y="168" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">lastA = 2</text>
  <path d="M126,196 L126,104" fill="none" stroke="#d6a040" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="126" y="214" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">bestAB 起始 = 0</text>
  <path d="M126,242 L294,108" fill="none" stroke="#b85450" stroke-width="1.7" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="252" y="260" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">遇到 'c' 时 p = bestAB</text>
  <rect x="50" y="282" width="420" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="300" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">三个指针的更新规则</text>
  <text x="62" y="316" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">'a' → 更新 lastA；'b' → bestAB = max(bestAB, lastA)；</text>
  <text x="62" y="331" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">'c' → p = max(p, bestAB)。三步都是「取最靠右的起点」，</text>
  <text x="62" y="346" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">因为起点越靠右，被排除的子串越少。</text>
</svg>
