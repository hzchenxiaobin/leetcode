<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：同行或同列才「有效」，距离是走格子的曼哈顿距离</text>

  <!-- 网格 -->
  <g stroke="#cfd4dd" stroke-width="1" filter="url(#rough2)">
    <path d="M 90 70 L 90 300 M 170 70 L 170 300 M 250 70 L 250 300 M 330 70 L 330 300 M 410 70 L 410 300 M 490 70 L 490 300"/>
    <path d="M 90 300 L 490 300 M 90 250 L 490 250 M 90 200 L 490 200 M 90 150 L 490 150 M 90 100 L 490 100 M 90 70 L 490 70"/>
  </g>
  <!-- 坐标轴标签 -->
  <g font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="90" y="316">1</text><text x="170" y="316">2</text><text x="250" y="316">3</text><text x="330" y="316">4</text><text x="410" y="316">5</text>
    <text x="78" y="304">1</text><text x="78" y="254">2</text><text x="78" y="204">3</text><text x="78" y="154">4</text><text x="78" y="104">5</text>
  </g>

  <!-- 同列高亮 x=3 -->
  <rect x="210" y="70" width="80" height="230" fill="#e8f0fe" opacity="0.55" rx="4" filter="url(#rough2)"/>
  <!-- 同行高亮 y=4 -->
  <rect x="90" y="130" width="400" height="50" fill="#e6f4ea" opacity="0.6" rx="4" filter="url(#rough2)"/>
  <text x="452" y="126" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">y = 4 同行</text>
  <text x="216" y="64" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 3 同列</text>

  <!-- 我的位置 (3,4) -->
  <g filter="url(#rough2)">
    <circle cx="250" cy="155" r="9" fill="#b85450" stroke="#8a3a36" stroke-width="1.6"/>
    <text x="250" y="159" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">我</text>
    <text x="262" y="147" font-size="11" fill="#b85450" font-weight="bold">(3, 4)</text>
  </g>

  <!-- 有效点 A (3,2)：同列 -->
  <g filter="url(#rough2)">
    <rect x="238" y="238" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="250" y="255" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">A</text>
    <text x="272" y="250" font-size="10.5" fill="#3a4a66">(3,2) 有效·d=2</text>
    <path d="M 259 160 Q 300 200 262 244" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  </g>
  <!-- 有效点 B (5,4)：同行 -->
  <g filter="url(#rough2)">
    <rect x="398" y="143" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="410" y="160" text-anchor="middle" font-size="11" fill="#2f5226" font-weight="bold">B</text>
    <text x="360" y="140" font-size="10.5" fill="#4a7a3a">(5,4) 有效·d=2</text>
    <path d="M 272 160 Q 330 150 390 155" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  </g>
  <!-- 无效点 C (5,1) -->
  <g filter="url(#rough2)">
    <rect x="398" y="288" width="24" height="24" fill="#eee" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="410" y="305" text-anchor="middle" font-size="11" fill="#777" font-weight="bold">C</text>
    <text x="430" y="298" font-size="10.5" fill="#999">(5,1) 无效</text>
  </g>

  <!-- 说明框 -->
  <rect x="30" y="326" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="46" y="344" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">有效 ⇔ a = x 或 b = y，此时曼哈顿距离退化为一根坐标轴上的差：</text>
  <text x="46" y="361" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">d = |x−a| + |y−b|；平局取下标最小 → 更新条件用「严格小于」。</text>
</svg>
