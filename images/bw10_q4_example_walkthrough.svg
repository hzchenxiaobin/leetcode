<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算："abcdeca" 的 LPS 上三角表</text>

  <!-- 列标 -->
  <text y="52" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)"><tspan x="140">j=0 a</tspan><tspan x="200">j=1 b</tspan><tspan x="260">j=2 c</tspan><tspan x="320">j=3 d</tspan><tspan x="380">j=4 e</tspan><tspan x="440">j=5 c</tspan><tspan x="500">j=6 a</tspan></text>

  <!-- 行 i=0 -->
  <text x="120" y="82" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">i=0 a</text>
  <rect x="380" y="62" width="60" height="28" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="440" y="62" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="500" y="62" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text y="81" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="140">1</tspan><tspan x="200">1</tspan><tspan x="260">1</tspan><tspan x="320">1</tspan><tspan x="380">1</tspan><tspan x="440" fill="#d6a040" font-weight="bold">3</tspan><tspan x="500" fill="#4a7a3a" font-weight="bold">5</tspan></text>

  <!-- 行 i=1 -->
  <text x="120" y="112" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">i=1 b</text>
  <rect x="440" y="92" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text y="111" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="200">1</tspan><tspan x="260">1</tspan><tspan x="320">1</tspan><tspan x="380">1</tspan><tspan x="440" fill="#d6a040" font-weight="bold">3</tspan><tspan x="500">3</tspan></text>

  <!-- 行 i=2 -->
  <text x="120" y="142" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">i=2 c</text>
  <rect x="440" y="122" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text y="141" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="260">1</tspan><tspan x="320">1</tspan><tspan x="380">1</tspan><tspan x="440" fill="#d6a040" font-weight="bold">3</tspan><tspan x="500">3</tspan></text>

  <!-- 行 i=3 -->
  <text x="120" y="172" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">i=3 d</text>
  <text y="171" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="320">1</tspan><tspan x="380">1</tspan><tspan x="440">1</tspan><tspan x="500">1</tspan></text>

  <!-- 行 i=4 -->
  <text x="120" y="202" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">i=4 e</text>
  <text y="201" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="380">1</tspan><tspan x="440">1</tspan><tspan x="500">1</tspan></text>

  <!-- 行 i=5 -->
  <text x="120" y="232" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">i=5 c</text>
  <text y="231" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="440">1</tspan><tspan x="500">1</tspan></text>

  <!-- 行 i=6 -->
  <text x="120" y="262" font-size="11" fill="#888" text-anchor="end" filter="url(#rough2)">i=6 a</text>
  <text y="261" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="500">1</tspan></text>

  <!-- 关键格子注释 -->
  <path d="M 450 130 Q 470 150 476 158" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="160" width="230" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="314" y="182" font-size="11" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#d6a040">dp[2][5] = 3：</tspan>子串 "cdec"</text>
  <text x="314" y="200" font-size="11" fill="#555" filter="url(#rough2)">首尾都是 c，配对后中间 "de"</text>
  <text x="314" y="216" font-size="11" fill="#555" filter="url(#rough2)">LPS 为 1，得 1 + 2 = 3</text>

  <path d="M 508 96 Q 528 110 532 118" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="236" width="230" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="314" y="258" font-size="11" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#4a7a3a">dp[0][6] = 5：</tspan>首尾 a、a 相等</text>
  <text x="314" y="276" font-size="11" fill="#555" filter="url(#rough2)">dp[1][5] + 2 = 3 + 2 = 5</text>
  <text x="314" y="294" font-size="11" fill="#4a7a3a" filter="url(#rough2)">对应回文子序列 "acdca"</text>

  <!-- 结论 -->
  <rect x="30" y="160" width="250" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="44" y="184" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">最终判定：</text>
  <text x="44" y="206" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">n − dp[0][6] = 7 − 5 = 2 ≤ k=2</text>

  <rect x="30" y="236" width="250" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="258" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">读表方式：</text>
  <text x="44" y="276" font-size="11" fill="#555" filter="url(#rough2)">len = j − i + 1 从 2 到 7 逐层填，</text>
  <text x="44" y="294" font-size="11" fill="#555" filter="url(#rough2)">对角线全是 1（单字符）</text>

  <rect x="30" y="330" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="46" y="352" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 快速验证："abbababa"，k = 1</text>
  <text x="46" y="372" font-size="11" fill="#555" filter="url(#rough2)">LPS = 7（如 "abababa"，删一个 b）→ 8 − 7 = 1 ≤ 1 → true ✓</text>

  <rect x="30" y="398" width="500" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="46" y="418" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">补充示例："abc"，k = 1</text>
  <text x="46" y="436" font-size="11" fill="#555" filter="url(#rough2)">LPS = 1，需删 3 − 1 = 2 &gt; 1 → false</text>
</svg>
