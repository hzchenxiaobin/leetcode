<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例走查：nums = [−100, −98, 1, 2, 3]</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">排序后两个候选相差三个数量级，“负负得正”才是答案来源</text>

  <g filter="url(#rough2)">
    <rect x="97" y="60" width="62" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
    <rect x="173" y="60" width="62" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
    <rect x="249" y="60" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="325" y="60" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="401" y="60" width="62" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5"/>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" fill="#333">
    <text x="128" y="86">−100</text>
    <text x="204" y="86">−98</text>
    <text x="280" y="86">1</text>
    <text x="356" y="86">2</text>
    <text x="432" y="86">3</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#777">
    <text x="128" y="116">a[0]</text>
    <text x="204" y="116">a[1]</text>
    <text x="280" y="116">a[2]</text>
    <text x="356" y="116">a[3]</text>
    <text x="432" y="116">a[4]</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle">
    <text x="166" y="136" fill="#b85450">两个最小（最负）</text>
    <text x="432" y="136" fill="#d6a040">最大</text>
  </g>

  <path d="M 280 142 L 280 154" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="152" font-size="10" fill="#666" filter="url(#rough2)">两种取法都写出来</text>

  <rect x="60" y="160" width="440" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="74" y="179">候选</text>
    <text x="238" y="179">计算过程</text>
    <text x="452" y="179" text-anchor="middle">乘积</text>
  </g>

  <rect x="60" y="190" width="440" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#8a3a36">
    <text x="74" y="210">A = a[0]·a[1]·a[4]</text>
    <text x="238" y="210">(−100) × (−98) × 3 = 9800 × 3</text>
    <text x="452" y="210" text-anchor="middle" font-weight="bold">29400</text>
  </g>

  <rect x="60" y="224" width="440" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66">
    <text x="74" y="244">B = a[2]·a[3]·a[4]</text>
    <text x="238" y="244">1 × 2 × 3</text>
    <text x="452" y="244" text-anchor="middle" font-weight="bold">6</text>
  </g>

  <path d="M 280 256 L 280 268" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="272" width="300" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">答案 = max(29400, 6) = 29400</text>

  <text x="60" y="336" font-size="10.5" fill="#666" filter="url(#rough2)">两个 −100 量级的数相乘得到 +9800，再乘最大数仍被放大；</text>
  <text x="60" y="354" font-size="10.5" fill="#666" filter="url(#rough2)">若没有负数（如 [1,2,3,4]），候选 A 里没有负号帮忙，答案改由 B 给出 24。</text>
  <text x="60" y="376" font-size="10" fill="#999" filter="url(#rough2)">注意：n = 3 时 a[0], a[1], a[2] 同时构成 A 与 B，两候选恒相等（[−1,−2,−3] → −6）。</text>
</svg>
