<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：aabbccddeeffgghhiiiiii → 24</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1: counting -->
  <g filter="url(#sk)">
    <rect x="35" y="58" width="570" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="320" y="83" text-anchor="middle" font-size="12.5" fill="#2b5d85" filter="url(#sk)">① 计数：i 出现 6 次；a b c d e f g h 各出现 2 次 —— 共 9 种字母</text>
  <path d="M 320 98 L 320 118" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- step 2: sorted queue -->
  <text x="320" y="136" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">② 频率降序排队（同频随便排，层内代价相同）</text>

  <g filter="url(#sk)">
    <rect x="62"  y="146" width="52" height="52" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="120" y="146" width="52" height="52" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="178" y="146" width="52" height="52" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="236" y="146" width="52" height="52" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="294" y="146" width="52" height="52" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="352" y="146" width="52" height="52" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="410" y="146" width="52" height="52" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="468" y="146" width="52" height="52" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="526" y="146" width="52" height="52" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)" font-size="16" font-weight="bold" text-anchor="middle">
    <text x="88"  y="169" fill="#2e6e2e">i</text>
    <text x="146" y="169" fill="#2e6e2e">a</text>
    <text x="204" y="169" fill="#2e6e2e">b</text>
    <text x="262" y="169" fill="#2e6e2e">c</text>
    <text x="320" y="169" fill="#2e6e2e">d</text>
    <text x="378" y="169" fill="#2e6e2e">e</text>
    <text x="436" y="169" fill="#2e6e2e">f</text>
    <text x="494" y="169" fill="#2e6e2e">g</text>
    <text x="552" y="169" fill="#2b5d85">h</text>
  </g>
  <g filter="url(#sk)" font-size="11" text-anchor="middle">
    <text x="88"  y="188" fill="#4a8e4a">×6</text>
    <text x="146" y="188" fill="#4a8e4a">×2</text>
    <text x="204" y="188" fill="#4a8e4a">×2</text>
    <text x="262" y="188" fill="#4a8e4a">×2</text>
    <text x="320" y="188" fill="#4a8e4a">×2</text>
    <text x="378" y="188" fill="#4a8e4a">×2</text>
    <text x="436" y="188" fill="#4a8e4a">×2</text>
    <text x="494" y="188" fill="#4a8e4a">×2</text>
    <text x="552" y="188" fill="#4a8edb">×2</text>
  </g>

  <!-- layer brackets -->
  <path d="M 62 204 L 62 216 L 520 216 L 520 204" fill="none" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="291" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">第 1 层 · 按 1 次（吃满 8 槽）</text>
  <path d="M 526 204 L 526 216 L 578 216 L 578 204" fill="none" stroke="#4a8edb" stroke-width="1.6" filter="url(#sk)"/>
  <text x="552" y="236" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b5d85" filter="url(#sk)">第 2 层·×2</text>

  <!-- step 3: layer sum -->
  <g filter="url(#sk)">
    <rect x="35" y="252" width="570" height="44" rx="8" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="320" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06b1a" filter="url(#sk)">③ 分层求和</text>
  <text x="320" y="290" text-anchor="middle" font-size="12" fill="#a06b1a" filter="url(#sk)">层 1 贡献 = (6 + 2×7) × 1 = 20　；　层 2 贡献 = 2 × 2 = 4</text>

  <!-- result banner -->
  <g filter="url(#sk)">
    <rect x="35" y="310" width="570" height="40" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="320" y="336" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">ans = 20 + 4 = 24 ✓（与官方解释一致）</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="35" y="364" width="570" height="44" rx="8" fill="#f4f0fa" stroke="#8a6db5" stroke-width="1.4"/>
  </g>
  <text x="320" y="385" text-anchor="middle" font-size="11.5" fill="#5a4480" filter="url(#sk)">同频的 a~h 谁被挤到第 2 层都一样——层内位次代价相同，</text>
  <text x="320" y="402" text-anchor="middle" font-size="11.5" fill="#5a4480" filter="url(#sk)">答案与具体键位方案无关，由「频率多重集 + 层号」唯一确定</text>
</svg>
