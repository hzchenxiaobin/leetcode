<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="520" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：检查区域 = (2x+1)×(2x+1) 正方形挖去四角</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 顶部列标签 -->
  <text x="88" y="93" text-anchor="middle" font-size="11" fill="#555">j−x</text>
  <text x="184" y="93" text-anchor="middle" font-size="11" fill="#555">j</text>
  <text x="280" y="93" text-anchor="middle" font-size="11" fill="#555">j+x</text>
  <!-- 左侧行标签 -->
  <text x="34" y="153" text-anchor="end" font-size="11" fill="#555">i−x</text>
  <text x="34" y="249" text-anchor="end" font-size="11" fill="#555">i</text>
  <text x="34" y="345" text-anchor="end" font-size="11" fill="#555">i+x</text>

  <!-- 9×9 网格背景（矩阵） -->
  <g filter="url(#sk)">
    <rect x="40" y="100" width="288" height="288" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
    <!-- (2x+1)×(2x+1) 正方形（绿） -->
    <rect x="72" y="132" width="224" height="224" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <!-- 四个角（红，被剔除） -->
    <rect x="72" y="132" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="264" y="132" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="72" y="324" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="264" y="324" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <!-- 中心 (i,j) -->
    <rect x="168" y="228" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <!-- 网格线 -->
  <path d="M40 100V388M72 100V388M104 100V388M136 100V388M168 100V388M200 100V388M232 100V388M264 100V388M296 100V388M328 100V388" stroke="#c8c8c8" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M40 100H328M40 132H328M40 164H328M40 196H328M40 228H328M40 260H328M40 292H328M40 324H328M40 356H328M40 388H328" stroke="#c8c8c8" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- 角上的 ✗ -->
  <g font-size="14" font-weight="bold" fill="#b03a3a" filter="url(#sk)">
    <text x="88" y="153" text-anchor="middle">✗</text>
    <text x="280" y="153" text-anchor="middle">✗</text>
    <text x="88" y="345" text-anchor="middle">✗</text>
    <text x="280" y="345" text-anchor="middle">✗</text>
  </g>
  <text x="184" y="249" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">x</text>
  <text x="184" y="214" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">被考虑区域</text>
  <text x="280" y="176" text-anchor="middle" font-size="9.5" fill="#b03a3a" filter="url(#sk)">忽略</text>
  <text x="184" y="272" text-anchor="middle" font-size="9.5" fill="#7a5415" filter="url(#sk)">中心 (i,j)</text>
  <text x="184" y="410" text-anchor="middle" font-size="11" fill="#666">以 x = 3 为例：7×7 正方形（绿）挖去 4 个角（红 ✗）</text>

  <!-- 右侧观察框 -->
  <g filter="url(#sk)"><rect x="352" y="110" width="264" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="484" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5a80">观察 1：区域 R(i,j)</text>
  <text x="484" y="148" text-anchor="middle" font-size="11" fill="#2b5a80">正方形：|Δr| ≤ x 且 |Δc| ≤ x（裁到矩阵内）</text>
  <text x="484" y="166" text-anchor="middle" font-size="11" fill="#2b5a80">挖去四角：|Δr| = |Δc| = x 的 4 个格子</text>
  <path d="M 352 146 L 302 148" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="352" y="200" width="264" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="484" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">观察 2：判定即计数</text>
  <text x="484" y="238" text-anchor="middle" font-size="11" fill="#2e6e2e">R 内「严格大于 x」的格子数 = 0</text>
  <text x="484" y="256" text-anchor="middle" font-size="11" fill="#2e6e2e">⟺ (i,j) 是局部最大值 → 交给前缀和</text>
  <path d="M 352 236 L 302 240" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="352" y="290" width="264" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="484" y="310" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">观察 3：x = 1 时 R 是十字</text>
  <text x="484" y="328" text-anchor="middle" font-size="11" fill="#7a5415">自身 + 上下左右 4 邻居</text>
  <text x="484" y="344" text-anchor="middle" font-size="10.5" fill="#7a5415">（示例 3 的 5 个 1 全部命中）</text>

  <g filter="url(#sk)"><rect x="352" y="364" width="264" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="484" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">观察 4：x ≥ n 或 x ≥ m 时</text>
  <text x="484" y="402" text-anchor="middle" font-size="11" fill="#b03a3a">正方形裁成全矩阵，四角全部越界</text>
  <text x="484" y="420" text-anchor="middle" font-size="10.5" fill="#b03a3a">→ 无需角修正（值 200 的格子必然 ✓）</text>

  <!-- 底部备注 -->
  <g filter="url(#sk)"><rect x="40" y="440" width="560" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="320" y="464" text-anchor="middle" font-size="11" fill="#7a5415">正方形计数 = 二维前缀和 O(1)；四角 = 至多 4 次单点修正 —— 相减即得 R 内「更大值」的精确个数</text>
</svg>
