<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="75"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">BFS 分层：边权为 1 时层次即最短路</text>

  <!-- 图结构：0-1, 0-2, 1-2 -->
  <g filter="url(#rough2)">
    <circle cx="280" cy="120" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <circle cx="120" cy="200" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="440" cy="200" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)">
    <path d="M 260 138 L 140 184" stroke="#999" stroke-width="1.8"/>
    <path d="M 300 138 L 420 184" stroke="#999" stroke-width="1.8"/>
    <path d="M 144 200 L 416 200" stroke="#999" stroke-width="1.8" stroke-dasharray="7 5"/>
  </g>
  <g filter="url(#rough2)" font-size="13.5" text-anchor="middle" font-weight="bold">
    <text x="280" y="126" fill="#7a5c1e">0 主</text>
    <text x="120" y="206" fill="#33506e">1</text>
    <text x="440" y="206" fill="#33506e">2</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#666" text-anchor="middle">
    <text x="196" y="152">边</text>
    <text x="364" y="152">边</text>
    <text x="280" y="192">非树边（也在邻接表里）</text>
  </g>

  <!-- BFS 层次标注 -->
  <g filter="url(#rough2)" font-size="12" fill="#2d5a22" text-anchor="middle" font-weight="bold">
    <text x="280" y="88">dist[0] = 0（第 0 层）</text>
    <text x="120" y="248">dist[1] = 1（第 1 层）</text>
    <text x="440" y="248">dist[2] = 1（第 1 层）</text>
  </g>

  <!-- BFS 流程 -->
  <g filter="url(#rough2)">
    <rect x="40" y="278" width="150" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <rect x="205" y="278" width="150" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <rect x="370" y="278" width="150" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="115" y="299" fill="#2d5a22" font-weight="bold">① 队列初始化</text>
    <text x="115" y="317" fill="#2d5a22">dist[0]=0，push(0)</text>
    <text x="280" y="299" fill="#7a5c1e" font-weight="bold">② 逐层扩展</text>
    <text x="280" y="317" fill="#7a5c1e">未访问邻居 dist+1</text>
    <text x="445" y="299" fill="#33506e" font-weight="bold">③ O(n+m) 完成</text>
    <text x="445" y="317" fill="#33506e">全部 dist 就绪</text>
  </g>
</svg>
