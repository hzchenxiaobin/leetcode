<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n = 9, k = 3 ⇒ m = n − k = 6</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">前缀铺 1…6，剩下的 {7,8,9} 从两端交替取：9 → 7 → 8</text>

  <!-- 下标 -->
  <text x="52" y="74" font-size="10" fill="#888" filter="url(#rough2)">i</text>
  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#999">
    <text x="96" y="74" filter="url(#rough2)">1</text><text x="142" y="74" filter="url(#rough2)">2</text><text x="188" y="74" filter="url(#rough2)">3</text>
    <text x="234" y="74" filter="url(#rough2)">4</text><text x="280" y="74" filter="url(#rough2)">5</text><text x="326" y="74" filter="url(#rough2)">6</text>
    <text x="372" y="74" filter="url(#rough2)">7</text><text x="418" y="74" filter="url(#rough2)">8</text><text x="464" y="74" filter="url(#rough2)">9</text>
  </g>

  <!-- ans 行 -->
  <text x="40" y="108" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">ans</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="76" y="84" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="122" y="84" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="168" y="84" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="214" y="84" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="260" y="84" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="306" y="84" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="352" y="84" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="398" y="84" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="444" y="84" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="96" y="108" fill="#3a4a66" filter="url(#rough2)">1</text>
    <text x="142" y="108" fill="#3a4a66" filter="url(#rough2)">2</text>
    <text x="188" y="108" fill="#3a4a66" filter="url(#rough2)">3</text>
    <text x="234" y="108" fill="#3a4a66" filter="url(#rough2)">4</text>
    <text x="280" y="108" fill="#3a4a66" filter="url(#rough2)">5</text>
    <text x="326" y="108" fill="#3a4a66" filter="url(#rough2)">6</text>
    <text x="372" y="108" fill="#3a5a30" filter="url(#rough2)">9</text>
    <text x="418" y="108" fill="#3a5a30" filter="url(#rough2)">7</text>
    <text x="464" y="108" fill="#3a5a30" filter="url(#rough2)">8</text>
  </g>
  <rect x="348" y="80" width="140" height="44" fill="none" stroke="#4a7a3a" stroke-width="1.2" rx="8"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="494" y="106" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">剩余 k 个</text>

  <!-- 差值行 -->
  <text x="40" y="152" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">Δ</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="104" y="134" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="150" y="134" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="196" y="134" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="242" y="134" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="288" y="134" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="334" y="134" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="380" y="134" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <rect x="426" y="134" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="119" y="153" fill="#8a6a20" filter="url(#rough2)">1</text>
    <text x="165" y="153" fill="#8a6a20" filter="url(#rough2)">1</text>
    <text x="211" y="153" fill="#8a6a20" filter="url(#rough2)">1</text>
    <text x="257" y="153" fill="#8a6a20" filter="url(#rough2)">1</text>
    <text x="303" y="153" fill="#8a6a20" filter="url(#rough2)">1</text>
    <text x="349" y="153" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">3</text>
    <text x="395" y="153" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">2</text>
    <text x="441" y="153" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1</text>
  </g>
  <text x="349" y="178" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">接缝差 9−6</text>

  <!-- 双指针轨迹 -->
  <rect x="34" y="192" width="246" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="48" y="212" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">双指针轨迹</text>
  <text x="48" y="232" font-size="9.5" fill="#555" filter="url(#rough2)">初始 lo=7, hi=9</text>
  <text x="48" y="250" font-size="9.5" fill="#555" filter="url(#rough2)">① 出 9（hi=8），再出 7（lo=8）</text>
  <text x="48" y="268" font-size="9.5" fill="#555" filter="url(#rough2)">② 出 8（hi=7），lo=8 &gt; 7 停止</text>

  <rect x="292" y="192" width="234" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="306" y="212" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">差值统计</text>
  <text x="306" y="232" font-size="9.5" fill="#555" filter="url(#rough2)">前缀内部 5 个差：全为 1 → {1}</text>
  <text x="306" y="250" font-size="9.5" fill="#555" filter="url(#rough2)">接缝 3，交替段 2、1</text>
  <text x="306" y="268" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">不同值 {1,2,3}，共 3 = k ✓</text>

  <text x="280" y="308" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">ans = [1,2,3,4,5,6,9,7,8]：前 6 个是前缀，后 3 个把 {7,8,9} 从两端交替取完</text>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">Δ = [1,1,1,1,1,3,2,1] 共 n−1 = 8 个，其中不同整数 3 个，正是 k</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">长度核对：m + k = 6 + 3 = 9 = n；每个数恰好出现一次，所以答案天然是排列</text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">相邻差 3 → 2 → 1 严格递减，保证交替段内部不会再撞上已有的差值</text>
</svg>
