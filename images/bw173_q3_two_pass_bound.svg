<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="560" height="320" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333">上界在两个方向上传播</text>

  <text x="40" y="80" font-size="12" fill="#666">位置</text>
  <text x="42" y="112" font-size="12" fill="#666">上界</text>
  <g>
    <rect x="100" y="60" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="162" y="60" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="224" y="60" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="286" y="60" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="348" y="60" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <rect x="410" y="60" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <rect x="472" y="60" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  </g>
  <text x="128" y="80" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="190" y="80" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="252" y="80" text-anchor="middle" font-size="12" fill="#d6a040">≤1</text>
  <text x="314" y="80" text-anchor="middle" font-size="12" fill="#333">?</text>
  <text x="376" y="80" text-anchor="middle" font-size="12" fill="#333">?</text>
  <text x="438" y="80" text-anchor="middle" font-size="12" fill="#d6a040">≤1</text>
  <text x="500" y="80" text-anchor="middle" font-size="12" fill="#333">?</text>

  <path d="M110,112 L530,112" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="132" text-anchor="middle" font-size="12" fill="#446688">左扫：up[i] = min(restr[i], up[i−1] + diff[i−1])</text>
  <path d="M520,160 L100,160" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="320" y="180" text-anchor="middle" font-size="12" fill="#b85450">右扫：up[i] = min(up[i], up[i+1] + diff[i])</text>

  <rect x="60" y="200" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="227" font-size="12" fill="#333">两次扫描后 up = b：既满足左侧可达，也满足右侧可回落到小限制</text>

  <rect x="60" y="258" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="76" y="278" font-size="12" fill="#b85450">答案 = max b（b 是逐点最大可行值，故最大值也取在 b 上）</text>
  <text x="76" y="294" font-size="11" fill="#666">只做左扫会把“远处的小限制”忽略掉，从而高估</text>
</svg>
