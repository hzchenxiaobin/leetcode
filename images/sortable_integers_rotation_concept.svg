<svg xmlns="http://www.w3.org/2000/svg" width="680" height="452" viewBox="0 0 680 452" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="131" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="452" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：旋转不改变块内元素 → 最终数组必是 sorted(nums)</text>
  <path d="M 190 40 Q 340 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="60" text-anchor="middle" font-size="12" fill="#444">以 nums = [3, 1, 2, 5, 4, 4]、k = 3 为例：每块循环移位后拼起来恰好等于排序数组</text>

  <!-- 原数组分块 -->
  <text x="105" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">nums 按块划分</text>
  <g filter="url(#sk)">
    <rect x="196" y="72" width="152" height="44" rx="8" fill="none" stroke="#446688" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="372" y="72" width="152" height="44" rx="8" fill="none" stroke="#446688" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="204" y="78" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="250" y="78" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="296" y="78" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)">
    <rect x="380" y="78" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="426" y="78" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="472" y="78" width="44" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="226" y="98" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="272" y="98" text-anchor="middle" font-size="14" fill="#333">1</text>
  <text x="318" y="98" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="402" y="98" text-anchor="middle" font-size="14" fill="#333">5</text>
  <text x="448" y="98" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="494" y="98" text-anchor="middle" font-size="14" fill="#333">4</text>
  <text x="272" y="134" text-anchor="middle" font-size="10.5" fill="#888">块 0</text>
  <text x="448" y="134" text-anchor="middle" font-size="10.5" fill="#888">块 1</text>

  <!-- 旋转箭头 -->
  <g filter="url(#sk)">
    <path d="M 272 142 Q 258 166 272 190" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="186" y="170" text-anchor="middle" font-size="10.5" fill="#2b6e9e">循环左移 1 次</text>
  <g filter="url(#sk)">
    <path d="M 448 142 Q 434 166 448 190" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="362" y="170" text-anchor="middle" font-size="10.5" fill="#2b6e9e">循环左移 1 次</text>

  <!-- 旋转后的块 -->
  <g filter="url(#sk)">
    <rect x="196" y="194" width="152" height="44" rx="8" fill="none" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="372" y="194" width="152" height="44" rx="8" fill="none" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="204" y="200" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="250" y="200" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="296" y="200" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g filter="url(#sk)">
    <rect x="380" y="200" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="426" y="200" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="472" y="200" width="44" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="226" y="220" text-anchor="middle" font-size="14" fill="#2e6e2e">1</text>
  <text x="272" y="220" text-anchor="middle" font-size="14" fill="#2e6e2e">2</text>
  <text x="318" y="220" text-anchor="middle" font-size="14" fill="#2e6e2e">3</text>
  <text x="402" y="220" text-anchor="middle" font-size="14" fill="#2e6e2e">4</text>
  <text x="448" y="220" text-anchor="middle" font-size="14" fill="#2e6e2e">4</text>
  <text x="494" y="220" text-anchor="middle" font-size="14" fill="#2e6e2e">5</text>

  <!-- 与 s 对齐 -->
  <g filter="url(#sk)">
    <path d="M 272 244 Q 272 262 272 276" stroke="#9aa89a" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)"/>
    <path d="M 448 244 Q 448 262 448 276" stroke="#9aa89a" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  </g>
  <text x="556" y="222" font-size="11" fill="#2e6e2e">＝ s 的块 0</text>
  <text x="556" y="240" font-size="11" fill="#2e6e2e">＝ s 的块 1</text>

  <!-- s 数组 -->
  <text x="105" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">s = sorted(nums)</text>
  <g filter="url(#sk)">
    <rect x="204" y="282" width="136" height="36" rx="4" fill="#eef6ec" stroke="#7aa87a" stroke-width="1.2" stroke-dasharray="6,4"/>
    <rect x="344" y="282" width="136" height="36" rx="4" fill="#eef6ec" stroke="#7aa87a" stroke-width="1.2" stroke-dasharray="6,4"/>
  </g>
  <g font-size="13" fill="#4a6a4a" text-anchor="middle">
    <text x="226" y="304">1</text><text x="272" y="304">2</text><text x="318" y="304">3</text>
    <text x="366" y="304">4</text><text x="412" y="304">4</text><text x="458" y="304">5</text>
  </g>
  <text x="540" y="304" font-size="10.5" fill="#888">非递减排列唯一</text>

  <!-- 结论框 -->
  <g filter="url(#sk)">
    <rect x="40" y="340" width="600" height="94" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="58" y="362" font-size="12.5" font-weight="bold" fill="#7a5415">为什么这是必然？</text>
  <text x="58" y="381" font-size="11.5" fill="#444">循环移位是排列操作 → 最终数组是 nums 的一个排列；而非递减的排列只有一个 → 最终数组 = sorted(nums)</text>
  <text x="58" y="399" font-size="11.5" fill="#444">于是「k 可排序」⟺ 每个块都能旋转成 s 中同一位置的块，拆成两个 O(1) 判定：</text>
  <text x="58" y="417" font-size="11.5" fill="#333">① 块的多重集 = s 对应块的多重集（Zobrist 前缀哈希）　　② 块的环形下降数 ≤ 1（可旋转成非递减）</text>
</svg>
