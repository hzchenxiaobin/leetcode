<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：abc / abb / ab → 两次操作汇合于 ab</text>
  <path d="M 150 34 Q 320 42 490 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 面板① 逐位对齐表 -->
  <g filter="url(#sk)"><rect x="36" y="50" width="304" height="200" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="52" y="72" font-size="13" font-weight="bold" fill="#2b6e9e">① 逐位对齐找 L</text>

  <g filter="url(#sk)"><rect x="56" y="82" width="40" height="26" rx="3" fill="#dce8f5" stroke="#4a8edb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="96" y="82" width="52" height="26" rx="3" fill="#dce8f5" stroke="#4a8edb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="148" y="82" width="52" height="26" rx="3" fill="#dce8f5" stroke="#4a8edb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="200" y="82" width="52" height="26" rx="3" fill="#dce8f5" stroke="#4a8edb" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="252" y="82" width="64" height="26" rx="3" fill="#dce8f5" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="76" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">i</text>
  <text x="122" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">s₁[i]</text>
  <text x="174" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">s₂[i]</text>
  <text x="226" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">s₃[i]</text>
  <text x="284" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">判定</text>

  <g filter="url(#sk)"><rect x="56" y="108" width="40" height="30" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="96" y="108" width="52" height="30" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="148" y="108" width="52" height="30" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="200" y="108" width="52" height="30" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="252" y="108" width="64" height="30" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <text x="76" y="128" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="122" y="128" text-anchor="middle" font-size="12" fill="#333">a</text>
  <text x="174" y="128" text-anchor="middle" font-size="12" fill="#333">a</text>
  <text x="226" y="128" text-anchor="middle" font-size="12" fill="#333">a</text>
  <text x="284" y="128" text-anchor="middle" font-size="12" fill="#2e6e2e">✓</text>

  <g filter="url(#sk)"><rect x="56" y="138" width="40" height="30" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="96" y="138" width="52" height="30" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="148" y="138" width="52" height="30" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="200" y="138" width="52" height="30" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="252" y="138" width="64" height="30" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <text x="76" y="158" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="122" y="158" text-anchor="middle" font-size="12" fill="#333">b</text>
  <text x="174" y="158" text-anchor="middle" font-size="12" fill="#333">b</text>
  <text x="226" y="158" text-anchor="middle" font-size="12" fill="#333">b</text>
  <text x="284" y="158" text-anchor="middle" font-size="12" fill="#2e6e2e">✓</text>

  <g filter="url(#sk)"><rect x="56" y="168" width="40" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="96" y="168" width="52" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="148" y="168" width="52" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="200" y="168" width="52" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="252" y="168" width="64" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="76" y="188" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="122" y="188" text-anchor="middle" font-size="12" fill="#333">c</text>
  <text x="174" y="188" text-anchor="middle" font-size="12" fill="#333">b</text>
  <text x="226" y="188" text-anchor="middle" font-size="12" fill="#999">∅</text>
  <text x="284" y="188" text-anchor="middle" font-size="11" fill="#b85450">✗ 停</text>

  <text x="188" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">i 停在 2 ⇒ L = 2，前缀 ab 全体保留</text>

  <!-- 面板② 两次削尾 -->
  <g filter="url(#sk)"><rect x="356" y="50" width="248" height="200" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="372" y="72" font-size="13" font-weight="bold" fill="#7a5415">② 两次削尾操作</text>

  <text x="396" y="107" text-anchor="end" font-size="11.5" fill="#444">s₁</text>
  <g filter="url(#sk)"><rect x="404" y="90" width="22" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="415" y="105" text-anchor="middle" font-size="11" fill="#333">a</text>
  <g filter="url(#sk)"><rect x="428" y="90" width="22" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="439" y="105" text-anchor="middle" font-size="11" fill="#333">b</text>
  <g filter="url(#sk)"><rect x="452" y="90" width="22" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="463" y="105" text-anchor="middle" font-size="11" fill="#8a3a36">c</text>
  <path d="M 456 94 L 470 108 M 470 94 L 456 108" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="496" y="108" font-size="10.5" fill="#a05a15">① 删 s₁ 尾 'c'</text>

  <text x="396" y="139" text-anchor="end" font-size="11.5" fill="#444">s₂</text>
  <g filter="url(#sk)"><rect x="404" y="122" width="22" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="415" y="137" text-anchor="middle" font-size="11" fill="#333">a</text>
  <g filter="url(#sk)"><rect x="428" y="122" width="22" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="439" y="137" text-anchor="middle" font-size="11" fill="#333">b</text>
  <g filter="url(#sk)"><rect x="452" y="122" width="22" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="463" y="137" text-anchor="middle" font-size="11" fill="#8a3a36">b</text>
  <path d="M 456 126 L 470 140 M 470 126 L 456 140" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="496" y="140" font-size="10.5" fill="#a05a15">② 删 s₂ 尾 'b'</text>

  <text x="396" y="171" text-anchor="end" font-size="11.5" fill="#444">s₃</text>
  <g filter="url(#sk)"><rect x="404" y="154" width="22" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="415" y="169" text-anchor="middle" font-size="11" fill="#333">a</text>
  <g filter="url(#sk)"><rect x="428" y="154" width="22" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="439" y="169" text-anchor="middle" font-size="11" fill="#333">b</text>
  <text x="496" y="172" font-size="10.5" fill="#888">本来就最短</text>

  <g filter="url(#sk)"><rect x="372" y="184" width="216" height="24" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="480" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">三串汇合于 "ab" ✓</text>
  <text x="480" y="236" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">3 + 3 + 2 − 3×2 = 2 次 ✓</text>

  <!-- 面板③ 反例 -->
  <g filter="url(#sk)"><rect x="36" y="266" width="568" height="98" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="52" y="290" font-size="13" font-weight="bold" fill="#a03a36">③ 反例（示例 2）：L = 0 ⇒ −1</text>

  <text x="150" y="312" text-anchor="middle" font-size="9.5" fill="#888">s₁</text>
  <text x="186" y="312" text-anchor="middle" font-size="9.5" fill="#888">s₂</text>
  <text x="222" y="312" text-anchor="middle" font-size="9.5" fill="#888">s₃</text>
  <g filter="url(#sk)"><rect x="136" y="318" width="28" height="28" rx="4" fill="#fdfcf7" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="150" y="337" text-anchor="middle" font-size="14" fill="#b85450">d</text>
  <g filter="url(#sk)"><rect x="172" y="318" width="28" height="28" rx="4" fill="#fdfcf7" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="186" y="337" text-anchor="middle" font-size="14" fill="#b85450">b</text>
  <g filter="url(#sk)"><rect x="208" y="318" width="28" height="28" rx="4" fill="#fdfcf7" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="222" y="337" text-anchor="middle" font-size="14" fill="#b85450">c</text>
  <text x="290" y="328" font-size="11.5" fill="#444">首字符 d、b、c 互不相同，i = 0 处即失配</text>
  <text x="290" y="348" font-size="11.5" font-weight="bold" fill="#b85450">→ 返回 −1</text>
  <text x="320" y="356" text-anchor="middle" font-size="10.5" fill="#7a3a36">长度 ≥ 2 才能删 ⇒ 空串不可达，「全删空凑相等」这条路被堵死</text>

  <text x="320" y="396" text-anchor="middle" font-size="12" fill="#888">「目标必是公共前缀」一旦看清，剩下的只是数长度</text>
</svg>
