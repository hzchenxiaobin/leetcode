<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：删「极长元音后缀」⟺ 保「切割点左侧前缀」</text>
  <text x="320" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">被删的永远是一段后缀 s[i+1..n−1]，由切割点 i 唯一确定（V = {a,e,i,o,u}）</text>

  <!-- zone labels -->
  <text x="148" y="66" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">前缀 s[0..i]：保留</text>
  <text x="272" y="66" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">后缀 s[i+1..n−1]：删除</text>

  <!-- string boxes -->
  <text x="64" y="110" font-size="14" fill="#666" filter="url(#rough2)">s =</text>
  <rect x="92" y="76" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="112" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">i</text>
  <rect x="148" y="76" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="176" y="112" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">d</text>
  <rect x="204" y="76" width="56" height="56" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="112" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">e</text>
  <rect x="260" y="76" width="56" height="56" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="112" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">a</text>

  <!-- strikethrough on deleted vowels -->
  <line x1="208" y1="104" x2="256" y2="104" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="264" y1="104" x2="312" y2="104" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- cut line -->
  <path d="M204,70 L204,140" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="204" y="60" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">✂</text>

  <!-- indices -->
  <text x="120" y="150" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="176" y="150" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="232" y="150" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="288" y="150" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="176" y="166" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">切割点 i = 1（最右非元音）</text>

  <!-- right callouts -->
  <rect x="356" y="78" width="264" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="99" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">切割点：i = 最右侧非元音的下标</text>
  <text x="488" y="119" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">i = max{ k : s[k] ∉ V }，全元音时约定 i = −1</text>
  <rect x="356" y="144" width="264" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="488" y="165" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 前缀 s[0..i]</text>
  <text x="488" y="185" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">"idea"：i = 1 → 返回 "id"（头部 'i' 也是元音但保留）</text>

  <!-- scan trace -->
  <text x="320" y="222" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">倒序扫描轨迹（时间顺序，遇非元音即早停）：</text>
  <rect x="40" y="230" width="160" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="251" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">s[3]='a' ∈ V → 左移</text>
  <path d="M202,247 L226,247" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="230" width="160" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="251" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">s[2]='e' ∈ V → 左移</text>
  <path d="M392,247 L416,247" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="420" y="230" width="180" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="510" y="251" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">s[1]='d' ∉ V → 停！</text>
  <text x="320" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">停在 i = 1 ⇒ 返回 s[0..1] = "id"</text>

  <!-- bottom notes -->
  <rect x="60" y="300" width="520" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="319" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">为什么倒序一趟就够？</text>
  <text x="320" y="336" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">「某字符该不该删」只取决于其右侧是否全是元音——后缀性质，信息从右往左传播</text>
  <text x="320" y="348" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">遇非元音即停：更左边的字符无论是什么都与答案无关</text>
  <rect x="60" y="360" width="520" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="379" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">对照：正序单趟做不到</text>
  <text x="320" y="396" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">扫到中间某个元音时，无法知道它右侧是否还有非元音（"idea" 的 'e' 右边还有 'a'）</text>
  <text x="320" y="408" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">正序至少两趟，或先定位切割点再裁剪——「一次算出从哪里切」是最短路径</text>
</svg>
