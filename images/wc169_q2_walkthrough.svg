<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：root1 = [2,1,4]，root2 = [1,0,3]</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">表内栈内容自底向顶书写，栈顶在最右侧；「取出」列标注取自哪个栈</text>

  <rect x="50" y="66" width="464" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <path d="M 50 66 V 362" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 108 66 V 362" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 226 66 V 362" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 344 66 V 362" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 422 66 V 362" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 514 66 V 362" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <path d="M 50 96 H 514" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 50 134 H 514" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 50 172 H 514" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 50 210 H 514" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 50 248 H 514" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 50 286 H 514" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 50 324 H 514" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 50 362 H 514" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="79" y="86" text-anchor="middle" font-size="10.5" fill="#2f3f5c" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="167" y="86" text-anchor="middle" font-size="10.5" fill="#2f3f5c" font-weight="bold" filter="url(#rough2)">st1（root1）</text>
  <text x="285" y="86" text-anchor="middle" font-size="10.5" fill="#2f3f5c" font-weight="bold" filter="url(#rough2)">st2（root2）</text>
  <text x="383" y="86" text-anchor="middle" font-size="10.5" fill="#2f3f5c" font-weight="bold" filter="url(#rough2)">取出</text>
  <text x="468" y="86" text-anchor="middle" font-size="10.5" fill="#2f3f5c" font-weight="bold" filter="url(#rough2)">ans</text>

  <text x="79" y="119" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">初始</text>
  <text x="167" y="119" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2, 1</text>
  <text x="285" y="119" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1, 0</text>
  <text x="383" y="119" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>
  <text x="468" y="119" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">[]</text>

  <text x="79" y="157" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">①</text>
  <text x="167" y="157" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2, 1</text>
  <text x="285" y="157" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1, 0</text>
  <text x="383" y="157" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">0（st2）</text>
  <text x="468" y="157" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">[0]</text>

  <text x="79" y="195" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">②</text>
  <text x="167" y="195" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2, 1</text>
  <text x="285" y="195" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="383" y="195" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">1（st1）</text>
  <text x="468" y="195" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">[0, 1]</text>

  <text x="79" y="233" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">③</text>
  <text x="167" y="233" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="285" y="233" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="383" y="233" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">1（st2）</text>
  <text x="468" y="233" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">[0, 1, 1]</text>

  <text x="79" y="271" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">④</text>
  <text x="167" y="271" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="285" y="271" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="383" y="271" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">2（st1）</text>
  <text x="468" y="271" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">[0, 1, 1, 2]</text>

  <text x="79" y="309" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">⑤</text>
  <text x="167" y="309" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="285" y="309" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="383" y="309" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">3（st2）</text>
  <text x="468" y="309" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">[0, 1, 1, 2, 3]</text>

  <text x="79" y="347" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">⑥</text>
  <text x="167" y="347" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="285" y="347" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">空</text>
  <text x="383" y="347" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">4（st1）</text>
  <text x="468" y="347" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">[0, 1, 1, 2, 3, 4]</text>

  <rect x="50" y="376" width="464" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="392" font-size="10" fill="#8a6a20" filter="url(#rough2)">第 ③ 步冒出重复值 1（来自另一棵树）：照常输出，不去重。</text>
  <text x="66" y="407" font-size="10" fill="#555" filter="url(#rough2)">每轮只在两条有序流的头部做一次比较，总比较次数不超过 n₁ + n₂。</text>
</svg>
