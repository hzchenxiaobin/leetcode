<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：删掉质数 → 非质数节点裂成「孤岛」（示例 2 的树）</text>

  <!-- edges -->
  <g stroke="#999" stroke-width="1.6" filter="url(#sk)">
    <line x1="310" y1="85"  x2="185" y2="160"/>
    <line x1="310" y1="85"  x2="435" y2="160"/>
    <line x1="185" y1="160" x2="115" y2="250"/>
    <line x1="435" y1="160" x2="385" y2="250"/>
    <line x1="435" y1="160" x2="505" y2="250"/>
  </g>

  <!-- highlighted valid path 4 -> 2 -> 1 -->
  <path d="M 115 250 L 185 160 L 291 96" stroke="#d6a040" stroke-width="4" fill="none"
        stroke-linecap="round" marker-end="url(#arrO)" opacity="0.9" filter="url(#sk)"/>

  <!-- islands (dashed green bubbles around non-prime nodes) -->
  <g stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="6 4" fill="none" filter="url(#sk)">
    <ellipse cx="310" cy="85"  rx="36" ry="31"/>
    <ellipse cx="115" cy="250" rx="36" ry="31"/>
    <ellipse cx="505" cy="250" rx="36" ry="31"/>
  </g>
  <g font-size="11" fill="#4a7a3a" filter="url(#sk)">
    <text x="356" y="66">孤岛 {1}</text>
    <text x="62"  y="302">孤岛 {4}</text>
    <text x="505" y="308" text-anchor="middle">孤岛 {6}</text>
  </g>

  <!-- nodes -->
  <g filter="url(#sk)">
    <circle cx="310" cy="85"  r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="185" cy="160" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="435" cy="160" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="115" cy="250" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="385" cy="250" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="505" cy="250" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="bold" filter="url(#sk)">
    <text x="310" y="90"  fill="#2b3a52">1</text>
    <text x="185" y="165" fill="#7a3a34">2</text>
    <text x="435" y="165" fill="#7a3a34">3</text>
    <text x="115" y="255" fill="#2b3a52">4</text>
    <text x="385" y="255" fill="#7a3a34">5</text>
    <text x="505" y="255" fill="#2b3a52">6</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">
    <text x="185" y="130">质数</text>
    <text x="435" y="130">质数</text>
    <text x="385" y="290">质数</text>
  </g>

  <!-- valid path tag -->
  <g filter="url(#sk)">
    <path d="M 148 128 L 158 195" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
    <rect x="36" y="88" width="120" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="96" y="105" text-anchor="middle" font-size="11" fill="#8a6520" font-weight="bold">合法：4→2→1</text>
    <text x="96" y="121" text-anchor="middle" font-size="10.5" fill="#8a6520">恰一个质数 2 ✓</text>
  </g>

  <!-- takeaway card -->
  <rect x="40" y="326" width="600" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <g text-anchor="middle" filter="url(#sk)">
    <text x="340" y="352" font-size="12.5" fill="#2b3a52" font-weight="bold">路径 (a,b) 合法 ⟺ 恰含一个质数 p ⟺ a、b 位于 {p} ∪ 邻接孤岛 中两个不同的组</text>
    <text x="340" y="376" font-size="12" fill="#2b3a52">按 p 分类：不重不漏，每个质数的类是纯组合计数 —— 贡献 = S + (S² − Σsᵢ²)/2</text>
    <text x="340" y="400" font-size="11" fill="#556">例：4→2→1 ✓（唯一质数 2）；4 ⇝ 6 必经 2 与 3 两个质数 ✗；同一孤岛内的路径不含质数</text>
  </g>
</svg>
