<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">每个数独立换血：数位和只由它自己决定</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">不需要真的改数组：边算边更新最小值即可</text>

  <rect x="46" y="66" width="86" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="89" y="94" text-anchor="middle" font-size="14" fill="#3a4a66">10</text>
  <path d="M 132 88 L 162 88" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="162" y="66" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="186" y="94" text-anchor="middle" font-size="13" fill="#8a6a20">1</text>
  <rect x="210" y="66" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="234" y="94" text-anchor="middle" font-size="13" fill="#8a6a20">0</text>
  <path d="M 258 88 L 288 88" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="288" y="66" width="76" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="326" y="94" text-anchor="middle" font-size="14" fill="#3a5a30">1</text>
  <text x="376" y="94" font-size="10" fill="#999">1 + 0 = 1</text>

  <rect x="46" y="126" width="86" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="89" y="154" text-anchor="middle" font-size="14" fill="#3a4a66">19</text>
  <path d="M 132 148 L 162 148" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="162" y="126" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="186" y="154" text-anchor="middle" font-size="13" fill="#8a6a20">1</text>
  <rect x="210" y="126" width="48" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="234" y="154" text-anchor="middle" font-size="13" fill="#8a6a20">9</text>
  <path d="M 258 148 L 288 148" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="288" y="126" width="76" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="326" y="154" text-anchor="middle" font-size="14" fill="#3a5a30">10</text>
  <text x="376" y="154" font-size="10" fill="#999">1 + 9 = 10</text>

  <rect x="46" y="186" width="86" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="89" y="214" text-anchor="middle" font-size="14" fill="#3a4a66">199</text>
  <path d="M 132 208 L 154 208" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="154" y="186" width="40" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="174" y="214" text-anchor="middle" font-size="13" fill="#8a6a20">1</text>
  <rect x="198" y="186" width="40" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="218" y="214" text-anchor="middle" font-size="13" fill="#8a6a20">9</text>
  <rect x="242" y="186" width="40" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="262" y="214" text-anchor="middle" font-size="13" fill="#8a6a20">9</text>
  <path d="M 286 208 L 300 208" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="186" width="76" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="338" y="214" text-anchor="middle" font-size="14" fill="#3a5a30">19</text>
  <text x="388" y="214" font-size="10" fill="#999">1 + 9 + 9 = 19</text>

  <rect x="46" y="250" width="200" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="146" y="268" text-anchor="middle" font-size="10.5" fill="#8a3a36">取模拆位：s += x % 10; x /= 10</text>
  <text x="146" y="284" text-anchor="middle" font-size="10" fill="#8a3a36">每个数 O(位数)，最多 5 位（1e4）</text>

  <rect x="262" y="250" width="268" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="396" y="268" text-anchor="middle" font-size="10.5" fill="#3a5a30">答案 = min(各数位和)，只留一个变量</text>
  <text x="396" y="284" text-anchor="middle" font-size="10" fill="#3a5a30">空间 O(1)，不必构造新数组</text>

  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#555">数位和 ≤ 9 × 位数 ≤ 36（因为 nums[i] ≤ 10⁴），完全是常数级</text>
  <text x="280" y="342" text-anchor="middle" font-size="10" fill="#999">注意：是「替换后取最小」，不是「最小元素再替换」——结果一样但顺序要说清</text>
</svg>
