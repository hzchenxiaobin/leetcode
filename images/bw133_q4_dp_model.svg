<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">插入第 i 个（最大的）元素：贡献 t 个逆序对</text>

  <text x="130" y="62" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">t = 3</text>
  <text x="196" y="62" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">t = 2</text>
  <text x="276" y="62" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">t = 1</text>
  <text x="356" y="62" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">t = 0</text>

  <path d="M 130 70 L 130 112" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 196 70 L 196 112" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 276 70 L 276 112" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 356 70 L 356 112" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <rect x="130" y="120" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="120" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="290" y="120" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="146" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">a</text>
  <text x="238" y="146" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">b</text>
  <text x="318" y="146" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">c</text>

  <text x="240" y="184" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">前 i−1 = 3 个数，它们都比新元素小</text>

  <rect x="76" y="200" width="368" height="46" rx="8" fill="#ffffff" stroke="#666" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="229" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dp[i][j] = Σ_{t=0}^{min(i−1, j)} dp[i−1][j−t]</text>

  <rect x="76" y="258" width="368" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">插在越靠左，被它超过的元素越多，t 越大（0 ≤ t ≤ i−1）</text>
  <text x="260" y="300" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">每个 t 恰好对应一个位置，故 t 不重不漏</text>
</svg>
