<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">取 v = 6：禁区 [v−2, v+2]，同值例外</text>
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">数轴上标出全部出现过的伤害值，禁带内的值不可同取</text>

  <!-- forbidden zone: values 4..8, x = 124..356 -->
  <rect x="124" y="96" width="232" height="244" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"
        stroke-dasharray="7,5" rx="10" filter="url(#rough2)"/>
  <text x="240" y="118" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">禁区 [4, 8]（差 1 或差 2）</text>

  <!-- stacked same-value cards for v=6 (center x=240) -->
  <rect x="216" y="150" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <rect x="220" y="142" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <rect x="224" y="134" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="246" y="154" text-anchor="middle" font-size="14" fill="#2d4d24" filter="url(#rough2)">6</text>
  <path d="M272,142 C310,126 330,128 356,136" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <text x="432" y="136" text-anchor="middle" font-size="12" fill="#2d4d24" filter="url(#rough2)">同值互不禁用</text>
  <text x="432" y="156" text-anchor="middle" font-size="12" fill="#2d4d24" filter="url(#rough2)">全取收益 6 × 3 = 18</text>

  <!-- number line -->
  <path d="M28,300 C170,295 350,305 492,298" stroke="#8a8a8a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- value 1: compatible -->
  <rect x="22" y="262" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="281" text-anchor="middle" font-size="13" fill="#2f4358" filter="url(#rough2)">1</text>
  <text x="40" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 差5</text>

  <!-- value 3: compatible -->
  <rect x="102" y="262" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="281" text-anchor="middle" font-size="13" fill="#2f4358" filter="url(#rough2)">3</text>
  <text x="120" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 差3</text>

  <!-- value 4: forbidden, present -->
  <rect x="142" y="262" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="281" text-anchor="middle" font-size="13" fill="#7c2b28" filter="url(#rough2)">4</text>
  <text x="160" y="330" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 差2</text>

  <!-- value 5: forbidden, absent -->
  <rect x="182" y="262" width="36" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,4" rx="4" filter="url(#rough2)"/>
  <text x="200" y="281" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="200" y="330" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">未出现</text>

  <!-- current value 6: tick + connector from stacked cards -->
  <text x="240" y="252" text-anchor="middle" font-size="11" fill="#2d4d24" filter="url(#rough2)">当前值</text>
  <path d="M240,236 C240,244 240,250 240,258" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGr)" filter="url(#rough2)"/>
  <path d="M236,294 L236,306 M244,294 L244,306" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>

  <!-- value 7: forbidden, absent -->
  <rect x="262" y="262" width="36" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="281" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">未出现</text>

  <!-- value 8: forbidden, present -->
  <rect x="302" y="262" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="281" text-anchor="middle" font-size="13" fill="#7c2b28" filter="url(#rough2)">8</text>
  <text x="320" y="330" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 差2</text>

  <!-- value 11: compatible -->
  <rect x="422" y="262" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="281" text-anchor="middle" font-size="13" fill="#2f4358" filter="url(#rough2)">11</text>
  <text x="440" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 差5</text>

  <!-- summary box -->
  <rect x="48" y="356" width="424" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="377" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">同值互不禁用 → 选定一个值就全取：收益 v × cnt(v)</text>
  <text x="260" y="397" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">兼容条件：两值之差 ≥ 3（差 3 恰好安全！）</text>
</svg>
