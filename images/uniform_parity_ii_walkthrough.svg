<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="452" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：nums1 = [2, 3, 5] —— 卡死与冲突</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 三列：值与角色 -->
  <g filter="url(#rough2)">
    <rect x="88" y="58" width="60" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="118" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="118" y="122" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">最小值 · 偶</text>

  <g filter="url(#rough2)">
    <rect x="290" y="58" width="60" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="320" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="320" y="122" text-anchor="middle" font-size="11" fill="#a06a10" filter="url(#rough2)">最小奇数 · 奇</text>

  <g filter="url(#rough2)">
    <rect x="492" y="58" width="60" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="522" y="88" text-anchor="middle" font-size="18" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="522" y="122" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">更大的奇数</text>

  <!-- 三列：可选值面板 -->
  <g filter="url(#rough2)">
    <rect x="26" y="136" width="184" height="126" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
  </g>
  <text x="118" y="158" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#666" filter="url(#rough2)">可选的 nums2 值</text>
  <text x="118" y="180" text-anchor="middle" font-size="10.8" fill="#555" filter="url(#rough2)">保留：2 → 偶</text>
  <text x="118" y="200" text-anchor="middle" font-size="10.8" fill="#555" filter="url(#rough2)">更小元素：无</text>
  <text x="118" y="222" text-anchor="middle" font-size="10.8" fill="#b85450" filter="url(#rough2)">选项 B 不可用</text>
  <text x="118" y="246" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（被锁死）</text>

  <g filter="url(#rough2)">
    <rect x="228" y="136" width="184" height="126" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
  </g>
  <text x="320" y="158" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#666" filter="url(#rough2)">可选的 nums2 值</text>
  <text x="320" y="180" text-anchor="middle" font-size="10.8" fill="#555" filter="url(#rough2)">保留：3 → 奇</text>
  <text x="320" y="200" text-anchor="middle" font-size="10.8" fill="#555" filter="url(#rough2)">3 − 2 = 1 → 奇</text>
  <text x="320" y="222" text-anchor="middle" font-size="10.8" fill="#555" filter="url(#rough2)">减数只有偶数 2</text>
  <text x="320" y="246" text-anchor="middle" font-size="10.8" fill="#b85450" filter="url(#rough2)">减偶 = 白减（锁死）</text>

  <g filter="url(#rough2)">
    <rect x="430" y="136" width="184" height="126" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
  </g>
  <text x="522" y="158" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#666" filter="url(#rough2)">可选的 nums2 值</text>
  <text x="522" y="180" text-anchor="middle" font-size="10.8" fill="#555" filter="url(#rough2)">保留：5 → 奇</text>
  <text x="522" y="200" text-anchor="middle" font-size="10.8" fill="#555" filter="url(#rough2)">5 − 2 = 3 → 奇</text>
  <text x="522" y="222" text-anchor="middle" font-size="10.8" fill="#555" filter="url(#rough2)">5 − 3 = 2 → 偶</text>
  <text x="522" y="246" text-anchor="middle" font-size="10.8" fill="#2e6e2e" filter="url(#rough2)">减奇数 3 → 翻转</text>

  <!-- 三列：可达奇偶徽章 -->
  <g filter="url(#rough2)">
    <rect x="26" y="278" width="184" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="118" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">卡死：S = { 偶 }</text>

  <g filter="url(#rough2)">
    <rect x="228" y="278" width="184" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="320" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">卡死：S = { 奇 }</text>

  <g filter="url(#rough2)">
    <rect x="430" y="278" width="184" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="522" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">自由：S = { 奇, 偶 }</text>

  <!-- 交集为空 -->
  <g filter="url(#rough2)">
    <rect x="70" y="326" width="500" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="346" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">{偶} ∩ {奇} ∩ {奇,偶} = ∅ → 无公共奇偶 → false</text>

  <!-- 关键点注释 -->
  <g filter="url(#rough2)">
    <rect x="40" y="372" width="560" height="66" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="396" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">关键：5 能减更小的奇数 3 变偶（自由），救不了被锁死的 2 与 3</text>
  <text x="320" y="418" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">卡点只在最小值（锁偶）与最小奇数（锁奇）——奇偶相反即无解</text>
</svg>
