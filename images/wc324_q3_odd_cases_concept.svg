<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：奇点个数 k 定生死 —— 一条边至多修 2 个奇点，两条边封顶 4</text>
  <path d="M 200 42 Q 470 50 740 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="470" y="66" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">握手定理：度数总和 = 2m（偶）⇒ k 恒为偶数 ∈ {0, 2, 4, …}</text>

  <!-- four case cards -->
  <g filter="url(#sk)">
    <rect x="40" y="84" width="200" height="170" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="140" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">k = 0</text>
  <text x="140" y="138" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">已全部偶度</text>
  <text x="140" y="160" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">一条边都不用加</text>
  <text x="140" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">→ true ⭐</text>

  <g filter="url(#sk)">
    <rect x="260" y="84" width="200" height="170" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="360" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a66" filter="url(#sk)">k = 2</text>
  <text x="360" y="138" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">奇点 u、v</text>
  <text x="360" y="160" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">① (u,v) 非边：直连</text>
  <text x="360" y="182" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">② (u,v) 已是边：</text>
  <text x="360" y="204" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">借道中间点 x，加</text>
  <text x="360" y="226" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">(u,x) 与 (x,v) 两条</text>

  <g filter="url(#sk)">
    <rect x="480" y="84" width="200" height="170" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="580" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#sk)">k = 4</text>
  <text x="580" y="138" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">奇点 a、b、c、d</text>
  <text x="580" y="160" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">三种两两配对：</text>
  <text x="580" y="182" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">ab|cd、ac|bd、ad|bc</text>
  <text x="580" y="204" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">任一配对的两条边</text>
  <text x="580" y="226" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">均为非边 → true</text>

  <g filter="url(#sk)">
    <rect x="700" y="84" width="200" height="170" rx="10" fill="#fdeaea" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="800" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a34" filter="url(#sk)">k ≥ 6</text>
  <text x="800" y="138" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">奇点太多</text>
  <text x="800" y="160" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">两条边至多消 4 个</text>
  <text x="800" y="182" text-anchor="middle" font-size="12" fill="#444" filter="url(#sk)">奇点，修不完</text>
  <text x="800" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">→ false ✗</text>

  <!-- bottom-left: parity effect of one edge -->
  <g filter="url(#sk)">
    <rect x="40" y="278" width="440" height="252" rx="10" fill="#eef3f9" stroke="#7a94b8" stroke-width="1.5"/>
  </g>
  <text x="60" y="306" font-size="14" font-weight="bold" fill="#2b4a66" filter="url(#sk)">一条边 (u,v) 的奇偶效应</text>

  <g filter="url(#sk)">
    <circle cx="88" cy="338" r="13" fill="#fdeaea" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="88" y="342" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#sk)">奇</text>
  <g filter="url(#sk)">
    <circle cx="146" cy="338" r="13" fill="#fdeaea" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="146" y="342" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#sk)">奇</text>
  <path d="M 101 338 L 133 338" stroke="#555" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="184" y="334" font-size="12" fill="#444" filter="url(#sk)">两端都奇：奇点 −2</text>
  <text x="184" y="352" font-size="11" fill="#4a8e4a" filter="url(#sk)">唯一「净修理」的连法 ✓</text>

  <g filter="url(#sk)">
    <circle cx="88" cy="390" r="13" fill="#fdeaea" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="88" y="394" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#sk)">奇</text>
  <g filter="url(#sk)">
    <circle cx="146" cy="390" r="13" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="146" y="394" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">偶</text>
  <path d="M 101 390 L 133 390" stroke="#555" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="184" y="386" font-size="12" fill="#444" filter="url(#sk)">一奇一偶：奇点不变</text>
  <text x="184" y="404" font-size="11" fill="#888" filter="url(#sk)">奇点只是搬了个家</text>

  <g filter="url(#sk)">
    <circle cx="88" cy="442" r="13" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="88" y="446" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">偶</text>
  <g filter="url(#sk)">
    <circle cx="146" cy="442" r="13" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="146" y="446" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">偶</text>
  <path d="M 101 442 L 133 442" stroke="#555" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="184" y="438" font-size="12" fill="#444" filter="url(#sk)">两端都偶：奇点 +2</text>
  <text x="184" y="456" font-size="11" fill="#b85450" filter="url(#sk)">帮倒忙，白费一条边 ✗</text>

  <text x="60" y="502" font-size="11" fill="#666" filter="url(#sk)">把「加哪条边」抬升为「k 变多少」，n⁴ 搜索坍缩为 O(1) 分类</text>

  <!-- bottom-right: middleman detour -->
  <g filter="url(#sk)">
    <rect x="500" y="278" width="400" height="252" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="520" y="306" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">k=2 且 (u,v) 已是边：借道中间点 x</text>

  <path d="M 600 380 L 800 380" stroke="#555" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="700" y="370" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">已有边，不能重加</text>

  <g filter="url(#sk)">
    <circle cx="580" cy="380" r="20" fill="#fdeaea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="580" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#sk)">u</text>
  <g filter="url(#sk)">
    <circle cx="820" cy="380" r="20" fill="#fdeaea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="820" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#sk)">v</text>
  <g filter="url(#sk)">
    <circle cx="700" cy="440" r="20" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="700" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">x</text>

  <path d="M 594 393 L 686 428" stroke="#4a8e4a" stroke-width="2.2" stroke-dasharray="7,5" fill="none" filter="url(#sk)"/>
  <path d="M 714 428 L 806 393" stroke="#4a8e4a" stroke-width="2.2" stroke-dasharray="7,5" fill="none" filter="url(#sk)"/>
  <text x="612" y="408" font-size="10" fill="#2e6e2e" filter="url(#sk)">新加</text>
  <text x="760" y="408" font-size="10" fill="#2e6e2e" filter="url(#sk)">新加</text>

  <text x="700" y="482" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">u、v 各翻一次变偶；x 翻两次，奇偶不变</text>
  <text x="700" y="506" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">要求 x ≠ u,v 且与 u、v 均不相邻（孤立点最好）</text>
</svg>
