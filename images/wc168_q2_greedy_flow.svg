<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="490" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 计数 + 从最小值强制配对</text>
  <text x="300" y="45" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">每个值只会被「起头」一次，两处失败出口都能立刻判 false</text>

  <rect x="150" y="62" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="81" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">输入 nums，k</text>

  <path d="M 250 90 L 250 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="250,114 380,144 250,174 120,144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="149" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">n % k == 0 ?</text>

  <path d="M 380 144 L 452 144" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="458" y="128" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="518" y="148" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">false（快速失败）</text>

  <text x="256" y="190" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 250 174 L 250 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="200" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="220" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">排序 + 统计每个值的份数 cnt</text>

  <path d="M 250 230 L 250 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="254" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="274" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">取最小未用值 x（cnt[x] &gt; 0）</text>

  <path d="M 250 284 L 250 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="250,312 400,342 250,372 100,342" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="347" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">x … x+k−1 的份数都 ≥ cnt[x] ?</text>

  <path d="M 400 342 L 452 342" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="458" y="326" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="518" y="346" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">false（中间缺值）</text>

  <text x="256" y="388" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 250 372 L 250 394" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="396" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="416" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">c = cnt[x]，x … x+k−1 各减 c</text>

  <path d="M 140 411 L 95 411 L 95 269 L 136 269" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="74" y="424" font-size="9.5" fill="#446688" filter="url(#rough2)">循环</text>

  <path d="M 250 426 L 250 444" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="446" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="466" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">全部份数归零 ⇒ 返回 true</text>
</svg>
