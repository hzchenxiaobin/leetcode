<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="390" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：一趟建桶，「频次 = 数值」一票定夺</text>
  <path d="M 120 40 Q 320 50 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 原数组 -->
  <text x="46" y="84" font-size="11" fill="#888">原数组：</text>
  <g filter="url(#sk)"><rect x="110" y="64" width="54" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="137" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="172" y="64" width="54" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="199" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="234" y="64" width="54" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="261" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><rect x="296" y="64" width="54" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="323" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">4</text>
  <text x="366" y="84" font-size="11" fill="#888">（arr = [2,2,3,4]）</text>

  <!-- 建桶箭头 -->
  <path d="M 320 102 L 320 126" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="330" y="120" font-size="11" fill="#888">一趟扫描：元素 v 落进下标 v 的桶</text>

  <!-- 桶 -->
  <text x="40" y="158" font-size="11" fill="#888">桶 cnt[]：</text>
  <g filter="url(#sk)"><rect x="110" y="136" width="54" height="32" rx="4" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.3"/></g>
  <text x="137" y="157" text-anchor="middle" font-size="13" fill="#6a7a90">0</text>
  <g filter="url(#sk)"><rect x="172" y="136" width="54" height="32" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="199" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="234" y="136" width="54" height="32" rx="4" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.3"/></g>
  <text x="261" y="157" text-anchor="middle" font-size="13" fill="#6a7a90">1</text>
  <g filter="url(#sk)"><rect x="296" y="136" width="54" height="32" rx="4" fill="#eef1f5" stroke="#8a9ab0" stroke-width="1.3"/></g>
  <text x="323" y="157" text-anchor="middle" font-size="13" fill="#6a7a90">1</text>
  <text x="380" y="152" font-size="11" fill="#888">值域 [1,500]，本题只用到</text>
  <text x="380" y="168" font-size="11" fill="#888">1–4 号桶，其余全 0</text>

  <!-- 下标标注 -->
  <g font-size="10.5" fill="#666" text-anchor="middle">
    <text x="137" y="182">下标 1</text>
    <text x="199" y="182">下标 2</text>
    <text x="261" y="182">下标 3</text>
    <text x="323" y="182">下标 4</text>
  </g>

  <!-- 判定行 -->
  <text x="137" y="206" text-anchor="middle" font-size="11.5" fill="#8a9ab0">≠ 1 ✗</text>
  <text x="199" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">= 2 ✓</text>
  <text x="261" y="206" text-anchor="middle" font-size="11.5" fill="#8a9ab0">≠ 3 ✗</text>
  <text x="323" y="206" text-anchor="middle" font-size="11.5" fill="#8a9ab0">≠ 4 ✗</text>
  <ellipse cx="199" cy="202" rx="30" ry="13" fill="none" stroke="#4a8e4a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="199" y="226" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">幸运数！</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="50" y="240" width="540" height="130" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="320" y="266" text-anchor="middle" font-size="12.5" fill="#5a4a20">✓ 判定谓词：cnt[v] == v —— 桶的下标与内容撞个正着，v 才是幸运数</text>
  <text x="320" y="294" text-anchor="middle" font-size="12.5" fill="#5a4a20">✓ 建桶一趟 O(n)，判定一趟 O(500) —— 频次统计与频次判定解耦</text>
  <text x="320" y="322" text-anchor="middle" font-size="12.5" fill="#5a4a20">✓ 值域是常数 ⟹ 下标即值、O(1) 直访，无需哈希函数</text>
  <text x="320" y="350" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">多个幸运数取最大；一个都没有（如 {2:3, 3:2} 交叉错位）→ 返回 −1</text>
</svg>
