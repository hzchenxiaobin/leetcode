<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="36" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">示例演算：dp(0, 4, 0) 的决策链（[1,2,1,2,1] → 11）</text>

  <rect x="60" y="64" width="540" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="86" y="85" font-size="13" fill="#223" filter="url(#rough2)">状态 dp(l, r, k)</text>
  <text x="280" y="85" font-size="13" fill="#223" filter="url(#rough2)">决策（取最大）</text>
  <text x="560" y="85" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">值</text>

  <rect x="60" y="96" width="540" height="34" fill="#ffffff" stroke="#ccd6e0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="118" font-size="12" fill="#333" filter="url(#rough2)">dp(0, 4, 0)</text>
  <text x="280" y="118" font-size="12" fill="#333" filter="url(#rough2)">② 与下标 2 的 1 合并</text>
  <text x="560" y="118" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">11</text>

  <rect x="60" y="130" width="540" height="34" fill="#ffffff" stroke="#ccd6e0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="152" font-size="12" fill="#333" filter="url(#rough2)">dp(0, 2, 1)</text>
  <text x="280" y="152" font-size="12" fill="#333" filter="url(#rough2)">② 与下标 0 的 1 合并</text>
  <text x="560" y="152" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">10</text>

  <rect x="60" y="164" width="540" height="34" fill="#ffffff" stroke="#ccd6e0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="186" font-size="12" fill="#333" filter="url(#rough2)">dp(0, 0, 2)</text>
  <text x="280" y="186" font-size="12" fill="#333" filter="url(#rough2)">① 一次消 3 个 1（3² = 9）</text>
  <text x="560" y="186" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">9</text>

  <rect x="60" y="198" width="540" height="34" fill="#ffffff" stroke="#ccd6e0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="220" font-size="12" fill="#333" filter="url(#rough2)">dp(1, 1, 0)</text>
  <text x="280" y="220" font-size="12" fill="#333" filter="url(#rough2)">① 单独消 1 个 2（1² = 1）</text>
  <text x="560" y="220" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="60" y="232" width="540" height="34" fill="#ffffff" stroke="#ccd6e0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="254" font-size="12" fill="#333" filter="url(#rough2)">dp(3, 3, 0)</text>
  <text x="280" y="254" font-size="12" fill="#333" filter="url(#rough2)">① 单独消 1 个 2（1² = 1）</text>
  <text x="560" y="254" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="60" y="286" width="540" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="76" y="310" font-size="12" fill="#444" filter="url(#rough2)">对照：不带 k 的纯区间 DP 只能给出 5（五段各自单消），比正解少 6</text>
  <text x="76" y="334" font-size="12" fill="#444" filter="url(#rough2)">这 6 分正是「先攒后消」的收益，k 维就是把这笔收益记在账上</text>

  <text x="330" y="374" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">执行顺序：消下标 1 的 2 → 消下标 3 的 2 → 三个 1 一次消掉（3² = 9）</text>
</svg>
