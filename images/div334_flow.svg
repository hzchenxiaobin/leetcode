<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="660" height="560" fill="#fafafa"/>

  <text x="330" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一趟扫描，余数滚动</text>
  <path d="M 165 45 Q 330 53 495 45" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="270" y="62" width="120" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="330" y="84" text-anchor="middle" font-size="13" fill="#2c4d70" filter="url(#rough2)">开始</text>
  <path d="M 330 96 L 330 112" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="245" y="116" width="170" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="330" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">初始化</text>
  <text x="330" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">r = 0（空前缀余数）</text>
  <path d="M 330 160 L 330 176" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 i < n ? -->
  <g filter="url(#rough)">
    <polygon points="330,180 410,220 330,260 250,220" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="330" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6210" filter="url(#rough2)">还有字符吗？</text>
  <text x="330" y="243" text-anchor="middle" font-size="12" fill="#8a6210" filter="url(#rough2)">i &lt; n</text>

  <!-- 否 → 返回 -->
  <path d="M 410 220 L 500 220" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="212" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="504" y="200" width="120" height="40" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="564" y="225" text-anchor="middle" font-size="13" fill="#2c4d70" filter="url(#rough2)">返回 div</text>

  <!-- 是 ↓ -->
  <path d="M 330 260 L 330 278" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="274" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 取位 -->
  <g filter="url(#rough2)">
    <rect x="245" y="282" width="170" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="330" y="307" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d = word[i] − '0'</text>
  <path d="M 330 322 L 330 338" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 递推 -->
  <g filter="url(#rough)">
    <rect x="205" y="342" width="250" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <text x="330" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6210" filter="url(#rough2)">余数滚动（核心一步）</text>
  <text x="330" y="382" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">r = (r × 10 + d) mod m</text>
  <path d="M 330 390 L 330 406" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 r == 0 ? -->
  <g filter="url(#rough)">
    <polygon points="330,410 400,446 330,482 260,446" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="330" y="451" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3a36" filter="url(#rough2)">r == 0 ?</text>

  <!-- 是 → div[i]=1 -->
  <path d="M 260 446 L 180 446" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="438" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="60" y="426" width="120" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="120" y="451" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24" filter="url(#rough2)">div[i] = 1</text>

  <!-- 否 → div[i]=0 -->
  <path d="M 400 446 L 480 446" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="438" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="484" y="426" width="120" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="544" y="451" text-anchor="middle" font-size="13" fill="#8f3a36" filter="url(#rough2)">div[i] = 0</text>

  <!-- 回边：i++ 回到循环判断 -->
  <path d="M 120 466 L 120 516 Q 120 528 132 528 L 330 528 Q 342 528 342 516 L 342 260" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 342 262 L 336 274 L 348 274 z" fill="#3a3a3a" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="180" y="512" width="140" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="250" y="533" text-anchor="middle" font-size="13" fill="#2c4d70" filter="url(#rough2)">i++，继续下一位</text>

  <text x="330" y="552" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">每位只做一次乘、一次加、一次取模 —— 整体 O(n)</text>
</svg>
