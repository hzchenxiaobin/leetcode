<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="230" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：每组测试 O(n + m)</text>
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">只有「枚举 x」这一步与答案有关，前两步只是预处理</text>

  <rect x="14" y="72" width="118" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="73" y="98" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 + 桶计数</text>
  <text x="73" y="120" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">cnt[v]</text>

  <rect x="156" y="72" width="118" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="215" y="98" text-anchor="middle" font-size="13" fill="#2f5424" filter="url(#rough2)">后缀和</text>
  <text x="215" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">suf[v] = #{a ≥ v}</text>

  <rect x="298" y="72" width="118" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="357" y="98" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">枚举 x = 1..m</text>
  <text x="357" y="120" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">O(m)</text>

  <rect x="440" y="72" width="106" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="493" y="98" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">取最大值</text>
  <text x="493" y="120" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">ans = max(…)</text>

  <path d="M136,104 L150,104" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M278,104 L292,104" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M420,104 L434,104" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="160" width="440" height="54" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans = max over x of  suf[x] + cnt[2x]</text>
  <text x="280" y="202" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2x &gt; m 时 cnt[2x] 记 0，答案不超过 2n</text>
</svg>
