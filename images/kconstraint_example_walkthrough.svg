<svg xmlns="http://www.w3.org/2000/svg" width="680" height="460" viewBox="0 0 680 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="460" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：s = "10101"、k = 1</text>
  <path d="M 190 44 Q 340 52 490 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="41" y="105" width="588" height="40" fill="#fff8e1"/></g>
  <g filter="url(#sk)"><rect x="40" y="70" width="590" height="34" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>

  <g filter="url(#sk)" stroke="#b0b8c0" stroke-width="1">
    <line x1="40" y1="104" x2="630" y2="104"/>
    <line x1="40" y1="144" x2="630" y2="144"/>
    <line x1="40" y1="184" x2="630" y2="184"/>
    <line x1="40" y1="224" x2="630" y2="224"/>
    <line x1="40" y1="264" x2="630" y2="264"/>
    <line x1="40" y1="304" x2="630" y2="304"/>
    <line x1="86" y1="70" x2="86" y2="304"/>
    <line x1="136" y1="70" x2="136" y2="304"/>
    <line x1="304" y1="70" x2="304" y2="304"/>
    <line x1="416" y1="70" x2="416" y2="304"/>
    <line x1="464" y1="70" x2="464" y2="304"/>
    <line x1="512" y1="70" x2="512" y2="304"/>
    <line x1="568" y1="70" x2="568" y2="304"/>
  </g>
  <g filter="url(#sk)"><rect x="40" y="70" width="590" height="234" fill="none" stroke="#8a97a5" stroke-width="1.4"/></g>

  <g filter="url(#sk)" font-size="11" font-weight="bold" fill="#33506b" text-anchor="middle">
    <text x="63" y="91">right</text>
    <text x="111" y="91">s[right]</text>
    <text x="220" y="91">收缩动作</text>
    <text x="360" y="91">收敛窗口</text>
    <text x="444" y="91">zeros</text>
    <text x="488" y="91">ones</text>
    <text x="540" y="91">贡献</text>
    <text x="599" y="91">ans</text>
  </g>

  <g filter="url(#sk)" font-size="11" fill="#444" text-anchor="middle">
    <text x="63" y="129">0</text><text x="111" y="129">1</text><text x="220" y="129">—</text><text x="360" y="129">[0,0]「1」</text><text x="444" y="129">0</text><text x="488" y="129">1</text><text x="540" y="129">+1</text><text x="599" y="129">1</text>
    <text x="63" y="169">1</text><text x="111" y="169">0</text><text x="220" y="169">—</text><text x="360" y="169">[0,1]「10」</text><text x="444" y="169">1</text><text x="488" y="169">1</text><text x="540" y="169">+2</text><text x="599" y="169">3</text>
  </g>
  <g filter="url(#sk)"><rect x="42" y="186" width="586" height="36" fill="none" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#sk)" font-size="11" text-anchor="middle">
    <text x="63" y="209" fill="#7a5415" font-weight="bold">2</text>
    <text x="111" y="209" fill="#444">1</text>
    <text x="220" y="209" fill="#7a5415">只超 ones 一边，不收缩</text>
    <text x="360" y="209" fill="#444">[0,2]「101」</text>
    <text x="444" y="209" fill="#444">1</text>
    <text x="488" y="209" fill="#b03a3a" font-weight="bold">2</text>
    <text x="540" y="209" fill="#2e6e2e" font-weight="bold">+3</text>
    <text x="599" y="209" fill="#2e6e2e" font-weight="bold">6</text>
  </g>
  <g filter="url(#sk)" font-size="11" fill="#444" text-anchor="middle">
    <text x="63" y="249">3</text><text x="111" y="249">0</text><text x="220" y="249" fill="#b03a3a">[0,3] 两侧都超 → left=1</text><text x="360" y="249">[1,3]「010」</text><text x="444" y="249">2</text><text x="488" y="249">1</text><text x="540" y="249" fill="#2e6e2e" font-weight="bold">+3</text><text x="599" y="249" fill="#2e6e2e" font-weight="bold">9</text>
    <text x="63" y="289">4</text><text x="111" y="289">1</text><text x="220" y="289" fill="#b03a3a">[1,4] 两侧都超 → left=2</text><text x="360" y="289">[2,4]「101」</text><text x="444" y="289">1</text><text x="488" y="289">2</text><text x="540" y="289" fill="#2e6e2e" font-weight="bold">+3</text><text x="599" y="289" fill="#2e6e2e" font-weight="bold">12</text>
  </g>

  <g filter="url(#sk)"><rect x="40" y="324" width="590" height="112" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="62" y="350" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">合计：1 + 2 + 3 + 3 + 3 = 12 ✓</text>
  <text x="62" y="374" font-size="11" fill="#444" filter="url(#sk)">交叉验证：全部子串共 5×6÷2 = 15 个；坏子串恰为 "1010"、"10101"、"0101" 共 3 个</text>
  <text x="62" y="398" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">15 − 3 = 12 ✓</text>
  <text x="62" y="422" font-size="11" fill="#7a5415" filter="url(#sk)">第 3 行正是 &amp;&amp; 的意义：ones=2&gt;1 但 zeros=1≤1 → 合法，不收缩</text>
</svg>
