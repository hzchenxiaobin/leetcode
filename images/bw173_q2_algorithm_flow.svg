<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333">算法流程</text>

  <rect x="150" y="46" width="260" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="13" fill="#333">r 从 0 到 n−1：cnt[nums[r]]++</text>

  <path d="M280,88 L280,112" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="112" width="260" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="13" fill="#333">首次出现 → sum += nums[r]</text>

  <path d="M280,154 L280,178" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="280,178 410,206 280,234 150,206" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="12" fill="#333">sum − (cnt=1 ? nums[l] : 0) ≥ k ?</text>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#b85450">是 → 移除 nums[l]，l++</text>

  <path d="M280,234 L280,258" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="258" width="260" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#333">若 sum ≥ k：ans = min(ans, r − l + 1)</text>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a">循环结束后按哨兵值判断是否返回 −1</text>
  <path d="M410,206 Q470,206 470,120 Q470,68 412,68" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480" y="150" font-size="11" fill="#b85450">继续收缩</text>
</svg>
