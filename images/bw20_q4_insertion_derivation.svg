<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="166"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">插入法：在 (n−1) 对的合法序列里给 P_n、D_n 挑两个位置</text>

  <!-- n=2 的例子：从 (P1,D1) 出发 -->
  <text x="280" y="62" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 2：已有序列 (P₁, D₁)，往长为 4 的序列中选 2 个位置</text>

  <!-- 4 个空槽 -->
  <g filter="url(#rough2)" font-size="13" fill="#7a5c1e" text-anchor="middle">
    <rect x="140" y="80" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <rect x="210" y="80" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <rect x="280" y="80" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <rect x="350" y="80" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="175" y="103">位置 1</text><text x="245" y="103">位置 2</text>
    <text x="315" y="103">位置 3</text><text x="385" y="103">位置 4</text>
  </g>
  <text x="280" y="140" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">P₂ 放前面的选中位、D₂ 放后面的选中位：共 C(4,2) = 6 种</text>

  <!-- 三个示例 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="60" y="160" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="125" y="182">(P₂, P₁, D₂, D₁)</text>
    <rect x="215" y="160" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="280" y="182">(P₁, P₂, D₁, D₂)</text>
    <rect x="370" y="160" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="435" y="182">(P₁, D₁, P₂, D₂)</text>
  </g>
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">P₂ 在 D₂ 前自动成立；剩下的位置仍按原顺序放 (P₁, D₁) → 新序列依然合法</text>

  <!-- 双向箭头：一一对应 -->
  <path d="M 180 236 L 340 236" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 252 L 180 252" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="247" font-size="12" fill="#446688" filter="url(#rough2)">删掉 P₂、D₂ 是逆操作</text>
  <text x="110" y="247" font-size="12" fill="#446688" filter="url(#rough2)">一一对应</text>

  <!-- 递推框 -->
  <rect x="60" y="276" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="15" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">f(n) = f(n−1) × C(2n, 2) = f(n−1) × n(2n−1)</text>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">一般地：长 2(n−1) 的合法序列扩到长 2n，恰好等于 C(2n,2) 种插入方式</text>

  <rect x="60" y="338" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">n = 500 只需从 f(1) = 1 连乘到 500，全程对 10⁹+7 取模</text>
</svg>
