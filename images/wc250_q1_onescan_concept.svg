<svg xmlns="http://www.w3.org/2000/svg" width="620" height="510" viewBox="0 0 620 510" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="510" fill="#fdfcf7"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：破损表只建一次，字符流一趟判定</text>
  <path d="M 150 40 Q 310 50 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="30" y="58" width="200" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="130" y="79" text-anchor="middle" font-size="13" fill="#2b5d8e" font-family="monospace" font-weight="bold">brokenLetters = "ad"</text>
  <path d="M 130 90 L 130 106" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="42" y="110" width="20" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="62" y="110" width="20" height="24" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1"/>
    <rect x="82" y="110" width="20" height="24" fill="#f7f7f5" stroke="#b0b0a8" stroke-width="1"/>
    <rect x="102" y="110" width="20" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="122" y="110" width="440" height="24" fill="none" stroke="#b0b0a8" stroke-width="1"/>
  </g>
  <text x="52" y="126" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">a</text>
  <text x="72" y="126" text-anchor="middle" font-size="10.5" fill="#777">b</text>
  <text x="92" y="126" text-anchor="middle" font-size="10.5" fill="#777">c</text>
  <text x="112" y="126" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">d</text>
  <text x="180" y="126" text-anchor="middle" font-size="10.5" fill="#999">· · ·</text>
  <text x="360" y="126" text-anchor="middle" font-size="10.5" fill="#999">· · ·</text>
  <text x="552" y="126" text-anchor="middle" font-size="10.5" fill="#777">z</text>
  <text x="310" y="152" text-anchor="middle" font-size="11" fill="#666">长度 26 的布尔数组一次建表（a、d 为 T，其余 F），此后每个字符 O(1) 查表</text>

  <text x="30" y="188" font-size="12.5" fill="#2b2b2b" font-weight="bold">字符流（单词由单个空格分隔，无首尾空格）：</text>

  <g filter="url(#sk)">
    <rect x="62" y="200" width="36" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="98" y="200" width="36" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="134" y="200" width="36" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="170" y="200" width="36" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="206" y="200" width="36" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="242" y="200" width="36" height="36" rx="4" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.8" stroke-dasharray="5,3"/>
    <rect x="278" y="200" width="36" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="314" y="200" width="36" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="350" y="200" width="36" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="386" y="200" width="36" height="36" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="422" y="200" width="36" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="80" y="224" text-anchor="middle" font-size="15" fill="#2f5d2f" font-weight="bold">h</text>
  <text x="116" y="224" text-anchor="middle" font-size="15" fill="#2f5d2f" font-weight="bold">e</text>
  <text x="152" y="224" text-anchor="middle" font-size="15" fill="#2f5d2f" font-weight="bold">l</text>
  <text x="188" y="224" text-anchor="middle" font-size="15" fill="#2f5d2f" font-weight="bold">l</text>
  <text x="224" y="224" text-anchor="middle" font-size="15" fill="#2f5d2f" font-weight="bold">o</text>
  <text x="260" y="224" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold">␣</text>
  <text x="296" y="224" text-anchor="middle" font-size="15" fill="#2f5d2f" font-weight="bold">w</text>
  <text x="332" y="224" text-anchor="middle" font-size="15" fill="#2f5d2f" font-weight="bold">o</text>
  <text x="368" y="224" text-anchor="middle" font-size="15" fill="#2f5d2f" font-weight="bold">r</text>
  <text x="404" y="224" text-anchor="middle" font-size="15" fill="#2f5d2f" font-weight="bold">l</text>
  <text x="440" y="224" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">d</text>

  <g font-size="12" text-anchor="middle" font-weight="bold">
    <text x="80" y="252" fill="#4a8e4a">✓</text>
    <text x="116" y="252" fill="#4a8e4a">✓</text>
    <text x="152" y="252" fill="#4a8e4a">✓</text>
    <text x="188" y="252" fill="#4a8e4a">✓</text>
    <text x="224" y="252" fill="#4a8e4a">✓</text>
    <text x="260" y="252" fill="#c98a2b">↓</text>
    <text x="296" y="252" fill="#4a8e4a">✓</text>
    <text x="332" y="252" fill="#4a8e4a">✓</text>
    <text x="368" y="252" fill="#4a8e4a">✓</text>
    <text x="404" y="252" fill="#4a8e4a">✓</text>
    <text x="440" y="252" fill="#b85450">✗</text>
  </g>

  <g filter="url(#sk)">
    <rect x="192" y="262" width="136" height="46" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#8f6b1f">空格：结算上一单词</text>
  <text x="260" y="297" text-anchor="middle" font-size="11" fill="#8f6b1f" font-family="monospace" font-weight="bold">ans += ok; ok = true</text>

  <path d="M 470 218 Q 500 218 500 240 L 500 276 Q 500 285 490 285 L 330 285" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="512" y="240" font-size="11" fill="#b85450" font-weight="bold">d 命中破损</text>
  <text x="512" y="256" font-size="11" fill="#b85450" font-family="monospace">ok = false</text>

  <g filter="url(#sk)">
    <rect x="30" y="330" width="180" height="88" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="120" y="352" text-anchor="middle" font-size="12.5" fill="#2f5d2f" font-weight="bold">字母字符 c</text>
  <text x="120" y="372" text-anchor="middle" font-size="11.5" fill="#2f5d2f" font-family="monospace">broken[c-'a'] ?</text>
  <text x="120" y="390" text-anchor="middle" font-size="11.5" fill="#2f5d2f" font-family="monospace">命中 → ok = false</text>
  <text x="120" y="408" text-anchor="middle" font-size="10" fill="#4a8e4a">该词报废，后续字符可不查</text>

  <g filter="url(#sk)">
    <rect x="220" y="330" width="180" height="88" rx="8" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="310" y="352" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">空格字符</text>
  <text x="310" y="372" text-anchor="middle" font-size="11.5" fill="#7a5415" font-family="monospace">ans += ok</text>
  <text x="310" y="390" text-anchor="middle" font-size="11.5" fill="#7a5415" font-family="monospace">ok = true</text>
  <text x="310" y="408" text-anchor="middle" font-size="10" fill="#c98a2b">单词边界：结算并复位</text>

  <g filter="url(#sk)">
    <rect x="410" y="330" width="180" height="88" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="500" y="352" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">扫描结束（末尾补结算）</text>
  <text x="500" y="372" text-anchor="middle" font-size="11.5" fill="#b85450" font-family="monospace">ans += ok</text>
  <text x="500" y="390" text-anchor="middle" font-size="10" fill="#b85450">最后一个单词后面</text>
  <text x="500" y="406" text-anchor="middle" font-size="10" fill="#b85450">没有空格，漏补即漏数！</text>

  <g filter="url(#sk)">
    <rect x="30" y="440" width="560" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="310" y="461" text-anchor="middle" font-size="11.5" fill="#2b5d8e">不变的小集合一次建表：每次 O(B) 的线性查找固化为 O(1) 查询</text>
  <text x="310" y="480" text-anchor="middle" font-size="11.5" fill="#2b5d8e">空格即单词边界：无需 split，一趟扫描天然流式；末尾补结算是唯一陷阱</text>
</svg>
