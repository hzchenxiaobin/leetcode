<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="960" height="470" fill="#fafafa"/>
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：棋盘染色把「步数奇偶」钉死在格子上</text>
  <path d="M 260 44 Q 480 52 700 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 4x4 checkerboard, cell 66x54, origin (80, 96) ===== -->
  <g font-size="9" fill="#888">
    <text x="72" y="88" text-anchor="middle">j=0</text>
    <text x="138" y="88" text-anchor="middle">j=1</text>
    <text x="204" y="88" text-anchor="middle">j=2</text>
    <text x="270" y="88" text-anchor="middle">j=3</text>
    <text x="70" y="127" text-anchor="end">i=0</text>
    <text x="70" y="181" text-anchor="end">i=1</text>
    <text x="70" y="235" text-anchor="end">i=2</text>
    <text x="70" y="289" text-anchor="end">i=3</text>
  </g>

  <!-- Row 0 -->
  <g filter="url(#sk)"><rect x="80" y="96" width="66" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="85" y="108" font-size="8" fill="#999" filter="url(#sk)">i+j=0</text>
  <text x="113" y="133" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#sk)">1s</text>
  <g filter="url(#sk)"><rect x="146" y="96" width="66" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="151" y="108" font-size="8" fill="#999" filter="url(#sk)">i+j=1</text>
  <text x="179" y="133" text-anchor="middle" font-size="16" font-weight="bold" fill="#a87820" filter="url(#sk)">2s</text>
  <g filter="url(#sk)"><rect x="212" y="96" width="66" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="217" y="108" font-size="8" fill="#999" filter="url(#sk)">i+j=2</text>
  <text x="245" y="133" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#sk)">1s</text>
  <g filter="url(#sk)"><rect x="278" y="96" width="66" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="283" y="108" font-size="8" fill="#999" filter="url(#sk)">i+j=3</text>
  <text x="311" y="133" text-anchor="middle" font-size="16" font-weight="bold" fill="#a87820" filter="url(#sk)">2s</text>

  <!-- Row 1 -->
  <g filter="url(#sk)"><rect x="80" y="150" width="66" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="85" y="162" font-size="8" fill="#999" filter="url(#sk)">i+j=1</text>
  <text x="113" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#a87820" filter="url(#sk)">2s</text>
  <g filter="url(#sk)"><rect x="146" y="150" width="66" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="151" y="162" font-size="8" fill="#999" filter="url(#sk)">i+j=2</text>
  <text x="179" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#sk)">1s</text>
  <g filter="url(#sk)"><rect x="212" y="150" width="66" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="217" y="162" font-size="8" fill="#999" filter="url(#sk)">i+j=3</text>
  <text x="245" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#a87820" filter="url(#sk)">2s</text>
  <g filter="url(#sk)"><rect x="278" y="150" width="66" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="283" y="162" font-size="8" fill="#999" filter="url(#sk)">i+j=4</text>
  <text x="311" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#sk)">1s</text>

  <!-- Row 2 -->
  <g filter="url(#sk)"><rect x="80" y="204" width="66" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="85" y="216" font-size="8" fill="#999" filter="url(#sk)">i+j=2</text>
  <text x="113" y="241" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#sk)">1s</text>
  <g filter="url(#sk)"><rect x="146" y="204" width="66" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="151" y="216" font-size="8" fill="#999" filter="url(#sk)">i+j=3</text>
  <text x="179" y="241" text-anchor="middle" font-size="16" font-weight="bold" fill="#a87820" filter="url(#sk)">2s</text>
  <g filter="url(#sk)"><rect x="212" y="204" width="66" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="217" y="216" font-size="8" fill="#999" filter="url(#sk)">i+j=4</text>
  <text x="245" y="241" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#sk)">1s</text>
  <g filter="url(#sk)"><rect x="278" y="204" width="66" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="283" y="216" font-size="8" fill="#999" filter="url(#sk)">i+j=5</text>
  <text x="311" y="241" text-anchor="middle" font-size="16" font-weight="bold" fill="#a87820" filter="url(#sk)">2s</text>

  <!-- Row 3 -->
  <g filter="url(#sk)"><rect x="80" y="258" width="66" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="85" y="270" font-size="8" fill="#999" filter="url(#sk)">i+j=3</text>
  <text x="113" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#a87820" filter="url(#sk)">2s</text>
  <g filter="url(#sk)"><rect x="146" y="258" width="66" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="151" y="270" font-size="8" fill="#999" filter="url(#sk)">i+j=4</text>
  <text x="179" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#sk)">1s</text>
  <g filter="url(#sk)"><rect x="212" y="258" width="66" height="54" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="217" y="270" font-size="8" fill="#999" filter="url(#sk)">i+j=5</text>
  <text x="245" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#a87820" filter="url(#sk)">2s</text>
  <g filter="url(#sk)"><rect x="278" y="258" width="66" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="283" y="270" font-size="8" fill="#999" filter="url(#sk)">i+j=6</text>
  <text x="311" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#sk)">1s</text>

  <!-- start / target badges -->
  <g filter="url(#sk)"><circle cx="136" cy="107" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="136" y="111" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">起</text>
  <g filter="url(#sk)"><circle cx="334" cy="269" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="334" y="273" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b03a3a" filter="url(#sk)">终</text>

  <!-- sample walk: (0,0)→(1,0)→(1,1)→(2,1)→(2,2)→(3,2)→(3,3) -->
  <g stroke="#b85450" stroke-width="2.3" fill="none" filter="url(#sk)">
    <path d="M 113 128 Q 117 152 113 172" marker-end="url(#arR)"/>
    <path d="M 117 177 Q 146 181 174 177" marker-end="url(#arR)"/>
    <path d="M 179 182 Q 183 206 179 226" marker-end="url(#arR)"/>
    <path d="M 183 231 Q 212 235 240 231" marker-end="url(#arR)"/>
    <path d="M 245 236 Q 249 260 245 280" marker-end="url(#arR)"/>
    <path d="M 249 285 Q 278 289 306 285" marker-end="url(#arR)"/>
  </g>

  <!-- step-cost badges -->
  <g filter="url(#sk)"><circle cx="140" cy="150" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="140" y="154" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#sk)">1s</text>
  <g filter="url(#sk)"><circle cx="146" cy="203" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="146" y="207" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#a87820" filter="url(#sk)">2s</text>
  <g filter="url(#sk)"><circle cx="206" cy="204" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="206" y="208" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#sk)">1s</text>
  <g filter="url(#sk)"><circle cx="212" cy="257" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="212" y="261" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#a87820" filter="url(#sk)">2s</text>
  <g filter="url(#sk)"><circle cx="272" cy="258" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="272" y="262" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#sk)">1s</text>
  <g filter="url(#sk)"><circle cx="284" cy="312" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="284" y="316" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#a87820" filter="url(#sk)">2s</text>

  <!-- legend box -->
  <g filter="url(#sk)">
    <rect x="80" y="336" width="264" height="104" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="96" y="358" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">读图</text>
  <text x="96" y="380" font-size="10.5" fill="#446688" filter="url(#sk)">蓝格 (i+j) 为偶：从它出发走 1 秒</text>
  <text x="96" y="398" font-size="10.5" fill="#a87820" filter="url(#sk)">橙格 (i+j) 为奇：从它出发走 2 秒</text>
  <text x="96" y="424" font-size="10.5" fill="#b85450" filter="url(#sk)">红路径 6 步：1+2+1+2+1+2 = 9 秒</text>

  <!-- right observation boxes -->
  <g filter="url(#sk)">
    <rect x="420" y="96" width="470" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="438" y="120" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk)">观察一：每走一步，i+j 恰好改变 ±1</text>
  <text x="438" y="142" font-size="11" fill="#444" filter="url(#sk)">上下左右任一方向都使 i+j 增减 1 → 奇偶每步必翻转</text>

  <g filter="url(#sk)">
    <rect x="420" y="172" width="470" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="438" y="196" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">观察二：k ≡ i+j (mod 2)（归纳可证）</text>
  <text x="438" y="218" font-size="11" fill="#444" filter="url(#sk)">起点 k=0、i+j=0；此后每走一步，k 与 i+j 同步翻转奇偶</text>
  <text x="438" y="238" font-size="11" fill="#666" filter="url(#sk)">等门是原地等待：不移动、不占步数、不改奇偶</text>

  <g filter="url(#sk)">
    <rect x="420" y="260" width="470" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="438" y="284" font-size="12.5" font-weight="bold" fill="#a87820" filter="url(#sk)">观察三：下一步代价只由出发格决定</text>
  <text x="438" y="306" font-size="11" fill="#444" filter="url(#sk)">第 k+1 步：从偶格出发花 1 秒，从奇格出发花 2 秒</text>
  <text x="438" y="326" font-size="11" fill="#444" filter="url(#sk)">奇偶被格子钉死 → 无需第三维状态，dist[i][j] 二维足够</text>

  <g filter="url(#sk)">
    <rect x="420" y="352" width="470" height="88" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="438" y="374" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">松弛公式</text>
  <text x="438" y="398" font-size="11.5" font-family="monospace" fill="#444" filter="url(#sk)">nd = max(d, moveTime[nx][ny]) + cost(x,y)</text>
  <text x="438" y="424" font-size="11.5" font-family="monospace" font-weight="bold" fill="#a87820" filter="url(#sk)">cost(x,y) = ((x+y) 为偶 ? 1 : 2)</text>
</svg>
