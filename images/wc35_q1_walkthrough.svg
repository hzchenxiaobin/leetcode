<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="800" height="620" fill="#fafafa"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：flowerbed = [1,0,0,0,1]，n = 1 与 n = 2</text>

  <!-- 原数组 -->
  <text x="48" y="62" font-size="12" fill="#555" filter="url(#rough2)">flowerbed =</text>
  <g filter="url(#rough2)">
    <rect x="140" y="42" width="48" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="194" y="42" width="48" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="248" y="42" width="48" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="302" y="42" width="48" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="356" y="42" width="48" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="14" font-weight="bold" filter="url(#rough2)">
    <text x="164" y="68" text-anchor="middle" fill="#b85450">1</text>
    <text x="218" y="68" text-anchor="middle" fill="#2b4a6e">0</text>
    <text x="272" y="68" text-anchor="middle" fill="#2e6e2e">0</text>
    <text x="326" y="68" text-anchor="middle" fill="#2b4a6e">0</text>
    <text x="380" y="68" text-anchor="middle" fill="#b85450">1</text>
  </g>
  <g font-size="10.5" fill="#888" filter="url(#rough2)">
    <text x="164" y="96" text-anchor="middle">0</text>
    <text x="218" y="96" text-anchor="middle">1</text>
    <text x="272" y="96" text-anchor="middle">2</text>
    <text x="326" y="96" text-anchor="middle">3</text>
    <text x="380" y="96" text-anchor="middle">4</text>
  </g>
  <text x="424" y="60" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">↑ 绿色格 = 唯一可种的位置</text>
  <text x="424" y="80" font-size="11.5" fill="#8f3a36" filter="url(#rough2)">1 和 3 都贴着已有的花，种不了</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="48" y="116" width="712" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">
    <text x="83"  y="136" text-anchor="middle">i</text>
    <text x="235" y="136" text-anchor="middle">三格观察（左 / 本 / 右）</text>
    <text x="407" y="136" text-anchor="middle">判定</text>
    <text x="583" y="136" text-anchor="middle">动作</text>
    <text x="732" y="136" text-anchor="middle">cnt</text>
  </g>

  <!-- 行 1 -->
  <g filter="url(#rough2)">
    <rect x="48" y="146" width="712" height="40" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  </g>
  <g font-size="11.5" filter="url(#rough2)">
    <text x="83"  y="171" text-anchor="middle" font-weight="bold" fill="#2b4a6e">0</text>
    <text x="235" y="171" text-anchor="middle" fill="#444">1, —, 0　（本身就是花）</text>
    <text x="407" y="171" text-anchor="middle" fill="#8f3a36">✗ 不可种</text>
    <text x="583" y="171" text-anchor="middle" fill="#444">i += 1</text>
    <text x="732" y="171" text-anchor="middle" fill="#444">0</text>
  </g>

  <!-- 行 2 -->
  <g filter="url(#rough2)">
    <rect x="48" y="186" width="712" height="40" fill="#fbfbfb" stroke="#ddd" stroke-width="1"/>
  </g>
  <g font-size="11.5" filter="url(#rough2)">
    <text x="83"  y="211" text-anchor="middle" font-weight="bold" fill="#2b4a6e">1</text>
    <text x="235" y="211" text-anchor="middle" fill="#444">1, 0, 0　（左邻是花）</text>
    <text x="407" y="211" text-anchor="middle" fill="#8f3a36">✗ 不可种</text>
    <text x="583" y="211" text-anchor="middle" fill="#444">i += 1</text>
    <text x="732" y="211" text-anchor="middle" fill="#444">0</text>
  </g>

  <!-- 行 3：种花 -->
  <g filter="url(#rough2)">
    <rect x="48" y="226" width="712" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="11.5" filter="url(#rough2)">
    <text x="83"  y="251" text-anchor="middle" font-weight="bold" fill="#2e6e2e">2</text>
    <text x="235" y="251" text-anchor="middle" fill="#2e6e2e">0, 0, 0　（三格全空 ✓）</text>
    <text x="407" y="251" text-anchor="middle" font-weight="bold" fill="#2e6e2e">✓ 可种</text>
    <text x="583" y="251" text-anchor="middle" font-weight="bold" fill="#2e6e2e">bed[2] = 1，i += 2</text>
    <text x="732" y="251" text-anchor="middle" font-weight="bold" fill="#2e6e2e">1</text>
  </g>

  <!-- 行 4 -->
  <g filter="url(#rough2)">
    <rect x="48" y="266" width="712" height="40" fill="#fbfbfb" stroke="#ddd" stroke-width="1"/>
  </g>
  <g font-size="11.5" filter="url(#rough2)">
    <text x="83"  y="291" text-anchor="middle" font-weight="bold" fill="#2b4a6e">4</text>
    <text x="235" y="291" text-anchor="middle" fill="#444">0, 1, —　（本身就是花）</text>
    <text x="407" y="291" text-anchor="middle" fill="#8f3a36">✗ 不可种</text>
    <text x="583" y="291" text-anchor="middle" fill="#444">i += 1</text>
    <text x="732" y="291" text-anchor="middle" fill="#444">1</text>
  </g>

  <!-- 行 5：退出 -->
  <g filter="url(#rough2)">
    <rect x="48" y="306" width="712" height="40" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
  </g>
  <g font-size="11.5" filter="url(#rough2)">
    <text x="83"  y="331" text-anchor="middle" font-weight="bold" fill="#2b4a6e">5</text>
    <text x="235" y="331" text-anchor="middle" fill="#444">i = 5 = m → 扫描结束</text>
    <text x="407" y="331" text-anchor="middle" fill="#666">—</text>
    <text x="583" y="331" text-anchor="middle" fill="#444">return cnt ≥ n</text>
    <text x="732" y="331" text-anchor="middle" font-weight="bold" fill="#2b4a6e">1</text>
  </g>

  <!-- 最终数组 -->
  <text x="48" y="378" font-size="11.5" fill="#555" filter="url(#rough2)">种完后：</text>
  <g filter="url(#rough2)">
    <rect x="118" y="360" width="34" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="156" y="360" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="194" y="360" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="232" y="360" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="270" y="360" width="34" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g font-size="12" font-weight="bold" filter="url(#rough2)">
    <text x="135" y="379" text-anchor="middle" fill="#b85450">1</text>
    <text x="173" y="379" text-anchor="middle" fill="#2b4a6e">0</text>
    <text x="211" y="379" text-anchor="middle" fill="#2e6e2e">1</text>
    <text x="249" y="379" text-anchor="middle" fill="#2b4a6e">0</text>
    <text x="287" y="379" text-anchor="middle" fill="#b85450">1</text>
  </g>
  <text x="318" y="379" font-size="11" fill="#888" filter="url(#rough2)">已无相邻的花 ✓</text>

  <!-- 结果 -->
  <g filter="url(#rough2)">
    <rect x="48" y="406" width="340" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="410" y="406" width="350" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="218" y="426" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">n = 1：cnt = 1 ≥ 1 → true ✓</text>
  <text x="218" y="444" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">示例 1</text>
  <text x="585" y="426" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3a36" filter="url(#rough2)">n = 2：cnt = 1 &lt; 2 → false ✗</text>
  <text x="585" y="444" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">示例 2</text>

  <!-- 底部注释 -->
  <g filter="url(#rough2)">
    <rect x="40" y="474" width="720" height="124" rx="10" fill="#fdfcf7" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="58" y="498" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">零段视角复核：同一个数组只有一段零段 [1 | 0 0 0 | 1]，L = 3，两端都有花 ⇒ b = 2。</text>
  <text x="58" y="522" font-size="12" fill="#444" filter="url(#rough2)">容量 = ⌈(3 − 2) / 2⌉ = 1 朵 —— 与贪心跑出来的 cnt = 1 完全一致，两次询问只差阈值 n。</text>
  <text x="58" y="546" font-size="12" fill="#444" filter="url(#rough2)">贪心为什么停在 i = 2 就跳 2 格：第 3 格紧贴刚种下的花，必然不可种，再判也是白判。</text>
  <text x="58" y="570" font-size="11.5" fill="#8f3a36" filter="url(#rough2)">⚠️ 注意「已是花」的格子不能种，但也不能把它当成障碍去跳 2 格——只跳 1 格继续。</text>
  <text x="58" y="590" font-size="11" fill="#666" filter="url(#rough2)">本题 m ≤ 2×10⁴，一趟线性扫描即可；n = 0 时任何花坛都返回 true（直接特判更快）。</text>
</svg>
