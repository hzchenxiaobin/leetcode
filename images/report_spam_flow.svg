<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="500" height="540" fill="#fafafa"/>

  <text x="250" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">举报垃圾信息：算法流程</text>

  <!-- start -->
  <rect x="175" y="36" width="110" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="56" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">开始</text>
  <path d="M 230 66 L 230 80" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="75" y="84" width="310" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="106" text-anchor="middle" font-size="11" font-weight="bold" font-family="monospace" fill="#333">banned = set(bannedWords)</text>
  <text x="230" y="124" text-anchor="middle" font-size="11" font-weight="bold" font-family="monospace" fill="#333">cnt = 0</text>
  <path d="M 230 136 L 230 150" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop: next word -->
  <rect x="75" y="154" width="310" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="176" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333">取 message 中下一个单词 w</text>
  <text x="230" y="192" text-anchor="middle" font-size="9.5" fill="#888">（无剩余单词 → 循环结束）</text>
  <path d="M 230 200 L 230 214" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="230,218 345,260 230,302 115,260" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">w ∈ banned ?</text>
  <text x="230" y="274" text-anchor="middle" font-size="10" fill="#777">整词完全相同？</text>

  <!-- No loop back 1 -->
  <path d="M 345 260 L 425 260 L 425 170 L 387 170" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="252" font-size="11" font-weight="bold" fill="#b85450">No</text>

  <!-- Yes down -->
  <path d="M 230 302 L 230 316" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="312" font-size="11" font-weight="bold" fill="#4a7a3a">Yes</text>

  <!-- cnt += 1 -->
  <rect x="85" y="320" width="290" height="36" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="343" text-anchor="middle" font-size="11.5" font-weight="bold" font-family="monospace" fill="#333">cnt += 1</text>
  <path d="M 230 356 L 230 370" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="230,374 335,412 230,450 125,412" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">cnt ≥ 2 ?</text>
  <text x="230" y="426" text-anchor="middle" font-size="10" fill="#777">已命中两个单词？</text>

  <!-- No loop back 2 -->
  <path d="M 335 412 L 452 412 L 452 188 L 387 188" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="404" font-size="11" font-weight="bold" fill="#b85450">No</text>
  <text x="460" y="300" font-size="9.5" fill="#888" transform="rotate(-90 460 300)">否 → 取下一个单词</text>

  <!-- Yes: return true -->
  <path d="M 230 450 L 230 464" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="460" font-size="11" font-weight="bold" fill="#4a7a3a">Yes</text>
  <rect x="170" y="468" width="170" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="255" y="489" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">返回 true</text>

  <!-- loop exhausted: return false -->
  <path d="M 75 177 L 62 177 L 62 462" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="54" y="320" font-size="9.5" fill="#888" transform="rotate(-90 54 320)">遍历结束（无单词剩余）</text>
  <rect x="25" y="466" width="140" height="34" rx="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="487" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">返回 false</text>
</svg>
