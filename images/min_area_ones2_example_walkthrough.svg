<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：上整下切 3 + 1 + 1 = 5，三竖条只有 6</text>
  <path d="M 200 44 Q 470 52 740 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ 左：最优 T 型 ============ -->
  <text x="252" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a2e">最优：T 型「③ 上整下切」 r = 1, c = 2</text>

  <!-- 网格 2×4，cell=56，起点 (140,120) -->
  <g filter="url(#sk2)">
    <rect x="140" y="120" width="56" height="56" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="196" y="120" width="56" height="56" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="252" y="120" width="56" height="56" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="308" y="120" width="56" height="56" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="140" y="176" width="56" height="56" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="196" y="176" width="56" height="56" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="252" y="176" width="56" height="56" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="308" y="176" width="56" height="56" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#b0aca2">
    <text x="224" y="152">0</text><text x="336" y="152">0</text>
    <text x="168" y="208">0</text><text x="280" y="208">0</text>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="168" y="153" fill="#2b4a70">1</text>
    <text x="280" y="153" fill="#2b4a70">1</text>
    <text x="224" y="209" fill="#3a5a2e">1</text>
    <text x="336" y="209" fill="#7a5415">1</text>
  </g>

  <!-- 刀线 -->
  <path d="M 126 176 L 380 176" stroke="#4a7a3a" stroke-width="2.4" stroke-dasharray="7 5" fill="none" filter="url(#sk)"/>
  <path d="M 252 176 L 252 248" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="126" y="170" text-anchor="start" font-size="10.5" font-weight="bold" fill="#3a5a2e">r = 1</text>
  <text x="258" y="244" text-anchor="start" font-size="10.5" font-weight="bold" fill="#3a5a2e">c = 2</text>

  <!-- 三个包围盒 -->
  <g filter="url(#sk2)">
    <rect x="136" y="116" width="176" height="64" rx="8" fill="#e8f0fe" fill-opacity="0.24" stroke="#446688" stroke-width="2.4"/>
    <rect x="192" y="172" width="64" height="64" rx="8" fill="#e6f4ea" fill-opacity="0.24" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="304" y="172" width="64" height="64" rx="8" fill="#fff8e1" fill-opacity="0.24" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="224" y="136" fill="#2b4a70">上段 1×3 = 3</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="150" y="266" width="210" height="30" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="255" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a2e">3 + 1 + 1 = 5 ✓</text>

  <!-- ============ 右：三竖条对照 ============ -->
  <text x="688" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">对照：三竖条 i = 1, j = 2，只有 6</text>

  <!-- 网格 2×4，cell=56，起点 (560,120) -->
  <g filter="url(#sk2)">
    <rect x="560" y="120" width="56" height="56" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="616" y="120" width="56" height="56" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="672" y="120" width="56" height="56" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="728" y="120" width="56" height="56" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="560" y="176" width="56" height="56" rx="3" fill="#ffffff" stroke="#c9c5bb" stroke-width="1.2"/>
    <rect x="616" y="176" width="56" height="56" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="672" y="176" width="56" height="56" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="728" y="176" width="56" height="56" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#b0aca2">
    <text x="644" y="152">0</text>
    <text x="588" y="208">0</text>
    <text x="700" y="208">0</text>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="588" y="153" fill="#2b4a70">1</text>
    <text x="700" y="153" fill="#7a5415">1</text>
    <text x="644" y="209" fill="#3a5a2e">1</text>
    <text x="756" y="209" fill="#7a5415">1</text>
  </g>

  <!-- 刀线 -->
  <path d="M 614 106 L 614 248" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <path d="M 670 106 L 670 248" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="614" y="100" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">i=1</text>
  <text x="670" y="100" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">j=2</text>

  <!-- 三个包围盒 -->
  <g filter="url(#sk2)">
    <rect x="556" y="116" width="64" height="64" rx="8" fill="#e8f0fe" fill-opacity="0.24" stroke="#446688" stroke-width="2.4"/>
    <rect x="612" y="172" width="64" height="64" rx="8" fill="#e6f4ea" fill-opacity="0.24" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="668" y="116" width="120" height="120" rx="8" fill="#fff8e1" fill-opacity="0.24" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <text x="728" y="140" fill="#7a5415">2×2 = 4</text>
  </g>
  <g filter="url(#sk2)">
    <rect x="586" y="266" width="210" height="30" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="691" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">1 + 1 + 4 = 6 ✗</text>
  <text x="691" y="312" text-anchor="middle" font-size="11" fill="#888">右段被 (0,2)、(1,3) 逼成 2×2 —— 白送两个 0</text>

  <!-- ============ 底部注记 ============ -->
  <g filter="url(#sk)">
    <rect x="70" y="336" width="800" height="130" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="470" y="364" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a70">为什么 T 型赢：第一刀顺着 1 的「聚集方向」切</text>
  <text x="470" y="390" text-anchor="middle" font-size="11.5" fill="#444">上排两个 1 同行 → 横刀整段送走（1×3 = 3，顺手带走一个 0）；下排两个散点再竖刀分家（各 1×1）</text>
  <text x="470" y="414" text-anchor="middle" font-size="11.5" fill="#444">三竖条硬切三列：右段 (0,2)、(1,3) 跨两行两列 → 2×2 = 4，比 T 型多付 1</text>
  <text x="470" y="442" text-anchor="middle" font-size="11.5" fill="#888">同场示例 1 [[1,0,1],[1,1,1]]：三竖条 2 + 1 + 2 = 5 ✓ —— 两列各一对 1，条形反而是正解</text>
</svg>
