<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 486"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="486" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">核心观察：答案 = 根到叶「加权路径」的最大值</text>
  <text x="280" y="50" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">边权 = informTime[上司]，并行广播 ⟹ 到达时刻只由路径决定</text>

  <!-- 边（先画线，节点矩形盖住线头） -->
  <line x1="285" y1="112" x2="135" y2="190" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="285" y1="112" x2="365" y2="190" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="285" y1="112" x2="500" y2="190" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="135" y1="190" x2="100" y2="268" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="100" y1="268" x2="75" y2="346" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="75" y1="346" x2="75" y2="420" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="365" y1="190" x2="410" y2="268" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="410" y1="268" x2="450" y2="346" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- 边权标签 = informTime[上司] -->
  <text x="202" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#666" filter="url(#rough2)">4</text>
  <text x="330" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>
  <text x="398" y="143" text-anchor="middle" font-size="13" font-weight="bold" fill="#666" filter="url(#rough2)">4</text>
  <text x="103" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#666" filter="url(#rough2)">3</text>
  <text x="95" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#666" filter="url(#rough2)">5</text>
  <text x="90" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#666" filter="url(#rough2)">0</text>
  <text x="400" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="443" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">8</text>

  <!-- 节点：框内上=员工号，下=到达时刻 t -->
  <rect x="262" y="95" width="46" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="285" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="285" y="122" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=0</text>

  <rect x="112" y="173" width="46" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>
  <text x="135" y="200" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=4</text>

  <rect x="342" y="173" width="46" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="365" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="365" y="200" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=4</text>

  <rect x="477" y="173" width="46" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="500" y="200" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=4</text>

  <rect x="77" y="251" width="46" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="100" y="278" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=7</text>

  <rect x="387" y="251" width="46" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="410" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <text x="410" y="278" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=6</text>

  <rect x="52" y="329" width="46" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="75" y="356" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=12</text>

  <rect x="427" y="329" width="46" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="450" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">8</text>
  <text x="450" y="356" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">t=14</text>
  <text x="462" y="321" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">最晚 ⟹ 答案</text>

  <rect x="52" y="403" width="46" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <text x="75" y="430" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">t=12</text>

  <!-- 路径账单 -->
  <rect x="322" y="370" width="228" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="333" y="388" text-anchor="start" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">路径账单（根 → 叶）</text>
  <text x="333" y="405" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">4→2→6→8：4+2+8 = 14 ✓ 答案</text>
  <text x="333" y="421" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">4→0→1→3→7：4+3+5+0 = 12</text>
  <text x="333" y="437" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">4→5：4</text>
  <text x="333" y="453" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">边多 ≠ 权重：7 号 4 条边仍输 3 条边</text>

  <text x="52" y="475" text-anchor="start" font-size="10.5" fill="#888" filter="url(#rough2)">框内为员工号（下方 t = 到达时刻），边上数字 = informTime[上司]</text>
</svg>
