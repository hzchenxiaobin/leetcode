<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="560" height="372" fill="#fafafa"/>
  <text x="280.0" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">统计数字出现总次数：每个数拆成十进制串逐个字符比对</text>
  <text x="280.0" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums = [12,54,32,22]，digit = 2 → 命中 1 + 0 + 1 + 2 = 4 次</text>
  <rect x="76" y="68" width="92" height="42" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122.0" y="93.32" text-anchor="middle" font-size="12" fill="#666666" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="122" y="126" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">数 12</text>
  <rect x="220" y="68" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246.0" y="93.32" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="282" y="68" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308.0" y="93.32" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="430" y="95" text-anchor="start" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">命中 1 次</text>
  <rect x="76" y="134" width="92" height="42" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122.0" y="159.32" text-anchor="middle" font-size="12" fill="#666666" font-weight="bold" filter="url(#rough2)">54</text>
  <text x="122" y="192" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">数 54</text>
  <rect x="220" y="134" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246.0" y="159.32" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="282" y="134" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308.0" y="159.32" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="430" y="161" text-anchor="start" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">命中 0 次</text>
  <rect x="76" y="200" width="92" height="42" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122.0" y="225.32" text-anchor="middle" font-size="12" fill="#666666" font-weight="bold" filter="url(#rough2)">32</text>
  <text x="122" y="258" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">数 32</text>
  <rect x="220" y="200" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246.0" y="225.32" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="282" y="200" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308.0" y="225.32" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="430" y="227" text-anchor="start" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">命中 1 次</text>
  <rect x="76" y="266" width="92" height="42" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122.0" y="291.32" text-anchor="middle" font-size="12" fill="#666666" font-weight="bold" filter="url(#rough2)">22</text>
  <text x="122" y="324" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">数 22</text>
  <rect x="220" y="266" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246.0" y="291.32" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="282" y="266" width="52" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308.0" y="291.32" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="430" y="293" text-anchor="start" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">命中 2 次</text>
  <text x="220" y="60" text-anchor="start" font-size="9" fill="#666" filter="url(#rough2)">逐位拆分</text>
  <rect x="36" y="306" width="488" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="326" text-anchor="start" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">求和</text>
  <text x="48" y="343" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">总次数 = 1 + 0 + 1 + 2 = 4：每个元素独立统计，结果直接相加</text>
  <text x="280" y="364" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">红色格子 = 与 digit 相同的字符；蓝色 = 不同；54 里没有 2，贡献 0</text>
</svg>
