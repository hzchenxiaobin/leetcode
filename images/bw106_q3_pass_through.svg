<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：碰撞反弹 ≡ 互相穿过（换标签）</text>

  <!-- 真实世界 -->
  <rect x="30" y="48" width="460" height="122" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12.5" fill="#8c3a36" filter="url(#rough2)">真实世界：撞上就掉头</text>
  <!-- 数轴 -->
  <path d="M60 118 L460 118" stroke="#8c3a36" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12">
    <circle cx="120" cy="118" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="120" y="122" text-anchor="middle" fill="#8c3a36">A</text>
    <circle cx="400" cy="118" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="400" y="122" text-anchor="middle" fill="#7a5a10">B</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M134 100 L186 100" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)"/>
    <path d="M386 100 L334 100" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>
  <!-- 中点相撞 -->
  <g filter="url(#rough2)">
    <path d="M190 118 Q 260 94 330 118" stroke="#8c3a36" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
    <path d="M330 118 Q 260 142 190 118" stroke="#8c3a36" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
  </g>
  <text x="260" y="92" text-anchor="middle" font-size="11.5" fill="#8c3a36" filter="url(#rough2)">在 260 相撞，双双掉头</text>
  <g filter="url(#rough2)">
    <path d="M176 136 L124 136" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)"/>
    <path d="M344 136 L396 136" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="96" y="158" font-size="11" fill="#8c3a36" filter="url(#rough2)">A 掉头回 120</text>
  <text x="366" y="158" font-size="11" fill="#8c3a36" filter="url(#rough2)">B 掉头回 400</text>

  <!-- 幻影世界 -->
  <rect x="30" y="184" width="460" height="122" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="12.5" fill="#2f5527" filter="url(#rough2)">幻影世界：谁也不理谁，直接穿过</text>
  <path d="M60 254 L460 254" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12">
    <circle cx="120" cy="254" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="120" y="258" text-anchor="middle" fill="#8c3a36">A</text>
    <circle cx="400" cy="254" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="400" y="258" text-anchor="middle" fill="#7a5a10">B</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M134 236 L386 236" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)"/>
    <path d="M386 272 L134 272" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
  </g>
  <g filter="url(#rough2)" font-size="12">
    <circle cx="400" cy="254" r="0"/>
    <circle cx="260" cy="236" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <circle cx="260" cy="272" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="260" y="222" text-anchor="middle" font-size="11.5" fill="#2f5527" filter="url(#rough2)">260 处擦肩而过，各走各的</text>
  <text x="60" y="296" font-size="11" fill="#2f5527" filter="url(#rough2)">A 穿到 400</text>
  <text x="368" y="296" font-size="11" fill="#2f5527" filter="url(#rough2)">B 穿到 120</text>

  <rect x="30" y="312" width="460" height="0" fill="none" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">两个世界的“位置多重集”每一刻都相同：把幻影换标签即得真实 → 距离和也一样</text>
</svg>
