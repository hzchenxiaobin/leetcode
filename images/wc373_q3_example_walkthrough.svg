<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：nums = [1,5,3,9,8]，limit = 2</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 排序后 (值, 原下标) -->
  <text x="100" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">排序后</text>
  <g filter="url(#sk)"><rect x="170" y="50" width="46" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="193" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">(1,0)</text>
  <g filter="url(#sk)"><rect x="228" y="50" width="46" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="251" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">(3,2)</text>
  <g filter="url(#sk)"><rect x="286" y="50" width="46" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="309" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e">(5,1)</text>
  <g filter="url(#sk)"><rect x="344" y="50" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="367" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10">(8,4)</text>
  <g filter="url(#sk)"><rect x="402" y="50" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="425" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a10">(9,3)</text>
  <path d="M 338 44 L 338 92" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5,4" fill="none" filter="url(#sk)"/>
  <text x="338" y="106" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">差 3 &gt; 2 ✂ 断开</text>

  <!-- 分组处理 -->
  <path d="M 251 96 L 205 122" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 395 96 L 466 122" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="60" y="126" width="280" height="78" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="200" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">组 A：值 [1,3,5]（已升序）</text>
  <text x="200" y="168" text-anchor="middle" font-size="11.5" fill="#333">原下标 {0,2,1} → 排序 [0,1,2]</text>
  <text x="200" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">1→位0，3→位1，5→位2</text>

  <g filter="url(#sk)"><rect x="364" y="126" width="216" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="472" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10">组 B：值 [8,9]</text>
  <text x="472" y="168" text-anchor="middle" font-size="11.5" fill="#333">原下标 {4,3} → 排序 [3,4]</text>
  <text x="472" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a10">8→位3，9→位4</text>

  <path d="M 200 206 L 240 244" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 472 206 L 404 244" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 输出 -->
  <text x="106" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">ans =</text>
  <g filter="url(#sk)"><rect x="170" y="250" width="46" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="193" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="228" y="250" width="46" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="251" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">3</text>
  <g filter="url(#sk)"><rect x="286" y="250" width="46" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="309" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">5</text>
  <g filter="url(#sk)"><rect x="344" y="250" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="367" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a10">8</text>
  <g filter="url(#sk)"><rect x="402" y="250" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="425" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#a06a10">9</text>
  <text x="193" y="300" text-anchor="middle" font-size="10" fill="#999">位置0</text>
  <text x="251" y="300" text-anchor="middle" font-size="10" fill="#999">位置1</text>
  <text x="309" y="300" text-anchor="middle" font-size="10" fill="#999">位置2</text>
  <text x="367" y="300" text-anchor="middle" font-size="10" fill="#999">位置3</text>
  <text x="425" y="300" text-anchor="middle" font-size="10" fill="#999">位置4</text>
  <g filter="url(#sk)"><rect x="492" y="254" width="112" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="548" y="273" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">字典序最小 ✓</text>

  <!-- 底部结论 -->
  <g filter="url(#sk)"><rect x="100" y="330" width="440" height="48" rx="8" fill="#f4f9f4" stroke="#9db89d" stroke-width="1"/></g>
  <text x="320" y="348" text-anchor="middle" font-size="11.5" fill="#444">每个下标拿到「自己组里还没被用掉的最小值」</text>
  <text x="320" y="368" text-anchor="middle" font-size="11.5" fill="#444">组间互不干扰 → 逐位贪心同时达成全局最优</text>
</svg>
