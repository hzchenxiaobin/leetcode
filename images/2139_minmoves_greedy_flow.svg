<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：反向贪心与末尾一次性累加</text>
  <path d="M 170 42 Q 340 52 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="270" y="56" width="140" height="36" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="340" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66">moves = 0</text>
  <path d="M 340 92 L 340 113" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk)">
    <polygon points="340,116 452,150 340,184 228,150" fill="#f0f4ff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="340" y="146" text-anchor="middle" font-size="12.5" fill="#2b4a66">target &gt; 1 且</text>
  <text x="340" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">maxDoubles &gt; 0 ？</text>

  <!-- no branch (left) -->
  <path d="M 228 150 L 189 150" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="208" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="40" y="122" width="148" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="114" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">moves += target − 1</text>
  <text x="114" y="163" text-anchor="middle" font-size="9.5" fill="#777">剩余 +1 步一次算清，O(1)</text>
  <path d="M 114 178 L 114 201" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="46" y="204" width="136" height="38" rx="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="114" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24">返回 moves ✓</text>

  <!-- yes branch (down) -->
  <path d="M 340 184 L 340 211" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="353" y="203" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>

  <!-- diamond 2 -->
  <g filter="url(#sk)">
    <polygon points="340,214 432,248 340,282 248,248" fill="#f0f4ff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="340" y="253" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">target 是偶数？</text>

  <!-- even (right, halve) -->
  <path d="M 432 248 L 471 248" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="452" y="239" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="474" y="220" width="140" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="544" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d24">target ÷= 2</text>
  <text x="544" y="261" text-anchor="middle" font-size="10" fill="#555">maxDoubles −= 1</text>

  <!-- odd (left, decrement) -->
  <path d="M 248 248 L 183 248" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="215" y="239" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="70" y="226" width="110" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="125" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">target −= 1</text>

  <!-- merge into moves += 1 -->
  <path d="M 544 276 L 544 330 L 424 330" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 125 270 L 125 330 L 258 330" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="262" y="312" width="156" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="340" y="335" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66">moves += 1</text>

  <!-- loop back -->
  <path d="M 340 348 L 340 374 L 630 374 L 630 150 L 457 150" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="7,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="486" y="367" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">循环至多 2·maxDoubles + 1 轮</text>

  <!-- bottom callout -->
  <g filter="url(#sk)">
    <rect x="40" y="402" width="600" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="340" y="425" text-anchor="middle" font-size="12" fill="#444">−1 只发生在奇数，而奇数 −1 后必变偶、下一步必 ÷2：两类操作严格交替，循环体至多 2D + 1 次</text>
  <text x="340" y="447" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">最坏 maxDoubles = 0、target = 10⁹：循环零次，一次减法出答案——耗时与 target 无关</text>
</svg>
