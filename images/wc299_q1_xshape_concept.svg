  <text x="130" y="201" text-anchor="middle" font-size="14" fill="#a04a48">0</text>
  <g filter="url(#sk)"><rect x="150" y="176" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="170" y="201" text-anchor="middle" font-size="14" fill="#a04a48">0</text>
  <g filter="url(#sk)"><rect x="190" y="176" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="210" y="201" text-anchor="middle" font-size="14" fill="#2e5e2e">2</text>

  <g filter="url(#sk)"><rect x="70" y="228" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="90" y="240" font-size="11" fill="#555">对角线 ⇒ 须 ≠ 0</text>
  <g filter="url(#sk)"><rect x="180" y="228" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="200" y="240" font-size="11" fill="#555">其余 ⇒ 须 = 0</text>

  <!-- 右：两条对角线的刻画 -->
  <g filter="url(#sk)"><rect x="262" y="56" width="346" height="188" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="280" y="78" font-size="13" font-weight="bold" fill="#2b6e9e">对角线 = 主 ∪ 副：两个等式，O(1) 判定</text>

  <g filter="url(#sk)"><rect x="286" y="92" width="22" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <g filter="url(#sk)"><rect x="308" y="92" width="22" height="22" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
