  <g filter="url(#sk)"><rect x="464" y="158" width="22" height="22" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="486" y="158" width="22" height="22" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <text x="464" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" font-family="monospace">副对角线：i + j = n − 1</text>

  <g filter="url(#sk)"><rect x="280" y="206" width="310" height="28" rx="5" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="435" y="225" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">onDiag = (i==j) || (i+j==n−1)</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="64" y="262" width="544" height="98" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="336" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">onDiag ⇒ grid[i][j] ≠ 0 ；非 onDiag ⇒ grid[i][j] = 0</text>
  <text x="336" y="314" text-anchor="middle" font-size="11.5" fill="#555">奇数 n：中心格同属两条对角线，布尔或天然只计一次（仍须 ≠ 0），无需显式去重</text>
  <text x="336" y="340" text-anchor="middle" font-size="11.5" fill="#555">几何关系能 O(1) 算出就不要落成数据结构 —— 不预存对角线集合，遇违例立即 return false</text>

  <text x="320" y="388" text-anchor="middle" font-size="12" fill="#888">把「X 形状」翻译成两个下标等式 —— 单趟扫描，最坏合法矩阵才扫满 n² 格</text>
</svg>
