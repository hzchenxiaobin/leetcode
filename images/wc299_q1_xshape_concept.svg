  <g filter="url(#sk)"><rect x="286" y="136" width="22" height="22" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="308" y="136" width="22" height="22" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="330" y="136" width="22" height="22" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="352" y="136" width="22" height="22" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="286" y="158" width="22" height="22" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="308" y="158" width="22" height="22" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="330" y="158" width="22" height="22" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="352" y="158" width="22" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="330" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" font-family="monospace">主对角线：i = j</text>

  <g filter="url(#sk)"><rect x="420" y="92" width="22" height="22" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="442" y="92" width="22" height="22" rx="3" fill="#fdfcf7" stroke="#b9c8d8" stroke-width="1"/></g>
