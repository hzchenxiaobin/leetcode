<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 走查：两条 alice 交易互相判定为无效</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">输入 ["alice,20,800,mtv", "alice,50,100,beijing"]</text>

  <rect x="26" y="70" width="508" height="134" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="26" y="70" width="508" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <g font-size="10.5" fill="#3a4a66" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="116" y="93">交易</text>
    <text x="256" y="93">金额规则</text>
    <text x="365" y="93">窗口内城市</text>
    <text x="479" y="93">结论</text>
  </g>

  <path d="M 26 106 L 534 106 M 26 154 L 534 154 M 26 202 L 534 202" stroke="#c8d0dc" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 206 70 L 206 202 M 306 70 L 306 202 M 424 70 L 424 202" stroke="#c8d0dc" stroke-width="1.2" filter="url(#rough2)"/>

  <g font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="116" y="133">alice,20,800,mtv</text>
    <text x="116" y="181">alice,50,100,beijing</text>
  </g>
  <g font-size="10" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">
    <text x="256" y="133">800 ≤ 1000 ✓</text>
    <text x="256" y="181">100 ≤ 1000 ✓</text>
  </g>
  <g font-size="10" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">
    <text x="365" y="133">{mtv, beijing}</text>
    <text x="365" y="181">{mtv, beijing}</text>
  </g>
  <g font-size="10" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">
    <text x="479" y="133">无效</text>
    <text x="479" y="181">无效</text>
  </g>
  <g font-size="9" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="365" y="147">种数 = 2</text>
    <text x="365" y="195">种数 = 2</text>
  </g>

  <rect x="26" y="216" width="508" height="88" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="238" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">判定过程</text>
  <text x="40" y="258" font-size="9.5" fill="#555" filter="url(#rough2)">|20 − 50| = 30 ≤ 60 且 mtv ≠ beijing：第 1 笔因第 2 笔失效，第 2 笔因第 1 笔失效。</text>
  <text x="40" y="276" font-size="9.5" fill="#555" filter="url(#rough2)">若两笔城市都是 mtv，窗口城市种数 = 1，两条都保持有效。</text>
  <text x="40" y="294" font-size="9.5" fill="#888" filter="url(#rough2)">注意两条的 amount 都 ≤ 1000，本示例完全由规则 B 判定。</text>

  <rect x="26" y="314" width="508" height="74" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="336" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">对照另外两个示例</text>
  <text x="40" y="356" font-size="9.5" fill="#555" filter="url(#rough2)">示例 2（同城）：alice,20,800,mtv / alice,50,1200,mtv → 规则 B 不触发，只有第 2 笔因金额无效。</text>
  <text x="40" y="374" font-size="9.5" fill="#555" filter="url(#rough2)">示例 3（异名）：仅 bob,50,1200,mtv → 无同名交易，仅金额 1200 &gt; 1000 命中规则 A。</text>
</svg>
