<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="720" height="500" fill="#fdfcf7"/>
  <text x="360" y="24" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：[5, 2, 4, 4, 3] —— 追加 / 头替换 / 相等追加 / 中间替换</text>
  <path d="M 130 36 Q 360 46 590 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="360" y="54" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">自造用例（覆盖全部四种操作形态）；ans = [1, 1, 2, 3, 2]，与暴力对拍一致</text>

  <!-- table frame -->
  <rect x="40" y="66" width="640" height="348" rx="6" fill="none" stroke="#8a8a8a" stroke-width="1.5" filter="url(#sk)"/>
  <path d="M 40 94 L 680 94" stroke="#8a8a8a" stroke-width="1.2" filter="url(#sk)"/>
  <path d="M 76 66 L 76 414" stroke="#b8b8b8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 112 66 L 112 414" stroke="#b8b8b8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 288 66 L 288 414" stroke="#b8b8b8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 452 66 L 452 414" stroke="#b8b8b8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 628 66 L 628 414" stroke="#b8b8b8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 40 158 L 680 158" stroke="#d8d8d8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 40 222 L 680 222" stroke="#d8d8d8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 40 286 L 680 286" stroke="#d8d8d8" stroke-width="1" filter="url(#sk)"/>
  <path d="M 40 350 L 680 350" stroke="#d8d8d8" stroke-width="1" filter="url(#sk)"/>

  <!-- header -->
  <g font-size="11.5" font-weight="bold" fill="#555" text-anchor="middle" filter="url(#sk)">
    <text x="58" y="86">i</text>
    <text x="94" y="86">x</text>
    <text x="200" y="86">处理前 tails</text>
    <text x="370" y="86">upper_bound 结果</text>
    <text x="540" y="86">处理后 tails</text>
    <text x="654" y="86">ans[i]</text>
  </g>

  <!-- row 3 highlight (equal append) -->
  <rect x="41" y="287" width="638" height="62" fill="#e6f4ea" opacity="0.55" filter="url(#sk)"/>

  <!-- row 0: i=0 x=5 -->
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="58" y="131">0</text>
    <text x="94" y="131" font-weight="bold">5</text>
    <text x="200" y="131" font-size="11" font-style="italic" fill="#999">空</text>
    <text x="370" y="122" font-size="10.5">pos = 0 = len</text>
    <text x="370" y="138" font-size="10.5">空表直接放入</text>
    <text x="654" y="131" font-size="13" font-weight="bold">1</text>
  </g>
  <rect x="525" y="113" width="30" height="26" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="540" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">5</text>

  <!-- row 1: i=1 x=2 -->
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="58" y="195">1</text>
    <text x="94" y="195" font-weight="bold">2</text>
    <text x="370" y="186" font-size="10.5">pos = 0（第一个 &gt; 2 的是 5）</text>
    <text x="370" y="202" font-size="10.5" fill="#9a6a15" font-weight="bold">替换头部</text>
    <text x="654" y="195" font-size="13" font-weight="bold">1</text>
  </g>
  <rect x="185" y="177" width="30" height="26" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="200" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">5</text>
  <rect x="525" y="177" width="30" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <text x="540" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a6a15" filter="url(#sk)">2</text>

  <!-- row 2: i=2 x=4 -->
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="58" y="259">2</text>
    <text x="94" y="259" font-weight="bold">4</text>
    <text x="370" y="250" font-size="10.5">pos = 1 = len（无 &gt; 4 的元素）</text>
    <text x="370" y="266" font-size="10.5">追加</text>
    <text x="654" y="259" font-size="13" font-weight="bold">2</text>
  </g>
  <rect x="185" y="241" width="30" height="26" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="200" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <rect x="507" y="241" width="30" height="26" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="522" y="259" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <rect x="543" y="241" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#sk)"/>
  <text x="558" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">4</text>

  <!-- row 3: i=3 x=4 (equal append) -->
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="58" y="323">3</text>
    <text x="94" y="323" font-weight="bold">4</text>
    <text x="370" y="314" font-size="10.5">pos = 2 = len（4 并不 &gt; 4）</text>
    <text x="370" y="330" font-size="10.5" fill="#2e6e2e" font-weight="bold">非严格之魂：相等也放行！</text>
    <text x="654" y="323" font-size="13" font-weight="bold" fill="#2e6e2e">3</text>
  </g>
  <rect x="167" y="305" width="30" height="26" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="182" y="323" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <rect x="203" y="305" width="30" height="26" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="218" y="323" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">4</text>
  <rect x="489" y="305" width="30" height="26" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="504" y="323" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <rect x="525" y="305" width="30" height="26" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="540" y="323" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">4</text>
  <rect x="561" y="305" width="30" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#sk)"/>
  <text x="576" y="323" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">4</text>

  <!-- row 4: i=4 x=3 (mid replace) -->
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="58" y="387">4</text>
    <text x="94" y="387" font-weight="bold">3</text>
    <text x="370" y="378" font-size="10.5">pos = 1（第一个 &gt; 3 的是 4）</text>
    <text x="370" y="394" font-size="10.5" fill="#9a6a15" font-weight="bold">中间替换</text>
    <text x="654" y="387" font-size="13" font-weight="bold">2</text>
  </g>
  <rect x="149" y="369" width="30" height="26" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="164" y="387" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <rect x="185" y="369" width="30" height="26" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="200" y="387" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">4</text>
  <rect x="221" y="369" width="30" height="26" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="236" y="387" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">4</text>
  <rect x="489" y="369" width="30" height="26" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="504" y="387" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <rect x="525" y="369" width="30" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <text x="540" y="387" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a6a15" filter="url(#sk)">3</text>
  <rect x="561" y="369" width="30" height="26" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#sk)"/>
  <text x="576" y="387" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">4</text>

  <!-- bottom note -->
  <rect x="60" y="432" width="600" height="56" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4" filter="url(#sk)"/>
  <text x="360" y="456" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">i=3 是全题灵魂：x=4 与 tails 里的 4 相等，upper_bound 找「第一个 &gt; 4」越过了它 → 追加而非替换；</text>
  <text x="360" y="478" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">若误用 lower_bound（第一个 ≥ 4），会在 i=3 处替换掉那个 4，ans[3] 错成 2</text>
</svg>
