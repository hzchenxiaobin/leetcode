<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrGr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">按数位分解：每个数对的「差」= 逐列「差」之和</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">以 nums = [13, 23, 12] 为例——所有数数位长度相同，数位天然按列对齐</text>

  <!-- 列头 -->
  <text x="83" y="60" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#r)">位 p=1</text>
  <text x="83" y="72" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#r)">十位</text>
  <text x="135" y="60" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#r)">位 p=0</text>
  <text x="135" y="72" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#r)">个位</text>

  <!-- 数字网格：三行两列 -->
  <text x="52" y="103" text-anchor="end" font-size="12" fill="#999" filter="url(#r)">13</text>
  <rect x="60" y="78" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="83" y="103" text-anchor="middle" font-size="15" fill="#333" filter="url(#r)">1</text>
  <rect x="112" y="78" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r)"/>
  <text x="135" y="103" text-anchor="middle" font-size="15" fill="#333" filter="url(#r)">3</text>

  <text x="52" y="155" text-anchor="end" font-size="12" fill="#999" filter="url(#r)">23</text>
  <rect x="60" y="130" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="83" y="155" text-anchor="middle" font-size="15" fill="#333" filter="url(#r)">2</text>
  <rect x="112" y="130" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r)"/>
  <text x="135" y="155" text-anchor="middle" font-size="15" fill="#333" filter="url(#r)">3</text>

  <text x="52" y="207" text-anchor="end" font-size="12" fill="#999" filter="url(#r)">12</text>
  <rect x="60" y="182" width="46" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="83" y="207" text-anchor="middle" font-size="15" fill="#333" filter="url(#r)">1</text>
  <rect x="112" y="182" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r)"/>
  <text x="135" y="207" text-anchor="middle" font-size="15" fill="#333" filter="url(#r)">2</text>

  <!-- 抽列箭头 -->
  <path d="M 162 96 C 200 90, 224 96, 244 110" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#r)"/>
  <path d="M 162 210 C 200 216, 224 222, 244 234" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrGr)" filter="url(#r)"/>

  <!-- 面板 A：十位 -->
  <rect x="250" y="78" width="285" height="100" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#r)"/>
  <text x="266" y="102" font-size="12" font-weight="bold" fill="#446688" filter="url(#r)">抽出第 p=1 列 → [1, 2, 1]</text>
  <text x="266" y="122" font-size="11" fill="#333" filter="url(#r)">桶计数：cnt[1] = 2，cnt[2] = 1</text>
  <text x="266" y="142" font-size="11" fill="#333" filter="url(#r)">不同数对 = C(3,2) − C(2,2) − C(1,2)</text>
  <text x="266" y="163" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">= 2：(13,23)、(23,12) 十位不同</text>

  <!-- 面板 B：个位 -->
  <rect x="250" y="196" width="285" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#r)"/>
  <text x="266" y="220" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#r)">抽出第 p=0 列 → [3, 3, 2]</text>
  <text x="266" y="240" font-size="11" fill="#333" filter="url(#r)">桶计数：cnt[3] = 2，cnt[2] = 1</text>
  <text x="266" y="260" font-size="11" fill="#333" filter="url(#r)">不同数对 = C(3,2) − C(2,2) − C(1,2)</text>
  <text x="266" y="281" font-size="12" font-weight="bold" fill="#b85450" filter="url(#r)">= 2：(13,12)、(23,12) 个位不同</text>

  <!-- 答案框 -->
  <rect x="40" y="316" width="480" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#r)"/>
  <text x="280" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#r)">答案 = 2 + 2 = 4</text>
  <text x="280" y="360" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#r)">逐对验证 (13,23)=1、(13,12)=1、(23,12)=2 —— 逐列求和与逐对求和一致</text>

  <text x="280" y="402" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#r)">关键转换：O(n²) 个数对的逐对比较 → 每列 10 个桶的数字计数，各列独立求解后相加</text>
  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#999" filter="url(#r)">n 个数、d 位 → 总开销 O(n·d)；「数位长度相同」保证列对齐不错位</text>
</svg>
