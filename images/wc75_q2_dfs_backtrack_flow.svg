<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="470" fill="#fafafa"/>

  <text x="350" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">回溯流程：压栈 → 到底落盘 → 逐分支递归 → 弹栈撤销</text>
  <text x="350" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">path 的每一次 push 必须配对一次 pop，二者夹在同一个函数调用里</text>

  <rect x="200" y="64" width="300" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="87" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">dfs(u)：path.push(u)，u 进入当前路径</text>
  <path d="M 350 100 L 350 118" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="350,120 434,158 350,196 266,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="155" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">u == n − 1 ?</text>
  <text x="350" y="173" text-anchor="middle" font-size="9.5" fill="#a0822a" filter="url(#rough2)">（是否走到终点）</text>

  <path d="M 434 158 L 466 158" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="449" y="148" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="470" y="124" width="204" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="572" y="148" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">res.push(path 的拷贝)</text>
  <text x="572" y="168" text-anchor="middle" font-size="10" fill="#557a4a" filter="url(#rough2)">记录一条完整路径</text>
  <text x="572" y="184" text-anchor="middle" font-size="10" fill="#557a4a" filter="url(#rough2)">必须拷贝，不能存引用</text>

  <path d="M 572 192 L 572 320 L 506 320" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 350 196 L 350 220" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="214" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="200" y="224" width="300" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="246" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">for v in graph[u]：dfs(v)</text>
  <text x="350" y="264" text-anchor="middle" font-size="10" fill="#5a6a86" filter="url(#rough2)">每个出边邻居产生一条分支</text>

  <path d="M 350 276 L 350 298" stroke="#666" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="300" width="300" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="325" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">path.pop()：回溯，把 u 让出路径</text>

  <path d="M 200 320 L 150 320 L 150 82 L 196 82" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="131" y="205" text-anchor="middle" font-size="10" fill="#666" transform="rotate(-90 131 205)" filter="url(#rough2)">递归返回上一层</text>

  <rect x="80" y="386" width="540" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="408" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">复杂度：答案条数 P ≤ 2^(n−2)，时间 O(P · n)，空间 O(n) 递归栈 + 答案本身</text>
  <text x="96" y="430" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">落盘时只拷贝 path 的当前快照，回溯的弹出就不会污染已记录的结果</text>
</svg>
