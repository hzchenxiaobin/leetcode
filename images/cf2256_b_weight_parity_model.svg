<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="480" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">w_i ≠ w_{i+1} ⟺ s_i ≠ s_{i+2}：约束只落在同奇偶的位置之间</text>
  <text x="380" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">骨牌重量 w_i = s_i + s_{i+1}，相邻两块共用一格，做差正好把共用格消掉</text>

  <!-- 左侧：一个合法串的骨牌重量 -->
  <text x="40" y="82" font-size="10.5" font-weight="bold" fill="#555" filter="url(#rough2)">例：s = 00110（n = 5），重量 0, 1, 2, 1 两两不同 → 合法</text>

  <g filter="url(#rough2)">
    <rect x="40" y="94" width="56" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="106" y="94" width="56" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="172" y="94" width="56" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="238" y="94" width="56" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="304" y="94" width="56" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="68" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50" filter="url(#rough2)">0</text>
  <text x="134" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50" filter="url(#rough2)">0</text>
  <text x="200" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="266" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="332" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50" filter="url(#rough2)">0</text>
  <text x="68" y="152" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="134" y="152" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="200" y="152" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="266" y="152" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="332" y="152" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">5</text>

  <!-- 四块骨牌重量 -->
  <g filter="url(#rough2)">
    <ellipse cx="101" cy="178" rx="27" ry="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <ellipse cx="167" cy="178" rx="27" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <ellipse cx="233" cy="178" rx="27" ry="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <ellipse cx="299" cy="178" rx="27" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="101" y="182" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">w=0</text>
  <text x="167" y="182" text-anchor="middle" font-size="9.5" fill="#2f5527" filter="url(#rough2)">w=1</text>
  <text x="233" y="182" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">w=2</text>
  <text x="299" y="182" text-anchor="middle" font-size="9.5" fill="#2f5527" filter="url(#rough2)">w=1</text>

  <text x="40" y="212" font-size="10" fill="#4a7a3a" filter="url(#rough2)">相邻重量 0→1→2→1 每次都不相等 ✓</text>

  <path d="M 400 74 L 400 224" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- 右侧：做差推导 -->
  <rect x="418" y="76" width="316" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="576" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">w_{i+1} − w_i = s_{i+2} − s_i</text>
  <text x="576" y="126" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">⇒ w_i = w_{i+1} ⟺ s_i = s_{i+2}</text>
  <text x="576" y="146" text-anchor="middle" font-size="9" fill="#9a7a30" filter="url(#rough2)">共用项 s_{i+1} 被消掉，只剩间隔为 2 的两个字符</text>

  <text x="418" y="180" font-size="10.5" fill="#333" filter="url(#rough2)">于是「全部相邻重量不等」等价于</text>
  <text x="418" y="200" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">对所有 1 ≤ i ≤ n−2 都有 s_i ≠ s_{i+2}</text>
  <text x="418" y="218" font-size="9" fill="#999" filter="url(#rough2)">即隔一格的两个位置不能相等</text>

  <path d="M 24 240 L 736 240" stroke="#ddd" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="380" y="264" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444" filter="url(#rough2)">等价描述：把位置按奇偶拆成两条链，每条链内部必须 0/1 交替</text>

  <!-- 奇数链 -->
  <text x="30" y="300" font-size="10.5" font-weight="bold" fill="#2c3e50" filter="url(#rough2)">奇数位</text>
  <text x="30" y="314" font-size="8.5" fill="#999" filter="url(#rough2)">1,3,5,…</text>
  <g filter="url(#rough2)">
    <circle cx="120" cy="300" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="180" cy="300" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="240" cy="300" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="300" cy="300" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="360" cy="300" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="120" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50" filter="url(#rough2)">0</text>
  <text x="180" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="240" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50" filter="url(#rough2)">0</text>
  <text x="300" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="360" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50" filter="url(#rough2)">0</text>
  <text x="400" y="296" font-size="10" fill="#4a7a3a" filter="url(#rough2)">→ 只能 0101… 或 1010…（2 种）</text>
  <text x="400" y="312" font-size="8.5" fill="#999" filter="url(#rough2)">由 s_1 一站式决定整条链</text>

  <!-- 偶数链 -->
  <text x="30" y="368" font-size="10.5" font-weight="bold" fill="#2c3e50" filter="url(#rough2)">偶数位</text>
  <text x="30" y="382" font-size="8.5" fill="#999" filter="url(#rough2)">2,4,6,…</text>
  <g filter="url(#rough2)">
    <circle cx="120" cy="368" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="180" cy="368" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="240" cy="368" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="300" cy="368" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="120" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50" filter="url(#rough2)">0</text>
  <text x="180" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="240" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50" filter="url(#rough2)">0</text>
  <text x="300" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="400" y="364" font-size="10" fill="#4a7a3a" filter="url(#rough2)">→ 同样 2 种，与奇链互不影响</text>
  <text x="400" y="380" font-size="8.5" fill="#999" filter="url(#rough2)">由 s_2 决定</text>

  <rect x="30" y="404" width="700" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="380" y="426" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">两条链各 2 种选择，且彼此独立 ⇒ 合法串至多 4 个，恰好由 (s_1, s_2) 唯一确定</text>
  <text x="380" y="448" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">所以候选集是固定的 4 个串：0101…/1010… 的奇偶拼接，答案 ∈ {0,1,2,3,4}</text>
</svg>
