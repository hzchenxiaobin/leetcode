<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="93"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 4 演算：tasks=[5,9,8,5,9], workers=[1,6,4,2,6], pills=1, s=5</text>

  <!-- 排序结果 -->
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">排序后 tasks = [5, 5, 8, 9, 9]（易→难），workers = [1, 2, 4, 6, 6]（弱→强）</text>

  <!-- check(3): 任务 8,5,5；工人 4,6,6 -->
  <rect x="50" y="84" width="540" height="180" rx="10" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">check(3)：最易的 3 个任务 {8, 5, 5}，最强的 3 个工人 {4, 6, 6}</text>

  <!-- 任务从难到易：8, 5, 5 -->
  <g text-anchor="middle" font-size="13" filter="url(#rough2)">
    <text x="120" y="140" fill="#333">任务 ① 需求 8</text>
    <text x="320" y="140" fill="#333">任务 ② 需求 5</text>
    <text x="520" y="140" fill="#333">任务 ③ 需求 5</text>
  </g>
  <g text-anchor="middle" font-size="12.5" filter="url(#rough2)">
    <text x="120" y="166" fill="#b85450">w+s≥8：激活 4,6,6 → 队 [4|6|6]</text>
    <text x="320" y="166" fill="#4a7a3a">激活：无（4,6,6 已全进）</text>
    <text x="520" y="166" fill="#4a7a3a">激活：无</text>
  </g>
  <g text-anchor="middle" font-size="12.5" filter="url(#rough2)">
    <text x="120" y="192" fill="#b85450">队尾 6 &lt; 8 → 队首 4 吃药丸</text>
    <text x="320" y="192" fill="#4a7a3a">队尾 6 ≥ 5 → 直接做</text>
    <text x="520" y="192" fill="#4a7a3a">队尾 6 ≥ 5 → 直接做</text>
  </g>
  <g text-anchor="middle" font-size="12.5" filter="url(#rough2)">
    <text x="120" y="218" fill="#888">药丸 1→0，队 [6|6]</text>
    <text x="320" y="218" fill="#888">队 [6]，不耗药丸</text>
    <text x="520" y="218" fill="#888">队 [ ]，任务全清</text>
  </g>
  <path d="M 196 176 L 246 176" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 396 176 L 446 176" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3 个任务全部完成 → check(3) = true</text>

  <!-- check(4) 失败 -->
  <rect x="50" y="280" width="540" height="110" rx="10" fill="#fafafa" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">check(4)：任务 {9, 8, 5, 5}，工人 {2, 4, 6, 6}（只剩 1 药丸）</text>
  <text x="320" y="328" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">最难任务 9：w+s≥9 只有 6,6（4+5=9 也行！）→ 激活 [4|6|6]</text>
  <text x="320" y="350" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">队尾 6 &lt; 9 → 队首 4 吃药丸（4+5=9 ✓）；剩任务 8：激活无，队 [6|6]</text>
  <text x="320" y="372" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">队尾 6 &lt; 8 → 需再吃一颗，但药丸已用完 → false</text>

  <text x="320" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">二分收敛于 k* = 3，与官方输出一致</text>
</svg>
