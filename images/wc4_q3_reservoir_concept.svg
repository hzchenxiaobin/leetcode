<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">蓄水池抽样：一次扫描、O(1) 额外空间</text>
  <text x="290" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">第 j 个命中以 1/j 的概率替换候选，扫完自然均匀</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="130" y="72" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="188" y="72" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="246" y="72" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="304" y="72" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="362" y="72" width="52" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="156" y="100" fill="#3a4a66">1</text>
    <text x="214" y="100" fill="#3a4a66">2</text>
    <text x="272" y="100" fill="#3a5a30">3</text>
    <text x="330" y="100" fill="#3a5a30">3</text>
    <text x="388" y="100" fill="#3a5a30">3</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#888">
    <text x="156" y="132">0</text>
    <text x="214" y="132">1</text>
    <text x="272" y="132">2</text>
    <text x="330" y="132">3</text>
    <text x="388" y="132">4</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="40" y="158" width="150" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="115" y="182" fill="#3a4a66">命中 #1：i = 2</text>
    <text x="115" y="204" fill="#8a3a36">替换概率 1/1</text>

    <rect x="215" y="158" width="150" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="290" y="182" fill="#8a6a20">命中 #2：i = 3</text>
    <text x="290" y="204" fill="#8a3a36">替换概率 1/2</text>

    <rect x="390" y="158" width="150" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="465" y="182" fill="#8a3a36">命中 #3：i = 4</text>
    <text x="465" y="204" fill="#8a3a36">替换概率 1/3</text>
  </g>

  <path d="M 115 222 C 115 244 250 240 272 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 222 L 290 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 465 222 C 465 244 332 240 308 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="145" y="258" width="290" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="290" y="280" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">候选 ans ← i（没抽中就保持原值）</text>
  <text x="290" y="298" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">全程只需要 cnt 与 ans 两个整数</text>

  <text x="290" y="336" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">每个命中下标被保留的概率：1/j × (j/(j+1)) × … × ((c−1)/c) = 1/c</text>
  <text x="290" y="358" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">示例：P(ans=2) = 1 × 1/2 × 2/3 = 1/3，对下标 3、4 同理，三者各 1/3</text>
  <text x="290" y="382" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">随机数取 [0, cnt) —— 取到 0 才替换，等价于以 1/cnt 的概率替换</text>
</svg>
