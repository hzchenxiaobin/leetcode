<svg xmlns="http://www.w3.org/2000/svg" width="620" height="470" viewBox="0 0 620 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="83" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="620" height="470" fill="#fdfcf7"/>
  <text x="310" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：分解 k 求模数，单趟扫描哈希配对</text>
  <path d="M 150 34 Q 310 42 470 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="80" y="46" width="260" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="210" y="68" text-anchor="middle" font-size="12" fill="#2b6e9e">试除分解 k ⟹ m = ∏ p^⌈e/2⌉</text>
  <path d="M 210 82 L 210 98" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="80" y="100" width="260" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="210" y="122" text-anchor="middle" font-size="12" fill="#333">D = V = 0；cnt[(0, 0)] = 1</text>
  <path d="M 210 136 L 210 152" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="80" y="154" width="260" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="210" y="176" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">遍历 s 的每个字符 c</text>
  <path d="M 210 190 L 210 206" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><polygon points="210,206 280,240 210,274 140,240" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="210" y="244" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">c 是元音?</text>
  <text x="294" y="231" text-anchor="middle" font-size="11" fill="#666">是</text>
  <text x="130" y="231" text-anchor="middle" font-size="11" fill="#666">否</text>

  <path d="M 280 240 L 310 240" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="310" y="223" width="130" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="375" y="245" text-anchor="middle" font-size="12" fill="#333">V += 1，D += 1</text>

  <path d="M 140 240 L 120 240" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="10" y="223" width="110" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="65" y="245" text-anchor="middle" font-size="12" fill="#7a5415">D −= 1</text>

  <path d="M 375 257 Q 375 282 330 292" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 65 257 Q 65 282 105 292" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="80" y="292" width="260" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="210" y="314" text-anchor="middle" font-size="12.5" fill="#a06a10" font-weight="bold">key = (D, V mod m)</text>
  <path d="M 210 328 L 210 344" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="80" y="346" width="260" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="210" y="366" text-anchor="middle" font-size="12.5" fill="#8c3a36" font-weight="bold">ans += cnt[key]</text>
  <text x="210" y="384" text-anchor="middle" font-size="10.5" fill="#666">cnt[key] += 1（先查后插）</text>

  <path d="M 340 368 L 452 368" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 452 368 L 452 172" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 452 172 L 344 172" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="444" y="268" text-anchor="end" font-size="11" fill="#888">下一个字符</text>
  <text x="444" y="284" text-anchor="end" font-size="10.5" fill="#999">（p 增 1）</text>

  <path d="M 210 390 L 210 404" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="80" y="406" width="260" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="210" y="428" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">返回 ans</text>

  <g filter="url(#sk)"><rect x="476" y="46" width="130" height="122" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="541" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">复杂度</text>
  <text x="541" y="90" text-anchor="middle" font-size="10.5" fill="#333">分解 k：O(√k)</text>
  <text x="541" y="108" text-anchor="middle" font-size="10.5" fill="#333">扫描：O(n)</text>
  <text x="541" y="126" text-anchor="middle" font-size="10.5" fill="#333">每字符 O(1) 哈希</text>
  <text x="541" y="144" text-anchor="middle" font-size="10.5" fill="#666">5×10⁴ 毫秒级</text>
  <text x="541" y="162" text-anchor="middle" font-size="10.5" fill="#666">对照 Q2 的 O(n²)</text>

  <g filter="url(#sk)"><rect x="476" y="182" width="130" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="541" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10">先查后插</text>
  <text x="541" y="224" text-anchor="middle" font-size="10.5" fill="#555">第 p 个前缀到来</text>
  <text x="541" y="240" text-anchor="middle" font-size="10.5" fill="#555">时表中只有 i&lt;p</text>
  <text x="541" y="256" text-anchor="middle" font-size="10.5" fill="#555">的同键前缀 ⟹</text>
  <text x="541" y="272" text-anchor="middle" font-size="10.5" fill="#555">增量即配对数</text>

  <g filter="url(#sk)"><rect x="476" y="292" width="130" height="124" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="541" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a36">空前缀入表</text>
  <text x="541" y="334" text-anchor="middle" font-size="10.5" fill="#555">(0,0) 先行放入；</text>
  <text x="541" y="350" text-anchor="middle" font-size="10.5" fill="#555">漏放则 s[0] 开</text>
  <text x="541" y="366" text-anchor="middle" font-size="10.5" fill="#555">头的子串全漏</text>
  <text x="541" y="382" text-anchor="middle" font-size="10.5" fill="#555">（如 baeyh 的</text>
  <text x="541" y="398" text-anchor="middle" font-size="10.5" fill="#555">「baey」）</text>

  <text x="310" y="456" text-anchor="middle" font-size="12" fill="#666">先查后插天然保证 i &lt; j，与组内 C(c,2) 等价 · O(n + √k) 时间 / O(n) 空间</text>
</svg>
