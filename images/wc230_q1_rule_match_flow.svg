<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="600" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：先翻译列名，再单遍扫描计数</text>
  <path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <ellipse cx="210" cy="68" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="210" y="73" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">开始</text>
  <path d="M 210 88 L 210 102" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="85" y="108" width="250" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="210" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">建映射</text>
  <text x="210" y="149" text-anchor="middle" font-size="11" fill="#333" font-family="monospace" filter="url(#sk)">mp = {type:0, color:1, name:2}</text>
  <path d="M 210 158 L 210 172" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="85" y="178" width="250" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="210" y="198" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">定下标（循环前仅一次）</text>
  <text x="210" y="219" text-anchor="middle" font-size="11.5" fill="#333" font-family="monospace" filter="url(#sk)">idx = mp[ruleKey]</text>
  <path d="M 210 228 L 210 242" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="85" y="248" width="250" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="210" y="273" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" filter="url(#sk)">for item in items:</text>
  <path d="M 210 290 L 210 306" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="210,312 332,362 210,412 88,362" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="210" y="356" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" filter="url(#sk)">item[idx] ==</text>
  <text x="210" y="374" text-anchor="middle" font-size="12" fill="#333" font-family="monospace" filter="url(#sk)">ruleValue ?</text>

  <text x="346" y="354" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <path d="M 332 362 L 396 362" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="400" y="340" width="160" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="480" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#sk)">count += 1</text>
  <path d="M 480 384 L 480 486 L 312 486" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <text x="222" y="432" font-size="12" font-weight="bold" fill="#8a4440" filter="url(#sk)">否</text>
  <path d="M 210 412 L 210 442" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="210,448 306,486 210,524 114,486" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="210" y="491" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#sk)">还有物品？</text>

  <text x="96" y="476" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <path d="M 114 486 L 40 486 L 40 269 L 81 269" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="28" y="378" font-size="11" fill="#666" filter="url(#sk)" transform="rotate(-90 28 378)">取下一件物品</text>

  <text x="222" y="540" font-size="12" font-weight="bold" fill="#8a4440" filter="url(#sk)">否</text>
  <path d="M 210 524 L 210 544" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <ellipse cx="210" cy="566" rx="58" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="210" y="571" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">返回 count</text>

  <g filter="url(#sk)">
    <rect x="392" y="182" width="216" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="500" y="203" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">循环不变量外提</text>
  <text x="500" y="223" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">ruleKey 是常量，循环内不再比较</text>
  <path d="M 390 209 L 341 204" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
</svg>
