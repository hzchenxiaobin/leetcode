<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="290" fill="#fafafa"/>
  <text x="330" y="32" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [3,1,2,4]</text>
  <rect x="44" y="58" width="76" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">轮次</text>
  <rect x="128" y="58" width="70" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="206" y="58" width="70" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="241.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">j</text>
  <rect x="284" y="58" width="220" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="394.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">nums</text>
  <rect x="512" y="58" width="128" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="576.0" y="80.32" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">操作</text>
  <rect x="44" y="100" width="76" height="36" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82.0" y="122.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第 1 轮</text>
  <rect x="128" y="100" width="70" height="36" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163.0" y="122.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="206" y="100" width="70" height="36" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="241.0" y="122.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="284" y="100" width="220" height="36" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="394.0" y="121.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3,1,2,4]</text>
  <rect x="512" y="100" width="128" height="36" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="576.0" y="122.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">左奇右偶 → 交换</text>
  <rect x="44" y="144" width="76" height="36" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82.0" y="166.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">第 2 轮</text>
  <rect x="128" y="144" width="70" height="36" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163.0" y="166.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="206" y="144" width="70" height="36" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="241.0" y="166.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="284" y="144" width="220" height="36" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="394.0" y="165.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[4,1,2,3]</text>
  <rect x="512" y="144" width="128" height="36" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="576.0" y="166.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">左奇右偶 → 交换</text>
  <rect x="44" y="188" width="76" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82.0" y="210.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">结束</text>
  <rect x="128" y="188" width="70" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163.0" y="210.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="206" y="188" width="70" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="241.0" y="210.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="284" y="188" width="220" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="394.0" y="209.96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[4,2,1,3]</text>
  <rect x="512" y="188" width="128" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="576.0" y="210.32" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &gt; j，停止</text>
  <text x="330" y="262" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">偶数 4,2 全部在奇数 1,3 之前 ✓（同为合法答案的还有 [2,4,1,3] 等）</text>
</svg>
