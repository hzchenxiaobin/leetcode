<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">中间插 C：枚举插入点，最大化 前缀L × 后缀T</text>
  <text x="290" y="54" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">以 s = "LTLT" 为例</text>

  <!-- 字符串格子 -->
  <rect x="80" y="66" width="46" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103" y="91" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">L</text>
  <rect x="140" y="66" width="46" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="91" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">T</text>
  <rect x="200" y="66" width="46" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="223" y="91" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">L</text>
  <rect x="260" y="66" width="46" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="91" text-anchor="middle" font-size="17" fill="#446688" filter="url(#rough2)">T</text>

  <text x="103" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">s0</text>
  <text x="163" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">s1</text>
  <text x="223" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">s2</text>
  <text x="283" y="118" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">s3</text>

  <!-- 插入位置标记 -->
  <path d="M72,124 L78,124 L75,131 Z" fill="#b85450" filter="url(#rough2)"/>
  <text x="75" y="144" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">p=0</text>
  <path d="M132,124 L138,124 L135,131 Z" fill="#b85450" filter="url(#rough2)"/>
  <text x="135" y="144" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">p=1</text>
  <path d="M192,124 L198,124 L195,131 Z" fill="#b85450" filter="url(#rough2)"/>
  <text x="195" y="144" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">p=2</text>
  <path d="M252,124 L258,124 L255,131 Z" fill="#b85450" filter="url(#rough2)"/>
  <text x="255" y="144" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">p=3</text>
  <path d="M312,124 L318,124 L315,131 Z" fill="#b85450" filter="url(#rough2)"/>
  <text x="315" y="144" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">p=4</text>

  <!-- 枚举表 -->
  <rect x="46" y="162" width="326" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="73" y="182" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">插入点 p</text>
  <text x="150" y="182" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">前缀 L 数</text>
  <text x="250" y="182" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">后缀 T 数</text>
  <text x="336" y="182" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">乘积</text>

  <line x1="46" y1="224" x2="372" y2="224" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="73" y="218" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="150" y="218" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="250" y="218" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="336" y="218" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>

  <line x1="46" y1="252" x2="372" y2="252" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="73" y="246" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="150" y="246" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="250" y="246" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="336" y="246" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>

  <line x1="46" y1="280" x2="372" y2="280" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="73" y="274" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="150" y="274" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="250" y="274" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="336" y="274" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>

  <rect x="46" y="280" width="326" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="73" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="150" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="250" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="336" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 ★</text>

  <line x1="46" y1="336" x2="372" y2="336" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="73" y="328" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <text x="150" y="328" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="250" y="328" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="336" y="328" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>

  <!-- 右侧：p=3 插入后的串 -->
  <text x="478" y="176" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">p=3 插入后：</text>
  <rect x="396" y="186" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="203" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">L</text>
  <rect x="424" y="186" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="436" y="203" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">T</text>
  <rect x="452" y="186" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="464" y="203" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">L</text>
  <rect x="480" y="186" width="24" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="492" y="203" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">C</text>
  <rect x="508" y="186" width="24" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="203" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">T</text>

  <path d="M408,214 Q464,258 520,214" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M464,214 Q494,244 520,216" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <text x="478" y="286" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">每对（前缀 L，后缀 T）</text>
  <text x="478" y="303" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">↔ 恰好 1 个新 LCT 子序列</text>
  <text x="478" y="328" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">新增 = 2 × 1 = 2</text>

  <!-- 底部结论 -->
  <rect x="46" y="364" width="508" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="384" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">s = "LTLT"：插两端收益为 0，答案 = 0 + 2 = 2</text>
  <text x="300" y="403" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">—— 只能靠中间插 C，这就是不能照搬「两端插」套路的原因！</text>
</svg>
