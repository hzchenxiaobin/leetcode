<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 3 演算：nums = [10,3,1,1]，枚举全部下标对</text>
  <rect x="96" y="48" width="58" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125.0" y="75.0" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">10</text>
  <text x="125" y="104" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="158" y="48" width="58" height="42" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="187.0" y="75.0" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="187" y="104" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <rect x="220" y="48" width="58" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="249.0" y="75.0" text-anchor="middle" font-size="15" fill="#7a5a10" filter="url(#rough2)">1</text>
  <text x="249" y="104" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <rect x="282" y="48" width="58" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="311.0" y="75.0" text-anchor="middle" font-size="15" fill="#7a3030" filter="url(#rough2)">1</text>
  <text x="311" y="104" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="430" y="74" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">三个段首 = 下标 0 与另两个下标</text>
  <text x="90" y="138" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">(i₁, i₂)</text>
  <text x="250" y="138" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">总代价</text>
  <text x="400" y="138" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">是否更优</text>
  <rect x="60" y="152" width="440" height="34" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="174" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1, 2)</text>
  <text x="250" y="174" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10 + 3 + 1 = 14</text>
  <text x="400" y="174" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">否</text>
  <rect x="60" y="192" width="440" height="34" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1, 3)</text>
  <text x="250" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10 + 3 + 1 = 14</text>
  <text x="400" y="214" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">否</text>
  <rect x="60" y="232" width="440" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="254" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(2, 3)</text>
  <text x="250" y="254" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">10 + 1 + 1 = 12</text>
  <text x="400" y="254" text-anchor="middle" font-size="11.5" fill="#1c3a1c" filter="url(#rough2)">是 → 答案 12</text>
  <rect x="60" y="280" width="440" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n ≤ 50 → 下标对最多 1225 个，O(n²) 枚举即可</text>
</svg>
