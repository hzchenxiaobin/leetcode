<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 495" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="495" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：按时间排序 + 并查集计数</text>

  <rect x="170" y="44" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① logs 按时间戳升序排序</text>
  <path d="M 280 76 L 280 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="90" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">② fa[i] = i，comps = n</text>
  <path d="M 280 122 L 280 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="136" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">③ 取下一条日志 (t, a, b)</text>
  <path d="M 280 168 L 280 180" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="182" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">④ ra = find(a)，rb = find(b)</text>
  <path d="M 280 214 L 280 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,232 352,262 280,292 208,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">ra == rb ?</text>
  <text x="362" y="252" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否（真合并）</text>
  <path d="M 352 262 L 382 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="386" y="238" width="148" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="460" y="258" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">fa[ra] = rb</text>
  <text x="460" y="276" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">comps −−</text>
  <text x="290" y="306" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 280 292 L 280 304" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="306" width="240" height="32" fill="#f0f0ec" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">无效边：comps 不变</text>

  <path d="M 460 286 L 460 382 L 356 382" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 338 L 280 350" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,352 352,382 280,412 208,382" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">comps == 1 ?</text>
  <text x="290" y="428" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 280 412 L 280 436" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="185" y="440" width="190" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="462" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">返回 t（答案）</text>
  <text x="218" y="372" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 208 382 L 90 382 L 90 152 L 156 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="372" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">否：下一条日志</text>

  <text x="280" y="490" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">循环退出（日志全部用尽）仍未 comps == 1 → 返回 −1；find 用路径压缩即可，无需按秩合并</text>
</svg>
