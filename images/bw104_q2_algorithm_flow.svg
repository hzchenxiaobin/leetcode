<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：排序摊平，逐列取最大</text>

  <rect x="40" y="128" width="110" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="148" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">每行升序排序</text>
  <text x="95" y="166" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">第 j 大 = row[len−1−j]</text>

  <path d="M 150 151 L 185 151" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="190" y="128" width="120" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="148" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">for j = 0 .. cols−1</text>
  <text x="250" y="166" text-anchor="middle" font-size="11" fill="#2f5527" filter="url(#rough2)">cols = 最长行的长度</text>

  <path d="M 310 151 L 345 151" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <polygon points="410,116 465,151 410,186 355,151" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="147" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">该行长度</text>
  <text x="410" y="163" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">大于 j ?</text>

  <path d="M 410 186 L 410 224" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)" fill="none"/>
  <text x="420" y="206" font-size="11" fill="#2f5527" filter="url(#rough2)">是 → 参与取最大</text>

  <rect x="290" y="228" width="240" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="248" text-anchor="middle" font-size="13" fill="#8c3a36" filter="url(#rough2)">score += max(各行 row[len−1−j])</text>
  <text x="410" y="264" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">短行耗尽后自动退出，不需要特判</text>

  <text x="40" y="66" font-size="13" fill="#333" filter="url(#rough2)">逐轮模拟（堆或线性扫）约 4.5×10⁷ 次操作；</text>
  <text x="40" y="88" font-size="12" fill="#555" filter="url(#rough2)">排序摊平后：O(mn log n) 排序 + O(mn) 列扫描，一步到位。</text>
  <text x="40" y="240" font-size="12" fill="#7a5a10" filter="url(#rough2)">对照（堆实现）：每行一个大根堆，每轮弹各堆顶取最大，</text>
  <text x="40" y="258" font-size="12" fill="#7a5a10" filter="url(#rough2)">正确性同源，复杂度 O(mn log n)，但代码更长。</text>
</svg>
