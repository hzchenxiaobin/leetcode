<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#999"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历 ＋ 哈希表查历史前缀和</text>

  <!-- init -->
  <g filter="url(#rough2)">
    <rect x="160" y="52" width="300" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="9"/>
    <text x="310" y="78" text-anchor="middle" font-size="12.5" fill="#333">cnt ← {0: 1}　pre ← 0　ans ← 0</text>
  </g>
  <path d="M 310 94 L 310 118" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop body -->
  <g filter="url(#rough2)">
    <rect x="160" y="120" width="300" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="9"/>
    <text x="310" y="146" text-anchor="middle" font-size="12.5" fill="#333">遍历 nums：pre ＋＝ x</text>
  </g>
  <path d="M 310 162 L 310 180" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <g filter="url(#rough2)">
    <polygon points="310,182 436,228 310,274 184,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9"/>
    <text x="310" y="224" text-anchor="middle" font-size="12.5" fill="#333">need ＝ pre − k</text>
    <text x="310" y="246" text-anchor="middle" font-size="12.5" fill="#333">在 cnt 中？</text>
  </g>

  <!-- yes branch -->
  <path d="M 436 228 L 470 228" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="450" y="220" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="470" y="204" width="132" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="9"/>
    <text x="536" y="224" text-anchor="middle" font-size="12" fill="#333">ans ＋＝</text>
    <text x="536" y="243" text-anchor="middle" font-size="12" fill="#333">cnt[need]</text>
  </g>

  <!-- junction -->
  <g filter="url(#rough2)">
    <path d="M 310 274 L 310 286" stroke="#446688" stroke-width="1.8" fill="none"/>
    <path d="M 536 252 L 536 290 L 306 290" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <circle cx="310" cy="290" r="4.5" fill="#446688"/>
    <text x="340" y="283" font-size="11" fill="#b85450" font-weight="bold">否：直接跳过累加</text>
  </g>
  <path d="M 310 295 L 310 314" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- increment -->
  <g filter="url(#rough2)">
    <rect x="170" y="316" width="280" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="9"/>
    <text x="310" y="341" text-anchor="middle" font-size="12.5" fill="#333">cnt[pre] ＋＝ 1</text>
  </g>

  <!-- loop back -->
  <path d="M 170 337 L 112 337 L 112 141 L 156 141" stroke="#999" stroke-width="1.6" fill="none"
        stroke-dasharray="5,4" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="132" y="240" font-size="11" fill="#999" font-weight="bold" transform="rotate(-90 132 240)" filter="url(#rough2)">继续下一个 x</text>

  <path d="M 310 358 L 310 376" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="170" y="378" width="280" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="9"/>
    <text x="310" y="403" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">循环结束，返回 ans</text>
  </g>
</svg>
