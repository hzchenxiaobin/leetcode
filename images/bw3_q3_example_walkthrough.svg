<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="25"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n = 6，日志按时间升序逐条加边，comps 一路减到 1</text>

  <g filter="url(#rough2)" stroke="#ddd" stroke-width="1">
    <line x1="88" y1="96" x2="560" y2="96"/>
    <line x1="88" y1="122" x2="560" y2="122"/>
    <line x1="88" y1="148" x2="560" y2="148"/>
    <line x1="88" y1="174" x2="560" y2="174"/>
    <line x1="88" y1="200" x2="560" y2="200"/>
    <line x1="88" y1="226" x2="560" y2="226"/>
  </g>
  <g filter="url(#rough2)" font-size="9" fill="#999" text-anchor="end">
    <text x="82" y="99">comps=6</text>
    <text x="82" y="125">comps=5</text>
    <text x="82" y="151">comps=4</text>
    <text x="82" y="177">comps=3</text>
    <text x="82" y="203">comps=2</text>
    <text x="82" y="229">comps=1</text>
  </g>

  <line x1="88" y1="232" x2="560" y2="232" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <path d="M 96 96 L 132 96 L 132 122 L 187 122 L 187 148 L 242 148 L 242 174 L 297 174 L 297 200 L 407 200 L 407 226" stroke="#446688" stroke-width="2.2" fill="none"/>
    <path d="M 407 226 L 517 226" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>
  </g>

  <g filter="url(#rough2)" fill="#446688">
    <circle cx="96" cy="96" r="5"/>
    <circle cx="132" cy="122" r="5"/>
    <circle cx="187" cy="148" r="5"/>
    <circle cx="242" cy="174" r="5"/>
    <circle cx="297" cy="200" r="5"/>
    <circle cx="352" cy="200" r="5" fill="#999"/>
    <circle cx="407" cy="226" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <path d="M 436 226 L 476 226" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="490" y="220" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">comps = 1</text>
  <text x="490" y="236" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">返回 20190301 ★</text>

  <text x="96" y="84" font-size="8.5" fill="#888" text-anchor="middle" filter="url(#rough2)">初始 6</text>
  <text x="143" y="118" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="198" y="144" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="253" y="170" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="308" y="196" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="352" y="190" font-size="8.5" fill="#999" text-anchor="middle" filter="url(#rough2)">无效边：仍为 2</text>

  <g filter="url(#rough2)" font-size="8.5" fill="#555" text-anchor="middle">
    <text x="132" y="248">0101</text><text x="132" y="260" font-size="8" fill="#999">(0,1)</text>
    <text x="187" y="248">0104</text><text x="187" y="260" font-size="8" fill="#999">(3,4)</text>
    <text x="242" y="248">0107</text><text x="242" y="260" font-size="8" fill="#999">(2,3)</text>
    <text x="297" y="248">0211</text><text x="297" y="260" font-size="8" fill="#999">(1,5)</text>
    <text x="352" y="248">0224</text><text x="352" y="260" font-size="8" fill="#999">(2,4)</text>
    <text x="407" y="248" fill="#8a6a20" font-weight="bold">0301</text><text x="407" y="260" font-size="8" fill="#999">(0,3)</text>
    <text x="462" y="248" fill="#bbb">0312</text><text x="462" y="260" font-size="8" fill="#bbb">已返回</text>
    <text x="517" y="248" fill="#bbb">0322</text><text x="517" y="260" font-size="8" fill="#bbb">已返回</text>
  </g>

  <rect x="55" y="286" width="530" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="320" y="308" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">前 4 条日志都是真合并：comps 6 → 5 → 4 → 3 → 2（朋友圈 {0,1,5} 与 {2,3,4}）</text>
  <text x="320" y="328" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">20190224 时 2、4 已同属一簇 → 无效边，comps 停留在 2</text>
  <text x="320" y="348" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">20190301 合并两大簇 → comps = 1，全体互相熟识，答案就是该条日志的时间戳</text>
  <text x="320" y="366" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">其后 20190312、20190322 两条日志无需处理（提前返回）</text>

  <text x="320" y="404" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">若全部日志处理完 comps 仍 &gt; 1（真合并不足 n−1 次）→ 返回 −1</text>
</svg>
