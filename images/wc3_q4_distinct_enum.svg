<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">枚举「不同字符种数」d：把双约束拆成 26 次单约束</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">答案子串的字符种数必是某个确定的 d；外层枚举 d，内层用双指针求「至多 d 种字符」的最长合法窗口</text>

  <!-- 字符串 "ababbc" 与绿色高亮窗口 -->
  <rect x="113" y="68" width="328" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle" font-weight="bold">
    <rect x="119" y="74" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="185" y="74" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="251" y="74" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="317" y="74" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="383" y="74" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="449" y="74" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="145" y="101" fill="#3a4a66">a</text>
    <text x="211" y="101" fill="#3a4a66">b</text>
    <text x="277" y="101" fill="#3a4a66">a</text>
    <text x="343" y="101" fill="#3a4a66">b</text>
    <text x="409" y="101" fill="#3a4a66">b</text>
    <text x="475" y="101" fill="#8a3a36">c</text>
  </g>
  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#999">
    <text x="145" y="128">0</text><text x="211" y="128">1</text><text x="277" y="128">2</text>
    <text x="343" y="128">3</text><text x="409" y="128">4</text><text x="475" y="128">5</text>
  </g>
  <text x="310" y="150" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">绿色窗口「ababb」：d = 2 种字符，a 出现 2 次、b 出现 3 次，都 ≥ k = 2</text>

  <!-- 三步拆解 -->
  <rect x="30" y="166" width="160" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="110" y="190" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">① 答案含 d 种字符</text>
  <text x="110" y="210" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">d ∈ {1, 2, …, 26}</text>
  <text x="110" y="226" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">枚举它</text>

  <path d="M 192 201 L 221 201" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="225" y="166" width="180" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="315" y="190" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">② 窗口只许 ≤ d 种</text>
  <text x="315" y="210" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">种数随窗口右端单调</text>
  <text x="315" y="226" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">→ 双指针可做</text>

  <path d="M 407 201 L 436 201" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="440" y="166" width="155" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="517" y="190" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">③ 判每字符次数</text>
  <text x="517" y="210" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">每种都 ≥ k</text>
  <text x="517" y="226" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">才更新 ans</text>

  <!-- 枚举的 d -->
  <text x="34" y="266" font-size="10" fill="#555" filter="url(#rough2)">要跑</text>
  <text x="34" y="280" font-size="10" fill="#555" filter="url(#rough2)">的 d：</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="72" y="252" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <rect x="130" y="252" width="42" height="28" fill="#d4e9d8" stroke="#4a7a3a" stroke-width="2.2" rx="5"/>
    <rect x="188" y="252" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <rect x="246" y="252" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <rect x="304" y="252" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <rect x="362" y="252" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="93" y="271" fill="#3a5a30">1</text>
    <text x="151" y="271" fill="#2f4a26">2 ✓</text>
    <text x="209" y="271" fill="#3a5a30">3</text>
    <text x="267" y="271" fill="#3a5a30">4</text>
    <text x="325" y="271" fill="#3a5a30">5</text>
    <text x="383" y="271" fill="#3a5a30">6</text>
    <text x="424" y="271" fill="#777">…</text>
    <rect x="442" y="252" width="42" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="463" y="271" fill="#3a5a30">26</text>
  </g>
  <text x="500" y="271" font-size="10" fill="#888" filter="url(#rough2)">（d = 2 命中「ababb」）</text>

  <!-- 结论 -->
  <rect x="60" y="300" width="512" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="76" y="322" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">为什么这样就够</text>
  <text x="76" y="342" font-size="10" fill="#555" filter="url(#rough2)">每个 d 跑一遍 O(n) 双指针，d ≤ 26 种 → 总复杂度 O(26·n)。</text>
  <text x="76" y="360" font-size="10" fill="#555" filter="url(#rough2)">窗口只维护 distinct（种数）与 good（次数 ≥ k 的种数），移入移出 O(1)。</text>

  <text x="310" y="390" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">注意：d 只枚举到 s 中真实出现的种数即可，超出时窗口永远凑不满 d 种，纯属浪费</text>
</svg>
