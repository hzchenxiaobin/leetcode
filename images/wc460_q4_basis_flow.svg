<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">总流程：枚举 B → 掩码 → 线性基 → 合并</text>

  <!-- preprocess -->
  <rect x="160" y="46" width="320" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="66" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">预处理 xs[m] / ands[m]</text>
  <text x="320" y="83" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">子集 DP：xs[m]=xs[m^lowbit]⊕a[i]，O(2ⁿ)</text>

  <path d="M320,90 L320,106" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- enumerate B -->
  <rect x="160" y="110" width="320" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="135" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">枚举 AND 组 B ⊆ {0,…,n−1}（2¹⁹ 种）</text>

  <path d="M240,150 L185,166" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M400,150 L455,166" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- left: tau & mask -->
  <rect x="52" y="170" width="264" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="184" y="192" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T = 补集，τ = xs[T]</text>
  <text x="184" y="210" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">mask = ~τ（只留关键位）</text>
  <text x="184" y="227" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">C++ 记得截断到 30 位</text>

  <!-- right: AND(B) -->
  <rect x="324" y="170" width="264" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="192" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">AND(B) = ands[B]</text>
  <text x="456" y="210" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">B = ∅ 时按题意取 0</text>
  <text x="456" y="227" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">（不是全 1！见易错点）</text>

  <path d="M184,234 L240,252" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M456,234 L400,252" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- basis build -->
  <rect x="160" y="256" width="320" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="278" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">对 i ∈ T：v = aᵢ &amp; mask 插入线性基</text>
  <text x="320" y="296" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">basis[s] 按最高位 s 归位；已被张成的数会消成 0</text>

  <path d="M320,316 L320,332" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- greedy -->
  <rect x="120" y="336" width="400" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="357" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">从高位到低位贪心：若 r ⊕ basis[s] &gt; r 则 r ← r ⊕ basis[s]</text>
  <text x="320" y="377" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">得关键位上的最大异或和 r（A、C 只看关键位时异或值相等）</text>

  <path d="M320,388 L320,402" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- combine -->
  <rect x="90" y="406" width="460" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="427" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cand = AND(B) + τ + 2r → 对所有 B 取 max</text>
  <text x="320" y="446" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">O(2ⁿ·n·log V)：n=19, V &lt; 2³⁰，实测 C++ ≈ 0.1s、Python ≈ 2.7s</text>
</svg>
