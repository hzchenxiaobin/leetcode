<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：每天一次松弛，只留两个数</text>
  <text x="280" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">先用旧 cash 更新 hold，再用旧 hold 更新 cash</text>

  <g filter="url(#rough2)">
    <rect x="60" y="64" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="160" y="82" text-anchor="middle" font-size="9.5" fill="#8a6a20">初始化（第 0 天）</text>
    <text x="160" y="100" text-anchor="middle" font-size="11.5" fill="#555">cash = 0，hold = -∞</text>

    <rect x="300" y="64" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="400" y="82" text-anchor="middle" font-size="9.5" fill="#3a4a66">第 i 天</text>
    <text x="400" y="100" text-anchor="middle" font-size="11.5" fill="#555">p = prices[i]</text>

    <path d="M 264 86 L 294 86" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 400 112 L 400 134" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="180" y="128" text-anchor="middle" font-size="9.5" fill="#999">对 i = 0 .. n-1 依次执行</text>

    <rect x="60" y="140" width="420" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="8"/>
    <text x="76" y="160" font-size="12" fill="#33445e" font-weight="bold">hold = max(hold, cash - p - fee)</text>
    <text x="76" y="181" font-size="9.5" fill="#66788e">买入分支：今天上车，成本 = 价格 + fee（fee 只在这里付）</text>

    <path d="M 270 194 L 270 208" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

    <rect x="60" y="212" width="420" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8"/>
    <text x="76" y="232" font-size="12" fill="#3a5a30" font-weight="bold">cash = max(cash, hold + p)</text>
    <text x="76" y="253" font-size="9.5" fill="#5a7a4e">卖出分支：今天下车，按原价卖出，不再扣费</text>
  </g>

  <text x="280" y="290" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">两个状态必须用「当天开始前」的旧值同时更新，避免同一天既买又卖</text>

  <g filter="url(#rough2)">
    <path d="M 280 266 L 280 300" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <rect x="160" y="304" width="240" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="280" y="333" text-anchor="middle" font-size="12.5" fill="#8a3a36" font-weight="bold">返回 cash（第 n 天不持股）</text>
  </g>

  <text x="280" y="376" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">时间 O(n)，空间 O(1)：每天只做两次 max</text>
</svg>
