<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="580" height="520" fill="#fafafa"/>
  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次后序 DFS 拿到三个区域大小</text>
  <rect x="150" y="34" width="280" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="290" y="57" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">后序 DFS：返回子树节点数</text>
  <text x="290" y="78" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">命中 val == x 时记下 l、r</text>
  <rect x="40" y="128" width="190" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="135" y="158" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">左子树大小 → l</text>
  <rect x="350" y="128" width="190" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="445" y="158" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">右子树大小 → r</text>
  <rect x="170" y="218" width="240" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="290" y="246" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">p = n − 1 − l − r</text>
  <rect x="170" y="300" width="240" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="290" y="328" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">M = max(l, r, p)</text>
  <path d="M 290 90 L 290 108" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 290 108 L 135 108" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 135 108 L 135 126" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 108 L 445 108" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 445 108 L 445 126" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 135 178 L 135 198" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 445 178 L 445 198" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 135 198 L 290 198" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 445 198 L 290 198" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 290 198 L 290 216" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 264 L 290 298" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 346 L 290 368" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="290,370 400,412 290,454 180,412" fill="#b85450" fill-opacity="0.12" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="290" y="417" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">M > ⌊n/2⌋ ?</text>
  <path d="M 290 454 L 290 468" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 290 468 L 175 468" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 290 468 L 405 468" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 175 468 L 175 478" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 405 468 L 405 478" stroke="#999" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="480" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="175" y="502" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">true 必胜</text>
  <rect x="340" y="480" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="502" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">false 不胜</text>
</svg>
