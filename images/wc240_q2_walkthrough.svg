<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="860" height="500" fill="#fafafa"/>

  <text x="430" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：nums1 = [55,30,5,4,2]，nums2 = [100,20,10,10,5] → 答案 2</text>
  <text x="430" y="45" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">逐行「拉齐 → 推进 → 记录 R_i − i」，最终最优对是 (2, 4)</text>

  <!-- nums1 行 -->
  <text x="86" y="91" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">nums1</text>
  <rect x="100" y="70" width="68" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">55</text>
  <rect x="168" y="70" width="68" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="202" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">30</text>
  <rect x="236" y="70" width="68" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="270" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#b27a10" filter="url(#rough2)">5</text>
  <rect x="304" y="70" width="68" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="338" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="372" y="70" width="68" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="406" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="270" y="60" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">i = 2 ↓</text>
  <text x="134" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="202" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="270" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="338" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="406" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>

  <!-- nums2 行 -->
  <text x="86" y="157" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">nums2</text>
  <rect x="100" y="136" width="68" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">100</text>
  <rect x="168" y="136" width="68" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="202" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">20</text>
  <rect x="236" y="136" width="68" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="304" y="136" width="68" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="338" y="157" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="372" y="136" width="68" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="406" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="134" y="182" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="202" y="182" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="270" y="182" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="338" y="182" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="406" y="182" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4 ← j = 4</text>

  <!-- 最优对弧线 -->
  <path d="M 270 122 C 300 142 380 142 404 134" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="345" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">距离 4 − 2 = 2（5 ≤ 5 ✓）</text>

  <!-- 演算表 -->
  <g filter="url(#rough2)">
    <!-- 表头 -->
    <rect x="60" y="210" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="80" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">i</text>
    <rect x="100" y="210" width="75" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="137" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">nums1[i]</text>
    <rect x="175" y="210" width="115" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="232" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">j（拉齐后）</text>
    <rect x="290" y="210" width="210" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="395" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">while 推进轨迹</text>
    <rect x="500" y="210" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="550" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">R_i = j−1</text>
    <rect x="600" y="210" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="660" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">行最优 R_i−i</text>
    <rect x="720" y="210" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="760" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">ans</text>

    <!-- 行 0 -->
    <rect x="60" y="240" width="40" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="80" y="265" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="100" y="240" width="75" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="137" y="265" text-anchor="middle" font-size="11" fill="#333">55</text>
    <rect x="175" y="240" width="115" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="232" y="265" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="290" y="240" width="210" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="395" y="265" text-anchor="middle" font-size="10.5" fill="#333">0 → 1（20 &lt; 55 停）</text>
    <rect x="500" y="240" width="100" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="550" y="265" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="600" y="240" width="120" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="660" y="265" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="720" y="240" width="80" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="760" y="265" text-anchor="middle" font-size="11" fill="#333">0</text>

    <!-- 行 1 -->
    <rect x="60" y="280" width="40" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="80" y="305" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="100" y="280" width="75" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="137" y="305" text-anchor="middle" font-size="11" fill="#333">30</text>
    <rect x="175" y="280" width="115" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="232" y="305" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="290" y="280" width="210" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="395" y="305" text-anchor="middle" font-size="10.5" fill="#333">原地（20 &lt; 30）</text>
    <rect x="500" y="280" width="100" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="550" y="305" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="600" y="280" width="120" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="660" y="305" text-anchor="middle" font-size="10.5" fill="#b85450">—（R &lt; i）</text>
    <rect x="720" y="280" width="80" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="760" y="305" text-anchor="middle" font-size="11" fill="#333">0</text>

    <!-- 行 2（高亮） -->
    <rect x="60" y="320" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="80" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="#b27a10">2</text>
    <rect x="100" y="320" width="75" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="137" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="#b27a10">5</text>
    <rect x="175" y="320" width="115" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="232" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="#b27a10">2（拉齐）</text>
    <rect x="290" y="320" width="210" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="395" y="345" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b27a10">2 → 3 → 4 → 5 = m</text>
    <rect x="500" y="320" width="100" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="550" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="#b27a10">4</text>
    <rect x="600" y="320" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="660" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">2 ★</text>
    <rect x="720" y="320" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="760" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="#b27a10">2</text>

    <!-- 行 3 -->
    <rect x="60" y="360" width="40" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="80" y="385" text-anchor="middle" font-size="11" fill="#333">3</text>
    <rect x="100" y="360" width="75" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="137" y="385" text-anchor="middle" font-size="11" fill="#333">4</text>
    <rect x="175" y="360" width="115" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="232" y="385" text-anchor="middle" font-size="11" fill="#333">5（= m）</text>
    <rect x="290" y="360" width="210" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="395" y="385" text-anchor="middle" font-size="10.5" fill="#333">不动（j 已到 m）</text>
    <rect x="500" y="360" width="100" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="550" y="385" text-anchor="middle" font-size="11" fill="#333">4</text>
    <rect x="600" y="360" width="120" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="660" y="385" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="720" y="360" width="80" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="760" y="385" text-anchor="middle" font-size="11" fill="#333">2</text>

    <!-- 行 4 -->
    <rect x="60" y="400" width="40" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="80" y="425" text-anchor="middle" font-size="11" fill="#333">4</text>
    <rect x="100" y="400" width="75" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="137" y="425" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="175" y="400" width="115" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="232" y="425" text-anchor="middle" font-size="11" fill="#333">5（= m）</text>
    <rect x="290" y="400" width="210" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="395" y="425" text-anchor="middle" font-size="10.5" fill="#333">不动（j 已到 m）</text>
    <rect x="500" y="400" width="100" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="550" y="425" text-anchor="middle" font-size="11" fill="#333">4</text>
    <rect x="600" y="400" width="120" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="660" y="425" text-anchor="middle" font-size="11" fill="#333">0</text>
    <rect x="720" y="400" width="80" height="40" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <text x="760" y="425" text-anchor="middle" font-size="11" fill="#333">2</text>
  </g>

  <!-- 底部结论 -->
  <rect x="60" y="456" width="740" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="478" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">i = 2 行门槛骤降（30 → 5），j 一路推到 m；最优对 (2, 4) 满足 5 ≤ 5 —— 值条件含等号</text>
</svg>
