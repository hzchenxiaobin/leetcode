<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1, 3, 5, 7]</text>
  <path d="M 180 40 Q 320 48 460 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: accumulation table -->
  <g filter="url(#sk)">
    <rect x="40" y="58" width="330" height="224" rx="10" fill="#f4f7fb" stroke="#8899aa" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold">
    <text x="85" y="80" fill="#446688">i</text>
    <text x="165" y="80" fill="#446688">nums[i]</text>
    <text x="245" y="80" fill="#446688">符号</text>
    <text x="330" y="80" fill="#446688">累计 ans</text>
  </g>
  <path d="M 50 88 L 360 88" stroke="#8899aa" stroke-width="1" filter="url(#sk)"/>
  <g font-size="12" text-anchor="middle">
    <text x="85" y="114" fill="#333">0</text><text x="165" y="114" fill="#333">1</text>
    <text x="245" y="114" fill="#4a7a3a" font-weight="bold">+</text><text x="330" y="114" fill="#2e5e2e" font-weight="bold">1</text>
    <text x="85" y="152" fill="#333">1</text><text x="165" y="152" fill="#333">3</text>
    <text x="245" y="152" fill="#b85450" font-weight="bold">−</text><text x="330" y="152" fill="#2e5e2e" font-weight="bold">−2</text>
    <text x="85" y="190" fill="#333">2</text><text x="165" y="190" fill="#333">5</text>
    <text x="245" y="190" fill="#4a7a3a" font-weight="bold">+</text><text x="330" y="190" fill="#2e5e2e" font-weight="bold">3</text>
    <text x="85" y="228" fill="#333">3</text><text x="165" y="228" fill="#333">7</text>
    <text x="245" y="228" fill="#b85450" font-weight="bold">−</text><text x="330" y="228" fill="#b85450" font-weight="bold">−4</text>
  </g>
  <path d="M 50 242 L 360 242" stroke="#8899aa" stroke-width="1" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="200" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">ans = −4 ✓</text>

  <!-- right: running expression -->
  <g font-size="13">
    <g filter="url(#sk)"><rect x="410" y="70" width="200" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
    <text x="510" y="90" text-anchor="middle" fill="#2e5e2e" font-family="monospace">ans = 0 + 1 = 1</text>
    <path d="M 510 102 L 510 116" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar2)" filter="url(#sk)"/>
    <g filter="url(#sk)"><rect x="410" y="120" width="200" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="510" y="140" text-anchor="middle" fill="#9e3a36" font-family="monospace">ans = 1 − 3 = −2</text>
    <path d="M 510 152 L 510 166" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar2)" filter="url(#sk)"/>
    <g filter="url(#sk)"><rect x="410" y="170" width="200" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
    <text x="510" y="190" text-anchor="middle" fill="#2e5e2e" font-family="monospace">ans = −2 + 5 = 3</text>
    <path d="M 510 202 L 510 216" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar2)" filter="url(#sk)"/>
    <g filter="url(#sk)"><rect x="410" y="220" width="200" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
    <text x="510" y="240" text-anchor="middle" fill="#9e3a36" font-family="monospace" font-weight="bold">ans = 3 − 7 = −4</text>
  </g>

  <!-- boundary note -->
  <g filter="url(#sk)">
    <rect x="40" y="300" width="570" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="325" y="319" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">边界：单元素 [100] → 只有 nums[0] 参与加法，ans = 100（无减项）</text>
  <text x="325" y="337" text-anchor="middle" font-size="11" fill="#999">结果可为负数，不要误取绝对值</text>
</svg>
