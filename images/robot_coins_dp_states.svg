<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：把「感化次数 k」编进状态 —— dp[i][j][k]</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">经典格路 DP 复制成 3 层；同层 = 上/左移动，负格还能「升层」感化</text>

  <!-- ===== left panel: classic single-layer grid ===== -->
  <text x="150" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">一层：经典格路 DP</text>

  <g filter="url(#rough2)"><rect x="60" y="92" width="60" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="90" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">0</text>

  <g filter="url(#rough2)"><rect x="120" y="92" width="60" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="150" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>

  <g filter="url(#rough2)"><rect x="180" y="92" width="60" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="210" y="122" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>

  <g filter="url(#rough2)"><rect x="60" y="140" width="60" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="90" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>

  <g filter="url(#rough2)"><rect x="120" y="140" width="60" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="150" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">−2</text>

  <g filter="url(#rough2)"><rect x="180" y="140" width="60" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="210" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>

  <g filter="url(#rough2)"><rect x="60" y="188" width="60" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="90" y="218" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>

  <g filter="url(#rough2)"><rect x="120" y="188" width="60" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="150" y="218" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">−3</text>

  <g filter="url(#rough2)"><rect x="180" y="188" width="60" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="210" y="218" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>

  <g filter="url(#rough2)"><circle cx="67" cy="100" r="9.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="67" y="104" text-anchor="middle" font-size="9.5" fill="#2c5f2c" filter="url(#rough2)">起</text>
  <g filter="url(#rough2)"><circle cx="233" cy="228" r="9.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="233" y="232" text-anchor="middle" font-size="9.5" fill="#2c5f2c" filter="url(#rough2)">终</text>

  <text x="60" y="254" font-size="10" fill="#666" filter="url(#rough2)">只能向右或向下移动</text>
  <text x="60" y="270" font-size="10" fill="#666" filter="url(#rough2)">每格收益 c = coins[i][j]</text>
  <text x="60" y="286" font-size="10" fill="#666" filter="url(#rough2)">（负格 = 被抢走 |c|）</text>

  <g filter="url(#rough2)"><rect x="60" y="300" width="212" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="74" y="322" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">一层不够！</text>
  <text x="74" y="340" font-size="9.5" fill="#444" filter="url(#rough2)">「走哪条路」与「在哪感化」耦合：</text>
  <text x="74" y="354" font-size="9.5" fill="#444" filter="url(#rough2)">感化把 −|c| 变 0，最优路径随之改变</text>

  <!-- ===== right panel: 3 stacked layer cards ===== -->
  <text x="405" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">三层：k = 0, 1, 2 各一张拷贝</text>

  <!-- card k=2 -->
  <g filter="url(#rough2)"><rect x="352" y="92" width="150" height="112" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="366" y="112" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">k=2</text>
  <g filter="url(#rough2)"><rect x="367" y="122" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="407" y="122" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="447" y="122" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="367" y="148" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="407" y="148" width="40" height="26" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="447" y="148" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="367" y="174" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="407" y="174" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="447" y="174" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>

  <!-- card k=1 -->
  <g filter="url(#rough2)"><rect x="322" y="168" width="150" height="112" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="336" y="188" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">k=1</text>
  <g filter="url(#rough2)"><rect x="337" y="198" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="377" y="198" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="417" y="198" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="337" y="224" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="377" y="224" width="40" height="26" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="417" y="224" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="337" y="250" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="377" y="250" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="417" y="250" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>

  <!-- card k=0 -->
  <g filter="url(#rough2)"><rect x="292" y="244" width="150" height="112" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="306" y="264" font-size="13" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">k=0</text>
  <g filter="url(#rough2)"><rect x="307" y="274" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="347" y="274" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="387" y="274" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="307" y="300" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="347" y="300" width="40" height="26" rx="2" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="387" y="300" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="307" y="326" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="347" y="326" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <g filter="url(#rough2)"><rect x="387" y="326" width="40" height="26" rx="2" fill="#fdfdfd" stroke="#7a94ad" stroke-width="1"/></g>
  <text x="327" y="291" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">→</text>
  <text x="327" y="317" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">↓</text>

  <!-- pacify arrows between layers -->
  <path d="M 369 306 L 394 246" stroke="#b85450" stroke-width="2" stroke-dasharray="6 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="372" y="284" text-anchor="end" font-size="9.5" fill="#b85450" filter="url(#rough2)">感化：本格记 0</text>
  <path d="M 399 230 L 424 170" stroke="#b85450" stroke-width="2" stroke-dasharray="6 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="402" y="208" text-anchor="end" font-size="9.5" fill="#b85450" filter="url(#rough2)">感化：k 再 +1</text>

  <!-- ===== legend ===== -->
  <g filter="url(#rough2)"><rect x="60" y="372" width="480" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="82" cy="392" r="3.5" fill="#446688"/></g>
  <text x="94" y="396" font-size="11" fill="#444" filter="url(#rough2)">同层（k 固定）：从上 / 左走来，收益 +c —— 正格收钱、负格挨抢</text>
  <g filter="url(#rough2)"><circle cx="82" cy="412" r="3.5" fill="#b85450"/></g>
  <text x="94" y="416" font-size="11" fill="#444" filter="url(#rough2)">升层（仅负格可用）：k → k+1，本格记 0；全程最多升 2 层</text>
  <g filter="url(#rough2)"><circle cx="82" cy="432" r="3.5" fill="#4a7a3a"/></g>
  <text x="94" y="436" font-size="11" fill="#444" filter="url(#rough2)">答案：max(dp[m−1][n−1][0], [1], [2]) —— 感化不必用完</text>
</svg>
