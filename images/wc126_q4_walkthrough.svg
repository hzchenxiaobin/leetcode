<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：stones = [3,2,4,1]，k = 2 的 dp 表</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">k = 2 时 k−1 = 1：任何分割点都允许，每个区间都要合成 1 堆</text>
  <rect width="580" height="384" fill="#fafafa"/>
  <text x="30.0" y="78.0" font-size="11" fill="#888" text-anchor="start" filter="url(#rough2)">stones</text>
  <rect x="90" y="64" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="115.0" y="85.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="115.0" y="114.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">i=0</text>
  <rect x="146" y="64" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="171.0" y="85.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="171.0" y="114.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">i=1</text>
  <rect x="202" y="64" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="227.0" y="85.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="227.0" y="114.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">i=2</text>
  <rect x="258" y="64" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="283.0" y="85.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="283.0" y="114.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">i=3</text>
  <text x="30.0" y="156.0" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">dp[i][j]（上三角，按长度递增填）</text>
  <text x="191.0" y="166.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">j=0</text>
  <text x="273.0" y="166.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">j=1</text>
  <text x="355.0" y="166.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">j=2</text>
  <text x="437.0" y="166.0" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">j=3</text>
  <text x="136.0" y="200.0" font-size="10" fill="#888" text-anchor="end" filter="url(#rough2)">i=0</text>
  <rect x="150" y="176" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="188.0" y="197.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="232" y="176" width="76" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="270.0" y="197.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="314" y="176" width="76" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="352.0" y="197.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">14</text>
  <rect x="396" y="176" width="76" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="434.0" y="197.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">20</text>
  <text x="136.0" y="240.0" font-size="10" fill="#888" text-anchor="end" filter="url(#rough2)">i=1</text>
  <rect x="232" y="216" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="270.0" y="237.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="314" y="216" width="76" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="352.0" y="237.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="396" y="216" width="76" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="434.0" y="237.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="136.0" y="280.0" font-size="10" fill="#888" text-anchor="end" filter="url(#rough2)">i=2</text>
  <rect x="314" y="256" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="352.0" y="277.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="396" y="256" width="76" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="434.0" y="277.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="136.0" y="320.0" font-size="10" fill="#888" text-anchor="end" filter="url(#rough2)">i=3</text>
  <rect x="396" y="296" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="434.0" y="317.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="30" y="336" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="357.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">dp[0][3] = min(dp[0][0]+dp[1][3], dp[0][1]+dp[2][3], dp[0][2]+dp[3][3]) + sum(0..3)</text>
  <text x="40.0" y="373.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">        = min(0+12, 5+5, 14+0) + 10 = 10 + 10 = 20</text>
</svg>
