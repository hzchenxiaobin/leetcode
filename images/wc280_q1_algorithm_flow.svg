<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：除法批量版（辗转相除结构）</text>
  <path d="M 140 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Start -->
  <rect x="240" y="50" width="160" height="34" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="71" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">输入 num1, num2；ops = 0</text>

  <path d="M320,84 L320,105" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1 -->
  <polygon points="320,105 415,140 320,175 225,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="134" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">num1 &gt; 0 且 num2 &gt; 0 ?</text>
  <text x="320" y="150" text-anchor="middle" font-size="9.5" fill="#a08430" filter="url(#rough2)">（同时保证除数非零）</text>

  <!-- No branch: return -->
  <path d="M415,140 L455,140" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="130" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="460" y="124" width="140" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="530" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">返回 ops ✓</text>

  <!-- Yes branch -->
  <path d="M320,175 L320,205" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="334" y="194" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- Decision 2 -->
  <polygon points="320,205 395,240 320,275 245,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="236" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">num1 ≥ num2 ?</text>
  <text x="320" y="252" text-anchor="middle" font-size="9.5" fill="#a08430" filter="url(#rough2)">（相等也走此分支）</text>

  <!-- Yes: num1 side -->
  <path d="M245,240 L200,240" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="224" y="230" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="40" y="218" width="160" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="237" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ops += num1 / num2</text>
  <text x="120" y="254" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">num1 %= num2</text>

  <!-- No: num2 side -->
  <path d="M395,240 L440,240" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="230" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="445" y="218" width="160" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="525" y="237" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ops += num2 / num1</text>
  <text x="525" y="254" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">num2 %= num1</text>

  <!-- Loop back arrows -->
  <path d="M40,241 L22,241 L22,140 L220,140" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M605,241 L622,241 L622,95 L340,95" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M340,95 L324,102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="285" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">↑ 两支都回到顶部循环，直到某个数归零</text>

  <!-- Bottom notes -->
  <rect x="26" y="322" width="588" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="343" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">每轮较大数被替换为「较大数 mod 较小数」&lt; 较小数 → 严格减小，必然终止</text>

  <rect x="26" y="366" width="588" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="387" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">循环条件 &gt; 0 天然防除零；最坏轮数 O(log max)（拉梅定理，最坏输入是相邻斐波那契数）</text>
</svg>
