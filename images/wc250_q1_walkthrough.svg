<svg xmlns="http://www.w3.org/2000/svg" width="620" height="510" viewBox="0 0 620 510" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="620" height="510" fill="#fdfcf7"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：一趟扫描的两个关键事件</text>
  <path d="M 170 40 Q 310 50 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="40" y="64" font-size="13" fill="#2b2b2b" font-weight="bold">示例 1：text = "hello world"，broken = {a, d}</text>

  <g filter="url(#sk)">
    <rect x="60" y="72" width="36" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="96" y="72" width="36" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="132" y="72" width="36" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="168" y="72" width="36" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="204" y="72" width="36" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="240" y="72" width="36" height="34" rx="4" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.8" stroke-dasharray="5,3"/>
    <rect x="276" y="72" width="36" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="312" y="72" width="36" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="348" y="72" width="36" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="384" y="72" width="36" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="420" y="72" width="36" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <text x="78" y="94" fill="#2f5d2f">h</text>
    <text x="114" y="94" fill="#2f5d2f">e</text>
    <text x="150" y="94" fill="#2f5d2f">l</text>
    <text x="186" y="94" fill="#2f5d2f">l</text>
    <text x="222" y="94" fill="#2f5d2f">o</text>
    <text x="258" y="94" fill="#7a5415">␣</text>
    <text x="294" y="94" fill="#2f5d2f">w</text>
    <text x="330" y="94" fill="#2f5d2f">o</text>
    <text x="366" y="94" fill="#2f5d2f">r</text>
    <text x="402" y="94" fill="#2f5d2f">l</text>
    <text x="438" y="94" fill="#b85450">d</text>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold">
    <text x="78" y="122" fill="#4a8e4a">✓</text>
    <text x="114" y="122" fill="#4a8e4a">✓</text>
    <text x="150" y="122" fill="#4a8e4a">✓</text>
    <text x="186" y="122" fill="#4a8e4a">✓</text>
    <text x="222" y="122" fill="#4a8e4a">✓</text>
    <text x="258" y="122" fill="#c98a2b">↓</text>
    <text x="294" y="122" fill="#4a8e4a">✓</text>
    <text x="330" y="122" fill="#4a8e4a">✓</text>
    <text x="366" y="122" fill="#4a8e4a">✓</text>
    <text x="402" y="122" fill="#4a8e4a">✓</text>
    <text x="438" y="122" fill="#b85450">✗</text>
  </g>

  <path d="M 258 128 Q 210 134 150 138" stroke="#c98a2b" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <path d="M 438 128 Q 390 134 335 138" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <path d="M 456 120 Q 495 128 505 140" stroke="#4a8edb" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <g filter="url(#sk)">
    <rect x="40" y="142" width="180" height="46" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="130" y="160" text-anchor="middle" font-size="11" fill="#8f6b1f" font-weight="bold">空格 → 结算 "hello"</text>
  <text x="130" y="178" text-anchor="middle" font-size="11" fill="#8f6b1f" font-family="monospace">ans += true → ans = 1</text>

  <g filter="url(#sk)">
    <rect x="235" y="142" width="180" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="325" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">'d' 命中破损 → ok = false</text>
  <text x="325" y="178" text-anchor="middle" font-size="11" fill="#b85450">"world" 报废（后续字符可不看）</text>

  <g filter="url(#sk)">
    <rect x="430" y="142" width="150" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="505" y="160" text-anchor="middle" font-size="11" fill="#2b5d8e" font-weight="bold">扫描结束 → 补结算</text>
  <text x="505" y="178" text-anchor="middle" font-size="11" fill="#2b5d8e" font-family="monospace">ans += false（= 0）</text>

  <g filter="url(#sk)">
    <rect x="240" y="200" width="140" height="30" rx="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="310" y="220" text-anchor="middle" font-size="13" fill="#2f5d2f" font-family="monospace" font-weight="bold">返回 ans = 1 ✓</text>

  <text x="40" y="262" font-size="13" fill="#2b2b2b" font-weight="bold">示例 3：text = "leet code"，broken = {e}</text>

  <g filter="url(#sk)">
    <rect x="60" y="272" width="36" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="96" y="272" width="36" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="132" y="272" width="36" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="168" y="272" width="36" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="204" y="272" width="36" height="34" rx="4" fill="#fdf1e3" stroke="#c98a2b" stroke-width="1.8" stroke-dasharray="5,3"/>
    <rect x="240" y="272" width="36" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="276" y="272" width="36" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="312" y="272" width="36" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="348" y="272" width="36" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold">
    <text x="78" y="294" fill="#2f5d2f">l</text>
    <text x="114" y="294" fill="#b85450">e</text>
    <text x="150" y="294" fill="#b85450">e</text>
    <text x="186" y="294" fill="#2f5d2f">t</text>
    <text x="222" y="294" fill="#7a5415">␣</text>
    <text x="258" y="294" fill="#2f5d2f">c</text>
    <text x="294" y="294" fill="#2f5d2f">o</text>
    <text x="330" y="294" fill="#2f5d2f">d</text>
    <text x="366" y="294" fill="#b85450">e</text>
  </g>
  <g font-size="12" text-anchor="middle" font-weight="bold">
    <text x="78" y="322" fill="#4a8e4a">✓</text>
    <text x="114" y="322" fill="#b85450">✗</text>
    <text x="150" y="322" fill="#b85450">✗</text>
    <text x="186" y="322" fill="#4a8e4a">✓</text>
    <text x="222" y="322" fill="#c98a2b">↓</text>
    <text x="258" y="322" fill="#4a8e4a">✓</text>
    <text x="294" y="322" fill="#4a8e4a">✓</text>
    <text x="330" y="322" fill="#4a8e4a">✓</text>
    <text x="366" y="322" fill="#b85450">✗</text>
  </g>

  <g filter="url(#sk)">
    <rect x="40" y="340" width="180" height="46" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="130" y="358" text-anchor="middle" font-size="11" fill="#8f6b1f" font-weight="bold">空格 → 结算 "leet"</text>
  <text x="130" y="376" text-anchor="middle" font-size="11" fill="#8f6b1f" font-family="monospace">ans += false → ans = 0</text>

  <g filter="url(#sk)">
    <rect x="235" y="340" width="180" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="325" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">'e' 再次命中 → ok = false</text>
  <text x="325" y="376" text-anchor="middle" font-size="11" fill="#b85450">"code" 报废：两词都栽在 e</text>

  <g filter="url(#sk)">
    <rect x="430" y="340" width="150" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="505" y="358" text-anchor="middle" font-size="11" fill="#2b5d8e" font-weight="bold">扫描结束 → 补结算</text>
  <text x="505" y="376" text-anchor="middle" font-size="11" fill="#2b5d8e" font-family="monospace">ans += false → 0</text>

  <g filter="url(#sk)">
    <rect x="240" y="398" width="140" height="30" rx="15" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="310" y="418" text-anchor="middle" font-size="13" fill="#2f5d2f" font-family="monospace" font-weight="bold">返回 ans = 0 ✓</text>

  <g filter="url(#sk)">
    <rect x="30" y="448" width="560" height="48" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="310" y="468" text-anchor="middle" font-size="11.5" fill="#2b5d8e">每个单词只需知道「是否含破损字母」：命中一次即报废——ok 是布尔不是计数，同一词多次命中无影响</text>
  <text x="310" y="487" text-anchor="middle" font-size="11.5" fill="#2b5d8e">最后一个单词后没有空格：补结算 ans += ok 兜底——示例 1 的 ans 最终停在全趟唯一的「+1」上</text>
</svg>
