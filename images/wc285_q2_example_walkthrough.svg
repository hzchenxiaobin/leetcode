<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算："RLRSLL" —— 逐车判定与碰撞链互相印证</text>
  <path d="M 240 46 Q 470 54 700 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- road -->
  <g filter="url(#sk)">
    <rect x="150" y="160" width="640" height="20" fill="#f0f0ee" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <path d="M 172 170 L 768 170" stroke="#ddd" stroke-width="2" stroke-dasharray="14 10" fill="none"/>
  </g>

  <!-- cars: R L R S L L -->
  <g filter="url(#sk)">
    <rect x="204" y="124" width="72" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="296" y="124" width="72" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="388" y="124" width="72" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="480" y="124" width="72" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="572" y="124" width="72" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="664" y="124" width="72" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="240" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#33475e" filter="url(#sk)">R</text>
  <text x="332" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#33475e" filter="url(#sk)">L</text>
  <text x="424" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#33475e" filter="url(#sk)">R</text>
  <text x="516" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#a0782a" filter="url(#sk)">S</text>
  <text x="608" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#33475e" filter="url(#sk)">L</text>
  <text x="700" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#33475e" filter="url(#sk)">L</text>

  <!-- direction arrows -->
  <path d="M 220 110 L 262 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <path d="M 352 110 L 310 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <path d="M 404 110 L 446 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <text x="516" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#sk)">停</text>
  <path d="M 588 110 L 546 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>
  <path d="M 680 110 L 638 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arD)" filter="url(#sk)"/>

  <!-- indices -->
  <text x="240" y="196" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">0</text>
  <text x="332" y="196" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">1</text>
  <text x="424" y="196" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">2</text>
  <text x="516" y="196" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">3</text>
  <text x="608" y="196" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">4</text>
  <text x="700" y="196" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">5</text>

  <!-- per-car verdict -->
  <text x="240" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">+1</text>
  <text x="332" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">+1</text>
  <text x="424" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">+1</text>
  <text x="516" y="224" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#sk)">+0</text>
  <text x="608" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">+1</text>
  <text x="700" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a8e4a" filter="url(#sk)">+1</text>
  <text x="470" y="248" text-anchor="middle" font-size="11" fill="#556" filter="url(#sk)">前缀 L 0 辆 → l = 0；后缀 R 0 辆 → r = 5，中间段 = 整串，移动车 5 辆 → 答案 5</text>

  <!-- collision chain table -->
  <g filter="url(#sk)">
    <rect x="105" y="400" width="730" height="80" fill="#e6f4ea"/>
    <rect x="105" y="280" width="150" height="200" fill="#e8f0fe"/>
    <rect x="255" y="280" width="145" height="40" fill="#fce4ec"/>
    <rect x="400" y="280" width="145" height="40" fill="#fff8e1"/>
    <rect x="545" y="280" width="145" height="40" fill="#fff8e1"/>
    <rect x="690" y="280" width="145" height="40" fill="#fff8e1"/>
  </g>
  <path d="M 255 280 L 255 480 M 400 280 L 400 480 M 545 280 L 545 480 M 690 280 L 690 480 M 105 320 L 835 320 M 105 360 L 835 360 M 105 400 L 835 400 M 105 440 L 835 440" stroke="#999" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="105" y="280" width="730" height="200" fill="none" stroke="#666" stroke-width="1.8" rx="4"/>
  </g>

  <text x="180" y="305" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475e" filter="url(#sk)">碰撞事件</text>
  <text x="180" y="345" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475e" filter="url(#sk)">本轮计分</text>
  <text x="180" y="385" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475e" filter="url(#sk)">停下的移动车</text>
  <text x="180" y="425" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475e" filter="url(#sk)">累计计分</text>
  <text x="180" y="465" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475e" filter="url(#sk)">累计停下的移动车</text>

  <text x="327" y="305" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">① 车0 ↔ 车1</text>
  <text x="472" y="305" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">② 车2 → 车3</text>
  <text x="617" y="305" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">③ 车4 → 停墙</text>
  <text x="762" y="305" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">④ 车5 → 停墙</text>

  <text x="327" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">+2（对撞）</text>
  <text x="472" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0782a" filter="url(#sk)">+1</text>
  <text x="617" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0782a" filter="url(#sk)">+1</text>
  <text x="762" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0782a" filter="url(#sk)">+1</text>

  <text x="327" y="385" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">车 0、车 1</text>
  <text x="472" y="385" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">车 2</text>
  <text x="617" y="385" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">车 4</text>
  <text x="762" y="385" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">车 5</text>

  <text x="327" y="425" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">2</text>
  <text x="472" y="425" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">3</text>
  <text x="617" y="425" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">4</text>
  <text x="762" y="425" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">5</text>

  <text x="327" y="465" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">2</text>
  <text x="472" y="465" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">3</text>
  <text x="617" y="465" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">4</text>
  <text x="762" y="465" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">5</text>

  <text x="470" y="500" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">停墙 = 已停下的车：撞它仍按「移动撞静止」+1 结算，被撞的墙不再计分</text>

  <!-- conclusion cards -->
  <g filter="url(#sk)">
    <rect x="105" y="520" width="340" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="495" y="520" width="340" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="275" y="544" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0782a" filter="url(#sk)">计分口径：2 + 1 + 1 + 1 = 5</text>
  <text x="275" y="566" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">每次碰撞的计分 = 当时还在移动的涉事车数</text>
  <text x="665" y="544" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475e" filter="url(#sk)">车辆口径：{0,1,2,4,5} 共 5 辆</text>
  <text x="665" y="566" text-anchor="middle" font-size="10.5" fill="#556" filter="url(#sk)">以移动状态被停下的车数 = 中间段移动车数</text>

  <!-- final chip -->
  <g filter="url(#sk)">
    <rect x="255" y="598" width="430" height="34" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="470" y="620" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">两种口径殊途同归：答案 = 5 ✓</text>
</svg>
