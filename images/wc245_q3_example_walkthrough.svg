<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="500" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例演算：过滤越界 + 逐维累积 max</text>
  <path d="M 150 40 Q 340 48 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== example 1 ===== -->
  <text x="48" y="68" font-size="12.5" font-weight="bold" fill="#2b2b2b">例 1　triplets = [[2,5,3],[1,8,4],[1,7,5]]　target = [2,7,5]</text>
  <text x="121" y="86" text-anchor="middle" font-size="10.5" fill="#888">三元组 t</text>
  <text x="240" y="86" text-anchor="middle" font-size="10.5" fill="#888">判定</text>
  <text x="417" y="86" text-anchor="middle" font-size="10.5" fill="#888">res（累积 max）</text>

  <!-- row t1: [2,5,3] usable -->
  <g filter="url(#sk)">
    <rect x="64" y="92" width="34" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="104" y="92" width="34" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="144" y="92" width="34" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="360" y="92" width="34" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="400" y="92" width="34" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="440" y="92" width="34" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="81" y="110" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">2</text>
  <text x="121" y="110" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">5</text>
  <text x="161" y="110" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">3</text>
  <text x="196" y="110" font-size="11.5" font-weight="bold" fill="#2e6e2e">全不越界 ✓ 并入</text>
  <text x="377" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">2</text>
  <text x="417" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">5</text>
  <text x="457" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">3</text>

  <!-- row t2: [1,8,4] over bound on dim 2 -->
  <g filter="url(#sk)">
    <rect x="64" y="126" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="104" y="126" width="34" height="26" rx="4" fill="#fdecea" stroke="#b85450" stroke-width="2.2"/>
    <rect x="144" y="126" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="360" y="126" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="400" y="126" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="440" y="126" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="81" y="144" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">1</text>
  <text x="121" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" font-family="monospace">8</text>
  <text x="161" y="144" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">4</text>
  <text x="196" y="144" font-size="11.5" font-weight="bold" fill="#b03a3a">8 &gt; 7 ✗ 弃用</text>
  <text x="377" y="144" text-anchor="middle" font-size="12.5" fill="#888" font-family="monospace">2</text>
  <text x="417" y="144" text-anchor="middle" font-size="12.5" fill="#888" font-family="monospace">5</text>
  <text x="457" y="144" text-anchor="middle" font-size="12.5" fill="#888" font-family="monospace">3</text>
  <text x="496" y="144" font-size="10" fill="#888">（不变）</text>

  <!-- row t3: [1,7,5] usable -->
  <g filter="url(#sk)">
    <rect x="64" y="160" width="34" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="104" y="160" width="34" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="144" y="160" width="34" height="26" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="360" y="160" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="400" y="160" width="34" height="26" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="2"/>
    <rect x="440" y="160" width="34" height="26" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="81" y="178" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">1</text>
  <text x="121" y="178" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">7</text>
  <text x="161" y="178" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">5</text>
  <text x="196" y="178" font-size="11.5" font-weight="bold" fill="#2e6e2e">全不越界 ✓ 并入</text>
  <text x="377" y="178" text-anchor="middle" font-size="12.5" fill="#888" font-family="monospace">2</text>
  <text x="417" y="178" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">7</text>
  <text x="457" y="178" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" font-family="monospace">5</text>
  <text x="496" y="178" font-size="10" fill="#7a5415">↑ 更新</text>

  <!-- example 1 verdict -->
  <g filter="url(#sk)">
    <rect x="200" y="194" width="300" height="28" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="350" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">res = [2,7,5] = target → 返回 true ✓</text>

  <!-- ===== example 4 ===== -->
  <text x="48" y="252" font-size="12.5" font-weight="bold" fill="#2b2b2b">例 4　triplets = [[3,4,5],[4,5,6]]　target = [3,2,5]</text>

  <!-- row t1: [3,4,5] over bound on dim 2 -->
  <g filter="url(#sk)">
    <rect x="64" y="262" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="104" y="262" width="34" height="26" rx="4" fill="#fdecea" stroke="#b85450" stroke-width="2.2"/>
    <rect x="144" y="262" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="360" y="262" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="400" y="262" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="440" y="262" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="81" y="280" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">3</text>
  <text x="121" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" font-family="monospace">4</text>
  <text x="161" y="280" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">5</text>
  <text x="196" y="280" font-size="11.5" font-weight="bold" fill="#b03a3a">4 &gt; 2 ✗ 弃用</text>
  <text x="377" y="280" text-anchor="middle" font-size="12.5" fill="#888" font-family="monospace">0</text>
  <text x="417" y="280" text-anchor="middle" font-size="12.5" fill="#888" font-family="monospace">0</text>
  <text x="457" y="280" text-anchor="middle" font-size="12.5" fill="#888" font-family="monospace">0</text>

  <!-- row t2: [4,5,6] over bound on dims 1 & 3 -->
  <g filter="url(#sk)">
    <rect x="64" y="296" width="34" height="26" rx="4" fill="#fdecea" stroke="#b85450" stroke-width="2.2"/>
    <rect x="104" y="296" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="144" y="296" width="34" height="26" rx="4" fill="#fdecea" stroke="#b85450" stroke-width="2.2"/>
    <rect x="360" y="296" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="400" y="296" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
    <rect x="440" y="296" width="34" height="26" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="81" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" font-family="monospace">4</text>
  <text x="121" y="314" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">5</text>
  <text x="161" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" font-family="monospace">6</text>
  <text x="196" y="314" font-size="11.5" font-weight="bold" fill="#b03a3a">4 &gt; 3 ✗ 弃用</text>
  <text x="377" y="314" text-anchor="middle" font-size="12.5" fill="#888" font-family="monospace">0</text>
  <text x="417" y="314" text-anchor="middle" font-size="12.5" fill="#888" font-family="monospace">0</text>
  <text x="457" y="314" text-anchor="middle" font-size="12.5" fill="#888" font-family="monospace">0</text>

  <!-- example 4 verdict -->
  <g filter="url(#sk)">
    <rect x="200" y="330" width="300" height="28" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="350" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">可用集为空，res = [0,0,0] ≠ target → 返回 false ✗</text>

  <!-- example 3 note -->
  <g filter="url(#sk)">
    <rect x="48" y="382" width="584" height="66" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="340" y="406" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">例 3　target = [5,5,5]：四个三元组 [[2,5,3],[2,3,4],[1,2,5],[5,2,3]] 全部可用</text>
  <text x="340" y="428" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">res 依次 [2,5,3] → [2,5,4] → [2,5,5] → [5,5,5] = target，两步合并即得 ✓</text>

  <!-- bottom note -->
  <text x="340" y="478" text-anchor="middle" font-size="10.5" fill="#888">空可用集 ⇒ res 保持初值 [0,0,0]；值域 ≥ 1 且 target 每维 ≥ 1，必不等，无需特判</text>
</svg>
