<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="317" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [8,6,1,5,3]</text>
  <path d="M 180 42 Q 320 52 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- step 1: suf array -->
  <text x="320" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">① 从右往左建后缀最小：suf = [1, 1, 1, 3, 3, +∞]</text>
  <g font-size="12" text-anchor="middle">
    <g filter="url(#sk)">
      <rect x="188" y="88"  width="44" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
      <rect x="232" y="88"  width="44" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
      <rect x="276" y="88"  width="44" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
      <rect x="320" y="88"  width="44" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
      <rect x="364" y="88"  width="44" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
      <rect x="408" y="88"  width="44" height="30" rx="4" fill="#f4f4f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3"/>
    </g>
    <text x="210" y="108" fill="#2e6e2e" filter="url(#sk)">1</text>
    <text x="254" y="108" fill="#2e6e2e" filter="url(#sk)">1</text>
    <text x="298" y="108" fill="#2e6e2e" filter="url(#sk)">1</text>
    <text x="342" y="108" fill="#2e6e2e" filter="url(#sk)">3</text>
    <text x="386" y="108" fill="#2e6e2e" filter="url(#sk)">3</text>
    <text x="430" y="108" fill="#888" filter="url(#sk)">+∞</text>
    <text x="210" y="134" fill="#888" filter="url(#sk)">0</text>
    <text x="254" y="134" fill="#888" filter="url(#sk)">1</text>
    <text x="298" y="134" fill="#888" filter="url(#sk)">2</text>
    <text x="342" y="134" fill="#888" filter="url(#sk)">3</text>
    <text x="386" y="134" fill="#888" filter="url(#sk)">4</text>
    <text x="430" y="134" fill="#888" filter="url(#sk)">哨兵</text>
  </g>

  <!-- step 2: scan table -->
  <text x="320" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">② 从左往右枚举山峰 j（滚动 preMin）</text>
  <g font-size="12" text-anchor="middle">
    <!-- header -->
    <g filter="url(#sk)">
      <rect x="70"  y="184" width="60"  height="30" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
      <rect x="130" y="184" width="86"  height="30" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
      <rect x="216" y="184" width="96"  height="30" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
      <rect x="312" y="184" width="96"  height="30" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
      <rect x="408" y="184" width="86"  height="30" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
      <rect x="494" y="184" width="96"  height="30" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
    </g>
    <g fill="#2b6e9e" font-weight="bold">
      <text x="100" y="204" filter="url(#sk)">j</text>
      <text x="173" y="204" filter="url(#sk)">nums[j]</text>
      <text x="264" y="204" filter="url(#sk)">preMin</text>
      <text x="360" y="204" filter="url(#sk)">suf[j+1]</text>
      <text x="451" y="204" filter="url(#sk)">山峰?</text>
      <text x="542" y="204" filter="url(#sk)">候选和</text>
    </g>
    <!-- rows -->
    <g filter="url(#sk)">
      <rect x="70" y="214" width="60"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="130" y="214" width="86"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="216" y="214" width="96"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="312" y="214" width="96"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="408" y="214" width="86"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="494" y="214" width="96"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
    </g>
    <g fill="#555">
      <text x="100" y="233" filter="url(#sk)">0</text>
      <text x="173" y="233" filter="url(#sk)">8</text>
      <text x="264" y="233" fill="#b85450" filter="url(#sk)">+∞</text>
      <text x="360" y="233" filter="url(#sk)">1</text>
      <text x="451" y="233" fill="#b85450" filter="url(#sk)">✗</text>
      <text x="542" y="233" filter="url(#sk)">—</text>
    </g>
    <g filter="url(#sk)">
      <rect x="70" y="242" width="60"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="130" y="242" width="86"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="216" y="242" width="96"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="312" y="242" width="96"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="408" y="242" width="86"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="494" y="242" width="96"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
    </g>
    <g fill="#555">
      <text x="100" y="261" filter="url(#sk)">1</text>
      <text x="173" y="261" filter="url(#sk)">6</text>
      <text x="264" y="261" filter="url(#sk)">8</text>
      <text x="360" y="261" filter="url(#sk)">1</text>
      <text x="451" y="261" fill="#b85450" filter="url(#sk)">✗ 8≥6</text>
      <text x="542" y="261" filter="url(#sk)">—</text>
    </g>
    <g filter="url(#sk)">
      <rect x="70" y="270" width="60"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="130" y="270" width="86"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="216" y="270" width="96"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="312" y="270" width="96"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="408" y="270" width="86"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="494" y="270" width="96"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
    </g>
    <g fill="#555">
      <text x="100" y="289" filter="url(#sk)">2</text>
      <text x="173" y="289" filter="url(#sk)">1</text>
      <text x="264" y="289" filter="url(#sk)">6</text>
      <text x="360" y="289" filter="url(#sk)">3</text>
      <text x="451" y="289" fill="#b85450" filter="url(#sk)">✗ 6≥1</text>
      <text x="542" y="289" filter="url(#sk)">—</text>
    </g>
    <!-- row j=3 highlighted -->
    <g filter="url(#sk)">
      <rect x="70" y="298" width="60"  height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
      <rect x="130" y="298" width="86"  height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
      <rect x="216" y="298" width="96"  height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
      <rect x="312" y="298" width="96"  height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
      <rect x="408" y="298" width="86"  height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
      <rect x="494" y="298" width="96"  height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
    </g>
    <g fill="#7a5415" font-weight="bold">
      <text x="100" y="318" filter="url(#sk)">3</text>
      <text x="173" y="318" filter="url(#sk)">5</text>
      <text x="264" y="318" filter="url(#sk)">1</text>
      <text x="360" y="318" filter="url(#sk)">3</text>
      <text x="451" y="318" fill="#2e6e2e" filter="url(#sk)">✓</text>
      <text x="542" y="318" filter="url(#sk)">1+5+3=9</text>
    </g>
    <g filter="url(#sk)">
      <rect x="70" y="328" width="60"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="130" y="328" width="86"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="216" y="328" width="96"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="312" y="328" width="96"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="408" y="328" width="86"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
      <rect x="494" y="328" width="96"  height="28" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="1"/>
    </g>
    <g fill="#555">
      <text x="100" y="347" filter="url(#sk)">4</text>
      <text x="173" y="347" filter="url(#sk)">3</text>
      <text x="264" y="347" filter="url(#sk)">1</text>
      <text x="360" y="347" fill="#b85450" filter="url(#sk)">+∞</text>
      <text x="451" y="347" fill="#b85450" filter="url(#sk)">✗</text>
      <text x="542" y="347" filter="url(#sk)">—</text>
    </g>
  </g>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="180" y="374" width="280" height="36" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="320" y="398" text-anchor="middle" font-size="16" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">ans = 9 ✓（三元组 (2,3,4)）</text>
</svg>
