<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：双指针一趟收割</text>
  <path d="M 190 38 Q 320 46 450 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <ellipse cx="310" cy="76" rx="92" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <polygon points="248,150 310,124 372,150 310,176" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="455" y="134" width="100" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <polygon points="225,235 310,207 395,235 310,263" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="57" y="219" width="86" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="145" y="300" width="330" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="145" y="368" width="330" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>

  <text x="310" y="81" text-anchor="middle" font-size="13" fill="#2b4a6e">开始：i ← 0，ans ← [ ]</text>
  <text x="310" y="155" text-anchor="middle" font-size="13" fill="#2b4a6e" font-weight="bold">i ＜ n ?</text>
  <text x="505" y="155" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">返回 ans</text>
  <text x="310" y="240" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">s1[i] ≠ s2[i] ?</text>
  <text x="100" y="240" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">i ← i + 1</text>
  <text x="310" y="317" text-anchor="middle" font-size="12.5" fill="#8f3830" font-weight="bold">失配起点！j ← i，</text>
  <text x="310" y="333" text-anchor="middle" font-size="12.5" fill="#8f3830">扩展 j 直到 s1[j] ＝ s2[j] 或 j ＝ n</text>
  <text x="310" y="385" text-anchor="middle" font-size="12.5" fill="#8f3830" font-weight="bold">ans 追加 [s1[i..j−1], s2[i..j−1]]，i ← j</text>

  <path d="M 310 98 L 310 120" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 372 150 L 451 150" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="410" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a">否</text>
  <path d="M 310 176 L 310 203" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="324" y="194" text-anchor="middle" font-size="11" fill="#446688">是</text>
  <path d="M 225 235 L 147 235" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="186" y="227" text-anchor="middle" font-size="11" fill="#4a7a3a">否</text>
  <path d="M 310 263 L 310 296" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="324" y="284" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <path d="M 310 340 L 310 364" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 475 387 L 612 387 L 612 108 L 318 108" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 100 219 L 100 108 L 302 108" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="576" y="255" text-anchor="middle" font-size="11" fill="#446688">跳过整个片段</text>
  <text x="112" y="132" text-anchor="start" font-size="11" fill="#446688">继续</text>
</svg>
