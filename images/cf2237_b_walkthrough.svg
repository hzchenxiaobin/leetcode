<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">样例走查：a = (10, 3, 8, 6, 9)，b = (3, 6, 8, 9, 10)</text>
  <text x="310" y="47" text-anchor="middle" font-size="10" fill="#888">L_i = 满足 b_j ≥ a_i 的最小下标；每步在未占用的列中挑最靠左的合法列</text>

  <g filter="url(#rough2)">
    <rect x="30" y="58" width="560" height="180" fill="#fdfdfd" stroke="#888888" stroke-width="1.4"/>
    <rect x="30" y="58" width="560" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="404" y="88" width="82" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="486" y="88" width="104" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>

  <g filter="url(#rough2)" stroke="#bbbbbb" stroke-width="1">
    <path d="M 86 58 L 86 238" fill="none"/>
    <path d="M 150 58 L 150 238" fill="none"/>
    <path d="M 272 58 L 272 238" fill="none"/>
    <path d="M 404 58 L 404 238" fill="none"/>
    <path d="M 486 58 L 486 238" fill="none"/>
    <path d="M 30 88 L 590 88" fill="none"/>
    <path d="M 30 118 L 590 118" fill="none"/>
    <path d="M 30 148 L 590 148" fill="none"/>
    <path d="M 30 178 L 590 178" fill="none"/>
    <path d="M 30 208 L 590 208" fill="none"/>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#3a4a66" text-anchor="middle">
    <text x="58" y="78">步骤 i</text>
    <text x="118" y="78">a_i</text>
    <text x="211" y="78">最小合法槽 L_i</text>
    <text x="338" y="78">此步前已占用</text>
    <text x="445" y="78">认领 p_i</text>
    <text x="538" y="78">b 的取值</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#444444" text-anchor="middle">
    <text x="58" y="108">1</text>
    <text x="118" y="108">10</text>
    <text x="211" y="108">5（b₅=10）</text>
    <text x="338" y="108">空集</text>
    <text x="445" y="108" fill="#8a6a20" font-weight="bold">5</text>
    <text x="538" y="108" fill="#3a5a30">10</text>

    <text x="58" y="138">2</text>
    <text x="118" y="138">3</text>
    <text x="211" y="138">1（b₁=3）</text>
    <text x="338" y="138">{5}</text>
    <text x="445" y="138" fill="#8a6a20" font-weight="bold">1</text>
    <text x="538" y="138" fill="#3a5a30">3</text>

    <text x="58" y="168">3</text>
    <text x="118" y="168">8</text>
    <text x="211" y="168">3（b₃=8）</text>
    <text x="338" y="168">{5, 1}</text>
    <text x="445" y="168" fill="#8a6a20" font-weight="bold">3</text>
    <text x="538" y="168" fill="#3a5a30">8</text>

    <text x="58" y="198">4</text>
    <text x="118" y="198">6</text>
    <text x="211" y="198">2（b₂=6）</text>
    <text x="338" y="198">{5, 1, 3}</text>
    <text x="445" y="198" fill="#8a6a20" font-weight="bold">2</text>
    <text x="538" y="198" fill="#3a5a30">6</text>

    <text x="58" y="228">5</text>
    <text x="118" y="228">9</text>
    <text x="211" y="228">4（b₄=9）</text>
    <text x="338" y="228">{5, 1, 3, 2}</text>
    <text x="445" y="228" fill="#8a6a20" font-weight="bold">4</text>
    <text x="538" y="228" fill="#3a5a30">9</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="258" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="310" y="280" text-anchor="middle" font-size="11" fill="#8a6a20">认领序列 p = (5, 1, 3, 2, 4)，每列恰好用一次</text>
  </g>

  <path d="M 310 294 L 310 306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10.5" fill="#3a5a30" text-anchor="middle">
    <text x="310" y="324">逆序对：(5,1)、(5,3)、(5,2)、(5,4)、(3,2)，共 5 个</text>
    <text x="310" y="348">最少相邻交换次数 = inv(p) = 5，与官方输出一致</text>
    <text x="310" y="374" fill="#888888" font-size="10">若某步改拿更靠右的列，后面位置可选的列只会更少，逆序对也不会更小</text>
  </g>
</svg>
