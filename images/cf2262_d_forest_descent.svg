<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c77a1e"/>
    </marker>
  </defs>

  <rect width="780" height="460" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">跳出子树再跳回来：只在 subtree(u) 里下探会漏掉 2</text>
  <path d="M 122 40 Q 390 47 658 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="390" y="60" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">反例 n = 4：A = (1,1,2,3)，B = (3,4,4,4)　（b 边：1→3→4，2→4，4 自环）</text>

  <!-- subtree(3) frame -->
  <rect x="492" y="158" width="196" height="236" rx="14" fill="#eef4fb" stroke="#8fa9c2" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="590" y="412" text-anchor="middle" font-size="11.5" fill="#5b7a99" filter="url(#rough2)">subtree(3) = {1, 3}</text>

  <!-- nodes -->
  <circle cx="390" cy="118" r="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="390" y="125" text-anchor="middle" font-size="17" fill="#8a6015" filter="url(#rough2)">4</text>
  <text x="392" y="88" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">b₄ = 4（自环，最后归位）</text>

  <circle cx="560" cy="238" r="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="560" y="245" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="706" y="300" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">b₃ = 4，a₃ = 2</text>

  <circle cx="220" cy="238" r="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="220" y="245" text-anchor="middle" font-size="17" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <text x="222" y="192" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">b₂ = 4，a₂ = 1</text>

  <circle cx="560" cy="352" r="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="560" y="359" text-anchor="middle" font-size="17" fill="#a14340" filter="url(#rough2)">1</text>
  <text x="446" y="374" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">b₁ = 3，a₁ = 1</text>

  <!-- b edges -->
  <path d="M 560 322 L 560 270" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="574" y="300" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">b₁ = 3</text>
  <path d="M 536 220 L 414 142" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="452" y="172" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">b₃ = 4</text>
  <path d="M 244 218 L 366 142" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="172" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">b₂ = 4</text>

  <!-- cross-subtree jump 3 -> 2 -->
  <path d="M 532 230 Q 390 184 250 230" stroke="#c77a1e" stroke-width="2" fill="none" stroke-dasharray="8 5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="390" y="199" text-anchor="middle" font-size="12" fill="#a3620f" filter="url(#rough2)">① a₃ = 2：跳出 subtree(3) 去修 2</text>

  <!-- jump 4 -> 3 -->
  <path d="M 420 124 Q 540 130 566 206" stroke="#c77a1e" stroke-width="2" fill="none" stroke-dasharray="8 5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="676" y="140" text-anchor="middle" font-size="11.5" fill="#a3620f" filter="url(#rough2)">③ a₄ = 3：跳回 3</text>
  <text x="676" y="158" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">（4 是「二次跳板」）</text>

  <!-- note ② -->
  <text x="196" y="300" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">② 2 归位后 a₂ = b₂ = 4，</text>
  <text x="196" y="318" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">沿 b 边爬回祖先 4</text>

  <text x="120" y="404" font-size="11.5" fill="#a14340" filter="url(#rough2)">只在 subtree(3) 里跳，永远到不了 2</text>

  <text x="390" y="442" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">完整路线：1 → 3 → 2 → 4 → 3 → 4（13 步）：3 与 2 分属 4 的两棵子树，靠「跳出 + 借祖先回来」才走通。</text>
</svg>
