<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">陷阱：只对「正 / 负」做 2-SAT 是不够的</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888">下例符号层面唯一可行，模长却无解 —— 正确答案是 NO</text>

  <!-- 图 -->
  <rect x="20" y="58" width="250" height="196" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <path d="M 118 92 L 210 92" stroke="#b85450" stroke-width="1.6"/>
    <path d="M 228 106 L 228 178" stroke="#446688" stroke-width="1.6"/>
    <path d="M 210 198 L 118 198" stroke="#b85450" stroke-width="1.6"/>
    <path d="M 100 178 L 100 106" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="10" filter="url(#rough2)">
    <text x="160" y="86" text-anchor="middle" fill="#b85450">2 型</text>
    <text x="238" y="146" fill="#446688">1 型</text>
    <text x="160" y="192" text-anchor="middle" fill="#b85450">2 型</text>
    <text x="60" y="146" fill="#446688">1 型</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="82" y="78" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="210" y="78" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <rect x="210" y="184" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="82" y="184" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="100" y="97" fill="#3a4a66">1</text>
    <text x="228" y="97" fill="#8a3a36">2</text>
    <text x="228" y="203" fill="#3a4a66">3</text>
    <text x="100" y="203" fill="#8a3a36">4</text>
  </g>

  <ellipse cx="100" cy="72" rx="13" ry="6" fill="none" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="121" y="77" font-size="9" fill="#8a6a20" filter="url(#rough2)">1</text>
  <ellipse cx="246" cy="70" rx="13" ry="6" fill="none" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="263" y="77" font-size="9" fill="#8a6a20" filter="url(#rough2)">2</text>

  <text x="145" y="232" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">小椭圆 = 自环：1 上有 1 型自环，2 上有 2 型自环</text>
  <text x="145" y="248" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">⇒ 1、3 非负；2、4 为负，符号已被唯一确定</text>

  <!-- 右：不等式链 -->
  <rect x="288" y="58" width="252" height="196" fill="#fffdf5" stroke="#d6a040" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="414" y="80" text-anchor="middle" font-size="11" fill="#8a6a20">模长不等式（u 为非负者，v 为负者模长）</text>

  <g font-size="10" fill="#555" filter="url(#rough2)">
    <text x="304" y="106">(1,2) 2 型：u1 &lt; v2</text>
    <text x="304" y="128">(3,2) 1 型：u3 ≥ v2</text>
    <text x="304" y="150">(3,4) 2 型：u3 &lt; v4</text>
    <text x="304" y="172">(1,4) 1 型：u1 ≥ v4</text>
  </g>
  <path d="M 304 184 L 524 184" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="414" y="206" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">u1 &lt; v2 ≤ u3 &lt; v4 ≤ u1</text>
  <text x="414" y="228" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">绕一圈回到起点 ⇒ 矛盾</text>
  <text x="414" y="246" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">(输出应为 NO)</text>

  <rect x="20" y="268" width="520" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="36" y="288" font-size="10.5" fill="#3a5a30">教训：符号与「模长大小顺序」必须同时确定，这正是剥离法「按序定型」的含义</text>
  <text x="36" y="306" font-size="10.5" fill="#3a5a30">奇环式的交替约束会在模长层面打架，只看正负看不出来</text>
</svg>
