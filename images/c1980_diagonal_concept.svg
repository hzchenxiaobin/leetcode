<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="352" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察:对角线取反,构造必然缺席的串</text>

  <!-- 列标 -->
  <text x="126" y="76" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">列 0</text>
  <text x="178" y="76" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">列 1</text>
  <text x="230" y="76" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">列 2</text>

  <!-- 行标 -->
  <text x="92" y="110" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">nums[0]</text>
  <text x="92" y="154" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">nums[1]</text>
  <text x="92" y="198" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">nums[2]</text>

  <!-- 普通格 -->
  <rect x="152" y="84" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="111" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="204" y="84" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="111" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="100" y="128" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="155" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="204" y="128" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="155" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="100" y="172" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="199" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="152" y="172" width="52" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="199" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <!-- 对角格(强调) -->
  <rect x="100" y="84" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6420" filter="url(#rough2)">1</text>
  <rect x="152" y="128" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6420" filter="url(#rough2)">1</text>
  <rect x="204" y="172" width="52" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6420" filter="url(#rough2)">1</text>

  <!-- 行注释 -->
  <text x="266" y="110" font-size="9.5" fill="#b85450" filter="url(#rough2)">← 第 0 位必不同</text>
  <text x="266" y="154" font-size="9.5" fill="#b85450" filter="url(#rough2)">← 第 1 位必不同</text>
  <text x="266" y="198" font-size="9.5" fill="#b85450" filter="url(#rough2)">← 第 2 位必不同</text>

  <!-- 说明框 -->
  <rect x="352" y="84" width="188" height="112" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="446" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">康托对角线</text>
  <text x="446" y="128" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">ans[i] = 翻转 nums[i][i]</text>
  <text x="446" y="146" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">第 i 行被第 i 位堵死</text>
  <text x="446" y="164" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">n 行各堵一位</text>
  <text x="446" y="182" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">→ ans 必不在 nums 中</text>

  <!-- 箭头到答案 -->
  <path d="M 178 222 L 178 246" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="190" y="240" font-size="9.5" fill="#888" filter="url(#rough2)">逐位取反</text>

  <!-- 答案行 -->
  <text x="92" y="278" text-anchor="end" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans</text>
  <rect x="100" y="252" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="126" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="152" y="252" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <rect x="204" y="252" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="277" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="266" y="277" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">= "000" ∉ nums ✓</text>

  <!-- 底注 -->
  <text x="280" y="326" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">注:构造连"互不相同"都没用到——任意 n 行都会被对角位逐一堵死</text>
</svg>
