<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="400" fill="#fdfcf7"/>
  <text x="280" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：x 的唯一克星是 k−x（以 k = 8 为例）</text>
  <path d="M 90 38 Q 280 44 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- conflict arcs -->
  <g filter="url(#sk)" stroke="#b85450" stroke-width="1.4" fill="none">
    <path d="M102,142 Q270,64 438,142"/>
    <path d="M158,142 Q270,86 382,142"/>
    <path d="M214,142 Q270,108 326,142"/>
  </g>
  <text x="452" y="70" font-size="11" fill="#b85450">弧线两端</text>
  <text x="452" y="84" font-size="11" fill="#b85450">之和 = 8：</text>
  <text x="452" y="98" font-size="11" fill="#b85450">不能同时取</text>

  <!-- number boxes 1..7 -->
  <g filter="url(#sk)">
    <rect x="80" y="146" width="44" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="136" y="146" width="44" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="192" y="146" width="44" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="248" y="146" width="44" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="304" y="146" width="44" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="360" y="146" width="44" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="416" y="146" width="44" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="102" y="175" text-anchor="middle" font-size="16" fill="#2b2b2b">1</text>
  <text x="158" y="175" text-anchor="middle" font-size="16" fill="#2b2b2b">2</text>
  <text x="214" y="175" text-anchor="middle" font-size="16" fill="#2b2b2b">3</text>
  <text x="270" y="175" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">4</text>
  <text x="326" y="175" text-anchor="middle" font-size="16" fill="#2b2b2b">5</text>
  <text x="382" y="175" text-anchor="middle" font-size="16" fill="#2b2b2b">6</text>
  <text x="438" y="175" text-anchor="middle" font-size="16" fill="#2b2b2b">7</text>

  <!-- verdicts -->
  <text x="186" y="214" text-anchor="middle" font-size="12" fill="#2e6e2e">✓ 1~4 可全取：两两之和 ≤ 7 &lt; 8</text>
  <text x="382" y="214" text-anchor="middle" font-size="12" fill="#b85450">✗ 5~7 被封锁（克星已选）</text>

  <!-- note boxes -->
  <g filter="url(#sk)">
    <rect x="36" y="238" width="246" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="46" y="258" font-size="11.5" fill="#7a5415">k 偶数：4 是自己的“克星”，但元素</text>
  <text x="46" y="274" font-size="11.5" fill="#7a5415">互异 → 只有一个 4，4+4=8 不构成</text>
  <text x="46" y="290" font-size="11.5" fill="#7a5415">不同元素对 → 4 照样可取</text>

  <g filter="url(#sk)">
    <rect x="300" y="238" width="224" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="310" y="258" font-size="11.5" fill="#33507a">前缀取满后 [k−⌊k/2⌋, k−1] 全封锁；</text>
  <text x="310" y="274" font-size="11.5" fill="#33507a">x ≥ k 时克星 k−x ≤ 0，永不在数组</text>
  <text x="310" y="290" font-size="11.5" fill="#33507a">→ 剩余从 k = 8 开始连续取</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="36" y="330" width="488" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="280" y="351" text-anchor="middle" font-size="11.5" fill="#2e5e2e">冲突对两两不相交（匹配结构）→ 最优数组 = {1..⌊k/2⌋} ∪ {k, k+1, …}</text>
  <text x="280" y="370" text-anchor="middle" font-size="11.5" fill="#2e5e2e">如 n = 5, k = 8：{1,2,3,4} + {8}，sum = 18</text>
</svg>
