<svg xmlns="http://www.w3.org/2000/svg" width="680" height="352" viewBox="0 0 680 352" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="352" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 3 演算：15 个点对 → 3 个候选矩形</text>
  <path d="M 210 40 Q 340 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- header -->
  <g filter="url(#sk)">
    <rect x="40" y="58" width="140" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="180" y="58" width="220" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="400" y="58" width="170" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="570" y="58" width="90" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#7a5415" font-weight="bold">
    <text x="110" y="80">候选矩形</text>
    <text x="290" y="80">对角点对（两条各一次）</text>
    <text x="485" y="80">闭矩形检查</text>
    <text x="615" y="80">结论</text>
  </g>

  <!-- row 1: big square, rejected -->
  <g filter="url(#sk)">
    <rect x="40" y="94" width="140" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="180" y="94" width="220" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="400" y="94" width="170" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="570" y="94" width="90" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333">
    <text x="110" y="124" font-weight="bold">大正方形</text>
    <text x="110" y="139" font-family="monospace" fill="#b85450">[1,3]×[1,3]</text>
    <text x="290" y="126" font-family="monospace">(1,1)−(3,3)</text>
    <text x="290" y="141" font-family="monospace">(1,3)−(3,1)</text>
    <text x="485" y="126" fill="#b85450">(1,2)、(3,2)</text>
    <text x="485" y="141" fill="#b85450">踩在边界上</text>
    <text x="615" y="127" fill="#b85450" font-weight="bold" font-size="14">✗ 作废</text>
  </g>

  <!-- row 2: upper short rect, accepted -->
  <g filter="url(#sk)">
    <rect x="40" y="146" width="140" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="180" y="146" width="220" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="400" y="146" width="170" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="570" y="146" width="90" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333">
    <text x="110" y="176" font-weight="bold">上矮矩形</text>
    <text x="110" y="191" font-family="monospace" fill="#2e6e2e">[1,3]×[2,3]</text>
    <text x="290" y="178" font-family="monospace">(1,3)−(3,2)</text>
    <text x="290" y="193" font-family="monospace">(1,2)−(3,3)</text>
    <text x="485" y="184">其余点均在</text>
    <text x="485" y="199">闭矩形外</text>
    <text x="615" y="179" fill="#2e6e2e" font-weight="bold" font-size="14">✓ 面积 2</text>
  </g>

  <!-- row 3: lower short rect, accepted -->
  <g filter="url(#sk)">
    <rect x="40" y="198" width="140" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="180" y="198" width="220" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="400" y="198" width="170" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="570" y="198" width="90" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333">
    <text x="110" y="228" font-weight="bold">下矮矩形</text>
    <text x="110" y="243" font-family="monospace" fill="#2e6e2e">[1,3]×[1,2]</text>
    <text x="290" y="230" font-family="monospace">(1,1)−(3,2)</text>
    <text x="290" y="245" font-family="monospace">(1,2)−(3,1)</text>
    <text x="485" y="236">其余点均在</text>
    <text x="485" y="251">闭矩形外</text>
    <text x="615" y="231" fill="#2e6e2e" font-weight="bold" font-size="14">✓ 面积 2</text>
  </g>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="40" y="262" width="620" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="350" y="282" text-anchor="middle" font-size="12" fill="#7a5415">其余 12 个点对：同列/同行退化跳过，或另两角不在集合中，均不产生候选</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="180" y="304" width="320" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="340" y="330" text-anchor="middle" font-size="17" fill="#2e6e2e" font-weight="bold" font-family="monospace">ans = max(−1, 2, 2) = 2 ✓</text>
</svg>
