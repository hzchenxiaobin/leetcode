<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="181"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：grid = [[3,1,1],[2,5,1],[1,5,5],[2,1,1]]，答案 24</text>

  <!-- 4x3 网格，绿路径 R1: (0,0)->(1,0)->(2,1)->(3,0) 蓝 R2: (0,2)->(1,1)->(2,2)->(3,2) -->
  <g filter="url(#rough2)">
    <rect x="120" y="50" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <rect x="180" y="50" width="56" height="44" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="240" y="50" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4"/>

    <rect x="120" y="98" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <rect x="180" y="98" width="56" height="44" fill="#cfe3f7" stroke="#446688" stroke-width="2.4" rx="4"/>
    <rect x="240" y="98" width="56" height="44" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>

    <rect x="120" y="146" width="56" height="44" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="180" y="146" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <rect x="240" y="146" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4"/>

    <rect x="120" y="194" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <rect x="180" y="194" width="56" height="44" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4"/>
    <rect x="240" y="194" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4"/>
  </g>
  <text y="77" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"><tspan x="148">3</tspan><tspan x="208">1</tspan><tspan x="268">1</tspan></text>
  <text y="125" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"><tspan x="148">2</tspan><tspan x="208">5</tspan><tspan x="268">1</tspan></text>
  <text y="173" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"><tspan x="148">1</tspan><tspan x="208">5</tspan><tspan x="268">5</tspan></text>
  <text y="221" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"><tspan x="148">2</tspan><tspan x="208">1</tspan><tspan x="268">1</tspan></text>

  <text x="95" y="77" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">r=0</text>
  <text x="95" y="125" font-size="11" fill="#888" filter="url(#rough2)">r=1</text>
  <text x="95" y="173" font-size="11" fill="#888" filter="url(#rough2)">r=2</text>
  <text x="95" y="221" font-size="11" fill="#888" filter="url(#rough2)">r=3</text>

  <path d="M 148 96 Q 148 96 148 98" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 148 144 Q 190 130 200 124" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 208 192 Q 180 200 152 196" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 268 96 Q 240 100 212 104" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 208 144 Q 240 150 268 150" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 268 192 Q 268 194 268 196" stroke="#446688" stroke-width="2.2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 演算表 -->
  <text x="360" y="62" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">逐行 dp（列对 → 值）：</text>
  <g filter="url(#rough2)">
    <rect x="360" y="72" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="360" y="106" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="360" y="140" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="360" y="174" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>
  <text y="92" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="450">r=0: (0,2) → 3+1 = 4</tspan></text>
  <text y="126" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="450">r=1: (0,1) → 4+2+5 = 11</tspan></text>
  <text y="160" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="450">r=2: (1,2) → 11+5+5 = 21</tspan></text>
  <text y="194" font-size="11.5" fill="#8a6a20" font-weight="bold" text-anchor="middle" filter="url(#rough2)"><tspan x="450">r=3: (0,2) → 21+2+1 = 24 ✓</tspan></text>

  <!-- 说明 -->
  <rect x="60" y="262" width="460" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="284" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">R1 摘 3+2+5+2 = 12，R2 摘 1+5+5+1 = 12，合计 24</text>
  <text x="76" y="306" font-size="11" fill="#555" filter="url(#rough2)">中间行两机器人一个走 c=0、一个走 c=1，正好把 2 和 5 一网打尽</text>

  <text x="60" y="348" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">易错：若两机器人同格只算一份，dp 的 gain 必须按 c1 与 c2 是否相等地分支</text>
  <text x="60" y="368" font-size="11" fill="#555" filter="url(#rough2)">cols = 2 时起点即相邻、且只有两列可选，转移里 j1、j2 的边界判断都要照顾到</text>
</svg>
