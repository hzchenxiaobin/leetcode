<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算表：[1,5,2,4,1] 的逐位置下界</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="70"  y="60" width="60"  height="36" fill="#446688" rx="6"/>
    <rect x="134" y="60" width="76"  height="36" fill="#446688" rx="6"/>
    <rect x="214" y="60" width="130" height="36" fill="#446688" rx="6"/>
    <rect x="350" y="60" width="70"  height="36" fill="#446688" rx="6"/>
    <rect x="426" y="60" width="70"  height="36" fill="#446688" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#fff" text-anchor="middle">
    <text x="100" y="83">位置 i</text>
    <text x="172" y="83">原值 x</text>
    <text x="279" y="83">max(prev+1, x)</text>
    <text x="385" y="83">最终值</text>
    <text x="461" y="83">抬升</text>
  </g>

  <!-- 数据行 -->
  <g filter="url(#rough2)">
    <rect x="70"  y="104" width="60"  height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="134" y="104" width="76"  height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="214" y="104" width="130" height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="350" y="104" width="70"  height="34" fill="#e6f4ea" stroke="#4a7a3a" rx="6"/>
    <rect x="426" y="104" width="70"  height="34" fill="#fff8e1" stroke="#d6a040" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="100" y="126">0</text><text x="172" y="126">1</text><text x="279" y="126">—（起点）</text>
    <text x="385" y="126">1</text><text x="461" y="126">0</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70"  y="144" width="60"  height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="134" y="144" width="76"  height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="214" y="144" width="130" height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="350" y="144" width="70"  height="34" fill="#e6f4ea" stroke="#4a7a3a" rx="6"/>
    <rect x="426" y="144" width="70"  height="34" fill="#fff8e1" stroke="#d6a040" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="100" y="166">1</text><text x="172" y="166">5</text><text x="279" y="166">max(2, 5) = 5</text>
    <text x="385" y="166">5</text><text x="461" y="166">0</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70"  y="184" width="60"  height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="134" y="184" width="76"  height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="214" y="184" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <rect x="350" y="184" width="70"  height="34" fill="#e6f4ea" stroke="#4a7a3a" rx="6"/>
    <rect x="426" y="184" width="70"  height="34" fill="#fce4ec" stroke="#b85450" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="100" y="206">2</text><text x="172" y="206">2</text><text x="279" y="206">max(6, 2) = 6</text>
    <text x="385" y="206">6</text><text x="461" y="206" fill="#b85450" font-weight="bold">4</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70"  y="224" width="60"  height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="134" y="224" width="76"  height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="214" y="224" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <rect x="350" y="224" width="70"  height="34" fill="#e6f4ea" stroke="#4a7a3a" rx="6"/>
    <rect x="426" y="224" width="70"  height="34" fill="#fce4ec" stroke="#b85450" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="100" y="246">3</text><text x="172" y="246">4</text><text x="279" y="246">max(7, 4) = 7</text>
    <text x="385" y="246">7</text><text x="461" y="246" fill="#b85450" font-weight="bold">3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70"  y="264" width="60"  height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="134" y="264" width="76"  height="34" fill="#e8f0fe" stroke="#446688" rx="6"/>
    <rect x="214" y="264" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <rect x="350" y="264" width="70"  height="34" fill="#e6f4ea" stroke="#4a7a3a" rx="6"/>
    <rect x="426" y="264" width="70"  height="34" fill="#fce4ec" stroke="#b85450" rx="6"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="100" y="286">4</text><text x="172" y="286">1</text><text x="279" y="286">max(8, 1) = 8</text>
    <text x="385" y="286">8</text><text x="461" y="286" fill="#b85450" font-weight="bold">7</text>
  </g>

  <!-- 合计 -->
  <rect x="70" y="312" width="356" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="248" y="335" text-anchor="middle" font-size="13" fill="#2b4a66" filter="url(#rough2)">最终数组 [1, 5, 6, 7, 8]（严格递增）</text>
  <rect x="426" y="312" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="461" y="335" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">14</text>

  <rect x="70" y="356" width="426" height="20" fill="#fafafa" filter="url(#rough)"/>
  <text x="283" y="371" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">抬高任何一格都会原样传导给后面的元素 → 取下界即最优</text>
</svg>
