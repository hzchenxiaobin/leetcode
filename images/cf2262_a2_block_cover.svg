<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">每个 k 把值域切成等长 k 的块，块内 ⌊y/k⌋ 恒等于块号 v</text>

  <!-- k = 2 行 -->
  <text x="112" y="99" text-anchor="end" font-size="12" fill="#3a4a66" filter="url(#rough2)">k = 2</text>
  <rect x="120" y="72" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="192" y="72" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="264" y="72" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="336" y="72" width="72" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <rect x="408" y="72" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="480" y="72" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="156" y="99" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">v=0 ✓</text>
  <text x="228" y="99" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">v=1 ✓</text>
  <text x="300" y="99" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">v=2 ✓</text>
  <text x="372" y="99" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">v=3 ✗</text>
  <text x="444" y="99" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">v=4</text>
  <text x="516" y="99" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">v=5</text>
  <text x="596" y="92" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">v=a₂=3</text>
  <text x="596" y="106" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">整块禁用</text>

  <!-- k = 4 行 -->
  <text x="112" y="167" text-anchor="end" font-size="12" fill="#8a6a20" filter="url(#rough2)">k = 4</text>
  <rect x="120" y="140" width="144" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="264" y="140" width="144" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <rect x="408" y="140" width="144" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="192" y="167" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">v=0 ✓</text>
  <text x="336" y="167" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">v=1 ✓</text>
  <text x="480" y="167" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">v=2 ✗</text>
  <text x="596" y="160" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">v=a₄=2</text>
  <text x="596" y="174" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">整块禁用</text>

  <!-- 坐标轴 -->
  <path d="M 120 196 L 556 196" stroke="#999" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <g font-size="9" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="138" y="212">0</text><text x="174" y="212">1</text><text x="210" y="212">2</text>
    <text x="246" y="212">3</text><text x="282" y="212">4</text><text x="318" y="212">5</text>
    <text x="354" y="212">6</text><text x="390" y="212">7</text><text x="426" y="212">8</text>
    <text x="462" y="212">9</text><text x="498" y="212">10</text><text x="534" y="212">11</text>
  </g>

  <!-- 图例 -->
  <rect x="120" y="230" width="16" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="142" y="240" font-size="10" fill="#3a5a30" filter="url(#rough2)">必中块：至少选一个</text>
  <rect x="276" y="230" width="16" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="298" y="240" font-size="10" fill="#8a3a36" filter="url(#rough2)">禁块：整块为空</text>
  <rect x="430" y="230" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="452" y="240" font-size="10" fill="#3a4a66" filter="url(#rough2)">自由块：不约束</text>

  <!-- 汇总框 -->
  <rect x="40" y="258" width="580" height="146" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="280" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">mex = a_k 拆成两句话</text>
  <text x="58" y="302" font-size="10.5" fill="#444" filter="url(#rough2)">• 值 a_k 不出现 ⟺ 块 a_k 内没有任何 B 的元素 ⟹ 禁块并集之外才是可用集 U</text>
  <text x="58" y="322" font-size="10.5" fill="#444" filter="url(#rough2)">• 值 0..a_k−1 全出现 ⟺ 块 0..a_k−1 每块至少选一个元素（只数可用位置）</text>
  <text x="58" y="346" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">• 块 a_k 的左端点 k·a_k 最大 10¹⁰，必须用 64 位；右端点要裁到 n−1</text>
  <text x="58" y="368" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">• 可用性只由 a 决定，与选谁无关：于是「禁块」用差分 O(n) 求并集，</text>
  <text x="58" y="386" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">   剩下的「必中块」条件全部落在同一张位置轴上，可以一起 DP</text>
</svg>
