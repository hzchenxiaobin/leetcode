<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">算法流程：外层枚举位，内层数票</text>

  <!-- init -->
  <rect x="165" y="56" width="190" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="79" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">初始化 ans = 0</text>
  <path d="M 260 92 L 260 112" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- enumerate bit -->
  <rect x="140" y="114" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="137" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">取下一个位 i（共 0 … 31 位）</text>
  <path d="M 260 150 L 260 170" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count -->
  <rect x="105" y="172" width="310" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="12.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">遍历 nums，数该位为 1 的元素个数</text>
  <text x="260" y="206" text-anchor="middle" font-size="12" fill="#99741c" filter="url(#rough2)">cnt += (x &gt;&gt; i) &amp; 1</text>
  <path d="M 260 212 L 260 232" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: cnt >= k ? -->
  <polygon points="260,234 350,268 260,302 170,268" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="13" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">cnt ≥ k ？</text>
  <text x="260" y="282" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">票数达标？</text>

  <!-- yes branch -->
  <path d="M 350 268 L 392 268" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="368" y="260" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="394" y="248" width="112" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="450" y="265" text-anchor="middle" font-size="12.5" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">点亮该位</text>
  <text x="450" y="281" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">ans |= 1 &lt;&lt; i</text>
  <path d="M 450 288 C 450 310 380 322 322 322" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch -->
  <path d="M 260 302 L 260 322" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="276" y="316" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- decision: more bits? -->
  <polygon points="260,324 340 352 260 380 180 352" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="349" text-anchor="middle" font-size="12.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">还有位没枚举？</text>
  <text x="260" y="366" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">i &lt; 32 ？</text>

  <!-- loop back -->
  <path d="M 180 352 C 60 352 60 132 138 132" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="66" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- return -->
  <path d="M 260 380 L 260 400" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="394" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="180" y="402" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="423" text-anchor="middle" font-size="13" fill="#2d5a20" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- invariant note -->
  <rect x="368" y="56" width="140" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="438" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">循环不变式</text>
  <text x="438" y="98" text-anchor="middle" font-size="11" fill="#99741c" filter="url(#rough2)">任何时刻 ans 中</text>
  <text x="438" y="114" text-anchor="middle" font-size="11" fill="#99741c" filter="url(#rough2)">为 1 的位都是</text>
  <text x="438" y="130" text-anchor="middle" font-size="11" fill="#99741c" filter="url(#rough2)">「计数已达标」的位</text>
</svg>
