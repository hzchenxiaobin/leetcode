<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="540" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：pressedKeys = "22233"</text>
  <path d="M 140 40 Q 340 50 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- position header -->
  <text x="52" y="86" font-size="12" fill="#666">位置</text>
  <g filter="url(#sk)" font-size="12" fill="#666" font-family="monospace">
    <text x="130" y="86">0</text><text x="196" y="86">1</text><text x="262" y="86">2</text>
    <text x="328" y="86">3</text><text x="394" y="86">4</text>
  </g>
  <text x="52" y="122" font-size="12" fill="#666">字符</text>
  <g filter="url(#sk)">
    <rect x="108" y="98" width="56" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="174" y="98" width="56" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="240" y="98" width="56" height="34" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="306" y="98" width="56" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="372" y="98" width="56" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="136" y="121" fill="#2b6e9e">2</text><text x="202" y="121" fill="#2b6e9e">2</text>
    <text x="268" y="121" fill="#2b6e9e">2</text>
    <text x="334" y="121" fill="#2e6e2e">3</text><text x="400" y="121" fill="#2e6e2e">3</text>
  </g>
  <text x="202" y="152" text-anchor="middle" font-size="11.5" fill="#2b6e9e">run₁（k=3）内递推 f</text>
  <text x="334" y="152" text-anchor="middle" font-size="11.5" fill="#2e6e2e">run₂（k=3）</text>

  <!-- f computation rows -->
  <g filter="url(#sk)" font-size="11" fill="#444" font-family="monospace">
    <text x="136" y="176" text-anchor="middle">f(1)=1</text>
    <text x="202" y="176" text-anchor="middle">f(2)=1+1=2</text>
    <text x="268" y="176" text-anchor="middle">f(3)=2+1+1=4</text>
    <text x="334" y="176" text-anchor="middle">f(1)=1</text>
    <text x="400" y="176" text-anchor="middle">f(2)=1+1=2</text>
  </g>
  <text x="470" y="176" font-size="11" fill="#888">新段从 f(0)=1 重新起算</text>

  <!-- settle row -->
  <g filter="url(#sk)" font-size="11.5" fill="#9a6a15" font-family="monospace">
    <text x="268" y="204" text-anchor="middle" font-weight="bold">段末：f(3) = 4</text>
    <text x="400" y="204" text-anchor="middle" font-weight="bold">段末：f(2) = 2</text>
  </g>
  <path d="M 268 212 L 268 232" stroke="#c98a2b" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 400 212 L 400 232" stroke="#c98a2b" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ans accumulation bar -->
  <g filter="url(#sk)">
    <rect x="26" y="236" width="628" height="40" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="50" y="261" font-size="13" fill="#333">ans 演进：</text>
  <text x="130" y="261" font-size="13" font-weight="bold" fill="#9a6a15" font-family="monospace">1 → 1×4 = 4 → 4×2 = 8</text>
  <text x="380" y="261" font-size="12" fill="#666">每段结束乘入一段的方案数（乘法原理）</text>

  <!-- f3 vs f4 comparison table -->
  <text x="340" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">f3 与 f4 的分化（决定于字符是否为 7 / 9）</text>
  <g filter="url(#sk)">
    <rect x="96" y="330" width="488" height="120" rx="10" fill="#f7f9fc" stroke="#8aa5c0" stroke-width="1.3"/>
  </g>
  <!-- header row -->
  <g filter="url(#sk)" font-size="12" fill="#666" font-family="monospace">
    <rect x="166" y="338" width="52" height="24" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="218" y="338" width="52" height="24" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="270" y="338" width="52" height="24" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="322" y="338" width="52" height="24" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="374" y="338" width="52" height="24" fill="#fdf6ee" stroke="#c98a2b" stroke-width="2"/>
    <rect x="426" y="338" width="52" height="24" fill="#fff" stroke="#bbb" stroke-width="1"/>
    <rect x="478" y="338" width="52" height="24" fill="#fff" stroke="#bbb" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#666" font-family="monospace" text-anchor="middle">
    <text x="192" y="354">i=0</text><text x="244" y="354">i=1</text><text x="296" y="354">i=2</text>
    <text x="348" y="354">i=3</text><text x="400" y="354" font-weight="bold" fill="#9a6a15">i=4</text>
    <text x="452" y="354">i=5</text><text x="504" y="354">i=6</text>
  </g>
  <!-- f3 row -->
  <text x="130" y="384" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">f3</text>
  <g font-size="13" fill="#2e6e2e" font-family="monospace" text-anchor="middle">
    <text x="192" y="384">1</text><text x="244" y="384">1</text><text x="296" y="384">2</text>
    <text x="348" y="384">4</text><text x="400" y="384" font-weight="bold">7</text>
    <text x="452" y="384">13</text><text x="504" y="384">24</text>
  </g>
  <!-- f4 row -->
  <text x="130" y="414" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">f4</text>
  <g font-size="13" fill="#2b6e9e" font-family="monospace" text-anchor="middle">
    <text x="192" y="414">1</text><text x="244" y="414">1</text><text x="296" y="414">2</text>
    <text x="348" y="414">4</text><text x="400" y="414" font-weight="bold">8</text>
    <text x="452" y="414">15</text><text x="504" y="414">29</text>
  </g>
  <text x="340" y="440" text-anchor="middle" font-size="11.5" fill="#b85450">f(0)~f(3) 两列相同；从 i = 4 起 7 ≠ 8，正式分化</text>
  <text x="96" y="474" font-size="11.5" fill="#666">k = 3：按键 2,3,4,5,6,8（三字母）；k = 4：按键 7,9（四字母 pqrs / wxyz）。</text>

  <!-- bottom conclusion -->
  <g filter="url(#sk)">
    <rect x="26" y="488" width="628" height="38" rx="8" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="50" y="513" font-size="13" fill="#333">最终答案</text>
  <text x="130" y="513" font-size="13.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">ans = 4 × 2 = 8</text>
  <text x="280" y="513" font-size="12" fill="#666">（示例 2 中 36 个 "2" 即 f3(36) = 2082876103 ≡ 82876089）</text>
</svg>
