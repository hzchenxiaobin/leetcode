<svg xmlns="http://www.w3.org/2000/svg" width="660" height="570" viewBox="0 0 660 570" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="abO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="570" fill="#fdfcf7"/>
  <text x="330" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">示例演算：示例 1 逐步合并全部通过，示例 2 拼接后区间违规</text>
  <path d="M 200 38 Q 330 46 460 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ================= 示例 1 ================= -->
  <text x="330" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">示例 1：trees = [[2,1],[3,2,5],[5,4]] → [3,2,5,1,null,4]</text>

  <!-- 左：三棵树 -->
  <g stroke="#446688" stroke-width="1.4">
    <line x1="105" y1="100" x2="78" y2="147" filter="url(#sk)"/>
    <line x1="215" y1="100" x2="187" y2="147" filter="url(#sk)"/>
    <line x1="215" y1="100" x2="243" y2="147" filter="url(#sk)"/>
    <line x1="325" y1="100" x2="297" y2="147" filter="url(#sk)"/>
  </g>
  <g filter="url(#sk)"><circle cx="105" cy="100" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="105" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">2</text>
  <g filter="url(#sk)"><circle cx="78" cy="150" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="78" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">1</text>
  <text x="92" y="177" text-anchor="middle" font-size="9.5" fill="#888">Tree0</text>

  <g filter="url(#sk)"><circle cx="215" cy="100" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="215" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">3</text>
  <g filter="url(#sk)"><circle cx="187" cy="150" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="187" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">2</text>
  <g filter="url(#sk)"><circle cx="243" cy="150" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="243" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">5</text>
  <text x="215" y="177" text-anchor="middle" font-size="9.5" fill="#888">Tree1</text>

  <g filter="url(#sk)"><circle cx="325" cy="100" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="325" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">5</text>
  <g filter="url(#sk)"><circle cx="297" cy="150" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="297" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">4</text>
  <text x="311" y="177" text-anchor="middle" font-size="9.5" fill="#888">Tree2</text>

  <!-- 命中环 + 挂接箭头 -->
  <g filter="url(#sk)"><ellipse cx="187" cy="150" rx="20" ry="17" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4"/></g>
  <g filter="url(#sk)"><ellipse cx="243" cy="150" rx="20" ry="17" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4"/></g>
  <path d="M 122 98 Q 152 116 170 136" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#abO)" filter="url(#sk)"/>
  <text x="140" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040">①</text>
  <path d="M 308 98 Q 282 118 261 137" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#abO)" filter="url(#sk)"/>
  <text x="290" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040">②</text>

  <text x="200" y="198" text-anchor="middle" font-size="10.5" fill="#444">① 叶 2 命中 Tree0 的根 → Tree0 整棵挂到左叶</text>
  <text x="200" y="216" text-anchor="middle" font-size="10.5" fill="#444">② 叶 5 命中 Tree2 的根 → Tree2 整棵挂到右叶</text>

  <!-- 中箭头 -->
  <path d="M 352 130 L 388 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <text x="370" y="120" text-anchor="middle" font-size="10" fill="#888">贪心重构</text>

  <!-- 右：最终树 -->
  <g stroke="#446688" stroke-width="1.4">
    <line x1="480" y1="100" x2="430" y2="147" filter="url(#sk)"/>
    <line x1="480" y1="100" x2="530" y2="147" filter="url(#sk)"/>
    <line x1="430" y1="150" x2="402" y2="197" filter="url(#sk)"/>
    <line x1="530" y1="150" x2="502" y2="197" filter="url(#sk)"/>
  </g>
  <g filter="url(#sk)"><circle cx="480" cy="100" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="480" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">3</text>
  <g filter="url(#sk)"><circle cx="430" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="430" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">2</text>
  <g filter="url(#sk)"><circle cx="530" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="530" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">5</text>
  <g filter="url(#sk)"><circle cx="402" cy="200" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="402" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">1</text>
  <g filter="url(#sk)"><circle cx="502" cy="200" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="502" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">4</text>

  <!-- 区间检查清单 -->
  <text x="597" y="84" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b6e9e">逐点区间检查</text>
  <text x="597" y="104" text-anchor="middle" font-size="9.5" fill="#2e6e2e">3 ∈ (−∞,+∞) ✓</text>
  <text x="597" y="122" text-anchor="middle" font-size="9.5" fill="#2e6e2e">2 ∈ (−∞,3) ✓</text>
  <text x="597" y="140" text-anchor="middle" font-size="9.5" fill="#2e6e2e">1 ∈ (−∞,2) ✓</text>
  <text x="597" y="158" text-anchor="middle" font-size="9.5" fill="#2e6e2e">5 ∈ (3,+∞) ✓</text>
  <text x="597" y="176" text-anchor="middle" font-size="9.5" fill="#2e6e2e">4 ∈ (3,5) ✓</text>

  <g filter="url(#sk)"><rect x="420" y="224" width="240" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="540" y="245" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">used = n ✓ 全部通过 → 返回根 3</text>

  <!-- 分隔线 -->
  <path d="M 60 268 Q 330 276 600 268" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="7 6" fill="none" filter="url(#sk)"/>

  <!-- ================= 示例 2 ================= -->
  <text x="330" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">示例 2：trees = [[5,3,8],[3,2,6]] → null（每棵都合法，拼接后跨树违规）</text>

  <!-- 左：两棵树 -->
  <g stroke="#446688" stroke-width="1.4">
    <line x1="105" y1="355" x2="78" y2="402" filter="url(#sk)"/>
    <line x1="105" y1="355" x2="135" y2="402" filter="url(#sk)"/>
    <line x1="235" y1="355" x2="207" y2="402" filter="url(#sk)"/>
    <line x1="235" y1="355" x2="263" y2="402" filter="url(#sk)"/>
  </g>
  <g filter="url(#sk)"><circle cx="105" cy="355" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="105" y="359" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">5</text>
  <g filter="url(#sk)"><circle cx="78" cy="405" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="78" y="409" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">3</text>
  <g filter="url(#sk)"><circle cx="135" cy="405" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="135" y="409" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">8</text>
  <text x="105" y="432" text-anchor="middle" font-size="9.5" fill="#888">Tree0</text>

  <g filter="url(#sk)"><circle cx="235" cy="355" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="235" y="359" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">3</text>
  <g filter="url(#sk)"><circle cx="207" cy="405" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="207" y="409" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">2</text>
  <g filter="url(#sk)"><circle cx="263" cy="405" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="263" y="409" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">6</text>
  <text x="235" y="432" text-anchor="middle" font-size="9.5" fill="#888">Tree1（6 > 3，树内合法）</text>

  <g filter="url(#sk)"><ellipse cx="78" cy="405" rx="20" ry="17" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4"/></g>
  <path d="M 220 362 Q 155 375 98 397" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#abO)" filter="url(#sk)"/>
  <text x="158" y="358" text-anchor="middle" font-size="10" fill="#7a5415">叶 3 命中根 3 → 整棵挂上</text>

  <!-- 右：合并后 -->
  <g stroke="#446688" stroke-width="1.4">
    <line x1="470" y1="350" x2="418" y2="397" filter="url(#sk)"/>
    <line x1="470" y1="350" x2="528" y2="397" filter="url(#sk)"/>
    <line x1="418" y1="400" x2="388" y2="447" filter="url(#sk)"/>
    <line x1="418" y1="400" x2="450" y2="447" filter="url(#sk)"/>
  </g>
  <g filter="url(#sk)"><circle cx="470" cy="350" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="470" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">5</text>
  <g filter="url(#sk)"><circle cx="418" cy="400" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="418" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">3</text>
  <g filter="url(#sk)"><circle cx="528" cy="400" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="528" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">8</text>
  <g filter="url(#sk)"><circle cx="388" cy="450" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="388" y="454" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">2</text>
  <g filter="url(#sk)"><circle cx="450" cy="450" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/></g>
  <text x="450" y="454" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">6</text>
  <g filter="url(#sk)"><ellipse cx="450" cy="450" rx="24" ry="20" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4"/></g>

  <!-- 违规链：5 → 3 → 6 -->
  <path d="M 470 350 L 418 400 L 450 450" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 5" fill="none" filter="url(#sk)"/>
  <text x="495" y="344" font-size="9.5" fill="#b85450">祖先 5</text>
  <path d="M 478 466 L 494 482 M 494 466 L 478 482" stroke="#b85450" stroke-width="2.4" filter="url(#sk)"/>

  <text x="480" y="504" text-anchor="middle" font-size="10.5" fill="#444">6 的区间是 (3, 5)：必须严格小于祖先链上的 5</text>
  <text x="480" y="524" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">但 6 ≥ 5，跨树约束被破坏 ✗</text>

  <g filter="url(#sk)"><rect x="400" y="534" width="200" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="500" y="554" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">验证失败 → 返回 null</text>
</svg>
