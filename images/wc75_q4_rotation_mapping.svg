<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">轮调 = 下标整体平移，元素值不变</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">原下标 j 的元素，轮调 k 后落在位置 (j − k) mod n</text>
  <text x="280" y="63" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">得分条件：位置 ≥ nums[j]，即 (j − k) mod n ≥ nums[j]</text>

  <text x="80" y="82" font-size="10.5" fill="#446688" filter="url(#rough2)">原数组 nums</text>

  <g filter="url(#rough2)">
    <rect x="80" y="90" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="162" y="90" width="70" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="5"/>
    <rect x="244" y="90" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <rect x="326" y="90" width="70" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5"/>
    <rect x="408" y="90" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
  </g>
  <g filter="url(#rough2)" font-size="16" text-anchor="middle" fill="#333">
    <text x="115" y="114">2</text>
    <text x="197" y="114">3</text>
    <text x="279" y="114">1</text>
    <text x="361" y="114">4</text>
    <text x="443" y="114">0</text>
  </g>
  <g filter="url(#rough2)" font-size="8.5" text-anchor="middle" fill="#888">
    <text x="115" y="128">j = 0</text>
    <text x="197" y="128">j = 1</text>
    <text x="279" y="128">j = 2</text>
    <text x="361" y="128">j = 3</text>
    <text x="443" y="128">j = 4</text>
  </g>

  <path d="M 202 138 C 252 166, 392 158, 436 186" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 356 138 C 318 170, 244 170, 204 186" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="80" y="180" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">轮调 k = 2 后</text>

  <g filter="url(#rough2)">
    <rect x="80" y="188" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <rect x="162" y="188" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <rect x="244" y="188" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <rect x="326" y="188" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
    <rect x="408" y="188" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5"/>
  </g>
  <g filter="url(#rough2)" font-size="16" text-anchor="middle" fill="#333">
    <text x="115" y="212">1</text>
    <text x="197" y="212">4</text>
    <text x="279" y="212">0</text>
    <text x="361" y="212">2</text>
    <text x="443" y="212">3</text>
  </g>
  <g filter="url(#rough2)" font-size="8.5" text-anchor="middle" fill="#888">
    <text x="115" y="226">i = 0</text>
    <text x="197" y="226">i = 1</text>
    <text x="279" y="226">i = 2</text>
    <text x="361" y="226">i = 3</text>
    <text x="443" y="226">i = 4</text>
  </g>

  <rect x="48" y="248" width="464" height="136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="66" y="270" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">逐元素看：固定 j，扫描所有 k</text>
  <ellipse cx="72" cy="288" rx="6" ry="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="88" y="292" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">j = 1，值 3 → 位置 (1 − 2) mod 5 = 4，3 ≤ 4，记 1 分</text>
  <ellipse cx="72" cy="310" rx="6" ry="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="88" y="314" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">j = 3，值 4 → 位置 (3 − 2) mod 5 = 1，4 &gt; 1，不计分</text>
  <text x="66" y="340" font-size="10.5" fill="#555" filter="url(#rough2)">一个元素只在「一段连续的 k」上得分，这正是可以差分的前提。</text>
  <text x="66" y="362" font-size="10.5" fill="#555" filter="url(#rough2)">于是枚举对象从「n 个 k」换成「n 个元素各自的得分区间」。</text>
</svg>
