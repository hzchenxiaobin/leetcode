<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="450" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">连字符合法性：两侧都是字母才并入单词</text>
  <path d="M 140 40 Q 320 48 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 行 1：x - y - z 全合法 -->
  <g filter="url(#sk)"><rect x="70" y="68" width="46" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="93" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">x</text>
  <g filter="url(#sk)"><rect x="116" y="68" width="46" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="139" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">-</text>
  <g filter="url(#sk)"><rect x="162" y="68" width="46" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="185" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">y</text>
  <g filter="url(#sk)"><rect x="208" y="68" width="46" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="231" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e6e2e">-</text>
  <g filter="url(#sk)"><rect x="254" y="68" width="46" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="277" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">z</text>
  <text x="316" y="96" font-size="24" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="344" y="87" font-size="11.5" font-weight="bold" fill="#2e6e2e">两个 - 两侧都是字母</text>
  <text x="344" y="103" font-size="10.5" fill="#666">并入，不切断</text>
  <g filter="url(#sk)"><rect x="490" y="70" width="120" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="550" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">单词 "x-y-z"</text>

  <!-- 行 2：x - - y 连续连字符 -->
  <g filter="url(#sk)"><rect x="70" y="156" width="46" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="93" y="184" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">x</text>
  <g filter="url(#sk)"><rect x="116" y="156" width="46" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="139" y="184" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450">-</text>
  <g filter="url(#sk)"><rect x="162" y="156" width="46" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="185" y="184" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450">-</text>
  <g filter="url(#sk)"><rect x="208" y="156" width="46" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="231" y="184" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">y</text>
  <text x="316" y="184" font-size="24" font-weight="bold" fill="#b85450">✗</text>
  <text x="344" y="175" font-size="11.5" font-weight="bold" fill="#b85450">第 1 个 - 的右邻是 -</text>
  <text x="344" y="191" font-size="10.5" fill="#666">非字母 → 非法 → 分隔</text>
  <text x="505" y="182" font-size="13" font-weight="bold" fill="#2b6e9e">"x"</text>
  <text x="528" y="182" font-size="12" fill="#b85450">|</text>
  <text x="545" y="182" font-size="13" font-weight="bold" fill="#2b6e9e">"y"</text>
  <text x="552" y="199" font-size="9.5" fill="#888">断成两个单词</text>

  <!-- 行 3：x - ␣ y 右邻空格 -->
  <g filter="url(#sk)"><rect x="70" y="244" width="46" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="93" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">x</text>
  <g filter="url(#sk)"><rect x="116" y="244" width="46" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="139" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450">-</text>
  <g filter="url(#sk)"><rect x="162" y="244" width="46" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="185" y="272" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">␣</text>
  <g filter="url(#sk)"><rect x="208" y="244" width="46" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="231" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">y</text>
  <text x="316" y="272" font-size="24" font-weight="bold" fill="#b85450">✗</text>
  <text x="344" y="263" font-size="11.5" font-weight="bold" fill="#b85450">- 的右邻是空格</text>
  <text x="344" y="279" font-size="10.5" fill="#666">串尾同理 → 非法 → 分隔</text>
  <text x="505" y="270" font-size="13" font-weight="bold" fill="#2b6e9e">"x"</text>
  <text x="528" y="270" font-size="12" fill="#b85450">|</text>
  <text x="545" y="270" font-size="13" font-weight="bold" fill="#2b6e9e">"y"</text>

  <!-- 行 4：␣ - x 左侧无字母 -->
  <g filter="url(#sk)"><rect x="70" y="332" width="46" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="93" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">␣</text>
  <g filter="url(#sk)"><rect x="116" y="332" width="46" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="139" y="360" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450">-</text>
  <g filter="url(#sk)"><rect x="162" y="332" width="46" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="185" y="360" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6e9e">x</text>
  <text x="316" y="360" font-size="24" font-weight="bold" fill="#b85450">✗</text>
  <text x="344" y="351" font-size="11.5" font-weight="bold" fill="#b85450">- 的左邻无字母</text>
  <text x="344" y="367" font-size="10.5" fill="#666">串首 / 左邻是 - 同理</text>
  <text x="515" y="358" font-size="13" font-weight="bold" fill="#2b6e9e">"x"</text>
  <text x="540" y="358" font-size="10" fill="#888">（- 被丢弃）</text>

  <!-- 底部总结 -->
  <g filter="url(#sk)">
    <rect x="60" y="394" width="520" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">- 合法 ⟺ 左邻与右邻都是小写字母</text>
  <text x="320" y="430" text-anchor="middle" font-size="11" fill="#444">否则该 - 就是分隔符，与空格同等地位，直接丢弃</text>
</svg>
