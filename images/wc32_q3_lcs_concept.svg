<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="34" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">两串最终都等于同一段公共子序列</text>
  <text x="320" y="56" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">绿色字符保留，红色字符删除；总步数 = 两侧被删字符数之和</text>

  <text x="118" y="118" text-anchor="end" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">word1</text>
  <rect x="150" y="90" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="90" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="250" y="90" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="172" y="119" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">s</text>
  <text x="222" y="119" text-anchor="middle" font-size="16" fill="#3a5a30" filter="url(#rough2)">e</text>
  <text x="272" y="119" text-anchor="middle" font-size="16" fill="#3a5a30" filter="url(#rough2)">a</text>
  <text x="172" y="82" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">删</text>

  <text x="118" y="198" text-anchor="end" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">word2</text>
  <rect x="200" y="170" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="250" y="170" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="170" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="222" y="199" text-anchor="middle" font-size="16" fill="#3a5a30" filter="url(#rough2)">e</text>
  <text x="272" y="199" text-anchor="middle" font-size="16" fill="#3a5a30" filter="url(#rough2)">a</text>
  <text x="322" y="199" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">t</text>
  <text x="322" y="236" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">删</text>

  <path d="M 222 140 L 222 166" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 272 140 L 272 166" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="158" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">同一字符竖直对齐，可同时保留</text>

  <rect x="80" y="252" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="277" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">最长公共子序列 LCS = "ea"，长度 L = 2</text>
  <text x="320" y="306" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">答案 = |word1| + |word2| − 2L = 3 + 3 − 4 = 2</text>
</svg>
