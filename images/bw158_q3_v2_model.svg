<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="370" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">GCD 拆成「奇数部分 × 2 的幂」：翻倍只能把 2 的指数抬 1</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">nums 的每个元素最多翻倍一次，每次操作花费 1</text>
  <rect x="40" y="60" width="520" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="87.0" font-size="10.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">写 nums[i] = odd_i × 2^(v2_i)，翻倍后 v2 变成 v2 + 1，奇数部分不变</text>
  <rect x="40" y="124" width="230" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="155.0" y="143.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">v2 情况</text>
  <rect x="270" y="124" width="150" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="345.0" y="143.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">子数组 GCD 的 2 指数</text>
  <rect x="420" y="124" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="490.0" y="143.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">能否翻倍</text>
  <rect x="40" y="154" width="230" height="30" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155.0" y="173.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">min v2 = m，达到 m 的元素有 c 个</text>
  <rect x="270" y="154" width="150" height="30" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="345.0" y="173.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">= m</text>
  <rect x="420" y="154" width="140" height="30" fill="#f1f3f4" stroke="#888" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490.0" y="173.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">c &lt;= k 时可全部翻倍</text>
  <rect x="40" y="184" width="230" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155.0" y="203.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">上一条且 c &lt;= k</text>
  <rect x="270" y="184" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="345.0" y="203.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">= m + 1</text>
  <rect x="420" y="184" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490.0" y="203.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">GCD 恰好乘 2</text>
  <rect x="40" y="214" width="230" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155.0" y="233.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">想要 m + 2</text>
  <rect x="270" y="214" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="345.0" y="233.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">做不到</text>
  <rect x="420" y="214" width="140" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490.0" y="233.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">每个元素只能翻一次</text>
  <rect x="40" y="240" width="520" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="262.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">结论：对每个子数组，score = G × (c &lt;= k ? 2 : 1) × len</text>
  <text x="300.0" y="282.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">其中 G 是原 GCD，c 是「2 的指数恰为最小值」的元素个数</text>
  <text x="40" y="322" font-size="10" fill="#999" text-anchor="start" filter="url(#rough2)">奇数部分不受翻倍影响，所以 GCD 最多只能翻一倍——这是整道题的题眼</text>
</svg>
