<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">示例演算：nums = [1,2,2,2,2] —— top1 撞车 + 奇组无 top2</text>
  <path d="M 90 38 Q 320 46 550 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- nums cells -->
  <text x="42" y="76" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">nums =</text>
  <g filter="url(#rough2)">
    <rect x="102" y="54" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="148" y="54" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="194" y="54" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="240" y="54" width="46" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="286" y="54" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="125" y="77" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="171" y="77" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="217" y="77" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="263" y="77" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="309" y="77" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="125" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="171" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="217" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="263" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="309" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>

  <!-- conflict warning badge -->
  <g filter="url(#rough2)">
    <rect x="390" y="54" width="216" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="498" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">⚠ 两组 top1 撞车：都是 2</text>
  <text x="498" y="92" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">直接 n − (2+2) = 1 是经典 WA！</text>

  <!-- group boxes -->
  <rect x="30" y="126" width="288" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="174" y="148" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">偶组 [1,2,2]（n₁=3）：{2:2, 1:1}</text>
  <text x="174" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">top1 = (2, 2)　　top2 = (1, 1)</text>
  <text x="174" y="192" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">保留 x=2 → 改 1 个；保留 x=1 → 改 2 个</text>

  <rect x="322" y="126" width="288" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="466" y="148" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b6e9e" filter="url(#rough2)">奇组 [2,2]（n₂=2）：{2:2}</text>
  <text x="466" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">top1 = (2, 2)　　top2 = (⊥, 0) ← 哨兵</text>
  <text x="466" y="192" text-anchor="middle" font-size="10" fill="#2b6e9e" filter="url(#rough2)">只有一种值：top2 缺位，补「全新值，保留 0 个」</text>

  <!-- combo table -->
  <text x="320" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">2×2 枚举（代价 = (n₁ − cx) + (n₂ − cy) = (3 − cx) + (2 − cy)）</text>

  <!-- header -->
  <g filter="url(#rough2)">
    <rect x="70" y="252" width="150" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="220" y="252" width="190" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="410" y="252" width="160" height="30" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="145" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444" filter="url(#rough2)">组合 (x, y)</text>
  <text x="315" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444" filter="url(#rough2)">代价</text>
  <text x="490" y="272" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#444" filter="url(#rough2)">说明</text>

  <!-- row 1: conflict -->
  <g filter="url(#rough2)">
    <rect x="70" y="284" width="150" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="220" y="284" width="190" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="410" y="284" width="160" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="145" y="304" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">(2, 2)</text>
  <text x="315" y="304" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ x = y，非法</text>
  <text x="490" y="304" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">跳过</text>

  <!-- row 2 -->
  <g filter="url(#rough2)">
    <rect x="70" y="316" width="150" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="220" y="316" width="190" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="410" y="316" width="160" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
  </g>
  <text x="145" y="336" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(2, ⊥)</text>
  <text x="315" y="336" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(3−2) + (2−0) = 3</text>
  <text x="490" y="336" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">偶组留 2，奇组全改</text>

  <!-- row 3: winner -->
  <g filter="url(#rough2)">
    <rect x="70" y="348" width="150" height="30" rx="4" fill="#b8e0b8" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="220" y="348" width="190" height="30" rx="4" fill="#b8e0b8" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="410" y="348" width="160" height="30" rx="4" fill="#b8e0b8" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="145" y="368" text-anchor="middle" font-size="11.5" fill="#1e4d1e" font-weight="bold" filter="url(#rough2)">(1, 2) ✓</text>
  <text x="315" y="368" text-anchor="middle" font-size="11.5" fill="#1e4d1e" font-weight="bold" filter="url(#rough2)">(3−1) + (2−2) = 2 ← 最小</text>
  <text x="490" y="368" text-anchor="middle" font-size="10.5" fill="#1e4d1e" filter="url(#rough2)">偶组让位到 top2，奇组全留</text>

  <!-- row 4 -->
  <g filter="url(#rough2)">
    <rect x="70" y="380" width="150" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="220" y="380" width="190" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="410" y="380" width="160" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
  </g>
  <text x="145" y="400" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(1, ⊥)</text>
  <text x="315" y="400" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(3−1) + (2−0) = 4</text>
  <text x="490" y="400" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">两边都大动，被支配</text>

  <!-- result banner -->
  <g filter="url(#rough2)">
    <rect x="70" y="424" width="500" height="34" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="320" y="446" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">答案 = 2 → [1, 2, 1, 2, 1]：只改下标 2、4（各一次）</text>
</svg>
