<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">两个 26 位掩码：lower == upper ⇔ 美好</text>

  <!-- 面板 1：aAa，nice -->
  <text x="60" y="68" font-size="14" fill="#4a7a3a" filter="url(#rough2)">t = "aAa"（字母 a 两种形式都在）</text>

  <text x="60" y="104" font-size="12.5" fill="#666" filter="url(#rough2)">lower</text>
  <g>
    <rect x="110" y="84" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="142" y="84" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="174" y="84" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="206" y="84" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="238" y="84" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="270" y="84" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="125" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
    <text x="157" y="104" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
    <text x="189" y="104" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
    <text x="221" y="104" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
    <text x="253" y="104" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
    <text x="285" y="104" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  </g>
  <text x="316" y="104" font-size="11.5" fill="#888" filter="url(#rough2)">…（b..z 位）</text>

  <text x="60" y="144" font-size="12.5" fill="#666" filter="url(#rough2)">upper</text>
  <g>
    <rect x="110" y="124" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="142" y="124" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="174" y="124" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="206" y="124" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="238" y="124" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="270" y="124" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="125" y="144" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
    <text x="157" y="144" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
    <text x="189" y="144" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
    <text x="221" y="144" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
    <text x="253" y="144" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
    <text x="285" y="144" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  </g>
  <rect x="330" y="124" width="118" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="389" y="144" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">相等 → nice ✓</text>

  <line x1="40" y1="176" x2="480" y2="176" stroke="#ddd" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- 面板 2：abA，not nice -->
  <text x="60" y="206" font-size="14" fill="#b85450" filter="url(#rough2)">t = "abA"（b 只有小写）</text>

  <text x="60" y="242" font-size="12.5" fill="#666" filter="url(#rough2)">lower</text>
  <g>
    <rect x="110" y="222" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="142" y="222" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="174" y="222" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="206" y="222" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="238" y="222" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="270" y="222" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="125" y="242" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
    <text x="157" y="242" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
    <text x="189" y="242" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
    <text x="221" y="242" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
    <text x="253" y="242" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
    <text x="285" y="242" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  </g>

  <text x="60" y="282" font-size="12.5" fill="#666" filter="url(#rough2)">upper</text>
  <g>
    <rect x="110" y="262" width="30" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="142" y="262" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="174" y="262" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="206" y="262" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="238" y="262" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <rect x="270" y="262" width="30" height="30" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="125" y="282" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
    <text x="157" y="282" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
    <text x="189" y="282" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
    <text x="221" y="282" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
    <text x="253" y="282" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
    <text x="285" y="282" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  </g>
  <rect x="330" y="262" width="158" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="409" y="282" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">b 位不等 → 不是 nice</text>

  <rect x="80" y="312" width="360" height="36" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="12.5" fill="#7a5a20" filter="url(#rough2)">右端点每前进一格只“或等一位”，判定摊还 O(1)</text>
</svg>
