<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="460" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">交换 (x ≠ y)：四个频次桶各跨一次「存在性」门槛</text>
  <path d="M 130 40 Q 320 50 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- word1 lose x -->
  <text x="40" y="66" font-size="13" font-weight="bold" fill="#2b6e9e">① word1 失 x：cnt1[x] − 1</text>
  <g filter="url(#sk)">
    <rect x="50" y="80" width="34" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="120" y="80" width="34" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <path d="M 88 94 L 114 94" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="50" y="140" width="34" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="120" y="140" width="34" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <path d="M 88 154 L 114 154" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="67" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">1</text>
  <text x="137" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">0</text>
  <text x="102" y="124" text-anchor="middle" font-size="10.5" fill="#b85450">1→0：少一种（−1）</text>
  <text x="67" y="159" text-anchor="middle" font-size="12" fill="#2b6e9e">3</text>
  <text x="137" y="159" text-anchor="middle" font-size="12" fill="#2b6e9e">2</text>
  <text x="102" y="184" text-anchor="middle" font-size="10.5" fill="#555555">k→k−1（仍 ≥1）：不变</text>

  <!-- word1 gain y -->
  <text x="350" y="66" font-size="13" font-weight="bold" fill="#2b6e9e">② word1 得 y：cnt1[y] + 1</text>
  <g filter="url(#sk)">
    <rect x="360" y="80" width="34" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="430" y="80" width="34" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <path d="M 398 94 L 424 94" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="360" y="140" width="34" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <rect x="430" y="140" width="34" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
    <path d="M 398 154 L 424 154" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="377" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">0</text>
  <text x="447" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">1</text>
  <text x="412" y="124" text-anchor="middle" font-size="10.5" fill="#b85450">0→1：多一种（+1）</text>
  <text x="377" y="159" text-anchor="middle" font-size="12" fill="#2b6e9e">2</text>
  <text x="447" y="159" text-anchor="middle" font-size="12" fill="#2b6e9e">3</text>
  <text x="412" y="184" text-anchor="middle" font-size="10.5" fill="#555555">k→k+1（原已在）：不变</text>

  <!-- word2 lose y -->
  <text x="40" y="216" font-size="13" font-weight="bold" fill="#2e6e2e">③ word2 失 y：cnt2[y] − 1</text>
  <g filter="url(#sk)">
    <rect x="50" y="230" width="34" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="120" y="230" width="34" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <path d="M 88 244 L 114 244" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="50" y="284" width="34" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="120" y="284" width="34" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <path d="M 88 298 L 114 298" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="67" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">1</text>
  <text x="137" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">0</text>
  <text x="102" y="274" text-anchor="middle" font-size="10.5" fill="#b85450">1→0：少一种（−1）</text>
  <text x="67" y="303" text-anchor="middle" font-size="12" fill="#2e6e2e">2</text>
  <text x="137" y="303" text-anchor="middle" font-size="12" fill="#2e6e2e">1</text>
  <text x="102" y="328" text-anchor="middle" font-size="10.5" fill="#555555">k→k−1（仍 ≥1）：不变</text>

  <!-- word2 gain x -->
  <text x="350" y="216" font-size="13" font-weight="bold" fill="#2e6e2e">④ word2 得 x：cnt2[x] + 1</text>
  <g filter="url(#sk)">
    <rect x="360" y="230" width="34" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="430" y="230" width="34" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <path d="M 398 244 L 424 244" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <rect x="360" y="284" width="34" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="430" y="284" width="34" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/>
    <path d="M 398 298 L 424 298" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="377" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">0</text>
  <text x="447" y="249" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">1</text>
  <text x="412" y="274" text-anchor="middle" font-size="10.5" fill="#b85450">0→1：多一种（+1）</text>
  <text x="377" y="303" text-anchor="middle" font-size="12" fill="#2e6e2e">1</text>
  <text x="447" y="303" text-anchor="middle" font-size="12" fill="#2e6e2e">2</text>
  <text x="412" y="328" text-anchor="middle" font-size="10.5" fill="#555555">k→k+1（原已在）：不变</text>

  <!-- formula -->
  <g filter="url(#sk)">
    <rect x="50" y="348" width="540" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="320" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">nd1 = d1 − [cnt1[x]=1] + [cnt1[y]=0]</text>
  <text x="320" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">nd2 = d2 − [cnt2[y]=1] + [cnt2[x]=0]</text>

  <!-- x == y warning -->
  <g filter="url(#sk)">
    <rect x="50" y="412" width="540" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="320" y="429" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">x = y：四桶塌缩成两桶，失即得、相互抵消 → 空操作</text>
  <text x="320" y="446" text-anchor="middle" font-size="10.5" fill="#555555">单独分流：只判 d1 == d2（套增量公式会因两判定针对同一桶而互相矛盾）</text>
</svg>
