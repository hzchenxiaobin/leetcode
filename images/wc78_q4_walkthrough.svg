<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="540" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, 1, 2] 的完整博弈树</text>
  <text x="380" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">根局面 x = 1 ^ 1 ^ 2 = 2 ≠ 0、n = 3 为奇数 → 必败态，两条分支都救不回来</text>

  <rect x="168" y="66" width="112" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="224" y="91" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">先手必败</text>
  <path d="M 282 85 L 296 85" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="300" y="64" width="160" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="86" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">[1, 1, 2]</text>
  <text x="380" y="104" text-anchor="middle" font-size="9.5" fill="#5a6a86" filter="url(#rough2)">x = 2，n = 3（奇）</text>

  <path d="M 380 112 L 218 164" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 112 L 542 164" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="140" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">擦 1</text>
  <text x="490" y="140" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">擦 2</text>

  <rect x="128" y="166" width="176" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="188" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">[1, 2]</text>
  <text x="216" y="206" text-anchor="middle" font-size="9.5" fill="#5a6a86" filter="url(#rough2)">x = 3，n = 2（偶）→ Bob 胜</text>

  <rect x="460" y="166" width="176" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="548" y="188" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">[1, 1]</text>
  <text x="548" y="206" text-anchor="middle" font-size="9.5" fill="#5a7a50" filter="url(#rough2)">x = 0 → Bob 轮到即赢</text>

  <path d="M 216 214 L 132 266" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 216 214 L 314 266" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="244" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">擦 1</text>
  <text x="292" y="244" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">擦 2</text>

  <rect x="46" y="268" width="170" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="131" y="290" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">[2]</text>
  <text x="131" y="308" text-anchor="middle" font-size="9.5" fill="#a85a55" filter="url(#rough2)">x = 2，n = 1（奇）</text>

  <rect x="232" y="268" width="170" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="317" y="290" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">[1]</text>
  <text x="317" y="308" text-anchor="middle" font-size="9.5" fill="#a85a55" filter="url(#rough2)">x = 1，n = 1（奇）</text>

  <path d="M 548 214 L 548 264" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="596" y="244" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">无需再擦</text>

  <rect x="46" y="330" width="356" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="224" y="351" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">轮到 Alice 只剩一个非 0 数：擦掉后黑板为空（x = 0）</text>
  <text x="224" y="370" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">按规则「擦除者输」，所以这两条分支 Alice 都输</text>

  <rect x="452" y="326" width="264" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="584" y="347" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">规则二：Bob 开局即看到 x = 0，</text>
  <text x="584" y="366" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">直接获胜 —— 这一支 Alice 立刻输</text>

  <text x="380" y="404" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">三个官方示例的判定结果</text>

  <rect x="96" y="414" width="568" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="186" y="432" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">输入 nums</text>
  <text x="321" y="432" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="416" y="432" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">长度 n</text>
  <text x="565" y="432" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">结论</text>

  <rect x="96" y="440" width="568" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="186" y="458" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">[1, 1, 2]</text>
  <text x="321" y="458" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">2</text>
  <text x="416" y="458" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">3（奇）</text>
  <text x="565" y="458" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">false（奇数且 x ≠ 0）</text>

  <rect x="96" y="466" width="568" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="186" y="484" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">[0, 1]</text>
  <text x="321" y="484" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="416" y="484" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">2（偶）</text>
  <text x="565" y="484" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">true（偶数即必胜）</text>

  <rect x="96" y="492" width="568" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="186" y="510" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">[1, 2, 3]</text>
  <text x="321" y="510" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">0</text>
  <text x="416" y="510" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">3（奇）</text>
  <text x="565" y="510" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">true（x = 0 立即胜）</text>
</svg>
