<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="520" height="300" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333">示例演算：s = "abcd", k = 2</text>

  <rect x="40" y="56" width="440" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="88" font-size="14" fill="#446688">初始</text>
  <text x="130" y="89" font-size="16" fill="#333">a</text>
  <text x="180" y="89" font-size="16" fill="#333">b</text>
  <text x="230" y="89" font-size="16" fill="#333">c</text>
  <text x="280" y="89" font-size="16" fill="#333">d</text>
  <text x="340" y="88" font-size="12" fill="#666">左=0 右=k−1=1</text>

  <rect x="40" y="126" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="158" font-size="14" fill="#d6a040">交换 a↔b</text>
  <text x="130" y="159" font-size="16" fill="#333">b</text>
  <text x="180" y="159" font-size="16" fill="#333">a</text>
  <text x="230" y="159" font-size="16" fill="#333">c</text>
  <text x="280" y="159" font-size="16" fill="#333">d</text>
  <text x="340" y="158" font-size="12" fill="#666">左=1 右=0 交错</text>

  <rect x="40" y="196" width="440" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="228" font-size="14" fill="#4a7a3a">结束</text>
  <text x="130" y="229" font-size="16" fill="#333">b</text>
  <text x="180" y="229" font-size="16" fill="#333">a</text>
  <text x="230" y="229" font-size="16" fill="#333">c</text>
  <text x="280" y="229" font-size="16" fill="#333">d</text>
  <text x="340" y="228" font-size="12" fill="#666">返回 "bacd"</text>

  <text x="260" y="278" text-anchor="middle" font-size="12" fill="#888">k = n 时退化为整体反转；k = 1 时循环体一次都不执行</text>
</svg>
