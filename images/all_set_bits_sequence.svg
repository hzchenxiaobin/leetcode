<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>

  <text x="350" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#446688" filter="url(#rough2)">全 1 数 = 梅森数 2^b − 1（b 个 1 连排）</text>

  <!-- b=1 : 1 -->
  <text x="57" y="86" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">b=1</text>
  <rect x="40" y="100" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="126" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="57" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">= 1</text>

  <!-- b=2 : 11 -->
  <text x="137" y="86" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">b=2</text>
  <rect x="102" y="100" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="100" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="126" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="157" y="126" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="138" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">= 3</text>

  <!-- b=3 : 111 -->
  <text x="254" y="86" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">b=3</text>
  <rect x="200" y="100" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="238" y="100" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="276" y="100" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="126" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="255" y="126" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="293" y="126" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="255" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">= 7</text>

  <!-- b=4 : 1111 -->
  <text x="408" y="86" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">b=4</text>
  <rect x="336" y="100" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="374" y="100" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="412" y="100" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="450" y="100" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="353" y="126" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="391" y="126" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="429" y="126" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="467" y="126" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="410" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">= 15</text>

  <!-- b=5 : 11111 -->
  <text x="594" y="86" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">b=5</text>
  <rect x="508" y="100" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="546" y="100" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="584" y="100" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="622" y="100" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="660" y="100" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="525" y="126" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="563" y="126" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="601" y="126" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="639" y="126" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="677" y="126" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="594" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">= 31</text>

  <!-- arrows between groups -->
  <path d="M 78 120 Q 88 112 98 114" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 120 Q 190 112 198 114" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 314 120 Q 324 112 332 114" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 488 120 Q 498 112 506 114" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- orange note box -->
  <rect x="60" y="235" width="560" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="340" y="260" text-anchor="middle" font-size="15" fill="#7a5a10" filter="url(#rough2)">递推生长：x ← (x &lt;&lt; 1) | 1，即 x = 2x + 1</text>
  <text x="340" y="282" text-anchor="middle" font-size="13" fill="#99741c" filter="url(#rough2)">1 → 11 → 111 → 1111 → 11111 → ...</text>

  <!-- green answer box -->
  <rect x="60" y="315" width="560" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="340" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">答案 = 第一个 ≥ n 的全 1 数</text>
  <text x="340" y="362" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">例：n = 10 → 跳过 1, 3, 7，取 15 ✓</text>
</svg>
