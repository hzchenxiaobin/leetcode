<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="330" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">关键：感染只在「连通块」内部扩散</text>
  <text x="60" y="62" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">graph 的连通块划分（每块内部全互通）</text>
  <rect x="60" y="78" width="220" height="90" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="112" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">块 A：{0, 1}</text>
  <text x="170" y="140" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">感染源 0、1（2 个）</text>
  <rect x="310" y="78" width="130" height="90" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="375" y="112" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">块 B：{2}</text>
  <text x="375" y="140" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">感染源 2（1 个）</text>
  <rect x="470" y="78" width="150" height="90" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="545" y="112" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">块 C：{3,4,5}</text>
  <text x="545" y="140" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">无感染源</text>
  <text x="60" y="214" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">移除一个感染源 u 后，能「救下」的节点数 =</text>
  <rect x="60" y="232" width="250" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="257.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">块内感染源数 == 1  →  块大小</text>
  <rect x="340" y="232" width="250" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465.0" y="257.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">块内感染源数 ≥ 2  →  救不下任何节点</text>
  <text x="330" y="310" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">例：移除 2 → 块 B 独苗被救，收益 1；移除 0 或 1 → 块 A 仍有另一个感染源，收益 0</text>
</svg>
