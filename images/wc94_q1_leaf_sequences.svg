<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="660" height="350" fill="#fafafa"/>

  <text x="22" y="32" font-size="16" fill="#333" filter="url(#rough2)">两棵形状完全不同的树，可能拥有相同的叶值序列</text>

  <!-- 树 1 -->
  <text x="30" y="62" font-size="12" fill="#446688" filter="url(#rough2)">树 1</text>
  <circle cx="90" cy="86" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="91" text-anchor="middle" font-size="12" fill="#2c4a63" filter="url(#rough2)">3</text>
  <path d="M82 100 L62 126 M98 100 L118 126" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="58" cy="142" r="17" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="147" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">5</text>
  <circle cx="122" cy="142" r="17" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="147" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <path d="M50 156 L34 182 M66 156 L82 182 M114 156 L98 182 M130 156 L146 182" stroke="#9aa4b0" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <circle cx="30" cy="198" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="30" y="203" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">6</text>
  <circle cx="86" cy="198" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="86" y="203" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">7</text>
  <circle cx="98" cy="198" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="98" y="203" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">4</text>
  <circle cx="150" cy="198" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="203" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">9</text>

  <!-- 树 2 -->
  <text x="360" y="62" font-size="12" fill="#b07d20" filter="url(#rough2)">树 2（形状不同）</text>
  <circle cx="430" cy="86" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="91" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">3</text>
  <path d="M422 100 L402 126 M438 100 L458 126" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="398" cy="142" r="17" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="147" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">5</text>
  <circle cx="462" cy="142" r="17" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="462" y="147" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <path d="M390 156 L374 182 M406 156 L422 182" stroke="#9aa4b0" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <circle cx="370" cy="198" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="203" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">6</text>
  <circle cx="426" cy="198" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="426" y="203" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">7</text>
  <path d="M454 156 L486 182" stroke="#9aa4b0" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <circle cx="492" cy="182" r="16" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="492" y="187" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">4</text>
  <path d="M484 194 L466 210 M500 194 L518 210" stroke="#9aa4b0" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <circle cx="462" cy="222" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="462" y="227" text-anchor="middle" font-size="10" fill="#33562a" filter="url(#rough2)">9</text>
  <circle cx="522" cy="222" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="522" y="227" text-anchor="middle" font-size="10" fill="#33562a" filter="url(#rough2)">8</text>

  <!-- 叶值序列 -->
  <rect x="24" y="258" width="260" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="154" y="280" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">树 1 叶值序列（从左到右）</text>
  <text x="154" y="306" text-anchor="middle" font-size="15" fill="#33562a" filter="url(#rough2)">[6, 7, 4, 9]</text>

  <rect x="300" y="258" width="260" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="280" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">树 2 叶值序列（从左到右）</text>
  <text x="430" y="306" text-anchor="middle" font-size="15" fill="#33562a" filter="url(#rough2)">[6, 7, 9, 8]</text>

  <text x="580" y="286" font-size="12" fill="#b85450" filter="url(#rough2)">≠</text>
  <text x="580" y="306" font-size="11" fill="#b85450" filter="url(#rough2)">→ false</text>

  <text x="24" y="342" font-size="11" fill="#666" filter="url(#rough2)">注意：只有「没有左右孩子」的结点才算叶子，单侧孩子不算</text>
</svg>
