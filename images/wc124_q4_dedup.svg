<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">排序后按「值」去重：同一层不重复挑相同的数</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">相同值的两个下标会生成内容一样的排列，必须只保留第一次出现的那一支</text>

  <rect x="60" y="70" width="56" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="88" y="97" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="120" y="70" width="56" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="148" y="97" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="180" y="70" width="56" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="208" y="97" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="240" y="70" width="56" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="268" y="97" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">17</text>
  <text x="88" y="130" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="148" y="130" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="208" y="130" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="268" y="130" font-size="9.5" fill="#888" text-anchor="middle" filter="url(#rough2)">3</text>

  <text x="320" y="86" font-size="10.5" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">下标 1：它的前一个同值下标 0 未使用</text>
  <text x="320" y="103" font-size="10.5" fill="#b85450" text-anchor="start" filter="url(#rough2)">→ 跳过（保留由下标 0 代表的那一支）</text>

  <rect x="50" y="160" width="220" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="62" y="180" font-size="10.5" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">保留的那一支</text>
  <text x="62" y="199" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">用下标 0 的 8 继续递归</text>
  <text x="62" y="214" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">它被标记 used 后，下标 1 才可用</text>
  <path d="M 148 140 L 148 158" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="290" y="160" width="220" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="302" y="180" font-size="10.5" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">剪掉的那一支</text>
  <text x="302" y="199" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">用下标 1 的 8 会得到完全相同</text>
  <text x="302" y="214" font-size="10.5" fill="#333" text-anchor="start" filter="url(#rough2)">的排列集合，纯属重复计数</text>
  <path d="M 208 140 L 208 158 L 340 158" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="50" y="240" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="62" y="260" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">判据：i &gt; 0 且 nums[i] == nums[i−1] 且 used[i−1] == false → 跳过</text>
  <text x="62" y="278" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">含义是「同一层里，若前一个同值元素还没被用掉，说明这一支刚被它走过」，避免同层重复。</text>
  <text x="62" y="292" font-size="11" fill="#666" text-anchor="start" filter="url(#rough2)">若前一个同值元素已被使用（used 为真），说明它在更深层，允许当前位置再取这个值。</text>
</svg>
