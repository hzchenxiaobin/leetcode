<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">样例演算：a = [1, 2, 6, 4, 5]，k = 1 → 答案 5</text>
  <text x="290" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个 i：先在窗口 [i, i+2k+1] 里取公差众数，再贪心向右推、用余额向左扩</text>

  <g filter="url(#rough2)" text-anchor="middle" font-size="10.5">
    <rect x="30" y="66" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="58" y="84" fill="#2f4f6f" font-weight="bold">i</text>
    <text x="136" y="84" fill="#2f4f6f" font-weight="bold">窗口众数 d</text>
    <text x="240" y="84" fill="#2f4f6f" font-weight="bold">贪心右端 cnt</text>
    <text x="330" y="84" fill="#2f4f6f" font-weight="bold">used</text>
    <text x="400" y="84" fill="#2f4f6f" font-weight="bold">左扩</text>
    <text x="486" y="84" fill="#2f4f6f" font-weight="bold">候选长度</text>

    <rect x="30" y="98" width="520" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="58" y="116" fill="#3a5a30" font-weight="bold">1</text>
    <text x="136" y="116" fill="#3a5a30">d = 1</text>
    <text x="240" y="116" fill="#3a5a30">5</text>
    <text x="330" y="116" fill="#3a5a30">1</text>
    <text x="400" y="116" fill="#3a5a30">0</text>
    <text x="486" y="116" fill="#3a5a30" font-weight="bold">5 ★</text>

    <rect x="30" y="130" width="520" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1.2" rx="6"/>
    <text x="58" y="148" fill="#555">2</text>
    <text x="136" y="148" fill="#555">d = 1</text>
    <text x="240" y="148" fill="#555">—</text>
    <text x="330" y="148" fill="#555">—</text>
    <text x="400" y="148" fill="#555">0</text>
    <text x="486" y="148" fill="#555">4</text>

    <rect x="30" y="162" width="520" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1.2" rx="6"/>
    <text x="58" y="180" fill="#555">3</text>
    <text x="136" y="180" fill="#555">d = −2</text>
    <text x="240" y="180" fill="#555">—</text>
    <text x="330" y="180" fill="#555">—</text>
    <text x="400" y="180" fill="#555">1</text>
    <text x="486" y="180" fill="#555">3</text>

    <rect x="30" y="194" width="520" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1.2" rx="6"/>
    <text x="58" y="212" fill="#555">4</text>
    <text x="136" y="212" fill="#555">d = 1</text>
    <text x="240" y="212" fill="#555">—</text>
    <text x="330" y="212" fill="#555">—</text>
    <text x="400" y="212" fill="#555">1</text>
    <text x="486" y="212" fill="#555">3</text>

    <rect x="30" y="226" width="520" height="26" fill="#fafafa" stroke="#ddd" stroke-width="1.2" rx="6"/>
    <text x="58" y="244" fill="#555">5</text>
    <text x="136" y="244" fill="#555">无候选</text>
    <text x="240" y="244" fill="#555">—</text>
    <text x="330" y="244" fill="#555">—</text>
    <text x="400" y="244" fill="#555">0</text>
    <text x="486" y="244" fill="#555">1</text>
  </g>

  <g filter="url(#rough2)">
    <text x="30" y="272" font-size="10.5" fill="#3a5a30">i = 1：窗口 [1,4] 内 j = 2、j = 4 都给出 d = 1（众数 2 个）；</text>
    <text x="30" y="289" font-size="10.5" fill="#3a5a30">贪心从 1 往右：位置 3 的 6 必须改（used = 1），之后 4、5 全匹配 ⇒ cnt = 5，余额 0，长度 5。</text>
    <text x="30" y="309" font-size="10.5" fill="#8a3a36">i = 2：d = 1 时 [2,5] 只需改 a[3] = 6 → 3 一处，长度 4；i = 3：d = −2 时改 a[2] = 2 → 8，长度 3。</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="322" width="520" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="46" y="343" font-size="11" fill="#8a6a20" font-weight="bold">另外三组样例的结论</text>
    <text x="46" y="361" font-size="10.5" fill="#6b5a30">[1,2,3,100,200]、k = 1 ⇒ 4：把 100 改成 4，得到 [1,2,3,4]；</text>
    <text x="46" y="377" font-size="10.5" fill="#6b5a30">[1, 10⁹, 2]、k = 1 ⇒ 3：保留 a[2]、a[3]，d = 2 − 10⁹，反推 a[1] = 2·10⁹ − 2；</text>
    <text x="46" y="393" font-size="10.5" fill="#6b5a30">[1,2,4,8,16,32]、k = 2 ⇒ 4：取 [1,2,4,8] 改成 [1,2,3,4]（d = 1，两处修改）。</text>
  </g>
</svg>
