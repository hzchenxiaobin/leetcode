<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0.5 1 L 9 5 L 0.5 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="640" height="410" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [1, 2, 1]</text>
  <text x="320" y="44" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">每格记「f / g」；橙色 = 本步刚写入的桶</text>

  <!-- nums 条：三种颜色对应三个步骤 -->
  <g filter="url(#rough2)">
    <rect x="236" y="54" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="280" y="54" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <rect x="324" y="54" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="258" y="75">1</text>
    <text x="302" y="75">2</text>
    <text x="346" y="75">1</text>
  </g>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="12" font-weight="bold" fill="#555" text-anchor="middle">
    <text x="155" y="104">值 v = 0</text>
    <text x="241" y="104">值 v = 1</text>
    <text x="327" y="104">值 v = 2</text>
    <text x="413" y="104">值 v = 3</text>
  </g>

  <!-- 步骤 1 -->
  <g filter="url(#rough2)">
    <rect x="116" y="112" width="78" height="62" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="202" y="112" width="78" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="288" y="112" width="78" height="62" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="374" y="112" width="78" height="62" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="155" y="148">0 / 0</text>
    <text x="241" y="148" font-weight="bold">1 / 1</text>
    <text x="327" y="148">0 / 0</text>
    <text x="413" y="148">0 / 0</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="61" y="134" font-size="12.5" font-weight="bold" fill="#446688">步骤 1</text>
    <text x="61" y="154" font-size="11.5" fill="#666">x = 1</text>
    <text x="546" y="136" font-size="10" fill="#777">nf = f[0]+f[2]+1 = 1</text>
    <text x="546" y="156" font-size="10.5" fill="#333">新增 [1]</text>
  </g>

  <!-- 步骤 2 -->
  <g filter="url(#rough2)">
    <rect x="116" y="180" width="78" height="62" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="202" y="180" width="78" height="62" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="288" y="180" width="78" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="374" y="180" width="78" height="62" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="155" y="216">0 / 0</text>
    <text x="241" y="216">1 / 1</text>
    <text x="327" y="216" font-weight="bold">2 / 5</text>
    <text x="413" y="216">0 / 0</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="61" y="202" font-size="12.5" font-weight="bold" fill="#8a6a1a">步骤 2</text>
    <text x="61" y="222" font-size="11.5" fill="#666">x = 2</text>
    <text x="546" y="204" font-size="10" fill="#777">nf = f[1]+f[3]+1 = 2</text>
    <text x="546" y="224" font-size="10.5" fill="#333">新增 [2]、[1,2]</text>
  </g>

  <!-- 步骤 2 的 f[2] 喂给步骤 3 -->
  <path d="M 327 246 C 327 262, 241 262, 241 276" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="288" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">读 f[2] = 2、g[2] = 5</text>

  <!-- 步骤 3 -->
  <g filter="url(#rough2)">
    <rect x="116" y="280" width="78" height="62" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="202" y="280" width="78" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="288" y="280" width="78" height="62" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
    <rect x="374" y="280" width="78" height="62" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="155" y="316">0 / 0</text>
    <text x="241" y="316" font-weight="bold">4 / 9</text>
    <text x="327" y="316">2 / 5</text>
    <text x="413" y="316">0 / 0</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="61" y="302" font-size="12.5" font-weight="bold" fill="#2f5a24">步骤 3</text>
    <text x="61" y="322" font-size="11.5" fill="#666">x = 1</text>
    <text x="546" y="304" font-size="10" fill="#777">nf = f[0]+f[2]+1 = 3</text>
    <text x="546" y="324" font-size="10.5" fill="#333">新增 [1]、[2,1]、[1,2,1]</text>
  </g>

  <!-- 答案 -->
  <rect x="90" y="352" width="460" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="380" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5a24" filter="url(#rough2)">答案 = g[1] + g[2] + g[3] = 9 + 5 + 0 = 14 ✓</text>

  <text x="320" y="398" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">全部好子序列：[1]、[2]、[1]、[1,2]、[2,1]、[1,2,1]，元素和恰为 14</text>
</svg>
