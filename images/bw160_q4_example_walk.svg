<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="330" fill="#fafafa"/>

  <text x="310" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,4,9,6]，maxC = 1</text>
  <text x="310" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">答案 2（二分过程中 k=1 不可行、k=2 可行）</text>
  <rect x="40" y="66" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">k</text>
  <rect x="80" y="66" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="125.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">窗口长度</text>
  <rect x="170" y="66" width="220" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">被打破的窗口</text>
  <rect x="390" y="66" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="435.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">需要次数</text>
  <rect x="480" y="66" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="520.0" y="85.0" font-size="10.5" fill="#d6a040" text-anchor="middle" font-weight="bold" filter="url(#rough2)">可行?</text>
  <rect x="40" y="96" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="80" y="96" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="125.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="170" y="96" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="280.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">所有 &gt; 1 的元素（4 个）</text>
  <rect x="390" y="96" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="435.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="480" y="96" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="520.0" y="115.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">否</text>
  <rect x="40" y="126" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="80" y="126" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="125.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="170" y="126" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="280.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[0,1] 与 [2,3]</text>
  <rect x="390" y="126" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="435.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="480" y="126" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="520.0" y="145.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">否（maxC=1）</text>
  <rect x="40" y="156" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60.0" y="175.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="80" y="156" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="125.0" y="175.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="170" y="156" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="280.0" y="175.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">[0,2] gcd=1，[1,3] gcd=1</text>
  <rect x="390" y="156" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="435.0" y="175.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="480" y="156" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="520.0" y="175.0" font-size="10.5" fill="#333" text-anchor="middle" filter="url(#rough2)">是</text>
  <rect x="40" y="200" width="540" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="310.0" y="222.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">k=2 时所有长度 3 的窗口 GCD 都是 1，无需修改；再小的 k 都需要改 2 处以上</text>
  <text x="310.0" y="242.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">所以最小的可行 k 是 2，与官方输出一致</text>
  <text x="40" y="300" font-size="10.5" fill="#666" text-anchor="start" filter="url(#rough2)">示例 1 [3,5,10] 答案 1：改 5 -&gt; 7 后没有长度 &gt;1 的稳定子数组</text>
</svg>
