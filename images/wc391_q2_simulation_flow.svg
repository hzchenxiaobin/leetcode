<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">贪心模拟流程：喝光 → 能换就换 → 换完就喝</text>
  <path d="M 150 40 Q 330 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="185" y="56" width="190" height="38" rx="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="280" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">开始：n 瓶满水，阈值 x</text>

  <path d="M 280 94 L 280 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="180" y="118" width="200" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="138" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">一口气喝光全部 n 瓶</text>
  <text x="280" y="156" text-anchor="middle" font-size="11.5" fill="#446688">drunk = empty = n</text>

  <path d="M 280 164 L 280 178" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="280,180 410,250 280,320 150,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="280" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">empty ≥ x ?</text>
  <text x="280" y="266" text-anchor="middle" font-size="10.5" fill="#a08040">空瓶够换一瓶吗</text>

  <path d="M 410 250 L 464 250" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="437" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>

  <g filter="url(#sk)">
    <rect x="468" y="222" width="166" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="551" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">换 1 瓶并立刻喝掉</text>
  <text x="551" y="259" text-anchor="middle" font-size="11" fill="#7a5415">empty += 1 − x</text>
  <text x="551" y="275" text-anchor="middle" font-size="11" fill="#7a5415">drunk += 1，x += 1</text>

  <path d="M 551 220 C 551 140 410 150 338 205" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="560" y="120" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">换完立刻喝掉，回到判断</text>

  <path d="M 280 320 L 280 350" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="262" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <rect x="190" y="352" width="180" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="280" y="378" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 drunk</text>

  <g filter="url(#sk)">
    <rect x="462" y="306" width="176" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="550" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">轮数只有 O(√n)</text>
  <text x="550" y="349" text-anchor="middle" font-size="10.5" fill="#446688">第 j 轮净消耗 ≥ j − 1 个空瓶</text>
  <text x="550" y="367" text-anchor="middle" font-size="10.5" fill="#446688">k(k−1)/2 ≤ n ⇒ k = O(√n)</text>
</svg>
