<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">核心观察一：区间化前缀差，f(s) 交给数位 DP</text>

  <!-- ① 数轴：前缀差 -->
  <path d="M 60,84 L 500,84" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 70,84 L 228,84" stroke="#b85450" stroke-width="5" fill="none" filter="url(#rough2)"/>
  <path d="M 232,84 L 464,84" stroke="#4a7a3a" stroke-width="5" fill="none" filter="url(#rough2)"/>
  <line x1="70" y1="77" x2="70" y2="91" stroke="#333" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="230" y1="77" x2="230" y2="91" stroke="#333" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="464" y1="77" x2="464" y2="91" stroke="#333" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="106" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="106" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">num1</text>
  <text x="464" y="106" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">num2</text>
  <text x="150" y="70" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">[1, num1−1]（扣除）</text>
  <text x="348" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[num1, num2]（所求）</text>

  <rect x="70" y="118" width="420" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">ans = f(num2) − f(num1−1)　f(s) = [1, s] 中数位和 ∈ [min_sum, max_sum] 的个数</text>

  <path d="M 280,152 L 280,172" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 三状态 -->
  <text x="280" y="192" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">f(s)：从高到低逐位填数字，边填边累计数位和，只需记住三件事</text>

  <rect x="18" y="204" width="166" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="226" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">pos：填到第几位</text>
  <text x="101" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">num2 ≤ 10^22</text>
  <text x="101" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">最多 23 位</text>

  <rect x="196" y="204" width="168" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">sum：已填数位和</text>
  <text x="280" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">只增不减，超过 max_sum</text>
  <text x="280" y="258" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">整条分支必死 → 剪！</text>

  <rect x="376" y="204" width="166" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="459" y="226" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">tight：是否贴住 s</text>
  <text x="459" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">某位填 d &lt; s[i]</text>
  <text x="459" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">后面就完全自由</text>

  <path d="M 280,270 L 280,290" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 判定时机 -->
  <rect x="60" y="296" width="440" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">min_sum 只在填完全部位后判定 —— 中途 sum 可能还没涨够，不能提前剪</text>

  <rect x="60" y="344" width="440" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">num1 − 1 用字符串借位减法："1000" → "999"，"1" → "0"</text>

  <text x="280" y="404" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">两次调用同一套 DP，只是换上界字符串 —— 状态 23 × 401 × 2 ≈ 1.8 万</text>
  <text x="280" y="426" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每个 ≤ num2 的好整数，凡 ≤ num1−1 者恰好被减一次 —— 不重不漏</text>
</svg>
