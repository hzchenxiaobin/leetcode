<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 338"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="338" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">dp[c] = 以列 c 结尾的最长合法链长度</text>
  <rect x="60" y="76" width="70" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="95" y="104" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">dp=1</text>
  <text x="95" y="138" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">列 0</text>
  <rect x="152" y="76" width="70" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="187" y="104" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">dp=1</text>
  <text x="187" y="138" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">列 1</text>
  <rect x="244" y="76" width="70" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="279" y="104" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">dp=1</text>
  <text x="279" y="138" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">列 2</text>
  <rect x="336" y="76" width="70" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="371" y="104" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">dp=2</text>
  <text x="371" y="138" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">列 3</text>
  <rect x="428" y="76" width="70" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="463" y="104" text-anchor="middle" font-size="12.5" fill="#33475b" font-weight="bold" filter="url(#rough2)">dp=2</text>
  <text x="463" y="138" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">列 4</text>
  <path d="M 120 148 L 260 186" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 212 148 L 300 186" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 304 148 L 340 186" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 396 148 L 380 186" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="190" width="440" height="76" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dp[c] = 1 + max{ dp[u] : u &lt; c 且逐行 strs[r][u] ≤ strs[r][c] }</text>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">没有合法前驱时 dp[c] = 1（只保留自己）</text>
  <text x="280" y="258" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = m − max(dp) = 5 − 2 = 3</text>
  <rect x="60" y="282" width="440" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="307" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">时间 O(n·m²)：m² 个列对 × 每对检查 n 行</text>
</svg>
