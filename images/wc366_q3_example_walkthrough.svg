<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：s₁ = 1100011000，s₂ = 0101001010，x = 2</text>
  <path d="M 150 36 Q 320 46 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- string cells, diff at 0,3,5,8 -->
  <g filter="url(#sk)">
    <rect x="110" y="54" width="36" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="152" y="54" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
    <rect x="194" y="54" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
    <rect x="236" y="54" width="36" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="278" y="54" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
    <rect x="320" y="54" width="36" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="362" y="54" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
    <rect x="404" y="54" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
    <rect x="446" y="54" width="36" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="488" y="54" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.1"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#889" filter="url(#sk)">
    <text x="128" y="74" fill="#a06a1a">0</text>
    <text x="170" y="74">1</text>
    <text x="212" y="74">2</text>
    <text x="254" y="74" fill="#a06a1a">3</text>
    <text x="296" y="74">4</text>
    <text x="338" y="74" fill="#a06a1a">5</text>
    <text x="380" y="74">6</text>
    <text x="422" y="74">7</text>
    <text x="464" y="74" fill="#a06a1a">8</text>
    <text x="506" y="74">9</text>
  </g>
  <text x="320" y="106" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a06a1a" filter="url(#sk)">黄格 = 差异位：p = [0, 3, 5, 8]，m = 4（偶数 → 有解）</text>

  <!-- DP table: header + 5 rows, columns i / p_i / f[i][0] / f[i][1] / 说明 -->
  <g filter="url(#sk)">
    <rect x="100" y="124" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="124" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="210" y="124" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="310" y="124" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="410" y="124" width="210" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33506b" filter="url(#sk)">
    <text x="125" y="142">i</text>
    <text x="180" y="142">p_i</text>
    <text x="260" y="142">f[i][0]</text>
    <text x="360" y="142">f[i][1]</text>
    <text x="515" y="142">说明</text>
  </g>

  <!-- row 0 -->
  <g filter="url(#sk)">
    <rect x="100" y="152" width="50" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="150" y="152" width="60" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="210" y="152" width="100" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="310" y="152" width="100" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="410" y="152" width="210" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">
    <text x="125" y="172">0</text>
    <text x="180" y="172">—</text>
    <text x="260" y="172" font-weight="bold">0</text>
    <text x="360" y="172">∞</text>
  </g>
  <text x="420" y="172" font-size="12" fill="#667" filter="url(#sk)">初始</text>

  <!-- row 1 -->
  <g filter="url(#sk)">
    <rect x="100" y="184" width="50" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="150" y="184" width="60" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="210" y="184" width="100" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="310" y="184" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="410" y="184" width="210" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">
    <text x="125" y="204">1</text>
    <text x="180" y="204">0</text>
    <text x="260" y="204">∞</text>
    <text x="360" y="204" font-weight="bold" fill="#2e5e22">2</text>
  </g>
  <text x="420" y="204" font-size="12" fill="#667" filter="url(#sk)">开启：+x = 2</text>

  <!-- row 2 -->
  <g filter="url(#sk)">
    <rect x="100" y="216" width="50" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="150" y="216" width="60" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="210" y="216" width="100" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="310" y="216" width="100" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="410" y="216" width="210" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">
    <text x="125" y="236">2</text>
    <text x="180" y="236">3</text>
    <text x="260" y="236">2</text>
    <text x="360" y="236">∞</text>
  </g>
  <text x="420" y="236" font-size="12" fill="#667" filter="url(#sk)">相邻配对 (0, 3)：+2</text>

  <!-- row 3 -->
  <g filter="url(#sk)">
    <rect x="100" y="248" width="50" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="150" y="248" width="60" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="210" y="248" width="100" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="310" y="248" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="410" y="248" width="210" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">
    <text x="125" y="268">3</text>
    <text x="180" y="268">5</text>
    <text x="260" y="268">∞</text>
    <text x="360" y="268" font-weight="bold" fill="#2e5e22">4</text>
  </g>
  <text x="420" y="262" font-size="12" fill="#667" filter="url(#sk)">相邻配对 (3, 5)：+2</text>
  <text x="420" y="276" font-size="12" fill="#667" filter="url(#sk)">（悬置保留）</text>

  <!-- row 4 -->
  <g filter="url(#sk)">
    <rect x="100" y="280" width="50" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="150" y="280" width="60" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="210" y="280" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6"/>
    <rect x="310" y="280" width="100" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
    <rect x="410" y="280" width="210" height="32" fill="#ffffff" stroke="#99a" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="12.5" fill="#333" filter="url(#sk)">
    <text x="125" y="300">4</text>
    <text x="180" y="300">8</text>
    <text x="260" y="300" font-weight="bold" fill="#2e5e22">4 ★</text>
    <text x="360" y="300">∞</text>
  </g>
  <text x="420" y="300" font-size="12" fill="#667" filter="url(#sk)">关闭：+0（另一半落在 8）</text>

  <!-- optimal path arrows -->
  <g stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#sk)">
    <path d="M 360 218 L 360 246" marker-end="url(#arG)"/>
    <path d="M 356 282 Q 320 294 268 292" marker-end="url(#arG)"/>
  </g>

  <!-- bottom box -->
  <g filter="url(#sk)">
    <rect x="50" y="330" width="540" height="122" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">最优路径：f[0][0] —开启(+2)→ f[1][1] —配对(3,5)(+2)→ f[3][1] —关闭(+0)→ f[4][0] = 4</text>
  <text x="320" y="382" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">对应真实操作：远程翻转 (0, 8) 代价 x = 2；链式传播 3→5：相邻翻转 (3,4)、(4,5) 代价 1 + 1</text>
  <text x="320" y="408" text-anchor="middle" font-size="12" fill="#7a5415" filter="url(#sk)">（这正是 w(3,5) = min(2, 5−3) = 2 的两种实现里便宜的那种）</text>
  <text x="320" y="434" text-anchor="middle" font-size="11.5" fill="#a08a54" filter="url(#sk)">两组相邻配对 (0,3) + (5,8)：2 + 2 = 4 —— 并列最优，殊途同归</text>
</svg>
