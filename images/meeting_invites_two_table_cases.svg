<svg xmlns="http://www.w3.org/2000/svg" width="940" height="680" viewBox="0 0 940 680" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="940" height="680" fill="#fafafa"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">环长分类：长环双邻位锁死独占一桌，二元环单元自由拼接</text>
  <path d="M 230 42 Q 470 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel A: long cycle ===== -->
  <text x="240" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 环长 ≥ 3：整环独占一桌（贡献 = k）</text>

  <!-- table -->
  <g filter="url(#sk)">
    <ellipse cx="235" cy="255" rx="140" ry="100" fill="#f0ede4" stroke="#a8a094" stroke-width="2"/>
  </g>
  <text x="235" y="260" text-anchor="middle" font-size="12" fill="#999">圆桌</text>

  <!-- favorite arrows along table -->
  <path d="M 253 168 Q 333 190 353 239" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 357 268 Q 333 325 257 339" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 217 342 Q 137 325 117 271" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 113 242 Q 137 185 213 171" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- seats -->
  <g font-size="12" font-weight="bold">
    <g filter="url(#sk)"><circle cx="235" cy="155" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="235" y="160" text-anchor="middle" fill="#8a6a1a">a0</text>
    <g filter="url(#sk)"><circle cx="375" cy="255" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="375" y="260" text-anchor="middle" fill="#8a6a1a">a1</text>
    <g filter="url(#sk)"><circle cx="235" cy="355" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="235" y="360" text-anchor="middle" fill="#8a6a1a">a2</text>
    <g filter="url(#sk)"><circle cx="95" cy="255" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="95" y="260" text-anchor="middle" fill="#8a6a1a">a3</text>
  </g>

  <!-- lock annotation -->
  <path d="M 285 138 Q 265 142 250 150" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <text x="300" y="118" font-size="12.5" font-weight="bold" fill="#b85450">双邻位锁死</text>
  <text x="300" y="134" font-size="10.5" fill="#888">左邻 = 前驱（他喜欢我），右邻 = 后继（我喜欢他）</text>

  <!-- rejected tree node -->
  <g filter="url(#sk)"><circle cx="58" cy="112" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="58" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#33507a">x</text>
  <path d="M 74 124 Q 105 132 142 146" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="138" y="128" font-size="17" font-weight="bold" fill="#b85450">×</text>
  <text x="60" y="152" font-size="10" fill="#888">想插入 a3 与 a0 之间</text>

  <!-- caption A -->
  <text x="240" y="422" text-anchor="middle" font-size="11" fill="#444">座次 = 环序；每个环上节点的两个邻位分别被前驱与后继占满</text>
  <text x="240" y="442" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">→ 挂链插不进、别的环拼不上，独占一桌，贡献 = k</text>

  <!-- ===== Panel B: 2-cycle units ===== -->
  <text x="705" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② 环长 = 2：单元拼接成一大桌（贡献相加）</text>

  <!-- table -->
  <g filter="url(#sk)">
    <ellipse cx="705" cy="265" rx="185" ry="115" fill="#f0ede4" stroke="#a8a094" stroke-width="2"/>
  </g>
  <text x="705" y="270" text-anchor="middle" font-size="12" fill="#999">圆桌</text>

  <!-- junction edges -->
  <path d="M 593 176 L 686 157" stroke="#4a7a3a" stroke-width="3" fill="none" filter="url(#sk)"/>
  <text x="640" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a">拼接处</text>
  <path d="M 686 374 L 593 353" stroke="#4a7a3a" stroke-width="3" fill="none" filter="url(#sk)"/>
  <text x="640" y="394" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a">拼接处</text>

  <!-- chain arrows -->
  <path d="M 724 155 Q 778 158 813 178" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 847 195 Q 878 218 877 245" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 724 375 Q 778 375 813 352" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 563 329 Q 532 310 533 245" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- pair arrows -->
  <path d="M 878 283 Q 882 310 850 324" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 848 328 Q 849 302 876 287" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 532 247 Q 527 220 560 206" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 562 202 Q 561 228 534 287" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- seats: pairs orange -->
  <g font-size="12" font-weight="bold">
    <g filter="url(#sk)"><circle cx="890" cy="265" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="890" y="270" text-anchor="middle" fill="#8a6a1a">a</text>
    <g filter="url(#sk)"><circle cx="836" cy="346" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="836" y="351" text-anchor="middle" fill="#8a6a1a">b</text>
    <g filter="url(#sk)"><circle cx="520" cy="265" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="520" y="270" text-anchor="middle" fill="#8a6a1a">c</text>
    <g filter="url(#sk)"><circle cx="574" cy="184" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
    <text x="574" y="189" text-anchor="middle" fill="#8a6a1a">d</text>
  </g>
  <!-- seats: chain nodes blue -->
  <g font-size="11" font-weight="bold">
    <g filter="url(#sk)"><circle cx="705" cy="150" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="705" y="155" text-anchor="middle" fill="#33507a">x2</text>
    <g filter="url(#sk)"><circle cx="836" cy="184" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="836" y="189" text-anchor="middle" fill="#33507a">x1</text>
    <g filter="url(#sk)"><circle cx="705" cy="380" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="705" y="385" text-anchor="middle" fill="#33507a">y1</text>
    <g filter="url(#sk)"><circle cx="574" cy="346" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
    <text x="574" y="351" text-anchor="middle" fill="#33507a">z1</text>
  </g>
  <text x="818" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040">单元1</text>
  <text x="592" y="270" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040">单元2</text>

  <!-- caption B -->
  <text x="705" y="430" text-anchor="middle" font-size="11" fill="#444">单元 = [链]–a–b–[链]：a、b 各剩 1 个自由邻位挂链</text>
  <text x="705" y="450" text-anchor="middle" font-size="11" fill="#444">拼接处相邻两人 favorite 均在自己单元内 → 拼接合法</text>
  <text x="705" y="470" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">→ 任意多个单元共坐一桌，贡献全部相加</text>

  <!-- ===== formula box ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="492" width="840" height="150" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="80" y="520" font-size="13" font-weight="bold" fill="#2b6e9e">综合答案</text>
  <text x="470" y="552" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">ans = max( 最长长环 k ，Σ 二元环 ( 2 + L(a) + L(b) ) )</text>
  <text x="470" y="580" text-anchor="middle" font-size="11" fill="#444">长环互斥只能取最大的一个；二元环单元可拼桌全部相加；两类不能混坐一桌（引理 2）</text>
  <text x="470" y="604" text-anchor="middle" font-size="11" fill="#888">L(a) = 挂在 a 上、逐级指向 a 的最长链长度（不含 a 自身，也不含 b 侧链）</text>
  <text x="470" y="628" text-anchor="middle" font-size="11" fill="#888">图中桌上的两个单元即贡献 (2+2+1) + (2+1) = 8</text>
</svg>
