<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：arr = [6, 7, 11, 7, 6, 8]，k = 5</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">排序后 a = [6, 6, 7, 7, 8, 11]，m = a[(6−1)//2] = a[2] = 7，每轮比较两端距离</text>

  <rect x="40" y="62" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#3a4a66" font-weight="bold" text-anchor="middle">
    <text x="65" y="81">步骤</text>
    <text x="107" y="81">l</text>
    <text x="142" y="81">r</text>
    <text x="187" y="81">a[l]</text>
    <text x="242" y="81">a[r]</text>
    <text x="290" y="81">d_l</text>
    <text x="330" y="81">d_r</text>
    <text x="390" y="81">本轮选择</text>
    <text x="475" y="81">指针变化</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="90" width="480" height="34" fill="#f7faff" stroke="#b9c8de" stroke-width="1" rx="4"/>
    <rect x="40" y="124" width="480" height="34" fill="#ffffff" stroke="#b9c8de" stroke-width="1" rx="4"/>
    <rect x="40" y="158" width="480" height="34" fill="#f7faff" stroke="#b9c8de" stroke-width="1" rx="4"/>
    <rect x="40" y="192" width="480" height="34" fill="#ffffff" stroke="#b9c8de" stroke-width="1" rx="4"/>
    <rect x="40" y="226" width="480" height="34" fill="#f7faff" stroke="#b9c8de" stroke-width="1" rx="4"/>
    <rect x="350" y="90" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="350" y="124" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <rect x="350" y="158" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="350" y="192" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="350" y="226" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#444">
    <text x="65" y="112">1</text><text x="107" y="112">0</text><text x="142" y="112">5</text>
    <text x="187" y="112">6</text><text x="242" y="112">11</text>
    <text x="290" y="112">1</text><text x="330" y="112">4</text>
    <text x="65" y="146">2</text><text x="107" y="146">0</text><text x="142" y="146">4</text>
    <text x="187" y="146">6</text><text x="242" y="146">8</text>
    <text x="290" y="146">1</text><text x="330" y="146">1</text>
    <text x="65" y="180">3</text><text x="107" y="180">0</text><text x="142" y="180">3</text>
    <text x="187" y="180">6</text><text x="242" y="180">7</text>
    <text x="290" y="180">1</text><text x="330" y="180">0</text>
    <text x="65" y="214">4</text><text x="107" y="214">1</text><text x="142" y="214">3</text>
    <text x="187" y="214">6</text><text x="242" y="214">7</text>
    <text x="290" y="214">1</text><text x="330" y="214">0</text>
    <text x="65" y="248">5</text><text x="107" y="248">2</text><text x="142" y="248">3</text>
    <text x="187" y="248">7</text><text x="242" y="248">7</text>
    <text x="290" y="248">0</text><text x="330" y="248">0</text>
  </g>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle">
    <text x="390" y="112" fill="#3a5a30">取 11（4 &gt; 1）</text>
    <text x="390" y="146" fill="#3a5a30">取 8（等距取大）</text>
    <text x="390" y="180" fill="#8a6a20">取 6（1 &gt; 0）</text>
    <text x="390" y="214" fill="#8a6a20">取 6（1 &gt; 0）</text>
    <text x="390" y="248" fill="#3a5a30">取 7（等距取大）</text>
  </g>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle" fill="#b85450">
    <text x="475" y="112">r → 4</text>
    <text x="475" y="146">r → 3</text>
    <text x="475" y="180">l → 1</text>
    <text x="475" y="214">l → 2</text>
    <text x="475" y="248">r → 2</text>
  </g>

  <rect x="110" y="272" width="340" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="293" text-anchor="middle" font-size="12" fill="#8a4a48" filter="url(#rough2)">res = [11, 8, 6, 6, 7]（任意顺序均正确）</text>

  <text x="280" y="324" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">第 2 轮 d_l = d_r = 1，按「等距取较大值」应选 8；第 5 轮两端都是 7，取哪个都一样</text>
  <text x="280" y="342" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">若改成分拣式自定义排序，等价于按 (−|x−m|, −x) 字典序升序取前 k 个</text>
</svg>
