<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="430" fill="#fafafa"/>
  <text x="340" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 演算：words = [bad, bag, fig, fed]，target = [3,1,0,2]</text>

  <!-- pos 映射条 -->
  <text x="46" y="62" font-size="10.5" fill="#666" filter="url(#rough2)">pos 映射：</text>
  <rect x="110" y="44" width="126" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="64" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">bad(idx0) → pos 2</text>
  <rect x="244" y="44" width="126" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="307" y="64" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">bag(idx1) → pos 1</text>
  <rect x="378" y="44" width="126" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="441" y="64" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">fig(idx2) → pos 3</text>
  <rect x="512" y="44" width="126" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="575" y="64" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">fed(idx3) → pos 0</text>

  <!-- 分叉点 ①：根 -->
  <rect x="30" y="108" width="304" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="182" y="130" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">分叉点 ① 根 ε：S(b) = {1, 2}，S(f) = {0, 3}</text>
  <text x="182" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b 在前：#{x&gt;y} = 1&gt;0, 2&gt;0 → 2</text>
  <text x="182" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">f 在前：3&gt;1, 3&gt;2 → 2</text>
  <text x="182" y="188" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">min = 2（谁先都得付 2）</text>

  <!-- 分叉点 ②：ba -->
  <rect x="30" y="208" width="304" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="182" y="230" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">分叉点 ② ba：S(d) = {2}，S(g) = {1}</text>
  <text x="182" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d 在前（bad 先）：[2 &gt; 1] → 1</text>
  <text x="182" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">g 在前（bag 先）：[1 &gt; 2] → 0</text>
  <text x="182" y="288" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">min = 0</text>

  <!-- 分叉点 ③：f -->
  <rect x="352" y="108" width="304" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="504" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">分叉点 ③ f：S(e) = {0}，S(i) = {3}</text>
  <text x="504" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e 在前（fed 先）：[0 &gt; 3] → 0</text>
  <text x="504" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i 在前（fig 先）：[3 &gt; 0] → 1</text>
  <text x="504" y="188" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">min = 0</text>

  <!-- 固定部分 -->
  <rect x="352" y="208" width="304" height="86" rx="8" fill="#f0f0ee" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="504" y="230" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">祖先对（固定部分）</text>
  <text x="504" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">四个单词两两互不为前缀</text>
  <text x="504" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">不存在祖先—后代标记对</text>
  <text x="504" y="288" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">固定贡献 = 0</text>

  <!-- 答案横幅 -->
  <path d="M182,294 L280,322" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90" y="330" width="500" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="340" y="356" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 0 + 2 + 0 + 0 = 2 ✓</text>
  <text x="340" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">官方解 traversal = [3, 2, 1, 0] 的 pos 序列为 [0, 3, 1, 2]</text>
  <text x="340" y="396" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">恰有逆序对 (3,1) 与 (3,2)，与逐分叉点结算结果一致</text>
</svg>
