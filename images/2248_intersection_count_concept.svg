<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="410" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：数组互异 ⇒ cnt[x] = 含 x 的数组个数</text>
  <path d="M 120 40 Q 320 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row 0 -->
  <text x="46" y="74" text-anchor="start" font-size="12" font-weight="bold" fill="#2b6e9e">nums[0]</text>
  <g filter="url(#sk)">
    <rect x="112" y="56" width="32" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="148" y="56" width="32" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="184" y="56" width="32" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="220" y="56" width="32" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="256" y="56" width="32" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="128" y="75" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">3</text>
  <text x="164" y="75" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">1</text>
  <text x="200" y="75" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">2</text>
  <text x="236" y="75" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">4</text>
  <text x="272" y="75" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">5</text>

  <!-- Row 1 -->
  <text x="46" y="118" text-anchor="start" font-size="12" font-weight="bold" fill="#2e6e2e">nums[1]</text>
  <g filter="url(#sk)">
    <rect x="112" y="100" width="32" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="148" y="100" width="32" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="184" y="100" width="32" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="220" y="100" width="32" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="128" y="119" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">1</text>
  <text x="164" y="119" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">2</text>
  <text x="200" y="119" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">3</text>
  <text x="236" y="119" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">4</text>

  <!-- Row 2 -->
  <text x="46" y="162" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6415">nums[2]</text>
  <g filter="url(#sk)">
    <rect x="112" y="144" width="32" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="148" y="144" width="32" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="184" y="144" width="32" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="220" y="144" width="32" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="128" y="163" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">3</text>
  <text x="164" y="163" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">4</text>
  <text x="200" y="163" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">5</text>
  <text x="236" y="163" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">6</text>

  <!-- red circles around 3 and 4 in every row -->
  <g filter="url(#sk)">
    <ellipse cx="128" cy="70" rx="19" ry="16" fill="none" stroke="#b85450" stroke-width="2"/>
    <ellipse cx="236" cy="70" rx="19" ry="16" fill="none" stroke="#b85450" stroke-width="2"/>
    <ellipse cx="200" cy="114" rx="19" ry="16" fill="none" stroke="#b85450" stroke-width="2"/>
    <ellipse cx="236" cy="114" rx="19" ry="16" fill="none" stroke="#b85450" stroke-width="2"/>
    <ellipse cx="128" cy="158" rx="19" ry="16" fill="none" stroke="#b85450" stroke-width="2"/>
    <ellipse cx="164" cy="158" rx="19" ry="16" fill="none" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="330" y="118" text-anchor="start" font-size="12" fill="#b85450" font-weight="bold">3 和 4 每行都出现</text>

  <!-- arrows down to count table -->
  <path d="M 150 176 Q 150 196 150 206" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- count table -->
  <text x="46" y="226" text-anchor="start" font-size="13" font-weight="bold" fill="#2b2b2b">计数表 cnt（n = 3）</text>
  <g filter="url(#sk)">
    <rect x="60" y="236" width="34" height="24" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/>
    <rect x="106" y="236" width="34" height="24" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/>
    <rect x="152" y="236" width="34" height="24" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/>
    <rect x="198" y="236" width="34" height="24" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/>
    <rect x="244" y="236" width="34" height="24" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/>
    <rect x="290" y="236" width="34" height="24" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.1"/>
  </g>
  <text x="77" y="252" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">x=1</text>
  <text x="123" y="252" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">x=2</text>
  <text x="169" y="252" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">x=3</text>
  <text x="215" y="252" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">x=4</text>
  <text x="261" y="252" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">x=5</text>
  <text x="307" y="252" text-anchor="middle" font-size="12" fill="#555555" font-weight="bold">x=6</text>
  <g filter="url(#sk)">
    <rect x="60" y="266" width="34" height="28" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="106" y="266" width="34" height="28" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="152" y="266" width="34" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="198" y="266" width="34" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="244" y="266" width="34" height="28" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
    <rect x="290" y="266" width="34" height="28" rx="4" fill="#f2f2f0" stroke="#9a9a9a" stroke-width="1.1"/>
  </g>
  <text x="77" y="285" text-anchor="middle" font-size="13" fill="#888888" font-weight="bold">1</text>
  <text x="123" y="285" text-anchor="middle" font-size="13" fill="#888888" font-weight="bold">1</text>
  <text x="169" y="285" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <text x="215" y="285" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <text x="261" y="285" text-anchor="middle" font-size="13" fill="#888888" font-weight="bold">2</text>
  <text x="307" y="285" text-anchor="middle" font-size="13" fill="#888888" font-weight="bold">1</text>

  <!-- arrows to answer box -->
  <path d="M 169 298 Q 330 320 428 300" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 215 298 Q 330 326 428 306" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- answer box -->
  <g filter="url(#sk)">
    <rect x="434" y="234" width="172" height="88" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="520" y="258" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">过滤 cnt[x] == n = 3</text>
  <text x="520" y="286" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">命中：x = 3, 4</text>
  <text x="520" y="310" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">输出 [3, 4] ✓</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="40" y="336" width="560" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="352" text-anchor="middle" font-size="12" fill="#8a6415" font-weight="bold">交集 = { x ∈ [1,1000] : cnt[x] = n }；按 x = 1→1000 扫桶，输出天然升序，免 sort</text>
  <text x="320" y="366" text-anchor="middle" font-size="11" fill="#8a6415">值域只有 1000 ⇒ 1001 大小的桶就够</text>

  <!-- warning -->
  <g filter="url(#sk)">
    <rect x="40" y="376" width="560" height="28" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="320" y="394" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">互异性 ⇒ 每个数组至多给 cnt[x] 贡献 1 次，故 cnt[x] ≤ n，判 == n 即「出现在每个数组」</text>
</svg>
