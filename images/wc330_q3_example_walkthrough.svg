<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：weights = [1, 3, 5, 1]，k = 2（选 1 个切点）</text>

  <!-- ====== marble row ====== -->
  <circle cx="120" cy="88" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="120" y="93" text-anchor="middle" font-size="13" fill="#333">1</text>
  <circle cx="240" cy="88" r="24" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="93" text-anchor="middle" font-size="13" fill="#333">3</text>
  <circle cx="360" cy="88" r="24" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="93" text-anchor="middle" font-size="13" fill="#333">5</text>
  <circle cx="480" cy="88" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="480" y="93" text-anchor="middle" font-size="13" fill="#333">1</text>

  <text x="120" y="44" text-anchor="middle" font-size="9" fill="#446688">固定左端 w₀=1</text>
  <text x="480" y="44" text-anchor="middle" font-size="9" fill="#446688">固定右端 w₃=1</text>

  <!-- ====== pair boxes under gaps ====== -->
  <rect x="142" y="134" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="180" y="151" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1+3 = 4</text>
  <rect x="262" y="134" width="76" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="300" y="151" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">3+5 = 8</text>
  <rect x="382" y="134" width="76" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.3" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="151" text-anchor="middle" font-size="9.5" fill="#888">5+1 = 6</text>

  <text x="280" y="176" text-anchor="middle" font-size="9" fill="#888">缝隙0 · 绿=最小方案选中　　　缝隙1 · 红=最大方案选中　　　缝隙2 · 未用</text>

  <!-- ====== min panel ====== -->
  <rect x="30" y="190" width="245" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="152" y="208" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">最小分数：切缝隙 0 → [1]｜[3, 5, 1]</text>
  <text x="152" y="226" text-anchor="middle" font-size="10" fill="#333">= 底座 (1+1) + 最小相邻和 4 = 6</text>
  <text x="152" y="244" text-anchor="middle" font-size="9.5" fill="#4a7a3a">袋价验证：(1+1) + (3+1) = 6 ✓</text>

  <!-- ====== max panel ====== -->
  <rect x="285" y="190" width="245" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="407" y="208" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">最大分数：切缝隙 1 → [1, 3]｜[5, 1]</text>
  <text x="407" y="226" text-anchor="middle" font-size="10" fill="#333">= 底座 (1+1) + 最大相邻和 8 = 10</text>
  <text x="407" y="244" text-anchor="middle" font-size="9.5" fill="#b85450">袋价验证：(1+3) + (5+1) = 10 ✓</text>

  <!-- arrows from pair boxes to panels -->
  <path d="M 180 160 L 152 188" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 300 160 L 380 188" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- ====== answer box ====== -->
  <rect x="90" y="274" width="380" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#8a6510" font-weight="bold">答案 = 10 − 6 = 4</text>
  <text x="280" y="309" text-anchor="middle" font-size="9.5" fill="#555">底座 (1+1) 两边都出现，做差时抵消 = 8 − 4</text>

  <!-- ====== k extremes note ====== -->
  <rect x="60" y="330" width="440" height="32" fill="none" stroke="#aaa" stroke-width="1.3" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="9.5" fill="#888">同组数据：k=3 时前 2 小 = 4+6，前 2 大 = 8+6，差仍为 4；k=4=n 全切唯一方案，差 = 0</text>
</svg>
