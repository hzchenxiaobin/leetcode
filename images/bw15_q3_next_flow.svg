<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>
  <text x="310" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">next() 的推进流程：先输出当前，再向后推进</text>

  <!-- 保存当前 -->
  <rect x="170" y="56" width="280" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">① 把当前 idx 翻译成字符串保存</text>
  <text x="310" y="97" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">res = chars[idx[0..k-1]]（先输出，后推进！）</text>

  <line x1="310" y1="106" x2="310" y2="134" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 找 p -->
  <rect x="170" y="136" width="280" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">② p 从 k−1 向左找</text>
  <text x="310" y="180" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">第一个 idx[p] &lt; n−k+p 的位置</text>

  <line x1="310" y1="192" x2="310" y2="222" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 -->
  <polygon points="310,224 400,262 310,300 220,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="258" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">找到 p 了吗？</text>
  <text x="310" y="278" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">找不到 ⇒ 所有位置都顶满</text>

  <!-- 找到分支 -->
  <line x1="400" y1="262" x2="438" y2="262" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="252" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="440" y="232" width="160" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ idx[p] += 1</text>
  <text x="520" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">其后每格 = 前一格 + 1</text>

  <!-- 没找到分支 -->
  <line x1="220" y1="262" x2="182" y2="262" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="202" y="252" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="20" y="232" width="160" height="60" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="256" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">当前已是最后一个组合</text>
  <text x="100" y="278" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">has_next = false</text>

  <!-- 汇合返回 -->
  <line x1="520" y1="292" x2="520" y2="330" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="520" y1="330" x2="310" y2="330" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="100" y1="292" x2="100" y2="330" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="100" y1="330" x2="300" y2="330" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="310" y1="330" x2="310" y2="352" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="354" width="280" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="380" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">④ 返回保存的字符串 res</text>

  <text x="30" y="60" font-size="12" fill="#666" filter="url(#rough2)">hasNext() 直接读 has_next，O(1)，不推进状态</text>
</svg>
