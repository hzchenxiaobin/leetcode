<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">质因数独立分配：k = 660 = 2²·3·5·11（以查询 [73, 660] 为例）</text>

  <rect x="150" y="46" width="220" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">k = 660 = 2² × 3 × 5 × 11</text>

  <path d="M200,92 L120,122" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M240,92 L240,122" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M280,92 L330,122" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M320,92 L420,122" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="30" y="124" width="130" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="95" y="148" fill="#8a6d3b" font-size="13">p = 2，e = 2</text>
    <text x="95" y="168" fill="#8a6d3b">2 个 2 分进 73 格</text>
    <text x="95" y="184" fill="#777" font-size="11">C(74, 72) = 2701</text>

    <rect x="175" y="124" width="130" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="240" y="148" fill="#4a7a3a" font-size="13">p = 3，e = 1</text>
    <text x="240" y="168" fill="#4a7a3a">1 个 3 分进 73 格</text>
    <text x="240" y="184" fill="#777" font-size="11">C(73, 72) = 73</text>

    <rect x="320" y="124" width="130" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="385" y="148" fill="#4a7a3a" font-size="13">p = 5，e = 1</text>
    <text x="385" y="168" fill="#4a7a3a">1 个 5 分进 73 格</text>
    <text x="385" y="184" fill="#777" font-size="11">C(73, 72) = 73</text>

    <rect x="465" y="124" width="42" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="486" y="150" fill="#4a7a3a" font-size="13">p=11</text>
    <text x="486" y="168" fill="#4a7a3a" font-size="12">e=1</text>
    <text x="486" y="184" fill="#777" font-size="11">73</text>
  </g>

  <path d="M95,192 L95,222 M240,192 L240,222 M385,192 L385,222 M486,192 L486,222" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M95,218 Q260,236 445,218" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M260,230 L260,250" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="252" width="340" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="279" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">方案数 = 2701 × 73 × 73 × 73 (mod 1e9+7) = 50734910</text>

  <text x="260" y="330" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">为什么可乘？每个数组 ↔ 每个「质数 → 位置分配」的组合，</text>
  <text x="260" y="354" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">由唯一分解定理，不同分配组合给出的数组互不相同</text>
  <text x="260" y="380" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">（某格分到 0 个 2、0 个 3 …… 即该格为 1）</text>
</svg>
