<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">贪心流程：一次交换只修好一个沙发</text>
  <text x="290" y="46" text-anchor="middle" font-size="10.5" fill="#888">从左到右扫一遍，沙发 i 修好后再也不动它，四步循环执行 n 次</text>

  <g filter="url(#rough2)" font-size="10">
    <rect x="48" y="78" width="214" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="60" y="101" font-size="10" font-weight="bold" fill="#3a4a66">① 取沙发 i 上的两人</text>
    <text x="60" y="122" fill="#555">a = row[2i]，b = row[2i+1]</text>

    <rect x="318" y="78" width="214" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="330" y="101" font-size="10" font-weight="bold" fill="#8a6a20">② b 已经等于 a ^ 1 ？</text>
    <text x="330" y="122" fill="#555">是 → 跳过；否 → j = pos[a ^ 1]</text>

    <rect x="318" y="196" width="214" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="330" y="219" font-size="10" font-weight="bold" fill="#8a3b38">③ 交换 row[2i+1] 与 row[j]</text>
    <text x="330" y="240" fill="#555">ans++，并同步更新 pos 两格</text>

    <rect x="48" y="196" width="214" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="60" y="219" font-size="10" font-weight="bold" fill="#3a5a30">④ i ← i + 1</text>
    <text x="60" y="240" fill="#555">i == n 时返回 ans</text>

    <path d="M 262 107 L 312 107" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)"/>
    <path d="M 425 136 L 425 190" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)"/>
    <path d="M 318 225 L 268 225" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)"/>
    <path d="M 155 196 L 155 142" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)"/>

    <text x="290" y="292" text-anchor="middle" font-size="10.5" fill="#444">为什么最优：交换后沙发 i 变成自环，其余沙发仍首尾相接成环 —— 每步恰好剪掉环上一个点</text>
    <text x="290" y="314" text-anchor="middle" font-size="10.5" fill="#444">于是一个长度 k 的环花 k − 1 次，总代价 = n − c（c 为初始环数，并查集数连通分量即可）</text>
    <text x="290" y="340" text-anchor="middle" font-size="9.5" fill="#999">位置表 pos[人] = 座位 让「伴侣在哪」O(1) 可查，整体复杂度 O(n)</text>
  </g>
</svg>
