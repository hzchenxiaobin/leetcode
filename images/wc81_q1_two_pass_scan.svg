<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="360" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：答案 = min（左侧最近 c 的距离，右侧最近 c 的距离）</text>

  <!-- 字符串格子 -->
  <rect x="48" y="58" width="52" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="74" y="89" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">l</text>
  <rect x="100" y="58" width="52" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="126" y="89" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">o</text>
  <rect x="152" y="58" width="52" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="178" y="89" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">v</text>
  <rect x="204" y="58" width="52" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="89" text-anchor="middle" font-size="20" fill="#3a5a30" filter="url(#rough2)">e</text>
  <rect x="256" y="58" width="52" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="282" y="89" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">l</text>
  <rect x="308" y="58" width="52" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="89" text-anchor="middle" font-size="20" fill="#3a5a30" filter="url(#rough2)">e</text>
  <rect x="360" y="58" width="52" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="386" y="89" text-anchor="middle" font-size="20" fill="#3a5a30" filter="url(#rough2)">e</text>
  <rect x="412" y="58" width="52" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="438" y="89" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">t</text>
  <rect x="464" y="58" width="52" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="490" y="89" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">c</text>
  <rect x="516" y="58" width="52" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="542" y="89" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">o</text>
  <rect x="568" y="58" width="52" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="594" y="89" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">d</text>
  <rect x="620" y="58" width="52" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="646" y="89" text-anchor="middle" font-size="20" fill="#3a5a30" filter="url(#rough2)">e</text>

  <text x="74" y="120" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="126" y="120" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="178" y="120" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="230" y="120" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="282" y="120" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="334" y="120" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="386" y="120" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="438" y="120" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">7</text>
  <text x="490" y="120" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">8</text>
  <text x="542" y="120" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">9</text>
  <text x="594" y="120" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">10</text>
  <text x="646" y="120" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">11</text>

  <!-- 左扫 -->
  <path d="M 44 152 L 690 152" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="144" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">左 → 右扫描：last ← 最近 c 的下标，L[i] = i − last</text>

  <!-- 右扫 -->
  <path d="M 690 200 L 44 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="360" y="220" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">右 ← 左扫描：next ← 最近 c 的下标，R[i] = next − i</text>

  <rect x="110" y="238" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="360" y="263" text-anchor="middle" font-size="15" fill="#8a6a20" filter="url(#rough2)">answer[i] = min( L[i], R[i] )</text>
  <text x="360" y="283" text-anchor="middle" font-size="10.5" fill="#a08040" filter="url(#rough2)">最近的 c 只可能在 i 的左边或右边，两侧各取最近，再取较小者</text>

  <rect x="110" y="306" width="500" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="360" y="326" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">i = 8（s[8] = c）：L = 8 − 6 = 2，R = 11 − 8 = 3</text>
  <text x="360" y="344" text-anchor="middle" font-size="10.5" fill="#5a7a4a" filter="url(#rough2)">下标 6 与下标 11 各给出一侧的距离，取小者得 answer[8] = 2</text>

  <text x="360" y="378" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">于是 O(n) 的暴力「向左右逐格找」被压缩成两遍线性扫描</text>
</svg>
