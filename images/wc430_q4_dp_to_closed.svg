<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">殊途同归：从 DP 转移迭代出闭式</text>
  <path d="M 170 40 Q 320 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左：DP 转移 -->
  <g filter="url(#sk)">
    <rect x="30" y="62" width="290" height="72" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="175" y="86" text-anchor="middle" font-size="14" font-family="monospace" fill="#2b2b2b">f[1][0] = m</text>
  <text x="175" y="112" text-anchor="middle" font-size="14" font-family="monospace" fill="#2b2b2b">f[i][j] = f[i−1][j−1] + (m−1)·f[i−1][j]</text>
  <text x="175" y="128" text-anchor="middle" font-size="10" fill="#888">f[i][j]：长度 i、恰好 j 个「=」间隔的数组数</text>

  <path d="M 90 142 Q 70 158 66 172" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 260 142 Q 282 158 287 172" stroke="#c98a2b" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="48" y="192" text-anchor="start" font-size="11" fill="#2e6e2e">沿袭前值：+1 个「=」间隔（1 种）</text>
  <text x="52" y="208" text-anchor="start" font-size="11" fill="#7a5415">换新值：避开前值（m−1 种）</text>

  <g filter="url(#sk)">
    <rect x="30" y="222" width="290" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="175" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#9c3a34">DP 表 O(nk) ≤ 10¹⁰ —— 超时！</text>
  <text x="175" y="268" text-anchor="middle" font-size="11" fill="#9c3a34">但转移系数恒定 → 可归纳出闭式直接计算</text>

  <!-- 右：m=2 的 DP 表 -->
  <text x="470" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">m = 2 时的 DP 表 = 2 × 杨辉三角</text>
  <g font-size="10" text-anchor="middle" fill="#999" font-family="monospace">
    <text x="421" y="84">j=0</text>
    <text x="476" y="84">j=1</text>
    <text x="531" y="84">j=2</text>
    <text x="586" y="84">j=3</text>
  </g>
  <g filter="url(#sk)">
    <rect x="396" y="212" width="50" height="30" rx="4" fill="#fff" stroke="#b85450" stroke-width="2.2"/>
    <rect x="451" y="178" width="50" height="30" rx="4" fill="#fff" stroke="#b85450" stroke-width="2.2"/>
    <rect x="506" y="212" width="50" height="30" rx="4" fill="#fff" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g filter="url(#sk)">
    <rect x="396" y="110" width="50" height="30" rx="4" fill="#f2f2ee" stroke="#999" stroke-width="1.2"/>
    <rect x="396" y="144" width="50" height="30" rx="4" fill="#f2f2ee" stroke="#999" stroke-width="1.2"/>
    <rect x="451" y="144" width="50" height="30" rx="4" fill="#f2f2ee" stroke="#999" stroke-width="1.2"/>
    <rect x="396" y="178" width="50" height="30" rx="4" fill="#f2f2ee" stroke="#999" stroke-width="1.2"/>
    <rect x="451" y="178" width="50" height="30" rx="4" fill="#f2f2ee" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="13" text-anchor="middle" font-family="monospace" fill="#333">
    <text x="421" y="130">2</text>
    <text x="421" y="164">2</text>
    <text x="476" y="164">2</text>
    <text x="421" y="198">2</text>
    <text x="476" y="198">4</text>
    <text x="421" y="232">2</text>
    <text x="476" y="232">6</text>
    <text x="531" y="232" font-weight="bold" fill="#b85450">6</text>
  </g>
  <g font-size="10" text-anchor="end" fill="#999" font-family="monospace">
    <text x="390" y="130">i=1</text>
    <text x="390" y="164">i=2</text>
    <text x="390" y="198">i=3</text>
    <text x="390" y="232">i=4</text>
  </g>
  <text x="470" y="262" text-anchor="middle" font-size="11" fill="#555">f[i][j] = 2·C(i−1, j) → f[4][2] = 2·C(3,2) = 6 ✓（示例 2）</text>
  <text x="470" y="280" text-anchor="middle" font-size="11" fill="#555">一般 m：f[i][j] = m·C(i−1,j)·(m−1)<tspan dy="-4" font-size="8">i−1−j</tspan></text>

  <!-- 底部结论 -->
  <g filter="url(#sk)">
    <rect x="60" y="300" width="520" height="56" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="324" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace" fill="#2e6e2e">f[n][k] = m·C(n−1, k)·(m−1)<tspan dy="-5" font-size="10">n−1−k</tspan></text>
  <text x="320" y="346" text-anchor="middle" font-size="11" fill="#2e6e2e">闭式 + 费马小定理：O(n + log p)，一次算完</text>
</svg>
