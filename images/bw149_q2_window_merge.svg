<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">合并窗口：把窗口内 k 个会议“挤”到一端，空出连续的一段</text>
  <text x="310" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">窗口跨度 = 窗口内 gap 之和 + 窗口内会议长度之和；把会议贴边排好，空余正好是 gap 之和</text>

  <text x="50" y="80" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 原布局（窗口 = g₁..g₂，内含 1 个会议）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="90" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <rect x="130" y="90" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <rect x="420" y="90" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <rect x="130" y="126" width="330" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="80" y="108" fill="#3a4a66" filter="url(#rough2)">A</text>
    <text x="160" y="108" fill="#3a4a66" filter="url(#rough2)">M</text>
    <text x="440" y="108" fill="#3a4a66" filter="url(#rough2)">B</text>
    <text x="295" y="139" fill="#8a6a20" filter="url(#rough2)">窗口跨度 = g₁ + |M| + g₂（被 A、B 卡死）</text>
  </g>

  <path d="M 310 150 L 310 172" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="50" y="196" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">② 把 M 贴到窗口左端（会议顺序不变、互不重叠）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="206" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <rect x="100" y="206" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <rect x="420" y="206" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <rect x="160" y="206" width="260" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="80" y="224" fill="#3a4a66" filter="url(#rough2)">A</text>
    <text x="130" y="224" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">M</text>
    <text x="440" y="224" fill="#3a4a66" filter="url(#rough2)">B</text>
    <text x="290" y="224" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">连续空余 = g₁ + g₂</text>
  </g>
  <path d="M 160 250 L 420 250" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="290" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">窗口左端从 A 的右边界算起，右端止于 B 的左边界 —— 边界会议不动，所以一定能这样做</text>

  <text x="50" y="300" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">为什么不用把 M 挪到窗口外？</text>
  <rect x="50" y="310" width="540" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="64" y="330" font-size="10.5" fill="#555" filter="url(#rough2)">窗口内那 k 个会议的总长度 S 是固定的；把它们贴紧成一块，窗口跨度减去 S 后剩下的连续空余</text>
  <text x="64" y="348" font-size="10.5" fill="#555" filter="url(#rough2)">恰好等于窗口内 gap 之和。挪到窗口外既不会让空余变大，还可能压掉别处的空档。</text>

  <text x="310" y="374" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">于是问题变成：在 gap[0..n] 上找长度为 k+1 的连续窗口，使和最大（滑动窗口 O(n)）</text>
</svg>
