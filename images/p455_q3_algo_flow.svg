<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 515"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="515" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：倒序 BFS 序自底向上，每个节点「取最大 + 数缺口」</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">递推：mx(u) = cost(u) + max mx(c)，叶子 mx = cost；答案 = Σ 各节点的缺口孩子数</text>

  <!-- N1 -->
  <g filter="url(#rough2)">
    <rect x="155" y="54" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="250" y="75" text-anchor="middle" font-size="11" fill="#2a4666" font-weight="bold">① 建邻接表，以 0 为根定向</text>
  </g>

  <path d="M 250 86 L 250 103" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N2 -->
  <g filter="url(#rough2)">
    <rect x="155" y="106" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="250" y="127" text-anchor="middle" font-size="11" fill="#2a4666" font-weight="bold">② 倒序遍历 order（叶先处理）</text>
  </g>

  <path d="M 250 138 L 250 155" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: 叶子？ -->
  <g filter="url(#rough2)">
    <polygon points="250,158 335,187 250,216 165,187" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="192" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">u 是叶子？</text>
  </g>

  <!-- 叶子跳过回边 -->
  <path d="M 163 187 L 112 187 L 112 116 L 152 116" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="68" y="178" text-anchor="start" font-size="9.5" fill="#777" filter="url(#rough2)">是：mx 已 = cost</text>
  <text x="68" y="191" text-anchor="start" font-size="9" fill="#999" filter="url(#rough2)">直接跳过</text>

  <path d="M 250 216 L 250 235" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="229" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- N3 -->
  <g filter="url(#rough2)">
    <rect x="155" y="238" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="250" y="259" text-anchor="middle" font-size="10.5" fill="#2a4666" font-weight="bold">③ M = max{ mx[c] : c 是 u 的孩子 }</text>
  </g>

  <path d="M 250 270 L 250 287" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N4 -->
  <g filter="url(#rough2)">
    <rect x="140" y="290" width="220" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8"/>
    <text x="250" y="306" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">④ 每个缺口孩子（mx[c] &lt; M）：</text>
    <text x="250" y="322" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">ans += 1，在 c 处加价 M − mx[c]</text>
  </g>

  <path d="M 250 332 L 250 349" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N5 -->
  <g filter="url(#rough2)">
    <rect x="155" y="352" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="250" y="373" text-anchor="middle" font-size="11" fill="#2a4666" font-weight="bold">⑤ mx[u] = cost[u] + M</text>
  </g>

  <path d="M 250 384 L 250 401" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2: 用尽？ -->
  <g filter="url(#rough2)">
    <polygon points="250,404 322,431 250,458 178,431" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="436" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">order 用尽？</text>
  </g>

  <!-- 是 → return ans -->
  <path d="M 324 431 L 387 431" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="348" y="423" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="390" y="415" width="105" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="442" y="436" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">return ans</text>
  </g>

  <!-- 否 → 回 N2 -->
  <path d="M 176 431 L 62 431 L 62 128 L 152 128" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="52" y="300" text-anchor="middle" font-size="9.5" fill="#777"
        transform="rotate(-90 52 300)" filter="url(#rough2)">否：取下一个 u（自底向上）</text>

  <!-- 底部要点 -->
  <g filter="url(#rough2)">
    <rect x="25" y="472" width="470" height="34" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="8"/>
    <text x="260" y="487" text-anchor="middle" font-size="9.5" fill="#555">时间 / 空间 O(n)：所有孩子列表长度之和 = n − 1；答案只数节点个数，不关心加价金额</text>
    <text x="260" y="500" text-anchor="middle" font-size="9.5" fill="#555">C++：路径和可达 10¹⁴ 用 long long；Python：链深 10⁵ 必须迭代写法，不能递归</text>
  </g>
</svg>
