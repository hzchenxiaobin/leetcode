<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="97" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：words = ["abc","car","ada","racecar","cool"]</text>
  <path d="M 130 40 Q 320 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- word 0: abc -->
  <g filter="url(#sk)">
    <rect x="40" y="62" width="560" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="60" y="84" font-size="12.5" fill="#a04038" font-weight="bold">i=0  "abc"</text>
  <g font-size="13" font-family="monospace" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="200" y="98">a</text>
    <text x="240" y="98">b</text>
    <text x="280" y="98">c</text>
  </g>
  <path d="M 200 106 Q 240 126 280 106" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text x="360" y="96" font-size="12.5" fill="#a04038">'a' ≠ 'c'</text>
  <text x="360" y="110" font-size="12" fill="#a04038">首对即否定 → 跳过</text>

  <!-- word 1: car -->
  <g filter="url(#sk)">
    <rect x="40" y="128" width="560" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="60" y="150" font-size="12.5" fill="#a04038" font-weight="bold">i=1  "car"</text>
  <g font-size="13" font-family="monospace" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="200" y="164">c</text>
    <text x="240" y="164">a</text>
    <text x="280" y="164">r</text>
  </g>
  <path d="M 200 172 Q 240 192 280 172" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text x="360" y="162" font-size="12.5" fill="#a04038">'c' ≠ 'r'</text>
  <text x="360" y="176" font-size="12" fill="#a04038">首对即否定 → 跳过</text>

  <!-- word 2: ada HIT -->
  <g filter="url(#sk)">
    <rect x="40" y="194" width="560" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="60" y="216" font-size="12.5" fill="#2e5e2e" font-weight="bold">i=2  "ada"</text>
  <g font-size="13" font-family="monospace" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="200" y="230">a</text>
    <text x="240" y="230">d</text>
    <text x="280" y="230">a</text>
  </g>
  <path d="M 200 238 Q 240 258 280 238" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#ag)" marker-start="url(#ag)"/>
  <text x="360" y="228" font-size="12.5" fill="#2e5e2e">'a' == 'a' ✓ → l=1, r=1</text>
  <text x="360" y="244" font-size="12" fill="#2e5e2e">l ≥ r 停止 → 是回文！</text>
  <g filter="url(#sk)">
    <rect x="470" y="222" width="118" height="34" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="529" y="244" text-anchor="middle" font-size="13" fill="#2e5e2e" font-weight="bold">返回 "ada" ✓</text>

  <!-- words 3/4 skipped -->
  <g filter="url(#sk)">
    <rect x="40" y="282" width="560" height="50" rx="10" fill="#f3eee7" stroke="#9a8a76" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="320" y="302" text-anchor="middle" font-size="12.5" fill="#777" font-weight="bold">i=3  "racecar"　　i=4  "cool"</text>
  <text x="320" y="320" text-anchor="middle" font-size="12" fill="#777">命中即返回 → 后面的词不再检查（短路）</text>

  <!-- comparison count -->
  <g filter="url(#sk)">
    <rect x="40" y="348" width="560" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="370" text-anchor="middle" font-size="12.5" fill="#8a6a20" font-weight="bold">实际比较次数：1 + 1 + 1 = 3 对字符（而非全量 15 对）</text>
  <text x="320" y="390" text-anchor="middle" font-size="12" fill="#8a6a20">最坏 O(nm)，但「首对否定 + 短路返回」让平均比较量远低于上界</text>
</svg>
