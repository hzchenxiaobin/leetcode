<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：正方形卡在较短边上 —— 最大边长 k = min(l, w)</text>

  <!-- 左：矩形 [5,8] 与内接正方形 -->
  <rect x="70" y="90" width="192" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="70" y="90" width="120" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="130" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">k = 5</text>
  <text x="130" y="166" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">5 × 5 正方形</text>
  <path d="M190,92 L190,208" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="226" y="144" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">余下</text>
  <text x="226" y="160" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3 × 5</text>
  <text x="166" y="232" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">宽 w = 8</text>
  <text x="46" y="150" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)" transform="rotate(-90 46 150)">长 l = 5</text>
  <text x="166" y="64" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">正方形边长不能超过任何一条边</text>
  <path d="M150,70 L134,84" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右上：条件卡片 -->
  <rect x="310" y="80" width="330" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4a6e" filter="url(#rough2)">切正方形的条件</text>
  <text x="475" y="128" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">k ≤ l 且 k ≤ w ⟺ k ≤ min(l, w)</text>
  <text x="475" y="152" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">单个矩形最大边长 = min(l, w)</text>

  <!-- 右下：归约卡片 -->
  <rect x="310" y="188" width="330" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">问题归约：序列最大值计数</text>
  <text x="475" y="236" text-anchor="middle" font-size="12" fill="#2f5d25" filter="url(#rough2)">① 每个矩形 → k = min(l, w)</text>
  <text x="475" y="258" text-anchor="middle" font-size="12" fill="#2f5d25" filter="url(#rough2)">② 求 k 序列的最大值 maxLen</text>
  <text x="475" y="280" text-anchor="middle" font-size="12" fill="#2f5d25" filter="url(#rough2)">③ 统计 k = maxLen 的出现次数</text>

  <!-- 底部示例横幅 -->
  <rect x="60" y="330" width="580" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="358" text-anchor="middle" font-size="12.5" fill="#5c4512" filter="url(#rough2)">例：[5,8] [3,9] [5,12] [16,5] → k 序列 [5, 3, 5, 5]</text>
  <text x="350" y="386" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5d25" filter="url(#rough2)">maxLen = 5，出现 3 次 → 答案 3 ✓</text>
</svg>
