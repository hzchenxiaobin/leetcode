<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="500" fill="#fafafa"/>
  <g>
    <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次扫描 + 前缀和首次出现位置</text>
    <text x="280" y="50" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">哈希表 first 记录每个前缀和最早出现的下标</text>
    <rect x="130" y="64" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="280" y="89" text-anchor="middle" font-size="12" fill="#33475f" filter="url(#rough2)">s = 0，best = 0，first = { 0 : −1 }</text>
    <rect x="130" y="124" width="300" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="280" y="144" text-anchor="middle" font-size="12" fill="#33475f" filter="url(#rough2)">for i = 0 … n − 1：</text>
    <text x="280" y="164" text-anchor="middle" font-size="12" fill="#33475f" filter="url(#rough2)">s += nums[i] == 1 ? +1 : −1</text>
    <polygon points="280,177 400,215 280,253 160,215" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="280" y="220" text-anchor="middle" font-size="12" fill="#7a5c10" filter="url(#rough2)">first 中已有 s ？</text>
    <rect x="30" y="290" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="140" y="312" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">first[s] = i</text>
    <text x="140" y="332" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">（只记最早下标）</text>
    <rect x="310" y="290" width="220" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="420" y="312" text-anchor="middle" font-size="12" fill="#8d3b38" filter="url(#rough2)">len = i − first[s]</text>
    <text x="420" y="332" text-anchor="middle" font-size="10.5" fill="#8d3b38" filter="url(#rough2)">best = max(best, len)</text>
    <rect x="150" y="372" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
    <text x="280" y="396" text-anchor="middle" font-size="12" fill="#33475f" filter="url(#rough2)">i += 1，继续循环</text>
    <rect x="160" y="436" width="240" height="42" fill="#f1efea" stroke="#8a8578" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
    <text x="280" y="462" text-anchor="middle" font-size="12" fill="#4a463d" filter="url(#rough2)">循环结束，返回 best</text>
    <path d="M 280 104 L 280 120" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 160 215 C 120 240, 128 262, 140 286" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 400 215 C 440 240, 432 262, 420 286" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 140 346 C 150 362, 180 366, 205 370" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 420 346 C 410 362, 380 366, 355 370" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <path d="M 280 410 L 280 432" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="150" y="244" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
    <text x="388" y="244" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  </g>
</svg>
