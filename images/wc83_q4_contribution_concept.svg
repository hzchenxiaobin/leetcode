<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="45" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="49" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按字符算贡献：每个下标管一段子串</text>
  <path d="M 170.0 44 Q 320.0 54 470.0 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough)"/>
  <text x="320.0" y="66" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">s = "ABA"，以下标 1 的 B 为例</text>
  <g filter="url(#rough2)"><rect x="200" y="96" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="230.0" y="125.92" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">A</text>
  <g filter="url(#rough2)"><rect x="290" y="96" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320.0" y="125.92" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="380" y="96" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="410.0" y="125.92" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">A</text>
  <text x="230" y="160" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">0</text>
  <text x="320" y="160" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <text x="410" y="160" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="198" y="168" width="154" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="275" y="186" text-anchor="middle" font-size="11" fill="#2e5e22" filter="url(#rough2)">起点可取 2 个</text>
  <g filter="url(#rough2)"><rect x="288" y="200" width="154" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="365" y="218" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#rough2)">终点可取 2 个</text>
  <text x="320" y="246" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">左端落在 (prev, i] 共 i−prev 种；右端落在 [i, nxt) 共 nxt−i 种</text>
  <g filter="url(#rough2)"><rect x="90" y="258" width="460" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="320" y="282" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">贡献 = (i − prev[i]) × (nxt[i] − i)</text>
  <text x="320" y="303" text-anchor="middle" font-size="11" fill="#2b4a6e" filter="url(#rough2)">下标 1：prev = −1，nxt = 3 ⇒ (1+1) × (3−1) = 4</text>
  <text x="320" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">下标 0 贡献 2，下标 2 贡献 2，合计 2 + 4 + 2 = 8</text>
  <g filter="url(#rough2)"><rect x="90" y="356" width="460" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="320.0" y="378" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">prev / nxt 都取「同字符的上一次 / 下一次出现」，哨兵为 −1 与 n</text>
  </svg>