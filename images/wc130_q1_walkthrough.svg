<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="#666" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arr"/>
    </marker>
    <marker id="#446688" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrB"/>
    </marker>
    <marker id="#4a7a3a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrG"/>
    </marker>
    <marker id="#b85450" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrR"/>
    </marker>
    <marker id="#d6a040" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrO"/>
    </marker>
    <marker id="#7a5ea8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="arrP"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例演算：两个数组的余数轨迹</text>
  <text x="280.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">answer[i] 由第 i 步更新后的 cur 决定</text>
  <text x="40.0" y="68.0" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">nums = [0, 1, 1]</text>
  <rect x="40.0" y="78.0" width="55.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="67.5" y="96.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="95.0" y="78.0" width="75.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="132.5" y="96.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <rect x="170.0" y="78.0" width="135.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="237.5" y="96.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2·cur+nums[i]</text>
  <rect x="305.0" y="78.0" width="115.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="362.5" y="96.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cur 更新后</text>
  <rect x="420.0" y="78.0" width="105.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="472.5" y="96.7" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">answer[i]</text>
