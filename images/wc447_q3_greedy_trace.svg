<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">逐位贪心构造字典序最小 —— 示例 1：nums = [3,12,45]，k = 5</text>
  <path d="M 170 38 Q 320 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="60" text-anchor="middle" font-size="11.5" fill="#555">每步把未用数字按「整数值」升序试，第一个「后继可行」的立即选中</text>

  <g filter="url(#sk)"><rect x="48" y="82" width="60" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="78" y="104" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5b84">第 1 步</text>

  <g filter="url(#sk)"><rect x="128" y="76" width="64" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="160" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="160" y="114" text-anchor="middle" font-size="9" fill="#2e6e2e">f({3}, 3) = T</text>
  <g filter="url(#sk)"><rect x="206" y="76" width="64" height="46" rx="6" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.4"/></g>
  <text x="238" y="97" text-anchor="middle" font-size="14" fill="#999">12</text>
  <text x="238" y="114" text-anchor="middle" font-size="9" fill="#999">不必再试</text>
  <g filter="url(#sk)"><rect x="284" y="76" width="64" height="46" rx="6" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.4"/></g>
  <text x="316" y="97" text-anchor="middle" font-size="14" fill="#999">45</text>
  <text x="316" y="114" text-anchor="middle" font-size="9" fill="#999">不必再试</text>

  <g filter="url(#sk)"><path d="M 362 99 L 386 99" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/></g>
  <text x="400" y="94" font-size="11" fill="#444">最小候选 3 即可行</text>
  <text x="400" y="112" font-size="12" font-weight="bold" fill="#2e6e2e">r：0 → 3</text>

  <g filter="url(#sk)"><rect x="48" y="150" width="60" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="78" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5b84">第 2 步</text>

  <g filter="url(#sk)"><rect x="128" y="144" width="64" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="160" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">12</text>
  <text x="160" y="182" text-anchor="middle" font-size="9" fill="#2e6e2e">f({3,12}, 2) = T</text>
  <g filter="url(#sk)"><rect x="206" y="144" width="64" height="46" rx="6" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.4"/></g>
  <text x="238" y="165" text-anchor="middle" font-size="14" fill="#999">45</text>
  <text x="238" y="182" text-anchor="middle" font-size="9" fill="#999">不必再试</text>

  <g filter="url(#sk)"><path d="M 282 167 L 306 167" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/></g>
  <text x="320" y="162" font-size="11" fill="#444">(3·100 + 12) mod 5 = 2</text>
  <text x="320" y="180" font-size="12" font-weight="bold" fill="#2e6e2e">r：3 → 2</text>

  <g filter="url(#sk)"><rect x="48" y="218" width="60" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="78" y="240" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5b84">第 3 步</text>

  <g filter="url(#sk)"><rect x="128" y="212" width="64" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="160" y="233" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">45</text>
  <text x="160" y="250" text-anchor="middle" font-size="9" fill="#2e6e2e">f(full, 0) = T</text>

  <g filter="url(#sk)"><path d="M 202 235 L 226 235" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)"/></g>
  <text x="240" y="230" font-size="11" fill="#444">(2·100 + 45) mod 5 = 0，终态余数归零</text>
  <text x="240" y="248" font-size="12" font-weight="bold" fill="#2e6e2e">r：2 → 0 ✓</text>

  <g filter="url(#sk)">
    <rect x="48" y="278" width="544" height="106" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="304" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">答案 [3, 12, 45] —— 连接值 31245 ≡ 0 (mod 5)</text>
  <text x="320" y="330" text-anchor="middle" font-size="11" fill="#444">对照：[12, 3, 45] 连接 12345 同样可行，但 3 &lt; 12，整数比较下 [3,…] 字典序更小</text>
  <text x="320" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">陷阱：字典序按「整数」逐元素比较 —— 若按拼接字符串比较（"12…" &lt; "3…"），会误选 12 开头！</text>
</svg>
