<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：nums = [0,2,3,9]，closest = [1,2,1,2]（示例 2）</text>

  <!-- 数轴：下标与间隙单价 -->
  <rect x="88" y="44" width="52" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="228" y="44" width="52" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="368" y="44" width="52" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="508" y="44" width="52" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <text x="254" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="394" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="534" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">9</text>
  <text x="171" y="65" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">→1 ←2</text>
  <text x="311" y="65" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">→1 ←1</text>
  <text x="451" y="65" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">→6 ←1</text>
  <text x="114" y="92" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="254" y="92" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="394" y="92" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="534" y="92" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">i=3</text>

  <!-- 查询① [3,0] -->
  <text x="46" y="145" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">① [3,0]</text>
  <circle cx="150" cy="140" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="230" cy="140" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="310" cy="140" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="390" cy="140" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="145" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">3</text>
  <text x="230" y="145" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="310" y="145" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="390" y="145" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <path d="M167,140 L211,140" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="189" y="130" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M247,140 L291,140" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="269" y="130" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M327,140 L371,140" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="349" y="130" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="430" y="138" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">= 1 + 1 + 2 = 4</text>
  <text x="430" y="157" font-size="10.5" fill="#666" filter="url(#rough2)">3→2、2→1 贴身跳；1→0 直跳 d0=2</text>

  <!-- 查询② [1,2] -->
  <text x="46" y="220" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">② [1,2]</text>
  <circle cx="150" cy="215" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="230" cy="215" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="220" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="230" y="220" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <path d="M167,215 L211,215" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="189" y="205" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="270" y="213" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">= 1</text>
  <text x="270" y="232" font-size="10.5" fill="#666" filter="url(#rough2)">closest(1)=2，一次贴身跳</text>

  <!-- 查询③ [2,0] -->
  <text x="46" y="295" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">③ [2,0]</text>
  <circle cx="150" cy="290" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="230" cy="290" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="310" cy="290" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="295" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="230" y="295" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="310" y="295" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <path d="M167,290 L211,290" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="189" y="280" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M247,290 L291,290" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="269" y="280" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="350" y="288" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">= 1 + 2 = 3</text>
  <text x="350" y="307" font-size="10.5" fill="#666" filter="url(#rough2)">2→1 贴身跳；1→0 直跳 d0=2</text>

  <!-- 前缀和验证 -->
  <rect x="48" y="336" width="584" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">前缀和验证</text>
  <text x="340" y="384" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">PR = [0, 1, 2, 8]（向右）　　PL = [0, 2, 3, 4]（向左）</text>
  <text x="340" y="408" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① l&gt;r：PL[3]−PL[0] = 4 ✓　② l&lt;r：PR[2]−PR[1] = 1 ✓　③ l&gt;r：PL[2]−PL[0] = 3 ✓</text>
  <text x="340" y="432" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">每个查询只做两次前缀和取差，O(1) 回答</text>
</svg>
