<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>

  <rect width="560" height="350" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">子数组和 = 两个前缀和相减，值相同才配得上</text>

  <!-- 下标 -->
  <g font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="84" y="54">0</text><text x="138" y="54">1</text><text x="192" y="54">2</text>
    <text x="246" y="54">3</text><text x="300" y="54">4</text>
  </g>
  <!-- nums 格子 -->
  <g filter="url(#rough2)">
    <rect x="60" y="60" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="114" y="60" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="168" y="60" width="48" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="222" y="60" width="48" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="276" y="60" width="48" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="84" y="82">−1</text><text x="138" y="82">3</text><text x="192" y="82">2</text>
    <text x="246" y="82">4</text><text x="300" y="82">5</text>
  </g>

  <!-- 前缀和刻度 -->
  <g stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)">
    <path d="M 60 96 L 60 116"/><path d="M 114 96 L 114 116"/><path d="M 168 96 L 168 116"/>
    <path d="M 222 96 L 222 116"/><path d="M 276 96 L 276 116"/><path d="M 330 96 L 330 116"/>
    <path d="M 384 96 L 384 116"/>
  </g>
  <g font-size="9.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">
    <text x="60" y="130">S0=0</text><text x="114" y="130">S1=−1</text>
    <text x="168" y="130" fill="#b85450" font-weight="bold">S2=2</text><text x="222" y="130">S3=4</text>
    <text x="276" y="130">S4=8</text><text x="330" y="130" fill="#b85450" font-weight="bold">S5=13</text>
  </g>
  <text x="280" y="150" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">S[k] = nums[0] + … + nums[k−1]，落在每个格子的左边界上</text>

  <rect x="40" y="164" width="480" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="11.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">nums[2..4] = [2, 4, 5]，和 = S5 − S2 = 13 − 2 = 11</text>
  <text x="280" y="199" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">又因 |nums[2] − nums[4]| = |2 − 5| = 3 = k，所以它是好子数组</text>

  <rect x="40" y="216" width="480" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="238" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">哈希表 best：值 → 该值出现过的最小前缀和</text>
  <text x="58" y="258" font-size="11" fill="#3a4a66" filter="url(#rough2)">扫到 nums[j] 时，去查 best[nums[j] + k] 与 best[nums[j] − k]</text>
  <text x="58" y="276" font-size="11" fill="#3a4a66" filter="url(#rough2)">取「最小」前缀和，减出来才是「最大」区间和</text>

  <text x="280" y="310" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">k ≥ 1 ⇒ 首尾元素必然不同 ⇒ 好子数组长度至少为 2，i 一定小于 j</text>
  <text x="280" y="332" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">nums 含负数 ⇒ 前缀和不单调 ⇒ 不能双指针，只能哈希表记住最小值</text>
</svg>
