<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280.0" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 演算：nums = [3,4,5,1,12,14,13]</text>
  <rect x="92" y="66" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118.0" y="94.0" text-anchor="middle" font-size="14" fill="#1c3a1c" filter="url(#rough2)">3</text>
  <text x="118" y="124" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="149" y="66" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175.0" y="94.0" text-anchor="middle" font-size="14" fill="#1c3a1c" filter="url(#rough2)">4</text>
  <text x="175" y="124" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <rect x="206" y="66" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232.0" y="94.0" text-anchor="middle" font-size="14" fill="#1c3a1c" filter="url(#rough2)">5</text>
  <text x="232" y="124" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <rect x="263" y="66" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="289.0" y="94.0" text-anchor="middle" font-size="14" fill="#7a3030" filter="url(#rough2)">1</text>
  <text x="289" y="124" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <rect x="320" y="66" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="346.0" y="94.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">12</text>
  <text x="346" y="124" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <rect x="377" y="66" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="403.0" y="94.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">14</text>
  <text x="403" y="124" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <rect x="434" y="66" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460.0" y="94.0" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">13</text>
  <text x="460" y="124" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6</text>
  <path d="M144,58 L149,58" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M201,58 L206,58" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="50" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">1 ≠ 5+1 → 前缀止于下标 2</text>
  <rect x="80" y="142" width="400" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="168" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">sum = 3 + 4 + 5 = 12，从 12 开始逐个查 seen</text>
  <rect x="105" y="200" width="76" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="143" y="224" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">12</text>
  <text x="143" y="244" text-anchor="middle" font-size="11" fill="#1c3a1c" filter="url(#rough2)">✓ 在</text>
  <rect x="197" y="200" width="76" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="224" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">13</text>
  <text x="235" y="244" text-anchor="middle" font-size="11" fill="#1c3a1c" filter="url(#rough2)">✓ 在</text>
  <rect x="289" y="200" width="76" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="327" y="224" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">14</text>
  <text x="327" y="244" text-anchor="middle" font-size="11" fill="#1c3a1c" filter="url(#rough2)">✓ 在</text>
  <rect x="381" y="200" width="76" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="419" y="224" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">15</text>
  <text x="419" y="244" text-anchor="middle" font-size="11" fill="#7a3030" filter="url(#rough2)">✗ 缺失</text>
  <text x="280" y="284" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">12、13、14 都在数组中，15 不在 → 返回 15</text>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">注意：这里 12 是前缀和、同时也是数组元素，所以不能直接返回 12</text>
</svg>
