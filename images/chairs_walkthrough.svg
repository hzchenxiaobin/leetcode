<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="560" fill="#fafafa"/>
  <text x="470" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：cur 与 ans 的逐步变化</text>
  <path d="M 260 38 Q 470 46 680 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="234" y="52" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">示例 2：s = "ELELEEL"</text>
  <text x="706" y="52" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">示例 3：s = "ELEELEELLL"</text>

  <g filter="url(#sk)">
    <rect x="44" y="64" width="380" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="44" y="98" width="380" height="34" fill="#fdfdfd" stroke="#8a8a8a" stroke-width="0.9"/>
    <rect x="44" y="132" width="380" height="34" fill="#eef6ee" stroke="#8a8a8a" stroke-width="0.9"/>
    <rect x="44" y="166" width="380" height="34" fill="#fdfdfd" stroke="#8a8a8a" stroke-width="0.9"/>
    <rect x="44" y="200" width="380" height="34" fill="#eef6ee" stroke="#8a8a8a" stroke-width="0.9"/>
    <rect x="44" y="234" width="380" height="34" fill="#fdfdfd" stroke="#8a8a8a" stroke-width="0.9"/>
    <rect x="44" y="268" width="380" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="44" y="302" width="380" height="34" fill="#eef6ee" stroke="#8a8a8a" stroke-width="0.9"/>
    <path d="M 104 64 L 104 336 M 214 64 L 214 336 M 319 64 L 319 336" stroke="#8a8a8a" stroke-width="0.8"/>
  </g>

  <text x="74" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">秒 i</text>
  <text x="159" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">事件</text>
  <text x="266" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">cur（在场）</text>
  <text x="371" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">ans（峰值）</text>

  <text x="74" y="120" text-anchor="middle" font-size="12" fill="#666">0</text>
  <text x="159" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">E</text>
  <text x="266" y="120" text-anchor="middle" font-size="12" fill="#333">0→1</text>
  <text x="371" y="120" text-anchor="middle" font-size="12" fill="#333">1</text>

  <text x="74" y="154" text-anchor="middle" font-size="12" fill="#666">1</text>
  <text x="159" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">L</text>
  <text x="266" y="154" text-anchor="middle" font-size="12" fill="#333">1→0</text>
  <text x="371" y="154" text-anchor="middle" font-size="12" fill="#333">1</text>

  <text x="74" y="188" text-anchor="middle" font-size="12" fill="#666">2</text>
  <text x="159" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">E</text>
  <text x="266" y="188" text-anchor="middle" font-size="12" fill="#333">0→1</text>
  <text x="371" y="188" text-anchor="middle" font-size="12" fill="#333">1</text>

  <text x="74" y="222" text-anchor="middle" font-size="12" fill="#666">3</text>
  <text x="159" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">L</text>
  <text x="266" y="222" text-anchor="middle" font-size="12" fill="#333">1→0</text>
  <text x="371" y="222" text-anchor="middle" font-size="12" fill="#333">1</text>

  <text x="74" y="256" text-anchor="middle" font-size="12" fill="#666">4</text>
  <text x="159" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">E</text>
  <text x="266" y="256" text-anchor="middle" font-size="12" fill="#333">0→1</text>
  <text x="371" y="256" text-anchor="middle" font-size="12" fill="#333">1</text>

  <text x="74" y="290" text-anchor="middle" font-size="12" fill="#666">5</text>
  <text x="159" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">E</text>
  <text x="266" y="290" text-anchor="middle" font-size="12" fill="#333">1→2</text>
  <text x="371" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">2</text>

  <text x="74" y="324" text-anchor="middle" font-size="12" fill="#666">6</text>
  <text x="159" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">L</text>
  <text x="266" y="324" text-anchor="middle" font-size="12" fill="#333">2→1</text>
  <text x="371" y="324" text-anchor="middle" font-size="12" fill="#333">2</text>

  <text x="234" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 ans = 2 ✓</text>

  <g filter="url(#sk)">
    <rect x="516" y="64" width="380" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="516" y="98" width="380" height="34" fill="#fdfdfd" stroke="#8a8a8a" stroke-width="0.9"/>
    <rect x="516" y="132" width="380" height="34" fill="#eef6ee" stroke="#8a8a8a" stroke-width="0.9"/>
    <rect x="516" y="166" width="380" height="34" fill="#fdfdfd" stroke="#8a8a8a" stroke-width="0.9"/>
    <rect x="516" y="200" width="380" height="34" fill="#fdfdfd" stroke="#8a8a8a" stroke-width="0.9"/>
    <rect x="516" y="234" width="380" height="34" fill="#eef6ee" stroke="#8a8a8a" stroke-width="0.9"/>
    <rect x="516" y="268" width="380" height="34" fill="#fdfdfd" stroke="#8a8a8a" stroke-width="0.9"/>
    <rect x="516" y="302" width="380" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="516" y="336" width="380" height="34" fill="#eef6ee" stroke="#8a8a8a" stroke-width="0.9"/>
    <rect x="516" y="370" width="380" height="34" fill="#eef6ee" stroke="#8a8a8a" stroke-width="0.9"/>
    <rect x="516" y="404" width="380" height="34" fill="#eef6ee" stroke="#8a8a8a" stroke-width="0.9"/>
    <path d="M 576 64 L 576 438 M 686 64 L 686 438 M 791 64 L 791 438" stroke="#8a8a8a" stroke-width="0.8"/>
  </g>

  <text x="546" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">秒 i</text>
  <text x="631" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">事件</text>
  <text x="738" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">cur（在场）</text>
  <text x="843" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">ans（峰值）</text>

  <text x="546" y="120" text-anchor="middle" font-size="12" fill="#666">0</text>
  <text x="631" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">E</text>
  <text x="738" y="120" text-anchor="middle" font-size="12" fill="#333">0→1</text>
  <text x="843" y="120" text-anchor="middle" font-size="12" fill="#333">1</text>

  <text x="546" y="154" text-anchor="middle" font-size="12" fill="#666">1</text>
  <text x="631" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">L</text>
  <text x="738" y="154" text-anchor="middle" font-size="12" fill="#333">1→0</text>
  <text x="843" y="154" text-anchor="middle" font-size="12" fill="#333">1</text>

  <text x="546" y="188" text-anchor="middle" font-size="12" fill="#666">2</text>
  <text x="631" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">E</text>
  <text x="738" y="188" text-anchor="middle" font-size="12" fill="#333">0→1</text>
  <text x="843" y="188" text-anchor="middle" font-size="12" fill="#333">1</text>

  <text x="546" y="222" text-anchor="middle" font-size="12" fill="#666">3</text>
  <text x="631" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">E</text>
  <text x="738" y="222" text-anchor="middle" font-size="12" fill="#333">1→2</text>
  <text x="843" y="222" text-anchor="middle" font-size="12" fill="#333">2</text>

  <text x="546" y="256" text-anchor="middle" font-size="12" fill="#666">4</text>
  <text x="631" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">L</text>
  <text x="738" y="256" text-anchor="middle" font-size="12" fill="#333">2→1</text>
  <text x="843" y="256" text-anchor="middle" font-size="12" fill="#333">2</text>

  <text x="546" y="290" text-anchor="middle" font-size="12" fill="#666">5</text>
  <text x="631" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">E</text>
  <text x="738" y="290" text-anchor="middle" font-size="12" fill="#333">1→2</text>
  <text x="843" y="290" text-anchor="middle" font-size="12" fill="#333">2</text>

  <text x="546" y="324" text-anchor="middle" font-size="12" fill="#666">6</text>
  <text x="631" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">E</text>
  <text x="738" y="324" text-anchor="middle" font-size="12" fill="#333">2→3</text>
  <text x="843" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">3</text>

  <text x="546" y="358" text-anchor="middle" font-size="12" fill="#666">7</text>
  <text x="631" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">L</text>
  <text x="738" y="358" text-anchor="middle" font-size="12" fill="#333">3→2</text>
  <text x="843" y="358" text-anchor="middle" font-size="12" fill="#333">3</text>

  <text x="546" y="392" text-anchor="middle" font-size="12" fill="#666">8</text>
  <text x="631" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">L</text>
  <text x="738" y="392" text-anchor="middle" font-size="12" fill="#333">2→1</text>
  <text x="843" y="392" text-anchor="middle" font-size="12" fill="#333">3</text>

  <text x="546" y="426" text-anchor="middle" font-size="12" fill="#666">9</text>
  <text x="631" y="426" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">L</text>
  <text x="738" y="426" text-anchor="middle" font-size="12" fill="#333">1→0</text>
  <text x="843" y="426" text-anchor="middle" font-size="12" fill="#333">3</text>

  <text x="706" y="464" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 ans = 3 ✓</text>

  <g filter="url(#sk)">
    <rect x="60" y="490" width="820" height="56" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="514" font-size="12" fill="#444">ans 只在 'E'（+1）之后才可能变大；一旦到达峰值，后面无论多少 'L'，ans 都不会回落</text>
  <text x="80" y="536" font-size="12" fill="#444">两表都从 cur = 0、ans = 0 出发逐秒维护 ans = max(ans, cur)；橙色行 = ans 被刷新为峰值的时刻</text>
</svg>
