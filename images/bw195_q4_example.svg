<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例 3：a="abcd", b="cdab", x=2, y=1 → true</text>
  <rect x="60" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80.0" y="86.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="80.0" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <rect x="104" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124.0" y="86.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <text x="124.0" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <rect x="148" y="62" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168.0" y="86.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <text x="168.0" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <rect x="192" y="62" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212.0" y="86.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <text x="212.0" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <rect x="236" y="62" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256.0" y="86.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="256.0" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <rect x="280" y="62" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300.0" y="86.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <text x="300.0" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>
  <rect x="324" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344.0" y="86.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <text x="344.0" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6</text>
  <rect x="368" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388.0" y="86.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <text x="388.0" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">7</text>
  <text x="260" y="148" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">偏移 2 起，a*x 的 [2..5] 恰好是 "cdab" = b*y</text>
  <text x="60" y="176" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">offset 0</text>
  <text x="150" y="176" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">abcd... vs cdab → 第 0 位 a≠c，失败</text>
  <text x="60" y="202" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">offset 1</text>
  <text x="150" y="202" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">bcda... vs cdab → 第 0 位 b≠c，失败</text>
  <text x="60" y="228" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">offset 2</text>
  <text x="150" y="228" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">cdab... vs cdab → 全部匹配 ✓</text>
  <text x="60" y="254" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">offset 3</text>
  <text x="150" y="254" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">dabc... vs cdab → 第 0 位 d≠c，失败</text>
  <rect x="50" y="296" width="420" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="314" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">本例参数</text>
  <text x="62" y="330" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">maxOff = min(A−1, N−L) = min(3, 4) = 3；lcm(4,4)=4，</text>
  <text x="62" y="345" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">故每个起点比较 min(4,4)=4 个字符即可。</text>
</svg>
