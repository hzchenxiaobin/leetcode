<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">把「相邻和为平方数」翻译成图上的边</text>
  <text x="280" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">排列 = 走遍所有顶点的一条路径，答案 = 哈密顿路径条数（含反向）</text>

  <rect x="40" y="90" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="68" y="118" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="100" y="90" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="128" y="118" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">17</text>
  <rect x="160" y="90" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="188" y="118" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="128" y="76" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">nums</text>

  <path d="M 230 112 L 300 112" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="265" y="102" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">建图</text>

  <circle cx="360" cy="86" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="92" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="440" cy="176" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="182" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">17</text>
  <circle cx="500" cy="86" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="92" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>

  <path d="M 379 90 L 481 90" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="430" y="80" font-size="9.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">1+8=9</text>
  <path d="M 459 101 L 492 163" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="487" y="136" font-size="9.5" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">8+17=25</text>
  <path d="M 371 103 L 428 163" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="371" y="152" font-size="9.5" fill="#b85450" text-anchor="end" filter="url(#rough2)">1+17=18 ✗</text>

  <rect x="30" y="212" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="232" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">合法排列 ⇒ 图上一条经过全部顶点各一次的路径；路径 1→8→17 与 17→8→1 都合法。</text>
  <text x="42" y="249" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">反过来，任何哈密顿路径按经过顺序取值，相邻和都是平方数，正好对应一个合法排列。</text>

  <rect x="30" y="268" width="500" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="288" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">一般的哈密顿路径计数是 NP 难问题，但题目限制 n ≤ 12：暴力回溯最多 12! 量级，配合剪枝足够。</text>
  <text x="42" y="304" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">若要求多项式算法，可以改用「对子集做 DP」的 O(2^n · n^2)，思路见题解延伸思考。</text>
</svg>
