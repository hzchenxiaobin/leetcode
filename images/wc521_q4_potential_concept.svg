<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：空闲收益 gap = start_j − end_p，可拆成两端各自的「账」</text>

  <!-- ① 原始链 -->
  <text x="16" y="54" font-size="12.5" fill="#446688" filter="url(#rough2)">① 选一条链（按 start 升序，端点相接不算重叠）</text>

  <rect x="96" y="66" width="112" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="81" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">m1</text>
  <text x="152" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rev=5</text>

  <rect x="208" y="66" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="236" y="82" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">空闲</text>
  <text x="236" y="96" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">+1</text>

  <rect x="264" y="66" width="112" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="81" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">m2</text>
  <text x="320" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rev=3</text>

  <rect x="376" y="66" width="112" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="432" y="82" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">空闲</text>
  <text x="432" y="96" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">+2</text>

  <rect x="488" y="66" width="112" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="544" y="81" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">m3</text>
  <text x="544" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rev=4</text>

  <line x1="40" y1="114" x2="600" y2="114" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="40" y1="110" x2="40" y2="118" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="96" y1="110" x2="96" y2="118" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="152" y1="110" x2="152" y2="118" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="208" y1="110" x2="208" y2="118" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="264" y1="110" x2="264" y2="118" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="320" y1="110" x2="320" y2="118" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="376" y1="110" x2="376" y2="118" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="432" y1="110" x2="432" y2="118" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="488" y1="110" x2="488" y2="118" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="544" y1="110" x2="544" y2="118" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="600" y1="110" x2="600" y2="118" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="132" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="96" y="132" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="152" y="132" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="208" y="132" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="264" y="132" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="320" y="132" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="376" y="132" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>
  <text x="432" y="132" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>
  <text x="488" y="132" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">8</text>
  <text x="544" y="132" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">9</text>
  <text x="600" y="132" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">10</text>

  <text x="320" y="158" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">总收益 = (5 + 3 + 4) + (4−3) + (8−6) = 15</text>

  <!-- ② 拆账 -->
  <text x="16" y="192" font-size="12.5" fill="#446688" filter="url(#rough2)">② 拆账：每段空闲的钱 = 后一场收 +start，前一场付 −end</text>

  <rect x="96" y="204" width="112" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">m1</text>
  <text x="152" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rev=5</text>

  <rect x="208" y="204" width="56" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="236" y="218" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">−e1</text>
  <text x="236" y="234" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">+s2</text>

  <rect x="264" y="204" width="112" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">m2</text>
  <text x="320" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rev=3</text>

  <rect x="376" y="204" width="112" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="414" y="227" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">−e2</text>
  <text x="450" y="227" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">+s3</text>

  <rect x="488" y="204" width="112" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="544" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">m3</text>
  <text x="544" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rev=4</text>

  <text x="320" y="264" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">总收益 = rev1 + (rev2 + s2 − e1) + (rev3 + s3 − e2)</text>
  <text x="320" y="284" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">⇒ 每个非首位置收 +s，每个非末位置付 −e：gap 的两个端点从此解耦</text>

  <!-- 结论框 -->
  <rect x="40" y="298" width="560" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="320" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">定义势能 φ(p) = dp[p] − end_p（dp[p] = 以 p 结尾的链的最优收益）</text>
  <text x="320" y="342" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">转移：dp[j] = rev_j + s_j + max{φ(p) : end_p ≤ s_j}；无前驱则 dp[j] = rev_j</text>
  <text x="320" y="364" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">前驱只以一个数 φ(p) 出现 ⇒ 边扫边维护「已结束会议」的 φ 最大值 best，转移 O(1)</text>

  <text x="320" y="400" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">注意不对称：m1 没有 +s（开头空闲不赚钱），m3 不付 −e（结尾空闲同样不赚钱）</text>
</svg>
