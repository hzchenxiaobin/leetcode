<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">三个官方示例的判定走查</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">双指针从两端向中间收缩，一旦失配答案即为 2</text>

  <g filter="url(#rough2)">
    <rect x="28" y="56" width="504" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <rect x="28" y="88" width="504" height="46" fill="#ffffff" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="28" y="138" width="504" height="46" fill="#f7f9fc" stroke="#446688" stroke-width="1" rx="4"/>
    <rect x="28" y="188" width="504" height="46" fill="#ffffff" stroke="#446688" stroke-width="1" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#3a4a66" font-weight="bold">
    <text x="40" y="75">s</text>
    <text x="116" y="75">首尾比较过程</text>
    <text x="316" y="75">回文？</text>
    <text x="390" y="75">答案</text>
    <text x="440" y="75">一种最优操作</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" fill="#444">
    <text x="40" y="110">"ababa"</text>
    <text x="116" y="110">s[0]=s[4], s[1]=s[3], i 与 j 相遇</text>
    <text x="316" y="110" fill="#3a5a30">是</text>
    <text x="390" y="110" fill="#3a5a30" font-weight="bold">1</text>
    <text x="440" y="110">直接删整串 "ababa"</text>

    <text x="40" y="160">"abb"</text>
    <text x="116" y="160">s[0]='a' ≠ s[2]='b'，首轮即失配</text>
    <text x="316" y="160" fill="#b85450">否</text>
    <text x="390" y="160" fill="#b85450" font-weight="bold">2</text>
    <text x="440" y="160">删 "a"，再删 "bb"</text>

    <text x="40" y="210">"baabb"</text>
    <text x="116" y="210">s[0]=s[4] 相等；s[1]='a' ≠ s[3]='b'</text>
    <text x="316" y="210" fill="#b85450">否</text>
    <text x="390" y="210" fill="#b85450" font-weight="bold">2</text>
    <text x="440" y="210">删 "baab" → 删 "b"</text>
  </g>

  <rect x="28" y="248" width="240" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="267" font-size="10" fill="#8a3a36" font-weight="bold">失配 ⇒ 答案恰为 2</text>
  <text x="42" y="284" font-size="9.5" fill="#555">s 不是回文 ⇒ 1 步删不完（下界 &gt; 1）</text>
  <text x="42" y="299" font-size="9.5" fill="#555">"a" 组 + "b" 组 ⇒ 2 步一定够（上界 2）</text>

  <rect x="288" y="248" width="244" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="302" y="267" font-size="10" fill="#3a5a30" font-weight="bold">相遇 ⇒ 答案恰为 1</text>
  <text x="302" y="284" font-size="9.5" fill="#555">每个 i 都有 s[i] == s[n−1−i]</text>
  <text x="302" y="299" font-size="9.5" fill="#555">整串自身是回文，一次删除清空</text>

  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">注意 "abb" 的最长回文子序列是 "bb"（长度 2 &lt; 3），但答案仍是 2 —— 两者恰好一致纯属偶然</text>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">n ≤ 1000：双指针最坏 500 次比较，远优于 O(n²) 区间 DP</text>
</svg>
