<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：houses = [1,2,3,4]，heaters = [1,4]</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">排序后 heaters = [1,4]，下标 0 与 1；逐个房屋二分</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="50" y="60" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="150" y="60" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="270" y="60" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="390" y="60" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <rect x="470" y="60" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66" text-anchor="middle">
    <text x="100" y="77">房屋 h</text>
    <text x="210" y="77">j = lower_bound</text>
    <text x="330" y="77">候选供暖器</text>
    <text x="430" y="77">d(h)</text>
    <text x="500" y="77">ans</text>
  </g>

  <!-- 第 1 行 -->
  <g filter="url(#rough2)">
    <rect x="50" y="88" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="150" y="88" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="270" y="88" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="390" y="88" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="470" y="88" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="100" y="105" text-anchor="middle" font-size="10.5" fill="#5a4a20">1</text>
    <text x="210" y="105" text-anchor="middle" font-size="10.5" fill="#5a4a20">0</text>
    <text x="330" y="105" text-anchor="middle" font-size="10.5" fill="#5a4a20">{1}（无左邻）</text>
    <text x="430" y="105" text-anchor="middle" font-size="10.5" fill="#4a7a3a">0</text>
    <text x="500" y="105" text-anchor="middle" font-size="10.5" fill="#5a4a20">0</text>
  </g>

  <!-- 第 2 行 -->
  <g filter="url(#rough2)">
    <rect x="50" y="116" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="150" y="116" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="270" y="116" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="390" y="116" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="470" y="116" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="100" y="133" text-anchor="middle" font-size="10.5" fill="#5a4a20">2</text>
    <text x="210" y="133" text-anchor="middle" font-size="10.5" fill="#5a4a20">1</text>
    <text x="330" y="133" text-anchor="middle" font-size="10.5" fill="#5a4a20">{1, 4}</text>
    <text x="430" y="133" text-anchor="middle" font-size="10.5" fill="#8a3a36">1</text>
    <text x="500" y="133" text-anchor="middle" font-size="10.5" fill="#5a4a20">1</text>
  </g>

  <!-- 第 3 行 -->
  <g filter="url(#rough2)">
    <rect x="50" y="144" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="150" y="144" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="270" y="144" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="390" y="144" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <rect x="470" y="144" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="100" y="161" text-anchor="middle" font-size="10.5" fill="#5a4a20">3</text>
    <text x="210" y="161" text-anchor="middle" font-size="10.5" fill="#5a4a20">1</text>
    <text x="330" y="161" text-anchor="middle" font-size="10.5" fill="#5a4a20">{1, 4}</text>
    <text x="430" y="161" text-anchor="middle" font-size="10.5" fill="#8a3a36">1</text>
    <text x="500" y="161" text-anchor="middle" font-size="10.5" fill="#5a4a20">1</text>
  </g>

  <!-- 第 4 行 -->
  <g filter="url(#rough2)">
    <rect x="50" y="172" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="150" y="172" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="270" y="172" width="120" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="390" y="172" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="470" y="172" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="100" y="189" text-anchor="middle" font-size="10.5" fill="#5a4a20">4</text>
    <text x="210" y="189" text-anchor="middle" font-size="10.5" fill="#5a4a20">1</text>
    <text x="330" y="189" text-anchor="middle" font-size="10.5" fill="#5a4a20">{1, 4}</text>
    <text x="430" y="189" text-anchor="middle" font-size="10.5" fill="#4a7a3a">0</text>
    <text x="500" y="189" text-anchor="middle" font-size="10.5" fill="#5a4a20">1</text>
  </g>

  <!-- 说明 -->
  <path d="M 280 202 L 280 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="224" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="66" y="245" font-size="10.5" fill="#3a5a30">h=2 时：右邻 4−2=2，左邻 2−1=1 → d=1；h=3 时：3−1=2，4−3=1 → d=1。</text>

  <rect x="50" y="266" width="480" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="66" y="287" font-size="10.5" fill="#8a3a36">ans = max(0, 1, 1, 0) = 1；半径 0 时房屋 2、3 无人供暖，故 1 是最小可行半径。</text>

  <text x="280" y="322" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意 j 可能越界：j=m 时没有右邻，j=0 时没有左邻，跳过不存在的候选即可</text>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每个房屋只做一次二分，与其它房屋完全无关，因此可以独立求 d(h)</text>
</svg>
