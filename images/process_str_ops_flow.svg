<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="470" fill="#fdfcf7"/>
  <text x="330" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">单次扫描 + if/elif 四分支</text>
  <path d="M 220 40 Q 330 48 440 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Start -->
  <g filter="url(#sk)">
    <rect x="240" y="56" width="180" height="38" rx="16" fill="#f4f4f0" stroke="#8a8a80" stroke-width="1.4"/>
  </g>
  <text x="330" y="80" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">result = ""</text>

  <path d="M 330 94 L 330 118" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Loop box -->
  <g filter="url(#sk)">
    <rect x="235" y="120" width="190" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="330" y="145" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">遍历 s 中每个字符 c</text>

  <path d="M 330 160 L 330 186" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Decision diamond -->
  <g filter="url(#sk)">
    <polygon points="330,188 400,222 330,256 260,222" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="330" y="222" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">c 的类型？</text>
  <text x="330" y="240" text-anchor="middle" font-size="10" fill="#a07840">依次判断</text>

  <!-- Branch arrows to 4 boxes -->
  <path d="M 292 250 Q 150 280 90 288" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 305 253 Q 250 290 205 292" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 355 253 Q 410 290 455 292" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 368 250 Q 510 280 570 288" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Action boxes -->
  <g filter="url(#sk)">
    <rect x="20" y="294" width="140" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="90" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">字母 a–z</text>
  <text x="90" y="338" text-anchor="middle" font-size="11" fill="#2b6e9e" font-family="monospace">追加 c</text>

  <g filter="url(#sk)">
    <rect x="175" y="294" width="140" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="245" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04040">'*'</text>
  <text x="245" y="338" text-anchor="middle" font-size="11" fill="#a04040" font-family="monospace">非空则删末尾</text>

  <g filter="url(#sk)">
    <rect x="345" y="294" width="140" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="415" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">'#'</text>
  <text x="415" y="338" text-anchor="middle" font-size="11" fill="#2e6e2e" font-family="monospace">result += result</text>

  <g filter="url(#sk)">
    <rect x="500" y="294" width="140" height="58" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="570" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">'%'</text>
  <text x="570" y="338" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace">reverse(result)</text>

  <!-- Bus lines down -->
  <path d="M 90 352 L 90 388" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 245 352 L 245 388" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 415 352 L 415 388" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 570 352 L 570 388" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 90 388 Q 330 400 570 388" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 330 395 L 330 412" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Loop back / return -->
  <g filter="url(#sk)">
    <rect x="170" y="414" width="320" height="42" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="330" y="440" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">处理下一个字符；扫描结束 → 返回 result</text>
</svg>
