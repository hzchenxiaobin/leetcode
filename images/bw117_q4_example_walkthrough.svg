<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 1 走查：values = [[8,5,2],[6,4,1],[9,7,3]]</text>

  <!-- 表头 -->
  <g font-size="12" fill="#446688" filter="url(#rough2)">
    <text x="60" y="62" text-anchor="middle">天 d</text>
    <text x="180" y="62" text-anchor="middle">堆内容（店:值）</text>
    <text x="330" y="62" text-anchor="middle">买入</text>
    <text x="450" y="62" text-anchor="middle">贡献 v×d</text>
  </g>
  <line x1="30" y1="70" x2="530" y2="70" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <g font-size="12" filter="url(#rough2)">
    <g fill="#33506e">
      <text x="60" y="92" text-anchor="middle">1</text><text x="180" y="92" text-anchor="middle">{0:2, 1:1, 2:3}</text>
      <text x="330" y="92" text-anchor="middle">店1 的 1</text><text x="450" y="92" text-anchor="middle">1×1 = 1</text>
    </g>
    <g fill="#33506e">
      <text x="60" y="114" text-anchor="middle">2</text><text x="180" y="114" text-anchor="middle">{0:2, 1:4, 2:3}</text>
      <text x="330" y="114" text-anchor="middle">店0 的 2</text><text x="450" y="114" text-anchor="middle">2×2 = 4</text>
    </g>
    <g fill="#33506e">
      <text x="60" y="136" text-anchor="middle">3</text><text x="180" y="136" text-anchor="middle">{0:5, 1:4, 2:3}</text>
      <text x="330" y="136" text-anchor="middle">店2 的 3</text><text x="450" y="136" text-anchor="middle">3×3 = 9</text>
    </g>
    <g fill="#33506e">
      <text x="60" y="158" text-anchor="middle">4</text><text x="180" y="158" text-anchor="middle">{0:5, 1:4, 2:7}</text>
      <text x="330" y="158" text-anchor="middle">店1 的 4</text><text x="450" y="158" text-anchor="middle">4×4 = 16</text>
    </g>
    <g fill="#33506e">
      <text x="60" y="180" text-anchor="middle">5</text><text x="180" y="180" text-anchor="middle">{0:5, 1:6, 2:7}</text>
      <text x="330" y="180" text-anchor="middle">店0 的 5</text><text x="450" y="180" text-anchor="middle">5×5 = 25</text>
    </g>
    <g fill="#33506e">
      <text x="60" y="202" text-anchor="middle">6</text><text x="180" y="202" text-anchor="middle">{0:8, 1:6, 2:7}</text>
      <text x="330" y="202" text-anchor="middle">店1 的 6</text><text x="450" y="202" text-anchor="middle">6×6 = 36</text>
    </g>
    <g fill="#33506e">
      <text x="60" y="224" text-anchor="middle">7</text><text x="180" y="224" text-anchor="middle">{0:8, 2:7}</text>
      <text x="330" y="224" text-anchor="middle">店2 的 7</text><text x="450" y="224" text-anchor="middle">7×7 = 49</text>
    </g>
    <g fill="#33506e">
      <text x="60" y="246" text-anchor="middle">8</text><text x="180" y="246" text-anchor="middle">{0:8, 2:9}</text>
      <text x="330" y="246" text-anchor="middle">店0 的 8</text><text x="450" y="246" text-anchor="middle">8×8 = 64</text>
    </g>
    <g fill="#b85450" font-weight="bold">
      <text x="60" y="268" text-anchor="middle">9</text><text x="180" y="268" text-anchor="middle">{2:9}</text>
      <text x="330" y="268" text-anchor="middle">店2 的 9</text><text x="450" y="268" text-anchor="middle">9×9 = 81</text>
    </g>
  </g>

  <rect x="100" y="288" width="360" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="14" fill="#2d5a1f" filter="url(#rough2)">总开销 = 1+4+9+16+25+36+49+64+81 = 285 ✓</text>
  <text x="280" y="326" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">买入值序列 1,2,…,9 恰为全局升序</text>

  <rect x="70" y="344" width="420" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">注意每天堆里至多 m=3 个元素（各店当前栈顶）</text>
  <text x="280" y="380" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">店 1 最先买空（第 6 天后从堆中消失）</text>
</svg>
