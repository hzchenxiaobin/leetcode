<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：word = "cbaaaabc"，forbidden = {"aaa", "cb"}</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每步检查以 r 结尾、起点 ≥ left、长度 ≤ 10 的后缀；窗口更短时自然截断</text>

  <!-- 表头 -->
  <rect x="8"   y="76" width="36"  height="32" rx="4" fill="#446688" filter="url(#rough2)"/>
  <rect x="44"  y="76" width="64"  height="32" rx="4" fill="#446688" filter="url(#rough2)"/>
  <rect x="108" y="76" width="210" height="32" rx="4" fill="#446688" filter="url(#rough2)"/>
  <rect x="318" y="76" width="64"  height="32" rx="4" fill="#446688" filter="url(#rough2)"/>
  <rect x="382" y="76" width="106" height="32" rx="4" fill="#446688" filter="url(#rough2)"/>
  <rect x="488" y="76" width="52"  height="32" rx="4" fill="#446688" filter="url(#rough2)"/>
  <text x="26"  y="96" text-anchor="middle" font-size="11.5" fill="#fff" filter="url(#rough2)">r</text>
  <text x="76"  y="96" text-anchor="middle" font-size="11.5" fill="#fff" filter="url(#rough2)">word[r]</text>
  <text x="213" y="96" text-anchor="middle" font-size="10.5" fill="#fff" filter="url(#rough2)">检查的后缀（L=1 起）</text>
  <text x="350" y="96" text-anchor="middle" font-size="11.5" fill="#fff" filter="url(#rough2)">left</text>
  <text x="435" y="96" text-anchor="middle" font-size="11.5" fill="#fff" filter="url(#rough2)">窗口</text>
  <text x="514" y="96" text-anchor="middle" font-size="11.5" fill="#fff" filter="url(#rough2)">ans</text>

  <!-- 行 r=0 -->
  <rect x="8" y="108" width="36" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="44" y="108" width="64" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="108" y="108" width="210" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="318" y="108" width="64" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="382" y="108" width="106" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="488" y="108" width="52" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="26" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="76" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <text x="213" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">c ∉ bad</text>
  <text x="350" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="435" y="130" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">c</text>
  <text x="514" y="130" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 r=1（命中） -->
  <rect x="8" y="144" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="44" y="144" width="64" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="108" y="144" width="210" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="144" width="64" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="382" y="144" width="106" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="488" y="144" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="26" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="76" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="213" y="166" text-anchor="middle" font-size="11" filter="url(#rough2)"><tspan fill="#4a7a3a">b ∉，</tspan><tspan fill="#b85450" font-weight="bold">cb ∈</tspan></text>
  <text x="350" y="166" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">0→1</text>
  <text x="435" y="166" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">b</text>
  <text x="514" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 r=2 -->
  <rect x="8" y="180" width="36" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="44" y="180" width="64" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="108" y="180" width="210" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="318" y="180" width="64" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="382" y="180" width="106" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="488" y="180" width="52" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="26" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="76" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="213" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a、ba ∉</text>
  <text x="350" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="435" y="202" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ba</text>
  <text x="514" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- 行 r=3 -->
  <rect x="8" y="216" width="36" height="36" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="44" y="216" width="64" height="36" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="108" y="216" width="210" height="36" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="318" y="216" width="64" height="36" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="382" y="216" width="106" height="36" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="488" y="216" width="52" height="36" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="26" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="76" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="213" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">a、aa、baa ∉</text>
  <text x="350" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="435" y="238" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">baa</text>
  <text x="514" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 r=4（命中） -->
  <rect x="8" y="252" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="44" y="252" width="64" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="108" y="252" width="210" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="252" width="64" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="382" y="252" width="106" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="488" y="252" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="26" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>
  <text x="76" y="274" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="213" y="274" text-anchor="middle" font-size="11" filter="url(#rough2)"><tspan fill="#4a7a3a">a、aa ∉，</tspan><tspan fill="#b85450" font-weight="bold">aaa ∈</tspan></text>
  <text x="350" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1→3</text>
  <text x="435" y="274" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">aa</text>
  <text x="514" y="274" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 r=5（命中） -->
  <rect x="8" y="288" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="44" y="288" width="64" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="108" y="288" width="210" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="288" width="64" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="382" y="288" width="106" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="488" y="288" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="26" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">5</text>
  <text x="76" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="213" y="310" text-anchor="middle" font-size="11" filter="url(#rough2)"><tspan fill="#4a7a3a">a、aa ∉，</tspan><tspan fill="#b85450" font-weight="bold">aaa ∈</tspan></text>
  <text x="350" y="310" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">3→4</text>
  <text x="435" y="310" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">aa</text>
  <text x="514" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 r=6 -->
  <rect x="8" y="324" width="36" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="44" y="324" width="64" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="108" y="324" width="210" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="318" y="324" width="64" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="382" y="324" width="106" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="488" y="324" width="52" height="36" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="26" y="346" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="76" y="346" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <text x="213" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">b、ab、aab ∉</text>
  <text x="350" y="346" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="435" y="346" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">aab</text>
  <text x="514" y="346" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 r=7（答案） -->
  <rect x="8" y="360" width="36" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="44" y="360" width="64" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="108" y="360" width="210" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="318" y="360" width="64" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="382" y="360" width="106" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="488" y="360" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="26" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <text x="76" y="382" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <text x="213" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">c、bc、abc、aabc ∉</text>
  <text x="350" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="435" y="382" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">aabc</text>
  <text x="514" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4 ✓</text>

  <!-- 结论框 -->
  <rect x="40" y="412" width="480" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="434" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">r=1："cb" 命中，left 0→1；r=4、r=5："aaa" 命中，left 1→3→4</text>
  <text x="280" y="454" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">r=7：窗口 "aabc" 扩到最长 4，扫描结束 → 答案 4 ✅</text>
  <text x="280" y="476" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">left 只被"顶"到禁串起点的下一位且单调不减，窗口 [left, r] 全程保持合法</text>
</svg>
