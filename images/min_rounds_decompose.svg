<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="900" height="640" fill="#fdfcf7"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：把出现次数 c 拆成若干个「3」和「2」</text>
  <path d="M 240 44 Q 450 54 660 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 情况一：c % 3 == 0 ===== -->
  <g filter="url(#sk)"><rect x="40" y="70" width="820" height="140" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="60" y="96" font-size="14" font-weight="bold" fill="#2e6e2e">情况一：c ≡ 0 (mod 3)，如 c = 6</text>
  <g filter="url(#sk)"><rect x="80" y="114" width="122" height="56" rx="8" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="92" y="127" width="30" height="30" rx="4" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="128" y="127" width="30" height="30" rx="4" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="164" y="127" width="30" height="30" rx="4" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="107" y="147" text-anchor="middle" font-size="12" fill="#2e6e2e">2</text>
  <text x="143" y="147" text-anchor="middle" font-size="12" fill="#2e6e2e">2</text>
  <text x="179" y="147" text-anchor="middle" font-size="12" fill="#2e6e2e">2</text>
  <text x="141" y="190" text-anchor="middle" font-size="11" fill="#2e6e2e">第 1 轮 · 3 个</text>
  <g filter="url(#sk)"><rect x="214" y="114" width="122" height="56" rx="8" fill="#ffffff" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="226" y="127" width="30" height="30" rx="4" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="262" y="127" width="30" height="30" rx="4" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="298" y="127" width="30" height="30" rx="4" fill="#d8ecd9" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="241" y="147" text-anchor="middle" font-size="12" fill="#2e6e2e">2</text>
  <text x="277" y="147" text-anchor="middle" font-size="12" fill="#2e6e2e">2</text>
  <text x="313" y="147" text-anchor="middle" font-size="12" fill="#2e6e2e">2</text>
  <text x="275" y="190" text-anchor="middle" font-size="11" fill="#2e6e2e">第 2 轮 · 3 个</text>
  <text x="430" y="136" font-size="13" font-weight="bold" fill="#2e6e2e">拆分：3 + 3（尽量全用 3）</text>
  <text x="430" y="164" font-size="13" font-weight="bold" fill="#2e6e2e">轮数 = 6 / 3 = 2 轮</text>
  <text x="430" y="186" font-size="11" fill="#888">通用：c / 3 轮</text>

  <!-- ===== 情况二：c % 3 == 2 ===== -->
  <g filter="url(#sk)"><rect x="40" y="228" width="820" height="140" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="60" y="254" font-size="14" font-weight="bold" fill="#2b6e9e">情况二：c ≡ 2 (mod 3)，如 c = 5</text>
  <g filter="url(#sk)"><rect x="80" y="272" width="122" height="56" rx="8" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="92" y="285" width="30" height="30" rx="4" fill="#d6e6f7" stroke="#4a8edb" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="128" y="285" width="30" height="30" rx="4" fill="#d6e6f7" stroke="#4a8edb" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="164" y="285" width="30" height="30" rx="4" fill="#d6e6f7" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="107" y="305" text-anchor="middle" font-size="12" fill="#2b6e9e">3</text>
  <text x="143" y="305" text-anchor="middle" font-size="12" fill="#2b6e9e">3</text>
  <text x="179" y="305" text-anchor="middle" font-size="12" fill="#2b6e9e">3</text>
  <text x="141" y="348" text-anchor="middle" font-size="11" fill="#2b6e9e">第 1 轮 · 3 个</text>
  <g filter="url(#sk)"><rect x="214" y="272" width="88" height="56" rx="8" fill="#ffffff" stroke="#4a8edb" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="226" y="285" width="30" height="30" rx="4" fill="#d6e6f7" stroke="#4a8edb" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="262" y="285" width="30" height="30" rx="4" fill="#d6e6f7" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="241" y="305" text-anchor="middle" font-size="12" fill="#2b6e9e">3</text>
  <text x="277" y="305" text-anchor="middle" font-size="12" fill="#2b6e9e">3</text>
  <text x="258" y="348" text-anchor="middle" font-size="11" fill="#2b6e9e">第 2 轮 · 2 个</text>
  <text x="430" y="294" font-size="13" font-weight="bold" fill="#2b6e9e">拆分：3 + 2（余 2 → 补一个 2）</text>
  <text x="430" y="322" font-size="13" font-weight="bold" fill="#2b6e9e">轮数 = (5 + 1) / 3 = 2 轮</text>
  <text x="430" y="344" font-size="11" fill="#888">通用：(c + 1) / 3 轮</text>

  <!-- ===== 情况三：c % 3 == 1 ===== -->
  <g filter="url(#sk)"><rect x="40" y="386" width="820" height="140" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="60" y="412" font-size="14" font-weight="bold" fill="#7a5415">情况三：c ≡ 1 (mod 3)，如 c = 7（此时必有 c ≥ 4）</text>
  <g filter="url(#sk)"><rect x="80" y="430" width="122" height="56" rx="8" fill="#ffffff" stroke="#c98a2b" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="92" y="443" width="30" height="30" rx="4" fill="#f8e8c8" stroke="#c98a2b" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="128" y="443" width="30" height="30" rx="4" fill="#f8e8c8" stroke="#c98a2b" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="164" y="443" width="30" height="30" rx="4" fill="#f8e8c8" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="107" y="463" text-anchor="middle" font-size="12" fill="#7a5415">4</text>
  <text x="143" y="463" text-anchor="middle" font-size="12" fill="#7a5415">4</text>
  <text x="179" y="463" text-anchor="middle" font-size="12" fill="#7a5415">4</text>
  <text x="141" y="506" text-anchor="middle" font-size="11" fill="#7a5415">第 1 轮 · 3 个</text>
  <g filter="url(#sk)"><rect x="214" y="430" width="88" height="56" rx="8" fill="#ffffff" stroke="#c98a2b" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="226" y="443" width="30" height="30" rx="4" fill="#f8e8c8" stroke="#c98a2b" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="262" y="443" width="30" height="30" rx="4" fill="#f8e8c8" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="241" y="463" text-anchor="middle" font-size="12" fill="#7a5415">4</text>
  <text x="277" y="463" text-anchor="middle" font-size="12" fill="#7a5415">4</text>
  <text x="258" y="506" text-anchor="middle" font-size="11" fill="#7a5415">第 2 轮 · 2 个</text>
  <g filter="url(#sk)"><rect x="316" y="430" width="88" height="56" rx="8" fill="#ffffff" stroke="#c98a2b" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="328" y="443" width="30" height="30" rx="4" fill="#f8e8c8" stroke="#c98a2b" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="364" y="443" width="30" height="30" rx="4" fill="#f8e8c8" stroke="#c98a2b" stroke-width="1.2"/></g>
  <text x="343" y="463" text-anchor="middle" font-size="12" fill="#7a5415">4</text>
  <text x="379" y="463" text-anchor="middle" font-size="12" fill="#7a5415">4</text>
  <text x="360" y="506" text-anchor="middle" font-size="11" fill="#7a5415">第 3 轮 · 2 个</text>
  <text x="430" y="452" font-size="13" font-weight="bold" fill="#7a5415">拆分：3 + 2 + 2（余 1 → 把一个 3 换成 2 + 2）</text>
  <text x="430" y="480" font-size="13" font-weight="bold" fill="#7a5415">轮数 = (7 + 2) / 3 = 3 轮</text>
  <text x="430" y="502" font-size="11" fill="#888">通用：(c + 2) / 3 轮（c ≥ 4）</text>

  <!-- ===== 底部结论 ===== -->
  <g filter="url(#sk)"><rect x="40" y="544" width="820" height="70" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="60" y="572" font-size="13" font-weight="bold" fill="#8a3a36">⚠ 特判：c = 1 → 单独 1 个任务凑不出任何一轮 → 返回 -1（唯一无解情形）</text>
  <text x="60" y="598" font-size="13" font-weight="bold" fill="#8a3a36">统一结论（c ≥ 2）：最少轮数 = ⌈c / 3⌉，整数除法写作 (c + 2) / 3</text>
</svg>
