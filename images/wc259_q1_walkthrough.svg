<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="380" fill="#fafafa"/>
  <text x="340" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：--X、X++、X++ 的逐步执行</text>
  <path d="M 170 40 Q 340 50 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- op[1] column highlight -->
  <g filter="url(#sk)"><rect x="250" y="82" width="95" height="114" fill="#fff8e1" opacity="0.6"/></g>

  <!-- table outer -->
  <g filter="url(#sk)"><rect x="100" y="56" width="435" height="26" fill="#e8f0fe"/></g>
  <g filter="url(#sk)"><rect x="100" y="56" width="435" height="140" fill="none" stroke="#446688" stroke-width="1.8"/></g>

  <!-- header texts -->
  <text x="122" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">步</text>
  <text x="197" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">操作</text>
  <text x="297" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">op[1] ⭐</text>
  <text x="382" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">效果</text>
  <text x="477" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">执行后 x</text>

  <!-- row 0 -->
  <text x="122" y="101" text-anchor="middle" font-size="12.5" fill="#333">0</text>
  <text x="197" y="101" text-anchor="middle" font-size="12.5" fill="#888">（初值）</text>
  <text x="297" y="101" text-anchor="middle" font-size="12.5" fill="#888">—</text>
  <text x="382" y="101" text-anchor="middle" font-size="12.5" fill="#888">—</text>
  <text x="477" y="101" text-anchor="middle" font-size="12.5" fill="#333">0</text>

  <!-- row 1 -->
  <text x="122" y="129" text-anchor="middle" font-size="12.5" fill="#333">1</text>
  <text x="197" y="129" text-anchor="middle" font-size="12.5" fill="#333">--X</text>
  <text x="297" y="129" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36">'-'</text>
  <text x="382" y="129" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36">−1</text>
  <text x="477" y="129" text-anchor="middle" font-size="12.5" fill="#333">−1</text>

  <!-- row 2 -->
  <text x="122" y="157" text-anchor="middle" font-size="12.5" fill="#333">2</text>
  <text x="197" y="157" text-anchor="middle" font-size="12.5" fill="#333">X++</text>
  <text x="297" y="157" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25">'+'</text>
  <text x="382" y="157" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25">+1</text>
  <text x="477" y="157" text-anchor="middle" font-size="12.5" fill="#333">0</text>

  <!-- row 3 -->
  <text x="122" y="185" text-anchor="middle" font-size="12.5" fill="#333">3</text>
  <text x="197" y="185" text-anchor="middle" font-size="12.5" fill="#333">X++</text>
  <text x="297" y="185" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25">'+'</text>
  <text x="382" y="185" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25">+1</text>
  <g filter="url(#sk)"><rect x="420" y="168" width="115" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="477" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d25">1 ⭐</text>

  <!-- grid lines -->
  <path d="M 145 56 L 145 196" stroke="#8ea6c4" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 250 56 L 250 196" stroke="#8ea6c4" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 345 56 L 345 196" stroke="#8ea6c4" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 420 56 L 420 196" stroke="#8ea6c4" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 100 82 L 535 82" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <path d="M 100 112 L 535 112" stroke="#c5d3e4" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 100 140 L 535 140" stroke="#c5d3e4" stroke-width="1" fill="none" filter="url(#sk)"/>
  <path d="M 100 168 L 535 168" stroke="#c5d3e4" stroke-width="1" fill="none" filter="url(#sk)"/>

  <!-- state chain -->
  <g filter="url(#sk)"><ellipse cx="110" cy="285" rx="27" ry="27" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="110" y="291" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66">0</text>

  <g filter="url(#sk)"><ellipse cx="270" cy="285" rx="27" ry="27" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="270" y="291" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a3a36">−1</text>

  <g filter="url(#sk)"><ellipse cx="430" cy="285" rx="27" ry="27" fill="#ffffff" stroke="#446688" stroke-width="1.8"/></g>
  <text x="430" y="291" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">0</text>

  <g filter="url(#sk)"><ellipse cx="585" cy="285" rx="27" ry="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6"/></g>
  <text x="585" y="291" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f5d25">1</text>
  <text x="620" y="262" text-anchor="middle" font-size="14">⭐</text>

  <path d="M 141 285 L 237 285" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="190" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">--X：−1</text>

  <path d="M 301 285 L 397 285" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="350" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">X++：+1</text>

  <path d="M 461 285 L 553 285" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="500" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">X++：+1</text>

  <text x="110" y="330" text-anchor="middle" font-size="11" fill="#888">步 0（初值）</text>
  <text x="270" y="330" text-anchor="middle" font-size="11" fill="#888">步 1</text>
  <text x="430" y="330" text-anchor="middle" font-size="11" fill="#888">步 2</text>
  <text x="585" y="330" text-anchor="middle" font-size="11" fill="#2f5d25">步 3（答案）</text>

  <text x="340" y="362" text-anchor="middle" font-size="11" fill="#888">判据始终落在中间字符；最终 x = 2 个 '+' − 1 个 '−' = 1，与顺序无关</text>
</svg>
