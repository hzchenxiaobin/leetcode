<svg xmlns="http://www.w3.org/2000/svg" width="680" height="510" viewBox="0 0 680 510" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="510" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：抵消配对 → 残形 ]^k [^k → 首尾交换 ⌈k/2⌉ 次</text>
  <path d="M 150 38 Q 340 48 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Section 1 -->
  <text x="60" y="72" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">① 抵消配对：能配对的全消掉——超前 ] 必在未闭 [ 之前，残形只剩 ]^k [^k</text>

  <text x="62" y="114" font-size="12" fill="#888" filter="url(#sk)">s =</text>
  <g font-size="9" fill="#999" text-anchor="middle" filter="url(#sk)">
    <text x="121" y="86">0</text><text x="171" y="86">1</text><text x="221" y="86">2</text><text x="271" y="86">3</text>
    <text x="321" y="86">4</text><text x="371" y="86">5</text><text x="421" y="86">6</text><text x="471" y="86">7</text>
  </g>
  <g filter="url(#sk)">
    <rect x="100" y="92" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="150" y="92" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="200" y="92" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="250" y="92" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="300" y="92" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="350" y="92" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="400" y="92" width="42" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="450" y="92" width="42" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="121" y="114">[</text><text x="171" y="114">]</text><text x="221" y="114">]</text><text x="271" y="114">]</text>
    <text x="321" y="114">[</text><text x="371" y="114">]</text><text x="421" y="114">[</text><text x="471" y="114">[</text>
  </g>
  <g fill="none" filter="url(#sk)">
    <path d="M 102 136 L 102 141 L 189 141 L 189 136" stroke="#4a7a3a" stroke-width="1.5"/>
    <path d="M 202 136 L 202 141 L 289 141 L 289 136" stroke="#b85450" stroke-width="1.8"/>
    <path d="M 302 136 L 302 141 L 389 141 L 389 136" stroke="#4a7a3a" stroke-width="1.5"/>
    <path d="M 402 136 L 402 141 L 489 141 L 489 136" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g font-size="10.5" text-anchor="middle" filter="url(#sk)">
    <text x="146" y="156" fill="#4a7a3a">已配对</text>
    <text x="245" y="156" fill="#b85450" font-weight="bold">超前 ]（未匹配）</text>
    <text x="346" y="156" fill="#4a7a3a">已配对</text>
    <text x="445" y="156" fill="#d6a040" font-weight="bold">未闭 [（未匹配）</text>
  </g>

  <path d="M 494 110 L 516 110" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="505" y="102" text-anchor="middle" font-size="9.5" fill="#8a8f98" filter="url(#sk)">消去</text>
  <g filter="url(#sk)"><rect x="520" y="80" width="146" height="112" rx="10" fill="#f4f6f8" stroke="#8a99aa" stroke-width="1.4"/></g>
  <text x="593" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#556" filter="url(#sk)">残形 ]^k [^k</text>
  <g filter="url(#sk)">
    <rect x="534" y="110" width="28" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="566" y="110" width="28" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="598" y="110" width="28" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="630" y="110" width="28" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="548" y="127">]</text><text x="580" y="127">]</text><text x="612" y="127">[</text><text x="644" y="127">[</text>
  </g>
  <g font-size="9.5" fill="#888" text-anchor="middle" filter="url(#sk)">
    <text x="548" y="146">u₁</text><text x="580" y="146">u₂</text><text x="612" y="146">v₁</text><text x="644" y="146">v₂</text>
  </g>
  <text x="593" y="168" text-anchor="middle" font-size="10" fill="#667" filter="url(#sk)">k = 2：两类未匹配数相等</text>
  <text x="593" y="183" text-anchor="middle" font-size="10" fill="#667" filter="url(#sk)">（两种括号总数相等）</text>

  <text x="60" y="212" font-size="11.5" fill="#667" filter="url(#sk)">无论原串多花哨（未匹配括号中间可夹任意平衡段），抵消后只剩一维残形——问题的本质参数只有一个 k。</text>

  <!-- Section 2 -->
  <text x="60" y="248" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">② 首尾配对交换：最左超前 ] ↔ 最右未闭 [，一次交换两处归位</text>

  <text x="346" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">交换 (2, 7)：u₁ ↔ v₂</text>
  <path d="M 221 296 Q 346 254 471 296" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="100" y="300" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="300" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="200" y="300" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <rect x="250" y="300" width="42" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="300" y="300" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="350" y="300" width="42" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="400" y="300" width="42" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="450" y="300" width="42" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" filter="url(#sk)">
    <text x="121" y="322">[</text><text x="171" y="322">]</text><text x="221" y="322">]</text><text x="271" y="322">]</text>
    <text x="321" y="322">[</text><text x="371" y="322">]</text><text x="421" y="322">[</text><text x="471" y="322">[</text>
  </g>
  <g font-size="9.5" text-anchor="middle" filter="url(#sk)">
    <text x="221" y="346" fill="#b85450" font-weight="bold">变 [</text>
    <text x="471" y="346" fill="#d6a040" font-weight="bold">变 ]</text>
  </g>
  <path d="M 150 342 L 150 360" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- result row -->
  <text x="62" y="390" font-size="12" fill="#2f5d25" font-weight="bold" filter="url(#sk)">交换后</text>
  <g filter="url(#sk)">
    <rect x="100" y="368" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="150" y="368" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="200" y="368" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="250" y="368" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="300" y="368" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="350" y="368" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="400" y="368" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="450" y="368" width="42" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="15" fill="#2f5d25" text-anchor="middle" filter="url(#sk)">
    <text x="121" y="390">[</text><text x="171" y="390">]</text><text x="221" y="390">[</text><text x="271" y="390">]</text>
    <text x="321" y="390">[</text><text x="371" y="390">]</text><text x="421" y="390">[</text><text x="471" y="390">]</text>
  </g>
  <g fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#sk)">
    <path d="M 121 364 Q 146 346 171 364"/>
    <path d="M 221 364 Q 246 346 271 364"/>
    <path d="M 321 364 Q 346 346 371 364"/>
    <path d="M 421 364 Q 446 346 471 364"/>
  </g>
  <text x="540" y="382" font-size="11" fill="#667" filter="url(#sk)">新 [（原 u₁）与相邻超前 ] 配对，</text>
  <text x="540" y="398" font-size="11" fill="#667" filter="url(#sk)">新 ]（原 v₂）与未闭 [ 配对</text>

  <text x="100" y="424" font-size="11.5" fill="#8a6d2f" filter="url(#sk)">k：2 → 0，一次交换即平衡；一般地每轮 k −= 2（k 为奇数时最后一轮剩一对 ][，交换即成）。</text>

  <!-- conclusion -->
  <g filter="url(#sk)"><rect x="70" y="438" width="540" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="340" y="461" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d25" filter="url(#sk)">答案 = ⌈k/2⌉ = (k+1)/2：一次交换的杠杆率是 2（同时修两处）</text>
  <text x="340" y="482" text-anchor="middle" font-size="11" fill="#3d6b31" filter="url(#sk)">下界：前缀盈余每次交换至多降 2；上界：首尾配对构造恰好达到 ⌈k/2⌉ 次</text>
</svg>
