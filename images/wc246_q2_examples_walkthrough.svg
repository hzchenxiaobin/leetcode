<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：三组样例的网格走查</text>
  <path d="M 180 42 Q 340 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Row 1: 12:01 -> 12:44 -->
  <text x="40" y="96" font-size="12.5" font-weight="bold" fill="#2b2b2b" font-family="monospace">示例① 12:01 → 12:44</text>
  <g filter="url(#sk)">
    <rect x="170" y="76" width="80" height="40" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <rect x="250" y="76" width="80" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="330" y="76" width="80" height="40" rx="4" fill="#f2f2f0" stroke="#999999" stroke-width="1.4"/>
    <line x1="175" y1="70" x2="175" y2="118" stroke="#b85450" stroke-width="2"/>
    <line x1="404" y1="70" x2="404" y2="118" stroke="#4a8edb" stroke-width="2"/>
    <line x1="170" y1="116" x2="170" y2="122" stroke="#888" stroke-width="1.2"/>
    <line x1="250" y1="116" x2="250" y2="122" stroke="#888" stroke-width="1.2"/>
    <line x1="330" y1="116" x2="330" y2="122" stroke="#888" stroke-width="1.2"/>
    <line x1="410" y1="116" x2="410" y2="122" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="210" y="101" text-anchor="middle" font-size="13" fill="#b03a3a">✗</text>
  <text x="290" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">✓</text>
  <text x="370" y="101" text-anchor="middle" font-size="13" fill="#b03a3a">✗</text>
  <text x="175" y="64" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b03a3a" font-family="monospace">12:01</text>
  <text x="404" y="64" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">12:44</text>
  <text x="170" y="134" text-anchor="middle" font-size="9.5" fill="#555" font-family="monospace">12:00</text>
  <text x="250" y="134" text-anchor="middle" font-size="9.5" fill="#555" font-family="monospace">12:15</text>
  <text x="330" y="134" text-anchor="middle" font-size="9.5" fill="#555" font-family="monospace">12:30</text>
  <text x="410" y="134" text-anchor="middle" font-size="9.5" fill="#555" font-family="monospace">12:45</text>
  <g filter="url(#sk)">
    <rect x="440" y="72" width="210" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="545" y="92" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">⌈721/15⌉ = 49   ⌊764/15⌋ = 50</text>
  <text x="545" y="113" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">50 − 49 = 1 ✓</text>
  <g filter="url(#sk)">
    <line x1="40" y1="152" x2="640" y2="152" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Row 2: 20:00 -> 06:00 overnight -->
  <text x="40" y="211" font-size="12.5" font-weight="bold" fill="#2b2b2b" font-family="monospace">示例② 20:00 → 06:00（通宵）</text>
  <g filter="url(#sk)">
    <rect x="170" y="192" width="240" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <line x1="266" y1="186" x2="266" y2="220" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3"/>
    <line x1="170" y1="214" x2="170" y2="228" stroke="#888" stroke-width="1.2"/>
    <line x1="266" y1="214" x2="266" y2="228" stroke="#888" stroke-width="1.2"/>
    <line x1="410" y1="214" x2="410" y2="228" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="218" y="207" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">16 局</text>
  <text x="338" y="207" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">24 局</text>
  <text x="266" y="180" text-anchor="middle" font-size="9.5" fill="#b03a3a" font-family="monospace">24:00 ≡ 次日 00:00（+1440）</text>
  <text x="170" y="242" text-anchor="middle" font-size="9.5" fill="#555" font-family="monospace">20:00</text>
  <text x="266" y="242" text-anchor="middle" font-size="9.5" fill="#555" font-family="monospace">24:00</text>
  <text x="410" y="242" text-anchor="middle" font-size="9.5" fill="#555" font-family="monospace">06:00</text>
  <g filter="url(#sk)">
    <rect x="440" y="188" width="210" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="545" y="208" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">360 &lt; 1200 → f = 1800</text>
  <text x="545" y="229" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">120 − 80 = 40 ✓</text>
  <g filter="url(#sk)">
    <line x1="40" y1="262" x2="640" y2="262" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Row 3: 00:00 -> 23:59 -->
  <text x="40" y="316" font-size="12.5" font-weight="bold" fill="#2b2b2b" font-family="monospace">示例③ 00:00 → 23:59</text>
  <g filter="url(#sk)">
    <rect x="170" y="298" width="237" height="22" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="407" y="298" width="3" height="22" fill="#fdecea" stroke="#b85450" stroke-width="1.2"/>
    <line x1="409.5" y1="292" x2="409.5" y2="322" stroke="#4a8edb" stroke-width="1.8"/>
    <line x1="170" y1="320" x2="170" y2="330" stroke="#888" stroke-width="1.2"/>
    <line x1="230" y1="320" x2="230" y2="330" stroke="#888" stroke-width="1.2"/>
    <line x1="290" y1="320" x2="290" y2="330" stroke="#888" stroke-width="1.2"/>
    <line x1="350" y1="320" x2="350" y2="330" stroke="#888" stroke-width="1.2"/>
    <line x1="410" y1="320" x2="410" y2="330" stroke="#888" stroke-width="1.2"/>
    <path d="M 370 291 L 400 296" stroke="#b03a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="298" y="288" text-anchor="middle" font-size="9.5" fill="#b03a3a" font-family="monospace">23:59 早退 → [23:45,24:00] 作废 ✗</text>
  <text x="409" y="286" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">23:59</text>
  <text x="170" y="344" text-anchor="middle" font-size="9.5" fill="#555" font-family="monospace">00:00</text>
  <text x="230" y="344" text-anchor="middle" font-size="9.5" fill="#555" font-family="monospace">06:00</text>
  <text x="290" y="344" text-anchor="middle" font-size="9.5" fill="#555" font-family="monospace">12:00</text>
  <text x="350" y="344" text-anchor="middle" font-size="9.5" fill="#555" font-family="monospace">18:00</text>
  <text x="410" y="344" text-anchor="middle" font-size="9.5" fill="#555" font-family="monospace">24:00</text>
  <g filter="url(#sk)">
    <rect x="440" y="294" width="210" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="545" y="314" text-anchor="middle" font-size="10.5" fill="#333" font-family="monospace">⌈0/15⌉ = 0   ⌊1439/15⌋ = 95</text>
  <text x="545" y="335" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">95 − 0 = 95 ✓</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="40" y="366" width="600" height="56" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="340" y="388" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">变体走查：12:01 → 12:10 同一刻钟内，48 − 49 = −1 → max(0,·) = 0</text>
  <text x="340" y="407" text-anchor="middle" font-size="11" fill="#444">同日 / 通宵两种会话被同一公式统一处理，全程整数运算无浮点</text>
</svg>
