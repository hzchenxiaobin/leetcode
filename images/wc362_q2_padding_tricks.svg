<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">凑时间两板斧：拆步 +1、踱步 +2；同格 t = 1 唯一例外</text>

  <path d="M 280 48 V 350" stroke="#ddd" stroke-width="1" stroke-dasharray="5 5" filter="url(#rough2)"/>
  <path d="M 20 200 H 540" stroke="#ddd" stroke-width="1" stroke-dasharray="5 5" filter="url(#rough2)"/>

  <!-- 面板 A：斜 → 横 + 竖 -->
  <text x="20" y="64" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">① +1 拆步：斜 = 横 + 竖</text>
  <path d="M 55 78 H 127 M 55 114 H 127 M 55 150 H 127 M 55 78 V 150 M 91 78 V 150 M 127 78 V 150"
        stroke="#c8c8c8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 73 132 L 109 96" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="84" y="106" font-size="10" fill="#999" filter="url(#rough2)">1 步</text>
  <path d="M 73 132 L 109 132" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 109 132 L 109 96" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="120" y="120" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2 步</text>
  <text x="91" y="172" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">时长 +1，起终点不变</text>

  <!-- 面板 B：横 → 斜 + 竖回 -->
  <text x="300" y="64" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">② +1 拆步：横 = 斜 + 竖回</text>
  <path d="M 335 78 H 407 M 335 114 H 407 M 335 150 H 407 M 335 78 V 150 M 371 78 V 150 M 407 78 V 150"
        stroke="#c8c8c8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 353 132 L 389 132" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="362" y="126" font-size="10" fill="#999" filter="url(#rough2)">1 步</text>
  <path d="M 353 132 L 389 96" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 389 96 L 389 132" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="398" y="116" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2 步</text>
  <text x="371" y="172" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">时长 +1，起终点不变</text>

  <!-- 面板 C：+2 踱步 -->
  <text x="20" y="224" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">③ +2 踱步：去邻格再回来</text>
  <path d="M 55 238 H 127 M 55 274 H 127 M 55 238 V 274 M 91 238 V 274 M 127 238 V 274"
        stroke="#c8c8c8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 73 256 L 109 256" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 109 264 Q 91 280 73 264" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="91" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">去 + 回 = +2 秒</text>
  <text x="91" y="314" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">随时可用，想加几次加几次</text>

  <!-- 面板 D：同格例外 -->
  <text x="300" y="224" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">④ 例外：同格（d = 0）</text>
  <path d="M 335 238 H 407 M 335 274 H 407 M 335 310 H 407 M 335 238 V 310 M 371 238 V 310 M 407 238 V 310"
        stroke="#c8c8c8" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <rect x="335" y="274" width="36" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="353" y="297" text-anchor="middle" font-size="11" font-weight="bold" fill="#b27a10" filter="url(#rough2)">S=F</text>
  <path d="M 353 292 L 389 292" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="296" font-size="11" fill="#b85450" filter="url(#rough2)">t=1 ✗</text>
  <text x="371" y="330" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">t = 1：被迫离家，必在某个邻格</text>
  <text x="371" y="348" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">t = 0 ✓ 原地；t ≥ 2 ✓ 去回 / 三角 +2</text>

  <!-- 底部结论 -->
  <rect x="95" y="358" width="370" height="36" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="381" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">异格：t ≥ d 全部可达；同格：t ≠ 1 即可达</text>
</svg>
