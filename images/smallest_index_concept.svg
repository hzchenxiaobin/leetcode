<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：i mod 10 = 下标的个位数</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- condition box -->
  <g filter="url(#sk)">
    <rect x="170" y="60" width="300" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="84" text-anchor="middle" font-size="14" fill="#2b6e9e" font-weight="bold">命中条件：i mod 10 == nums[i]</text>

  <!-- example: i = 12 -->
  <text x="320" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">例：i = 12，只看个位数字 2</text>

  <!-- index digits -->
  <g filter="url(#sk)">
    <rect x="210" y="145" width="46" height="46" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="256" y="145" width="46" height="46" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="233" y="175" text-anchor="middle" font-size="20" fill="#888" font-weight="bold">1</text>
  <text x="279" y="175" text-anchor="middle" font-size="20" fill="#b07020" font-weight="bold">2</text>
  <text x="233" y="205" text-anchor="middle" font-size="10" fill="#999">十位（忽略）</text>
  <text x="279" y="205" text-anchor="middle" font-size="10" fill="#b07020">个位 = 12 mod 10</text>

  <!-- arrow to compare -->
  <path d="M 314 168 L 368 168" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- nums box -->
  <g filter="url(#sk)">
    <rect x="374" y="140" width="160" height="56" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="454" y="162" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">nums[12] == 2 ?</text>
  <text x="454" y="182" text-anchor="middle" font-size="11" fill="#2e6e2e">相等 → 下标 12 命中</text>

  <!-- two notes -->
  <g filter="url(#sk)">
    <rect x="40" y="240" width="280" height="72" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="180" y="264" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">i &lt; 10 时：i mod 10 = i</text>
  <text x="180" y="284" text-anchor="middle" font-size="11.5" fill="#557">条件退化为 nums[i] == i</text>
  <text x="180" y="302" text-anchor="middle" font-size="11.5" fill="#557">如 i=3 只看 nums[3] 是否等于 3</text>

  <g filter="url(#sk)">
    <rect x="344" y="240" width="260" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="474" y="264" text-anchor="middle" font-size="12.5" fill="#a04040" font-weight="bold">值域对齐，直接比较</text>
  <text x="474" y="284" text-anchor="middle" font-size="11.5" fill="#855">i mod 10 ∈ [0,9]，nums[i] ∈ [0,9]</text>
  <text x="474" y="302" text-anchor="middle" font-size="11.5" fill="#855">两边都是一位数字，无溢出/类型问题</text>

  <text x="320" y="340" text-anchor="middle" font-size="11" fill="#888">n ≤ 100 → 下标最大 99，个位数字循环 0~9。</text>
</svg>
