<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">换根观察：根越过边 (p,v)，只有两条猜测翻转</text>

  <!-- 左图：根在 p -->
  <text x="130" y="66" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">根在 p（v 是 p 的孩子）</text>
  <rect x="104" y="82" width="52" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="102" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">p</text>
  <rect x="104" y="156" width="52" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="176" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">v</text>
  <path d="M 130 112 L 130 152" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="170" y="140" font-size="12" fill="#4a7a3a" filter="url(#rough2)">猜测 (p,v)：真 ✓</text>
  <text x="170" y="160" font-size="12" fill="#b85450" filter="url(#rough2)">猜测 (v,p)：假 ✗</text>

  <!-- 右图：根在 v -->
  <text x="390" y="66" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">根移到 v（p 变成 v 的孩子）</text>
  <rect x="364" y="82" width="52" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="102" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">v</text>
  <rect x="364" y="156" width="52" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="176" text-anchor="middle" font-size="14" fill="#7a5a10" filter="url(#rough2)">p</text>
  <path d="M 390 152 L 390 116" stroke="#d6a040" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="230" y="222" font-size="12" fill="#b85450" filter="url(#rough2)">猜测 (p,v)：假 ✗</text>
  <text x="230" y="242" font-size="12" fill="#4a7a3a" filter="url(#rough2)">猜测 (v,p)：真 ✓</text>

  <path d="M 258 128 L 320 128" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="289" y="118" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">跨越一条边</text>

  <!-- 不变部分 -->
  <ellipse cx="150" cy="288" rx="72" ry="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="150" y="284" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">其余节点</text>
  <text x="150" y="300" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">父子关系全部不变</text>
  <text x="266" y="288" font-size="13" fill="#333" filter="url(#rough2)">→ 其余 m−{0,1,2} 条猜测</text>
  <text x="266" y="306" font-size="13" fill="#4a7a3a" filter="url(#rough2)">真假保持原样，不用重算！</text>
</svg>
