<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 378"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="378" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1 倒序演算（n = 3）：四次「首见收割」</text>

  <!-- 表头 -->
  <rect x="12" y="36" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="54" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">倒序步</text>
  <rect x="68" y="36" width="96" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="116" y="54" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">查询</text>
  <rect x="164" y="36" width="88" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="208" y="54" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">判定</text>
  <rect x="252" y="36" width="112" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="308" y="54" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">收割贡献</text>
  <rect x="364" y="36" width="64" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="396" y="54" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">已见行</text>
  <rect x="428" y="36" width="64" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="460" y="54" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">已见列</text>
  <rect x="492" y="36" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="516" y="54" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">累计</text>

  <!-- 第 1 行：[1,0,4] 列操作 -->
  <rect x="12" y="64" width="56" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">步①</text>
  <rect x="68" y="64" width="96" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="116" y="94" text-anchor="middle" font-size="12.5" fill="#2c4360" filter="url(#rough2)">[1,0,4]</text>
  <rect x="164" y="64" width="88" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="208" y="94" text-anchor="middle" font-size="12" fill="#2c4360" filter="url(#rough2)">列 0 首见</text>
  <rect x="252" y="64" width="112" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="308" y="94" text-anchor="middle" font-size="12" fill="#2c4360" filter="url(#rough2)">4×(3−0) = 12</text>
  <rect x="364" y="64" width="64" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="396" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <rect x="428" y="64" width="64" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="460" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{0}</text>
  <rect x="492" y="64" width="48" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="516" y="94" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">12</text>

  <!-- 第 2 行：[0,2,3] 行操作 -->
  <rect x="12" y="116" width="56" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">步②</text>
  <rect x="68" y="116" width="96" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="116" y="146" text-anchor="middle" font-size="12.5" fill="#2f5423" filter="url(#rough2)">[0,2,3]</text>
  <rect x="164" y="116" width="88" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="208" y="146" text-anchor="middle" font-size="12" fill="#2f5423" filter="url(#rough2)">行 2 首见</text>
  <rect x="252" y="116" width="112" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="308" y="146" text-anchor="middle" font-size="12" fill="#2f5423" filter="url(#rough2)">3×(3−1) = 6</text>
  <rect x="364" y="116" width="64" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="396" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{2}</text>
  <rect x="428" y="116" width="64" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="460" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{0}</text>
  <rect x="492" y="116" width="48" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="516" y="146" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">18</text>

  <!-- 第 3 行：[1,2,2] 列操作 -->
  <rect x="12" y="168" width="56" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">步③</text>
  <rect x="68" y="168" width="96" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="116" y="198" text-anchor="middle" font-size="12.5" fill="#2c4360" filter="url(#rough2)">[1,2,2]</text>
  <rect x="164" y="168" width="88" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="208" y="198" text-anchor="middle" font-size="12" fill="#2c4360" filter="url(#rough2)">列 2 首见</text>
  <rect x="252" y="168" width="112" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="308" y="198" text-anchor="middle" font-size="12" fill="#2c4360" filter="url(#rough2)">2×(3−1) = 4</text>
  <rect x="364" y="168" width="64" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="396" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{2}</text>
  <rect x="428" y="168" width="64" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="460" y="198" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{0,2}</text>
  <rect x="492" y="168" width="48" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="516" y="198" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">22</text>

  <!-- 第 4 行：[0,0,1] 行操作 -->
  <rect x="12" y="220" width="56" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">步④</text>
  <rect x="68" y="220" width="96" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="116" y="250" text-anchor="middle" font-size="12.5" fill="#2f5423" filter="url(#rough2)">[0,0,1]</text>
  <rect x="164" y="220" width="88" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="208" y="250" text-anchor="middle" font-size="12" fill="#2f5423" filter="url(#rough2)">行 0 首见</text>
  <rect x="252" y="220" width="112" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="308" y="250" text-anchor="middle" font-size="12" fill="#2f5423" filter="url(#rough2)">1×(3−2) = 1</text>
  <rect x="364" y="220" width="64" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="396" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{0,2}</text>
  <rect x="428" y="220" width="64" height="52" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="460" y="250" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{0,2}</text>
  <rect x="492" y="220" width="48" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="516" y="250" text-anchor="middle" font-size="12.5" fill="#8a2f2c" font-weight="bold" filter="url(#rough2)">23</text>

  <!-- 底部结论 -->
  <rect x="12" y="288" width="528" height="30" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">收割数 = val × (n − 对偶已见数)：只数还没被更晚书写占领的格子</text>

  <rect x="130" y="330" width="292" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="276" y="352" text-anchor="middle" font-size="13.5" fill="#2f5423" filter="url(#rough2)">合计 12 + 6 + 4 + 1 = 23 ✓</text>
</svg>
