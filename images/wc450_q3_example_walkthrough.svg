<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="450" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 1 演算：起点即传送门，先 0 步传送再走</text>
  <path d="M 120 42 Q 320 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)" stroke="#9aa5b1" stroke-width="1.4">
    <rect x="52" y="78" width="60" height="60" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="112" y="78" width="60" height="60" fill="#ffffff"/>
    <rect x="172" y="78" width="60" height="60" fill="#ffffff"/>
    <rect x="52" y="138" width="60" height="60" fill="#ffffff"/>
    <rect x="112" y="138" width="60" height="60" fill="#e8f0fe" stroke="#4a8edb" stroke-width="2"/>
    <rect x="172" y="138" width="60" height="60" fill="#ffffff"/>
    <rect x="52" y="198" width="60" height="60" fill="#ffffff"/>
    <rect x="112" y="198" width="60" height="60" fill="#ffffff"/>
    <rect x="172" y="198" width="60" height="60" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#2b6e9e">
    <text x="82" y="113">A</text>
    <text x="142" y="173">A</text>
    <text x="202" y="173">.</text>
    <text x="82" y="173">.</text>
    <text x="202" y="113">.</text>
    <text x="82" y="233">.</text>
    <text x="142" y="233">.</text>
  </g>
  <text x="202" y="233" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">.</text>
  <g font-size="10" text-anchor="middle" fill="#888" font-family="monospace">
    <text x="82" y="132">d=0 起点</text>
    <text x="142" y="192">d=0</text>
    <text x="202" y="192">d=1</text>
    <text x="142" y="252">d=1</text>
    <text x="202" y="252">d=2 终点</text>
  </g>

  <g filter="url(#sk)">
    <circle cx="248" cy="64" r="17" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
  </g>
  <text x="248" y="69" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">V_A</text>
  <path d="M 88 96 Q 160 44 233 62" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#sk)"/>
  <path d="M 262 72 Q 210 120 168 156" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#sk)"/>
  <text x="150" y="52" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">传送 0 步：(0,0)→V_A→(1,1)</text>

  <path d="M 176 168 Q 186 162 196 168" stroke="#4a8e4a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="186" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">1 步</text>
  <path d="M 202 176 Q 208 186 202 196" stroke="#4a8e4a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="226" y="188" text-anchor="start" font-size="11" font-weight="bold" fill="#2e6e2e">1 步</text>

  <g filter="url(#sk)">
    <rect x="286" y="78" width="338" height="180" rx="10" fill="#f4f8fd" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="455" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">0-1 BFS 过程（deque）</text>

  <g font-size="11.5" fill="#444">
    <text x="302" y="130">① dist[(0,0)]=0 入队；弹出后是 'A'：</text>
    <text x="318" y="148">经 V_A 把 (1,1) 定为 0，插队首</text>
    <text x="302" y="174">② 弹出 (1,1)（d=0），步行扩展：</text>
    <text x="318" y="192">(1,2)、(2,1) → d=1，压队尾</text>
    <text x="302" y="218">③ 弹出 (1,2)（d=1），扩展 (2,2)：</text>
    <text x="318" y="236">d=2 ✓ 到达终点，答案 2</text>
  </g>

  <g filter="url(#sk)">
    <rect x="52" y="278" width="572" height="34" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="338" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">答案 = dist[(2,2)] = 2；不传送则要绕曼哈顿距离 4 步，传送免费省下 2 步</text>

  <g filter="url(#sk)">
    <rect x="52" y="322" width="572" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="338" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">易错点：普通队列跑不了 0 权边</text>
  <text x="338" y="366" text-anchor="middle" font-size="11" fill="#555">0 权（传送）必须插队首，1 权（步行）进队尾，才能保证出队距离单调不减</text>
</svg>
