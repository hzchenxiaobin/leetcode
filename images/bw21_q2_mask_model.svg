<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">5 个元音的奇偶 → 5 位掩码，只关心「奇偶性」</text>

  <!-- 元音到位的映射 -->
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="60" y="78">a</text>
    <text x="110" y="78">e</text>
    <text x="160" y="78">i</text>
    <text x="210" y="78">o</text>
    <text x="260" y="78">u</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="44" y="90" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="94" y="90" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="144" y="90" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="194" y="90" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="244" y="90" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#2b4a6b" text-anchor="middle">
    <text x="61" y="110">2⁰</text>
    <text x="111" y="110">2¹</text>
    <text x="161" y="110">2²</text>
    <text x="211" y="110">2³</text>
    <text x="261" y="110">2⁴</text>
  </g>
  <text x="153" y="146" font-size="12" fill="#446688" filter="url(#rough2)" text-anchor="middle">mask 共 2⁵ = 32 种取值</text>
  <path d="M 300 105 C 330 105, 340 105, 366 105" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- XOR 演算：s = "eleetminicoworoep" 的前几个前缀 -->
  <text x="452" y="72" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">前缀掩码演算</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="452" y="96">e → 00010₂ = 2</text>
    <text x="452" y="116">l → 00010₂ = 2（辅音不变）</text>
    <text x="452" y="136">e → 00000₂ = 0（偶数个 e）</text>
    <text x="452" y="156">e → 00010₂ = 2</text>
    <text x="452" y="176">t → 00010₂ = 2</text>
  </g>
  <rect x="340" y="84" width="222" height="102" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>

  <!-- 同掩码配对 -->
  <text x="280" y="216" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)" text-anchor="middle">核心观察：两个前缀掩码相同 ⇔ 中间子串所有元音偶数次</text>

  <!-- 数轴示意 -->
  <g filter="url(#rough2)">
    <line x1="80" y1="266" x2="480" y2="266" stroke="#446688" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="120" cy="266" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="240" cy="266" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
    <circle cx="380" cy="266" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="120" y="292">前缀 P₀</text>
    <text x="240" y="292">前缀 Pᵢ</text>
    <text x="380" y="292">前缀 Pⱼ</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 240 252 C 280 236, 340 236, 380 252" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4"/>
  </g>
  <text x="310" y="238" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)" text-anchor="middle">mask(Pᵢ) = mask(Pⱼ)</text>

  <rect x="70" y="310" width="420" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="13.5" fill="#2d5a22" filter="url(#rough2)">子串 (i, j] 内每个元音偶数次 → 长度 j − i，找同掩码最远配对</text>
</svg>
