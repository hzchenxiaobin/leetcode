<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="84"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">最左与最右蜡烛之间的盘子才有效</text>

  <!-- 字符串格子 s = **|**|***| -->
  <g filter="url(#rough2)">
    <rect x="70" y="50" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="110" y="50" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="150" y="50" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="190" y="50" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="230" y="50" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="270" y="50" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <rect x="310" y="50" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="350" y="50" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="390" y="50" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="430" y="50" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <text x="90" y="76">*</text><text x="130" y="76">*</text><text x="170" y="76" fill="#8a3a34" font-weight="bold">|</text>
    <text x="210" y="76">*</text><text x="250" y="76">*</text><text x="290" y="76" fill="#8a3a34" font-weight="bold">|</text>
    <text x="330" y="76">*</text><text x="370" y="76">*</text><text x="410" y="76">*</text>
    <text x="450" y="76" fill="#8a3a34" font-weight="bold">|</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#666" text-anchor="middle">
    <text x="90" y="106">0</text><text x="130" y="106">1</text><text x="170" y="106">2</text>
    <text x="210" y="106">3</text><text x="250" y="106">4</text><text x="290" y="106">5</text>
    <text x="330" y="106">6</text><text x="370" y="106">7</text><text x="410" y="106">8</text>
    <text x="450" y="106">9</text>
  </g>

  <!-- 查询 [2,5] 高亮 -->
  <g filter="url(#rough2)">
    <path d="M 148 120 C 148 138, 292 138, 292 122" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrB)"/>
    <path d="M 292 120 C 292 140, 148 140, 148 122" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrB)"/>
  </g>
  <text x="220" y="160" font-size="12" fill="#2d5a22" font-weight="bold" filter="url(#rough2)" text-anchor="middle">查询 [2,5]：a = 2，b = 5</text>

  <!-- 有效/无效盘子标注 -->
  <g filter="url(#rough2)">
    <path d="M 90 92 L 90 128" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3"/>
    <path d="M 130 92 L 130 128" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>
  <text x="110" y="150" font-size="11" fill="#999" filter="url(#rough2)" text-anchor="middle">区间外的盘子不计</text>
  <g filter="url(#rough2)">
    <path d="M 210 96 C 210 172, 250 172, 250 96" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="230" y="192" font-size="12" fill="#2d5a22" font-weight="bold" filter="url(#rough2)" text-anchor="middle">(a,b) 内 2 个盘子 → 答案 2</text>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="60" y="212" width="440" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#33506e" text-anchor="middle">
    <text x="280" y="236" font-weight="bold">有效盘子 ⇔ a &lt; p &lt; b（a 为最左、b 为最右蜡烛）</text>
    <text x="280" y="258">a 左侧的盘子左边无蜡烛；b 右侧的盘子右边无蜡烛</text>
  </g>

  <!-- 无蜡烛情形 -->
  <g filter="url(#rough2)">
    <rect x="60" y="290" width="440" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#8a3a34" text-anchor="middle">
    <text x="280" y="312" font-weight="bold">蜡烛不足两支（a ≥ b）：答案 0</text>
    <text x="280" y="332">包括整段无蜡烛、只有一支蜡烛等情形</text>
  </g>
</svg>
