<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="223"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：nums1 = [1,2,3]，nums2 = [1,2,3]，x = 4</text>

  <!-- dp 表 -->
  <g filter="url(#rough2)">
    <text x="60" y="60" font-size="12.5" fill="#555">排序后顺序不变（nums2 已升序）。dp[i][j] 的演化：</text>
    <text x="66" y="88" font-size="12" fill="#446688">i=1（a=1, b=1）：</text>
    <text x="200" y="88" font-size="12.5" fill="#333">dp[1][1] = 1 + 1×1 = 2</text>

    <text x="66" y="112" font-size="12" fill="#446688">i=2（a=2, b=2）：</text>
    <text x="200" y="112" font-size="12.5" fill="#333">dp[2][1] = max(2, 2+1×2) = 4</text>
    <text x="200" y="132" font-size="12.5" fill="#333">dp[2][2] = dp[1][1] + 2 + 2×2 = 8</text>

    <text x="66" y="160" font-size="12" fill="#446688">i=3（a=3, b=3）：</text>
    <text x="200" y="160" font-size="12.5" fill="#333">dp[3][1] = max(4, 3+1×3) = 6</text>
    <text x="200" y="180" font-size="12.5" fill="#333">dp[3][2] = max(8, dp[2][1]+3+2×3) = 13</text>
    <text x="200" y="200" font-size="12.5" fill="#333">dp[3][3] = dp[2][2] + 3 + 3×3 = 20</text>
  </g>

  <!-- 枚举 t -->
  <g filter="url(#rough2)">
    <rect x="36" y="220" width="448" height="98" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.5"/>
    <text x="60" y="246" font-size="12.5" fill="#8a6d1f">S₁ = 6，S₂ = 6，逐 t 判定 S₁ + t·S₂ − dp[n][t] ≤ x = 4：</text>
    <text x="66" y="272" font-size="12" fill="#555">t=0：6 − 0 = 6 &gt; 4 ✗　　t=1：6+6−6 = 6 &gt; 4 ✗</text>
    <text x="66" y="294" font-size="12" fill="#555">t=2：6+12−13 = 5 &gt; 4 ✗　　t=3：6+18−20 = 4 ≤ 4 ✓</text>
    <text x="66" y="314" font-size="13" fill="#4a7a3a">答案 = 3（对应第 1、2、3 秒分别清零下标 0、1、2）</text>
  </g>
</svg>
