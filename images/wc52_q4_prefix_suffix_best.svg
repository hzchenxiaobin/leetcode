<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">前后缀最值：左右端点各自 O(1) 查询</text>
  <text x="310" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">left[i] = [0, i] 内 w 最大的最小下标；right[i] = [i, m−1] 内 w 最大的最小下标</text>

  <text x="104" y="97" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">w 窗口和</text>
  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="116" y="74" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="142" y="96" font-size="11.5" fill="#33455f">3</text>
    <rect x="172" y="74" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="198" y="96" font-size="11.5" fill="#33455f">3</text>
    <rect x="228" y="74" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="254" y="96" font-size="11.5" fill="#33455f">3</text>
    <rect x="284" y="74" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="310" y="96" font-size="12" fill="#8a6a20" font-weight="bold">8</text>
    <rect x="340" y="74" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="366" y="96" font-size="11.5" fill="#33455f">13</text>
    <rect x="396" y="74" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="422" y="96" font-size="11.5" fill="#33455f">12</text>
    <rect x="452" y="74" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="478" y="96" font-size="11.5" fill="#33455f">6</text>
  </g>
  <text x="310" y="70" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">j = 3</text>

  <text x="104" y="185" text-anchor="end" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">left[i]</text>
  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="116" y="162" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="142" y="184" font-size="11.5" fill="#3a5a30">0</text>
    <rect x="172" y="162" width="52" height="34" fill="#d7ecdb" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="198" y="184" font-size="12" fill="#2f5a24" font-weight="bold">0</text>
    <rect x="228" y="162" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="254" y="184" font-size="11.5" fill="#3a5a30">0</text>
    <rect x="284" y="162" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="310" y="184" font-size="11.5" fill="#3a5a30">3</text>
    <rect x="340" y="162" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="366" y="184" font-size="11.5" fill="#3a5a30">4</text>
    <rect x="396" y="162" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="422" y="184" font-size="11.5" fill="#3a5a30">4</text>
    <rect x="452" y="162" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="478" y="184" font-size="11.5" fill="#3a5a30">4</text>
  </g>
  <text x="198" y="158" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">j − k = 1</text>

  <text x="104" y="269" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">right[i]</text>
  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="116" y="246" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="142" y="268" font-size="11.5" fill="#8a3a36">4</text>
    <rect x="172" y="246" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="198" y="268" font-size="11.5" fill="#8a3a36">4</text>
    <rect x="228" y="246" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="254" y="268" font-size="11.5" fill="#8a3a36">4</text>
    <rect x="284" y="246" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="310" y="268" font-size="11.5" fill="#8a3a36">4</text>
    <rect x="340" y="246" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="366" y="268" font-size="11.5" fill="#8a3a36">4</text>
    <rect x="396" y="246" width="52" height="34" fill="#f5d3d9" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="422" y="268" font-size="12" fill="#7a2f2b" font-weight="bold">5</text>
    <rect x="452" y="246" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="478" y="268" font-size="11.5" fill="#8a3a36">6</text>
  </g>
  <text x="422" y="242" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">j + k = 5</text>

  <rect x="52" y="296" width="516" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="70" y="318" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">total(j = 3) = w[left[j−k]] + w[j] + w[right[j+k]]</text>
  <text x="70" y="340" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">= w[left[1]] + w[3] + w[right[5]] = w[0] + w[3] + w[5] = 3 + 8 + 12 = 23</text>

  <text x="310" y="376" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">left 单调不减、right 单调不增，各用一次正/反向扫描即可 O(m) 求出</text>
</svg>
