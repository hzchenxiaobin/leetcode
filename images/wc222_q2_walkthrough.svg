<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="720" height="500" fill="#fdfcf7"/>
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：[1, 1, 1, 3, 3, 3, 7] 的一次遍历</text>
  <text x="360" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">表中永远只放「更早下标」的元素 → 每对 (i &lt; j) 恰好被数一次（只列命中的目标）</text>

  <!-- 高亮行（第 6 行） -->
  <g filter="url(#sk)">
    <rect x="40" y="338" width="640" height="40" fill="#fff8e1"/>
  </g>

  <!-- 表格外框与表头 -->
  <g filter="url(#sk)">
    <rect x="40" y="72" width="640" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="55" y="89" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">j</text>
  <text x="87" y="89" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">d</text>
  <text x="250" y="89" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">查表命中：2^k − d 找到更早元素</text>
  <text x="485" y="89" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">处理后哈希表</text>
  <text x="627" y="89" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a4a6a" filter="url(#sk)">ans</text>

  <!-- 行分隔线 -->
  <g filter="url(#sk)" stroke="#c8d0dc" stroke-width="1">
    <path d="M 40,138 L 680,138" fill="none"/>
    <path d="M 40,178 L 680,178" fill="none"/>
    <path d="M 40,218 L 680,218" fill="none"/>
    <path d="M 40,258 L 680,258" fill="none"/>
    <path d="M 40,298 L 680,298" fill="none"/>
    <path d="M 40,338 L 680,338" fill="none"/>
    <path d="M 40,378 L 680,378" fill="none"/>
  </g>

  <!-- 列分隔线 -->
  <g filter="url(#sk)" stroke="#c8d0dc" stroke-width="1">
    <path d="M 70,72 L 70,378" fill="none"/>
    <path d="M 105,72 L 105,378" fill="none"/>
    <path d="M 395,72 L 395,378" fill="none"/>
    <path d="M 575,72 L 575,378" fill="none"/>
  </g>

  <!-- 第 0 行 -->
  <text x="55" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">0</text>
  <text x="87" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">1</text>
  <text x="250" y="122" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">表空：22 个目标全部查空</text>
  <text x="485" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">{1: 1}</text>
  <text x="627" y="122" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#sk)">0</text>

  <!-- 第 1 行 -->
  <text x="55" y="162" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">1</text>
  <text x="87" y="162" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">1</text>
  <text x="250" y="162" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">2¹−1 = 1 → cnt[1] = 1 → +1</text>
  <text x="485" y="162" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">{1: 2}</text>
  <text x="627" y="162" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#sk)">1</text>

  <!-- 第 2 行 -->
  <text x="55" y="202" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">2</text>
  <text x="87" y="202" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">1</text>
  <text x="250" y="202" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">2¹−1 = 1 → cnt[1] = 2 → +2</text>
  <text x="485" y="202" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">{1: 3}</text>
  <text x="627" y="202" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#sk)">3</text>

  <!-- 第 3 行 -->
  <text x="55" y="242" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">3</text>
  <text x="87" y="242" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">3</text>
  <text x="250" y="242" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">2²−3 = 1 → cnt[1] = 3 → +3</text>
  <text x="485" y="242" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">{1:3, 3:1}</text>
  <text x="627" y="242" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#sk)">6</text>

  <!-- 第 4 行 -->
  <text x="55" y="282" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">4</text>
  <text x="87" y="282" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">3</text>
  <text x="250" y="282" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">2²−3 = 1 → cnt[1] = 3 → +3</text>
  <text x="485" y="282" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">{1:3, 3:2}</text>
  <text x="627" y="282" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#sk)">9</text>

  <!-- 第 5 行 -->
  <text x="55" y="322" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">5</text>
  <text x="87" y="322" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">3</text>
  <text x="250" y="322" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">2²−3 = 1 → cnt[1] = 3 → +3</text>
  <text x="485" y="322" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#sk)">{1:3, 3:3}</text>
  <text x="627" y="322" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#sk)">12</text>

  <!-- 第 6 行（高亮） -->
  <text x="55" y="362" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">6</text>
  <text x="87" y="362" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">7</text>
  <text x="250" y="362" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">2³−7 = 1 → cnt[1] = 3 → +3</text>
  <text x="485" y="362" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">{1:3, 3:3, 7:1}</text>
  <text x="627" y="362" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk)">15</text>

  <!-- 底部：核对与要点 -->
  <g filter="url(#sk)">
    <rect x="40" y="402" width="400" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="240" y="424" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a4a1a" filter="url(#sk)">分类核对</text>
  <text x="240" y="446" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">3 对 (1,1) ＋ 9 对 (1,3) ＋ 3 对 (1,7) = 15 ✓</text>
  <text x="240" y="468" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">与期望输出一致</text>

  <g filter="url(#sk)">
    <rect x="460" y="402" width="220" height="84" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="570" y="424" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">每步只配「老」元素</text>
  <text x="570" y="444" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">处理 j 时先查 cnt，</text>
  <text x="570" y="462" text-anchor="middle" font-size="10" fill="#333" filter="url(#sk)">随后才把 d 入表</text>
  <text x="570" y="480" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk)">⇒ 不重不漏</text>
</svg>
