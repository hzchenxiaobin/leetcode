<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">CIDR 块 = 起点对齐的 2 的幂区间</text>
  <text x="310" y="49" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">块大小只能是 2^k，且起点必须是 2^k 的整数倍（低 k 位为 0）</text>

  <rect x="24" y="66" width="336" height="234" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="40" y="88" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">末字节 0..15 的可对齐边界</text>

  <g filter="url(#rough2)" font-size="9" text-anchor="middle">
    <rect x="40" y="118" width="16" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="56" y="118" width="16" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="72" y="118" width="16" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="88" y="118" width="16" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="104" y="118" width="16" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="120" y="118" width="16" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="136" y="118" width="16" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="152" y="118" width="16" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="168" y="118" width="16" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="184" y="118" width="16" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="200" y="118" width="16" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="216" y="118" width="16" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="232" y="118" width="16" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="248" y="118" width="16" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="264" y="118" width="16" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="280" y="118" width="16" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <text x="48" y="137" fill="#333">0</text><text x="64" y="137" fill="#333">1</text>
    <text x="80" y="137" fill="#333">2</text><text x="96" y="137" fill="#333">3</text>
    <text x="112" y="137" fill="#333">4</text><text x="128" y="137" fill="#333">5</text>
    <text x="144" y="137" fill="#333">6</text><text x="160" y="137" fill="#333">7</text>
    <text x="176" y="137" fill="#333">8</text><text x="192" y="137" fill="#333">9</text>
    <text x="208" y="137" fill="#333">10</text><text x="224" y="137" fill="#333">11</text>
    <text x="240" y="137" fill="#333">12</text><text x="256" y="137" fill="#333">13</text>
    <text x="272" y="137" fill="#333">14</text><text x="288" y="137" fill="#333">15</text>
  </g>

  <g filter="url(#rough2)" fill="none" stroke="#d6a040" stroke-width="1.4">
    <path d="M 40 166 V 156 H 104 V 166"/>
    <path d="M 40 188 V 178 H 168 V 188"/>
    <path d="M 40 210 V 200 H 296 V 210"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#8a6a20">
    <text x="110" y="166">/30 → 4</text>
    <text x="174" y="188">/29 → 8</text>
    <text x="302" y="210">/28 → 16</text>
  </g>

  <text x="40" y="238" font-size="10" fill="#b85450" filter="url(#rough2)">✗［6, 14) 不是块：起点 6 的 lowbit = 2，越不过 /29 边界</text>
  <text x="40" y="258" font-size="10" fill="#4a7a3a" filter="url(#rough2)">✓［8, 16) 正好是 /29：起点 8 低 3 位全 0</text>
  <text x="40" y="284" font-size="10" fill="#666" filter="url(#rough2)">一般地：s = 2^k ⇒ s ≤ lowbit(起点)，括号长度即块内地址数</text>

  <rect x="366" y="66" width="230" height="234" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="380" y="88" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">两个上限，取较小者</text>
  <text x="380" y="120" font-size="10" fill="#444" filter="url(#rough2)">① 对齐：s ≤ lowbit(c)</text>
  <text x="380" y="144" font-size="10" fill="#444" filter="url(#rough2)">② 数量：s ≤ m</text>
  <text x="380" y="176" font-size="10" fill="#444" filter="url(#rough2)">⇒ s = min( lowbit(c),</text>
  <text x="380" y="196" font-size="10" fill="#444" filter="url(#rough2)">　　　　　2^⌊log₂m⌋ )</text>

  <rect x="378" y="212" width="206" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="232" font-size="10" fill="#3a5a30" filter="url(#rough2)">前缀 p = 32 − log₂(s)</text>
  <text x="390" y="250" font-size="10" fill="#3a5a30" filter="url(#rough2)">等价 s = 2^(32−p)</text>

  <text x="380" y="284" font-size="9" fill="#888" filter="url(#rough2)">c：当前起点　m：剩余地址数</text>

  <text x="310" y="330" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">能取多大，取决于「起点对齐到什么程度」与「还剩多少个地址」这两件事</text>
  <text x="310" y="352" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">c = 0 时 lowbit 记为 2³²（允许 /0）；实际 n ≤ 1000，块大小最多 1024</text>
</svg>
