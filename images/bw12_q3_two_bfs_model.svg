<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：两次 BFS 锁定直径两端</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">从任意点 x 出发的最远点 a，必是某条直径的端点</text>

  <g filter="url(#rough2)" stroke-width="1.6">
    <line x1="280" y1="120" x2="180" y2="170" stroke="#999"/>
    <line x1="280" y1="120" x2="380" y2="170" stroke="#999"/>
    <line x1="180" y1="170" x2="120" y2="230" stroke="#999"/>
    <line x1="180" y1="170" x2="240" y2="230" stroke="#999"/>
    <line x1="380" y1="170" x2="330" y2="230" stroke="#999"/>
    <line x1="120" y1="230" x2="160" y2="290" stroke="#999"/>
    <line x1="330" y1="230" x2="300" y2="290" stroke="#999"/>
    <line x1="330" y1="230" x2="380" y2="290" stroke="#999"/>
    <line x1="280" y1="120" x2="280" y2="70" stroke="#999"/>
  </g>

  <g filter="url(#rough2)">
    <line x1="160" y1="290" x2="380" y2="290" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 5"/>
  </g>

  <g filter="url(#rough2)">
    <circle cx="280" cy="70" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="280" cy="120" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="180" cy="170" r="14" fill="#fff" stroke="#666" stroke-width="1.4"/>
    <circle cx="380" cy="170" r="14" fill="#fff" stroke="#666" stroke-width="1.4"/>
    <circle cx="120" cy="230" r="13" fill="#fff" stroke="#666" stroke-width="1.4"/>
    <circle cx="240" cy="230" r="13" fill="#fff" stroke="#666" stroke-width="1.4"/>
    <circle cx="330" cy="230" r="13" fill="#fff" stroke="#666" stroke-width="1.4"/>
    <circle cx="160" cy="290" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="300" cy="290" r="14" fill="#fff" stroke="#666" stroke-width="1.4"/>
    <circle cx="380" cy="290" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle" font-weight="bold">
    <text x="280" y="66" fill="#8a6a20">x</text>
    <text x="280" y="124" fill="#3a4a66">·</text>
    <text x="160" y="295" fill="#8a3a36">a</text>
    <text x="380" y="295" fill="#8a3a36">b</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 296 66 C 360 70, 420 130, 396 272" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrO)" fill="none"/>
  </g>
  <text x="430" y="130" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">第一次 BFS：</text>
  <text x="430" y="146" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">x 的最远点 a</text>

  <rect x="40" y="322" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="341" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">第二次 BFS：从 a 出发到最远点 b，dist(a,b) = 直径（图中红线）</text>
</svg>
