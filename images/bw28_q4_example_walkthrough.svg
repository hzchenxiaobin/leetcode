<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="353"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：houses = [1,4,8,10,20]，k = 3 → 答案 5</text>

  <!-- 数轴分组方案 -->
  <path d="M 60 90 L 500 90" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="100" cy="90" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="180" cy="90" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="270" cy="90" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="350" cy="90" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="460" cy="90" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text y="116" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="100">1</tspan><tspan x="180">4</tspan><tspan x="270">8</tspan><tspan x="350">10</tspan><tspan x="460">20</tspan></text>
  <g filter="url(#rough2)">
    <rect x="132" y="52" width="24" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="258" y="52" width="24" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="388" y="52" width="24" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
  </g>
  <text y="72" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)"><tspan x="144">M1</tspan><tspan x="270">M2</tspan><tspan x="400">M3</tspan></text>
  <text x="144" y="132" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">代价 3</text>
  <text x="270" y="132" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">代价 0</text>
  <text x="405" y="132" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">代价 2</text>

  <!-- dp 表 -->
  <text x="60" y="170" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">dp 演算（行 = 邮筒数 m，列 = 前 i 栋房子）：</text>
  <g filter="url(#rough2)">
    <rect x="150" y="182" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="220" y="182" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="290" y="182" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="360" y="182" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="430" y="182" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <text y="203" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="185">3</tspan><tspan x="255">7</tspan><tspan x="325">7</tspan><tspan x="395">9</tspan><tspan x="465">25</tspan></text>
  <text x="90" y="203" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">m=1</text>

  <g filter="url(#rough2)">
    <rect x="150" y="216" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="220" y="216" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="290" y="216" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="360" y="216" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="430" y="216" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
  </g>
  <text y="237" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)"><tspan x="185">0</tspan><tspan x="255">0</tspan><tspan x="325">2</tspan><tspan x="395">2</tspan><tspan x="465">12</tspan></text>
  <text x="90" y="237" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">m=2</text>

  <g filter="url(#rough2)">
    <rect x="150" y="250" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="220" y="250" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="290" y="250" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="360" y="250" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="430" y="250" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
  </g>
  <text y="271" font-size="11.5" fill="#8a6a20" font-weight="bold" text-anchor="middle" filter="url(#rough2)"><tspan x="185">0</tspan><tspan x="255">0</tspan><tspan x="325">0</tspan><tspan x="395">0</tspan><tspan x="465">5</tspan></text>
  <text x="90" y="271" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">m=3</text>

  <!-- 分组解读 -->
  <rect x="55" y="300" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="295" y="320" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dp[3][5] = dp[2][3] + cost[3][4] = 2 + (20−10) = 5 ✓</text>
  <text x="295" y="340" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">对应分组 {1,4} {8} {10,20}，邮筒放 2.5、8、15（区间中点即中位数）</text>

  <text x="60" y="374" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">注意：邮筒位置不必是整数，也不必落在房子上——中位数是区间内任意点时代价相同（偶数个房子时）</text>
  <text x="60" y="392" font-size="11" fill="#555" filter="url(#rough2)">dp 需要的只是 cost 值，与邮筒具体坐标无关</text>
</svg>
