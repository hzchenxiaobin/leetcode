<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>
  <text x="320" y="22" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：排序 → 定界 → 二分间距 d → 贪心 check → 收缩区间</text>
  <path d="M 120 32 Q 320 39 520 32" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ① 排序 -->
  <rect x="200" y="42" width="240" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="62" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 排序：position 升序</text>
  <path d="M 320 74 L 320 84" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ② 定界 -->
  <rect x="120" y="88" width="400" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="108" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">② 定界：lo = 1，hi = ⌊(p[n−1] − p[0]) / (m−1)⌋</text>
  <path d="M 320 120 L 320 130" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ③ 取中 -->
  <rect x="150" y="134" width="340" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="154" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">③ 取中：mid = ⌊(lo + hi) / 2⌋（lo ≤ hi 时循环）</text>
  <path d="M 320 166 L 320 176" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ④ 贪心 check -->
  <rect x="60" y="180" width="520" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="202" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">④ 贪心 check(mid)：一趟扫描验证「间距 ≥ mid 能否放 m 球」</text>
  <text x="320" y="222" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">count = 1，last = p[0]；向右扫，p[i] − last ≥ mid 就放球（count++，last 更新）</text>
  <text x="320" y="242" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">排序后只需相邻间距 ≥ mid ⇒ 任意两球间距 ≥ mid（引理 1）；count 达 m 提前结束</text>
  <path d="M 320 260 L 320 272" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ⑤ 判定菱形 -->
  <polygon points="320,276 412,312 320,348 228,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="317" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">count ≥ m ？</text>

  <!-- 分支 -->
  <path d="M 240 324 Q 168 344 150 368" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="166" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是（可行）</text>
  <path d="M 400 324 Q 472 344 490 368" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="474" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否（不可行）</text>

  <!-- 可行分支 -->
  <rect x="36" y="370" width="260" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">可行 ✓：ans = mid</text>
  <text x="166" y="411" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">lo = mid + 1（去右半找更大间距）</text>
  <text x="166" y="430" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">mid ≤ d*，且已被 ans 记录</text>

  <!-- 不可行分支 -->
  <rect x="344" y="370" width="260" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="474" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a03a36" filter="url(#rough2)">不可行 ✗：hi = mid − 1</text>
  <text x="474" y="411" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">回左半缩小间距</text>
  <text x="474" y="430" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">mid &gt; d*，mid 及其右侧全部排除</text>

  <!-- 回环虚线 -->
  <path d="M 36 408 C 12 330 70 190 148 152" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="40" y="352" font-size="9.5" fill="#888" filter="url(#rough2)">回到 ③</text>
  <path d="M 604 408 C 628 330 570 190 492 152" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="556" y="352" font-size="9.5" fill="#888" filter="url(#rough2)">回到 ③</text>

  <!-- 汇合 → 出口 -->
  <path d="M 166 446 Q 250 458 268 464" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 474 446 Q 390 458 372 464" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="170" y="466" width="300" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="483" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">lo &gt; hi：循环结束</text>
  <text x="320" y="501" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">返回 ans = 最大可行间距 d*</text>
</svg>
