<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">滚动 DP 流程：每轮先结算出界，再把界内路径前推</text>

  <rect x="150" y="40" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="11.5" fill="#2f4460" filter="url(#rough2)">dp[start] = 1，ans = 0</text>

  <path d="M 270 78 L 270 96" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="100" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="125" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">for step = 1 … maxMove：nxt 全部清零</text>

  <path d="M 270 140 L 270 158" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="162" width="360" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="187" text-anchor="middle" font-size="11.5" fill="#2f4460" filter="url(#rough2)">遍历每个 (i,j) 与 4 个方向，v = dp[i][j]</text>

  <path d="M 270 202 L 270 222" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,226 400,262 270,298 140,262" fill="#f7f7f4" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">目标格 (ni,nj) 在界内？</text>

  <path d="M 205 280 L 152 314" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="292" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 335 280 L 388 314" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="292" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="60" y="320" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="347" text-anchor="middle" font-size="11" fill="#2f5a26" filter="url(#rough2)">nxt[ni][nj] += v</text>

  <rect x="300" y="320" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="347" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">ans += v（出界）</text>

  <path d="M 150 364 L 150 392" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 364 L 390 392" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="392" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="417" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">dp ← nxt；若 nxt 全为 0 则提前结束</text>

  <path d="M 110 412 L 40 412 L 40 120 L 106 120" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="26" y="252" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)" transform="rotate(-90 26 252)">下一个 step</text>

  <path d="M 270 432 L 270 452" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="452" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="475" text-anchor="middle" font-size="12" fill="#2f5a26" font-weight="bold" filter="url(#rough2)">返回 ans mod (10⁹+7)</text>
</svg>
