<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">垂直条带：y 无关，只看相邻 x 空隙</text>

  <!-- 点（示例 2 数据） -->
  <g filter="url(#rough2)" fill="#e8f0fe" stroke="#446688" stroke-width="2">
    <circle cx="70" cy="120" r="6"/>
    <circle cx="70" cy="200" r="6"/>
    <circle cx="180" cy="160" r="6"/>
    <circle cx="330" cy="110" r="6"/>
    <circle cx="450" cy="180" r="6"/>
    <circle cx="510" cy="140" r="6"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#888">
    <text x="58" y="106">(1,0)</text>
    <text x="58" y="220">(1,4)</text>
    <text x="170" y="146">(3,1)</text>
    <text x="320" y="96">(5,3)</text>
    <text x="440" y="200">(8,8)</text>
    <text x="490" y="122">(9,0)</text>
  </g>

  <!-- 条带：在 x=5 与 x=8 之间，宽 3 -->
  <g filter="url(#rough2)">
    <rect x="330" y="52" width="120" height="240" fill="#e6f4ea" opacity="0.55" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
  </g>
  <g filter="url(#rough2)">
    <line x1="330" y1="52" x2="330" y2="292" stroke="#4a7a3a" stroke-width="2.4" stroke-dasharray="7,5"/>
    <line x1="450" y1="52" x2="450" y2="292" stroke="#4a7a3a" stroke-width="2.4" stroke-dasharray="7,5"/>
  </g>
  <text x="390" y="312" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">最宽条带：宽 = 8 − 5 = 3</text>

  <!-- 其他条带（窄） -->
  <g filter="url(#rough2)" stroke="#c8d4e8" stroke-width="1.6" stroke-dasharray="4,4">
    <line x1="70" y1="60" x2="70" y2="284"/>
    <line x1="180" y1="60" x2="180" y2="284"/>
  </g>
  <text x="125" y="330" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">(1,3)：宽 2</text>
  <g filter="url(#rough2)" stroke="#c8d4e8" stroke-width="1.6" stroke-dasharray="4,4">
    <line x1="180" y1="60" x2="180" y2="284"/>
    <line x1="330" y1="60" x2="330" y2="284"/>
  </g>
  <text x="255" y="348" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">(3,5)：宽 2</text>

  <g filter="url(#rough2)">
    <rect x="20" y="60" width="120" height="180" fill="none" stroke="none"/>
  </g>
  <text x="150" y="70" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">条带上下无限延伸</text>
  <text x="150" y="88" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⇒ 任何点只看 x！</text>

  <path d="M 240 300 C 280 300, 300 296, 316 288" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
