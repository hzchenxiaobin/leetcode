<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="520" height="340" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">每轮候选集至多缩到「最大组」，10 次足够收敛</text>

  <g filter="url(#rough2)">
    <rect x="30" y="70" width="66" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="63" y="90" text-anchor="middle" font-size="12" fill="#2f4a66">第 1 猜</text>
    <text x="63" y="108" text-anchor="middle" font-size="12" fill="#2f4a66">100</text>

    <rect x="120" y="70" width="66" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="153" y="90" text-anchor="middle" font-size="12" fill="#2f4a66">第 2 猜</text>
    <text x="153" y="108" text-anchor="middle" font-size="12" fill="#2f4a66">≤ 34</text>

    <rect x="210" y="70" width="66" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="243" y="90" text-anchor="middle" font-size="12" fill="#2f4a66">第 3 猜</text>
    <text x="243" y="108" text-anchor="middle" font-size="12" fill="#2f4a66">≤ 12</text>

    <rect x="300" y="70" width="66" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="333" y="90" text-anchor="middle" font-size="12" fill="#2f5527">第 4 猜</text>
    <text x="333" y="108" text-anchor="middle" font-size="12" fill="#2f5527">≤ 5</text>

    <rect x="390" y="70" width="66" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="423" y="90" text-anchor="middle" font-size="12" fill="#2f5527">第 5 猜</text>
    <text x="423" y="108" text-anchor="middle" font-size="12" fill="#2f5527">≤ 2</text>

    <path d="M96,93 L116,93" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M186,93 L206,93" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M276,93 L296,93" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M366,93 L386,93" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="146" width="400" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="260" y="168" text-anchor="middle" font-size="12" fill="#8a3020">这只是「均匀分组」的粗略上界：7 个桶把 100 个词平均分，</text>
    <text x="260" y="186" text-anchor="middle" font-size="12" fill="#8a3020">最坏组 ≥ ⌈100/7⌉ = 15，越往后收缩越快</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="208" width="400" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="260" y="232" text-anchor="middle" font-size="12" fill="#2f5527">实测（小字母表随机词表，枚举全部 secret）：n ≤ 100 时最多 7 次猜中</text>
    <text x="260" y="252" text-anchor="middle" font-size="12" fill="#2f5527">题面保证 allowedGuesses ≥ 10 且存在合理策略</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="272" width="400" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="294" text-anchor="middle" font-size="12" fill="#7a5a10">实现上循环固定 10 轮：每次 guess 后必过滤掉自己（r≠6）</text>
    <text x="260" y="312" text-anchor="middle" font-size="12" fill="#7a5a10">候选严格递减，终止性显然</text>
  </g>
</svg>
