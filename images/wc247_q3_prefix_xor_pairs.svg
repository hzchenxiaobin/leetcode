<svg xmlns="http://www.w3.org/2000/svg" width="940" height="580" viewBox="0 0 940 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="940" height="580" fill="#fdfcf7"/>
  <text x="470" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：子串奇偶 = 两前缀掩码之异或 —— 配对计数</text>
  <path d="M 210 40 Q 470 50 730 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="470" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">mask[i] = 前缀 word[0..i-1] 的字母奇偶状态（1 = 奇数次），下图显示两位：左 b 右 a</text>

  <!-- word = aba -->
  <g filter="url(#sk)">
    <rect x="268" y="74" width="54" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="478" y="74" width="54" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="688" y="74" width="54" height="52" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="295" y="107" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#sk)">a</text>
  <text x="505" y="107" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#sk)">b</text>
  <text x="715" y="107" text-anchor="middle" font-size="20" font-weight="bold" fill="#333" filter="url(#sk)">a</text>

  <!-- cut ticks: prefix boundaries -->
  <g stroke="#888" stroke-width="2">
    <line x1="190" y1="132" x2="190" y2="154" filter="url(#sk)"/>
    <line x1="400" y1="132" x2="400" y2="154" filter="url(#sk)"/>
    <line x1="610" y1="132" x2="610" y2="154" filter="url(#sk)"/>
    <line x1="820" y1="132" x2="820" y2="154" filter="url(#sk)"/>
  </g>
  <text x="190" y="170" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">i=0</text>
  <text x="400" y="170" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">i=1</text>
  <text x="610" y="170" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">i=2</text>
  <text x="820" y="170" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">i=3</text>

  <!-- pairing arcs (endpoints at node tops y=336) -->
  <!-- green: XOR in {0, 2^t}; red dashed: XOR has >= 2 bits -->
  <g stroke="#4a8e4a" stroke-width="2.2" fill="none">
    <path d="M 190 336 Q 295 224 400 336" filter="url(#sk)"/>
    <path d="M 400 336 Q 505 224 610 336" filter="url(#sk)"/>
    <path d="M 610 336 Q 715 224 820 336" filter="url(#sk)"/>
    <path d="M 190 336 Q 505 44 820 336" filter="url(#sk)"/>
  </g>
  <g stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="7 5">
    <path d="M 190 336 Q 400 124 610 336" filter="url(#sk)"/>
    <path d="M 400 336 Q 610 124 820 336" filter="url(#sk)"/>
  </g>

  <!-- arc labels -->
  <text x="505" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f6b2f" filter="url(#sk)">⊕ = 10 → "aba" ✓</text>
  <text x="400" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#a03d38" filter="url(#sk)">⊕ = 11（两位）✗</text>
  <text x="610" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#a03d38" filter="url(#sk)">⊕ = 11（两位）✗</text>
  <text x="295" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6b2f" filter="url(#sk)">⊕ = 01 → "a" ✓</text>
  <text x="505" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6b2f" filter="url(#sk)">⊕ = 10 → "b" ✓</text>
  <text x="715" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6b2f" filter="url(#sk)">⊕ = 01 → "a" ✓</text>

  <!-- prefix mask nodes -->
  <g filter="url(#sk)">
    <rect x="158" y="336" width="64" height="44" rx="5" fill="#e8f0fa" stroke="#446688" stroke-width="1.6"/>
    <rect x="368" y="336" width="64" height="44" rx="5" fill="#e8f0fa" stroke="#446688" stroke-width="1.6"/>
    <rect x="578" y="336" width="64" height="44" rx="5" fill="#e8f0fa" stroke="#446688" stroke-width="1.6"/>
    <rect x="788" y="336" width="64" height="44" rx="5" fill="#e8f0fa" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="190" y="364" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#sk)">00</text>
  <text x="400" y="364" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#sk)">01</text>
  <text x="610" y="364" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#sk)">11</text>
  <text x="820" y="364" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#sk)">10</text>
  <text x="190" y="400" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">空前缀</text>
  <text x="400" y="400" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">前缀 "a"</text>
  <text x="610" y="400" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">前缀 "ab"</text>
  <text x="820" y="400" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">前缀 "aba"</text>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="70" y="428" width="800" height="120" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <path d="M 95 450 Q 115 444 135 450" stroke="#4a8e4a" stroke-width="2.5" fill="none" filter="url(#sk)"/>
  <text x="150" y="454" font-size="12" fill="#444" filter="url(#sk)">绿色实线：mask[j] ⊕ mask[i] = 0 或 2^t（汉明重量 ≤ 1）→ 子串最美，配对计入答案</text>
  <path d="M 95 478 Q 115 472 135 478" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="150" y="482" font-size="12" fill="#444" filter="url(#sk)">红色虚线：⊕ 结果 ≥ 2 位为 1 → 至少两个奇数字母 → 不最美</text>
  <text x="95" y="512" font-size="12" fill="#444" filter="url(#sk)">"aba" 共 6 对前缀，4 对最美（本例恰全为「差一位」型；「相等」型如 "aabb" 的 mask[0]=mask[2] → 子串 "aa" 全偶）</text>
  <text x="95" y="534" font-size="12" fill="#444" filter="url(#sk)">把「子串奇偶」化为「前缀配对」后，一趟扫描 + 计数数组即可数完所有子串</text>
</svg>
