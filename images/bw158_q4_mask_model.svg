<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">把「数位不重复」压成 10 位掩码</text>
  <text x="300" y="44" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">好子集 &lt;=&gt; 所有元素的掩码两两不交</text>
  <text x="40" y="84" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">34 -&gt;</text>
  <rect x="110" y="62" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170.0" y="88.0" font-size="11" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">数位 {3,4}</text>
  <text x="40" y="148" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">1 -&gt;</text>
  <rect x="110" y="126" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170.0" y="152.0" font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">数位 {1}</text>
  <text x="40" y="212" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">2 -&gt;</text>
  <rect x="110" y="190" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="170.0" y="216.0" font-size="11" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">数位 {2}</text>
  <rect x="270" y="62" width="290" height="172" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="415.0" y="92.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">34 的掩码：0011000000</text>
  <text x="415.0" y="122.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">1 的掩码：0000000010</text>
  <text x="415.0" y="152.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">2 的掩码：0000000100</text>
  <text x="415.0" y="182.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">三者按位与全为 0 -&gt; 可同时选</text>
  <text x="415.0" y="212.0" font-size="10.5" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">22 的掩码含两个 2 -&gt; 非法（自身不满足）</text>
  <rect x="40" y="258" width="520" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="300.0" y="287.0" font-size="10.5" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">于是「好子集」变成「掩码两两不交的节点集合」，最多 2^10 = 1024 种状态</text>
  <text x="40" y="336" font-size="10.5" fill="#999" text-anchor="start" filter="url(#rough2)">vals[i] &lt;= 1e9，数位最多 10 位，掩码刚好放得下</text>
</svg>
