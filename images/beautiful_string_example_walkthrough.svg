<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：abcz → abda 与 dc → ""</text>

  <!-- Panel 1: abcz -->
  <text x="40" y="62" font-size="13" fill="#446688" filter="url(#rough2)">① s = "abcz"，k = 26</text>
  <rect x="174" y="74" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="218" y="74" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="262" y="74" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="306" y="74" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="102" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">a</text>
  <text x="239" y="102" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">b</text>
  <text x="283" y="102" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">c</text>
  <text x="327" y="102" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">z</text>
  <text x="195" y="130" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="239" y="130" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="283" y="130" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="327" y="130" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>

  <text x="46" y="156" font-size="12.5" fill="#b85450" filter="url(#rough2)">i=3 'z'：z 已是 k=26 内最大 ✗ → 左移</text>
  <text x="46" y="178" font-size="12.5" fill="#d6a040" filter="url(#rough2)">i=2 'c'：试 d → d≠b(前1)✓ d≠a(前2)✓ → 定位，c 改为 d</text>
  <text x="46" y="200" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">i=3 重填：试 a → a≠d(前1)✓ a≠b(前2)✓ → 填 a</text>

  <rect x="174" y="214" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="218" y="214" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="262" y="214" width="42" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <rect x="306" y="214" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="195" y="242" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">a</text>
  <text x="239" y="242" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">b</text>
  <text x="283" y="242" text-anchor="middle" font-size="18" font-weight="bold" fill="#d6a040" filter="url(#rough2)">d</text>
  <text x="327" y="242" text-anchor="middle" font-size="18" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="260" y="282" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">保留前缀 ab ｜ 最小合法增大 d ｜ 贪心重填 a → "abda"</text>

  <path d="M 40 302 L 480 302" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>

  <!-- Panel 2: dc -->
  <text x="40" y="330" font-size="13" fill="#446688" filter="url(#rough2)">② s = "dc"，k = 4（字母表 a..d）</text>
  <rect x="238" y="342" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="282" y="342" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="259" y="370" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">d</text>
  <text x="303" y="370" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">c</text>
  <text x="259" y="398" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="303" y="398" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>

  <text x="46" y="358" font-size="12.5" fill="#b85450" filter="url(#rough2)">i=1 'c'：候选只剩 d，</text>
  <text x="46" y="378" font-size="12.5" fill="#b85450" filter="url(#rough2)">撞 s[0]='d'（len2 回文）✗</text>
  <text x="46" y="398" font-size="12.5" fill="#b85450" filter="url(#rough2)">i=0 'd'：已是最大 ✗</text>
  <text x="46" y="426" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">两位都无法放大 → 无解，返回 ""</text>
</svg>
