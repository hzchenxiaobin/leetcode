<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">第二遍：从后往前「剥洋葱」，每遇数字就取模、每遇字母就缩一格</text>

  <rect x="24" y="46" width="652" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">逆序读入</text>
  <text x="160" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">3</text>
  <text x="230" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">e</text>
  <text x="300" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">d</text>
  <text x="370" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">o</text>
  <text x="440" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">c</text>
  <text x="510" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">2</text>
  <text x="580" y="65" font-size="11" fill="#2c4a63" filter="url(#rough2)">…</text>

  <rect x="24" y="74" width="652" height="30" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="94" font-size="11" fill="#444" filter="url(#rough2)">size</text>
  <text x="160" y="94" font-size="11" fill="#444" filter="url(#rough2)">36</text>
  <text x="230" y="94" font-size="11" fill="#444" filter="url(#rough2)">12</text>
  <text x="300" y="94" font-size="11" fill="#444" filter="url(#rough2)">11</text>
  <text x="370" y="94" font-size="11" fill="#444" filter="url(#rough2)">10</text>
  <text x="440" y="94" font-size="11" fill="#444" filter="url(#rough2)">9</text>
  <text x="510" y="94" font-size="11" fill="#b85450" filter="url(#rough2)">8</text>

  <rect x="24" y="104" width="652" height="30" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="124" font-size="11" fill="#444" filter="url(#rough2)">k</text>
  <text x="160" y="124" font-size="11" fill="#b85450" filter="url(#rough2)">10 % 12 = 10</text>
  <text x="230" y="124" font-size="11" fill="#444" filter="url(#rough2)">10</text>
  <text x="300" y="124" font-size="11" fill="#444" filter="url(#rough2)">10 ≠ 11</text>
  <text x="370" y="124" font-size="11" fill="#444" filter="url(#rough2)">10 ≠ 10 …</text>
  <text x="440" y="124" font-size="11" fill="#444" filter="url(#rough2)">k 不变</text>
  <text x="510" y="124" font-size="11" fill="#444" filter="url(#rough2)">→ 8</text>

  <!-- 说明 -->
  <rect x="24" y="152" width="316" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="182" y="176" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">遇到数字 d</text>
  <text x="182" y="200" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">size /= d　（回到上一层长度）</text>
  <text x="182" y="222" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">k %= size　（折回模板内的位置）</text>
  <text x="182" y="246" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">取模后 k 可能变 0，代表「模板末尾」</text>

  <rect x="360" y="152" width="316" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="518" y="176" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">遇到字母</text>
  <text x="518" y="200" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">若 k == size 或 k == 0：这就是答案</text>
  <text x="518" y="222" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">否则 size -= 1（剥掉这一格的字符）</text>
  <text x="518" y="246" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">继续往前找</text>

  <!-- 折叠示意 -->
  <text x="24" y="296" font-size="12" fill="#333" filter="url(#rough2)">折叠示意：36 = 3 × 12，10 落进第一个 12 长的模板；</text>
  <text x="24" y="318" font-size="12" fill="#333" filter="url(#rough2)">模板 "leetleetcode" 的第 10 个字符是 'o'，即答案</text>

  <path d="M120 344 L120 368 L560 368" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="340" y="390" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">全程 O(|s|)，不需要构造任何字符串</text>
</svg>
