<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：外层遍历单词，内层逐字符拼接，集合去重</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">总时间 O(S)，S 为所有单词的字符总数；每个字符只查表拼接一次</text>

  <!-- ① 初始化 -->
  <rect x="150" y="58" width="260" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">① 准备 morse[26] 码表，set = ∅</text>
  <path d="M 280 104 L 280 124" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② 取单词 -->
  <rect x="150" y="124" width="260" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">② 取出下一个单词 word</text>
  <path d="M 280 170 L 280 190" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ③ 逐字符拼接 -->
  <rect x="130" y="190" width="300" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">③ 逐字符查表拼接 code += morse[ch − 'a']</text>
  <text x="280" y="234" text-anchor="middle" font-size="9.5" fill="#6a8a5a" filter="url(#rough2)">内层循环：把整个单词翻译成一个点划串</text>
  <path d="M 280 246 L 280 266" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ④ 插入集合 -->
  <rect x="150" y="266" width="260" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">④ set.insert(code)，重复串自动丢弃</text>
  <path d="M 280 312 L 280 330" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断 -->
  <polygon points="280,328 360,362 280,396 200,362" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">还有单词？</text>

  <!-- 是：回到 ② -->
  <path d="M 200 362 L 70 362 L 70 147 L 148 147" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="152" y="352" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="84" y="300" font-size="10" fill="#4a7a3a" filter="url(#rough2)">回到 ②</text>
  <text x="84" y="318" font-size="9.5" fill="#8a9a7a" filter="url(#rough2)">继续下一个</text>

  <!-- 否：返回 -->
  <path d="M 280 396 L 280 416" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="292" y="410" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="175" y="416" width="210" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="444" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">⑤ return |set|（不同翻译的个数）</text>
</svg>
