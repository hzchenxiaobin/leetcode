<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="510" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：二分答案 + O(n) 计数</text>

  <!-- ① -->
  <rect x="210" y="40" width="220" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① total = n(n+1)/2（全部子串数）</text>
  <path d="M320,78 L320,94" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定1 -->
  <polygon points="320,96 424,132 320,168 216,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="137" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">total &lt; k ?</text>
  <path d="M424,132 L478,132" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="124" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="478" y="114" width="106" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="531" y="137" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 −1</text>
  <path d="M320,168 L320,186" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- ② -->
  <rect x="150" y="188" width="340" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② lo = 0，hi = n − 1（不变式：f(hi) ≥ k）</text>
  <path d="M320,226 L320,244" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定2 -->
  <polygon points="320,246 412,282 320,318 228,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="287" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">lo &lt; hi ?</text>
  <path d="M412,282 L482,282" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="274" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="486" y="258" width="108" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="540" y="281" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6330" filter="url(#rough2)">返回 lo（答案）</text>
  <path d="M320,318 L320,336" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="332" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- ③ -->
  <rect x="100" y="338" width="440" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="360" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ mid = ⌊(lo+hi)/2⌋；check(mid)：标记 order[0..mid]</text>
  <text x="320" y="382" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">扫描各极大无 '*' 段长 Lᵢ → valid = total − Σ Lᵢ(Lᵢ+1)/2</text>
  <path d="M320,394 L320,410" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定3 -->
  <polygon points="320,412 428,448 320,484 212,448" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="453" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">valid ≥ k ?</text>

  <!-- 回边 -->
  <path d="M212,448 C 120,442 108,312 222,288" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="106" y="372" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是：</text>
  <text x="106" y="388" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">hi = mid</text>
  <path d="M428,448 C 512,440 500,318 418,290" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="540" y="372" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否：</text>
  <text x="540" y="388" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">lo = mid+1</text>
</svg>
