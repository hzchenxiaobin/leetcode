<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrC" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 1 1 L 8 4.5 L 1 8" fill="none" stroke="#666" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="800" height="560" fill="#fdfcf7"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">判定与计数：mask 至多差 1 位 ⟺ 可重排回文——哈希表一趟数完</text>
  <path d="M 90 42 Q 400 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ Row 1: 26 位奇偶 mask ============ -->
  <text x="60" y="72" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">① 判定：奇偶 mask 中 1 的个数 ≤ 1 ⟺ 可重排成回文</text>

  <g filter="url(#sk)">
    <rect x="60" y="88" width="16" height="26" rx="3" fill="#d6a040" stroke="#446688" stroke-width="1.2"/>
    <rect x="80" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="100" y="88" width="16" height="26" rx="3" fill="#d6a040" stroke="#446688" stroke-width="1.2"/>
    <rect x="120" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="140" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="160" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="180" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="200" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="220" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="240" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="260" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="280" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="300" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="320" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="340" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="360" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="380" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="400" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="420" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="440" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="460" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="480" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="500" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="520" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="540" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="560" y="88" width="16" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="9.5" fill="#666" text-anchor="middle" filter="url(#sk)">
    <text x="68" y="126">a</text>
    <text x="88" y="126">b</text>
    <text x="108" y="126">c</text>
    <text x="128" y="126">d</text>
    <text x="148" y="126">e</text>
    <text x="168" y="126">f</text>
    <text x="188" y="126">g</text>
    <text x="208" y="126">h</text>
    <text x="228" y="126">i</text>
    <text x="248" y="126">j</text>
    <text x="268" y="126">k</text>
    <text x="288" y="126">l</text>
    <text x="308" y="126">m</text>
    <text x="328" y="126">n</text>
    <text x="348" y="126">o</text>
    <text x="368" y="126">p</text>
    <text x="388" y="126">q</text>
    <text x="408" y="126">r</text>
    <text x="428" y="126">s</text>
    <text x="448" y="126">t</text>
    <text x="468" y="126">u</text>
    <text x="488" y="126">v</text>
    <text x="508" y="126">w</text>
    <text x="528" y="126">x</text>
    <text x="548" y="126">y</text>
    <text x="568" y="126">z</text>
  </g>
  <text x="598" y="100" font-size="11" fill="#555" filter="url(#sk)">例：路径 "bbac"</text>
  <text x="598" y="116" font-size="11" fill="#555" filter="url(#sk)">b×2, a×1, c×1</text>
  <text x="598" y="132" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">mask = {a, c}（两个 1）</text>

  <!-- 三种情况 -->
  <g filter="url(#sk)">
    <rect x="55" y="150" width="225" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="298" y="150" width="225" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="541" y="150" width="225" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="70" y="172" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">0 个 1（m(u)=m(v)）</text>
  <text x="70" y="192" font-size="11" fill="#444" filter="url(#sk)">路径字符全偶 → 本身已是回文 ✓</text>
  <text x="313" y="172" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">1 个 1</text>
  <text x="313" y="192" font-size="11" fill="#444" filter="url(#sk)">恰一个奇数字符 → 放正中间成回文 ✓</text>
  <text x="556" y="172" font-size="12" font-weight="bold" fill="#8f3a36" filter="url(#sk)">≥ 2 个 1</text>
  <text x="556" y="192" font-size="11" fill="#444" filter="url(#sk)">两个奇数字符无处配对，不成回文 ✗</text>

  <!-- ============ Row 2: 计数流程 ============ -->
  <text x="60" y="240" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">② 计数：一遍遍历，先查后记（处理顺序任意）</text>

  <g filter="url(#sk)">
    <rect x="55" y="262" width="185" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="262" y="262" width="118" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="404" y="262" width="190" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="616" y="262" width="130" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="70" y="284" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">① 遍历树</text>
  <text x="70" y="304" font-size="10.5" fill="#444" filter="url(#sk)">从根出发（根 mask = ∅），</text>
  <text x="70" y="320" font-size="10.5" fill="#444" filter="url(#sk)">显式栈 / 队列皆可</text>
  <text x="70" y="340" font-size="10.5" fill="#2b4a6e" filter="url(#sk)">子节点 y：m(y)=m(x)⊕bit(s[y])</text>
  <text x="277" y="284" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">② 到达 x</text>
  <text x="277" y="304" font-size="10.5" fill="#444" filter="url(#sk)">取 m = m(x)</text>
  <text x="277" y="320" font-size="10.5" fill="#444" filter="url(#sk)">进入「先查」</text>
  <text x="419" y="284" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">③ 先查：ans 累加</text>
  <text x="419" y="304" font-size="10.5" fill="#444" filter="url(#sk)">ans += cnt[m]（差 0 位）</text>
  <text x="419" y="320" font-size="10.5" fill="#444" filter="url(#sk)">ans += Σ_b cnt[m⊕(1≪b)]</text>
  <text x="419" y="340" font-size="10.5" fill="#7a5415" filter="url(#sk)">（差 1 位，b = 0..25 共 26 种）</text>
  <text x="631" y="284" font-size="12" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">④ 后记</text>
  <text x="631" y="304" font-size="10.5" fill="#444" filter="url(#sk)">cnt[m] += 1</text>
  <text x="631" y="320" font-size="10.5" fill="#444" filter="url(#sk)">弹出下一个节点</text>

  <g filter="url(#sk)" stroke="#666" stroke-width="1.6">
    <line x1="242" y1="308" x2="258" y2="308" marker-end="url(#arrC)"/>
    <line x1="382" y1="308" x2="400" y2="308" marker-end="url(#arrC)"/>
    <line x1="596" y1="308" x2="612" y2="308" marker-end="url(#arrC)"/>
  </g>
  <path d="M 681 354 L 681 378 L 321 378 L 321 358" stroke="#999" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#arrC)" filter="url(#sk)"/>
  <text x="500" y="371" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#sk)">下一节点</text>

  <!-- 不重不漏说明 -->
  <g filter="url(#sk)"><rect x="55" y="400" width="690" height="62" rx="8" fill="#fdfcf7" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="75" y="424" font-size="11.5" fill="#444" filter="url(#sk)">27 个查询目标两两不同、且都 ≠ m 自身（m⊕(1≪b₁) = m⊕(1≪b₂) ⟹ b₁ = b₂）→ 不重不漏</text>
  <text x="75" y="446" font-size="11.5" fill="#444" filter="url(#sk)">点对 {y, x} 恰在「后到达者」处被统计一次 → 与遍历顺序无关（§5 定理 2）</text>

  <!-- 复杂度提示 -->
  <g filter="url(#sk)"><rect x="55" y="484" width="690" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="75" y="508" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">每节点 27 次哈希查询，总计 O(26n)：n = 10⁵ 约 2.7×10⁶ 次，轻松通过</text>
  <text x="75" y="528" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">答案上限 C(n,2) ≈ 5×10⁹ → C++ 必须 long long；Python int 无界</text>
</svg>
