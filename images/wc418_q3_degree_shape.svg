<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察一：度数指纹直接暴露网格形状</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">图邻接 ⟺ 格邻接 ⇒ 每个节点的度数 = 它在网格里的格邻居数</text>

  <!-- 左：4x5 网格，格内标度数 -->
  <!-- 行 0 -->
  <rect x="42" y="62" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="72" y="62" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="62" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="132" y="62" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="62" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <!-- 行 1 -->
  <rect x="42" y="92" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="72" y="92" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="92" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="132" y="92" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="92" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- 行 2 -->
  <rect x="42" y="122" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="72" y="122" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="122" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="132" y="122" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="122" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- 行 3 -->
  <rect x="42" y="152" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="72" y="152" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="102" y="152" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="132" y="152" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="152" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>

  <!-- 度数数字 -->
  <text x="57" y="81" text-anchor="middle" font-size="12" fill="#7a3530" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="87" y="81" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">3</text>
  <text x="117" y="81" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">3</text>
  <text x="147" y="81" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">3</text>
  <text x="177" y="81" text-anchor="middle" font-size="12" fill="#7a3530" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="57" y="111" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">3</text>
  <text x="87" y="111" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="117" y="111" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="147" y="111" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="177" y="111" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">3</text>
  <text x="57" y="141" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">3</text>
  <text x="87" y="141" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="117" y="141" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="147" y="141" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="177" y="141" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">3</text>
  <text x="57" y="171" text-anchor="middle" font-size="12" fill="#7a3530" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="87" y="171" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">3</text>
  <text x="117" y="171" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">3</text>
  <text x="147" y="171" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">3</text>
  <text x="177" y="171" text-anchor="middle" font-size="12" fill="#7a3530" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="117" y="196" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">R×C 网格（示例 4×5）：格子位置 ⇒ 度数</text>

  <!-- 图例 -->
  <rect x="42" y="212" width="13" height="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="61" y="223" font-size="10.5" fill="#7a3530" filter="url(#rough2)">角：度 2，恰好 4 个</text>
  <rect x="42" y="232" width="13" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="61" y="243" font-size="10.5" fill="#8a6a1a" filter="url(#rough2)">边界非角：度 3，共 2R+2C−8 个</text>
  <rect x="42" y="252" width="13" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="61" y="263" font-size="10.5" fill="#33506b" filter="url(#rough2)">内部：度 4，共 (R−2)(C−2) 个</text>

  <!-- 右：公式面板 -->
  <rect x="252" y="62" width="250" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="377" y="86" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">数一数度 3 的点，反解形状：</text>
  <text x="377" y="110" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">R + C = (cnt3 + 8) / 2</text>
  <text x="377" y="134" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">R × C = n</text>
  <text x="377" y="162" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⇒ 唯一解出 {R, C}</text>

  <!-- 右下：特判 -->
  <rect x="252" y="196" width="250" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="377" y="218" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">特判：存在度 1 的点 ⇒ 1×n 链</text>
  <text x="377" y="238" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">从端点一路走到底即可</text>
  <text x="377" y="256" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">2×2 环：无度 3 点，cnt3=0，公式自洽</text>

  <!-- 底部结论 -->
  <rect x="20" y="286" width="480" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">判形状只需一趟度数统计：链看「度 1」，网格看「度 3 的个数」</text>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">素数 n 只能是 1×n；R+C 与 R·C 联立 ⇒ 形状唯一，无需试探</text>
</svg>
