<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：建回文表 → 枚举两刀 → 三段查表</text>
  <path d="M 150 40 Q 320 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)"><rect x="255" y="52" width="130" height="26" rx="6" fill="#e8f0fa" stroke="#446688" stroke-width="1.3"/></g>
  <text x="320" y="69" text-anchor="middle" font-size="12" fill="#2b4a66">输入 s，n = |s|</text>
  <path d="M 320 78 L 320 88" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- phase 1 -->
  <g filter="url(#sk)"><rect x="140" y="92" width="360" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="320" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">Phase 1：建回文表 isPal[i][j]</text>
  <text x="320" y="132" text-anchor="middle" font-size="11" fill="#2e6e2e">i 从 n−1 递减、j 从 i 递增（等价于按长度递增）</text>
  <path d="M 320 146 L 320 154" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- enum i -->
  <g filter="url(#sk)"><rect x="225" y="158" width="190" height="30" rx="6" fill="#e8f0fa" stroke="#446688" stroke-width="1.3"/></g>
  <text x="320" y="177" text-anchor="middle" font-size="12" fill="#2b4a66">枚举第一刀 i ∈ [0, n−3]</text>
  <path d="M 320 188 L 320 196" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 1 -->
  <g filter="url(#sk)"><polygon points="215,226 320,198 425,226 320,254" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="320" y="230" text-anchor="middle" font-size="11.5" fill="#7a5415">isPal[0][i] 为真？</text>
  <path d="M 425 226 L 458 226" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="438" y="218" text-anchor="middle" font-size="10.5" fill="#888">否</text>
  <g filter="url(#sk)"><rect x="462" y="206" width="162" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="543" y="222" text-anchor="middle" font-size="10.5" fill="#7a5415">i++ 换第一刀</text>
  <text x="543" y="238" text-anchor="middle" font-size="10.5" fill="#7a5415">i 全超界 ⇒ return false</text>
  <path d="M 543 206 C 543 182 480 171 420 171" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 320 254 L 320 264" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="331" y="263" font-size="10.5" fill="#888">是</text>

  <!-- enum j -->
  <g filter="url(#sk)"><rect x="225" y="268" width="190" height="30" rx="6" fill="#e8f0fa" stroke="#446688" stroke-width="1.3"/></g>
  <text x="320" y="287" text-anchor="middle" font-size="12" fill="#2b4a66">枚举第二刀 j ∈ [i+1, n−2]</text>
  <path d="M 320 298 L 320 306" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond 2 -->
  <g filter="url(#sk)"><polygon points="220,340 320,310 420,340 320,370" fill="#fff4e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="320" y="336" text-anchor="middle" font-size="10.5" fill="#7a5415">isPal[i+1][j] 且</text>
  <text x="320" y="352" text-anchor="middle" font-size="10.5" fill="#7a5415">isPal[j+1][n−1] 为真？</text>
  <path d="M 420 340 L 450 340" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="432" y="332" text-anchor="middle" font-size="10.5" fill="#888">是</text>
  <g filter="url(#sk)"><rect x="454" y="322" width="146" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="527" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">return true ⭐</text>
  <path d="M 320 370 L 320 384 L 150 384 C 108 340 138 296 222 284" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="378" text-anchor="middle" font-size="10" fill="#888">否，j++ 换第二刀</text>
</svg>
