<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 342" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>

  <rect width="560" height="342" fill="#fafafa"/>

  <text x="280.0" y="26" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">把多的字母分块，少的字母当隔板</text>
  <text x="280.0" y="45" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">块数 = 少的字母数 + 1，每块至多 2 个 —— 这就是存在性的来源</text>
  <text x="30" y="72" font-size="12" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">a = 4，b = 1：用 b 把 a 分成至多 2 个一段</text>
  <rect x="50" y="92" width="78" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="89.0" y="119.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">aa</text>
  <rect x="136" y="92" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="166.0" y="119.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="204" y="92" width="78" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/><text x="243.0" y="119.4" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">aa</text>
  <text x="130" y="162" font-size="11" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">每段 ≤ 2 个 a</text>
  <text x="224" y="162" font-size="11" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">共 b+1 = 2 段</text>
  <text x="30" y="206" font-size="11.5" fill="#333" text-anchor="start" filter="url(#rough2)">一般地：b 个 'b' 最多切出 b+1 段，故需 ⌈a/(b+1)⌉ ≤ 2</text>
  <text x="30" y="228" font-size="11.5" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">存在性条件：max(a, b) ≤ 2 · min(a, b) + 2</text>
  <rect x="30" y="252" width="500" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/><text x="40" y="273" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">构造视角 vs 逐字符视角</text><text x="40" y="288.95" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">分块视角说明「为什么可行」，逐字符贪心说明「怎么写最简单」</text><text x="40" y="304.9" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">两者等价：贪心在「会形成三连」时被迫换字母，正好就是分块的边界</text>
</svg>
