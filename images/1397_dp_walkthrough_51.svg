<svg xmlns="http://www.w3.org/2000/svg" width="700" height="540" viewBox="0 0 700 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="540" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">示例 1 演算：n = 2，s1 = "aa"，s2 = "da"，evil = "b"</text>
  <text x="350" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">状态简记 (j, lo, hi)；m = 1：δ(0,'b') = 1 = m（剪枝），其余 25 个字符 δ(0,·) = 0</text>

  <!-- 左侧阶段标签 -->
  <g font-size="11" font-weight="bold" fill="#777">
    <text x="28" y="92" filter="url(#r)">起点</text>
    <text x="28" y="186" filter="url(#r)">第 0 位</text>
    <text x="28" y="306" filter="url(#r)">第 1 位</text>
    <text x="28" y="432" filter="url(#r)">求和</text>
  </g>

  <!-- 起点 -->
  <g filter="url(#r)">
    <rect x="255" y="68" width="190" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="350" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">(j=0, lo=1, hi=1) × 1</text>

  <!-- 树形连接线 -->
  <g filter="url(#r)">
    <path d="M 350 110 L 350 128" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
    <path d="M 148 128 L 610 128" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
    <path d="M 148 128 L 148 146" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 302 128 L 302 146" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 456 128 L 456 146" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 610 128 L 610 146" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="622" y="132" font-size="10" fill="#888" filter="url(#r)">c ∈ ['a'..'d']</text>

  <!-- 第 0 位四个分支 -->
  <g filter="url(#r)">
    <rect x="80" y="152" width="136" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="234" y="152" width="136" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="388" y="152" width="136" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="542" y="152" width="136" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle">
    <text x="148" y="174" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">选 'a'</text>
    <text x="148" y="192" font-size="11" fill="#33517a" filter="url(#r)">(0, lo=1, hi=0) × 1</text>
    <text x="148" y="205" font-size="10" fill="#999" filter="url(#r)">前缀 "a"</text>
    <text x="302" y="174" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#r)">选 'b'</text>
    <text x="302" y="192" font-size="11" font-weight="bold" fill="#b85450" filter="url(#r)">δ(0,'b') = 1 = m</text>
    <text x="302" y="205" font-size="10.5" fill="#b85450" filter="url(#r)">出现 evil → 剪枝 ✂</text>
    <text x="456" y="174" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">选 'c'</text>
    <text x="456" y="192" font-size="11" fill="#2e6e2e" filter="url(#r)">(0, lo=0, hi=0) × 1</text>
    <text x="456" y="205" font-size="10" fill="#999" filter="url(#r)">前缀 "c"</text>
    <text x="610" y="174" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#r)">选 'd'</text>
    <text x="610" y="192" font-size="11" fill="#33517a" filter="url(#r)">(0, lo=0, hi=1) × 1</text>
    <text x="610" y="205" font-size="10" fill="#999" filter="url(#r)">前缀 "d"</text>
  </g>

  <!-- 第 1 位竖直箭头 -->
  <g filter="url(#r)">
    <path d="M 148 216 L 148 252" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 456 216 L 456 252" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 610 216 L 610 252" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
    <path d="M 302 216 L 302 236" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  </g>
  <text x="302" y="252" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#r)">整支丢弃 ✂</text>

  <!-- 第 1 位三个盒子 -->
  <g filter="url(#r)">
    <rect x="80" y="258" width="136" height="96" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="388" y="258" width="136" height="96" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="542" y="258" width="136" height="96" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#555">
    <text x="148" y="280" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#r)">来自前缀 "a"（lo=1）</text>
    <text x="148" y="299" filter="url(#r)">'a' → (0,1,0) × 1</text>
    <text x="148" y="317" filter="url(#r)">'c'…'z' 共 24 个</text>
    <text x="148" y="335" filter="url(#r)">→ (0,0,0) × 24</text>
    <text x="456" y="280" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">来自前缀 "c"（自由）</text>
    <text x="456" y="299" filter="url(#r)">26 个字符任选</text>
    <text x="456" y="317" filter="url(#r)">去掉 'b' 剩 25 个</text>
    <text x="456" y="335" filter="url(#r)">→ (0,0,0) × 25</text>
    <text x="610" y="280" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#r)">来自前缀 "d"（hi=1）</text>
    <text x="610" y="299" filter="url(#r)">c ≤ 'a'：只能 'a'</text>
    <text x="610" y="317" filter="url(#r)">'a' → (0,0,1) × 1</text>
    <text x="610" y="335" filter="url(#r)">（"da" 恰为 s2）</text>
  </g>

  <!-- 汇合树 -->
  <g filter="url(#r)">
    <path d="M 148 356 L 148 372" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
    <path d="M 456 356 L 456 372" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
    <path d="M 610 356 L 610 372" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
    <path d="M 148 372 L 610 372" stroke="#3a3a3a" stroke-width="1.5" fill="none"/>
    <path d="M 350 372 L 350 394" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- 结果 -->
  <g filter="url(#r)">
    <rect x="200" y="398" width="300" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="350" y="424" text-anchor="middle" font-size="15" font-weight="bold" fill="#b07818" filter="url(#r)">ans = 1 + 24 + 25 + 1 = 51</text>
  <text x="350" y="446" text-anchor="middle" font-size="10.5" fill="#b07818" filter="url(#r)">= "aa" ＋ "a?"×24 ＋ "c?"×25 ＋ "da"</text>

  <text x="350" y="486" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">第 1 位 s1[1] = s2[1] = 'a'：lo=1 ⇒ c ≥ 'a'，hi=1 ⇒ c ≤ 'a'，均脱离后任选</text>
  <text x="350" y="506" text-anchor="middle" font-size="11" fill="#888" filter="url(#r)">第 n 层所有状态求和即为答案 —— 全程只有加法，无需减法修正</text>
</svg>
