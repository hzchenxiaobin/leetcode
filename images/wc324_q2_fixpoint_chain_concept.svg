<svg xmlns="http://www.w3.org/2000/svg" width="940" height="512" viewBox="0 0 940 512" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="512" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：f(n) = 质因数之和 ≤ n —— 单调不增，落点即最小值</text>
  <path d="M 200 42 Q 470 50 740 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="470" y="66" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">反复替换的取值序列：n → f(n) → f(f(n)) → …（以 n = 15 为例）</text>

  <!-- chain: 15 → 8 → 6 → 5 -->
  <g filter="url(#sk)">
    <rect x="64" y="84" width="96" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="112" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b4a66" filter="url(#sk)">15</text>
  <text x="112" y="132" text-anchor="middle" font-size="11" fill="#7a94ad" filter="url(#sk)">3 × 5</text>

  <path d="M 166 113 L 250 113" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="208" y="103" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">f = 3+5</text>

  <g filter="url(#sk)">
    <rect x="258" y="84" width="96" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="306" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b4a66" filter="url(#sk)">8</text>
  <text x="306" y="132" text-anchor="middle" font-size="11" fill="#7a94ad" filter="url(#sk)">2·2·2</text>

  <path d="M 360 113 L 444 113" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="402" y="103" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">f = 2+2+2</text>

  <g filter="url(#sk)">
    <rect x="452" y="84" width="96" height="58" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="500" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b4a66" filter="url(#sk)">6</text>
  <text x="500" y="132" text-anchor="middle" font-size="11" fill="#7a94ad" filter="url(#sk)">2 × 3</text>

  <path d="M 554 113 L 638 113" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="596" y="103" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">f = 2+3</text>

  <g filter="url(#sk)">
    <rect x="646" y="84" width="96" height="58" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="694" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">5</text>
  <text x="694" y="132" text-anchor="middle" font-size="11" fill="#5a8a5a" filter="url(#sk)">质数</text>

  <text x="790" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">⭐ 停</text>
  <text x="790" y="130" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">f(5) = 5</text>

  <!-- left: why f(n) <= n -->
  <g filter="url(#sk)">
    <rect x="56" y="180" width="404" height="168" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="76" y="206" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">为什么 f(n) ≤ n？</text>
  <text x="76" y="232" font-size="12" fill="#444" filter="url(#sk)">对 a, b ≥ 2：a + b ≤ a · b</text>
  <text x="76" y="254" font-size="12" fill="#444" filter="url(#sk)">∵ (a−1)(b−1) ≥ 1，等号仅当 a = b = 2</text>
  <text x="76" y="276" font-size="12" fill="#444" filter="url(#sk)">把质因子两两「加 → 乘」地合并：</text>
  <text x="76" y="298" font-size="12" fill="#444" font-family="monospace" filter="url(#sk)">p1 + p2 + … + pk ≤ p1·p2·…·pk = n</text>
  <text x="76" y="326" font-size="11" fill="#999" filter="url(#sk)">乘法增长远快于加法，和永远追不上积</text>

  <!-- right: fixed points -->
  <g filter="url(#sk)">
    <rect x="484" y="180" width="400" height="168" rx="10" fill="#fdeaea" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="504" y="206" font-size="14" font-weight="bold" fill="#8a3a34" filter="url(#sk)">不动点（f(n) = n）恰是两类</text>
  <text x="504" y="232" font-size="12" fill="#444" filter="url(#sk)">质数 p：唯一质因子是自身 → f(p) = p</text>
  <text x="504" y="254" font-size="12" fill="#444" filter="url(#sk)">n = 4：2 + 2 = 2 × 2 = 4，唯一合数不动点</text>
  <text x="504" y="276" font-size="12" fill="#444" filter="url(#sk)">其余合数：不等式严格 → f(n) &lt; n</text>
  <text x="504" y="304" font-size="11" fill="#b85450" font-weight="bold" filter="url(#sk)">⚠ 4 是「是合数却停」的陷阱输入</text>

  <!-- bottom: conclusion -->
  <g filter="url(#sk)">
    <rect x="56" y="372" width="828" height="118" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="76" y="398" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">结论：跑到不动点 = 求出最小值</text>
  <text x="76" y="424" font-size="12" fill="#444" filter="url(#sk)">非不动点处每步严格变小，正整数不能无限递减 → 有限步内必停在不动点</text>
  <text x="76" y="446" font-size="12" fill="#444" filter="url(#sk)">序列单调不增 → 停下的值 ≤ 途中一切值 → 落点就是答案</text>
  <text x="76" y="474" font-size="11" fill="#5a8a5a" filter="url(#sk)">停机判据只需一句：s == n（同时覆盖质数与 4，免疫死循环）</text>
</svg>
