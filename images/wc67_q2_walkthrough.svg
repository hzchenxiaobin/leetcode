<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "ababcbacadefegdehijhklij" → [9, 7, 8]</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每段都切在「最早的闭合位置」，24 个字符被切成 9 + 7 + 8 三段</text>

  <!-- 24 个字符格，x = 40 + 20*i -->
  <g filter="url(#rough2)" font-size="11.5" text-anchor="middle">
    <rect x="40" y="60" width="20" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/><text x="50" y="78" fill="#3a4a66">a</text>
    <rect x="60" y="60" width="20" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/><text x="70" y="78" fill="#3a4a66">b</text>
    <rect x="80" y="60" width="20" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/><text x="90" y="78" fill="#3a4a66">a</text>
    <rect x="100" y="60" width="20" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/><text x="110" y="78" fill="#3a4a66">b</text>
    <rect x="120" y="60" width="20" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/><text x="130" y="78" fill="#3a4a66">c</text>
    <rect x="140" y="60" width="20" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/><text x="150" y="78" fill="#3a4a66">b</text>
    <rect x="160" y="60" width="20" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/><text x="170" y="78" fill="#3a4a66">a</text>
    <rect x="180" y="60" width="20" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/><text x="190" y="78" fill="#3a4a66">c</text>
    <rect x="200" y="60" width="20" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="3"/><text x="210" y="78" fill="#3a4a66">a</text>

    <rect x="220" y="60" width="20" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/><text x="230" y="78" fill="#3a5a30">d</text>
    <rect x="240" y="60" width="20" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/><text x="250" y="78" fill="#3a5a30">e</text>
    <rect x="260" y="60" width="20" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/><text x="270" y="78" fill="#3a5a30">f</text>
    <rect x="280" y="60" width="20" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/><text x="290" y="78" fill="#3a5a30">e</text>
    <rect x="300" y="60" width="20" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/><text x="310" y="78" fill="#3a5a30">g</text>
    <rect x="320" y="60" width="20" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/><text x="330" y="78" fill="#3a5a30">d</text>
    <rect x="340" y="60" width="20" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="3"/><text x="350" y="78" fill="#3a5a30">e</text>

    <rect x="360" y="60" width="20" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/><text x="370" y="78" fill="#8a6a20">h</text>
    <rect x="380" y="60" width="20" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/><text x="390" y="78" fill="#8a6a20">i</text>
    <rect x="400" y="60" width="20" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/><text x="410" y="78" fill="#8a6a20">j</text>
    <rect x="420" y="60" width="20" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/><text x="430" y="78" fill="#8a6a20">h</text>
    <rect x="440" y="60" width="20" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/><text x="450" y="78" fill="#8a6a20">k</text>
    <rect x="460" y="60" width="20" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/><text x="470" y="78" fill="#8a6a20">l</text>
    <rect x="480" y="60" width="20" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/><text x="490" y="78" fill="#8a6a20">i</text>
    <rect x="500" y="60" width="20" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3"/><text x="510" y="78" fill="#8a6a20">j</text>
  </g>

  <!-- 下标刻度（每 3 格标一个） -->
  <g filter="url(#rough2)" font-size="8" fill="#999" text-anchor="middle">
    <text x="50" y="97">0</text><text x="110" y="97">3</text><text x="170" y="97">6</text>
    <text x="230" y="97">9</text><text x="290" y="97">12</text><text x="350" y="97">15</text>
    <text x="410" y="97">18</text><text x="470" y="97">21</text>
  </g>

  <!-- 三段括号 -->
  <path d="M 40 108 L 40 114 L 220 114 L 220 108" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="130" y="130" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">9（下标 0–8）</text>
  <path d="M 220 108 L 220 114 L 360 114 L 360 108" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="290" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7（9–15）</text>
  <path d="M 360 108 L 360 114 L 520 114 L 520 108" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="440" y="130" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">8（16–23）</text>

  <rect x="30" y="144" width="500" height="150" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="46" y="164" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">end 的扩张轨迹（last：a=8 b=5 c=7 d=14 e=15 f=11 g=13 h=19 i=22 j=23 k=20 l=21）</text>

  <g filter="url(#rough2)" font-size="9.5">
    <text x="46" y="188" fill="#446688">段 1　start=0　i=0 'a' → end=8　│　i=4 'c' → 8 不变　│　i=8 闭合，记 9</text>
    <text x="46" y="212" fill="#4a7a3a">段 2　start=9　i=9 'd' → 14　│　i=10 'e' → 15　│　i=11 'f' → 15 不变　│　i=15 闭合，记 7</text>
    <text x="46" y="236" fill="#8a6a20">段 3　start=16　i=16 'h' → 19　│　i=17 'i' → 22　│　i=18 'j' → 23　│　i=23 闭合，记 8</text>
  </g>

  <text x="46" y="264" font-size="9.5" fill="#555" filter="url(#rough2)">段 3 说明「只看首字母的 last 就切」会漏：h 的 last 只有 19，是随后出现的 i(22)、j(23) 把 end 顶到 23。</text>
  <text x="46" y="280" font-size="9.5" fill="#555" filter="url(#rough2)">段 2 同理：d 的 last 是 14，真正的右端由 e 的 last=15 决定 —— 必须边走边扩张。</text>

  <text x="280" y="310" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">三段长度相加 9 + 7 + 8 = 24 = n，划分覆盖整个字符串，无遗漏</text>
</svg>
