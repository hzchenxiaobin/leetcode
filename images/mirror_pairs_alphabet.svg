<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="51" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：镜像 = 反转字母表，13 对固定搭档</text>
  <path d="M 190 40 Q 320 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- arcs between rows -->
  <g fill="none" filter="url(#sk)">
    <path d="M 70 88 Q 92 133 70 178" stroke="#b85450" stroke-width="2.2"/>
    <path d="M 112 88 Q 134 133 112 178" stroke="#9db3c8" stroke-width="1.2"/>
    <path d="M 153 88 Q 175 133 153 178" stroke="#9db3c8" stroke-width="1.2"/>
    <path d="M 195 88 Q 217 133 195 178" stroke="#9db3c8" stroke-width="1.2"/>
    <path d="M 237 88 Q 259 133 237 178" stroke="#9db3c8" stroke-width="1.2"/>
    <path d="M 278 88 Q 300 133 278 178" stroke="#9db3c8" stroke-width="1.2"/>
    <path d="M 320 88 Q 342 133 320 178" stroke="#9db3c8" stroke-width="1.2"/>
    <path d="M 362 88 Q 384 133 362 178" stroke="#9db3c8" stroke-width="1.2"/>
    <path d="M 403 88 Q 425 133 403 178" stroke="#9db3c8" stroke-width="1.2"/>
    <path d="M 445 88 Q 467 133 445 178" stroke="#9db3c8" stroke-width="1.2"/>
    <path d="M 487 88 Q 509 133 487 178" stroke="#9db3c8" stroke-width="1.2"/>
    <path d="M 528 88 Q 550 133 528 178" stroke="#9db3c8" stroke-width="1.2"/>
    <path d="M 570 88 Q 592 133 570 178" stroke="#c98a2b" stroke-width="2"/>
  </g>

  <!-- top row: a..m -->
  <g filter="url(#sk)">
    <rect x="56" y="58" width="28" height="28" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
    <rect x="98" y="58" width="28" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="139" y="58" width="28" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="181" y="58" width="28" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="223" y="58" width="28" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="264" y="58" width="28" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="306" y="58" width="28" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="348" y="58" width="28" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="389" y="58" width="28" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="431" y="58" width="28" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="473" y="58" width="28" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="514" y="58" width="28" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="556" y="58" width="28" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="70" y="77">a</text>
    <text x="112" y="77">b</text>
    <text x="153" y="77">c</text>
    <text x="195" y="77">d</text>
    <text x="237" y="77">e</text>
    <text x="278" y="77">f</text>
    <text x="320" y="77">g</text>
    <text x="362" y="77">h</text>
    <text x="403" y="77">i</text>
    <text x="445" y="77">j</text>
    <text x="487" y="77">k</text>
    <text x="528" y="77">l</text>
    <text x="570" y="77">m</text>
  </g>

  <!-- bottom row: z..n -->
  <g filter="url(#sk)">
    <rect x="56" y="178" width="28" height="28" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="2"/>
    <rect x="98" y="178" width="28" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="139" y="178" width="28" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="181" y="178" width="28" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="223" y="178" width="28" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="264" y="178" width="28" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="306" y="178" width="28" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="348" y="178" width="28" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="389" y="178" width="28" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="431" y="178" width="28" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="473" y="178" width="28" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="514" y="178" width="28" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <rect x="556" y="178" width="28" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="70" y="197">z</text>
    <text x="112" y="197">y</text>
    <text x="153" y="197">x</text>
    <text x="195" y="197">w</text>
    <text x="237" y="197">v</text>
    <text x="278" y="197">u</text>
    <text x="320" y="197">t</text>
    <text x="362" y="197">s</text>
    <text x="403" y="197">r</text>
    <text x="445" y="197">q</text>
    <text x="487" y="197">p</text>
    <text x="528" y="197">o</text>
    <text x="570" y="197">n</text>
  </g>

  <text x="320" y="226" text-anchor="middle" font-size="11.5" fill="#666">每条弧是一对固定镜像：a↔z、b↔y、c↔x、……、m↔n（恰好 13 对）</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="55" y="240" width="530" height="86" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle">
    <text x="320" y="264" font-size="12.5" font-weight="bold" fill="#7a5415">mirror(c) = chr( ord('a') + ord('z') − ord(c) )，下标形式：idx ↔ 25 − idx</text>
    <text x="320" y="286" font-size="11" fill="#444">ord('a') + ord('z') = 219 是奇数 → 没有字母是自己的镜像；mirror(mirror(c)) = c（对合）</text>
    <text x="320" y="308" font-size="11" fill="#444">匹配只发生在 c 与 mirror(c) 之间 → 26 个字母 = 13 个互不相交的「频道」</text>
  </g>

  <!-- mini example -->
  <g filter="url(#sk)">
    <rect x="55" y="340" width="530" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="320" y="367" text-anchor="middle" font-size="11.5" fill="#2e6e2e">例：s = "aczzx" 里 'z' 只找 'a'、'x' 只找 'c'；同字母、非镜像字母一概无关</text>
</svg>
