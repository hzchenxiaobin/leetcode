<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="211" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="640" height="390" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：同字母格子用虚拟节点缩点</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="66" text-anchor="middle" font-size="12" fill="#888">传送 a→b = 走两条 0 权边 a→V_X→b；步行 = 相邻格子的 1 权边</text>

  <g filter="url(#sk)">
    <rect x="28" y="92" width="278" height="212" rx="10" fill="#f4f8fd" stroke="#4a8edb" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
  <text x="167" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">直接两两连边：O(k²)</text>

  <g filter="url(#sk)">
    <circle cx="167" cy="158" r="22" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="245" cy="206" r="22" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="167" cy="254" r="22" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="89" cy="206" r="22" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" fill="#2b6e9e">
    <text x="167" y="163">A</text>
    <text x="245" y="211">A</text>
    <text x="167" y="259">A</text>
    <text x="89" y="211">A</text>
  </g>

  <g stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)">
    <line x1="167" y1="180" x2="167" y2="232"/>
    <line x1="185" y1="171" x2="227" y2="193"/>
    <line x1="185" y1="241" x2="227" y2="219"/>
    <line x1="149" y1="171" x2="107" y2="193"/>
    <line x1="149" y1="241" x2="107" y2="219"/>
    <line x1="111" y1="206" x2="223" y2="206"/>
  </g>
  <g font-size="10.5" fill="#b85450" text-anchor="middle" font-family="monospace">
    <text x="176" y="204">0</text>
    <text x="212" y="176">0</text>
    <text x="212" y="238">0</text>
    <text x="122" y="176">0</text>
    <text x="122" y="238">0</text>
    <text x="196" y="200">0</text>
  </g>
  <text x="167" y="290" text-anchor="middle" font-size="11" fill="#b85450">4 个 A 格子要 6 条边；k = 10⁶ 时边数爆炸 ✗</text>

  <path d="M 312 200 Q 328 186 344 200" stroke="#4a8e4a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#sk)"/>
  <text x="328" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">缩点</text>

  <g filter="url(#sk)">
    <rect x="350" y="92" width="278" height="212" rx="10" fill="#f2faf4" stroke="#4a8e4a" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>
  <text x="489" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">虚拟节点星形：O(k)</text>

  <g filter="url(#sk)">
    <circle cx="489" cy="146" r="18" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="563" cy="205" r="18" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="489" cy="264" r="18" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="415" cy="205" r="18" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.8"/>
    <circle cx="489" cy="205" r="22" fill="#fef6e6" stroke="#c98a2b" stroke-width="2.2"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#2b6e9e">
    <text x="489" y="151">A</text>
    <text x="563" y="210">A</text>
    <text x="489" y="269">A</text>
    <text x="415" y="210">A</text>
  </g>
  <text x="489" y="210" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">V_A</text>

  <g stroke="#4a8e4a" stroke-width="1.6" fill="none" filter="url(#sk)">
    <line x1="489" y1="164" x2="489" y2="183"/>
    <line x1="545" y1="205" x2="511" y2="205"/>
    <line x1="489" y1="227" x2="489" y2="246"/>
    <line x1="433" y1="205" x2="467" y2="205"/>
  </g>
  <g font-size="10.5" fill="#2e6e2e" text-anchor="middle" font-family="monospace">
    <text x="499" y="178">0</text>
    <text x="528" y="198">0</text>
    <text x="499" y="242">0</text>
    <text x="450" y="198">0</text>
  </g>
  <text x="489" y="290" text-anchor="middle" font-size="11" fill="#2e6e2e">k 个格子只要 k 条边，a→V_A→b 与两两直连等价 ✓</text>

  <g filter="url(#sk)">
    <rect x="28" y="318" width="600" height="36" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="328" y="341" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">传送边权 0、步行边权 1 → 0-1 BFS：0 权边插队首，1 权边进队尾</text>

  <text x="320" y="376" text-anchor="middle" font-size="11" fill="#888">虚拟节点至多 26 个，总节点 mn+26、总边 O(mn)，10⁶ 格子也能线性求解</text>
</svg>
