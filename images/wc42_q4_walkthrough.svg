<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：sentence = "the cattle was rattled by the battery"</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">dictionary = ["cat", "bat", "rat"]；只有沿 Trie 命中终结节点的单词才被替换</text>

  <g filter="url(#rough2)">
    <rect x="40" y="62" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="88" y="82" text-anchor="middle" font-size="11" fill="#2f4666" font-weight="bold">单词</text>
    <text x="231" y="82" text-anchor="middle" font-size="11" fill="#2f4666" font-weight="bold">沿 Trie 下降</text>
    <text x="376" y="82" text-anchor="middle" font-size="11" fill="#2f4666" font-weight="bold">命中词根</text>
    <text x="473" y="82" text-anchor="middle" font-size="11" fill="#2f4666" font-weight="bold">输出</text>
  </g>

  <g filter="url(#rough2)" font-size="11">
    <!-- 行 1 -->
    <rect x="40" y="92" width="480" height="32" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
    <text x="88" y="112" text-anchor="middle" fill="#333">the</text>
    <text x="142" y="112" fill="#777">t 之后没有 h 子节点</text>
    <text x="376" y="112" text-anchor="middle" fill="#aaa">—</text>
    <text x="473" y="112" text-anchor="middle" fill="#333">the</text>
    <!-- 行 2 -->
    <rect x="40" y="124" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="88" y="144" text-anchor="middle" fill="#333">cattle</text>
    <text x="142" y="144" fill="#8a6a20">c → a → t 命中终结</text>
    <text x="376" y="144" text-anchor="middle" fill="#7a5a10" font-weight="bold">cat</text>
    <text x="473" y="144" text-anchor="middle" fill="#7a5a10" font-weight="bold">cat</text>
    <!-- 行 3 -->
    <rect x="40" y="156" width="480" height="32" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
    <text x="88" y="176" text-anchor="middle" fill="#333">was</text>
    <text x="142" y="176" fill="#777">根节点没有 w 子节点</text>
    <text x="376" y="176" text-anchor="middle" fill="#aaa">—</text>
    <text x="473" y="176" text-anchor="middle" fill="#333">was</text>
    <!-- 行 4 -->
    <rect x="40" y="188" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="88" y="208" text-anchor="middle" fill="#333">rattled</text>
    <text x="142" y="208" fill="#8a6a20">r → a → t 命中终结</text>
    <text x="376" y="208" text-anchor="middle" fill="#7a5a10" font-weight="bold">rat</text>
    <text x="473" y="208" text-anchor="middle" fill="#7a5a10" font-weight="bold">rat</text>
    <!-- 行 5 -->
    <rect x="40" y="220" width="480" height="32" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
    <text x="88" y="240" text-anchor="middle" fill="#333">by</text>
    <text x="142" y="240" fill="#777">b → 之后无 y 子节点</text>
    <text x="376" y="240" text-anchor="middle" fill="#aaa">—</text>
    <text x="473" y="240" text-anchor="middle" fill="#333">by</text>
    <!-- 行 6 -->
    <rect x="40" y="252" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="88" y="272" text-anchor="middle" fill="#333">battery</text>
    <text x="142" y="272" fill="#8a6a20">b → a → t 命中终结</text>
    <text x="376" y="272" text-anchor="middle" fill="#7a5a10" font-weight="bold">bat</text>
    <text x="473" y="272" text-anchor="middle" fill="#7a5a10" font-weight="bold">bat</text>
    <!-- 行 7 -->
    <rect x="40" y="284" width="480" height="32" fill="#ffffff" stroke="#ddd" stroke-width="1"/>
    <text x="88" y="304" text-anchor="middle" fill="#333">the</text>
    <text x="142" y="304" fill="#777">t 之后没有 h 子节点</text>
    <text x="376" y="304" text-anchor="middle" fill="#aaa">—</text>
    <text x="473" y="304" text-anchor="middle" fill="#333">the</text>

    <rect x="40" y="62" width="480" height="254" fill="none" stroke="#888" stroke-width="1.6" rx="4"/>
    <line x1="136" y1="62" x2="136" y2="316" stroke="#ccc" stroke-width="1.2"/>
    <line x1="326" y1="62" x2="326" y2="316" stroke="#ccc" stroke-width="1.2"/>
    <line x1="426" y1="62" x2="426" y2="316" stroke="#ccc" stroke-width="1.2"/>
  </g>

  <text x="40" y="340" font-size="11.5" fill="#333" filter="url(#rough2)">输出："the cat was rat by the bat"（共命中 3 个单词，其余原样保留）</text>
  <text x="40" y="360" font-size="10.5" fill="#888" filter="url(#rough2)">注意：命中后立即停止，cattle 的 "tle"、battery 的 "tery" 根本不会被继续比较</text>
</svg>
