<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="640" height="380" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">交换论证：高频字母陷在深槽，换出来代价只降不升</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- before panel -->
  <g filter="url(#sk)">
    <rect x="35" y="64" width="272" height="192" rx="10" fill="#fdf1f3" stroke="#b8546a" stroke-width="1.6"/>
  </g>
  <text x="171" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04a5a" filter="url(#sk)">交换前：高频 a 陷在深槽</text>

  <g filter="url(#sk)" font-size="9.5" fill="#999" text-anchor="end">
    <text x="52" y="123">第1位</text>
    <text x="52" y="157">第2位</text>
    <text x="52" y="191">第3位</text>
  </g>
  <!-- key A: a deep at position 3 -->
  <g filter="url(#sk)">
    <rect x="58"  y="104" width="44" height="30" rx="4" fill="#fafafa" stroke="#b0a8a8" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="58"  y="138" width="44" height="30" rx="4" fill="#fafafa" stroke="#b0a8a8" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="58"  y="172" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b8546a" stroke-width="2.2"/>
  </g>
  <text x="80" y="193" text-anchor="middle" font-size="15" font-weight="bold" fill="#a04a5a" filter="url(#sk)">a</text>
  <text x="108" y="192" font-size="10.5" fill="#a04a5a" filter="url(#sk)">f=5</text>
  <!-- key B: b shallow at position 1 -->
  <g filter="url(#sk)">
    <rect x="210" y="104" width="44" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="232" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">b</text>
  <text x="260" y="124" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">f=1</text>
  <text x="171" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04a5a" filter="url(#sk)">5×3 + 1×1 = 16</text>

  <!-- swap arrows -->
  <path d="M 313 158 L 327 158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 327 172 L 313 172" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="320" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#sk)">交换</text>
  <text x="320" y="196" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">a↔b</text>

  <!-- after panel -->
  <g filter="url(#sk)">
    <rect x="333" y="64" width="272" height="192" rx="10" fill="#f0f8f1" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="469" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">交换后：a 占回浅槽</text>

  <g filter="url(#sk)" font-size="9.5" fill="#999" text-anchor="end">
    <text x="350" y="123">第1位</text>
    <text x="350" y="157">第2位</text>
    <text x="350" y="191">第3位</text>
  </g>
  <!-- key A: a shallow -->
  <g filter="url(#sk)">
    <rect x="356" y="104" width="44" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <text x="378" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">a</text>
  <text x="406" y="124" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">f=5</text>
  <!-- key B: b deep -->
  <g filter="url(#sk)">
    <rect x="508" y="104" width="44" height="30" rx="4" fill="#fafafa" stroke="#b0a8a8" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="508" y="138" width="44" height="30" rx="4" fill="#fafafa" stroke="#b0a8a8" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="508" y="172" width="44" height="30" rx="4" fill="#fce4ec" stroke="#b8546a" stroke-width="2.2"/>
  </g>
  <text x="530" y="193" text-anchor="middle" font-size="15" font-weight="bold" fill="#a04a5a" filter="url(#sk)">b</text>
  <text x="558" y="192" font-size="10.5" fill="#a04a5a" filter="url(#sk)">f=1</text>
  <text x="469" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">5×1 + 1×3 = 8</text>

  <!-- delta banner -->
  <g filter="url(#sk)">
    <rect x="35" y="270" width="570" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="291" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d3b" filter="url(#sk)">Δ = ( f_a − f_b ) ( c_b − c_a ) ≤ 0</text>
  <text x="320" y="310" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#sk)">本例 Δ = (5−1)(1−3) = −8：交换后总代价不增</text>

  <!-- conclusion note -->
  <g filter="url(#sk)">
    <rect x="35" y="330" width="570" height="40" rx="8" fill="#f4f0fa" stroke="#8a6db5" stroke-width="1.4"/>
  </g>
  <text x="320" y="355" text-anchor="middle" font-size="11.5" fill="#5a4480" filter="url(#sk)">每换一次至少消掉一个「高深低浅」逆序对且代价不增 → 终局无逆序对：频率降序 × 位次升序</text>
</svg>
