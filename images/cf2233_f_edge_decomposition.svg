<svg xmlns="http://www.w3.org/2000/svg" width="680" height="404" viewBox="0 0 680 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="680" height="404" fill="#fafafa"/>

  <text x="340" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">一条边：保留 gcd，付两份差值的较大者</text>

  <circle cx="112" cy="150" r="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="112" y="157" text-anchor="middle" font-size="18" fill="#33506b" filter="url(#rough2)">24</text>
  <text x="112" y="108" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">u</text>

  <circle cx="568" cy="150" r="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="568" y="157" text-anchor="middle" font-size="18" fill="#3c6130" filter="url(#rough2)">18</text>
  <text x="568" y="108" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">v</text>

  <path d="M148,150 C240,116 440,116 532,150" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="286" y="86" width="108" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="106" text-anchor="middle" font-size="14" fill="#8a6420" filter="url(#rough2)">w = 4</text>

  <rect x="52" y="206" width="252" height="96" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="234" font-size="15" fill="#33506b" filter="url(#rough2)">24 = 6 × 4</text>
  <rect x="70" y="248" width="40" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="271" text-anchor="middle" font-size="16" fill="#3c6130" filter="url(#rough2)">6</text>
  <text x="126" y="271" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">×</text>
  <rect x="146" y="248" width="40" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="166" y="271" text-anchor="middle" font-size="16" fill="#8a6420" filter="url(#rough2)">4</text>
  <text x="200" y="271" font-size="12" fill="#888" filter="url(#rough2)">= u/g</text>

  <rect x="376" y="206" width="252" height="96" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="394" y="234" font-size="15" fill="#3c6130" filter="url(#rough2)">18 = 6 × 3</text>
  <rect x="394" y="248" width="40" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="414" y="271" text-anchor="middle" font-size="16" fill="#3c6130" filter="url(#rough2)">6</text>
  <text x="450" y="271" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">×</text>
  <rect x="470" y="248" width="40" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="490" y="271" text-anchor="middle" font-size="16" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="524" y="271" font-size="12" fill="#888" filter="url(#rough2)">= v/g</text>

  <text x="340" y="330" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">w(u,v) = max(u/g, v/g) = max(24/6, 18/6) = max(4, 3) = 4</text>

  <rect x="60" y="348" width="560" height="42" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="374" text-anchor="middle" font-size="14" fill="#8f3b38" filter="url(#rough2)">一步 = 除掉 d、乘上 m，代价 max(d, m)：小的那份免费</text>
</svg>
