<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：取二进制串，双指针向中间夹</text>

  <rect x="140" y="48" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s = n 的二进制（无前导零）</text>

  <path d="M260,86 L260,112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="130" y="116" width="260" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans = 0；i = 0；j = len(s) − 1</text>

  <path d="M260,154 L260,180" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="110" y="184" width="300" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">while i &lt; j：</text>
  <text x="260" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s[i] ≠ s[j] ? ans += 2 ；i++ ；j−−</text>

  <path d="M260,230 L260,254" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="260" y="274" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">返回 ans</text>

  <text x="424" y="200" font-size="11" fill="#999" filter="url(#rough2)">O(log n)</text>
</svg>
