<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="960" height="610" fill="#fdfcf7"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 2 演算：三个连通三元组，最小度数为 0</text>
  <path d="M 280 42 Q 480 50 680 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="300" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">n = 7，8 条边，度数标在点旁</text>

  <!-- trio shades -->
  <polygon points="110,150 250,150 180,245" fill="#e8f0fa" fill-opacity="0.5" stroke="none" filter="url(#sk)"/>
  <polygon points="360,150 490,150 420,245" fill="#fef6e6" fill-opacity="0.6" stroke="none" filter="url(#sk)"/>
  <polygon points="490,150 420,245 510,245" fill="#f3eaf7" fill-opacity="0.6" stroke="none" filter="url(#sk)"/>

  <!-- edges (neutral) -->
  <path d="M 110 150 Q 180 140 250 150" stroke="#5a6b7a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 110 150 Q 138 195 172 233" stroke="#5a6b7a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 250 150 Q 222 195 188 233" stroke="#5a6b7a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 360 150 Q 425 138 490 150" stroke="#5a6b7a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 360 150 Q 382 195 408 233" stroke="#5a6b7a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 490 150 Q 462 195 432 233" stroke="#5a6b7a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 490 150 Q 505 195 512 233" stroke="#5a6b7a" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <path d="M 420 245 Q 465 252 510 245" stroke="#5a6b7a" stroke-width="1.8" fill="none" filter="url(#sk)"/>

  <!-- nodes -->
  <g filter="url(#sk)"><circle cx="110" cy="150" r="20" fill="#fdfcf7" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="110" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="110" y="126" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">deg 2</text>

  <g filter="url(#sk)"><circle cx="250" cy="150" r="20" fill="#fdfcf7" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="250" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">3</text>
  <text x="250" y="126" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">deg 2</text>

  <g filter="url(#sk)"><circle cx="180" cy="245" r="20" fill="#fdfcf7" stroke="#4a8edb" stroke-width="2"/></g>
  <text x="180" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">4</text>
  <text x="180" y="285" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">deg 2</text>

  <g filter="url(#sk)"><circle cx="360" cy="150" r="20" fill="#fdfcf7" stroke="#5a6b7a" stroke-width="2"/></g>
  <text x="360" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">2</text>
  <text x="360" y="126" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">deg 2</text>

  <g filter="url(#sk)"><circle cx="490" cy="150" r="20" fill="#fdfcf7" stroke="#c98a2b" stroke-width="2"/></g>
  <text x="490" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">5</text>
  <text x="490" y="126" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">deg 3</text>

  <g filter="url(#sk)"><circle cx="420" cy="245" r="20" fill="#fdfcf7" stroke="#8e5db8" stroke-width="2"/></g>
  <text x="420" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a3a7a">6</text>
  <text x="420" y="285" text-anchor="middle" font-size="10" fill="#5a3a7a" font-weight="bold">deg 3</text>

  <g filter="url(#sk)"><circle cx="510" cy="245" r="20" fill="#fdfcf7" stroke="#8e5db8" stroke-width="2"/></g>
  <text x="510" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a3a7a">7</text>
  <text x="510" y="285" text-anchor="middle" font-size="10" fill="#5a3a7a" font-weight="bold">deg 2</text>

  <!-- trio badges -->
  <g filter="url(#sk)"><circle cx="180" cy="182" r="13" fill="#4a8edb"/></g>
  <text x="180" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#fdfcf7">①</text>
  <g filter="url(#sk)"><circle cx="424" cy="182" r="13" fill="#c98a2b"/></g>
  <text x="424" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#fdfcf7">②</text>
  <g filter="url(#sk)"><circle cx="483" cy="216" r="13" fill="#8e5db8"/></g>
  <text x="483" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#fdfcf7">③</text>

  <!-- ===== Right: computations ===== -->
  <!-- box 1 -->
  <g filter="url(#sk)">
    <rect x="580" y="92" width="360" height="104" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="600" y="118" font-size="13" font-weight="bold" fill="#2e6e2e">① {1, 3, 4}</text>
  <text x="600" y="142" font-size="12" fill="#444" font-family="monospace">deg 和 = 2 + 2 + 2 = 6</text>
  <text x="600" y="164" font-size="12" fill="#444" font-family="monospace">度数 = 6 − 6 = 0</text>
  <text x="600" y="186" font-size="12" font-weight="bold" fill="#2e6e2e" font-family="monospace">无跨出边 → 0 ✓ 最小</text>

  <!-- box 2 -->
  <g filter="url(#sk)">
    <rect x="580" y="212" width="360" height="104" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="600" y="238" font-size="13" font-weight="bold" fill="#7a5415">② {2, 5, 6}</text>
  <text x="600" y="262" font-size="12" fill="#444" font-family="monospace">deg 和 = 2 + 3 + 3 = 8</text>
  <text x="600" y="284" font-size="12" fill="#444" font-family="monospace">度数 = 8 − 6 = 2</text>
  <text x="600" y="306" font-size="11" fill="#7a5415" font-family="monospace">跨出边：5-7、6-7 → 2 ✓</text>

  <!-- box 3 -->
  <g filter="url(#sk)">
    <rect x="580" y="332" width="360" height="104" rx="10" fill="#f3eaf7" stroke="#8e5db8" stroke-width="1.5"/>
  </g>
  <text x="600" y="358" font-size="13" font-weight="bold" fill="#5a3a7a">③ {5, 6, 7}</text>
  <text x="600" y="382" font-size="12" fill="#444" font-family="monospace">deg 和 = 3 + 3 + 2 = 8</text>
  <text x="600" y="404" font-size="12" fill="#444" font-family="monospace">度数 = 8 − 6 = 2</text>
  <text x="600" y="426" font-size="11" fill="#5a3a7a" font-family="monospace">跨出边：2-5、2-6 → 2 ✓</text>

  <!-- ===== Bottom banner ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="470" width="880" height="112" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="500" y="500" text-anchor="middle" font-size="16" font-weight="bold" fill="#b03a3a">答案 = 0</text>
  <text x="500" y="528" text-anchor="middle" font-size="12" fill="#444">⚠ 度数为 0 是合法答案 —— 判断「不存在三元组」必须看 ans 是否被更新过，</text>
  <text x="500" y="548" text-anchor="middle" font-size="12" fill="#444">不能拿 0 当「无解」哨兵；初始值应设为 +∞（C++ 用 INT_MAX，Python 用 inf）。</text>
  <text x="500" y="570" text-anchor="middle" font-size="11" fill="#888">另注意 ② 和 ③ 共享边 5-6：同一条边对不同三元组可能既是内部边又是跨出边。</text>
</svg>
