<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：失配右推两步湮灭 &amp; 双目标对比</text>

  <text x="36" y="48" font-size="11" fill="#333" filter="url(#rough2)">示例 1：nums = [1, −1, 1, −1, 1]，k = 3，目标「全 1」（失配位 1、3，红色）：</text>

  <!-- 行 0：初始 -->
  <text x="56" y="82" font-size="10.5" fill="#666" filter="url(#rough2)">初始</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="100" y="60" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="156" y="60" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="212" y="60" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="268" y="60" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="324" y="60" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="126" y="82" fill="#333">1</text>
    <text x="182" y="82" fill="#b85450" font-weight="bold">−1</text>
    <text x="238" y="82" fill="#333">1</text>
    <text x="294" y="82" fill="#b85450" font-weight="bold">−1</text>
    <text x="350" y="82" fill="#333">1</text>
  </g>

  <path d="M 182 96 L 182 116" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="194" y="110" font-size="10.5" fill="#b85450" filter="url(#rough2)">操作 1：修好位 1，失配右推给位 2</text>

  <!-- 行 1：操作 1 后 -->
  <text x="38" y="142" font-size="10.5" fill="#666" filter="url(#rough2)">操作 1 后</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="100" y="120" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="156" y="120" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="212" y="120" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="268" y="120" width="52" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="324" y="120" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="126" y="142" fill="#333">1</text>
    <text x="182" y="142" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="238" y="142" fill="#b85450" font-weight="bold">−1</text>
    <text x="294" y="142" fill="#b85450" font-weight="bold">−1</text>
    <text x="350" y="142" fill="#333">1</text>
  </g>

  <path d="M 238 156 L 238 176" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="170" font-size="10.5" fill="#b85450" filter="url(#rough2)">操作 2：两个失配一次湮灭</text>

  <!-- 行 2：操作 2 后 -->
  <text x="38" y="202" font-size="10.5" fill="#666" filter="url(#rough2)">操作 2 后</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="100" y="180" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="156" y="180" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="212" y="180" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="268" y="180" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="324" y="180" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="126" y="202" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="182" y="202" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="238" y="202" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="294" y="202" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="350" y="202" fill="#4a7a3a" font-weight="bold">1</text>
  </g>
  <text x="396" y="202" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 全部对齐</text>

  <text x="36" y="236" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">共 2 次操作 ≤ k = 3 → true（目标「全 −1」失配数 = 3 为奇，不可达）</text>

  <!-- 双目标对比 -->
  <text x="36" y="266" font-size="11" fill="#333" filter="url(#rough2)">再如 nums = [−1, 1, 1, −1, 1, 1]，k = 2 —— 两个目标的代价可能差很多：</text>

  <!-- 左 panel：目标全 1 -->
  <rect x="36" y="278" width="236" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="48" y="298" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">目标全 1：失配位 0、3</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="52" y="322" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="86" y="322" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="120" y="322" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="154" y="322" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="188" y="322" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="222" y="322" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="67" y="340" fill="#b85450" font-weight="bold">−1</text>
    <text x="101" y="340" fill="#333">1</text>
    <text x="135" y="340" fill="#333">1</text>
    <text x="169" y="340" fill="#b85450" font-weight="bold">−1</text>
    <text x="203" y="340" fill="#333">1</text>
    <text x="237" y="340" fill="#333">1</text>
  </g>
  <path d="M 67 318 Q 118 298 169 318" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="48" y="368" font-size="10.5" fill="#333" filter="url(#rough2)">配对 (0, 3)：距离 3</text>
  <text x="48" y="386" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3 次操作 &gt; k = 2 ✗</text>

  <!-- 右 panel：目标全 -1 -->
  <rect x="292" y="278" width="236" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="304" y="298" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">目标全 −1：失配位 1、2、4、5</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="308" y="322" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="342" y="322" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="376" y="322" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="410" y="322" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="444" y="322" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="478" y="322" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="323" y="340" fill="#333">−1</text>
    <text x="357" y="340" fill="#b85450" font-weight="bold">1</text>
    <text x="391" y="340" fill="#b85450" font-weight="bold">1</text>
    <text x="425" y="340" fill="#333">−1</text>
    <text x="459" y="340" fill="#b85450" font-weight="bold">1</text>
    <text x="493" y="340" fill="#b85450" font-weight="bold">1</text>
  </g>
  <path d="M 357 318 Q 374 302 391 318" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 459 318 Q 476 302 493 318" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="304" y="368" font-size="10.5" fill="#333" filter="url(#rough2)">配对 (1, 2)、(4, 5)：各 1 次</text>
  <text x="304" y="386" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 次操作 ≤ k = 2 ✓ → true</text>

  <rect x="60" y="410" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="433" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">失配更多的目标反而更省！别只试「变成多数派」</text>
</svg>
