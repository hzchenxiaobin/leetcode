<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#fafafa"/>

  <text x="350" y="32" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">示例 1 走查：words = ["cat","bt","hat","tree"]</text>
  <text x="350" y="54" font-size="12" fill="#777777" text-anchor="middle" filter="url(#rough2)">chars = "atach" → budget：a×2  t×1  c×1  h×1，其余字母 0</text>
  <text x="90.0" y="122" font-size="13" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">单词</text>
  <text x="235.0" y="122" font-size="13" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">需求 need</text>
  <text x="400.0" y="122" font-size="13" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">与预算比对</text>
  <text x="520.0" y="122" font-size="13" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">判定</text>
  <text x="615.0" y="122" font-size="13" fill="#446688" text-anchor="middle" font-weight="bold" filter="url(#rough2)">累计 ans</text>
  <path d="M 40 100 L 40 334" fill="none" stroke="#c9d4e2" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 140 100 L 140 334" fill="none" stroke="#c9d4e2" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 330 100 L 330 334" fill="none" stroke="#c9d4e2" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 470 100 L 470 334" fill="none" stroke="#c9d4e2" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 570 100 L 570 334" fill="none" stroke="#c9d4e2" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 660 100 L 660 334" fill="none" stroke="#c9d4e2" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 40 100 L 660 100" fill="none" stroke="#c9d4e2" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 40 134 L 660 134" fill="none" stroke="#c9d4e2" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 40 184 L 660 184" fill="none" stroke="#c9d4e2" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 40 234 L 660 234" fill="none" stroke="#c9d4e2" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 40 284 L 660 284" fill="none" stroke="#c9d4e2" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 40 334 L 660 334" fill="none" stroke="#c9d4e2" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="40" y="134" width="620" height="50" fill="#f2faf4" stroke="#e0e6ee" stroke-width="0.8" rx="0" filter="url(#rough2)"/>
  <text x="90" y="164" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">cat</text>
  <text x="235" y="164" font-size="13" fill="#444444" text-anchor="middle" filter="url(#rough2)">c1 a1 t1</text>
  <text x="400" y="164" font-size="12.5" fill="#666666" text-anchor="middle" filter="url(#rough2)">全部 ≤ 预算</text>
  <text x="520" y="164" font-size="13" fill="#3a6a2a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">好 ✓</text>
  <text x="615" y="164" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="40" y="184" width="620" height="50" fill="#fdf2f4" stroke="#e0e6ee" stroke-width="0.8" rx="0" filter="url(#rough2)"/>
  <text x="90" y="214" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">bt</text>
  <text x="235" y="214" font-size="13" fill="#444444" text-anchor="middle" filter="url(#rough2)">b1 t1</text>
  <text x="400" y="214" font-size="12.5" fill="#666666" text-anchor="middle" filter="url(#rough2)">b 的预算为 0</text>
  <text x="520" y="214" font-size="13" fill="#b03a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">坏 ✗</text>
  <text x="615" y="214" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="40" y="234" width="620" height="50" fill="#f2faf4" stroke="#e0e6ee" stroke-width="0.8" rx="0" filter="url(#rough2)"/>
  <text x="90" y="264" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">hat</text>
  <text x="235" y="264" font-size="13" fill="#444444" text-anchor="middle" filter="url(#rough2)">h1 a1 t1</text>
  <text x="400" y="264" font-size="12.5" fill="#666666" text-anchor="middle" filter="url(#rough2)">全部 ≤ 预算</text>
  <text x="520" y="264" font-size="13" fill="#3a6a2a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">好 ✓</text>
  <text x="615" y="264" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="40" y="284" width="620" height="50" fill="#fdf2f4" stroke="#e0e6ee" stroke-width="0.8" rx="0" filter="url(#rough2)"/>
  <text x="90" y="314" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">tree</text>
  <text x="235" y="314" font-size="13" fill="#444444" text-anchor="middle" filter="url(#rough2)">t1 r1 e2</text>
  <text x="400" y="314" font-size="12.5" fill="#666666" text-anchor="middle" filter="url(#rough2)">r、e 都超预算</text>
  <text x="520" y="314" font-size="13" fill="#b03a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">坏 ✗</text>
  <text x="615" y="314" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="350" y="372" font-size="15" fill="#b03a3a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">答案 = 3 + 3 = 6（bt、tree 不计入）</text>
</svg>
