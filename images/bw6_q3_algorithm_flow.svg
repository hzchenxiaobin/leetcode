<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：分组 → 排序 → 枚举去重 → 计分取最小</text>

  <!-- 步骤 1 -->
  <rect x="60" y="56" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="13" fill="#2a4a68" filter="url(#rough2)">① 分组：user → [(timestamp, website) 列表]</text>
  <text x="280" y="93" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">unordered_map / defaultdict 一遍扫描完成</text>

  <path d="M 280 100 L 280 118" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="60" y="120" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">② 组内按 timestamp 升序排序（同一用户时刻互异）</text>
  <text x="280" y="157" text-anchor="middle" font-size="11.5" fill="#a08040" filter="url(#rough2)">坑：记录本身乱序，跳过排序 = 序列模式全错</text>

  <path d="M 280 164 L 280 182" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="60" y="184" width="440" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">③ 三重循环 i&lt;j&lt;k 枚举三元组 (w[i],w[j],w[k])</text>
  <text x="280" y="224" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">先放入该用户的去重集合 set，同用户重复只计一次</text>
  <text x="280" y="239" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">（m&lt;3 的用户直接跳过）</text>

  <path d="M 280 244 L 280 262" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 4 -->
  <rect x="60" y="264" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="13" fill="#8c3a34" filter="url(#rough2)">④ 对去重后的三元组全局计分：score[T] += 1</text>
  <text x="280" y="301" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">分子是「不同用户数」而非访问次数</text>

  <path d="M 280 308 L 280 326" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 5 -->
  <rect x="110" y="328" width="340" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12.5" fill="#2a4a68" font-weight="bold" filter="url(#rough2)">⑤ 按字典序遍历 score，严格大于才更新 → 返回</text>
</svg>
