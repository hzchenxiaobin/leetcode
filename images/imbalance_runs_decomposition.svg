<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：imbalance = D − 1（连续段分解）</text>
  <path d="M 170 42 Q 340 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="340" y="70" text-anchor="middle" font-size="12" fill="#555">设子数组的去重集合 S = {1, 2, 3, 5, 8, 9, 10}，按值画在数轴上：</text>

  <!-- Value axis -->
  <line x1="70" y1="150" x2="630" y2="150" stroke="#888" stroke-width="1.5" filter="url(#sk)"/>

  <!-- Run 1: 1,2,3 -->
  <g filter="url(#sk)">
    <rect x="100" y="118" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="156" y="118" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="212" y="118" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="288" y="118" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="424" y="118" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="480" y="118" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="536" y="118" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="126" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="182" y="138" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="238" y="138" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="314" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a">5</text>
  <text x="450" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a">8</text>
  <text x="506" y="138" text-anchor="middle" font-size="13" fill="#333">9</text>
  <text x="562" y="138" text-anchor="middle" font-size="13" fill="#333">10</text>

  <!-- Run brackets above -->
  <path d="M 100 108 Q 182 96 264 108" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="182" y="94" text-anchor="middle" font-size="11.5" fill="#4a7a3a">连续段 ①</text>
  <path d="M 288 108 Q 314 100 340 108" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="314" y="94" text-anchor="middle" font-size="11.5" fill="#446688">段 ②</text>
  <path d="M 424 108 Q 506 96 588 108" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="506" y="94" text-anchor="middle" font-size="11.5" fill="#446688">连续段 ③</text>

  <!-- Gap annotations below axis -->
  <path d="M 264 150 Q 276 168 288 150" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="276" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">gap 2</text>
  <path d="M 340 150 Q 382 168 424 150" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="382" y="184" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">gap 3</text>

  <!-- D and imbalance boxes -->
  <g filter="url(#sk)">
    <rect x="70" y="210" width="280" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="210" y="233" text-anchor="middle" font-size="12.5" fill="#7a5415">D = #{v ∈ S : v−1 ∉ S}（段首个数）</text>
  <text x="210" y="254" text-anchor="middle" font-size="12.5" fill="#7a5415">= {1, 5, 8} → D = 3</text>

  <g filter="url(#sk)">
    <rect x="370" y="210" width="260" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="500" y="233" text-anchor="middle" font-size="12.5" fill="#8a3a36">imbalance = 段间 gap 数</text>
  <text x="500" y="254" text-anchor="middle" font-size="12.5" fill="#8a3a36">= 3 − 1 = 2</text>

  <path d="M 210 268 Q 340 284 500 268" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="340" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">imbalance = D − 1（每个非最小段的段首贡献一个 gap）</text>

  <g filter="url(#sk)">
    <rect x="60" y="318" width="560" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="340" y="342" text-anchor="middle" font-size="12.5" fill="#33507a">关键改写：v−1 ∉ S 且 v 有前驱 ⟺ v 与前驱的差 &gt; 1</text>
  <text x="340" y="364" text-anchor="middle" font-size="12.5" fill="#33507a">于是「数 gap」变成「数断点值 v」，断点只依赖 v−1 是否出现，可按出现位置计数</text>
</svg>
