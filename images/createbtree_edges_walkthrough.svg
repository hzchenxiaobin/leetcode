<svg xmlns="http://www.w3.org/2000/svg" width="560" height="452" viewBox="0 0 560 452" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="452" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：5 条边逐条消化，根自动浮现</text>
  <path d="M 150 38 Q 280 48 410 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- tree edges -->
  <g filter="url(#sk)" stroke="#8a8a8a" stroke-width="1.8" fill="none">
    <path d="M 268 78 L 211 103"/>
    <path d="M 292 78 L 349 103"/>
    <path d="M 190 126 L 166 149"/>
    <path d="M 210 126 L 232 149"/>
    <path d="M 350 126 L 330 149"/>
  </g>
  <g filter="url(#sk)" font-size="11" font-weight="bold" text-anchor="middle">
    <text x="228" y="84" fill="#446688">1</text>
    <text x="332" y="84" fill="#b85450">0</text>
    <text x="170" y="134" fill="#446688">1</text>
    <text x="228" y="134" fill="#b85450">0</text>
    <text x="334" y="134" fill="#446688">1</text>
  </g>

  <!-- tree nodes -->
  <g filter="url(#sk)">
    <circle cx="280" cy="66" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <circle cx="200" cy="114" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="360" cy="114" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="158" cy="162" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="242" cy="162" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="322" cy="162" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#sk)" font-size="12.5" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="280" y="71" fill="#2b4a1e">50</text>
    <text x="200" y="119">20</text>
    <text x="360" y="119">80</text>
    <text x="158" y="167" font-size="11.5">15</text>
    <text x="242" y="167" font-size="11.5">17</text>
    <text x="322" y="167" font-size="11.5">19</text>
  </g>
  <text x="322" y="54" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b4a1e" filter="url(#sk)">★ 根</text>

  <!-- legend -->
  <g filter="url(#sk)">
    <rect x="402" y="130" width="146" height="44" rx="8" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/>
  </g>
  <text x="475" y="148" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">图例：边上的 1/0 = isLeft</text>
  <text x="475" y="164" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#sk)">1 → 左孩子，0 → 右孩子</text>

  <!-- walkthrough table -->
  <g filter="url(#sk)" stroke="#c8c8c8" stroke-width="1" fill="#ffffff">
    <rect x="40"  y="196" width="30"  height="22"/>
    <rect x="70"  y="196" width="90"  height="22"/>
    <rect x="160" y="196" width="172" height="22"/>
    <rect x="332" y="196" width="54"  height="22"/>
    <rect x="386" y="196" width="130" height="22"/>
    <rect x="40"  y="218" width="30"  height="22"/>
    <rect x="70"  y="218" width="90"  height="22"/>
    <rect x="160" y="218" width="172" height="22"/>
    <rect x="332" y="218" width="54"  height="22"/>
    <rect x="386" y="218" width="130" height="22"/>
    <rect x="40"  y="240" width="30"  height="22"/>
    <rect x="70"  y="240" width="90"  height="22"/>
    <rect x="160" y="240" width="172" height="22"/>
    <rect x="332" y="240" width="54"  height="22"/>
    <rect x="386" y="240" width="130" height="22"/>
    <rect x="40"  y="262" width="30"  height="22" fill="#fff8e1"/>
    <rect x="70"  y="262" width="90"  height="22" fill="#fff8e1"/>
    <rect x="160" y="262" width="172" height="22" fill="#fff8e1"/>
    <rect x="332" y="262" width="54"  height="22" fill="#fff8e1"/>
    <rect x="386" y="262" width="130" height="22" fill="#fff8e1"/>
    <rect x="40"  y="284" width="30"  height="22" fill="#f6f8fb"/>
    <rect x="70"  y="284" width="90"  height="22" fill="#f6f8fb"/>
    <rect x="160" y="284" width="172" height="22" fill="#f6f8fb"/>
    <rect x="332" y="284" width="54"  height="22" fill="#f6f8fb"/>
    <rect x="386" y="284" width="130" height="22" fill="#f6f8fb"/>
    <rect x="40"  y="306" width="30"  height="22" fill="#f6f8fb"/>
    <rect x="70"  y="306" width="90"  height="22" fill="#f6f8fb"/>
    <rect x="160" y="306" width="172" height="22" fill="#f6f8fb"/>
    <rect x="332" y="306" width="54"  height="22" fill="#f6f8fb"/>
    <rect x="386" y="306" width="130" height="22" fill="#f6f8fb"/>
    <rect x="40"  y="328" width="30"  height="22" fill="#f0f9f1"/>
    <rect x="70"  y="328" width="90"  height="22" fill="#f0f9f1"/>
    <rect x="160" y="328" width="172" height="22" fill="#f0f9f1"/>
    <rect x="332" y="328" width="54"  height="22" fill="#f0f9f1"/>
    <rect x="386" y="328" width="130" height="22" fill="#f0f9f1"/>
  </g>
  <g filter="url(#sk)" font-size="11" fill="#2b2b2b" text-anchor="middle" font-weight="bold">
    <text x="55"  y="211">步</text>
    <text x="115" y="211">当前边</text>
    <text x="246" y="211">动作</text>
    <text x="359" y="211">新增</text>
    <text x="451" y="211">children（累计）</text>
  </g>
  <g filter="url(#sk)" font-size="10.5" fill="#2b2b2b" text-anchor="middle">
    <text x="55"  y="233">①</text>
    <text x="115" y="233">[20,15,1]</text>
    <text x="246" y="233">建 20、15；20.left←15</text>
    <text x="359" y="233">20, 15</text>
    <text x="451" y="233">{15}</text>
    <text x="55"  y="255">②</text>
    <text x="115" y="255">[20,17,0]</text>
    <text x="246" y="255">建 17；20.right←17</text>
    <text x="359" y="255">17</text>
    <text x="451" y="255">{15,17}</text>
    <text x="55"  y="277" font-weight="bold">③</text>
    <text x="115" y="277" font-weight="bold">[50,20,1]</text>
    <text x="246" y="277" font-weight="bold">建 50；50.left←20</text>
    <text x="359" y="277" font-weight="bold">50</text>
    <text x="451" y="277" font-weight="bold">{15,17,20}</text>
    <text x="55"  y="299">④</text>
    <text x="115" y="299">[50,80,0]</text>
    <text x="246" y="299">建 80；50.right←80</text>
    <text x="359" y="299">80</text>
    <text x="451" y="299">{15,17,20,80}</text>
    <text x="55"  y="321">⑤</text>
    <text x="115" y="321">[80,19,1]</text>
    <text x="246" y="321">建 19；80.left←19</text>
    <text x="359" y="321">19</text>
    <text x="451" y="321">{15,17,20,80,19}</text>
    <text x="55"  y="343" font-weight="bold">找根</text>
    <text x="115" y="343">—</text>
    <text x="246" y="343" font-weight="bold">扫 nodes：键 ∉ children</text>
    <text x="359" y="343">—</text>
    <text x="451" y="343" font-weight="bold" fill="#2b4a1e">差集 = {50} ★</text>
  </g>

  <!-- note about step 3 -->
  <g filter="url(#sk)">
    <rect x="40" y="360" width="476" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="278" y="377" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">步骤 ③：20 在 ① 中已作为 parent 建出，此刻又作为 child 出现</text>
  <text x="278" y="393" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">哈希表保证两次取到同一对象 → 50.left 直接连上，无需「森林合并」</text>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="40" y="408" width="476" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="278" y="423" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a1e" filter="url(#sk)">根 = nodes − children = {50}，返回节点 50 ✓ 层序 [50,20,80,15,17,19]</text>
  <text x="278" y="438" text-anchor="middle" font-size="10.5" fill="#2b4a1e" filter="url(#sk)">顺序无关：5 条边任意打乱（如示例 3），结果不变</text>
</svg>
