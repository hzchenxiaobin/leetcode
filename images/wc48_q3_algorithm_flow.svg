<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">从右往左扫一遍：维护后缀最大值与候选交换对</text>

  <!-- 初始化 -->
  <rect x="18" y="126" width="150" height="124" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="93" y="152" text-anchor="middle" font-size="9.6" fill="#33475b" filter="url(#rough2)">num → 字符数组 d</text>
  <text x="93" y="174" text-anchor="middle" font-size="9.6" fill="#33475b" filter="url(#rough2)">n = 位数（≤ 9）</text>
  <text x="93" y="196" text-anchor="middle" font-size="9.6" fill="#33475b" filter="url(#rough2)">maxDigit = '0'</text>
  <text x="93" y="218" text-anchor="middle" font-size="9.6" fill="#33475b" filter="url(#rough2)">maxIdx = −1</text>
  <text x="93" y="240" text-anchor="middle" font-size="9.6" fill="#33475b" filter="url(#rough2)">i = n − 1</text>

  <path d="M168,188 L184,188" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环体 -->
  <rect x="186" y="86" width="320" height="212" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="346" y="110" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">for i = n − 1 downto 0</text>

  <rect x="202" y="124" width="288" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="214" y="146" font-size="9.4" fill="#2e6e2e" filter="url(#rough2)">d[i] &gt; maxDigit：右侧出现更大的数字</text>
  <text x="214" y="168" font-size="9.4" fill="#2e6e2e" filter="url(#rough2)">maxDigit = d[i]，maxIdx = i</text>

  <rect x="202" y="196" width="288" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="214" y="218" font-size="9.4" fill="#b85450" filter="url(#rough2)">d[i] &lt; maxDigit：这一位可以换大</text>
  <text x="214" y="240" font-size="9.4" fill="#b85450" filter="url(#rough2)">(u, v) = (i, maxIdx)，覆盖旧值</text>

  <text x="346" y="278" text-anchor="middle" font-size="8.8" fill="#8a6d1f" filter="url(#rough2)">d[i] == maxDigit 时不更新 ⇒ maxIdx 始终是该最大值最靠右的下标</text>

  <path d="M470,298 C 470,346 224,346 224,298" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="366" text-anchor="middle" font-size="9.4" fill="#446688" filter="url(#rough2)">i ← i − 1 后继续；i &lt; 0 时跳出循环</text>

  <!-- 收尾 -->
  <path d="M506,196 L526,196" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="530" y="140" width="170" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="615" y="166" text-anchor="middle" font-size="9.4" fill="#2e6e2e" filter="url(#rough2)">若 u ≠ −1：</text>
  <text x="615" y="188" text-anchor="middle" font-size="9.4" fill="#2e6e2e" filter="url(#rough2)">交换 d[u] ⇄ d[v]</text>
  <text x="615" y="210" text-anchor="middle" font-size="9.4" fill="#2e6e2e" filter="url(#rough2)">再转回整数返回</text>
  <text x="615" y="232" text-anchor="middle" font-size="9.4" fill="#2e6e2e" filter="url(#rough2)">（否则原样返回）</text>
</svg>
