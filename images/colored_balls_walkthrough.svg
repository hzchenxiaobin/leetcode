<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="480" fill="#fafafa"/>

  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">示例演算：inventory = [2,8,4,10,6]，orders = 20</text>
  <text x="380" y="44" text-anchor="middle" font-size="10.5" fill="#888">count(3) = 20 ≥ orders &gt; count(4) = 16 ⇒ T* = 3</text>

  <!-- column headers -->
  <text x="92" y="68" text-anchor="middle" font-size="10.5" fill="#555">inv=2</text>
  <text x="182" y="68" text-anchor="middle" font-size="10.5" fill="#555">inv=8</text>
  <text x="272" y="68" text-anchor="middle" font-size="10.5" fill="#555">inv=4</text>
  <text x="362" y="68" text-anchor="middle" font-size="10.5" fill="#555">inv=10</text>
  <text x="452" y="68" text-anchor="middle" font-size="10.5" fill="#555">inv=6</text>

  <!-- column 0: inv=2 (x=60) gray only -->
  <g filter="url(#rough2)"><rect x="60" y="316" width="64" height="22" rx="3" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/></g>
  <text x="92" y="331" text-anchor="middle" font-size="10" fill="#999">2</text>
  <g filter="url(#rough2)"><rect x="60" y="338" width="64" height="22" rx="3" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/></g>
  <text x="92" y="353" text-anchor="middle" font-size="10" fill="#999">1</text>

  <!-- column 1: inv=8 (x=150) -->
  <g filter="url(#rough2)"><rect x="150" y="184" width="64" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="182" y="199" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e2e">8</text>
  <g filter="url(#rough2)"><rect x="150" y="206" width="64" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="182" y="221" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e2e">7</text>
  <g filter="url(#rough2)"><rect x="150" y="228" width="64" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="182" y="243" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e2e">6</text>
  <g filter="url(#rough2)"><rect x="150" y="250" width="64" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="182" y="265" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e2e">5</text>
  <g filter="url(#rough2)"><rect x="150" y="272" width="64" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="182" y="287" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e2e">4</text>
  <g filter="url(#rough2)"><rect x="150" y="294" width="64" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="182" y="309" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415">3</text>
  <g filter="url(#rough2)"><rect x="150" y="316" width="64" height="22" rx="3" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/></g>
  <text x="182" y="331" text-anchor="middle" font-size="10" fill="#999">2</text>
  <g filter="url(#rough2)"><rect x="150" y="338" width="64" height="22" rx="3" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/></g>
  <text x="182" y="353" text-anchor="middle" font-size="10" fill="#999">1</text>

  <!-- column 2: inv=4 (x=240) -->
  <g filter="url(#rough2)"><rect x="240" y="272" width="64" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="272" y="287" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e2e">4</text>
  <g filter="url(#rough2)"><rect x="240" y="294" width="64" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="272" y="309" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415">3</text>
  <g filter="url(#rough2)"><rect x="240" y="316" width="64" height="22" rx="3" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/></g>
  <text x="272" y="331" text-anchor="middle" font-size="10" fill="#999">2</text>
  <g filter="url(#rough2)"><rect x="240" y="338" width="64" height="22" rx="3" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/></g>
  <text x="272" y="353" text-anchor="middle" font-size="10" fill="#999">1</text>

  <!-- column 3: inv=10 (x=330) -->
  <g filter="url(#rough2)"><rect x="330" y="140" width="64" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="362" y="155" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e2e">10</text>
  <g filter="url(#rough2)"><rect x="330" y="162" width="64" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="362" y="177" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e2e">9</text>
  <g filter="url(#rough2)"><rect x="330" y="184" width="64" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="362" y="199" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e2e">8</text>
  <g filter="url(#rough2)"><rect x="330" y="206" width="64" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="362" y="221" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e2e">7</text>
  <g filter="url(#rough2)"><rect x="330" y="228" width="64" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="362" y="243" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e2e">6</text>
  <g filter="url(#rough2)"><rect x="330" y="250" width="64" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="362" y="265" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e2e">5</text>
  <g filter="url(#rough2)"><rect x="330" y="272" width="64" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="362" y="287" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e2e">4</text>
  <g filter="url(#rough2)"><rect x="330" y="294" width="64" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="362" y="309" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415">3</text>
  <g filter="url(#rough2)"><rect x="330" y="316" width="64" height="22" rx="3" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/></g>
  <text x="362" y="331" text-anchor="middle" font-size="10" fill="#999">2</text>
  <g filter="url(#rough2)"><rect x="330" y="338" width="64" height="22" rx="3" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/></g>
  <text x="362" y="353" text-anchor="middle" font-size="10" fill="#999">1</text>

  <!-- column 4: inv=6 (x=420) -->
  <g filter="url(#rough2)"><rect x="420" y="228" width="64" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="452" y="243" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e2e">6</text>
  <g filter="url(#rough2)"><rect x="420" y="250" width="64" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="452" y="265" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e2e">5</text>
  <g filter="url(#rough2)"><rect x="420" y="272" width="64" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="452" y="287" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e5e2e">4</text>
  <g filter="url(#rough2)"><rect x="420" y="294" width="64" height="22" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="452" y="309" text-anchor="middle" font-size="10" font-weight="bold" fill="#7a5415">3</text>
  <g filter="url(#rough2)"><rect x="420" y="316" width="64" height="22" rx="3" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/></g>
  <text x="452" y="331" text-anchor="middle" font-size="10" fill="#999">2</text>
  <g filter="url(#rough2)"><rect x="420" y="338" width="64" height="22" rx="3" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/></g>
  <text x="452" y="353" text-anchor="middle" font-size="10" fill="#999">1</text>

  <!-- threshold line at y=294 -->
  <path d="M 44 294 L 500 294" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="504" y="290" font-size="11" font-weight="bold" fill="#b85450">T*=3</text>
  <text x="46" y="308" font-size="9" fill="#b85450">线上方（价值 ≥ 4）全部卖出</text>

  <!-- baseline -->
  <path d="M 44 360 L 500 360" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- per column sums -->
  <text x="92" y="382" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="92" y="398" text-anchor="middle" font-size="8.5" fill="#999">不卖</text>
  <text x="182" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">30</text>
  <text x="182" y="398" text-anchor="middle" font-size="8.5" fill="#888">4+…+8</text>
  <text x="272" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">4</text>
  <text x="272" y="398" text-anchor="middle" font-size="8.5" fill="#888">4</text>
  <text x="362" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">49</text>
  <text x="362" y="398" text-anchor="middle" font-size="8.5" fill="#888">4+…+10</text>
  <text x="452" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">15</text>
  <text x="452" y="398" text-anchor="middle" font-size="8.5" fill="#888">4+…+6</text>

  <!-- right computation box -->
  <g filter="url(#rough2)">
    <rect x="530" y="80" width="216" height="270" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="546" y="102" font-size="12" font-weight="bold" fill="#446688">批量结算</text>
  <text x="546" y="124" font-size="9.5" fill="#444">inv=8： (8+4)·(8−3)/2 = 30</text>
  <text x="546" y="142" font-size="9.5" fill="#444">inv=4： (4+4)·(4−3)/2 = 4</text>
  <text x="546" y="160" font-size="9.5" fill="#444">inv=10：(10+4)·(10−3)/2 = 49</text>
  <text x="546" y="178" font-size="9.5" fill="#444">inv=6： (6+4)·(6−3)/2 = 15</text>
  <text x="546" y="196" font-size="9.5" fill="#999">inv=2： ≤ T*，不卖 0</text>
  <path d="M 546 210 L 730 210" stroke="#c5d5e8" stroke-width="1" filter="url(#rough2)"/>
  <text x="546" y="230" font-size="10.5" font-weight="bold" fill="#2e5e2e">小计 98（16 个球）</text>
  <text x="546" y="252" font-size="10.5" fill="#7a5415">rest = 20 − 16 = 4</text>
  <text x="546" y="270" font-size="10.5" fill="#7a5415">4 × T* = 4 × 3 = 12</text>
  <text x="546" y="296" font-size="12" font-weight="bold" fill="#b85450">合计 110 ✓</text>
  <text x="546" y="318" font-size="9" fill="#888">98 + 12 = 110</text>
  <text x="546" y="336" font-size="9" fill="#888">橙格 = 4 个价值 3 的球</text>

  <!-- legend -->
  <g filter="url(#rough2)"><rect x="60" y="420" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="80" y="431" font-size="9.5" fill="#444">价值 &gt; T*：全部卖出</text>
  <g filter="url(#rough2)"><rect x="270" y="420" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="290" y="431" font-size="9.5" fill="#444">价值 = T*：补齐 rest 个</text>
  <g filter="url(#rough2)"><rect x="480" y="420" width="14" height="14" rx="3" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="500" y="431" font-size="9.5" fill="#444">价值 &lt; T*：不卖</text>
</svg>
