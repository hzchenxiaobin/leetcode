<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold" filter="url(#rough2)">k 份副本：最大子数组只有三种落法</text>
  <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">随 k 增长的只有「完整副本」的个数，其余形状与 k 无关</text>

  <!-- 形态 ① -->
  <text x="26" y="108" font-size="12" fill="#2f4460" font-weight="bold" filter="url(#rough2)">① 单份内部</text>
  <g filter="url(#rough2)">
    <rect x="180" y="88" width="96" height="38" fill="#f2f2f2" stroke="#aaa" stroke-width="1.2" rx="4" stroke-dasharray="5 3"/>
    <text x="228" y="112" text-anchor="middle" font-size="11" fill="#888">arr</text>
    <rect x="288" y="88" width="96" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="316" y="95" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <text x="339" y="112" text-anchor="middle" font-size="10" fill="#8a6a20">子数组</text>
    <rect x="396" y="88" width="96" height="38" fill="#f2f2f2" stroke="#aaa" stroke-width="1.2" rx="4" stroke-dasharray="5 3"/>
    <text x="444" y="112" text-anchor="middle" font-size="11" fill="#888">arr</text>
  </g>
  <text x="180" y="146" font-size="10.5" fill="#666" filter="url(#rough2)">长度 ≤ n：只在 k = 1 时有用，就是 best₁</text>

  <!-- 形态 ② -->
  <text x="26" y="196" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">② 跨 1 条边界</text>
  <g filter="url(#rough2)">
    <rect x="180" y="178" width="110" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="212" y="202" text-anchor="middle" font-size="11" fill="#2f4460">arr</text>
    <rect x="236" y="184" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <text x="260" y="202" text-anchor="middle" font-size="10" fill="#8a6a20">后缀</text>
    <rect x="302" y="178" width="110" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="368" y="202" text-anchor="middle" font-size="11" fill="#2f4460">arr</text>
    <rect x="308" y="184" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <text x="332" y="202" text-anchor="middle" font-size="10" fill="#8a6a20">前缀</text>
  </g>
  <text x="180" y="236" font-size="10.5" fill="#666" filter="url(#rough2)">最大后缀 + 最大前缀，即两份拼接的 Kadane 答案 best₂</text>

  <!-- 形态 ③ -->
  <text x="26" y="286" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">③ 跨 ≥ 2 条边界</text>
  <g filter="url(#rough2)">
    <rect x="180" y="268" width="96" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="232" y="274" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <text x="254" y="292" text-anchor="middle" font-size="10" fill="#8a6a20">后缀</text>
    <rect x="288" y="268" width="96" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="336" y="292" text-anchor="middle" font-size="10" fill="#3a5a30">整份</text>
    <rect x="396" y="268" width="96" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="444" y="292" text-anchor="middle" font-size="10" fill="#3a5a30">整份 ×(k−2)</text>
    <rect x="504" y="268" width="96" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="504" y="274" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <text x="526" y="292" text-anchor="middle" font-size="10" fill="#8a3a36">前缀</text>
  </g>
  <text x="180" y="326" font-size="10.5" fill="#666" filter="url(#rough2)">后缀 + (k−2) 个整份 + 前缀：只有 total &gt; 0 才值得吃满整份</text>

  <rect x="120" y="344" width="380" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="369" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">ans = max(best₂, 后缀 + (k−2)·total + 前缀)</text>
</svg>
