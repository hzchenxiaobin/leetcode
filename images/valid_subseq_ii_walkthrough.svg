<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a8578"/>
    </marker>
  </defs>
  <rect width="940" height="640" fill="#fdfcf7"/>
  <text x="470" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk2)">示例演算：nums = [1,4,2,3,1,4]，k = 3 —— m = 2 一轮（胜出轮）</text>
  <path d="M 190 44 Q 470 52 750 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== top strip: x / p / q ===== -->
  <g text-anchor="end" font-size="11" fill="#888">
    <text x="110" y="82" filter="url(#sk2)">x</text>
    <text x="110" y="116" filter="url(#sk2)">p = x mod 3</text>
    <text x="110" y="150" filter="url(#sk2)">q = (2−p) mod 3</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <g fill="#444">
      <g filter="url(#sk2)"><rect x="120" y="64" width="52" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
      <text x="146" y="83" filter="url(#sk2)">1</text>
      <g filter="url(#sk2)"><rect x="180" y="64" width="52" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
      <text x="206" y="83" filter="url(#sk2)">4</text>
      <g filter="url(#sk2)"><rect x="240" y="64" width="52" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
      <text x="266" y="83" filter="url(#sk2)">2</text>
      <g filter="url(#sk2)"><rect x="300" y="64" width="52" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
      <text x="326" y="83" filter="url(#sk2)">3</text>
      <g filter="url(#sk2)"><rect x="360" y="64" width="52" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
      <text x="386" y="83" filter="url(#sk2)">1</text>
      <g filter="url(#sk2)"><rect x="420" y="64" width="52" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
      <text x="446" y="83" filter="url(#sk2)">4</text>
    </g>
    <g font-weight="bold" fill="#2b4a6e">
      <g filter="url(#sk2)"><rect x="120" y="98" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
      <text x="146" y="117" filter="url(#sk2)">1</text>
      <g filter="url(#sk2)"><rect x="180" y="98" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
      <text x="206" y="117" filter="url(#sk2)">1</text>
      <g filter="url(#sk2)"><rect x="240" y="98" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
      <text x="266" y="117" filter="url(#sk2)">2</text>
      <g filter="url(#sk2)"><rect x="300" y="98" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
      <text x="326" y="117" filter="url(#sk2)">0</text>
      <g filter="url(#sk2)"><rect x="360" y="98" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
      <text x="386" y="117" filter="url(#sk2)">1</text>
      <g filter="url(#sk2)"><rect x="420" y="98" width="52" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
      <text x="446" y="117" filter="url(#sk2)">1</text>
    </g>
    <g font-weight="bold">
      <g filter="url(#sk2)"><rect x="120" y="132" width="52" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
      <text x="146" y="151" fill="#7a5415" filter="url(#sk2)">1</text>
      <g filter="url(#sk2)"><rect x="180" y="132" width="52" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
      <text x="206" y="151" fill="#7a5415" filter="url(#sk2)">1</text>
      <g filter="url(#sk2)"><rect x="240" y="132" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
      <text x="266" y="151" fill="#2d5a26" filter="url(#sk2)">0</text>
      <g filter="url(#sk2)"><rect x="300" y="132" width="52" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
      <text x="326" y="151" fill="#2d5a26" filter="url(#sk2)">2</text>
      <g filter="url(#sk2)"><rect x="360" y="132" width="52" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
      <text x="386" y="151" fill="#7a5415" filter="url(#sk2)">1</text>
      <g filter="url(#sk2)"><rect x="420" y="132" width="52" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
      <text x="446" y="151" fill="#7a5415" filter="url(#sk2)">1</text>
    </g>
  </g>
  <g font-size="11.5" fill="#444">
    <text x="500" y="84" filter="url(#sk2)">m = 2 时前驱余数 q = (2 − p) mod 3：p = 1 ⇒ q = 1（自环）</text>
    <text x="500" y="106" filter="url(#sk2)">p = 2 ⇒ q = 0；p = 0 ⇒ q = 2 —— 前驱余数没有任何选择余地</text>
    <text x="500" y="128" font-weight="bold" fill="#7a5415" filter="url(#sk2)">余数 1 的元素有 4 个，本轮主线是它们串成的同余数链</text>
    <text x="500" y="150" font-size="10.5" fill="#999" filter="url(#sk2)">（橙色 = 自环格子 q = p，绿色 = 换余数的格子）</text>
  </g>

  <!-- ===== main table ===== -->
  <text x="470" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#sk2)">f 数组的逐步演化（橙色 = 本次被写入的格子；f[r] 初值全 0）</text>
  <g font-size="11.5" font-weight="bold" fill="#2b4a6e" text-anchor="middle">
    <g filter="url(#sk)"><rect x="150" y="202" width="352" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
    <text x="170" y="222" filter="url(#sk2)">i</text>
    <text x="212" y="222" filter="url(#sk2)">p</text>
    <text x="256" y="222" filter="url(#sk2)">q</text>
    <text x="306" y="222" filter="url(#sk2)">f[0]</text>
    <text x="362" y="222" filter="url(#sk2)">f[1]</text>
    <text x="418" y="222" filter="url(#sk2)">f[2]</text>
  </g>
  <text x="611" y="222" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk2)">更新后的最优链</text>

  <g font-size="12" text-anchor="middle">
    <!-- row 0 -->
    <text x="170" y="255" fill="#444" filter="url(#sk2)">0</text>
    <text x="212" y="255" fill="#444" filter="url(#sk2)">1</text>
    <text x="256" y="255" fill="#444" filter="url(#sk2)">1</text>
    <g filter="url(#sk2)"><rect x="278" y="240" width="56" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
    <text x="306" y="259" fill="#444">0</text>
    <g filter="url(#sk2)"><rect x="334" y="240" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
    <text x="362" y="259" font-weight="bold" fill="#7a5415">1</text>
    <g filter="url(#sk2)"><rect x="390" y="240" width="56" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
    <text x="418" y="259" fill="#444">0</text>
    <text x="456" y="259" text-anchor="start" font-size="11.5" fill="#444" filter="url(#sk2)">[1]（f[1] = 0+1，单元素起步）</text>
    <!-- row 1 -->
    <text x="170" y="293" fill="#444" filter="url(#sk2)">1</text>
    <text x="212" y="293" fill="#444" filter="url(#sk2)">1</text>
    <text x="256" y="293" fill="#444" filter="url(#sk2)">1</text>
    <g filter="url(#sk2)"><rect x="278" y="278" width="56" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
    <text x="306" y="297" fill="#444">0</text>
    <g filter="url(#sk2)"><rect x="334" y="278" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
    <text x="362" y="297" font-weight="bold" fill="#7a5415">2</text>
    <g filter="url(#sk2)"><rect x="390" y="278" width="56" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
    <text x="418" y="297" fill="#444">0</text>
    <text x="456" y="297" text-anchor="start" font-size="11.5" fill="#444" filter="url(#sk2)">[1,4]（1+4=5 ≡ 2）</text>
    <!-- row 2 -->
    <text x="170" y="331" fill="#444" filter="url(#sk2)">2</text>
    <text x="212" y="331" fill="#444" filter="url(#sk2)">2</text>
    <text x="256" y="331" fill="#444" filter="url(#sk2)">0</text>
    <g filter="url(#sk2)"><rect x="278" y="316" width="56" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
    <text x="306" y="335" fill="#444">0</text>
    <g filter="url(#sk2)"><rect x="334" y="316" width="56" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
    <text x="362" y="335" fill="#444">2</text>
    <g filter="url(#sk2)"><rect x="390" y="316" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
    <text x="418" y="335" font-weight="bold" fill="#7a5415">1</text>
    <text x="456" y="335" text-anchor="start" font-size="11.5" fill="#444" filter="url(#sk2)">[2]（q=0 格还没有链，另起炉灶）</text>
    <!-- row 3 -->
    <text x="170" y="369" fill="#444" filter="url(#sk2)">3</text>
    <text x="212" y="369" fill="#444" filter="url(#sk2)">0</text>
    <text x="256" y="369" fill="#444" filter="url(#sk2)">2</text>
    <g filter="url(#sk2)"><rect x="278" y="354" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
    <text x="306" y="373" font-weight="bold" fill="#7a5415">2</text>
    <g filter="url(#sk2)"><rect x="334" y="354" width="56" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
    <text x="362" y="373" fill="#444">2</text>
    <g filter="url(#sk2)"><rect x="390" y="354" width="56" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
    <text x="418" y="373" fill="#444">1</text>
    <text x="456" y="373" text-anchor="start" font-size="11.5" fill="#444" filter="url(#sk2)">[2,3]（2+3=5 ≡ 2，接到上行的 [2]）</text>
    <!-- row 4 -->
    <text x="170" y="407" fill="#444" filter="url(#sk2)">4</text>
    <text x="212" y="407" fill="#444" filter="url(#sk2)">1</text>
    <text x="256" y="407" fill="#444" filter="url(#sk2)">1</text>
    <g filter="url(#sk2)"><rect x="278" y="392" width="56" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
    <text x="306" y="411" fill="#444">2</text>
    <g filter="url(#sk2)"><rect x="334" y="392" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
    <text x="362" y="411" font-weight="bold" fill="#7a5415">3</text>
    <g filter="url(#sk2)"><rect x="390" y="392" width="56" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
    <text x="418" y="411" fill="#444">1</text>
    <text x="456" y="411" text-anchor="start" font-size="11.5" fill="#444" filter="url(#sk2)">[1,4,1]（自环 +1：5, 5 ≡ 2）</text>
    <!-- row 5 -->
    <text x="170" y="445" fill="#444" filter="url(#sk2)">5</text>
    <text x="212" y="445" fill="#444" filter="url(#sk2)">1</text>
    <text x="256" y="445" fill="#444" filter="url(#sk2)">1</text>
    <g filter="url(#sk2)"><rect x="278" y="430" width="56" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
    <text x="306" y="449" fill="#444">2</text>
    <g filter="url(#sk2)"><rect x="334" y="430" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
    <text x="362" y="449" font-weight="bold" fill="#7a5415">4</text>
    <g filter="url(#sk2)"><rect x="390" y="430" width="56" height="28" rx="4" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.3"/></g>
    <text x="418" y="449" fill="#444">1</text>
    <text x="456" y="449" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2d5a26" filter="url(#sk2)">[1,4,1,4] ✓（5, 5, 5 ≡ 2，全程自环）</text>
  </g>

  <!-- ===== bottom: three rounds ===== -->
  <g filter="url(#sk)"><rect x="90" y="486" width="240" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <text x="210" y="510" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a26" filter="url(#sk2)">m = 2 轮：max = 4 ✓ 胜出</text>
  <text x="210" y="532" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk2)">链 [1,4,1,4]（下标 0,1,4,5）</text>
  <text x="210" y="554" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk2)">相邻和 5, 5, 5 全 ≡ 2 (mod 3)</text>
  <g filter="url(#sk)"><rect x="350" y="486" width="240" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="470" y="510" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk2)">m = 0 轮：max = 3</text>
  <text x="470" y="532" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk2)">链 [1,2,1]（下标 0,2,4）</text>
  <text x="470" y="554" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk2)">相邻和 3, 3 全 ≡ 0 (mod 3)</text>
  <g filter="url(#sk)"><rect x="610" y="486" width="240" height="92" rx="10" fill="#f5f2ea" stroke="#8a8578" stroke-width="1.4"/></g>
  <text x="730" y="510" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#444" filter="url(#sk2)">m = 1 轮：max = 3</text>
  <text x="730" y="532" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk2)">链 [1,3,1]（下标 0,3,4）</text>
  <text x="730" y="554" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk2)">相邻和 4, 4 全 ≡ 1 (mod 3)</text>

  <g filter="url(#sk)"><rect x="90" y="592" width="760" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="470" y="617" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk2)">ans = max( m=0 轮, m=1 轮, m=2 轮 ) = max(3, 3, 4) = 4，对应最长有效子序列 [1,4,1,4]</text>
</svg>
