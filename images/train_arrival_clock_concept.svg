<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：24 小时制 = 模 24 的加法</text>
  <path d="M 180 42 Q 320 50 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Formula box -->
  <g filter="url(#sk)">
    <rect x="150" y="56" width="340" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="81" text-anchor="middle" font-size="14.5" fill="#446688" font-weight="bold">实际到站 = (arrivalTime + delayedTime) mod 24</text>

  <!-- 24-hour clock circle -->
  <g filter="url(#sk)">
    <circle cx="220" cy="215" r="105" fill="#ffffff" stroke="#446688" stroke-width="2"/>
  </g>
  <!-- ticks: 24 positions, hour h at angle h/24*360 - 90 degrees -->
  <!-- key labels 0,6,12,18 -->
  <text x="220" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">0</text>
  <text x="220" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">12</text>
  <text x="88" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">18</text>
  <text x="352" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">6</text>
  <!-- minor ticks every 3 hours -->
  <g stroke="#9aa8b8" stroke-width="1.5" filter="url(#sk)">
    <path d="M 220 108 L 220 116"/>
    <path d="M 257 116 L 253 123"/>
    <path d="M 286 136 L 281 142"/>
    <path d="M 305 165 L 298 169"/>
    <path d="M 312 195 L 304 197"/>
    <path d="M 312 235 L 304 233"/>
    <path d="M 305 265 L 298 261"/>
    <path d="M 286 294 L 281 288"/>
    <path d="M 257 314 L 253 307"/>
    <path d="M 183 314 L 187 307"/>
    <path d="M 154 294 L 159 288"/>
    <path d="M 135 265 L 142 261"/>
    <path d="M 128 235 L 136 233"/>
    <path d="M 128 195 L 136 197"/>
    <path d="M 135 165 L 142 169"/>
    <path d="M 154 136 L 159 142"/>
    <path d="M 183 116 L 187 123"/>
  </g>

  <!-- start point: 13 o'clock (angle = 13/24*360 - 90 = 105 deg) -->
  <!-- 13 at (220 + 88*cos(105°), 215 + 88*sin(105°)) = (220 - 22.8, 215 + 85) ≈ (197, 300) -->
  <g filter="url(#sk)">
    <circle cx="197" cy="300" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="176" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">13:00</text>
  <text x="176" y="335" text-anchor="middle" font-size="11" fill="#4a7a3a">正点到站</text>

  <!-- end point: 24 = 0 (top) -->
  <g filter="url(#sk)">
    <circle cx="220" cy="110" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="258" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">00:00</text>
  <text x="258" y="117" text-anchor="middle" font-size="11" fill="#b85450">实际到站</text>

  <!-- arc arrow from 13 counterclockwise? clockwise: 13 -> 14 ... -> 24, going left-up through 18 -->
  <path d="M 190 290 Q 120 250 115 185 Q 112 130 195 106"
        stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#sk)"
        stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="128" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" transform="rotate(-52 128 135)">延误 11 小时</text>

  <!-- right explanation panel -->
  <g filter="url(#sk)">
    <rect x="395" y="125" width="210" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="500" y="146" text-anchor="middle" font-size="12" fill="#2e6e2e">13 + 5 = 18 → 不越界，直接返回</text>

  <g filter="url(#sk)">
    <rect x="395" y="175" width="210" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="500" y="196" text-anchor="middle" font-size="12" fill="#b85450">13 + 11 = 24 → 00:00，返回 0</text>

  <g filter="url(#sk)">
    <rect x="395" y="225" width="210" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="500" y="246" text-anchor="middle" font-size="12" fill="#7a5415">最大和 23 + 24 = 47 → 23</text>

  <g filter="url(#sk)">
    <rect x="395" y="275" width="210" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="500" y="296" text-anchor="middle" font-size="12" fill="#446688">一个 mod 24 全部搞定</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="60" y="345" width="520" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="320" y="362" text-anchor="middle" font-size="11.5" fill="#7a5415">24 小时制里 24:00 就是 00:00——和恰好为 24 时答案是 0 而不是 24</text>
  <text x="320" y="380" text-anchor="middle" font-size="11.5" fill="#7a5415">数据范围保证和 ≤ 47 &lt; 48 = 2×24，最多绕一圈，mod 24 足够</text>
</svg>
