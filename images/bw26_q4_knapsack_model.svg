<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    完全背包模型：数位 = 物品，位数 = 价值
  </text>

  <!-- 物品表 -->
  <g filter="url(#rough2)" font-size="13" fill="#666">
    <rect x="60" y="58" width="400" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="120" y="77" text-anchor="middle">数位 d（物品）</text>
    <text x="220" y="77" text-anchor="middle">成本 cost[d-1]（体积）</text>
    <text x="330" y="77" text-anchor="middle">价值（每件）</text>
    <text x="410" y="77" text-anchor="middle">件数</text>
  </g>
  <g filter="url(#rough2)" font-size="13">
    <rect x="60" y="88" width="400" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="120" y="105" text-anchor="middle" fill="#446688">1 ~ 9</text>
    <text x="220" y="105" text-anchor="middle" fill="#446688">cost[i]（各不相同）</text>
    <text x="330" y="105" text-anchor="middle" fill="#446688">1（写一位）</text>
    <text x="410" y="105" text-anchor="middle" fill="#446688">无限件</text>
  </g>
  <g filter="url(#rough2)" font-size="13">
    <rect x="60" y="114" width="400" height="24" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <text x="120" y="131" text-anchor="middle" fill="#8a5a55">背包容量</text>
    <text x="220" y="131" text-anchor="middle" fill="#8a5a55">target（必须恰好装满）</text>
    <text x="330" y="131" text-anchor="middle" fill="#8a5a55">最大化总价值 = 位数</text>
    <text x="410" y="131" text-anchor="middle" fill="#8a5a55">—</text>
  </g>

  <!-- 两阶段 -->
  <path d="M 260 146 L 260 172" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="14">
    <rect x="40" y="174" width="210" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="145" y="200" text-anchor="middle" fill="#446688" font-weight="bold">阶段一：最大位数</text>
    <text x="145" y="224" text-anchor="middle" fill="#446688">f[t] = 成本恰为 t 的</text>
    <text x="145" y="244" text-anchor="middle" fill="#446688">最多数位个数（-1 不可行）</text>
  </g>
  <g filter="url(#rough2)" font-size="14">
    <rect x="270" y="174" width="210" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="375" y="200" text-anchor="middle" fill="#2f5a24" font-weight="bold">阶段二：字典序最大</text>
    <text x="375" y="224" text-anchor="middle" fill="#2f5a24">高位到低位，每步选</text>
    <text x="375" y="244" text-anchor="middle" fill="#2f5a24">保住位数的最大数位</text>
  </g>
  <path d="M 250 217 L 270 217" stroke="#446688" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 比较规则 -->
  <rect x="70" y="280" width="380" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"
        filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">
    不含 0 的正整数比大小：位数多者恒大
  </text>
  <text x="260" y="326" text-anchor="middle" font-size="14" fill="#8a6a1a" filter="url(#rough2)">
    位数相同再按字典序 —— 两阶段排序键
  </text>
</svg>
