<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：153 成立，123 不成立</text>

  <!-- 153 -->
  <text x="46" y="66" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 153，k = 3</text>
  <g filter="url(#rough2)">
    <rect x="46"  y="80" width="86" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="132" y="80" width="86" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="218" y="80" width="86" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="89"  y="102">数位 1</text><text x="175" y="102">数位 5</text><text x="261" y="102">数位 3</text>
    <text x="89"  y="124">1³ = 1</text><text x="175" y="124">5³ = 125</text><text x="261" y="124">3³ = 27</text>
  </g>
  <rect x="330" y="88" width="184" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="422" y="115" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">1+125+27 = 153 ✓ true</text>
  <path d="M 304 106 L 326 106" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 123 -->
  <text x="46" y="176" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 123，k = 3</text>
  <g filter="url(#rough2)">
    <rect x="46"  y="190" width="86" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="132" y="190" width="86" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="218" y="190" width="86" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="89"  y="212">数位 1</text><text x="175" y="212">数位 2</text><text x="261" y="212">数位 3</text>
    <text x="89"  y="234">1³ = 1</text><text x="175" y="234">2³ = 8</text><text x="261" y="234">3³ = 27</text>
  </g>
  <rect x="330" y="198" width="184" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="422" y="225" text-anchor="middle" font-size="14" fill="#7a2e2a" font-weight="bold" filter="url(#rough2)">1+8+27 = 36 ≠ 123 ✗ false</text>
  <path d="M 304 216 L 326 216" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 提前剪枝说明 -->
  <rect x="46" y="268" width="468" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="13" fill="#7a5c1e" filter="url(#rough2)">剪枝小技巧：累加过程中一旦 sum &gt; n 即可返回 false</text>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">（n ≤ 10⁸ 最多 9 位，9⁹ ≈ 3.9×10⁸ 仍在 int 范围内，long long 更保险）</text>
</svg>
