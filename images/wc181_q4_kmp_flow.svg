<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 690" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="690" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold" filter="url(#rough2)">π 的线性递推：继承 → 回退 → 扩展</text>
  <path d="M 130 34 Q 310 44 490 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough)"/>

  <!-- 开始 -->
  <rect x="80" y="44" width="220" height="44" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">π[0] = 0，i = 1</text>

  <path d="M 190 88 L 190 102" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 继承 -->
  <rect x="65" y="106" width="250" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4258" filter="url(#rough2)">j = π[i−1]</text>
  <text x="190" y="146" text-anchor="middle" font-size="10.5" fill="#2c4258" filter="url(#rough2)">继承上一位置的最长边界</text>

  <path d="M 190 158 L 190 176" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：失配？ -->
  <polygon points="190,182 320,234 190,286 60,234" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="230" text-anchor="middle" font-size="12" fill="#5a4a20" filter="url(#rough2)">j &gt; 0 且</text>
  <text x="190" y="248" text-anchor="middle" font-size="12" fill="#5a4a20" filter="url(#rough2)">s[i] ≠ s[j] ？</text>

  <text x="330" y="226" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">是</text>
  <path d="M 320 234 L 441 234" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 回退框 -->
  <rect x="445" y="210" width="140" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="515" y="230" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a4a20" filter="url(#rough2)">j = π[j−1]</text>
  <text x="515" y="247" text-anchor="middle" font-size="10.5" fill="#5a4a20" filter="url(#rough2)">换成更短的边界</text>

  <!-- 回退回环 -->
  <path d="M 515 208 L 515 172 L 200 172" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="360" y="166" text-anchor="middle" font-size="10.5" fill="#a07828" filter="url(#rough2)">继续试探更短边界</text>

  <text x="202" y="304" text-anchor="middle" font-size="11" fill="#3a6a2a" filter="url(#rough2)">否</text>
  <path d="M 190 286 L 190 304" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 2：匹配？ -->
  <polygon points="190,310 315,362 190,414 65,362" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="367" text-anchor="middle" font-size="12" fill="#2c4258" filter="url(#rough2)">s[i] = s[j] ？</text>

  <text x="325" y="354" text-anchor="middle" font-size="11" fill="#2f5a22" filter="url(#rough2)">是</text>
  <path d="M 315 362 L 441 362" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 扩展框 -->
  <rect x="445" y="340" width="140" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="515" y="360" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">j += 1</text>
  <text x="515" y="377" text-anchor="middle" font-size="10.5" fill="#2f5a22" filter="url(#rough2)">边界延长一位</text>

  <!-- 扩展汇合 -->
  <path d="M 515 388 L 515 428 L 198 428" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="180" y="436" text-anchor="end" font-size="10.5" fill="#3a6a2a" filter="url(#rough2)">否（j 必为 0）</text>
  <path d="M 190 414 L 190 440" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 赋值 -->
  <rect x="65" y="444" width="250" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="471" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c4258" filter="url(#rough2)">π[i] = j</text>

  <path d="M 190 488 L 190 506" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 3：循环？ -->
  <polygon points="190,512 305,560 190,608 75,560" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="565" text-anchor="middle" font-size="12" fill="#2c4258" filter="url(#rough2)">还有下一个 i ？</text>

  <text x="58" y="548" text-anchor="middle" font-size="11" fill="#2f5a22" filter="url(#rough2)">是</text>
  <path d="M 73 560 L 40 560 L 40 132 L 61 132" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="28" y="350" font-size="10" fill="#4a7a3a" transform="rotate(-90 28 350)" text-anchor="middle" filter="url(#rough2)">i += 1，继续</text>

  <text x="202" y="624" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">否</text>
  <path d="M 190 608 L 190 626" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="80" y="632" width="220" height="46" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="660" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5a22" filter="url(#rough2)">返回 s[0 : π[n−1]]</text>
</svg>
