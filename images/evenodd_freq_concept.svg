<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="131" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">奇偶频次拆分：各取极值再相减</text>
  <path d="M 180 42 Q 320 52 460 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- string cells -->
  <text x="60" y="82" font-size="12" fill="#666">s =</text>
  <g font-family="monospace" font-size="13" fill="#333" text-anchor="middle">
    <g filter="url(#sk)"><rect x="92" y="64" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="132" y="64" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="172" y="64" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="212" y="64" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="252" y="64" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="292" y="64" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="332" y="64" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
    <g filter="url(#sk)"><rect x="372" y="64" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/></g>
    <text x="112" y="84">a</text><text x="152" y="84">a</text><text x="192" y="84">a</text>
    <text x="232" y="84">a</text><text x="272" y="84">a</text><text x="312" y="84">b</text>
    <text x="352" y="84">b</text><text x="392" y="84">c</text>
  </g>

  <!-- freq table -->
  <g filter="url(#sk)">
    <rect x="140" y="112" width="240" height="34" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="260" y="134" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">频次表：a:5  b:2  c:1</text>

  <!-- arrows to two groups -->
  <path d="M 210 146 Q 160 168 150 186" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 310 146 Q 360 168 370 186" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- odd group -->
  <g filter="url(#sk)">
    <rect x="60" y="190" width="180" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="150" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#9c6d14">奇频组（a₁ 候选）</text>
  <g font-family="monospace" font-size="12" fill="#444">
    <text x="82" y="234">a → 5 （奇）✓</text>
    <text x="82" y="252">c → 1 （奇）✓</text>
    <text x="82" y="278" fill="#9c6d14" font-weight="bold">取最大 maxOdd = 5</text>
  </g>

  <!-- even group -->
  <g filter="url(#sk)">
    <rect x="340" y="190" width="180" height="110" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="430" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e">偶频组（a₂ 候选）</text>
  <g font-family="monospace" font-size="12" fill="#444">
    <text x="362" y="234">b → 2 （偶）✓</text>
    <text x="362" y="252">d~z → 0 ✗ 跳过</text>
    <text x="362" y="278" fill="#2b4a6e" font-weight="bold">取最小 minEven = 2</text>
  </g>

  <!-- result -->
  <g filter="url(#sk)">
    <rect x="180" y="330" width="280" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="352" text-anchor="middle" font-size="13" fill="#2e5e22" font-family="monospace">maxOdd − minEven =</text>
  <text x="320" y="372" text-anchor="middle" font-size="18" fill="#2e5e22" font-weight="bold">5 − 2 = 3 ✓</text>
</svg>
