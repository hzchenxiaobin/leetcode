<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：每组一次 O(n) 扫描</text>
  <text x="260" y="50" text-anchor="middle" font-size="11.5" fill="#6b6b6b" filter="url(#rough2)">不需要模拟任何一步走法，也不需要搜索</text>

  <!-- 步骤 1 -->
  <rect x="100" y="66" width="320" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 t；每组读 n 和数组 a[1..n]</text>
  <path d="M 260 108 L 260 124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="100" y="126" width="320" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">统计 c = 数组里 1 的个数（边读边数）</text>
  <path d="M 260 168 L 260 184" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="100" y="186" width="320" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">Elsie 的步数 E = floor((n−1)/2)</text>
  <path d="M 260 228 L 260 247" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- 判定 -->
  <polygon points="260,248 400,296 260,344 120,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="291" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c &gt; E ?</text>
  <text x="260" y="311" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">（等价 2c ≥ n）</text>

  <!-- 是分支 -->
  <path d="M 190 320 L 152 364" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="204" y="336" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="60" y="368" width="180" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="397" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#33582a" filter="url(#rough2)">输出 Bessie</text>

  <!-- 否分支 -->
  <path d="M 330 320 L 368 364" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="316" y="336" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="280" y="368" width="180" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="370" y="397" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">输出 Elsie</text>

  <text x="260" y="432" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">总复杂度 O(Σn) ≤ 5×10⁴ 次读入，1 s 时限绰绰有余</text>
</svg>
