<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 576" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="576" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：逐字符取队首 + 查更小数字</text>

  <text x="26" y="50" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">例 1：s = "84532" → t = "34852"（成功）</text>

  <rect x="30" y="62" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2:[4]</text>
  <rect x="106" y="62" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3:[3]</text>
  <rect x="182" y="62" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">4:[1]</text>
  <rect x="258" y="62" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">5:[2]</text>
  <rect x="334" y="62" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">8:[0]</text>
  <text x="408" y="80" font-size="10.5" fill="#888" filter="url(#rough2)">其余队列空</text>

  <text x="64" y="104" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="136" y="104" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">t[i]</text>
  <text x="205" y="104" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">取出 p</text>
  <text x="240" y="104" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">更小数字检查（c &lt; d）</text>
  <text x="455" y="104" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">结果</text>

  <rect x="36" y="112" width="448" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=0</text>
  <text x="136" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">'3'</text>
  <text x="205" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p=3</text>
  <text x="240" y="130" font-size="11" fill="#333" filter="url(#rough2)">0、1、2 队列全空</text>
  <text x="455" y="130" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="36" y="142" width="448" height="26" fill="#f4f4f4" stroke="#cccccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=1</text>
  <text x="136" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">'4'</text>
  <text x="205" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p=1</text>
  <text x="240" y="160" font-size="11" fill="#333" filter="url(#rough2)">3 已消耗；0、1、2 空</text>
  <text x="455" y="160" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="36" y="172" width="448" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="190" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=2</text>
  <text x="136" y="190" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">'8'</text>
  <text x="205" y="190" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p=0</text>
  <text x="240" y="190" font-size="11" fill="#333" filter="url(#rough2)">2、5 在 p 右边；3、4 已消耗</text>
  <text x="455" y="190" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="36" y="202" width="448" height="26" fill="#f4f4f4" stroke="#cccccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=3</text>
  <text x="136" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">'5'</text>
  <text x="205" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p=2</text>
  <text x="240" y="220" font-size="11" fill="#333" filter="url(#rough2)">2 在 p 右边；3、4 已消耗</text>
  <text x="455" y="220" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="36" y="232" width="448" height="26" fill="#ffffff" stroke="#cccccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i=4</text>
  <text x="136" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">'2'</text>
  <text x="205" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p=4</text>
  <text x="240" y="250" font-size="11" fill="#333" filter="url(#rough2)">0、1 队列全空</text>
  <text x="455" y="250" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="120" y="268" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">五步全部通过 → 返回 true</text>

  <text x="26" y="330" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">例 3：s = "12345" → t = "12435"（第 3 步被挡）</text>

  <rect x="40" y="368" width="34" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="389" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="80" y="368" width="34" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="389" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="120" y="368" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="389" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="160" y="368" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="177" y="389" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="200" y="368" width="34" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="389" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <text x="57" y="414" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="97" y="414" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="137" y="414" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="177" y="414" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="217" y="414" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>

  <text x="137" y="432" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">未用的 3，q=2</text>

  <path d="M 141 364 C 141 348, 173 348, 173 364" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="157" y="352" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="182" y="362" font-size="10.5" fill="#b07818" font-weight="bold" filter="url(#rough2)">t[2]='4'，p=3</text>

  <text x="272" y="360" font-size="11" fill="#333" filter="url(#rough2)">前两步 '1'、'2' 均顺利消耗 ✓</text>
  <text x="272" y="378" font-size="11" fill="#333" filter="url(#rough2)">处理 t[2]='4'：最左未用 4 在 p=3；</text>
  <text x="272" y="396" font-size="11" fill="#333" filter="url(#rough2)">更小的 3 尚未使用，q=2 &lt; p=3；</text>
  <text x="272" y="414" font-size="11" fill="#333" filter="url(#rough2)">由不变量，3 永远挡在 4 前面</text>
  <text x="272" y="432" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 判定失败</text>

  <rect x="60" y="448" width="400" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="468" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4 无法越过 3 → 返回 false</text>

  <rect x="36" y="496" width="448" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="520" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">对比例 1 的 t[2]='8'（p=0）：更小的 2、5 都在 p 的右边，</text>
  <text x="260" y="542" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">不构成障碍——只有位于 d 左边的未用更小数字才是路障。</text>
</svg>
