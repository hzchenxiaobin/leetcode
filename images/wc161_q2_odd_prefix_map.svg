<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="34" y="28" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">奇偶二值化 → 前缀和 → 查表计数</text>
  <text x="34" y="48" font-size="10.5" fill="#888" filter="url(#rough2)">只看奇偶：奇数记 1、偶数记 0，原问题变成「和为 k 的连续子数组数」</text>

  <!-- 图例 -->
  <rect x="470" y="16" width="13" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="489" y="26" font-size="10" fill="#8a3a36" filter="url(#rough2)">奇数</text>
  <rect x="537" y="16" width="13" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="556" y="26" font-size="10" fill="#3a4a66" filter="url(#rough2)">偶数</text>

  <!-- 行标签 -->
  <text x="58" y="99" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">nums</text>
  <text x="58" y="149" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">b = x &amp; 1</text>
  <text x="58" y="199" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">P[i]</text>

  <!-- nums 行 -->
  <g filter="url(#rough2)">
    <rect x="70" y="78" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="92" y="100" text-anchor="middle" font-size="13" fill="#8a3a36">1</text>
    <rect x="124" y="78" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="146" y="100" text-anchor="middle" font-size="13" fill="#8a3a36">1</text>
    <rect x="178" y="78" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="200" y="100" text-anchor="middle" font-size="13" fill="#3a4a66">2</text>
    <rect x="232" y="78" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="254" y="100" text-anchor="middle" font-size="13" fill="#8a3a36">1</text>
    <rect x="286" y="78" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="308" y="100" text-anchor="middle" font-size="13" fill="#8a3a36">1</text>
  </g>
  <g font-size="9" fill="#999" filter="url(#rough2)">
    <text x="92" y="124" text-anchor="middle">0</text>
    <text x="146" y="124" text-anchor="middle">1</text>
    <text x="200" y="124" text-anchor="middle">2</text>
    <text x="254" y="124" text-anchor="middle">3</text>
    <text x="308" y="124" text-anchor="middle">4</text>
  </g>

  <!-- b 行 -->
  <g filter="url(#rough2)">
    <rect x="70" y="132" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="92" y="152" text-anchor="middle" font-size="12" fill="#8a6a20">1</text>
    <rect x="124" y="132" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="146" y="152" text-anchor="middle" font-size="12" fill="#8a6a20">1</text>
    <rect x="178" y="132" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="200" y="152" text-anchor="middle" font-size="12" fill="#8a6a20">0</text>
    <rect x="232" y="132" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="254" y="152" text-anchor="middle" font-size="12" fill="#8a6a20">1</text>
    <rect x="286" y="132" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="308" y="152" text-anchor="middle" font-size="12" fill="#8a6a20">1</text>
  </g>

  <!-- P 行（6 个前缀值） -->
  <g filter="url(#rough2)">
    <rect x="70" y="182" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="92" y="203" text-anchor="middle" font-size="13" fill="#2f4a26">0</text>
    <rect x="124" y="182" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="146" y="203" text-anchor="middle" font-size="13" fill="#2f4a26">1</text>
    <rect x="178" y="182" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="200" y="203" text-anchor="middle" font-size="13" fill="#2f4a26">2</text>
    <rect x="232" y="182" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="254" y="203" text-anchor="middle" font-size="13" fill="#2f4a26">2</text>
    <rect x="286" y="182" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="308" y="203" text-anchor="middle" font-size="13" fill="#2f4a26">3</text>
    <rect x="340" y="182" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="362" y="203" text-anchor="middle" font-size="13" fill="#2f4a26">4</text>
  </g>
  <g font-size="9" fill="#999" filter="url(#rough2)">
    <text x="92" y="228" text-anchor="middle">P[0]</text>
    <text x="146" y="228" text-anchor="middle">P[1]</text>
    <text x="200" y="228" text-anchor="middle">P[2]</text>
    <text x="254" y="228" text-anchor="middle">P[3]</text>
    <text x="308" y="228" text-anchor="middle">P[4]</text>
    <text x="362" y="228" text-anchor="middle">P[5]</text>
  </g>

  <!-- 两对差为 3 的前缀：P[0]→P[4]，P[1]→P[5] -->
  <g filter="url(#rough2)" fill="none" stroke-linecap="round">
    <path d="M 92 176 L 92 166 L 308 166 L 308 176" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3"/>
    <path d="M 146 240 L 146 250 L 362 250 L 362 240" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 3"/>
  </g>
  <text x="200" y="162" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">P[4] − P[0] = 3</text>
  <text x="254" y="264" text-anchor="middle" font-size="9.5" fill="#2f4a26" filter="url(#rough2)">P[5] − P[1] = 3</text>

  <!-- 右侧哈希表卡 -->
  <rect x="404" y="70" width="228" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="518" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">计数表 cnt：P 值 → 出现次数</text>
  <text x="418" y="112" font-size="9.5" fill="#555" filter="url(#rough2)">子数组 (i, j] 含 k 个奇数</text>
  <text x="418" y="130" font-size="9.5" fill="#555" filter="url(#rough2)">⇔ P[j] − P[i] = k</text>
  <text x="418" y="148" font-size="9.5" fill="#555" filter="url(#rough2)">⇔ P[i] = P[j] − k</text>
  <text x="418" y="172" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">扫描到 j 时，答案 += cnt[P[j] − k]</text>
  <text x="418" y="190" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">随后 cnt[P[j]] += 1（先查后插）</text>
  <text x="418" y="208" font-size="9.5" fill="#888" filter="url(#rough2)">顺序反了会把 i = j 的空子数组算进来</text>

  <!-- 底部结论 -->
  <rect x="34" y="278" width="592" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="50" y="300" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">示例 1（nums = [1,1,2,1,1]，k = 3）里恰好有两对前缀差为 3：</text>
  <text x="50" y="322" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">P[4] = 3 与 P[0] = 0 → 子数组 nums[0..3] = [1,1,2,1]</text>
  <text x="50" y="344" font-size="10.5" fill="#2f4a26" filter="url(#rough2)">P[5] = 4 与 P[1] = 1 → 子数组 nums[1..4] = [1,2,1,1]</text>
  <text x="50" y="368" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">其余前缀值两两之差都不为 3，故答案为 2 —— 一次线性扫描即可数清所有配对。</text>
</svg>
