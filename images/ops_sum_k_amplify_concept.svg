<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">同样两步：先 +1 再复制 vs 先复制再 +1</text>

  <!-- Panel A: wrong order -->
  <text x="36" y="70" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 顺序 A：先复制，再给副本 +1</text>
  <rect x="36" y="84" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="61" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v</text>
  <path d="M 90 101 L 126 101" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="109" y="94" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">复制</text>
  <rect x="136" y="84" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="159" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v</text>
  <rect x="184" y="84" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v</text>
  <path d="M 234 101 L 270 101" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="94" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">副本 +1</text>
  <rect x="280" y="84" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="303" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v</text>
  <rect x="328" y="84" width="54" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="355" y="106" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">v+1</text>
  <text x="470" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">和 = 2v+1</text>

  <!-- Panel B: right order -->
  <text x="36" y="182" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 顺序 B：先 +1，再复制</text>
  <rect x="36" y="196" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="61" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v</text>
  <path d="M 90 213 L 126 213" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="206" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">+1</text>
  <rect x="136" y="196" width="54" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="163" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v+1</text>
  <path d="M 194 213 L 230 213" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="206" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">复制</text>
  <rect x="240" y="196" width="54" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="267" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v+1</text>
  <rect x="296" y="196" width="54" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="323" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">v+1</text>
  <text x="470" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">和 = 2v+2</text>
  <rect x="398" y="244" width="90" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="443" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">多赚 1 ！</text>

  <!-- bottom note -->
  <rect x="36" y="288" width="448" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">本质：+1 发生在复制之前，才会被随后的每一份拷贝继承</text>
  <text x="260" y="338" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">「加法要趁早」——乘法放大前的 +1 才不浪费</text>
</svg>
