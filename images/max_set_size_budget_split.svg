<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" viewBox="0 0 520 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ao" markerWidth="7.5" markerHeight="7.5" refX="5.5" refY="3.75" orient="auto">
      <path d="M0,0 L7.5,3.75 L0,7.5 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="15.5" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">名额分配：独占值锁定名额，空名额吸收公共值</text>
  <path d="M 130 40 Q 260 47 390 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="66" y="96" font-size="14" fill="#446688" font-weight="bold" filter="url(#sk)">nums1</text>
  <text x="66" y="114" font-size="10.5" fill="#666" filter="url(#sk)">恰留 n/2 个</text>
  <rect x="148" y="78" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="174" y="102" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#sk)">独占</text>
  <rect x="208" y="78" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="234" y="102" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#sk)">独占</text>
  <rect x="268" y="78" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="294" y="102" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#sk)">独占</text>
  <rect x="328" y="78" width="52" height="38" rx="4" fill="#fafafa" stroke="#8895a6" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="354" y="102" text-anchor="middle" font-size="12" fill="#8895a6" filter="url(#sk)">空</text>
  <rect x="388" y="78" width="52" height="38" rx="4" fill="#fafafa" stroke="#8895a6" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="414" y="102" text-anchor="middle" font-size="12" fill="#8895a6" filter="url(#sk)">空</text>
  <text x="221" y="134" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#sk)">k₁ = min(o₁, n/2)</text>
  <text x="384" y="134" text-anchor="middle" font-size="11.5" fill="#8895a6" filter="url(#sk)">r₁ = n/2 − k₁</text>

  <text x="66" y="188" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">nums2</text>
  <text x="66" y="206" font-size="10.5" fill="#666" filter="url(#sk)">恰留 n/2 个</text>
  <rect x="148" y="170" width="52" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="174" y="194" text-anchor="middle" font-size="12" fill="#2f5a25" filter="url(#sk)">独占</text>
  <rect x="208" y="170" width="52" height="38" rx="4" fill="#fafafa" stroke="#8895a6" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="234" y="194" text-anchor="middle" font-size="12" fill="#8895a6" filter="url(#sk)">空</text>
  <rect x="268" y="170" width="52" height="38" rx="4" fill="#fafafa" stroke="#8895a6" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="294" y="194" text-anchor="middle" font-size="12" fill="#8895a6" filter="url(#sk)">空</text>
  <rect x="328" y="170" width="52" height="38" rx="4" fill="#fafafa" stroke="#8895a6" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="354" y="194" text-anchor="middle" font-size="12" fill="#8895a6" filter="url(#sk)">空</text>
  <rect x="388" y="170" width="52" height="38" rx="4" fill="#fafafa" stroke="#8895a6" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#sk)"/>
  <text x="414" y="194" text-anchor="middle" font-size="12" fill="#8895a6" filter="url(#sk)">空</text>
  <text x="174" y="226" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">k₂ = min(o₂, n/2)</text>
  <text x="324" y="226" text-anchor="middle" font-size="11.5" fill="#8895a6" filter="url(#sk)">r₂ = n/2 − k₂</text>

  <text x="74" y="258" font-size="11" fill="#555" filter="url(#sk)">空名额汇成自由池，</text>
  <text x="74" y="276" font-size="11" fill="#555" filter="url(#sk)">公共值塞哪边都行</text>

  <ellipse cx="300" cy="300" rx="120" ry="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#sk)"/>
  <text x="300" y="296" text-anchor="middle" font-size="13.5" fill="#b07818" font-weight="bold" filter="url(#sk)">公共值池（c 个）</text>
  <text x="300" y="318" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#sk)">两边都有拷贝</text>

  <path d="M 442,97 C 480,140 470,230 398,277" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>
  <path d="M 442,190 C 468,220 448,262 413,287" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#ao)" filter="url(#sk)"/>

  <rect x="86" y="350" width="348" height="40" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="260" y="376" text-anchor="middle" font-size="15" fill="#2f5a25" font-weight="bold" filter="url(#sk)">ans = k₁ + k₂ + min(c, r₁ + r₂)</text>
</svg>
