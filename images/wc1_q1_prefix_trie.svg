<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">前缀树：先序遍历 = 字典序（n = 13）</text>
  <text x="320" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">节点 x 的孩子是 10x, 10x+1, …, 10x+9 中 ≤ n 的那些；虚根 0 的孩子是 1…9</text>

  <ellipse cx="320" cy="80" rx="28" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">虚根 0</text>

  <g filter="url(#rough2)" stroke="#8899aa" stroke-width="1.1" fill="none">
    <path d="M 320 97 L 60 146"/>
    <path d="M 320 97 L 125 146"/>
    <path d="M 320 97 L 190 146"/>
    <path d="M 320 97 L 255 146"/>
    <path d="M 320 97 L 320 146"/>
    <path d="M 320 97 L 385 146"/>
    <path d="M 320 97 L 450 146"/>
    <path d="M 320 97 L 515 146"/>
    <path d="M 320 97 L 580 146"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="38" y="146" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="103" y="146" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="168" y="146" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="233" y="146" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="298" y="146" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="363" y="146" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="428" y="146" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="493" y="146" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="558" y="146" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle" fill="#3a4a66" font-weight="bold">
    <text x="60" y="169">1</text>
    <text x="125" y="169">2</text>
    <text x="190" y="169">3</text>
    <text x="255" y="169">4</text>
    <text x="320" y="169">5</text>
    <text x="385" y="169">6</text>
    <text x="450" y="169">7</text>
    <text x="515" y="169">8</text>
    <text x="580" y="169">9</text>
  </g>

  <g filter="url(#rough2)">
    <circle cx="75" cy="147" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="140" cy="147" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="205" cy="147" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="270" cy="147" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="335" cy="147" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="400" cy="147" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="465" cy="147" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="530" cy="147" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="595" cy="147" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>

  <g filter="url(#rough2)" font-size="8.5" text-anchor="middle" fill="#8a6a20">
    <text x="75" y="150">1</text>
    <text x="140" y="150">6</text>
    <text x="205" y="150">7</text>
    <text x="270" y="150">8</text>
    <text x="335" y="150">9</text>
    <text x="400" y="150">10</text>
    <text x="465" y="150">11</text>
    <text x="530" y="150">12</text>
    <text x="595" y="150">13</text>
  </g>

  <rect x="14" y="206" width="232" height="70" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="252" y="236" font-size="9.5" fill="#b85450" filter="url(#rough2)">节点 1 的子树</text>
  <text x="252" y="250" font-size="9" fill="#999" filter="url(#rough2)">（只有 10…13 ≤ 13）</text>

  <g filter="url(#rough2)" stroke="#8899aa" stroke-width="1.1" fill="none">
    <path d="M 60 180 L 48 228"/>
    <path d="M 60 180 L 102 228"/>
    <path d="M 60 180 L 156 228"/>
    <path d="M 60 180 L 210 228"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="228" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="78" y="228" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="132" y="228" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="186" y="228" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle" fill="#3a5a30" font-weight="bold">
    <text x="48" y="250">10</text>
    <text x="102" y="250">11</text>
    <text x="156" y="250">12</text>
    <text x="210" y="250">13</text>
  </g>

  <g filter="url(#rough2)">
    <circle cx="65" cy="229" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="119" cy="229" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="173" cy="229" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <circle cx="227" cy="229" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>

  <g filter="url(#rough2)" font-size="8.5" text-anchor="middle" fill="#8a6a20">
    <text x="65" y="232">2</text>
    <text x="119" y="232">3</text>
    <text x="173" y="232">4</text>
    <text x="227" y="232">5</text>
  </g>

  <text x="320" y="304" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">小圆圈 = 访问次序：1 → 10 → 11 → 12 → 13 → 2 → 3 → … → 9</text>
  <text x="320" y="328" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">节点 2…9 没有孩子，因为 20, 30, …, 90 都大于 13</text>

  <rect x="96" y="348" width="448" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="320" y="368" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">祖先先于后代   ⇔   前缀串排在后缀串之前</text>
  <text x="320" y="385" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">兄弟按数字 0…9 递增   ⇔   同一前缀下按后一位递增</text>

  <text x="320" y="418" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">每个 1…n 的数恰对应树上 1 个节点，整棵树共 n 个节点</text>
</svg>
