<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 1 演算：两种情形各枚举一遍，取最大得分</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">nums = [3,4,6]，maxVal = 5</text>
  <rect x="30" y="74" width="112" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="86.0" y="95" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">候选 v</text>
  <rect x="150" y="74" width="118" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="209.0" y="95" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">share(v)</text>
  <rect x="276" y="74" width="112" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="332.0" y="95" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">代价</text>
  <rect x="396" y="74" width="130" height="32" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="461.0" y="95" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">得分</text>
  <rect x="30" y="112" width="112" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="86.0" y="138" text-anchor="middle" font-size="10" fill="#446688">v = 3（A）</text>
  <rect x="150" y="112" width="118" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="209.0" y="138" text-anchor="middle" font-size="10" fill="#446688">2（3, 6）</text>
  <rect x="276" y="112" width="112" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="332.0" y="138" text-anchor="middle" font-size="10" fill="#446688">2 − 1 = 1</text>
  <rect x="396" y="112" width="130" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="461.0" y="138" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3 − 1 = 2</text>
  <rect x="30" y="158" width="112" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="86.0" y="184" text-anchor="middle" font-size="10" fill="#446688">v = 4（A）</text>
  <rect x="150" y="158" width="118" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="209.0" y="184" text-anchor="middle" font-size="10" fill="#446688">2（4, 6）</text>
  <rect x="276" y="158" width="112" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="332.0" y="184" text-anchor="middle" font-size="10" fill="#446688">2 − 1 = 1</text>
  <rect x="396" y="158" width="130" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="461.0" y="184" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4 − 1 = 3</text>
  <rect x="30" y="204" width="112" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="86.0" y="230" text-anchor="middle" font-size="10" fill="#446688">v = 6（A）</text>
  <rect x="150" y="204" width="118" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="209.0" y="230" text-anchor="middle" font-size="10" fill="#446688">3（3,4,6）</text>
  <rect x="276" y="204" width="112" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="332.0" y="230" text-anchor="middle" font-size="10" fill="#446688">3 − 1 = 2</text>
  <rect x="396" y="204" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="461.0" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">6 − 2 = 4</text>
  <rect x="30" y="250" width="112" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="86.0" y="276" text-anchor="middle" font-size="10" fill="#446688">v = 5（B）</text>
  <rect x="150" y="250" width="118" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="209.0" y="276" text-anchor="middle" font-size="10" fill="#446688">0</text>
  <rect x="276" y="250" width="112" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="332.0" y="276" text-anchor="middle" font-size="10" fill="#446688">1（改 6→5）</text>
  <rect x="396" y="250" width="130" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="461.0" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5 − 1 = 4</text>
  <rect x="30" y="302" width="496" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="278" y="321" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">最大得分 = 4（A 取 v = 6 或 B 取 v = 5 都能达到）</text>
  <text x="278" y="335" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">题面给的最优解正是把 6 改成 5，代价 1</text>
  <rect x="30" y="354" width="496" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="278" y="373" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">情形 A：代价 = share(v) − 1（v &gt; 1 时把自己去掉）</text>
</svg>
