<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 586" width="840" height="586"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="840" height="586" fill="#fafafa"/>

  <text x="420" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按 N mod 6 查表：块长定了，1 的位置就是块长的前缀和</text>
  <text x="420" y="52" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">q = ⌊N/3⌋，N = n+1；表中「计数」一栏恒为 {q, q+1} 的排列 ⇒ 自动最优</text>

  <!-- 表头 -->
  <rect x="26" y="66" width="788" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="88" font-size="12.2" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">N mod 6</text>
  <text x="150" y="88" font-size="12.2" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1 的位置（1-based）</text>
  <text x="366" y="88" font-size="12.2" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">块长 (L₀,L₁,L₂,L₃)</text>
  <text x="546" y="88" font-size="12.2" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">计数 (c₀,c₁,c₂)</text>
  <text x="672" y="88" font-size="12.2" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">小例（n / 串 / f）</text>

  <!-- 行 0 -->
  <rect x="26" y="104" width="788" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="128" font-size="11.8" fill="#33582a" filter="url(#rough2)">0（q 偶）</text>
  <text x="150" y="128" font-size="11.8" fill="#33582a" filter="url(#rough2)">q , 2q　（两个 1）</text>
  <text x="366" y="128" font-size="11.8" fill="#33582a" filter="url(#rough2)">(q, q, q)</text>
  <text x="546" y="128" font-size="11.8" fill="#33582a" filter="url(#rough2)">(q, q, q)</text>
  <text x="672" y="128" font-size="10" fill="#33582a" filter="url(#rough2)">n=5 / 01010 / 3</text>
  <text x="150" y="148" font-size="10.6" fill="#777" filter="url(#rough2)">两个位置都是偶数 ⇒ 形状 (偶,偶)</text>

  <!-- 行 1 -->
  <rect x="26" y="168" width="788" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="192" font-size="11.8" fill="#33582a" filter="url(#rough2)">1（q 偶）</text>
  <text x="150" y="192" font-size="11.8" fill="#33582a" filter="url(#rough2)">q , 2q　（两个 1）</text>
  <text x="366" y="192" font-size="11.8" fill="#33582a" filter="url(#rough2)">(q, q, q+1)</text>
  <text x="546" y="192" font-size="11.8" fill="#33582a" filter="url(#rough2)">(q, q, q+1)</text>
  <text x="672" y="192" font-size="10" fill="#33582a" filter="url(#rough2)">n=6 / 010100 / 5</text>
  <text x="150" y="212" font-size="10.6" fill="#777" filter="url(#rough2)">N = 3q+1，多出的一个前缀值放进第三类</text>

  <!-- 行 5 -->
  <rect x="26" y="232" width="788" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="256" font-size="11.8" fill="#33582a" filter="url(#rough2)">5（q 奇）</text>
  <text x="150" y="256" font-size="11.8" fill="#33582a" filter="url(#rough2)">q+1 , 2q+2　（两个 1）</text>
  <text x="366" y="256" font-size="11.8" fill="#33582a" filter="url(#rough2)">(q+1, q+1, q)</text>
  <text x="546" y="256" font-size="11.8" fill="#33582a" filter="url(#rough2)">(q+1, q+1, q)</text>
  <text x="672" y="256" font-size="10" fill="#33582a" filter="url(#rough2)">n=4 / 0101 / 2</text>
  <text x="150" y="276" font-size="10.6" fill="#777" filter="url(#rough2)">q 为奇数时 q+1 才是偶数，故位置整体后移一格</text>

  <!-- 行 3 -->
  <rect x="26" y="296" width="788" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="320" font-size="11.8" fill="#8a6015" filter="url(#rough2)">3（q 奇）</text>
  <text x="150" y="320" font-size="11.8" fill="#8a6015" filter="url(#rough2)">q , 2q−1 , 3q−1（三个 1）</text>
  <text x="366" y="320" font-size="11.8" fill="#8a6015" filter="url(#rough2)">(q, q−1, q, 1)</text>
  <text x="546" y="320" font-size="11.8" fill="#8a6015" filter="url(#rough2)">(q, q, q)</text>
  <text x="672" y="320" font-size="10" fill="#8a6015" filter="url(#rough2)">n=8 / 00101001 / 9</text>
  <text x="150" y="342" font-size="10.6" fill="#777" filter="url(#rough2)">形状 (奇,奇,偶)：L₁ 与 L₃ 合并成中间的 q</text>

  <!-- 行 4 -->
  <rect x="26" y="364" width="788" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="388" font-size="11.8" fill="#8a6015" filter="url(#rough2)">4（q 奇）</text>
  <text x="150" y="388" font-size="11.8" fill="#8a6015" filter="url(#rough2)">q , 2q−1 , 3q−1（三个 1）</text>
  <text x="366" y="388" font-size="11.8" fill="#8a6015" filter="url(#rough2)">(q, q−1, q, 2)</text>
  <text x="546" y="388" font-size="11.8" fill="#8a6015" filter="url(#rough2)">(q, q+1, q)</text>
  <text x="672" y="388" font-size="10" fill="#8a6015" filter="url(#rough2)">n=9 / 001010010 / 12</text>
  <text x="150" y="410" font-size="10.6" fill="#777" filter="url(#rough2)">把多出的 1 个单位塞进合并类（q−1+2 = q+1）</text>

  <!-- 行 2 -->
  <rect x="26" y="432" width="788" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="456" font-size="11.8" fill="#8c3a37" filter="url(#rough2)">2（q 偶）</text>
  <text x="150" y="456" font-size="11.8" fill="#8c3a37" filter="url(#rough2)">q+1 , 2q−1 , 3q（三个 1）</text>
  <text x="366" y="456" font-size="11.8" fill="#8c3a37" filter="url(#rough2)">(q+1, q−2, q+1, 2)</text>
  <text x="546" y="456" font-size="11.8" fill="#8c3a37" filter="url(#rough2)">(q+1, q, q+1)</text>
  <text x="672" y="456" font-size="10" fill="#8c3a37" filter="url(#rough2)">n=13 / 0000101000010 / 26</text>
  <text x="150" y="478" font-size="10.6" fill="#777" filter="url(#rough2)">第三类要吃 q+1，于是 L₂ 也变 q+1，L₁ = q−2 补齐</text>

  <!-- 底部结论 -->
  <rect x="26" y="506" width="788" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="46" y="530" font-size="12.6" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">六种情形全部落在 {q, q+1} ⇒ f = LB(N)，命中「均匀染色」下界，且最多只用 3 个 1</text>
  <text x="46" y="552" font-size="11.4" fill="#2f4a66" filter="url(#rough2)">退化特判：n = 1、2、3、7 时 q 太小（会出现 L = 0），直接输出 1 / 11 / 101 / 0010100</text>
</svg>
