<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：只需维护「最大」与「第二大」两个变量，一遍扫描</text>

  <!-- 状态变量 -->
  <g filter="url(#rough2)">
    <rect x="120" y="52" width="150" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <rect x="290" y="52" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
  </g>
  <text x="195" y="72" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">first（最大数字）</text>
  <text x="195" y="90" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">初始 −1</text>
  <text x="365" y="72" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">second（第二大）</text>
  <text x="365" y="90" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">初始 −1</text>

  <!-- 扫描 -->
  <rect x="200" y="122" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="145" text-anchor="middle" font-size="12" fill="#3a4a66" filter="url(#rough2)">逐字符扫描 c ∈ s</text>
  <path d="M 280 92 L 280 116" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定是否数字 -->
  <path d="M 280 158 L 280 178" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="280,178 390,210 280,242 170,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="207" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">c 是数字吗？</text>
  <text x="280" y="225" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">d = c − '0'</text>

  <!-- 非数字 -->
  <path d="M 170 210 L 100 210 L 100 130 L 192 130" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="202" font-size="10.5" fill="#999" filter="url(#rough2)">否，跳过</text>

  <!-- 三分支 -->
  <path d="M 390 210 L 440 210" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="202" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="440" y="130" width="110" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <rect x="440" y="190" width="110" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="440" y="250" width="110" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
  </g>
  <g font-size="10" text-anchor="middle" filter="url(#rough2)">
    <text x="495" y="147" fill="#3a4a66" font-weight="bold">d &gt; first：</text>
    <text x="495" y="163" fill="#3a4a66">second←first</text>
    <text x="495" y="207" fill="#2f5226" font-weight="bold">d == first：</text>
    <text x="495" y="223" fill="#2f5226">重复，不更新</text>
    <text x="495" y="267" fill="#b85450" font-weight="bold">d &lt; first 且</text>
    <text x="495" y="283" fill="#b85450">d &gt; second：</text>
  </g>
  <path d="M 470 130 Q 400 120 370 122" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480" y="118" font-size="10" fill="#3a4a66" filter="url(#rough2)">first←d</text>
  <text x="480" y="300" font-size="10" fill="#b85450" filter="url(#rough2)">second←d</text>
  <path d="M 440 270 Q 400 250 372 96" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部说明 -->
  <rect x="40" y="308" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="330" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">返回 second：初始 −1 就表示「无第二大数字」，天然覆盖无数字 / 只有一种数字两类边界；</text>
  <text x="56" y="350" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">也可用长度 10 的布尔桶标记出现过的数字，从 8 往下找第二个——扫描版少一次遍历。</text>
</svg>
