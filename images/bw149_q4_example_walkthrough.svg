<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 反向重建：caption = "cdcd"，最优代价 2，答案 "cccc"</text>
  <text x="310" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每一步在所有“仍能取到最小总代价”的字符里挑最小的那个</text>

  <text x="44" y="80" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">第 0 位：候选字符的总代价（前缀代价 0 + 本位代价 + 后缀 DP）</text>
  <g filter="url(#rough2)">
    <rect x="44" y="90" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66" font-weight="bold">
    <text x="60" y="110" filter="url(#rough2)">首字符 c</text>
    <text x="200" y="110" filter="url(#rough2)">本位代价 |'c' − c|</text>
    <text x="368" y="110" filter="url(#rough2)">f[1][c][1]</text>
    <text x="484" y="110" filter="url(#rough2)">合计</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5">
    <rect x="44" y="122" width="520" height="24" fill="#e6f4ea" rx="4" filter="url(#rough2)"/>
    <text x="60" y="139" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">'c'</text>
    <text x="200" y="139" fill="#3a5a30" filter="url(#rough2)">0</text>
    <text x="368" y="139" fill="#3a5a30" filter="url(#rough2)">2（位置 1~3 全填 c）</text>
    <text x="484" y="139" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2 ✓ 并列最小</text>
    <text x="60" y="162" fill="#666" filter="url(#rough2)">'d'</text>
    <text x="200" y="162" fill="#666" filter="url(#rough2)">1</text>
    <text x="368" y="162" fill="#666" filter="url(#rough2)">1（位置 1~3 全填 d）</text>
    <text x="484" y="162" fill="#666" filter="url(#rough2)">2（'d' 更大，不选）</text>
    <text x="60" y="182" fill="#666" filter="url(#rough2)">'b'</text>
    <text x="200" y="182" fill="#666" filter="url(#rough2)">1</text>
    <text x="368" y="182" fill="#666" filter="url(#rough2)">5</text>
    <text x="484" y="182" fill="#666" filter="url(#rough2)">6</text>
  </g>
  <text x="544" y="139" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">← 取 c</text>

  <path d="M 310 194 L 310 212" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="44" y="234" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">第 1~3 位：段长不足 3，字符被锁死；段长到 3 后再比较“续 c”与“换字符”</text>

  <g filter="url(#rough2)">
    <rect x="60" y="246" width="70" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <rect x="140" y="246" width="70" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
    <rect x="220" y="246" width="70" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
    <rect x="300" y="246" width="70" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="95" y="264" fill="#3a4a66" filter="url(#rough2)">'c'</text>
    <text x="95" y="282" fill="#666" filter="url(#rough2)">段长 1</text>
    <text x="175" y="264" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">'c'</text>
    <text x="175" y="282" fill="#3a5a30" filter="url(#rough2)">段长 2（强制）</text>
    <text x="255" y="264" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">'c'</text>
    <text x="255" y="282" fill="#3a5a30" filter="url(#rough2)">段长 ≥3（强制）</text>
    <text x="335" y="264" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">'c'</text>
    <text x="335" y="282" fill="#8a6a20" filter="url(#rough2)">续 c 代价 1</text>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#888">
    <text x="95" y="306" text-anchor="middle" filter="url(#rough2)">原 'c'，代价 0</text>
    <text x="175" y="306" text-anchor="middle" filter="url(#rough2)">原 'd'→'c'，代价 1</text>
    <text x="255" y="306" text-anchor="middle" filter="url(#rough2)">原 'c'，代价 0</text>
    <text x="60" y="322" text-anchor="start" filter="url(#rough2)">续 c 代价 1；换字符会留下长度 1 的段 ✗</text>
  </g>

  <path d="M 350 296 L 400 296" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="404" y="270" width="176" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="418" y="290" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">总代价 = 0 + 1 + 0 + 1 = 2</text>
  <text x="418" y="308" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">结果 "cccc"（字典序最小）</text>

  <rect x="44" y="330" width="536" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="58" y="350" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">对照："dddd" 的总代价也是 2（第 0、2 位各改 1 次），但 "cccc" 字典序更小 —— 所以第 0 位</text>
  <text x="58" y="368" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">必须在「代价相同的字符」里取最小的 c，而不是随便取一个。</text>
  <text x="58" y="383" font-size="10" fill="#888" filter="url(#rough2)">示例 2 "aca" → "aaa"（代价 2）：'a' 本位代价 0，比 'b'、'c' 都优；示例 3 "bc" 长度不足 3，无解。</text>
</svg>
