<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：排序 → 扫描 → 名额检查</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="120" y="48" width="320" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="68" fill="#3a4a66">① 打包成 (值, 标签) 二元组</text>
    <text x="280" y="85" font-size="10" fill="#557">按键值降序排序（值大的优先）</text>
  </g>

  <path d="M 280 96 L 280 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="120" y="120" width="320" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="148" fill="#3a4a66">② 初始化 cnt = {}、taken = 0、ans = 0</text>
  </g>

  <path d="M 280 166 L 280 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="120" y="190" width="320" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="211" fill="#3a4a66">③ 按降序取下一个物品 (v, c)</text>
    <text x="280" y="227" font-size="10" fill="#557">若已无物品可取而循环结束</text>
  </g>

  <path d="M 280 236 L 280 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="154,300 280,266 406,300 280,334" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="305" text-anchor="middle" font-size="11.5" fill="#8a6a20">taken 达到 numWanted ?</text>
  </g>

  <path d="M 406 300 L 428 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="292" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="430" y="278" width="112" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="486" y="297" fill="#3a5a30">结束</text>
    <text x="486" y="313" fill="#3a5a30">返回 ans</text>
  </g>

  <path d="M 280 334 L 280 354" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="350" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)">
    <polygon points="138,390 280,356 422,390 280,424" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="395" text-anchor="middle" font-size="11.5" fill="#8a6a20">cnt[c] 达到 useLimit ?</text>
  </g>

  <path d="M 422 390 L 444 390" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="382" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="446" y="368" width="104" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="498" y="387" fill="#8a3a36">跳过该物品</text>
    <text x="498" y="403" font-size="10" fill="#8a3a36">不合格</text>
  </g>

  <path d="M 280 424 L 280 440" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="438" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="140" y="442" width="280" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="280" y="462" fill="#3a5a30">④ 选入：ans += v，cnt[c] += 1</text>
    <text x="280" y="479" font-size="10" fill="#3a5a30">taken += 1（标签 c 的名额 −1）</text>
  </g>

  <path d="M 280 492 L 280 500 L 66 500 L 66 213 L 116 213" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 498 412 L 498 500" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="76" y="470" font-size="10" fill="#999" filter="url(#rough2)">循环</text>
  <text x="280" y="516" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每件物品最多被检查一次：整趟扫描 O(n)</text>
</svg>
