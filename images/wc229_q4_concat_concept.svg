<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="177" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：拼接成一条串，非空约束 = 跨越分界</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 区块一：跨段镜像 -->
  <text x="40" y="60" font-size="12" font-weight="bold" fill="#446688">① 跨段镜像</text>
  <g filter="url(#sk)">
    <rect x="110" y="78" width="50" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="165" y="78" width="50" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="220" y="78" width="50" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="275" y="78" width="50" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <path d="M 135 74 Q 230 40 325 74" stroke="#b85450" stroke-width="1.6" fill="none" opacity="0.85"/>
    <path d="M 190 74 Q 217 54 245 74" stroke="#b85450" stroke-width="1.4" fill="none" opacity="0.85"/>
  </g>
  <g font-size="13" fill="#333" font-family="monospace" font-weight="bold">
    <text x="135" y="104" text-anchor="middle">a</text>
    <text x="190" y="104" text-anchor="middle">b</text>
    <text x="245" y="104" text-anchor="middle">b</text>
    <text x="300" y="104" text-anchor="middle">a</text>
  </g>
  <g font-size="10" fill="#666" font-family="monospace">
    <text x="135" y="132" text-anchor="middle">0</text>
    <text x="190" y="132" text-anchor="middle">1</text>
    <text x="245" y="132" text-anchor="middle">2</text>
    <text x="300" y="132" text-anchor="middle">3</text>
  </g>
  <path d="M 272.5 74 L 272.5 124" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>
  <text x="230" y="52" text-anchor="middle" font-size="10.5" fill="#b85450">镜像对 ×2</text>
  <g filter="url(#sk)">
    <rect x="345" y="64" width="265" height="80" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="477" y="88" text-anchor="middle" font-size="11.5" fill="#333">word1="ab" + word2="ba"</text>
  <text x="477" y="108" text-anchor="middle" font-size="11.5" fill="#333">LPS 各为 1，拼出 "abba" 长 4！</text>
  <text x="477" y="130" text-anchor="middle" font-size="11.5" fill="#a06a20" font-weight="bold">镜像跨分界 ⇒ 必须整体做 DP</text>

  <!-- 区块二：端点结构 -->
  <text x="40" y="176" font-size="12" font-weight="bold" fill="#2e6e2e">② 合法回文 ⇔ 首尾端点分属两段</text>
  <path d="M 125 190 Q 320 146 515 190" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="320" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">回文 ⇒ s[i] = s[j]</text>
  <g filter="url(#sk)">
    <rect x="70" y="194" width="110" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="185" y="194" width="270" height="46" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
    <rect x="460" y="194" width="110" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="125" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">首字符 s[i]</text>
  <text x="125" y="232" text-anchor="middle" font-size="10.5" fill="#446688">i &lt; n</text>
  <text x="320" y="222" text-anchor="middle" font-size="11.5" fill="#666">中间部分：任意分属两段</text>
  <text x="515" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">尾字符 s[j]</text>
  <text x="515" y="232" text-anchor="middle" font-size="10.5" fill="#4a7a3a">j ≥ n</text>
  <text x="320" y="260" text-anchor="middle" font-size="11.5" fill="#666">s₁ 至少含 s[i] → 非空；s₂ 至少含 s[j] → 非空</text>
  <text x="320" y="280" text-anchor="middle" font-size="11.5" fill="#666">中间字符随意分属两段，不受任何约束</text>
  <g filter="url(#sk)">
    <rect x="70" y="292" width="500" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="319" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">ans = max{ dp[i][j] : s[i]=s[j], i &lt; n ≤ j }</text>

  <!-- 区块三：反例 -->
  <g filter="url(#sk)">
    <rect x="40" y="352" width="560" height="78" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="60" y="376" font-size="12.5" font-weight="bold" fill="#b85450">反例：直接返回 LPS(s) 是最经典 WA</text>
  <text x="60" y="398" font-size="11.5" fill="#333">word1="aba", word2="xyz"：LPS("abaxyz")="aba" 整段落在 word1 内 → 非法</text>
  <text x="60" y="418" font-size="11.5" fill="#333">两段无公共字符，凑不出跨界相等端点对 → 正确答案 0</text>
</svg>
