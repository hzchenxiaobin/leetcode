<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">皇后的走法：沿行 / 列 / 对角线任走，答案只有 0、1、2</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">一步可达 ⟺ 同行 sr=tr 或 同列 sc=tc 或 同对角线 |Δr|=|Δc|</text>

  <g filter="url(#rough2)">
    <rect x="40" y="80" width="224" height="224" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  </g>

  <g filter="url(#rough2)" stroke="#ccc" stroke-width="1">
    <path d="M 68 80 V 304 M 96 80 V 304 M 124 80 V 304 M 152 80 V 304 M 180 80 V 304 M 208 80 V 304 M 236 80 V 304"/>
    <path d="M 40 108 H 264 M 40 136 H 264 M 40 164 H 264 M 40 192 H 264 M 40 220 H 264 M 40 248 H 264 M 40 276 H 264"/>
  </g>

  <g filter="url(#rough2)">
    <line x1="45" y1="178" x2="259" y2="178" stroke="#446688" stroke-width="3"/>
    <line x1="138" y1="85" x2="138" y2="299" stroke="#4a7a3a" stroke-width="3"/>
    <line x1="56" y1="96" x2="248" y2="288" stroke="#d6a040" stroke-width="2.5"/>
    <line x1="220" y1="96" x2="70" y2="284" stroke="#d6a040" stroke-width="2.5"/>
  </g>

  <rect x="124" y="164" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="182" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">S</text>
  <text x="146" y="158" font-size="10" fill="#b85450">S(4,4)</text>

  <g filter="url(#rough2)">
    <line x1="40" y1="326" x2="66" y2="326" stroke="#446688" stroke-width="3"/>
    <line x1="140" y1="326" x2="166" y2="326" stroke="#4a7a3a" stroke-width="3"/>
    <line x1="40" y1="348" x2="66" y2="348" stroke="#d6a040" stroke-width="2.5"/>
  </g>
  <text x="72" y="330" font-size="10.5" fill="#446688">行：sr = tr</text>
  <text x="172" y="330" font-size="10.5" fill="#4a7a3a">列：sc = tc</text>
  <text x="72" y="352" font-size="10.5" fill="#d6a040">对角线：|sr−tr| = |sc−tc|</text>

  <rect x="296" y="80" width="244" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="418" y="102" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">source == target → 0 步</text>
  <text x="418" y="122" text-anchor="middle" font-size="10.5" fill="#555">已在目标格，无需移动（示例 3）</text>

  <rect x="296" y="152" width="244" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="418" y="174" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">同行 / 同列 / 同对角线 → 1 步</text>
  <text x="418" y="194" text-anchor="middle" font-size="10.5" fill="#555">沿该直线一步直达（示例 1）</text>

  <rect x="296" y="224" width="244" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="418" y="246" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">其余情况 → 2 步</text>
  <text x="418" y="266" text-anchor="middle" font-size="10.5" fill="#555">L 形：先横后竖，经中转点 (sr, tc)</text>

  <rect x="296" y="296" width="244" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="418" y="316" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">无 -1：皇后 = 车 ∪ 象</text>
  <text x="418" y="336" text-anchor="middle" font-size="10.5" fill="#555">行/列移动改变 r+c 奇偶，颜色不变量失效</text>

  <text x="152" y="384" text-anchor="middle" font-size="10" fill="#999">判定顺序：同格 0 → 同线 1 → 其余 2</text>
</svg>
