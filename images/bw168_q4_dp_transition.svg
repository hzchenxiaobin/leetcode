<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="580" height="360" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">DP 转移：把上一行的 g 与当前行的 v 合成 gcd(g, v)</text>
  <rect x="40" y="80" width="150" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="115" y="102" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">dp[g]</text>
  <text x="115" y="118" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">上一行结束时的方案数</text>
  <rect x="240" y="80" width="150" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="315" y="102" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">cnt[v]</text>
  <text x="315" y="118" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">当前行 v 出现次数</text>
  <path d="M 190 103 L 236 103" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="213" y="94" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>
  <rect x="430" y="80" width="120" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="490" y="102" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">ndp[gcd]</text>
  <text x="490" y="118" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">累加取模</text>
  <path d="M 390 103 L 426 103" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="408" y="94" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→</text>
  <text x="300" y="156" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">ndp[gcd(g, v)] = (ndp[gcd(g,v)] + dp[g] * cnt[v]) mod 1e9+7</text>
  <rect x="40" y="184" width="500" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="208" text-anchor="start" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">只枚举 dp[g] &gt; 0 与 cnt[v] &gt; 0 的组合，实际转移量远小于 150 × 150</text>
  <text x="58" y="226" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">每行先去重计数，避免重复枚举相同取值</text>
  <rect x="40" y="248" width="500" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="272" text-anchor="start" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="58" y="294" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">时间：O(m * 150 * 150) 约 3.4e6</text>
  <text x="58" y="316" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">空间：O(150) 两个滚动数组</text>
  <text x="58" y="334" text-anchor="start" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">答案：dp[1]（gcd 为 1 才是互质）</text>
</svg>
