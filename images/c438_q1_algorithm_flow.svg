<svg xmlns="http://www.w3.org/2000/svg" width="660" height="470" viewBox="0 0 660 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="470" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：逐轮收缩，n − 2 轮后比较两位</text>
  <path d="M 190 40 Q 330 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="215" y="58" width="230" height="34" rx="17" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="330" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">读入 s，转成 int 数组 a</text>

  <path d="M 330 92 L 330 116" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="330,120 460,152 330,184 200,152" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="330" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">len(a) &gt; 2 ?</text>

  <path d="M 330 184 L 330 212" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="342" y="204" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>

  <g filter="url(#sk)">
    <rect x="140" y="216" width="380" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="330" y="238" text-anchor="middle" font-size="13" fill="#2b6e9e">构造新数组：b[i] = (a[i] + a[i+1]) % 10</text>
  <text x="330" y="258" text-anchor="middle" font-size="12" fill="#2b6e9e">i = 0 … len(a)−2，然后令 a ← b</text>

  <path d="M 524 242 C 590 242 590 152 462 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="588" y="200" font-size="11" font-weight="bold" fill="#555" text-anchor="middle" transform="rotate(90 588 200)">回到长度判断</text>

  <path d="M 330 120 L 330 116" stroke="none"/>
  <path d="M 200 152 L 130 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="165" y="142" font-size="11" font-weight="bold" fill="#b85450">否</text>

  <g filter="url(#sk)">
    <rect x="60" y="196" width="140" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="130" y="219" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">已剩 2 位</text>

  <path d="M 130 232 L 130 280" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <polygon points="130,284 252,316 130,348 8,316" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="130" y="321" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">a[0] == a[1] ?</text>

  <path d="M 252 316 L 304 316" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="278" y="308" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="308" y="298" width="110" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="363" y="321" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 true</text>

  <path d="M 130 348 L 130 382" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="142" y="370" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <g filter="url(#sk)">
    <rect x="72" y="386" width="116" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="130" y="409" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">返回 false</text>

  <g filter="url(#sk)">
    <rect x="360" y="360" width="270" height="86" rx="10" fill="#f7f9f2" stroke="#4a8edb" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="495" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">复杂度速查</text>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="495" y="402">时间 O(n²)：n−2 轮，第 i 轮 n−i 次加法</text>
    <text x="495" y="421">n ≤ 100 时 &lt; 5000 次加法，直接过</text>
    <text x="495" y="440">空间 O(n)：当前串 + 新串</text>
  </g>
</svg>
