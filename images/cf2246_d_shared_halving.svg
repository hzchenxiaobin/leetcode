<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="372" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">② 共享只发生在「整个数组全偶」的那一回合</text>
  <text x="320" y="50" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">只要还剩一个奇数，Bob 就以它为挡板，把偶数前缀切到长度 1</text>

  <g filter="url(#rough2)">
    <rect x="32" y="70" width="276" height="188" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="332" y="70" width="276" height="188" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g font-size="12.5" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="170" y="92" fill="#3a5a30">场上还有奇数：挡板策略</text>
    <text x="470" y="92" fill="#8a3a36">全偶：Alice 别无选择</text>
  </g>

  <g font-size="10.5" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="112">1</text>
    <text x="140" y="112">2</text>
    <text x="200" y="112">3</text>
    <text x="260" y="112">4</text>
    <text x="380" y="112">1</text>
    <text x="440" y="112">2</text>
    <text x="500" y="112">3</text>
    <text x="560" y="112">4</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="54" y="118" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="114" y="118" width="52" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="174" y="118" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="234" y="118" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="354" y="118" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="414" y="118" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="474" y="118" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="534" y="118" width="52" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="143" fill="#33517a">偶</text>
    <text x="140" y="143" fill="#7a5a10">奇</text>
    <text x="200" y="143" fill="#33517a">偶</text>
    <text x="260" y="143" fill="#33517a">偶</text>
    <text x="380" y="143" fill="#33517a">偶</text>
    <text x="440" y="143" fill="#33517a">偶</text>
    <text x="500" y="143" fill="#33517a">偶</text>
    <text x="560" y="143" fill="#33517a">偶</text>
  </g>

  <g filter="url(#rough2)" stroke="#3a5a30" stroke-width="1.4" fill="none">
    <path d="M 54 164 L 54 172 L 106 172 L 106 164"/>
    <path d="M 354 164 L 354 172 L 586 172 L 586 164"/>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="186" fill="#3a5a30">偶数前缀 = 1</text>
    <text x="470" y="186" fill="#8a3a36">偶数前缀 = 整个数组</text>
  </g>

  <g font-size="11.5" fill="#555" filter="url(#rough2)">
    <text x="50" y="208">把要推进的元素换到 1 号位，</text>
    <text x="50" y="226">奇数挡板一直停在 2 号位，</text>
    <text x="50" y="244" fill="#3a5a30">→ 每回合只推进 1 个元素，零共享</text>
    <text x="350" y="208">没有奇数可当挡板，</text>
    <text x="350" y="226">一回合把 n 个元素全部减半，</text>
    <text x="350" y="244" fill="#8a3a36">→ 这一回合白赚 n − 1 步</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="32" y="272" width="576" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <text x="320" y="298" fill="#7a5a10" font-weight="bold">最终价值 = Σ f(a_i) −（n − 1）· m</text>
    <text x="320" y="320" fill="#8a6a20">m = 开局「全偶」能连续减半的次数 = min v2(a_i)（有奇数则 m = 0）</text>
  </g>
</svg>
