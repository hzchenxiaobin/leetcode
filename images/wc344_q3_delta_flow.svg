<svg xmlns="http://www.w3.org/2000/svg" width="560" height="540" viewBox="0 0 560 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="560" height="540" fill="#fdfcf7"/>
  <text x="280" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">每条查询的差量三段：撤旧 → 染新 → 加新</text>
  <path d="M 160 38 Q 280 46 400 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 取查询 -->
  <g filter="url(#sk)">
    <rect x="140" y="52" width="120" height="32" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="200" y="73" text-anchor="middle" font-size="13" fill="#2b4a6e" font-weight="bold">取查询 (i, c)</text>
  <path d="M 200 84 L 200 104" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- 读 old -->
  <g filter="url(#sk)">
    <rect x="140" y="108" width="120" height="32" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="200" y="129" text-anchor="middle" font-size="13" fill="#2b4a6e" font-weight="bold">old = colors[i]</text>
  <path d="M 200 140 L 200 162" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <!-- 判断菱形 -->
  <g filter="url(#sk)">
    <polygon points="200,168 285,205 200,242 115,205" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="200" y="210" text-anchor="middle" font-size="13" fill="#2b4a6e" font-weight="bold">old ≠ 0 ?</text>

  <!-- 是分支：撤旧 -->
  <path d="M 200 242 L 200 268" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="212" y="260" font-size="11" fill="#4a8edb" font-weight="bold">是：旧色染过</text>
  <g filter="url(#sk)">
    <rect x="90" y="272" width="220" height="46" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="200" y="291" text-anchor="middle" font-size="12.5" fill="#8a3a36" font-weight="bold">撤旧：左邻 == old 则 ans−−</text>
  <text x="200" y="309" text-anchor="middle" font-size="12.5" fill="#8a3a36" font-weight="bold">右邻 == old 则 ans−−</text>

  <!-- 否分支：绕过撤旧 -->
  <path d="M 285 205 L 360 205 L 360 359 L 272 359" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="322" y="192" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">否：未染色</text>
  <text x="322" y="178" text-anchor="middle" font-size="10.5" fill="#4a8edb">f(0,·) ≡ 0，无贡献可撤</text>

  <!-- 写入 -->
  <path d="M 200 318 L 200 340" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="135" y="342" width="130" height="34" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="200" y="364" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">写入 colors[i] = c</text>

  <!-- 加新 -->
  <path d="M 200 376 L 200 398" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="90" y="400" width="220" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="200" y="419" text-anchor="middle" font-size="12.5" fill="#2e5e24" font-weight="bold">加新：左邻 == c 则 ans++</text>
  <text x="200" y="437" text-anchor="middle" font-size="12.5" fill="#2e5e24" font-weight="bold">右邻 == c 则 ans++</text>

  <!-- 记录 -->
  <path d="M 200 446 L 200 466" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="110" y="468" width="180" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="200" y="490" text-anchor="middle" font-size="13" fill="#2b4a6e" font-weight="bold">记录 ans，进入下一条查询</text>

  <!-- 天然性质备注 -->
  <g filter="url(#sk)">
    <rect x="386" y="250" width="166" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="469" y="272" text-anchor="middle" font-size="12.5" fill="#7a5415" font-weight="bold">两条天然性质</text>
  <text x="469" y="294" text-anchor="middle" font-size="11.5" fill="#7a5415">old == c：先撤后加，净零</text>
  <text x="469" y="314" text-anchor="middle" font-size="11.5" fill="#7a5415">ans 永不为负</text>
  <text x="469" y="334" text-anchor="middle" font-size="11.5" fill="#7a5415">（撤的都是记过的贡献）</text>

  <text x="280" y="524" text-anchor="middle" font-size="11" fill="#888">每条查询至多 4 次邻居比较 + 1 次写入，均摊 O(1)</text>
</svg>
