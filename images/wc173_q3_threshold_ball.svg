<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：数「半径 D 的球」里有几个别的城市</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">距离是带权的，所以先求任意两点最短路，再逐行计数</text>

  <ellipse cx="215" cy="175" rx="126" ry="108" fill="#eef9f1" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="215" y="60" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">以城市 3 为心、D = 4 为半径</text>

  <path d="M 98 128 L 182 121" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="140" y="114" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <path d="M 214 131 L 286 189" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="258" y="150" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <path d="M 199 138 L 191 247" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="175" y="196" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <path d="M 285 209 L 206 256" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="252" y="245" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>

  <circle cx="80" cy="130" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="135" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">0</text>
  <circle cx="200" cy="120" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="125" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">1</text>
  <circle cx="300" cy="200" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="205" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">2</text>
  <circle cx="190" cy="265" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="190" y="270" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="350" y="86" width="192" height="172" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="362" y="108" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">城市 3 看向别人</text>
  <text x="362" y="130" font-size="10" fill="#555" filter="url(#rough2)">1：3-2-1 = 2 ≤ 4 计入</text>
  <text x="362" y="148" font-size="10" fill="#555" filter="url(#rough2)">2：3-2 = 1 ≤ 4 计入</text>
  <text x="362" y="166" font-size="10" fill="#555" filter="url(#rough2)">0：3-2-1-0 = 5 &gt; 4 不算</text>
  <path d="M 362 182 L 530 182" stroke="#9fb0cc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="362" y="202" font-size="10" fill="#555" filter="url(#rough2)">直接边 3-1 长 4，绕 3-2-1</text>
  <text x="362" y="220" font-size="10" fill="#555" filter="url(#rough2)">只要 2：最短路未必走直达</text>
  <text x="362" y="244" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">c3 = 2</text>

  <rect x="44" y="300" width="472" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="322" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">四个城市各自数一遍</text>
  <text x="60" y="342" font-size="10" fill="#555" filter="url(#rough2)">c = [2, 3, 3, 2]，最小值 2 被城市 0 与城市 3 同时取得</text>
  <text x="60" y="362" font-size="10" fill="#555" filter="url(#rough2)">并列时取编号更大者 → 答案 = 3，这就是题目要求的 tie-break</text>
</svg>
