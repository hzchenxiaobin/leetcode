<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">后继规则 = 5 节点有向图上的路径</text>
  <text x="320" y="56" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">箭头 X → Y 表示「X 后面可以接 Y」；i 是唯一不能接自己的节点</text>

  <!-- a <-> e 顶部双向边 -->
  <path d="M252,145 Q320,110 388,145" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M388,152 Q320,176 254,152" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">a ⇄ e 互相接</text>

  <!-- i 四向辐条 -->
  <path d="M296,209 L252,168" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="248" y="196" text-anchor="end" font-size="11.5" fill="#446688" filter="url(#rough2)">i→a</text>

  <path d="M348,199 L386,166" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M342,213 L378,181" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="214" font-size="11.5" fill="#777" filter="url(#rough2)">i ⇄ e</text>

  <path d="M348,266 L386,298" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M342,252 L378,284" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="394" y="266" font-size="11.5" fill="#777" filter="url(#rough2)">i ⇄ o</text>

  <path d="M296,256 L252,296" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="248" y="290" text-anchor="end" font-size="11.5" fill="#446688" filter="url(#rough2)">i→u</text>

  <!-- o -> u 底部 -->
  <path d="M385,322 Q320,356 258,322" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="374" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">o → u</text>

  <!-- u -> a 左侧 -->
  <path d="M228,294 L228,174" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="216" y="240" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">u → a</text>

  <!-- 节点 -->
  <circle cx="228" cy="145" r="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="228" y="152" text-anchor="middle" font-size="19" fill="#7a5a12" filter="url(#rough2)">a</text>

  <circle cx="412" cy="145" r="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="152" text-anchor="middle" font-size="19" fill="#3c6430" filter="url(#rough2)">e</text>

  <circle cx="320" cy="232" r="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="240" text-anchor="middle" font-size="21" fill="#2f4d68" filter="url(#rough2)">i</text>

  <circle cx="412" cy="322" r="27" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="329" text-anchor="middle" font-size="19" fill="#8a3a37" filter="url(#rough2)">o</text>

  <circle cx="228" cy="322" r="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="228" y="329" text-anchor="middle" font-size="19" fill="#3c6430" filter="url(#rough2)">u</text>

  <rect x="64" y="386" width="512" height="26" rx="9" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="404" text-anchor="middle" font-size="12" fill="#7a5a12" filter="url(#rough2)">出度：i = 4（不含 i 自己）、e = 2、o = 2、a = 1、u = 1</text>
</svg>
