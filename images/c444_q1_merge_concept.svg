<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：操作是强制的——合并和最小的相邻对</text>
  <path d="M 120 35 Q 320 42 520 35" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左侧：一轮操作的演示 -->
  <text x="30" y="64" font-size="12.5" fill="#666">看一轮操作：nums = [5,2,3,1]</text>

  <g filter="url(#sk)">
    <rect x="40" y="80" width="56" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="68" y="104" text-anchor="middle" font-size="14" fill="#2b2b2b">5</text>
  <g filter="url(#sk)">
    <rect x="104" y="80" width="56" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="132" y="104" text-anchor="middle" font-size="14" fill="#2b2b2b">2</text>
  <g filter="url(#sk)">
    <rect x="168" y="80" width="56" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="196" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">3</text>
  <g filter="url(#sk)">
    <rect x="232" y="80" width="56" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="260" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">1</text>

  <!-- 相邻对和的弧线标注 -->
  <path d="M 68 124 Q 100 142 132 124" stroke="#999" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="100" y="158" text-anchor="middle" font-size="11.5" fill="#666">7</text>
  <path d="M 132 124 Q 164 142 196 124" stroke="#999" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="164" y="158" text-anchor="middle" font-size="11.5" fill="#666">5</text>
  <path d="M 196 124 Q 228 142 260 124" stroke="#b85450" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="228" y="158" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">4 ← 最小</text>

  <!-- 圈出最小对 -->
  <g filter="url(#sk)">
    <ellipse cx="228" cy="99" rx="66" ry="32" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <!-- 替换箭头 -->
  <path d="M 228 170 L 228 206" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="240" y="192" font-size="11.5" font-weight="bold" fill="#b85450">用和 4 替换这对</text>

  <!-- 替换结果 -->
  <g filter="url(#sk)">
    <rect x="40" y="210" width="56" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="68" y="234" text-anchor="middle" font-size="14" fill="#2b2b2b">5</text>
  <g filter="url(#sk)">
    <rect x="104" y="210" width="56" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="132" y="234" text-anchor="middle" font-size="14" fill="#2b2b2b">2</text>
  <g filter="url(#sk)">
    <rect x="168" y="210" width="56" height="38" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
  </g>
  <text x="196" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">4</text>
  <text x="234" y="234" font-size="11" fill="#2e6e2e">← 新元素 = 3 + 1</text>

  <text x="40" y="272" font-size="11.5" fill="#888">长度 4 → 3，操作数 +1</text>
  <text x="40" y="294" font-size="12.5" font-weight="bold" fill="#2e6e2e">重复执行，直到非递减</text>

  <!-- 右侧：平局规则 -->
  <g filter="url(#sk)">
    <rect x="356" y="58" width="252" height="240" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="482" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7a5415">平局：必须取最左一对</text>

  <g filter="url(#sk)">
    <rect x="382" y="102" width="46" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="405" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">1</text>
  <g filter="url(#sk)">
    <rect x="434" y="102" width="46" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="457" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">3</text>
  <g filter="url(#sk)">
    <rect x="486" y="102" width="46" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="509" y="124" text-anchor="middle" font-size="13" fill="#2b2b2b">2</text>
  <g filter="url(#sk)">
    <rect x="538" y="102" width="46" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="561" y="124" text-anchor="middle" font-size="13" fill="#2b2b2b">2</text>

  <path d="M 405 140 Q 431 156 457 140" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="431" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">4</text>
  <path d="M 457 140 Q 483 156 509 140" stroke="#999" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="483" y="172" text-anchor="middle" font-size="11.5" fill="#666">5</text>
  <path d="M 509 140 Q 535 156 561 140" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="535" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">4</text>

  <text x="482" y="198" text-anchor="middle" font-size="11.5" fill="#7a5415">(1,3) 与 (2,2) 同为 4 ⇒ 取最左 (1,3)</text>
  <text x="482" y="220" text-anchor="middle" font-size="11" fill="#7a5415">→ 得 [4,2,2]，还要再合并一次，答案 2</text>
  <text x="482" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">若误取最右：[1,3,4] 一步有序，答案错成 1</text>

  <!-- 底部注记 -->
  <g filter="url(#sk)">
    <rect x="30" y="320" width="580" height="78" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="320" y="348" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">「选哪一对」由「相邻和最小 + 平局最左」唯一确定，零决策空间</text>
  <text x="320" y="372" text-anchor="middle" font-size="12" fill="#7a5415">「最小操作次数」= 这条唯一路径走到非递减的步数——直接模拟即是答案，也是唯一解</text>
</svg>
