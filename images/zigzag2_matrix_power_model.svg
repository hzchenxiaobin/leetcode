<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="32" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">n ≤ 10⁹：把「逐轮递推」折叠成「矩阵的幂」</text>

  <!-- 左面板：逐轮递推 -->
  <rect x="18" y="52" width="304" height="170" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">逐轮递推（Q3 做法）</text>

  <rect x="30" y="96" width="46" height="26" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="53" y="113" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">i=1</text>
  <path d="M 78 109 L 86 109" fill="none" stroke="#b85450" stroke-width="1.3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="90" y="96" width="46" height="26" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="113" y="113" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">i=2</text>
  <path d="M 138 109 L 146 109" fill="none" stroke="#b85450" stroke-width="1.3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="150" y="96" width="46" height="26" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="173" y="113" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">i=3</text>
  <text x="212" y="114" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">⋯</text>
  <path d="M 224 109 L 232 109" fill="none" stroke="#b85450" stroke-width="1.3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="236" y="96" width="66" height="26" rx="4" fill="#fafafa" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="269" y="113" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">i=n−1</text>

  <text x="170" y="148" text-anchor="middle" font-size="11.5" fill="#7a4a48" filter="url(#rough2)">每轮做一次前缀和 / 后缀和，O(m)</text>
  <text x="170" y="172" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">共 n−1 ≈ 10⁹ 轮 → 约 7.5×10¹⁰ 次运算</text>
  <text x="170" y="202" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 超时</text>

  <!-- 右面板：矩阵快速幂 -->
  <rect x="338" y="52" width="304" height="170" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="490" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">矩阵快速幂（本题做法）</text>

  <text x="490" y="102" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">x_i = M·x_{i−1}　⟹　x_n = M^{n−1}·x_1</text>

  <rect x="354" y="116" width="44" height="26" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="376" y="133" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">M</text>
  <path d="M 400 129 Q 414 118 428 129" fill="none" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="414" y="112" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">平方</text>
  <rect x="432" y="116" width="44" height="26" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="454" y="133" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">M²</text>
  <path d="M 478 129 Q 492 118 506 129" fill="none" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="510" y="116" width="44" height="26" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="532" y="133" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">M⁴</text>
  <text x="572" y="133" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">⋯</text>

  <text x="490" y="170" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">仅 ⌈log₂(n−1)⌉ ≈ 30 次矩阵乘法</text>
  <text x="490" y="192" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">再按二进制摊到初始向量 x_1 上</text>
  <text x="490" y="214" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 通过</text>

  <!-- 底部面板：转移算子 -->
  <rect x="18" y="240" width="624" height="182" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="264" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">一轮转移是一个 2m×2m 线性算子：x_{i+1} = M·x_i</text>

  <!-- 状态向量 -->
  <text x="118" y="290" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">x_i = ( up_i ; down_i )</text>
  <path d="M 66 298 L 60 298 L 60 400 L 66 400" fill="none" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="70" y="302" width="36" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="110" y="302" width="36" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="150" y="302" width="36" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="318" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">⋮</text>
  <rect x="70" y="332" width="36" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="110" y="332" width="36" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="150" y="332" width="36" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="348" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">⋮</text>
  <text x="118" y="380" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">每段 m 维（按末值 v 分量）</text>

  <!-- 箭头 向矩阵 -->
  <path d="M 216 328 L 258 328" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="237" y="318" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">×</text>

  <!-- 分块矩阵 M -->
  <rect x="270" y="296" width="56" height="56" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="298" y="328" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">0</text>
  <rect x="332" y="296" width="56" height="56" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 338 346 L 338 302 L 382 346 z" fill="#aac7ec" stroke="none" filter="url(#rough2)"/>
  <text x="360" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">A</text>
  <rect x="270" y="358" width="56" height="56" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 276 364 L 320 364 L 276 408 z" fill="#b9d9b0" stroke="none" filter="url(#rough2)"/>
  <text x="298" y="392" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Aᵀ</text>
  <rect x="332" y="358" width="56" height="56" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="390" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">0</text>
  <text x="329" y="288" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">M（2m×2m）</text>
  <text x="360" y="340" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">u&lt;v</text>
  <text x="298" y="378" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">u&gt;v</text>

  <!-- 箭头 到 x_{i+1} -->
  <path d="M 398 328 L 440 328" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="446" y="300" width="86" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="489" y="333" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">x_{i+1}</text>

  <text x="552" y="292" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">升的前一步必须是降</text>
  <text x="552" y="306" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（A 只保 u&lt;v 的格）</text>

  <rect x="418" y="370" width="216" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="526" y="386" text-anchor="middle" font-size="10.5" fill="#8a6a10" filter="url(#rough2)">分块技巧：M² = diag(A·Aᵀ, Aᵀ·A)</text>
  <text x="526" y="403" text-anchor="middle" font-size="10.5" fill="#8a6a10" filter="url(#rough2)">配合镜像对称可把状态减半（§3.3）</text>
</svg>
