<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="420" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：优质整数形如 ddd，大小只看数字 d</text>
  <path d="M 150 40 Q 340 50 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- string cells: 6777133339 -->
  <text x="52" y="78" font-size="13" fill="#555" font-weight="bold">num =</text>
  <g filter="url(#sk)">
    <rect x="95" y="60" width="46" height="40" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="141" y="60" width="46" height="40" rx="4" fill="#fff3d9" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="187" y="60" width="46" height="40" rx="4" fill="#fff3d9" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="233" y="60" width="46" height="40" rx="4" fill="#fff3d9" stroke="#c98a2b" stroke-width="2.2"/>
    <rect x="279" y="60" width="46" height="40" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="325" y="60" width="46" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="371" y="60" width="46" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="417" y="60" width="46" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="463" y="60" width="46" height="40" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
    <rect x="509" y="60" width="46" height="40" rx="4" fill="#e8f0fa" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="118" y="86" text-anchor="middle" font-size="17" fill="#333" font-family="monospace">6</text>
  <text x="164" y="86" text-anchor="middle" font-size="17" fill="#333" font-family="monospace">7</text>
  <text x="210" y="86" text-anchor="middle" font-size="17" fill="#333" font-family="monospace">7</text>
  <text x="256" y="86" text-anchor="middle" font-size="17" fill="#333" font-family="monospace">7</text>
  <text x="302" y="86" text-anchor="middle" font-size="17" fill="#333" font-family="monospace">1</text>
  <text x="348" y="86" text-anchor="middle" font-size="17" fill="#333" font-family="monospace">3</text>
  <text x="394" y="86" text-anchor="middle" font-size="17" fill="#333" font-family="monospace">3</text>
  <text x="440" y="86" text-anchor="middle" font-size="17" fill="#333" font-family="monospace">3</text>
  <text x="486" y="86" text-anchor="middle" font-size="17" fill="#333" font-family="monospace">3</text>
  <text x="532" y="86" text-anchor="middle" font-size="17" fill="#333" font-family="monospace">9</text>

  <!-- window brace under 777 -->
  <g filter="url(#sk)">
    <path d="M 143 118 Q 164 128 185 118 M 185 118 Q 206 128 227 118 M 227 118 Q 248 128 269 118" stroke="#c98a2b" stroke-width="1.8" fill="none"/>
  </g>
  <text x="206" y="146" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">滑动窗口 [i, i+2]</text>
  <text x="206" y="162" text-anchor="middle" font-size="11" fill="#7a5415">三字符相同 ⟺ 命中优质整数</text>

  <!-- scan arrow -->
  <g filter="url(#sk)">
    <path d="M 380 140 L 560 140" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="470" y="128" text-anchor="middle" font-size="11" fill="#555">i 从 0 扫到 n−3，每个窗口 O(1) 判断</text>

  <!-- Observation 1 box -->
  <g filter="url(#sk)">
    <rect x="48" y="192" width="300" height="112" rx="10" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="198" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">观察一：只需记录最大数字</text>
  <text x="198" y="240" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">"777" vs "333" ⟺ 7 vs 3</text>
  <text x="198" y="262" text-anchor="middle" font-size="11" fill="#666">三连串的数值 = 111 × d，随 d 严格递增</text>
  <text x="198" y="286" text-anchor="middle" font-size="11" fill="#666">故 best 只需存一个数字，无需存子串</text>

  <!-- Observation 2 box with digit ladder -->
  <g filter="url(#sk)">
    <rect x="372" y="192" width="262" height="112" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="503" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">观察二：候选只有 10 种</text>
  <g filter="url(#sk)">
    <rect x="392" y="228" width="36" height="26" rx="4" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="434" y="228" width="36" height="26" rx="4" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="476" y="228" width="36" height="26" rx="4" fill="#b85450" stroke="#8e3a36" stroke-width="1.8"/>
    <rect x="518" y="228" width="36" height="26" rx="4" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="560" y="228" width="36" height="26" rx="4" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="392" y="262" width="36" height="26" rx="4" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="434" y="262" width="36" height="26" rx="4" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="476" y="262" width="36" height="26" rx="4" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="518" y="262" width="36" height="26" rx="4" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
    <rect x="560" y="262" width="36" height="26" rx="4" fill="#f4faf5" stroke="#4a8e4a" stroke-width="1.2"/>
  </g>
  <text x="410" y="246" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">9</text>
  <text x="452" y="246" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">8</text>
  <text x="494" y="246" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold" font-family="monospace">7</text>
  <text x="536" y="246" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">6</text>
  <text x="578" y="246" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">5</text>
  <text x="410" y="280" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">4</text>
  <text x="452" y="280" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">3</text>
  <text x="494" y="280" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">2</text>
  <text x="536" y="280" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">1</text>
  <text x="578" y="280" text-anchor="middle" font-size="13" fill="#333" font-family="monospace">0</text>
  <text x="503" y="300" text-anchor="middle" font-size="10.5" fill="#2e6e2e">从大到小试探 "999"…"000"，首个命中即答案</text>

  <!-- bottom warning box -->
  <g filter="url(#sk)">
    <rect x="40" y="330" width="600" height="68" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.3"/>
  </g>
  <text x="60" y="354" font-size="12.5" font-weight="bold" fill="#b03a3a">关键提醒：</text>
  <text x="138" y="354" font-size="12" fill="#444">'0' 也是合法答案（"000"）——</text>
  <text x="60" y="378" font-size="12" fill="#444">哨兵取 best = −1，切勿用 0 表示"未找到"，否则无法区分"命中 0"与"无命中"。</text>
</svg>
