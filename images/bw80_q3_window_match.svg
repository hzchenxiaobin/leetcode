<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="157"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">窗口扫描：s = "fool3e7bar"，sub = "leet"</text>

  <!-- 前几个失败窗口 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="60" y="56" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="140" y="81" fill="#333">i = 0："fool"</text>
    <rect x="60" y="104" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="140" y="129" fill="#333">i = 1："ool3"</text>
    <rect x="60" y="152" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="140" y="177" fill="#333">i = 2："ol3e"</text>
  </g>
  <text x="140" y="216" font-size="11.5" fill="#b85450" filter="url(#rough2)" text-anchor="middle">首位 l / o / o 对不上 → 早停</text>

  <path d="M 240 128 C 280 128, 290 150, 320 160" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 成功窗口 i=3 -->
  <text x="430" y="56" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">i = 3：逐位核对 ✓</text>
  <!-- s 行 -->
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <rect x="330" y="70" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="374" y="70" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="418" y="70" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="462" y="70" width="44" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="352" y="95">l</text><text x="396" y="95">3</text><text x="440" y="95">e</text><text x="484" y="95">7</text>
  </g>
  <text x="430" y="128" font-size="11.5" fill="#888" filter="url(#rough2)" text-anchor="middle">s[3..6]</text>
  <!-- sub 行 -->
  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <rect x="330" y="146" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="374" y="146" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="418" y="146" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="462" y="146" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="352" y="171">l</text><text x="396" y="171">e</text><text x="440" y="171">e</text><text x="484" y="171">t</text>
  </g>
  <text x="430" y="204" font-size="11.5" fill="#888" filter="url(#rough2)" text-anchor="middle">sub = "leet"</text>

  <!-- 逐位判定 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="352" y="230">l = l ✓</text>
    <text x="396" y="230" fill="#4a7a3a" font-weight="bold">3 ∈ {e,3} ✓</text>
    <text x="440" y="230" fill="#4a7a3a" font-weight="bold">e ∈ {e,3} ✓</text>
    <text x="484" y="230" fill="#4a7a3a" font-weight="bold">7 ∈ {t,7,8} ✓</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="330" y="248" width="176" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8"/>
  </g>
  <text x="418" y="273" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" text-anchor="middle">全部满足 → 返回 true</text>

  <!-- 复杂度注 -->
  <g filter="url(#rough2)">
    <rect x="60" y="320" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="280" y="344" text-anchor="middle">最多 |s|−|sub|+1 个窗口，每位一次表查询 ok[sub[j]][s[i+j]]</text>
    <text x="280" y="366" text-anchor="middle" font-weight="bold">总复杂度 O(|s| × |sub|) ≈ 5000 × 5000，C++ 轻松通过</text>
  </g>
</svg>
