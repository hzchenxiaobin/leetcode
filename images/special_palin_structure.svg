<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">观察一：特殊数 = 数字集合 S ⊕ 回文奇偶性</text>
  <path d="M 240 42 Q 450 52 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左上：计数由 S 决定 -->
  <g filter="url(#sk)">
    <rect x="30" y="64" width="400" height="182" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="230" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e">计数 = 数字本身：S 决定多重集</text>
  <text x="50" y="118" font-size="12" fill="#444">选数字集合 S ⊆ {1,…,9}：数字 k 恰出现 k 次</text>
  <text x="50" y="140" font-size="12" fill="#444">例：S = {1, 2} ⟹ 1 个「1」+ 2 个「2」，长度 L = 3</text>
  <g filter="url(#sk)">
    <rect x="70" y="154" width="34" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="112" y="154" width="34" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="154" y="154" width="34" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="87" y="175" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>
  <text x="129" y="175" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>
  <text x="171" y="175" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">2</text>
  <path d="M 206 169 Q 236 169 258 169" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="266" y="174" font-size="12.5" fill="#555">排成回文 212</text>
  <text x="50" y="212" font-size="12" font-weight="bold" fill="#b85450">⚠ 数字 0 若出现须出现 0 次 ⟹ 永不出现</text>
  <text x="50" y="234" font-size="11.5" fill="#888">长度 L = ΣS，只能是 {1,…,29} 中的子集和</text>

  <!-- 右上：回文配对 -->
  <g filter="url(#sk)">
    <rect x="470" y="64" width="400" height="182" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="670" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">回文的配对结构：计数奇偶受限</text>
  <text x="490" y="118" font-size="12" fill="#444">位置 i 与 L+1−i 必须是同一数字（成对贡献计数）</text>
  <g filter="url(#sk)">
    <rect x="530" y="134" width="44" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="582" y="134" width="44" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="634" y="134" width="44" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="552" y="158" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">2</text>
  <text x="604" y="158" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">1</text>
  <text x="656" y="158" text-anchor="middle" font-size="17" font-weight="bold" fill="#333">2</text>
  <path d="M 552 128 Q 604 100 654 126" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="604" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">同数字</text>
  <text x="604" y="188" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">中间位落单 → 唯一的奇计数 1</text>
  <text x="490" y="212" font-size="12" fill="#444">偶数长度：所有位置成对 → 计数全为偶</text>
  <text x="490" y="234" font-size="12" fill="#444">奇数长度：恰中间一位落单 → 恰 1 个奇计数</text>

  <!-- 左下：反例 -->
  <g filter="url(#sk)">
    <rect x="30" y="270" width="400" height="176" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="230" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a36">反例：S = {1, 3} 永远无解</text>
  <text x="50" y="322" font-size="12" fill="#444">多重集 {1, 3, 3, 3}，长度 L = 4（偶），但计数 1、3 均为奇</text>
  <g filter="url(#sk)">
    <rect x="70" y="336" width="38" height="34" rx="5" fill="#fff" stroke="#b85450" stroke-width="1.6"/>
    <rect x="114" y="336" width="38" height="34" rx="5" fill="#fff" stroke="#b85450" stroke-width="1.6"/>
    <rect x="158" y="336" width="38" height="34" rx="5" fill="#fff" stroke="#b85450" stroke-width="1.6"/>
    <rect x="202" y="336" width="38" height="34" rx="5" fill="#fff" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="89" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">1</text>
  <text x="133" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
  <text x="177" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
  <text x="221" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>
  <path d="M 89 330 Q 155 306 219 330" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="155" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">1 ≠ 3 ✗</text>
  <text x="256" y="358" font-size="11" fill="#888">d₂ = d₃ ✓</text>
  <text x="50" y="396" font-size="12" fill="#444">偶长度回文要求计数全为偶数，凑不出 1 和 3</text>
  <text x="50" y="418" font-size="12" fill="#444">⟹ 含两个及以上奇数字的 S 直接排除</text>

  <!-- 右下：结论 -->
  <g filter="url(#sk)">
    <rect x="470" y="270" width="400" height="176" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="670" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">结论：合法 S 只有两种形态</text>
  <text x="490" y="324" font-size="12.5" fill="#444">① 纯偶数：S ⊆ {2, 4, 6, 8}（长度为偶）</text>
  <text x="490" y="348" font-size="12.5" fill="#444">② 恰一个奇数字 o ∈ {1,3,5,7,9} + 若干偶数</text>
  <text x="506" y="370" font-size="12.5" fill="#444">（长度为奇，o 恰好放在正中间）</text>
  <g filter="url(#sk)">
    <rect x="490" y="384" width="360" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="670" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">合法 S 至多 16 × 6 − 1 = 95 种</text>
  <text x="670" y="422" text-anchor="middle" font-size="11.5" fill="#7a5415">（长度 ≤ 16 时只剩 58 种）—— 可全枚举！</text>
</svg>
