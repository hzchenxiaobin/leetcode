<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">示例 1 演算：k = 1，建图后数连通分量</text>
  <path d="M 170 36 Q 320 46 470 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 分量①：{0,1} -->
  <g filter="url(#sk)">
    <rect x="44" y="48" width="252" height="132" rx="12" fill="#eef4fd" stroke="#446688" stroke-width="1.4" stroke-dasharray="6,4"/>
  </g>
  <text x="58" y="68" font-size="12.5" font-weight="bold" fill="#446688">分量 ①</text>
  <g filter="url(#sk)">
    <ellipse cx="140" cy="118" rx="36" ry="30" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="140" y="113" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b">0</text>
  <text x="140" y="131" text-anchor="middle" font-size="10.5" fill="#446688">{1,2}</text>
  <g filter="url(#sk)">
    <ellipse cx="238" cy="118" rx="36" ry="30" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="238" y="113" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b">1</text>
  <text x="238" y="131" text-anchor="middle" font-size="10.5" fill="#446688">{1}</text>
  <text x="238" y="80" text-anchor="middle" font-size="9.5" fill="#d6a040">[1,1] 去重→{1}</text>
  <line x1="176" y1="118" x2="202" y2="118" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="189" y="102" text-anchor="middle" font-size="10" fill="#b85450">共享 {1}</text>

  <!-- 分量③：{5} 孤立 -->
  <g filter="url(#sk)">
    <rect x="342" y="48" width="110" height="132" rx="12" fill="#fdf8ee" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6,4"/>
  </g>
  <text x="354" y="68" font-size="12.5" font-weight="bold" fill="#a67c2e">分量 ③</text>
  <g filter="url(#sk)">
    <ellipse cx="397" cy="118" rx="34" ry="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="397" y="113" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">5</text>
  <text x="397" y="131" text-anchor="middle" font-size="10.5" fill="#a67c2e">{7}</text>
  <text x="397" y="80" text-anchor="middle" font-size="9.5" fill="#d6a040">[7,7] 去重→{7}</text>
  <text x="397" y="166" text-anchor="middle" font-size="10" fill="#a67c2e">无边，孤立</text>

  <!-- 分量②：{2,3,4} -->
  <g filter="url(#sk)">
    <rect x="44" y="196" width="404" height="132" rx="12" fill="#f0f8ee" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="6,4"/>
  </g>
  <text x="58" y="216" font-size="12.5" font-weight="bold" fill="#2e6e2e">分量 ②</text>
  <g filter="url(#sk)">
    <ellipse cx="112" cy="266" rx="36" ry="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="112" y="261" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e">2</text>
  <text x="112" y="279" text-anchor="middle" font-size="10.5" fill="#4a7a3a">{3,4}</text>
  <g filter="url(#sk)">
    <ellipse cx="248" cy="266" rx="36" ry="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="248" y="261" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e">3</text>
  <text x="248" y="279" text-anchor="middle" font-size="10.5" fill="#4a7a3a">{4,5}</text>
  <g filter="url(#sk)">
    <ellipse cx="384" cy="266" rx="36" ry="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="384" y="261" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e2e">4</text>
  <text x="384" y="279" text-anchor="middle" font-size="10.5" fill="#4a7a3a">{5,6}</text>
  <line x1="148" y1="266" x2="212" y2="266" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="180" y="250" text-anchor="middle" font-size="10" fill="#b85450">共享 {4}</text>
  <line x1="284" y1="266" x2="348" y2="266" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="316" y="250" text-anchor="middle" font-size="10" fill="#b85450">共享 {5}</text>

  <!-- 右侧建图明细 -->
  <g filter="url(#sk)">
    <rect x="472" y="48" width="156" height="280" rx="10" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3"/>
  </g>
  <text x="550" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">建图明细（k = 1）</text>
  <text x="486" y="98" font-size="10.5" fill="#555">连边（共享 ≥ 1）：</text>
  <text x="486" y="118" font-size="10.5" fill="#2e6e2e">0–1 共享 {1}</text>
  <text x="486" y="138" font-size="10.5" fill="#2e6e2e">2–3 共享 {4}</text>
  <text x="486" y="158" font-size="10.5" fill="#2e6e2e">3–4 共享 {5}</text>
  <text x="486" y="184" font-size="10.5" fill="#888">其余 12 对共享为空</text>
  <text x="486" y="202" font-size="10.5" fill="#888">→ 不连边</text>
  <path d="M 486 222 Q 550 228 614 222" stroke="#dddddd" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <text x="486" y="248" font-size="10" fill="#555">三个分量：</text>
  <text x="486" y="268" font-size="11" font-weight="bold" fill="#b85450">{0,1}、{2,3,4}、{5}</text>
  <text x="550" y="302" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">答案 = 3</text>
  <text x="550" y="320" text-anchor="middle" font-size="9.5" fill="#999">6 个点 − 3 次合并</text>

  <text x="320" y="352" text-anchor="middle" font-size="11" fill="#888">1 号点原数组是 [1,1]：去重后只剩一个不同值——intersect 数的是「不同整数」</text>
  <text x="320" y="372" text-anchor="middle" font-size="11" fill="#888">本例 k=1 所以 0–1 仍连边；若 k=2，1 号点将因不同值不足而孤立</text>
</svg>
