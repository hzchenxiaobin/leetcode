<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">官方 6 组样例走查：S、两种配对、最终答案</text>
  <path d="M 200 40 Q 380 47 560 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="30" y="52" width="700" height="32" rx="6" fill="#eef1f5" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475c" filter="url(#rough2)">组</text>
  <text x="172" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475c" filter="url(#rough2)">a</text>
  <text x="344" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475c" filter="url(#rough2)">b</text>
  <text x="462" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475c" filter="url(#rough2)">S</text>
  <text x="542" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475c" filter="url(#rough2)">排序可行</text>
  <text x="626" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475c" filter="url(#rough2)">逐位可行</text>
  <text x="702" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475c" filter="url(#rough2)">答案</text>

  <rect x="30" y="84" width="700" height="36" rx="4" fill="#e6f4ea" stroke="#9fc4a8" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="107" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="172" y="107" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">5 2 3</text>
  <text x="344" y="107" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">2 3 4</text>
  <text x="462" y="107" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="542" y="107" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">√</text>
  <text x="626" y="107" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">×</text>
  <text x="702" y="107" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5+1=6</text>

  <rect x="30" y="120" width="700" height="36" rx="4" fill="#fce4ec" stroke="#d9a7a5" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="143" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="172" y="143" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">1 2 3</text>
  <text x="344" y="143" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">4 5 6</text>
  <text x="462" y="143" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">−9</text>
  <text x="542" y="143" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">×</text>
  <text x="626" y="143" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">×</text>
  <text x="702" y="143" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">−1</text>

  <rect x="30" y="156" width="700" height="36" rx="4" fill="#e6f4ea" stroke="#9fc4a8" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="179" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">3</text>
  <text x="172" y="179" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">4 5 2 3</text>
  <text x="344" y="179" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">3 5 1 2</text>
  <text x="462" y="179" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">3</text>
  <text x="542" y="179" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">√</text>
  <text x="626" y="179" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">√</text>
  <text x="702" y="179" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">3</text>

  <rect x="30" y="192" width="700" height="36" rx="4" fill="#e6f4ea" stroke="#9fc4a8" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="215" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">4</text>
  <text x="172" y="215" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">2 4 5 3 6 8</text>
  <text x="344" y="215" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">5 8 3 1 2 5</text>
  <text x="462" y="215" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">4</text>
  <text x="542" y="215" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">√</text>
  <text x="626" y="215" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">×</text>
  <text x="702" y="215" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">4+4=8</text>

  <rect x="30" y="228" width="700" height="36" rx="4" fill="#fce4ec" stroke="#d9a7a5" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="251" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">5</text>
  <text x="172" y="251" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">5 8 11 14 17</text>
  <text x="344" y="251" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">16 12 10 10 6</text>
  <text x="462" y="251" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="542" y="251" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">×</text>
  <text x="626" y="251" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">×</text>
  <text x="702" y="251" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">−1</text>

  <rect x="30" y="264" width="700" height="36" rx="4" fill="#e6f4ea" stroke="#9fc4a8" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="287" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">6</text>
  <text x="172" y="287" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">20 14 20</text>
  <text x="344" y="287" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">12 18 17</text>
  <text x="462" y="287" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">7</text>
  <text x="542" y="287" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">√</text>
  <text x="626" y="287" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">×</text>
  <text x="702" y="287" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5+7=12</text>

  <rect x="30" y="52" width="700" height="248" rx="6" fill="none" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="380" y="326" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第 1 组：升序 2,3,5 对 2,3,4 成立，但逐位 2 &lt; 3 失败 ⇒ 必须付 c = 5，再加 S = 1 得 6</text>
  <text x="380" y="348" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第 3 组：逐位也成立 ⇒ 不换序，只付 S = 3，比 c + S = 7 便宜（不要无条件加上 c）</text>
  <text x="380" y="370" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">第 2 组 S = −9 &lt; 0（元素只能变小）；第 5 组 S = 1 但升序最小 5 &lt; 6 ⇒ 均为 −1</text>
  <text x="380" y="392" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">第 4、6 组：升序配对成立而逐位不成立，答案都是 c + S（4 + 4 = 8 与 5 + 7 = 12）</text>
</svg>
