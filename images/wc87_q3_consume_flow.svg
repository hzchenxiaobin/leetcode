<svg xmlns="http://www.w3.org/2000/svg" width="660" height="462" viewBox="0 0 660 462" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="462" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">贪心流程：取最小剩余牌，批量扣减一整段连续值</text>
  <path d="M 130 40 Q 330 50 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="85.0" y="48.0" width="330" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="250" y="68.4" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e">n % groupSize != 0 ？</text>
  <text x="250" y="83.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">→ 直接返回 false</text>
  <g filter="url(#sk2)"><rect x="85.0" y="116.0" width="330" height="48" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="136.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">统计每个值的剩余张数 cnt[x]</text>
  <text x="250" y="151.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">（有序 map，或计数后排序）</text>
  <g filter="url(#sk2)"><rect x="85.0" y="182.0" width="330" height="48" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="210.1" text-anchor="middle" font-size="11.5" fill="#2b4a6e">按值升序取出最小的 x，使 cnt[x] &gt; 0</text>
  <g filter="url(#sk2)"><rect x="85.0" y="246.0" width="330" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="250" y="266.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">c = cnt[x]；检查 x, x+1, …, x+g-1</text>
  <text x="250" y="281.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">是否存在且剩余张数都 ≥ c</text>
  <g filter="url(#sk2)"><rect x="85.0" y="314.0" width="330" height="48" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="250" y="334.4" text-anchor="middle" font-size="11.5" fill="#2b4a6e">这 g 个值各减去 c</text>
  <text x="250" y="349.9" text-anchor="middle" font-size="11.5" fill="#2b4a6e">（一次扣掉 c 组顺子）</text>
  <path d="M 250 97 L 250 115" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 165 L 250 181" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 231 L 250 245" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 250 295 L 250 313" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 85 338 L 62 338 L 62 206 L 82 206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="56" y="280" text-anchor="end" font-size="10" fill="#446688">下一个 x</text>
  <path d="M 416 270 L 480 270" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="485.0" y="249.0" width="160" height="42" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="565" y="274.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36">某值不足 → false</text>
  <path d="M 250 362 L 250 400" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <g filter="url(#sk2)"><rect x="120.0" y="403.0" width="260" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="250" y="420.4" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e22">所有值都处理完</text>
  <text x="250" y="435.9" text-anchor="middle" font-size="11.5" fill="#2e5e22">→ 返回 true</text>
</svg>
