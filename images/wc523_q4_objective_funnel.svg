<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">三级目标：一层层过滤到唯一答案</text>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">以 n = 13, s = 16 为例（≤ 13 的质数：2, 3, 5, 7, 11, 13）</text>

  <rect x="60" y="62" width="400" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="87" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">所有总和 ≤ 16 的非空子集：[2] [3] [2,3,5] … 共 22 个</text>

  <path d="M 260 106 L 260 130" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="124" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">① 总和尽可能大 → 16</text>

  <rect x="96" y="136" width="100" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="210" y="136" width="100" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="324" y="136" width="100" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="146" y="156" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[3, 13]</text>
  <text x="260" y="156" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[5, 11]</text>
  <text x="374" y="156" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[2, 3, 11]</text>

  <path d="M 260 170 L 260 194" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="188" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② 个数最少 → 2 个</text>

  <rect x="148" y="200" width="100" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="272" y="200" width="100" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="198" y="220" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[3, 13]</text>
  <text x="322" y="220" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[5, 11]</text>

  <path d="M 260 234 L 260 258" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="252" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">③ 字典序最小</text>

  <rect x="185" y="264" width="150" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="287" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">[3, 13]</text>

  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">进入第 ③ 级的候选个数都是 k*、总和都是 S* —— 长度相同，逐位比较即可</text>
  <text x="260" y="352" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">注意 16 = 2 + 3 + 11 被 ② 淘汰：数量优先于字典序</text>
  <text x="260" y="380" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">（Q2 求「个数最多」，本题求「个数最少」—— 同场两题目标恰好相反）</text>
</svg>
