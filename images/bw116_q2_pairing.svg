<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">配对观察：美丽 ⇔ 每对 (s[2i], s[2i+1]) 相同 ⇔ 改动数 = 不相同对数</text>

  <!-- 上排：任意合法划分 -->
  <g filter="url(#rough2)">
    <text x="70" y="58" font-size="12.5" fill="#446688">任意合法划分，块长都是偶数 → 细分成若干 2 块</text>

    <rect x="70" y="70" width="28" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="98" y="70" width="28" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="126" y="70" width="28" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="154" y="70" width="28" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="182" y="70" width="28" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="210" y="70" width="28" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="154" y="120" text-anchor="middle" font-size="11.5" fill="#888">块长 2 / 4 → 都能切成 2 块</text>

    <path d="M 260 86 C 290 86, 300 86, 326 86" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="330" y="70" width="28" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="358" y="70" width="28" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="386" y="70" width="28" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="414" y="70" width="28" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="442" y="70" width="28" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="470" y="70" width="28" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="414" y="120" text-anchor="middle" font-size="11.5" fill="#888">统一看成长 2 的块</text>
  </g>

  <!-- 中：例子 -->
  <g filter="url(#rough2)">
    <text x="70" y="156" font-size="12.5" fill="#446688">例：s = 1001</text>
    <!-- 字符 -->
    <rect x="70" y="168" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="87" y="190" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="104" y="168" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="121" y="190" text-anchor="middle" font-size="14" fill="#333">0</text>
    <rect x="138" y="168" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="155" y="190" text-anchor="middle" font-size="14" fill="#333">0</text>
    <rect x="172" y="168" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="189" y="190" text-anchor="middle" font-size="14" fill="#333">1</text>

    <!-- 配对括线 -->
    <path d="M 87 208 C 87 218, 121 218, 121 210" fill="none" stroke="#b85450" stroke-width="1.8"/>
    <path d="M 155 208 C 155 218, 189 218, 189 210" fill="none" stroke="#b85450" stroke-width="1.8"/>
    <text x="104" y="236" text-anchor="middle" font-size="11.5" fill="#b85450">1≠0 → 改 1 次</text>
    <text x="172" y="236" text-anchor="middle" font-size="11.5" fill="#b85450">0≠1 → 改 1 次</text>

    <text x="260" y="190" font-size="12.5" fill="#555">→ 1100</text>
    <path d="M 230 186 C 242 186, 246 186, 254 186" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- 右：跨对改动不会更省 -->
  <g filter="url(#rough2)">
    <rect x="320" y="152" width="172" height="108" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.55"/>
    <text x="406" y="176" text-anchor="middle" font-size="12.5" fill="#d6a040">为什么逐对贪最优？</text>
    <text x="336" y="200" font-size="12" fill="#555">每对内部各改各的互不</text>
    <text x="336" y="220" font-size="12" fill="#555">影响；一对不同必至少</text>
    <text x="336" y="240" font-size="12" fill="#555">改 1 次，且只改 1 次</text>
    <text x="336" y="258" font-size="12" fill="#555">就能把它变相同 ✓</text>
  </g>

  <!-- 底部 -->
  <g filter="url(#rough2)">
    <rect x="40" y="282" width="452" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.45"/>
    <text x="58" y="308" font-size="13" fill="#4a7a3a">答案 = #{ i : s[2i] ≠ s[2i+1] }，一遍扫描 O(n)</text>
    <text x="58" y="330" font-size="12" fill="#888">「10」改 1 次、「0101」改 2 次、「0000」改 0 次——与官方示例一致</text>
  </g>
</svg>
