<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">换收尾引擎：分层贪心（跳跃游戏 II）</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">第 k 层 = 恰用 k 段可达的边界（连成区间，无洞），层内看 max(i + mn[i])</text>

  <!-- mn 值行，x(p) = 60 + 44p -->
  <text x="30" y="66" font-size="10" fill="#666" filter="url(#rough2)">mn</text>
  <g text-anchor="middle" filter="url(#rough2)">
    <text x="60" y="66" font-size="11" fill="#333">2</text>
    <text x="104" y="66" font-size="11" fill="#333">3</text>
    <text x="148" y="66" font-size="11" fill="#333">3</text>
    <text x="192" y="66" font-size="11" fill="#b85450" font-weight="bold">0</text>
    <text x="236" y="66" font-size="11" fill="#b85450" font-weight="bold">0</text>
    <text x="280" y="66" font-size="11" fill="#333">3</text>
    <text x="324" y="66" font-size="11" fill="#333">2</text>
    <text x="368" y="66" font-size="11" fill="#b85450" font-weight="bold">0</text>
  </g>

  <!-- 层带 -->
  <g filter="url(#rough2)">
    <rect x="88" y="74" width="76" height="22" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="126" y="89" text-anchor="middle" font-size="10" fill="#33507a">R₁ = 2</text>
    <rect x="176" y="74" width="120" height="22" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="236" y="89" text-anchor="middle" font-size="10" fill="#2f5524">R₂ = 5</text>
    <rect x="308" y="74" width="120" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="368" y="89" text-anchor="middle" font-size="10" fill="#7a5410">R₃ = 8 = n</text>
  </g>

  <!-- 位置圆点 -->
  <text x="32" y="128" font-size="10" fill="#666" filter="url(#rough2)">i</text>
  <g filter="url(#rough2)">
    <circle cx="60" cy="124" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="104" cy="124" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="148" cy="124" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="192" cy="124" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="236" cy="124" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="280" cy="124" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="324" cy="124" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="368" cy="124" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="412" cy="124" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="60" y="128" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="104" y="128" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="148" y="128" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="192" y="128" text-anchor="middle" font-size="12" fill="#8a3a34">3</text>
    <text x="236" y="128" text-anchor="middle" font-size="12" fill="#8a3a34">4</text>
    <text x="280" y="128" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="324" y="128" text-anchor="middle" font-size="12" fill="#333">6</text>
    <text x="368" y="128" text-anchor="middle" font-size="12" fill="#8a3a34">7</text>
    <text x="412" y="128" text-anchor="middle" font-size="12" fill="#7a5410" font-weight="bold">8</text>
  </g>

  <!-- 跳跃弧线 -->
  <g fill="none" filter="url(#rough2)">
    <path d="M 60,138 Q 104,206 148,138" stroke="#d6a040" stroke-width="2.5"/>
    <path d="M 104,138 Q 170,222 236,138" stroke="#999" stroke-width="1.4"/>
    <path d="M 148,138 Q 214,294 280,138" stroke="#d6a040" stroke-width="2.5"/>
    <path d="M 280,138 Q 346,206 412,138" stroke="#d6a040" stroke-width="2.5"/>
    <path d="M 324,138 Q 368,254 412,138" stroke="#999" stroke-width="1.4"/>
  </g>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <line x1="60" y1="246" x2="88" y2="246" stroke="#d6a040" stroke-width="2.5"/>
    <text x="94" y="250" font-size="10" fill="#666">最优链 0→2→5→8，共 3 段</text>
    <line x1="270" y1="246" x2="298" y2="246" stroke="#999" stroke-width="1.4"/>
    <text x="304" y="250" font-size="10" fill="#666">其余跳跃</text>
    <circle cx="400" cy="246" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="412" y="250" font-size="10" fill="#666">死点 mn=0</text>
  </g>

  <!-- 反例警告框 -->
  <rect x="28" y="262" width="464" height="92" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="11.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">⚠ 朴素贪心「每步跳到 i + mn[i]」必错</text>
  <text x="260" y="302" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">words=["abc","bcdefa"], target="abcdef"，mn=[3,5,0,0,0,0]</text>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">朴素：0 → 3（最长 "abc"），位置 3 是死点 → 误判 -1</text>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">分层：R₁=3 后看窗口 [0,3]：max(1+5, 2+0, 3+0)=6=n → 正确答案 2（"a"+"bcdef"）</text>
</svg>
