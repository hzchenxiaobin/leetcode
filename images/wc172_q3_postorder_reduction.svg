<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4" fill="none" stroke="#777" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360.0" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">后序归约：子树定型之后，父节点才知道自己是否成了叶子</text>
  <text x="360.0" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">以 target = 2 为例，删除只会沿「父边」逐层向上传播，一趟后序 DFS 即可收敛</text>
  <rect x="30" y="66" width="310" height="236" rx="10" fill="#f2f6fb" stroke="#c8d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="380" y="66" width="310" height="236" rx="10" fill="#f2f6fb" stroke="#c8d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="185" y="89" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">原始树（叶子 2 先被删）</text>
  <text x="535" y="89" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">归约结果（再无可删叶子）</text>
  <path d="M185,122 L135,184" stroke="#8a98a8" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M185,122 L235,184" stroke="#8a98a8" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M135,184 L110,246" stroke="#8a98a8" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M235,184 L205,246" stroke="#8a98a8" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M235,184 L268,246" stroke="#8a98a8" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="185" cy="122" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="126.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="135" cy="184" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="135" y="188.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="235" cy="184" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="235" y="188.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="110" cy="246" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="250.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="205" cy="246" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="250.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="268" cy="246" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="268" y="250.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="185" y="288" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">红色 = 值为 target 的节点</text>
  <path d="M344,184 L374,184" stroke="#777" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M505,122 L560,184" stroke="#8a98a8" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M560,184 L610,246" stroke="#8a98a8" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="505" cy="122" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="505" y="126.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="560" cy="184" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="560" y="188.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="610" cy="246" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="610" y="250.5" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="535" y="288" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">三个 2 全部删除，1 的右子树只剩 3 → 4</text>
  <rect x="60" y="318" width="600" height="102" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="341" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">一趟后序 DFS 的归约函数 f</text>
  <text x="78" y="363" font-size="10.5" fill="#555" filter="url(#rough2)">f(null) = null；f(v) = null 当且仅当 v.val = target 且 f(v.left) = f(v.right) = null</text>
  <text x="78" y="381" font-size="10.5" fill="#555" filter="url(#rough2)">否则 f(v) = v，并把两个孩子替换成 f(v.left)、f(v.right)</text>
  <text x="78" y="405" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">删除只影响父亲 → 兄弟子树互不干扰，先算孩子再算自己必然收敛</text>
</svg>
