<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">状态设计：后缀 (i, M) 与后缀和 S[i]</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每回合拿走前 X 堆（1 ≤ X ≤ 2M），然后 M ← max(M, X)，换手</text>

  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <rect x="56" y="62" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="84" y="88" fill="#8a6a20">2</text>
    <rect x="122" y="62" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="150" y="88" fill="#3a4a66">7</text>
    <rect x="188" y="62" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="216" y="88" fill="#3a4a66">9</text>
    <rect x="254" y="62" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="282" y="88" fill="#3a4a66">4</text>
    <rect x="320" y="62" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="348" y="88" fill="#3a4a66">4</text>
  </g>

  <g font-size="9" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="84" y="116">i</text>
    <text x="150" y="116">i+1</text>
    <text x="216" y="116">i+2</text>
    <text x="282" y="116">i+3</text>
    <text x="348" y="116">i+4</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 56 126 L 56 132 L 112 132 L 112 126" fill="none" stroke="#d6a040" stroke-width="1.6"/>
    <text x="84" y="148" text-anchor="middle" font-size="9.5" fill="#8a6a20">本轮拿走的前 X 堆</text>
    <text x="470" y="54" text-anchor="middle" font-size="9" fill="#666">取走 X 堆后</text>
  </g>

  <rect x="404" y="58" width="140" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#3a5a30" filter="url(#rough2)">
    <text x="416" y="76" font-weight="bold">对手面对 (i+X, M′)</text>
    <text x="416" y="94">M′ = max(M, X)</text>
    <text x="416" y="110">后缀长度变短，参数只增不减</text>
    <text x="416" y="128">S[i] 为后缀石子总数</text>
  </g>

  <path d="M 280 156 L 280 176" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="46" y="178" width="468" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g font-size="10" fill="#6a5320" filter="url(#rough2)">
    <text x="60" y="199" font-weight="bold">零和：后缀 S[i] 里的石子最终会被两人全部拿完，总和固定</text>
    <text x="60" y="218">所以「我拿到的」= S[i] − 「对手在这段后缀里拿到的」，只需记录一个人的收益</text>
  </g>

  <path d="M 280 234 L 280 252" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="46" y="254" width="468" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="280" y="278" text-anchor="middle" font-size="11" fill="#2f4460" font-weight="bold">dp(i, M) = max ( S[i] − dp(i + x, max(M, x)) )</text>
    <text x="280" y="300" text-anchor="middle" font-size="10" fill="#446688">其中 1 ≤ x ≤ min(2M, n − i)，dp(n, ·) = 0</text>
  </g>

  <text x="280" y="342" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">剪枝：若 2M ≥ n − i 则可一次全部拿走，直接 dp(i, M) = S[i]</text>
  <text x="280" y="362" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">答案即 Alice 在初始局面 (0, M = 1) 的收益：dp(0, 1)</text>
</svg>
