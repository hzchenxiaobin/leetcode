<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">合法 ⇔ 形如 a…ab…b：a 段整体在 b 段之前</text>
  <path d="M 130 42 Q 320 50 510 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 上半：合法 ===== -->
  <text x="60" y="84" font-size="14" font-weight="bold" fill="#4a7a3a">✓ 合法：aaabbb</text>
  <g filter="url(#sk)">
    <rect x="150" y="66" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="198" y="66" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="246" y="66" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="294" y="66" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="342" y="66" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="390" y="66" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="171" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">a</text>
  <text x="219" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">a</text>
  <text x="267" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">a</text>
  <text x="315" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">b</text>
  <text x="363" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">b</text>
  <text x="411" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">b</text>
  <path d="M 291 58 L 291 118" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="222" y="134" text-anchor="middle" font-size="12" fill="#446688">a 段（可为空）</text>
  <text x="351" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a">b 段（可为空）</text>
  <g filter="url(#sk)">
    <rect x="480" y="68" width="110" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="535" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">返回 true</text>
  <text x="291" y="160" text-anchor="middle" font-size="12" fill="#555">a 全部在分界左侧，b 全部在右侧</text>

  <path d="M 320 174 Q 320 182 320 190" stroke="#3a3a3a" stroke-width="1.2" fill="none" filter="url(#sk)"/>

  <!-- ===== 下半：非法 ===== -->
  <text x="60" y="218" font-size="14" font-weight="bold" fill="#b85450">✗ 非法：abab</text>
  <g filter="url(#sk)">
    <rect x="170" y="200" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="218" y="200" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="266" y="200" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="314" y="200" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="191" y="227" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">a</text>
  <text x="239" y="227" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">b</text>
  <text x="287" y="227" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">a</text>
  <text x="335" y="227" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a">b</text>
  <g filter="url(#sk)">
    <rect x="212" y="194" width="102" height="54" rx="6" fill="none" stroke="#b85450" stroke-width="2.5"/>
  </g>
  <text x="263" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">相邻 ba！</text>
  <g filter="url(#sk)">
    <rect x="480" y="202" width="110" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="535" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">返回 false</text>
  <text x="330" y="270" text-anchor="middle" font-size="12" fill="#555">下标 1 的 b 出现在下标 2 的 a 之前 → 违规</text>
  <text x="330" y="290" text-anchor="middle" font-size="12" fill="#555">任何违规对 (i, j) 都必然浓缩成一处相邻的 ba</text>

  <!-- ===== 底部：等价判据 ===== -->
  <g filter="url(#sk)">
    <rect x="60" y="316" width="520" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415">等价判据：合法 ⇔ 子串 "ba" 不出现</text>
  <text x="320" y="364" text-anchor="middle" font-size="12" fill="#8a6415">⇔ 最后一个 a 在第一个 b 之前（某字符缺席时视为空段，条件成立）</text>
</svg>
