<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="201"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2, 5, 9]，只枚举 cnt &gt; 0 的分母 → 7 + 2 + 1 = 10</text>

  <!-- d=2 -->
  <rect x="40" y="48" width="480" height="88" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <rect x="40" y="48" width="10" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="72" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 分母 d = 2（cnt[2] = 1）</text>
  <text x="62" y="92" font-size="11" fill="#333" filter="url(#rough2)">倍数 2, 4, 6, 8：#≥2 = 3，#≥4 = 2，#≥6 = 1，#≥8 = 1</text>
  <text x="62" y="112" font-size="11" fill="#333" filter="url(#rough2)">S(2) = 3 + 2 + 1 + 1 = 7，即 floor(2/2)+floor(5/2)+floor(9/2) = 1+2+4</text>
  <text x="488" y="112" font-size="12" fill="#2f5226" font-weight="bold" text-anchor="end" filter="url(#rough2)">贡献 7</text>

  <!-- d=5 -->
  <rect x="40" y="146" width="480" height="88" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <rect x="40" y="146" width="10" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="170" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② 分母 d = 5（cnt[5] = 1）</text>
  <text x="62" y="190" font-size="11" fill="#333" filter="url(#rough2)">倍数 5, 10：#≥5 = 2（5 和 9），#≥10 = 0</text>
  <text x="62" y="210" font-size="11" fill="#333" filter="url(#rough2)">S(5) = 2，即 floor(5/5)+floor(9/5) = 1+1（floor(2/5) = 0）</text>
  <text x="488" y="210" font-size="12" fill="#2f5226" font-weight="bold" text-anchor="end" filter="url(#rough2)">贡献 2</text>

  <!-- d=9 -->
  <rect x="40" y="244" width="480" height="88" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <rect x="40" y="244" width="10" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="62" y="268" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">③ 分母 d = 9（cnt[9] = 1）</text>
  <text x="62" y="288" font-size="11" fill="#333" filter="url(#rough2)">倍数 9：#≥9 = 1（只有 9 自己）</text>
  <text x="62" y="308" font-size="11" fill="#333" filter="url(#rough2)">S(9) = 1，即 floor(9/9) = 1；d = 1, 3, 4, 6, 7, 8 的 cnt[d] = 0，直接跳过</text>
  <text x="488" y="308" font-size="12" fill="#2f5226" font-weight="bold" text-anchor="end" filter="url(#rough2)">贡献 1</text>

  <!-- 汇总 -->
  <rect x="40" y="346" width="480" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="62" y="372" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">answer = Σ_d cnt[d] · S(d) = 1×7 + 1×2 + 1×1 = 10</text>
  <text x="62" y="396" font-size="11.5" fill="#2f5226" filter="url(#rough2)">包含所有有序对 (i, j)：i = j 时商为 1，i≠j 两个方向各计一次 ✓ 与官方输出一致</text>
</svg>
