<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="720" height="560" fill="#fdfcf7"/>
  <text x="360" y="26" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：word = "aeiaaioaaaaeiiiiouuuooaauuaeiu"（n = 30）</text>
  <text x="360" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">5 个下降点（红色 ⌄）切出 6 个极大非降段；段③ 5 种齐 ⇒ 整段美丽，长 13</text>

