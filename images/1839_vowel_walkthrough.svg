  <!-- summary -->
  <g filter="url(#sk)">
    <rect x="48" y="452" width="624" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="360" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">段③内部：distinct 在 pos 17（首个 u）首次达 5 → ans = 11；续接 u、u → 12、13</text>
  <text x="360" y="504" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">段尾更新恰为整段长——最终 ans = 13 ✓，对应子串 "aaaaeiiiiouuu"</text>
