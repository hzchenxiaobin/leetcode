<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="53" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="430" fill="#fdfcf7"/>
  <text x="330" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">核心观察：任意操作序列 = 连续划分，每块收缩为块内最大值</text>
  <path d="M 150 33 Q 330 40 510 33" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 块标签与括号 -->
  <text x="179" y="60" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a8edb">块 1</text>
  <path d="M 152 66 L 152 72 M 152 69 L 206 69 M 206 66 L 206 72" stroke="#4a8edb" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="293" y="60" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">块 2</text>
  <path d="M 228 66 L 228 72 M 228 69 L 358 69 M 358 66 L 358 72" stroke="#4a8e4a" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="445" y="60" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a6b1f">块 3</text>
  <path d="M 380 66 L 380 72 M 380 69 L 510 69 M 510 66 L 510 72" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- 原数组格子 -->
  <text x="142" y="106" text-anchor="end" font-size="11.5" fill="#666">原数组</text>
  <g filter="url(#sk)">
    <rect x="150" y="80" width="58" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="226" y="80" width="58" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="302" y="80" width="58" height="46" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="378" y="80" width="58" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="454" y="80" width="58" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="179" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">4</text>
  <text x="255" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">2</text>
  <text x="331" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">5</text>
  <text x="407" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="483" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">5</text>
  <text x="179" y="140" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="255" y="140" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="331" y="140" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="407" y="140" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="483" y="140" text-anchor="middle" font-size="10" fill="#999">4</text>

  <!-- 收缩箭头 -->
  <path d="M 179 148 C 179 200, 218 198, 218 244" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 293 148 C 293 202, 330 200, 330 244" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 445 148 C 445 202, 442 200, 442 244" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="330" y="216" text-anchor="middle" font-size="11" fill="#666">每块做一次操作，整段压成 1 个数（块内最大值）</text>

  <!-- 收缩后数组 -->
  <text x="174" y="278" text-anchor="end" font-size="11.5" fill="#666">最终数组</text>
  <g filter="url(#sk)">
    <rect x="182" y="250" width="72" height="48" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <rect x="294" y="250" width="72" height="48" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/>
    <rect x="406" y="250" width="72" height="48" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="218" y="281" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">4</text>
  <text x="330" y="281" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">5</text>
  <text x="442" y="281" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b">5</text>
  <text x="330" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">块最大值序列：4 ≤ 5 ≤ 5，非递减 ✓</text>

  <!-- 底部注记 -->
  <g filter="url(#sk)">
    <rect x="40" y="332" width="580" height="82" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="330" y="354" text-anchor="middle" font-size="11.5" fill="#7a5415">max 满足结合律：先压 A 再压 B，与一次压掉 A ∪ B 结果相同</text>
  <text x="330" y="374" text-anchor="middle" font-size="11.5" fill="#7a5415">⇒ 任意操作序列的净效果 = 某个连续划分、每块收缩为块最大值；任何划分也能逐块实现</text>
  <text x="330" y="394" text-anchor="middle" font-size="11.5" fill="#7a5415">「最长」⟺「最多分几块且块最大值非递减」——下一步：块最大值能出现在哪些位置？</text>
</svg>
