<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">降维：每行/每列做一次「长度至少 2」的最大子段和</text>
  <text x="280" y="49" text-anchor="middle" font-size="10.5" fill="#888">行 2 的 [2,-1,3] 和为 4，正是示例 1 的最优共享段</text>
  <text x="30" y="84" text-anchor="start" font-size="11" fill="#333" font-weight="bold">grid 第 2 行：[−4, 2, −1, 3]</text>
  <rect x="80" y="96" width="76" height="44" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="118" y="124" text-anchor="middle" font-size="14" fill="#999999" font-weight="bold">-4</text>
  <text x="118" y="158" text-anchor="middle" font-size="9" fill="#888">j=0</text>
  <rect x="168" y="96" width="76" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="206" y="124" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <text x="206" y="158" text-anchor="middle" font-size="9" fill="#888">j=1</text>
  <rect x="256" y="96" width="76" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="294" y="124" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">-1</text>
  <text x="294" y="158" text-anchor="middle" font-size="9" fill="#888">j=2</text>
  <rect x="344" y="96" width="76" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="382" y="124" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">3</text>
  <text x="382" y="158" text-anchor="middle" font-size="9" fill="#888">j=3</text>
  <path d="M 168 90 L 428 90" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="430" y="70" text-anchor="middle" font-size="10" fill="#8a6a20">子段 [2, −1, 3] = 4（长度 3 ≥ 2）</text>
  <rect x="30" y="186" width="230" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="214" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">any = 以 j 结尾、长度 ≥ 1 的最大和</text>
  <text x="145" y="227" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">ge2 = 以 j 结尾、长度 ≥ 2 的最大和</text>
  <rect x="280" y="186" width="250" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="405" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">ge2(j) = max(any(j−1), ge2(j−1)) + x</text>
  <text x="405" y="227" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">any(j) = max(x, any(j−1) + x)</text>
  <text x="30" y="282" text-anchor="start" font-size="10.5" fill="#333" font-weight="bold">示例 1 的行/列最优值</text>
  <rect x="30" y="292" width="76" height="52" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="68" y="314" text-anchor="middle" font-size="9.5" fill="#555">第 0 行</text>
  <text x="68" y="334" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">3</text>
  <rect x="114" y="292" width="76" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="152" y="314" text-anchor="middle" font-size="9.5" fill="#555">第 2 行</text>
  <text x="152" y="334" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <rect x="198" y="292" width="76" height="52" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="236" y="314" text-anchor="middle" font-size="9.5" fill="#555">第 0 列</text>
  <text x="236" y="334" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">2</text>
  <rect x="282" y="292" width="76" height="52" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="320" y="314" text-anchor="middle" font-size="9.5" fill="#555">第 2 列</text>
  <text x="320" y="334" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">3</text>
  <rect x="366" y="292" width="76" height="52" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="404" y="314" text-anchor="middle" font-size="9.5" fill="#555">第 3 列</text>
  <text x="404" y="334" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">3</text>
  <rect x="450" y="292" width="76" height="52" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="488" y="314" text-anchor="middle" font-size="9.5" fill="#555">内部单格</text>
  <text x="488" y="334" text-anchor="middle" font-size="13" fill="#666" font-weight="bold">3</text>
  <rect x="30" y="358" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="377" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">所有候选取最大 = 4，与示例 1 输出一致</text>
</svg>
