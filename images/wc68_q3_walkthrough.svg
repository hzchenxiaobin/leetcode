  <rect x="512" y="76" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="94" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">i</text>
  <text x="428" y="94" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">arr[i]</text>
  <text x="484" y="94" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">cur</text>
  <text x="550" y="94" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">判定</text>

  <!-- B 数据 -->
  <rect x="360" y="104" width="40" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="360" y="130" width="40" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="360" y="156" width="40" height="26" fill="#f7f7f7" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
