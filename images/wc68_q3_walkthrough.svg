  <text x="484" y="122" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">4</text>
  <text x="484" y="148" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">4</text>
  <text x="484" y="174" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">4</text>
  <text x="484" y="200" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">4</text>
  <text x="484" y="226" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">4</text>

