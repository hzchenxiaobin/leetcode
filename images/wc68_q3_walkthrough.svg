  <text x="108" y="94" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">arr[i]</text>
  <text x="164" y="94" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">cur</text>
  <text x="230" y="94" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">判定</text>

