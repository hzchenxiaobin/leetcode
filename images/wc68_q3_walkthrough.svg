  <text x="320" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">cur = max(arr[0..i])，每对齐一次就切一刀</text>

  <text x="154" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">arr = [1, 0, 2, 3, 4]</text>
  <text x="474" y="70" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">arr = [4, 3, 2, 1, 0]</text>

