  <!-- 结论 -->
  <rect x="40" y="252" width="264" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="172" y="272" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">A：对齐 4 次 → 4 块（[1,0] [2] [3] [4]）</text>
  <rect x="360" y="252" width="264" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="492" y="272" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">B：只有 i = 4 对齐 → 1 块（整串）</text>

  <text x="320" y="306" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">✗ 的本质：cur &gt; i，说明前 i+1 个格子里藏了一个「值 &gt; i」的数，它必须走到右边去</text>
  <text x="320" y="324" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">而块内元素只能在本块内重排 ⇒ 这条边界一旦切开就无法复原，只能等 cur 追上下标</text>
  <text x="320" y="342" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">B 里 cur 始终是 4，直到 i = 4 才对齐，所以整串被 4 与 0 首尾锁死</text>
