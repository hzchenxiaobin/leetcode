  <text x="230" y="174" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">✓ 收块 2</text>
  <text x="230" y="200" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">✓ 收块 3</text>
