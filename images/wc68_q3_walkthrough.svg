  <text x="428" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="428" y="226" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <rect x="456" y="104" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
