<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="620" height="420" fill="#fafafa"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 2 演算：arrivals = [1,2,3,3,3,4], w = 3, m = 2</text>
  <rect x="40" y="80" width="74" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="77" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="77" y="124" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">留</text>
  <text x="77" y="152" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 1 天</text>
  <rect x="134" y="80" width="74" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="171" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="171" y="124" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">留</text>
  <text x="171" y="152" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 2 天</text>
  <rect x="228" y="80" width="74" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="265" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="265" y="124" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">留</text>
  <text x="265" y="152" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 3 天</text>
  <rect x="322" y="80" width="74" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="359" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="359" y="124" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">留</text>
  <text x="359" y="152" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 4 天</text>
  <rect x="416" y="80" width="74" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="453" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="453" y="124" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">弃</text>
  <text x="453" y="152" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 5 天</text>
  <rect x="510" y="80" width="74" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="547" y="104" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="547" y="124" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">留</text>
  <text x="547" y="152" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 6 天</text>
  <text x="77" y="176" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt=1</text>
  <text x="171" y="176" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt=1</text>
  <text x="265" y="176" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt=1</text>
  <text x="359" y="176" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt=2</text>
  <text x="453" y="176" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">cnt 已 2 → 丢</text>
  <text x="547" y="176" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt=1</text>
  <path d="M 228 190 L 228 208 L 490 208 L 490 190" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="359" y="228" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">第 5 天窗口 [3, 3, 3]</text>
  <rect x="40" y="250" width="540" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="58" y="276" text-anchor="start" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">逐步观察</text>
  <text x="58" y="300" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">第 1~4 天：类型 3 在窗口里最多出现 2 次，全部保留。</text>
  <text x="58" y="322" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">第 5 天：窗口 [第 3,4,5 天] 里已有 2 个类型 3，再留就 3 次 &gt; m，必须丢弃。</text>
  <text x="58" y="344" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">第 6 天：第 2 天的物品滑出窗口，类型 3 的计数降为 1；类型 4 顺利保留。</text>
  <text x="58" y="366" text-anchor="start" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">结论：只有第 5 天的物品被丢弃，ans = 1。</text>
</svg>
