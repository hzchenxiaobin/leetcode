  <rect x="298" y="92" width="64" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="122.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="372" y="92" width="64" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
