<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="680" height="430" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">两种形态：大堆「吃不吃得下」决定答案</text>
  <path d="M 190 40 Q 340 48 490 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 左面板：一家独大 -->
  <g filter="url(#sk)">
    <rect x="18" y="52" width="304" height="298" rx="10" fill="#f6faf6" stroke="#a8c5a8" stroke-width="1.4"/>
  </g>
  <text x="170" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">① 一家独大</text>
  <text x="170" y="96" text-anchor="middle" font-size="11" fill="#555">a + b ≤ c：大堆吃得下全部小石子</text>
  <path d="M 38 278 Q 170 283 302 278" stroke="#999" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="52" y="258" width="34" height="20" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="52" y="238" width="34" height="20" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="112" y="258" width="34" height="20" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="112" y="238" width="34" height="20" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="112" y="218" width="34" height="20" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="242" y="258" width="34" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="242" y="238" width="34" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="242" y="218" width="34" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="242" y="198" width="34" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="242" y="178" width="34" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="242" y="158" width="34" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="242" y="138" width="34" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="69" y="298" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a=2</text>
  <text x="129" y="298" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">b=3</text>
  <text x="259" y="298" text-anchor="middle" font-size="12" fill="#b8862b" font-weight="bold">c=7</text>
  <g filter="url(#sk)">
    <path d="M 86 248 Q 170 205 236 222" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)"/>
    <path d="M 146 228 Q 195 198 236 200" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)"/>
  </g>
  <text x="172" y="190" text-anchor="middle" font-size="10" fill="#b03a3a">每回合各取 1 颗</text>
  <g filter="url(#sk)">
    <rect x="30" y="308" width="280" height="36" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="44" y="324" font-size="12" font-weight="bold" fill="#2b2b2b">得分 = a + b = 5</text>
  <text x="44" y="339" font-size="10.5" fill="#444">c 剩 c−a−b = 2 颗孤石，两小堆清空停止</text>

  <!-- 右面板：势均力敌 -->
  <g filter="url(#sk)">
    <rect x="358" y="52" width="304" height="298" rx="10" fill="#f5f8fc" stroke="#a8bdd8" stroke-width="1.4"/>
  </g>
  <text x="510" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">② 势均力敌</text>
  <text x="510" y="96" text-anchor="middle" font-size="11" fill="#555">a + b &gt; c：谁也吃不下谁</text>
  <path d="M 378 278 Q 510 283 642 278" stroke="#999" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="392" y="258" width="34" height="20" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="392" y="238" width="34" height="20" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="392" y="218" width="34" height="20" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="452" y="258" width="34" height="20" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="452" y="238" width="34" height="20" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="452" y="218" width="34" height="20" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="452" y="198" width="34" height="20" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="572" y="258" width="34" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="572" y="238" width="34" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="572" y="218" width="34" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="572" y="198" width="34" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="572" y="178" width="34" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="409" y="298" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a=3</text>
  <text x="469" y="298" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">b=4</text>
  <text x="589" y="298" text-anchor="middle" font-size="12" fill="#b8862b" font-weight="bold">c=5</text>
  <g filter="url(#sk)">
    <path d="M 428 246 Q 441 236 452 246" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)"/>
    <path d="M 488 228 Q 530 206 566 216" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)"/>
    <path d="M 426 264 Q 500 282 568 262" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#arB)"/>
  </g>
  <text x="510" y="192" text-anchor="middle" font-size="10" fill="#2b6e9e">三堆两两互配，均衡消耗</text>
  <g filter="url(#sk)">
    <rect x="370" y="308" width="280" height="36" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="384" y="324" font-size="12" font-weight="bold" fill="#2b2b2b">得分 = ⌊(3+4+5)/2⌋ = 6</text>
  <text x="384" y="339" font-size="10.5" fill="#444">12 颗石子消耗 12 颗，1 颗都不剩</text>

  <!-- 底部统一公式 -->
  <g filter="url(#sk)">
    <rect x="18" y="362" width="644" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="34" y="384" font-size="13" font-weight="bold" fill="#2b2b2b">统一公式（排序 a ≤ b ≤ c 后）：答案 = min( a + b , ⌊(a+b+c)/2⌋ )</text>
  <text x="34" y="404" font-size="10.5" fill="#555">上界① 每回合恰耗 2 颗 → 得分 ≤ ⌊sum/2⌋ ；上界② 小堆共 a+b 颗、每回合至少吃 1 颗 → 得分 ≤ a+b</text>
</svg>
