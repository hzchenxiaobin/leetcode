<svg xmlns="http://www.w3.org/2000/svg" width="680" height="565" viewBox="0 0 680 565" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="565" fill="#fdfcf7"/>

  <!-- ===== panel 1: example 1 ===== -->
  <text x="340" y="34" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">示例 1（true）：nums = [2,2,3,1,1,0]，k = 3 —— 每列覆盖数恰等于 nums[i]</text>
  <path d="M 150 44 Q 340 50 530 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#sk)"/>

  <text x="120" y="64" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="180" y="64" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="240" y="64" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="300" y="64" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="360" y="64" text-anchor="middle" font-size="11" fill="#888">4</text>
  <text x="420" y="64" text-anchor="middle" font-size="11" fill="#888">5</text>

  <g filter="url(#sk)">
    <rect x="90" y="72" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="150" y="72" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="210" y="72" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="270" y="72" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="330" y="72" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="390" y="72" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="82" y="97" text-anchor="end" font-size="11" fill="#888">nums</text>
  <text x="120" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">2</text>
  <text x="180" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">2</text>
  <text x="240" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="300" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">1</text>
  <text x="360" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">1</text>
  <text x="420" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">0</text>

  <text x="466" y="136" text-anchor="start" font-size="10.5" fill="#999">色条 = 一个 k 长操作</text>
  <text x="466" y="152" text-anchor="start" font-size="10.5" fill="#999">窗口（各位置 −1）</text>

  <text x="82" y="140" text-anchor="end" font-size="10.5" fill="#4a7a3a">A₁ (s=0)</text>
  <g filter="url(#sk)">
    <rect x="90" y="128" width="180" height="20" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="82" y="166" text-anchor="end" font-size="10.5" fill="#4a7a3a">A₂ (s=0)</text>
  <g filter="url(#sk)">
    <rect x="90" y="154" width="180" height="20" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="82" y="192" text-anchor="end" font-size="10.5" fill="#d6a040">B (s=2)</text>
  <g filter="url(#sk)">
    <rect x="210" y="180" width="180" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>

  <g filter="url(#sk)">
    <rect x="90" y="212" width="60" height="30" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="150" y="212" width="60" height="30" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="210" y="212" width="60" height="30" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="270" y="212" width="60" height="30" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="330" y="212" width="60" height="30" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="390" y="212" width="60" height="30" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="82" y="232" text-anchor="end" font-size="11" fill="#888">覆盖数</text>
  <text x="120" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="180" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="240" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="300" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="360" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="420" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">0</text>
  <text x="462" y="226" text-anchor="start" font-size="12" font-weight="bold" fill="#4a7a3a">= nums[i] ✓</text>
  <text x="462" y="244" text-anchor="start" font-size="12" font-weight="bold" fill="#4a7a3a">⇒ true</text>

  <!-- divider -->
  <path d="M 60 284 Q 340 290 620 284" stroke="#dddddd" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- ===== panel 2: example 2 ===== -->
  <text x="340" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">示例 2（false）：nums = [1,3,1,1]，k = 2 —— 列 2 被超减，列 3 补不上</text>

  <text x="120" y="346" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="180" y="346" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="240" y="346" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="300" y="346" text-anchor="middle" font-size="11" fill="#888">3</text>

  <g filter="url(#sk)">
    <rect x="90" y="354" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="150" y="354" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="210" y="354" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="270" y="354" width="60" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="82" y="379" text-anchor="end" font-size="11" fill="#888">nums</text>
  <text x="120" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">1</text>
  <text x="180" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="240" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">1</text>
  <text x="300" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">1</text>

  <text x="82" y="419" text-anchor="end" font-size="10.5" fill="#4a7a3a">A (s=0)</text>
  <g filter="url(#sk)">
    <rect x="90" y="406" width="120" height="20" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="82" y="445" text-anchor="end" font-size="10.5" fill="#d6a040">B (s=1)</text>
  <g filter="url(#sk)">
    <rect x="150" y="432" width="120" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="82" y="471" text-anchor="end" font-size="10.5" fill="#d6a040">C (s=1)</text>
  <g filter="url(#sk)">
    <rect x="150" y="458" width="120" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>

  <g filter="url(#sk)">
    <rect x="90" y="490" width="60" height="30" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="150" y="490" width="60" height="30" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="210" y="490" width="60" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="270" y="490" width="60" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="82" y="510" text-anchor="end" font-size="11" fill="#888">覆盖数</text>
  <text x="120" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">1</text>
  <text x="180" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">3</text>
  <text x="240" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">2</text>
  <text x="300" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0641a">0</text>
  <text x="345" y="502" text-anchor="start" font-size="11" fill="#b03a3a">列 2：覆盖 2 &gt; 1，被超减 → need = −1</text>
  <text x="345" y="520" text-anchor="start" font-size="11" fill="#a0641a">列 3：缺口 1，且 i+k &gt; n 放不下新窗口</text>

  <text x="340" y="552" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">覆盖数列 [1,3,2,0] ≠ 目标 [1,3,1,1] ⇒ false ✗</text>
</svg>
