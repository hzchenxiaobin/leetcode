<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="67"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/></marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1：x 排序后为 [1,1,1,2,3,4]，w = 1</text>

  <g filter="url(#rough2)">
    <rect x="40" y="52" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="116" y="52" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="192" y="52" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="268" y="52" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="344" y="52" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="420" y="52" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="75">1</text><text x="151" y="75">1</text><text x="227" y="75">1</text>
    <text x="303" y="75">2</text><text x="379" y="75">3</text><text x="455" y="75">4</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="75" y="100">i=0</text><text x="151" y="100">i=1</text><text x="227" y="100">i=2</text>
    <text x="303" y="100">i=3</text><text x="379" y="100">i=4</text><text x="455" y="100">i=5</text>
  </g>
  <path d="M 40 116 L 338 116" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="189" y="136" font-size="11" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">矩形 1：左边界 1，右边界 2，吞掉 4 个点</text>
  <path d="M 344 116 L 490 116" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="417" y="136" font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">矩形 2：左边界 3，右边界 4，吞掉 2 个点</text>
  <path d="M 340 110 L 344 116" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="40" y="168" font-size="11.5" fill="#446688" filter="url(#rough2)">指针推进：i=0 时 right = 1 + 1 = 2，跳过 x ≤ 2 的 4 个点，落到 i=4（x=3）</text>
  <text x="40" y="190" font-size="11.5" fill="#446688" filter="url(#rough2)">第二轮：right = 3 + 1 = 4，跳过 3、4，指针到 i=6 结束 ⇒ 共 2 个矩形</text>

  <rect x="40" y="206" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="227" text-anchor="middle" font-size="12" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">答案 2；注意 x=2 已被第一个矩形覆盖，不必新开</text>
  <rect x="40" y="246" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="267" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">边界补充：points = [[2,3],[1,2]]，w = 0 ⇒ 两个点各占一个矩形，答案 2</text>
  <rect x="40" y="286" width="480" height="32" fill="#fff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="307" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">w = 0 时区间退化为单点，判定条件要写成 x ≤ right（含等号）</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">相同 x 的多个点由同一个矩形顺带覆盖，天然合并不重复计数</text>
</svg>
