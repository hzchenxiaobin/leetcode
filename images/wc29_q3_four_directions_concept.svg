<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：四个方向 = 四条互不干扰的 DP 链</text>
  <text x="320" y="48" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">以每个 1 为「末端」往回继承，父状态只落在「本行左侧」与「上一行」</text>

  <!-- 3x3 网格 -->
  <g filter="url(#rough2)">
    <rect x="70" y="108" width="48" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="154" y="108" width="48" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="238" y="108" width="48" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="70" y="188" width="48" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="154" y="188" width="48" height="40" rx="4" fill="#dbe7fb" stroke="#446688" stroke-width="2.4"/>
    <rect x="238" y="188" width="48" height="40" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="70" y="268" width="48" height="40" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="154" y="268" width="48" height="40" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="238" y="268" width="48" height="40" rx="4" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/>
  </g>

  <g filter="url(#rough2)" font-size="14" text-anchor="middle" fill="#555">
    <text x="94" y="134">1</text>
    <text x="178" y="134">1</text>
    <text x="262" y="134">1</text>
    <text x="94" y="214">1</text>
    <text x="178" y="214" font-size="16" fill="#2f4a6b">1</text>
    <text x="262" y="214" font-size="12">·</text>
    <text x="94" y="294" font-size="12">·</text>
    <text x="178" y="294" font-size="12">·</text>
    <text x="262" y="294" font-size="12">·</text>
  </g>

  <!-- 前驱角标 -->
  <g filter="url(#rough2)" font-size="9" text-anchor="middle">
    <circle cx="114" cy="112" r="8" fill="#446688"/><text x="114" y="115" fill="#fff">d</text>
    <circle cx="198" cy="112" r="8" fill="#d6a040"/><text x="198" y="115" fill="#fff">v</text>
    <circle cx="282" cy="112" r="8" fill="#b85450"/><text x="282" y="115" fill="#fff">a</text>
    <circle cx="114" cy="192" r="8" fill="#4a7a3a"/><text x="114" y="195" fill="#fff">h</text>
  </g>

  <!-- 四支箭头 -->
  <g filter="url(#rough2)">
    <path d="M 122 208 L 148 208" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)"/>
    <path d="M 178 152 L 178 182" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arro)"/>
    <path d="M 112 146 L 150 184" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)"/>
    <path d="M 244 146 L 208 184" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)"/>
  </g>

  <text x="178" y="252" text-anchor="middle" font-size="10" fill="#4a5f80" filter="url(#rough2)">当前格 (i, j)</text>
  <text x="178" y="330" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">灰格与当前状态无关</text>

  <!-- 右侧四条公式 -->
  <g filter="url(#rough2)">
    <rect x="318" y="86" width="292" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="318" y="138" width="292" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="318" y="190" width="292" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="318" y="242" width="292" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="10">
    <text x="332" y="101" fill="#3a5a30">h = 水平（向左继承）</text>
    <text x="332" y="153" fill="#8a6420">v = 垂直（向上继承）</text>
    <text x="332" y="205" fill="#33455e">d = 主对角线（左上继承）</text>
    <text x="332" y="257" fill="#8f3f3c">a = 反对角线（右上继承）</text>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" font-weight="bold">
    <text x="332" y="121">h[i][j] = 1 + h[i][j-1]</text>
    <text x="332" y="173">v[i][j] = 1 + v[i-1][j]</text>
    <text x="332" y="225">d[i][j] = 1 + d[i-1][j-1]</text>
    <text x="332" y="277">a[i][j] = 1 + a[i-1][j+1]</text>
  </g>

  <!-- 底部提示 -->
  <g filter="url(#rough2)">
    <rect x="56" y="340" width="528" height="62" rx="10" fill="#eef2f7" stroke="#8fa3bd" stroke-width="1.4"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#44536b">
    <text x="72" y="362">父状态只落在「本行左侧」与「上一行」，所以行优先、每行从左到右扫一遍即可</text>
    <text x="72" y="384">反对角线的 (i−1, j+1) 属于已处理完的上一行，并不算「用未来值」</text>
  </g>
</svg>
