<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：单趟扫描，条件 argmin</text>

  <!-- 开始 -->
  <rect x="270" y="42" width="100" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="61" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M320,70 L320,86" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="185" y="90" width="270" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="111" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">ans = −1（哨兵：尚无达标箱子）</text>
  <path d="M320,124 L320,140" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环 pill -->
  <rect x="245" y="144" width="150" height="26" rx="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="161" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">i = 0 … n−1</text>
  <path d="M320,170 L320,182" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="320,182 455,216 320,250 185,216" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="211" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">capacity[i] ≥ itemSize</text>
  <text x="320" y="227" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">且 ( ans==−1 或 更小 ) ?</text>

  <!-- 是分支 -->
  <text x="168" y="206" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M185,216 L152,216" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="198" width="132" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="86" y="220" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">ans = i（更新）</text>

  <!-- 否分支 -->
  <text x="472" y="206" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M455,216 L488,216" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="492" y="198" width="126" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="555" y="220" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">跳过（不动）</text>

  <!-- 汇合 -->
  <path d="M86,234 L86,272" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M555,234 L555,272" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M86,272 L555,272" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M320,272 L320,288" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i+1 圆 -->
  <circle cx="320" cy="306" r="16" fill="#fafafa" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="311" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i+1</text>

  <!-- 回边 -->
  <path d="M336,306 L614,306 L614,157 L399,157" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="570" y="298" font-size="10.5" fill="#888" filter="url(#rough2)">下一轮</text>

  <!-- 循环结束 -->
  <text x="333" y="340" font-size="10.5" fill="#888" filter="url(#rough2)">循环结束</text>
  <path d="M320,322 L320,338" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="342" width="160" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="362" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">返回 ans（含 −1）</text>

  <!-- 底部要点 -->
  <rect x="60" y="392" width="520" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="411" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">严格 &lt; ：并列容量时保留最先出现的下标（示例 2 返回 0 而非 3）</text>
  <text x="320" y="430" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">ans == −1 哨兵：无人达标时无需特判，直接返回 −1</text>
</svg>
