<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="940" height="540" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例走查：nums = [1, 5, 0, 3, 5]，答案 3</text>
  <path d="M 280 44 Q 470 52 660 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 行 0：初始 -->
  <text x="66" y="112" text-anchor="end" font-size="12" font-weight="bold" fill="#888">初始</text>
  <g filter="url(#sk)"><rect x="90" y="86" width="64" height="42" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="122" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="168" y="86" width="64" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="200" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">5</text>
  <g filter="url(#sk)"><rect x="246" y="86" width="64" height="42" rx="4" fill="#f0f0ee" stroke="#999" stroke-width="1.4"/></g>
  <text x="278" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#777">0</text>
  <g filter="url(#sk)"><rect x="324" y="86" width="64" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="356" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">3</text>
  <g filter="url(#sk)"><rect x="402" y="86" width="64" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="434" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">5</text>
  <g filter="url(#sk)"><rect x="520" y="82" width="150" height="50" rx="10" fill="#f4f0fa" stroke="#8a6ab5" stroke-width="1.4"/></g>
  <text x="595" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">{1, 3, 5}</text>
  <text x="595" y="122" text-anchor="middle" font-size="10" fill="#888">3 个不同非零值</text>

  <!-- 箭头 1 -->
  <path d="M 260 146 Q 260 168 260 172" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="300" y="164" font-size="12" font-weight="bold" fill="#c98a2b">第①步：x = 1（最小非零值），全体正整数减 1</text>

  <!-- 行 1 -->
  <text x="66" y="212" text-anchor="end" font-size="12" font-weight="bold" fill="#888">操作后</text>
  <g filter="url(#sk)"><rect x="90" y="186" width="64" height="42" rx="4" fill="#f0f0ee" stroke="#4a8edb" stroke-width="1.6" stroke-dasharray="5 3"/></g>
  <text x="122" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">0</text>
  <g filter="url(#sk)"><rect x="168" y="186" width="64" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="200" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">4</text>
  <g filter="url(#sk)"><rect x="246" y="186" width="64" height="42" rx="4" fill="#f0f0ee" stroke="#999" stroke-width="1.4"/></g>
  <text x="278" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#777">0</text>
  <g filter="url(#sk)"><rect x="324" y="186" width="64" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="356" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="402" y="186" width="64" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="434" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">4</text>
  <g filter="url(#sk)"><rect x="520" y="182" width="150" height="50" rx="10" fill="#f4f0fa" stroke="#8a6ab5" stroke-width="1.4"/></g>
  <text x="595" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">{2, 4}</text>
  <text x="595" y="222" text-anchor="middle" font-size="10" fill="#888">值 1 层归零，剩 2 层</text>

  <!-- 箭头 2 -->
  <path d="M 260 246 Q 260 268 260 272" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="300" y="264" font-size="12" font-weight="bold" fill="#c98a2b">第②步：x = 2，全体正整数减 2</text>

  <!-- 行 2 -->
  <text x="66" y="312" text-anchor="end" font-size="12" font-weight="bold" fill="#888">操作后</text>
  <g filter="url(#sk)"><rect x="90" y="286" width="64" height="42" rx="4" fill="#f0f0ee" stroke="#4a8edb" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <text x="122" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#777">0</text>
  <g filter="url(#sk)"><rect x="168" y="286" width="64" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="200" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">2</text>
  <g filter="url(#sk)"><rect x="246" y="286" width="64" height="42" rx="4" fill="#f0f0ee" stroke="#999" stroke-width="1.4"/></g>
  <text x="278" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#777">0</text>
  <g filter="url(#sk)"><rect x="324" y="286" width="64" height="42" rx="4" fill="#f0f0ee" stroke="#4a8e4a" stroke-width="1.6" stroke-dasharray="5 3"/></g>
  <text x="356" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">0</text>
  <g filter="url(#sk)"><rect x="402" y="286" width="64" height="42" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="434" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">2</text>
  <g filter="url(#sk)"><rect x="520" y="282" width="150" height="50" rx="10" fill="#f4f0fa" stroke="#8a6ab5" stroke-width="1.4"/></g>
  <text x="595" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3a7a">{2}</text>
  <text x="595" y="322" text-anchor="middle" font-size="10" fill="#888">原值 3 层归零，剩 1 层</text>

  <!-- 箭头 3 -->
  <path d="M 260 346 Q 260 368 260 372" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="300" y="364" font-size="12" font-weight="bold" fill="#c98a2b">第③步：x = 2，全体正整数减 2</text>

  <!-- 行 3 -->
  <text x="66" y="412" text-anchor="end" font-size="12" font-weight="bold" fill="#2e6e2e">完成 ✓</text>
  <g filter="url(#sk)"><rect x="90" y="386" width="64" height="42" rx="4" fill="#f0f0ee" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="122" y="413" text-anchor="middle" font-size="14" font-weight="bold" fill="#777">0</text>
  <g filter="url(#sk)"><rect x="168" y="386" width="64" height="42" rx="4" fill="#f0f0ee" stroke="#c98a2b" stroke-width="1.6" stroke-dasharray="5 3"/></g>
  <text x="200" y="413" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">0</text>
  <g filter="url(#sk)"><rect x="246" y="386" width="64" height="42" rx="4" fill="#f0f0ee" stroke="#999" stroke-width="1.2"/></g>
  <text x="278" y="413" text-anchor="middle" font-size="14" font-weight="bold" fill="#777">0</text>
  <g filter="url(#sk)"><rect x="324" y="386" width="64" height="42" rx="4" fill="#f0f0ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="356" y="413" text-anchor="middle" font-size="14" font-weight="bold" fill="#777">0</text>
  <g filter="url(#sk)"><rect x="402" y="386" width="64" height="42" rx="4" fill="#f0f0ee" stroke="#c98a2b" stroke-width="1.6" stroke-dasharray="5 3"/></g>
  <text x="434" y="413" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">0</text>
  <g filter="url(#sk)"><rect x="520" y="382" width="150" height="50" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="595" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">{ } 全零</text>
  <text x="595" y="422" text-anchor="middle" font-size="10" fill="#888">原值 5 层归零</text>

  <!-- 图例与结论 -->
  <text x="90" y="458" font-size="11" fill="#2b6e9e">■ 蓝 = 值 1 层</text>
  <text x="200" y="458" font-size="11" fill="#7a5415">■ 橙 = 值 5 层</text>
  <text x="310" y="458" font-size="11" fill="#2e6e2e">■ 绿 = 值 3 层</text>
  <text x="420" y="458" font-size="11" fill="#888">虚线框 = 该层刚被归零</text>
  <g filter="url(#sk)"><rect x="70" y="474" width="800" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="470" y="494" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">颜色不变 = 层的轨迹：每层被逐步削低，恰好在一步内归零</text>
  <text x="470" y="510" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">3 个不同非零值 ⇒ 3 步 ⇒ 答案 = len({1, 3, 5}) = 3</text>
</svg>
