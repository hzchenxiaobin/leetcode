<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：拼接 → 长度 → 排序比对</text>

  <rect x="130" y="48" width="260" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">t = str(n) + str(2n) + str(3n)</text>
  <path d="M260 84 L260 102" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <polygon points="260,104 356,140 260,176 164,140" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">len(t) == 9 ？</text>
  <text x="260" y="166" text-anchor="middle" font-size="10.5" fill="#a08030" filter="url(#rough2)">（3n 可能是四位数，拼出 10~11 位）</text>

  <path d="M164 140 L92 140 L92 182" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="126" y="132" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="22" y="184" width="140" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="207" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">位数都不对 → false</text>

  <path d="M356 140 L428 140 L428 182" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="394" y="132" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="358" y="184" width="140" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="207" text-anchor="middle" font-size="12" fill="#2f5527" filter="url(#rough2)">把 t 的字符排序</text>
  <path d="M428 220 L428 240 L352 254" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <polygon points="260,248 356,282 260,316 164,282" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">排序后 == "123456789" ？</text>
  <g filter="url(#rough2)" font-size="11" fill="#666">
    <text x="372" y="250">一步到位：长度 9 且排序后</text>
    <text x="372" y="266">恰为 1..9 升序，就同时保证</text>
    <text x="372" y="282">“各出现一次”与“无 0”</text>
  </g>
</svg>
