<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="520" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：单趟扫描税级，prev 游标 + break 守卫</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)"><ellipse cx="300" cy="64" rx="44" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="300" y="69" text-anchor="middle" font-size="13" font-weight="bold" fill="#33455e">开始</text>
  <path d="M 300 82 L 300 100" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)"><rect x="200" y="102" width="200" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="300" y="121" text-anchor="middle" font-size="12" fill="#33455e">tax = 0；prev = 0（游标）</text>
  <path d="M 300 132 L 300 150" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判断1：还有税级？ -->
  <g filter="url(#sk)"><polygon points="300,152 396,190 300,228 204,190" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="300" y="186" text-anchor="middle" font-size="12" fill="#2e5e2e">还有税级</text>
  <text x="300" y="202" text-anchor="middle" font-size="12" fill="#2e5e2e">未处理？</text>
  <path d="M 396 190 L 462 190" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="428" y="182" text-anchor="middle" font-size="11.5" fill="#666">否</text>
  <g filter="url(#sk)"><rect x="464" y="174" width="124" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="526" y="194" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e">返回 tax</text>
  <path d="M 300 228 L 300 258" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="246" font-size="11.5" fill="#666">是</text>

  <!-- 判断2：income ≤ prev？ -->
  <g filter="url(#sk)"><polygon points="300,260 400,298 300,336 200,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="300" y="302" text-anchor="middle" font-size="12" fill="#7a5415">income ≤ prev？</text>
  <path d="M 400 298 L 440 298" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="420" y="290" text-anchor="middle" font-size="11.5" fill="#666">是</text>
  <g filter="url(#sk)"><rect x="442" y="282" width="158" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="521" y="302" text-anchor="middle" font-size="11.5" fill="#7a5415">提前返回 tax（守卫）</text>
  <path d="M 300 336 L 300 362" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="312" y="354" font-size="11.5" fill="#666">否</text>

  <!-- 本段应税 -->
  <g filter="url(#sk)"><rect x="160" y="364" width="280" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="300" y="384" text-anchor="middle" font-size="12" fill="#33455e" font-family="monospace">taxable = min(income, upper) − prev</text>
  <path d="M 300 396 L 300 420" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 累加 + 游标右移 -->
  <g filter="url(#sk)"><rect x="160" y="422" width="280" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="300" y="442" text-anchor="middle" font-size="12" fill="#2e5e2e" font-family="monospace">tax += taxable × percent / 100.0</text>
  <text x="300" y="462" text-anchor="middle" font-size="12" fill="#2e5e2e">prev = upper（游标右移）</text>

  <!-- 易错标注 -->
  <g filter="url(#sk)"><rect x="470" y="422" width="154" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="547" y="442" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04a48">易错：/100 是整除</text>
  <text x="547" y="462" text-anchor="middle" font-size="11.5" fill="#a04a48">必须写 /100.0</text>
  <path d="M 440 448 L 466 448" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 回环 -->
  <path d="M 300 474 L 300 500 L 96 500 L 96 190 L 200 190" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="148" y="182" text-anchor="middle" font-size="10.5" fill="#2e5e2e">下一税级</text>
</svg>
