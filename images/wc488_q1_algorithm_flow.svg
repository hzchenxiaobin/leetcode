<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：从右往左一遍扫描，O(n) 时间 / O(1) 空间</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- annotations -->
  <rect x="40" y="98" width="190" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="118" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">一遍扫描搞定</text>
  <text x="135" y="136" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">时间 O(n) · 空间 O(1)</text>

  <rect x="492" y="98" width="136" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="560" y="118" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">n = 1 时</text>
  <text x="560" y="136" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">循环不执行 → 0</text>

  <!-- main chain -->
  <rect x="290" y="50" width="140" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="70" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">开始：读入 nums</text>

  <path d="M360,82 L360,94" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="270" y="98" width="180" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="118" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans = 0，s = 0，i = n − 2</text>

  <path d="M360,130 L360,142" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="360,146 432,182 360,218 288,182" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">i ≥ 0 ?</text>

  <path d="M432,182 L488,182" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="458" y="175" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="492" y="164" width="110" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="547" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">返回 ans</text>

  <path d="M360,218 L360,234" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="231" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="270" y="238" width="180" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="258" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">s += nums[i + 1]（入帐）</text>

  <path d="M360,270 L360,282" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="360,286 452,324 360,362 268,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="321" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">nums[i] × (n−1−i)</text>
  <text x="360" y="337" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">&gt; s ?</text>

  <path d="M452,324 L496,324" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="472" y="317" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="500" y="306" width="104" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="552" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">ans += 1</text>

  <path d="M552,342 L552,396 L440,396" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M360,362 L360,376" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="373" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="292" y="380" width="144" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="364" y="400" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i −−（左移一位）</text>

  <!-- loop back -->
  <path d="M292,396 L110,396 L110,182 L280,182" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="290" text-anchor="middle" font-size="10.5" fill="#666" transform="rotate(-90 100 290)" filter="url(#rough2)">回到 i ≥ 0 ? 判定</text>
</svg>
