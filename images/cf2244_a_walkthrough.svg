<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="430" fill="#fafafa" filter="url(#rough2)"/>

  <text x="320" y="36" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    5 组官方样例的扫描走查
  </text>

  <rect x="50" y="56" width="540" height="276" rx="6" fill="#ffffff" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="50" y="56" width="540" height="42" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="82" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">用例</text>
  <text x="230" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">字符串 s</text>
  <text x="380" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">各段长度</text>
  <text x="472" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">最长 L</text>
  <text x="550" y="83" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">答案</text>

  <rect x="50" y="98" width="540" height="46" fill="#ffffff" stroke="#446688"
        stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="50" y="144" width="540" height="46" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="50" y="190" width="540" height="46" fill="#fce4ec" stroke="#b85450"
        stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="50" y="236" width="540" height="46" fill="#ffffff" stroke="#446688"
        stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="50" y="282" width="540" height="50" fill="#fff8e1" stroke="#d6a040"
        stroke-width="0.8" filter="url(#rough2)"/>

  <text x="82" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">#*##*##</text>
  <text x="380" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1, 2, 2</text>
  <text x="472" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="550" y="126" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">1</text>

  <text x="82" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="230" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">########</text>
  <text x="380" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="472" y="172" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">8</text>
  <text x="550" y="172" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">4</text>

  <text x="82" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="230" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">********</text>
  <text x="380" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">无</text>
  <text x="472" y="218" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="550" y="218" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">0</text>

  <text x="82" y="264" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="230" y="264" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">#******##</text>
  <text x="380" y="264" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1, 2</text>
  <text x="472" y="264" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="550" y="264" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">1</text>

  <text x="82" y="312" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="230" y="312" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">*#####</text>
  <text x="380" y="312" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="472" y="312" text-anchor="middle" font-size="13" fill="#b8860b" filter="url(#rough2)">5</text>
  <text x="550" y="312" text-anchor="middle" font-size="14" fill="#b8860b" filter="url(#rough2)">3</text>

  <text x="320" y="358" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    答案只取决于最长的那一段：ans = max(ceil(L/2)) = ceil(maxL / 2)
  </text>
  <text x="320" y="384" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    第 3 组没有任何线段，maxL = 0，故答案为 0
  </text>
  <text x="320" y="408" text-anchor="middle" font-size="12" fill="#b8860b" filter="url(#rough2)">
    第 5 组 L = 5：5 → 3 → 1 → 消失，共 3 秒 = ceil(5/2)
  </text>
</svg>
