<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="623" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：rectangles = [[1,2],[2,3],[2,5]]</text>
  <path d="M 150 40 Q 330 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left table: equal buckets -->
  <text x="112" y="72" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#sk)">分桶 equal[h]</text>
  <g filter="url(#sk)">
    <rect x="42" y="84" width="140" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="42" y="114" width="140" height="30" rx="5" fill="#fafafa" stroke="#446688" stroke-width="1.4"/>
    <rect x="42" y="144" width="140" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="42" y="174" width="140" height="30" rx="5" fill="#fafafa" stroke="#446688" stroke-width="1.4"/>
    <rect x="42" y="204" width="140" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#333">
    <text x="56" y="104" filter="url(#sk)">h=5</text><text x="90" y="104" font-weight="bold" fill="#446688" filter="url(#sk)">[2]</text>
    <text x="56" y="134" filter="url(#sk)">h=4</text><text x="90" y="134" fill="#999" filter="url(#sk)">∅</text>
    <text x="56" y="164" filter="url(#sk)">h=3</text><text x="90" y="164" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">[2]</text>
    <text x="56" y="194" filter="url(#sk)">h=2</text><text x="90" y="194" font-weight="bold" fill="#446688" filter="url(#sk)">[1]</text>
    <text x="56" y="224" filter="url(#sk)">h=1</text><text x="90" y="224" fill="#999" filter="url(#sk)">∅</text>
  </g>

  <path d="M 192 165 L 242 165" stroke="#555" stroke-width="2" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="217" y="150" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555" filter="url(#sk)">后缀归并</text>
  <text x="217" y="186" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">h: 100→1</text>

  <!-- middle table: merged buckets -->
  <text x="335" y="72" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">合并后 buckets[h]</text>
  <g filter="url(#sk)">
    <rect x="250" y="84" width="170" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="250" y="114" width="170" height="30" rx="5" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="250" y="144" width="170" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="250" y="174" width="170" height="30" rx="5" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="250" y="204" width="170" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <g font-size="12" fill="#333">
    <text x="264" y="104" filter="url(#sk)">h=5</text><text x="298" y="104" font-weight="bold" filter="url(#sk)">[2]</text>
    <text x="264" y="134" filter="url(#sk)">h=4</text><text x="298" y="134" font-weight="bold" filter="url(#sk)">[2]</text>
    <text x="264" y="164" filter="url(#sk)">h=3</text><text x="298" y="164" font-weight="bold" filter="url(#sk)">[2, 2]</text>
    <text x="264" y="194" filter="url(#sk)">h=2</text><text x="298" y="194" font-weight="bold" filter="url(#sk)">[1, 2, 2]</text>
    <text x="264" y="224" filter="url(#sk)">h=1</text><text x="298" y="224" font-weight="bold" filter="url(#sk)">[1, 2, 2]</text>
  </g>
  <text x="335" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#sk)">每格 = { lᵢ : hᵢ ≥ h }，已排序</text>

  <!-- right: queries -->
  <g filter="url(#sk)">
    <rect x="448" y="84" width="194" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="545" y="106" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">查询 P1 = (2, 1)</text>
  <g font-size="11.5" fill="#333">
    <text x="462" y="126" filter="url(#sk)">buckets[1] = [1, 2, 2]</text>
    <text x="462" y="146" filter="url(#sk)">bisect_left(·, 2) = 1 → 3−1 = <tspan font-weight="bold" fill="#b85450">2</tspan></text>
  </g>

  <g filter="url(#sk)">
    <rect x="448" y="166" width="194" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="545" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">查询 P2 = (1, 4)</text>
  <g font-size="11.5" fill="#333">
    <text x="462" y="208" filter="url(#sk)">buckets[4] = [2]</text>
    <text x="462" y="228" filter="url(#sk)">bisect_left(·, 1) = 0 → 1−0 = <tspan font-weight="bold" fill="#b85450">1</tspan></text>
  </g>

  <g filter="url(#sk)">
    <rect x="448" y="248" width="194" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="545" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">count = [2, 1] ✓</text>

  <g filter="url(#sk)">
    <rect x="20" y="316" width="620" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="330" y="340" text-anchor="middle" font-size="12" fill="#8f3a35" filter="url(#sk)">看 h=4 的桶 [2]：只有 (2,5) 的 h=5 ≥ 4 入桶；(2,3) 的 h=3 &lt; 4 不入</text>
  <text x="330" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a35" filter="url(#sk)">这就是「后缀」二字的含义 —— hᵢ ≥ h 的全都收进来，一个不漏</text>
</svg>
