<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">
    从右往左每 3 位一组，点只插在组与组之间
  </text>

  <!-- 9 个数字格子：三组着色 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="18">
    <rect x="67"  y="64" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="109" y="64" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="151" y="64" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="193" y="64" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="235" y="64" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="277" y="64" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="319" y="64" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="361" y="64" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="403" y="64" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="88"  y="91" fill="#8a6a1a">1</text>
    <text x="130" y="91" fill="#8a6a1a">2</text>
    <text x="172" y="91" fill="#8a6a1a">3</text>
    <text x="214" y="91" fill="#2f5a24">4</text>
    <text x="256" y="91" fill="#2f5a24">5</text>
    <text x="298" y="91" fill="#2f5a24">6</text>
    <text x="340" y="91" fill="#446688">7</text>
    <text x="382" y="91" fill="#446688">8</text>
    <text x="424" y="91" fill="#446688">9</text>
  </g>

  <!-- 分组括线 -->
  <g filter="url(#rough2)" fill="none" stroke-width="1.8">
    <path d="M 67 116 C 67 130, 67 130, 90 132 L 130 132 C 153 130, 153 130, 153 116" stroke="#d6a040"/>
    <path d="M 193 116 C 193 130, 193 130, 216 132 L 256 132 C 279 130, 279 130, 279 116" stroke="#4a7a3a"/>
    <path d="M 319 116 C 319 130, 319 130, 342 132 L 382 132 C 405 130, 405 130, 405 116" stroke="#446688"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="12">
    <text x="110" y="152" fill="#8a6a1a">第 1 组（1~3 位）</text>
    <text x="236" y="152" fill="#2f5a24">第 2 组（恰 3 位）</text>
    <text x="362" y="152" fill="#446688">第 3 组（恰 3 位）</text>
  </g>

  <!-- 从右往左的方向箭头 -->
  <path d="M 460 170 C 420 176, 330 176, 292 170" stroke="#b85450" stroke-width="2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="466" y="174" font-size="12" fill="#b85450" filter="url(#rough2)">从右往左数</text>

  <!-- 结果 -->
  <rect x="140" y="196" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="224" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">123<tspan fill="#b85450" font-weight="bold">.</tspan>456<tspan fill="#b85450" font-weight="bold">.</tspan>789</text>

  <!-- 底注 -->
  <rect x="62" y="266" width="396" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    点数 = ⌊(d−1)/3⌋：第 k 个点插在从右数第 3k 位之前
  </text>
  <text x="260" y="314" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">
    987（3 位）→ 0 个点；1234（4 位）→ 1 个点
  </text>
</svg>
