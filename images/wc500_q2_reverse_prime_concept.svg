<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：试除上界 √m 与值域收紧</text>

  <!-- 区块 A：数字反转 -->
  <rect x="150" y="52" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="78" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="196" y="52" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="216" y="78" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>

  <path d="M262,72 C300,58 340,58 378,72" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">数字反转</text>

  <rect x="404" y="52" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="78" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="450" y="52" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="78" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <text x="320" y="118" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">r = 31（前导零自然消去：10 → 1，100 → 1）</text>
  <text x="320" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">区间 = [min(n, r), max(n, r)] = [13, 31]</text>

  <!-- 区块 B：区间质数高亮数轴 -->
  <text x="320" y="165" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">区间逐点判定，质数求和：</text>
  <rect x="54" y="176" width="532" height="34" fill="none"/>
  <!-- 13..31 共 19 格，宽 28，起点 54；质数 13,17,19,23,29,31 -->
  <rect x="54" y="176" width="28" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="68" y="198" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">13</text>
  <rect x="82" y="176" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="96" y="198" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">14</text>
  <rect x="110" y="176" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="124" y="198" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">15</text>
  <rect x="138" y="176" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="152" y="198" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">16</text>
  <rect x="166" y="176" width="28" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="198" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">17</text>
  <rect x="194" y="176" width="28" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="208" y="198" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">19</text>
  <rect x="222" y="176" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="236" y="198" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">20</text>
  <rect x="250" y="176" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="264" y="198" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">21</text>
  <rect x="278" y="176" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="292" y="198" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">22</text>
  <rect x="306" y="176" width="28" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="198" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">23</text>
  <rect x="334" y="176" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="348" y="198" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">24</text>
  <rect x="362" y="176" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="376" y="198" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">25</text>
  <rect x="390" y="176" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="404" y="198" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">26</text>
  <rect x="418" y="176" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="432" y="198" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">27</text>
  <rect x="446" y="176" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="460" y="198" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">28</text>
  <rect x="474" y="176" width="28" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="488" y="198" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">29</text>
  <rect x="502" y="176" width="28" height="34" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="516" y="198" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">30</text>
  <rect x="530" y="176" width="28" height="34" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="544" y="198" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">31</text>
  <text x="155" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">橙 = 质数</text>
  <text x="425" y="228" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">灰 = 合数 / 非质数</text>

  <!-- 区块 C：因子成对 -->
  <rect x="40" y="246" width="560" height="118" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">因子成对出现：以 m = 36 为例</text>
  <!-- 配对：1x36 2x18 3x12 6x6 -->
  <rect x="150" y="282" width="34" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="167" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="205" y="300" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">×</text>
  <rect x="226" y="282" width="34" height="26" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="243" y="300" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">36</text>
  <rect x="300" y="282" width="34" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="317" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="355" y="300" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">×</text>
  <rect x="376" y="282" width="34" height="26" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="393" y="300" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">18</text>
  <rect x="450" y="282" width="34" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="467" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="505" y="300" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">×</text>
  <rect x="526" y="282" width="34" height="26" rx="3" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="543" y="300" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">6</text>
  <text x="112" y="300" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">d</text>
  <text x="586" y="300" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">36/d</text>
  <text x="320" y="338" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">较小因子恒 ≤ √36 = 6 ⇒ 判质数只需试除 d = 2 … ⌊√m⌋</text>
  <text x="320" y="356" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">（m = 25 时 d = 5，5² = 25 恰好触界，上界须取等号）</text>

  <!-- 区块 D：值域收紧 -->
  <rect x="40" y="378" width="560" height="82" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">值域收紧：n ≤ 1000 ⇒ 区间 ⊆ [1, 1000]</text>
  <text x="320" y="424" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">唯一的四位数 1000 反转得 1；其余 n ≤ 999 反转后 r ≤ 999</text>
  <text x="320" y="446" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">⇒ 至多 1000 次判定 × 每次 ≤ ⌊√1000⌋ = 31 次取模，约 3×10⁴ 次运算</text>
</svg>
