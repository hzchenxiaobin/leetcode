<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="560" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：双游标一趟扫描，逢正落偶位、逢负落奇位</text>
  <path d="M 150 40 Q 340 47 530 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left note: order preservation -->
  <g filter="url(#sk)">
    <rect x="16" y="76" width="164" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" stroke-dasharray="6,4"/>
  </g>
  <text x="98" y="99" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">扫描顺序 = 原数组顺序</text>
  <text x="98" y="117" text-anchor="middle" font-size="11" fill="#444">⇒ 同号元素天然保序</text>
  <text x="98" y="132" text-anchor="middle" font-size="10.5" fill="#666">（无需任何额外排序）</text>

  <!-- right note: no bounds check -->
  <g filter="url(#sk)">
    <rect x="492" y="64" width="176" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="6,4"/>
  </g>
  <text x="580" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">无需越界判断：</text>
  <text x="580" y="105" text-anchor="middle" font-size="11" fill="#444">正负等量 ⇒ 收尾时</text>
  <text x="580" y="124" text-anchor="middle" font-size="10.5" fill="#444" font-family="monospace">posIdx = n，negIdx = n+1</text>
  <text x="580" y="138" text-anchor="middle" font-size="10.5" fill="#666">（出界哨兵位，不再访问）</text>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="302" y="54" width="76" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="340" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">开始</text>
  <path d="M 340 86 L 340 100" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="190" y="106" width="300" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="340" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" font-family="monospace">ans ← 长度 n 的结果数组</text>
  <text x="340" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" font-family="monospace">posIdx ← 0，negIdx ← 1，i ← 0</text>
  <path d="M 340 160 L 340 174" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop diamond -->
  <g filter="url(#sk)">
    <polygon points="340,180 448,216 340,252 232,216" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">i &lt; n ?</text>

  <!-- no branch -->
  <text x="460" y="208" font-size="12" font-weight="bold" fill="#a04038">否</text>
  <path d="M 448 216 L 496 216" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="500" y="194" width="136" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="568" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">返回 ans</text>
  <path d="M 568 238 L 568 254" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="530" y="258" width="76" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="568" y="279" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">结束</text>

  <!-- yes branch -->
  <text x="352" y="268" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 340 252 L 340 272" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- read -->
  <g filter="url(#sk)">
    <rect x="245" y="276" width="190" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="340" y="301" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">x ← nums[i]</text>
  <path d="M 340 316 L 340 330" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- sign diamond -->
  <g filter="url(#sk)">
    <polygon points="340,336 430,372 340,408 250,372" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="340" y="377" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">x &gt; 0 ?</text>

  <!-- yes -> left (positive) -->
  <text x="238" y="364" font-size="12" font-weight="bold" fill="#2e6e2e">是</text>
  <path d="M 250 372 L 228 372" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="50" y="348" width="172" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="136" y="369" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">ans[posIdx] ← x</text>
  <text x="136" y="387" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" font-family="monospace">posIdx += 2</text>

  <!-- no -> right (negative) -->
  <text x="434" y="364" font-size="12" font-weight="bold" fill="#a04038">否</text>
  <path d="M 430 372 L 444 372" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="448" y="348" width="182" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="539" y="369" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a20" font-family="monospace">ans[negIdx] ← x</text>
  <text x="539" y="387" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a06a20" font-family="monospace">negIdx += 2</text>

  <!-- both branches down to i+=1 -->
  <g filter="url(#sk)">
    <path d="M 136 398 L 136 452 L 287 452" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
    <path d="M 539 398 L 539 452 L 397 452" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <rect x="293" y="434" width="94" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="340" y="457" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e" font-family="monospace">i += 1</text>

  <!-- loop back -->
  <g filter="url(#sk)">
    <path d="M 340 470 L 340 490 L 30 490 L 30 216 L 224 216" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="22" y="355" text-anchor="middle" font-size="10.5" fill="#666" transform="rotate(-90 22 355)">回到 i &lt; n 判断</text>

  <!-- bottom banner -->
  <g filter="url(#sk)">
    <rect x="60" y="506" width="560" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="531" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">每个元素恰读一次、恰写一次：单趟 O(n) 时间，双游标版无需分组中间数组</text>
</svg>
