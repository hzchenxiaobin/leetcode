<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="680" height="450" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：查询 [l, r, k, v] 走等差跳跃，不是连续区间</text>
  <path d="M 120 42 Q 340 52 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="72" text-anchor="middle" font-size="12" fill="#888">以 n = 10、查询 [1, 8, 3, 4] 为例：idx 从 1 出发，每步 +k = +3，乘 v = 4</text>

  <!-- jump arcs above cells -->
  <g filter="url(#sk)">
    <path d="M 160 146 Q 238 96 316 146" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 316 146 Q 394 96 472 146" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
    <path d="M 472 146 Q 545 104 598 134" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,4" marker-end="url(#arRed)"/>
  </g>
  <text x="238" y="110" text-anchor="middle" font-size="11" fill="#2b6e9e">+k</text>
  <text x="394" y="110" text-anchor="middle" font-size="11" fill="#2b6e9e">+k</text>
  <text x="585" y="122" text-anchor="middle" font-size="10.5" fill="#b85450">idx=10 &gt; r=8</text>

  <!-- cells: touched 1,4,7 orange; in-range skipped gray; out-of-range white -->
  <g filter="url(#sk)">
    <rect x="84"  y="150" width="48" height="46" rx="4" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
    <rect x="136" y="150" width="48" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="188" y="150" width="48" height="46" rx="4" fill="#f2f2f2" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="240" y="150" width="48" height="46" rx="4" fill="#f2f2f2" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="292" y="150" width="48" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="344" y="150" width="48" height="46" rx="4" fill="#f2f2f2" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="396" y="150" width="48" height="46" rx="4" fill="#f2f2f2" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="448" y="150" width="48" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="500" y="150" width="48" height="46" rx="4" fill="#f2f2f2" stroke="#c5c5c5" stroke-width="1.2"/>
    <rect x="552" y="150" width="48" height="46" rx="4" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  </g>
  <!-- values -->
  <text x="108" y="178" text-anchor="middle" font-size="13" fill="#bbbbbb" font-family="monospace">5</text>
  <text x="160" y="178" text-anchor="middle" font-size="13" fill="#a06a10" font-weight="bold" font-family="monospace">8</text>
  <text x="212" y="178" text-anchor="middle" font-size="13" fill="#999999" font-family="monospace">7</text>
  <text x="264" y="178" text-anchor="middle" font-size="13" fill="#999999" font-family="monospace">1</text>
  <text x="316" y="178" text-anchor="middle" font-size="13" fill="#a06a10" font-weight="bold" font-family="monospace">12</text>
  <text x="368" y="178" text-anchor="middle" font-size="13" fill="#999999" font-family="monospace">8</text>
  <text x="420" y="178" text-anchor="middle" font-size="13" fill="#999999" font-family="monospace">6</text>
  <text x="472" y="178" text-anchor="middle" font-size="13" fill="#a06a10" font-weight="bold" font-family="monospace">16</text>
  <text x="524" y="178" text-anchor="middle" font-size="13" fill="#999999" font-family="monospace">9</text>
  <text x="576" y="178" text-anchor="middle" font-size="13" fill="#bbbbbb" font-family="monospace">2</text>
  <text x="160" y="192" text-anchor="middle" font-size="9.5" fill="#999999" font-family="monospace">2×4</text>
  <text x="316" y="192" text-anchor="middle" font-size="9.5" fill="#999999" font-family="monospace">3×4</text>
  <text x="472" y="192" text-anchor="middle" font-size="9.5" fill="#999999" font-family="monospace">4×4</text>

  <!-- index labels -->
  <text x="108" y="214" text-anchor="middle" font-size="11" fill="#888888" font-family="monospace">0</text>
  <text x="160" y="214" text-anchor="middle" font-size="11" fill="#a06a10" font-weight="bold" font-family="monospace">1</text>
  <text x="212" y="214" text-anchor="middle" font-size="11" fill="#888888" font-family="monospace">2</text>
  <text x="264" y="214" text-anchor="middle" font-size="11" fill="#888888" font-family="monospace">3</text>
  <text x="316" y="214" text-anchor="middle" font-size="11" fill="#a06a10" font-weight="bold" font-family="monospace">4</text>
  <text x="368" y="214" text-anchor="middle" font-size="11" fill="#888888" font-family="monospace">5</text>
  <text x="420" y="214" text-anchor="middle" font-size="11" fill="#888888" font-family="monospace">6</text>
  <text x="472" y="214" text-anchor="middle" font-size="11" fill="#a06a10" font-weight="bold" font-family="monospace">7</text>
  <text x="524" y="214" text-anchor="middle" font-size="11" fill="#888888" font-family="monospace">8</text>
  <text x="576" y="214" text-anchor="middle" font-size="11" fill="#888888" font-family="monospace">9</text>

  <!-- range bracket -->
  <g filter="url(#sk)">
    <path d="M 134 228 L 134 221 M 134 228 L 550 228 M 550 228 L 550 221" stroke="#446688" stroke-width="1.6" fill="none"/>
  </g>
  <text x="342" y="250" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">[l, r] = [1, 8]，但只摸 {1, 4, 7}</text>
  <text x="342" y="274" text-anchor="middle" font-size="11.5" fill="#b85450">区间里的下标 2、3、5、6、8 全被步长 k 跳过 —— 别想成整段相乘！</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="60" y="292" width="560" height="100" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="340" y="322" text-anchor="middle" font-size="13" fill="#2b2b2b">被摸到的下标：l, l+k, l+2k, …（只要 ≤ r）</text>
  <text x="340" y="348" text-anchor="middle" font-size="13" fill="#2b2b2b">每摸一次：nums[idx] ← (nums[idx] × v) mod (10⁹ + 7)</text>
  <text x="340" y="374" text-anchor="middle" font-size="13" fill="#2b2b2b">单查询操作数 = ⌊(r−l)/k⌋ + 1 ≤ ⌈n/k⌉ ≤ n</text>

  <text x="340" y="424" text-anchor="middle" font-size="13.5" fill="#2e6e2e" font-weight="bold">最坏总量 ≤ q·n = 10³ × 10³ = 10⁶ 次乘法取模 —— 直接模拟就是正解</text>
</svg>
