<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：算缺口 → 升序排序 → 贪心扣减，补不起即停</text>
  <path d="M 110 38 Q 320 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① 算缺口 -->
  <g filter="url(#sk)"><rect x="150" y="52" width="340" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="320" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#33455e">① 算缺口 need[i] = capacity[i] − rocks[i]</text>
  <text x="138" y="79" text-anchor="end" font-size="10.5" fill="#888">O(n)</text>

  <path d="M 320 96 V 114" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ② 排序 -->
  <g filter="url(#sk)"><rect x="150" y="120" width="340" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="320" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#33455e">② 缺口升序排序（缺口 0 自动沉底）</text>
  <text x="138" y="140" text-anchor="end" font-size="10.5" fill="#888">O(n log n)</text>
  <text x="138" y="155" text-anchor="end" font-size="10.5" fill="#888">瓶颈</text>

  <path d="M 320 164 V 182" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ③ 判断菱形 -->
  <g filter="url(#sk)"><polygon points="320,190 460,240 320,290 180,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="320" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">剩余预算</text>
  <text x="320" y="254" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">≥ need[i] ?</text>

  <!-- 是 → 扣减计数 -->
  <path d="M 320 290 V 306" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="334" y="303" font-size="11.5" font-weight="bold" fill="#2e5e2e">是</text>
  <g filter="url(#sk)"><rect x="190" y="310" width="260" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="329" text-anchor="middle" font-size="12" font-family="monospace" fill="#2e5e2e">预算 −= need[i]；ans += 1</text>
  <text x="320" y="347" text-anchor="middle" font-size="11" fill="#2e5e2e">买满这个背包</text>

  <!-- 回到判断 -->
  <path d="M 190 333 H 140 V 240 H 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="165" y="324" text-anchor="middle" font-size="10" fill="#2e5e2e">i += 1</text>

  <!-- 否 → 返回 -->
  <path d="M 460 240 H 492" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="476" y="231" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a04040">否</text>
  <g filter="url(#sk)"><rect x="498" y="216" width="110" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="553" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#a04040">④ 返回 ans</text>
  <text x="553" y="284" text-anchor="middle" font-size="10" fill="#a04040">后面缺口更大</text>
  <text x="553" y="298" text-anchor="middle" font-size="10" fill="#a04040">必也补不起</text>

  <!-- 底部备注 -->
  <g filter="url(#sk)"><rect x="36" y="372" width="568" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="320" y="393" text-anchor="middle" font-size="11.5" fill="#7a5415">缺口 0 的背包排序后天然排在最前，花费 0 白嫖 —— 无需单独统计已满数</text>
  <text x="320" y="412" text-anchor="middle" font-size="11.5" fill="#7a5415">预算不必用完（示例 2 剩 90）；补不起即 break，是升序带来的提前终止</text>
</svg>
