<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">双状态转移：五条合法去向</text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#888">每次覆盖「最左未覆盖格」，瓷砖形状唯一决定下一状态</text>

  <g filter="url(#rough2)">
    <rect x="48" y="68" width="96" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <rect x="48" y="112" width="96" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <rect x="48" y="156" width="96" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <rect x="48" y="200" width="96" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="48" y="244" width="96" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>

    <rect x="348" y="68" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <rect x="348" y="112" width="140" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <rect x="348" y="156" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="348" y="200" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <rect x="348" y="244" width="140" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle" font-weight="bold">
    <text x="96" y="89" fill="#3a4a66">A(k)</text>
    <text x="96" y="133" fill="#3a4a66">A(k)</text>
    <text x="96" y="177" fill="#3a4a66">A(k)</text>
    <text x="96" y="221" fill="#3a5a30">H(k)</text>
    <text x="96" y="265" fill="#3a5a30">H(k)</text>
    <text x="418" y="89" fill="#3a4a66">A(k+1)</text>
    <text x="418" y="133" fill="#8a6a20">A(k+2)</text>
    <text x="418" y="177" fill="#3a5a30">H(k+1)</text>
    <text x="418" y="221" fill="#3a5a30">H(k+1)</text>
    <text x="418" y="265" fill="#8a6a20">A(k+2)</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#8a6a20">
    <text x="250" y="88">竖放 1 竖砖</text>
    <text x="250" y="132">横放 2 块</text>
    <text x="250" y="176">L 形，上下两种</text>
    <text x="250" y="220">横放 1 块</text>
    <text x="250" y="264">L 形，收尾</text>
  </g>

  <g stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M 150 84 L 192 84" marker-end="url(#arr)"/>
    <path d="M 308 84 L 342 84" marker-end="url(#arr)"/>
    <path d="M 150 128 L 192 128" marker-end="url(#arr)"/>
    <path d="M 308 128 L 342 128" marker-end="url(#arr)"/>
    <path d="M 150 172 L 192 172" marker-end="url(#arr)"/>
    <path d="M 308 172 L 342 172" marker-end="url(#arr)"/>
    <path d="M 150 216 L 192 216" marker-end="url(#arr)"/>
    <path d="M 308 216 L 342 216" marker-end="url(#arr)"/>
    <path d="M 150 260 L 192 260" marker-end="url(#arr)"/>
    <path d="M 308 260 L 342 260" marker-end="url(#arr)"/>
  </g>

  <rect x="48" y="292" width="470" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="62" y="316" font-size="11.5" fill="#555">A(k) = A(k−1) + A(k−2) + 2H(k−2)</text>
  <text x="62" y="338" font-size="11.5" fill="#555">H(k) = A(k−1) + H(k−1) = A(0) + A(1) + … + A(k−1)</text>
  <text x="62" y="362" font-size="11" fill="#8a6a20" font-weight="bold">消去 H ⇒ A(n) = 2A(n−1) + A(n−3)，滚三个变量即 O(1) 空间</text>
</svg>
