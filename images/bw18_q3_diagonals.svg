<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">同一对角线满足 i−j 相同</text>
  <rect x="90" y="56" width="49" height="49" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114.5" y="85.4" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="144" y="56" width="49" height="49" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168.5" y="85.4" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="198" y="56" width="49" height="49" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222.5" y="85.4" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="252" y="56" width="49" height="49" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276.5" y="85.4" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="90" y="110" width="49" height="49" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114.5" y="139.4" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="144" y="110" width="49" height="49" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168.5" y="139.4" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="198" y="110" width="49" height="49" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222.5" y="139.4" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="252" y="110" width="49" height="49" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276.5" y="139.4" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="90" y="164" width="49" height="49" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114.5" y="193.4" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="144" y="164" width="49" height="49" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168.5" y="193.4" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="198" y="164" width="49" height="49" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222.5" y="193.4" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="252" y="164" width="49" height="49" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276.5" y="193.4" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="76" y="80" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">i−j=0</text>
  <text x="260" y="204" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">i−j=−3</text>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">颜色相同 ⇒ 同一条对角线（沿右下方向延伸）</text>
  <rect x="60" y="262" width="400" height="106" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="280" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">分组与回填</text>
  <text x="72" y="296" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">分组：key = i − j，把 mat[i][j] 收集到该组；</text>
  <text x="72" y="311" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">组内升序排序；再按同样的遍历顺序（行优先）写回。</text>
  <text x="72" y="326" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">因为 i−j 相同的格子按行优先出现时，正好沿对角线自左上到右下。</text>
</svg>
