<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="99"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">分组模型：每次「集齐 1..k」切一组，组数 g → 答案 g+1</text>

  <!-- rolls 序列与分组 -->
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <rect x="72"  y="66" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="120" y="66" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="168" y="66" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="216" y="66" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="264" y="66" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="312" y="66" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="360" y="66" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="408" y="66" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="456" y="66" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="96"  y="91">4</text><text x="144" y="91">2</text><text x="192" y="91">1</text>
    <text x="240" y="91">2</text><text x="288" y="91">3</text>
    <text x="336" y="91">3</text><text x="384" y="91">2</text><text x="432" y="91">4</text><text x="480" y="91">1</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 70 116 L 314 116" stroke="#446688" stroke-width="2" fill="none"/>
    <path d="M 70 116 L 70 130" stroke="#446688" stroke-width="2" fill="none"/>
    <path d="M 314 116 L 314 130" stroke="#446688" stroke-width="2" fill="none"/>
    <path d="M 310 118 L 330 118" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <path d="M 310 116 L 310 130" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <path d="M 506 116 L 506 130" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <path d="M 330 116 L 506 116" stroke="#4a7a3a" stroke-width="2" fill="none"/>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="192" y="148">第 1 组：出现 4,2,1,2,3 → 集齐 {1,2,3,4}</text>
    <text x="418" y="168">第 2 组：出现 3,2,4,1 → 集齐 {1,2,3,4}</text>
  </g>

  <!-- 组的意义 -->
  <g filter="url(#rough2)">
    <rect x="60" y="192" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <text x="280" y="216" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">第 i 组包含全部 k 种面值 ⇒ 任意目标序列的第 i 个元素</text>
  <text x="280" y="238" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">都能在第 i 组内找到 ⇒ g 组可拼出全部长度 g 的序列</text>

  <!-- 答案 -->
  <g filter="url(#rough2)">
    <rect x="150" y="272" width="260" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10"/>
  </g>
  <text x="280" y="302" text-anchor="middle" font-size="16" fill="#1a2b45" font-weight="bold" filter="url(#rough2)">答案 = 组数 + 1</text>

  <g filter="url(#rough2)">
    <rect x="60" y="338" width="440" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="358" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">末尾的「残组」缺了某个面 v：长度 g+1 的序列（每组收尾面 + v）必然取不到，</text>
  <text x="280" y="377" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">故 g+1 恰是最短不可得长度（构造与证明见正文 §5）。</text>
</svg>
