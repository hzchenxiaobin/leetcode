<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="940" height="600" fill="#fafafa"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：nums = [1, 32, 1, 2]，target = 12 = 1100₂</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- initial ledger -->
  <text x="470" y="76" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">初始账本：cnt[0] = 2（两个 1），cnt[1] = 1（一个 2），cnt[5] = 1（一个 32）</text>

  <!-- table header -->
  <g font-size="11.5" font-weight="bold">
    <text x="70" y="110" fill="#555">位 b</text>
    <g filter="url(#sk)"><rect x="100" y="90" width="72" height="30" fill="#f0ede4" stroke="#ccc" stroke-width="1.2" rx="4"/></g>
    <text x="136" y="110" text-anchor="middle" fill="#555">target 位</text>
    <g filter="url(#sk)"><rect x="182" y="90" width="96" height="30" fill="#f0ede4" stroke="#ccc" stroke-width="1.2" rx="4"/></g>
    <text x="230" y="110" text-anchor="middle" fill="#555">cnt[b]（决策前）</text>
    <g filter="url(#sk)"><rect x="288" y="90" width="200" height="30" fill="#f0ede4" stroke="#ccc" stroke-width="1.2" rx="4"/></g>
    <text x="388" y="110" text-anchor="middle" fill="#555">动作</text>
    <g filter="url(#sk)"><rect x="498" y="90" width="72" height="30" fill="#f0ede4" stroke="#ccc" stroke-width="1.2" rx="4"/></g>
    <text x="534" y="110" text-anchor="middle" fill="#555">代价</text>
    <g filter="url(#sk)"><rect x="580" y="90" width="290" height="30" fill="#f0ede4" stroke="#ccc" stroke-width="1.2" rx="4"/></g>
    <text x="725" y="110" text-anchor="middle" fill="#555">配对进位（账本变动）</text>
  </g>

  <!-- row b=0 -->
  <g font-size="12">
    <text x="70" y="152" font-weight="bold" fill="#2b4a6e">b = 0</text>
    <g filter="url(#sk)"><rect x="100" y="130" width="72" height="30" fill="#f8f8f8" stroke="#ccc" stroke-width="1.2" rx="4"/></g>
    <text x="136" y="150" text-anchor="middle" fill="#888">0</text>
    <g filter="url(#sk)"><rect x="182" y="130" width="96" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4"/></g>
    <text x="230" y="150" text-anchor="middle" fill="#444">2</text>
    <g filter="url(#sk)"><rect x="288" y="130" width="200" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4"/></g>
    <text x="388" y="150" text-anchor="middle" fill="#888">无需求，不动用</text>
    <g filter="url(#sk)"><rect x="498" y="130" width="72" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4"/></g>
    <text x="534" y="150" text-anchor="middle" fill="#888">0</text>
    <g filter="url(#sk)"><rect x="580" y="130" width="290" height="30" fill="#f3ecf7" stroke="#c8a8e8" stroke-width="1.2" rx="4"/></g>
    <text x="725" y="150" text-anchor="middle" fill="#5a3a7a">2 个 1 → 1 片「虚拟 2」入层1</text>
  </g>

  <!-- row b=1 -->
  <g font-size="12">
    <text x="70" y="190" font-weight="bold" fill="#2b4a6e">b = 1</text>
    <g filter="url(#sk)"><rect x="100" y="168" width="72" height="30" fill="#f8f8f8" stroke="#ccc" stroke-width="1.2" rx="4"/></g>
    <text x="136" y="188" text-anchor="middle" fill="#888">0</text>
    <g filter="url(#sk)"><rect x="182" y="168" width="96" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4"/></g>
    <text x="230" y="188" text-anchor="middle" fill="#444">2（1 真+1 虚）</text>
    <g filter="url(#sk)"><rect x="288" y="168" width="200" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4"/></g>
    <text x="388" y="188" text-anchor="middle" fill="#888">无需求，不动用</text>
    <g filter="url(#sk)"><rect x="498" y="168" width="72" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4"/></g>
    <text x="534" y="188" text-anchor="middle" fill="#888">0</text>
    <g filter="url(#sk)"><rect x="580" y="168" width="290" height="30" fill="#f3ecf7" stroke="#c8a8e8" stroke-width="1.2" rx="4"/></g>
    <text x="725" y="188" text-anchor="middle" fill="#5a3a7a">虚拟2 + 真实2 → 「虚拟 4」入层2</text>
  </g>

  <!-- row b=2 -->
  <g font-size="12">
    <text x="70" y="228" font-weight="bold" fill="#2b6e2e">b = 2</text>
    <g filter="url(#sk)"><rect x="100" y="206" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/></g>
    <text x="136" y="226" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="182" y="206" width="96" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4"/></g>
    <text x="230" y="226" text-anchor="middle" fill="#444">1（虚拟 4）</text>
    <g filter="url(#sk)"><rect x="288" y="206" width="200" height="30" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8" rx="4"/></g>
    <text x="388" y="226" text-anchor="middle" fill="#2e6e2e" font-weight="bold">白嫖虚拟 4（= 1+1+2）</text>
    <g filter="url(#sk)"><rect x="498" y="206" width="72" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4"/></g>
    <text x="534" y="226" text-anchor="middle" fill="#2e6e2e" font-weight="bold">0</text>
    <g filter="url(#sk)"><rect x="580" y="206" width="290" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4"/></g>
    <text x="725" y="226" text-anchor="middle" fill="#888">层2 清零，无剩余</text>
  </g>

  <!-- row b=3 -->
  <g font-size="12">
    <text x="70" y="266" font-weight="bold" fill="#b85450">b = 3</text>
    <g filter="url(#sk)"><rect x="100" y="244" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/></g>
    <text x="136" y="264" text-anchor="middle" fill="#2e6e2e" font-weight="bold">1</text>
    <g filter="url(#sk)"><rect x="182" y="244" width="96" height="30" fill="#fce4ec" stroke="#e0a0a0" stroke-width="1.6" rx="4"/></g>
    <text x="230" y="264" text-anchor="middle" fill="#b03a3a" font-weight="bold">0（必须借！）</text>
    <g filter="url(#sk)"><rect x="288" y="244" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/></g>
    <text x="388" y="264" text-anchor="middle" fill="#2b4a6e" font-weight="bold">向层5 借：链拆 32 → 8</text>
    <g filter="url(#sk)"><rect x="498" y="244" width="72" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/></g>
    <text x="534" y="264" text-anchor="middle" fill="#b03a3a" font-weight="bold">+2</text>
    <g filter="url(#sk)"><rect x="580" y="244" width="290" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/></g>
    <text x="725" y="264" text-anchor="middle" fill="#8a6a1a">副产物 16、8 各一片入账，8 被拿走</text>
  </g>

  <!-- annotate the 16 leftover -->
  <path d="M 870 259 Q 893 280 884 302" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="886" y="322" font-size="10" fill="#b85450" text-anchor="end">剩 16 一片</text>
  <text x="886" y="336" font-size="10" fill="#b85450" text-anchor="end">（高位无需求，浪费）</text>

  <!-- summary -->
  <g filter="url(#sk)">
    <rect x="60" y="360" width="820" height="86" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="470" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">总代价 = 0 + 0 + 0 + 2 = 2 ✓（与官方解释一致：拆 32 → 16+16，再拆 16 → 8+8）</text>
  <text x="470" y="414" text-anchor="middle" font-size="12.5" fill="#444" font-family="monospace">最终子序列：{1, 1, 2, 8}，和 = 12 ✓（两个 1 与一个 2 顶替了 4 的槽位）</text>
  <text x="470" y="436" text-anchor="middle" font-size="11" fill="#666">对照：若不利用「免费配对」，位2 也得借位（32 → 4 需 3 次），总代价 3——配对进位白省 1 次</text>

  <!-- verification strip for examples 1 and 3 -->
  <g filter="url(#sk)">
    <rect x="60" y="470" width="400" height="106" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="260" y="496" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">示例 1 复核：nums = [1,2,8]，target = 7 = 111₂</text>
  <text x="260" y="520" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">位0、位1 白嫖现成的 1 与 2</text>
  <text x="260" y="540" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">位2 向层3 借：8 → 4，代价 1 → 答案 1 ✓</text>
  <text x="260" y="562" text-anchor="middle" font-size="10.5" fill="#666">子序列 {1, 2, 4}</text>

  <g filter="url(#sk)">
    <rect x="480" y="470" width="400" height="106" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="680" y="496" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">示例 3 复核：nums = [1,32,1]，target = 35</text>
  <text x="680" y="520" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">Σnums = 34 &lt; 35 → 直接返回 −1 ✓</text>
  <text x="680" y="540" text-anchor="middle" font-size="11.5" fill="#444" font-family="monospace">（拆分永不改变总和，子序列和 ≤ 总和）</text>
  <text x="680" y="562" text-anchor="middle" font-size="10.5" fill="#666">可行性判据一步到位</text>
</svg>
