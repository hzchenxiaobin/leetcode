<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">n = 5, limit = 2 时的四个容斥项</text>

  <!-- 项1：C(7,2)=21 -->
  <rect x="30" y="58" width="240" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="82" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">① 无上界总方案</text>
  <text x="150" y="104" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">C(5+2, 2) = C(7,2)</text>
  <text x="150" y="126" text-anchor="middle" font-size="15" fill="#2d5a1f" filter="url(#rough2)">= 21</text>

  <!-- 项2：3*C(4,2)=18 -->
  <rect x="290" y="58" width="240" height="92" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="82" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">② 单人超限 ×3</text>
  <text x="410" y="104" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">3 × C(5−2+1, 2) = 3·C(4,2)</text>
  <text x="410" y="126" text-anchor="middle" font-size="15" fill="#8f2f2a" filter="url(#rough2)">= 18</text>

  <!-- 项3：3*C(1,2)=0 -->
  <rect x="30" y="172" width="240" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="196" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">③ 双人超限 ×3（不够发→0）</text>
  <text x="150" y="218" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">3 × C(5−2·2, 2) = 3·C(1,2)</text>
  <text x="150" y="240" text-anchor="middle" font-size="15" fill="#33506e" filter="url(#rough2)">= 0（v&lt;2 截断）</text>

  <!-- 项4 -->
  <rect x="290" y="172" width="240" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="196" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">④ 三人超限（不可能→0）</text>
  <text x="410" y="218" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">C(5−3·2−1, 2) = C(−2,2)</text>
  <text x="410" y="240" text-anchor="middle" font-size="15" fill="#33506e" filter="url(#rough2)">= 0</text>

  <!-- 结果 -->
  <rect x="140" y="282" width="280" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="16" fill="#8a6d3b" filter="url(#rough2)">21 − 18 + 0 − 0 = 3 ✓</text>
</svg>
