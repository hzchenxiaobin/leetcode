<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：一次异或，三种数 1 的方式</text>
  <text x="280" y="48" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">三种写法答案完全相同，区别只在循环次数与代码长度</text>

  <rect x="195" y="62" width="170" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="88" font-size="12" fill="#3a4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n = x ^ y</text>

  <path d="M 280 104 L 280 118" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 118 L 102 134" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 118 L 280 134" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 118 L 458 134" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="24" y="134" width="156" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="102" y="155" font-size="10.5" fill="#3a4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">① 移位法</text>
  <text x="102" y="173" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">while n:</text>
  <text x="102" y="188" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">cnt += n &amp; 1</text>
  <text x="102" y="203" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">n &gt;&gt;= 1  → 最多 32 轮</text>

  <rect x="202" y="134" width="156" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="155" font-size="10.5" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">② Kernighan</text>
  <text x="280" y="173" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">while n:</text>
  <text x="280" y="188" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">n &amp;= n - 1; cnt += 1</text>
  <text x="280" y="203" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">轮数 = popcount</text>

  <rect x="380" y="134" width="156" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="458" y="155" font-size="10.5" fill="#8a6a10" text-anchor="middle" font-weight="bold" filter="url(#rough2)">③ 内置函数</text>
  <text x="458" y="175" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">__builtin_popcount(n)</text>
  <text x="458" y="192" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">bin(n).count('1')</text>
  <text x="458" y="207" font-size="9.5" fill="#555" text-anchor="middle" filter="url(#rough2)">一条指令 / 一次扫描</text>

  <path d="M 102 212 L 102 236 L 222 252" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 280 212 L 280 252" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 458 212 L 458 236 L 338 252" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="195" y="252" width="170" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="277" font-size="12" fill="#3a5a30" text-anchor="middle" font-weight="bold" filter="url(#rough2)">返回 cnt</text>

  <rect x="30" y="308" width="500" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="331" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">复杂度：移位法 O(32)，Kernighan O(popcount)，内置为常数指令；空间均为 O(1)</text>
</svg>
