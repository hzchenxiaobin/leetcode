<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="860" height="400" fill="#fafafa"/>
  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：中枢 x 是支点，左段 1..x 与右段 x..n 等和</text>
  <path d="M 240 42 Q 430 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 顶部说明框 -->
  <rect x="60" y="58" width="740" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#rough2)">左和 S_L = 1 + 2 + … + x ，右和 S_R = x + (x+1) + … + n —— 两段都以 x 为端点</text>
  <text x="430" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">重叠端点 x 是消元关键：左和贡献 +x/2，右和移项后带来 −x/2</text>

  <!-- 中枢标记 -->
  <text x="535" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">x = 6（中枢）</text>

  <!-- 数轴格子：1..5 蓝色 -->
  <rect x="155" y="150" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="225" y="150" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="295" y="150" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="365" y="150" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="435" y="150" width="60" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- 中枢格 6 橙色 -->
  <rect x="505" y="150" width="60" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <!-- 7..8 绿色 -->
  <rect x="575" y="150" width="60" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="645" y="150" width="60" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="185" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <text x="255" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="325" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <text x="395" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="465" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="535" y="178" text-anchor="middle" font-size="15" font-weight="bold" fill="#a07830" filter="url(#rough2)">6</text>
  <text x="605" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <text x="675" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>

  <!-- 左段括线（蓝） -->
  <path d="M 155 214 L 535 214" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 155 214 L 155 207 M 535 214 L 535 207" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="345" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">左和 S_L = 1+2+…+6 = 21</text>

  <!-- 右段括线（绿） -->
  <path d="M 505 214 L 705 214" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 505 214 L 505 207 M 705 214 L 705 207" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="605" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">右和 S_R = 6+7+8 = 21</text>

  <!-- 平衡记号 -->
  <text x="475" y="240" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450" filter="url(#rough2)">=</text>
  <text x="475" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">平衡 ✓</text>

  <!-- 公式框 -->
  <rect x="60" y="278" width="740" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">S_L = x(x+1)/2 ，S_R = n(n+1)/2 − x(x−1)/2 ；令 S_L = S_R 并移项相加</text>
  <text x="430" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e28" filter="url(#rough2)">x(x+1)/2 + x(x−1)/2 = x² = n(n+1)/2 ⟹ x = √(n(n+1)/2)</text>

  <!-- 底部提示 -->
  <text x="430" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">判定：t = n(n+1)/2 是完全平方数 ⇔ 存在中枢 x = √t</text>
</svg>
