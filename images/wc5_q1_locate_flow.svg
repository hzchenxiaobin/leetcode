<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：整块跳跃 → 块内定位 → 取位</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">n 始终表示「当前块内第几位」（1-indexed），不是原题下标</text>

  <rect x="170" y="64" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="87" text-anchor="middle" font-size="11" fill="#3a4a66">d = 1，start = 1，cnt = 9</text>

  <path d="M 310 100 L 310 114" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 310 116 L 430 150 L 310 184 L 190 150 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"
        filter="url(#rough2)"/>
  <text x="310" y="155" text-anchor="middle" font-size="11.5" fill="#8a6a20">n &gt; cnt · d ?</text>

  <path d="M 310 184 L 310 212" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="203" font-size="10.5" fill="#b85450">是</text>

  <rect x="170" y="214" width="280" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="238" text-anchor="middle" font-size="10.5" fill="#8a3a36">n −= cnt · d；d += 1</text>
  <text x="310" y="258" text-anchor="middle" font-size="10.5" fill="#8a3a36">cnt *= 10；start *= 10</text>

  <path d="M 170 244 L 120 244 L 120 150 L 186 150" stroke="#b85450" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="106" y="200" text-anchor="end" font-size="10" fill="#b85450">下一块</text>

  <path d="M 430 150 L 500 150 L 500 327 L 476 327" stroke="#446688" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="140" font-size="10.5" fill="#4a7a3a">否</text>

  <rect x="150" y="294" width="326" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="313" y="316" text-anchor="middle" font-size="10.5" fill="#3a5a30">idx = n − 1（块内 0-indexed 偏移）</text>
  <text x="313" y="336" text-anchor="middle" font-size="10.5" fill="#3a5a30">num = start + ⌊idx / d⌋，pos = idx mod d</text>
  <text x="313" y="354" text-anchor="middle" font-size="10" fill="#557a44">（此时 n ≤ cnt·d，num 一定还在本块内）</text>

  <path d="M 313 360 L 313 386" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="388" width="226" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="313" y="410" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">返回 num 的第 pos 位</text>

  <text x="310" y="444" text-anchor="middle" font-size="10" fill="#999">循环不变式：每轮开始时 n 是第 d 块内的 1-indexed 位置，且 1 ≤ n ≤ cnt·d</text>
</svg>
