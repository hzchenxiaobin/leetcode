  <text x="98" y="52" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">L=2</text>
  <line x1="180" y1="60" x2="216" y2="60" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="198.0" y="52" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">L=1</text>
  <line x1="340" y1="60" x2="416" y2="60" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="378" y="52" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">L=2</text>
