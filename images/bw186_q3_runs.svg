  <text x="72" y="244" text-anchor="start" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">示例：每条 A 段的 ceil(L/2) 之和</text>
  <text x="72" y="260" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">K = ceil(2/2) + ceil(1/2) + ceil(2/2) = 1+1+1 = 3</text>
  <text x="72" y="275" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">ones(s1)=4, ones(s2)=1 → Δ = −3</text>
  <text x="72" y="290" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">答案 = 3K + Δ = 9 − 3 = 6</text>
  <text x="260" y="350" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">B 位置（0→1）每个只需一次操作1，已隐含在恒等式里</text>
  <text x="260" y="374" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">总代价 = 3K + (ones(s2) − ones(s1))</text>
