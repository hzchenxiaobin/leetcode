<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一边收缩、一边更新 head / step / rem</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">只有 O(log n) 轮，每轮 O(1)</text>

  <rect x="150" y="54" width="220" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="74" text-anchor="middle" font-size="11" fill="#2a4660" filter="url(#rough2)">head = 1，step = 1，rem = n</text>
  <text x="260" y="92" text-anchor="middle" font-size="11" fill="#2a4660" filter="url(#rough2)">left = true（第一轮从左到右）</text>

  <path d="M 260 102 L 260 126" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,130 390,160 260,190 130,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="165" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">rem &gt; 1 ?</text>

  <path d="M 390 160 L 470 160 L 470 182" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="152" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="400" y="184" width="100" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="450" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5424" filter="url(#rough2)">返回 head</text>
  <text x="450" y="219" text-anchor="middle" font-size="9" fill="#5a8a4a" filter="url(#rough2)">此时只剩一个数</text>

  <path d="M 260 190 L 260 212" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="206" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>

  <polygon points="260,214 390,244 260,274 130,244" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="249" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">left 或 rem 为奇数 ?</text>

  <path d="M 130 244 L 72 244 L 72 298" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="84" y="236" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <text x="76" y="272" font-size="9" fill="#b85450" filter="url(#rough2)">head += step</text>

  <path d="M 390 244 L 448 244 L 448 298" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="236" font-size="10" fill="#446688" filter="url(#rough2)">否</text>
  <text x="386" y="272" font-size="9" fill="#446688" filter="url(#rough2)">head 不动</text>

  <rect x="90" y="300" width="340" height="56" fill="#f0f5ff" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="10" fill="#2a4660" filter="url(#rough2)">rem = ⌊rem / 2⌋，step = 2 × step</text>
  <text x="260" y="334" text-anchor="middle" font-size="10" fill="#2a4660" filter="url(#rough2)">left = not left，回到循环开头</text>
  <text x="260" y="349" text-anchor="middle" font-size="9.5" fill="#5a6a88" filter="url(#rough2)">（先判 head，再改 rem / step，顺序不能反）</text>

  <path d="M 260 356 L 260 380 L 22 380 L 22 160 L 126 160" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="372" font-size="9" fill="#888" filter="url(#rough2)">下一轮</text>
</svg>
