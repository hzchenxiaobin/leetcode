<svg xmlns="http://www.w3.org/2000/svg" width="620" height="430" viewBox="0 0 620 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="620" height="430" fill="#fafafa"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：穿过模型下取最大掉落时间</text>

  <!-- input -->
  <rect x="205" y="52" width="210" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="310" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#sk)">输入 n、left[ ]、right[ ]</text>
  <path d="M 310 88 L 310 110" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#sk)"/>

  <!-- viewpoint switch -->
  <rect x="100" y="114" width="420" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
  <text x="310" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#sk)">视角转换：蚂蚁不可区分</text>
  <text x="310" y="158" text-anchor="middle" font-size="12.5" fill="#8a6520" filter="url(#sk)">相撞掉头 ≡ 互相穿过 → 碰撞全部无视</text>

  <!-- fork -->
  <path d="M 310 170 L 180 194" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#sk)"/>
  <path d="M 310 170 L 440 194" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#sk)"/>

  <!-- left branch -->
  <rect x="55" y="198" width="250" height="74" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="180" y="221" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">向左的蚂蚁 p</text>
  <text x="180" y="241" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#sk)">无视碰撞直行 p 秒</text>
  <text x="180" y="261" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#sk)">t = p 时从左端掉落</text>

  <!-- right branch -->
  <rect x="315" y="198" width="250" height="74" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#sk)"/>
  <text x="440" y="221" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#sk)">向右的蚂蚁 p</text>
  <text x="440" y="241" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">无视碰撞直行 n − p 秒</text>
  <text x="440" y="261" text-anchor="middle" font-size="12" fill="#446688" filter="url(#sk)">t = n − p 时从右端掉落</text>

  <!-- merge -->
  <path d="M 180 272 L 300 296" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#sk)"/>
  <path d="M 440 272 L 320 296" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#sk)"/>

  <!-- answer -->
  <rect x="140" y="300" width="340" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#sk)"/>
  <text x="310" y="323" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">ans = max( max(left), n − min(right) )</text>
  <text x="310" y="343" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#sk)">最右的向左者 vs 最左的向右者</text>
  <path d="M 310 352 L 310 372" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- output -->
  <rect x="125" y="376" width="370" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="310" y="394" text-anchor="middle" font-size="13" font-weight="bold" fill="#3a6a2a" filter="url(#sk)">返回 ans</text>
  <text x="310" y="413" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#sk)">无模拟、无排序，一遍扫描 O(n)</text>
</svg>
