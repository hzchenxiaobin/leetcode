<svg xmlns="http://www.w3.org/2000/svg" width="940" height="660" viewBox="0 0 940 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="660" fill="#fafafa"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：重叠会议先「粘」成整块，空闲天数 = days − 覆盖天数</text>
  <path d="M 240 40 Q 470 48 700 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="52" width="820" height="62" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="76" font-size="12.5" fill="#444">days ≤ 10⁹ 而 meetings 只有 n ≤ 10⁵ 个 → 开数组逐天打标记必爆空间（布尔数组约 1 GB）</text>
  <text x="80" y="100" font-size="12.5" fill="#444">换视角：不逐天数，把重叠/相接的会议区间「合并」成整块，答案 = 总天数 − 被覆盖天数</text>

  <text x="70" y="140" font-size="13.5" font-weight="bold" fill="#446688">① 按左端点排序，区间在时间轴上各就各位</text>

  <g filter="url(#sk)">
    <rect x="140" y="152" width="66" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.1"/>
    <rect x="206" y="152" width="66" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.1"/>
    <rect x="272" y="152" width="66" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.1"/>
    <rect x="338" y="152" width="66" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.1"/>
    <rect x="404" y="152" width="66" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.1"/>
    <rect x="470" y="152" width="66" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.1"/>
    <rect x="536" y="152" width="66" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.1"/>
    <rect x="602" y="152" width="66" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.1"/>
    <rect x="668" y="152" width="66" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.1"/>
    <rect x="734" y="152" width="66" height="44" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.1"/>
  </g>
  <g filter="url(#sk)">
    <rect x="140" y="146" width="198" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="404" y="146" width="198" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="668" y="146" width="132" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="239" y="179" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">[1,3]</text>
  <text x="503" y="179" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">[5,7]</text>
  <text x="734" y="179" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688">[9,10]</text>
  <text x="371" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a">?</text>
  <text x="635" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a">?</text>
  <text x="173" y="216" text-anchor="middle" font-size="11" fill="#666">1</text>
  <text x="239" y="216" text-anchor="middle" font-size="11" fill="#666">2</text>
  <text x="305" y="216" text-anchor="middle" font-size="11" fill="#666">3</text>
  <text x="371" y="216" text-anchor="middle" font-size="11" fill="#666">4</text>
  <text x="437" y="216" text-anchor="middle" font-size="11" fill="#666">5</text>
  <text x="503" y="216" text-anchor="middle" font-size="11" fill="#666">6</text>
  <text x="569" y="216" text-anchor="middle" font-size="11" fill="#666">7</text>
  <text x="635" y="216" text-anchor="middle" font-size="11" fill="#666">8</text>
  <text x="701" y="216" text-anchor="middle" font-size="11" fill="#666">9</text>
  <text x="767" y="216" text-anchor="middle" font-size="11" fill="#666">10</text>

  <path d="M 470 226 L 470 250" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="486" y="242" font-size="11.5" fill="#666">合并成整块 → 一段一段数长度，块与块之间就是空闲</text>

  <text x="70" y="280" font-size="13.5" font-weight="bold" fill="#a8781e">② 数覆盖：开会天橙色、空闲天绿色</text>

  <g filter="url(#sk)">
    <rect x="140" y="292" width="198" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="404" y="292" width="198" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="668" y="292" width="132" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="338" y="292" width="66" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="602" y="292" width="66" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <text x="173" y="319" text-anchor="middle" font-size="11" fill="#a8781e">会</text>
  <text x="239" y="319" text-anchor="middle" font-size="11" fill="#a8781e">会</text>
  <text x="305" y="319" text-anchor="middle" font-size="11" fill="#a8781e">会</text>
  <text x="371" y="319" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">闲</text>
  <text x="437" y="319" text-anchor="middle" font-size="11" fill="#a8781e">会</text>
  <text x="503" y="319" text-anchor="middle" font-size="11" fill="#a8781e">会</text>
  <text x="569" y="319" text-anchor="middle" font-size="11" fill="#a8781e">会</text>
  <text x="635" y="319" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">闲</text>
  <text x="701" y="319" text-anchor="middle" font-size="11" fill="#a8781e">会</text>
  <text x="767" y="319" text-anchor="middle" font-size="11" fill="#a8781e">会</text>
  <text x="173" y="352" text-anchor="middle" font-size="11" fill="#666">1</text>
  <text x="239" y="352" text-anchor="middle" font-size="11" fill="#666">2</text>
  <text x="305" y="352" text-anchor="middle" font-size="11" fill="#666">3</text>
  <text x="371" y="352" text-anchor="middle" font-size="11" fill="#666">4</text>
  <text x="437" y="352" text-anchor="middle" font-size="11" fill="#666">5</text>
  <text x="503" y="352" text-anchor="middle" font-size="11" fill="#666">6</text>
  <text x="569" y="352" text-anchor="middle" font-size="11" fill="#666">7</text>
  <text x="635" y="352" text-anchor="middle" font-size="11" fill="#666">8</text>
  <text x="701" y="352" text-anchor="middle" font-size="11" fill="#666">9</text>
  <text x="767" y="352" text-anchor="middle" font-size="11" fill="#666">10</text>
  <g filter="url(#sk)">
    <rect x="814" y="288" width="116" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="814" y="318" width="116" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="872" y="304" text-anchor="middle" font-size="11.5" fill="#a8781e">covered = 8</text>
  <text x="872" y="334" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">free = 2</text>

  <g filter="url(#sk)">
    <rect x="60" y="376" width="820" height="146" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="80" y="400" font-size="13" font-weight="bold" fill="#b85450">⚠ 重叠会议必须先合并，否则重复计数</text>
  <text x="80" y="424" font-size="11.5" fill="#444">如 meetings = [[2,4],[1,3]]：排序后 [1,3] 与 [2,4] 相交（共享第 2、3 天）</text>
  <g filter="url(#sk)">
    <rect x="80" y="436" width="180" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="140" y="460" width="180" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="80" y="486" width="240" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="170" y="449" text-anchor="middle" font-size="10.5" fill="#446688">[1,3]</text>
  <text x="230" y="473" text-anchor="middle" font-size="10.5" fill="#446688">[2,4]</text>
  <text x="200" y="501" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#a8781e">粘成 [1,4]，covered = 4</text>
  <text x="350" y="446" font-size="11.5" fill="#444">若直接按场次累加：3 + 4 = 7 → 共享的 2 天被算了两次 ✗</text>
  <text x="350" y="470" font-size="11.5" fill="#444">先粘成整块 [1,4]：长度 4，covered = 4 ✓</text>
  <text x="350" y="494" font-size="11.5" fill="#444">排序保证相交的区间在扫描中连续出现，一次线性扫描即可完成全部合并</text>

  <g filter="url(#sk)">
    <rect x="60" y="536" width="820" height="104" rx="8" fill="#f4f9f4" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="80" y="562" font-size="14" font-weight="bold" fill="#2e6e2e">空闲天数 = days − Σ (E&#8342; − S&#8342; + 1)</text>
  <text x="392" y="562" font-size="11.5" fill="#555">（[S&#8342;, E&#8342;] 为合并后两两不相交的段）</text>
  <text x="80" y="588" font-size="12" fill="#444">两两不相交 → 总覆盖 = 各段长度直接相加，天然「不重不漏」</text>
  <text x="80" y="612" font-size="12" fill="#444">复杂度只与会议数 n 相关：排序 O(n log n) + 线性扫描 O(n)，与 days 的大小完全解耦</text>
</svg>
