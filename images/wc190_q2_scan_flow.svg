<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 436" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="436" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">滑动窗口算法流程：一趟扫描，O(n)</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">首窗口求和 → 逐格进出 → 边扫边取最大，答案不会超过 k</text>

  <rect x="80" y="62" width="400" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="96" y="82" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">① 预处理首个窗口 s[0..k−1]：统计其中的元音数 cur</text>
  <text x="96" y="100" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">　 best = cur（k ≤ n，首窗口一定存在）</text>

  <path d="M 280 108 L 280 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,134 412,168 280,202 148,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">best == k ?</text>

  <path d="M 412 168 L 436 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="438" y="148" width="112" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="494" y="166" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">提前返回 k</text>
  <text x="494" y="181" text-anchor="middle" font-size="9.5" fill="#5a7a50" filter="url(#rough2)">已是理论上界</text>

  <path d="M 280 202 L 280 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="218" font-size="9.5" fill="#999" filter="url(#rough2)">否</text>

  <rect x="80" y="228" width="400" height="58" fill="#ffffff" stroke="#666" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="96" y="250" font-size="11.5" fill="#333" filter="url(#rough2)">② 右移窗口：i 从 k 到 n−1，逐格「进一个、出一个」</text>
  <text x="96" y="272" font-size="11.5" fill="#333" filter="url(#rough2)">　 cur = cur + v[i] − v[i−k]</text>

  <path d="M 280 286 L 280 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="312" width="400" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="96" y="332" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">③ best = max(best, cur)</text>
  <text x="96" y="350" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">　 若 best == k 立即结束（剪枝），无需扫完</text>

  <path d="M 280 358 L 280 380" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="384" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="407" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">返回 best</text>
</svg>
