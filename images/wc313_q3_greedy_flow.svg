<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="640" height="620" fill="#fafafa"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk2)">两遍扫描的贪心流程</text>
  <path d="M 160 46 Q 320 54 480 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk2)"/>

  <!-- 开始 -->
  <g filter="url(#sk)">
    <rect x="170" y="66" width="300" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk2)">c = popcount(num2)</text>
  <text x="320" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk2)">x = 0</text>

  <path d="M 320 110 L 320 134" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk2)"/>

  <!-- 第一遍 -->
  <g filter="url(#sk)">
    <rect x="170" y="138" width="300" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk2)">第一遍：i = 29 → 0（高位 → 低位）</text>
  <text x="320" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk2)">num1 的第 i 位是 1 且 c ＞ 0</text>
  <text x="320" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk2)">→ x 置位 i，c 减 1</text>
  <text x="162" y="172" text-anchor="end" font-size="11" font-style="italic" fill="#446688" filter="url(#sk2)">贪心保留</text>
  <text x="162" y="188" text-anchor="end" font-size="11" font-style="italic" fill="#446688" filter="url(#sk2)">num1 的高位 1</text>

  <path d="M 320 210 L 320 236" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk2)"/>

  <!-- 判断 -->
  <g filter="url(#sk)">
    <polygon points="320,240 436,278 320,316 204,278" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk2)">c == 0 ？</text>

  <!-- 是：直接返回 -->
  <path d="M 436 278 C 530 282, 545 440, 478 486" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk2)"/>
  <text x="466" y="262" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#sk2)">是（c ≤ k）</text>

  <!-- 否：第二遍 -->
  <path d="M 320 316 L 320 340" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk2)"/>
  <text x="332" y="334" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#sk2)">否（c ＞ k）</text>

  <g filter="url(#sk)">
    <rect x="170" y="344" width="300" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="320" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#sk2)">第二遍：i = 0 → ↑（低位 → 高位）</text>
  <text x="320" y="388" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk2)">x 的第 i 位是 0</text>
  <text x="320" y="406" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk2)">→ x 置位 i，c 减 1，直到 c = 0</text>
  <text x="162" y="378" text-anchor="end" font-size="11" font-style="italic" fill="#4a7a3a" filter="url(#sk2)">多余的 1</text>
  <text x="162" y="394" text-anchor="end" font-size="11" font-style="italic" fill="#4a7a3a" filter="url(#sk2)">放到最低 0 位</text>

  <path d="M 320 416 L 320 440" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk2)"/>

  <!-- 返回 -->
  <g filter="url(#sk)">
    <rect x="170" y="444" width="300" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="468" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk2)">返回 x</text>
  <text x="320" y="488" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk2)">所有失配位的 2^i 之和最小</text>

  <!-- 底部说明 -->
  <g filter="url(#sk2)">
    <rect x="30" y="530" width="580" height="72" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
  </g>
  <text x="320" y="558" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#sk2)">两遍方向相反：删 1 保高位（被排除的位便宜），补 1 补低位（新添的位便宜）</text>
  <text x="320" y="582" text-anchor="middle" font-size="12" font-style="italic" fill="#888" filter="url(#sk2)">XOR 按位独立 → 每一步的局部最优叠加即全局最优</text>
</svg>
