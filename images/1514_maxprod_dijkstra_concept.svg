<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：换掉三个符号，Dijkstra 骨架原封不动</text>
  <text x="320" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">「743 网络延迟时间」标准版 → 本题 max-prod 变体</text>

  <!-- left panel : standard dijkstra -->
  <g filter="url(#r)">
    <rect x="42" y="78" width="240" height="232" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="58" y="112" width="208" height="44" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="58" y="166" width="208" height="44" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="58" y="220" width="208" height="44" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="162" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#r)">标准 Dijkstra（min 版）</text>
  <g font-size="12.5" fill="#33517a" text-anchor="middle">
    <text x="162" y="139" filter="url(#r)">小根堆：先弹出 dist 最小</text>
    <text x="162" y="193" filter="url(#r)">松弛：dist[u] + w &lt; dist[v]</text>
    <text x="162" y="247" filter="url(#r)">初始化：dist[start] = 0</text>
  </g>

  <!-- right panel : max-prod variant -->
  <g filter="url(#r)">
    <rect x="358" y="78" width="240" height="232" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="374" y="112" width="208" height="44" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="374" y="166" width="208" height="44" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="374" y="220" width="208" height="44" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="478" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#r)">本题变体（max-prod 版）</text>
  <g font-size="12.5" fill="#2e6e2e" text-anchor="middle">
    <text x="478" y="139" filter="url(#r)">大根堆：先弹出 prob 最大</text>
    <text x="478" y="193" filter="url(#r)">松弛：prob[u] × w &gt; prob[v]</text>
    <text x="478" y="247" filter="url(#r)">初始化：prob[start] = 1</text>
  </g>

  <!-- middle replacement arrows -->
  <g filter="url(#r)" stroke="#d6a040" stroke-width="2.2" fill="none">
    <path d="M 286 134 L 354 134" marker-end="url(#ao)"/>
    <path d="M 286 188 L 354 188" marker-end="url(#ao)"/>
    <path d="M 286 242 L 354 242" marker-end="url(#ao)"/>
  </g>
  <g font-size="11" fill="#a87f2a" text-anchor="middle">
    <text x="320" y="126" filter="url(#r)">min → max</text>
    <text x="320" y="180" filter="url(#r)">d+w → p×w</text>
    <text x="320" y="234" filter="url(#r)">0 → 1</text>
  </g>

  <!-- greedy correctness : probability decays along path -->
  <text x="320" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#r)">贪心为什么成立：边权 ≤ 1 ⇒ 路径每延长一步，概率不增</text>

  <!-- bars -->
  <g filter="url(#r)">
    <rect x="92" y="396" width="56" height="52" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="232" y="422" width="56" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="372" y="435" width="56" height="13" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="512" y="444" width="56" height="4" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#33517a" text-anchor="middle">
    <text x="120" y="388" filter="url(#r)">1.0</text>
    <text x="260" y="414" filter="url(#r)">0.5</text>
    <text x="400" y="427" filter="url(#r)">0.25</text>
    <text x="540" y="436" filter="url(#r)">0.05</text>
  </g>
  <g filter="url(#r)" stroke="#d6a040" stroke-width="1.8" fill="none">
    <path d="M 152 400 L 228 420" marker-end="url(#ao)"/>
    <path d="M 292 424 L 368 433" marker-end="url(#ao)"/>
    <path d="M 432 435 L 508 441" marker-end="url(#ao)"/>
  </g>
  <g font-size="11.5" fill="#a87f2a" text-anchor="middle">
    <text x="190" y="404" filter="url(#r)">×0.5</text>
    <text x="330" y="418" filter="url(#r)">×0.5</text>
    <text x="470" y="428" filter="url(#r)">×0.2</text>
  </g>
  <path d="M 80 448 L 588 448" stroke="#3a3a3a" stroke-width="1.5" filter="url(#r)"/>
  <g font-size="10.5" fill="#999" text-anchor="middle">
    <text x="120" y="464" filter="url(#r)">起点</text>
    <text x="260" y="464" filter="url(#r)">走 1 步</text>
    <text x="400" y="464" filter="url(#r)">走 2 步</text>
    <text x="540" y="464" filter="url(#r)">走 3 步</text>
  </g>
  <text x="320" y="476" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#r)">越走概率越小 ⇒ 当前弹出的最大者不可能再被改进 —— 「弹出即确定」</text>
</svg>
