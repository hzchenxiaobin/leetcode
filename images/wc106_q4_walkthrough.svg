<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="340" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：示例 1 与示例 3</text>
  <text x="60" y="64" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1  graph=[[1,1,0],[1,1,0],[0,0,1]],  initial=[0,1]</text>
  <rect x="60" y="78" width="120" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120.0" y="99.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">块 {0,1} 大小 2</text>
  <text x="60" y="140" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">块内感染源 2 个</text>
  <rect x="250" y="78" width="110" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="305.0" y="99.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">块 {2} 大小 1</text>
  <text x="250" y="140" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">感染源 0 个</text>
  <text x="430" y="96" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 移除 0 或 1 收益都是 0；取最小下标 0</text>
  <text x="60" y="190" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 3  graph 全 1（单块 {0,1,2}）,  initial=[1,2]</text>
  <rect x="60" y="204" width="160" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140.0" y="225.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">块 {0,1,2} 大小 3</text>
  <text x="60" y="266" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">块内感染源 2 个（1 和 2）</text>
  <text x="430" y="222" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 移谁都不减少感染数，取 1</text>
  <text x="330" y="320" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 2 中三块各含 1 个源、大小都为 1，收益并列 → 返回 0</text>
</svg>
