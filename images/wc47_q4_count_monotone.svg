<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="430" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">计数函数 f(x)：表中小于等于 x 的元素个数，单调不减</text>

  <!-- 左：3x3 乘法表 -->
  <text x="114" y="68" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">乘法表 3 × 3</text>

  <rect x="45" y="85" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="91" y="85" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="137" y="85" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="45" y="131" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="91" y="131" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="137" y="131" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="45" y="177" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="91" y="177" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="137" y="177" width="46" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="68" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="114" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="160" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="68" y="160" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="114" y="160" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="160" y="160" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">6</text>
  <text x="68" y="206" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="114" y="206" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">6</text>
  <text x="160" y="206" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">9</text>

  <text x="114" y="248" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">蓝格：i·j ≤ x（此例 x = 5）</text>
  <text x="114" y="270" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">共 6 格，故 f(5) = 3 + 2 + 1 = 6</text>
  <text x="114" y="292" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">逐行计数：min(n, ⌊x / i⌋)</text>

  <!-- 右：阶梯函数 -->
  <text x="505" y="68" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">阶梯：f(x) 随 x 单调不减</text>

  <line x1="370" y1="350" x2="648" y2="350" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="370" y1="350" x2="370" y2="120" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 370 350 H 396 V 327 H 422 V 281 H 448 V 235 H 474 V 212 H 500 H 526 V 166 H 552 H 578 H 604 V 143 H 630"
        fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <line x1="355" y1="235" x2="640" y2="235" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="448" y1="235" x2="448" y2="350" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="448" cy="235" r="3.6" fill="#b85450" filter="url(#rough2)"/>

  <text x="352" y="231" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">k = 5</text>
  <text x="448" y="368" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">x* = 3</text>
  <text x="362" y="354" text-anchor="end" font-size="9.5" fill="#666" filter="url(#rough2)">0</text>
  <text x="362" y="285" text-anchor="end" font-size="9.5" fill="#666" filter="url(#rough2)">3</text>
  <text x="362" y="239" text-anchor="end" font-size="9.5" fill="#666" filter="url(#rough2)">5</text>
  <text x="362" y="147" text-anchor="end" font-size="9.5" fill="#666" filter="url(#rough2)">9</text>
  <text x="370" y="366" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="396" y="366" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="422" y="366" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="474" y="366" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="500" y="366" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="526" y="366" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="552" y="366" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">7</text>
  <text x="578" y="366" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">8</text>
  <text x="604" y="366" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">9</text>
  <text x="626" y="336" text-anchor="end" font-size="9.5" fill="#666" filter="url(#rough2)">x</text>

  <rect x="30" y="388" width="620" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="403" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">f 只在表中真实值处跳跃，第一次达到 k 的位置就是 x* = 3（表中确有 3）</text>
  <text x="340" y="417" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">4 与 5 之间是平台 ⇒ 二分的 mid 可能不是表中元素，故用 hi = mid 而非 mid − 1</text>
</svg>
