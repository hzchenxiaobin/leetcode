<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="307" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：圆的每一行是连续区间</text>
  <path d="M 190 40 Q 330 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left: circle with one highlighted row -->
  <g filter="url(#sk)" fill="#cfcfcf">
    <circle cx="110" cy="110" r="1.4"/><circle cx="135" cy="110" r="1.4"/><circle cx="160" cy="110" r="1.4"/><circle cx="185" cy="110" r="1.4"/><circle cx="210" cy="110" r="1.4"/><circle cx="235" cy="110" r="1.4"/><circle cx="260" cy="110" r="1.4"/><circle cx="285" cy="110" r="1.4"/><circle cx="310" cy="110" r="1.4"/>
    <circle cx="110" cy="135" r="1.4"/><circle cx="135" cy="135" r="1.4"/><circle cx="160" cy="135" r="1.4"/><circle cx="185" cy="135" r="1.4"/><circle cx="210" cy="135" r="1.4"/><circle cx="235" cy="135" r="1.4"/><circle cx="260" cy="135" r="1.4"/><circle cx="285" cy="135" r="1.4"/><circle cx="310" cy="135" r="1.4"/>
    <circle cx="110" cy="160" r="1.4"/><circle cx="135" cy="160" r="1.4"/><circle cx="160" cy="160" r="1.4"/><circle cx="185" cy="160" r="1.4"/><circle cx="210" cy="160" r="1.4"/><circle cx="235" cy="160" r="1.4"/><circle cx="260" cy="160" r="1.4"/><circle cx="285" cy="160" r="1.4"/><circle cx="310" cy="160" r="1.4"/>
    <circle cx="110" cy="185" r="1.4"/><circle cx="135" cy="185" r="1.4"/><circle cx="160" cy="185" r="1.4"/><circle cx="185" cy="185" r="1.4"/><circle cx="210" cy="185" r="1.4"/><circle cx="235" cy="185" r="1.4"/><circle cx="260" cy="185" r="1.4"/><circle cx="285" cy="185" r="1.4"/><circle cx="310" cy="185" r="1.4"/>
    <circle cx="110" cy="210" r="1.4"/><circle cx="135" cy="210" r="1.4"/><circle cx="160" cy="210" r="1.4"/><circle cx="185" cy="210" r="1.4"/><circle cx="210" cy="210" r="1.4"/><circle cx="235" cy="210" r="1.4"/><circle cx="260" cy="210" r="1.4"/><circle cx="285" cy="210" r="1.4"/><circle cx="310" cy="210" r="1.4"/>
    <circle cx="110" cy="235" r="1.4"/><circle cx="135" cy="235" r="1.4"/><circle cx="160" cy="235" r="1.4"/><circle cx="185" cy="235" r="1.4"/><circle cx="210" cy="235" r="1.4"/><circle cx="235" cy="235" r="1.4"/><circle cx="260" cy="235" r="1.4"/><circle cx="285" cy="235" r="1.4"/><circle cx="310" cy="235" r="1.4"/>
    <circle cx="110" cy="260" r="1.4"/><circle cx="135" cy="260" r="1.4"/><circle cx="160" cy="260" r="1.4"/><circle cx="185" cy="260" r="1.4"/><circle cx="210" cy="260" r="1.4"/><circle cx="235" cy="260" r="1.4"/><circle cx="260" cy="260" r="1.4"/><circle cx="285" cy="260" r="1.4"/><circle cx="310" cy="260" r="1.4"/>
    <circle cx="110" cy="285" r="1.4"/><circle cx="135" cy="285" r="1.4"/><circle cx="160" cy="285" r="1.4"/><circle cx="185" cy="285" r="1.4"/><circle cx="210" cy="285" r="1.4"/><circle cx="235" cy="285" r="1.4"/><circle cx="260" cy="285" r="1.4"/><circle cx="285" cy="285" r="1.4"/><circle cx="310" cy="285" r="1.4"/>
    <circle cx="110" cy="310" r="1.4"/><circle cx="135" cy="310" r="1.4"/><circle cx="160" cy="310" r="1.4"/><circle cx="185" cy="310" r="1.4"/><circle cx="210" cy="310" r="1.4"/><circle cx="235" cy="310" r="1.4"/><circle cx="260" cy="310" r="1.4"/><circle cx="285" cy="310" r="1.4"/><circle cx="310" cy="310" r="1.4"/>
  </g>
  <path d="M 212,97 C 272,97 320,148 320,205 C 320,263 271,313 212,313 C 153,313 104,262 104,205 C 104,149 153,97 212,97 Z"
        fill="#e8f0fe" fill-opacity="0.35" stroke="#446688" stroke-width="2.2" filter="url(#sk)"/>
  <circle cx="212" cy="205" r="3.5" fill="#446688" filter="url(#sk)"/>
  <text x="212" y="193" text-anchor="middle" font-size="11" fill="#446688" filter="url(#sk)">圆心 (x, y)</text>

  <line x1="104" y1="255" x2="320" y2="255" stroke="#999999" stroke-width="1" stroke-dasharray="5 5" filter="url(#sk)"/>
  <text x="98" y="250" text-anchor="end" font-size="11" fill="#555" filter="url(#sk)">固定 py</text>
  <line x1="116" y1="255" x2="308" y2="255" stroke="#4a7a3a" stroke-width="5.5" stroke-linecap="round" opacity="0.8" filter="url(#sk)"/>

  <g filter="url(#sk)" fill="#4a7a3a">
    <circle cx="140" cy="255" r="4"/>
    <circle cx="164" cy="255" r="4"/>
    <circle cx="188" cy="255" r="4"/>
    <circle cx="212" cy="255" r="4"/>
    <circle cx="236" cy="255" r="4"/>
    <circle cx="260" cy="255" r="4"/>
    <circle cx="284" cy="255" r="4"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="116" cy="255" r="4.5" fill="#fafafa" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="308" cy="255" r="4.5" fill="#fafafa" stroke="#4a7a3a" stroke-width="2"/>
  </g>

  <!-- right triangle -->
  <g filter="url(#sk)">
    <line x1="212" y1="205" x2="212" y2="255" stroke="#b85450" stroke-width="2.2"/>
    <line x1="212" y1="255" x2="308" y2="255" stroke="#446688" stroke-width="2.2"/>
    <line x1="308" y1="255" x2="212" y2="205" stroke="#d6a040" stroke-width="2.4"/>
    <path d="M 212,246 h 9 v 9" stroke="#555" stroke-width="1" fill="none"/>
  </g>
  <text x="222" y="234" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">dy</text>
  <text x="252" y="275" font-size="13" font-weight="bold" fill="#446688" filter="url(#sk)">dx</text>
  <text x="268" y="222" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#sk)">r</text>
  <text x="212" y="345" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">勾股定理：dx² + dy² ≤ r² ⇒ dx = ⌊√(r² − dy²)⌋</text>

  <!-- right panel -->
  <g filter="url(#sk)">
    <rect x="350" y="62" width="296" height="136" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="366" y="86" text-anchor="start" font-size="14" font-weight="bold" fill="#446688" filter="url(#sk)">观察 C：行连续性</text>
  <g font-size="11.5" fill="#333">
    <text x="366" y="110" filter="url(#sk)">固定 py，记 dy = py − y（|dy| ≤ r）</text>
    <text x="366" y="130" filter="url(#sk)">圆内 ⇔ (px − x)² ≤ r² − dy²</text>
    <text x="366" y="150" filter="url(#sk)">⇒ px ∈ [x − ⌊√(r²−dy²)⌋, x + ⌊√(r²−dy²)⌋]</text>
    <text x="366" y="176" font-weight="bold" fill="#446688" filter="url(#sk)">一行一次 isqrt，区间整段标记</text>
  </g>
  <g filter="url(#sk)">
    <rect x="350" y="212" width="296" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="366" y="236" text-anchor="start" font-size="14" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">升级：逐点判定 → 逐行标记</text>
  <g font-size="11.5" fill="#333">
    <text x="366" y="260" filter="url(#sk)">每圆 O(r²) 次判定 → O(r) 行 + 整段置位</text>
    <text x="366" y="280" filter="url(#sk)">布尔矩阵置 True 幂等，天然去重</text>
    <text x="366" y="304" filter="url(#sk)">差分版：左端 +1、右端 +1 处 −1</text>
  </g>

  <!-- bottom strip -->
  <g filter="url(#sk)">
    <rect x="40" y="356" width="610" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="345" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415" filter="url(#sk)">Python 用 math.isqrt（纯整数、精确）；C++ 的 sqrt 是浮点，完全平方数可能差 1，须 ±1 校正</text>
</svg>
