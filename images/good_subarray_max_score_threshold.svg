<svg xmlns="http://www.w3.org/2000/svg" width="940" height="640" viewBox="0 0 940 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/></marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/></marker>
  </defs>
  <rect width="940" height="640" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">核心观察：枚举最小值 v，而不是枚举子数组</text>
  <path d="M 250 44 Q 470 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="90" y="400" width="48" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="114.0" y="392" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">1</text>
  <g filter="url(#sk)"><rect x="154" y="310" width="48" height="120" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="178.0" y="302" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="218" y="340" width="48" height="90" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="242.0" y="332" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="282" y="220" width="48" height="210" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="306.0" y="212" text-anchor="middle" font-size="11.5" fill="#b07818" font-weight="bold" filter="url(#sk)">7</text>
  <g filter="url(#sk)"><rect x="346" y="310" width="48" height="120" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="370.0" y="302" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">4</text>
  <g filter="url(#sk)"><rect x="410" y="280" width="48" height="150" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="434.0" y="272" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">5</text>
  <path d="M 78 430 L 466 430" stroke="#2b2b2b" stroke-width="1.8" fill="none" filter="url(#sk)"/>
  <text x="114.0" y="448" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">0</text>
  <text x="178.0" y="448" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">1</text>
  <text x="242.0" y="448" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">2</text>
  <text x="306.0" y="448" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#sk)">3</text>
  <text x="370.0" y="448" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">4</text>
  <text x="434.0" y="448" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">5</text>
  <path d="M 306 472 L 306 458" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="306" y="486" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#sk)">k</text>
  <text x="90" y="74" text-anchor="start" font-size="10.5" fill="#888" filter="url(#sk)">好子数组必须覆盖 k（橙色柱）</text>
  <path d="M 262 80 Q 295 140 304 212" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arO)" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 78 220 L 466 220" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="74" y="224" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#sk)">v = 7</text>
  <path d="M 78 310 L 466 310" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="74" y="314" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">v = 4</text>
  <path d="M 78 340 L 466 340" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="6 4" filter="url(#sk)"/>
  <text x="74" y="344" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#sk)">v = 3</text>
  <path d="M 282 478 L 282 486 L 330 486 L 330 478" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="306" y="500" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#sk)">7×1 = 7</text>
  <path d="M 282 502 L 282 510 L 458 510 L 458 502" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="370" y="524" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#sk)">4×3 = 12</text>
  <path d="M 154 526 L 154 534 L 458 534 L 458 526" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="306" y="548" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#sk)">3×5 = 15 ★</text>
  <g filter="url(#sk)"><rect x="515" y="80" width="405" height="250" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="535" y="106" text-anchor="start" font-size="13.5" fill="#2b2b2b" font-weight="bold" filter="url(#sk)">枚举表：候选 = v × |W(v)|</text>
  <text x="560" y="134" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#sk)">v</text>
  <text x="690" y="134" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#sk)">W(v)</text>
  <text x="850" y="134" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#sk)">候选 v×|W(v)|</text>
  <text x="560" y="160" text-anchor="middle" font-size="11.5" fill="#444" font-family="'Courier New',monospace" filter="url(#sk)">7</text>
  <text x="690" y="160" text-anchor="middle" font-size="11.5" fill="#444" font-family="'Courier New',monospace" filter="url(#sk)">[3,3]</text>
  <text x="850" y="160" text-anchor="middle" font-size="11.5" fill="#444" font-family="'Courier New',monospace" filter="url(#sk)">7×1 = 7</text>
  <text x="560" y="184" text-anchor="middle" font-size="11.5" fill="#444" font-family="'Courier New',monospace" filter="url(#sk)">5</text>
  <text x="690" y="184" text-anchor="middle" font-size="11.5" fill="#444" font-family="'Courier New',monospace" filter="url(#sk)">[3,3]</text>
  <text x="850" y="184" text-anchor="middle" font-size="11.5" fill="#444" font-family="'Courier New',monospace" filter="url(#sk)">5×1 = 5</text>
  <text x="560" y="208" text-anchor="middle" font-size="11.5" fill="#444" font-family="'Courier New',monospace" filter="url(#sk)">4</text>
  <text x="690" y="208" text-anchor="middle" font-size="11.5" fill="#444" font-family="'Courier New',monospace" filter="url(#sk)">[3,5]</text>
  <text x="850" y="208" text-anchor="middle" font-size="11.5" fill="#444" font-family="'Courier New',monospace" filter="url(#sk)">4×3 = 12</text>
  <g filter="url(#sk)"><rect x="523" y="217" width="389" height="21" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/></g>
  <text x="560" y="232" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" font-family="'Courier New',monospace" filter="url(#sk)">3</text>
  <text x="690" y="232" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" font-family="'Courier New',monospace" filter="url(#sk)">[1,5]</text>
  <text x="850" y="232" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" font-family="'Courier New',monospace" filter="url(#sk)">3×5 = 15 ★</text>
  <text x="560" y="256" text-anchor="middle" font-size="11.5" fill="#444" font-family="'Courier New',monospace" filter="url(#sk)">1</text>
  <text x="690" y="256" text-anchor="middle" font-size="11.5" fill="#444" font-family="'Courier New',monospace" filter="url(#sk)">[0,5]</text>
  <text x="850" y="256" text-anchor="middle" font-size="11.5" fill="#444" font-family="'Courier New',monospace" filter="url(#sk)">1×6 = 6</text>
  <text x="535" y="292" text-anchor="start" font-size="9.5" fill="#888" filter="url(#sk)">· 只需考察元素值：W 相同的 v 中，只有 v = min(W)（自洽值）不被支配</text>
  <text x="535" y="310" text-anchor="start" font-size="9.5" fill="#888" filter="url(#sk)">· W(v) 随 v 下降而变宽，自洽值至多 n 个 → 一次扫描全覆盖</text>
  <g filter="url(#sk)"><rect x="60" y="566" width="860" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="80" y="590" text-anchor="start" font-size="12.5" fill="#7a5415" font-weight="bold" filter="url(#sk)">W(v) = 包含 k 且元素全 ≥ v 的最长连续区间</text>
  <text x="80" y="612" text-anchor="start" font-size="11" fill="#555" filter="url(#sk)">固定水位 v，宽度直接拉满到 |W(v)|；ans = 对全部 v 取最大 —— 所有「临界水位」在一次从 k 出发的扫描中全部出现（§3.3）</text>
</svg>
