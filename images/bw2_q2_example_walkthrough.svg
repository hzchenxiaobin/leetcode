<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：两个学生的前五均分（官方示例 1）</text>

  <rect x="36" y="52" width="240" height="270" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="156" y="72" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">学生 id = 1（6 个成绩）</text>
  <text x="156" y="88" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">成绩：91, 92, 60, 65, 87, 100</text>

  <text x="156" y="108" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">降序排序后</text>
  <rect x="96" y="112" width="48" height="94" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="120" y="128" fill="#2a5a20" font-weight="bold">100</text>
    <text x="120" y="148" fill="#2a5a20" font-weight="bold">92</text>
    <text x="120" y="168" fill="#2a5a20" font-weight="bold">91</text>
    <text x="120" y="188" fill="#2a5a20" font-weight="bold">87</text>
    <text x="120" y="208" fill="#2a5a20" font-weight="bold">65</text>
    <text x="120" y="228" fill="#b0a0a0">60（不计入）</text>
  </g>
  <text x="210" y="150" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">虚线框 = 前 5 高</text>
  <text x="210" y="166" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">60 被挤掉</text>

  <rect x="70" y="240" width="172" height="26" fill="#fff" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="156" y="257" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">sum = 100+92+91+87+65 = 435</text>
  <rect x="86" y="274" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="156" y="296" text-anchor="middle" font-size="11.5" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">435 / 5 = 87 ✓ 整除</text>

  <rect x="296" y="52" width="240" height="270" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="416" y="72" text-anchor="middle" font-size="11.5" fill="#2a5a20" font-weight="bold" filter="url(#rough2)">学生 id = 2（恰好 5 个成绩）</text>
  <text x="416" y="88" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">成绩：93, 97, 77, 76, 100</text>

  <text x="416" y="108" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">降序排序后</text>
  <rect x="356" y="112" width="48" height="94" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" rx="6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="380" y="128" fill="#2a5a20" font-weight="bold">100</text>
    <text x="380" y="148" fill="#2a5a20" font-weight="bold">97</text>
    <text x="380" y="168" fill="#2a5a20" font-weight="bold">93</text>
    <text x="380" y="188" fill="#2a5a20" font-weight="bold">77</text>
    <text x="380" y="208" fill="#2a5a20" font-weight="bold">76</text>
  </g>
  <text x="470" y="150" font-size="9.5" fill="#2a5a20" filter="url(#rough2)">全部 5 个都是</text>
  <text x="470" y="166" font-size="9.5" fill="#2a5a20" filter="url(#rough2)">「前 5 高」</text>

  <rect x="330" y="240" width="172" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="416" y="257" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">sum = 100+97+93+77+76 = 443</text>
  <rect x="346" y="274" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="416" y="296" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">443 / 5 = 88.6 → 88</text>

  <path d="M 276 150 L 292 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="342" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">⚠ 平均用整数除法（向零取整），不是四舍五入：88.6 → 88，不是 89</text>
  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">最终输出（按 id 升序）：[[1, 87], [2, 88]]</text>
</svg>
