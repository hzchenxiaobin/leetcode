<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = aababcabc，7 个窗口里 4 个「好」</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="13" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="80" y="62">起点 i</text>
    <text x="180" y="62">窗口内容</text>
    <text x="330" y="62">判定</text>
    <text x="462" y="62">原因</text>
  </g>

  <!-- 7 行 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="40" y="74" width="480" height="36" fill="#fce4ec" stroke="#e0b3b0" stroke-width="1" rx="6"/>
    <text x="80" y="97">0</text><text x="180" y="97">aab</text>
    <text x="330" y="97" fill="#b85450">✗</text><text x="462" y="97">两个 a</text>

    <rect x="40" y="112" width="480" height="36" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6"/>
    <text x="80" y="135">1</text><text x="180" y="135">aba</text>
    <text x="330" y="135" fill="#b85450">✗</text><text x="462" y="135">两个 a</text>

    <rect x="40" y="150" width="480" height="36" fill="#fce4ec" stroke="#e0b3b0" stroke-width="1" rx="6"/>
    <text x="80" y="173">2</text><text x="180" y="173">bab</text>
    <text x="330" y="173" fill="#b85450">✗</text><text x="462" y="173">两个 b</text>

    <rect x="40" y="188" width="480" height="36" fill="#e6f4ea" stroke="#b5d4b0" stroke-width="1" rx="6"/>
    <text x="80" y="211">3</text><text x="180" y="211">abc</text>
    <text x="330" y="211" fill="#4a7a3a">✓</text><text x="462" y="211">两两不同</text>

    <rect x="40" y="226" width="480" height="36" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6"/>
    <text x="80" y="249">4</text><text x="180" y="249">bca</text>
    <text x="330" y="249" fill="#4a7a3a">✓</text><text x="462" y="249">两两不同</text>

    <rect x="40" y="264" width="480" height="36" fill="#e6f4ea" stroke="#b5d4b0" stroke-width="1" rx="6"/>
    <text x="80" y="287">5</text><text x="180" y="287">cab</text>
    <text x="330" y="287" fill="#4a7a3a">✓</text><text x="462" y="287">两两不同</text>

    <rect x="40" y="302" width="480" height="36" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="6"/>
    <text x="80" y="325">6</text><text x="180" y="325">abc</text>
    <text x="330" y="325" fill="#4a7a3a">✓</text><text x="462" y="325">与 i=3 相同也计入</text>
  </g>

  <rect x="70" y="352" width="420" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="14" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">答案 = 4（例 1 的 xyzzaz 同理，仅 xyz 一个好）</text>
</svg>
