<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>
  <text x="290" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1, 2, 1, 3]</text>

  <!-- 数组 -->
  <g filter="url(#rough2)" font-size="11" fill="#777" text-anchor="middle">
    <text x="139" y="56">0</text>
    <text x="231" y="56">1</text>
    <text x="323" y="56">2</text>
    <text x="415" y="56">3</text>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="18" fill="#333">
    <rect x="108" y="64" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="200" y="64" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="292" y="64" width="62" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="384" y="64" width="62" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="139" y="95">1</text>
    <text x="231" y="95">2</text>
    <text x="323" y="95">1</text>
    <text x="415" y="95">3</text>
  </g>

  <!-- 每步动作 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" fill="#333">
    <text x="139" y="138">首次出现</text>
    <text x="231" y="138">首次出现</text>
    <text x="323" y="138" fill="#b85450" font-weight="bold">第二次出现</text>
    <text x="415" y="138">首次出现</text>
    <text x="139" y="158" fill="#777">加入 seen</text>
    <text x="231" y="158" fill="#777">加入 seen</text>
    <text x="323" y="158" fill="#b85450">ans ^= 1</text>
    <text x="415" y="158" fill="#777">加入 seen</text>
  </g>

  <!-- ans 轨迹 -->
  <text x="52" y="222" font-size="13" fill="#333" filter="url(#rough2)">ans</text>
  <g filter="url(#rough2)" text-anchor="middle" font-size="15">
    <rect x="108" y="200" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="200" y="200" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="292" y="200" width="62" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="384" y="200" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="139" y="224" fill="#333">0</text>
    <text x="231" y="224" fill="#333">0</text>
    <text x="323" y="224" fill="#2d5a22" font-weight="bold">1</text>
    <text x="415" y="224" fill="#333">1</text>
  </g>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.6" fill="none">
    <path d="M 170 220 L 196 220" marker-end="url(#arr)"/>
    <path d="M 262 220 L 288 220" marker-end="url(#arr)"/>
    <path d="M 354 220 L 380 220" marker-end="url(#arr)"/>
  </g>

  <!-- 说明 -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="44" y="272">seen 变化：{} → {1} → {1,2} → {1,2} → {1,2,3}</text>
    <text x="44" y="298" fill="#2d5a22">最终答案：1　（只有 1 出现两次）</text>
    <text x="44" y="326" fill="#777">重复的第二个 1 到达时异或一次即可，第三个重复不会出现</text>
  </g>
  <rect x="44" y="338" width="230" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="159" y="358" text-anchor="middle" font-size="12" fill="#2d5a22" filter="url(#rough2)">答案与扫描顺序无关</text>
</svg>
