<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">距离谱：正方形只看 6 个两两距离的多重集</text>
  <text x="310" y="50" text-anchor="middle" font-size="11.5" fill="#888">输入顺序任意 ⇒ 必须用一个与顺序无关的形状不变量来判断</text>

  <polygon points="120,300 300,300 300,120 120,120" fill="#e8f0fe" stroke="#446688" stroke-width="2"
           filter="url(#rough2)"/>
  <path d="M 120 300 L 300 120" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none"
        filter="url(#rough2)"/>
  <path d="M 300 300 L 120 120" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none"
        filter="url(#rough2)"/>

  <text x="104" y="316" text-anchor="end" font-size="12" fill="#3a4a66" filter="url(#rough2)">A</text>
  <text x="316" y="316" font-size="12" fill="#3a4a66" filter="url(#rough2)">B</text>
  <text x="316" y="114" font-size="12" fill="#3a4a66" filter="url(#rough2)">C</text>
  <text x="104" y="114" text-anchor="end" font-size="12" fill="#3a4a66" filter="url(#rough2)">D</text>

  <text x="210" y="324" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">边长 a</text>
  <text x="205" y="196" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">√2·a</text>

  <rect x="350" y="94" width="252" height="152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"
        filter="url(#rough2)"/>
  <text x="366" y="120" font-size="11" fill="#8a6a20" font-weight="bold">排序后的 6 个平方距离</text>
  <text x="366" y="146" font-size="10.5" fill="#555">4 条边 → 各 a²</text>
  <text x="366" y="170" font-size="10.5" fill="#555">2 条对角线 → 各 2a²</text>
  <text x="366" y="196" font-size="10.5" fill="#555">多重集 {a²×4, 2a²×2}</text>
  <text x="366" y="220" font-size="10.5" fill="#555">[a²,a²,a²,a²,2a²,2a²]</text>
  <text x="366" y="238" font-size="10" fill="#999">与输入顺序完全无关</text>

  <path d="M 306 236 L 344 236" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)"
        filter="url(#rough2)"/>

  <rect x="60" y="344" width="520" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"
        filter="url(#rough2)"/>
  <text x="76" y="368" font-size="11.5" fill="#3a5a30" font-weight="bold">判据：排序后 [s, s, s, s, 2s, 2s] 且 s &gt; 0 ⇔ 四点构成正方形</text>
  <text x="76" y="392" font-size="10" fill="#555">必要性显然；充分性要排除「两条长线段共享一个端点」的假配置（见第 5 节的反证图）</text>

  <text x="310" y="422" text-anchor="middle" font-size="9.5" fill="#999">例：a=1 → [1,1,1,1,2,2]；a=5 → [25,25,25,25,50,50]</text>
</svg>
