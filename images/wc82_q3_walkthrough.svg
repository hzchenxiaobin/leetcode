<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#444" filter="url(#rough2)">示例 1 演算：能力 [4,5,6,7] 逐个查台阶</text>
  <text x="280" y="46" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">排序后工作：(2,10) (4,20) (6,30) (8,40) (10,50)</text>

  <rect x="24" y="60" width="96" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="72" y="78" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">难度 2</text>
  <text x="72" y="94" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">收益 10</text>

  <rect x="128" y="60" width="96" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="176" y="78" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">难度 4</text>
  <text x="176" y="94" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">收益 20</text>

  <rect x="232" y="60" width="96" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">难度 6</text>
  <text x="280" y="94" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">收益 30</text>

  <rect x="336" y="60" width="96" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="384" y="78" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">难度 8</text>
  <text x="384" y="94" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">收益 40</text>

  <rect x="440" y="60" width="96" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="488" y="78" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">难度 10</text>
  <text x="488" y="94" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">收益 50</text>

  <rect x="24" y="118" width="512" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="72" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">能力 w</text>
  <text x="208" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">本轮新解锁</text>
  <text x="354" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">当前 best</text>
  <text x="474" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">该工人贡献</text>

  <rect x="24" y="152" width="96" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="173" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="120" y="152" width="176" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">难度 2、4 → j 移到 2</text>
  <rect x="296" y="152" width="116" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="354" y="173" text-anchor="middle" font-size="10.5" fill="#2f5a28" filter="url(#rough2)">20</text>
  <rect x="412" y="152" width="124" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="173" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">+20</text>

  <rect x="24" y="190" width="96" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="211" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="120" y="190" width="176" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="211" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">无（6 &gt; 5）</text>
  <rect x="296" y="190" width="116" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="354" y="211" text-anchor="middle" font-size="10.5" fill="#2f5a28" filter="url(#rough2)">20</text>
  <rect x="412" y="190" width="124" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="211" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">+20</text>

  <rect x="24" y="228" width="96" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="120" y="228" width="176" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="249" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">难度 6 → j 移到 3</text>
  <rect x="296" y="228" width="116" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="354" y="249" text-anchor="middle" font-size="10.5" fill="#2f5a28" filter="url(#rough2)">30</text>
  <rect x="412" y="228" width="124" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">+30</text>

  <rect x="24" y="266" width="96" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="287" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">7</text>
  <rect x="120" y="266" width="176" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="287" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">无（8 &gt; 7）</text>
  <rect x="296" y="266" width="116" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="354" y="287" text-anchor="middle" font-size="10.5" fill="#2f5a28" filter="url(#rough2)">30</text>
  <rect x="412" y="266" width="124" height="32" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="474" y="287" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">+30</text>

  <rect x="24" y="308" width="512" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a2f2f" filter="url(#rough2)">合计 20 + 20 + 30 + 30 = 100</text>

  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">工人 5 与 7 没有解锁新工作，仍拿走当前最好的工作——工作允许被重复完成</text>
  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">若贪心地「按难度就近匹配」，工人 5 会拿到 0，答案只有 60</text>
</svg>
