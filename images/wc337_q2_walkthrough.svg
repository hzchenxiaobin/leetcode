<svg xmlns="http://www.w3.org/2000/svg" width="660" height="436" viewBox="0 0 660 436" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#446688"/></marker>
    <marker id="arred" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="660" height="436" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 2 演算：前 7 步均为骑士走法，第 8 步功亏一篑</text>
  <path d="M 160 42 Q 330 50 500 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 3x3 board: cell (r,c) -> rect(55+96c, 76+96r, 96, 96) -->
  <g filter="url(#sk)">
    <rect x="55" y="76" width="96" height="96" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="151" y="76" width="96" height="96" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="247" y="76" width="96" height="96" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="55" y="172" width="96" height="96" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="151" y="172" width="96" height="96" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="247" y="172" width="96" height="96" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="55" y="268" width="96" height="96" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="151" y="268" width="96" height="96" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="247" y="268" width="96" height="96" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>

  <!-- path arrows between cell centers -->
  <g stroke="#446688" stroke-width="1.6" fill="none">
    <path d="M 125.4 135.2 L 269.1 207.0" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 272.6 231.2 L 128.9 303.0" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 114.2 293.6 L 186.0 149.9" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 210.2 146.4 L 282.0 290.1" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 272.6 304.8 L 128.9 233.0" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 125.4 208.8 L 269.1 136.9" marker-end="url(#ar)" filter="url(#sk)"/>
    <path d="M 283.8 146.4 L 211.9 290.1" marker-end="url(#ar)" filter="url(#sk)"/>
  </g>
  <path d="M 199 289 L 199 252" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arred)" filter="url(#sk)"/>
  <text x="216" y="276" font-size="15" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>

  <!-- cell values & coords -->
  <g text-anchor="middle">
    <text x="103" y="133" font-size="24" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">0</text>
    <text x="103" y="157" font-size="10" fill="#4a7a3a" filter="url(#sk)">(0,0) 起点</text>
    <text x="199" y="133" font-size="24" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">3</text>
    <text x="199" y="157" font-size="10" fill="#446688" filter="url(#sk)">(0,1)</text>
    <text x="295" y="133" font-size="24" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">6</text>
    <text x="295" y="157" font-size="10" fill="#446688" filter="url(#sk)">(0,2)</text>
    <text x="103" y="229" font-size="24" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">5</text>
    <text x="103" y="253" font-size="10" fill="#446688" filter="url(#sk)">(1,0)</text>
    <text x="199" y="229" font-size="24" font-weight="bold" fill="#b85450" filter="url(#sk)">8</text>
    <text x="199" y="253" font-size="10" fill="#b85450" filter="url(#sk)">(1,1) 中心</text>
    <text x="295" y="229" font-size="24" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">1</text>
    <text x="295" y="253" font-size="10" fill="#446688" filter="url(#sk)">(1,2)</text>
    <text x="103" y="325" font-size="24" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">2</text>
    <text x="103" y="349" font-size="10" fill="#446688" filter="url(#sk)">(2,0)</text>
    <text x="199" y="325" font-size="24" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">7</text>
    <text x="199" y="349" font-size="10" fill="#446688" filter="url(#sk)">(2,1)</text>
    <text x="295" y="325" font-size="24" font-weight="bold" fill="#2c4a6e" filter="url(#sk)">4</text>
    <text x="295" y="349" font-size="10" fill="#446688" filter="url(#sk)">(2,2)</text>
  </g>

  <!-- right table -->
  <text x="505" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">逐步走查（按值 k 反查坐标）</text>
  <g font-size="11" text-anchor="middle">
    <g filter="url(#sk)"><rect x="372" y="80" width="264" height="21" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/></g>
    <text x="386" y="95" font-size="10.5" fill="#2c4a6e">k</text>
    <text x="448" y="95" font-size="10.5" fill="#2c4a6e">从 → 到</text>
    <text x="524" y="95" font-size="10.5" fill="#2c4a6e">(dr, dc)</text>
    <text x="585" y="95" font-size="10.5" fill="#2c4a6e">dr²+dc²</text>
    <text x="620" y="95" font-size="10.5" fill="#2c4a6e">判定</text>

    <g filter="url(#sk)"><rect x="372" y="103" width="264" height="20" rx="3" fill="#ffffff" stroke="#ddd" stroke-width="0.8"/></g>
    <text x="386" y="117" fill="#333">1</text><text x="448" y="117" fill="#333">(0,0)→(1,2)</text><text x="524" y="117" fill="#333">(1,2)</text><text x="585" y="117" fill="#333">5</text><text x="620" y="117" fill="#4a7a3a">✓</text>

    <g filter="url(#sk)"><rect x="372" y="125" width="264" height="20" rx="3" fill="#f4f8fd" stroke="#ddd" stroke-width="0.8"/></g>
    <text x="386" y="139" fill="#333">2</text><text x="448" y="139" fill="#333">(1,2)→(2,0)</text><text x="524" y="139" fill="#333">(1,−2)</text><text x="585" y="139" fill="#333">5</text><text x="620" y="139" fill="#4a7a3a">✓</text>

    <g filter="url(#sk)"><rect x="372" y="147" width="264" height="20" rx="3" fill="#ffffff" stroke="#ddd" stroke-width="0.8"/></g>
    <text x="386" y="161" fill="#333">3</text><text x="448" y="161" fill="#333">(2,0)→(0,1)</text><text x="524" y="161" fill="#333">(−2,1)</text><text x="585" y="161" fill="#333">5</text><text x="620" y="161" fill="#4a7a3a">✓</text>

    <g filter="url(#sk)"><rect x="372" y="169" width="264" height="20" rx="3" fill="#f4f8fd" stroke="#ddd" stroke-width="0.8"/></g>
    <text x="386" y="183" fill="#333">4</text><text x="448" y="183" fill="#333">(0,1)→(2,2)</text><text x="524" y="183" fill="#333">(2,1)</text><text x="585" y="183" fill="#333">5</text><text x="620" y="183" fill="#4a7a3a">✓</text>

    <g filter="url(#sk)"><rect x="372" y="191" width="264" height="20" rx="3" fill="#ffffff" stroke="#ddd" stroke-width="0.8"/></g>
    <text x="386" y="205" fill="#333">5</text><text x="448" y="205" fill="#333">(2,2)→(1,0)</text><text x="524" y="205" fill="#333">(−1,−2)</text><text x="585" y="205" fill="#333">5</text><text x="620" y="205" fill="#4a7a3a">✓</text>

    <g filter="url(#sk)"><rect x="372" y="213" width="264" height="20" rx="3" fill="#f4f8fd" stroke="#ddd" stroke-width="0.8"/></g>
    <text x="386" y="227" fill="#333">6</text><text x="448" y="227" fill="#333">(1,0)→(0,2)</text><text x="524" y="227" fill="#333">(−1,2)</text><text x="585" y="227" fill="#333">5</text><text x="620" y="227" fill="#4a7a3a">✓</text>

    <g filter="url(#sk)"><rect x="372" y="235" width="264" height="20" rx="3" fill="#ffffff" stroke="#ddd" stroke-width="0.8"/></g>
    <text x="386" y="249" fill="#333">7</text><text x="448" y="249" fill="#333">(0,2)→(2,1)</text><text x="524" y="249" fill="#333">(2,−1)</text><text x="585" y="249" fill="#333">5</text><text x="620" y="249" fill="#4a7a3a">✓</text>

    <g filter="url(#sk)"><rect x="372" y="257" width="264" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
    <text x="386" y="271" fill="#b85450" font-weight="bold">8</text><text x="448" y="271" fill="#b85450" font-weight="bold">(2,1)→(1,1)</text><text x="524" y="271" fill="#b85450" font-weight="bold">(−1,0)</text><text x="585" y="271" fill="#b85450" font-weight="bold">1</text><text x="620" y="271" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- conclusion box -->
  <g filter="url(#sk)">
    <rect x="372" y="292" width="264" height="66" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="504" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">第 8 步 (−1,0)：平方和 = 1 ≠ 5</text>
  <text x="504" y="337" text-anchor="middle" font-size="11.5" fill="#a07818">不是骑士走法 → return false</text>
  <text x="504" y="352" text-anchor="middle" font-size="10" fill="#a08840">(1,1) 是中心格，骑士进不去也出不来</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="55" y="388" width="581" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="345" y="410" text-anchor="middle" font-size="11.5" fill="#2e5e2e">事实上 3×3 棋盘上不存在任何有效巡视方案：中心格 (1,1) 的 8 个骑士邻居全部越界</text>
</svg>
