<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">两步比较出结果（字符串直接比）</text>
  <path d="M 130 40 Q 280 48 430 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 起点 -->
  <g filter="url(#sk)">
    <rect x="160" y="56" width="240" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="280" y="78" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">取端点 s₁, e₁, s₂, e₂（原字符串）</text>

  <path d="M 280 90 L 280 112" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 菱形 1 -->
  <g filter="url(#sk)">
    <polygon points="280,116 390,156 280,196 170,156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="280" y="161" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415" filter="url(#sk)">s₁ ≤ e₂ ?</text>

  <!-- 否分支 1 -->
  <path d="M 390 156 L 448 156" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="415" y="146" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="452" y="140" width="90" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="497" y="161" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">false</text>

  <!-- 是分支 1 -->
  <path d="M 280 196 L 280 220" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="298" y="212" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#sk)">是</text>

  <!-- 菱形 2 -->
  <g filter="url(#sk)">
    <polygon points="280,224 390,264 280,304 170,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="280" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6415" filter="url(#sk)">s₂ ≤ e₁ ?</text>

  <!-- 否分支 2 -->
  <path d="M 390 264 L 448 264" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="415" y="254" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="452" y="248" width="90" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="497" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#sk)">false</text>

  <!-- 是分支 2 -->
  <path d="M 280 304 L 280 328" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="298" y="320" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#sk)">是</text>

  <!-- true -->
  <g filter="url(#sk)">
    <rect x="225" y="332" width="110" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="280" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e5e22" filter="url(#sk)">true</text>

  <!-- 说明框 -->
  <g filter="url(#sk)">
    <rect x="40" y="378" width="480" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="280" y="400" text-anchor="middle" font-size="11.5" fill="#2b4a6e" filter="url(#sk)">HH:MM 定长零填充 ⟹ 字典序 = 时间序；两个方向对称覆盖，缺一不可</text>
</svg>
