<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="460" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：逐个补上 target[i] 之前的缺口</text>
  <text x="330" y="50" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">指针 cur 表示「流里下一个还没读的数」，缺口 [cur, x) 逐个 Push+Pop，再 Push x</text>

  <g filter="url(#sk)">
    <rect x="86" y="74" width="190" height="42" rx="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="86" y="128" width="190" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <polygon points="181,192 300,232 181,272 62,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="336" y="210" width="176" height="46" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="86" y="296" width="190" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <polygon points="181,352 306,392 181,432 56,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="424" y="370" width="180" height="44" rx="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>

  <g filter="url(#sk)" font-size="12" text-anchor="middle">
    <text x="181" y="100" fill="#2e5a24" font-weight="bold">cur = 1，ops = []</text>
    <text x="181" y="154" fill="#2b4a6e" font-weight="bold">取下一个 x = target[i]</text>
    <text x="181" y="228" fill="#8a6a20" font-weight="bold">cur &lt; x ？</text>
    <text x="181" y="248" fill="#8a6a20" font-size="10.5">（缺口里还有数）</text>
    <text x="424" y="228" fill="#8f3830" font-weight="bold">Push, Pop</text>
    <text x="424" y="246" fill="#8f3830" font-size="10.5">丢弃 cur，cur++</text>
    <text x="181" y="320" fill="#2b4a6e" font-weight="bold">Push；cur = x + 1</text>
    <text x="181" y="388" fill="#8a6a20" font-weight="bold">target 还有元素？</text>
    <text x="181" y="408" fill="#8a6a20" font-size="10.5">（i 是否走到末尾）</text>
    <text x="514" y="396" fill="#2e5a24" font-weight="bold">返回 ops</text>
  </g>

  <path d="M 181 116 L 181 126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 181 170 L 181 190" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 300 232 L 334 232" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="316" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#sk)">是</text>
  <path d="M 181 272 L 181 294" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="194" y="288" font-size="11" fill="#b85450" filter="url(#sk)">否</text>
  <path d="M 181 338 L 181 350" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <path d="M 306 392 L 422 392" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="363" y="384" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#sk)">否</text>

  <path d="M 424 210 L 424 188 Q 424 178 412 178 L 252 178 Q 240 178 240 190 L 240 172" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="334" y="172" text-anchor="middle" font-size="11" fill="#8f3830" filter="url(#sk)">缺口没补完，重复同一轮</text>

  <path d="M 56 392 L 40 392 Q 30 392 30 380 L 30 150 Q 30 140 42 140 L 82 140" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="42" y="376" font-size="11" fill="#2e5a24" filter="url(#sk)">是</text>

  <text x="330" y="446" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">每跳过 1 个整数恰好花 2 次操作，总操作数 = target.size() + 2 × 跳过的个数</text>
</svg>
