<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一次线性扫描，冲突就「改右端 + 跳一对」</text>

  <!-- 起点 -->
  <rect x="150" y="48" width="220" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="13" fill="#28415e" filter="url(#rough2)">i = 1，ans = 0</text>

  <path d="M260,86 L260,112" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1：i 是否越界 -->
  <polygon points="260,114 350,150 260,186 170,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">i ≥ n ?</text>
  <text x="260" y="164" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">（扫描结束？）</text>

  <path d="M350,150 L400,150 L400,222" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="140" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="330" y="224" width="140" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="248" text-anchor="middle" font-size="13" fill="#1c3a1c" filter="url(#rough2)">返回 ans</text>

  <path d="M260,186 L260,214" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="204" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 判定 2：冲突？ -->
  <polygon points="260,216 360,258 260,300 160,258" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="13" fill="#7a3030" filter="url(#rough2)">|w[i] − w[i−1]| ≤ 1 ?</text>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#7a3030" filter="url(#rough2)">（这对近似相等？）</text>

  <!-- 是：改 + 跳 -->
  <path d="M160,258 L84,258 L84,200" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="248" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="24" y="160" width="120" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="84" y="178" text-anchor="middle" font-size="12.5" fill="#28415e" filter="url(#rough2)">ans += 1</text>
  <text x="84" y="194" text-anchor="middle" font-size="12.5" fill="#28415e" filter="url(#rough2)">i += 2（跳过一对）</text>

  <!-- 否：前进 -->
  <path d="M360,258 L436,258 L436,200" fill="none" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="248" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="376" y="160" width="120" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="436" y="185" text-anchor="middle" font-size="12.5" fill="#28415e" filter="url(#rough2)">i += 1</text>

  <!-- 回到判定 1 -->
  <path d="M84,160 L84,120 L166,150" fill="none" stroke="#888" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M436,160 L436,120 L354,150" fill="none" stroke="#888" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="322" width="400" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">关键：改 w[i] 的新字符同时避开 w[i−1] 与 w[i+1]，</text>
  <text x="260" y="358" text-anchor="middle" font-size="12.5" fill="#7a5a10" filter="url(#rough2)">所以 (i, i+1) 必然安全，直接从 (i+1, i+2) 继续比较</text>
</svg>
