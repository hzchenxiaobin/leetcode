<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Z 函数：一遍线性扫描找出所有 border</text>
  <path d="M 140 44 Q 320 52 500 44" stroke="#333" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- definition box -->
  <g filter="url(#rough2)">
    <rect x="60" y="56" width="520" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="78" text-anchor="middle" font-size="13" fill="#2c4a66" font-weight="bold">z[i] ＝ s 与后缀 s[i:] 的最长公共前缀（LCP）长度</text>

  <!-- ===== left column: match demo ===== -->
  <text x="70" y="124" font-size="14" font-weight="bold" fill="#333">以 s ＝ "ababa"，i ＝ 2 为例：</text>

  <!-- s prefix row -->
  <text x="70" y="150" font-size="12" fill="#555">s 的开头：</text>
  <g filter="url(#rough2)">
    <rect x="150" y="134" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="188" y="134" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="226" y="134" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="167" y="152" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="205" y="152" text-anchor="middle" font-size="13" fill="#333">b</text>
  <text x="243" y="152" text-anchor="middle" font-size="13" fill="#333">a</text>

  <!-- equal signs -->
  <text x="167" y="178" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">＝</text>
  <text x="205" y="178" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">＝</text>
  <text x="243" y="178" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">＝</text>

  <!-- suffix row -->
  <text x="70" y="200" font-size="12" fill="#555">s[2:]＝"aba"：</text>
  <g filter="url(#rough2)">
    <rect x="150" y="184" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="188" y="184" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="226" y="184" width="34" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="167" y="202" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="205" y="202" text-anchor="middle" font-size="13" fill="#333">b</text>
  <text x="243" y="202" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="70" y="234" font-size="12" fill="#555">逐格相同，LCP ＝ 3 →</text>
  <text x="240" y="234" font-size="14" fill="#4a7a3a" font-weight="bold">z[2] ＝ 3</text>

  <!-- z array table -->
  <text x="70" y="268" font-size="14" font-weight="bold" fill="#333">z 数组：</text>
  <g filter="url(#rough2)">
    <rect x="70" y="280" width="70" height="26" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="140" y="280" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="184" y="280" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="228" y="280" width="44" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="272" y="280" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="316" y="280" width="44" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="70" y="306" width="70" height="26" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="140" y="306" width="44" height="26" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="184" y="306" width="44" height="26" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="228" y="306" width="44" height="26" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="272" y="306" width="44" height="26" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="316" y="306" width="44" height="26" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="105" y="298" text-anchor="middle" font-size="12" fill="#555">i</text>
  <text x="162" y="298" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="206" y="298" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="250" y="298" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="294" y="298" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="338" y="298" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="105" y="324" text-anchor="middle" font-size="12" fill="#555">z[i]</text>
  <text x="162" y="324" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="206" y="324" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="250" y="324" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="294" y="324" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="338" y="324" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="250" y="350" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">约定 z[0]＝n（整串）</text>

  <!-- ===== right column: border test ===== -->
  <g filter="url(#rough2)">
    <rect x="390" y="110" width="240" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="510" y="132" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">长度 d 的后缀是 border ⟺ z[n−d] ＝ d</text>

  <g filter="url(#rough2)">
    <rect x="390" y="152" width="60" height="26" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="450" y="152" width="100" height="26" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="550" y="152" width="80" height="26" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="390" y="178" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="450" y="178" width="100" height="24" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="550" y="178" width="80" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="390" y="202" width="60" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="450" y="202" width="100" height="24" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="550" y="202" width="80" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="390" y="226" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="450" y="226" width="100" height="24" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="550" y="226" width="80" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="390" y="250" width="60" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="450" y="250" width="100" height="24" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="550" y="250" width="80" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="390" y="274" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="450" y="274" width="100" height="24" rx="4" fill="#fffdf6" stroke="#999" stroke-width="1.2"/>
    <rect x="550" y="274" width="80" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="420" y="170" text-anchor="middle" font-size="12" fill="#555">d</text>
  <text x="500" y="170" text-anchor="middle" font-size="12" fill="#555">z[5−d]</text>
  <text x="590" y="170" text-anchor="middle" font-size="12" fill="#555">判定</text>
  <text x="420" y="195" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="500" y="195" text-anchor="middle" font-size="12" fill="#333">z[4]＝1</text>
  <text x="590" y="195" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ "a"</text>
  <text x="420" y="219" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="500" y="219" text-anchor="middle" font-size="12" fill="#333">z[3]＝1</text>
  <text x="590" y="219" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="420" y="243" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="500" y="243" text-anchor="middle" font-size="12" fill="#333">z[2]＝3</text>
  <text x="590" y="243" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ "aba"</text>
  <text x="420" y="267" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="500" y="267" text-anchor="middle" font-size="12" fill="#333">z[1]＝0</text>
  <text x="590" y="267" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="420" y="291" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="500" y="291" text-anchor="middle" font-size="12" fill="#333">自身</text>
  <text x="590" y="291" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ "ababa"</text>

  <!-- conclusion box -->
  <g filter="url(#rough2)">
    <rect x="390" y="312" width="240" height="74" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="510" y="338" text-anchor="middle" font-size="14" fill="#2e5b22" font-weight="bold">border 长度 ＝ {1, 3, 5}</text>
  <text x="510" y="360" text-anchor="middle" font-size="12" fill="#4a7a3a">对应 border 前缀：</text>
  <text x="510" y="378" text-anchor="middle" font-size="12" fill="#4a7a3a">"a"、"aba"、"ababa"</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="60" y="400" width="520" height="42" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="419" text-anchor="middle" font-size="12" fill="#8f3a35" font-weight="bold">注意：判定只看「z 值是否等于后缀长度」，一次 O(|s|) 扫描即可标记出全部 border，</text>
  <text x="320" y="436" text-anchor="middle" font-size="12" fill="#8f3a35" font-weight="bold">无需对每个长度单独比较（那样最坏 O(|s|²)，如 "aaaa"）。</text>
</svg>
