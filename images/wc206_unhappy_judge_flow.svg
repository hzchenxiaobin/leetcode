<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 664" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="664" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：rank / match 预处理 + 逐人判定</text>

  <rect x="150" y="38" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="59" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">开始：读入 preferences、pairs</text>

  <path d="M 260 70 L 260 82" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="140" y="86" width="240" height="44" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">① 建 rank 矩阵（O(n²)）</text>
  <text x="260" y="122" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">rank[x][preferences[x][r]] = r</text>

  <path d="M 260 130 L 260 142" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="140" y="146" width="240" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="165" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">② 建 match 数组（双向赋值）</text>
  <text x="260" y="180" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">match[xi]=yi；match[yi]=xi</text>

  <path d="M 260 186 L 260 198" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="150" y="202" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">③ 取下一个朋友 x</text>
  <text x="260" y="236" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">y ← match[x]</text>

  <path d="M 260 242 L 260 252" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="140" y="256" width="240" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">④ 取下一个候选 u</text>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">u ← preferences[x][r]，r &lt; rank[x][y]</text>
  <text x="260" y="304" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">v ← match[u]</text>

  <path d="M 260 308 L 260 320" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,322 424,372 260,422 96,372" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="366" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">u 也更喜欢 x 吗？</text>
  <text x="260" y="384" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">rank[u][x] &lt; rank[u][v] ？</text>

  <path d="M 260 422 L 260 436" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="271" y="434" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="155" y="440" width="210" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="463" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">x 不开心：ans + 1，break</text>

  <path d="M 260 476 L 260 526" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="271" y="504" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">break</text>

  <path d="M 424 372 L 48 372 L 48 283 L 134 283" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="436" y="362" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="52" y="338" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否，下一个 u</text>

  <path d="M 380 283 L 470 283 L 470 548 L 374 548" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="464" y="420" text-anchor="end" font-size="10.5" fill="#b07818" font-weight="bold" filter="url(#rough2)">u 用尽</text>

  <rect x="166" y="532" width="200" height="32" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="266" y="553" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">所有 x 都判定完？</text>

  <path d="M 166 548 L 24 548 L 24 222 L 144 222" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="28" y="262" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否，下一个 x</text>

  <path d="M 266 564 L 266 576" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="277" y="574" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="176" y="580" width="180" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="266" y="602" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <rect x="48" y="624" width="424" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="642" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">时间 O(n²)：预处理一趟 + 逐人判定；空间 O(n²)：rank 矩阵</text>
</svg>
