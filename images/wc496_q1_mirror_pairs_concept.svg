  <rect x="263" y="138" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="297" y="138" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="331" y="138" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="365" y="138" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="399" y="138" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="433" y="138" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="467" y="138" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">z</text>
  <text x="110" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">y</text>
  <text x="144" y="158" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">x</text>
  <text x="178" y="158" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">w</text>
  <text x="212" y="158" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">v</text>
  <text x="246" y="158" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">u</text>
  <text x="280" y="158" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">t</text>
  <text x="314" y="158" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">s</text>
  <text x="348" y="158" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">r</text>
  <text x="382" y="158" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">q</text>
  <text x="416" y="158" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">p</text>
  <text x="450" y="158" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">o</text>
  <text x="484" y="158" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">n</text>

  <text x="59" y="188" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">镜像端 z..n —— 只查频次，不会被枚举</text>

  <!-- 数字区 -->
  <text x="59" y="216" font-size="11.5" fill="#446688" filter="url(#rough2)">左端 0..4</text>

  <line x1="76" y1="254" x2="76" y2="300" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="110" y1="254" x2="110" y2="300" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="144" y1="254" x2="144" y2="300" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="178" y1="254" x2="178" y2="300" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="212" y1="254" x2="212" y2="300" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="281" font-size="10" fill="#999" filter="url(#rough2)">对折</text>

  <rect x="59" y="224" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="93" y="224" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="127" y="224" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="161" y="224" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="195" y="224" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">0</text>
  <text x="110" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="144" y="244" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <text x="178" y="244" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <text x="212" y="244" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">4</text>

  <rect x="59" y="300" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="93" y="300" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="127" y="300" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="161" y="300" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="195" y="300" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">9</text>
  <text x="110" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">8</text>
  <text x="144" y="320" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <text x="178" y="320" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="212" y="320" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">5</text>

  <text x="59" y="350" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">镜像 9..5</text>

  <!-- 说明框 -->
  <rect x="290" y="224" width="240" height="120" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="250" font-size="12" fill="#2d5a2d" filter="url(#rough2)">· 13 + 5 = 18 对，不重不漏</text>
  <text x="302" y="276" font-size="12" fill="#2d5a2d" filter="url(#rough2)">· 枚举左端 ⇒ 每对恰好一次</text>
  <text x="302" y="302" font-size="12" fill="#2d5a2d" filter="url(#rough2)">· 双零对 |0−0| = 0，免判断</text>
  <text x="302" y="328" font-size="12" fill="#2d5a2d" filter="url(#rough2)">→ 无需任何去重集合</text>

  <!-- 图例 -->
  <rect x="290" y="364" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="376" font-size="11" fill="#666" filter="url(#rough2)">示例 "ab1z9" 涉及的 4 对</text>
</svg>
