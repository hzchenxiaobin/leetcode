<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：36 个字符对折成 18 个互不相交的镜像对</text>

  <!-- 字母区 -->
  <text x="59" y="54" font-size="11.5" fill="#446688" filter="url(#rough2)">左端代表 a..m —— 枚举主体</text>

  <!-- 字母配对连线 -->
  <line x1="76" y1="92" x2="76" y2="138" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="110" y1="92" x2="110" y2="138" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="144" y1="92" x2="144" y2="138" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="178" y1="92" x2="178" y2="138" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="212" y1="92" x2="212" y2="138" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="246" y1="92" x2="246" y2="138" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="280" y1="92" x2="280" y2="138" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="314" y1="92" x2="314" y2="138" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="348" y1="92" x2="348" y2="138" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="382" y1="92" x2="382" y2="138" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="416" y1="92" x2="416" y2="138" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="450" y1="92" x2="450" y2="138" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="484" y1="92" x2="484" y2="138" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="512" y="119" font-size="10" fill="#999" filter="url(#rough2)">对折</text>

  <!-- 字母上行：左端代表 -->
  <rect x="59" y="62" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="93" y="62" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="127" y="62" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="161" y="62" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="195" y="62" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="229" y="62" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="263" y="62" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="297" y="62" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="331" y="62" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="365" y="62" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="399" y="62" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="433" y="62" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="467" y="62" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">a</text>
  <text x="110" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">b</text>
  <text x="144" y="82" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">c</text>
  <text x="178" y="82" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">d</text>
  <text x="212" y="82" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">e</text>
  <text x="246" y="82" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">f</text>
  <text x="280" y="82" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">g</text>
  <text x="314" y="82" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">h</text>
  <text x="348" y="82" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">i</text>
  <text x="382" y="82" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">j</text>
  <text x="416" y="82" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">k</text>
  <text x="450" y="82" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">l</text>
  <text x="484" y="82" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">m</text>

  <!-- 字母下行：镜像端 -->
  <rect x="59" y="138" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="93" y="138" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="127" y="138" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
