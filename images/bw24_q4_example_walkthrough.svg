<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：s = "1317", k = 2000 的 dp 表</text>

  <!-- dp 表 -->
  <g filter="url(#rough2)">
    <rect x="30" y="48" width="500" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="30" y="82" width="500" height="42" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2"/>
    <rect x="30" y="124" width="500" height="42" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2"/>
    <rect x="30" y="166" width="500" height="42" rx="4" fill="#fff" stroke="#446688" stroke-width="1.2"/>
    <rect x="30" y="208" width="500" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <line x1="150" y1="48" x2="150" y2="250" stroke="#446688" stroke-width="1"/>
    <line x1="400" y1="48" x2="400" y2="250" stroke="#446688" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-size="12.5" filter="url(#rough2)">
    <text x="90" y="69">下标 i</text><text x="275" y="69">候选首段（值 ≤ 2000）</text><text x="480" y="69">dp[i]</text>
    <text x="90" y="108">3</text><text x="275" y="108">"7" → dp[4]</text><text x="480" y="108">1</text>
    <text x="90" y="150">2</text><text x="275" y="150">"1"→dp[3]，"17"→dp[4]</text><text x="480" y="150">2</text>
    <text x="90" y="192">1</text><text x="275" y="192">"3"→dp[2]，"31"→dp[3]，"317"→dp[4]</text><text x="480" y="192">4</text>
    <text x="90" y="234" fill="#8a6d1a">0</text><text x="275" y="234" fill="#8a6d1a">"1"→dp[1]，"13"→dp[2]，"131"→dp[3]，"1317"→dp[4]</text><text x="480" y="234" fill="#b85450">8</text>
  </g>

  <!-- 锚点 -->
  <text x="90" y="270" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">dp[4] = 1（空后缀：一种「不切」方案）</text>

  <!-- 反例 -->
  <g filter="url(#rough2)">
    <rect x="70" y="286" width="420" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="280" y="309" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">反例 s="1000", k=10：中间三处段首都是 0 → dp 全 0 → 答案 0</text>
</svg>
