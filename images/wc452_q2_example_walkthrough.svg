<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
  </defs>
  <rect width="940" height="520" fill="#fdfcf7"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例 3 演算：grid = [[1, −2, 3], [2, 3, 5]]，k = 2 → ans = [[1, 2]]</text>
  <path d="M 200 42 Q 470 50 740 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1: window (0,0) ===== -->
  <text x="70" y="78" font-size="13" font-weight="bold" fill="#2b6e9e">① 窗口 (0, 0)：覆盖列 0–1，无重复值，一路顺畅</text>

  <g font-size="13" fill="#333" text-anchor="middle">
    <g filter="url(#sk)"><rect x="80" y="96" width="48" height="38" fill="#f7f5ee" stroke="#999" stroke-width="1.1" rx="4"/></g>
    <text x="104" y="120">1</text>
    <g filter="url(#sk)"><rect x="128" y="96" width="48" height="38" fill="#f7f5ee" stroke="#999" stroke-width="1.1" rx="4"/></g>
    <text x="152" y="120">−2</text>
    <g filter="url(#sk)"><rect x="176" y="96" width="48" height="38" fill="#f7f5ee" stroke="#999" stroke-width="1.1" rx="4"/></g>
    <text x="200" y="120">3</text>
    <g filter="url(#sk)"><rect x="80" y="134" width="48" height="38" fill="#f7f5ee" stroke="#999" stroke-width="1.1" rx="4"/></g>
    <text x="104" y="158">2</text>
    <g filter="url(#sk)"><rect x="128" y="134" width="48" height="38" fill="#f7f5ee" stroke="#999" stroke-width="1.1" rx="4"/></g>
    <text x="152" y="158">3</text>
    <g filter="url(#sk)"><rect x="176" y="134" width="48" height="38" fill="#f7f5ee" stroke="#999" stroke-width="1.1" rx="4"/></g>
    <text x="200" y="158">5</text>
  </g>
  <g filter="url(#sk)"><rect x="77" y="93" width="102" height="82" fill="none" stroke="#4a8edb" stroke-width="2.2" rx="4"/></g>
  <text x="128" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">窗口 (0, 0)</text>

  <path d="M 226,137 L 246,137" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="250" y="115" width="150" height="44" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="8"/></g>
  <text x="325" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">收集 {1, −2, 2, 3}</text>
  <text x="325" y="151" text-anchor="middle" font-size="10" fill="#666">共 k² = 4 个值</text>

  <path d="M 402,137 L 426,137" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="430" y="115" width="170" height="44" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="8"/></g>
  <text x="515" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">排序 [−2, 1, 2, 3]</text>
  <text x="515" y="151" text-anchor="middle" font-size="10" fill="#666">无重复，unique 不变</text>

  <path d="M 602,137 L 621,137" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="625" y="115" width="150" height="44" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="8"/></g>
  <text x="700" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">相邻差 3, 1, 1</text>
  <text x="700" y="151" text-anchor="middle" font-size="10" fill="#666">min 在相邻对中取</text>

  <path d="M 777,137 L 796,137" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="800" y="115" width="115" height="44" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="8"/></g>
  <text x="857" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">min = 1 ✓</text>

  <!-- ===== Panel 2: window (0,1) ===== -->
  <text x="70" y="242" font-size="13" font-weight="bold" fill="#7a5415">② 窗口 (0, 1)：覆盖列 1–2，3 出现两次 —— 踩坑现场</text>

  <g font-size="13" fill="#333" text-anchor="middle">
    <g filter="url(#sk)"><rect x="80" y="260" width="48" height="38" fill="#f7f5ee" stroke="#999" stroke-width="1.1" rx="4"/></g>
    <text x="104" y="284">1</text>
    <g filter="url(#sk)"><rect x="128" y="260" width="48" height="38" fill="#f7f5ee" stroke="#999" stroke-width="1.1" rx="4"/></g>
    <text x="152" y="284">−2</text>
    <g filter="url(#sk)"><rect x="176" y="260" width="48" height="38" fill="#f7f5ee" stroke="#999" stroke-width="1.1" rx="4"/></g>
    <text x="200" y="284">3</text>
    <g filter="url(#sk)"><rect x="80" y="298" width="48" height="38" fill="#f7f5ee" stroke="#999" stroke-width="1.1" rx="4"/></g>
    <text x="104" y="322">2</text>
    <g filter="url(#sk)"><rect x="128" y="298" width="48" height="38" fill="#f7f5ee" stroke="#999" stroke-width="1.1" rx="4"/></g>
    <text x="152" y="322">3</text>
    <g filter="url(#sk)"><rect x="176" y="298" width="48" height="38" fill="#f7f5ee" stroke="#999" stroke-width="1.1" rx="4"/></g>
    <text x="200" y="322">5</text>
  </g>
  <g filter="url(#sk)"><rect x="125" y="257" width="102" height="82" fill="none" stroke="#c98a2b" stroke-width="2.2" rx="4"/></g>
  <text x="176" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">窗口 (0, 1)</text>

  <path d="M 230,299 L 246,299" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="250" y="277" width="170" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" rx="8"/></g>
  <text x="335" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">收集 {−2, 3, 3, 5}</text>
  <text x="335" y="313" text-anchor="middle" font-size="10" fill="#8a6d3b">3 出现了两次！</text>

  <path d="M 422,299 L 436,299" stroke="#c98a2b" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="440" y="277" width="170" height="44" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.3" rx="8"/></g>
  <text x="525" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">排序 [−2, 3, 3, 5]</text>
  <text x="525" y="313" text-anchor="middle" font-size="10" fill="#8a6d3b">两个 3 紧挨着</text>

  <path d="M 612,299 L 626,299" stroke="#b03a3a" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="630" y="277" width="170" height="44" fill="#fce4ec" stroke="#b03a3a" stroke-width="1.5" rx="8"/></g>
  <text x="715" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#b03a3a">相邻差 5, 0, 2</text>
  <text x="715" y="313" text-anchor="middle" font-size="10" fill="#b03a3a">❌ 0 是假答案！</text>

  <path d="M 715,325 C 620,352 450,350 345,356" stroke="#b03a3a" stroke-width="1.4" stroke-dasharray="5 3" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="530" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">3 与 3 是同一个值，先去重！</text>

  <g filter="url(#sk)"><rect x="250" y="360" width="170" height="44" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="8"/></g>
  <text x="335" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">去重 [−2, 3, 5]</text>

  <path d="M 422,382 L 436,382" stroke="#4a8edb" stroke-width="1.6" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="440" y="360" width="170" height="44" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3" rx="8"/></g>
  <text x="525" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">相邻差 5, 2</text>

  <path d="M 612,382 L 626,382" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="630" y="360" width="170" height="44" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6" rx="8"/></g>
  <text x="715" y="387" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">min = 2 ✓</text>

  <!-- ===== bottom note ===== -->
  <g filter="url(#sk)"><rect x="50" y="432" width="840" height="70" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3" rx="8"/></g>
  <text x="70" y="456" font-size="11" fill="#b03a3a">⚠ 若不去重，窗口 (0, 1) 会错误输出 0 —— 两个 3 不构成「不同值」数对，去重是本题唯一的坑。</text>
  <text x="70" y="484" font-size="11" fill="#555">k = 1 时每个窗口只有 1 个值，落进「只剩 1 个值」分支，ans 全为 0（示例 2 的情形）。</text>
</svg>
