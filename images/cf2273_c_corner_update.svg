<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">矩形加 x：C 只在 4 个角上变化</text>

  <!-- 列号 -->
  <text x="90" y="94" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <text x="130" y="94" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <text x="170" y="94" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">3</text>
  <text x="210" y="94" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">4</text>
  <text x="250" y="94" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">5</text>
  <text x="290" y="94" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">6</text>
  <!-- 行号 -->
  <text x="58" y="124" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <text x="58" y="164" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <text x="58" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">3</text>
  <text x="58" y="244" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">4</text>
  <text x="58" y="284" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">5</text>
  <text x="58" y="324" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">6</text>

  <!-- 6x6 网格 -->
  <rect x="70" y="100" width="240" height="240" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <path d="M110,100 L110,340 M150,100 L150,340 M190,100 L190,340 M230,100 L230,340 M270,100 L270,340"
        stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M70,140 L310,140 M70,180 L310,180 M70,220 L310,220 M70,260 L310,260 M70,300 L310,300"
        stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- 被更新的子矩阵 [2..4] x [2..5] -->
  <rect x="110" y="140" width="160" height="120" fill="#fff8e1" fill-opacity="0.9"
        stroke="#d6a040" stroke-width="2" stroke-dasharray="7 4" rx="3" filter="url(#rough2)"/>
  <text x="190" y="206" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">子矩阵</text>
  <text x="190" y="224" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">a += x</text>

  <!-- 四个角 -->
  <circle cx="110" cy="140" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="145" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">1</text>
  <circle cx="270" cy="140" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="145" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">2</text>
  <circle cx="110" cy="260" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="265" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">3</text>
  <circle cx="270" cy="260" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="265" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">4</text>

  <!-- 右侧说明 -->
  <rect x="330" y="100" width="368" height="240" fill="#fffdf6" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="348" y="126" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">四次点更新（越界的角直接跳过）</text>
  <text x="348" y="158" font-size="12" fill="#8a3030" filter="url(#rough2)">① (r1, c1) → C −= x</text>
  <text x="348" y="186" font-size="12" fill="#33502a" filter="url(#rough2)">② (r1, c2+1) → C += x</text>
  <text x="348" y="214" font-size="12" fill="#33502a" filter="url(#rough2)">③ (r2+1, c1) → C += x</text>
  <text x="348" y="242" font-size="12" fill="#8a3030" filter="url(#rough2)">④ (r2+1, c2+1) → C −= x</text>
  <text x="348" y="276" font-size="11.5" fill="#555" filter="url(#rough2)">· i &lt; 2 或 j &lt; 2：不在 C 的定义域</text>
  <text x="348" y="300" font-size="11.5" fill="#555" filter="url(#rough2)">· i &gt; n 或 j &gt; n：落在矩阵外</text>
  <text x="348" y="324" font-size="11.5" fill="#555" filter="url(#rough2)">· 只有 0 ↔ 非 0 改变时才更新 BIT</text>

  <!-- 结论 -->
  <text x="40" y="370" font-size="12" fill="#333" filter="url(#rough2)">D = b − a 在矩形内整体减 x，而 C 是 D 的二阶差分：矩形指示函数的双差分只剩这 4 个角。</text>

</svg>
