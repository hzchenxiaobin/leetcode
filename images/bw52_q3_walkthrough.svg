    <text x="513" y="210">#</text><text x="543" y="210">.</text><text x="573" y="210">*</text>
    <text x="513" y="240">#</text><text x="543" y="240">.</text><text x="573" y="240">.</text>
  </g>
  <text x="560" y="278" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">res[j][m−1−i] = box[i][j]</text>

  <!-- 说明 -->
  <rect x="40" y="310" width="270" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="332" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">第一、二行本就"落稳"：</text>
  <text x="56" y="350" font-size="11" fill="#3a4a66" filter="url(#rough2)">石头已靠在障碍物/相邻石头上。</text>

  <rect x="330" y="310" width="250" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="346" y="332" font-size="11" fill="#2f5226" font-weight="bold" filter="url(#rough2)">旋转后矩阵的第 j 行 =</text>
  <text x="346" y="350" font-size="11" fill="#2f5226" filter="url(#rough2)">落石后矩阵第 j 列自下而上读出。</text>

  <text x="310" y="400" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">与官方输出 [[&#34;.&#34;,&#34;#&#34;,&#34;#&#34;],[&#34;.&#34;,&#34;#&#34;,&#34;#&#34;],[&#34;#&#34;,&#34;#&#34;,&#34;*&#34;],[&#34;#&#34;,&#34;*&#34;,&#34;.&#34;],[&#34;#&#34;,&#34;.&#34;,&#34;*&#34;],[&#34;#&#34;,&#34;.&#34;,&#34;.&#34;]] 逐格一致 ✓</text>
</svg>
