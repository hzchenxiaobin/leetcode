    <rect x="560" y="132" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="500" y="162" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="530" y="162" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="560" y="162" width="26" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="500" y="192" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="530" y="192" width="26" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="560" y="192" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <rect x="500" y="222" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="530" y="222" width="26" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="560" y="222" width="26" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/>
