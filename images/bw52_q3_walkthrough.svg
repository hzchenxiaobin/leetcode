  <g font-size="12" text-anchor="middle" fill="#333" font-weight="bold" filter="url(#rough2)">
    <text x="513" y="90">.</text><text x="543" y="90">#</text><text x="573" y="90">#</text>
    <text x="513" y="120">.</text><text x="543" y="120">#</text><text x="573" y="120">#</text>
