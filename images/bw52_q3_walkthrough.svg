    <text x="283" y="150">.</text><text x="313" y="150">.</text><text x="343" y="150" fill="#2f5226">#</text><text x="373" y="150" fill="#2f5226">#</text><text x="403" y="150" fill="#2f5226">#</text><text x="433" y="150" fill="#2f5226">#</text>
  </g>
  <text x="345" y="176" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">第三行 4 个石头整体右滑两格（绿）</text>

  <path d="M 458 118 L 486 118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 旋转后 6×3 -->
  <text x="560" y="62" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">旋转后（n×m）</text>
  <g filter="url(#rough2)">
