<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="580" height="370" fill="#fafafa"/>
  <text x="290" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：逐行求和，O(n²)</text>

  <!-- 开始 -->
  <rect x="185" y="48" width="190" height="34" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">读入 n×n 邻接矩阵</text>
  <path d="M280,82 L280,98" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="195" y="100" width="170" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans ← 空数组，i ← 0</text>
  <path d="M280,130 L280,146" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="280,150 370,190 280,230 190,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="13" fill="#8a6a1f" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 否：返回 -->
  <path d="M190,190 L118,190" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="180" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="18" y="173" width="98" height="34" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="67" y="195" text-anchor="middle" font-size="13" fill="#2d5a2d" filter="url(#rough2)">返回 ans</text>

  <!-- 是：行求和 -->
  <path d="M370,190 L396,190" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="400" y="172" width="160" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="195" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ans[i] ← 第 i 行求和</text>
  <path d="M480,208 L480,230" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i 自增 -->
  <rect x="425" y="232" width="110" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i ← i + 1</text>

  <!-- 回到菱形底部 -->
  <path d="M480,262 L480,295 L280,295 L280,233" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 小贴士 -->
  <rect x="25" y="245" width="250" height="100" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="150" y="272" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">Python 一行：</text>
  <text x="150" y="296" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">[sum(row) for row in matrix]</text>
  <text x="150" y="322" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">时间 O(n²) = 输入规模，已最优</text>
</svg>
