<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">删一条边：一棵子树 vs 剩下的部分</text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">设被删边下方那棵子树的根为 v，子树和为 s；整棵树的总和为 S</text>

  <!-- 左侧子树高亮区域 -->
  <rect x="104" y="136" width="170" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"
        stroke-dasharray="6 4" rx="10" opacity="0.75" filter="url(#rough2)"/>
  <text x="177" y="266" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">s = 11</text>

  <!-- 树：1(2(4,5),3(6)) -->
  <path d="M 280 110 L 190 148" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 110 L 370 148" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 190 174 L 140 212" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 190 174 L 240 212" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 370 174 L 410 212" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="263" y="86" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="280" y="103" fill="#3a4a66">1</text>
    <rect x="173" y="148" width="34" height="24" fill="#dff0e2" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="190" y="165" fill="#3a5a30">2</text>
    <rect x="353" y="148" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="370" y="165" fill="#3a4a66">3</text>
    <rect x="123" y="212" width="34" height="24" fill="#dff0e2" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="140" y="229" fill="#3a5a30">4</text>
    <rect x="223" y="212" width="34" height="24" fill="#dff0e2" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="240" y="229" fill="#3a5a30">5</text>
    <rect x="393" y="212" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="410" y="229" fill="#3a4a66">6</text>
  </g>

  <text x="420" y="252" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">其余部分 S − s = 10</text>
  <text x="292" y="130" font-size="10" fill="#b85450" filter="url(#rough2)">cut</text>

  <rect x="80" y="280" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">删边后乘积 = s × (S − s)，此处 11 × 10 = 110</text>

  <text x="280" y="338" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">f(s) = s·(S − s) 是凹函数，s 越接近 S/2 乘积越大</text>
  <text x="280" y="356" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">但 s 只能取到「某棵子树的和」，直接枚举全部 n−1 个候选即可</text>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意：先比较大小，最后才做 mod (10^9+7)</text>
</svg>
