<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="390" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">为什么候选只有这些：不在边界出现的值，频次全由中间块段决定</text>
  <rect x="50" y="70" width="600" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="96" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">设 v 不在左右边界出现，则 freq(l, r, v) = freq(中间块段, v)</text>
  <text x="350" y="122" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">而中间块段众数 m 的频次 ≥ 任何值在中间块段的频次</text>
  <text x="350" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">⇒ 只要 m 的频次 ≥ threshold，它就不比任何非边界值差</text>
  <rect x="50" y="178" width="600" height="78" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">边界值可能「额外」出现，把频次抬高到能达标：必须单独检查</text>
  <text x="350" y="230" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">边界总长度 ≤ 2B，去重后候选 ≤ 2B + 1 个</text>
  <rect x="50" y="272" width="600" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="298" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">逐个候选 c：freq = upper_bound(pos[c], r) − lower_bound(pos[c], l)</text>
  <text x="350" y="324" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">保留 freq ≥ threshold 的候选，按 (freq 降序, 值升序) 取第一个</text>
  <text x="350" y="350" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">复杂度 O((n/B)·n + q·B·log n)，取 B ≈ 64</text>
</svg>
