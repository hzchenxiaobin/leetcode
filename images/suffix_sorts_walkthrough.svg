<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="660" height="400" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：从右往左扫描（示例 2）</text>
  <path d="M 140 36 Q 330 44 520 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="330" y="52" text-anchor="middle" font-size="12" fill="#666">nums ＝ [1,5,6,4,6]，target ＝ [1,5,6,6,4]，m ＝ 3（下标 3 首次失配：4 ≠ 6）</text>

  <g filter="url(#sk)">
    <rect x="18" y="62" width="606" height="28" fill="#f4f0e6" stroke="#9a8a5a" stroke-width="1.2"/>
    <rect x="18" y="90" width="606" height="34" fill="#ffffff" stroke="#b8b0a0" stroke-width="0.8"/>
    <rect x="18" y="124" width="606" height="34" fill="#e6f4ea" stroke="#b8b0a0" stroke-width="0.8"/>
    <rect x="18" y="158" width="606" height="34" fill="#e6f4ea" stroke="#b8b0a0" stroke-width="0.8"/>
    <rect x="18" y="192" width="606" height="34" fill="#ffffff" stroke="#b8b0a0" stroke-width="0.8"/>
    <rect x="18" y="226" width="606" height="34" fill="#ffffff" stroke="#b8b0a0" stroke-width="0.8"/>
    <path d="M 62 62 L 62 260 M 148 62 L 148 260 M 234 62 L 234 260 M 404 62 L 404 260 M 454 62 L 454 260 M 540 62 L 540 260" stroke="#b8b0a0" stroke-width="0.8" fill="none"/>
    <rect x="18" y="62" width="606" height="198" fill="none" stroke="#9a8a5a" stroke-width="1.6"/>
  </g>

  <text x="40" y="80" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">i</text>
  <text x="105" y="80" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">放入 nums[i]</text>
  <text x="191" y="80" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">取出 target[i]</text>
  <text x="319" y="80" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">桶频差 cnt</text>
  <text x="429" y="80" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">bad</text>
  <text x="497" y="80" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">nonincr</text>
  <text x="582" y="80" text-anchor="middle" font-size="12" fill="#6a5a2a" font-weight="bold">计入答案</text>

  <text x="40" y="111" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="105" y="111" text-anchor="middle" font-size="12" fill="#2b6e9e">+6</text>
  <text x="191" y="111" text-anchor="middle" font-size="12" fill="#b85450">−4</text>
  <text x="319" y="111" text-anchor="middle" font-size="12" fill="#333">6:+1，4:−1</text>
  <text x="429" y="111" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="497" y="111" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓</text>
  <text x="582" y="111" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ i&gt;m</text>

  <text x="40" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="105" y="145" text-anchor="middle" font-size="12" fill="#2b6e9e">+4</text>
  <text x="191" y="145" text-anchor="middle" font-size="12" fill="#b85450">−6</text>
  <text x="319" y="145" text-anchor="middle" font-size="12" fill="#2e6e2e">全部归零</text>
  <text x="429" y="145" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">0</text>
  <text x="497" y="145" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓</text>
  <text x="582" y="145" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">✓</text>

  <text x="40" y="179" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="105" y="179" text-anchor="middle" font-size="12" fill="#2b6e9e">+6</text>
  <text x="191" y="179" text-anchor="middle" font-size="12" fill="#b85450">−6</text>
  <text x="319" y="179" text-anchor="middle" font-size="12" fill="#2e6e2e">全部归零</text>
  <text x="429" y="179" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">0</text>
  <text x="497" y="179" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">✓（6≥6）</text>
  <text x="582" y="179" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">✓</text>

  <text x="40" y="213" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="105" y="213" text-anchor="middle" font-size="12" fill="#2b6e9e">+5</text>
  <text x="191" y="213" text-anchor="middle" font-size="12" fill="#b85450">−5</text>
  <text x="319" y="213" text-anchor="middle" font-size="12" fill="#2e6e2e">全部归零</text>
  <text x="429" y="213" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">0</text>
  <text x="497" y="213" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 5&lt;6</text>
  <text x="582" y="213" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <text x="40" y="247" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="105" y="247" text-anchor="middle" font-size="12" fill="#2b6e9e">+1</text>
  <text x="191" y="247" text-anchor="middle" font-size="12" fill="#b85450">−1</text>
  <text x="319" y="247" text-anchor="middle" font-size="12" fill="#2e6e2e">全部归零</text>
  <text x="429" y="247" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">0</text>
  <text x="497" y="247" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="582" y="247" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <g filter="url(#sk)">
    <rect x="30" y="286" width="600" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="330" y="312" text-anchor="middle" font-size="13" fill="#8a6415" font-weight="bold">答案 ＝ 2：i ＝ 2、3 时「i ≤ m、bad ＝ 0、nonincr」同时成立</text>
  <text x="330" y="334" text-anchor="middle" font-size="12" fill="#8a6415">i ＝ 1 处 bad 已归零、前缀也匹配，但 target[1]＝5 ＜ target[2]＝6 破坏非递增</text>
  <text x="330" y="356" text-anchor="middle" font-size="12" fill="#8a6415">—— 内容对了，形状不对：多重集相同 ≠ 排序后相等（nonincr 一旦变假不再恢复）</text>
</svg>
