<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：四组输入的计算过程</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="26" y="48" width="508" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="70" y="70" fill="#446688">x（75 枚数）</text>
    <text x="170" y="70" fill="#446688">y（10 枚数）</text>
    <text x="272" y="70" fill="#446688">⌊y / 4⌋</text>
    <text x="372" y="70" fill="#446688">T = min(x, ⌊y/4⌋)</text>
    <text x="484" y="70" fill="#446688">赢家</text>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="26" y="86" width="508" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="70" y="108">2</text><text x="170" y="108">7</text><text x="272" y="108">1</text>
    <text x="372" y="108" font-weight="bold">1</text><text x="484" y="108" fill="#4a7a3a" font-weight="bold">Alice</text>

    <rect x="26" y="124" width="508" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="70" y="146">4</text><text x="170" y="146">11</text><text x="272" y="146">2</text>
    <text x="372" y="146" font-weight="bold">2</text><text x="484" y="146" fill="#b85450" font-weight="bold">Bob</text>

    <rect x="26" y="162" width="508" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="70" y="184">1</text><text x="170" y="184">4</text><text x="272" y="184">1</text>
    <text x="372" y="184" font-weight="bold">1</text><text x="484" y="184" fill="#4a7a3a" font-weight="bold">Alice</text>

    <rect x="26" y="200" width="508" height="34" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="6"/>
    <text x="70" y="222">1</text><text x="170" y="222">3</text><text x="272" y="222">0</text>
    <text x="372" y="222" font-weight="bold">0</text><text x="484" y="222" fill="#b85450" font-weight="bold">Bob</text>
  </g>

  <g filter="url(#rough2)" font-size="12">
    <rect x="26" y="250" width="508" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="42" y="274" fill="#a06c10">第 2 行：4 枚 75、11 枚 10 → 10 枚只够 2 轮（⌊11/4⌋ = 2），T = 2，Bob 胜</text>
    <text x="42" y="296" fill="#a06c10">第 4 行：10 枚不足 4 枚 → T = 0，先手 Alice 立刻无法操作，Bob 胜</text>
  </g>
</svg>
