<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="600" height="380" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 与示例 2 的判定过程</text>
  <rect x="24" y="60" width="268" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="158" y="80" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 1：正方形四点</text>
  <rect x="310" y="60" width="266" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="443" y="80" text-anchor="middle" font-size="10" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">示例 2：三点 (0,0),(0,1),(10,0)</text>
  <rect x="24" y="98" width="268" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="42" y="122" text-anchor="start" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">四条边长 2，两条对角线 4</text>
  <text x="42" y="146" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">D=2：无边 → 二分图 ✓</text>
  <text x="42" y="168" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">D=4：4-环 → 二分图 ✓</text>
  <text x="42" y="194" text-anchor="start" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">答案 4（候选最大）</text>
  <rect x="310" y="98" width="266" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="328" y="122" text-anchor="start" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">距离：1、10、11</text>
  <text x="328" y="146" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">D=10：只有边 1 → ✓</text>
  <text x="328" y="168" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">D=11：边 1、10 成链 → ✓</text>
  <text x="328" y="194" text-anchor="start" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">答案 11（候选最大）</text>
  <rect x="24" y="244" width="552" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="42" y="268" text-anchor="start" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">关键实现细节</text>
  <text x="42" y="292" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">1) 判定用 dist &lt; D（严格小于），否则答案偏大</text>
  <text x="42" y="314" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">2) n == 2 特判返回 0（唯一划分没有组内点对）</text>
  <text x="42" y="334" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">3) 候选集必须包含 0（所有点重合时答案为 0）</text>
</svg>
