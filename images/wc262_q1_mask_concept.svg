<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#fafafa"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：按值聚合 —— 归属用 3 位掩码登记</text>
  <path d="M 240 42 Q 450 50 660 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="450" y="62" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">判定维度是「出现在哪几个数组」，不是「出现几次」；位或幂等，重复元素天然无害</text>

  <!-- left: three arrays -->
  <text x="40" y="88" font-size="12" font-weight="bold" fill="#666" filter="url(#rough2)">三个数组（示例 1 · 视作集合）</text>

  <g filter="url(#rough2)">
    <rect x="100" y="100" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="140" y="100" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"/>
    <rect x="180" y="100" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="220" y="100" width="36" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="118" y="118" text-anchor="middle" font-size="12" fill="#2b4666" filter="url(#rough2)">1</text>
  <text x="158" y="118" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="198" y="118" text-anchor="middle" font-size="12" fill="#2b4666" filter="url(#rough2)">3</text>
  <text x="238" y="118" text-anchor="middle" font-size="12" fill="#2b4666" filter="url(#rough2)">2</text>
  <text x="40" y="118" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">nums1</text>
  <text x="300" y="118" font-size="11" fill="#446688" filter="url(#rough2)">→ bit0</text>

  <g filter="url(#rough2)">
    <rect x="100" y="136" width="36" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="140" y="136" width="36" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="118" y="154" text-anchor="middle" font-size="12" fill="#3a5c2e" filter="url(#rough2)">2</text>
  <text x="158" y="154" text-anchor="middle" font-size="12" fill="#3a5c2e" filter="url(#rough2)">3</text>
  <text x="40" y="154" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">nums2</text>
  <text x="300" y="154" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→ bit1</text>

  <g filter="url(#rough2)">
    <rect x="100" y="172" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="118" y="190" text-anchor="middle" font-size="12" fill="#7a5c14" filter="url(#rough2)">3</text>
  <text x="40" y="190" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">nums3</text>
  <text x="300" y="190" font-size="11" fill="#d6a040" filter="url(#rough2)">→ bit2</text>

  <text x="40" y="222" font-size="10" fill="#b85450" filter="url(#rough2)">红虚线格：nums1 里重复的 1 —— 第二次 |= 001 幂等，无变化</text>

  <!-- arrows to table -->
  <path d="M 335 113 Q 400 100 456 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 250 149 Q 360 150 456 162" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 170 185 Q 320 180 456 194" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- right: mask table -->
  <text x="655" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#666" filter="url(#rough2)">按值聚合：mask[v]（高位在左）</text>

  <g filter="url(#rough2)">
    <rect x="460" y="96" width="52" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="512" y="96" width="42" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="554" y="96" width="42" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="596" y="96" width="42" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="638" y="96" width="64" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="702" y="96" width="64" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="766" y="96" width="90" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="486" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">值 v</text>
  <text x="533" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">b₂</text>
  <text x="575" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">b₁</text>
  <text x="617" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">b₀</text>
  <text x="670" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">掩码</text>
  <text x="734" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">popcount</text>
  <text x="811" y="112" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">判定</text>

  <g filter="url(#rough2)">
    <rect x="460" y="120" width="52" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="512" y="120" width="42" height="26" rx="3" fill="#fafafa" stroke="#ccc" stroke-width="1.2"/>
    <rect x="554" y="120" width="42" height="26" rx="3" fill="#fafafa" stroke="#ccc" stroke-width="1.2"/>
    <rect x="596" y="120" width="42" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="638" y="120" width="64" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="702" y="120" width="64" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="766" y="120" width="90" height="26" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="486" y="138" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="533" y="138" text-anchor="middle" font-size="11.5" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="575" y="138" text-anchor="middle" font-size="11.5" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="617" y="138" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="670" y="138" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">001</text>
  <text x="734" y="138" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="811" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 落选</text>

  <g filter="url(#rough2)">
    <rect x="460" y="146" width="52" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="512" y="146" width="42" height="26" rx="3" fill="#fafafa" stroke="#ccc" stroke-width="1.2"/>
    <rect x="554" y="146" width="42" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="596" y="146" width="42" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="638" y="146" width="64" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="702" y="146" width="64" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="766" y="146" width="90" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="486" y="164" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="533" y="164" text-anchor="middle" font-size="11.5" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="575" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="617" y="164" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="670" y="164" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">011</text>
  <text x="734" y="164" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="811" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 入选</text>

  <g filter="url(#rough2)">
    <rect x="460" y="172" width="52" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="512" y="172" width="42" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="554" y="172" width="42" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="596" y="172" width="42" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="638" y="172" width="64" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="702" y="172" width="64" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="766" y="172" width="90" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="486" y="190" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="533" y="190" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">1</text>
  <text x="575" y="190" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="617" y="190" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="670" y="190" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">111</text>
  <text x="734" y="190" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="811" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 入选</text>

  <text x="655" y="224" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">1：出现两次 ≠ 两个归属，popcount = 1 → 落选</text>
  <text x="655" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3：三个数组全中，popcount = 3 ≥ 2 → 入选（「至少」含上界）</text>

  <!-- observation cards -->
  <g filter="url(#rough2)">
    <rect x="35" y="264" width="270" height="176" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="315" y="264" width="270" height="176" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="595" y="264" width="270" height="176" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="170" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">① 归属 ≠ 次数</text>
  <text x="52" y="320" font-size="11.5" fill="#333" filter="url(#rough2)">· 「至少在两个数组」按归属计数</text>
  <text x="52" y="340" font-size="11.5" fill="#333" filter="url(#rough2)">· 同一数组重复出现只算一个</text>
  <text x="52" y="360" font-size="11.5" fill="#333" filter="url(#rough2)">· 示例 1：1 出现 2 次，仍落选</text>
  <text x="52" y="380" font-size="11.5" fill="#333" filter="url(#rough2)">· 按总次数 cnt ≥ 2 统计 → 误收 1</text>
  <text x="52" y="416" font-size="10.5" fill="#667" filter="url(#rough2)">判定维度：出现在哪几个数组</text>

  <text x="450" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 3 位掩码 · 幂等登记</text>
  <text x="332" y="320" font-size="11.5" fill="#333" filter="url(#rough2)">· mask[v] |= 2^i：第 i 位即归属</text>
  <text x="332" y="340" font-size="11.5" fill="#333" filter="url(#rough2)">· 2³ = 8 种归属状态全覆盖</text>
  <text x="332" y="360" font-size="11.5" fill="#333" filter="url(#rough2)">· x | b | b = x | b：重复不变</text>
  <text x="332" y="380" font-size="11.5" fill="#333" filter="url(#rough2)">· 无需 set 预去重（计数法才要）</text>
  <text x="332" y="416" font-size="10.5" fill="#567" filter="url(#rough2)">掩码还保留「在哪几个数组」的信息</text>

  <text x="730" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">③ 值域桶 + popcount</text>
  <text x="612" y="320" font-size="11.5" fill="#333" filter="url(#rough2)">· 值域 [1,100]：mask[101] 直下标</text>
  <text x="612" y="340" font-size="11.5" fill="#333" filter="url(#rough2)">· popcount ≥ 2 ⇔ 至少两个数组</text>
  <text x="612" y="360" font-size="11.5" fill="#333" filter="url(#rough2)">· 扫 1…100：升序 + 互异一步到位</text>
  <text x="612" y="380" font-size="11.5" fill="#333" filter="url(#rough2)">· 「恰好 m 个」→ 判 popcount == m</text>
  <text x="612" y="416" font-size="10.5" fill="#776" filter="url(#rough2)">值域小用数组，值域大换哈希表</text>

  <text x="450" y="462" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">「k 个集合的归属判定」通用范式：k 位掩码登记 + popcount 阈值比较</text>
</svg>
