<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察一：bug 只顺流传染 —— S = 从 k 出发的可达集合</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 2：n=5，k=0，invocations=[[1,2],[0,2],[0,1],[3,4]]</text>

  <!-- 可疑集合虚线圈 -->
  <ellipse cx="175" cy="140" rx="118" ry="78" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7,5" filter="url(#rough2)"/>
  <text x="175" y="58" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">可疑集合 S —— 整组待删</text>

  <!-- 调用边（圈内三条 + 圈外一条） -->
  <path d="M 109 163 L 236 160" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 97 147 L 135 105" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 165 100 L 240 148" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 425 111 L 447 183" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="90" cy="165" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="90" y="170" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="150" cy="90" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="95" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="255" cy="158" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="255" y="163" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="418" cy="95" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="418" y="100" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="450" cy="200" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="205" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- k 徽章 + 注记 -->
  <circle cx="64" cy="180" r="10" fill="#b85450" filter="url(#rough2)"/>
  <text x="64" y="184" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="90" y="196" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（bug 源头）</text>
  <text x="434" y="72" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">圈外：安然无恙</text>
  <text x="462" y="150" font-size="9" fill="#666" filter="url(#rough2)">调用</text>

  <!-- BFS 扩张轨迹 -->
  <text x="260" y="236" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">BFS 扩张轨迹（入队即标记）：</text>
  <rect x="16" y="244" width="106" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="69" y="260" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">初始 susp[k]=1</text>
  <text x="69" y="274" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">队列 [ 0 ]</text>
  <path d="M 122 263 L 136 263" stroke="#a07830" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="138" y="244" width="118" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="197" y="260" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">出队 0 → 标记 2、1</text>
  <text x="197" y="274" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">队列 [2, 1]</text>
  <path d="M 256 263 L 270 263" stroke="#a07830" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="272" y="244" width="112" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="328" y="260" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">出队 2、1</text>
  <text x="328" y="274" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">已标记 → 跳过</text>
  <path d="M 384 263 L 398 263" stroke="#a07830" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>
  <rect x="400" y="244" width="104" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="452" y="260" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">队列空，遍历终止</text>
  <text x="452" y="274" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">S = {0,1,2} ✓</text>

  <!-- 底部结论 -->
  <rect x="30" y="296" width="460" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">传染规则：a 可疑且 a 调用 b ⇒ b 可疑；反过来 b 可疑不会传染 a</text>
  <text x="260" y="337" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">环与重访无需特判：已标记就跳过，每点至多处理一次 —— 一次遍历标记整个闭包</text>
</svg>
