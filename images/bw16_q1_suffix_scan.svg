<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">从右往左扫一遍：一个变量 mx 记录「右侧最大」</text>

  <!-- 原数组格子 -->
  <text x="60" y="72" font-size="14" fill="#666" filter="url(#rough2)">arr =</text>
  <rect x="110" y="50" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="138" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">17</text>
  <rect x="170" y="50" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="198" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">18</text>
  <rect x="230" y="50" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="258" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="290" y="50" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="318" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="350" y="50" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="378" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="410" y="50" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="438" y="76" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- 右侧最大标签 -->
  <text x="138" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">max=18</text>
  <text x="198" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">max=6</text>
  <text x="258" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">max=6</text>
  <text x="318" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">max=6</text>
  <text x="378" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">max=1</text>
  <text x="438" y="112" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">max=-1</text>

  <!-- 结果数组 -->
  <text x="60" y="156" font-size="14" fill="#666" filter="url(#rough2)">ans =</text>
  <rect x="110" y="134" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="138" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">18</text>
  <rect x="170" y="134" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="198" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="230" y="134" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="258" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="290" y="134" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="318" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="350" y="134" width="56" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="378" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="410" y="134" width="56" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="438" y="160" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">-1</text>

  <!-- 扫描方向箭头 -->
  <path d="M 470 200 C 380 224, 240 224, 150 200" fill="none" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="230" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">i 从 n-1 走到 0（从右往左）</text>

  <!-- 状态说明框 -->
  <rect x="60" y="252" width="250" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="278" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">到访 i 时：</text>
  <text x="185" y="300" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">ans[i] = mx（此时 mx 尚不含 arr[i]）</text>

  <rect x="330" y="252" width="250" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="278" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">写完答案再更新：</text>
  <text x="455" y="300" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">mx = max(mx, arr[i])</text>

  <text x="320" y="334" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">两个动作的先后顺序就是「严格右侧」语义的全部</text>
</svg>
