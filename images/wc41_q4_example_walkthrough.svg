<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例走查：逐字符输入 i → 空格 → a → #</text>
  <text x="340" y="48" text-anchor="middle" font-size="11" fill="#888">历史数据：i love you(5)、island(3)、iroman(2)、i love leetcode(2)</text>

  <rect x="24" y="72" width="632" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66" font-weight="bold" text-anchor="middle">
    <text x="47" y="93">步</text>
    <text x="103" y="93">输入</text>
    <text x="179" y="93">当前前缀</text>
    <text x="346" y="93">该前缀下的历史句子（次数）</text>
    <text x="563" y="93">返回 top3</text>
  </g>

  <path d="M 24 106 L 656 106" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 24 162 L 656 162" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 24 212 L 656 212" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 24 260 L 656 260" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 24 308 L 656 308" stroke="#b0b8c4" stroke-width="1" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="10" fill="#555" text-anchor="middle">
    <text x="47" y="136">1</text>
    <text x="103" y="136">'i'</text>
    <text x="179" y="136">"i"</text>
    <text x="346" y="126">i love you 5 · island 3</text>
    <text x="346" y="144">i love leetcode 2 · iroman 2</text>
    <text x="563" y="124">i love you</text>
    <text x="563" y="138">island</text>
    <text x="563" y="152">i love leetcode</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#555" text-anchor="middle">
    <text x="47" y="190">2</text>
    <text x="103" y="190">'␣'</text>
    <text x="179" y="190">"i "</text>
    <text x="346" y="182">i love you 5 · i love leetcode 2</text>
    <text x="346" y="200">（island、iroman 前缀不符）</text>
    <text x="563" y="182">i love you</text>
    <text x="563" y="196">i love leetcode</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#555" text-anchor="middle">
    <text x="47" y="241">3</text>
    <text x="103" y="241">'a'</text>
    <text x="179" y="241">"i a"</text>
    <text x="346" y="241">无（该前缀不在 Trie 中）</text>
    <text x="563" y="241">[]</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#555" text-anchor="middle">
    <text x="47" y="289">4</text>
    <text x="103" y="289">'#'</text>
    <text x="179" y="289">—（清空）</text>
    <text x="346" y="289">落库 "i a"：次数 1</text>
    <text x="563" y="289">[]</text>
  </g>

  <rect x="24" y="322" width="632" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#6b5518">
    <text x="40" y="344">第 1 步的并列：i love you(5) 之后只剩两条 2 次，而 ' '(32) &lt; 'r'(114)，故 i love leetcode 排在 iroman 前；</text>
    <text x="40" y="366">第 4 步的 '#'：把 "i a" 以次数 1 落库并插进 Trie，之后再输入 i、空格、a 就能在补全里看到它。</text>
  </g>
</svg>
