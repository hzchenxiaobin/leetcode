<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">示例演算：hp = 11，damage = [3,6,7]，requirement = [4,2,5]</text>

  <!-- prefix sums row -->
  <text x="58" y="64" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">前缀和</text>
  <text x="118" y="42" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">S₀</text>
  <text x="186" y="42" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">S₁</text>
  <text x="254" y="42" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">S₂</text>
  <text x="322" y="42" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">S₃</text>

  <rect x="90" y="46" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="158" y="46" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="226" y="46" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>
  <rect x="294" y="46" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">16</text>

  <!-- where each X lands -->
  <text x="90" y="96" text-anchor="start" font-size="11" fill="#d6a040" filter="url(#rough2)">X₁ = 7 − 11 = −4：落在 S₀ 之前 ⇒ k = 0（连起点 1 都达标）</text>
  <text x="90" y="114" text-anchor="start" font-size="11" fill="#d6a040" filter="url(#rough2)">X₂ = 11 − 11 = 0：恰为 S₀ ⇒ k = 0</text>
  <text x="90" y="132" text-anchor="start" font-size="11" fill="#d6a040" filter="url(#rough2)">X₃ = 21 − 11 = 10：落在 (S₂, S₃] ⇒ k = 3</text>

  <!-- table -->
  <rect x="55" y="148" width="50" height="26" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">房间 i</text>
  <rect x="105" y="148" width="110" height="26" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="160" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">T = S[i]+req</text>
  <rect x="215" y="148" width="70" height="26" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="250" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">X = T−hp</text>
  <rect x="285" y="148" width="70" height="26" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">k（二分）</text>
  <rect x="355" y="148" width="110" height="26" fill="#e8f0fe" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="410" y="165" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">贡献 i−k</text>

  <rect x="55" y="174" width="50" height="26" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="105" y="174" width="110" height="26" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="160" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3+4 = 7</text>
  <rect x="215" y="174" width="70" height="26" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="250" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−4</text>
  <rect x="285" y="174" width="70" height="26" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="355" y="174" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <rect x="55" y="200" width="50" height="26" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="105" y="200" width="110" height="26" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="160" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9+2 = 11</text>
  <rect x="215" y="200" width="70" height="26" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="250" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="285" y="200" width="70" height="26" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="355" y="200" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <rect x="55" y="226" width="50" height="26" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="105" y="226" width="110" height="26" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="160" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">16+5 = 21</text>
  <rect x="215" y="226" width="70" height="26" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="250" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="285" y="226" width="70" height="26" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="355" y="226" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="243" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0（k ≥ i）</text>

  <!-- result box -->
  <rect x="50" y="268" width="420" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">房间 1 被起点 {1} 得分，房间 2 被 {1, 2}，房间 3 没有起点能达标</text>
  <text x="260" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">总分 = 1 + 2 + 0 = 3 ✓</text>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">与定义吻合：score(1) = 2，score(2) = 1，score(3) = 0</text>
</svg>
