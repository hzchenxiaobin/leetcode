<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="540" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">核心观察②：D 是 ±1 步进折线 —— min/max 夹零即含零点</text>
  <path d="M 130 38 Q 320 46 510 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: D walk -->
  <text x="70" y="64" font-size="12.5" fill="#446688" font-weight="bold">对固定 l：D(r) = E(l..r) − O(l..r) 随右端点 r 的折线</text>

  <!-- axes: r from 1..8 at x=110+58k ; D=0 line at y=200, D=1 at 160, D=-1 at 240, D=2 at 120 -->
  <path d="M 96 110 L 96 258" stroke="#888" stroke-width="1.4" filter="url(#sk)"/>
  <g font-size="11" fill="#666" text-anchor="end">
    <text x="90" y="164">1</text>
    <text x="90" y="204">0</text>
    <text x="90" y="244">−1</text>
  </g>
  <path d="M 96 200 L 590 200" stroke="#b0b0b0" stroke-width="1.2" stroke-dasharray="6,5" filter="url(#sk)"/>

  <!-- walk polyline: D = 1,0,1,2,1,0,-1,0 at r=1..8 ; x = 110+58*(r-1), y = 200-40*D -->
  <path d="M 110 160 L 168 200 L 226 160 L 284 120 L 342 160 L 400 200 L 458 240 L 516 200"
        stroke="#446688" stroke-width="2.2" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)" fill="#446688">
    <circle cx="110" cy="160" r="4.5"/>
    <circle cx="168" cy="200" r="4.5"/>
    <circle cx="226" cy="160" r="4.5"/>
    <circle cx="284" cy="120" r="4.5"/>
    <circle cx="342" cy="160" r="4.5"/>
    <circle cx="400" cy="200" r="4.5"/>
    <circle cx="458" cy="240" r="4.5"/>
    <circle cx="516" cy="200" r="4.5"/>
  </g>
  <!-- zero circles -->
  <g filter="url(#sk)" fill="none" stroke="#4a7a3a" stroke-width="2.2">
    <circle cx="168" cy="200" r="10"/>
    <circle cx="400" cy="200" r="10"/>
    <circle cx="516" cy="200" r="10"/>
  </g>
  <g font-size="10.5" fill="#777" text-anchor="middle">
    <text x="110" y="270">r=1</text>
    <text x="168" y="270">2</text>
    <text x="226" y="270">3</text>
    <text x="284" y="270">4</text>
    <text x="342" y="270">5</text>
    <text x="400" y="270">6</text>
    <text x="458" y="270">7</text>
    <text x="516" y="270">8</text>
  </g>
  <text x="516" y="178" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">最右零点！</text>
  <path d="M 516 182 Q 516 188 516 192" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="458" y="262" font-size="10.5" fill="#b85450" text-anchor="middle">探到 −1 也要</text>
  <text x="458" y="286" font-size="10.5" fill="#b85450" text-anchor="middle">逐格爬回 0</text>
  <text x="284" y="104" font-size="10.5" fill="#888" text-anchor="middle">升：新偶数值 +1</text>
  <text x="458" y="132" font-size="10.5" fill="#888" text-anchor="middle" transform="rotate(-32 458 132)">降：新奇数值 −1</text>
  <text x="110" y="286" font-size="10.5" fill="#888">每步 |ΔD| ≤ 1：新值 ±1、重复 0</text>

  <!-- caution box -->
  <g filter="url(#sk)">
    <rect x="70" y="304" width="500" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="325" text-anchor="middle" font-size="12.5" fill="#8f3a36" font-weight="bold">⚠️ 只维护 min 会翻车：段 [−1, −1, 1] 的 min ≤ 0 却不含 0</text>
  <text x="320" y="345" text-anchor="middle" font-size="12.5" fill="#8f3a36">「连续段含 0」⟺ min ≤ 0 ≤ max —— 充分性正是 ±1 步进（介值）给的</text>

  <!-- Panel B: segment tree descent -->
  <text x="70" y="388" font-size="12.5" fill="#446688" font-weight="bold">线段树节点存 (min, max)：先右后左下降，找最右零点（叶子 D = 1, 0, 1, 0）</text>

  <!-- tree: root [1..4] at (320,412); children at (200,458),(440,458); leaves at (110,498)... too low. viewBox 500 high; adjust: root y=410, children y=448, leaves y=486 -->
  <g filter="url(#sk)">
    <rect x="270" y="400" width="100" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="420" text-anchor="middle" font-size="12" fill="#2f4a6b" font-weight="bold">[1..4] (0,1)</text>

  <g filter="url(#sk)">
    <rect x="150" y="446" width="100" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="390" y="446" width="100" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <text x="200" y="466" text-anchor="middle" font-size="12" fill="#2f4a6b">[1..2] (0,1)</text>
  <text x="440" y="466" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">[3..4] (0,1)</text>

  <g filter="url(#sk)">
    <rect x="80" y="492" width="80" height="28" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <rect x="170" y="492" width="80" height="28" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <rect x="390" y="492" width="80" height="28" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <rect x="480" y="492" width="80" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#333">
    <text x="120" y="511">r=1: 1</text>
    <text x="210" y="511">r=2: 0</text>
    <text x="430" y="511">r=3: 1</text>
    <text x="520" y="511" fill="#2e5e22" font-weight="bold">r=4: 0 ✓</text>
  </g>

  <!-- descent arrows -->
  <path d="M 355 432 Q 400 438 435 444" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 475 478 Q 500 484 515 490" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="408" y="436" font-size="10.5" fill="#d6a040" font-weight="bold">先试右孩子</text>
  <text x="508" y="484" font-size="10.5" fill="#d6a040" font-weight="bold">mx ≥ 0 ✓</text>
  <text x="596" y="511" font-size="10.5" fill="#4a7a3a" text-anchor="end">→ 答案长度 4</text>
</svg>
