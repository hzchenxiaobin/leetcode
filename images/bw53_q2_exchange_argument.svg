<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">交换论证：把「大 × 大」拆开，最大数对和不会变大</text>
  <text x="280" y="52" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">设排序后 a ≤ b ≤ c ≤ d（任取最优方案中的两对）</text>

  <!-- 上排：嵌套配对 -->
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <rect x="100" y="96" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="190" y="96" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="280" y="96" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="370" y="96" width="56" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="128" y="119">a</text><text x="218" y="119">b</text>
    <text x="308" y="119">c</text><text x="398" y="119">d</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 128 94 Q 173 62, 218 94" fill="none" stroke="#b85450" stroke-width="2"/>
    <path d="M 308 94 Q 353 62, 398 94" fill="none" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="480" y="80" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">(a,b) (c,d)</text>
  <text x="280" y="158" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">c、d 两个大数同队 → max ≥ c + d（被大的拖爆）</text>

  <!-- 下排：交叉配对 -->
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <rect x="100" y="216" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="190" y="216" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="280" y="216" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="370" y="216" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="128" y="239">a</text><text x="218" y="239">b</text>
    <text x="308" y="239">c</text><text x="398" y="239">d</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 128 214 Q 263 156, 398 214" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <path d="M 218 214 Q 263 178, 308 214" fill="none" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="480" y="190" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(a,d) (b,c)</text>
  <text x="280" y="278" text-anchor="middle" font-size="13" fill="#2d5a22" filter="url(#rough2)">a+d ≤ c+d 且 b+c ≤ c+d → 交换后 max ≤ c+d ≤ 原 max</text>

  <rect x="70" y="296" width="420" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="319" text-anchor="middle" font-size="13" fill="#33507a" filter="url(#rough2)">反复交换，最优解总能变成「首尾配对」且最大值不增</text>
</svg>
