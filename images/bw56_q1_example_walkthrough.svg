<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n = 10，100 对 (a,b) 中命中 4 对</text>

  <!-- 命中表 -->
  <g filter="url(#rough2)">
    <rect x="60" y="56" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="60" y="88" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="60" y="118" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="60" y="148" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="60" y="178" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="110" y="77">(a, b)</text><text x="165" y="77">a²+b²</text><text x="225" y="77">c</text>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="110" y="108">(3, 4)</text><text x="165" y="108">25</text><text x="225" y="108">5</text>
    <text x="110" y="138">(4, 3)</text><text x="165" y="138">25</text><text x="225" y="138">5</text>
    <text x="110" y="168">(6, 8)</text><text x="165" y="168">100</text><text x="225" y="168">10</text>
    <text x="110" y="198">(8, 6)</text><text x="165" y="198">100</text><text x="225" y="198">10</text>
  </g>
  <text x="170" y="226" text-anchor="middle" font-size="12.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">ans = 4 ✓（与官方示例 2 一致）</text>

  <!-- 未命中示例 -->
  <g filter="url(#rough2)">
    <rect x="300" y="56" width="220" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="300" y="88" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="300" y="118" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="300" y="148" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
    <rect x="300" y="178" width="220" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">
    <text x="360" y="77">(a, b)</text><text x="425" y="77">a²+b²</text><text x="495" y="77">判定的失败原因</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="360" y="108">(1, 7)</text><text x="425" y="108">50</text><text x="497" y="108">不是完全平方数</text>
    <text x="360" y="138">(7, 9)</text><text x="425" y="138">130</text><text x="497" y="138">不是完全平方数</text>
    <text x="360" y="168">(10,10)</text><text x="425" y="168">200</text><text x="497" y="168">不是完全平方数</text>
    <text x="360" y="198">(6, 8)</text><text x="425" y="198">100</text><text x="497" y="198">n=9 时 c=10&gt;n 被拦</text>
  </g>
  <text x="410" y="226" text-anchor="middle" font-size="11" fill="#8a6a1a" filter="url(#rough2)">斜边越界：c ≤ n 判定不能省</text>

  <!-- 底部说明 -->
  <g filter="url(#rough2)">
    <rect x="60" y="256" width="460" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
  </g>
  <text x="290" y="282" text-anchor="middle" font-size="12.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">n &lt; 5 时答案为 0（最小三元组 3-4-5）；</text>
  <text x="290" y="302" text-anchor="middle" font-size="12.5" fill="#3a4a66" filter="url(#rough2)">答案恒为偶数：a = b 不可能（否则 c² = 2a²，与 √2 无理矛盾），</text>
  <text x="290" y="320" text-anchor="middle" font-size="12.5" fill="#3a4a66" filter="url(#rough2)">故每个无序对 {a,b} 恰贡献 (a,b)、(b,a) 两个有序三元组。</text>

  <g filter="url(#rough2)">
    <rect x="60" y="340" width="460" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8"/>
  </g>
  <text x="290" y="365" text-anchor="middle" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">与 O(n³) 三重循环暴力在 n = 1..250 全范围对拍，逐项一致。</text>
</svg>
