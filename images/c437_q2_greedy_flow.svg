<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="560" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：排序 + 两段求和</text>
  <path d="M 90 42 Q 340 50 590 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 主流程 -->
  <g filter="url(#rough2)">
    <rect x="150" y="70" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="250" y="95" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">输入 pizzas（n = 4m）</text>

  <path d="M 250 110 v 20" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="134" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="250" y="159" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">降序排序</text>

  <path d="M 250 174 v 20" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="198" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="250" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">odd = ⌈m/2⌉（奇数天数）</text>
  <text x="250" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">even = ⌊m/2⌋（偶数天数）</text>

  <path d="M 250 242 v 22" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形判断 -->
  <g filter="url(#rough2)">
    <polygon points="250,264 335,304 250,344 165,304" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="250" y="309" text-anchor="middle" font-size="12" fill="#a06a1a" filter="url(#rough2)">even &gt; 0 ?</text>

  <!-- 否分支：绕右侧直下到输出 -->
  <path d="M 335 304 H 428 V 498 H 356" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="296" font-size="11" fill="#888" filter="url(#rough2)">否（m = 1，仅奇数天）</text>

  <!-- 是分支 -->
  <path d="M 250 344 v 22" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="360" font-size="11" fill="#888" filter="url(#rough2)">是</text>

  <g filter="url(#rough2)">
    <rect x="150" y="370" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="250" y="389" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">奇数天：累加前 odd 项</text>
  <text x="250" y="406" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ans += a[0] + ⋯ + a[odd−1]</text>

  <path d="M 250 414 v 20" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="438" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="250" y="457" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">偶数天：步长 2 累加 even 项</text>
  <text x="250" y="474" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ans += a[odd+1] + a[odd+3] + ⋯</text>

  <path d="M 250 482 v 20" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="506" width="200" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="250" y="531" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">返回 ans（long long）</text>

  <!-- 右侧旁注 -->
  <g filter="url(#rough2)">
    <rect x="465" y="70" width="190" height="220" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="560" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">复杂度与易错</text>
  <text x="560" y="122" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">排序 O(n log n)</text>
  <text x="560" y="142" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">求和 O(n)，空间 O(1)</text>
  <text x="560" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">⚠ 偶数天起点是 odd+1</text>
  <text x="560" y="188" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">（第 odd 格留给搭档）</text>
  <text x="560" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">⚠ ans 用 long long</text>
  <text x="560" y="234" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">（总和可达 5×10⁹）</text>
  <text x="560" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a" filter="url(#rough2)">⚠ odd 是 ⌈m/2⌉</text>
  <text x="560" y="280" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">（m 为奇数时多一天）</text>

  <text x="340" y="560" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两段求和共用一次排序；垫脚数量 3·odd + 2·even 恰好自洽，无需特判</text>
</svg>
