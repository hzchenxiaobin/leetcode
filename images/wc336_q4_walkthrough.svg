<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="500" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：tasks = [[1,3,2],[2,5,3],[5,6,2]]（已按 end 升序：3 ≤ 5 ≤ 6）</text>

  <!-- column headers, cells x=120+60*(t-1), w=60 -->
  <g font-size="11" fill="#888">
    <text x="150" y="52" text-anchor="middle" filter="url(#rough2)">t=1</text>
    <text x="210" y="52" text-anchor="middle" filter="url(#rough2)">t=2</text>
    <text x="270" y="52" text-anchor="middle" filter="url(#rough2)">t=3</text>
    <text x="330" y="52" text-anchor="middle" filter="url(#rough2)">t=4</text>
    <text x="390" y="52" text-anchor="middle" filter="url(#rough2)">t=5</text>
    <text x="450" y="52" text-anchor="middle" filter="url(#rough2)">t=6</text>
  </g>
  <g stroke="#ccc" stroke-width="0.8" stroke-dasharray="3 3">
    <line x1="120" y1="58" x2="120" y2="376"/>
    <line x1="180" y1="58" x2="180" y2="376"/>
    <line x1="240" y1="58" x2="240" y2="376"/>
    <line x1="300" y1="58" x2="300" y2="376"/>
    <line x1="360" y1="58" x2="360" y2="376"/>
    <line x1="420" y1="58" x2="420" y2="376"/>
    <line x1="480" y1="58" x2="480" y2="376"/>
  </g>

  <!-- ===== Row 1: task A ===== -->
  <text x="112" y="94" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">A [1,3] 需 2</text>
  <!-- window tint t=1..3 -->
  <rect x="120" y="66" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="210" y="84" text-anchor="middle" font-size="8" fill="#a8781f" filter="url(#rough2)">窗口</text>
  <!-- new cells t=2,3 -->
  <rect x="180" y="66" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="66" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="91" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">★</text>
  <text x="270" y="91" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">★</text>
  <text x="494" y="82" font-size="10" fill="#555" filter="url(#rough2)">cnt = 0，缺口 2</text>
  <text x="494" y="98" font-size="10" fill="#33506b" filter="url(#rough2)">从 e=3 向左补 {3, 2}</text>

  <!-- ===== Row 2: task B ===== -->
  <text x="112" y="174" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">B [2,5] 需 3</text>
  <rect x="180" y="146" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="164" text-anchor="middle" font-size="8" fill="#a8781f" filter="url(#rough2)">窗口</text>
  <!-- reuse t=2,3 -->
  <rect x="180" y="146" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="146" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="171" text-anchor="middle" font-size="10" fill="#2e5b2e" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="270" y="171" text-anchor="middle" font-size="10" fill="#2e5b2e" font-weight="bold" filter="url(#rough2)">✓</text>
  <!-- new t=5 -->
  <rect x="360" y="146" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="390" y="171" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">★</text>
  <text x="494" y="162" font-size="10" fill="#555" filter="url(#rough2)">cnt = 2（复用 {2,3}）</text>
  <text x="494" y="178" font-size="10" fill="#33506b" filter="url(#rough2)">缺口 1，从 e=5 左补 {5}</text>

  <!-- ===== Row 3: task C ===== -->
  <text x="112" y="254" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">C [5,6] 需 2</text>
  <rect x="360" y="226" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="390" y="244" text-anchor="middle" font-size="8" fill="#a8781f" filter="url(#rough2)">窗口</text>
  <!-- reuse t=5 -->
  <rect x="360" y="226" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="390" y="251" text-anchor="middle" font-size="10" fill="#2e5b2e" font-weight="bold" filter="url(#rough2)">✓</text>
  <!-- new t=6 -->
  <rect x="420" y="226" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="450" y="251" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">★</text>
  <text x="494" y="242" font-size="10" fill="#555" filter="url(#rough2)">cnt = 1（复用 {5}）</text>
  <text x="494" y="258" font-size="10" fill="#33506b" filter="url(#rough2)">缺口 1，从 e=6 左补 {6}</text>

  <!-- ===== Row 4: final ===== -->
  <text x="112" y="334" text-anchor="end" font-size="11" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">最终开机集</text>
  <rect x="180" y="306" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="306" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="306" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="420" y="306" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="331" text-anchor="middle" font-size="11" fill="#2e5b2e" font-weight="bold" filter="url(#rough2)">on</text>
  <text x="270" y="331" text-anchor="middle" font-size="11" fill="#2e5b2e" font-weight="bold" filter="url(#rough2)">on</text>
  <text x="390" y="331" text-anchor="middle" font-size="11" fill="#2e5b2e" font-weight="bold" filter="url(#rough2)">on</text>
  <text x="450" y="331" text-anchor="middle" font-size="11" fill="#2e5b2e" font-weight="bold" filter="url(#rough2)">on</text>
  <rect x="494" y="306" width="180" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="584" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">开机集 = {2, 3, 5, 6}</text>
  <text x="584" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5b2e" filter="url(#rough2)">答案 = 4</text>

  <!-- ===== legend ===== -->
  <rect x="90" y="400" width="540" height="76" rx="8" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="360" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">图例</text>
  <rect x="110" y="430" width="26" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="445" font-size="10" fill="#444" filter="url(#rough2)">★ 本轮新开机（从右端补）</text>
  <rect x="330" y="430" width="26" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="445" font-size="10" fill="#444" filter="url(#rough2)">✓ 复用前序任务的点</text>
  <rect x="110" y="456" width="26" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="146" y="468" font-size="10" fill="#444" filter="url(#rough2)">任务窗口 [s, e]（闭区间）</text>
  <text x="330" y="468" font-size="10" fill="#444" filter="url(#rough2)">窗口外的时刻对本任务不可用</text>
</svg>
