<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="460" height="310" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次线性扫描</text>
  <text x="230" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">共 n-2 个窗口，每轮 O(1) 判定</text>

  <rect x="120" y="60" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="230" y="85" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">for i = 0 .. n-3</text>

  <path d="M 230 100 L 230 124" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="230,128 316,166 230,204 144,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="162" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">2(a+c) == b ？</text>
  <text x="230" y="180" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">a,b,c = 窗口三个数</text>

  <path d="M 316 166 L 344 166" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="330" y="158" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="348" y="144" width="96" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="396" y="164" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">ans += 1</text>
  <text x="396" y="181" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">命中一个子数组</text>

  <path d="M 230 204 L 230 228" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="244" y="220" font-size="10" fill="#666" filter="url(#rough2)">否 / 处理完</text>

  <rect x="110" y="232" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="250" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <text x="230" y="267" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">总时间 O(n)，空间 O(1)</text>

  <text x="230" y="296" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">窗口长度固定，无需前缀和或滑窗增删</text>
</svg>
