<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="89" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：s = "aabaac"，cost = [1,2,3,4,1,10]</text>
  <path d="M 120 42 Q 320 52 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- String cells -->
  <text x="320" y="76" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">删除索引 0~4（红色叉），只保留代价最大的那桶字母</text>
  <g filter="url(#sk)">
    <rect x="100" y="90" width="56" height="56" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="164" y="90" width="56" height="56" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="228" y="90" width="56" height="56" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
    <rect x="292" y="90" width="56" height="56" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="356" y="90" width="56" height="56" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="420" y="90" width="56" height="56" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.4"/>
  </g>
  <text x="128" y="126" text-anchor="middle" font-size="20" fill="#2b6e9e" font-weight="bold" filter="url(#sk)">a</text>
  <text x="192" y="126" text-anchor="middle" font-size="20" fill="#2b6e9e" font-weight="bold" filter="url(#sk)">a</text>
  <text x="256" y="126" text-anchor="middle" font-size="20" fill="#7a5415" font-weight="bold" filter="url(#sk)">b</text>
  <text x="320" y="126" text-anchor="middle" font-size="20" fill="#2b6e9e" font-weight="bold" filter="url(#sk)">a</text>
  <text x="384" y="126" text-anchor="middle" font-size="20" fill="#2b6e9e" font-weight="bold" filter="url(#sk)">a</text>
  <text x="448" y="126" text-anchor="middle" font-size="20" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">c</text>

  <!-- cost labels below cells -->
  <text x="128" y="162" text-anchor="middle" font-size="12" fill="#666" font-family="monospace" filter="url(#sk)">1</text>
  <text x="192" y="162" text-anchor="middle" font-size="12" fill="#666" font-family="monospace" filter="url(#sk)">2</text>
  <text x="256" y="162" text-anchor="middle" font-size="12" fill="#666" font-family="monospace" filter="url(#sk)">3</text>
  <text x="320" y="162" text-anchor="middle" font-size="12" fill="#666" font-family="monospace" filter="url(#sk)">4</text>
  <text x="384" y="162" text-anchor="middle" font-size="12" fill="#666" font-family="monospace" filter="url(#sk)">1</text>
  <text x="448" y="162" text-anchor="middle" font-size="12" fill="#666" font-family="monospace" filter="url(#sk)">10</text>

  <!-- index labels above cells -->
  <text x="128" y="84" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace" filter="url(#sk)">0</text>
  <text x="192" y="84" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace" filter="url(#sk)">1</text>
  <text x="256" y="84" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace" filter="url(#sk)">2</text>
  <text x="320" y="84" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace" filter="url(#sk)">3</text>
  <text x="384" y="84" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace" filter="url(#sk)">4</text>
  <text x="448" y="84" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace" filter="url(#sk)">5</text>

  <!-- red X on deleted cells -->
  <path d="M 106 96 L 150 140 M 150 96 L 106 140" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#sk)"/>
  <path d="M 170 96 L 214 140 M 214 96 L 170 140" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#sk)"/>
  <path d="M 234 96 L 278 140 M 278 96 L 234 140" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#sk)"/>
  <path d="M 298 96 L 342 140 M 342 96 L 298 140" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#sk)"/>
  <path d="M 362 96 L 406 140 M 406 96 L 362 140" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#sk)"/>

  <!-- Bucket table -->
  <text x="320" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">按字母分桶求和</text>
  <g filter="url(#sk)">
    <rect x="120" y="210" width="130" height="74" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="255" y="210" width="130" height="74" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="390" y="210" width="130" height="74" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="185" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">字母 a（4 个）</text>
  <text x="185" y="252" text-anchor="middle" font-size="12" fill="#2b6e9e" font-family="monospace" filter="url(#sk)">1+2+4+1 = 8</text>
  <text x="185" y="272" text-anchor="middle" font-size="10" fill="#8aa8c0" font-family="monospace" filter="url(#sk)">sum[a] = 8</text>
  <text x="320" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">字母 b（1 个）</text>
  <text x="320" y="252" text-anchor="middle" font-size="12" fill="#7a5415" font-family="monospace" filter="url(#sk)">3</text>
  <text x="320" y="272" text-anchor="middle" font-size="10" fill="#c0a070" font-family="monospace" filter="url(#sk)">sum[b] = 3</text>
  <text x="455" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">字母 c（1 个）</text>
  <text x="455" y="252" text-anchor="middle" font-size="12" fill="#2e6e2e" font-family="monospace" filter="url(#sk)">10</text>
  <text x="455" y="272" text-anchor="middle" font-size="10" fill="#8ac08a" font-family="monospace" filter="url(#sk)">sum[c] = 10 ← best</text>

  <!-- Arrow to result -->
  <path d="M 320 288 L 320 306" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar3)" filter="url(#sk)"/>

  <!-- total -->
  <g filter="url(#sk)">
    <rect x="170" y="310" width="300" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="320" y="333" text-anchor="middle" font-size="13" fill="#2b6e9e" font-family="monospace" filter="url(#sk)">total = 1+2+3+4+1+10 = 21</text>

  <!-- Answer -->
  <g filter="url(#sk)">
    <rect x="170" y="356" width="300" height="44" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="320" y="378" text-anchor="middle" font-size="15" fill="#7a5415" font-weight="bold" font-family="monospace" filter="url(#sk)">答案 = total − best = 21 − 10 = 11</text>
  <text x="320" y="394" text-anchor="middle" font-size="10" fill="#a08040" filter="url(#sk)">保留「c」全部出现（恰好 1 个），删掉其余字符</text>

  <!-- footnote -->
  <text x="320" y="418" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">注意：保留全部 a 的方案代价是 21 − 8 = 13 &gt; 11，比较后取最小</text>
</svg>
