<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：峰值 0/1 化，查询变开区间和</text>
  <text x="260" y="52" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">p[i] = [ nums[i] &gt; nums[i−1] 且 nums[i] &gt; nums[i+1] ]，端点恒 0</text>

  <!-- bar chart: nums = [2,6,4,5,1,3], baseline y=196, unit 14 -->
  <rect x="60" y="168" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="86" y="160" text-anchor="middle" font-size="12" fill="#2f4358" filter="url(#rough2)">2</text>

  <rect x="128" y="112" width="52" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="154" y="104" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">6</text>
  <text x="154" y="88" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">峰 ✓</text>

  <rect x="196" y="140" width="52" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="222" y="132" text-anchor="middle" font-size="12" fill="#2f4358" filter="url(#rough2)">4</text>

  <rect x="264" y="126" width="52" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="118" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">5</text>
  <text x="290" y="102" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">峰 ✓</text>

  <rect x="332" y="182" width="52" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="358" y="174" text-anchor="middle" font-size="12" fill="#2f4358" filter="url(#rough2)">1</text>

  <rect x="400" y="154" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="426" y="146" text-anchor="middle" font-size="12" fill="#2f4358" filter="url(#rough2)">3</text>

  <path d="M50,198 L470,198" stroke="#8a8a8a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- index labels -->
  <text x="86" y="216" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="154" y="216" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="222" y="216" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="290" y="216" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="358" y="216" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="426" y="216" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">5</text>

  <!-- p array -->
  <text x="52" y="252" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">p =</text>
  <rect x="78" y="234" width="52" height="32" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="104" y="255" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="146" y="234" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="255" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>
  <rect x="214" y="234" width="52" height="32" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="255" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>
  <rect x="282" y="234" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="255" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">1</text>
  <rect x="350" y="234" width="52" height="32" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="376" y="255" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>
  <rect x="418" y="234" width="52" height="32" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="444" y="255" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <text x="104" y="280" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">端点</text>
  <text x="444" y="280" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">端点</text>

  <!-- query 1 -->
  <rect x="40" y="298" width="440" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="318" font-size="12.5" fill="#2f4358" filter="url(#rough2)">查询 [1, 0, 5]：开区间 (0, 5) → p[1]+p[2]+p[3]+p[4] = 1+0+1+0 =</text>
  <text x="452" y="318" text-anchor="end" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <path d="M146,332 L408,332" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,4" marker-start="url(#arrB)" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="277" y="344" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">统计范围：下标 1..4（两端不算）</text>

  <!-- query 2 -->
  <rect x="40" y="356" width="440" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="376" font-size="12.5" fill="#7c2b28" filter="url(#rough2)">查询 [1, 0, 2]：开区间 (0, 2) → 只有 p[1] = 1；</text>
  <text x="60" y="394" font-size="12.5" fill="#7c2b28" filter="url(#rough2)">下标 0、2 是子数组端点，即使全局更高也不算峰</text>
  <text x="452" y="376" text-anchor="end" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
</svg>
