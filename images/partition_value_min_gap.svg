<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arS" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="860" height="520" fill="#fdfcf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：排序后最小相邻差 = 答案</text>
  <path d="M 250 40 Q 430 48 610 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- original array -->
  <text x="66" y="95" font-size="12" fill="#555">原数组</text>
  <g filter="url(#sk)">
    <rect x="120" y="72" width="58" height="38" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.4"/>
    <rect x="196" y="72" width="58" height="38" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.4"/>
    <rect x="272" y="72" width="58" height="38" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="149" y="96" text-anchor="middle" font-size="13" fill="#333">100</text>
  <text x="225" y="96" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="301" y="96" text-anchor="middle" font-size="13" fill="#333">10</text>

  <path d="M 225 118 L 225 148" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <text x="242" y="138" font-size="12" fill="#444">排序（升序）</text>

  <!-- sorted row: groups + boxes -->
  <text x="179" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">nums1</text>
  <text x="404" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">nums2</text>
  <g filter="url(#sk)">
    <rect x="140" y="156" width="78" height="60" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="270" y="156" width="270" height="60" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="150" y="164" width="58" height="38" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="280" y="164" width="58" height="38" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="470" y="164" width="58" height="38" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="179" y="188" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="309" y="188" text-anchor="middle" font-size="13" fill="#333">10</text>
  <text x="499" y="188" text-anchor="middle" font-size="13" fill="#333">100</text>
  <text x="179" y="212" text-anchor="middle" font-size="11" fill="#2b6e9e">max = 1</text>
  <text x="309" y="212" text-anchor="middle" font-size="11" fill="#2e6e2e">min = 10</text>

  <!-- cut line between 1 and 10 -->
  <path d="M 244 150 L 244 216" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <text x="244" y="230" text-anchor="middle" font-size="11" fill="#b85450">在最小相邻差处切一刀</text>

  <!-- gap arrows -->
  <path d="M 212 252 L 276 252" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" marker-start="url(#arS)"/>
  <path d="M 342 252 L 466 252" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <g filter="url(#sk)">
    <rect x="192" y="262" width="104" height="22" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="244" y="277" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">g₀ = 9 = d</text>
  <text x="404" y="277" text-anchor="middle" font-size="12" fill="#555">g₁ = 90</text>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="566" y="156" width="270" height="86" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="582" y="180" font-size="12" font-weight="bold" fill="#2b2b2b">前缀 / 后缀切分：</text>
  <text x="582" y="202" font-size="11" fill="#444">nums1 = [1]，nums2 = [10, 100]</text>
  <text x="582" y="224" font-size="11" fill="#444">分区值 = |1 − 10| = 9 = d ✓</text>

  <!-- interleaved note -->
  <g filter="url(#sk)">
    <rect x="40" y="300" width="800" height="104" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="60" y="326" font-size="13" font-weight="bold" fill="#7a5415">交错划分是烟雾弹</text>
  <text x="60" y="350" font-size="11" fill="#444">官方示例 2 取 nums1 = [10]，nums2 = [100, 1]（交错），分区值 = |10 − 1| = 9 = d</text>
  <text x="60" y="372" font-size="11" fill="#444">无论交错还是分离，值小的元素排序后总在值大者之前，其差 = 若干相邻差之和 ≥ d</text>
  <text x="60" y="394" font-size="11" font-weight="bold" fill="#7a5415">任何划分 ≥ d，且存在划分 = d → 答案就是最小相邻差 d</text>

  <!-- conclusion banner -->
  <g filter="url(#sk)">
    <rect x="40" y="428" width="800" height="62" rx="10" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="440" y="454" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">答案 = min(a[i+1] − a[i])，排序后一遍扫描</text>
  <text x="440" y="478" text-anchor="middle" font-size="12" fill="#2e6e2e">时间 O(n log n)（排序主导）| 空间 O(1)（除排序外）</text>
</svg>
