<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">状态转移：up[i][v] ← down[i−1] 中 u &lt; v 的前缀和</text>

  <!-- 前缀区域虚线框 -->
  <text x="241" y="100" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">u &lt; v 的前缀区域（preD）</text>
  <rect x="144" y="108" width="194" height="52" rx="6" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- down 行 -->
  <rect x="150" y="116" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="116" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="282" y="116" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="348" y="116" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="414" y="116" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="480" y="116" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="130" text-anchor="end" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">down[i−1]</text>
  <text x="140" y="146" text-anchor="end" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（末步降）</text>

  <!-- 转移箭头：down u=1,2,3 → up v=4 -->
  <path d="M 178 154 Q 205 205 352 232" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 244 154 Q 264 205 362 232" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 310 154 Q 328 196 371 232" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- up 行 -->
  <rect x="150" y="236" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="216" y="236" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="282" y="236" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="348" y="236" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <rect x="414" y="236" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="480" y="236" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="376" y="258" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040" filter="url(#rough2)">?</text>
  <text x="140" y="250" text-anchor="end" font-size="12.5" fill="#446688" filter="url(#rough2)">up[i]</text>
  <text x="140" y="266" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">（末步升）</text>
  <text x="556" y="250" font-size="11" fill="#446688" filter="url(#rough2)">目标格</text>
  <text x="556" y="266" font-size="11" fill="#446688" filter="url(#rough2)">up[i][v]</text>

  <!-- 列下标 -->
  <text x="178" y="294" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <text x="244" y="294" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>
  <text x="310" y="294" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">3</text>
  <text x="376" y="294" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="442" y="294" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">5</text>
  <text x="508" y="294" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">6</text>
  <text x="343" y="314" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">值平移到 1..m 后的列下标 u / v</text>

  <!-- 公式框 -->
  <rect x="60" y="330" width="520" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="320" y="358" text-anchor="middle" font-size="13" fill="#8a6a10" filter="url(#rough2)">up[i][v] = Σ(u&lt;v) down[i−1][u] = preD[v−1]（绿色前缀区域求和）</text>
  <text x="320" y="388" text-anchor="middle" font-size="13" fill="#8a6a10" filter="url(#rough2)">down[i][v] = Σ(u&gt;v) up[i−1][u] = sufU[v+1]（对称的后缀和）</text>
</svg>
