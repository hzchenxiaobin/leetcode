<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="600" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：预处理掩码入集合，逐 target 删位查询</text>
  <path d="M 140 40 Q 320 50 500 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="310" cy="66" rx="42" ry="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="310" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">开始</text>
  <path d="M 310 85 L 310 102" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- preprocess -->
  <g filter="url(#sk)">
    <rect x="165" y="106" width="290" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="310" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">预处理：遍历 startWords</text>
  <text x="310" y="143" text-anchor="middle" font-size="11" fill="#555">计算 mask(w)，插入哈希集合 S（自动去重）</text>
  <path d="M 310 152 L 310 168" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop container -->
  <g filter="url(#sk)">
    <rect x="60" y="172" width="500" height="300" rx="12" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="6,4"/>
  </g>
  <text x="310" y="194" text-anchor="middle" font-size="11.5" fill="#666">对每个 targetWords[j] 重复（m ≤ 5×10⁴ 个）</text>

  <!-- compute mask -->
  <g filter="url(#sk)">
    <rect x="170" y="208" width="280" height="46" rx="8" fill="#fff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="310" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">计算 m = mask(t)</text>
  <text x="310" y="245" text-anchor="middle" font-size="11" fill="#555">逐个取出 m 中的 1 位 b</text>
  <path d="M 310 254 L 310 270" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond -->
  <g filter="url(#sk)">
    <polygon points="310,274 445,332 310,390 175,332" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="310" y="328" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">m ^ (1&lt;&lt;b)</text>
  <text x="310" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">∈ S ?</text>

  <!-- yes branch -->
  <path d="M 445 332 L 476 332" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="460" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">是</text>
  <g filter="url(#sk)">
    <rect x="482" y="308" width="68" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="516" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">ans += 1</text>
  <text x="516" y="346" text-anchor="middle" font-size="9.5" fill="#888">break</text>
  <path d="M 516 308 L 516 231 L 454 231" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="508" y="264" text-anchor="end" font-size="10" fill="#666">下一个 target</text>

  <!-- no branch -->
  <path d="M 175 332 L 128 332 L 128 231 L 164 231" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="159" y="326" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">否</text>
  <text x="136" y="286" font-size="10" fill="#666">试下一个 b</text>
  <text x="136" y="300" font-size="9.5" fill="#999">（lowbit，≤26 次）</text>

  <!-- exit -->
  <path d="M 310 472 L 310 490" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="322" y="486" font-size="10" fill="#666">全部 target 处理完</text>
  <g filter="url(#sk)">
    <rect x="240" y="494" width="140" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="310" y="519" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">返回 ans</text>

  <!-- notes -->
  <text x="310" y="560" text-anchor="middle" font-size="11" fill="#666">位用尽仍未命中 → 该 target 不计数，直接转下一个</text>
  <text x="310" y="580" text-anchor="middle" font-size="11" fill="#666">每个 target 至多 26 次整数哈希查询，全程无字符串比较</text>
</svg>
