<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：s = "cczazcc"，L = 3 → 答案 "zzcccac"</text>
  <path d="M 120 34 Q 320 42 520 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- buckets -->
  <text x="60" y="70" font-size="11" fill="#666" filter="url(#rough2)">计数桶</text>
  <rect x="130" y="50" width="86" height="30" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="70" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">z × 2</text>
  <rect x="240" y="50" width="86" height="30" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="70" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">c × 4</text>
  <rect x="350" y="50" width="86" height="30" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="393" y="70" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">a × 1</text>
  <text x="530" y="70" font-size="10.5" fill="#888" filter="url(#rough2)">新放字母着色</text>

  <!-- step 1 -->
  <rect x="20" y="96" width="44" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">步1</text>
  <text x="76" y="112" font-size="10.8" fill="#333" filter="url(#rough2)">最大 m = z：连放 min(2, 3) = 2 个</text>
  <rect x="380" y="96" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="393" y="114" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">z</text>
  <rect x="408" y="96" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="421" y="114" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">z</text>

  <!-- step 2 -->
  <rect x="20" y="160" width="44" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="176" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">步2</text>
  <text x="76" y="176" font-size="10.8" fill="#333" filter="url(#rough2)">m = c：连放 min(4, 3) = 3 个 → 封顶</text>
  <rect x="380" y="160" width="26" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="393" y="178" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">z</text>
  <rect x="408" y="160" width="26" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="421" y="178" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">z</text>
  <rect x="436" y="160" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="449" y="178" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">c</text>
  <rect x="464" y="160" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="477" y="178" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">c</text>
  <rect x="492" y="160" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="505" y="178" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">c</text>
  <text x="449" y="200" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">run = 3 = L</text>

  <!-- step 3 -->
  <rect x="20" y="224" width="44" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="240" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">步3</text>
  <text x="76" y="240" font-size="10.8" fill="#333" filter="url(#rough2)">垫 1 个次大 a（唯一 ≠ c 的可用字母）</text>
  <rect x="380" y="224" width="26" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="393" y="242" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">z</text>
  <rect x="408" y="224" width="26" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="421" y="242" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">z</text>
  <rect x="436" y="224" width="26" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="449" y="242" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">c</text>
  <rect x="464" y="224" width="26" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="477" y="242" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">c</text>
  <rect x="492" y="224" width="26" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="505" y="242" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">c</text>
  <rect x="520" y="224" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="533" y="242" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">a</text>
  <text x="533" y="264" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">run 清零</text>

  <!-- step 4 -->
  <rect x="20" y="288" width="44" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="304" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">步4</text>
  <text x="76" y="304" font-size="10.8" fill="#333" filter="url(#rough2)">c 解封：再连放 min(1, 3) = 1 个，用尽</text>
  <rect x="380" y="288" width="26" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="393" y="306" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">z</text>
  <rect x="408" y="288" width="26" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="421" y="306" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">z</text>
  <rect x="436" y="288" width="26" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="449" y="306" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">c</text>
  <rect x="464" y="288" width="26" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="477" y="306" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">c</text>
  <rect x="492" y="288" width="26" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="505" y="306" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">c</text>
  <rect x="520" y="288" width="26" height="26" rx="4" fill="#eee" stroke="#bbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="533" y="306" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">a</text>
  <rect x="548" y="288" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="561" y="306" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">c</text>

  <!-- summary -->
  <rect x="16" y="336" width="608" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="360" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">全部字母用尽 → 返回 "zzcccac"（z、c、a 恰好全部用上）</text>
  <text x="320" y="382" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">对比："zzcccca" 字典序更大，但 c 连续出现 4 次 超过 L = 3，非法 ✗</text>
  <text x="320" y="404" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">同理 s = "aababab"，L = 2：bb | a | b | aa → "bbabaa"（弃用 1 个 a）</text>
</svg>
