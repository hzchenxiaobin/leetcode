<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">一次 guess 把候选集按「匹配位数」切成 7 组</text>

  <!-- 候选集 -->
  <g filter="url(#rough2)">
    <ellipse cx="110" cy="150" rx="76" ry="76" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="110" y="140" text-anchor="middle" font-size="13" fill="#2f4a66">候选集 C</text>
    <text x="110" y="162" text-anchor="middle" font-size="12" fill="#2f4a66">|C| = 100</text>
    <text x="110" y="182" text-anchor="middle" font-size="11" fill="#2f4a66">秘密必在 C 内</text>
    <path d="M190,150 L246,150" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
    <text x="218" y="140" text-anchor="middle" font-size="10" fill="#666">guess(w)</text>
  </g>

  <!-- 7 个桶 -->
  <g filter="url(#rough2)">
    <rect x="252" y="52" width="230" height="26" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1.1"/>
    <text x="262" y="70" font-size="11" fill="#777">r = 0</text>
    <text x="470" y="70" text-anchor="end" font-size="11" fill="#777">12 个</text>

    <rect x="252" y="84" width="230" height="26" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1.1"/>
    <text x="262" y="102" font-size="11" fill="#777">r = 1</text>
    <text x="470" y="102" text-anchor="end" font-size="11" fill="#777">9 个</text>

    <rect x="252" y="116" width="230" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="262" y="134" font-size="11" fill="#7a5a10">r = 2</text>
    <text x="470" y="134" text-anchor="end" font-size="11" fill="#7a5a10">最大组 9 个 → 保留它</text>

    <rect x="252" y="148" width="230" height="26" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1.1"/>
    <text x="262" y="166" font-size="11" fill="#777">r = 3</text>
    <text x="470" y="166" text-anchor="end" font-size="11" fill="#777">6 个</text>

    <rect x="252" y="180" width="230" height="26" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1.1"/>
    <text x="262" y="198" font-size="11" fill="#777">r = 4</text>
    <text x="470" y="198" text-anchor="end" font-size="11" fill="#777">3 个</text>

    <rect x="252" y="212" width="230" height="26" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1.1"/>
    <text x="262" y="230" font-size="11" fill="#777">r = 5</text>
    <text x="470" y="230" text-anchor="end" font-size="11" fill="#777">1 个</text>

    <rect x="252" y="244" width="230" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="262" y="262" font-size="11" fill="#2f5527">r = 6</text>
    <text x="470" y="262" text-anchor="end" font-size="11" fill="#2f5527">就是 w 本身 → 猜中</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="288" width="380" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="312" text-anchor="middle" font-size="12" fill="#7a5a10">Master.guess 返回 r 后，秘密必在「匹配 r 位」那一组里</text>
    <text x="260" y="332" text-anchor="middle" font-size="12" fill="#4a7a3a">其余 6 组可以整体丢弃，候选集至少少 1 个</text>
  </g>
</svg>
