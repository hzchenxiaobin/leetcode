<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="arD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#aaaaaa"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#fafafa"/>
  <text x="480" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：edges = [1,2,0,0] → answer = [3,3,3,4]</text>
  <path d="M 170 44 Q 480 52 790 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Panel 1 ===== -->
  <g filter="url(#sk)">
    <rect x="25" y="62" width="450" height="270" rx="12" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="250" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">① 初始入度：节点 3 无前驱 → 入队</text>
  <path d="M 180 162 Q 237 130 294 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 310 142 Q 306 185 310 228" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 293 252 Q 235 234 180 178" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 124 240 Q 137 217 156 185" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="165" cy="170" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="165" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">0</text>
  <g filter="url(#sk)"><circle cx="310" cy="125" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="310" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  <g filter="url(#sk)"><circle cx="310" cy="245" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="310" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
  <g filter="url(#sk)"><circle cx="115" cy="255" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="115" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3</text>
  <text x="160" y="210" text-anchor="middle" font-size="11" fill="#888">入度2</text>
  <text x="355" y="130" font-size="11" fill="#888">入度1</text>
  <text x="355" y="250" font-size="11" fill="#888">入度1</text>
  <g filter="url(#sk)"><circle cx="115" cy="255" r="27" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"/></g>
  <text x="115" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">入度0</text>
  <text x="115" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">→ 入队!</text>

  <!-- ===== Panel 2 ===== -->
  <g filter="url(#sk)">
    <rect x="485" y="62" width="450" height="270" rx="12" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="710" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">② 剥离节点 3：indeg[0] 由 2 → 1</text>
  <path d="M 640 162 Q 697 130 754 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 770 142 Q 766 185 770 228" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 753 252 Q 695 234 640 178" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 574 240 Q 587 217 606 185" stroke="#aaaaaa" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arD)" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="625" cy="170" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="625" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">0</text>
  <g filter="url(#sk)"><circle cx="770" cy="125" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="770" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  <g filter="url(#sk)"><circle cx="770" cy="245" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/></g>
  <text x="770" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
  <g filter="url(#sk)"><circle cx="575" cy="255" r="17" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="575" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#999">3</text>
  <text x="622" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">入度 2→1</text>
  <text x="586" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">−1</text>
  <text x="815" y="130" font-size="11" fill="#888">入度1</text>
  <text x="815" y="250" font-size="11" fill="#888">入度1</text>
  <text x="575" y="312" text-anchor="middle" font-size="11" fill="#446688">已剥离 → order = [3]</text>

  <!-- ===== Panel 3 ===== -->
  <g filter="url(#sk)">
    <rect x="25" y="352" width="450" height="270" rx="12" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="250" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">③ 剩余 {0,1,2} 是环：整环定值 L = 3</text>
  <path d="M 180 452 Q 237 420 294 420" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 310 432 Q 306 475 310 518" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 293 542 Q 235 524 180 468" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 124 470 Q 137 447 156 415" stroke="#aaaaaa" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arD)" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="165" cy="460" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="165" y="465" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">0</text>
  <g filter="url(#sk)"><circle cx="310" cy="415" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="310" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  <g filter="url(#sk)"><circle cx="310" cy="535" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="310" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
  <g filter="url(#sk)"><circle cx="115" cy="545" r="17" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="115" y="550" text-anchor="middle" font-size="14" font-weight="bold" fill="#999">3</text>
  <text x="262" y="474" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818">环长 L = 3</text>
  <text x="160" y="500" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">ans=3</text>
  <text x="355" y="420" font-size="11" font-weight="bold" fill="#4a7a3a">ans=3</text>
  <text x="355" y="540" font-size="11" font-weight="bold" fill="#4a7a3a">ans=3</text>
  <text x="115" y="584" text-anchor="middle" font-size="11" fill="#aaa">(已剥离)</text>

  <!-- ===== Panel 4 ===== -->
  <g filter="url(#sk)">
    <rect x="485" y="352" width="450" height="270" rx="12" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="710" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">④ 逆序推树枝：ans[3] = ans[0] + 1 = 4</text>
  <path d="M 640 452 Q 697 420 754 420" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 770 432 Q 766 475 770 518" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 753 542 Q 695 524 640 468" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <path d="M 574 470 Q 587 447 606 415" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <g filter="url(#sk)"><circle cx="625" cy="460" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="625" y="465" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">0</text>
  <g filter="url(#sk)"><circle cx="770" cy="415" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="770" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">1</text>
  <g filter="url(#sk)"><circle cx="770" cy="535" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="770" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">2</text>
  <g filter="url(#sk)"><circle cx="575" cy="545" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
  <text x="575" y="550" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">3</text>
  <text x="620" y="500" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a">ans=3</text>
  <text x="815" y="420" font-size="11" font-weight="bold" fill="#4a7a3a">ans=3</text>
  <text x="815" y="540" font-size="11" font-weight="bold" fill="#4a7a3a">ans=3</text>
  <text x="575" y="584" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">ans=4</text>

  <!-- formula box -->
  <g filter="url(#sk)">
    <rect x="750" y="565" width="180" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="840" y="585" text-anchor="middle" font-size="10.5" fill="#2b2b2b">ans[3] = ans[edges[3]] + 1</text>
  <text x="840" y="605" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a">= ans[0] + 1 = 4 ✓</text>

  <!-- final answer strip -->
  <text x="560" y="606" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b">answer =</text>
  <g filter="url(#sk)"><rect x="570" y="590" width="34" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="587" y="608" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">3</text>
  <g filter="url(#sk)"><rect x="610" y="590" width="34" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="627" y="608" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">3</text>
  <g filter="url(#sk)"><rect x="650" y="590" width="34" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="667" y="608" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">3</text>
  <g filter="url(#sk)"><rect x="690" y="590" width="34" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="707" y="608" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07818">4</text>
</svg>
