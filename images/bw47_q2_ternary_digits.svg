<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：三进制表示的每一位，就是「这一个幂取几次」</text>

  <!-- 位权标注 -->
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="140" y="66">3⁰ 位</text><text x="220" y="66">3¹ 位</text><text x="300" y="66">3² 位</text><text x="380" y="66">3³ 位</text><text x="460" y="66">3⁴ 位</text>
  </g>

  <!-- 合法：91 = 10101₃ -->
  <g filter="url(#rough2)">
    <rect x="100" y="80" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="180" y="80" width="80" height="40" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="260" y="80" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="340" y="80" width="80" height="40" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="420" y="80" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="140" y="105" fill="#2f5226">1</text><text x="220" y="105" fill="#aaa">0</text><text x="300" y="105" fill="#2f5226">1</text><text x="380" y="105" fill="#aaa">0</text><text x="460" y="105" fill="#2f5226">1</text>
  </g>
  <text x="300" y="142" text-anchor="middle" font-size="12" fill="#2f5226" font-weight="bold" filter="url(#rough2)">91 = 1+9+81 = 3⁰+3²+3⁴ ✓（每位都是 0 或 1，每个幂至多取一次）</text>

  <!-- 非法：21 = 210₃ -->
  <g font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="180" y="182">3⁰ 位</text><text x="260" y="182">3¹ 位</text><text x="340" y="182">3² 位</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="140" y="196" width="80" height="40" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="220" y="196" width="80" height="40" fill="#fff" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <rect x="300" y="196" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="180" y="221" fill="#aaa">0</text><text x="260" y="221" fill="#aaa">1</text><text x="340" y="221" fill="#b85450">2</text>
  </g>
  <text x="300" y="258" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">21 = 0+3+18 = 3¹+2×3² ✗（3² 位是 2：同一个幂要取两次！）</text>

  <!-- 说明框 -->
  <rect x="40" y="282" width="480" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="58" y="306" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">判定等价于：把 n 写成三进制，看是否每位 ∈ {0, 1}。</text>
  <text x="58" y="328" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">若某位 d_k = 2，意味着 n 的和式中 3^k 出现两次；</text>
  <text x="58" y="348" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">而「不同的三的幂」要求每个 3^k 至多取一次，矛盾。</text>
  <text x="58" y="366" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">反复除 3 即可逐位检查，无需真的展开。</text>
</svg>
