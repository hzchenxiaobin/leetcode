<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="880" height="452" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：a = [0, 8, 1, 7, 3]，m = 3 ⇒ k = 2</text>
  <text x="440" y="56" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">候选 = m·a[i] − sum（sum 是前缀里最小的 k 个之和），ans 取全部候选的最大值</text>

  <!-- 表头 -->
  <rect x="48" y="72" width="784" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="128" y="94" text-anchor="middle" font-size="12.2" fill="#2f4a66" filter="url(#rough2)">位置 i</text>
  <text x="214" y="94" text-anchor="middle" font-size="12.2" fill="#2f4a66" filter="url(#rough2)">a[i]</text>
  <text x="336" y="94" text-anchor="middle" font-size="12.2" fill="#2f4a66" filter="url(#rough2)">前缀 a[0..i−1]</text>
  <text x="466" y="94" text-anchor="middle" font-size="12.2" fill="#2f4a66" filter="url(#rough2)">最小 2 个</text>
  <text x="552" y="94" text-anchor="middle" font-size="12.2" fill="#2f4a66" filter="url(#rough2)">sum</text>
  <text x="664" y="94" text-anchor="middle" font-size="12.2" fill="#2f4a66" filter="url(#rough2)">候选值</text>
  <text x="788" y="94" text-anchor="middle" font-size="12.2" font-weight="bold" fill="#33582a" filter="url(#rough2)">ans</text>

  <!-- 行 1 -->
  <rect x="48" y="106" width="784" height="36" rx="7" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="128" y="130" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="214" y="130" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="336" y="130" text-anchor="middle" font-size="12.2" fill="#777" filter="url(#rough2)">（空）</text>
  <text x="466" y="130" text-anchor="middle" font-size="12.2" fill="#999" filter="url(#rough2)">—</text>
  <text x="552" y="130" text-anchor="middle" font-size="12.2" fill="#999" filter="url(#rough2)">—</text>
  <text x="664" y="130" text-anchor="middle" font-size="11.8" fill="#999" filter="url(#rough2)">不足 2 个，跳过</text>
  <text x="788" y="130" text-anchor="middle" font-size="12.2" fill="#999" filter="url(#rough2)">—</text>

  <!-- 行 2 -->
  <rect x="48" y="142" width="784" height="36" rx="7" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="128" y="166" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="214" y="166" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="336" y="166" text-anchor="middle" font-size="12.2" fill="#777" filter="url(#rough2)">[0]</text>
  <text x="466" y="166" text-anchor="middle" font-size="12.2" fill="#999" filter="url(#rough2)">—</text>
  <text x="552" y="166" text-anchor="middle" font-size="12.2" fill="#999" filter="url(#rough2)">—</text>
  <text x="664" y="166" text-anchor="middle" font-size="11.8" fill="#999" filter="url(#rough2)">只有 1 个，跳过</text>
  <text x="788" y="166" text-anchor="middle" font-size="12.2" fill="#999" filter="url(#rough2)">—</text>

  <!-- 行 3 -->
  <rect x="48" y="178" width="784" height="36" rx="7" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="128" y="202" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="214" y="202" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="336" y="202" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">[0, 8]</text>
  <text x="466" y="202" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">{0, 8}</text>
  <text x="552" y="202" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="664" y="202" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3·1 − 8 = −5</text>
  <text x="788" y="202" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">−5</text>

  <!-- 行 4：最优 -->
  <rect x="48" y="214" width="784" height="36" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="128" y="238" text-anchor="middle" font-size="12.2" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>
  <text x="214" y="238" text-anchor="middle" font-size="12.2" font-weight="bold" fill="#8a6015" filter="url(#rough2)">7</text>
  <text x="336" y="238" text-anchor="middle" font-size="12.2" fill="#8a6015" filter="url(#rough2)">[0, 8, 1]</text>
  <text x="466" y="238" text-anchor="middle" font-size="12.2" font-weight="bold" fill="#8a6015" filter="url(#rough2)">{0, 1}</text>
  <text x="552" y="238" text-anchor="middle" font-size="12.2" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="664" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3·7 − 1 = 20</text>
  <text x="788" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">20</text>

  <!-- 行 5 -->
  <rect x="48" y="250" width="784" height="36" rx="7" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="128" y="274" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="214" y="274" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="336" y="274" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">[0, 8, 1, 7]</text>
  <text x="466" y="274" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">{0, 1}</text>
  <text x="552" y="274" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="664" y="274" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3·3 − 1 = 8</text>
  <text x="788" y="274" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">20</text>

  <!-- 左卡：第二组样例 -->
  <rect x="48" y="300" width="384" height="124" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="64" y="324" font-size="12.4" font-weight="bold" fill="#33582a" filter="url(#rough2)">另一组：a = [5, −100, 4]，m = 2 ⇒ k = 1</text>
  <text x="64" y="348" font-size="11.6" fill="#33582a" filter="url(#rough2)">i=1：前缀 [5]，min = 5 ⇒ 2·(−100) − 5 = −205</text>
  <text x="64" y="369" font-size="11.6" fill="#33582a" filter="url(#rough2)">i=2：前缀 [5, −100]，min = −100</text>
  <text x="64" y="390" font-size="11.6" fill="#33582a" filter="url(#rough2)">　　　⇒ 2·4 − (−100) = 108 ← 最优</text>
  <text x="64" y="411" font-size="11.6" fill="#33582a" filter="url(#rough2)">答案 108，与官方输出一致</text>

  <!-- 右卡：为什么负数反而赚 -->
  <rect x="452" y="300" width="380" height="124" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="468" y="324" font-size="12.4" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">为什么「挑个很小的数」反而赚</text>
  <text x="468" y="348" font-size="11.6" fill="#8c3a37" filter="url(#rough2)">选 −100 当前一项：它自身只扣 100 分，</text>
  <text x="468" y="369" font-size="11.6" fill="#8c3a37" filter="url(#rough2)">却把末项差分从 4 抬到 104，乘 2 后</text>
  <text x="468" y="390" font-size="11.6" fill="#8c3a37" filter="url(#rough2)">净赚 108。化简式里它只是被减去的</text>
  <text x="468" y="411" font-size="11.6" fill="#8c3a37" filter="url(#rough2)">sum —— 越负，答案越大。</text>

  <path d="M 800 246 C 844 268 838 302 762 316" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="440" y="444" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">i &lt; k 的行永远不产生候选：前缀长度不足 k，根本凑不出「前 m−1 篇」</text>
</svg>
