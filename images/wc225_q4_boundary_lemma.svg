<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">等周引理：外边界只由最长行 r0 决定</text>

  <!-- ===== 上：T 与它的外边界 ===== -->
  <text x="150" y="66" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">T（阶梯形）与 ∂T（虚线格）</text>

  <rect x="80" y="78" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="114" y="78" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="148" y="78" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="80" y="112" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="114" y="112" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="80" y="146" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <rect x="182" y="78" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="148" y="112" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="114" y="146" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="80" y="180" width="30" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="250" y="100" font-size="13" fill="#333" filter="url(#rough2)">|T| = 3 + 2 + 1 = 6 = T3</text>
  <text x="250" y="128" font-size="13" fill="#333" filter="url(#rough2)">|∂T| = r0 + 1 = 3 + 1 = 4</text>
  <text x="250" y="156" font-size="13" fill="#b85450" filter="url(#rough2)">|T| + |∂T| = 10 = T4</text>

  <!-- ===== 下：内部格 ===== -->
  <text x="150" y="192" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">内部：四邻都在 T 里的格子</text>

  <rect x="84" y="200" width="22" height="22" rx="3" fill="#f2f6fb" stroke="#c9d6e6" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="110" y="200" width="22" height="22" rx="3" fill="#f2f6fb" stroke="#c9d6e6" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="136" y="200" width="22" height="22" rx="3" fill="#f2f6fb" stroke="#c9d6e6" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="84" y="226" width="22" height="22" rx="3" fill="#f2f6fb" stroke="#c9d6e6" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="110" y="226" width="22" height="22" rx="3" fill="#f2f6fb" stroke="#c9d6e6" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="84" y="252" width="22" height="22" rx="3" fill="#f2f6fb" stroke="#c9d6e6" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="84" y="200" width="22" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="110" y="200" width="22" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="84" y="226" width="22" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="250" y="216" font-size="13" fill="#333" filter="url(#rough2)">上一层只能落在内部格上</text>
  <text x="250" y="244" font-size="13" fill="#333" filter="url(#rough2)">|内部| = 2 + 1 = 3 = T2</text>

  <!-- ===== 结论 ===== -->
  <rect x="60" y="292" width="440" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">底层 T_h + k 格 ⇒ 上一层至多 T_{h-1} + k − 1 格</text>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">所以底层多 k 格，总量只多 1+2+…+k = T_k</text>
</svg>
