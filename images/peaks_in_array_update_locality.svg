<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">单点修改的局部性：只动摇 3 个峰位</text>
  <text x="260" y="52" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">p[j] 只依赖窗口 nums[j−1..j+1]；改 nums[idx] 只影响覆盖 idx 的窗口</text>

  <!-- nums cells: [2,6,4,5,1,3], idx=3 highlighted -->
  <rect x="60" y="80" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="91" y="105" text-anchor="middle" font-size="14" fill="#2f4358" filter="url(#rough2)">2</text>
  <rect x="130" y="80" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="161" y="105" text-anchor="middle" font-size="14" fill="#2f4358" filter="url(#rough2)">6</text>
  <rect x="200" y="80" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="231" y="105" text-anchor="middle" font-size="14" fill="#2f4358" filter="url(#rough2)">4</text>
  <rect x="270" y="80" width="62" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="301" y="105" text-anchor="middle" font-size="14" fill="#7c2b28" filter="url(#rough2)">5</text>
  <rect x="340" y="80" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="371" y="105" text-anchor="middle" font-size="14" fill="#2f4358" filter="url(#rough2)">1</text>
  <rect x="410" y="80" width="62" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="441" y="105" text-anchor="middle" font-size="14" fill="#2f4358" filter="url(#rough2)">3</text>

  <text x="91" y="136" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="161" y="136" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="231" y="136" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="301" y="136" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3 = idx</text>
  <text x="371" y="136" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="441" y="136" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>

  <!-- three windows above cells -->
  <path d="M130,72 L232,72" stroke="#4a7a3a" stroke-width="1.8" marker-start="url(#arrG)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="181" y="62" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">p[2] 看 1..3</text>

  <path d="M200,50 L302,50" stroke="#d6a040" stroke-width="1.8" marker-start="url(#arrR)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="251" y="40" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">p[3] 看 2..4</text>

  <path d="M270,72 L372,72" stroke="#446688" stroke-width="1.8" marker-start="url(#arrB)" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="321" y="62" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">p[4] 看 3..5</text>

  <!-- refresh flow -->
  <text x="260" y="168" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">修改 nums[idx] = val 后：</text>

  <rect x="52" y="184" width="132" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="118" y="202" text-anchor="middle" font-size="12" fill="#2d4d24" filter="url(#rough2)">refresh(idx−1)</text>
  <text x="118" y="220" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">O(1) 重算</text>

  <rect x="194" y="184" width="132" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">refresh(idx)</text>
  <text x="260" y="220" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">O(1) 重算</text>

  <rect x="336" y="184" width="132" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="402" y="202" text-anchor="middle" font-size="12" fill="#2f4358" filter="url(#rough2)">refresh(idx+1)</text>
  <text x="402" y="220" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">O(1) 重算</text>

  <!-- arrows to BIT -->
  <path d="M118,232 C118,258 200,272 252,286" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M260,232 C260,256 260,268 260,286" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M402,232 C402,258 320,272 268,286" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="130" y="262" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">Δ = 新 − 旧，只有变化才进 BIT</text>

  <!-- BIT box -->
  <rect x="120" y="288" width="280" height="46" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="6,4" rx="10" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">树状数组 BIT</text>
  <text x="260" y="326" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">单点加 add(j+1, Δ) · 前缀和 pre(i)</text>

  <!-- summary -->
  <rect x="40" y="352" width="440" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="373" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">操作集归纳：至多 3 次单点加 + 1 次前缀和相减</text>
  <text x="260" y="396" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">「和可减」→ 树状数组甜区，无需懒标记线段树</text>
</svg>
