<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：预处理禁止割 → 归约 → 逐位贪心</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">整体 O(n α(n))，其中只在最后不超过 20 位才做精确 DP</text>

  <rect x="186" y="60" width="188" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="81" text-anchor="middle" font-size="11" fill="#33475f" filter="url(#rough2)">读入 n, k 与部分排列 p</text>

  <path d="M 280 92 L 280 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="46" y="116" width="468" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">O(n) 扫一遍：i 是干净割（没有已知数跨越 i）时，记 c = i 左侧缺失位置数</text>
  <text x="280" y="151" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">得到禁止前缀割集合 A；对反转排列做同样的事得到禁止后缀割集合 B</text>

  <path d="M 280 160 L 280 176" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="180" width="320" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="201" text-anchor="middle" font-size="10" fill="#8f3f3b" filter="url(#rough2)">存在 c = 0 或 c = m 的干净割 ⇒ 该前缀永远填满 ⇒ 输出 -1</text>

  <path d="M 280 214 L 280 228" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="232" width="420" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="249" text-anchor="middle" font-size="10.5" fill="#7a5c18" filter="url(#rough2)">归约：答案 = 缺失值按某个 m 元排列 q 填进缺失位置 a₁&lt;…&lt;a_m</text>
  <text x="280" y="266" text-anchor="middle" font-size="10" fill="#7a5c18" filter="url(#rough2)">原条件 ⇔ q 前 c 项 ≠ {1..c} (c∈A)、q 后 s 项 ≠ {1..s} (s∈B)</text>

  <path d="M 250 274 L 190 296" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 274 L 370 296" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="300" width="230" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="318" text-anchor="middle" font-size="10.5" fill="#33475f" font-weight="bold" filter="url(#rough2)">剩余 r ≥ 20 位</text>
  <text x="145" y="335" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">任何可行名次都有 &gt; 10¹⁸ 种补全</text>
  <text x="145" y="352" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">⇒ 直接取最小可行名次，不动 k</text>

  <rect x="300" y="300" width="230" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="318" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">剩余 r ≤ 19 位</text>
  <text x="415" y="335" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">用 D(A′)+D(B′)−r! 精确计数</text>
  <text x="415" y="352" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">k 更大就减去该块，继续下一个名次</text>

  <text x="280" y="382" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">D(S)：禁用前缀割集合 S 时的排列数，由「不可分拆块」计数 a_j 的卷积 DP 得出</text>
</svg>
