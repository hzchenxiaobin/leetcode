<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <!-- 示例 1 -->
  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 1：x=2, y=5, z=1 → 2·1 + 4·2 + 2 = 12</text>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="40" y="52" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="62" y="72" text-anchor="middle">BB</text>
    <rect x="84" y="52" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="106" y="72" text-anchor="middle">AA</text>
    <rect x="128" y="52" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="150" y="72" text-anchor="middle">BB</text>
    <rect x="172" y="52" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="194" y="72" text-anchor="middle">AA</text>
    <rect x="216" y="52" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="238" y="72" text-anchor="middle">BB</text>
    <rect x="260" y="52" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="282" y="72" text-anchor="middle">AB</text>
    <text x="320" y="72" font-size="13">← AB 放在最后的 BB 之后（或最前的 BB 之后）</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="40" y="96" width="264" height="34" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <text x="46" y="118">B B A A B B A A B B A B</text>
    <text x="320" y="118" font-size="12" fill="#4a7a3a">骨架用 3 个 BB、2 个 AA（b = a+1）✓</text>
  </g>

  <!-- 分隔 -->
  <path d="M 60 150 C 220 158, 420 158, 580 150" stroke="#ddd" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- 示例 2 -->
  <text x="320" y="180" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2：x=3, y=2, z=2 → 2·2 + 4·2 + 2 = 14</text>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="40" y="202" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="62" y="222" text-anchor="middle">AB</text>
    <rect x="84" y="202" width="44" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="106" y="222" text-anchor="middle">AB</text>
    <rect x="128" y="202" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="150" y="222" text-anchor="middle">AA</text>
    <rect x="172" y="202" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="194" y="222" text-anchor="middle">BB</text>
    <rect x="216" y="202" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="238" y="222" text-anchor="middle">AA</text>
    <rect x="260" y="202" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="282" y="222" text-anchor="middle">BB</text>
    <rect x="304" y="202" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="326" y="222" text-anchor="middle">AA</text>
    <text x="380" y="222" font-size="13">← AB 链垒在最前，骨架以 AA 开头</text>
  </g>
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <rect x="40" y="246" width="308" height="34" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <text x="46" y="268">A B A B A A B B A A B B A A</text>
    <text x="380" y="268" font-size="12" fill="#446688">3 个 AA、2 个 BB（a = b+1）✓</text>
  </g>

  <!-- 公式框 -->
  <g filter="url(#rough2)">
    <rect x="90" y="300" width="460" height="60" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="320" y="324" text-anchor="middle" font-size="14" fill="#333">ans = 2z（AB 全用）+ 4·min(x,y)（交错骨架）</text>
    <text x="320" y="346" text-anchor="middle" font-size="14" fill="#b85450">+ (x ≠ y ? 2 : 0)（多数类型多摆一块）</text>
  </g>
</svg>
