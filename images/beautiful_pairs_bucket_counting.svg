<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">桶计数流程：一次遍历，先查桶、后入桶</text>
  <path d="M 160 42 Q 320 50 480 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- left flow -->
  <g filter="url(#sk)">
    <rect x="50" y="60" width="280" height="42" rx="8" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
  </g>
  <text x="190" y="86" text-anchor="middle" font-size="13" fill="#555555">cnt[1..9] ← 0，ans ← 0</text>
  <path d="M 190 102 L 190 122" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="50" y="124" width="280" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="190" y="150" text-anchor="middle" font-size="13" fill="#2e6e2e">取当前元素 x，末位 b = x mod 10</text>
  <path d="M 190 166 L 190 186" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="30" y="188" width="320" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="190" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">对 d = 1..9：若 gcd(d, b) = 1</text>
  <text x="190" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">ans += cnt[d]　← 查桶</text>
  <path d="M 190 246 L 190 266" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="50" y="268" width="280" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="190" y="288" text-anchor="middle" font-size="13" fill="#2b6e9e">求首位 fd（除 10 至 &lt; 10）</text>
  <text x="190" y="304" text-anchor="middle" font-size="13" fill="#2b6e9e">cnt[fd] += 1　← 入桶</text>
  <path d="M 190 310 L 190 330" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond -->
  <g filter="url(#sk)">
    <polygon points="190,330 274,370 190,410 106,370" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
  </g>
  <text x="190" y="375" text-anchor="middle" font-size="12" fill="#555555">遍历完了？</text>

  <!-- no: loop back -->
  <path d="M 106 370 Q 40 370 40 300 Q 40 145 50 145" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="34" y="230" text-anchor="middle" font-size="11" fill="#555555" transform="rotate(-90 34 230)">否，下一个 j</text>

  <!-- yes: return -->
  <path d="M 274 370 L 330 370" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="298" y="360" text-anchor="middle" font-size="11" fill="#2e6e2e">是</text>
  <g filter="url(#sk)">
    <rect x="334" y="348" width="110" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="389" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">返回 ans</text>

  <!-- right bucket panel -->
  <g filter="url(#sk)">
    <rect x="440" y="60" width="180" height="222" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
  </g>
  <text x="530" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555">cnt 桶：已扫过元素的首位</text>

  <!-- 3x3 grid, cells 44x44 -->
  <g filter="url(#sk)">
    <rect x="462" y="98" width="44" height="44" rx="4" fill="#dbe9f7" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="512" y="98" width="44" height="44" rx="4" fill="#dbe9f7" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="562" y="98" width="44" height="44" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="462" y="150" width="44" height="44" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="512" y="150" width="44" height="44" rx="4" fill="#dbe9f7" stroke="#4a8edb" stroke-width="1.6"/>
    <rect x="562" y="150" width="44" height="44" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="462" y="202" width="44" height="44" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="512" y="202" width="44" height="44" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.2"/>
    <rect x="562" y="202" width="44" height="44" rx="4" fill="#f4f4f4" stroke="#aaaaaa" stroke-width="1.2"/>
  </g>
  <text x="484" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">1</text>
  <text x="484" y="135" text-anchor="middle" font-size="11" fill="#2b6e9e">× 1</text>
  <text x="534" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">2</text>
  <text x="534" y="135" text-anchor="middle" font-size="11" fill="#2b6e9e">× 1</text>
  <text x="584" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#999999">3</text>
  <text x="584" y="135" text-anchor="middle" font-size="11" fill="#bbbbbb">× 0</text>
  <text x="484" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#999999">4</text>
  <text x="484" y="187" text-anchor="middle" font-size="11" fill="#bbbbbb">× 0</text>
  <text x="534" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">5</text>
  <text x="534" y="187" text-anchor="middle" font-size="11" fill="#2b6e9e">× 1</text>
  <text x="584" y="169" text-anchor="middle" font-size="12" font-weight="bold" fill="#999999">6</text>
  <text x="584" y="187" text-anchor="middle" font-size="11" fill="#bbbbbb">× 0</text>
  <text x="484" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#999999">7</text>
  <text x="484" y="239" text-anchor="middle" font-size="11" fill="#bbbbbb">× 0</text>
  <text x="534" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#999999">8</text>
  <text x="534" y="239" text-anchor="middle" font-size="11" fill="#bbbbbb">× 0</text>
  <text x="584" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#999999">9</text>
  <text x="584" y="239" text-anchor="middle" font-size="11" fill="#bbbbbb">× 0</text>

  <!-- link arrows flow -> bucket -->
  <path d="M 350 205 Q 400 180 438 150" stroke="#8a6415" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="398" y="158" text-anchor="middle" font-size="11" fill="#8a6415">查桶</text>
  <path d="M 330 290 Q 390 285 438 235" stroke="#2b6e9e" stroke-width="1.4" fill="none" stroke-dasharray="5,4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="388" y="252" text-anchor="middle" font-size="11" fill="#2b6e9e">入桶</text>

  <!-- bottom notes -->
  <g filter="url(#sk)">
    <rect x="40" y="428" width="300" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="190" y="445" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">x 自己后入桶 → 查桶时桶里只有 i &lt; j，</text>
  <text x="190" y="461" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">(j, j) 永远不会被算进去</text>

  <g filter="url(#sk)">
    <rect x="356" y="428" width="244" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="478" y="445" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">gcd(d, 1) = 1 恒成立 → 末位是 1 时</text>
  <text x="478" y="461" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6415">与前面全部元素配对</text>
</svg>
