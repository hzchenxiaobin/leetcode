<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="7.5" refY="3.2" orient="auto">
      <path d="M0,0 L7.5,3.2 L0,6.4 Z" fill="#446688"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="10" refX="7.5" refY="3.2" orient="auto">
      <path d="M0,0 L7.5,3.2 L0,6.4 Z" fill="#8a8a96"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fafafa"/>

  <text x="26" y="28" font-size="16" font-weight="bold" fill="#33333a" filter="url(#rough2)">算法流程：只枚举一半，把“必须合并的边”打上标记</text>

  <rect x="200" y="44" width="260" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="70" text-anchor="middle" font-size="15" fill="#22364d" filter="url(#rough2)">读入 n 与字符串 s</text>

  <path d="M330,86 L330,104" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="186" y="106" width="288" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="132" text-anchor="middle" font-size="15" fill="#2f4a24" filter="url(#rough2)">for i = 0 … n/2 − 1（只看左半边）</text>

  <path d="M330,148 L330,166" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="180" y="168" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="194" text-anchor="middle" font-size="15" fill="#22364d" filter="url(#rough2)">取 c = s[i]，d = s[n−1−i]</text>

  <path d="M330,210 L330,228" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <polygon points="330,230 460,262 330,294 200,262" fill="#fff8e1"
           stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="268" text-anchor="middle" font-size="15" fill="#5c4a1a" filter="url(#rough2)">c ≠ d ?</text>

  <text x="318" y="308" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M330,294 L330,316" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <text x="476" y="252" text-anchor="middle" font-size="13" fill="#8a8a96" filter="url(#rough2)">否</text>
  <path d="M460,262 L498,262" stroke="#8a8a96" stroke-width="1.6" stroke-dasharray="5 4"
        fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <rect x="502" y="238" width="146" height="48" rx="8" fill="#f2f2f4" stroke="#8a8a96"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="575" y="258" text-anchor="middle" font-size="12.5" fill="#5a5a66" filter="url(#rough2)">这一对本来就相等</text>
  <text x="575" y="276" text-anchor="middle" font-size="12.5" fill="#5a5a66" filter="url(#rough2)">不产生任何边</text>

  <rect x="180" y="318" width="300" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="341" text-anchor="middle" font-size="15" fill="#7a3030" filter="url(#rough2)">diff[min]++ ; diff[max]−−</text>
  <text x="330" y="363" text-anchor="middle" font-size="13" fill="#7a3030" filter="url(#rough2)">把边 min … max−1 整段标记</text>

  <path d="M330,374 L330,396" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="170" y="398" width="320" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="428" text-anchor="middle" font-size="15" fill="#22364d" filter="url(#rough2)">前缀和 cur；cur &gt; 0 的边累加得 ans</text>

  <text x="330" y="462" text-anchor="middle" font-size="13.5" fill="#4a7a3a" filter="url(#rough2)">ans 即最少操作数：每条被标记的边恰好做一次即可</text>
</svg>
