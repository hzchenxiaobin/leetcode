<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="520" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每组两次判据：先判“有没有解”，再判“能不能省 c”</text>
  <path d="M 176 42 Q 380 49 584 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="270" y="54" width="220" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="79" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 t（多测组数）</text>

  <path d="M 380 94 L 380 106" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="240" y="106" width="280" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="131" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">每组读入 n, c 与数组 a, b</text>

  <path d="M 380 146 L 380 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="380,156 540,204 380,252 220,204" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">S = Σa − Σb &lt; 0 ?</text>
  <text x="380" y="221" text-anchor="middle" font-size="10.5" fill="#a07c2a" filter="url(#rough2)">（元素只能变小）</text>

  <path d="M 220 204 L 152 204" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="188" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#a14340" filter="url(#rough2)">是</text>
  <rect x="36" y="182" width="108" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="209" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 −1</text>

  <path d="M 380 252 L 380 266" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="262" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="196" y="266" width="368" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="291" text-anchor="middle" font-size="12.5" fill="#2f4a2a" filter="url(#rough2)">把 a、b 分别升序排序，逐一比较 saₖ 与 sbₖ</text>

  <path d="M 380 306 L 380 318" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="380,318 552,366 380,414 208,366" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">所有 k 都有 saₖ ≥ sbₖ ?</text>
  <text x="380" y="383" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（最宽松的配对，等价于有解）</text>

  <path d="M 208 366 L 152 366" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="180" y="357" text-anchor="middle" font-size="11" font-weight="bold" fill="#a14340" filter="url(#rough2)">否</text>
  <rect x="36" y="344" width="108" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="371" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 −1</text>

  <path d="M 380 414 L 380 428" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="424" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="206" y="428" width="348" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">ans ← c + S（至少换序一次）</text>

  <text x="380" y="492" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">若逐位 aᵢ ≥ bᵢ 也成立，则 ans ← min(ans, S)（省下 c 秒）</text>
  <text x="380" y="512" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">输出 ans，进入下一组测试；s 与答案都用 long long 更稳</text>
</svg>
