<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">惰性删除：过期编号留在堆里，出堆时才检查</text>
  <text x="280" y="42" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">堆不支持「删除任意元素」，所以「已满 / 已裁掉」的编号只在取用时过滤</text>

  <text x="280" y="66" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">小根堆中的栈编号（升序）</text>

  <g filter="url(#rough2)">
    <rect x="109" y="78" width="62" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="179" y="78" width="62" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <rect x="249" y="78" width="62" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6"/>
    <rect x="319" y="78" width="62" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <rect x="389" y="78" width="62" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
  </g>

  <g text-anchor="middle" filter="url(#rough2)">
    <text x="140" y="99" font-size="15" fill="#3a5a30" font-weight="bold">1</text>
    <text x="140" y="115" font-size="8" fill="#4a7a3a">有效</text>
    <text x="210" y="99" font-size="15" fill="#8a3a36" font-weight="bold">2</text>
    <text x="210" y="115" font-size="8" fill="#b85450">已满 → 丢</text>
    <text x="280" y="99" font-size="15" fill="#8a6a20" font-weight="bold">5</text>
    <text x="280" y="115" font-size="8" fill="#a8811f">已裁掉 → 丢</text>
    <text x="350" y="99" font-size="15" fill="#3a5a30" font-weight="bold">8</text>
    <text x="350" y="115" font-size="8" fill="#4a7a3a">有效</text>
    <text x="420" y="99" font-size="15" fill="#3a5a30" font-weight="bold">9</text>
    <text x="420" y="115" font-size="8" fill="#4a7a3a">有效</text>
  </g>

  <text x="140" y="74" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">堆顶</text>
  <path d="M 210 124 L 210 134" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 124 L 280 134" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="138" width="500" height="56" fill="#f5f7fb" stroke="#8f9bb0" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g font-size="9.5" filter="url(#rough2)">
    <text x="42" y="157" fill="#444" font-weight="bold" font-size="10">push 时的取用流程</text>
    <text x="42" y="173" fill="#555">① 看堆顶：若「栈已满」或「编号 ≥ 当前栈数」→ pop 丢弃，再看新堆顶</text>
    <text x="42" y="188" fill="#555">② 命中有效编号就落子；堆被弹空 ⇒ 所有栈都满 ⇒ 右端新开一栈</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="16" y="208" width="170" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <rect x="196" y="208" width="170" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <rect x="376" y="208" width="170" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>

  <g font-size="9" filter="url(#rough2)">
    <text x="28" y="226" fill="#3a4a66" font-weight="bold" font-size="10">三种入堆时机</text>
    <text x="28" y="243" fill="#555">push 之后该栈仍未满</text>
    <text x="28" y="259" fill="#555">pop / popAtStack 腾出空位</text>
    <text x="28" y="275" fill="#555">新建栈时它本来就有空位</text>
    <text x="28" y="291" fill="#7a8899">（即「由满变空」必入堆）</text>

    <text x="208" y="226" fill="#8a6a20" font-weight="bold" font-size="10">允许重复编号</text>
    <text x="208" y="243" fill="#555">popAtStack 时该栈原本未满</text>
    <text x="208" y="259" fill="#555">于是同一编号可能进堆两次</text>
    <text x="208" y="275" fill="#555">取用时判「已满」即丢弃</text>
    <text x="208" y="291" fill="#7a8899">堆大小仍是 O(操作数)</text>

    <text x="388" y="226" fill="#3a5a30" font-weight="bold" font-size="10">为什么不会漏</text>
    <text x="388" y="243" fill="#555">有空位 ⇒ 该编号必在堆中</text>
    <text x="388" y="259" fill="#555">所以堆空 ⇒ 真的没有空位</text>
    <text x="388" y="275" fill="#555">此时新开栈不会浪费旧空位</text>
    <text x="388" y="291" fill="#7a8899">（这条不变量见引理 3）</text>
  </g>

  <text x="280" y="316" text-anchor="middle" font-size="9" fill="#9a9a9a" filter="url(#rough2)">代价：每个编号最多被检查/弹出常数次，均摊 O(log 操作数) 一次</text>
</svg>
