<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">三段式子数组：严格递增 → 严格递减 → 严格递增</text>
  <text x="320" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">三段共享峰 p 与谷 q；l &lt; p &lt; q &lt; r ⟹ 每段长度 ≥ 2（最短窗口 4 个元素）</text>

  <!-- 折线：nums = [1,4,2,7] -->
  <path d="M130,300 L250,201" stroke="#446688" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <path d="M250,201 L370,267" stroke="#d6a040" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <path d="M370,267 L490,102" stroke="#4a7a3a" stroke-width="3" fill="none" filter="url(#rough2)"/>

  <!-- 端点 -->
  <circle cx="130" cy="300" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="250" cy="201" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="370" cy="267" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="490" cy="102" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- 数值标签 -->
  <text x="112" y="308" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="250" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="374" y="290" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="490" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <!-- 段标签 -->
  <text x="138" y="240" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">严格递增</text>
  <text x="326" y="254" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">严格递减</text>
  <text x="446" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">严格递增</text>

  <!-- 峰谷标注 -->
  <path d="M266,178 L256,192" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">峰 p</text>
  <path d="M356,296 L364,282" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">谷 q</text>

  <!-- 下标 -->
  <text x="130" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">l</text>
  <text x="250" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">p</text>
  <text x="370" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">q</text>
  <text x="490" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">r</text>
  <text x="130" y="346" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="250" y="346" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="370" y="346" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="490" y="346" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <!-- 关键约束 -->
  <rect x="60" y="356" width="520" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="379" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">l &lt; p &lt; q &lt; r：四点互异 ⟹ 峰 p 与谷 q 两侧都必须发生真实转折</text>

  <!-- 三段说明 -->
  <rect x="55" y="404" width="165" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="427" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">段一 nums[l..p]</text>
  <text x="137" y="448" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">严格递增 · 长 ≥ 2</text>

  <rect x="238" y="404" width="165" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="427" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">段二 nums[p..q]</text>
  <text x="320" y="448" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">严格递减 · 长 ≥ 2</text>

  <rect x="421" y="404" width="165" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="503" y="427" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">段三 nums[q..r]</text>
  <text x="503" y="448" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">严格递增 · 长 ≥ 2</text>
</svg>
