<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16.5" fill="#333" filter="url(#rough2)">算法流程：一次扫描，遇到新字符就计数</text>

  <!-- 开始 -->
  <rect x="280" y="36" width="80" height="30" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="56" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M320,66 L320,84" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="210" y="88" width="220" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">seen ← ∅，ans ← 0，i ← 0</text>
  <path d="M320,126 L320,144" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：i < n ? -->
  <polygon points="320,148 404,186 320,224 236,186" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="191" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">i &lt; n ?</text>
  <text x="328" y="242" font-size="11.5" fill="#666" filter="url(#rough2)">是</text>
  <text x="412" y="176" font-size="11.5" fill="#666" filter="url(#rough2)">否（扫描完毕）</text>

  <!-- 返回 -->
  <path d="M404,186 L540,186 L540,242" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="455" y="246" width="170" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="540" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">返回 ans</text>
  <text x="540" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">（= s 中不同字符个数）</text>

  <!-- 菱形 2：s[i] ∈ seen ? -->
  <path d="M320,224 L320,248" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="320,252 414,292 320,332 226,292" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="297" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">s[i] ∈ seen ?</text>
  <text x="220" y="280" text-anchor="end" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否（新字符）</text>
  <text x="420" y="280" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">是（重复）</text>

  <!-- 新字符分支 -->
  <path d="M226,292 L150,292 L150,352" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="55" y="356" width="190" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">新字符：ans++</text>
  <text x="150" y="392" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">seen ← seen ∪ {s[i]}</text>
  <text x="150" y="408" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">（在 i 处切一刀）</text>

  <!-- 重复分支 -->
  <path d="M414,292 L490,292 L490,352" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="395" y="356" width="190" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">重复出现：跳过</text>
  <text x="490" y="392" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">s[i] 并入当前段</text>
  <text x="490" y="408" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">（不切割，ans 不变）</text>

  <!-- i++ -->
  <path d="M150,420 L150,474 L251,474" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M490,420 L490,474 L389,474" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="255" y="456" width="130" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="479" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i ← i + 1</text>

  <!-- 回到 i < n -->
  <path d="M320,492 L320,504 L40,504 L40,186 L232,186" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="498" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">继续扫描</text>
</svg>
