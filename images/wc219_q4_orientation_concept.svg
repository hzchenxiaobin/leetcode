<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.5"/>
    </filter>
    <marker id="arro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#fafafa"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：旋转自由度一次性消除——每块内部排序，最大维度当高</text>
  <path d="M 190 42 Q 450 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="450" y="63" text-anchor="middle" font-size="12" fill="#567" filter="url(#rough2)">存在最优塔使每块按 w ≤ l ≤ h 定向：高度取最大维度（只增不减），底面取最小两维（只缩不涨）</text>

  <!-- left card: before reorientation -->
  <rect x="40" y="80" width="330" height="240" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="106" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">重定向前：随手一种朝向</text>
  <g filter="url(#rough2)">
    <path d="M 100 210 L 134 190 L 251 190 L 217 210 Z" fill="#f0f5fb" stroke="#446688" stroke-width="1.6"/>
    <path d="M 217 210 L 251 190 L 251 221 L 217 241 Z" fill="#d9e5f2" stroke="#446688" stroke-width="1.6"/>
    <rect x="100" y="210" width="117" height="31" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="158" y="262" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506e" filter="url(#rough2)">45</text>
  <text x="90" y="230" text-anchor="end" font-size="11.5" font-weight="bold" fill="#33506e" filter="url(#rough2)">12</text>
  <text x="274" y="200" font-size="11.5" font-weight="bold" fill="#33506e" filter="url(#rough2)">23</text>
  <text x="205" y="287" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">底面 45 × 23，高 12 → 只贡献 12</text>
  <text x="205" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">最大维度 45 躺在底面里，浪费了</text>

  <!-- middle arrow -->
  <text x="450" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">内部排序</text>
  <path d="M 378 185 Q 450 168 518 183" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="450" y="215" text-anchor="middle" font-size="10.5" fill="#567" filter="url(#rough2)">最小当宽 · 中间当长 · 最大当高</text>
  <text x="450" y="240" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（示例 1 的 [45,23,12]）</text>

  <!-- right card: after reorientation -->
  <rect x="530" y="80" width="330" height="240" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="695" y="106" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">重定向后：内部排序朝向</text>
  <g filter="url(#rough2)">
    <path d="M 612 128 L 630 114 L 688 114 L 672 128 Z" fill="#f0f5fb" stroke="#446688" stroke-width="1.6"/>
    <path d="M 672 128 L 688 114 L 688 232 L 672 246 Z" fill="#d9e5f2" stroke="#446688" stroke-width="1.6"/>
    <rect x="612" y="128" width="60" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="642" y="266" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506e" filter="url(#rough2)">23</text>
  <text x="604" y="196" text-anchor="end" font-size="11.5" font-weight="bold" fill="#33506e" filter="url(#rough2)">45</text>
  <text x="700" y="122" font-size="11.5" font-weight="bold" fill="#33506e" filter="url(#rough2)">12</text>
  <text x="695" y="287" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">底面 23 × 12，高 45 → 贡献 45</text>
  <text x="695" y="308" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">最大维度竖起，底面反而更小</text>

  <!-- row 2: why the tower doesn't collapse -->
  <rect x="40" y="335" width="820" height="130" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="361" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">为什么整塔重定向后不会塌？—— 排序保序（引理 1）</text>
  <g filter="url(#rough2)">
    <rect x="78" y="404" width="86" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="90" y="376" width="62" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="121" y="423" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506e" filter="url(#rough2)">j（下）</text>
  <text x="121" y="393" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">i（上）</text>
  <text x="190" y="384" font-size="11.5" fill="#333" filter="url(#rough2)">重定向前：w_i ≤ w_j，l_i ≤ l_j，h_i ≤ h_j</text>
  <text x="190" y="406" font-size="11.5" fill="#333" filter="url(#rough2)">⇒ 内部排序后：sort(i)_k ≤ sort(j)_k 仍逐项 ≤</text>
  <text x="190" y="428" font-size="10.5" fill="#567" filter="url(#rough2)">（第 k 小顺序统计量关于每个分量单调非降）</text>
  <path d="M 555 375 L 555 450" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="580" y="384" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">结论（定理 1）：整塔每块同时重定向——</text>
  <text x="580" y="406" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">相邻约束保持（塔不塌），高度 → max 只增不减</text>
  <text x="580" y="428" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⇒ 总高度不降，最优性保住</text>

  <!-- green formula bar -->
  <rect x="90" y="480" width="720" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="501" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5a2a" filter="url(#rough2)">此后 i 可叠于 j 上 ⟺ w_i ≤ w_j 且 l_i ≤ l_j 且 h_i ≤ h_j —— 固定三元组上的三维偏序</text>
  <text x="450" y="520" text-anchor="middle" font-size="10.5" fill="#4a6a45" filter="url(#rough2)">朝向组合 6 的 n 次方 → 每块 1 种：指数级自由度消失，只剩「选哪些块、怎么排」</text>

  <!-- bottom chips -->
  <g filter="url(#rough2)">
    <rect x="40" y="548" width="260" height="60" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="320" y="548" width="260" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="600" y="548" width="260" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="170" y="570" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506e" filter="url(#rough2)">① 高度拉满</text>
  <text x="170" y="591" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">h = 最大维度，任何朝向都超不过</text>
  <text x="450" y="570" text-anchor="middle" font-size="12" font-weight="bold" fill="#a67c1e" filter="url(#rough2)">② 底面最小</text>
  <text x="450" y="591" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">最小两维做底，上方约束只会更松</text>
  <text x="730" y="570" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">③ 一劳永逸</text>
  <text x="730" y="591" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">每块从 6 种朝向定死为 1 种，不再枚举</text>
</svg>
