<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：路径和只需按 mod k 分桶，转移 = 循环移位 + 相加</text>

  <!-- left panel: two paths, two sums, one remainder -->
  <g filter="url(#sk)"><rect x="20" y="44" width="292" height="232" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="166" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">两条路径、两个和、同一余数</text>
  <g filter="url(#sk)"><rect x="100" y="84" width="44" height="44" rx="4" fill="#ffffff" stroke="#8aa2b8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="148" y="84" width="44" height="44" rx="4" fill="#ffffff" stroke="#8aa2b8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="196" y="84" width="44" height="44" rx="4" fill="#ffffff" stroke="#8aa2b8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="100" y="132" width="44" height="44" rx="4" fill="#ffffff" stroke="#8aa2b8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="148" y="132" width="44" height="44" rx="4" fill="#ffffff" stroke="#8aa2b8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="196" y="132" width="44" height="44" rx="4" fill="#ffffff" stroke="#8aa2b8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="100" y="180" width="44" height="44" rx="4" fill="#ffffff" stroke="#8aa2b8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="148" y="180" width="44" height="44" rx="4" fill="#ffffff" stroke="#8aa2b8" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="196" y="180" width="44" height="44" rx="4" fill="#ffffff" stroke="#8aa2b8" stroke-width="1.2"/></g>
  <path d="M 122 103 L 170 103 L 218 103 L 218 151 L 218 199" fill="none" stroke="#b85450" stroke-width="2.4" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 119 106 L 119 154 L 167 154 L 215 154 L 215 202" fill="none" stroke="#446688" stroke-width="2.4" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="122" y="112" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">5</text>
  <text x="170" y="112" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">2</text>
  <text x="218" y="112" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">4</text>
  <text x="122" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">3</text>
  <text x="170" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">0</text>
  <text x="218" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">5</text>
  <text x="122" y="208" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">0</text>
  <text x="170" y="208" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">7</text>
  <text x="218" y="208" text-anchor="middle" font-size="14" fill="#333" filter="url(#sk)">2</text>
  <text x="166" y="246" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#sk)">红 5+2+4+5+2 = 18　蓝 5+3+0+5+2 = 15</text>
  <text x="166" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#sk)">18 mod 3 = 15 mod 3 = 0 → 落进同一个桶</text>

  <!-- right panel: remainder buckets -->
  <g filter="url(#sk)"><rect x="332" y="44" width="288" height="232" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="476" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">状态只需 (i, j, r)，r ∈ [0, k)</text>
  <g filter="url(#sk)"><rect x="356" y="92" width="64" height="46" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="436" y="92" width="64" height="46" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#sk)"><rect x="516" y="92" width="64" height="46" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="388" y="120" text-anchor="middle" font-size="12.5" fill="#2e5e2e" filter="url(#sk)">r = 0</text>
  <text x="468" y="120" text-anchor="middle" font-size="12.5" fill="#2e5e2e" filter="url(#sk)">r = 1</text>
  <text x="548" y="120" text-anchor="middle" font-size="12.5" fill="#2e5e2e" filter="url(#sk)">r = 2</text>
  <path d="M 388 184 L 388 144" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 468 184 C 468 162 420 152 394 142" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 548 184 L 548 144" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arG)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="352" y="186" width="72" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="432" y="186" width="72" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <g filter="url(#sk)"><rect x="512" y="186" width="72" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="388" y="205" text-anchor="middle" font-size="12" fill="#8a6a2a" filter="url(#sk)">和 18</text>
  <text x="468" y="205" text-anchor="middle" font-size="12" fill="#8a6a2a" filter="url(#sk)">和 15</text>
  <text x="548" y="205" text-anchor="middle" font-size="12" fill="#8a6a2a" filter="url(#sk)">和 17</text>
  <text x="476" y="246" text-anchor="middle" font-size="12" fill="#2e5e2e" filter="url(#sk)">和的大小无关紧要——桶编号 = 和 mod k</text>
  <text x="476" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">无穷的「和」压缩成至多 k ≤ 50 个桶</text>

  <!-- bottom panel: push transition -->
  <g filter="url(#sk)"><rect x="20" y="292" width="600" height="166" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="320" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a1a" filter="url(#sk)">push 转移：两源的余数分布各循环移位 g 格后逐位相加</text>
  <g filter="url(#sk)"><rect x="48" y="332" width="170" height="46" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5"/></g>
  <text x="133" y="350" text-anchor="middle" font-size="11.5" fill="#2b4a66" filter="url(#sk)">上方 f[i−1][j]（旧·上行）</text>
  <g filter="url(#sk)"><rect x="85" y="358" width="16" height="16" rx="3" fill="#f4f4f4" stroke="#b0b8bf" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="105" y="358" width="16" height="16" rx="3" fill="#f4f4f4" stroke="#b0b8bf" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="125" y="358" width="16" height="16" rx="3" fill="#ffe9a8" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="145" y="358" width="16" height="16" rx="3" fill="#f4f4f4" stroke="#b0b8bf" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="165" y="358" width="16" height="16" rx="3" fill="#f4f4f4" stroke="#b0b8bf" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="48" y="392" width="170" height="46" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5"/></g>
  <text x="133" y="410" text-anchor="middle" font-size="11.5" fill="#2b4a66" filter="url(#sk)">左方 f[i][j−1]（新·本行）</text>
  <g filter="url(#sk)"><rect x="85" y="418" width="16" height="16" rx="3" fill="#f4f4f4" stroke="#b0b8bf" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="105" y="418" width="16" height="16" rx="3" fill="#f4f4f4" stroke="#b0b8bf" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="125" y="418" width="16" height="16" rx="3" fill="#ffe9a8" stroke="#d6a040" stroke-width="1.8"/></g>
  <g filter="url(#sk)"><rect x="145" y="418" width="16" height="16" rx="3" fill="#f4f4f4" stroke="#b0b8bf" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="165" y="418" width="16" height="16" rx="3" fill="#f4f4f4" stroke="#b0b8bf" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="352" y="360" width="190" height="68" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="447" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">目标 f[i][j]</text>
  <g filter="url(#sk)"><rect x="399" y="396" width="16" height="16" rx="3" fill="#f4f4f4" stroke="#b0b8bf" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="419" y="396" width="16" height="16" rx="3" fill="#f4f4f4" stroke="#b0b8bf" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="439" y="396" width="16" height="16" rx="3" fill="#f4f4f4" stroke="#b0b8bf" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="459" y="396" width="16" height="16" rx="3" fill="#f4f4f4" stroke="#b0b8bf" stroke-width="1"/></g>
  <g filter="url(#sk)"><rect x="479" y="396" width="16" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="479" y="391" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#sk)">(2+2)%5=4</text>
  <text x="407" y="424" text-anchor="middle" font-size="8" fill="#999" filter="url(#sk)">0</text>
  <text x="427" y="424" text-anchor="middle" font-size="8" fill="#999" filter="url(#sk)">1</text>
  <text x="447" y="424" text-anchor="middle" font-size="8" fill="#999" filter="url(#sk)">2</text>
  <text x="467" y="424" text-anchor="middle" font-size="8" fill="#999" filter="url(#sk)">3</text>
  <text x="487" y="424" text-anchor="middle" font-size="8" fill="#999" filter="url(#sk)">4</text>
  <path d="M 220 355 L 348 375" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>
  <path d="M 220 415 L 348 402" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="284" y="348" text-anchor="middle" font-size="11" fill="#a06a1a" filter="url(#sk)">g = grid[i][j] mod k</text>
  <text x="284" y="396" text-anchor="middle" font-size="11" fill="#a06a1a" filter="url(#sk)">分量 r → (r+g) mod k</text>
  <text x="320" y="452" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e5e2e" filter="url(#sk)">f[i][j][(r+g) mod k] ← f[i−1][j][r] + f[i][j−1][r]</text>
</svg>
