<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两遍扫描，每格判定 O(1)</text>

  <rect x="70" y="46" width="420" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">输入 picture：m × n 字符矩阵，元素为 'B' / 'W'</text>

  <path d="M 280 82 L 280 102" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="104" width="420" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="88" y="126" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">第 1 遍 · 统计（O(mn)）</text>
  <text x="88" y="145" font-size="10.5" fill="#555" filter="url(#rough2)">遇到 picture[i][j] == 'B'：rowCnt[i]++、colCnt[j]++</text>

  <path d="M 280 158 L 280 180" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="182" width="420" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="88" y="204" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">第 2 遍 · 判定（O(mn)）</text>
  <text x="88" y="224" font-size="10" fill="#555" filter="url(#rough2)">① rowCnt[i] != 1 → 整行跳过（该行黑格至少 2 个）</text>
  <text x="88" y="242" font-size="10" fill="#555" filter="url(#rough2)">② rowCnt[i] == 1 → 取该行唯一黑格所在列 j</text>
  <text x="88" y="260" font-size="10" fill="#555" filter="url(#rough2)">③ colCnt[j] == 1 → ans++（否则该列还有别的黑格）</text>

  <path d="M 280 278 L 280 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="302" width="420" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">输出 ans：孤独黑色像素的个数</text>

  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">剪枝要点：行计数先筛行，列计数再定案；行内找到唯一黑格即 break</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">总时间 O(mn)，额外空间 O(m + n)</text>
</svg>
