<svg xmlns="http://www.w3.org/2000/svg" width="760" height="412" viewBox="0 0 760 412"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="412" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：S 只需要护住「最左 1」与「最右 1」</text>
  <path d="M 150 42 Q 380 49 610 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 数字轴：位置 1..7，样例 s = 1 1 0 1 0 0 1 -->
  <text x="120" y="76" font-size="12" fill="#66788c" filter="url(#rough2)">整数编号 1 … 7，格子里的数字是 sᵢ</text>

  <rect x="120" y="86" width="64" height="44" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="152" y="115" text-anchor="middle" font-size="19" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="152" y="150" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">L</text>

  <rect x="196" y="86" width="64" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="228" y="115" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="228" y="150" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">2</text>

  <rect x="272" y="86" width="64" height="44" rx="7" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="304" y="115" text-anchor="middle" font-size="19" fill="#8a8a8a" filter="url(#rough2)">0</text>
  <text x="304" y="150" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">3</text>

  <rect x="348" y="86" width="64" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="115" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="380" y="150" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">4</text>

  <rect x="424" y="86" width="64" height="44" rx="7" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="456" y="115" text-anchor="middle" font-size="19" fill="#8a8a8a" filter="url(#rough2)">0</text>
  <text x="456" y="150" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">5</text>

  <rect x="500" y="86" width="64" height="44" rx="7" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="532" y="115" text-anchor="middle" font-size="19" fill="#8a8a8a" filter="url(#rough2)">0</text>
  <text x="532" y="150" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">6</text>

  <rect x="576" y="86" width="64" height="44" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="608" y="115" text-anchor="middle" font-size="19" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="608" y="150" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">R</text>

  <!-- 端点标注 -->
  <text x="152" y="170" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">护住</text>
  <text x="608" y="170" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">护住</text>
  <text x="304" y="170" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">可牺牲</text>

  <!-- range 括号 -->
  <path d="M 124 184 L 124 192 M 124 188 L 604 188 M 604 188 L 604 184" stroke="#b85450" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <text x="364" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">范围 = R − L = 7 − 1 = 6，这就是答案</text>

  <!-- 左下：为什么端点安全 -->
  <rect x="40" y="222" width="326" height="128" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="203" y="246" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">K 的每一步都在帮倒忙</text>
  <text x="56" y="270" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">K 只能「送给」S，不能拿走 S 的元素。</text>
  <text x="56" y="290" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">加入元素只会让 max−min 变大或不变，</text>
  <text x="56" y="310" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">所以缩小范围的唯一途径是 S 自己</text>
  <text x="56" y="330" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">把 L 或 R 送出去 ⇒ 别送就行。∎</text>

  <!-- 右下：为什么 K 能压住 -->
  <rect x="394" y="222" width="326" height="128" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="557" y="246" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">K 的极简应对</text>
  <text x="410" y="270" font-size="11.5" fill="#8a6015" filter="url(#rough2)">「你送我什么，我原样还你」：</text>
  <text x="410" y="290" font-size="11.5" fill="#8a6015" filter="url(#rough2)">每轮结束 S 的集合完全复原成初始集合，</text>
  <text x="410" y="310" font-size="11.5" fill="#8a6015" filter="url(#rough2)">终局就是初始集合，范围恰为 R − L。</text>
  <text x="410" y="330" font-size="11.5" fill="#d6a040" filter="url(#rough2)">唯一例外：k = |S| = 2 时护不住两端 → 1</text>

  <!-- 结论条 -->
  <rect x="40" y="362" width="680" height="38" rx="9" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="386" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">答案 = (1 的个数恰为 2 ? 1 : 最右 1 的下标 − 最左 1 的下标)</text>
</svg>
