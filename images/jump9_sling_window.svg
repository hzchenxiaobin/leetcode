<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="460" fill="#fafafa"/>
  <text x="340" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">弹弓过程：充电 V = pm[0..c]，放电飞向最远的更小值</text>

  <!-- ===== 第①轮 ===== -->
  <text x="340" y="52" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">第①轮：从 i = 0 起飞，V = pm[0] = 3</text>

  <rect x="100" y="84" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="113" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="180" y="84" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="113" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="260" y="84" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="113" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>
  <rect x="340" y="84" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="113" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="420" y="84" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="452" y="113" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <g font-size="8.5" fill="#999" filter="url(#rough2)">
    <text x="156" y="124">0</text><text x="236" y="124">1</text><text x="316" y="124">2</text>
    <text x="396" y="124">3</text><text x="476" y="124">4</text>
  </g>

  <path d="M138,80 Q252,42 362,80" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <ellipse cx="372" cy="107" rx="17" ry="14" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="492" y="72" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">最远落点 T(0) = 3</text>
  <text x="492" y="90" font-size="9.5" fill="#888" filter="url(#rough2)">（1 &lt; 3 也能落，但不是最远）</text>

  <!-- ===== 第②轮 ===== -->
  <text x="100" y="180" font-size="11.5" fill="#446688" filter="url(#rough2)">第②轮：落在 c = 3，充电 V = pm[0..3] = 4，还能再飞吗？</text>

  <rect x="94" y="220" width="318" height="58" fill="#e8f0fe" opacity="0.45" rx="6" filter="url(#rough2)"/>
  <rect x="100" y="226" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="255" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="180" y="226" width="64" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="255" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="260" y="226" width="64" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="255" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a7218" filter="url(#rough2)">4</text>
  <rect x="340" y="226" width="64" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="255" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="420" y="226" width="64" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="452" y="255" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <g font-size="8.5" fill="#999" filter="url(#rough2)">
    <text x="156" y="266">0</text><text x="236" y="266">1</text><text x="316" y="266">2</text>
    <text x="396" y="266">3</text><text x="476" y="266">4</text>
  </g>
  <text x="252" y="296" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">窗口 [0..c]，c = 3</text>

  <path d="M368,222 Q330,190 300,222" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="330" y="184" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">② 充电：跳上前缀最大值 4</text>
  <path d="M302,222 Q374,178 446,222" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="492" y="198" font-size="10.5" fill="#b85450" filter="url(#rough2)">③ 想飞到下标 4？</text>
  <text x="492" y="216" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">需要 5 &lt; V=4 ✗</text>

  <text x="340" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">飞不动了 → R(0) = 3，ans[0] = pm[0..3] = 4</text>
  <text x="340" y="344" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">终止条件：c 右边不存在值 &lt; V 的位置</text>

  <!-- ===== 循环图 ===== -->
  <rect x="100" y="360" width="140" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="170" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">落在 c</text>
  <text x="170" y="396" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">（刚放电，值小）</text>
  <rect x="270" y="360" width="150" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="345" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a7218" filter="url(#rough2)">向左充电</text>
  <text x="345" y="396" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">V = pm[0..c]</text>
  <rect x="450" y="360" width="160" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="530" y="380" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d26" filter="url(#rough2)">向右放电</text>
  <text x="530" y="396" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">落到最远的 nums &lt; V</text>

  <path d="M242,383 L266,383" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M422,383 L446,383" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M530,408 Q325,456 172,408" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="325" y="450" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">c 变大，窗口右扩，V 只增不减</text>
</svg>
