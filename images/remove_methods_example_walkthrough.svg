<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例对照：一条「入侵边」决定两种命运</text>

  <!-- 左面板：示例 1 -->
  <text x="130" y="46" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例 1：n=4，k=1</text>
  <ellipse cx="125" cy="140" rx="80" ry="52" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <path d="M 96 140 L 154 140" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 66 200 L 75 158" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 184 200 L 175 158" stroke="#b85450" stroke-width="2.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <circle cx="80" cy="140" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="145" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="170" cy="140" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="145" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="60" cy="215" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="220" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="190" cy="215" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="220" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="56" cy="120" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="56" y="124" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="125" y="176" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">S = {1,2}</text>
  <text x="34" y="180" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">(0,1)</text>
  <text x="34" y="192" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">入侵!</text>
  <text x="217" y="180" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">(3,2)</text>
  <text x="217" y="192" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">入侵!</text>
  <text x="130" y="248" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">BFS 从 1 出发：S = {1,2}</text>
  <rect x="25" y="256" width="210" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="277" text-anchor="middle" font-size="11" fill="#7a3530" font-weight="bold" filter="url(#rough2)">两条入侵边 → 返回 [0,1,2,3]</text>

  <!-- 右面板：示例 2 -->
  <text x="386" y="46" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">示例 2：n=5，k=0</text>
  <ellipse cx="368" cy="140" rx="86" ry="72" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <path d="M 379 104 L 406 162" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 324 158 L 396 172" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 315 140 L 357 103" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 474 112 L 479 188" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <circle cx="310" cy="155" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="160" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="366" cy="92" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="366" y="97" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="412" cy="177" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="412" y="182" text-anchor="middle" font-size="13" fill="#7a3530" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="468" cy="98" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="468" y="103" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="482" cy="203" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="482" y="208" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="288" cy="136" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="288" y="140" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="368" y="132" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">三条边都在圈内</text>
  <text x="503" y="152" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(3,4)</text>
  <text x="503" y="164" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">圈外</text>
  <text x="386" y="234" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">BFS 从 0 出发：S = {0,1,2}</text>
  <text x="386" y="250" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">扫边：无一条圈外→圈内</text>
  <rect x="281" y="256" width="210" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="386" y="277" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">无入侵边 → 返回 [3,4]</text>

  <!-- 底部说明 -->
  <rect x="20" y="300" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">同一套两趟扫描，命运只取决于「有没有圈外→圈内的边」</text>
  <text x="260" y="340" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">示例 3（环 0→1→2→0 全染红）：S = 全体方法，没有圈外可言 ⇒ 自然返回 [ ]</text>
</svg>
