<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="57"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="640" height="352" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#r)">示例演算：nums = [2, 4, 8, 16] 的全部 5 种方案</text>
  <path d="M 150 38 Q 320 46 490 38" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#r)"/>

  <!-- header band -->
  <rect x="48" y="56" width="544" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#r)"/>
  <text x="66" y="75" font-size="12.5" font-weight="bold" fill="#34507a" filter="url(#r)">方案</text>
  <text x="180" y="75" font-size="12.5" font-weight="bold" fill="#34507a" filter="url(#r)">剩余元素</text>
  <text x="368" y="75" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34507a" filter="url(#r)">GCD</text>
  <text x="448" y="75" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34507a" filter="url(#r)">LCM</text>
  <text x="548" y="75" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34507a" filter="url(#r)">得分</text>

  <!-- highlight best row -->
  <rect x="48" y="112" width="544" height="27" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#r)"/>

  <!-- rows -->
  <text x="66" y="106" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">不移除</text>
  <text x="180" y="106" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">2 4 8 16</text>
  <text x="368" y="106" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">2</text>
  <text x="448" y="106" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">16</text>
  <text x="548" y="106" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">32</text>

  <text x="66" y="132" font-size="12.5" font-weight="bold" fill="#a07520" font-family="monospace" filter="url(#r)">移除 2</text>
  <text x="180" y="132" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">4 8 16</text>
  <text x="368" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a07520" font-family="monospace" filter="url(#r)">4</text>
  <text x="448" y="132" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">16</text>
  <text x="548" y="132" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" font-family="monospace" filter="url(#r)">64 ★</text>

  <text x="66" y="158" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">移除 4</text>
  <text x="180" y="158" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">2 8 16</text>
  <text x="368" y="158" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">2</text>
  <text x="448" y="158" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">16</text>
  <text x="548" y="158" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">32</text>

  <text x="66" y="184" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">移除 8</text>
  <text x="180" y="184" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">2 4 16</text>
  <text x="368" y="184" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">2</text>
  <text x="448" y="184" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">16</text>
  <text x="548" y="184" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">32</text>

  <text x="66" y="210" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">移除 16</text>
  <text x="180" y="210" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">2 4 8</text>
  <text x="368" y="210" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">2</text>
  <text x="448" y="210" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">8</text>
  <text x="548" y="210" text-anchor="middle" font-size="12.5" fill="#333" font-family="monospace" filter="url(#r)">16</text>

  <!-- conclusions -->
  <rect x="48" y="238" width="300" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#r)"/>
  <text x="198" y="260" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#r)">最优方案：移除 2</text>
  <text x="64" y="282" font-size="12" fill="#333" font-family="monospace" filter="url(#r)">GCD：2 → 4（翻倍）</text>
  <text x="64" y="300" font-size="12" fill="#333" font-family="monospace" filter="url(#r)">LCM：16 → 16（不变）</text>
  <text x="64" y="320" font-size="12.5" font-weight="bold" fill="#2e6e2e" font-family="monospace" filter="url(#r)">得分：32 → 64 ✓</text>

  <rect x="372" y="238" width="220" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#r)"/>
  <text x="482" y="260" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#34507a" filter="url(#r)">反面教材：移除 16</text>
  <text x="388" y="282" font-size="12" fill="#333" font-family="monospace" filter="url(#r)">LCM：16 → 8（减半）</text>
  <text x="388" y="300" font-size="12" fill="#333" font-family="monospace" filter="url(#r)">GCD：2 → 2（不变）</text>
  <text x="388" y="320" font-size="12.5" font-weight="bold" fill="#34507a" font-family="monospace" filter="url(#r)">得分：32 → 16 ✗</text>
</svg>
