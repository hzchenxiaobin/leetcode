<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="79"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">首步只有三种选择，分数就此定死</text>

  <g filter="url(#rough2)">
    <rect x="100" y="46" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="152" y="46" width="46" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="204" y="46" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="256" y="46" width="46" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="308" y="46" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="360" y="46" width="46" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="123" y="69">3</text><text x="175" y="69">2</text><text x="227" y="69">1</text>
    <text x="279" y="69">2</text><text x="331" y="69">3</text><text x="383" y="69">4</text>
  </g>
  <text x="123" y="94" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">前两个</text>
  <text x="383" y="94" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">后两个</text>
  <text x="253" y="94" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">首尾</text>

  <rect x="26" y="112" width="164" height="104" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="132" text-anchor="middle" font-size="10.5" fill="#2f5226" font-weight="bold" filter="url(#rough2)">① 删最前两个</text>
  <text x="108" y="152" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">score = 3 + 2 = 5</text>
  <text x="108" y="172" text-anchor="middle" font-size="10" fill="#2f5226" filter="url(#rough2)">剩余区间 [2, 5]</text>
  <text x="108" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">nums = [1,2,3,4]</text>
  <text x="108" y="208" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1 + dp(score 5)</text>

  <rect x="196" y="112" width="164" height="104" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="132" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">② 删最后两个</text>
  <text x="278" y="152" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">score = 3 + 4 = 7</text>
  <text x="278" y="172" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">剩余区间 [0, 3]</text>
  <text x="278" y="192" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">nums = [3,2,1,2]</text>
  <text x="278" y="208" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1 + dp(score 7)</text>

  <rect x="366" y="112" width="164" height="104" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="132" text-anchor="middle" font-size="10.5" fill="#8c3a3a" font-weight="bold" filter="url(#rough2)">③ 删第一个和最后一个</text>
  <text x="448" y="152" text-anchor="middle" font-size="10.5" fill="#8c3a3a" filter="url(#rough2)">score = 3 + 4 = 7</text>
  <text x="448" y="172" text-anchor="middle" font-size="10" fill="#8c3a3a" filter="url(#rough2)">剩余区间 [1, 4]</text>
  <text x="448" y="192" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">nums = [2,1,2,3]</text>
  <text x="448" y="208" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1 + dp(score 7)</text>

  <text x="280" y="240" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">②③ 的分数相同但剩余区间不同，必须各算一次（不能只按分数去重）</text>

  <rect x="40" y="256" width="480" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">答案 = 1 + max( 三种首步各自子区间的 dp 值 )</text>
  <text x="280" y="292" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n = 2 时子区间为空，dp = 0，答案 1</text>
</svg>
