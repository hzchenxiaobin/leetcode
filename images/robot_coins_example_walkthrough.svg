  <text x="96" y="140" font-size="7.5" fill="#999" filter="url(#rough2)">−2</text>
  <text x="116" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>

  <g filter="url(#rough2)"><rect x="140" y="130" width="48" height="44" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="144" y="140" font-size="7.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="164" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">3</text>

