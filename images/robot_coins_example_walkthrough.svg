<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：三层 dp 同步填表</text>
  <text x="280" y="47" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">coins = [[0,1,−1],[1,−2,3],[2,−3,4]]｜角上小灰字 = 原始值｜灰虚格 = −∞｜粉底 = 强盗格</text>

  <text x="116" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">k=0（没用感化）</text>
  <text x="280" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">k=1（感化 1 个）</text>
  <text x="444" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">k=2（感化 2 个）</text>

  <!-- ===== k=0 grid ===== -->
