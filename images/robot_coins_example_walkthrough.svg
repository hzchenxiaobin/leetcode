  <g filter="url(#rough2)"><rect x="468" y="174" width="48" height="44" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="472" y="184" font-size="7.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="492" y="203" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">5</text>

  <!-- ===== chain arrows ===== -->
  <path d="M 88 108 L 98 108" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 299 152 L 310 152" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 328 170 L 328 181" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== reconstruction box ===== -->
  <g filter="url(#rough2)"><rect x="44" y="246" width="472" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="60" y="268" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#rough2)">最优方案还原（编号对应图中橙圈）</text>
  <text x="60" y="287" font-size="10" fill="#444" filter="url(#rough2)">① 起 (0,0) 收 0 → ② 右走 (0,1) 收 +1（累计 1）</text>
  <text x="60" y="304" font-size="10" fill="#444" filter="url(#rough2)">→ ③ 下走 (1,1) 感化 −2 本格记 0（累计 1）→ ④ 收 +3 → ⑤ 收 +4 = 8</text>

  <!-- ===== answer strip ===== -->
  <g filter="url(#rough2)"><rect x="44" y="330" width="472" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="60" y="358" font-size="12" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">终点取 max：</text>
  <g filter="url(#rough2)"><rect x="152" y="336" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="172" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <text x="172" y="384" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">k=0</text>
  <g filter="url(#rough2)"><rect x="202" y="336" width="40" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="222" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415" filter="url(#rough2)">8</text>
  <text x="222" y="384" text-anchor="middle" font-size="8" font-weight="bold" fill="#d6a040" filter="url(#rough2)">k=1 ✓</text>
  <g filter="url(#rough2)"><rect x="252" y="336" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="272" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <text x="272" y="384" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">k=2</text>
  <text x="310" y="358" font-size="14" font-weight="bold" fill="#2c5f2c" filter="url(#rough2)">⇒ ans = 8</text>
  <text x="310" y="384" font-size="8.5" fill="#666" filter="url(#rough2)">「恰好 2 次」反而只有 5：感化不必用完</text>
</svg>
