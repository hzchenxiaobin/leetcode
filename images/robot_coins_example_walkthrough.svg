  <text x="295" y="168" text-anchor="middle" font-size="9" font-weight="bold" fill="#7a5415" filter="url(#rough2)">3</text>

  <g filter="url(#rough2)"><rect x="304" y="130" width="48" height="44" rx="3" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="308" y="140" font-size="7.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="328" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><circle cx="343" cy="165" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="343" y="168" text-anchor="middle" font-size="9" font-weight="bold" fill="#7a5415" filter="url(#rough2)">4</text>

  <g filter="url(#rough2)"><rect x="208" y="174" width="48" height="44" rx="3" fill="#f2f2f2" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="212" y="184" font-size="7.5" fill="#bbb" filter="url(#rough2)">2</text>
  <text x="232" y="203" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−∞</text>

  <g filter="url(#rough2)"><rect x="256" y="174" width="48" height="44" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="260" y="184" font-size="7.5" fill="#999" filter="url(#rough2)">−3</text>
  <text x="280" y="203" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>

  <g filter="url(#rough2)"><rect x="304" y="174" width="48" height="44" rx="3" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="308" y="184" font-size="7.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="328" y="203" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><circle cx="343" cy="209" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="343" y="212" text-anchor="middle" font-size="9" font-weight="bold" fill="#7a5415" filter="url(#rough2)">5</text>

  <!-- ===== k=2 grid ===== -->
  <g filter="url(#rough2)"><rect x="372" y="86" width="48" height="44" rx="3" fill="#f2f2f2" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="376" y="96" font-size="7.5" fill="#bbb" filter="url(#rough2)">0</text>
