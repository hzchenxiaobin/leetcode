  <text x="424" y="96" font-size="7.5" fill="#bbb" filter="url(#rough2)">1</text>
  <text x="444" y="115" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−∞</text>

  <g filter="url(#rough2)"><rect x="468" y="86" width="48" height="44" rx="3" fill="#f2f2f2" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="472" y="96" font-size="7.5" fill="#bbb" filter="url(#rough2)">−1</text>
  <text x="492" y="115" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−∞</text>

  <g filter="url(#rough2)"><rect x="372" y="130" width="48" height="44" rx="3" fill="#f2f2f2" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="376" y="140" font-size="7.5" fill="#bbb" filter="url(#rough2)">1</text>
  <text x="396" y="159" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−∞</text>

  <g filter="url(#rough2)"><rect x="420" y="130" width="48" height="44" rx="3" fill="#f2f2f2" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="424" y="140" font-size="7.5" fill="#bbb" filter="url(#rough2)">−2</text>
  <text x="444" y="159" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−∞</text>

  <g filter="url(#rough2)"><rect x="468" y="130" width="48" height="44" rx="3" fill="#f2f2f2" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="472" y="140" font-size="7.5" fill="#bbb" filter="url(#rough2)">3</text>
  <text x="492" y="159" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−∞</text>

  <g filter="url(#rough2)"><rect x="372" y="174" width="48" height="44" rx="3" fill="#f2f2f2" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="376" y="184" font-size="7.5" fill="#bbb" filter="url(#rough2)">2</text>
  <text x="396" y="203" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−∞</text>

  <g filter="url(#rough2)"><rect x="420" y="174" width="48" height="44" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
