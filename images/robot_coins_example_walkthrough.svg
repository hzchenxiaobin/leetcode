  <text x="48" y="96" font-size="7.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="68" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><circle cx="83" cy="121" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="83" y="124" text-anchor="middle" font-size="9" font-weight="bold" fill="#7a5415" filter="url(#rough2)">1</text>

  <g filter="url(#rough2)"><rect x="92" y="86" width="48" height="44" rx="3" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="96" y="96" font-size="7.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="116" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="131" cy="121" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="131" y="124" text-anchor="middle" font-size="9" font-weight="bold" fill="#7a5415" filter="url(#rough2)">2</text>

  <g filter="url(#rough2)"><rect x="140" y="86" width="48" height="44" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="144" y="96" font-size="7.5" fill="#999" filter="url(#rough2)">−1</text>
  <text x="164" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>

  <g filter="url(#rough2)"><rect x="44" y="130" width="48" height="44" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="48" y="140" font-size="7.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="68" y="159" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">1</text>

