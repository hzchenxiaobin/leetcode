  <text x="48" y="184" font-size="7.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="68" y="203" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">3</text>

  <g filter="url(#rough2)"><rect x="92" y="174" width="48" height="44" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="96" y="184" font-size="7.5" fill="#999" filter="url(#rough2)">−3</text>
  <text x="116" y="203" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>

  <g filter="url(#rough2)"><rect x="140" y="174" width="48" height="44" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="144" y="184" font-size="7.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="164" y="203" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">7</text>

  <!-- ===== k=1 grid ===== -->
  <g filter="url(#rough2)"><rect x="208" y="86" width="48" height="44" rx="3" fill="#f2f2f2" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="212" y="96" font-size="7.5" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="232" y="115" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−∞</text>

  <g filter="url(#rough2)"><rect x="256" y="86" width="48" height="44" rx="3" fill="#f2f2f2" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/></g>
