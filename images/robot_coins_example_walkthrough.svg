  <text x="280" y="115" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−∞</text>

  <g filter="url(#rough2)"><rect x="304" y="86" width="48" height="44" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="308" y="96" font-size="7.5" fill="#999" filter="url(#rough2)">−1</text>
  <text x="328" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <g filter="url(#rough2)"><rect x="208" y="130" width="48" height="44" rx="3" fill="#f2f2f2" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="212" y="140" font-size="7.5" fill="#bbb" filter="url(#rough2)">1</text>
  <text x="232" y="159" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−∞</text>

  <g filter="url(#rough2)"><rect x="256" y="130" width="48" height="44" rx="3" fill="#fce4ec" stroke="#d6a040" stroke-width="2.5"/></g>
  <text x="260" y="140" font-size="7.5" fill="#999" filter="url(#rough2)">−2</text>
