<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#446688" filter="url(#rough2)">算法流程：两棵树各自逐点 BFS，半径差 1</text>

  <rect x="16" y="50" width="242" height="262" rx="10" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="262" y="50" width="242" height="262" rx="10" fill="#ffffff" stroke="#cccccc" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="137" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">树 1：源 = i，半径 k = 2</text>

  <ellipse cx="138" cy="158" rx="92" ry="58" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <line x1="76" y1="180" x2="140" y2="128" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="140" y1="128" x2="204" y2="180" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="204" y1="180" x2="232" y2="244" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="204" y1="180" x2="172" y2="256" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="76" cy="180" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="76" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3a34" filter="url(#rough2)">i</text>
  <circle cx="140" cy="128" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">0</text>
  <circle cx="204" cy="180" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="204" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">2</text>
  <circle cx="232" cy="244" r="13" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="249" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">3</text>
  <circle cx="172" cy="256" r="13" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="261" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">4</text>

  <text x="54" y="200" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="140" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="224" y="172" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="252" y="250" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="158" y="278" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>

  <text x="137" y="296" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">count1[i=1] = 3（圈内 {1,0,2}）</text>

  <text x="383" y="72" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">树 2：源 = b，半径 k−1 = 1</text>

  <ellipse cx="383" cy="182" rx="88" ry="78" fill="none" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <line x1="383" y1="182" x2="330" y2="130" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="383" y1="182" x2="330" y2="234" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="383" y1="182" x2="436" y2="130" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="330" y1="130" x2="272" y2="88" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="383" cy="182" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="383" y="187" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">b</text>
  <circle cx="330" cy="130" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">1</text>
  <circle cx="330" cy="234" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">5</text>
  <circle cx="436" cy="130" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="436" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">6</text>
  <circle cx="272" cy="88" r="12" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272" y="93" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">0</text>

  <text x="383" y="212" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="330" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="330" y="260" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="436" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="272" y="66" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>

  <text x="383" y="296" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5a10" filter="url(#rough2)">cnt2(4, 1) = 4，全树最大 → best2 = 4</text>

  <rect x="60" y="324" width="400" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="341" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33506b" filter="url(#rough2)">加边不改变树 1 内部距离 → count1[i] 与连法无关</text>
  <text x="260" y="357" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">（树 1 内两点的路径永不跨桥，见引理 1）</text>

  <path d="M 260 366 L 260 378" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <rect x="60" y="382" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d5a20" filter="url(#rough2)">answer[i] = count1[i] + best2</text>
  <text x="260" y="415" text-anchor="middle" font-size="11" fill="#2d5a20" filter="url(#rough2)">示例 1，i = 1：3 + 4 = 7 ✓</text>
</svg>
