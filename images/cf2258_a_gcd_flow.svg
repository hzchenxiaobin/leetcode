<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法：先取上界，再证明上界可达</text>
  <path d="M 196 44 Q 360 51 524 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 主流程 -->
  <rect x="249" y="58" width="222" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="87" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">读入 n 与数组 a[1..n]</text>

  <path d="M 360 104 L 360 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="228" y="142" width="264" height="78" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="172" text-anchor="middle" font-size="17" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">ans = gcd(a1, an)</text>
  <text x="360" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">n = 1 时首尾同一个数，答案即 a1</text>

  <path d="M 360 220 L 360 250" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="272" y="252" width="176" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="281" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">输出 ans，每组一行</text>

  <!-- 左右两个论证框 -->
  <rect x="20" y="150" width="172" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="106" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">上界</text>
  <text x="106" y="192" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">终态必含 a1、an</text>
  <text x="106" y="210" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">故 gcd(b) 整除 gcd(a1,an)</text>

  <path d="M 194 184 L 224 178" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="528" y="150" width="172" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="614" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">上界可达</text>
  <text x="614" y="192" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">中间元素全可删</text>
  <text x="614" y="210" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">取 [a1, an] 即达上界</text>

  <path d="M 526 184 L 496 178" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部要点 -->
  <rect x="30" y="318" width="660" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="344" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">gcd 对「集合变大」单调不增：gcd(a1, an, x) ≤ gcd(a1, an)，多留元素只会让答案更小</text>
  <text x="360" y="370" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">所以最优策略是「能删就删」：把中间 n−2 个元素全擦掉，最多 n−2 次操作</text>
  <text x="360" y="396" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">实现上不必真的模拟：读完整组数后取首尾两个数，一次 gcd 即可</text>
</svg>
