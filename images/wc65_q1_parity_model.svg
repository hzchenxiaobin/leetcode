<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="392" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：n 步把「上界」和「奇偶」同时锁死</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">S(n) = 1 + 2 + … + n，n 步后的位置满足 |x| ≤ S(n) 且 x ≡ S(n) (mod 2)</text>

  <!-- n = 1 -->
  <line x1="88" y1="96" x2="500" y2="96" stroke="#dfe4ea" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">n = 1</text>
  <text x="44" y="108" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">S = 1</text>
  <circle cx="250" cy="96" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="310" cy="96" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="120" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">−1</text>
  <text x="310" y="120" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1</text>

  <!-- n = 2 -->
  <line x1="88" y1="158" x2="500" y2="158" stroke="#dfe4ea" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="154" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">n = 2</text>
  <text x="44" y="170" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">S = 3</text>
  <circle cx="190" cy="158" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="250" cy="158" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="310" cy="158" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="370" cy="158" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="220" cy="158" r="4" fill="#f2f4f7" stroke="#c9cdd4" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <circle cx="280" cy="158" r="4" fill="#f2f4f7" stroke="#c9cdd4" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <circle cx="340" cy="158" r="4" fill="#f2f4f7" stroke="#c9cdd4" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <text x="190" y="182" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">−3</text>
  <text x="250" y="182" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">−1</text>
  <text x="310" y="182" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="370" y="182" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">3</text>

  <!-- n = 3 -->
  <line x1="88" y1="220" x2="500" y2="220" stroke="#dfe4ea" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a4a66" filter="url(#rough2)">n = 3</text>
  <text x="44" y="232" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">S = 6</text>
  <circle cx="100" cy="220" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="160" cy="220" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="220" cy="220" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="280" cy="220" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="340" cy="220" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="400" cy="220" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="460" cy="220" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="130" cy="220" r="4" fill="#f2f4f7" stroke="#c9cdd4" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <circle cx="190" cy="220" r="4" fill="#f2f4f7" stroke="#c9cdd4" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <circle cx="250" cy="220" r="4" fill="#f2f4f7" stroke="#c9cdd4" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <circle cx="310" cy="220" r="4" fill="#f2f4f7" stroke="#c9cdd4" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <circle cx="370" cy="220" r="4" fill="#f2f4f7" stroke="#c9cdd4" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <circle cx="430" cy="220" r="4" fill="#f2f4f7" stroke="#c9cdd4" stroke-width="1" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <text x="100" y="244" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">−6</text>
  <text x="160" y="244" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">−4</text>
  <text x="220" y="244" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">−2</text>
  <text x="280" y="244" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="340" y="244" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="400" y="244" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="460" y="244" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">6</text>

  <rect x="30" y="258" width="500" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="10.5" fill="#33475f" filter="url(#rough2)">翻转第 k 步的方向，最终位置只变化 2k（偶数）；奇偶不匹配时多走多少步都对不上</text>
  <text x="280" y="293" text-anchor="middle" font-size="10.5" fill="#33475f" filter="url(#rough2)">所以「差值必须是偶数」不是巧合，而是每一步 ±i 带来的硬约束</text>

  <rect x="30" y="308" width="500" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">位置永远落在 [−S(n), S(n)] 内，S(n) 就是前 n 步的总步长</text>
  <text x="280" y="343" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">S(n) &lt; |target| 时前 n 步必然到不了，这就是二分的单调性来源</text>

  <text x="280" y="374" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4f6f" filter="url(#rough2)">n 步可达 ⇔ S(n) ≥ |target| 且 S(n) − target 为偶数</text>
</svg>
