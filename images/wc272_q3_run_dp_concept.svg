<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="470" fill="#fdfcf7"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：刀口分段 + 按右端点计数 —— dp[i] 就是以 i 结尾的平滑段个数</text>
  <path d="M 110 42 Q 340 50 570 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="62" text-anchor="middle" font-size="11.5" fill="#888">判定只看相邻一对 prices[i] = prices[i−1] − 1；非法对两侧永不连通 ⇒ 数组被切成若干极大平滑段</text>

  <!-- ===== prices cells ===== -->
  <text x="34" y="112" font-size="12.5" fill="#444" font-weight="bold">prices</text>

  <rect x="60" y="94" width="54" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="87" y="120" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>
  <rect x="120" y="94" width="54" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="147" y="120" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
  <rect x="180" y="94" width="54" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="207" y="120" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <rect x="252" y="94" width="54" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/>
  <text x="279" y="120" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">4</text>
  <rect x="312" y="94" width="54" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/>
  <text x="339" y="120" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>

  <!-- day indices -->
  <text x="87" y="150" text-anchor="middle" font-size="9.5" fill="#999">i=0</text>
  <text x="147" y="150" text-anchor="middle" font-size="9.5" fill="#999">i=1</text>
  <text x="207" y="150" text-anchor="middle" font-size="9.5" fill="#999">i=2</text>
  <text x="279" y="150" text-anchor="middle" font-size="9.5" fill="#999">i=3</text>
  <text x="339" y="150" text-anchor="middle" font-size="9.5" fill="#999">i=4</text>

  <!-- adjacent diffs -->
  <text x="117" y="86" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">−1 ✓</text>
  <text x="177" y="86" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">−1 ✓</text>
  <text x="243" y="86" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">+3 ✗</text>
  <text x="369" y="86" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">−1 ✓</text>

  <!-- the cut -->
  <path d="M 243 92 L 243 96 L 238 100 L 248 104 L 238 108 L 248 112 L 243 116" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4 3" filter="url(#sk)"/>
  <path d="M 243 158 L 243 170" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4 3" filter="url(#sk)" marker-end="url(#arr)"/>
  <text x="243" y="176" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">刀口</text>

  <!-- ===== dp row ===== -->
  <text x="34" y="206" font-size="12.5" fill="#444" font-weight="bold">dp[i]</text>

  <rect x="60" y="184" width="54" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="87" y="205" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="120" y="184" width="54" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#sk)"/>
  <text x="147" y="205" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <rect x="180" y="184" width="54" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#sk)"/>
  <text x="207" y="205" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="252" y="184" width="54" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#sk)"/>
  <text x="279" y="205" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="312" y="184" width="54" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#sk)"/>
  <text x="339" y="205" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <!-- run brackets -->
  <path d="M 60 226 Q 60 234 68 234 L 226 234 Q 234 234 234 226" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="147" y="250" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">极大段 A：m = 3 → 3×4/2 = 6</text>
  <path d="M 252 226 Q 252 234 260 234 L 358 234 Q 366 234 366 226" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="309" y="250" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">极大段 B：m = 2 → 2×3/2 = 3</text>

  <!-- ===== right panel: count by right endpoint ===== -->
  <rect x="430" y="90" width="228" height="168" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#sk)"/>
  <text x="544" y="114" text-anchor="middle" font-size="12.5" fill="#2e5e2e" font-weight="bold">按右端点计数（免重免漏）</text>
  <text x="544" y="138" text-anchor="middle" font-size="11" fill="#333">以 i 结尾的平滑段 = 最长段的全部后缀</text>
  <text x="544" y="156" text-anchor="middle" font-size="11" fill="#333">恰 dp[i] 个，一个不多、一个不少</text>
  <path d="M 448 168 Q 544 174 640 168" stroke="#4a7a3a" stroke-width="1" fill="none" filter="url(#sk)"/>
  <text x="544" y="190" text-anchor="middle" font-size="11.5" fill="#2e5e2e" font-weight="bold">ans = Σ dp[i]</text>
  <text x="544" y="208" text-anchor="middle" font-size="11" fill="#333">= 1+2+3+1+2 = 9</text>
  <text x="544" y="228" text-anchor="middle" font-size="11" fill="#333">= 6 + 3（两段等差和）两视角一致</text>
  <text x="544" y="248" text-anchor="middle" font-size="10" fill="#666">每个子数组按右端点恰归一次 ⇒ 不重不漏</text>

  <!-- ===== suffix staircase A ===== -->
  <text x="60" y="288" font-size="12" fill="#446688" font-weight="bold">i = 2（段 A 尾）：dp = 3，后缀 3 个</text>

  <rect x="80" y="298" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="102" y="317" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="124" y="298" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="146" y="317" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="168" y="298" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#sk)"/>
  <text x="190" y="317" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="222" y="317" font-size="10.5" fill="#446688">[3,2,1]</text>

  <rect x="124" y="332" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#sk)"/>
  <text x="146" y="351" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <rect x="168" y="332" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#sk)"/>
  <text x="190" y="351" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="222" y="351" font-size="10.5" fill="#446688">[2,1]</text>

  <rect x="168" y="366" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#sk)"/>
  <text x="190" y="385" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="222" y="385" font-size="10.5" fill="#446688">[1]</text>

  <!-- ===== suffix staircase B ===== -->
  <text x="420" y="288" font-size="12" fill="#d6a040" font-weight="bold">i = 4（段 B 尾）：dp = 2，后缀 2 个</text>

  <rect x="440" y="298" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#sk)"/>
  <text x="462" y="317" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <rect x="484" y="298" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
  <text x="506" y="317" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="538" y="317" font-size="10.5" fill="#d6a040">[4,3]</text>

  <rect x="484" y="332" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#sk)"/>
  <text x="506" y="351" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="538" y="351" font-size="10.5" fill="#d6a040">[3]</text>

  <!-- ===== bottom note ===== -->
  <rect x="60" y="416" width="560" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#sk)"/>
  <text x="340" y="439" text-anchor="middle" font-size="11.5" fill="#8c3a36" font-weight="bold">刀口两侧的子数组永不合法 ⇒ 问题按段独立；每段内部 dp 依次为 1, 2, …, m，求和即 m(m+1)/2</text>
</svg>
