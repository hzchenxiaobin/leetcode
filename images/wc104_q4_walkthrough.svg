<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="680" height="320" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2：graph = [[1,3],[0],[3],[0,2]]</text>
  <path d="M 180,120 L 300,190" stroke="#aaaaaa" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 300,190 L 420,190" stroke="#aaaaaa" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="120" y="88" width="110" height="64" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175.0" y="124.68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">0（洞）</text>
  <rect x="300" y="158" width="110" height="64" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355.0" y="195.4" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="460" y="158" width="110" height="64" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515.0" y="194.68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2（猫）</text>
  <rect x="120" y="218" width="110" height="64" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175.0" y="254.68" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1（鼠）</text>
  <path d="M 180,218 L 180,152" stroke="#aaaaaa" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="600" y="116" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">边：0-1, 0-3, 2-3</text>
  <text x="340" y="300" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">鼠在 1，唯一邻居是洞 0：鼠走一步即到达，猫来不及抓 → 返回 1</text>
</svg>
