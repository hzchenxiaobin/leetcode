<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：二重前缀和 + 单调栈「出栈瞬间结算」</text>
  <path d="M 110 38 Q 320 46 530 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="60" y="52" width="300" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="210" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#33455e">① 预处理（mod 1e9+7）</text>
  <text x="210" y="96" text-anchor="middle" font-size="11.5" fill="#33455e">P[k] = 前 k 项和；PP[k] = 前 k 项 P 之和（开 n+2 项）</text>

  <path d="M 210 110 V 128" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="60" y="132" width="300" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="210" y="159" text-anchor="middle" font-size="12.5" fill="#33455e">② 主循环 i = 0 … n（i = n 是值恒小的哨兵）</text>

  <path d="M 210 176 V 200" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)"><polygon points="210,204 330,248 210,292 90,248" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="210" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5e2e">栈非空 且</text>
  <text x="210" y="260" text-anchor="middle" font-size="12" fill="#2e5e2e">val[栈顶] ≥ val[i] ?</text>

  <path d="M 330 248 H 376" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#sk)"/>
  <text x="352" y="238" text-anchor="middle" font-size="11" fill="#a04040">是 · 弹</text>

  <g filter="url(#sk)"><rect x="380" y="206" width="224" height="106" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/></g>
  <text x="492" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">弹出 j —— 出栈瞬间结算</text>
  <text x="492" y="248" text-anchor="middle" font-size="11.5" fill="#7a5415">L = 新栈顶（栈空取 −1）</text>
  <text x="492" y="266" text-anchor="middle" font-size="11.5" fill="#7a5415">R = i（右侧首个 ≤ val[j] 者）</text>
  <text x="492" y="284" text-anchor="middle" font-size="11.5" fill="#7a5415">S(j) 由下方公式 O(1) 得到</text>
  <text x="492" y="303" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#7a5415">ans += val[j] × S(j)</text>

  <path d="M 492 312 C 500 352, 360 340, 306 266" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="400" y="338" text-anchor="middle" font-size="10.5" fill="#888">弹空为止</text>

  <path d="M 210 292 V 326" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="224" y="314" font-size="11" fill="#2e5e2e">否</text>

  <g filter="url(#sk)"><rect x="90" y="330" width="240" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="210" y="355" text-anchor="middle" font-size="12.5" fill="#33455e">压入 i；i ← i + 1</text>

  <path d="M 90 350 H 38 V 154 H 56" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="30" y="252" transform="rotate(-90 30 252)" text-anchor="middle" font-size="10.5" fill="#888">下一个 i</text>

  <text x="320" y="396" text-anchor="middle" font-size="11.5" fill="#555">哨兵把栈清空后循环自然结束，ans 即答案（每个下标至多进出栈一次 → O(n)）</text>

  <g filter="url(#sk)"><rect x="60" y="410" width="520" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="320" y="432" text-anchor="middle" font-size="12.5" font-family="monospace" fill="#a04040">S(j) = (j−L)(PP[R+1]−PP[j+1]) − (R−j)(PP[j+1]−PP[L+1])</text>
  <text x="320" y="451" text-anchor="middle" font-size="10.5" fill="#a04040">PP 开 n+2 项；C++ 做差先 + MOD 防负，乘法用 long long</text>
</svg>
