<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="63" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：a = [3, 2, 5, 6]，b = [2, −6, 4, −5, −3, 2, −7]</text>
  <path d="M 150 36 Q 320 44 490 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="55" y="50" width="66" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="121" y="50" width="92" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="213" y="50" width="92" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="305" y="50" width="92" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="397" y="50" width="92" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="489" y="50" width="92" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="88" y="69" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">x = b[j]</text>
  <text x="167" y="69" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">f[0]</text>
  <text x="259" y="69" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">f[1]</text>
  <text x="351" y="69" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">f[2]</text>
  <text x="443" y="69" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">f[3]</text>
  <text x="535" y="69" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">f[4]</text>

  <!-- rows: y = 82 + i*33 -->
  <g filter="url(#sk)">
    <rect x="55" y="82"  width="526" height="33" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="0.8"/>
    <rect x="55" y="115" width="526" height="33" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="0.8"/>
    <rect x="55" y="148" width="526" height="33" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="0.8"/>
    <rect x="55" y="181" width="526" height="33" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="0.8"/>
    <rect x="55" y="214" width="526" height="33" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="0.8"/>
    <rect x="55" y="247" width="526" height="33" rx="4" fill="#fffdf3" stroke="#bbb" stroke-width="0.8"/>
    <rect x="55" y="280" width="526" height="33" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="55" y="313" width="526" height="33" rx="4" fill="#fdfcf7" stroke="#bbb" stroke-width="0.8"/>
  </g>

  <!-- highlight answer cell -->
  <g filter="url(#sk)">
    <rect x="489" y="280" width="92" height="33" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>

  <!-- row 0: init -->
  <text x="88"  y="103" text-anchor="middle" font-size="12" fill="#666">初始</text>
  <text x="167" y="103" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="259" y="103" text-anchor="middle" font-size="12" fill="#999" font-style="italic">−∞</text>
  <text x="351" y="103" text-anchor="middle" font-size="12" fill="#999" font-style="italic">−∞</text>
  <text x="443" y="103" text-anchor="middle" font-size="12" fill="#999" font-style="italic">−∞</text>
  <text x="535" y="103" text-anchor="middle" font-size="12" fill="#999" font-style="italic">−∞</text>

  <!-- row 1: x=2 -->
  <text x="88"  y="136" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="167" y="136" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="259" y="136" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">6</text>
  <text x="351" y="136" text-anchor="middle" font-size="12" fill="#999" font-style="italic">−∞</text>
  <text x="443" y="136" text-anchor="middle" font-size="12" fill="#999" font-style="italic">−∞</text>
  <text x="535" y="136" text-anchor="middle" font-size="12" fill="#999" font-style="italic">−∞</text>

  <!-- row 2: x=-6 -->
  <text x="88"  y="169" text-anchor="middle" font-size="12" fill="#333">−6</text>
  <text x="167" y="169" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="259" y="169" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="351" y="169" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−6</text>
  <text x="443" y="169" text-anchor="middle" font-size="12" fill="#999" font-style="italic">−∞</text>
  <text x="535" y="169" text-anchor="middle" font-size="12" fill="#999" font-style="italic">−∞</text>

  <!-- row 3: x=4 -->
  <text x="88"  y="202" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="167" y="202" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="259" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">12</text>
  <text x="351" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">14</text>
  <text x="443" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">14</text>
  <text x="535" y="202" text-anchor="middle" font-size="12" fill="#999" font-style="italic">−∞</text>

  <!-- row 4: x=-5 -->
  <text x="88"  y="235" text-anchor="middle" font-size="12" fill="#333">−5</text>
  <text x="167" y="235" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="259" y="235" text-anchor="middle" font-size="12" fill="#333">12</text>
  <text x="351" y="235" text-anchor="middle" font-size="12" fill="#333">14</text>
  <text x="443" y="235" text-anchor="middle" font-size="12" fill="#333">14</text>
  <text x="535" y="235" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−16</text>

  <!-- row 5: x=-3 -->
  <text x="88"  y="268" text-anchor="middle" font-size="12" fill="#333">−3</text>
  <text x="167" y="268" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="259" y="268" text-anchor="middle" font-size="12" fill="#333">12</text>
  <text x="351" y="268" text-anchor="middle" font-size="12" fill="#333">14</text>
  <text x="443" y="268" text-anchor="middle" font-size="12" fill="#333">14</text>
  <text x="535" y="268" text-anchor="middle" font-size="12" fill="#333">−4</text>

  <!-- row 6: x=2 (key row) -->
  <text x="88"  y="301" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">2</text>
  <text x="167" y="301" text-anchor="middle" font-size="12" fill="#7a5415">0</text>
  <text x="259" y="301" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">16</text>
  <text x="351" y="301" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">24</text>
  <text x="443" y="301" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">26</text>
  <text x="535" y="301" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">26</text>

  <!-- row 7: x=-7 -->
  <text x="88"  y="334" text-anchor="middle" font-size="12" fill="#333">−7</text>
  <text x="167" y="334" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="259" y="334" text-anchor="middle" font-size="12" fill="#333">12</text>
  <text x="351" y="334" text-anchor="middle" font-size="12" fill="#333">16</text>
  <text x="443" y="334" text-anchor="middle" font-size="12" fill="#333">24</text>
  <text x="535" y="334" text-anchor="middle" font-size="12" fill="#333">26</text>

  <!-- key transition annotation -->
  <path d="M 545 262 Q 600 268 598 292" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="600" y="252" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">26 = 14 + 6×2</text>

  <!-- bottom explanation -->
  <g filter="url(#sk)">
    <rect x="55" y="360" width="526" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="71" y="382" font-size="12" fill="#2e6e2e" font-weight="bold">橙色列（x = 2 一轮，倒序读旧值）：</text>
  <text x="71" y="402" font-size="11.5" fill="#2e6e2e">f[4] ← 14 + 6×2 = 26（下标 0,1,2,5）｜ f[3] ← 14 + 5×2 = 24 ｜ f[2] ← 12 + 2×2 = 16</text>
</svg>
