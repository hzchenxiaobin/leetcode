<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：补成完美二叉树后，列号就是中序编号</text>
  <text x="310" y="46" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">h = 2 ⇒ 列数 n = 2^(h+1) − 1 = 7；圈内数字 = 该结点落在 res 的哪一列</text>

  <!-- 树的边 -->
  <path d="M 297 103 L 174 147" stroke="#8899aa" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 313 103 L 436 147" stroke="#8899aa" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 155 172 L 104 217" stroke="#8899aa" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 175 172 L 226 217" stroke="#8899aa" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 435 172 L 384 217" stroke="#8899aa" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 455 172 L 506 218" stroke="#8899aa" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- 偏移标注：每下一层，横向偏移减半 -->
  <text x="222" y="122" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">−2</text>
  <text x="396" y="122" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">+2</text>
  <text x="108" y="198" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="222" y="198" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">+1</text>
  <text x="392" y="198" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="502" y="198" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">+1</text>

  <!-- 结点 -->
  <circle cx="305" cy="90" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="305" y="95" text-anchor="middle" font-size="12" fill="#2b4a6b" filter="url(#rough2)">3</text>

  <circle cx="165" cy="160" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="165" text-anchor="middle" font-size="12" fill="#2c5f2c" filter="url(#rough2)">1</text>
  <circle cx="445" cy="160" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="165" text-anchor="middle" font-size="12" fill="#2c5f2c" filter="url(#rough2)">5</text>

  <circle cx="95" cy="230" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="235" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">0</text>
  <circle cx="235" cy="230" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="235" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">2</text>
  <circle cx="375" cy="230" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="375" y="235" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">4</text>
  <circle cx="515" cy="230" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="515" y="235" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">6</text>

  <!-- 底行：矩阵列 -->
  <rect x="60" y="272" width="70" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="130" y="272" width="70" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="272" width="70" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="270" y="272" width="70" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="340" y="272" width="70" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="410" y="272" width="70" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="480" y="272" width="70" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="95" y="300" text-anchor="middle" font-size="11" fill="#2b4a6b" filter="url(#rough2)">0</text>
  <text x="165" y="300" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">1</text>
  <text x="235" y="300" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">2</text>
  <text x="305" y="300" text-anchor="middle" font-size="11" fill="#2b4a6b" filter="url(#rough2)">3</text>
  <text x="375" y="300" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">4</text>
  <text x="445" y="300" text-anchor="middle" font-size="11" fill="#2c5f2c" filter="url(#rough2)">5</text>
  <text x="515" y="300" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">6</text>
  <text x="310" y="334" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">res 每一列的下标 0 … n−1</text>

  <!-- 结论框 -->
  <rect x="52" y="346" width="516" height="44" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="310" y="365" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">偏移 2^(h−r−1) 随深度减半 ⇒ 深度 d 的列号 ≡ 2^(h−d) − 1 (mod 2^(h−d))</text>
  <text x="310" y="382" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">于是「列号 = 补全后的中序次序」：一次中序 DFS 就能直接落格，无需传列号</text>
</svg>
