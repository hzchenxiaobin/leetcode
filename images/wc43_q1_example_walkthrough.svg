<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="77" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 1 演算：后序编号 + 计数收集</text>
  <path d="M 150 42 Q 380 50 610 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左：树 -->
  <path d="M 154 92 L 110 138" stroke="#7a8b99" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 186 92 L 232 138" stroke="#7a8b99" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 76 178 L 64 220" stroke="#7a8b99" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 236 178 L 214 220" stroke="#7a8b99" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 266 178 L 288 220" stroke="#7a8b99" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 186 264 L 166 306" stroke="#7a8b99" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <circle cx="170" cy="72" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a322e" filter="url(#rough2)">1</text>
  <text x="170" y="85" text-anchor="middle" font-size="10" fill="#8a322e" filter="url(#rough2)">#4</text>

  <circle cx="92" cy="158" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">2</text>
  <text x="92" y="171" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#rough2)">#2</text>

  <circle cx="250" cy="158" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a63" filter="url(#rough2)">3</text>
  <text x="250" y="171" text-anchor="middle" font-size="10" fill="#2b4a63" filter="url(#rough2)">#3</text>

  <circle cx="52" cy="244" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="52" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">4</text>
  <text x="52" y="257" text-anchor="middle" font-size="10" fill="#2e5e2e" filter="url(#rough2)">#1</text>

  <circle cx="200" cy="244" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#rough2)">2</text>
  <text x="200" y="257" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#rough2)">#2</text>

  <circle cx="300" cy="244" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">4</text>
  <text x="300" y="257" text-anchor="middle" font-size="10" fill="#2e5e2e" filter="url(#rough2)">#1</text>

  <circle cx="152" cy="330" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="152" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e2e" filter="url(#rough2)">4</text>
  <text x="152" y="343" text-anchor="middle" font-size="10" fill="#2e5e2e" filter="url(#rough2)">#1</text>

  <circle cx="200" cy="244" r="32" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="152" cy="330" r="32" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="42" y="382" font-size="10.5" fill="#8a322e" filter="url(#rough2)">圆内：上为值、下为编号；红虚线 = 该类第 2 次出现，收集它</text>

  <!-- 右：表 -->
  <text x="352" y="66" font-size="12" fill="#446688" filter="url(#rough2)">后序访问顺序与计数</text>
  <path d="M 352 78 L 742 78" stroke="#b9c4cd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="358" y="100" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">步</text>
  <text x="392" y="100" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">值</text>
  <text x="430" y="100" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">键</text>
  <text x="556" y="100" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">编号</text>
  <text x="606" y="100" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">计数</text>
  <text x="656" y="100" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">动作</text>
  <path d="M 352 108 L 742 108" stroke="#b9c4cd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="358" y="132" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="392" y="132" font-size="11.5" fill="#2e5e2e" filter="url(#rough2)">4</text>
  <text x="430" y="132" font-size="11" font-family="monospace" fill="#333" filter="url(#rough2)">(4,#0,#0)</text>
  <text x="556" y="132" font-size="11.5" fill="#2e5e2e" filter="url(#rough2)">#1</text>
  <text x="606" y="132" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="656" y="132" font-size="11.5" fill="#7a5415" filter="url(#rough2)">分配</text>

  <text x="358" y="160" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="392" y="160" font-size="11.5" fill="#7a5415" filter="url(#rough2)">2</text>
  <text x="430" y="160" font-size="11" font-family="monospace" fill="#333" filter="url(#rough2)">(2,#1,#0)</text>
  <text x="556" y="160" font-size="11.5" fill="#7a5415" filter="url(#rough2)">#2</text>
  <text x="606" y="160" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="656" y="160" font-size="11.5" fill="#7a5415" filter="url(#rough2)">分配</text>

  <text x="358" y="188" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="392" y="188" font-size="11.5" fill="#2e5e2e" filter="url(#rough2)">4</text>
  <text x="430" y="188" font-size="11" font-family="monospace" fill="#333" filter="url(#rough2)">(4,#0,#0)</text>
  <text x="556" y="188" font-size="11.5" fill="#2e5e2e" filter="url(#rough2)">#1</text>
  <text x="606" y="188" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="656" y="188" font-size="11.5" fill="#b85450" filter="url(#rough2)">收集 4</text>

  <text x="358" y="216" font-size="11.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="392" y="216" font-size="11.5" fill="#7a5415" filter="url(#rough2)">2</text>
  <text x="430" y="216" font-size="11" font-family="monospace" fill="#333" filter="url(#rough2)">(2,#1,#0)</text>
  <text x="556" y="216" font-size="11.5" fill="#7a5415" filter="url(#rough2)">#2</text>
  <text x="606" y="216" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="656" y="216" font-size="11.5" fill="#b85450" filter="url(#rough2)">收集 2</text>

  <text x="358" y="244" font-size="11.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="392" y="244" font-size="11.5" fill="#2e5e2e" filter="url(#rough2)">4</text>
  <text x="430" y="244" font-size="11" font-family="monospace" fill="#333" filter="url(#rough2)">(4,#0,#0)</text>
  <text x="556" y="244" font-size="11.5" fill="#2e5e2e" filter="url(#rough2)">#1</text>
  <text x="606" y="244" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="656" y="244" font-size="11.5" fill="#888" filter="url(#rough2)">跳过</text>

  <text x="358" y="272" font-size="11.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="392" y="272" font-size="11.5" fill="#2b4a63" filter="url(#rough2)">3</text>
  <text x="430" y="272" font-size="11" font-family="monospace" fill="#333" filter="url(#rough2)">(3,#2,#1)</text>
  <text x="556" y="272" font-size="11.5" fill="#2b4a63" filter="url(#rough2)">#3</text>
  <text x="606" y="272" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="656" y="272" font-size="11.5" fill="#7a5415" filter="url(#rough2)">分配</text>

  <text x="358" y="300" font-size="11.5" fill="#555" filter="url(#rough2)">7</text>
  <text x="392" y="300" font-size="11.5" fill="#8a322e" filter="url(#rough2)">1</text>
  <text x="430" y="300" font-size="11" font-family="monospace" fill="#333" filter="url(#rough2)">(1,#2,#3)</text>
  <text x="556" y="300" font-size="11.5" fill="#8a322e" filter="url(#rough2)">#4</text>
  <text x="606" y="300" font-size="11.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="656" y="300" font-size="11.5" fill="#7a5415" filter="url(#rough2)">分配</text>

  <path d="M 352 312 L 742 312" stroke="#b9c4cd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="352" y="330" width="390" height="56" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="547" y="352" text-anchor="middle" font-size="12" fill="#2e5e2e" filter="url(#rough2)">输出 [[2,4],[4]]：两个重复等价类各取一个代表</text>
  <text x="547" y="373" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">#1 出现了 3 次却只输出一次，正是 cnt == 2 的功劳</text>

  <rect x="40" y="404" width="330" height="46" rx="9" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="205" y="424" text-anchor="middle" font-size="11.5" fill="#7a5415" filter="url(#rough2)">后序保证：轮到某结点时，左右子树都已编号完毕</text>
  <text x="205" y="442" text-anchor="middle" font-size="11" fill="#8a7a55" filter="url(#rough2)">所以只看 (val, lid, rid) 就能唯一确定当前子树</text>
</svg>
