<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">得分拆解：A(i) = values[i] + i，B(j) = values[j] − j</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">score = A(i) + B(j)，与 j 有关的部分单独提出</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <text x="30.0" y="72.0" font-size="11" fill="#446688" text-anchor="start" font-weight="bold" filter="url(#rough2)">values = [8, 1, 5, 2, 6]</text>
  <rect x="30" y="82" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="61.0" y="104.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="100" y="82" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="131.0" y="104.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="170" y="82" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="201.0" y="104.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="240" y="82" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="271.0" y="104.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="310" y="82" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="341.0" y="104.7" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="30.0" y="140.0" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">A(i) = values[i] + i</text>
  <rect x="30" y="150" width="62" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="61.0" y="170.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="100" y="150" width="62" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="131.0" y="170.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="170" y="150" width="62" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="201.0" y="170.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="240" y="150" width="62" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="271.0" y="170.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="310" y="150" width="62" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="341.0" y="170.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="30.0" y="206.0" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">B(j) = values[j] − j</text>
  <rect x="30" y="216" width="62" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="61.0" y="236.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="100" y="216" width="62" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="131.0" y="236.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="170" y="216" width="62" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="201.0" y="236.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="240" y="216" width="62" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="271.0" y="236.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">-1</text>
  <rect x="310" y="216" width="62" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="341.0" y="236.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="30.0" y="276.0" font-size="12" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">max over i&lt;j of A(i) 用 best 滚动维护 → O(n)</text>
  <rect x="30" y="294" width="520" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40.0" y="315.0" font-size="11" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">先算 ans = max(ans, best + values[j] − j)，再让 best = max(best, values[j] + j)</text>
  <text x="40.0" y="331.0" font-size="11" fill="#333" text-anchor="start" filter="url(#rough2)">顺序反了就会用到 i = j 的非法组合</text>
</svg>
