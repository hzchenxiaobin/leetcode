<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="57" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
  </defs>
  <rect width="660" height="420" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：金字塔逐层收缩</text>
  <path d="M 190 40 Q 330 48 470 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="160" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">示例 1：s = "3902"</text>

  <g filter="url(#sk)">
    <rect x="102" y="84" width="38" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="144" y="84" width="38" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="186" y="84" width="38" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="228" y="84" width="38" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="121" y="104">3</text>
    <text x="163" y="104">9</text>
    <text x="205" y="104">0</text>
    <text x="247" y="104">2</text>
  </g>

  <path d="M 118 118 Q 124 132 136 142" stroke="#4a8edb" stroke-width="1.3" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 160 118 Q 166 132 178 142" stroke="#4a8edb" stroke-width="1.3" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 202 118 Q 208 132 220 142" stroke="#4a8edb" stroke-width="1.3" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="124" y="146" width="38" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="166" y="146" width="38" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="208" y="146" width="38" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#7a5415" text-anchor="middle">
    <text x="143" y="166">2</text>
    <text x="185" y="166">9</text>
    <text x="227" y="166">2</text>
  </g>
  <g font-size="9" fill="#999" text-anchor="middle">
    <text x="143" y="188">12%10</text>
    <text x="185" y="188">9</text>
    <text x="227" y="188">2</text>
  </g>

  <path d="M 140 180 Q 146 194 158 204" stroke="#4a8edb" stroke-width="1.3" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>
  <path d="M 182 180 Q 188 194 200 204" stroke="#4a8edb" stroke-width="1.3" fill="none" marker-end="url(#ab)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="146" y="208" width="38" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="188" y="208" width="38" height="30" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#2e6e2e" text-anchor="middle">
    <text x="165" y="228">1</text>
    <text x="207" y="228">1</text>
  </g>
  <text x="160" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">"11" 两位相同 → true ✓</text>

  <path d="M 330 70 L 330 260" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#sk)"/>

  <text x="500" y="72" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">示例 2：s = "34789"</text>

  <g filter="url(#sk)">
    <rect x="402" y="84" width="34" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="440" y="84" width="34" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="478" y="84" width="34" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="516" y="84" width="34" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
    <rect x="554" y="84" width="34" height="30" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#2b6e9e" text-anchor="middle">
    <text x="419" y="104">3</text>
    <text x="457" y="104">4</text>
    <text x="495" y="104">7</text>
    <text x="533" y="104">8</text>
    <text x="571" y="104">9</text>
  </g>

  <g filter="url(#sk)">
    <rect x="420" y="146" width="34" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="458" y="146" width="34" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="496" y="146" width="34" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="534" y="146" width="34" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#7a5415" text-anchor="middle">
    <text x="437" y="166">7</text>
    <text x="475" y="166">1</text>
    <text x="513" y="166">5</text>
    <text x="551" y="166">7</text>
  </g>
  <text x="500" y="192" text-anchor="middle" font-size="10" fill="#999">3+4 · 4+7%10 · 7+8%10 · 8+9%10</text>

  <g filter="url(#sk)">
    <rect x="438" y="208" width="34" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="476" y="208" width="34" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
    <rect x="514" y="208" width="34" height="30" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#7a5415" text-anchor="middle">
    <text x="455" y="228">8</text>
    <text x="493" y="228">6</text>
    <text x="531" y="228">2</text>
  </g>

  <g filter="url(#sk)">
    <rect x="456" y="270" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="494" y="270" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#b85450" text-anchor="middle">
    <text x="473" y="290">4</text>
    <text x="511" y="290">8</text>
  </g>
  <text x="500" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">"48" 两位不同 → false ✗</text>

  <g filter="url(#sk)">
    <rect x="30" y="356" width="600" height="48" rx="10" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.2"/>
  </g>
  <text x="330" y="376" text-anchor="middle" font-size="12" fill="#7a5415">n = 4 恰好 2 轮、n = 5 恰好 3 轮：轮数 = n − 2，无需额外终止保护</text>
  <text x="330" y="394" text-anchor="middle" font-size="11" fill="#888">中途两位是否相同没有意义（如 "3902" 首位 3 ≠ 9，结果却为 true）——必须一路收缩到长度 2</text>
</svg>
