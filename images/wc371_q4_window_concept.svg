<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b85450"/></marker>
  </defs>
  <rect width="660" height="430" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：排序后，合法伙伴 ⟺ 后缀 [ℓ(j), j]</text>
  <path d="M 160 36 Q 330 44 500 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 化简框 -->
  <g filter="url(#sk)"><rect x="80" y="48" width="500" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="330" y="66" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#sk)">设 x ≤ y：|x − y| = y − x，min(x, y) = x</text>
  <text x="330" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a10" filter="url(#sk)">强数对 ⟺ y − x ≤ x ⟺ y ≤ 2x，即 2·nums[k] ≥ nums[j]</text>

  <!-- j=3 窗口（上方绿括号） -->
  <text x="334" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5d24" filter="url(#sk)">j = 3 时：窗口 = {2, 3, 4}</text>
  <g filter="url(#sk)"><path d="M 218 200 Q 218 188 230 186 L 438 186 Q 450 188 450 200" stroke="#4a7a3a" stroke-width="2.4" fill="none"/></g>
  <text x="218" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#sk)">i</text>
  <text x="450" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d24" filter="url(#sk)">j</text>
  <path d="M 218 166 L 218 178" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 450 166 L 450 178" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 排序数组 -->
  <g filter="url(#sk)">
    <rect x="140" y="204" width="76" height="44" rx="4" fill="#f2f2f2" stroke="#999" stroke-width="1.3"/>
    <rect x="218" y="204" width="76" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="296" y="204" width="76" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="374" y="204" width="76" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="452" y="204" width="76" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="178" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#555" filter="url(#sk)">1</text>
  <text x="256" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5d24" filter="url(#sk)">2</text>
  <text x="334" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5d24" filter="url(#sk)">3</text>
  <text x="412" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5d24" filter="url(#sk)">4</text>
  <text x="490" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5d24" filter="url(#sk)">5</text>
  <text x="178" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">k=0</text>
  <text x="256" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">k=1</text>
  <text x="334" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">k=2</text>
  <text x="412" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">k=3</text>
  <text x="490" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">k=4</text>

  <!-- 出窗标记 -->
  <g filter="url(#sk)"><ellipse cx="178" cy="226" rx="46" ry="30" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4"/></g>
  <text x="128" y="212" text-anchor="end" font-size="11" font-weight="bold" fill="#8f3a36" filter="url(#sk)">1 出窗</text>
  <text x="128" y="228" text-anchor="end" font-size="10.5" fill="#8f3a36" filter="url(#sk)">2·1 = 2 &lt; 4</text>
  <g filter="url(#sk)"><ellipse cx="256" cy="226" rx="46" ry="30" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4"/></g>
  <text x="238" y="342" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#sk)">2 出窗（2·2 = 4 &lt; 5）</text>
  <path d="M 252 332 Q 252 310 254 290" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>

  <!-- j=4 窗口（下方蓝括号） -->
  <g filter="url(#sk)"><path d="M 296 252 Q 296 266 308 268 L 516 268 Q 528 266 528 252" stroke="#446688" stroke-width="2.4" fill="none"/></g>
  <text x="440" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33507a" filter="url(#sk)">j = 4 时：窗口 = {3, 4, 5}</text>
  <text x="290" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a" filter="url(#sk)">i</text>
  <text x="540" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#33507a" filter="url(#sk)">j</text>

  <!-- 滑移箭头 -->
  <path d="M 476 146 Q 590 190 556 246" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="598" y="196" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">j 右移</text>
  <text x="600" y="212" text-anchor="middle" font-size="11" fill="#777" filter="url(#sk)">i 只增</text>

  <!-- 总结框 -->
  <g filter="url(#sk)"><rect x="80" y="356" width="500" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="330" y="376" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#sk)">ℓ(j)、j 都单调右移 → 每个元素至多进窗一次、出窗一次（双指针）</text>
  <text x="330" y="396" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33507a" filter="url(#sk)">「窗口内与 nums[j] 的最大异或」交给支持计数删除的 0-1 Trie，单次 O(20)</text>

  <text x="330" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">一句话：排序买掉绝对值与 min，滑窗把 O(n²) 的配对压成 O(n) 次增删</text>
</svg>
