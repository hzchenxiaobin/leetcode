<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 328"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="560" height="328" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14.5" fill="#333333" filter="url(#rough2)">逐列扫描时维护「这一对相邻行是否已被严格区分」</text>
  <text x="120" y="62" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">列 0</text>
  <text x="186" y="62" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">列 1</text>
  <text x="52" y="96" text-anchor="end" font-size="11" fill="#666666" filter="url(#rough2)">第0行</text>
  <rect x="88" y="70" width="58" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="95" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="154" y="70" width="58" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183" y="95" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="52" y="140" text-anchor="end" font-size="11" fill="#666666" filter="url(#rough2)">第1行</text>
  <rect x="88" y="114" width="58" height="38" rx="4" fill="#f5f7fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="139" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="154" y="114" width="58" height="38" rx="4" fill="#f5f7fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183" y="139" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="52" y="184" text-anchor="end" font-size="11" fill="#666666" filter="url(#rough2)">第2行</text>
  <rect x="88" y="158" width="58" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="183" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="154" y="158" width="58" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183" y="183" text-anchor="middle" font-size="15" fill="#33475b" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="250" y="74" width="128" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="314" y="94" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">sorted[0] = false</text>
  <rect x="250" y="118" width="128" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="314" y="138" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">sorted[1] = false</text>
  <line x1="224" y1="93" x2="248" y2="89" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="224" y1="137" x2="248" y2="133" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="398" y="70" width="146" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="471" y="92" text-anchor="middle" font-size="10.5" fill="#33475b" filter="url(#rough2)">列 0 出现 c &gt; b：</text>
  <text x="471" y="110" text-anchor="middle" font-size="10.5" fill="#33475b" filter="url(#rough2)">未区分行对逆序</text>
  <text x="471" y="128" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 这一列必须删</text>
  <rect x="40" y="200" width="504" height="62" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="224" text-anchor="middle" font-size="12" fill="#33475b" font-weight="bold" filter="url(#rough2)">sorted[i] = true 之后，第 i 对行的大小关系永久确定</text>
  <text x="292" y="246" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">后面任意列上的逆序都不再有害（字典序只看首个分歧列）</text>
  <rect x="40" y="274" width="504" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="299" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">所以：只看「尚未区分」的行对 → 逐列贪心即可</text>
</svg>
