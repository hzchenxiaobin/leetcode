<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>
  <text x="320" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">进阶：新 '*' 恰好激活哪些子串？</text>
  <text x="320" y="44" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">p 是新替换的位置，a、b 是两侧最近的已有 '*'（可取哨兵 −1 和 n）</text>

  <!-- 左端点括号：cells 2..4 -->
  <path d="M212,84 L212,74 Q212,66 222,66 L340,66 Q350,66 350,74 L350,84" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="281" y="58" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">左端点 l ∈ (a, p]：p − a = 3 种</text>

  <!-- 字符格子：x_i = 120 + 46i -->
  <rect x="120" y="88" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="143" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="166" y="88" width="46" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="189" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">*</text>
  <rect x="212" y="88" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="258" y="88" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="304" y="88" width="46" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="327" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">*</text>
  <rect x="350" y="88" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="396" y="88" width="46" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="419" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">*</text>
  <rect x="442" y="88" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="114" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">e</text>

  <!-- 下标 -->
  <text x="143" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="189" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="235" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="281" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="327" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="373" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="419" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="465" y="146" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>

  <!-- a / p / b 标注 -->
  <text x="189" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a = 1</text>
  <text x="327" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">p = 4（新）</text>
  <text x="419" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">b = 6</text>

  <!-- 右端点括号：cells 4..5 -->
  <path d="M304,178 L304,188 Q304,196 314,196 L386,196 Q396,196 396,188 L396,178" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="212" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">右端点 r ∈ [p, b)：b − p = 2 种</text>

  <!-- 公式框 -->
  <rect x="70" y="222" width="500" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">Δf = (p − a)(b − p) = 3 × 2 = 6</text>
  <text x="320" y="272" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">新增子串 [2,4] [3,4] [4,4] [2,5] [3,5] [4,5]，均恰含 p 这一个 '*'</text>

  <!-- 示例走查表 -->
  <text x="320" y="314" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">示例 2 走查：s = "cat"，order = [0,2,1]，k = 6</text>

  <rect x="139" y="326" width="36" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="157" y="343" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">t</text>
  <rect x="175" y="326" width="36" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="193" y="343" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">p</text>
  <rect x="211" y="326" width="36" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="229" y="343" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a</text>
  <rect x="247" y="326" width="36" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="265" y="343" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">b</text>
  <rect x="283" y="326" width="64" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="315" y="343" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">Δf</text>
  <rect x="347" y="326" width="64" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="379" y="343" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">f(t)</text>
  <rect x="411" y="326" width="94" height="26" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="458" y="343" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">f ≥ k ?</text>

  <rect x="139" y="352" width="36" height="26" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="157" y="369" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="175" y="352" width="36" height="26" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="193" y="369" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="211" y="352" width="36" height="26" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="229" y="369" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="247" y="352" width="36" height="26" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="265" y="369" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="283" y="352" width="64" height="26" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="315" y="369" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1×3 = 3</text>
  <rect x="347" y="352" width="64" height="26" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="379" y="369" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="411" y="352" width="94" height="26" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="458" y="369" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">✗</text>

  <rect x="139" y="378" width="36" height="26" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="157" y="395" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="175" y="378" width="36" height="26" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="193" y="395" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="211" y="378" width="36" height="26" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="229" y="395" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="247" y="378" width="36" height="26" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="265" y="395" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="283" y="378" width="64" height="26" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="315" y="395" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2×1 = 2</text>
  <rect x="347" y="378" width="64" height="26" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="379" y="395" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="411" y="378" width="94" height="26" rx="3" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="458" y="395" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">✗</text>

  <rect x="139" y="404" width="36" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="157" y="421" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="175" y="404" width="36" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="193" y="421" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">1</text>
  <rect x="211" y="404" width="36" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="229" y="421" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">0</text>
  <rect x="247" y="404" width="36" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="421" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="283" y="404" width="64" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="315" y="421" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">1×1 = 1</text>
  <rect x="347" y="404" width="64" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="379" y="421" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">6</text>
  <rect x="411" y="404" width="94" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="458" y="421" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">✓ 答案</text>

  <text x="320" y="462" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">有序集合维护已替换位置（哨兵 −1、n），每步查前驱后继 O(log n)，整体 O(n log n)</text>
</svg>
