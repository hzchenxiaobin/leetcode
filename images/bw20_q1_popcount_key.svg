<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="99"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">排序键：先按 1 的个数（popcount），再按数值</text>

  <!-- 每个数：值、二进制、popcount -->
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="30" y="52" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="78" y="52" width="86" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="164" y="52" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="54" y="70">0</text><text x="121" y="70">0</text><text x="184" y="70">0</text>
    <text x="54" y="100">值</text><text x="121" y="100">二进制</text><text x="184" y="100">1 数</text>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="30" y="112" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="78" y="112" width="86" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="164" y="112" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="54" y="132">1</text><text x="121" y="132">1</text><text x="184" y="132">1</text>
    <rect x="30" y="142" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="78" y="142" width="86" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="164" y="142" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="54" y="162">2</text><text x="121" y="162">10</text><text x="184" y="162">1</text>
    <rect x="30" y="172" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="78" y="172" width="86" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="164" y="172" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="54" y="192">3</text><text x="121" y="192">11</text><text x="184" y="192">2</text>
    <rect x="30" y="202" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="78" y="202" width="86" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="164" y="202" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="54" y="222">4</text><text x="121" y="222">100</text><text x="184" y="222">1</text>
    <rect x="30" y="232" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="78" y="232" width="86" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="164" y="232" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="54" y="252">5</text><text x="121" y="252">101</text><text x="184" y="252">2</text>
    <rect x="30" y="262" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="78" y="262" width="86" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="164" y="262" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="54" y="282">6</text><text x="121" y="282">110</text><text x="184" y="282">2</text>
    <rect x="30" y="292" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="78" y="292" width="86" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="164" y="292" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="54" y="312">7</text><text x="121" y="312">111</text><text x="184" y="312">3</text>
    <rect x="30" y="322" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="78" y="322" width="86" height="30" fill="#fafafa" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="164" y="322" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="54" y="342">8</text><text x="121" y="342">1000</text><text x="184" y="342">1</text>
  </g>

  <!-- 箭头到右侧桶 -->
  <path d="M 214 190 C 250 190, 250 190, 286 190" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧：按桶归位 -->
  <text x="420" y="58" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">同桶内再按数值升序</text>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <rect x="300" y="70" width="230" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="415" y="92">桶 0 个 1：[0]</text>
    <rect x="300" y="114" width="230" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="415" y="136">桶 1 个 1：[1, 2, 4, 8]</text>
    <rect x="300" y="158" width="230" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="415" y="180">桶 2 个 1：[3, 5, 6]</text>
    <rect x="300" y="202" width="230" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="415" y="224">桶 3 个 1：[7]</text>
  </g>
  <rect x="300" y="252" width="230" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="415" y="279" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">结果 [0, 1, 2, 4, 8, 3, 5, 6, 7]</text>
  <rect x="300" y="312" width="230" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="415" y="332" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">排序键 (popcount(x), x)</text>
  <text x="415" y="350" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">一次 sort 搞定，无需真建桶</text>
</svg>
