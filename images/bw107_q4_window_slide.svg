<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="700" height="340" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">查询按 q 升序 → 窗口 [q−x, q] 两端一起右移</text>

  <!-- 时间轴 -->
  <path d="M 60 200 L 660 200" stroke="#888" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555">
    <text x="60" y="222" text-anchor="middle">1</text>
    <text x="120" y="222" text-anchor="middle">2</text>
    <text x="180" y="222" text-anchor="middle">3</text>
    <text x="240" y="222" text-anchor="middle">4</text>
    <text x="300" y="222" text-anchor="middle">5</text>
    <text x="360" y="222" text-anchor="middle">6</text>
    <text x="420" y="222" text-anchor="middle">7</text>
    <text x="480" y="222" text-anchor="middle">8</text>
    <text x="540" y="222" text-anchor="middle">9</text>
    <text x="600" y="222" text-anchor="middle">10</text>
    <text x="660" y="222" text-anchor="middle">11</text>
    <text x="320" y="244" text-anchor="middle" font-size="12">时间轴（logs 按 time 排序后是一条链）</text>
  </g>

  <!-- 日志点：server 1 @ t=3, server 1 @ t=5, server 2 @ t=6 -->
  <g filter="url(#rough2)">
    <ellipse cx="180" cy="188" rx="10" ry="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="180" y="193" text-anchor="middle" font-size="11" fill="#333">1</text>
    <ellipse cx="300" cy="188" rx="10" ry="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="300" y="193" text-anchor="middle" font-size="11" fill="#333">1</text>
    <ellipse cx="360" cy="188" rx="10" ry="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="360" y="193" text-anchor="middle" font-size="11" fill="#333">2</text>
  </g>

  <!-- 窗口 1: [5,10] -->
  <g filter="url(#rough2)">
    <rect x="300" y="60" width="300" height="104" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" fill-opacity="0.45"/>
    <text x="450" y="80" text-anchor="middle" font-size="12.5" fill="#446688">查询 q=10：窗口 [5, 10]</text>
    <rect x="296" y="96" width="8" height="104" rx="2" fill="#446688"/>
    <rect x="592" y="96" width="8" height="104" rx="2" fill="#446688"/>
    <text x="300" y="170" text-anchor="middle" font-size="11" fill="#446688">lo=5</text>
    <text x="596" y="170" text-anchor="middle" font-size="11" fill="#446688">hi=10</text>
    <text x="450" y="130" text-anchor="middle" font-size="12" fill="#333">窗口内有日志 (1,5)、(2,6)</text>
    <text x="450" y="148" text-anchor="middle" font-size="12" fill="#b85450">active = 2 → 空闲 = 3 − 2 = 1</text>
  </g>

  <!-- 窗口 2: [6,11] -->
  <g filter="url(#rough2)">
    <rect x="360" y="60" width="300" height="104" rx="8" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7 4"/>
    <text x="120" y="102" text-anchor="middle" font-size="12.5" fill="#b85450">查询 q=11：窗口 [6, 11]（虚线框）</text>
    <text x="120" y="122" text-anchor="middle" font-size="11.5" fill="#888">比上一个窗口整体右移一格</text>
    <text x="120" y="146" text-anchor="middle" font-size="12" fill="#333">只剩 (2,6) 在窗口内</text>
    <text x="120" y="164" text-anchor="middle" font-size="12" fill="#b85450">active = 1 → 空闲 = 3 − 1 = 2</text>
  </g>

  <!-- 滑动箭头 -->
  <path d="M 120 256 C 200 276, 320 276, 420 260" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="298" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">每条日志一生只「进入窗口」一次、「离开窗口」一次</text>

  <g filter="url(#rough2)">
    <rect x="110" y="308" width="420" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="320" y="326" text-anchor="middle" font-size="12" fill="#d6a040">logs 例子：n=3, logs=[[1,3],[2,6],[1,5]], x=5, queries=[10,11]</text>
  </g>
</svg>
