<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">判定流程：代价只能是 −1 / 1 / 2 / 3</text>

  <rect x="205" y="50" width="230" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="78" text-anchor="middle" font-size="14" fill="#2b4a6b" filter="url(#rough2)">读入 n 与串 s</text>

  <path d="M320 96 L320 122" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="124" width="300" height="50" rx="9" fill="#fff" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="320" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s[0] = '0'，或 s 含 "00" ？</text>
  <text x="320" y="165" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">p₁ = a₁ ≠ 0 ；相邻两个 0 会逼出 aᵢ = 0</text>

  <path d="M470 149 L512 149" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="491" y="139" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="514" y="128" width="92" height="42" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="560" y="154" text-anchor="middle" font-size="14" fill="#8a3b38" filter="url(#rough2)">输出 −1</text>

  <path d="M320 174 L320 200" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="192" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="180" y="202" width="280" height="50" rx="9" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="320" y="224" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">代价 1 可行？（步长只能是 ±1）</text>
  <text x="320" y="243" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">±1 走法：pᵢ ≡ i (mod 2)，可达集是步长 2 的区间</text>

  <path d="M460 227 L512 227" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="486" y="217" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="514" y="206" width="92" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="560" y="232" text-anchor="middle" font-size="14" fill="#33562a" filter="url(#rough2)">输出 1</text>

  <path d="M320 252 L320 284" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="272" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="180" y="286" width="280" height="50" rx="9" fill="#fff" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="320" y="308" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">代价 2 可行？（步长上限 2）</text>
  <text x="320" y="327" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">无零段内第 2..k−1 段的长度都不能恰好等于 2</text>

  <path d="M460 311 L512 311" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="486" y="301" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">是</text>
  <rect x="514" y="290" width="92" height="42" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="560" y="316" text-anchor="middle" font-size="14" fill="#8a6d1f" filter="url(#rough2)">输出 2</text>

  <path d="M320 336 L320 372" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="332" y="358" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="180" y="374" width="280" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="396" text-anchor="middle" font-size="13" fill="#2b4a6b" filter="url(#rough2)">代价 3 一定可行（引理 5）</text>
  <text x="320" y="413" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">入口额度 3 → 2 → 2 → …，永远 ≥ 2</text>

  <path d="M460 397 L512 397" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="514" y="376" width="92" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="560" y="402" text-anchor="middle" font-size="14" fill="#2b4a6b" filter="url(#rough2)">输出 3</text>

  <text x="320" y="448" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">可行性对 C 单调 ⇒ 第一个可行的 C 就是最小值</text>
</svg>
