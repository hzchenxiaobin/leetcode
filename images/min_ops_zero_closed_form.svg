<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="43" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：k 步的总减量有封闭形式</text>
  <path d="M 170 44 Q 320 52 470 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="40" y="64" width="84" height="42" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="82" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">num1</text>
  <path d="M 126 85 L 144 85" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="148" y="64" width="108" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="202" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">−(2<tspan dy="-5" font-size="9">i</tspan><tspan dy="5"> + num2)</tspan></text>
  <text x="202" y="100" text-anchor="middle" font-size="10" fill="#8a6415">选 i ∈ [0,60]</text>
  <path d="M 258 85 L 276 85" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="280" y="64" width="108" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="334" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">−(2<tspan dy="-5" font-size="9">i</tspan><tspan dy="5"> + num2)</tspan></text>
  <text x="334" y="100" text-anchor="middle" font-size="10" fill="#8a6415">选 i ∈ [0,60]</text>
  <path d="M 390 85 L 404 85" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="416" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#555555">⋯</text>
  <path d="M 428 85 L 444 85" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="448" y="64" width="108" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="502" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6415">−(2<tspan dy="-5" font-size="9">i</tspan><tspan dy="5"> + num2)</tspan></text>
  <text x="502" y="100" text-anchor="middle" font-size="10" fill="#8a6415">第 k 步</text>
  <path d="M 558 85 L 574 85" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="578" y="64" width="44" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="600" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">0</text>

  <text x="320" y="132" text-anchor="middle" font-size="12" fill="#555555">共 k 步：num2 总共被减去 k 次——与选了哪些 i 完全无关</text>

  <g filter="url(#sk)">
    <rect x="44" y="150" width="552" height="146" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.3"/>
  </g>
  <text x="320" y="182" text-anchor="middle" font-size="13" fill="#333333">k 步共减去　Σ(2<tspan dy="-5" font-size="9">i</tspan><tspan dy="5"> + num2) = Σ 2</tspan><tspan dy="-5" font-size="9">i</tspan><tspan dy="5"> + k · num2</tspan></text>
  <text x="320" y="210" text-anchor="middle" font-size="13" fill="#333333">终值为 0　⇔　num1 − k · num2 = Σ 2<tspan dy="-5" font-size="9">i</tspan></text>
  <g filter="url(#sk)">
    <rect x="84" y="228" width="472" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="250" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6415">记 S = num1 − k · num2</text>
  <text x="320" y="270" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6415">⇒ S 必须恰好等于 k 个 2 的幂之和</text>

  <g filter="url(#sk)">
    <rect x="40" y="316" width="300" height="52" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="190" y="337" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">k 可行 ⇔ popcount(S) ≤ k ≤ S</text>
  <text x="190" y="356" text-anchor="middle" font-size="11" fill="#2e6e2e">（区间判定，见下一张图）</text>

  <g filter="url(#sk)">
    <rect x="356" y="316" width="244" height="52" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="478" y="337" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b6e9e">自由度只剩一个小整数 k</text>
  <text x="478" y="356" text-anchor="middle" font-size="11" fill="#2b6e9e">→ 从小到大枚举即可</text>

  <g filter="url(#sk)">
    <rect x="40" y="388" width="560" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="320" y="409" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">num2 &lt; 0 时每步可能不减反增：值域无上界，BFS / 暴搜没有终点，</text>
  <text x="320" y="428" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450">必须先把 k 步的总效果写成封闭形式，再转为判定问题</text>
</svg>
