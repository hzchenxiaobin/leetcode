<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">流式折叠：不建数组，边生成边异或</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">异或可交换、可结合 ⇒ 归约顺序无关；0 是异或的单位元 ⇒ 累加器初值取 0</text>

  <rect x="28" y="72" width="196" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="126" y="96" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">nums[i] = start + 2·i</text>
  <text x="126" y="120" text-anchor="middle" font-size="11" fill="#4a5a76" filter="url(#rough2)">i = 0, 1, …, n−1</text>
  <text x="126" y="142" text-anchor="middle" font-size="11" fill="#4a5a76" filter="url(#rough2)">步长恒为 2 ⇒ 同奇偶</text>
  <text x="126" y="162" text-anchor="middle" font-size="10" fill="#8899aa" filter="url(#rough2)">只在需要时才算出这一项</text>

  <path d="M226,122 L254,122" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="258" y="72" width="196" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="356" y="96" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">ans ^= start + 2·i</text>
  <text x="356" y="120" text-anchor="middle" font-size="11" fill="#4a6a3a" filter="url(#rough2)">ans 初值 0（单位元）</text>
  <text x="356" y="142" text-anchor="middle" font-size="11" fill="#4a6a3a" filter="url(#rough2)">一趟扫描 O(n) / O(1) 空间</text>
  <text x="356" y="162" text-anchor="middle" font-size="10" fill="#88a08a" filter="url(#rough2)">不需要 nums 数组</text>

  <path d="M456,122 L482,122" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="486" y="72" width="126" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="549" y="112" text-anchor="middle" font-size="13" fill="#8a3b38" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <text x="549" y="134" text-anchor="middle" font-size="10" fill="#a86a66" filter="url(#rough2)">全部元素的异或</text>
  <text x="549" y="152" text-anchor="middle" font-size="10" fill="#a86a66" filter="url(#rough2)">值</text>

  <rect x="28" y="196" width="584" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="228" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">ans = nums[0] ^ nums[1] ^ ⋯ ^ nums[n−1] = (start) ^ (start+2) ^ ⋯ ^ (start+2(n−1))</text>

  <rect x="28" y="268" width="584" height="106" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="44" y="292" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">低位不变式：30 秒自检答案</text>
  <text x="44" y="316" font-size="11" fill="#4a6a3a" filter="url(#rough2)">步长 2 不改变最低位 ⇒ 每个 nums[i] 的最低位都等于 start 的最低位</text>
  <text x="44" y="338" font-size="11" fill="#4a6a3a" filter="url(#rough2)">答案第 0 位 =（n 为奇数）且（start 为奇数）⇒ n 为偶数时答案必为偶数</text>
  <text x="44" y="360" font-size="10" fill="#88a08a" filter="url(#rough2)">例：n = 5, start = 0 ⇒ 8；n = 4, start = 3 ⇒ 8，两个答案都是偶数，通过自检</text>
</svg>
