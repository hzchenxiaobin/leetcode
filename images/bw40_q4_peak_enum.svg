<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="380" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">等价转换：最少删除 = n − 最长山形子序列</text>
  <text x="340" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">山形子序列必须「先严格增再严格减」，峰两侧各自是独立的 LIS 问题</text>

  <!-- mountain diagram -->
  <g filter="url(#r)">
    <rect x="60" y="80" width="560" height="170" rx="12" fill="#f6f8f4" stroke="#8aa07c" stroke-width="1.6"/>
  </g>
  <!-- ascending dots -->
  <circle cx="130" cy="220" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#r)"/>
  <circle cx="200" cy="196" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#r)"/>
  <circle cx="270" cy="168" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#r)"/>
  <!-- peak -->
  <circle cx="340" cy="120" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" filter="url(#r)"/>
  <!-- descending dots -->
  <circle cx="410" cy="168" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#r)"/>
  <circle cx="480" cy="196" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#r)"/>
  <circle cx="550" cy="220" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#r)"/>
  <path d="M 140 216 L 192 200" stroke="#446688" stroke-width="2" fill="none" filter="url(#r)"/>
  <path d="M 210 192 L 262 172" stroke="#446688" stroke-width="2" fill="none" filter="url(#r)"/>
  <path d="M 280 162 L 330 128" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#r)"/>
  <path d="M 350 128 L 402 164" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#r)"/>
  <path d="M 420 174 L 472 192" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#r)"/>
  <path d="M 490 200 L 542 216" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#r)"/>
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="185" y="248" fill="#33517a">左侧：最长严格上升（lis[i]）</text>
    <text x="465" y="248" fill="#3a5c2c">右侧：最长严格下降（lds[i]）</text>
    <text x="340" y="100" fill="#a67c1e">峰 i（0 &lt; i &lt; n−1）</text>
  </g>

  <!-- formula -->
  <g filter="url(#r)">
    <rect x="60" y="272" width="560" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="340" y="301" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#33517a" filter="url(#r)">mountainLen(i) = lis[i] + lds[i] − 1（峰被两侧各数一次，减 1 去重）</text>

  <!-- guard -->
  <g filter="url(#r)">
    <rect x="60" y="330" width="560" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="340" y="356" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#r)">两侧都必须非平凡：lis[i] ≥ 2 且 lds[i] ≥ 2，否则 i 只是普通端点不是峰</text>
</svg>
