<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 432" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="432" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：按「字母组」对齐，而不是逐字符比较</text>
  <text x="350" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">s = "heeellooo" 拆成 h¹ ｜ e³ ｜ l² ｜ o³，查询词必须拆出同样个数的组</text>

  <text x="22" y="108" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">s</text>
  <text x="22" y="124" font-size="8.5" fill="#8a9ab0" filter="url(#rough2)">组长</text>
  <rect x="126" y="78" width="100" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="176" y="107" text-anchor="middle" font-size="12.5" fill="#3a4a66" filter="url(#rough2)">h × 1</text>
  <rect x="260" y="78" width="100" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="107" text-anchor="middle" font-size="12.5" fill="#3a4a66" filter="url(#rough2)">e × 3</text>
  <rect x="394" y="78" width="100" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="444" y="107" text-anchor="middle" font-size="12.5" fill="#3a4a66" filter="url(#rough2)">l × 2</text>
  <rect x="528" y="78" width="100" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="578" y="107" text-anchor="middle" font-size="12.5" fill="#3a4a66" filter="url(#rough2)">o × 3</text>

  <text x="22" y="180" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">hello</text>
  <rect x="126" y="150" width="100" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="176" y="179" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">h × 1</text>
  <rect x="260" y="150" width="100" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="179" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">e × 1</text>
  <rect x="394" y="150" width="100" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="444" y="179" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">l × 2</text>
  <rect x="528" y="150" width="100" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="578" y="179" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">o × 1</text>
  <text x="668" y="179" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 可扩张</text>

  <text x="22" y="252" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">helo</text>
  <rect x="126" y="222" width="100" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="176" y="251" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">h × 1</text>
  <rect x="260" y="222" width="100" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="251" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">e × 1</text>
  <rect x="394" y="222" width="100" height="46" rx="6" fill="#fff8e1" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="444" y="251" text-anchor="middle" font-size="12.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">l × 1</text>
  <rect x="528" y="222" width="100" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="578" y="251" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">o × 1</text>
  <text x="666" y="251" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 非法</text>

  <path d="M 444 128 L 444 146" stroke="#666" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 444 200 L 444 218" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="40" y="290" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">红框这一组：s 的长度 2 要求把 l 扩到 2，但扩张只能停在 3 及以上 → 该组无解</text>

  <rect x="34" y="302" width="632" height="106" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="326" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">① 组数必须相同，同一下标的组字符也必须相同（否则连位置都对不上）</text>
  <text x="52" y="350" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">② 查询词的组长不能超过 s：操作只能加字母，永远不能减少</text>
  <text x="52" y="374" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">③ 组长严格小于时，s 的组长必须 ≥ 3（扩张的目标长度不得低于 3）</text>
  <text x="52" y="398" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">④ 三条同时成立则该词可扩张；于是判定退化为「逐组比字符 + 比长度」的线性扫描</text>
</svg>
