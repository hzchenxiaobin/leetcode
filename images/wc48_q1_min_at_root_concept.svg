<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>
  <text x="330" y="28" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">核心观察：根值即全局最小，答案是「严格大于根值的最小值」</text>
  <path d="M 60 38 Q 330 46 600 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 左侧：示例树 -->
  <text x="168" y="60" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">minVal = root.val = 2（全局最小）</text>

  <path d="M 168 130 L 104 172" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 168 130 L 238 172" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 245 208 L 210 254" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>
  <path d="M 245 208 L 284 254" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>

  <circle cx="168" cy="108" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="168" y="114" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">2</text>

  <circle cx="95" cy="190" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="196" text-anchor="middle" font-size="15" fill="#2b4a6b" filter="url(#rough2)">2</text>
  <text x="95" y="232" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">同值叶子</text>

  <circle cx="245" cy="190" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="245" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">5</text>

  <rect x="180" y="248" width="128" height="46" rx="8" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <circle cx="205" cy="272" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="277" text-anchor="middle" font-size="13" fill="#8b3a36" filter="url(#rough2)">5</text>
  <circle cx="285" cy="272" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="277" text-anchor="middle" font-size="13" fill="#8b3a36" filter="url(#rough2)">7</text>
  <text x="244" y="312" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">整棵子树剪掉：值都 ≥ 5</text>

  <text x="266" y="176" text-anchor="start" font-size="9.5" fill="#2e6e2e" filter="url(#rough2)">候选 M</text>

  <!-- 右侧：三条观察 -->
  <rect x="350" y="56" width="292" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="496" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6b" filter="url(#rough2)">① 根值 = 全局最小值</text>
  <text x="496" y="98" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">u.val = min(孩子) ⇒ 子树值都 ≥ 子树根</text>
  <text x="496" y="116" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">根是整棵树的子树根 ⇒ 根值最小</text>
  <text x="496" y="134" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">所以 minVal 不必再求一遍</text>

  <rect x="350" y="154" width="292" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="496" y="176" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">② 答案 = min{ v : v &gt; minVal }</text>
  <text x="496" y="196" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">去重升序 v0 &lt; v1 &lt; …，v0 = minVal</text>
  <text x="496" y="214" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">「第二小」就是 v1，重复值只算一次</text>
  <text x="496" y="232" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">求不到 ⇒ 只存在一种值 ⇒ 返回 -1</text>

  <rect x="350" y="252" width="292" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="496" y="274" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">③ 只需展开值为 minVal 的节点</text>
  <text x="496" y="294" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">沿路径上最近同值祖先 p，它的孩子 c</text>
  <text x="496" y="312" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">满足 c.val ≤ M 且 c.val &gt; minVal，</text>
  <text x="496" y="330" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">故 c.val = M —— 候选必在 minVal 的孩子上</text>

  <!-- 底部提示 -->
  <rect x="40" y="352" width="580" height="70" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="374" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8b3a36" filter="url(#rough2)">⚠️ 遇到 v &gt; minVal 就结算 ans = min(ans, v)，随即剪掉整棵子树</text>
  <text x="330" y="394" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">因为「子树最小值在根」，该子树内所有值 ≥ v，不可能给出更小的候选</text>
  <text x="330" y="412" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">示例里只有 3 个节点被访问，{5, 7} 这棵子树根本没进递归</text>
</svg>
