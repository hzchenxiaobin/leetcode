<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="460" fill="#fafafa" filter="url(#rough2)"/>

  <text x="340" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    核心观察：逐素数比指数，条件坍缩成「b 整除 a 且整除 c」
  </text>
  <text x="340" y="56" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">
    记 x = v_p(a)、y = v_p(b)、z = v_p(c)，题面等式对每个素数 p 化为
  </text>
  <text x="340" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    min( max(x, y), max(y, z) ) = min(x, z)
  </text>

  <text x="88" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">(x, y, z)</text>
  <text x="196" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">max(x,y)</text>
  <text x="300" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">max(y,z)</text>
  <text x="404" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">左式</text>
  <text x="508" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">右式</text>
  <text x="606" y="112" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">判定</text>

  <rect x="40" y="120" width="600" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="88" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(3, 1, 2)</text>
  <text x="196" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="300" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="404" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="508" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="606" y="142" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">成立</text>

  <rect x="40" y="158" width="600" height="34" rx="6" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="88" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2, 3, 4)</text>
  <text x="196" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="300" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="404" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="508" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="606" y="180" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">不成立</text>

  <rect x="40" y="196" width="600" height="34" rx="6" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="88" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2, 5, 2)</text>
  <text x="196" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="300" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="404" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="508" y="218" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="606" y="218" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">不成立</text>

  <rect x="40" y="234" width="600" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="88" y="256" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2, 2, 2)</text>
  <text x="196" y="256" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="300" y="256" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="404" y="256" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="508" y="256" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="606" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">成立</text>

  <text x="340" y="292" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    左式恒 ≥ min(x,z)，取等当且仅当 y ≤ min(x,z)
  </text>

  <rect x="40" y="308" width="600" height="122" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="64" y="336" font-size="12" fill="#333" filter="url(#rough2)">
    逐素数合并回整数：对每个 p 都有 v_p(b) ≤ min(v_p(a), v_p(c))
  </text>
  <text x="64" y="360" font-size="12" fill="#333" filter="url(#rough2)">
    等价于 b | a 且 b | c，也就是 b | gcd(a, c)
  </text>
  <text x="64" y="384" font-size="12" fill="#333" filter="url(#rough2)">
    于是固定 b 后 a 与 c 各自从 b 的倍数中任选：共 ⌊n/b⌋² 种
  </text>
  <text x="64" y="412" font-size="13" fill="#b85450" filter="url(#rough2)">
    答案 = Σ_{b=1..n} ⌊n/b⌋²
  </text>
</svg>
