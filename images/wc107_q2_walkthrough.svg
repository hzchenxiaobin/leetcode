<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 336"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="336" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "00110" → 1</text>
  <rect x="60" y="56" width="60" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90.0" y="73.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <rect x="120" y="56" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160.0" y="73.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ones</text>
  <rect x="200" y="56" width="80" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240.0" y="73.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">flips</text>
  <rect x="280" y="56" width="300" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430.0" y="73.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">说明</text>
  <rect x="60" y="86" width="60" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90.0" y="104.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="120" y="86" width="80" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160.0" y="104.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="200" y="86" width="80" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240.0" y="104.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="280" y="86" width="300" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430.0" y="104.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">遇到 0：flips = min(0+1, 0) = 0</text>
  <rect x="60" y="116" width="60" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90.0" y="134.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="120" y="116" width="80" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160.0" y="134.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="200" y="116" width="80" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240.0" y="134.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="280" y="116" width="300" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430.0" y="134.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">同上，仍为 0</text>
  <rect x="60" y="146" width="60" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90.0" y="164.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="120" y="146" width="80" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160.0" y="164.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="200" y="146" width="80" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240.0" y="164.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="280" y="146" width="300" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430.0" y="164.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">遇到 1：ones = 1，flips 不变</text>
  <rect x="60" y="176" width="60" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90.0" y="194.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <rect x="120" y="176" width="80" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160.0" y="194.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="200" y="176" width="80" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240.0" y="194.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="280" y="176" width="300" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430.0" y="194.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">遇到 1：ones = 2</text>
  <rect x="60" y="206" width="60" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90.0" y="224.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="120" y="206" width="80" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160.0" y="224.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <rect x="200" y="206" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240.0" y="224.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">min(1,2)=1</text>
  <rect x="280" y="206" width="300" height="30" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430.0" y="224.5" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">遇到 0：flips+1 = 1 比 ones = 2 更省</text>
  <text x="330" y="274" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回值 flips = 1，对应把最后一个 0 翻成 1 → "00111"</text>
  <text x="330" y="316" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">另一条等价路径：全翻成 "00000"，代价 2，不如 1</text>
</svg>
