<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：一趟扫描，贡献法累加</text>

  <rect x="60" y="44" width="230" height="38" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="68" text-anchor="middle" font-size="13" fill="#2a4a20" filter="url(#rough2)">ans = 0；last[c] ← −1（∀c）</text>

  <rect x="60" y="112" width="230" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="136" text-anchor="middle" font-size="13" fill="#33445c" filter="url(#rough2)">c = s[i]；L = last[c]</text>

  <rect x="60" y="182" width="230" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="175" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07820" filter="url(#rough2)">ans += (i − L) × (n − i)</text>

  <rect x="60" y="260" width="230" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="284" text-anchor="middle" font-size="13" fill="#33445c" filter="url(#rough2)">last[c] ← i；i ← i + 1</text>

  <polygon points="175,320 247,352 175,384 103,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="357" text-anchor="middle" font-size="13" fill="#a07820" filter="url(#rough2)">i &lt; n ?</text>

  <rect x="368" y="332" width="120" height="40" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="357" text-anchor="middle" font-size="13" fill="#2a4a20" filter="url(#rough2)">返回 ans</text>

  <path d="M 175 82 L 175 106" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 175 150 L 175 176" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 175 226 L 175 254" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 175 298 L 175 316" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 103 352 L 38 352 L 38 131 L 54 131" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="76" y="344" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 247 352 L 364 352" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="344" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="336" y="60" width="158" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="90" text-anchor="middle" font-size="12" fill="#33445c" filter="url(#rough2)">每步 O(1)</text>
  <text x="415" y="118" text-anchor="middle" font-size="12" fill="#33445c" filter="url(#rough2)">共 n 步</text>
  <text x="415" y="146" text-anchor="middle" font-size="12" fill="#33445c" filter="url(#rough2)">时间 O(n)，空间 O(26)</text>
</svg>
