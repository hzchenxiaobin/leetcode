<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="47"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">分数 = 每条「相邻边」上 ASCII 差值的绝对值之和</text>

  <g filter="url(#rough2)">
    <rect x="60" y="60" width="56" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="140" y="60" width="56" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="220" y="60" width="56" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="300" y="60" width="56" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
    <rect x="380" y="60" width="56" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="5"/>
  </g>
  <g font-size="18" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="88" y="86">h</text><text x="168" y="86">e</text><text x="248" y="86">l</text>
    <text x="328" y="86">l</text><text x="408" y="86">o</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="88" y="108">104</text><text x="168" y="108">101</text><text x="248" y="108">108</text>
    <text x="328" y="108">108</text><text x="408" y="108">111</text>
  </g>
  <g font-size="11" fill="#b85450" text-anchor="middle" filter="url(#rough2)">
    <text x="128" y="94">3</text><text x="208" y="94">7</text><text x="288" y="94">0</text><text x="368" y="94">3</text>
  </g>
  <path d="M 116 94 L 140 94" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 196 94 L 220 94" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 276 94 L 300 94" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 356 94 L 380 94" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="88" y="136">i=0</text><text x="168" y="136">i=1</text><text x="248" y="136">i=2</text>
    <text x="328" y="136">i=3</text><text x="408" y="136">i=4</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#446688">
    <rect x="60" y="152" width="105" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6"/>
    <rect x="180" y="152" width="105" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6"/>
    <rect x="300" y="152" width="105" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6"/>
    <rect x="420" y="152" width="105" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="112" y="172">|104−101| = 3</text><text x="232" y="172">|101−108| = 7</text>
    <text x="352" y="172">|108−108| = 0</text><text x="472" y="172">|108−111| = 3</text>
  </g>

  <rect x="60" y="200" width="465" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="292" y="222" text-anchor="middle" font-size="13" fill="#2d5a22" font-weight="bold" filter="url(#rough2)">3 + 7 + 0 + 3 = 13</text>
  <rect x="60" y="244" width="465" height="34" fill="#fff" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="292" y="266" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">只取绝对值：谁大谁小都无所谓，不需要先比大小</text>
  <rect x="60" y="288" width="465" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="292" y="310" text-anchor="middle" font-size="12" fill="#7a5c1e" filter="url(#rough2)">n − 1 条边，每条 edge(i−1, i) 恰好算一次，故一趟扫描即可</text>
</svg>
