<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：元素是「位」的载体，删光一整列 ⟺ 强度严格减小</text>

  <text x="24" y="58" font-size="12" fill="#555" filter="url(#rough2)">nums = [7, 4, 6]，S = OR(全部) = 111₂</text>

  <text x="176" y="82" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">b₄</text>
  <text x="228" y="82" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">b₂</text>
  <text x="280" y="82" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">b₁</text>

  <text x="162" y="112" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="150" y="88" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="202" y="88" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="254" y="88" width="52" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="112" text-anchor="middle" font-size="13" fill="#8a3a34" filter="url(#rough2)">1</text>

  <text x="162" y="154" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="150" y="130" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="202" y="130" width="52" height="38" fill="#f4f4f4" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="228" y="154" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="254" y="130" width="52" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="13" fill="#c98a86" filter="url(#rough2)">0</text>

  <text x="162" y="196" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="150" y="172" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="196" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="202" y="172" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="196" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="254" y="172" width="52" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="13" fill="#c98a86" filter="url(#rough2)">0</text>

  <rect x="350" y="88" width="152" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="426" y="110" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">OR 逐位独立</text>
  <text x="426" y="128" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">位 b 活着 ⟺ 载体至少留一个</text>

  <rect x="350" y="156" width="152" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="426" y="178" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">位 b 死 ⟺ E_b ⊆ R</text>
  <text x="426" y="196" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">载体一个不剩</text>

  <text x="24" y="248" font-size="11.5" fill="#555" filter="url(#rough2)">每个位的载体集合 E_b（含该位的元素）：</text>

  <path d="M 176 214 Q 150 240 110 254" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 228 214 Q 240 240 252 254" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 280 214 Q 350 244 402 254" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="258" width="132" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="106" y="278" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">E_b₄ = {7, 4, 6}</text>
  <text x="106" y="296" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">删光三个才能杀 b₄</text>

  <rect x="192" y="258" width="122" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="253" y="278" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">E_b₂ = {7, 6}</text>
  <text x="253" y="296" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">两个载体</text>

  <rect x="336" y="258" width="144" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="408" y="278" text-anchor="middle" font-size="11.5" fill="#8a3a34" filter="url(#rough2)">E_b₁ = {7}</text>
  <text x="408" y="296" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">最小！只有 1 个载体</text>

  <rect x="36" y="328" width="448" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="12.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">移除集 R 有效 ⟺ 剩余 OR &lt; S ⟺ 至少一列 E_b 被整列删光</text>
  <text x="260" y="370" text-anchor="middle" font-size="11" fill="#8a6a30" filter="url(#rough2)">事件按「位」定义，只有 k ≤ 20 个 ⟹ 容斥只需 2ᵏ 级展开</text>

  <text x="260" y="398" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">值域 10⁶ &lt; 2²⁰ 钉死 k ≤ 20，与 n 无关——这是本题可解的根源</text>
</svg>
