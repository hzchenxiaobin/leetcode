<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path filter="url(#rough2)" d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="320" fill="#fafafa" filter="url(#rough2)"/>
  <text x="24" y="30" font-size="16" fill="#333" filter="url(#rough2)">构造回文数：只枚举「前半段」，后半段照镜子补齐</text>

  <text x="60" y="66" font-size="12" fill="#666" filter="url(#rough2)">奇数长度 L = 5，前半段（含中间位）取 3 位：half = 123</text>

  <rect x="60" y="82" width="80" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="114" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>
  <rect x="140" y="82" width="80" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="114" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">2</text>
  <rect x="220" y="82" width="80" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">3</text>
  <rect x="300" y="82" width="80" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="114" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">2</text>
  <rect x="380" y="82" width="80" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="114" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>

  <text x="100" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">half[0]</text>
  <text x="180" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">half[1]</text>
  <text x="260" y="152" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">half[2] 中间位</text>
  <text x="340" y="152" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">镜子 half[1]</text>
  <text x="420" y="152" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">镜子 half[0]</text>

  <path d="M180,74 Q260,48 340,74" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M100,74 Q250,36 420,74" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="176" width="400" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="78" y="203" font-size="13" fill="#4a7a3a" filter="url(#rough2)">pal = int(half + reverse(half[:-1])) = 12321</text>

  <rect x="60" y="232" width="520" height="72" rx="9" fill="#ffffff" stroke="#c8d0da" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="254" font-size="12" fill="#333" filter="url(#rough2)">长度 L 的回文数由它的前 ceil(L/2) 位唯一确定，共 9 × 10^(ceil(L/2)−1) 个。</text>
  <text x="76" y="276" font-size="12" fill="#333" filter="url(#rough2)">所以不必从 n 开始逐个整数试，只需按「前半段递增」的顺序枚举，天然有序。</text>
  <text x="76" y="296" font-size="12" fill="#446688" filter="url(#rough2)">候选数量从 10^8 量级骤降到 10^5 量级。</text>
</svg>
