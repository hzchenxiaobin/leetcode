<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="480" fill="#fafafa"/>
  <text x="360" y="24" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：固定右端点 r，合法左端点连成一段 [A, C]</text>
  <text x="360" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例 nums = [1,2,1,2,2]，k = 2，m = 2，观察 r = 4</text>

  <!-- array strip -->
  <text x="275" y="56" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">r = 4 ↓</text>
  <rect x="100" y="60" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="60" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="200" y="60" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="82" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="250" y="60" width="50" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="275" y="82" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="300" y="60" width="50" height="34" rx="4" fill="#f2f2f2" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="325" y="82" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">2</text>
  <text x="125" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="175" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="225" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="275" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="325" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>

  <!-- table header -->
  <text x="196" y="136" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">窗口 [l, 4]</text>
  <text x="362" y="136" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">不同数 h</text>
  <text x="470" y="136" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">bad：次数&lt;m 的值</text>
  <text x="608" y="136" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold" filter="url(#rough2)">判定</text>

  <!-- row l=1 : A and C badges -->
  <rect x="36" y="146" width="648" height="38" rx="8" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="22" cy="159" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="22" y="162.5" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <circle cx="22" cy="178" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="22" y="181.5" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="52" y="170" font-size="11" fill="#333" filter="url(#rough2)">l=1</text>
  <rect x="120" y="152" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="137" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="158" y="152" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="196" y="152" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="213" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="234" y="152" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="251" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="272" y="152" width="34" height="26" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="289" y="169" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">2</text>
  <text x="362" y="170" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2 ＝ k ✓</text>
  <rect x="456" y="152" width="28" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="169" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="608" y="170" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 合法</text>

  <!-- row l=2 -->
  <rect x="36" y="188" width="648" height="38" rx="8" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="212" font-size="11" fill="#333" filter="url(#rough2)">l=2</text>
  <rect x="120" y="194" width="34" height="26" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="137" y="211" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">1</text>
  <rect x="158" y="194" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="196" y="194" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="213" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="234" y="194" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="251" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="272" y="194" width="34" height="26" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="289" y="211" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">2</text>
  <text x="362" y="212" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2 ＝ k ✓</text>
  <rect x="456" y="194" width="28" height="24" rx="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="211" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="608" y="212" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 值 1 只 1 次</text>

  <!-- row l=3 : B badge -->
  <rect x="36" y="230" width="648" height="38" rx="8" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="22" cy="249" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="22" y="252.5" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="52" y="254" font-size="11" fill="#333" filter="url(#rough2)">l=3</text>
  <rect x="120" y="236" width="34" height="26" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="137" y="253" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">1</text>
  <rect x="158" y="236" width="34" height="26" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="253" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">2</text>
  <rect x="196" y="236" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="213" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="234" y="236" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="251" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="272" y="236" width="34" height="26" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="289" y="253" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">2</text>
  <text x="362" y="254" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2 ＝ k ✓</text>
  <rect x="456" y="236" width="28" height="24" rx="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="253" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="608" y="254" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗ 值 1、2 各 1 次</text>

  <!-- row l=4 -->
  <rect x="36" y="272" width="648" height="38" rx="8" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="296" font-size="11" fill="#333" filter="url(#rough2)">l=4</text>
  <rect x="120" y="278" width="34" height="26" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="137" y="295" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">1</text>
  <rect x="158" y="278" width="34" height="26" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="175" y="295" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">2</text>
  <rect x="196" y="278" width="34" height="26" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="213" y="295" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">1</text>
  <rect x="234" y="278" width="34" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="251" y="295" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="272" y="278" width="34" height="26" rx="4" fill="#f2f2f2" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="289" y="295" text-anchor="middle" font-size="11" fill="#ccc" filter="url(#rough2)">2</text>
  <text x="362" y="296" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">1 ＜ k ✗</text>
  <text x="470" y="296" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="608" y="296" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">✗ 不同数不足</text>

  <!-- pointer explanation -->
  <rect x="36" y="322" width="648" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="344" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">A ＝ h ≤ k 的最小 l（最长窗口端）· B ＝ h ≥ k 的最大 l（最短窗口端）→ 恰好 k 个不同</text>
  <text x="360" y="360" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">的 l 组成区间 [A, B]；在 [A, B] 内窗口越短、次数不足 m 的值越多 → bad 单调不减</text>
  <text x="360" y="378" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">→ 合法（h＝k 且 bad＝0）的 l 是前缀 [A, C]，C ＝ 段内最右的 0</text>

  <!-- conclusion -->
  <rect x="36" y="398" width="648" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="422" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">本例 A=1，B=3，C=1：合法 l ∈ [1,1]，右端点 r=4 贡献 1 个子数组</text>
  <text x="360" y="442" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">即 [1,2,1,2] —— 恰 2 个不同值且每个出现 2 次 ✓</text>
</svg>
