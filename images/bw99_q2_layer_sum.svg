<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">一层一层加起来：闭式推导</text>

  <!-- 同心环示意 -->
  <ellipse cx="120" cy="180" rx="26" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="120" cy="180" rx="56" ry="56" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <ellipse cx="120" cy="180" rx="86" ry="86" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="120" y="186" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="120" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="120" y="96" text-anchor="middle" font-size="12" fill="#a07518" filter="url(#rough2)">8</text>

  <!-- 推导 -->
  <text x="270" y="80" font-size="14" fill="#333" filter="url(#rough2)">f(n) = 1 + 4×1 + 4×2 + … + 4×(n−1)</text>
  <text x="270" y="108" font-size="14" fill="#333" filter="url(#rough2)">= 1 + 4 × (1 + 2 + … + (n−1))</text>
  <text x="270" y="136" font-size="14" fill="#333" filter="url(#rough2)">= 1 + 4 × n(n−1)/2</text>
  <path d="M 268 152 L 480 152" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="184" font-size="16" fill="#8c3a36" filter="url(#rough2)">f(n) = 2n² − 2n + 1</text>

  <path d="M 210 176 L 254 176" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 验证 -->
  <rect x="56" y="212" width="408" height="116" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">代入验证：</text>
  <text x="160" y="268" font-size="13" fill="#2f5527" filter="url(#rough2)">n = 1 → 2−2+1 = 1 ✓</text>
  <text x="160" y="290" font-size="13" fill="#2f5527" filter="url(#rough2)">n = 2 → 8−4+1 = 5 ✓</text>
  <text x="160" y="312" font-size="13" fill="#2f5527" filter="url(#rough2)">n = 3 → 18−6+1 = 13 ✓</text>
  <text x="330" y="268" font-size="13" fill="#2f5527" filter="url(#rough2)">n = 10⁵ →</text>
  <text x="330" y="290" font-size="13" fill="#2f5527" filter="url(#rough2)">2×10¹⁰−2×10⁵+1</text>
  <text x="330" y="312" font-size="13" fill="#b85450" filter="url(#rough2)">≈ 2×10¹⁰，超 int！</text>
</svg>
