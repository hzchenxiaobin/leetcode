<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="384" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三组官方示例的走查</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">三行分别对应「中间有 6」「末尾是 6」「全是 9」三种形态</text>

  <g font-size="10.5" text-anchor="middle" fill="#555">
    <text x="85" y="80" filter="url(#rough2)">num</text>
    <text x="200" y="80" filter="url(#rough2)">各位与位权</text>
    <text x="330" y="80" filter="url(#rough2)">最左边的 6</text>
    <text x="412" y="80" filter="url(#rough2)">增量</text>
    <text x="490" y="80" filter="url(#rough2)">结果</text>
  </g>
  <path d="M 40 88 L 520 88" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="96" width="480" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="85" y="126" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9669</text>
  <text x="200" y="126" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">9 6 6 9</text>
  <text x="330" y="126" font-size="11" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">第 1 位，位权 100</text>
  <text x="412" y="126" font-size="11" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">+300</text>
  <text x="490" y="126" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9969</text>

  <rect x="40" y="152" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="85" y="182" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9996</text>
  <text x="200" y="182" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">9 9 9 6</text>
  <text x="330" y="182" font-size="11" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">第 3 位，位权 1</text>
  <text x="412" y="182" font-size="11" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">+3</text>
  <text x="490" y="182" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9999</text>

  <rect x="40" y="208" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="85" y="238" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9999</text>
  <text x="200" y="238" font-size="11" fill="#444" text-anchor="middle" filter="url(#rough2)">9 9 9 9</text>
  <text x="330" y="238" font-size="11" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">不存在</text>
  <text x="412" y="238" font-size="11" fill="#8a6a20" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="490" y="238" font-size="13" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">9999</text>

  <text x="280" y="282" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">对比一下 9669 的全部四种可能翻转，只有把最左边的 6 改 9 才是最大值：</text>

  <g font-size="10.5" text-anchor="middle">
    <rect x="52" y="296" width="102" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
    <text x="103" y="314" fill="#8a3a36" filter="url(#rough2)">改第 0 位</text>
    <text x="103" y="330" fill="#8a3a36" filter="url(#rough2)">6669（−300）</text>

    <rect x="166" y="296" width="102" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
    <text x="217" y="314" fill="#3a5a30" filter="url(#rough2)">改第 1 位 ✓</text>
    <text x="217" y="330" fill="#3a5a30" filter="url(#rough2)">9969（+300）</text>

    <rect x="280" y="296" width="102" height="42" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
    <text x="331" y="314" fill="#555" filter="url(#rough2)">改第 2 位</text>
    <text x="331" y="330" fill="#555" filter="url(#rough2)">9699（+30）</text>

    <rect x="394" y="296" width="102" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
    <text x="445" y="314" fill="#8a3a36" filter="url(#rough2)">改第 3 位</text>
    <text x="445" y="330" fill="#8a3a36" filter="url(#rough2)">9666（−3）</text>
  </g>

  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">绿色一格就是贪心选中的位置：位权最大的那个 6，收益 300 远超 30、3</text>
</svg>
