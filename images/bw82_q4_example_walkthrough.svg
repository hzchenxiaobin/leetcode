<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：nums = [6,5,6,5,8]，threshold = 7 → 返回 1</text>

  <!-- 数组与窗口 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <rect x="90" y="70" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="112" y="94">6</text>
    <rect x="134" y="78" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="156" y="102">5</text>
    <rect x="178" y="70" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="200" y="94">6</text>
    <rect x="222" y="78" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="244" y="102">5</text>
    <rect x="266" y="58" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="288" y="82" font-weight="bold">8</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#888" text-anchor="middle">
    <text x="112" y="126">i=0</text>
    <text x="156" y="126">i=1</text>
    <text x="200" y="126">i=2</text>
    <text x="244" y="126">i=3</text>
    <text x="288" y="126">i=4</text>
  </g>

  <!-- 各极大窗口 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <rect x="36" y="146" width="488" height="110" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="8"/>
    <text x="60" y="170">i=0（值 6）：左边界 −1，右边界 1（第一个更小的 5）→ len 1 → 6×1 = 6 &gt; 7 ? ✗</text>
    <text x="60" y="194">i=1（值 5）：左 −1，右 5 → len 5 → 5×5 = 25 &gt; 7 ✓（对应 [6,5,6,5,8]）</text>
    <text x="60" y="218">i=2（值 6）：左 1，右 3 → len 1 → 6×1 = 6 &gt; 7 ? ✗</text>
    <text x="60" y="242">i=3（值 5）：左 −1，右 5 → len 5 → 25 &gt; 7 ✓　　i=4（值 8）：左 3，右 5 → len 1 → 8×1 = 8 &gt; 7 ✓</text>
  </g>

  <!-- 多解说明 -->
  <g filter="url(#rough2)">
    <rect x="36" y="272" width="488" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333">
    <text x="280" y="294" text-anchor="middle">本题判题器接受任意合法长度：1、2、3、4、5 都会被接受</text>
    <text x="280" y="316" text-anchor="middle">本文代码按 i 从左到右扫描，i=1 时先命中 25 &gt; 7 → 返回 len = 5；</text>
    <text x="280" y="336" text-anchor="middle">（官方示例解释给出 1，因 [8] 单独成段也合法 —— 两种返回都对）</text>
  </g>
  <text x="280" y="362" font-size="12" fill="#888" filter="url(#rough2)" text-anchor="middle">注意不等号是严格大于：threshold 恰好整除时（如 6/3=2 且 min=2）不算「大于」</text>
</svg>
