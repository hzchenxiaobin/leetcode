<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="660" height="350" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="19" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "())" 与 s = "((("</text>
  <text x="110" y="66" text-anchor="start" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">情形一：s = "())"</text>
  <rect x="60" y="78" width="110" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="95.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">字符</text>
  <rect x="170" y="78" width="120" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230.0" y="95.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">open</text>
  <rect x="290" y="78" width="140" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360.0" y="95.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">needRight</text>
  <rect x="430" y="78" width="160" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510.0" y="95.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">累计答案中点</text>
  <rect x="60" y="106" width="110" height="28" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="123.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(</text>
  <rect x="170" y="106" width="120" height="28" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230.0" y="123.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="290" y="106" width="140" height="28" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360.0" y="123.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="430" y="106" width="160" height="28" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510.0" y="123.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">—</text>
  <rect x="60" y="134" width="110" height="28" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="151.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">)</text>
  <rect x="170" y="134" width="120" height="28" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230.0" y="151.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="290" y="134" width="140" height="28" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360.0" y="151.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="430" y="134" width="160" height="28" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510.0" y="151.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">—</text>
  <rect x="60" y="162" width="110" height="28" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="179.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">)</text>
  <rect x="170" y="162" width="120" height="28" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230.0" y="179.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="290" y="162" width="140" height="28" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360.0" y="179.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="430" y="162" width="160" height="28" rx="4" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510.0" y="179.8" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">needRight=1</text>
  <text x="60" y="250" text-anchor="start" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">情形二：s = "((("</text>
  <rect x="60" y="262" width="150" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135.0" y="283.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">open = 3</text>
  <rect x="230" y="262" width="150" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="305.0" y="283.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">needRight = 0</text>
  <rect x="400" y="262" width="170" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485.0" y="283.2" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">答案 = 0 + 3 = 3</text>
  <text x="330" y="330" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">两种情况正好覆盖「左端缺 (」与「右端缺 )」两类失衡</text>
</svg>
