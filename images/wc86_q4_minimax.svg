<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">极小化极大：选「最坏组最小」的词去猜</text>

  <!-- 方案 A -->
  <g filter="url(#rough2)">
    <text x="150" y="60" text-anchor="middle" font-size="13" fill="#333">猜 w₁：分组很不均</text>
    <rect x="60" y="72" width="180" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="150" y="89" text-anchor="middle" font-size="11" fill="#8a3020">r=0 组 40 个（最坏）</text>
    <rect x="60" y="102" width="120" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="120" y="119" text-anchor="middle" font-size="11" fill="#2f4a66">r=1 组 20</text>
    <rect x="60" y="132" width="70" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="95" y="149" text-anchor="middle" font-size="11" fill="#2f5527">其余 39</text>
    <text x="150" y="178" text-anchor="middle" font-size="12" fill="#b85450">最坏情况剩 40 个 ✗</text>
  </g>

  <!-- 方案 B -->
  <g filter="url(#rough2)">
    <text x="370" y="60" text-anchor="middle" font-size="13" fill="#333">猜 w₂：分组均匀</text>
    <rect x="280" y="72" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="310" y="89" text-anchor="middle" font-size="11" fill="#2f5527">14</text>
    <rect x="346" y="72" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="376" y="89" text-anchor="middle" font-size="11" fill="#2f5527">15</text>
    <rect x="412" y="72" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="442" y="89" text-anchor="middle" font-size="11" fill="#2f5527">14</text>
    <rect x="280" y="102" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="310" y="119" text-anchor="middle" font-size="11" fill="#2f5527">13</text>
    <rect x="346" y="102" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="376" y="119" text-anchor="middle" font-size="11" fill="#2f5527">15</text>
    <rect x="412" y="102" width="60" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="442" y="119" text-anchor="middle" font-size="11" fill="#2f5527">14</text>
    <rect x="280" y="132" width="192" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="376" y="149" text-anchor="middle" font-size="11" fill="#7a5a10">r=6：w₂ 自己（猜中直接结束）</text>
    <text x="370" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a">最坏情况只剩 15 个 ✓</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="200" width="380" height="80" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="224" text-anchor="middle" font-size="12" fill="#2f4a66">给每个候选 w 算一个「代价」：</text>
    <text x="260" y="246" text-anchor="middle" font-size="12" fill="#2f4a66">worst(w) = max{ 与 w 匹配 r 位的候选个数 : r = 0..6 }</text>
    <text x="260" y="268" text-anchor="middle" font-size="12" fill="#8a3020">选 worst(w) 最小的 w（minimax）→ 最坏情况下剩得最少</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="296" width="380" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="320" text-anchor="middle" font-size="12" fill="#7a5a10">示例 1 中四词两两匹配数为 {3,2,4}，任何选择 worst 都是 1</text>
    <text x="260" y="342" text-anchor="middle" font-size="12" fill="#4a7a3a">于是第一次就猜中 "acckzz"，1 次结束</text>
  </g>
</svg>
