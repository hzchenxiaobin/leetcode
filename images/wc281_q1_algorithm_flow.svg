<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：签到走模拟，进阶走配对 O(1)</text>
  <path d="M 140 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Start node -->
  <rect x="250" y="50" width="140" height="34" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="71" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">输入 num ≤ 1000</text>

  <!-- Decision diamond -->
  <polygon points="320,100 400,126 320,152 240,126" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="122" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">选哪条路？</text>
  <text x="320" y="137" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">两条都正确</text>

  <path d="M280,100 L200,116" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M360,100 L440,116" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="225" y="102" font-size="10.5" fill="#666" filter="url(#rough2)">求稳</text>
  <text x="398" y="102" font-size="10.5" fill="#666" filter="url(#rough2)">秀操作</text>

  <!-- Path A: simulation -->
  <rect x="30" y="120" width="230" height="196" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">方案 A：直接模拟（签到）</text>
  <rect x="46" y="156" width="198" height="30" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="145" y="175" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans = 0，枚举 i = 1 … num</text>
  <rect x="46" y="194" width="198" height="30" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="145" y="213" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">取模拆位求 ds(i)：j%10 累加</text>
  <rect x="46" y="232" width="198" height="30" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="145" y="251" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ds(i) 为偶 → ans++</text>
  <rect x="46" y="270" width="198" height="30" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="145" y="289" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">返回 ans</text>
  <text x="145" y="312" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">时间 O(num × d)，d ≤ 4，稳过</text>

  <!-- Path B: O(1) -->
  <rect x="380" y="120" width="230" height="196" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="495" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">方案 B：配对 O(1)（进阶）</text>
  <rect x="396" y="156" width="198" height="30" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="495" y="175" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">求 s = ds(num)（只需 num 自己）</text>
  <polygon points="495,196 583,216 495,236 407,216" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="495" y="220" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">num 偶 且 s 奇？</text>
  <text x="420" y="208" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <text x="556" y="208" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="396" y="244" width="92" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="442" y="263" text-anchor="middle" font-size="10.5" fill="#a04040" filter="url(#rough2)">ans=num/2−1</text>
  <rect x="502" y="244" width="92" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="548" y="263" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">ans=num/2</text>
  <text x="495" y="296" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">（num 为奇时修正项恒为 0）</text>

  <!-- Merge -->
  <path d="M145,316 L280,340" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M495,316 L360,340" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <rect x="230" y="344" width="180" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">返回 ans ✓</text>

  <!-- Bottom note -->
  <rect x="30" y="392" width="580" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="409" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">赛时建议：先交方案 A 保底 AC，再回头推方案 B 当作赛后加餐</text>
</svg>
