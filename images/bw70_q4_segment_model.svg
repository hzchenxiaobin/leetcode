<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">座位定段：从左往右每遇到两个 S 切出一段</text>

  <!-- 走廊示意 corridor = SSPPSPS -->
  <g filter="url(#rough2)" font-size="13" fill="#666">
    <text x="40" y="72">corridor：</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="120" y="50" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="168" y="50" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="216" y="50" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="264" y="50" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="312" y="50" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="360" y="50" width="48" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="408" y="50" width="48" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="15" fill="#333" text-anchor="middle">
    <text x="144" y="77">S</text>
    <text x="192" y="77">S</text>
    <text x="240" y="77">P</text>
    <text x="288" y="77">P</text>
    <text x="336" y="77">S</text>
    <text x="384" y="77">P</text>
    <text x="432" y="77">S</text>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#999" text-anchor="middle">
    <text x="144" y="104">0</text>
    <text x="192" y="104">1</text>
    <text x="240" y="104">2</text>
    <text x="288" y="104">3</text>
    <text x="336" y="104">4</text>
    <text x="384" y="104">5</text>
    <text x="432" y="104">6</text>
  </g>

  <!-- 段括线 -->
  <g filter="url(#rough2)" fill="none" stroke="#b85450" stroke-width="2.2">
    <path d="M 120 118 L 120 130 L 216 130 L 216 118"/>
    <path d="M 312 118 L 312 130 L 456 130 L 456 118"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#b85450" text-anchor="middle">
    <text x="168" y="150">第 1 段：座位 0、1</text>
    <text x="384" y="150">第 2 段：座位 4、6（中间夹植物）</text>
  </g>

  <!-- 已有屏风 -->
  <g filter="url(#rough2)">
    <path d="M 114 44 L 114 100" stroke="#333" stroke-width="4"/>
    <path d="M 462 44 L 462 100" stroke="#333" stroke-width="4"/>
  </g>
  <text x="114" y="36" font-size="11" fill="#333" filter="url(#rough2)" text-anchor="middle">固有屏风</text>
  <text x="462" y="36" font-size="11" fill="#333" filter="url(#rough2)" text-anchor="middle">固有屏风</text>

  <!-- 底部结论 -->
  <g filter="url(#rough2)">
    <rect x="40" y="180" width="480" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="206">段的边界由"第奇数个 S"与"下一个 S"确定：座位下标 0,1,4,6</text>
    <text x="280" y="228">两段之间（下标 1 与 4 之间）必须再放恰一个屏风来分隔</text>
  </g>

  <!-- 无解情况 -->
  <g filter="url(#rough2)">
    <rect x="40" y="256" width="480" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="12.5" fill="#333" text-anchor="middle">
    <text x="280" y="280">座位数为 0：无需分段，但"每段恰两座"无从谈起 → 0 种</text>
    <text x="280" y="302">座位数为奇数：最后一段只有 1 个座位，永远不合法 → 0 种</text>
  </g>
</svg>
