<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="660" height="440" fill="#fdfcf7"/>
  <text x="330" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">算法流程：一趟计数 → 按败场分桶 → 排序输出</text>
  <path d="M 180 36 Q 330 44 480 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- counting loop -->
  <g filter="url(#sk)">
    <rect x="30" y="52" width="86" height="34" rx="16" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="73" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">开始</text>
  <g filter="url(#sk)">
    <rect x="140" y="52" width="126" height="34" rx="8" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="203" y="74" text-anchor="middle" font-size="12.5" fill="#2b6e9e">取下一场 [w, l]</text>
  <g filter="url(#sk)">
    <polygon points="350,41 418,69 350,97 282,69" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="350" y="73" text-anchor="middle" font-size="12" fill="#2b6e9e">还有比赛？</text>
  <path d="M 116 69 L 136 69" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 266 69 L 279 69" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 418 69 L 446 69" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="432" y="60" text-anchor="middle" font-size="11" fill="#888">是</text>
  <g filter="url(#sk)">
    <rect x="450" y="46" width="178" height="34" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="539" y="68" text-anchor="middle" font-size="12" fill="#2e6e2e">loss[w] 不存在则置 0</text>
  <path d="M 539 80 L 539 94" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="450" y="98" width="178" height="34" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="539" y="120" text-anchor="middle" font-size="12" fill="#7a5415">loss[l] += 1（败场 +1）</text>
  <path d="M 539 132 L 539 156 L 203 156 L 203 92" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="372" y="150" text-anchor="middle" font-size="11" fill="#888">重复 n 次</text>

  <!-- scan table -->
  <path d="M 350 97 L 350 176" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="358" y="118" text-anchor="start" font-size="10.5" fill="#888">否（计数完成）</text>
  <g filter="url(#sk)">
    <rect x="275" y="178" width="150" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="350" y="200" text-anchor="middle" font-size="12.5" fill="#2b6e9e">扫描表项 (p, c)</text>
  <path d="M 350 212 L 350 228" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <polygon points="350,228 416,256 350,284 284,256" fill="#fffdf3" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="350" y="260" text-anchor="middle" font-size="12" fill="#2b6e9e">败场 c = ?</text>

  <!-- three branches -->
  <path d="M 283 256 L 243 256" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="55" y="238" width="185" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="147" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">c = 0 → 入 answer[0]</text>
  <path d="M 417 256 L 436 256" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="440" y="238" width="185" height="36" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="532" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">c = 1 → 入 answer[1]</text>
  <path d="M 350 284 L 350 302" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="275" y="306" width="150" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="350" y="327" text-anchor="middle" font-size="12.5" fill="#a03a36">c ≥ 2 → 丢弃</text>

  <!-- final -->
  <path d="M 147 274 L 147 400 L 226 400" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 532 274 L 532 400 L 484 400" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="230" y="382" width="250" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="355" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">两列表升序排序后返回</text>
</svg>
