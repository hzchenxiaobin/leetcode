<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>
  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#r)">示例演算：word = "dabdcbdcdcd"，k = 2</text>
  <text x="340" y="52" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#r)">频率 a:1、b:2、c:3、d:5 → 升序 a = [1, 2, 3, 5]，前缀和 pre = [0, 1, 3, 6, 11]</text>

  <!-- table header -->
  <g stroke-width="1.8" filter="url(#r)">
    <rect x="35" y="76" width="70" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="105" y="76" width="115" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="220" y="76" width="170" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="390" y="76" width="170" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="560" y="76" width="85" height="40" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#2b4a6e" filter="url(#r)">
    <text x="70" y="100">L</text>
    <text x="162" y="100">窗口 [L, L+k]</text>
    <text x="305" y="100">f &lt; L → 全删</text>
    <text x="475" y="100">f &gt; L+k → 削顶</text>
    <text x="602" y="100">cost</text>
  </g>

  <!-- row 1: L=1 (optimal, green) -->
  <g stroke-width="1.8" filter="url(#r)">
    <rect x="35" y="116" width="70" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="105" y="116" width="115" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="220" y="116" width="170" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="390" y="116" width="170" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="560" y="116" width="85" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#r)">
    <text x="70" y="143">1</text>
    <text x="162" y="143">[1, 3]</text>
    <text x="305" y="143">—（无）</text>
    <text x="475" y="143">d: 5→3，删 2</text>
    <text x="602" y="143" font-weight="bold" fill="#8c3a34">2 ✓</text>
  </g>

  <!-- row 2: L=2 (optimal, green) -->
  <g stroke-width="1.8" filter="url(#r)">
    <rect x="35" y="160" width="70" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="105" y="160" width="115" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="220" y="160" width="170" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="390" y="160" width="170" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="560" y="160" width="85" height="44" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#r)">
    <text x="70" y="187">2</text>
    <text x="162" y="187">[2, 4]</text>
    <text x="305" y="187">a: 1</text>
    <text x="475" y="187">d: 5→4，删 1</text>
    <text x="602" y="187" font-weight="bold" fill="#8c3a34">2 ✓</text>
  </g>

  <!-- row 3: L=3 -->
  <g stroke-width="1.6" filter="url(#r)">
    <rect x="35" y="204" width="70" height="44" rx="3" fill="#fdfdfd" stroke="#9a9a9a"/>
    <rect x="105" y="204" width="115" height="44" rx="3" fill="#fdfdfd" stroke="#9a9a9a"/>
    <rect x="220" y="204" width="170" height="44" rx="3" fill="#fdfdfd" stroke="#9a9a9a"/>
    <rect x="390" y="204" width="170" height="44" rx="3" fill="#fdfdfd" stroke="#9a9a9a"/>
    <rect x="560" y="204" width="85" height="44" rx="3" fill="#fdfdfd" stroke="#9a9a9a"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#r)">
    <text x="70" y="231">3</text>
    <text x="162" y="231">[3, 5]</text>
    <text x="305" y="231">a+b: 1+2 = 3</text>
    <text x="475" y="231">—（无）</text>
    <text x="602" y="231">3</text>
  </g>

  <!-- row 4: L=5 -->
  <g stroke-width="1.6" filter="url(#r)">
    <rect x="35" y="248" width="70" height="44" rx="3" fill="#fdfdfd" stroke="#9a9a9a"/>
    <rect x="105" y="248" width="115" height="44" rx="3" fill="#fdfdfd" stroke="#9a9a9a"/>
    <rect x="220" y="248" width="170" height="44" rx="3" fill="#fdfdfd" stroke="#9a9a9a"/>
    <rect x="390" y="248" width="170" height="44" rx="3" fill="#fdfdfd" stroke="#9a9a9a"/>
    <rect x="560" y="248" width="85" height="44" rx="3" fill="#fdfdfd" stroke="#9a9a9a"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#r)">
    <text x="70" y="275">5</text>
    <text x="162" y="275">[5, 7]</text>
    <text x="305" y="275">a+b+c: 1+2+3 = 6</text>
    <text x="475" y="275">—（无）</text>
    <text x="602" y="275">6</text>
  </g>

  <!-- conclusion -->
  <rect x="35" y="312" width="610" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#r)"/>
  <g text-anchor="middle" filter="url(#r)">
    <text x="340" y="338" font-size="12.5" font-weight="bold" fill="#7a5a20">答案 = min cost = 2：删 1 个 'a' + 1 个 'd'</text>
    <text x="340" y="362" font-size="12" fill="#555">剩余频率 b:2、c:3、d:4，极差 4 − 2 = 2 ≤ k ✓</text>
  </g>
</svg>
