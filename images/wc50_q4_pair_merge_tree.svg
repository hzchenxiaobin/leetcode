<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="440" fill="#fafafa"/>

  <text x="350" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：表达式 = 四叶二叉树，必然存在一对「兄弟叶子」</text>

  <!-- 树的连线 -->
  <path d="M 195 128 L 112 182" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 195 128 L 283 182" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 105 218 L 62 272" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 118 218 L 158 272" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 278 218 L 242 272" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 292 218 L 338 272" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- 兄弟叶子高亮 -->
  <ellipse cx="110" cy="296" rx="78" ry="37" fill="none" stroke="#d6a040" stroke-width="2"
           stroke-dasharray="7 5" filter="url(#rough2)"/>
  <ellipse cx="290" cy="296" rx="78" ry="37" fill="none" stroke="#d6a040" stroke-width="2"
           stroke-dasharray="7 5" filter="url(#rough2)"/>

  <!-- 内部结点 -->
  <circle cx="195" cy="110" r="23" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="195" y="117" text-anchor="middle" font-size="17" fill="#a8761f" filter="url(#rough2)">×</text>
  <circle cx="108" cy="200" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="108" y="207" text-anchor="middle" font-size="16" fill="#3a4a66" filter="url(#rough2)">−</text>
  <circle cx="288" cy="200" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="288" y="207" text-anchor="middle" font-size="16" fill="#3a4a66" filter="url(#rough2)">−</text>

  <!-- 中间值标签 -->
  <rect x="228" y="88" width="60" height="23" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="7" filter="url(#rough2)"/>
  <text x="258" y="104" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">= 24 ✓</text>
  <rect x="24" y="188" width="62" height="23" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="7" filter="url(#rough2)"/>
  <text x="55" y="204" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">8−4 = 4</text>
  <rect x="314" y="188" width="62" height="23" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="7" filter="url(#rough2)"/>
  <text x="345" y="204" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">7−1 = 6</text>

  <!-- 叶子卡片 -->
  <rect x="38" y="273" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="61" y="296" text-anchor="middle" font-size="14" fill="#8a5a10" filter="url(#rough2)">8</text>
  <rect x="137" y="273" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="160" y="296" text-anchor="middle" font-size="14" fill="#8a5a10" filter="url(#rough2)">4</text>
  <rect x="217" y="273" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="240" y="296" text-anchor="middle" font-size="14" fill="#8a5a10" filter="url(#rough2)">7</text>
  <rect x="317" y="273" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="340" y="296" text-anchor="middle" font-size="14" fill="#8a5a10" filter="url(#rough2)">1</text>

  <text x="110" y="346" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">兄弟叶子：被同一次运算合并</text>

  <!-- 右侧要点框 -->
  <rect x="392" y="66" width="292" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="406" y="88" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 每个合法表达式 ↔ 一棵二叉树</text>
  <text x="406" y="108" font-size="10.5" fill="#555" filter="url(#rough2)">4 张牌是叶子，3 次运算 = 3 个内部结点</text>
  <text x="406" y="124" font-size="10.5" fill="#555" filter="url(#rough2)">括号与运算顺序完全由树形决定</text>

  <rect x="392" y="146" width="292" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="406" y="168" font-size="11" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">② 取「最深的内部结点」</text>
  <text x="406" y="188" font-size="10.5" fill="#555" filter="url(#rough2)">它的两个孩子不可能是内部结点，</text>
  <text x="406" y="204" font-size="10.5" fill="#555" filter="url(#rough2)">所以必定是一对数被直接合并 ⇒ 归并可行</text>

  <rect x="392" y="226" width="292" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="406" y="248" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">③ 于是可以自底向上「二合一」</text>
  <text x="406" y="268" font-size="10.5" fill="#555" filter="url(#rough2)">4 → 3 → 2 → 1 张牌，每层只枚举</text>
  <text x="406" y="284" font-size="10.5" fill="#555" filter="url(#rough2)">C(m,2) 对 × 6 种运算，共 3888 个叶子</text>

  <text x="406" y="316" font-size="10" fill="#999" filter="url(#rough2)">不需要枚举括号，也不需要字符串拼接</text>

  <!-- 六种运算 -->
  <rect x="24" y="364" width="652" height="60" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="40" y="386" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">六种合并方式（减法、除法必须双向，否则漏解）：</text>
  <text x="40" y="410" font-size="12" fill="#444" filter="url(#rough2)">a + b        a − b        b − a        a × b        a ÷ b        b ÷ a</text>
</svg>
