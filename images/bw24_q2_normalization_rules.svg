<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="560" height="330" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">归一化规则：任意表示改写成齐肯多夫形式，项数不增</text>

  <!-- R1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="160" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="13" filter="url(#rough2)">
    <text x="120" y="86" fill="#446688" font-weight="bold">R1 两个 1</text>
    <text x="120" y="112">1 + 1 → 2</text>
    <text x="120" y="134" fill="#4a7a3a" font-size="11.5">项数 2 → 1（减一）</text>
  </g>

  <!-- R2 -->
  <g filter="url(#rough2)">
    <rect x="220" y="60" width="160" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="13" filter="url(#rough2)">
    <text x="300" y="86" fill="#4a7a3a" font-weight="bold">R2 相邻和</text>
    <text x="300" y="112">F(i) + F(i+1) → F(i+2)</text>
    <text x="300" y="134" fill="#4a7a3a" font-size="11.5">项数 2 → 1（减一）</text>
  </g>

  <!-- R3 -->
  <g filter="url(#rough2)">
    <rect x="400" y="60" width="130" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g text-anchor="middle" font-size="13" filter="url(#rough2)">
    <text x="465" y="86" fill="#8a6d1a" font-weight="bold">R3 相等对</text>
    <text x="465" y="112">F(i) + F(i) → F(i+1) + F(i−2)</text>
    <text x="465" y="134" fill="#8a6d1a" font-size="11.5">项数不变</text>
  </g>

  <!-- 归一化示例：19 = 8+8+3 -->
  <text x="280" y="180" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">改写示例：19 = 8 + 8 + 3 的归一化过程</text>
  <g text-anchor="middle" font-size="12.5" filter="url(#rough2)">
    <rect x="60" y="196" width="200" height="40" rx="8" fill="#fff" stroke="#888" stroke-width="1.4"/>
    <text x="160" y="221">8 + 8 + 3（有相等对）</text>
  </g>
  <path d="M 264 216 L 292 216" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="204" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">R3</text>
  <g text-anchor="middle" font-size="12.5" filter="url(#rough2)">
    <rect x="296" y="196" width="180" height="40" rx="8" fill="#fff" stroke="#888" stroke-width="1.4"/>
    <text x="386" y="221">13 + 3 + 3（仍相等）</text>
  </g>
  <path d="M 480 216 L 508 216" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="494" y="204" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">R3</text>
  <g text-anchor="middle" font-size="12.5" filter="url(#rough2)">
    <rect x="90" y="256" width="180" height="40" rx="8" fill="#fff" stroke="#888" stroke-width="1.4"/>
    <text x="180" y="281">13 + 5 + 1（终止 ✓）</text>
  </g>
  <path d="M 512 240 C 500 268, 400 276, 276 276" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">R3 于 3+3</text>

  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">终止态无相等对、无相邻对 = 齐肯多夫形式 = 贪心输出（唯一性）</text>
</svg>
