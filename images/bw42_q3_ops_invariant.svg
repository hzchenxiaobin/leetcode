<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">两种操作：00→10 左位变 1；10→01 让 0 左移</text>

  <!-- 操作 1 -->
  <g filter="url(#rough2)">
    <rect x="70" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="110" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" fill="#333" text-anchor="middle">
    <text x="90" y="88">0</text><text x="130" y="88">0</text>
  </g>
  <path d="M 160 82 L 210 82" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="185" y="72" font-size="11" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">操作 1</text>
  <g filter="url(#rough2)">
    <rect x="214" y="62" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4"/>
    <rect x="254" y="62" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <text x="234" y="88" fill="#2d5a22" font-weight="bold">1</text><text x="274" y="88" fill="#333">0</text>
  </g>
  <text x="175" y="122" font-size="12" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">两个 0 合并成一个：0 的个数 −1，1 的个数 +1</text>

  <!-- 操作 2 -->
  <g filter="url(#rough2)">
    <rect x="70" y="152" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="110" y="152" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <text x="90" y="178" fill="#2d5a22">1</text><text x="130" y="178" fill="#333">0</text>
  </g>
  <path d="M 160 172 L 210 172" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="185" y="162" font-size="11" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">操作 2</text>
  <g filter="url(#rough2)">
    <rect x="214" y="152" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="254" y="152" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="16" text-anchor="middle">
    <text x="234" y="178" fill="#333">0</text><text x="274" y="178" fill="#2d5a22">1</text>
  </g>
  <text x="175" y="212" font-size="12" fill="#d6a040" text-anchor="middle" filter="url(#rough2)">0 与左边相邻的 1 交换：0 向左穿过 1（数值变小）</text>

  <!-- 组合能力 -->
  <g filter="url(#rough2)">
    <rect x="60" y="240" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
  </g>
  <g filter="url(#rough2)" font-size="14" fill="#7a5c1e" text-anchor="middle">
    <text x="280" y="262">组合：0 先左移会师（操作 2），相邻后合并（操作 1）</text>
    <text x="280" y="286">任意两个 0 都能"合并"出一个 1——0 只会减少或右移</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="120" y="304" width="320" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>
  <text x="280" y="323" font-size="13" fill="#2d5a22" text-anchor="middle" filter="url(#rough2)">策略：把所有 0 赶到第一个 0 处合并，只留一个 0 且尽量靠右</text>
</svg>
