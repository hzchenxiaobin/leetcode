<svg xmlns="http://www.w3.org/2000/svg" width="940" height="630" viewBox="0 0 940 630" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="630" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 2 演算：S = (0,1) → T = (2,3)，正向 3 步 = 倒退 3 步</text>
  <path d="M 230 44 Q 470 52 710 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① 左侧：正向网格，原点 (170,460)，单位 55px -->
  <text x="280" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">① 正向：从 S 走 3 步到 T</text>

  <g filter="url(#sk)" stroke="#c9c9c9" stroke-width="1">
    <line x1="170" y1="240" x2="170" y2="460"/>
    <line x1="225" y1="240" x2="225" y2="460"/>
    <line x1="280" y1="240" x2="280" y2="460"/>
    <line x1="335" y1="240" x2="335" y2="460"/>
    <line x1="390" y1="240" x2="390" y2="460"/>
    <line x1="170" y1="240" x2="390" y2="240"/>
    <line x1="170" y1="295" x2="390" y2="295"/>
    <line x1="170" y1="350" x2="390" y2="350"/>
    <line x1="170" y1="405" x2="390" y2="405"/>
  </g>
  <g filter="url(#sk)">
    <line x1="150" y1="460" x2="404" y2="460" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ar)"/>
    <line x1="170" y1="484" x2="170" y2="226" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="414" y="466" font-size="13" fill="#555" filter="url(#sk)">x</text>
  <text x="180" y="232" font-size="13" fill="#555" filter="url(#sk)">y</text>
  <g font-size="11" fill="#999" text-anchor="middle" filter="url(#sk)">
    <text x="170" y="478">0</text>
    <text x="225" y="478">1</text>
    <text x="280" y="478">2</text>
    <text x="335" y="478">3</text>
    <text x="390" y="478">4</text>
    <text x="152" y="464">0</text>
    <text x="152" y="409">1</text>
    <text x="152" y="354">2</text>
    <text x="152" y="299">3</text>
    <text x="152" y="244">4</text>
  </g>

  <!-- 正向箭头 -->
  <g filter="url(#sk)">
    <line x1="180" y1="392" x2="214" y2="392" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
    <line x1="235" y1="392" x2="269" y2="392" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
    <line x1="280" y1="396" x2="280" y2="308" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#ar)"/>
  </g>
  <text x="197" y="378" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">m=1, x+m</text>
  <text x="252" y="378" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#sk)">m=1, x+m</text>
  <text x="292" y="354" text-anchor="start" font-size="11.5" fill="#555" filter="url(#sk)">m=2, y+m</text>

  <!-- 正向点 -->
  <g filter="url(#sk)">
    <circle cx="170" cy="405" r="6" fill="#446688"/>
    <circle cx="225" cy="405" r="5" fill="#446688"/>
    <circle cx="280" cy="405" r="5" fill="#446688"/>
    <circle cx="280" cy="295" r="6.5" fill="#b85450"/>
  </g>
  <text x="170" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">(0,1) S</text>
  <text x="225" y="430" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">(1,1)</text>
  <text x="280" y="430" text-anchor="middle" font-size="12" fill="#666" filter="url(#sk)">(2,1)</text>
  <text x="280" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">(2,3) T</text>

  <text x="280" y="528" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#sk)">每步 m = max(x,y)，把 m 加到 x 或 y 上</text>

  <!-- ② 右侧：倒退链 -->
  <text x="700" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">② 倒退：从 T 走回 S</text>

  <g filter="url(#sk)">
    <rect x="652" y="140" width="96" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="700" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">(2,3)</text>
  <text x="700" y="178" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#sk)">T · 步 0</text>

  <g filter="url(#sk)">
    <line x1="700" y1="186" x2="700" y2="214" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="712" y="206" text-anchor="start" font-size="11.5" fill="#555" filter="url(#sk)">x &lt; y &lt; 2x：y −= x（3−2）</text>

  <g filter="url(#sk)">
    <rect x="652" y="218" width="96" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="700" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">(2,1)</text>
  <text x="700" y="256" text-anchor="middle" font-size="10.5" fill="#2b4a6e" filter="url(#sk)">步 1</text>

  <g filter="url(#sk)">
    <line x1="700" y1="264" x2="700" y2="292" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="712" y="284" text-anchor="start" font-size="11.5" fill="#555" filter="url(#sk)">x = 2y：x ÷ 2</text>

  <g filter="url(#sk)">
    <rect x="652" y="296" width="96" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="700" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a" filter="url(#sk)">(1,1)</text>
  <text x="700" y="334" text-anchor="middle" font-size="10.5" fill="#8a6a1a" filter="url(#sk)">步 2 · 对角线！</text>

  <g filter="url(#sk)">
    <path d="M 672 342 Q 622 364 598 380" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 728 342 Q 778 364 802 380" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="700" y="368" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#sk)">两个前驱</text>

  <g filter="url(#sk)">
    <rect x="548" y="384" width="96" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="596" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">(1,0)</text>
  <text x="596" y="422" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#sk)">步 3</text>

  <g filter="url(#sk)">
    <rect x="756" y="384" width="96" height="46" rx="8" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <text x="804" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a" filter="url(#sk)">(0,1)</text>
  <text x="804" y="422" text-anchor="middle" font-size="10.5" fill="#8a6a1a" filter="url(#sk)">步 3 ★ = S</text>
  <text x="804" y="454" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a1a" filter="url(#sk)">撞上 S！</text>

  <!-- 结论框 -->
  <g filter="url(#sk)">
    <rect x="545" y="486" width="380" height="68" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="735" y="512" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">倒退 3 步遇到 S ⇒ 答案 = 3 ✓</text>
  <text x="735" y="536" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#sk)">（主干 2 步 + 对角线分叉 1 步）</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="60" y="576" width="820" height="40" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="470" y="601" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#sk)">💡 倒退的每一步恰好是正向一步的逆操作，所以「倒退树上的距离」就是「最少移动次数」</text>
</svg>
