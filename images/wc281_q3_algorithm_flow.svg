<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="620" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：26 桶计数 + 从大到小双指针</text>
  <path d="M 100 34 Q 280 42 460 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Start -->
  <rect x="150" y="44" width="260" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">统计 cnt[26]</text>
  <text x="280" y="82" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">i ← 从 'z' 下移到首个 cnt 大于 0 的桶</text>

  <path d="M280,92 L280,116" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step A -->
  <rect x="100" y="118" width="360" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">连放 k = min(cnt[i], L) 个字母 i</text>
  <text x="280" y="158" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">cnt[i] 减 k，k 个 i 追加到 ans 尾部</text>

  <path d="M280,172 L280,198" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1 -->
  <polygon points="280,200 396,246 280,292 164,246" fill="#fafafa" stroke="#8a6d1f" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="251" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">cnt[i] = 0 ?</text>

  <path d="M398,246 L414,246" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="238" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">是</text>

  <!-- Move i down -->
  <rect x="418" y="214" width="130" height="64" rx="8" fill="#f0f0f0" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="483" y="234" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i 下移到下一个</text>
  <text x="483" y="250" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">cnt 大于 0 的桶</text>
  <text x="483" y="266" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">(i 小于 0 → 返回)</text>

  <path d="M483,212 L483,145 L462,145" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M280,292 L280,318" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="310" font-size="10.5" fill="#666" filter="url(#rough2)">否</text>

  <!-- Decision 2 -->
  <polygon points="280,320 408,368 280,416 152,368" fill="#fafafa" stroke="#8a6d1f" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">存在次大 j ?</text>
  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">(j 小于 i 且 cnt[j] 大于 0)</text>

  <path d="M410,368 L496,368 L496,556 L372,556" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="360" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">无次大</text>

  <path d="M280,416 L280,442" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="434" font-size="10.5" fill="#666" filter="url(#rough2)">有</text>

  <!-- Separator step -->
  <rect x="100" y="444" width="360" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="466" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">垫 1 个次大 j：追加字母 j</text>
  <text x="280" y="484" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">cnt[j] 减 1（只垫一个，立即回头放 i）</text>

  <path d="M100,471 L58,471 L58,145 L96,145" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="190" y="528" width="180" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="550" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">返回 ans</text>
  <text x="280" y="568" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">（剩余字母丢弃）</text>
</svg>
