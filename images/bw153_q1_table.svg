<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">反转度：反转字母表位置 × 字符串位置</text>
  <text x="290" y="50" text-anchor="middle" font-size="11" fill="#888">两个位置都从 1 开始数，逐字符相乘再整体求和</text>

  <rect x="48" y="62" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="96" y="84" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">字符 c</text>
  <rect x="152" y="62" width="212" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="258" y="84" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">反转位置 rev = 26 − (c − 'a')</text>
  <rect x="372" y="62" width="104" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="424" y="84" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">字符串位置 i</text>
  <rect x="484" y="62" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="524" y="84" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">乘积</text>

  <rect x="48" y="100" width="96" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="122" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="152" y="100" width="212" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="122" text-anchor="middle" font-size="11.5" fill="#333">26 − 0 = 26（最大）</text>
  <rect x="372" y="100" width="104" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="424" y="122" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <rect x="484" y="100" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="524" y="122" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">26</text>

  <rect x="48" y="138" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="160" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="152" y="138" width="212" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="160" text-anchor="middle" font-size="11.5" fill="#333">26 − 1 = 25</text>
  <rect x="372" y="138" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="424" y="160" text-anchor="middle" font-size="11.5" fill="#333">2</text>
  <rect x="484" y="138" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="524" y="160" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">50</text>

  <rect x="48" y="176" width="96" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="198" text-anchor="middle" font-size="12" fill="#333">c</text>
  <rect x="152" y="176" width="212" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="198" text-anchor="middle" font-size="11.5" fill="#333">26 − 2 = 24</text>
  <rect x="372" y="176" width="104" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="424" y="198" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <rect x="484" y="176" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="524" y="198" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">72</text>

  <rect x="48" y="214" width="96" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="96" y="236" text-anchor="middle" font-size="12" fill="#888">⋯</text>
  <rect x="152" y="214" width="212" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="236" text-anchor="middle" font-size="11" fill="#888">字母越靠后，反转位置越小</text>
  <rect x="372" y="214" width="104" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="424" y="236" text-anchor="middle" font-size="12" fill="#888">⋯</text>
  <rect x="484" y="214" width="80" height="34" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="524" y="236" text-anchor="middle" font-size="12" fill="#888">⋯</text>

  <rect x="48" y="252" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="274" text-anchor="middle" font-size="12" fill="#333">z</text>
  <rect x="152" y="252" width="212" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="274" text-anchor="middle" font-size="11.5" fill="#333">26 − 25 = 1（最小）</text>
  <rect x="372" y="252" width="104" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="424" y="274" text-anchor="middle" font-size="11.5" fill="#333">n</text>
  <rect x="484" y="252" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="524" y="274" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">1 · n</text>

  <rect x="96" y="306" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="196" y="326" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">反转度 = Σ 乘积</text>
  <text x="196" y="343" text-anchor="middle" font-size="10.5" fill="#555">一次 O(n) 扫描即可</text>

  <path d="M 300 328 L 356 328" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="362" y="306" width="170" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="447" y="326" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">"abc"：26+50+72</text>
  <text x="447" y="343" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold">= 148</text>

  <text x="290" y="372" text-anchor="middle" font-size="10" fill="#999">值是字符独有的常数，位置是扫描时的下标，两者相乘后累加</text>
</svg>
