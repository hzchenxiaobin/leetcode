<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">示例演算：4 个 i 开头串的逐层分桶拆解</text>
  <text x="260" y="40" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">官方示例 1 的关键 4 个词；红 = 撞车、绿 = 本层定稿、橙 = 缩不短只好回退</text>

  <!-- 表头 -->
  <rect x="20" y="52" width="98" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="69" y="68" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">单词</text>
  <rect x="118" y="52" width="76" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="156" y="68" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">p = 1</text>
  <rect x="194" y="52" width="76" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="232" y="68" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">p = 2</text>
  <rect x="270" y="52" width="76" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="308" y="68" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">p = 3</text>
  <rect x="346" y="52" width="76" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="384" y="68" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">p = 4</text>
  <rect x="422" y="52" width="76" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="460" y="68" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">p = 5</text>

  <!-- internal -->
  <rect x="20" y="78" width="98" height="26" rx="4" fill="#f0f4ff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="69" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">internal</text>
  <rect x="118" y="78" width="76" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="156" y="95" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i6l</text>
  <rect x="194" y="78" width="76" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="232" y="95" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">in5l</text>
  <rect x="270" y="78" width="76" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="308" y="95" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">int4l</text>
  <rect x="346" y="78" width="76" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="384" y="95" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">inte3l</text>
  <rect x="422" y="78" width="76" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="460" y="95" text-anchor="middle" font-size="10" fill="#b27a10" filter="url(#rough2)">inter2l</text>

  <!-- interval -->
  <rect x="20" y="104" width="98" height="26" rx="4" fill="#f0f4ff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="69" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">interval</text>
  <rect x="118" y="104" width="76" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="156" y="121" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i6l</text>
  <rect x="194" y="104" width="76" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="232" y="121" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">in5l</text>
  <rect x="270" y="104" width="76" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="308" y="121" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">int4l</text>
  <rect x="346" y="104" width="76" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="384" y="121" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">inte3l</text>
  <rect x="422" y="104" width="76" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="460" y="121" text-anchor="middle" font-size="10" fill="#b27a10" filter="url(#rough2)">inter2l</text>

  <!-- intension -->
  <rect x="20" y="130" width="98" height="26" rx="4" fill="#f0f4ff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="69" y="147" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">intension</text>
  <rect x="118" y="130" width="76" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="156" y="147" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i7n</text>
  <rect x="194" y="130" width="76" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="232" y="147" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">in6n</text>
  <rect x="270" y="130" width="76" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="308" y="147" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">int5n</text>
  <rect x="346" y="130" width="76" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="384" y="147" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">inte4n</text>
  <rect x="422" y="130" width="76" height="26" rx="4" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="460" y="147" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>

  <!-- intrusion -->
  <rect x="20" y="156" width="98" height="26" rx="4" fill="#f0f4ff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="69" y="173" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">intrusion</text>
  <rect x="118" y="156" width="76" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="156" y="173" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i7n</text>
  <rect x="194" y="156" width="76" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="232" y="173" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">in6n</text>
  <rect x="270" y="156" width="76" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="308" y="173" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">int5n</text>
  <rect x="346" y="156" width="76" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="384" y="173" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">intr4n</text>
  <rect x="422" y="156" width="76" height="26" rx="4" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="460" y="173" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">—</text>

  <!-- 注解 -->
  <text x="20" y="200" font-size="9.5" fill="#2e6e2e" filter="url(#rough2)">▸ 第 4 层：intension / intrusion 的第 4 个字符 e、r 分叉 ⇒ 双双定稿，答案停在最浅唯一层</text>
  <text x="20" y="216" font-size="9.5" fill="#b85450" filter="url(#rough2)">▸ internal / interval 要到第 6 层才分叉（intern1l / interv1l），但长度 8 = 原长 ⇒ 保留原串</text>

  <!-- 其余 5 个词 -->
  <text x="20" y="240" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">其余 5 个词（第 1 层就是独苗，直接定稿）与最终输出</text>

  <rect x="28" y="248" width="88" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="265" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">l2e</text>
  <rect x="122" y="248" width="88" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="166" y="265" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">god</text>
  <rect x="216" y="248" width="88" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="265" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">internal</text>
  <rect x="310" y="248" width="88" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="354" y="265" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">me</text>
  <rect x="404" y="248" width="88" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="448" y="265" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">i6t</text>

  <rect x="28" y="280" width="88" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="297" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">interval</text>
  <rect x="122" y="280" width="88" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="166" y="297" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">inte4n</text>
  <rect x="216" y="280" width="88" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="297" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">f2e</text>
  <rect x="310" y="280" width="88" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="354" y="297" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">intr4n</text>
  <rect x="404" y="280" width="88" height="26" rx="6" fill="#f5f5f5" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="448" y="297" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">共 9 个</text>

  <!-- 结论 -->
  <rect x="20" y="322" width="480" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">全例最多只走到第 6 层，累计仅 25 次建串（9 + 12 + 4）</text>
  <text x="260" y="360" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">输出 ["l2e","god","internal","me","i6t","interval","inte4n","f2e","intr4n"] 与官方一致 ✓</text>
</svg>
