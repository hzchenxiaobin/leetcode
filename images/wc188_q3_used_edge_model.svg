<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：一条边走不走，只看它下面有没有苹果</text>
  <text x="320" y="52" text-anchor="middle" font-size="12" fill="#777" filter="url(#sk)">以 0 为根；边 (parent(u), u) 出现 ⟺ 子树 u 中至少有一个苹果</text>

  <path d="M 179 123 L 255 94" stroke="#4a7a3a" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <path d="M 295 85 L 365 84" stroke="#4a7a3a" stroke-width="2.6" fill="none" filter="url(#sk)"/>
  <path d="M 179 137 L 255 186" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>
  <path d="M 295 195 L 365 195" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6 4" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <circle cx="160" cy="130" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="275" cy="85" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="275" cy="195" r="18" fill="#eef0f2" stroke="#7a7a7a" stroke-width="1.6"/>
    <circle cx="385" cy="85" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="385" cy="195" r="18" fill="#eef0f2" stroke="#7a7a7a" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="160" y="135" fill="#2b4a6e">0</text>
    <text x="275" y="90" fill="#2e5a24">u</text>
    <text x="275" y="200" fill="#555">v</text>
    <text x="385" y="90" fill="#8f3830">a</text>
    <text x="385" y="200" fill="#555">b</text>
  </g>

  <g filter="url(#sk)">
    <circle cx="392" cy="63" r="5" fill="#b85450"/>
    <path d="M 392 58 C 396 52 401 52 403 54" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
  </g>
  <text x="404" y="60" font-size="11.5" fill="#8f3830" filter="url(#sk)">有苹果</text>

  <text x="196" y="106" font-size="11.5" fill="#2e5a24" font-weight="bold" filter="url(#sk)">走 2 次</text>
  <text x="300" y="76" font-size="11.5" fill="#2e5a24" font-weight="bold" filter="url(#sk)">走 2 次</text>
  <text x="196" y="164" font-size="11.5" fill="#777" filter="url(#sk)">不走</text>
  <text x="300" y="186" font-size="11.5" fill="#777" filter="url(#sk)">不走</text>

  <g filter="url(#sk)">
    <rect x="44" y="252" width="266" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="330" y="252" width="266" height="112" rx="10" fill="#eef0f2" stroke="#8a8a8a" stroke-width="1.6"/>
  </g>
  <g filter="url(#sk)" font-size="12">
    <text x="60" y="276" fill="#2e5a24" font-weight="bold">子树 u 含苹果（这里经 a）</text>
    <text x="60" y="298" fill="#3a6a34">必须下去再上来：往返各一次</text>
    <text x="60" y="320" fill="#3a6a34">边 (0,u)、(u,a) 各贡献 2 秒</text>
    <text x="60" y="346" fill="#2e5a24" font-weight="bold">→ 整条枝保留</text>

    <text x="346" y="276" fill="#555" font-weight="bold">子树 v 无苹果</text>
    <text x="346" y="298" fill="#666">整枝剪掉，一步都不用走</text>
    <text x="346" y="320" fill="#666">边 (0,v)、(v,b) 贡献 0 秒</text>
    <text x="346" y="346" fill="#555" font-weight="bold">→ 修剪是关键</text>
  </g>

  <text x="320" y="390" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold" filter="url(#sk)">每条有用的边恰好往返一次 ⇒ 答案 = 2 × 有用的边数</text>
</svg>
