<svg xmlns="http://www.w3.org/2000/svg" width="720" height="422" viewBox="0 0 720 422"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="422" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">核心结构：f 只有「0 块 + S + n」三段</text>
  <text x="360" y="52" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">把 0 放在中间，0 之后的集合 S 按升序摆放，mex 序列就只剩三段（图中 n = 9）</text>

  <text x="62" y="72" text-anchor="end" font-size="11" fill="#aaaaaa" filter="url(#rough2)">i</text>
  <text x="96" y="166" text-anchor="end" font-size="12.5" fill="#446688" filter="url(#rough2)">排列 p</text>
  <text x="96" y="188" text-anchor="end" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">mex f</text>

  <text x="104" y="70" text-anchor="middle" font-size="9.5" fill="#bbbbbb" filter="url(#rough2)">0</text>
  <text x="168" y="70" text-anchor="middle" font-size="9.5" fill="#bbbbbb" filter="url(#rough2)">1</text>
  <text x="232" y="70" text-anchor="middle" font-size="9.5" fill="#bbbbbb" filter="url(#rough2)">2</text>
  <text x="296" y="70" text-anchor="middle" font-size="9.5" fill="#bbbbbb" filter="url(#rough2)">3</text>
  <text x="360" y="70" text-anchor="middle" font-size="9.5" fill="#bbbbbb" filter="url(#rough2)">4</text>
  <text x="424" y="70" text-anchor="middle" font-size="9.5" fill="#bbbbbb" filter="url(#rough2)">5</text>
  <text x="488" y="70" text-anchor="middle" font-size="9.5" fill="#bbbbbb" filter="url(#rough2)">6</text>
  <text x="552" y="70" text-anchor="middle" font-size="9.5" fill="#bbbbbb" filter="url(#rough2)">7</text>
  <text x="616" y="70" text-anchor="middle" font-size="9.5" fill="#bbbbbb" filter="url(#rough2)">8</text>

  <rect x="76" y="78" width="56" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="103" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="140" y="78" width="56" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="103" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="204" y="78" width="56" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="103" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="268" y="78" width="56" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="296" y="103" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">6</text>
  <rect x="332" y="78" width="56" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="103" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">7</text>
  <rect x="396" y="78" width="56" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="103" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">8</text>
  <rect x="460" y="78" width="56" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="488" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d20" filter="url(#rough2)">0</text>
  <rect x="524" y="78" width="56" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="552" y="103" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="588" y="78" width="56" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="616" y="103" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">4</text>

  <path d="M 488 120 L 488 140" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#ar2)" filter="url(#rough2)"/>
  <text x="500" y="136" text-anchor="start" font-size="9.5" fill="#b85450" filter="url(#rough2)">0 出现的位置</text>

  <rect x="76" y="146" width="56" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="104" y="171" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="140" y="146" width="56" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="168" y="171" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="204" y="146" width="56" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="232" y="171" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="268" y="146" width="56" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="296" y="171" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="332" y="146" width="56" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="171" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="396" y="146" width="56" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="424" y="171" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="460" y="146" width="56" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="488" y="171" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="524" y="146" width="56" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="552" y="171" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <rect x="588" y="146" width="56" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="616" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d20" filter="url(#rough2)">9</text>

  <path d="M 76 194 L 452 194" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 76 188 L 76 200" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 452 188 L 452 200" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="264" y="214" text-anchor="middle" font-size="11" fill="#446688"
        filter="url(#rough2)">① 0 块：0 还没出现 ⇒ mex = 0（异或贡献 0）</text>

  <path d="M 460 194 L 580 194" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 460 188 L 460 200" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 580 188 L 580 200" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="520" y="214" text-anchor="middle" font-size="9.5" fill="#4a7a3a"
        filter="url(#rough2)">② S 升序（mex = 1, 4）</text>

  <path d="M 588 194 L 644 194" stroke="#d6a040" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 588 188 L 588 200" stroke="#d6a040" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 644 188 L 644 200" stroke="#d6a040" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="616" y="232" text-anchor="middle" font-size="9.5" fill="#8a6d20"
        filter="url(#rough2)">③ n</text>

  <text x="360" y="240" text-anchor="middle" font-size="11.5" fill="#2b2b2b"
        filter="url(#rough2)">f 的取值多重集 =「0 重复 n − 1 − |S| 次」+ S 的每个元素各一次 + 一个 n</text>

  <rect x="64" y="252" width="592" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d20"
        filter="url(#rough2)">X = f(0)⊕f(1)⊕…⊕f(8) = 0⊕…⊕0 ⊕ 1 ⊕ 4 ⊕ 9 = 9 ⊕ 5 = 12</text>
  <text x="360" y="296" text-anchor="middle" font-size="11" fill="#2b2b2b"
        filter="url(#rough2)">这里 S = {1, 4}，xor(S) = 1⊕4 = 5，于是 X = n ⊕ xor(S) = 9 ⊕ 5 = 12</text>

  <rect x="64" y="320" width="592" height="54" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="342" text-anchor="middle" font-size="12" fill="#4a7a3a"
        filter="url(#rough2)">S 可以是 {1,…,n−1} 的任意子集（其余值随便排在 0 前面），于是</text>
  <text x="360" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a"
        filter="url(#rough2)">可达的 k 恰为 n ⊕ xor(S)，S ⊆ {1,…,n−1}，即 n ⊕ [0, B−1]</text>

  <text x="360" y="396" text-anchor="middle" font-size="10.5" fill="#b85450"
        filter="url(#rough2)">B = 最小的 ≥ n 的 2 的幂：n = 9 ⇒ B = 16，0…15 全可达；n = 4 ⇒ B = 4，只有 4…7，故 k = 8 无解</text>
  <text x="360" y="414" text-anchor="middle" font-size="10.5" fill="#888888"
        filter="url(#rough2)">换个说法：先算 s = n ⊕ k，只要 s &lt; B 就能构造，S 取 s 的二进制 1 位即可</text>
</svg>
