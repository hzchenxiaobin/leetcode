<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">预处理全部二进制回文数（升序），查询时二分取左右邻居</text>

  <!-- 数轴 -->
  <path d="M40,120 L480,120" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 回文点 -->
  <circle cx="90" cy="120" r="5" fill="#4a7a3a" stroke="#4a7a3a" filter="url(#rough2)"/>
  <text x="90" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <circle cx="150" cy="120" r="5" fill="#4a7a3a" stroke="#4a7a3a" filter="url(#rough2)"/>
  <text x="150" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <circle cx="212" cy="120" r="5" fill="#4a7a3a" stroke="#4a7a3a" filter="url(#rough2)"/>
  <text x="212" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">9</text>
  <circle cx="300" cy="120" r="5" fill="#4a7a3a" stroke="#4a7a3a" filter="url(#rough2)"/>
  <text x="300" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">15</text>
  <circle cx="386" cy="120" r="5" fill="#4a7a3a" stroke="#4a7a3a" filter="url(#rough2)"/>
  <text x="386" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">21</text>

  <!-- 查询点 x -->
  <circle cx="252" cy="120" r="6" fill="#b85450" stroke="#b85450" filter="url(#rough2)"/>
  <text x="252" y="106" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">x = 12</text>

  <!-- 左右候选 -->
  <path d="M212,168 L212,132" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrI)" filter="url(#rough2)"/>
  <path d="M300,168 L300,132" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrI)" filter="url(#rough2)"/>
  <text x="212" y="186" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">左邻 9（距离 3）</text>
  <text x="300" y="186" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">右邻 15（距离 3）</text>

  <!-- 结论 -->
  <rect x="60" y="204" width="400" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">最近者 ∈ { lower_bound(x) 处元素 , 它的前一个 } —— 每个查询 O(log|P|)</text>

  <rect x="60" y="256" width="400" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">上界取 2^14 = 16384：5000 的最近是 4953，而 5001 的最近是 5049（要看右边）</text>
</svg>
