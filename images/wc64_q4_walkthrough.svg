<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="780" height="500" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：n = 2, k = 2 的 DFS 全过程</text>
  <text x="390" y="52" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">节点集 {"0","1"}，边集 {00, 01, 10, 11}；后序追加 [0,1,1,0]，逆序仍是 "0110"</text>

  <g filter="url(#rough2)">
    <rect x="40" y="70" width="700" height="30" rx="5" fill="#dfe8f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="40" y="100" width="700" height="30" fill="#ffffff" stroke="#cdd8e8" stroke-width="1"/>
    <rect x="40" y="130" width="700" height="30" fill="#f4f7fb" stroke="#cdd8e8" stroke-width="1"/>
    <rect x="40" y="160" width="700" height="30" fill="#ffffff" stroke="#cdd8e8" stroke-width="1"/>
    <rect x="40" y="190" width="700" height="30" fill="#f4f7fb" stroke="#cdd8e8" stroke-width="1"/>
    <rect x="40" y="220" width="700" height="30" fill="#ffffff" stroke="#cdd8e8" stroke-width="1"/>
    <rect x="40" y="250" width="700" height="30" fill="#f4f7fb" stroke="#cdd8e8" stroke-width="1"/>
    <rect x="40" y="280" width="700" height="30" fill="#ffffff" stroke="#cdd8e8" stroke-width="1"/>
    <rect x="40" y="310" width="700" height="30" fill="#f4f7fb" stroke="#cdd8e8" stroke-width="1"/>
  </g>

  <g filter="url(#rough2)" font-size="11.5" fill="#2f4a6b" font-weight="bold">
    <text x="69" y="90" text-anchor="middle">步</text>
    <text x="152" y="90" text-anchor="middle">当前节点</text>
    <text x="216" y="90">尝试的出边</text>
    <text x="392" y="90">结果</text>
    <text x="590" y="90">后序追加</text>
  </g>

  <g filter="url(#rough2)" font-size="11.5" fill="#444">
    <text x="69" y="120" text-anchor="middle">1</text>
    <text x="152" y="120" text-anchor="middle">0</text>
    <text x="216" y="120">00（未访问）</text>
    <text x="392" y="120">标记，进入节点 0</text>
    <text x="590" y="120">—</text>

    <text x="69" y="150" text-anchor="middle">2</text>
    <text x="152" y="150" text-anchor="middle">0</text>
    <text x="216" y="150">00 已访问 → 01</text>
    <text x="392" y="150">标记，进入节点 1</text>
    <text x="590" y="150">—</text>

    <text x="69" y="180" text-anchor="middle">3</text>
    <text x="152" y="180" text-anchor="middle">1</text>
    <text x="216" y="180">10（未访问）</text>
    <text x="392" y="180">标记，进入节点 0</text>
    <text x="590" y="180">—</text>

    <text x="69" y="210" text-anchor="middle">4</text>
    <text x="152" y="210" text-anchor="middle">0</text>
    <text x="216" y="210">00、01 都已访问</text>
    <text x="392" y="210">无路可走 → 回溯</text>
    <text x="590" y="210" fill="#b85450">0（边 10）</text>

    <text x="69" y="240" text-anchor="middle">5</text>
    <text x="152" y="240" text-anchor="middle">1</text>
    <text x="216" y="240">11（未访问）</text>
    <text x="392" y="240">标记，进入节点 1</text>
    <text x="590" y="240">—</text>

    <text x="69" y="270" text-anchor="middle">6</text>
    <text x="152" y="270" text-anchor="middle">1</text>
    <text x="216" y="270">10、11 都已访问</text>
    <text x="392" y="270">无路可走 → 回溯</text>
    <text x="590" y="270" fill="#b85450">1（边 11）</text>

    <text x="69" y="300" text-anchor="middle">7</text>
    <text x="152" y="300" text-anchor="middle">1</text>
    <text x="216" y="300">01 之后无剩余出边</text>
    <text x="392" y="300">回溯到上层节点</text>
    <text x="590" y="300" fill="#b85450">1（边 01）</text>

    <text x="69" y="330" text-anchor="middle">8</text>
    <text x="152" y="330" text-anchor="middle">0（根）</text>
    <text x="216" y="330">00 之后无剩余出边</text>
    <text x="392" y="330">回溯结束</text>
    <text x="590" y="330" fill="#b85450">0（边 00）</text>
  </g>

  <text x="390" y="368" text-anchor="middle" font-size="12" fill="#2f4a6b" filter="url(#rough2)">逆序拼接：起点 "0" + "0110" = "00110"，长度 5</text>

  <g filter="url(#rough2)" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f4a6b">
    <rect x="250" y="384" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="296" y="384" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="342" y="384" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="388" y="384" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="434" y="384" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="273" y="412">0</text>
    <text x="319" y="412">0</text>
    <text x="365" y="412">1</text>
    <text x="411" y="412">1</text>
    <text x="457" y="412">0</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 296,424 L 296,436" fill="none" stroke="#d6a040" stroke-width="1.2"/>
    <path d="M 342,424 L 342,436" fill="none" stroke="#d6a040" stroke-width="1.2"/>
    <path d="M 388,424 L 388,436" fill="none" stroke="#d6a040" stroke-width="1.2"/>
    <path d="M 434,424 L 434,436" fill="none" stroke="#d6a040" stroke-width="1.2"/>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#b8860b" text-anchor="middle">
    <text x="296" y="452">00</text>
    <text x="342" y="452">01</text>
    <text x="388" y="452">11</text>
    <text x="434" y="452">10</text>
  </g>

  <text x="390" y="480" text-anchor="middle" font-size="11.5" fill="#7a5a18" filter="url(#rough2)">长度 5 = k^n + n − 1 = 4 + 2 − 1，且 00 / 01 / 11 / 10 四个窗口全部出现 ⇒ 最短且合法</text>
</svg>
