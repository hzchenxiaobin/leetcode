<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">两例并排演算：谁是第一个越过一半的 m</text>

  <text x="40" y="60" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 1：possible = [1,0,1,0]，total = 0</text>
  <g filter="url(#rough2)" font-size="11" fill="#446688">
    <rect x="40" y="70" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="130" y="70" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="200" y="70" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="290" y="70" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="85" y="89">m</text><text x="165" y="89">pre(m)</text><text x="245" y="89">Bob</text>
    <text x="365" y="89">pre &gt; Bob ?</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="100" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="130" y="100" width="70" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="200" y="100" width="90" height="30" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="290" y="100" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="85" y="120">1</text><text x="165" y="120">+1</text><text x="245" y="120">−1</text>
    <text x="365" y="120">1 &gt; −1 ✓ → ans = 1</text>
  </g>
  <text x="40" y="152" font-size="11" fill="#7a5c1e" filter="url(#rough2)">m 只取 1（n−1 = 1），第一行就命中。</text>

  <text x="40" y="186" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 2：possible = [1,1,1,1,1]，total = 5</text>
  <g filter="url(#rough2)" font-size="11" fill="#446688">
    <rect x="40" y="196" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="130" y="196" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="200" y="196" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="290" y="196" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="85" y="215">m</text><text x="165" y="215">pre(m)</text><text x="245" y="215">Bob</text>
    <text x="365" y="215">pre &gt; Bob ?</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="226" width="90" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="130" y="226" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="200" y="226" width="90" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="290" y="226" width="150" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="85" y="245">1</text><text x="165" y="245">1</text><text x="245" y="245">4</text>
    <text x="365" y="245">1 &gt; 4 ✗</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="258" width="90" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="130" y="258" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="200" y="258" width="90" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="290" y="258" width="150" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="85" y="277">2</text><text x="165" y="277">2</text><text x="245" y="277">3</text>
    <text x="365" y="277">2 &gt; 3 ✗</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="290" width="90" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="130" y="290" width="70" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="200" y="290" width="90" height="28" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="290" y="290" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="85" y="309">3</text><text x="165" y="309">3</text><text x="245" y="309">2</text>
    <text x="365" y="309">3 &gt; 2 ✓ → ans = 3</text>
  </g>
  <text x="450" y="200" font-size="11" fill="#446688" filter="url(#rough2)">前两行都不满足</text>
  <text x="450" y="218" font-size="11" fill="#446688" filter="url(#rough2)">继续右移分界</text>
</svg>
