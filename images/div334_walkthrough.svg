<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="620" fill="#fafafa"/>

  <text x="340" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：word = "998244353"，m = 3</text>
  <path d="M 165 45 Q 340 53 515 45" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="70" y="66" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="130" y="66" width="60" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="190" y="66" width="80" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="270" y="66" width="150" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="420" y="66" width="110" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="530" y="66" width="80" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" fill="#2c4d70" font-weight="bold">
    <text x="100" y="88">i</text>
    <text x="160" y="88">d</text>
    <text x="230" y="88">r(旧)</text>
    <text x="345" y="88">r × 10 + d</text>
    <text x="475" y="88">r(新) mod 3</text>
    <text x="570" y="88" fill="#8a6210">div[i]</text>
  </g>

  <!-- 数据行 -->
  <!-- r_new=0 的行绿色高亮 -->
  <g filter="url(#rough2)">
    <rect x="70" y="104" width="540" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="70" y="142" width="540" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="70" y="180" width="540" height="34" rx="4" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="70" y="218" width="540" height="34" rx="4" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="70" y="256" width="540" height="34" rx="4" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="70" y="294" width="540" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="70" y="332" width="540" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="70" y="370" width="540" height="34" rx="4" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="70" y="408" width="540" height="34" rx="4" fill="#fdfdfd" stroke="#bbbbbb" stroke-width="1"/>
  </g>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle" fill="#333">
    <text x="100" y="126">0</text><text x="160" y="126">9</text><text x="230" y="126">0</text><text x="345" y="126">0×10+9 = 9</text><text x="475" y="126" font-weight="bold" fill="#2e5a24">0</text><text x="570" y="126" font-weight="bold" fill="#2e5a24">1</text>
    <text x="100" y="164">1</text><text x="160" y="164">9</text><text x="230" y="164">0</text><text x="345" y="164">0×10+9 = 9</text><text x="475" y="164" font-weight="bold" fill="#2e5a24">0</text><text x="570" y="164" font-weight="bold" fill="#2e5a24">1</text>
    <text x="100" y="202">2</text><text x="160" y="202">8</text><text x="230" y="202">0</text><text x="345" y="202">0×10+8 = 8</text><text x="475" y="202">2</text><text x="570" y="202">0</text>
    <text x="100" y="240">3</text><text x="160" y="240">2</text><text x="230" y="240">2</text><text x="345" y="240">2×10+2 = 22</text><text x="475" y="240">1</text><text x="570" y="240">0</text>
    <text x="100" y="278">4</text><text x="160" y="278">4</text><text x="230" y="278">1</text><text x="345" y="278">1×10+4 = 14</text><text x="475" y="278">2</text><text x="570" y="278">0</text>
    <text x="100" y="316">5</text><text x="160" y="316">4</text><text x="230" y="316">2</text><text x="345" y="316">2×10+4 = 24</text><text x="475" y="316" font-weight="bold" fill="#2e5a24">0</text><text x="570" y="316" font-weight="bold" fill="#2e5a24">1</text>
    <text x="100" y="354">6</text><text x="160" y="354">3</text><text x="230" y="354">0</text><text x="345" y="354">0×10+3 = 3</text><text x="475" y="354" font-weight="bold" fill="#2e5a24">0</text><text x="570" y="354" font-weight="bold" fill="#2e5a24">1</text>
    <text x="100" y="392">7</text><text x="160" y="392">5</text><text x="230" y="392">0</text><text x="345" y="392">0×10+5 = 5</text><text x="475" y="392">2</text><text x="570" y="392">0</text>
    <text x="100" y="430">8</text><text x="160" y="430">3</text><text x="230" y="430">2</text><text x="345" y="430">2×10+3 = 23</text><text x="475" y="430">2</text><text x="570" y="430">0</text>
  </g>

  <!-- 竖向余数传递箭头（r(新) → 下一行 r(旧)） -->
  <g filter="url(#rough2)" stroke="#8a6210" stroke-width="1.4" fill="none">
    <path d="M 475 140 L 232 152" marker-end="url(#arr)"/>
    <path d="M 475 178 L 232 190" marker-end="url(#arr)"/>
    <path d="M 475 216 L 232 228" marker-end="url(#arr)"/>
    <path d="M 475 254 L 232 266" marker-end="url(#arr)"/>
    <path d="M 475 292 L 232 304" marker-end="url(#arr)"/>
    <path d="M 475 330 L 232 342" marker-end="url(#arr)"/>
    <path d="M 475 368 L 232 380" marker-end="url(#arr)"/>
    <path d="M 475 406 L 232 418" marker-end="url(#arr)"/>
  </g>

  <!-- 结果 -->
  <g filter="url(#rough)">
    <rect x="70" y="462" width="540" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="340" y="490" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6210" filter="url(#rough2)">输出 div = [1, 1, 0, 0, 0, 1, 1, 0, 0]</text>

  <!-- 观察注记 -->
  <g filter="url(#rough2)">
    <rect x="70" y="524" width="540" height="72" rx="8" fill="#fdfdfd" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="88" y="548" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">观察</text>
  <text x="88" y="568" font-size="12" fill="#444" filter="url(#rough2)">· 整除前缀恰是 "9"、"99"、"998244"、"9982443"（对应绿色行 i=0,1,5,6）</text>
  <text x="88" y="586" font-size="12" fill="#444" filter="url(#rough2)">· r 一旦归零便「重新出发」：i=5,6 连续整除，因为余 0 的前缀再拼上 3 的倍数仍整除</text>
</svg>
