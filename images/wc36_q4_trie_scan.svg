<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：字典树扫描 + 贪心合并区间</text>
  <text x="280" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">先把「每个起点能匹配到哪」压成 endAt 数组，剩下的只是区间合并</text>

  <rect x="70" y="62" width="420" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="86" y="82" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 建树</text>
  <text x="86" y="98" font-size="10" fill="#555" filter="url(#rough2)">把所有 words 插入字典树，词尾节点打 terminal 标记（只建一棵）</text>

  <path d="M 280 106 L 280 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="132" width="420" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="86" y="152" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② 扫描</text>
  <text x="86" y="168" font-size="10" fill="#555" filter="url(#rough2)">对每个起点 i 沿树边走：遇到 terminal 就记 endAt[i] = j</text>
  <text x="86" y="180" font-size="10" fill="#555" filter="url(#rough2)">j 单调递增，最后一次赋值即最远右端点；走不下去就 break</text>

  <path d="M 280 184 L 280 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="210" width="420" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="86" y="230" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">③ 合并</text>
  <text x="86" y="246" font-size="10" fill="#555" filter="url(#rough2)">从 i 起令 end = endAt[i]，j 扫到 end+1；endAt[j] &gt; end 就扩大 end</text>
  <text x="86" y="258" font-size="10" fill="#555" filter="url(#rough2)">（end+1 这一格专门用来吃下「首尾相接」的下一段）</text>

  <path d="M 280 262 L 280 286" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="288" width="420" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="86" y="308" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">④ 拼接</text>
  <text x="86" y="324" font-size="10" fill="#555" filter="url(#rough2)">段内写 &lt;b&gt;s[i..end]&lt;/b&gt;，段外原样输出，然后 i = end + 1</text>

  <path d="M 280 334 L 280 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="354" width="420" height="48" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="86" y="374" font-size="10.5" fill="#333" filter="url(#rough2)">时间 O(Σ|w| + |s| · Lmax) ≈ 10^6，空间 O(Σ|w| + |s|)</text>
  <text x="86" y="392" font-size="10" fill="#888" filter="url(#rough2)">Lmax 为最长单词长度；|s| ≤ 1000 时扫描步数不超过 10^6</text>
</svg>
