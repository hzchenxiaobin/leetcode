<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 376" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
<defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <filter id="roughs"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="11"/><feDisplacementMap in="SourceGraphic" scale="0.6"/></filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#446688" filter="url(#roughs)"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#d6a040" filter="url(#roughs)"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#b85450" filter="url(#roughs)"/></marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#4a7a3a" filter="url(#roughs)"/></marker>
  </defs>
<rect width="560" height="376" fill="#fafafa"/>
<text x="280" y="28" text-anchor="middle" font-size="13" fill="#555" font-weight="normal" filter="url(#roughs)">选一条边 = 翻转它两个端点；重复选同一条边等价于不选</text>
<ellipse cx="150" cy="80" rx="24" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
<text x="150" y="85" text-anchor="middle" font-size="15" fill="#26343f" font-weight="normal" filter="url(#roughs)">0</text>
<ellipse cx="92" cy="168" rx="24" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
<text x="92" y="173" text-anchor="middle" font-size="15" fill="#26343f" font-weight="normal" filter="url(#roughs)">1</text>
<ellipse cx="210" cy="168" rx="24" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
<text x="210" y="173" text-anchor="middle" font-size="15" fill="#26343f" font-weight="normal" filter="url(#roughs)">2</text>
<ellipse cx="92" cy="252" rx="24" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
<text x="92" y="257" text-anchor="middle" font-size="15" fill="#26343f" font-weight="normal" filter="url(#roughs)">3</text>
<ellipse cx="210" cy="252" rx="24" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
<text x="210" y="257" text-anchor="middle" font-size="15" fill="#26343f" font-weight="normal" filter="url(#roughs)">4</text>
<path d="M140,98 L104,148" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<path d="M162,98 L200,148" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
<path d="M96,190 L96,232" fill="none" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
<path d="M204,190 L204,232" fill="none" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
<text x="150" y="300" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="normal" filter="url(#roughs)">橙色两条边都选：端点 1、2、3、4 被翻</text>
<text x="150" y="318" text-anchor="middle" font-size="11" fill="#666" font-weight="normal" filter="url(#roughs)">节点 0 度为 0，没被翻</text>
<rect x="286" y="52" width="250" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
<text x="411" y="76" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">执行边子集 S 后，节点 i</text>
<text x="411" y="96" text-anchor="middle" font-size="12" fill="#333333" font-weight="normal" filter="url(#roughs)">被翻次数 = deg_S(i)</text>
<rect x="286" y="128" width="250" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
<text x="411" y="152" text-anchor="middle" font-size="13" fill="#8a5a10" font-weight="bold" filter="url(#roughs)">被翻集合 = 奇度点集</text>
<text x="411" y="172" text-anchor="middle" font-size="12" fill="#8a5a10" font-weight="normal" filter="url(#roughs)">Σdeg_S = 2|S| 为偶 ⇒</text>
<text x="411" y="192" text-anchor="middle" font-size="12" fill="#8a5a10" font-weight="normal" filter="url(#roughs)">被翻节点数必为偶数</text>
<rect x="286" y="218" width="250" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
<text x="411" y="242" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">反过来也成立：任意偶数集合</text>
<text x="411" y="262" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">两两配对，沿树路径取对称差</text>
<text x="411" y="282" text-anchor="middle" font-size="12" fill="#2f5a24" font-weight="normal" filter="url(#roughs)">奇度点集恰为该集合</text>
<text x="280" y="358" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#roughs)">于是问题变成：选偶数个节点翻转，最大化总和</text>
</svg>
