<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">整个数组也是一个合法的子数组！</text>
  <path d="M 190 40 Q 320 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="52" y="106" width="40" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="92" y="106" width="40" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="132" y="106" width="40" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <g font-size="15" fill="#2b4a66" text-anchor="middle" font-weight="bold">
    <text x="72" y="131">1</text>
    <text x="112" y="131">2</text>
    <text x="152" y="131">4</text>
  </g>
  <g filter="url(#sk)">
    <path d="M 46 98 Q 112 86 178 98" stroke="#b85450" stroke-width="2.2" fill="none"/>
  </g>
  <text x="112" y="80" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">选 l=0, r=n−1（整个数组）</text>

  <text x="112" y="178" text-anchor="middle" font-size="13" fill="#7a5415" font-weight="bold">1 AND 2 AND 4 = 0</text>

  <path d="M 210 126 L 288 126" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="249" y="114" text-anchor="middle" font-size="12" fill="#666">一次操作</text>

  <g filter="url(#sk)">
    <rect x="310" y="106" width="40" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="350" y="106" width="40" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
    <rect x="390" y="106" width="40" height="40" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <g font-size="15" fill="#2e5e2e" text-anchor="middle" font-weight="bold">
    <text x="330" y="131">0</text>
    <text x="370" y="131">0</text>
    <text x="410" y="131">0</text>
  </g>
  <text x="370" y="178" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">全部相等，只需 1 次 ✓</text>

  <g filter="url(#sk)">
    <rect x="150" y="220" width="340" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="243" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold">ans = 0（已全相等）或 1（其他情况）</text>

  <g filter="url(#sk)">
    <rect x="52" y="292" width="200" height="30" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="152" y="312" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">[5,5,5] → ans = 0</text>
  <g filter="url(#sk)">
    <rect x="388" y="292" width="200" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="488" y="312" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold">[1,2] → 1 AND 2 = 0 → 1</text>
</svg>
