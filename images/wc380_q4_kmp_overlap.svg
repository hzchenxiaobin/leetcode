<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">KMP 收集器的命门：命中后 j = π[m−1] 回跳，而非清零</text>
  <text x="180" y="48" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">以 s = "aaaa"、p = "aa" 为例：重叠出现有 3 处（起点 0、1、2）</text>

  <!-- pi 数组小框 -->
  <rect x="470" y="58" width="132" height="86" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="536" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">p = "aa" 的 π</text>
  <text x="536" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">π = [0, 1]</text>
  <text x="536" y="120" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">命中时 j = m = 2</text>
  <text x="536" y="136" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">回跳 j ← π[1] = 1</text>

  <!-- s 的格子 -->
  <rect x="230" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="270" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="310" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="350" y="56" width="40" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="79" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="230" y="42" font-size="10" fill="#666" filter="url(#rough2)">s：</text>
  <text x="250" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="290" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="330" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="370" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>

  <!-- 三个出现的对齐展示 -->
  <rect x="230" y="126" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="146" text-anchor="middle" font-size="12" fill="#3a5f2e" filter="url(#rough2)">a</text>
  <text x="290" y="146" text-anchor="middle" font-size="12" fill="#3a5f2e" filter="url(#rough2)">a</text>
  <text x="330" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 起点 0</text>

  <rect x="270" y="164" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="184" text-anchor="middle" font-size="12" fill="#3a5f2e" filter="url(#rough2)">a</text>
  <text x="330" y="184" text-anchor="middle" font-size="12" fill="#3a5f2e" filter="url(#rough2)">a</text>
  <text x="370" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 起点 1</text>

  <rect x="310" y="202" width="80" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="222" text-anchor="middle" font-size="12" fill="#3a5f2e" filter="url(#rough2)">a</text>
  <text x="370" y="222" text-anchor="middle" font-size="12" fill="#3a5f2e" filter="url(#rough2)">a</text>
  <text x="410" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 起点 2</text>

  <!-- 对比说明框 -->
  <rect x="46" y="252" width="262" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="177" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#3a5f2e" filter="url(#rough2)">回跳 j = π[m−1] = 1 ✓</text>
  <text x="177" y="292" text-anchor="middle" font-size="10" fill="#4a6a3e" filter="url(#rough2)">当作「已匹配 1 个字符」继续比对</text>
  <text x="177" y="305" text-anchor="middle" font-size="10" fill="#4a6a3e" filter="url(#rough2)">→ 起点 0、1、2 一个不漏，全数入账</text>

  <rect x="328" y="252" width="262" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="459" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#a33333" filter="url(#rough2)">清零 j = 0 ✗</text>
  <text x="459" y="294" text-anchor="middle" font-size="10" fill="#7a3a37" filter="url(#rough2)">已匹配信息全部丢弃，下一字符从 p[0]</text>
  <text x="459" y="306" text-anchor="middle" font-size="10" fill="#7a3a37" filter="url(#rough2)">重比 → 重叠出现（起点 1）被整段漏掉</text>

  <text x="310" y="336" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">本题要的是「全部出现」而非「首次出现」—— 这一行写错，收集表缺项，判定再对也白搭</text>
</svg>
