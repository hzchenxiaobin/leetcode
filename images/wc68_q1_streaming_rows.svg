<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="36" text-anchor="middle" font-size="15" fill="#334" filter="url(#rough2)">进阶：只缓存上一行，读一行判一行</text>

  <text x="52" y="112" font-size="13" fill="#2f4f6f" filter="url(#rough2)">prev</text>
  <text x="52" y="178" font-size="13" fill="#2f4f6f" filter="url(#rough2)">cur</text>

  <!-- 上一行 -->
  <rect x="110" y="84" width="54" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="164" y="84" width="54" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="218" y="84" width="54" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="272" y="84" width="54" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="137" y="112" text-anchor="middle" font-size="16" fill="#334" filter="url(#rough2)">1</text>
  <text x="191" y="112" text-anchor="middle" font-size="16" fill="#334" filter="url(#rough2)">2</text>
  <text x="245" y="112" text-anchor="middle" font-size="16" fill="#334" filter="url(#rough2)">3</text>
  <text x="299" y="112" text-anchor="middle" font-size="16" fill="#334" filter="url(#rough2)">4</text>

  <!-- 当前行：同列坐标，比较时向上取其左上方 -->
  <rect x="110" y="150" width="54" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="164" y="150" width="54" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="218" y="150" width="54" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="272" y="150" width="54" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="137" y="178" text-anchor="middle" font-size="16" fill="#334" filter="url(#rough2)">5</text>
  <text x="191" y="178" text-anchor="middle" font-size="16" fill="#334" filter="url(#rough2)">1</text>
  <text x="245" y="178" text-anchor="middle" font-size="16" fill="#334" filter="url(#rough2)">2</text>
  <text x="299" y="178" text-anchor="middle" font-size="16" fill="#334" filter="url(#rough2)">3</text>

  <!-- 斜向比较连线：prev[k] 对 cur[k+1] -->
  <path d="M137,128 L191,150" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M191,128 L245,150" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M245,128 L299,150" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="160" y="142" font-size="11" fill="#4a7a3a" filter="url(#rough2)">=</text>
  <text x="214" y="142" font-size="11" fill="#4a7a3a" filter="url(#rough2)">=</text>
  <text x="268" y="142" font-size="11" fill="#4a7a3a" filter="url(#rough2)">=</text>

  <path d="M330,106 C 380,112 380,166 332,172" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="144" font-size="12" fill="#2f4f6f" filter="url(#rough2)">prev = cur</text>

  <rect x="50" y="214" width="460" height="58" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="238" font-size="12" fill="#7a5b1e" filter="url(#rough2)">上一行整体右移一格：比较 prev[0…n−2] 与 cur[1…n−1]</text>
  <text x="66" y="260" font-size="12" fill="#7a5b1e" filter="url(#rough2)">首列与末列天然没有配对；随后 prev = cur，只占两行 → O(n)</text>

  <text x="280" y="298" text-anchor="middle" font-size="11.5" fill="#667" filter="url(#rough2)">若一行也读不全：按块读入，块内元素与左上邻居比较，并缓存上一块末列</text>
  <text x="280" y="320" text-anchor="middle" font-size="11.5" fill="#667" filter="url(#rough2)">时间仍是 O(mn)，空间 O(块高 + 块宽)</text>
</svg>
