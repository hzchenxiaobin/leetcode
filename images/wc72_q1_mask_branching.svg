<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="372" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：数字位固定，字母位各自二选一</text>
  <text x="320" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">把「每个字母转不转大写」编码成一个 k 位掩码，问题就变成数掩码</text>

  <rect x="191" y="76" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="218" y="103" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">a</text>
  <rect x="259" y="76" width="54" height="40" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="286" y="103" text-anchor="middle" font-size="19" font-weight="bold" fill="#777" filter="url(#rough2)">1</text>
  <rect x="327" y="76" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="354" y="103" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">b</text>
  <rect x="395" y="76" width="54" height="40" fill="#f0f0f0" stroke="#9a9a9a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="422" y="103" text-anchor="middle" font-size="19" font-weight="bold" fill="#777" filter="url(#rough2)">2</text>

  <path d="M 218 116 L 218 128" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 354 116 L 354 128" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="130" width="66" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="218" y="147" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">字母 #0</text>
  <rect x="321" y="130" width="66" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="354" y="147" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">字母 #1</text>
  <rect x="266" y="130" width="40" height="24" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="286" y="147" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">固定</text>
  <rect x="402" y="130" width="40" height="24" fill="#f7f7f7" stroke="#aaa" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="422" y="147" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">固定</text>

  <path d="M 218 154 L 218 164" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 354 154 L 354 164" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="166" width="96" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="218" y="184" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">bit 1 · 权 2</text>
  <rect x="306" y="166" width="96" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="354" y="184" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">bit 0 · 权 1</text>

  <rect x="80" y="206" width="480" height="70" fill="#f5f7fb" stroke="#9aa7bb" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="98" y="230" font-size="10.5" fill="#3f4f66" filter="url(#rough2)">字母编号 b 从左往右数（b = 0, 1, …, k−1），它对应掩码的第 (k−1−b) 位：</text>
  <text x="98" y="250" font-size="10.5" fill="#b85450" filter="url(#rough2)">该位为 1 → 这个字母转大写；为 0 → 保持小写。</text>
  <text x="98" y="268" font-size="10.5" fill="#3f4f66" filter="url(#rough2)">mask 从 0 枚举到 2^k − 1，每个掩码恰好产出一个串，一一对应。</text>

  <rect x="80" y="292" width="230" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="195" y="311" text-anchor="middle" font-size="10.5" fill="#2f3f5c" filter="url(#rough2)">结果个数 = 2^k</text>
  <text x="195" y="329" text-anchor="middle" font-size="9.5" fill="#5a6a80" filter="url(#rough2)">k = 字母个数，本题 k ≤ 12</text>

  <rect x="330" y="292" width="230" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="445" y="311" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">最多 2^12 = 4096 个串</text>
  <text x="445" y="329" text-anchor="middle" font-size="9.5" fill="#5a6a80" filter="url(#rough2)">输出规模本身就是 2^k · n</text>

  <text x="320" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">数字 '1'、'2' 不分配二进制位——它们在所有结果里都不变</text>
</svg>
