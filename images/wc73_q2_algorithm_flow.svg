<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历，边算边比</text>
  <text x="330" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">无需模拟、无需搜索——距离一旦确定，胜负就已注定</text>

  <rect x="252" y="60" width="156" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="330" y="81" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">读入 ghosts、target</text>

  <path d="M 330 92 L 330 108" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="196" y="110" width="268" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="330" y="126" text-anchor="middle" font-size="11" fill="#3a4a66" filter="url(#rough2)">T = |xt| + |yt|</text>
  <text x="330" y="140" text-anchor="middle" font-size="10" fill="#5a6a86" filter="url(#rough2)">你到终点的最短步数（下界，绕路只会更大）</text>

  <path d="M 330 146 L 330 164" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="152" y="166" width="356" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="330" y="182" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">对每个阻碍者算 d_i = |xi − xt| + |yi − yt|</text>
  <text x="330" y="196" text-anchor="middle" font-size="10" fill="#4f6b45" filter="url(#rough2)">它到终点的最短步数</text>

  <path d="M 330 202 L 330 222" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="330,222 470,258 330,296 190,258" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="330" y="255" text-anchor="middle" font-size="11.5" fill="#8a3b38" font-weight="bold" filter="url(#rough2)">存在 d_i ≤ T ?</text>
  <text x="330" y="272" text-anchor="middle" font-size="9.5" fill="#a0524e" filter="url(#rough2)">（等于也算：同时到达 = 被抓）</text>

  <path d="M 190 258 L 122 258 L 122 316" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 470 258 L 538 258 L 538 316" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="512" y="250" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="52" y="318" width="196" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="150" y="334" text-anchor="middle" font-size="11" fill="#8a3b38" filter="url(#rough2)">return false</text>
  <text x="150" y="350" text-anchor="middle" font-size="9.5" fill="#a0524e" filter="url(#rough2)">有阻碍者比你近/一样近</text>

  <rect x="440" y="318" width="196" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="538" y="334" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">return true</text>
  <text x="538" y="350" text-anchor="middle" font-size="9.5" fill="#4f6b45" filter="url(#rough2)">所有阻碍者都比你远</text>

  <rect x="222" y="366" width="216" height="26" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" rx="13" filter="url(#rough2)"/>
  <text x="330" y="383" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">时间 O(n)，额外空间 O(1)</text>

  <text x="330" y="412" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">注意：一旦发现某个 d_i ≤ T 就可以立刻返回 false，无需看完整个数组</text>
</svg>
