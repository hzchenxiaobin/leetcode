<svg xmlns="http://www.w3.org/2000/svg" width="640" height="680" viewBox="0 0 640 680" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="640" height="680" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：外层枚举左端点 l，内层沿 Trie 链向右扩展 r</text>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="320" cy="66" rx="150" ry="22" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="320" y="71" text-anchor="middle" font-size="12.5" fill="#234">开始：Trie 建根，ans = 0</text>
  <path d="M 320 88 L 320 100" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- outer loop -->
  <g filter="url(#sk)">
    <rect x="165" y="102" width="310" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="320" y="127" text-anchor="middle" font-size="12.5" fill="#123">外层 for l = 0 … n−1：node = root，cnt = 0</text>
  <path d="M 320 142 L 320 154" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- inner loop -->
  <g filter="url(#sk)">
    <rect x="195" y="156" width="250" height="36" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="320" y="179" text-anchor="middle" font-size="12.5" fill="#123">内层 for r = l … n−1</text>
  <path d="M 320 192 L 320 212 L 170 212 L 170 219" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond A -->
  <g filter="url(#sk)">
    <polygon points="170,222 245,252 170,282 95,252" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="170" y="250" text-anchor="middle" font-size="11.5" fill="#333">nums[r] % p</text>
  <text x="170" y="265" text-anchor="middle" font-size="11.5" fill="#333">== 0 ？</text>
  <text x="252" y="245" font-size="11" fill="#2e6e2e">是</text>
  <path d="M 245 252 L 300 252" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- cnt++ -->
  <g filter="url(#sk)">
    <rect x="302" y="235" width="150" height="34" rx="8" fill="#fff" stroke="#5a5a5a" stroke-width="1.5"/>
  </g>
  <text x="377" y="257" text-anchor="middle" font-size="12.5" fill="#123" font-family="monospace">cnt = cnt + 1</text>
  <path d="M 380 269 L 380 296" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond B -->
  <g filter="url(#sk)">
    <polygon points="380,299 452,330 380,361 308,330" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="380" y="335" text-anchor="middle" font-size="12.5" fill="#333">cnt &gt; k ？</text>
  <text x="460" y="322" font-size="11" fill="#a04038">是</text>
  <path d="M 452 330 L 560 330 L 560 600" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="507" y="322" font-size="10.5" fill="#a04038" text-anchor="middle">break</text>
  <text x="552" y="470" font-size="10" fill="#a04038" text-anchor="end">超限后右侧更非法，</text>
  <text x="552" y="484" font-size="10" fill="#a04038" text-anchor="end">直接进入下一轮 l</text>

  <text x="296" y="322" font-size="11" fill="#2e6e2e">否</text>
  <path d="M 308 330 L 255 330 L 255 318" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="172" y="300" font-size="11" fill="#2e6e2e">否</text>
  <path d="M 170 282 L 170 314" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- lookup -->
  <g filter="url(#sk)">
    <rect x="50" y="318" width="240" height="44" rx="8" fill="#fff" stroke="#5a5a5a" stroke-width="1.5"/>
  </g>
  <text x="170" y="345" text-anchor="middle" font-size="12" fill="#123">在 node 的 children 中查 nums[r]</text>
  <path d="M 170 362 L 170 396" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- diamond C -->
  <g filter="url(#sk)">
    <polygon points="170,399 245,432 170,465 95,432" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.8"/>
  </g>
  <text x="170" y="437" text-anchor="middle" font-size="12.5" fill="#333">找到 ？</text>

  <text x="86" y="425" font-size="11" fill="#2e6e2e">是</text>
  <path d="M 95 432 L 75 432 L 75 498" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="55" y="500" width="180" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="145" y="525" text-anchor="middle" font-size="12" fill="#123">node = child（下行）</text>

  <text x="248" y="422" font-size="11" fill="#a04038">否</text>
  <path d="M 245 432 L 330 432 L 330 498" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="238" y="500" width="190" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="333" y="518" text-anchor="middle" font-size="11.5" fill="#7a2e28">新建 child，ans = ans + 1</text>
  <text x="333" y="533" text-anchor="middle" font-size="11.5" fill="#7a2e28">node = child</text>

  <!-- r++ loop back -->
  <path d="M 145 540 L 145 575 M 333 540 L 333 575 L 145 575" stroke="#3a3a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 240 575 L 36 575 L 36 174 L 190 174" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="130" y="568" font-size="10.5" fill="#666">r + 1，继续扩展</text>
  <text x="42" y="240" font-size="10.5" fill="#666">回到内层循环</text>

  <!-- bottom box -->
  <g filter="url(#sk)">
    <rect x="140" y="602" width="440" height="52" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="360" y="623" text-anchor="middle" font-size="12" fill="#234">内层结束（r 触底 或 cnt 超限 break）→ l++ 进入下一轮</text>
  <text x="360" y="643" text-anchor="middle" font-size="12" fill="#234">外层全部结束后返回 ans</text>
</svg>
