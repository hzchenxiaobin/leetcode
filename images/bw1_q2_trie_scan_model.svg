<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">多模式匹配：words 建成 Trie，起点 i 沿树下探</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">words = {ab, aba}，text = ababa：一次下探同时测试所有单词</text>

  <!-- 左：Trie -->
  <text x="96" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">Trie</text>

  <g filter="url(#rough2)">
    <circle cx="96" cy="108" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="96" cy="172" r="16" fill="#fff" stroke="#666" stroke-width="1.6"/>
    <circle cx="96" cy="236" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="96" cy="236" r="11" fill="none" stroke="#4a7a3a" stroke-width="1.4"/>
    <circle cx="96" cy="300" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="96" cy="300" r="11" fill="none" stroke="#4a7a3a" stroke-width="1.4"/>
    <path d="M 96 124 L 96 154" stroke="#666" stroke-width="1.6"/>
    <path d="M 96 188 L 96 218" stroke="#666" stroke-width="1.6"/>
    <path d="M 96 252 L 96 282" stroke="#666" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="96" y="112" fill="#446688">root</text>
    <text x="96" y="176" fill="#333">a</text>
    <text x="96" y="240" fill="#3a5a30">b</text>
    <text x="96" y="304" fill="#3a5a30">a</text>
  </g>
  <text x="112" y="146" font-size="10" fill="#888" filter="url(#rough2)">边标字符</text>
  <text x="118" y="166" font-size="10" fill="#446688" filter="url(#rough2)">a</text>
  <text x="118" y="230" font-size="10" fill="#446688" filter="url(#rough2)">b</text>
  <text x="118" y="294" font-size="10" fill="#446688" filter="url(#rough2)">a</text>
  <text x="150" y="240" font-size="10" fill="#4a7a3a" filter="url(#rough2)">★ isEnd：到单词结尾</text>
  <text x="150" y="256" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（ab、aba 都是单词）</text>

  <path d="M 96 316 L 96 342" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="358" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">再遇 b：无子节点 → 失配剪枝</text>

  <!-- 右：text 与扫描 -->
  <text x="256" y="82" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">text =</text>

  <g filter="url(#rough2)">
    <rect x="312" y="66" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="356" y="66" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="400" y="66" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="444" y="66" width="40" height="40" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
    <rect x="488" y="66" width="40" height="40" fill="#fff" stroke="#666" stroke-width="1.4" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="14" text-anchor="middle" font-weight="bold">
    <text x="332" y="91" fill="#3a5a30">a</text>
    <text x="376" y="91" fill="#3a5a30">b</text>
    <text x="420" y="91" fill="#3a5a30">a</text>
    <text x="464" y="91" fill="#333">b</text>
    <text x="508" y="91" fill="#333">a</text>
  </g>
  <g filter="url(#rough2)" font-size="9" text-anchor="middle" fill="#888">
    <text x="332" y="118">0</text>
    <text x="376" y="118">1</text>
    <text x="420" y="118">2</text>
    <text x="464" y="118">3</text>
    <text x="508" y="118">4</text>
  </g>

  <path d="M 296 172 L 328 112" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 296 236 L 372 112" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 296 300 L 416 112" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <path d="M 310 132 L 310 138 L 400 138 L 400 132" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
    <path d="M 310 148 L 310 154 L 440 154 L 440 148" stroke="#4a7a3a" stroke-width="2" fill="none"/>
  </g>
  <text x="452" y="142" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[0,1] = ab ✓</text>
  <text x="452" y="158" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[0,2] = aba ✓</text>

  <rect x="256" y="196" width="276 " height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="394" y="216" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">失配即剪枝（关键性质）</text>
  <text x="394" y="236" text-anchor="middle" font-size="10.5" fill="#555">text[i..j] 不是任何单词的前缀</text>
  <text x="394" y="252" text-anchor="middle" font-size="10.5" fill="#555">⇒ 更长的 text[i..j'] 也必不是（前缀的前缀仍是前缀）</text>

  <rect x="256" y="262" width="276" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="394" y="282" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">输出顺序免费</text>
  <text x="394" y="300" text-anchor="middle" font-size="10.5" fill="#555">外层 i 升序 × 内层 j 升序</text>
  <text x="394" y="316" text-anchor="middle" font-size="10.5" fill="#555">→ 结果天然按 (i, j) 字典序，无需排序</text>

  <text x="280" y="368" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">i = 1 时首字符 b：root 无 b 子节点，起点直接跳过；i = 2 重复 i = 0 的模式 → [2,3]、[2,4]</text>
  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#999">最终输出（天然有序）：[[0,1],[0,2],[2,3],[2,4]]</text>
</svg>
