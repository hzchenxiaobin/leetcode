<svg xmlns="http://www.w3.org/2000/svg" width="520" height="430" viewBox="0 0 520 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="87" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="520" height="430" fill="#fdfcf7"/>
  <text x="260" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一趟从左向右扫描</text>
  <path d="M 110 38 Q 260 47 410 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <rect x="170" y="50" width="80" height="30" rx="15" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="210" y="70" text-anchor="middle" font-size="13" fill="#2b6e9e">开始</text>
  <path d="M 210 80 L 210 96" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="110" y="98" width="200" height="38" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="210" y="122" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace">ans = 0, i = 0</text>
  <path d="M 210 136 L 210 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision 1 -->
  <polygon points="210,154 295,192 210,230 125,192" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="210" y="197" text-anchor="middle" font-size="13" fill="#7a5415" font-family="monospace" filter="url(#sk)">i ≤ n−2 ?</text>

  <!-- no branch: return -->
  <text x="305" y="186" font-size="12" fill="#b85450" font-weight="bold" filter="url(#sk)">否</text>
  <path d="M 295 192 L 358 192" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="360" y="170" width="130" height="44" rx="20" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="425" y="196" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold" font-family="monospace">return ans</text>

  <!-- yes branch -->
  <text x="222" y="246" font-size="12" fill="#4a8e4a" font-weight="bold" filter="url(#sk)">是</text>
  <path d="M 210 230 L 210 248" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- decision 2 -->
  <polygon points="210,250 300,290 210,330 120,290" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6" filter="url(#sk)"/>
  <text x="210" y="294" text-anchor="middle" font-size="11" fill="#7a5415" font-family="monospace" filter="url(#sk)">nums[i] ≥ nums[i+1] ?</text>

  <!-- violation branch -->
  <text x="308" y="282" font-size="12" fill="#b85450" font-weight="bold" filter="url(#sk)">是(违规)</text>
  <path d="M 300 290 L 340 290" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="342" y="270" width="110" height="40" rx="8" fill="#fdeaea" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="397" y="294" text-anchor="middle" font-size="13" fill="#a04340" font-family="monospace">ans = i + 1</text>
  <path d="M 397 310 L 397 368 L 288 368" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- no violation branch -->
  <text x="222" y="346" font-size="12" fill="#4a8e4a" font-weight="bold" filter="url(#sk)">否</text>
  <path d="M 210 330 L 210 348" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- advance -->
  <g filter="url(#sk)">
    <rect x="140" y="350" width="145" height="36" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="212" y="373" text-anchor="middle" font-size="13" fill="#2e6e2e" font-family="monospace">i += 1</text>

  <!-- loop back -->
  <path d="M 140 368 L 48 368 L 48 192 L 121 192" stroke="#4a8e4a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="56" y="275" font-size="11" fill="#4a8e4a" filter="url(#sk)">循环</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="30" y="400" width="460" height="24" rx="6" fill="#fffdf3" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="260" y="416" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">ans 始终 = 当前最右违规位置 + 1；后写覆盖先写，扫完全程即为答案。O(n) / O(1)。</text>
</svg>
