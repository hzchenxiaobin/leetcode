<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">核心观察：每种操作恰好只切换一个边界</text>

  <text x="145" y="58" text-anchor="middle" font-size="12" fill="#446688"
        filter="url(#rough2)">操作① 翻转 [0..1]，成本 i+1 = 2</text>
  <path d="M 98 64 L 98 74 M 190 64 L 190 74 M 98 69 L 190 69"
        stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 148 78 Q 188 98 195 130" stroke="#446688" stroke-width="2"
        fill="none" stroke-linecap="round" marker-end="url(#arrB)"
        filter="url(#rough2)"/>
  <text x="262" y="98" text-anchor="middle" font-size="11.5" fill="#446688"
        filter="url(#rough2)">只切换边界 i = 1</text>

  <text x="144" y="128" text-anchor="middle" font-size="11.5" fill="#4a7a3a"
        filter="url(#rough2)">b0 好</text>
  <text x="196" y="128" text-anchor="middle" font-size="12.5" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">b1 坏</text>
  <text x="248" y="128" text-anchor="middle" font-size="11.5" fill="#4a7a3a"
        filter="url(#rough2)">b2 好</text>

  <line x1="144" y1="136" x2="144" y2="214" stroke="#4a7a3a" stroke-width="1.6"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="196" y1="136" x2="196" y2="214" stroke="#b85450" stroke-width="2.6"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="248" y1="136" x2="248" y2="214" stroke="#4a7a3a" stroke-width="1.6"
        stroke-dasharray="5 4" filter="url(#rough2)"/>

  <rect x="92" y="150" width="52" height="54" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="144" y="150" width="52" height="54" rx="4" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="196" y="150" width="52" height="54" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="150" width="52" height="54" rx="4" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="118" y="179" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#446688" filter="url(#rough2)">0</text>
  <text x="170" y="179" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#446688" filter="url(#rough2)">0</text>
  <text x="222" y="179" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">1</text>
  <text x="274" y="179" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#b85450" filter="url(#rough2)">1</text>

  <text x="118" y="197" text-anchor="middle" font-size="10.5" fill="#999"
        filter="url(#rough2)">0</text>
  <text x="170" y="197" text-anchor="middle" font-size="10.5" fill="#999"
        filter="url(#rough2)">1</text>
  <text x="222" y="197" text-anchor="middle" font-size="10.5" fill="#999"
        filter="url(#rough2)">2</text>
  <text x="274" y="197" text-anchor="middle" font-size="10.5" fill="#999"
        filter="url(#rough2)">3</text>

  <path d="M 240 238 Q 208 226 199 218" stroke="#d6a040" stroke-width="2"
        fill="none" stroke-linecap="round" marker-end="url(#arrO)"
        filter="url(#rough2)"/>
  <text x="150" y="246" text-anchor="middle" font-size="11.5" fill="#d6a040"
        filter="url(#rough2)">只切换边界 i−1 = 1</text>
  <path d="M 202 236 L 202 246 M 296 236 L 296 246 M 202 241 L 296 241"
        stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="230" y="266" text-anchor="middle" font-size="12" fill="#d6a040"
        filter="url(#rough2)">操作② 翻转 [2..3]，成本 n−i = 2</text>

  <text x="337" y="150" font-size="13" font-weight="bold" fill="#333"
        filter="url(#rough2)">消除差异边界 b1</text>
  <text x="337" y="174" font-size="11.5" fill="#333"
        filter="url(#rough2)">① 取 i = 1：翻 [0..1]，花 2</text>
  <text x="337" y="196" font-size="11.5" fill="#333"
        filter="url(#rough2)">② 取 i = 2：翻 [2..3]，花 2</text>
  <text x="337" y="218" font-size="11.5" fill="#333"
        filter="url(#rough2)">两种都恰好只动 b1</text>

  <rect x="330" y="232" width="178" height="34" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="419" y="254" text-anchor="middle" font-size="13" font-weight="bold"
        fill="#4a7a3a" filter="url(#rough2)">单价 = min(2, 2) = 2</text>

  <rect x="68" y="298" width="384" height="50" rx="10" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">翻转区间内部：两侧同翻，差异不变；外部：两侧不翻，也不变</text>
  <text x="260" y="340" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">只有跨越翻转端点的那一个边界被切换（好 ⇄ 坏）</text>
</svg>
