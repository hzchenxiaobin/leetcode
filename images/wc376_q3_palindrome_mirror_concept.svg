<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="640" height="430" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">回文由「前半」镜像生成：值域 2×10⁹ 只有 ~1.2×10⁵ 个</text>
  <path d="M 150 34 Q 320 42 490 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="76" y="92" font-size="12" fill="#555">偶 6 位</text>
  <g filter="url(#sk)"><rect x="160" y="70" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="177" y="92" text-anchor="middle" font-size="13" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="198" y="70" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="215" y="92" text-anchor="middle" font-size="13" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="236" y="70" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="253" y="92" text-anchor="middle" font-size="13" fill="#2b6e9e">3</text>
  <path d="M 288 87 L 316 87" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="330" y="70" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="347" y="92" text-anchor="middle" font-size="13" fill="#2e6e2e">3</text>
  <g filter="url(#sk)"><rect x="368" y="70" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="385" y="92" text-anchor="middle" font-size="13" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="406" y="70" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="423" y="92" text-anchor="middle" font-size="13" fill="#2e6e2e">1</text>
  <text x="492" y="92" font-size="13.5" font-weight="bold" fill="#2b2b2b">= 123321</text>
  <text x="215" y="122" text-anchor="middle" font-size="10.5" fill="#2b6e9e">half（前 3 位）</text>
  <text x="381" y="122" text-anchor="middle" font-size="10.5" fill="#2e6e2e">reverse(half)</text>

  <text x="76" y="166" font-size="12" fill="#555">奇 5 位</text>
  <g filter="url(#sk)"><rect x="160" y="144" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="177" y="166" text-anchor="middle" font-size="13" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="198" y="144" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="215" y="166" text-anchor="middle" font-size="13" fill="#2b6e9e">2</text>
  <g filter="url(#sk)"><rect x="236" y="144" width="34" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="253" y="166" text-anchor="middle" font-size="13" fill="#2b6e9e">3</text>
  <path d="M 288 161 L 316 161" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="330" y="144" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="347" y="166" text-anchor="middle" font-size="13" fill="#2e6e2e">2</text>
  <g filter="url(#sk)"><rect x="368" y="144" width="34" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="385" y="166" text-anchor="middle" font-size="13" fill="#2e6e2e">1</text>
  <text x="442" y="166" font-size="13.5" font-weight="bold" fill="#2b2b2b">= 12321</text>
  <text x="200" y="196" text-anchor="middle" font-size="10.5" fill="#2b6e9e">half（正中字符只出现一次）</text>
  <text x="365" y="196" text-anchor="middle" font-size="10.5" fill="#2e6e2e">reverse(half 去末位)</text>

  <text x="320" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">回文由前 ⌈d/2⌉ 位唯一决定（首位非零）⇒ d 位回文恰有 9 × 10^(⌈d/2⌉−1) 个</text>

  <text x="78" y="256" text-anchor="end" font-size="11" fill="#555">位数 d</text>
  <g filter="url(#sk)"><rect x="90" y="240" width="46" height="24" rx="4" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="113" y="256" text-anchor="middle" font-size="11.5" fill="#555">1</text>
  <g filter="url(#sk)"><rect x="140" y="240" width="46" height="24" rx="4" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="163" y="256" text-anchor="middle" font-size="11.5" fill="#555">2</text>
  <g filter="url(#sk)"><rect x="190" y="240" width="46" height="24" rx="4" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="213" y="256" text-anchor="middle" font-size="11.5" fill="#555">3</text>
  <g filter="url(#sk)"><rect x="240" y="240" width="46" height="24" rx="4" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="263" y="256" text-anchor="middle" font-size="11.5" fill="#555">4</text>
  <g filter="url(#sk)"><rect x="290" y="240" width="46" height="24" rx="4" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="313" y="256" text-anchor="middle" font-size="11.5" fill="#555">5</text>
  <g filter="url(#sk)"><rect x="340" y="240" width="46" height="24" rx="4" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="363" y="256" text-anchor="middle" font-size="11.5" fill="#555">6</text>
  <g filter="url(#sk)"><rect x="390" y="240" width="46" height="24" rx="4" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="413" y="256" text-anchor="middle" font-size="11.5" fill="#555">7</text>
  <g filter="url(#sk)"><rect x="440" y="240" width="46" height="24" rx="4" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="463" y="256" text-anchor="middle" font-size="11.5" fill="#555">8</text>
  <g filter="url(#sk)"><rect x="490" y="240" width="46" height="24" rx="4" fill="#f2f2f0" stroke="#999" stroke-width="1"/></g>
  <text x="513" y="256" text-anchor="middle" font-size="11.5" fill="#555">9</text>
  <g filter="url(#sk)"><rect x="540" y="240" width="46" height="24" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="563" y="256" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">10</text>

  <text x="78" y="282" text-anchor="end" font-size="11" fill="#555">回文个数</text>
  <g filter="url(#sk)"><rect x="90" y="266" width="46" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="113" y="282" text-anchor="middle" font-size="11.5" fill="#2b6e9e">9</text>
  <g filter="url(#sk)"><rect x="140" y="266" width="46" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="163" y="282" text-anchor="middle" font-size="11.5" fill="#2b6e9e">9</text>
  <g filter="url(#sk)"><rect x="190" y="266" width="46" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="213" y="282" text-anchor="middle" font-size="11.5" fill="#2b6e9e">90</text>
  <g filter="url(#sk)"><rect x="240" y="266" width="46" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="263" y="282" text-anchor="middle" font-size="11.5" fill="#2b6e9e">90</text>
  <g filter="url(#sk)"><rect x="290" y="266" width="46" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="313" y="282" text-anchor="middle" font-size="11.5" fill="#2b6e9e">900</text>
  <g filter="url(#sk)"><rect x="340" y="266" width="46" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="363" y="282" text-anchor="middle" font-size="11.5" fill="#2b6e9e">900</text>
  <g filter="url(#sk)"><rect x="390" y="266" width="46" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="413" y="282" text-anchor="middle" font-size="11.5" fill="#2b6e9e">9·10³</text>
  <g filter="url(#sk)"><rect x="440" y="266" width="46" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="463" y="282" text-anchor="middle" font-size="11.5" fill="#2b6e9e">9·10³</text>
  <g filter="url(#sk)"><rect x="490" y="266" width="46" height="24" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1"/></g>
  <text x="513" y="282" text-anchor="middle" font-size="11.5" fill="#2b6e9e">9·10⁴</text>
  <g filter="url(#sk)"><rect x="540" y="266" width="46" height="24" rx="4" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.8"/></g>
  <text x="563" y="282" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">10⁴*</text>

  <text x="320" y="308" text-anchor="middle" font-size="11" fill="#7a5415">* 位数 10 且 ≤ 2×10⁹：half ∈ [10000, 19999]，恰 10⁴ 个</text>
  <text x="320" y="330" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">d ≤ 9 共 109,998 个，再加上第 10 位 ⇒ 总共 119,998 ≈ 1.2×10⁵ 个</text>

  <g filter="url(#sk)"><rect x="60" y="348" width="520" height="62" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="320" y="372" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">枚举全部回文 × 单点 O(log n) 代价 ≈ 2×10⁶ 次基本运算</text>
  <text x="320" y="396" text-anchor="middle" font-size="11.5" fill="#555">排序 O(n log n) 反而是另一头的瓶颈 —— 「回文」这个维度完全不卡</text>
</svg>
