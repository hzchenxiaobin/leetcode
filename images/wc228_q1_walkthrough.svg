<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="341" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="450" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：s = "0100" → min(1, 3) = 1</text>
  <path d="M 190 40 Q 320 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 行 A：0101，末格红 -->
  <text x="100" y="73" text-anchor="end" font-size="13" fill="#2b6e9e" font-weight="bold">A =</text>
  <g filter="url(#sk)" font-size="14">
    <rect x="110" y="52" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="158" y="52" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="206" y="52" width="44" height="32" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
    <rect x="254" y="52" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="132" y="73" text-anchor="middle" fill="#2b6e9e">0</text>
    <text x="180" y="73" text-anchor="middle" fill="#2b6e9e">1</text>
    <text x="228" y="73" text-anchor="middle" fill="#2b6e9e">0</text>
    <text x="276" y="73" text-anchor="middle" fill="#a04348">1</text>
  </g>
  <text x="314" y="73" font-size="12.5" fill="#a04348" font-weight="bold" font-family="monospace">diffA = 1</text>

  <!-- 行 s：0100 -->
  <text x="100" y="111" text-anchor="end" font-size="13" fill="#333" font-weight="bold">s =</text>
  <g filter="url(#sk)" font-size="14">
    <rect x="110" y="90" width="44" height="32" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
    <rect x="158" y="90" width="44" height="32" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
    <rect x="206" y="90" width="44" height="32" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
    <rect x="254" y="90" width="44" height="32" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.3"/>
    <text x="132" y="111" text-anchor="middle" fill="#333">0</text>
    <text x="180" y="111" text-anchor="middle" fill="#333">1</text>
    <text x="228" y="111" text-anchor="middle" fill="#333">0</text>
    <text x="276" y="111" text-anchor="middle" fill="#333">0</text>
  </g>
  <text x="314" y="111" font-size="12.5" fill="#333" font-weight="bold" font-family="monospace">n = 4</text>

  <!-- 行 B：1010，前三格红 -->
  <text x="100" y="149" text-anchor="end" font-size="13" fill="#2e6e2e" font-weight="bold">B =</text>
  <g filter="url(#sk)" font-size="14">
    <rect x="110" y="128" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="158" y="128" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="206" y="128" width="44" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="254" y="128" width="44" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/>
    <text x="132" y="149" text-anchor="middle" fill="#a04348">1</text>
    <text x="180" y="149" text-anchor="middle" fill="#a04348">0</text>
    <text x="228" y="149" text-anchor="middle" fill="#a04348">1</text>
    <text x="276" y="149" text-anchor="middle" fill="#2e6e2e">0</text>
  </g>
  <text x="314" y="149" font-size="12.5" fill="#a04348" font-weight="bold" font-family="monospace">diffB = 3</text>

  <!-- 右侧注 -->
  <g filter="url(#sk)">
    <rect x="410" y="52" width="190" height="108" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.1"/>
  </g>
  <text x="505" y="74" text-anchor="middle" font-size="11.5" fill="#7a5415">每列恰一处红格：</text>
  <text x="505" y="94" text-anchor="middle" font-size="11.5" fill="#7a5415">A 行 1 格（i = 3）</text>
  <text x="505" y="114" text-anchor="middle" font-size="11.5" fill="#7a5415">B 行 3 格（i = 0, 1, 2）</text>
  <text x="505" y="138" text-anchor="middle" font-size="11.5" fill="#7a5415" font-weight="bold">diffA + diffB = 4 = n ✓</text>

  <!-- 演算表 -->
  <g filter="url(#sk)">
    <rect x="60" y="172" width="520" height="26" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <g font-size="12" fill="#2b6e9e" font-weight="bold" font-family="monospace">
    <text x="95" y="189" text-anchor="middle">i</text>
    <text x="180" y="189" text-anchor="middle">s[i]</text>
    <text x="265" y="189" text-anchor="middle">A[i]</text>
    <text x="350" y="189" text-anchor="middle">匹配?</text>
    <text x="440" y="189" text-anchor="middle">B[i]</text>
    <text x="525" y="189" text-anchor="middle">匹配?</text>
  </g>

  <!-- 行1：i=0 与 A 匹配 -->
  <g filter="url(#sk)">
    <rect x="60" y="198" width="520" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
  </g>
  <g font-size="13" font-family="monospace">
    <text x="95" y="220" text-anchor="middle" fill="#333">0</text>
    <text x="180" y="220" text-anchor="middle" fill="#333">0</text>
    <text x="265" y="220" text-anchor="middle" fill="#2b6e9e">0</text>
    <text x="350" y="220" text-anchor="middle" fill="#2e6e2e" font-weight="bold">✓</text>
    <text x="440" y="220" text-anchor="middle" fill="#2e6e2e">1</text>
    <text x="525" y="220" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- 行2：i=1 与 A 匹配 -->
  <g filter="url(#sk)">
    <rect x="60" y="232" width="520" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
  </g>
  <g font-size="13" font-family="monospace">
    <text x="95" y="254" text-anchor="middle" fill="#333">1</text>
    <text x="180" y="254" text-anchor="middle" fill="#333">1</text>
    <text x="265" y="254" text-anchor="middle" fill="#2b6e9e">1</text>
    <text x="350" y="254" text-anchor="middle" fill="#2e6e2e" font-weight="bold">✓</text>
    <text x="440" y="254" text-anchor="middle" fill="#2e6e2e">0</text>
    <text x="525" y="254" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- 行3：i=2 与 A 匹配 -->
  <g filter="url(#sk)">
    <rect x="60" y="266" width="520" height="34" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
  </g>
  <g font-size="13" font-family="monospace">
    <text x="95" y="288" text-anchor="middle" fill="#333">2</text>
    <text x="180" y="288" text-anchor="middle" fill="#333">0</text>
    <text x="265" y="288" text-anchor="middle" fill="#2b6e9e">0</text>
    <text x="350" y="288" text-anchor="middle" fill="#2e6e2e" font-weight="bold">✓</text>
    <text x="440" y="288" text-anchor="middle" fill="#2e6e2e">1</text>
    <text x="525" y="288" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- 行4：i=3 与 B 匹配 -->
  <g filter="url(#sk)">
    <rect x="60" y="300" width="520" height="34" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <g font-size="13" font-family="monospace">
    <text x="95" y="322" text-anchor="middle" fill="#333">3</text>
    <text x="180" y="322" text-anchor="middle" fill="#333">0</text>
    <text x="265" y="322" text-anchor="middle" fill="#2b6e9e">1</text>
    <text x="350" y="322" text-anchor="middle" fill="#b85450" font-weight="bold">✗</text>
    <text x="440" y="322" text-anchor="middle" fill="#2e6e2e">0</text>
    <text x="525" y="322" text-anchor="middle" fill="#2e6e2e" font-weight="bold">✓</text>
  </g>

  <!-- 图例 -->
  <g filter="url(#sk)">
    <rect x="95" y="338" width="16" height="13" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/>
    <rect x="355" y="338" width="16" height="13" rx="3" fill="#fef6e6" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="117" y="349" font-size="11" fill="#555">该列与 A 匹配 → 计入 diffB</text>
  <text x="377" y="349" font-size="11" fill="#555">该列与 B 匹配 → 计入 diffA</text>

  <!-- 结果条 -->
  <g filter="url(#sk)">
    <rect x="90" y="362" width="460" height="74" rx="10" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="320" y="384" text-anchor="middle" font-size="12.5" fill="#7a5415">答案 = min(diffA, diffB) = min(1, 3) = 1</text>
  <text x="320" y="406" text-anchor="middle" font-size="14" fill="#7a5415" font-weight="bold" font-family="monospace">翻转 s[3]：'0' → '1'，"0100" → "0101" ✓</text>
  <text x="320" y="426" text-anchor="middle" font-size="11.5" fill="#7a5415">另一例 s = "1111"：diffA = diffB = 2，两目标代价相同 → 答案 2</text>
</svg>
