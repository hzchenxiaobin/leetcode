<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：一次扫描 + 三个判定</text>

  <!-- 步骤 0：收集差异集 -->
  <rect x="160" y="52" width="240" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">逐位比较 s1[k] 与 s2[k]</text>
  <text x="280" y="90" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">收集差异集 D（超过 2 个提前 false）</text>

  <path d="M280,98 L280,118" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：|D| = 0 ? -->
  <polygon points="280,122 372,158 280,194 188,158" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="163" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">|D| = 0 ?</text>

  <text x="394" y="150" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M372,158 L424,158" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="428" y="141" width="104" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">true（不换）</text>

  <text x="290" y="212" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M280,194 L280,214" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 2：|D| = 2 ? -->
  <polygon points="280,218 372,254 280,290 188,254" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="259" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">|D| = 2 ?</text>

  <text x="394" y="246" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M372,254 L424,254" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="428" y="237" width="104" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">false</text>
  <text x="480" y="266" text-anchor="middle" font-size="9.5" fill="#7a3530" filter="url(#rough2)">（= 1 或 ≥ 3）</text>

  <text x="290" y="308" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M280,290 L280,310" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 3：交叉相等 ? -->
  <polygon points="280,314 400,350 280,386 160,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="347" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">s1[i]=s2[j] 且</text>
  <text x="280" y="365" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">s1[j]=s2[i] ?</text>

  <text x="408" y="342" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M400,350 L444,350" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="448" y="333" width="100" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="498" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d5a2d" filter="url(#rough2)">true</text>

  <text x="136" y="342" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M160,350 L116,350" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="12" y="333" width="100" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="62" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">false</text>
</svg>
