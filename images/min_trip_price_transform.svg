<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心转化：先数频次，再做树上打家劫舍</text>
  <path d="M 150 42 Q 320 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 原问题 -->
  <g filter="url(#sk)"><rect x="80" y="58" width="480" height="56" rx="10" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="320" y="80" text-anchor="middle" font-size="12.5" fill="#2b6e9e">原问题：先把一组非相邻节点的价格减半，</text>
  <text x="320" y="100" text-anchor="middle" font-size="12.5" fill="#2b6e9e">再执行所有旅行，最小化路径价格总和</text>

  <path d="M 320 114 L 320 150" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="335" y="136" font-size="11.5" font-weight="bold" fill="#2e6e2e">树中路径唯一 ⇒ 两个决策可解耦</text>

  <!-- 阶段① -->
  <g filter="url(#sk)"><rect x="40" y="158" width="290" height="100" rx="10" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="185" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">阶段①：统计频次</text>
  <text x="185" y="206" text-anchor="middle" font-size="11.5" fill="#444">freq[v]：节点 v 被路径经过的次数</text>
  <text x="185" y="230" text-anchor="middle" font-size="11.5" fill="#444">total = Σ price[v]·freq[v]</text>

  <!-- 阶段② -->
  <g filter="url(#sk)"><rect x="330" y="158" width="290" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="475" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415">阶段②：选独立集减半</text>
  <text x="475" y="206" text-anchor="middle" font-size="11.5" fill="#444">节省 w[v] = price[v]·freq[v] / 2</text>
  <text x="475" y="230" text-anchor="middle" font-size="11.5" fill="#444">约束：所选节点两两不相邻</text>

  <path d="M 185 258 L 185 290" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 475 258 L 475 290" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 合流 -->
  <g filter="url(#sk)"><rect x="80" y="294" width="480" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="320" y="315" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b03a3a">最大化节省 Σ w[v] = 树上最大权独立集</text>
  <text x="320" y="336" text-anchor="middle" font-size="11.5" fill="#7a3a44">（树形 DP，同打家劫舍 III）</text>

  <!-- 答案 -->
  <g filter="url(#sk)"><rect x="80" y="356" width="480" height="34" rx="8" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="320" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">答案 = total − max(独立集节省)</text>
</svg>
