<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">核心观察：一次「拆分合并」≡ 一次「交换相邻块」</text>

  <!-- 原数组 -->
  <text x="132" y="70" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">原数组</text>
  <rect x="178" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="222" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="244" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="266" y="48" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="288" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <rect x="310" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="354" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="398" y="48" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="288" y="97" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">被抠出的块 B</text>

  <!-- 分流箭头 -->
  <path d="M170,104 L170,124" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M470,104 L470,124" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="118" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">同一次操作的两种等价视角</text>

  <!-- 视角 A -->
  <rect x="30" y="128" width="280" height="192" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="152" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">视角 A：拆出块 → 插入空隙</text>
  <rect x="58" y="168" width="34" height="28" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="96" y="168" width="34" height="28" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="134" y="168" width="34" height="28" rx="4" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="151" y="187" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">空</text>
  <rect x="172" y="168" width="34" height="28" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="189" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="210" y="168" width="34" height="28" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="227" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="248" y="168" width="34" height="28" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <path d="M244,164 L244,200" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M149,160 C149,142 244,142 244,158" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="170" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">↑ 目标空隙（5 与 6 之间）</text>
  <rect x="58" y="226" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="96" y="226" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="134" y="226" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="151" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="172" y="226" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="189" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="210" y="226" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="227" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <rect x="248" y="226" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="170" y="284" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">抠出 B=[3]，剩余 [1,2,4,5,6]</text>
  <text x="170" y="302" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">把 B 整块插进 5 与 6 之间</text>

  <!-- 视角 B -->
  <rect x="330" y="128" width="280" height="192" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="152" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">视角 B：交换两个相邻块</text>
  <rect x="356" y="168" width="74" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="393" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 2</text>
  <rect x="434" y="168" width="36" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="452" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <rect x="474" y="168" width="74" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="511" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4 5</text>
  <rect x="552" y="168" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <path d="M446,162 C462,146 520,146 536,164" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M536,202 C520,216 462,216 448,200" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="491" y="140" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">B 与 C 换位</text>
  <rect x="356" y="226" width="74" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="393" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 2</text>
  <rect x="434" y="226" width="74" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="471" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4 5</text>
  <rect x="512" y="226" width="36" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="530" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d1f" filter="url(#rough2)">3</text>
  <rect x="552" y="226" width="36" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="470" y="284" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">把 B 与紧邻的 C=[4,5] 直接换位</text>
  <text x="470" y="302" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">一次换位 = 一次拆分合并</text>

  <!-- 结论框 -->
  <rect x="70" y="340" width="500" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">两种视角得到的数组一字不差</text>
  <text x="320" y="390" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">一次拆分合并 ≡ 交换两个相邻块（基因组重排中的 transposition）</text>
  <text x="320" y="414" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">等价生成方式：枚举三刀 0 ≤ i ≤ j ≤ k ≤ n，后继 = s[:i] + s[j:k] + s[i:j] + s[k:]</text>
</svg>
