<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：唯一缺口 p，每个单位走环上最短弧</text>
  <text x="260" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 2：balance = [1, 2, -5, 2]，缺口 need = 5</text>

  <!-- 环的骨架边（灰虚线） -->
  <path d="M 283 130 L 385 216" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 385 240 L 283 326" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 237 326 L 139 240" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 139 216 L 237 130" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 中心说明 -->
  <text x="260" y="216" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">环形相邻传递</text>
  <text x="260" y="236" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1 次移动 = 1 单位 × 1 步</text>

  <!-- 两侧汇聚的流：绿色粗箭头 -->
  <path d="M 372 244 L 302 301" fill="none" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="372" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2 单位 × 1 步</text>

  <path d="M 148 244 L 218 301" fill="none" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="148" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2 单位 × 1 步</text>

  <!-- 对跖点：两侧等距 -->
  <path d="M 287 132 L 366 211" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="342" y="150" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">1 单位 × 2 步</text>

  <path d="M 233 132 L 154 211" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="176" y="150" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">两侧等距，任选</text>

  <!-- 节点 -->
  <circle cx="260" cy="118" r="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">+1</text>
  <text x="260" y="132" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">i = 0</text>

  <circle cx="408" cy="228" r="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="224" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">+2</text>
  <text x="408" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">i = 1</text>

  <circle cx="112" cy="228" r="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="224" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">+2</text>
  <text x="112" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">i = 3</text>

  <circle cx="260" cy="338" r="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">−5</text>
  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i = 2 · 缺口 p</text>

  <!-- 结论框 -->
  <rect x="90" y="378" width="340" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="402" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">就近取用：2×1 + 2×1 + 1×2 = 6 ✓</text>
</svg>
