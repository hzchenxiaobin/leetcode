<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a5ea8"/>
    </marker>
  </defs>
  <text x="290.0" y="26.0" font-size="15" fill="#444" text-anchor="middle" font-weight="bold" filter="url(#rough2)">算法流程：两个候选各扫一遍</text>
  <text x="290.0" y="45.0" font-size="11" fill="#888" text-anchor="middle" filter="url(#rough2)">O(n) 时间、O(1) 额外空间</text>
  <rect width="580" height="372" fill="#fafafa"/>
  <rect x="130" y="64" width="320" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="86.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">for v in { tops[0], bottoms[0] }</text>
  <path d="M 290.0 100.0 L 290.0 122.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="122" width="360" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="144.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">扫一遍：rt/rb 计数；某张两面都 ≠v → 否决</text>
  <path d="M 290.0 160.0 L 290.0 182.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="290,182 390,208 290,234 190,208" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290.0" y="213.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ok（每张都含 v）？</text>
  <path d="M 390.0 208.0 L 434.0 208.0" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="440.0" y="212.0" font-size="11" fill="#4a7a3a" text-anchor="start" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="430" y="188" width="146" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="503.0" y="211.6" font-size="10" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ans = min(ans, rt, rb)</text>
  <path d="M 290.0 234.0 L 290.0 258.0" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="298.0" y="252.0" font-size="10" fill="#b85450" text-anchor="start" filter="url(#rough2)">否：该候选作废</text>
  <rect x="150" y="258" width="280" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="280.0" font-size="11" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">取下一个候选（最多 2 个）</text>
  <path d="M 290.0 294.0 L 290.0 316.0" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="316" width="280" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="338.3" font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">ans 仍为 −1 则返回 −1</text>
</svg>
