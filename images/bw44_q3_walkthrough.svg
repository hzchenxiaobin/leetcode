<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 2 数字演算：encoded = [6, 5, 4, 6]，n = 5</text>

  <g filter="url(#rough2)" font-size="13.5" text-anchor="middle">
    <rect x="40" y="48" width="440" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="260" y="73" fill="#446688">total = 1⊕2⊕3⊕4⊕5 = 1</text>

    <rect x="40" y="100" width="440" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="125" fill="#8a6d3b">evenXor = e[0] ⊕ e[2] = 6 ⊕ 4 = 2</text>

    <rect x="40" y="152" width="440" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="260" y="177" fill="#b85450">perm[4] = total ⊕ evenXor = 1 ⊕ 2 = 3</text>
  </g>

  <text x="260" y="226" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">再从右往左逐个回推：</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="50" y="244" width="80" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="90" y="266" fill="#4a7a3a">2 = 4⊕6</text>
    <rect x="145" y="244" width="80" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="185" y="266" fill="#4a7a3a">4 = 1⊕5</text>
    <rect x="240" y="244" width="80" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="280" y="266" fill="#4a7a3a">1 = 5⊕4</text>
    <rect x="335" y="244" width="80" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="375" y="266" fill="#4a7a3a">5 = 3⊕6</text>
    <rect x="430" y="244" width="40" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="450" y="266" fill="#8a6d3b">3</text>
  </g>
  <path d="M410,268 L340,268" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="300" width="240" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">perm = [2, 4, 1, 5, 3] ✓</text>
</svg>
