<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两重合法性检查与状态转移</text>
  <text x="310" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">行内：不能左右相邻　·　邻行：不能对角相邻　·　两行以外互不影响</text>

  <!-- ① 行内检查 -->
  <g filter="url(#rough2)">
    <rect x="34" y="70" width="256" height="140" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
    <text x="48" y="92" font-size="11.5" fill="#2f4a6a" font-weight="bold">① 行内：不能左右相邻</text>
  </g>
  <g filter="url(#rough2)" stroke-width="1.3">
    <rect x="48" y="106" width="26" height="26" fill="#ffffff" stroke="#8aa0b8" rx="3"/>
    <rect x="76" y="106" width="26" height="26" fill="#c7d8ea" stroke="#446688" rx="3"/>
    <rect x="104" y="106" width="26" height="26" fill="#ffffff" stroke="#8aa0b8" rx="3"/>
    <rect x="132" y="106" width="26" height="26" fill="#f3c9c4" stroke="#b85450" stroke-width="2" rx="3"/>
    <rect x="160" y="106" width="26" height="26" fill="#f3c9c4" stroke="#b85450" stroke-width="2" rx="3"/>
    <rect x="188" y="106" width="26" height="26" fill="#ffffff" stroke="#8aa0b8" rx="3"/>
  </g>
  <g filter="url(#rough2)">
    <text x="61" y="124" text-anchor="middle" font-size="10" fill="#666">c0</text>
    <text x="89" y="124" text-anchor="middle" font-size="10" fill="#2f4a6a">c1</text>
    <text x="117" y="124" text-anchor="middle" font-size="10" fill="#666">c2</text>
    <text x="145" y="124" text-anchor="middle" font-size="10" fill="#8c3b38">c3</text>
    <text x="173" y="124" text-anchor="middle" font-size="10" fill="#8c3b38">c4</text>
    <text x="201" y="124" text-anchor="middle" font-size="10" fill="#666">c5</text>
    <text x="48" y="160" font-size="11" fill="#8c3b38">掩码 011010：c3 与 c4 相邻 → 非法</text>
    <text x="48" y="184" font-size="11.5" fill="#2f4a6a">判定：s &amp; (s &lt;&lt; 1) == 0</text>
    <text x="48" y="202" font-size="10" fill="#6a7f95">等价于 (s &amp; (s &gt;&gt; 1)) == 0</text>
  </g>

  <!-- ② 跨行检查 -->
  <g filter="url(#rough2)">
    <rect x="306" y="70" width="280" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
    <text x="320" y="92" font-size="11.5" fill="#8a6a20" font-weight="bold">② 邻行：不能对角相邻</text>
  </g>
  <g filter="url(#rough2)" stroke-width="1.3">
    <rect x="336" y="104" width="22" height="22" fill="#ffffff" stroke="#c9a55a" rx="3"/>
    <rect x="360" y="104" width="22" height="22" fill="#f0dcae" stroke="#8a6a20" rx="3"/>
    <rect x="384" y="104" width="22" height="22" fill="#ffffff" stroke="#c9a55a" rx="3"/>
    <rect x="408" y="104" width="22" height="22" fill="#ffffff" stroke="#c9a55a" rx="3"/>
    <rect x="432" y="104" width="22" height="22" fill="#f0dcae" stroke="#8a6a20" rx="3"/>
    <rect x="456" y="104" width="22" height="22" fill="#ffffff" stroke="#c9a55a" rx="3"/>

    <rect x="336" y="150" width="22" height="22" fill="#f0dcae" stroke="#8a6a20" rx="3"/>
    <rect x="360" y="150" width="22" height="22" fill="#ffffff" stroke="#c9a55a" rx="3"/>
    <rect x="384" y="150" width="22" height="22" fill="#ffffff" stroke="#c9a55a" rx="3"/>
    <rect x="408" y="150" width="22" height="22" fill="#ffffff" stroke="#c9a55a" rx="3"/>
    <rect x="432" y="150" width="22" height="22" fill="#ffffff" stroke="#c9a55a" rx="3"/>
    <rect x="456" y="150" width="22" height="22" fill="#f0dcae" stroke="#8a6a20" rx="3"/>
  </g>
  <g filter="url(#rough2)">
    <text x="313" y="120" font-size="10" fill="#8a6a20">p</text>
    <text x="313" y="166" font-size="10" fill="#8a6a20">s</text>
  </g>
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="1.5" fill="none">
    <path d="M 374 128 L 348 148" marker-end="url(#arrR)"/>
    <path d="M 444 128 L 468 148" marker-end="url(#arrR)"/>
  </g>
  <g filter="url(#rough2)">
    <text x="490" y="122" font-size="10" fill="#8c3b38">对角冲突</text>
    <text x="490" y="140" font-size="9.5" fill="#8a6a20">红箭头</text>
    <text x="320" y="190" font-size="11" fill="#8c3b38">p 的 c1 / c4 正对角对着 s 的 c0 / c5</text>
    <text x="320" y="206" font-size="9.5" fill="#8a6a20">（这对组合不可行，不能从 p 转移到 s）</text>
  </g>

  <!-- 转移公式 -->
  <g filter="url(#rough2)">
    <rect x="120" y="228" width="380" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="310" y="255" text-anchor="middle" font-size="13" fill="#2f5a2f">dp[r][s] = popcount(s) + max dp[r−1][p]</text>
  </g>
  <path d="M 310 212 L 310 226" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 流程 -->
  <g filter="url(#rough2)">
    <rect x="36" y="292" width="126" height="56" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="99" y="313" text-anchor="middle" font-size="10.5" fill="#2f4a6a">枚举本行掩码 s</text>
    <text x="99" y="332" text-anchor="middle" font-size="10" fill="#6a7f95">要求 s ⊆ 可用座位</text>

    <rect x="180" y="292" width="126" height="56" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="243" y="313" text-anchor="middle" font-size="10.5" fill="#2f4a6a">检查行内合法</text>
    <text x="243" y="332" text-anchor="middle" font-size="10" fill="#6a7f95">s &amp; (s&lt;&lt;1) == 0</text>

    <rect x="324" y="292" width="126" height="56" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8"/>
    <text x="387" y="313" text-anchor="middle" font-size="10.5" fill="#2f4a6a">扫上一行所有 p</text>
    <text x="387" y="332" text-anchor="middle" font-size="10" fill="#6a7f95">取兼容者的最大值</text>

    <rect x="468" y="292" width="118" height="56" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="527" y="313" text-anchor="middle" font-size="10.5" fill="#8a6a20">加上 popcount</text>
    <text x="527" y="332" text-anchor="middle" font-size="10" fill="#8a6a20">写入 dp[r][s]</text>
  </g>
  <g filter="url(#rough2)" stroke="#666" stroke-width="1.4" fill="none">
    <path d="M 164 320 L 176 320" marker-end="url(#arr)"/>
    <path d="M 308 320 L 320 320" marker-end="url(#arr)"/>
    <path d="M 452 320 L 464 320" marker-end="url(#arr)"/>
  </g>

  <g filter="url(#rough2)">
    <text x="310" y="382" text-anchor="middle" font-size="11" fill="#555">答案 = 最后一行所有状态 dp[m−1][s] 的最大值（第 m 行之外无人可看）</text>
    <text x="310" y="404" text-anchor="middle" font-size="10" fill="#888">总状态数 m · 2^n，每次转移扫上一行的合法掩码，n ≤ 8 时远低于 10^7</text>
  </g>
</svg>
