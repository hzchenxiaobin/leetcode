<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text filter="url(#rough2)" x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序一次 + 逐个「插入到下标 k」</text>
  <text filter="url(#rough2)" x="290" y="48" text-anchor="middle" font-size="11" fill="#888">排序键 (-h, k)：身高降序；同身高时 k 升序（相等时先插 k 小的）</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="160" y="72" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="290" y="99" fill="#3a4a66">① 排序：身高降序，同身高 k 升序</text>
    <rect x="160" y="138" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="290" y="165" fill="#8a6a20">② 取下一个 (h, k)</text>
    <rect x="160" y="204" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8"/>
    <text x="290" y="231" fill="#3a5a30">③ 插到下标 k：res.insert(k, (h,k))</text>
    <rect x="160" y="270" width="260" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="290" y="297" fill="#8a3a36">④ 全部插完 → 返回 res</text>
  </g>

  <path d="M 290 116 L 290 134" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 182 L 290 200" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 248 L 290 266" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 420 226 L 470 226 L 470 160 L 424 160" stroke="#b85450" stroke-width="1.5"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="500" y="196" text-anchor="middle" font-size="9.5" fill="#b85450">重复 n 次</text>

  <rect x="40" y="330" width="250" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="54" y="352" font-size="11" fill="#3a5a30" font-weight="bold">不变量</text>
  <text filter="url(#rough2)" x="54" y="372" font-size="9.8" fill="#555">res 中每个人的 k 都已满足</text>
  <text filter="url(#rough2)" x="54" y="390" font-size="9.8" fill="#555">后插的人不会改写别人的计数</text>

  <rect x="310" y="330" width="230" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text filter="url(#rough2)" x="324" y="352" font-size="11" fill="#8a6a20" font-weight="bold">复杂度</text>
  <text filter="url(#rough2)" x="324" y="372" font-size="9.8" fill="#555">排序 O(n log n)，插入 O(n²)</text>
  <text filter="url(#rough2)" x="324" y="390" font-size="9.8" fill="#555">总 O(n²)，空间 O(n)</text>
</svg>
