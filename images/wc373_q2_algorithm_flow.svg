<svg xmlns="http://www.w3.org/2000/svg" width="620" height="470" viewBox="0 0 620 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/></marker>
  </defs>
  <rect width="620" height="470" fill="#fdfcf7"/>
  <text x="310" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：固定左端点 i，增量扫描右端点 j</text>
  <path d="M 150 34 Q 310 42 470 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- A：外层循环 -->
  <g filter="url(#sk)"><rect x="100" y="46" width="200" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="200" y="67" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">外层：枚举左端点 i</text>
  <path d="M 200 80 L 200 96" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- B：清零 -->
  <g filter="url(#sk)"><rect x="100" y="100" width="200" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="200" y="121" text-anchor="middle" font-size="12" fill="#333">v = 0（元音计数清零）</text>
  <path d="M 200 134 L 200 150" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- C：内层循环 -->
  <g filter="url(#sk)"><rect x="100" y="154" width="200" height="34" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="200" y="175" text-anchor="middle" font-size="12.5" fill="#2b6e9e" font-weight="bold">内层：j = i → n−1</text>
  <path d="M 200 188 L 200 204" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- D：增量维护 -->
  <g filter="url(#sk)"><rect x="80" y="208" width="240" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="200" y="230" text-anchor="middle" font-size="12" fill="#7a5415">v += is_vowel(s[j])，L = j−i+1</text>
  <path d="M 200 244 L 200 258" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- E：菱形 2v==L -->
  <g filter="url(#sk)"><polygon points="200,260 275,294 200,328 125,294" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="200" y="298" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">2v == L ?</text>
  <text x="288" y="288" font-size="11" fill="#666">否</text>
  <path d="M 200 328 L 200 344" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="208" y="342" font-size="11" fill="#666">是</text>

  <!-- F：菱形 v²%k -->
  <g filter="url(#sk)"><polygon points="200,346 275,380 200,414 125,380" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="200" y="384" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold">v² % k == 0 ?</text>
  <text x="288" y="374" font-size="11" fill="#666">否</text>
  <text x="110" y="374" font-size="11" fill="#666">是</text>

  <!-- G：ans++ -->
  <path d="M 125 380 L 100 380" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="16" y="364" width="82" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="57" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c3a36">ans++</text>

  <!-- 回流线：j++ -->
  <path d="M 275 294 L 430 294" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 275 380 L 430 380" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 57 396 L 57 424 L 430 424" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 430 424 L 430 171" stroke="#888" stroke-width="1.2" fill="none" filter="url(#sk)"/>
  <path d="M 430 171 L 306 171" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="424" y="266" text-anchor="end" font-size="11" fill="#888">j++</text>
  <text x="424" y="282" text-anchor="end" font-size="10.5" fill="#999">（子串加长）</text>

  <!-- 右侧注释框 1 -->
  <g filter="url(#sk)"><rect x="470" y="200" width="136" height="118" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="538" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">每步 O(1)</text>
  <text x="538" y="244" text-anchor="middle" font-size="10.5" fill="#333">一次加法维护 v</text>
  <text x="538" y="262" text-anchor="middle" font-size="10.5" fill="#333">两次标量判定</text>
  <text x="538" y="286" text-anchor="middle" font-size="10.5" fill="#666">子串共 n(n+1)/2</text>
  <text x="538" y="304" text-anchor="middle" font-size="10.5" fill="#666">≈ 5×10⁵ 个</text>

  <!-- 右侧注释框 2 -->
  <g filter="url(#sk)"><rect x="470" y="334" width="136" height="110" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="538" y="356" text-anchor="middle" font-size="12" font-weight="bold" fill="#a06a10">对照暴力</text>
  <text x="538" y="378" text-anchor="middle" font-size="10.5" fill="#333">重算元音 O(n³)</text>
  <text x="538" y="396" text-anchor="middle" font-size="10.5" fill="#333">≈ 10⁹ 超时</text>
  <text x="538" y="420" text-anchor="middle" font-size="10.5" fill="#666">先 2v==L 短路最省</text>

  <!-- 底部总结 -->
  <text x="310" y="460" text-anchor="middle" font-size="12" fill="#666">内层走完 i++ 换起点；全部走完返回 ans —— O(n²) 时间 · O(1) 空间</text>
</svg>
