<svg xmlns="http://www.w3.org/2000/svg" width="640" height="540" viewBox="0 0 640 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="540" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：单趟循环，每轮两个赋值</text>
  <path d="M 190 42 Q 320 50 450 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 开始 -->
  <g filter="url(#sk)"><rect x="230" y="62" width="180" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="320" y="87" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">新建长度 2n 的数组 ans</text>
  <path d="M 320 102 L 320 122" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#af)"/>

  <!-- i = 0 -->
  <g filter="url(#sk)"><rect x="270" y="126" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">i = 0</text>
  <path d="M 320 160 L 320 180" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#af)"/>

  <!-- 判断菱形 -->
  <g filter="url(#sk)"><polygon points="320,184 425,224 320,264 215,224" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="320" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">i &lt; n ?</text>

  <!-- 否 → 返回 -->
  <path d="M 215 224 L 164 224" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#af)"/>
  <text x="189" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">否</text>
  <g filter="url(#sk)"><rect x="30" y="204" width="130" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="95" y="229" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e">返回 ans</text>

  <!-- 是 → 循环体 -->
  <path d="M 320 264 L 320 284" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#af)"/>
  <text x="333" y="279" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">是</text>

  <g filter="url(#sk)"><rect x="200" y="288" width="240" height="66" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="320" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">ans[i] = nums[i]</text>
  <text x="320" y="337" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">ans[i+n] = nums[n−1−i]</text>
  <path d="M 320 354 L 320 374" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#sk)" marker-end="url(#af)"/>

  <!-- 侧注 -->
  <g filter="url(#sk)"><rect x="420" y="292" width="125" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="482" y="313" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">每轮同时填</text>
  <text x="482" y="332" text-anchor="middle" font-size="11" fill="#444">左半一格 + 右半一格</text>

  <!-- i = i + 1 -->
  <g filter="url(#sk)"><rect x="270" y="378" width="100" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">i = i + 1</text>

  <!-- 回到判断 -->
  <path d="M 372 395 L 560 395 L 560 224 L 431 224" stroke="#446688" stroke-width="1.8" stroke-dasharray="6 5" fill="none" filter="url(#sk)" marker-end="url(#af)"/>
  <text x="568" y="312" text-anchor="start" font-size="10" fill="#888">回到判断</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="90" y="455" width="460" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="475" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">n 轮循环恰好覆盖全部 2n 个下标——无重复、无遗漏</text>
  <text x="320" y="495" text-anchor="middle" font-size="11" fill="#444">n = 1 时唯一一轮填 ans[0] = ans[1] = nums[0]，无需特判</text>
</svg>
