<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="aro" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="660" height="440" fill="#fdfcf7"/>
  <text x="330" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">演算：dictionary 逐词加密建表，decrypt 一次命中</text>
  <path d="M 110 40 Q 330 48 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="330" y="60" text-anchor="middle" font-size="12" fill="#888">映射：a→ei，b→zf，c→ei，d→am（同密文的词相邻排列，便于展示合并）</text>

  <text x="115" y="84" text-anchor="middle" font-size="12" fill="#888">dictionary 明文</text>
  <text x="500" y="84" text-anchor="middle" font-size="12" fill="#888">cnt：密文 → 计数</text>

  <g filter="url(#sk)">
    <rect x="70" y="96" width="90" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="70" y="130" width="90" height="28" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
    <rect x="70" y="164" width="90" height="28" rx="6" fill="#f3f2ec" stroke="#b9b39f" stroke-width="1"/>
    <rect x="70" y="198" width="90" height="28" rx="6" fill="#f3f2ec" stroke="#b9b39f" stroke-width="1"/>
    <rect x="70" y="232" width="90" height="28" rx="6" fill="#f3f2ec" stroke="#b9b39f" stroke-width="1"/>
    <rect x="70" y="266" width="90" height="28" rx="6" fill="#f3f2ec" stroke="#b9b39f" stroke-width="1"/>
    <rect x="70" y="300" width="90" height="28" rx="6" fill="#f3f2ec" stroke="#b9b39f" stroke-width="1"/>
    <rect x="70" y="334" width="90" height="28" rx="6" fill="#f3f2ec" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="115" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" font-family="monospace">abcd</text>
  <text x="115" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e" font-family="monospace">abad</text>
  <text x="115" y="183" text-anchor="middle" font-size="13" fill="#888" font-family="monospace">acbd</text>
  <text x="115" y="217" text-anchor="middle" font-size="13" fill="#888" font-family="monospace">adbc</text>
  <text x="115" y="251" text-anchor="middle" font-size="13" fill="#888" font-family="monospace">badc</text>
  <text x="115" y="285" text-anchor="middle" font-size="13" fill="#888" font-family="monospace">dacb</text>
  <text x="115" y="319" text-anchor="middle" font-size="13" fill="#888" font-family="monospace">cadb</text>
  <text x="115" y="353" text-anchor="middle" font-size="13" fill="#888" font-family="monospace">cbda</text>

  <path d="M 164 110 L 402 112" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <path d="M 164 144 L 402 140" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <path d="M 164 178 L 404 178" stroke="#b9b39f" stroke-width="1.3" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <path d="M 164 212 L 404 212" stroke="#b9b39f" stroke-width="1.3" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <path d="M 164 246 L 404 246" stroke="#b9b39f" stroke-width="1.3" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <path d="M 164 280 L 404 280" stroke="#b9b39f" stroke-width="1.3" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <path d="M 164 314 L 404 314" stroke="#b9b39f" stroke-width="1.3" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <path d="M 164 348 L 404 348" stroke="#b9b39f" stroke-width="1.3" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="410" y="96" width="180" height="62" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.2"/>
    <rect x="410" y="164" width="180" height="28" rx="6" fill="#f3f2ec" stroke="#b9b39f" stroke-width="1"/>
    <rect x="410" y="198" width="180" height="28" rx="6" fill="#f3f2ec" stroke="#b9b39f" stroke-width="1"/>
    <rect x="410" y="232" width="180" height="28" rx="6" fill="#f3f2ec" stroke="#b9b39f" stroke-width="1"/>
    <rect x="410" y="266" width="180" height="28" rx="6" fill="#f3f2ec" stroke="#b9b39f" stroke-width="1"/>
    <rect x="410" y="300" width="180" height="28" rx="6" fill="#f3f2ec" stroke="#b9b39f" stroke-width="1"/>
    <rect x="410" y="334" width="180" height="28" rx="6" fill="#f3f2ec" stroke="#b9b39f" stroke-width="1"/>
  </g>
  <text x="500" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" font-family="monospace">eizfeiam</text>
  <text x="500" y="134" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e">计数 ×2（两词同密文）</text>
  <text x="500" y="151" text-anchor="middle" font-size="10.5" fill="#4a7a3a">第 3 位 'a'/'c' 皆加密成 "ei"</text>
  <text x="500" y="183" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">eieizfam ×1</text>
  <text x="500" y="217" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">eiamzfei ×1</text>
  <text x="500" y="251" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">zfeiamei ×1</text>
  <text x="500" y="285" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">ameieizf ×1</text>
  <text x="500" y="319" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">eieiamzf ×1</text>
  <text x="500" y="353" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">eizfamei ×1</text>

  <g filter="url(#sk)">
    <rect x="60" y="380" width="540" height="44" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="330" y="398" text-anchor="middle" font-size="11.5" fill="#7a5415">decrypt("eizfeiam")：每段 ei 二选一，共 4 个候选串 abad / abcd / cbad / cbcd</text>
  <text x="330" y="416" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7a5415">其中 abad、abcd 在 dictionary 中 → cnt["eizfeiam"] = 2 → 返回 2 ✓</text>
</svg>
