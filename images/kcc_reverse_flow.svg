<svg xmlns="http://www.w3.org/2000/svg" width="940" height="680" viewBox="0 0 940 680" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="940" height="680" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：逆向 Kruskal —— 候选 t 从最大时间一路向下压</text>
  <path d="M 230 42 Q 470 50 710 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ① 排序 -->
  <g filter="url(#sk)">
    <rect x="330" y="64" width="280" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="470" y="93" text-anchor="middle" font-size="14" fill="#2b4a6e" filter="url(#sk)">① 边按 time 从大到小排序</text>

  <g filter="url(#sk)">
    <line x1="470" y1="110" x2="470" y2="130" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- ② 初始化 -->
  <g filter="url(#sk)">
    <rect x="320" y="134" width="300" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="470" y="158" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">② comp = n（视为边全部删光）</text>
  <text x="470" y="180" text-anchor="middle" font-size="13" fill="#2b4a6e" filter="url(#sk)">ans = 最大 time（无边则为 0）</text>

  <g filter="url(#sk)">
    <line x1="470" y1="190" x2="470" y2="210" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- ③ 加回一组 -->
  <g filter="url(#sk)">
    <rect x="300" y="214" width="340" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="470" y="238" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">③ 加回下一组 time 相同的边</text>
  <text x="470" y="262" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">两端不同根 → 合并，comp − 1</text>

  <g filter="url(#sk)">
    <line x1="470" y1="276" x2="470" y2="298" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- ④ 判定菱形 -->
  <g filter="url(#sk)">
    <polygon points="470,302 650,356 470,410 290,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="470" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6a1a" filter="url(#sk)">comp ≥ k ?</text>

  <!-- 是：继续压低 -->
  <g filter="url(#sk)">
    <line x1="650" y1="356" x2="716" y2="356" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="680" y="346" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="720" y="326" width="198" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="819" y="352" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">ans = 下一个更小的 time</text>
  <text x="819" y="376" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">（没有了则 0）</text>

  <!-- 回到 ③ 的回边 -->
  <g filter="url(#sk)">
    <path d="M 819 326 Q 819 246 646 244" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  </g>
  <text x="878" y="288" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">继续</text>
  <text x="878" y="304" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">下一组</text>

  <!-- 否：break -->
  <g filter="url(#sk)">
    <line x1="470" y1="410" x2="470" y2="434" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>
  <text x="492" y="430" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="360" y="438" width="220" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="470" y="462" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#sk)">break：ans 停在</text>
  <text x="470" y="484" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#sk)">最后一个可行候选</text>

  <g filter="url(#sk)">
    <line x1="470" y1="496" x2="470" y2="516" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <!-- 返回 -->
  <g filter="url(#sk)">
    <rect x="380" y="520" width="180" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="470" y="547" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">返回 ans</text>

  <!-- 底部要点 -->
  <g filter="url(#sk)">
    <rect x="60" y="588" width="820" height="72" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5 3"/>
  </g>
  <text x="470" y="614" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">💡 并查集只会「加边合并」，不会「删边分裂」——把删除倒过来变成添加，一趟扫描就够</text>
  <text x="470" y="640" text-anchor="middle" font-size="12" fill="#555" filter="url(#sk)">同一 time 的边必须成组加回之后，再统一判定候选 t 能否继续压低</text>
</svg>
