<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="680" height="450" fill="#fdfcf7"/>
  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 2 演算：两个工件都能提取</text>
  <path d="M 150 44 Q 340 54 530 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="340" y="64" text-anchor="middle" font-size="12" fill="#888">n = 2，artifacts = [[0,0,0,0],[0,1,1,1]]，dig = [(0,0),(0,1),(1,1)]</text>

  <!-- 左侧 2x2 网格 -->
  <g filter="url(#sk)">
    <rect x="70" y="100" width="80" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="110" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#a04038" filter="url(#sk)">A</text>
  <text x="110" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#a04038" filter="url(#sk)">D</text>

  <g filter="url(#sk)">
    <rect x="150" y="100" width="80" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="190" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#33475e" filter="url(#sk)">B</text>
  <text x="190" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#33475e" filter="url(#sk)">D</text>

  <g filter="url(#sk)">
    <rect x="70" y="180" width="80" height="80" fill="#f4f4ee" stroke="#8a8a8a" stroke-width="1.2"/>
  </g>
  <text x="110" y="224" text-anchor="middle" font-size="14" fill="#999" filter="url(#sk)">空</text>

  <g filter="url(#sk)">
    <rect x="150" y="180" width="80" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="190" y="216" text-anchor="middle" font-size="16" font-weight="bold" fill="#33475e" filter="url(#sk)">B</text>
  <text x="190" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#33475e" filter="url(#sk)">D</text>

  <text x="110" y="284" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">c=0</text>
  <text x="190" y="284" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">c=1</text>
  <text x="56" y="144" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">r=0</text>
  <text x="56" y="224" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">r=1</text>

  <g filter="url(#sk)">
    <rect x="56" y="304" width="190" height="52" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="151" y="325" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">dug 标记：3 格全建好</text>
  <text x="151" y="344" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">查询任意 (r, c) 是否被挖 → O(1)</text>

  <!-- 右侧判定表格 -->
  <g filter="url(#sk)">
    <rect x="286" y="100" width="90" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="376" y="100" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="506" y="100" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="562" y="100" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="618" y="100" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="331" y="122" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475e" filter="url(#sk)">工件</text>
  <text x="441" y="122" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475e" filter="url(#sk)">覆盖格子</text>
  <text x="534" y="122" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475e" filter="url(#sk)">tot</text>
  <text x="590" y="122" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475e" filter="url(#sk)">被挖</text>
  <text x="644" y="122" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33475e" filter="url(#sk)">提取?</text>

  <!-- 行 A -->
  <g filter="url(#sk)">
    <rect x="286" y="134" width="90" height="42" fill="#fdfcf7" stroke="#8a8a8a" stroke-width="1"/>
    <rect x="376" y="134" width="130" height="42" fill="#fdfcf7" stroke="#8a8a8a" stroke-width="1"/>
    <rect x="506" y="134" width="56" height="42" fill="#fdfcf7" stroke="#8a8a8a" stroke-width="1"/>
    <rect x="562" y="134" width="56" height="42" fill="#fdfcf7" stroke="#8a8a8a" stroke-width="1"/>
    <rect x="618" y="134" width="52" height="42" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="331" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#a04038" filter="url(#sk)">A (红)</text>
  <text x="441" y="160" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">(0,0)</text>
  <text x="534" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>
  <text x="590" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>
  <text x="644" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>

  <!-- 行 B -->
  <g filter="url(#sk)">
    <rect x="286" y="176" width="90" height="42" fill="#fdfcf7" stroke="#8a8a8a" stroke-width="1"/>
    <rect x="376" y="176" width="130" height="42" fill="#fdfcf7" stroke="#8a8a8a" stroke-width="1"/>
    <rect x="506" y="176" width="56" height="42" fill="#fdfcf7" stroke="#8a8a8a" stroke-width="1"/>
    <rect x="562" y="176" width="56" height="42" fill="#fdfcf7" stroke="#8a8a8a" stroke-width="1"/>
    <rect x="618" y="176" width="52" height="42" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="331" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475e" filter="url(#sk)">B (蓝)</text>
  <text x="441" y="196" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#sk)">(0,1) (1,1)</text>
  <text x="441" y="212" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#sk)">1×2 竖条</text>
  <text x="534" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <text x="590" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>
  <text x="644" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>

  <!-- 空格说明 -->
  <g filter="url(#sk)">
    <rect x="286" y="240" width="384" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="478" y="264" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">格子 (1,0) 没被挖，但它不属于任何工件</text>
  <text x="478" y="286" text-anchor="middle" font-size="12" fill="#556" filter="url(#sk)">dig 里的空格只是白挖，不影响任何工件的判定</text>

  <g filter="url(#sk)">
    <rect x="286" y="320" width="384" height="56" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="478" y="343" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">A: 1/1 ✓ + B: 2/2 ✓ → ans = 2</text>
  <text x="478" y="364" text-anchor="middle" font-size="11.5" fill="#556" filter="url(#sk)">覆盖格全部被挖 ⇒ 两件工件都裸露，均可提取</text>

  <text x="340" y="432" text-anchor="middle" font-size="12" fill="#888" filter="url(#sk)">反向计数版：tot[i] 记工件格数，cnt[i] 记被挖格数，cnt == tot 即提取</text>
</svg>
