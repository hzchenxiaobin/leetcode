<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">逐元素判定表：一次遍历即可求和</text>
  <text x="300" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">nums = [1, 3, 2, 1, 5, 4]，k = 2</text>

  <g filter="url(#rough2)">
    <rect x="40" y="64" width="530" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <rect x="40" y="92" width="530" height="192" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#3a4a66" font-weight="bold">
    <text x="58" y="83" filter="url(#rough2)">i</text>
    <text x="106" y="83" filter="url(#rough2)">nums[i]</text>
    <text x="190" y="83" filter="url(#rough2)">nums[i−k]</text>
    <text x="300" y="83" filter="url(#rough2)">nums[i+k]</text>
    <text x="410" y="83" filter="url(#rough2)">严格大于两个邻居？</text>
    <text x="530" y="83" filter="url(#rough2)">计入</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5">
    <text x="58" y="118" fill="#666" filter="url(#rough2)">0</text>
    <text x="106" y="118" fill="#444" filter="url(#rough2)">1</text>
    <text x="190" y="118" fill="#999" filter="url(#rough2)">不存在</text>
    <text x="300" y="118" fill="#444" filter="url(#rough2)">2（i=2）</text>
    <text x="410" y="118" fill="#b85450" filter="url(#rough2)">1 &gt; 2 ✗</text>
    <text x="530" y="118" fill="#999" filter="url(#rough2)">—</text>
    <line x1="44" y1="126" x2="566" y2="126" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

    <rect x="44" y="130" width="522" height="24" fill="#e6f4ea" rx="4" filter="url(#rough2)"/>
    <text x="58" y="147" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="106" y="147" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">3</text>
    <text x="190" y="147" fill="#3a5a30" filter="url(#rough2)">不存在</text>
    <text x="300" y="147" fill="#3a5a30" filter="url(#rough2)">1（i=3）</text>
    <text x="410" y="147" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">3 &gt; 1 ✓</text>
    <text x="530" y="147" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">+3</text>
    <line x1="44" y1="158" x2="566" y2="158" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

    <text x="58" y="178" fill="#666" filter="url(#rough2)">2</text>
    <text x="106" y="178" fill="#444" filter="url(#rough2)">2</text>
    <text x="190" y="178" fill="#444" filter="url(#rough2)">1（i=0）</text>
    <text x="300" y="178" fill="#444" filter="url(#rough2)">5（i=4）</text>
    <text x="410" y="178" fill="#b85450" filter="url(#rough2)">2 &gt; 5 ✗</text>
    <text x="530" y="178" fill="#999" filter="url(#rough2)">—</text>
    <line x1="44" y1="186" x2="566" y2="186" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

    <text x="58" y="206" fill="#666" filter="url(#rough2)">3</text>
    <text x="106" y="206" fill="#444" filter="url(#rough2)">1</text>
    <text x="190" y="206" fill="#444" filter="url(#rough2)">3（i=1）</text>
    <text x="300" y="206" fill="#444" filter="url(#rough2)">4（i=5）</text>
    <text x="410" y="206" fill="#b85450" filter="url(#rough2)">1 &gt; 3 ✗</text>
    <text x="530" y="206" fill="#999" filter="url(#rough2)">—</text>
    <line x1="44" y1="214" x2="566" y2="214" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

    <rect x="44" y="218" width="522" height="24" fill="#e6f4ea" rx="4" filter="url(#rough2)"/>
    <text x="58" y="235" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">4</text>
    <text x="106" y="235" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">5</text>
    <text x="190" y="235" fill="#3a5a30" filter="url(#rough2)">2（i=2）</text>
    <text x="300" y="235" fill="#3a5a30" filter="url(#rough2)">不存在</text>
    <text x="410" y="235" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">5 &gt; 2 ✓</text>
    <text x="530" y="235" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">+5</text>
    <line x1="44" y1="246" x2="566" y2="246" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

    <rect x="44" y="250" width="522" height="24" fill="#e6f4ea" rx="4" filter="url(#rough2)"/>
    <text x="58" y="267" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">5</text>
    <text x="106" y="267" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">4</text>
    <text x="190" y="267" fill="#3a5a30" filter="url(#rough2)">1（i=3）</text>
    <text x="300" y="267" fill="#3a5a30" filter="url(#rough2)">不存在</text>
    <text x="410" y="267" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">4 &gt; 1 ✓</text>
    <text x="530" y="267" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">+4</text>
  </g>

  <path d="M 300 288 L 300 302" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="40" y="306" width="530" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="54" y="324" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">总和 = 3 + 5 + 4 = 12</text>
  <text x="54" y="340" font-size="10" fill="#555" filter="url(#rough2)">示例 2：[2,1]，k=1 → i=0 满足（2 &gt; 1），i=1 不满足（1 &gt; 2 ✗），答案 2。</text>

  <text x="300" y="358" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">“严格大于”意味着等于也不行；邻居不存在时跳过该侧比较</text>
</svg>
