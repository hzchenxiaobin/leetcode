<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">排序去重 → 建立「值 → 序号」映射 → 回填</text>
  <text x="56" y="96" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">输入</text>
  <rect x="90" y="74" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118.0" y="98.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">40</text>
  <rect x="152" y="74" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180.0" y="98.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>
  <rect x="214" y="74" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242.0" y="98.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">20</text>
  <rect x="276" y="74" width="56" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304.0" y="98.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">30</text>
  <path d="M260,120 L260,148" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="56" y="176" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">排序去重</text>
  <rect x="90" y="154" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118.0" y="178.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>
  <text x="118.0" y="210" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">rank 1</text>
  <rect x="152" y="154" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180.0" y="178.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">20</text>
  <text x="180.0" y="210" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">rank 2</text>
  <rect x="214" y="154" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242.0" y="178.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">30</text>
  <text x="242.0" y="210" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">rank 3</text>
  <rect x="276" y="154" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304.0" y="178.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">40</text>
  <text x="304.0" y="210" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">rank 4</text>
  <path d="M260,226 L260,254" fill="none" stroke="#446688" stroke-width="1.7" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="56" y="282" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">输出</text>
  <rect x="90" y="260" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118.0" y="284.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="152" y="260" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180.0" y="284.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="214" y="260" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242.0" y="284.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="276" y="260" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304.0" y="284.9" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="60" y="316" width="400" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="72" y="334" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">重复元素共享同一序号；arr 为空时直接返回空数组。</text>
</svg>
