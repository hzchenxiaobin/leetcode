<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="27" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#r)">再平衡不变式：|L| == |R| 或 |L| == |R| + 1</text>
  <text x="340" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">每次操作后调用 rebalance：L 太长则尾端溢到 R 头；R 太长则头端溢到 L 尾</text>

  <!-- state A -->
  <g font-size="13" font-weight="bold" fill="#555" filter="url(#r)">
    <text x="170" y="96">pushBack 之后：|L|=2，|R|=3（违例）</text>
  </g>
  <g filter="url(#r)">
    <rect x="100" y="106" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="156" y="106" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="280" y="106" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="336" y="106" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="392" y="106" width="52" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="126" y="133" fill="#33517a">1</text>
    <text x="182" y="133" fill="#33517a">2</text>
    <text x="306" y="133" fill="#3a5c2c">3</text>
    <text x="362" y="133" fill="#3a5c2c">4</text>
    <text x="418" y="133" fill="#b85450">5</text>
  </g>
  <text x="208" y="162" text-anchor="middle" font-size="12" fill="#33517a" filter="url(#r)">L</text>
  <text x="362" y="162" text-anchor="middle" font-size="12" fill="#3a5c2c" filter="url(#r)">R</text>

  <!-- arrow -->
  <path d="M 265 196 L 265 232" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#r)"/>
  <text x="265" y="222" text-anchor="middle" font-size="0" fill="#3a3a3a"> </text>
  <text x="440" y="218" font-size="12.5" fill="#555" filter="url(#r)">rebalance：R 头 3 溢出到 L 尾</text>

  <!-- state B -->
  <g font-size="13" font-weight="bold" fill="#555" filter="url(#r)">
    <text x="170" y="262">恢复不变式：|L|=3，|R|=2 ✓</text>
  </g>
  <g filter="url(#r)">
    <rect x="100" y="272" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="156" y="272" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="212" y="272" width="52" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="336" y="272" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="392" y="272" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle" filter="url(#r)">
    <text x="126" y="299" fill="#33517a">1</text>
    <text x="182" y="299" fill="#33517a">2</text>
    <text x="238" y="299" fill="#a67c1e">3</text>
    <text x="362" y="299" fill="#3a5c2c">4</text>
    <text x="418" y="299" fill="#3a5c2c">5</text>
  </g>
  <text x="186" y="334" text-anchor="middle" font-size="12" fill="#33517a" filter="url(#r)">L（多了刚搬来的 3）</text>
  <text x="392" y="334" text-anchor="middle" font-size="12" fill="#3a5c2c" filter="url(#r)">R</text>
  <circle cx="238" cy="272" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#r)"/>
  <text x="500" y="299" font-size="12.5" fill="#a67c1e" filter="url(#r)">← 中点仍在 L 尾</text>

  <text x="340" y="376" text-anchor="middle" font-size="13" fill="#3a5c2c" filter="url(#r)">不变式一旦守住，六个操作全部是 O(1)：只需常数次队头/队尾搬运</text>
</svg>
