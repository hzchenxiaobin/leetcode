<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">斜走一步，两轴同时推进：最短时间 = max(dx, dy)</text>

  <!-- 网格：列 2..7，行 4..7（行 7 在上） -->
  <path d="M 60 90 H 324 M 60 134 H 324 M 60 178 H 324 M 60 222 H 324 M 60 266 H 324
           M 60 90 V 266 M 104 90 V 266 M 148 90 V 266 M 192 90 V 266 M 236 90 V 266 M 280 90 V 266 M 324 90 V 266"
        stroke="#c8c8c8" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- 起点终点 -->
  <rect x="60" y="222" width="44" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="82" y="249" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">S</text>
  <rect x="280" y="90" width="44" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="302" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">F</text>

  <!-- 最短路径：3 步斜走（绿）+ 2 步横走（橙） -->
  <path d="M 82 244 L 126 200" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 126 200 L 170 156" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 170 156 L 214 112" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 214 112 L 258 112" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 258 112 L 302 112" stroke="#d6a040" stroke-width="2.5" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- 坐标标签 -->
  <text x="82" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="126" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="170" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="214" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="258" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="302" y="284" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="46" y="116" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="46" y="160" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="46" y="204" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="46" y="248" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>

  <text x="192" y="308" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3 步斜走（绿）+ 2 步横走（橙）= 5 步到达</text>

  <!-- 右侧注记面板 -->
  <rect x="350" y="90" width="200" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="114" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">dx = |fx − sx| = 5</text>

  <rect x="350" y="138" width="200" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="162" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">dy = |fy − sy| = 3</text>

  <rect x="350" y="186" width="200" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#b27a10" filter="url(#rough2)">最短时间 = max = 5 秒</text>

  <rect x="350" y="240" width="200" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="266" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">每秒每轴至多 ±1</text>
  <text x="450" y="288" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">x 需 5 步、y 需 3 步</text>
  <text x="450" y="310" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">⇒ 至少 max(dx, dy) = 5 步</text>

  <!-- 底部结论 -->
  <rect x="110" y="336" width="340" height="38" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">这就是切比雪夫距离 —— 国际象棋『王』的步数</text>
</svg>
