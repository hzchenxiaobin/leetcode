<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="470" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：top-2 预处理 + 四候选 O(1) 重算</text>
  <path d="M 160 42 Q 340 50 520 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="60" width="300" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
  </g>
  <text x="210" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 变换（O(n)）</text>
  <text x="210" y="101" text-anchor="middle" font-size="11.5" fill="#333">uᵢ = xᵢ + yᵢ，vᵢ = xᵢ − yᵢ</text>

  <path d="M 210 116 L 210 138" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="142" width="300" height="66" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <text x="210" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">② 预处理 top-2（O(n)）</text>
  <text x="210" y="183" text-anchor="middle" font-size="11.5" fill="#333">u、v 各求（最大, 次大）与（最小, 次小）</text>
  <text x="210" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a">值 + 下标，共 8 个量</text>

  <path d="M 210 212 L 210 234" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="238" width="300" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
  </g>
  <text x="210" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">③ 候选集 C（至多 4 个点）</text>
  <text x="210" y="279" text-anchor="middle" font-size="11.5" fill="#333">i(max u)、i(min u)、i(max v)、i(min v)</text>

  <path d="M 210 294 L 210 316" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="320" width="300" height="66" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <text x="210" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">④ 枚举候选 i，O(1) 重算直径</text>
  <text x="210" y="361" text-anchor="middle" font-size="11.5" fill="#333">下标命中的极值 → 换用次值，其余不动</text>
  <text x="210" y="378" text-anchor="middle" font-size="11.5" fill="#7a5415">D′ = max(Δu′, Δv′)</text>

  <path d="M 210 390 L 210 412" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="60" y="416" width="300" height="44" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="210" y="443" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">⑤ 答案 = 候选中 D′ 的最小值</text>

  <g filter="url(#sk)">
    <rect x="400" y="60" width="250" height="148" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/>
  </g>
  <text x="525" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">为什么只需 4 个候选？</text>
  <text x="525" y="108" text-anchor="middle" font-size="11" fill="#333">删非极值点 → 四个极值</text>
  <text x="525" y="124" text-anchor="middle" font-size="11" fill="#333">都有别的点顶着 → 直径不变</text>
  <text x="525" y="148" text-anchor="middle" font-size="11" fill="#333">删任意点 → 点对变少</text>
  <text x="525" y="164" text-anchor="middle" font-size="11" fill="#333">→ 直径只减不增</text>
  <text x="525" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b03a3a">⇒ 最优删除点必在极值点中</text>

  <text x="525" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">top-2：删掉最大后，次大顶上</text>
  <g filter="url(#sk)">
    <path d="M415,300 L640,300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>
  </g>
  <g filter="url(#sk)">
    <circle cx="415" cy="300" r="4.5" fill="#446688"/>
    <circle cx="490" cy="300" r="4.5" fill="#446688"/>
    <circle cx="510" cy="300" r="4.5" fill="#446688"/>
    <circle cx="640" cy="300" r="4.5" fill="#b85450"/>
  </g>
  <text x="415" y="285" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b6e9e">最小 8</text>
  <text x="490" y="285" text-anchor="middle" font-size="10.5" fill="#4a7a3a">次小 12</text>
  <text x="510" y="322" text-anchor="middle" font-size="10.5" fill="#4a7a3a">次大 13</text>
  <text x="640" y="285" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b03a3a">最大 20</text>
  <g filter="url(#sk)">
    <path d="M640,296 C 620,272 560,268 522,288" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="415" y="345" width="230" height="60" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="530" y="368" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e6e2e">删「最大 20」所在的点后</text>
  <text x="530" y="388" text-anchor="middle" font-size="11.5" fill="#333">新最大 = 次大 = 13，其余极值不动</text>

  <text x="525" y="436" text-anchor="middle" font-size="10.5" fill="#888">（数轴上为例 1 的 u = x + y：13, 20, 12, 8）</text>
  <text x="525" y="455" text-anchor="middle" font-size="10.5" fill="#888">并列最值时次值 = 最值，天然正确</text>
</svg>
