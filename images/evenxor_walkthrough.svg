<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="470" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例 1 演算：最优路径 1—0—3，答案 7</text>
  <path d="M 140 38 Q 320 46 500 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- legend -->
  <g filter="url(#sk)">
    <circle cx="36" cy="58" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="120" cy="58" r="7" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="48" y="62" font-size="10" fill="#555">b=1 置位奇</text>
  <text x="132" y="62" font-size="10" fill="#555">b=0 置位偶</text>

  <!-- ===== tree ===== -->
  <!-- edges -->
  <g filter="url(#sk)">
    <path d="M 160 96 L 76 190" stroke="#999999" stroke-width="2" fill="none"/>
    <path d="M 160 96 L 160 190" stroke="#999999" stroke-width="2" fill="none"/>
    <path d="M 160 96 L 244 190" stroke="#999999" stroke-width="2" fill="none"/>
    <path d="M 244 190 L 244 278" stroke="#999999" stroke-width="2" fill="none"/>
  </g>
  <!-- winning path 1-0-3 highlight -->
  <g filter="url(#sk)">
    <path d="M 76 190 L 160 96 L 244 190" stroke="#4a7a3a" stroke-width="4.5" opacity="0.45" fill="none"/>
  </g>
  <!-- cost chips -->
  <g filter="url(#sk)">
    <rect x="108" y="134" width="20" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="170" y="134" width="20" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="196" y="134" width="20" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="254" y="225" width="20" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="118" y="147" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6415">4</text>
  <text x="180" y="147" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6415">6</text>
  <text x="206" y="147" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6415">3</text>
  <text x="264" y="238" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6415">5</text>
  <!-- nodes -->
  <g filter="url(#sk)">
    <circle cx="160" cy="96" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
    <circle cx="76" cy="190" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="160" cy="190" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="244" cy="190" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="244" cy="278" r="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2"/>
  </g>
  <text x="160" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">0</text>
  <text x="76" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">1</text>
  <text x="160" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">2</text>
  <text x="244" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">3</text>
  <text x="244" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">4</text>
  <!-- values -->
  <text x="128" y="100" text-anchor="end" font-size="10" fill="#666">值 3</text>
  <text x="76" y="228" text-anchor="middle" font-size="10" fill="#666">值 1</text>
  <text x="160" y="228" text-anchor="middle" font-size="10" fill="#666">值 7</text>
  <text x="244" y="228" text-anchor="middle" font-size="10" fill="#666">值 1</text>
  <text x="244" y="316" text-anchor="middle" font-size="10" fill="#666">值 3</text>
  <!-- g badges -->
  <text x="186" y="82" font-size="9.5" fill="#4a7a3a" font-weight="bold">g=0</text>
  <text x="98" y="174" font-size="9.5" fill="#4a7a3a" font-weight="bold">g=1</text>
  <text x="186" y="176" font-size="9.5" fill="#4a7a3a" font-weight="bold">g=1</text>
  <text x="270" y="176" font-size="9.5" fill="#4a7a3a" font-weight="bold">g=1</text>
  <text x="270" y="266" font-size="9.5" fill="#4a7a3a" font-weight="bold">g=1</text>

  <!-- answer tag -->
  <g filter="url(#sk)">
    <rect x="24" y="336" width="272" height="40" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="160" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">最优解：路径 1—0—3（绿高亮）</text>
  <text x="160" y="368" text-anchor="middle" font-size="10.5" fill="#2e6e2e">1 ⊕ 3 ⊕ 1 = 3 → 置位 2 个（偶）· 开销 4+3 = 7</text>

  <!-- ===== right: steps ===== -->
  <text x="316" y="68" font-size="11.5" font-weight="bold" fill="#555">b = [0, 1, 1, 1, 0]（红=奇，蓝=偶）</text>
  <text x="316" y="90" font-size="11.5" fill="#555">g = [0, 1, 1, 1, 1]（根到各点红点数的奇偶）</text>
  <text x="316" y="116" font-size="11.5" fill="#444">w=4（叶）：A[4] = [∞, 0]</text>
  <text x="316" y="136" font-size="11.5" fill="#444">w=3（b=1 异色）：并入 4 → a = [∞, 5]</text>
  <text x="328" y="154" font-size="11" fill="#888888">候选均为 ∞ → 无效；A[3] = [∞, 0]</text>
  <text x="316" y="178" font-size="11.5" fill="#444">w=1、w=2（叶）：A = [∞, 0]</text>
  <text x="316" y="198" font-size="11.5" fill="#444">w=0（b=0 同色）：cur = [0, ∞]</text>
  <text x="316" y="218" font-size="11.5" fill="#444">并入 1：a=[∞, 4]；候选 ∞ → cur=[0, 4]</text>
  <text x="316" y="238" font-size="11.5" fill="#444">并入 2：a=[∞, 6]；候选 4+6=10 = 路径(1,2)</text>
  <g filter="url(#sk)">
    <rect x="312" y="246" width="300" height="18" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="316" y="259" font-size="11.5" font-weight="bold" fill="#2e6e2e">并入 3：a=[∞, 3]；候选 4+3=7 = 路径(1,3)</text>

  <g filter="url(#sk)">
    <rect x="316" y="290" width="300" height="74" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="466" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">答案 ans = 7</text>
  <text x="466" y="330" text-anchor="middle" font-size="10.5" fill="#b85450">路径 1—0—3：1 ⊕ 3 ⊕ 1 = 3（置位 2 个·偶）</text>
  <text x="466" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">开销 4 + 3 = 7</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="24" y="396" width="592" height="44" rx="8" fill="#f4f0e6" stroke="#9a8a5a" stroke-width="1.3"/>
  </g>
  <text x="320" y="414" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#6a5a2a">口径：cur[色] = 已合并部分中该色点到 w 的最近距离；候选两端来自不同分支 ⇒ LCA 恰为 w</text>
  <text x="320" y="432" text-anchor="middle" font-size="10.5" fill="#6a5a2a">其余平衡路径开销均更大：(1,2)=10、(2,3)=9、(1,0,3,4)=12、(2,0,3,4)=14</text>
</svg>
