<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="113" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：一遍扫描取最大循环距离</text>
  <path d="M 190 40 Q 320 48 450 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="250" y="56" width="140" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="320.0" y="80.2" text-anchor="middle" font-size="12.5" fill="#2b4a66" font-weight="bold" filter="url(#sk)">ans = 0</text>
  <path d="M 320 94 L 320 106" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="250" y="108" width="140" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="320.0" y="132.2" text-anchor="middle" font-size="12.5" fill="#2b4a66" font-weight="bold" filter="url(#sk)">取下一个字符 c</text>
  <path d="M 320 146 L 320 158" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <polygon points="320,162 408,200 320,238 232,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="320" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5415" filter="url(#sk)">还有字符？</text>
  <text x="334" y="254" text-anchor="start" font-size="11.5" fill="#666" filter="url(#sk)">是</text>
  <path d="M 320 238 L 320 250" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="416" y="192" text-anchor="start" font-size="11.5" fill="#666" filter="url(#sk)">否</text>
  <path d="M 408 200 L 441 200" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="230" y="252" width="180" height="38" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="320.0" y="275.8" text-anchor="middle" font-size="11.5" fill="#2b4a66" font-weight="bold" filter="url(#sk)">d = (26 − (c−'a')) mod 26</text>
  <path d="M 320 290 L 320 302" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="230" y="304" width="180" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320.0" y="328.2" text-anchor="middle" font-size="12.5" fill="#2b4a66" font-weight="bold" filter="url(#sk)">ans = max(ans, d)</text>
  <g filter="url(#sk)">
    <rect x="445" y="178" width="120" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="505.0" y="205.2" text-anchor="middle" font-size="12.5" fill="#2e6e2e" font-weight="bold" filter="url(#sk)">返回 ans</text>
  <path d="M 230 323 L 140 323 L 140 127 L 244 127" stroke="#4a8edb" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="152" y="315" text-anchor="start" font-size="10.5" fill="#4a8edb" filter="url(#sk)">继续扫描</text>
  <g filter="url(#sk)">
    <rect x="40" y="360" width="285" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="182" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#sk)">易错：答案不是 Σneed</text>
  <text x="182" y="402" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#sk)">"yz"：2+1=3 ✗ · max(2,1)=2 ✓</text>
  <g filter="url(#sk)">
    <rect x="345" y="360" width="255" height="54" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/>
  </g>
  <text x="472" y="382" text-anchor="middle" font-size="11.5" fill="#2b4a66" filter="url(#sk)">'a' 的距离 = (26−0) mod 26 = 0</text>
  <text x="472" y="402" text-anchor="middle" font-size="11.5" fill="#2b4a66" filter="url(#sk)">漏掉 mod 26 会把 'a' 算成 26</text>
</svg>
