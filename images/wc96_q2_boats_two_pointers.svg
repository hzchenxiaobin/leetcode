<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="#fafafa"/>

  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">排序后：最重的人必定上船，再问「最轻的能不能陪他」</text>

  <!-- 排序数组 -->
  <text x="24" y="66" font-size="11" fill="#666" filter="url(#rough2)">people 升序</text>
  <rect x="110" y="50" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="76" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">1</text>
  <rect x="176" y="50" width="56" height="40" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="204" y="76" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">2</text>
  <rect x="242" y="50" width="56" height="40" fill="#ffffff" stroke="#9aa4b0" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="76" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">2</text>
  <rect x="308" y="50" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="76" text-anchor="middle" font-size="13" fill="#8d3b37" filter="url(#rough2)">3</text>
  <text x="138" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">lo</text>
  <text x="336" y="108" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">hi</text>

  <!-- 两条规则 -->
  <rect x="24" y="132" width="286" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="167" y="156" text-anchor="middle" font-size="12" fill="#33562a" filter="url(#rough2)">若 people[lo] + people[hi] ≤ limit</text>
  <text x="167" y="180" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">→ 两人同船，lo++、hi−−</text>
  <text x="167" y="204" text-anchor="middle" font-size="11" fill="#33562a" filter="url(#rough2)">（最重的能被最轻的「带走」，赚一条船）</text>

  <rect x="328" y="132" width="288" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="472" y="156" text-anchor="middle" font-size="12" fill="#8d3b37" filter="url(#rough2)">否则</text>
  <text x="472" y="180" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">→ people[hi] 独坐一条船，hi−−</text>
  <text x="472" y="204" text-anchor="middle" font-size="11" fill="#8d3b37" filter="url(#rough2)">（连最轻的都配不上他，只能单走）</text>

  <!-- 演算 -->
  <text x="24" y="262" font-size="12" fill="#333" filter="url(#rough2)">示例 2：people = [1,2,2,3]，limit = 3</text>
  <text x="24" y="288" font-size="11" fill="#555" filter="url(#rough2)">1+3 = 4 &gt; 3 → 3 单走（船 1）；</text>
  <text x="24" y="310" font-size="11" fill="#555" filter="url(#rough2)">1+2 = 3 ≤ 3 → 1 与 2 同船（船 2）；</text>
  <text x="24" y="332" font-size="11" fill="#555" filter="url(#rough2)">剩下 2 单走（船 3）⇒ 答案 3</text>

  <rect x="368" y="252" width="248" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="492" y="276" text-anchor="middle" font-size="12" fill="#8a6410" filter="url(#rough2)">每轮必消耗一个人（hi 必减）</text>
  <text x="492" y="300" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">所以船数 ≤ n，循环 O(n)</text>
  <text x="492" y="322" text-anchor="middle" font-size="11" fill="#8a6410" filter="url(#rough2)">加上排序，总复杂度 O(n log n)</text>
</svg>
