<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "abcd"，t = "abcde"</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">为便于阅读把 a..e 依次编码为 1..5（实际代码用 ASCII 码，相消规律完全相同）</text>

  <g filter="url(#rough2)" font-size="10.5" font-weight="bold" fill="#555" text-anchor="middle">
    <text x="90" y="76">扫描</text>
    <text x="175" y="76">字符</text>
    <text x="255" y="76">编码</text>
    <text x="375" y="76">ans 累积</text>
    <text x="480" y="76">说明</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="88" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="40" y="114" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="40" y="140" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="40" y="166" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="40" y="192" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="40" y="218" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="40" y="244" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="40" y="270" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="40" y="296" width="480" height="26" fill="#fff8e1" stroke="#b85450" stroke-width="2" rx="4"/>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle" fill="#333">
    <text x="90" y="106">s</text><text x="175" y="106">a</text><text x="255" y="106">1</text><text x="375" y="106">0 ⊕ 1 = 1</text><text x="480" y="106" fill="#777">—</text>
    <text x="90" y="132">s</text><text x="175" y="132">b</text><text x="255" y="132">2</text><text x="375" y="132">1 ⊕ 2 = 3</text><text x="480" y="132" fill="#777">—</text>
    <text x="90" y="158">s</text><text x="175" y="158">c</text><text x="255" y="158">3</text><text x="375" y="158">3 ⊕ 3 = 0</text><text x="480" y="158" fill="#777">暂态归零</text>
    <text x="90" y="184">s</text><text x="175" y="184">d</text><text x="255" y="184">4</text><text x="375" y="184">0 ⊕ 4 = 4</text><text x="480" y="184" fill="#777">第一段结束</text>
    <text x="90" y="210">t</text><text x="175" y="210">a</text><text x="255" y="210">1</text><text x="375" y="210">4 ⊕ 1 = 5</text><text x="480" y="210" fill="#777">—</text>
    <text x="90" y="236">t</text><text x="175" y="236">b</text><text x="255" y="236">2</text><text x="375" y="236">5 ⊕ 2 = 7</text><text x="480" y="236" fill="#777">—</text>
    <text x="90" y="262">t</text><text x="175" y="262">c</text><text x="255" y="262">3</text><text x="375" y="262">7 ⊕ 3 = 4</text><text x="480" y="262" fill="#777">—</text>
    <text x="90" y="288">t</text><text x="175" y="288">d</text><text x="255" y="288">4</text><text x="375" y="288">4 ⊕ 4 = 0</text><text x="480" y="288" fill="#777">成对消完</text>
    <text x="90" y="314" fill="#8a3a36">t</text><text x="175" y="314" fill="#8a3a36">e</text><text x="255" y="314" fill="#8a3a36">5</text><text x="375" y="314" font-weight="bold" fill="#8a3a36">0 ⊕ 5 = 5</text><text x="480" y="314" fill="#8a3a36">答案 'e'</text>
  </g>

  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">中间值 3、1、7 只是暂态，没有任何语义，最终必然坍缩成那个落单的编码</text>

  <rect x="60" y="354" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">把 5 按映射还原 ⇒ 'e'；这与示例输出 "e" 一致</text>
</svg>
