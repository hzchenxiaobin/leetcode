<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 344"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#666" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="344" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">座位布局：每排 4 座 = 两个独立的「靠窗 + 中间」对</text>
  <text x="260" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">A–B 相邻、D–C 相邻；两对之间、排与排之间互不影响</text>

  <path d="M 239 68 L 239 124" stroke="#ccc" stroke-width="1.4" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="239" y="140" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">过道</text>

  <rect x="78" y="62" width="140" height="64" rx="10" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <rect x="264" y="62" width="140" height="64" rx="10" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="148" y="140" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">相邻对 (A, B)</text>
  <text x="334" y="140" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">相邻对 (D, C)</text>

  <rect x="86" y="72" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="150" y="72" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="272" y="72" width="56" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="336" y="72" width="56" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="114" y="95" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">A</text>
  <text x="178" y="95" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">B</text>
  <text x="300" y="95" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">C</text>
  <text x="364" y="95" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">D</text>
  <text x="114" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">窗</text>
  <text x="178" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">中</text>
  <text x="300" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">中</text>
  <text x="364" y="110" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">窗</text>

  <path d="M 150 168 C 148 158, 152 140, 156 130" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 376 168 C 374 158, 370 140, 366 130" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="36" y="170" width="216" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="144" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">中间座 B / C</text>
  <text x="144" y="218" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">预订开销恒为 1 秒</text>

  <rect x="268" y="170" width="216" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="376" y="194" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">靠窗座 A / D</text>
  <text x="376" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">邻居空着 → 1 秒</text>
  <text x="376" y="231" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">邻居已订 → 3 秒（+2 延迟）</text>

  <rect x="36" y="262" width="448" height="68" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">开销在「预订瞬间」拍下快照</text>
  <text x="260" y="314" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">之后邻居再怎么变都不改，释放时按快照原样退回</text>
</svg>
