<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b03a3a"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：两次独立二分 → 各取段长 → 取 max</text>
  <g filter="url(#sk)"><path d="M 170 42 Q 320 50 470 42" stroke="#2b2b2b" stroke-width="1.5" fill="none"/></g>

  <!-- input -->
  <g filter="url(#sk)">
    <rect x="220" y="58" width="200" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="320" y="82" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">输入：升序数组 nums（长 n）</text>

  <!-- branch arrows -->
  <g filter="url(#sk)">
    <path d="M 320 98 C 320 118, 160 118, 160 138" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 320 98 C 320 118, 480 118, 480 138" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- two binary searches -->
  <g filter="url(#sk)">
    <rect x="60" y="140" width="200" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="160" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">l = lower_bound(0)</text>
  <text x="160" y="181" text-anchor="middle" font-size="10.5" fill="#666">首个 nums[i] ≥ 0 的下标</text>
  <g filter="url(#sk)">
    <rect x="380" y="140" width="200" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="480" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e">r = upper_bound(0)</text>
  <text x="480" y="181" text-anchor="middle" font-size="10.5" fill="#666">首个 nums[i] &gt; 0 的下标</text>

  <g filter="url(#sk)">
    <path d="M 160 194 L 160 220" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 480 194 L 480 220" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- counts -->
  <g filter="url(#sk)">
    <rect x="60" y="222" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="160" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">neg = l（负数段长）</text>
  <g filter="url(#sk)">
    <rect x="380" y="222" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="480" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">pos = n − r（正数段长）</text>

  <!-- merge -->
  <g filter="url(#sk)">
    <path d="M 160 266 C 160 288, 320 288, 320 300" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 480 266 C 480 288, 320 288, 320 300" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- decision diamond -->
  <g filter="url(#sk)">
    <polygon points="320,304 410,336 320,368 230,336" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="320" y="341" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3030">neg ≥ pos ?</text>

  <g filter="url(#sk)">
    <path d="M 230 336 L 136 336" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 410 336 L 504 336" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  </g>
  <text x="180" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3030">是</text>
  <text x="458" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3030">否</text>

  <g filter="url(#sk)">
    <rect x="28" y="318" width="104" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="80" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">返回 neg</text>
  <g filter="url(#sk)">
    <rect x="508" y="318" width="104" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="560" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">返回 pos</text>

  <!-- footnote -->
  <text x="320" y="408" text-anchor="middle" font-size="11" fill="#888">两次二分相互独立、先后无关；时间 O(log n)、空间 O(1)</text>
</svg>
