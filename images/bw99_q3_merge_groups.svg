<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">排序扫描：相交就并入当前组</text>

  <!-- 数轴 -->
  <path d="M 60 130 L 480 130" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="60" y="146" font-size="11" fill="#888">0</text>
    <text x="118" y="146" font-size="11" fill="#888">2</text>
    <text x="172" y="146" font-size="11" fill="#888">4</text>
    <text x="228" y="146" font-size="11" fill="#888">6</text>
    <text x="300" y="146" font-size="11" fill="#888">10</text>
    <text x="480" y="146" font-size="11" fill="#888">20</text>
  </g>

  <!-- 原始区间（乱序输入） -->
  <text x="66" y="72" font-size="12" fill="#666" filter="url(#rough2)">输入（乱序）：[1,3] [10,20] [2,5] [4,8]</text>
  <rect x="72" y="84" width="56" height="14" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="296" y="84" width="184" height="14" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="100" y="104" width="72" height="14" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="132" y="60" width="80" height="14" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 排序 + 合并后的两组 -->
  <text x="66" y="182" font-size="12" fill="#666" filter="url(#rough2)">排序后从左到右扫描，维护当前组右端 curEnd：</text>
  <g filter="url(#rough2)">
    <!-- 组1: [1,8] -->
    <rect x="64" y="200" width="160" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="144" y="218" text-anchor="middle" font-size="13" fill="#2f5527">第 1 组：[1,8]</text>
    <!-- 组2: [10,20] -->
    <rect x="288" y="200" width="192" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="384" y="218" text-anchor="middle" font-size="13" fill="#7a5a10">第 2 组：[10,20]</text>
  </g>
  <text x="66" y="254" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[2,5]、[4,8] 都与 [1,3] 链式相交 → 并成一组</text>
  <text x="66" y="274" font-size="12" fill="#d6a040" filter="url(#rough2)">[10,20] 的左端 10 &gt; curEnd=8 → 新开一组</text>

  <rect x="76" y="292" width="368" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="15" fill="#8c3a36" filter="url(#rough2)">g 个互不相交的组 → 每组独立二选一</text>
</svg>
