<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：操作让类型循环前移，成本只绑定在位置上</text>
  <path d="M 120 36 Q 320 44 520 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="62" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#sk)">位置成本 nums = [20, 1, 15]：花的钱只看「位置」，与位置上站的类型无关</text>

  <g filter="url(#sk)">
    <rect x="196" y="72" width="96" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="318" y="72" width="96" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="440" y="72" width="96" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="244" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">20</text>
  <text x="366" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e5e24" filter="url(#sk)">1</text>
  <text x="488" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">15</text>
  <text x="244" y="124" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">位置 0</text>
  <text x="366" y="124" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">位置 1</text>
  <text x="488" y="124" text-anchor="middle" font-size="10" fill="#999" filter="url(#sk)">位置 2</text>

  <text x="36" y="152" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">操作 k 次：类型 t 从初始位置 t 前移到 (t−k) mod n（跟踪绿色 T0）</text>

  <g filter="url(#sk)">
    <rect x="196" y="164" width="96" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="318" y="164" width="96" height="30" rx="5" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="440" y="164" width="96" height="30" rx="5" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="196" y="206" width="96" height="30" rx="5" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="318" y="206" width="96" height="30" rx="5" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="440" y="206" width="96" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="196" y="248" width="96" height="30" rx="5" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/>
    <rect x="318" y="248" width="96" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="440" y="248" width="96" height="30" rx="5" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="88" y="184" text-anchor="end" font-size="12.5" font-weight="bold" fill="#555" filter="url(#sk)">k = 0</text>
  <text x="88" y="226" text-anchor="end" font-size="12.5" font-weight="bold" fill="#555" filter="url(#sk)">k = 1</text>
  <text x="88" y="268" text-anchor="end" font-size="12.5" font-weight="bold" fill="#555" filter="url(#sk)">k = 2</text>
  <text x="244" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e24" filter="url(#sk)">T0</text>
  <text x="366" y="184" text-anchor="middle" font-size="12" fill="#999" filter="url(#sk)">T1</text>
  <text x="488" y="184" text-anchor="middle" font-size="12" fill="#999" filter="url(#sk)">T2</text>
  <text x="244" y="226" text-anchor="middle" font-size="12" fill="#999" filter="url(#sk)">T1</text>
  <text x="366" y="226" text-anchor="middle" font-size="12" fill="#999" filter="url(#sk)">T2</text>
  <text x="488" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e24" filter="url(#sk)">T0</text>
  <text x="244" y="268" text-anchor="middle" font-size="12" fill="#999" filter="url(#sk)">T2</text>
  <text x="366" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e24" filter="url(#sk)">T0</text>
  <text x="488" y="268" text-anchor="middle" font-size="12" fill="#999" filter="url(#sk)">T1</text>
  <g filter="url(#sk)">
    <path d="M 118 176 L 118 200" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
    <path d="M 118 218 L 118 244" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  </g>
  <text x="126" y="192" font-size="9.5" fill="#b85450" filter="url(#sk)">花一次 x</text>
  <text x="126" y="234" font-size="9.5" fill="#b85450" filter="url(#sk)">花一次 x</text>

  <text x="36" y="300" font-size="12" font-weight="bold" fill="#555" filter="url(#sk)">类型 T0 的可达位置每操作一步新增一个 → 在候选里取最小</text>
  <g filter="url(#sk)">
    <rect x="36" y="312" width="158" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="214" y="312" width="158" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="392" y="312" width="158" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="115" y="336" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">k = 0：位置 0</text>
  <text x="115" y="358" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#sk)">成本 20</text>
  <text x="293" y="336" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6415" filter="url(#sk)">k = 1：位置 2</text>
  <text x="293" y="358" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#sk)">成本 15</text>
  <text x="471" y="336" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2e5e24" filter="url(#sk)">k = 2：位置 1</text>
  <text x="471" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5e24" filter="url(#sk)">成本 1 ← 最小 ✔</text>
  <g filter="url(#sk)">
    <path d="M 194 344 L 210 344" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
    <path d="M 372 344 L 388 344" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#ar)"/>
  </g>

  <g filter="url(#sk)">
    <rect x="20" y="392" width="600" height="68" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="320" y="416" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a6e" filter="url(#sk)">固定总操作次数 k：每个类型 t 在 { (t−s) mod n : 0 ≤ s ≤ k } 里独立取 nums 最小</text>
  <text x="320" y="438" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">总成本 cost(k) = Σ 各类型最小 + k·x；便宜位置可复用：不同类型可在不同时刻各买一次</text>
</svg>
