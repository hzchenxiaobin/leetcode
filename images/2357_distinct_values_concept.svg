<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8edb"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="940" height="560" fill="#fdfcf7"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">核心观察：最少操作数 = 不同非零值的个数</text>
  <path d="M 280 44 Q 470 52 660 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Panel A: 数组按值分层 -->
  <text x="70" y="78" font-size="13" font-weight="bold" fill="#2b6e9e">① 相同的值共享同一次操作，按「值」分层</text>

  <text x="92" y="124" text-anchor="end" font-size="12" fill="#888" font-weight="bold">nums =</text>
  <g filter="url(#sk)"><rect x="105" y="96" width="72" height="44" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="141" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6e9e">1</text>
  <g filter="url(#sk)"><rect x="195" y="96" width="72" height="44" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="231" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">5</text>
  <g filter="url(#sk)"><rect x="285" y="96" width="72" height="44" rx="4" fill="#f0f0ee" stroke="#999" stroke-width="1.5"/></g>
  <text x="321" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#777">0</text>
  <g filter="url(#sk)"><rect x="375" y="96" width="72" height="44" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="411" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">3</text>
  <g filter="url(#sk)"><rect x="465" y="96" width="72" height="44" rx="4" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="501" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5415">5</text>
  <text x="141" y="158" text-anchor="middle" font-size="10" fill="#2b6e9e">值 1 层</text>
  <text x="231" y="158" text-anchor="middle" font-size="10" fill="#7a5415">值 5 层</text>
  <text x="321" y="158" text-anchor="middle" font-size="10" fill="#777">不参与操作</text>
  <text x="411" y="158" text-anchor="middle" font-size="10" fill="#2e6e2e">值 3 层</text>
  <text x="501" y="158" text-anchor="middle" font-size="10" fill="#7a5415">值 5 层</text>

  <!-- 分层塔 -->
  <path d="M 555 118 Q 585 118 590 118" stroke="#4a8edb" stroke-width="1.8" fill="none" marker-end="url(#arB)" filter="url(#sk)"/>
  <text x="612" y="86" font-size="12" font-weight="bold" fill="#2b2b2b">按值归并 → 只有 3 层</text>
  <g filter="url(#sk)"><rect x="612" y="94" width="210" height="38" rx="6" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/></g>
  <text x="632" y="119" font-size="12" font-weight="bold" fill="#7a5415">值 5 · ×2 个元素</text>
  <g filter="url(#sk)"><rect x="612" y="138" width="210" height="38" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="632" y="163" font-size="12" font-weight="bold" fill="#2e6e2e">值 3 · ×1 个元素</text>
  <g filter="url(#sk)"><rect x="612" y="182" width="210" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="632" y="207" font-size="12" font-weight="bold" fill="#2b6e9e">值 1 · ×1 个元素</text>
  <path d="M 830 101 Q 862 127 830 209" stroke="#b03a3a" stroke-width="2" fill="none" filter="url(#sk)"/>
  <text x="876" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">k = 3</text>
  <text x="876" y="178" text-anchor="middle" font-size="10" fill="#888">个不同非零值</text>

  <!-- Panel B: 集合演变 -->
  <text x="70" y="252" font-size="13" font-weight="bold" fill="#5a3a7a">② 每步操作后，不同非零值恰好减少一个</text>

  <g filter="url(#sk)"><rect x="80" y="268" width="150" height="42" rx="21" fill="#f4f0fa" stroke="#8a6ab5" stroke-width="1.6"/></g>
  <text x="155" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a3a7a">{1, 3, 5}</text>
  <path d="M 238 289 L 288 289" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="263" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#c98a2b">x=1</text>
  <g filter="url(#sk)"><rect x="296" y="268" width="120" height="42" rx="21" fill="#f4f0fa" stroke="#8a6ab5" stroke-width="1.6"/></g>
  <text x="356" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a3a7a">{2, 4}</text>
  <path d="M 424 289 L 474 289" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="449" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#c98a2b">x=2</text>
  <g filter="url(#sk)"><rect x="482" y="268" width="90" height="42" rx="21" fill="#f4f0fa" stroke="#8a6ab5" stroke-width="1.6"/></g>
  <text x="527" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a3a7a">{2}</text>
  <path d="M 580 289 L 630 289" stroke="#c98a2b" stroke-width="2" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>
  <text x="605" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#c98a2b">x=2</text>
  <g filter="url(#sk)"><rect x="638" y="268" width="90" height="42" rx="21" fill="#f0f0ee" stroke="#999" stroke-width="1.6"/></g>
  <text x="683" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#777">{ }</text>
  <g filter="url(#sk)"><rect x="752" y="262" width="118" height="54" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="811" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">3 步全零 ✓</text>
  <text x="811" y="302" text-anchor="middle" font-size="10" fill="#2e6e2e">层数 3→2→1→0</text>
  <text x="80" y="338" font-size="11" fill="#444">所有非零值减去同一个 x 后仍两两互异 → 只有恰好等于 x 的那一层被归零</text>

  <!-- 结论框 -->
  <g filter="url(#sk)"><rect x="60" y="360" width="820" height="176" rx="10" fill="#fffdf3" stroke="#999" stroke-width="1.3" stroke-dasharray="5 3"/></g>
  <text x="80" y="388" font-size="13" font-weight="bold" fill="#2b2b2b">为什么恰好是 k 步？</text>
  <text x="80" y="414" font-size="12" fill="#444">✗ 快不了：减同一个 x 保持互异性，一步至多消灭一个值层 ⇒ k 层至少 k 步（下界）</text>
  <text x="80" y="440" font-size="12" fill="#444">✓ 慢不了：每步取 x = 当前最小非零值，恰好削平一层 ⇒ k 步内全零（可达）</text>
  <text x="80" y="466" font-size="12" fill="#444">⇒ 最少操作数 = 不同非零值的个数 k</text>
  <g filter="url(#sk)"><rect x="80" y="482" width="780" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="470" y="507" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" font-family="monospace">答案 = len(set(nums) - {0})</text>
</svg>
