<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：乘积的符号只看「负数个数」与「零」</text>
  <path d="M 170 38 Q 320 46 470 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#666">nums ＝ [−1, −2, −3, −4, 3, 2, 1]，直接累乘时 |乘积| 可达 100¹⁰⁰⁰ ＝ 10²⁰⁰⁰</text>

  <text x="110" y="84" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="180" y="84" text-anchor="middle" font-size="11" fill="#999">1</text>
  <text x="250" y="84" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="320" y="84" text-anchor="middle" font-size="11" fill="#999">3</text>
  <text x="390" y="84" text-anchor="middle" font-size="11" fill="#999">4</text>
  <text x="460" y="84" text-anchor="middle" font-size="11" fill="#999">5</text>
  <text x="530" y="84" text-anchor="middle" font-size="11" fill="#999">6</text>

  <g filter="url(#sk)">
    <rect x="78" y="90" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="148" y="90" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="218" y="90" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="288" y="90" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="358" y="90" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="428" y="90" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="498" y="90" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="110" y="112" text-anchor="middle" font-size="14" fill="#333">−1</text>
  <text x="180" y="112" text-anchor="middle" font-size="14" fill="#333">−2</text>
  <text x="250" y="112" text-anchor="middle" font-size="14" fill="#333">−3</text>
  <text x="320" y="112" text-anchor="middle" font-size="14" fill="#333">−4</text>
  <text x="390" y="112" text-anchor="middle" font-size="14" fill="#333">3</text>
  <text x="460" y="112" text-anchor="middle" font-size="14" fill="#333">2</text>
  <text x="530" y="112" text-anchor="middle" font-size="14" fill="#333">1</text>

  <path d="M 80 134 Q 208 144 336 134" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <path d="M 360 134 Q 460 144 560 134" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="208" y="162" text-anchor="middle" font-size="12" fill="#8f3830" font-weight="bold">4 个负数：符号逐个翻转</text>
  <text x="460" y="162" text-anchor="middle" font-size="12" fill="#2e5a24" font-weight="bold">3 个正数：符号不变</text>

  <g filter="url(#sk)">
    <rect x="60" y="180" width="520" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="320" y="202" text-anchor="middle" font-size="12.5" fill="#8a6415" font-weight="bold">(−)×(−)＝(＋)，　(−)×(＋)＝(−)，　任何数 × 0 ＝ 0</text>
  <text x="320" y="220" text-anchor="middle" font-size="11.5" fill="#8a6415">符号只随符号变，与绝对值大小无关 → 巨大的乘积根本不必算出来</text>

  <g filter="url(#sk)">
    <rect x="30" y="240" width="290" height="90" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <rect x="330" y="240" width="280" height="90" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="175" y="264" text-anchor="middle" font-size="13" fill="#8f3830" font-weight="bold">① 一旦有 0 → 乘积必为 0</text>
  <text x="175" y="286" text-anchor="middle" font-size="11.5" fill="#8f3830">0 乘任何数都是 0</text>
  <text x="175" y="304" text-anchor="middle" font-size="11.5" fill="#8f3830">负数个数再多也救不回来</text>
  <text x="175" y="322" text-anchor="middle" font-size="11.5" fill="#8f3830">实现：遇 0 立即短路返回 0</text>
  <text x="470" y="264" text-anchor="middle" font-size="13" fill="#2e5a24" font-weight="bold">② 无 0 → 只看负数个数的奇偶</text>
  <text x="470" y="286" text-anchor="middle" font-size="11.5" fill="#2e5a24">正数不改变符号</text>
  <text x="470" y="304" text-anchor="middle" font-size="11.5" fill="#2e5a24">每乘一个负数，符号翻转一次</text>
  <text x="470" y="322" text-anchor="middle" font-size="11.5" fill="#2e5a24">偶数个负数 → ＋1，奇数个 → −1</text>

  <g filter="url(#sk)">
    <rect x="20" y="346" width="600" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="320" y="370" text-anchor="middle" font-size="13.5" fill="#33517a" font-weight="bold">signFunc(乘积) ＝ 0（含 0 时），否则 (−1)^k，k 为负数个数</text>
  <text x="320" y="392" text-anchor="middle" font-size="11.5" fill="#33517a">乘积高达 10²⁰⁰⁰ 会撑爆任何整型，但它的符号只需 O(1) 状态就能全程维护</text>
</svg>
