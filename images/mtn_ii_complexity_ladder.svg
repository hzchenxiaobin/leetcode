<svg xmlns="http://www.w3.org/2000/svg" width="640" height="404" viewBox="0 0 640 404" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="107" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="640" height="404" fill="#fdfcf7"/>
  <text x="320" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">数据范围倒推算法：n ≤ 10⁵ 把 O(n²) 关在门外</text>
  <path d="M 150 42 Q 320 52 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- O(n^3): red row -->
  <g filter="url(#sk)">
    <rect x="70" y="60" width="440" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <ellipse cx="552" cy="96" rx="22" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="290" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#a03a36" filter="url(#sk)">O(n³)：三重循环枚举所有三元组</text>
  <text x="290" y="114" text-anchor="middle" font-size="12.5" fill="#8a4a46" filter="url(#sk)">n = 10⁵ 时约 1.7×10¹⁴ 个 —— 天文数字</text>
  <text x="552" y="103" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" filter="url(#sk)">✗</text>

  <path d="M 290 136 L 290 160" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="302" y="154" font-size="11.5" fill="#666" filter="url(#sk)">固定山峰 j</text>

  <!-- O(n^2): orange row -->
  <g filter="url(#sk)">
    <rect x="70" y="164" width="440" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <ellipse cx="552" cy="200" rx="22" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="290" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#a06a10" filter="url(#sk)">O(n²)：每个山峰 j 左右各扫一遍</text>
  <text x="290" y="218" text-anchor="middle" font-size="12.5" fill="#8a6a2a" filter="url(#sk)">约 10¹⁰ 次比较 —— 依然超时</text>
  <text x="552" y="207" text-anchor="middle" font-size="17" font-weight="bold" fill="#b8862b" filter="url(#sk)">✗</text>

  <path d="M 290 240 L 290 264" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="302" y="258" font-size="11.5" fill="#666" filter="url(#sk)">前后缀分解（本文解法）</text>

  <!-- O(n): green row -->
  <g filter="url(#sk)">
    <rect x="70" y="268" width="440" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <ellipse cx="552" cy="304" rx="22" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="290" y="296" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">O(n)：后缀最小数组 + 滚动前缀最小</text>
  <text x="290" y="322" text-anchor="middle" font-size="12.5" fill="#4a6a42" filter="url(#sk)">约 2×10⁵ 次比较 —— 一瞬通过</text>
  <text x="552" y="311" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a7a2e" filter="url(#sk)">✓</text>

  <!-- rule-of-thumb note -->
  <g filter="url(#sk)">
    <rect x="70" y="352" width="508" height="42" rx="8" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="324" y="370" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">经验法则：1 秒约 10⁸ ~ 10⁹ 次运算 ⇒ n = 10⁵ 时 n² = 10¹⁰ 必挂</text>
  <text x="324" y="388" text-anchor="middle" font-size="12" fill="#2b6e9e" filter="url(#sk)">Q1（n ≤ 50）的 O(n³) 只有约 2×10⁴ 次所以能过 —— 同一份代码搬到 Q2 直接爆炸</text>
</svg>
