<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 344"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="38"/><feDisplacementMap in="SourceGraphic" scale="1.5"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/></marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/></marker>
  </defs>
  <rect width="620" height="344" fill="#fafafa"/>
  <text x="310.0" y="26.0" text-anchor="middle" font-size="15" fill="#444444" font-weight="bold" filter="url(#rough2)">按 r 排序分组：第一组冲突之后全部作废</text>
  <circle cx="55.7" cy="96.1" r="20.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="56.0" y="102.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="56.0" y="134.0" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">r=2</text>
  <circle cx="160.4" cy="95.9" r="20.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="160.0" y="102.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="160.0" y="134.0" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">r=2</text>
  <circle cx="264.0" cy="95.9" r="20.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="264.0" y="102.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="264.0" y="134.0" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">r=3</text>
  <circle cx="368.2" cy="96.1" r="20.0" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="368.0" y="102.0" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="368.0" y="134.0" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">r=3</text>
  <circle cx="472.1" cy="96.4" r="20.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="472.0" y="102.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="472.0" y="134.0" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">r=4</text>
  <path d="M 32.0 62.0 L 184.0 62.0" stroke="#446688" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="108.0" y="54.0" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">组 1（r=2）</text>
  <path d="M 240.0 62.0 L 392.0 62.0" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="316.0" y="54.0" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">组 2（r=3）</text>
  <text x="472.0" y="54.0" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">组 3（r=4）</text>
  <path d="M 264.0 154.0 L 368.0 154.0" stroke="#b85450" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="316.0" y="174.0" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">这组的 a 与已收标签重复</text>
  <text x="472.0" y="174.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">后续组一律不可能</text>
  <rect x="30.2" y="209.8" width="559.9" height="60.1" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310.0" y="235.0" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">组 1 标签 {a, b} 合法；组 2 要一次加入 {d, a}，但 a 已用过 ⇒ 整个正方形非法</text>
  <text x="310.0" y="253.0" text-anchor="middle" font-size="10.5" fill="#2f5226" filter="url(#rough2)">更小的 r 只能包含更少的点，而「包含」是以组为单位的，所以答案停在组 2 之前：2 个点</text>
  <text x="310.0" y="312.0" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">合法性关于 r 单调：一旦某 r 非法，所有更大的 r 都非法 ⇒ 只需扫到第一处冲突</text>
</svg>
