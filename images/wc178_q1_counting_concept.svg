<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：值域 0..100 极小 —— 频次桶 + 前缀和，查表代替两两比较</text>

  <!-- nums 行 -->
  <text x="62" y="74" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">nums</text>
  <rect x="150" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="74" text-anchor="middle" font-size="13" fill="#2a4a66" filter="url(#rough2)">8</text>
  <rect x="200" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="74" text-anchor="middle" font-size="13" fill="#2a4a66" filter="url(#rough2)">1</text>
  <rect x="250" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272" y="74" text-anchor="middle" font-size="13" fill="#2a4a66" filter="url(#rough2)">2</text>
  <rect x="300" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="74" text-anchor="middle" font-size="13" fill="#2a4a66" filter="url(#rough2)">2</text>
  <rect x="350" y="52" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="74" text-anchor="middle" font-size="13" fill="#2a4a66" filter="url(#rough2)">3</text>
  <text x="418" y="66" font-size="11" fill="#666" filter="url(#rough2)">n ≤ 500</text>
  <text x="418" y="82" font-size="11" fill="#666" filter="url(#rough2)">值域仅 101 种</text>

  <!-- 箭头 1 -->
  <path d="M330,92 C330,102 330,110 330,124" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="112" font-size="11" fill="#666" filter="url(#rough2)">遍历一遍 count[v]++，每个数落入自己的值桶</text>

  <!-- count 行 -->
  <text x="66" y="152" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">count</text>
  <text x="66" y="168" font-size="9.5" fill="#666" filter="url(#rough2)">值 v 的次数</text>

  <text x="168" y="139" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="209" y="139" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="250" y="139" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="291" y="139" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="332" y="139" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="373" y="139" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="414" y="139" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="455" y="139" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="496" y="139" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">8</text>

  <rect x="150" y="144" width="36" height="30" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="164" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="191" y="144" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="209" y="164" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="232" y="144" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="164" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">2</text>
  <rect x="273" y="144" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="291" y="164" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <rect x="314" y="144" width="36" height="30" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="332" y="164" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="355" y="144" width="36" height="30" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="373" y="164" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="396" y="144" width="36" height="30" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="414" y="164" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="437" y="144" width="36" height="30" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="455" y="164" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <rect x="478" y="144" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="496" y="164" text-anchor="middle" font-size="12" fill="#2d5a2d" filter="url(#rough2)">1</text>
  <text x="522" y="163" font-size="10" fill="#999" filter="url(#rough2)">⋯100</text>

  <!-- 箭头 2 -->
  <path d="M330,182 C330,192 330,200 330,212" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="202" font-size="11" fill="#666" filter="url(#rough2)">前缀和累加：smaller[v] = smaller[v−1] + count[v−1]</text>

  <!-- smaller 行 -->
  <text x="52" y="252" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">smaller</text>
  <text x="52" y="268" font-size="9.5" fill="#666" filter="url(#rough2)">严格小于 v</text>
  <text x="52" y="280" font-size="9.5" fill="#666" filter="url(#rough2)">的总个数</text>

  <text x="168" y="227" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="209" y="227" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="250" y="227" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="291" y="227" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="332" y="227" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="373" y="227" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="414" y="227" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="455" y="227" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="496" y="227" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">8</text>

  <rect x="150" y="232" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="252" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">0</text>
  <rect x="191" y="232" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="209" y="252" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">0</text>
  <rect x="232" y="232" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="250" y="252" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">1</text>
  <rect x="273" y="232" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="291" y="252" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">3</text>
  <rect x="314" y="232" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="332" y="252" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">4</text>
  <rect x="355" y="232" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373" y="252" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">4</text>
  <rect x="396" y="232" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="252" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">4</text>
  <rect x="437" y="232" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="252" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">4</text>
  <rect x="478" y="232" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="496" y="252" text-anchor="middle" font-size="12" fill="#2a4a66" filter="url(#rough2)">4</text>
  <text x="522" y="251" font-size="10" fill="#999" filter="url(#rough2)">⋯</text>

  <!-- 等价框 -->
  <rect x="60" y="286" width="440" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">「比 nums[i] 小的元素个数」= smaller[nums[i]]</text>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">= count[0] + ⋯ + count[nums[i]−1]，查一次表 O(1)</text>

  <!-- 结论框 -->
  <rect x="60" y="354" width="440" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="377" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">两两比较 O(n²) → 频次 + 前缀和 + 查表 O(n + k)，k = 101</text>
  <text x="280" y="399" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">橙色描边 = 将被查询的格子（nums 里的值 1,2,3,8），相同的值共享一次计算</text>
</svg>
