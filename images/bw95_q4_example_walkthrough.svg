<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="45"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1：stations=[1,2,4,5,0], r=1, k=2</text>

  <!-- 初始电量 -->
  <text x="70" y="62" font-size="13" fill="#666" filter="url(#rough2)">初始电量 power = [3, 7, 11, 9, 5]（前缀和窗口求出）</text>
  <g filter="url(#rough2)">
    <rect x="70" y="74" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="118" y="74" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="166" y="74" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="214" y="74" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="262" y="74" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333" text-anchor="middle">
    <text x="92" y="94">3</text><text x="140" y="94">7</text><text x="188" y="94">11</text>
    <text x="236" y="94">9</text><text x="284" y="94">5</text>
  </g>
  <text x="330" y="94" font-size="11.5" fill="#666" filter="url(#rough2)">二分区间 [0, hi=13]</text>

  <!-- 二分过程表 -->
  <g filter="url(#rough2)" font-size="12" fill="#666">
    <text x="70" y="140">二分轨迹：</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="160" y="126" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="228" y="126" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="296" y="126" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="364" y="126" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="432" y="126" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="190" y="145" fill="#b85450">m=7 ✗</text>
    <text x="258" y="145" fill="#2d5a22">m=3 ✓</text>
    <text x="326" y="145" fill="#2d5a22">m=5 ✓</text>
    <text x="394" y="145" fill="#b85450">m=6 ✗</text>
    <text x="462" y="145" fill="#7a5c1e">ans=5</text>
  </g>
  <text x="70" y="176" font-size="11.5" fill="#666" filter="url(#rough2)">m=7：城市 0 缺 4 &gt; k=2，立刻失败；m=3：无缺口，白过</text>

  <!-- check(5) 演算 -->
  <text x="70" y="212" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">check(5) 逐步：</text>
  <g filter="url(#rough2)">
    <rect x="70" y="226" width="380" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="80" y="247">i=0：3 &lt; 5 → 缺 t=2，放 2 座在 p=min(0+1,4)=1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="70" y="264" width="380" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="80" y="285">i=1,2：7+2、11+2 ≥ 5，白过；p+r+1=3 处挂 expire −2</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="70" y="302" width="380" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <text x="80" y="323">i=3：9 ≥ 5 白过（此时 cover 已被差分扣回 0）；i=4：5 ≥ 5 白过</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="70" y="340" width="380" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g filter="url(#rough2)" font-size="12" fill="#2d5a22">
    <text x="80" y="361">need = 2 ≤ k = 2 → check(5) 成功</text>
  </g>

  <rect x="70" y="386" width="440" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="404" text-anchor="middle" font-size="12.5" fill="#7a5c1e" filter="url(#rough2)">贪心放置 = “2 座新站都建在城市 1”，与官方解释完全一致</text>
</svg>
