<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">核心观察：合法串 = 字母与数字严格交替</text>
  <path d="M 180 36 Q 320 44 460 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="58" y="79" text-anchor="middle" font-size="11" fill="#666">合法重排</text>
  <g filter="url(#sk)">
    <rect x="110" y="58" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="146" y="58" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="182" y="58" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="218" y="58" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="254" y="58" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="290" y="58" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="326" y="58" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="362" y="58" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="398" y="58" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="127" y="80" text-anchor="middle" font-size="13" fill="#333">c</text>
  <text x="163" y="80" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="199" y="80" text-anchor="middle" font-size="13" fill="#333">o</text>
  <text x="235" y="80" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="271" y="80" text-anchor="middle" font-size="13" fill="#333">v</text>
  <text x="307" y="80" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="343" y="80" text-anchor="middle" font-size="13" fill="#333">i</text>
  <text x="379" y="80" text-anchor="middle" font-size="13" fill="#333">9</text>
  <text x="415" y="80" text-anchor="middle" font-size="13" fill="#333">d</text>
  <text x="127" y="106" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="163" y="106" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="199" y="106" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="235" y="106" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="271" y="106" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="307" y="106" text-anchor="middle" font-size="10" fill="#999">5</text>
  <text x="343" y="106" text-anchor="middle" font-size="10" fill="#999">6</text>
  <text x="379" y="106" text-anchor="middle" font-size="10" fill="#999">7</text>
  <text x="415" y="106" text-anchor="middle" font-size="10" fill="#999">8</text>
  <text x="452" y="72" text-anchor="start" font-size="11.5" fill="#2b4a6e">偶数位 → 字母</text>
  <text x="452" y="92" text-anchor="start" font-size="11.5" fill="#2e5a24">奇数位 → 数字</text>

  <text x="320" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b">长度 n 的串：偶数位槽 ⌈n/2⌉ 个，奇数位槽 ⌊n/2⌋ 个</text>
  <text x="320" y="170" text-anchor="middle" font-size="12" fill="#555">相邻类型不同 → 类型逐位交替 → 同类字符只能挤进同一组槽位</text>

  <text x="188" y="225" text-anchor="end" font-size="11" fill="#666">形态一</text>
  <text x="188" y="261" text-anchor="end" font-size="11" fill="#666">形态二</text>
  <g filter="url(#sk)">
    <rect x="200" y="206" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="232" y="206" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="264" y="206" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="296" y="206" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="328" y="206" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="360" y="206" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="200" y="242" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="232" y="242" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="264" y="242" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="296" y="242" width="30" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="328" y="242" width="30" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="215" y="226" text-anchor="middle" font-size="12" fill="#2b4a6e">A</text>
  <text x="247" y="226" text-anchor="middle" font-size="12" fill="#2e5a24">B</text>
  <text x="279" y="226" text-anchor="middle" font-size="12" fill="#2b4a6e">A</text>
  <text x="311" y="226" text-anchor="middle" font-size="12" fill="#2e5a24">B</text>
  <text x="343" y="226" text-anchor="middle" font-size="12" fill="#2b4a6e">A</text>
  <text x="375" y="226" text-anchor="middle" font-size="12" fill="#2e5a24">B</text>
  <text x="215" y="262" text-anchor="middle" font-size="12" fill="#2b4a6e">A</text>
  <text x="247" y="262" text-anchor="middle" font-size="12" fill="#2e5a24">B</text>
  <text x="279" y="262" text-anchor="middle" font-size="12" fill="#2b4a6e">A</text>
  <text x="311" y="262" text-anchor="middle" font-size="12" fill="#2e5a24">B</text>
  <text x="343" y="262" text-anchor="middle" font-size="12" fill="#2b4a6e">A</text>
  <text x="402" y="226" text-anchor="start" font-size="12" fill="#333">n = 2m：两类各 m 个，差 0</text>
  <text x="402" y="262" text-anchor="start" font-size="12" fill="#333">n = 2m+1：开头类恰多 1 个</text>

  <g filter="url(#sk)">
    <rect x="40" y="278" width="560" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="320" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3830">反之 |cL − cD| ≥ 2：多的一类塞不进 ⌈n/2⌉ 个槽位</text>
  <text x="320" y="324" text-anchor="middle" font-size="12" fill="#8f3830">例 "aabb12"：4 个字母 &gt; 3 个偶数位槽 → 必有两个字母相邻 ✗</text>

  <g filter="url(#sk)">
    <rect x="40" y="346" width="560" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="320" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a24">结论：|cL − cD| ≤ 1 时有解（差 0 或差 1）</text>
  <text x="320" y="386" text-anchor="middle" font-size="12" fill="#2e5a24">构造：多的一类占偶数位（0 号位开头），两类逐位交错 ✓</text>
</svg>
