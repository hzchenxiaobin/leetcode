<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#444" font-weight="bold">站点 – 线路 二分图：BFS 层数 = 乘车次数</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888">换乘一条线路 = 多坐一辆车 = 层数 +1；同一条线路内的站点彼此「零成本」</text>

  <g filter="url(#rough2)">
    <line x1="105" y1="160" x2="235" y2="140" stroke="#8a8a8a" stroke-width="1.3"/>
    <line x1="105" y1="250" x2="235" y2="152" stroke="#8a8a8a" stroke-width="1.3"/>
    <line x1="105" y1="340" x2="235" y2="160" stroke="#8a8a8a" stroke-width="1.3"/>
    <line x1="105" y1="340" x2="235" y2="300" stroke="#8a8a8a" stroke-width="1.3"/>
    <line x1="435" y1="270" x2="545" y2="250" stroke="#8a8a8a" stroke-width="1.3"/>
    <line x1="435" y1="295" x2="545" y2="340" stroke="#8a8a8a" stroke-width="1.3"/>
  </g>

  <g filter="url(#rough2)">
    <circle cx="85" cy="160" r="21" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="85" y="166" text-anchor="middle" font-size="14" fill="#8a3a36">1</text>
    <circle cx="85" cy="250" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="85" y="256" text-anchor="middle" font-size="14" fill="#3a5a30">2</text>
    <circle cx="85" cy="340" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="85" y="346" text-anchor="middle" font-size="14" fill="#3a4a66">7</text>
    <circle cx="565" cy="250" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="565" y="256" text-anchor="middle" font-size="14" fill="#3a5a30">3</text>
    <circle cx="565" cy="340" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="565" y="346" text-anchor="middle" font-size="14" fill="#8a6a20">6</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="235" y="112" width="200" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="335" y="134" text-anchor="middle" font-size="12" fill="#3a4a66">线路 0：1 → 2 → 7</text>
    <text x="335" y="152" text-anchor="middle" font-size="10" fill="#6a7a96">上车 +1 辆</text>
    <rect x="235" y="248" width="200" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="335" y="270" text-anchor="middle" font-size="12" fill="#3a4a66">线路 1：3 → 6 → 7</text>
    <text x="335" y="288" text-anchor="middle" font-size="10" fill="#6a7a96">上车 +1 辆</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#777">
    <text x="85" y="200" text-anchor="middle">起点 · 0 辆</text>
    <text x="85" y="290" text-anchor="middle">1 辆</text>
    <text x="85" y="378" text-anchor="middle">1 辆</text>
    <text x="565" y="290" text-anchor="middle">2 辆</text>
    <text x="565" y="378" text-anchor="middle">终点 · 2 辆</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#666">
    <circle cx="70" cy="402" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="84" y="406">圆 = 公交站点</text>
    <rect x="200" y="394" width="24" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="232" y="406">矩形 = 公交线路</text>
    <text x="392" y="406">边 = 「该线路经过该站」</text>
  </g>

  <g filter="url(#rough2)">
    <text x="180" y="340" font-size="10.5" fill="#8a6a20">★ 换乘点：两条线路都停靠 7</text>
    <path d="M 174 336 L 112 340" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  </g>
</svg>
