<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="800" height="480" fill="#fafafa"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">单次询问的 O(1) 流程</text>
  <path d="M 258 42 Q 400 49 542 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="400" y="62" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">预处理两个前缀和数组，之后每个询问只做常数次加减与取整</text>

  <rect x="330" y="82" width="140" height="40" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="107" text-anchor="middle" font-size="13.5" fill="#2f4a66" filter="url(#rough2)">询问 (l, r)</text>
  <path d="M 400 122 L 400 144" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="164" y="148" width="472" height="56" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="400" y="170" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">m = r − l + 1，z = 区间里 0 的个数，o = m − z</text>
  <text x="400" y="191" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">tr = 区间内部 01 交界数 + [s_l ≠ s_r]（环上多一条边）</text>
  <path d="M 400 204 L 400 224" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="400,228 476,262 400,296 324,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="400" y="267" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">tr = 0 ?</text>

  <path d="M 324 262 L 240 262 L 240 292" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="286" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 476 262 L 560 262 L 560 292" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="514" y="254" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="96" y="296" width="288" height="66" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="320" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">整段只有一种字符（k = 0）</text>
  <text x="240" y="343" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">p = max(1, ⌈m/2⌉)</text>

  <rect x="416" y="296" width="288" height="66" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="560" y="316" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">k = tr / 2（每种字符的段数）</text>
  <text x="560" y="336" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">p = max(k, ⌈z/2⌉, ⌈o/2⌉,</text>
  <text x="560" y="354" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">⌈(m − k)/3⌉)</text>

  <path d="M 240 362 L 240 388 L 392 388" stroke="#4a7a3a" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <path d="M 560 362 L 560 388 L 408 388" stroke="#b85450" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <path d="M 400 388 L 400 408" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="312" y="412" width="176" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="439" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输出 4p − m</text>

  <text x="400" y="472" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">预处理 O(n)，每个询问 O(1)，总复杂度 O(n + q)</text>
</svg>
