<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <rect width="640" height="530" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：双指针收拢 + 算术拼接</text>
  <path d="M 130 40 Q 320 48 510 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk)">
    <ellipse cx="200" cy="66" rx="42" ry="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="200" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a22">开始</text>
  <path d="M 200 85 L 200 95" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>

  <!-- init -->
  <g filter="url(#sk)">
    <rect x="90" y="99" width="220" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="200" y="121" text-anchor="middle" font-size="12.5" fill="#2b4a6b" font-weight="bold">i = 0，j = n−1，ans = 0</text>
  <path d="M 200 133 L 200 146" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>

  <!-- diamond 1: i < j ? -->
  <g filter="url(#sk)">
    <polygon points="200,150 265,180 200,210 135,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="200" y="185" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6415">i &lt; j ?</text>
  <path d="M 200 210 L 200 244" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="208" y="232" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>

  <!-- digits box -->
  <g filter="url(#sk)">
    <rect x="40" y="248" width="320" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="200" y="269" text-anchor="middle" font-size="12" fill="#2b4a6b" font-weight="bold">求位数：p = 1，t = nums[j]</text>
  <text x="200" y="288" text-anchor="middle" font-size="12" fill="#2b4a6b">while t &gt; 0：p ×= 10，t ÷= 10</text>
  <path d="M 200 300 L 200 322" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>

  <!-- accumulate box -->
  <g filter="url(#sk)">
    <rect x="40" y="326" width="320" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="200" y="347" text-anchor="middle" font-size="12" fill="#2b4a6b" font-weight="bold">ans += nums[i]×p + nums[j]</text>
  <text x="200" y="366" text-anchor="middle" font-size="12" fill="#2b4a6b">i += 1，j -= 1（向中间收拢）</text>

  <!-- loop back to diamond 1 -->
  <path d="M 40 352 L 24 352 L 24 180 L 131 180" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="58" y="174" font-size="10.5" fill="#7a7a7a">循环下一对</text>

  <!-- no branch of diamond 1 -->
  <path d="M 265 180 L 470 180 L 470 230" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="350" y="172" font-size="12" font-weight="bold" fill="#b85450">否</text>

  <!-- diamond 2: i == j ? -->
  <g filter="url(#sk)">
    <polygon points="470,234 540,264 470,294 400,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="470" y="269" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6415">i == j ?</text>
  <path d="M 470 294 L 470 322" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="478" y="312" font-size="12" font-weight="bold" fill="#4a7a3a">是</text>

  <!-- single element box -->
  <g filter="url(#sk)">
    <rect x="380" y="326" width="180" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="470" y="349" text-anchor="middle" font-size="12" fill="#8a3430" font-weight="bold">ans += nums[i]（单元素）</text>
  <path d="M 470 362 L 470 398" stroke="#7a7a7a" stroke-width="1.6" marker-end="url(#ag)" filter="url(#sk)"/>

  <!-- no branch of diamond 2 -->
  <path d="M 540 264 L 592 264 L 592 420 L 574 420" stroke="#7a7a7a" stroke-width="1.6" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="560" y="256" font-size="12" font-weight="bold" fill="#b85450">否</text>

  <!-- return -->
  <g filter="url(#sk)">
    <ellipse cx="470" cy="420" rx="102" ry="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="470" y="425" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e5a22">返回 ans（long long）</text>

  <!-- warning notes -->
  <g filter="url(#sk)">
    <rect x="46" y="452" width="314" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="203" y="471" text-anchor="middle" font-size="10.5" fill="#8a6415">⚠ 求位数连除 10，别用 log10（b=10ᵏ 时浮点误差）</text>
  <g filter="url(#sk)">
    <rect x="46" y="486" width="314" height="28" rx="8" fill="#fdfcfc" stroke="#b0b0b0" stroke-width="1"/>
  </g>
  <text x="203" y="504" text-anchor="middle" font-size="10.5" fill="#888">⚠ p 由尾部 b 的位数决定，别错用 a 的</text>
</svg>
