<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">霍纳法则：从最高位开始「乘 2 加当前位」</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#888">只需一次遍历，不必先求链表长度</text>

  <text x="110" y="76" text-anchor="middle" font-size="10" fill="#446688">head（最高位）</text>

  <g filter="url(#rough2)">
    <rect x="82" y="86" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="110" y="117" text-anchor="middle" font-size="18" fill="#2f4463">1</text>
    <rect x="222" y="86" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="250" y="117" text-anchor="middle" font-size="18" fill="#2f4463">0</text>
    <rect x="362" y="86" width="56" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="390" y="117" text-anchor="middle" font-size="18" fill="#2f4463">1</text>
  </g>

  <path d="M 140 110 L 214 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 110 L 354 110" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 110 L 470 110" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="114" font-size="10" fill="#999">null</text>

  <g filter="url(#rough2)" font-size="10" fill="#b07a20" text-anchor="middle">
    <text x="110" y="154">ans = 1</text>
    <text x="250" y="154">ans = 2</text>
    <text x="390" y="154">ans = 5</text>
  </g>

  <rect x="50" y="176" width="460" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="68" y="202" font-size="13" fill="#8a6a20" font-weight="bold">ans ← ans × 2 + v</text>
  <text x="68" y="228" font-size="11" fill="#555">(101)₂ = ((1 × 2 + 0) × 2 + 1) = (5)₁₀</text>
  <text x="68" y="250" font-size="10.5" fill="#666">第 k 步只依赖「前 k−1 位的结果」，与后面还没读的位无关</text>

  <path d="M 280 268 L 280 292" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="298" width="420" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="88" y="320" font-size="11" fill="#3a5a30" font-weight="bold">为什么不再需要「长度」</text>
  <text x="88" y="342" font-size="10.5" fill="#555">逐位累加把「权值 2^(n−1−k)」隐式地交给每次乘 2 完成</text>
  <text x="88" y="362" font-size="10.5" fill="#555">状态只有一个整数 ans，空间 O(1)</text>

  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#999">示例 head = [1,0,1]：ans 依次为 1 → 2 → 5</text>
</svg>
